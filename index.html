}

function amberResearchTradeBonus() {
  return (G.techs.fault_exchange ? (TECHS.fault_exchange.effects?.trade_mult || 0) : 0);
}

function celestialResearchSkyMult() {
  let mult = 1;
  if (G.techs.beacon_attunement) mult *= 1 + (TECHS.beacon_attunement.effects?.sky_mult || 0);
  if (G.techs.astral_cartography) mult *= 1 + (TECHS.astral_cartography.effects?.sky_mult || 0);
  return mult;
}

function celestialResearchNavigatorMult() {
  let mult = 1;
  if (G.techs.beacon_attunement) mult *= 1 + (TECHS.beacon_attunement.effects?.navigator_mult || 0);
  if (G.techs.astral_cartography) mult *= 1 + (TECHS.astral_cartography.effects?.navigator_mult || 0);
  return mult;
}

function celestialResearchLaunchBonus() {
  return (G.techs.astral_cartography ? (TECHS.astral_cartography.effects?.launch_bonus || 0) : 0);
}

function storageMetaMult() {
  let mult = 1 + (G.meta.launches || 0) * 0.03 + legacyRank('amber_reserve') * 0.15 + milestoneRunStorageBonus() + amberResearchStorageBonus() + projectStorageBonus();
  if (capstoneOwned('amber_monolith')) mult += 0.35;
  return mult;
}

function productionMetaMult() {
  return 1 + (G.meta.launches || 0) * 0.05 + legacyRank('fungal_memory') * 0.12 + milestoneRunProdBonus() + projectProductionBonus() + colonyProjectBonus('global_prod');
}

function gatherPower() {
  let power = 1.5 + (G.meta.launches || 0) * 0.1 + legacyRank('amber_reserve') * 0.2 + milestoneRunGatherBonus() + amberResearchGatherBonus() + projectGatherBonus();
  if (capstoneOwned('amber_monolith')) power += 0.8;
  return power;
}

function startingBugsFromMeta(meta) {
  return legacyRank('brood_ritual', meta) + Math.floor((meta.launches || 0) / 2) + (legacyRank('swarm_sovereignty', meta) > 0 ? 2 : 0);
}

function hatchLegacyMult() {
  return (1 + legacyRank('queen_blessing') * 0.25 + milestoneRunHatchBonus() + projectHatchBonus()) * (capstoneOwned('swarm_sovereignty') ? 1.5 : 1) * swarmResearchHatchMult();
}

function upkeepLegacyMult() {
  const extra = capstoneOwned('swarm_sovereignty') ? 0.10 : 0;
  return Math.max(0.38, 1 - legacyRank('queen_blessing') * 0.05 - extra - milestoneRunUpkeepBonus() - swarmResearchUpkeepReduction());
}

function tradeLegacyMult() {
  return 1 + legacyRank('trade_pacts') * 0.12 + milestoneRunTradeBonus() + amberResearchTradeBonus() + projectTradeBonus() + colonyProjectBonus('trade_bonus');
}

function skyLegacyMult() {
  let mult = 1 + legacyRank('sky_legacy') * 0.2 + milestoneSkyBonus() + projectSkyBonus();
  if (capstoneOwned('celestial_throne')) mult += 0.45;
  return mult * celestialResearchSkyMult();
}

function maxRes(res) {
  const def = RES[res];
  if (!def) return 0;
  let max = def.base_max;
  max = Math.floor(max * storageMetaMult());
  const cacheStorage = (G.bldgs.leaf_cache || 0) * (BLDGS.leaf_cache.effects.storage_mult || 0);
  const amberStorage = (G.bldgs.amber_vault || 0) * (buildingEffects('amber_vault').storage_mult || 0);
  max = Math.floor(max * (1 + cacheStorage + amberStorage));
  if (res === 'insight') {
    max += (G.bldgs.chrysalis_chamber || 0) * (BLDGS.chrysalis_chamber.effects.insight_max || 0);
  }
  return max;
}

function housing() {
  let h = 0;
  for (const [bid, n] of Object.entries(G.bldgs)) {
    if (BLDGS[bid] && BLDGS[bid].effects.housing) h += n * BLDGS[bid].effects.housing;
  }
  return h;
}

function employed() {
  return Object.values(G.jobs).reduce((a, b) => a + b, 0);
}

function bugsOnExpedition() {
  return (G.expeditions || []).reduce((sum, e) => sum + (e.bugs || 0), 0);
}

function fightersTotal() {
  return (G.fighters || []).length;
}

function maxFighters() {
  return (G.bldgs.training_burrow || 0) * (BLDGS.training_burrow.effects.fighter_slots || 3);
}

function idleFighterCount() {
  return (G.fighters || []).filter(f => f.status === 'idle').length;
}

function idle() {
  return Math.max(0, G.pop.total - employed() - bugsOnExpedition() - fightersTotal() - outpostWorkers());
}

function bldgCost(bid) {
  const def = BLDGS[bid];
  const n = G.bldgs[bid] || 0;
  const out = {};
  for (const [r, base] of Object.entries(def.base_cost)) {
    out[r] = Math.ceil(base * Math.pow(def.cost_mult, n));
  }
  return out;
}

function canAfford(cost) {
  return Object.entries(cost).every(([r, a]) => (G.res[r] || 0) >= a);
}

function canAffordBldg(bid) {
  return canAfford(bldgCost(bid));
}

function canAffordTech(tid) {
  const def = TECHS[tid];
  if (!def || !techVisible(def) || !techReqsMet(def) || !techStageReady(def)) return false;
  return canAfford(def.cost);
}

function craftDisc() {
  return 1 - Math.min(0.5, (G.bldgs.web_workshop || 0) * (BLDGS.web_workshop.effects.craft_disc || 0));
}

function tradeMult() {
  return (1 + (G.bldgs.flight_tower || 0) * (BLDGS.flight_tower.effects.trade_mult || 0)) * tradeLegacyMult();
}


function hatchRate() {
  if (housing() <= G.pop.total) return 0;
  if (G.res.honeydew < 8) return 0;
  const gap = housing() - G.pop.total;
  const base = G.pop.total === 0 ? 0.03 : 0.006;
  const foodMult = Math.min(2.2, 0.75 + (G.res.honeydew / Math.max(1, maxRes('honeydew'))) * 2.2);
  const nurseMult = 1 + (G.jobs.nurse || 0) * 0.04 * jobLineageMult('nurse');
  const nurseryMult = 1 + (G.bldgs.brood_nursery || 0) * (buildingEffects('brood_nursery').hatch_mult || 0);
  const eventMult = G.events.active === 'brood_surge' ? 1.8 : 1;
  return base * gap * foodMult * hatchLegacyMult() * nurseMult * nurseryMult * eventMult;
}

function computeRates() {
  const r = Object.fromEntries(Object.keys(G.res).map(k => [k, 0]));
  const season = seasonName();
  const sm = S_MOD[season] || {};
  const globalMult = productionMetaMult() * (1 + (G.bldgs.mycelium_network || 0) * (BLDGS.mycelium_network.effects.global_prod || 0) + (G.bldgs.colony_spire || 0) * (BLDGS.colony_spire.effects.global_prod || 0));

  let hdEventMult = 1;
  if (G.events.active === 'hd_boost') hdEventMult = 1.5;
  if (G.events.active === 'hd_blight') hdEventMult = 0.5;
  if (G.events.active === 'hd_drought') hdEventMult = 0.8;
  const amberEventMult = G.events.active === 'amber_rush' ? 1.6 : 1;
  const starEventMult = G.events.active === 'star_current' ? 1.7 : 1;

  let hdSeason = sm.honeydew ?? 1;
  if (season === 'Winter' && G.techs.seasonal_awareness) {
    const red = TECHS.seasonal_awareness.effects?.winter_red || 0;
    hdSeason = hdSeason + (1 - hdSeason) * red;
  }

  r.honeydew += (G.bldgs.clover_patch || 0) * BLDGS.clover_patch.effects.hd_prod * hdSeason * hdEventMult * globalMult;
  r.leaves   += (G.bldgs.amber_vault || 0) * (buildingEffects('amber_vault').leaves_prod || 0) * globalMult * amberEventMult * milestoneGroundBonus() * amberResearchGroundMult();
  r.dirt     += (G.bldgs.amber_vault || 0) * (buildingEffects('amber_vault').dirt_prod || 0) * globalMult * amberEventMult * milestoneGroundBonus() * amberResearchGroundMult();
  r.spores   += (G.bldgs.spore_circle || 0) * (BLDGS.spore_circle.effects.spores_prod || 0) * globalMult;
  r.wax      += (G.bldgs.wax_foundry || 0) * (BLDGS.wax_foundry.effects.wax_prod || 0) * globalMult;
  r.silk     += (G.bldgs.web_workshop || 0) * (BLDGS.web_workshop.effects.silk_prod || 0) * globalMult;
  r.compound += (G.bldgs.compound_lab || 0) * (BLDGS.compound_lab.effects.compound_prod || 0) * globalMult;
  r.elytra   += (G.bldgs.flight_tower || 0) * (BLDGS.flight_tower.effects.elytra_prod || 0) * globalMult * skyLegacyMult() * starEventMult;
  r.elytra   += (G.bldgs.sky_beacon || 0) * (buildingEffects('sky_beacon').elytra_prod || 0) * globalMult * skyLegacyMult() * starEventMult;
  r.aether   += (G.bldgs.sky_dock || 0) * (BLDGS.sky_dock.effects.aether_prod || 0) * globalMult * skyLegacyMult() * starEventMult;
  r.aether   += (G.bldgs.sky_beacon || 0) * (buildingEffects('sky_beacon').aether_prod || 0) * globalMult * skyLegacyMult() * starEventMult;
  r.skyglass += (G.bldgs.cloud_condenser || 0) * (BLDGS.cloud_condenser.effects.skyglass_prod || 0) * globalMult * skyLegacyMult() * starEventMult * milestoneSkyglassBonus();

  for (const [jid, count] of Object.entries(G.jobs)) {
    if (!count) continue;
    const produces = effectiveJobProduces(jid);
    for (const [res, base] of Object.entries(produces)) {
      let jrate = base * count * globalMult;
      if (jid === 'forager') {
        const fgMult = 1 + (G.bldgs.fungal_garden || 0) * (BLDGS.fungal_garden.effects.forager_mult || 0);
        jrate *= fgMult * hdSeason * hdEventMult;
      }
      if (jid === 'leaf_col') {
        jrate *= (sm.leaves ?? 1.0);
      }
      if (jid === 'scholar') {
        const obsMult = 1 + (G.bldgs.hive_observatory || 0) * (BLDGS.hive_observatory.effects.scholar_mult || 0);
        const advMult = (G.techs.advanced_science && TECHS.advanced_science.effects?.global_insight) || 1;
        jrate *= obsMult * advMult;
      }
      if (jid === 'nurse') {
        const nurseryMult = 1 + (G.bldgs.brood_nursery || 0) * (buildingEffects('brood_nursery').nurse_mult || 0);
        jrate *= nurseryMult * swarmResearchNurseMult();
      }
      if (jid === 'excavator') {
        jrate *= amberEventMult * milestoneGroundBonus() * amberResearchExcavatorMult() * amberResearchGroundMult();
      }
      if (jid === 'aeronaut') jrate *= skyLegacyMult() * starEventMult;
      if (jid === 'navigator') {
        const beaconMult = 1 + (G.bldgs.sky_beacon || 0) * (buildingEffects('sky_beacon').navigator_mult || 0);
        jrate *= beaconMult * skyLegacyMult() * starEventMult * celestialResearchNavigatorMult();
      }
      r[res] += jrate;
    }
  }

  r.honeydew -= G.pop.total * 0.003 * upkeepLegacyMult();
  // Map terrain passive bonuses (Amber Springs etc.)
  if (G.map && G.map.bonus) {
    for (const [res, val] of Object.entries(G.map.bonus)) {
      if (r[res] !== undefined) r[res] += val;
    }
  }
  // Outpost passive production
  const opProd = outpostProductionSummary();
  for (const [res, rate] of Object.entries(opProd)) {
    if (r[res] !== undefined) r[res] += rate;
  }

  return r;
}

const WORKER_FLOAT_COLORS = {
  honeydew:'#fbbf24', leaves:'#4ade80', dirt:'#c08457', chitin:'#e2e8f0', silk:'#cbd5e1',
  wax:'#fb923c', spores:'#c084fc', insight:'#7dd3fc', resin:'#fb923c', compound:'#2dd4bf',
  elytra:'#fef08a', aether:'#93c5fd', skyglass:'#c4b5fd', royal_jelly:'#f472b6'
};

function fmtWorkerBurstAmt(amount) {
  if (amount >= 10) return String(Math.round(amount));
  if (amount >= 1) return amount.toFixed(amount >= 3 ? 0 : 1).replace(/\.0$/, '');
  return amount.toFixed(amount >= 0.3 ? 1 : 2).replace(/0$/, '').replace(/\.$/, '');
}

function computeWorkerVisualBreakdown(dt = 1) {
  const out = {};
  if (dt <= 0) return out;
  const season = seasonName();
  const sm = S_MOD[season] || {};
  const globalMult = productionMetaMult() * (1 + (G.bldgs.mycelium_network || 0) * (BLDGS.mycelium_network.effects.global_prod || 0) + (G.bldgs.colony_spire || 0) * (BLDGS.colony_spire.effects.global_prod || 0));

  let hdEventMult = 1;
  if (G.events.active === 'hd_boost') hdEventMult = 1.5;
  if (G.events.active === 'hd_blight') hdEventMult = 0.5;
  if (G.events.active === 'hd_drought') hdEventMult = 0.8;
  const amberEventMult = G.events.active === 'amber_rush' ? 1.6 : 1;
  const starEventMult = G.events.active === 'star_current' ? 1.7 : 1;

  let hdSeason = sm.honeydew ?? 1;
  if (season === 'Winter' && G.techs.seasonal_awareness) {
    const red = TECHS.seasonal_awareness.effects?.winter_red || 0;
    hdSeason = hdSeason + (1 - hdSeason) * red;
  }

  for (const [jid, count] of Object.entries(G.jobs || {})) {
    if (!count) continue;
    const produces = effectiveJobProduces(jid);
    for (const [res, base] of Object.entries(produces)) {
      let gain = base * count * globalMult * dt;
      if (jid === 'forager') {
        const fgMult = 1 + (G.bldgs.fungal_garden || 0) * (BLDGS.fungal_garden.effects.forager_mult || 0);
        gain *= fgMult * hdSeason * hdEventMult;
      }
      if (jid === 'leaf_col') gain *= (sm.leaves ?? 1.0);
      if (jid === 'scholar') {
        const obsMult = 1 + (G.bldgs.hive_observatory || 0) * (BLDGS.hive_observatory.effects.scholar_mult || 0);
        const advMult = (G.techs.advanced_science && TECHS.advanced_science.effects?.global_insight) || 1;
        gain *= obsMult * advMult;
      }
      if (jid === 'nurse') {
        const nurseryMult = 1 + (G.bldgs.brood_nursery || 0) * (buildingEffects('brood_nursery').nurse_mult || 0);
        gain *= nurseryMult * swarmResearchNurseMult();
      }
      if (jid === 'excavator') gain *= amberEventMult * milestoneGroundBonus() * amberResearchExcavatorMult() * amberResearchGroundMult();
      if (jid === 'aeronaut') gain *= skyLegacyMult() * starEventMult;
      if (jid === 'navigator') {
        const beaconMult = 1 + (G.bldgs.sky_beacon || 0) * (buildingEffects('sky_beacon').navigator_mult || 0);
        gain *= beaconMult * skyLegacyMult() * starEventMult * celestialResearchNavigatorMult();
      }
      if (gain > 0) {
        if (!out[jid]) out[jid] = {};
        out[jid][res] = (out[jid][res] || 0) + gain;
      }
    }
  }
  return out;
}

function queueColonyWorkerVisualYields(dt = 1) {
  if (curTab !== 'colony' || !ColonyViz.inited) return;
  const breakdown = computeWorkerVisualBreakdown(dt);
  if (Object.keys(breakdown).length) ColonyViz.queueWorkerYields(breakdown);
}

function awardBug(n = 1) {
  const prevTotal = G.pop.total;
  const add = Math.min(n, Math.max(0, housing() - G.pop.total));
  if (add <= 0) return 0;
  G.pop.total += add;
  log(`A new bug hatches! Colony: ${G.pop.total}/${housing()}`);
  if (add > 0) {
    toast(`+${add} bug${add > 1 ? 's' : ''}`);
    // Juice: hatch burst
    juiceHatchBurst();
    // Pop up over colony canvas
    const canvas = document.getElementById('colony-canvas-wrap');
    spawnGatherPop('🥚 +' + add + ' bug' + (add > 1 ? 's' : '') + '!', '', canvas);
    if (prevTotal === 0 && G.pop.total > 0) maybeAnnounceJobUnlock('forager');
  }
  return add;
}

function triggerRandomEvent() {
  const choicePool = CHOICE_EVENTS.filter(ev => (!ev.req || G.techs[ev.req]) && (!ev.capstone || capstoneOwned(ev.capstone)));
  if (!G.events.choice && choicePool.length && Math.random() < 0.42) {
    const ev = choicePool[Math.floor(Math.random() * choicePool.length)];
    G.events.choice = evolveChoiceEvent(ev);
    renderChoiceEvent();
    return;
  }

  const pool = EVENTS.filter(ev => (!ev.req || G.techs[ev.req]) && (!ev.capstone || capstoneOwned(ev.capstone)));
  const totalW = pool.reduce((a, e) => a + e.w, 0);
  let rnd = Math.random() * totalW;
  const ev = pool.find(e => { rnd -= e.w; return rnd <= 0; }) || pool[0];
  log(`Event: ${ev.msg}`, 'ev');
  toast(ev.msg);
  switch (ev.effect) {
    case 'hd_boost':
    case 'hd_blight':
    case 'hd_drought':
      G.events.active = ev.effect;
      G.events.ticks_left = ev.effect === 'hd_blight' ? 100 : 150;
      break;
    case 'leaves_gift':
      G.res.leaves = Math.min(maxRes('leaves'), G.res.leaves + 30);
      G.vis.leaves = true;
      break;
    case 'insight_gift':
      G.res.insight = Math.min(maxRes('insight'), G.res.insight + 20);
      G.vis.insight = true;
      break;
    case 'pop_gift':
      awardBug(1);
      break;
    case 'spores_gift':
      G.vis.spores = true;
      G.res.spores = Math.min(maxRes('spores'), G.res.spores + 50);
      break;
    case 'aether_gift':
      G.vis.aether = true;
      G.res.aether = Math.min(maxRes('aether'), G.res.aether + 40);
      break;
  }
}

function applyChoiceEffect(effect) {
  switch (effect) {
    case 'adopt_larva':
      G.res.honeydew = Math.max(0, G.res.honeydew - 15);
      awardBug(1);
      break;
    case 'study_larva':
      G.vis.insight = true;
      G.res.insight = Math.min(maxRes('insight'), G.res.insight + 12);
      break;
    case 'amber_refine':
      G.vis.resin = true;
      G.vis.wax = true;
      G.res.resin = Math.min(maxRes('resin'), G.res.resin + 20);
      G.res.wax = Math.min(maxRes('wax'), G.res.wax + 10);
      break;
    case 'amber_sell':
      G.res.honeydew = Math.min(maxRes('honeydew'), G.res.honeydew + 80);
      break;
    case 'anchor_docks':
      G.res.leaves = Math.max(0, G.res.leaves - 25);
      G.vis.skyglass = true;
      G.res.skyglass = Math.min(maxRes('skyglass'), G.res.skyglass + 4);
      break;
    case 'ride_winds':
      G.vis.aether = true;
      G.res.aether = Math.min(maxRes('aether'), G.res.aether + (Math.random() < 0.65 ? 50 : 15));
      break;
    case 'queen_tribute':
      G.res.honeydew = Math.max(0, G.res.honeydew - 60);
      G.vis.insight = true;
      G.res.insight = Math.min(maxRes('insight'), G.res.insight + 35);
      awardBug(1);
      break;
    case 'queen_decline':
      G.events.active = 'hd_boost';
      G.events.ticks_left = 100;
      break;
    case 'brood_surge_start':
      G.events.active = 'brood_surge';
      G.events.ticks_left = 120;
      break;
    case 'brood_recruit':
      G.res.honeydew = Math.max(0, G.res.honeydew - 20);
      awardBug(2);
      break;
    case 'amber_excavate':
      G.vis.leaves = true;
      G.vis.dirt = true;
      G.vis.resin = true;
      G.res.leaves = Math.min(maxRes('leaves'), G.res.leaves + 35);
      G.res.dirt = Math.min(maxRes('dirt'), G.res.dirt + 35);
      G.res.resin = Math.min(maxRes('resin'), G.res.resin + 12);
      break;
    case 'amber_rush_start':
      G.events.active = 'amber_rush';
      G.events.ticks_left = 120;
      break;
    case 'chart_route':
      G.vis.aether = true;
      G.vis.elytra = true;
      G.res.aether = Math.min(maxRes('aether'), G.res.aether + 45);
      G.res.elytra = Math.min(maxRes('elytra'), G.res.elytra + 2);
      break;
    case 'star_current_start':
      G.events.active = 'star_current';
      G.events.ticks_left = 120;
      break;
    case 'imperial_brood_surge':
      G.events.active = 'brood_surge';
      G.events.ticks_left = 180;
      awardBug(1);
      break;
    case 'imperial_recruit':
      G.res.honeydew = Math.max(0, G.res.honeydew - 30);
      G.vis.spores = true;
      G.res.spores = Math.min(maxRes('spores'), G.res.spores + 10);
      awardBug(3);
      break;
    case 'deep_excavate':
      G.vis.leaves = true;
      G.vis.dirt = true;
      G.vis.resin = true;
      G.vis.chitin = true;
      G.res.leaves = Math.min(maxRes('leaves'), G.res.leaves + 60);
      G.res.dirt = Math.min(maxRes('dirt'), G.res.dirt + 60);
      G.res.resin = Math.min(maxRes('resin'), G.res.resin + 20);
      G.res.chitin = Math.min(maxRes('chitin'), G.res.chitin + 10);
      break;
    case 'monolith_reserve':
      G.events.active = 'amber_rush';
      G.events.ticks_left = 180;
      G.vis.wax = true;
      G.res.wax = Math.min(maxRes('wax'), G.res.wax + 10);
      break;
    case 'astral_chart':
      G.vis.aether = true;
      G.vis.elytra = true;
      G.vis.skyglass = true;
      G.res.aether = Math.min(maxRes('aether'), G.res.aether + 70);
      G.res.elytra = Math.min(maxRes('elytra'), G.res.elytra + 4);
      G.res.skyglass = Math.min(maxRes('skyglass'), G.res.skyglass + 5);
      break;
    case 'astral_current_start':
      G.events.active = 'star_current';
      G.events.ticks_left = 180;
      G.vis.aether = true;
      G.res.aether = Math.min(maxRes('aether'), G.res.aether + 20);
      break;
  }
}

function chooseEvent(idx) {
  if (!G.events.choice) return;
  const choice = G.events.choice.choices[idx];
  if (!choice) return;
  log(`Choice: ${G.events.choice.title} — ${choice.label}`);
  toast(choice.label);
  applyChoiceEffect(choice.effect);
  G.events.choice = null;
  renderChoiceEvent();
  renderAll();
}

function closeChoiceEvent() {
  G.events.choice = null;
  renderChoiceEvent();
}

/* ── EXPEDITION SYSTEM ──────────────────────── */

function expZoneAvailable(zone) {
  return !zone.req || !!G.techs[zone.req];
}

function expActiveCount() {
  return (G.expeditions || []).length;
}

function expSlotsFull() {
  return expActiveCount() >= MAX_EXPEDITIONS;
}

function canSendExpedition(zone) {
  if (!expZoneAvailable(zone)) return false;
  if (expSlotsFull()) return false;
  if (idle() < zone.bugs) return false;
  if ((G.expeditions || []).some(e => e.zone === zone.id)) return false;
  return true;
}

function sendExpedition(zoneId) {
  const zone = EXPEDITIONS.find(z => z.id === zoneId);
  if (!zone || !canSendExpedition(zone)) {
    toast(expSlotsFull() ? 'All expedition slots full' : idle() < zone.bugs ? 'Not enough idle bugs' : 'Cannot explore yet', 'warn');
    return;
  }
  if (!G.expeditions) G.expeditions = [];
  G.expeditions.push({
    zone: zone.id,
    bugs: zone.bugs,
    duration: zone.duration,
    elapsed: 0,
    done: false
  });
  log(`Expedition sent: ${zone.name} (${zone.bugs} bug${zone.bugs > 1 ? 's' : ''})`);
  toast(`Exploring ${zone.name}...`);
  showFeatureAnnounce('first_expedition');
  renderTab();
}

function rollExpeditionReward(zone) {
  const totalW = zone.rewards.reduce((s, r) => s + r.w, 0);
  let rnd = Math.random() * totalW;
  for (const reward of zone.rewards) {
    rnd -= reward.w;
    if (rnd <= 0) return reward;
  }
  return zone.rewards[zone.rewards.length - 1];
}

function collectExpedition(idx) {
  if (!G.expeditions || !G.expeditions[idx]) return;
  const exp = G.expeditions[idx];
  if (!exp.done) return;
  const zone = EXPEDITIONS.find(z => z.id === exp.zone);
  if (!zone) { G.expeditions.splice(idx, 1); renderTab(); return; }
  const reward = rollExpeditionReward(zone);
  const gained = [];
  for (const [res, amt] of Object.entries(reward.loot)) {
    if (G.res[res] === undefined) continue;
    const added = Math.min(amt, maxRes(res) - (G.res[res] || 0));
    if (added > 0) {
      G.res[res] += added;
      G.vis[res] = true;
      gained.push(`${RES[res].icon}+${added}`);
    }
  }
  G.expeditions.splice(idx, 1);
  G.stats.expeditions = (G.stats.expeditions || 0) + 1;
  const lootStr = gained.join(' ');
  log(`Expedition returned from ${zone.name}: ${reward.msg} ${lootStr}`);
  toast(`${zone.name}: ${lootStr}`, '');
  revealMapTiles(zone.id);
  renderTab();
}

function tickExpeditions(dt) {
  if (!G.expeditions) return;
  for (const exp of G.expeditions) {
    if (exp.done) continue;
    exp.elapsed += dt;
    if (exp.elapsed >= exp.duration) {
      exp.elapsed = exp.duration;
      exp.done = true;
    }
  }
}

function fmtExpTime(secs) {
  const left = Math.max(0, Math.ceil(secs));
  if (left >= 60) return `${Math.floor(left / 60)}m ${left % 60}s`;
  return `${left}s`;
}

function expeditionPanel() {
  if (G.pop.total < 1) return '';
  const available = EXPEDITIONS.filter(z => expZoneAvailable(z));
  if (!available.length && !(G.expeditions || []).length) return '';

  let html = `<div class="exp-panel">`;
  html += `<div class="exp-title">EXPEDITIONS · ${expActiveCount()}/${MAX_EXPEDITIONS} ACTIVE</div>`;

  if ((G.expeditions || []).length > 0) {
    html += `<div class="exp-slots">`;
    for (let i = 0; i < G.expeditions.length; i++) {
      const exp = G.expeditions[i];
      const zone = EXPEDITIONS.find(z => z.id === exp.zone);
      if (!zone) continue;
      const pct = Math.min(100, (exp.elapsed / exp.duration) * 100);
      const timeLeft = exp.duration - exp.elapsed;
      html += `<div class="exp-active${exp.done ? ' exp-reward-flash' : ''}">
        <div class="exp-active-head">
          <div class="exp-active-name">${zone.icon} ${zone.name}</div>
          <div class="exp-active-time">${exp.done ? 'RETURNED' : fmtExpTime(timeLeft)}</div>
        </div>
        <div class="exp-active-bugs">${exp.bugs} bug${exp.bugs > 1 ? 's' : ''} exploring</div>
        <div class="exp-progress"><div class="exp-progress-fill${exp.done ? ' done' : ''}" style="width:${pct}%"></div></div>
        ${exp.done ? `<button class="exp-collect-btn" onclick="collectExpedition(${i})">COLLECT REWARDS</button>` : ''}
      </div>`;
    }
    html += `</div>`;
  }

  html += `<div style="font-size:10px;color:var(--text-lo);margin-bottom:6px;">Send idle bugs to explore zones and bring back random loot.</div>`;

  for (const zone of EXPEDITIONS) {
    const unlocked = expZoneAvailable(zone);
    const alreadySent = (G.expeditions || []).some(e => e.zone === zone.id);
    const can = canSendExpedition(zone);
    let cls = 'exp-zone';
    if (!unlocked) cls += ' locked';
    else if (can) cls += ' can';
    const bugLabel = `${zone.bugs} bug${zone.bugs > 1 ? 's' : ''} · ${fmtExpTime(zone.duration)}`;
    html += `<div class="${cls}" onclick="${can ? `sendExpedition('${zone.id}')` : ''}" style="margin-bottom:6px;">
      <div class="exp-zone-ico">${zone.icon}</div>
      <div class="exp-zone-info">
        <div class="exp-zone-name">${zone.name}</div>
        <div class="exp-zone-desc">${zone.desc}</div>
        <div class="exp-zone-meta">${bugLabel}</div>
        ${!unlocked ? `<div class="exp-zone-lock">Requires: ${TECHS[zone.req]?.name || zone.req}</div>` : ''}
        ${alreadySent ? `<div class="exp-zone-meta" style="color:var(--amber)">Already exploring</div>` : ''}
      </div>
    </div>`;
  }

  html += `</div>`;
  return html;
}

/* ── OUTPOST SYSTEM ─────────────────────────── */

function outpostCount() {
  return (G.outposts || []).length;
}

// Total bugs pinned as outpost garrisons (counts against idle)
function outpostWorkers() {
  return (G.outposts || []).filter(o => o.status !== 'dormant').length;
}

// Returns outpost object for a tile key, or null
function getOutpost(key) {
  return (G.outposts || []).find(o => o.key === key) || null;
}

// Can a tile have an outpost established?
function canEstablishOutpost(key) {
  if (!G.techs.outpost_network) return false;
  initMapIfNeeded();
  const tile = G.map && G.map.tiles && G.map.tiles[key];
  if (!tile || !tile.revealed) return false;
  if (tile.type === 'colony' || tile.type === 'hazard' || tile.type === 'plains') return false;
  if (!OUTPOST_DEFS[tile.type]) return false;
  if (getOutpost(key)) return false;
  return true;
}

function outpostCost(tileType) {
  return (OUTPOST_DEFS[tileType] || {}).cost || {};
}

function establishOutpost(key) {
  if (!canEstablishOutpost(key)) { toast('Cannot establish outpost here', 'warn'); return; }
  if (idle() <= 0) { toast('No idle bugs to garrison the outpost', 'warn'); return; }
  initMapIfNeeded();
  const tile = G.map.tiles[key];
  const def = OUTPOST_DEFS[tile.type];
  const cost = outpostCost(tile.type);
  if (!canAfford(cost)) { toast('Not enough resources to establish outpost', 'warn'); return; }
  for (const [r, a] of Object.entries(cost)) G.res[r] = Math.max(0, (G.res[r] || 0) - a);
  if (!G.outposts) G.outposts = [];
  const op = {
    key,
    type: tile.type,
    name: def.label,
    status: 'active',         // 'active' | 'contested' | 'dormant'
    contest_ticks: 0,         // countdown before outpost falls if undefended
    contest_power: 0,         // power of the current attacker
    rival_id: null,
    rival_name: '',
    total_produced: 0,        // lifetime resource units produced
  };
  G.outposts.push(op);
  G.stats.outposts_built = (G.stats.outposts_built || 0) + 1;
  log(`Outpost established: ${def.label} at ${key}.`);
  toast(`${def.label} garrisoned!`);
  renderTab();
}

function abandonOutpost(key) {
  if (!G.outposts) return;
  const idx = G.outposts.findIndex(o => o.key === key);
  if (idx < 0) return;
  const op = G.outposts[idx];
  G.outposts.splice(idx, 1);
  log(`Outpost at ${op.name} abandoned. The garrison returns to the colony.`);
  toast(`Outpost abandoned`);
  renderTab();
}

// Resolve a contest: send idle fighters to defend, or accept the loss
function defendOutpost(key) {
  const op = getOutpost(key);
  if (!op || op.status !== 'contested') { toast('No contested outpost here', 'warn'); return; }
  const idleFighters = (G.fighters || []).filter(f => f.status === 'idle');
  if (!idleFighters.length) { toast('No idle fighters available to defend', 'warn'); return; }
  const squad = idleFighters.slice(0, Math.min(3, idleFighters.length));
  const totalPower = squad.reduce((s, f) => s + fighterPower(f), 0);
  const roll = 0.7 + Math.random() * 0.6;
  const effectivePower = totalPower * roll;
  const fortBonus = colonyProjectBonus('fortified');
  const defenceThreshold = fortBonus > 0 ? 0.7 * (1 - fortBonus * 0.5) : 0.7; // easier to win with fortification
  const outcome = effectivePower >= op.contest_power * defenceThreshold ? 'win' : 'loss';

  const xpGain = outcome === 'win' ? 12 : 4;
  squad.forEach(f => {
    f.xp = (f.xp || 0) + xpGain;
    const dmg = outcome === 'win'
      ? Math.ceil(op.contest_power * 0.06 + Math.random() * 2)
      : Math.ceil(op.contest_power * 0.30 + Math.random() * 3);
    f.hp = Math.max(1, f.hp - dmg);
    while (f.xp >= f.xp_next) {
      f.xp -= f.xp_next; f.level++;
      f.max_hp = fighterMaxHp(f.level); f.xp_next = fighterXpNext(f.level);
      log(`⭐ ${f.name} reached Level ${f.level}!`); toast(`${f.name} is now Level ${f.level}!`);
    }
    if (f.hp < f.max_hp * 0.6) { f.status = 'recovering'; f.recover_ticks = Math.ceil((f.max_hp - f.hp) * 10); }
  });
  G.stats.scouts = (G.stats.scouts || 0) + 1;

  if (outcome === 'win') {
    const attackerName = op.rival_name || 'the attackers';
    if (op.rival_id) noteRivalOutcome(op.rival_id, 'repelled');
    op.status = 'active';
    op.contest_ticks = 0;
    op.contest_power = 0;
    op.rival_id = null;
    op.rival_name = '';
    log(`Defence successful! ${op.name} held against ${attackerName} by the garrison.`);
    toast(`${op.name} defended!`);
  } else {
    if (op.rival_id) noteRivalOutcome(op.rival_id, 'victories');
    const idx = G.outposts.findIndex(o => o.key === key);
    if (idx >= 0) G.outposts.splice(idx, 1);
    log(`${op.name} was overrun by ${op.rival_name || 'the attackers'}. The garrison retreats.`, 'bad');
    toast(`${op.name} lost!`, 'bad');
  }
  renderTab();
}

// Call from tick: passive production + contest roll
const OUTPOST_CONTEST_TICKS = 150;  // ~30s to respond before outpost goes dormant
const OUTPOST_CONTEST_CHANCE = 0.00012; // per tick per outpost while active

function tickOutposts(dt) {
  if (!G.outposts || !G.outposts.length) return;
  for (let i = G.outposts.length - 1; i >= 0; i--) {
    const op = G.outposts[i];
    const def = OUTPOST_DEFS[op.type];
    if (!def) continue;

    if (op.status === 'active') {
      const bundle = outpostRateBundle(op.type, G);
      const dangerScore = bundle.identity ? bundle.identity.danger_score : 2;
      const seasonContestMult = bundle.seasonEffect && bundle.seasonEffect.contest_mult ? bundle.seasonEffect.contest_mult : 1;
      // Passive production
      for (const [res, rate] of Object.entries(bundle.prod)) {
        if (G.res[res] === undefined) continue;
        const gained = Math.min(rate * dt, maxRes(res) - (G.res[res] || 0));
        if (gained > 0) { G.res[res] += gained; G.vis[res] = true; op.total_produced = (op.total_produced || 0) + gained; }
      }
      // Random contest trigger
      const dangerContestMult = 0.82 + dangerScore * 0.08;
      if (Math.random() < OUTPOST_CONTEST_CHANCE * dt * 200 * dangerContestMult * seasonContestMult) {
        const rival = pickConflictRival();
        op.status = 'contested';
        op.contest_ticks = OUTPOST_CONTEST_TICKS;
        op.contest_power = def.power * dangerContestMult * seasonContestMult * (0.8 + Math.random() * 0.8) * (rival ? rival.threat : 1);
        op.rival_id = rival ? rival.id : null;
        op.rival_name = rivalFullName(rival);
        const seasonalTail = bundle.seasonEffect ? ` ${bundle.seasonEffect.label} is making the border restless.` : '';
        log(`⚠ ${op.rival_name || 'Unknown raiders'} are harassing ${op.name}!${seasonalTail} Send fighters or lose the outpost.`, 'bad');
        toast(`${op.name} contested!`, 'bad');
      }
    } else if (op.status === 'contested') {
      op.contest_ticks = (op.contest_ticks || 0) - 1;
      if (op.contest_ticks <= 0) {
        // No defence sent in time — outpost goes dormant (captured, not destroyed)
        const attackerName = op.rival_name || 'attackers';
        op.status = 'dormant';
        op.contest_power = 0;
        if (op.rival_id) noteRivalOutcome(op.rival_id, 'victories');
        log(`${op.name} fell to ${attackerName}. The outpost is dormant — abandon or reclaim it.`, 'bad');
        toast(`${op.name} overrun — now dormant`, 'bad');
      }
    } else if (op.status === 'dormant') {
      // Dormant outposts sit there until player abandons or "reclaims" (re-establish)
    }
  }
}

// Reclaim a dormant outpost: spend half cost, restores to active
function reclaimOutpost(key) {
  const op = getOutpost(key);
  if (!op || op.status !== 'dormant') { toast('Outpost is not dormant', 'warn'); return; }
  if (idle() <= 0) { toast('No idle bugs to send as garrison', 'warn'); return; }
  const def = OUTPOST_DEFS[op.type];
  const halfCost = {};
  for (const [r, a] of Object.entries(outpostCost(op.type))) halfCost[r] = Math.ceil(a * 0.5);
  if (!canAfford(halfCost)) { toast('Not enough resources to reclaim outpost', 'warn'); return; }
  for (const [r, a] of Object.entries(halfCost)) G.res[r] = Math.max(0, (G.res[r] || 0) - a);
  op.status = 'active';
  op.contest_ticks = 0;
  op.contest_power = 0;
  op.rival_id = null;
  op.rival_name = '';
  log(`${op.name} reclaimed. Garrison redeployed.`);
  toast(`${op.name} reclaimed!`);
  renderTab();
}

function outpostProductionSummary() {
  const totals = {};
  for (const op of (G.outposts || [])) {
    if (op.status !== 'active') continue;
    const bundle = outpostRateBundle(op.type, G);
    for (const [res, rate] of Object.entries(bundle.prod)) {
      totals[res] = (totals[res] || 0) + rate;
    }
  }
  return totals;
}

function outpostPanelHTML() {
  if (!G.techs.outpost_network) return '';
  const ops = G.outposts || [];
  const activeCount = ops.filter(o => o.status === 'active').length;
  const contestedCount = ops.filter(o => o.status === 'contested').length;
  const prod = outpostProductionSummary();
  const prodStr = Object.entries(prod).map(([r, v]) => `${RES[r].icon}+${(v * 5).toFixed(3)}/s`).join(' ');

  let html = `<div class="outpost-panel">`;
  html += `<div class="outpost-panel-title">OUTPOSTS · ${activeCount} active${contestedCount > 0 ? ` · <span style="color:var(--red)">${contestedCount} CONTESTED</span>` : ''}</div>`;
  if (prodStr) html += `<div style="font-family:var(--mono);font-size:9px;color:var(--accent);margin-bottom:8px;">${prodStr}</div>`;

  if (!ops.length) {
    html += `<div style="font-size:10px;color:var(--text-lo);margin-bottom:8px;">No outposts established. On the Map tab, tap a revealed tile to establish one — it will passively produce resources while a bug is garrisoned there. Contested outposts need fighters to defend.</div>`;
  } else {
    for (const op of ops) {
      const def = OUTPOST_DEFS[op.type];
      if (!def) continue;
      const bundle = outpostRateBundle(op.type, G);
      const prodLine = Object.entries(bundle.prod).map(([r, v]) => `${RES[r].icon}+${(v * 5).toFixed(3)}/s`).join(' ');
      const isContested = op.status === 'contested';
      const isDormant = op.status === 'dormant';
      const timeLeft = isContested ? Math.ceil((op.contest_ticks || 0) * (TICK_MS / 1000)) : 0;
      const identity = bundle.identity;
      html += `<div class="outpost-card ${isContested ? 'contested' : isDormant ? 'dormant' : ''}">
        <div class="outpost-ico" style="color:${def.color}">${def.icon}</div>
        <div class="outpost-info">
          <div class="outpost-name">${op.name}</div>
          <div class="outpost-prod">${isDormant ? '<span style="color:var(--text-lo)">Dormant — not producing</span>' : prodLine}</div>
          <div class="outpost-status ${isContested ? 'contested' : isDormant ? 'dormant' : 'active'}">
            ${isContested ? `⚠ UNDER ATTACK` : isDormant ? '⊘ OVERRUN' : '◉ ACTIVE'}
          </div>
          ${(isContested || isDormant) && op.rival_name ? `<div style="font-size:9px;color:${isContested ? 'var(--red)' : 'var(--text-lo)'};margin-top:2px;font-family:var(--mono);">${op.rival_name}</div>` : ''}
          ${identity ? `<div style="font-size:9px;color:var(--text-lo);margin-top:3px;">${identity.specialty} · Danger ${territoryDangerPips(identity.danger_score)}</div>` : ''}
          ${bundle.seasonEffect ? `<div style="font-size:9px;color:var(--amber);margin-top:3px;">${bundle.seasonEffect.label}: ${bundle.seasonEffect.note}</div>` : ''}
          ${identity ? `<div class="route-pull">Route pull: ${territoryInfluenceSummary(op.type)}</div>` : ''}
          ${isContested ? `<div class="outpost-contest-timer">${timeLeft}s to respond</div>` : ''}
        </div>
        <div class="outpost-actions">
          ${isContested ? `<button class="outpost-defend-btn" onclick="defendOutpost('${op.key}')">DEFEND</button>` : ''}
          ${isDormant ? `<button class="outpost-defend-btn" onclick="reclaimOutpost('${op.key}')">RECLAIM</button>` : ''}
          <button class="outpost-abandon-btn" onclick="abandonOutpost('${op.key}')">ABANDON</button>
        </div>
      </div>`;
    }
  }
  html += `<div style="font-size:9px;color:var(--text-lo);margin-top:4px;">Each active outpost ties up 1 idle bug as garrison. Establish more from the Map tab.</div>`;
  html += `</div>`;
  return html;
}

/* ── WORKER XP SYSTEM ───────────────────────── */
// Each job accumulates XP ticks while bugs are assigned.
// Rank 0-4 stars based on ticks. Each star = +5% production for that job.
const WORKER_XP_RANKS = [0, 400, 1200, 3000, 7000]; // ticks to reach star 1-4

function workerXp(jid) {
  return (G.worker_xp || {})[jid] || 0;
}

function workerStar(jid) {
  const xp = workerXp(jid);
  let star = 0;
  for (const thresh of WORKER_XP_RANKS) { if (xp >= thresh) star++; }
  return Math.min(4, star);
}

function workerXpBonus(jid) {
  return workerStar(jid) * 0.05; // +5% per star
}

function workerStarLabel(star) {
  if (star === 0) return '';
  return '★'.repeat(star) + '☆'.repeat(4 - star);
}

function workerXpNextThresh(jid) {
  const xp = workerXp(jid);
  const star = workerStar(jid);
  return star < 4 ? WORKER_XP_RANKS[star] : null;
}

function tickWorkerXp(dt) {
  if (!G.worker_xp) G.worker_xp = {};
  const xpMult = 1 + colonyProjectBonus('xp_boost');
  for (const [jid, count] of Object.entries(G.jobs)) {
    if (!count || count <= 0) continue;
    const prev = workerStar(jid);
    G.worker_xp[jid] = (G.worker_xp[jid] || 0) + count * dt * 5 * xpMult;
    const now = workerStar(jid);
    if (now > prev) {
      const jname = JOBS[jid] ? JOBS[jid].name : jid;
      log(`★ ${jname}s reached ${now}-star seasoning! +${now * 5}% production.`);
      toast(`${jname}s: ${workerStarLabel(now)}`, '');
      if (now === 1) showFeatureAnnounce('worker_xp');
    }
  }
}

function availableColonyProjects() {
  const completed = (G.stats.completed_cp || []);
  return COLONY_PROJECTS.filter(p =>
    (!p.unlock_req || G.techs[p.unlock_req]) &&
    !completed.includes(p.id) &&
    (!G.colony_project || G.colony_project.id !== p.id)
  );
}

function startColonyProject(id) {
  if (G.colony_project && !G.colony_project.done) { toast('A project is already underway', 'warn'); return; }
  const def = COLONY_PROJECTS.find(p => p.id === id);
  if (!def) return;
  if (!canAfford(def.build_cost)) { toast('Not enough resources', 'warn'); return; }
  for (const [r, a] of Object.entries(def.build_cost)) G.res[r] = Math.max(0, (G.res[r] || 0) - a);
  G.colony_project = {
    id: def.id,
    progress: 0,         // 0-100
    days_spent: 0,
    done: false,
    reward_applied: false,
  };
  log(`Colony project started: ${def.name}.`);
  toast(`Project: ${def.name} underway`);
  showFeatureAnnounce('colony_project');
  renderAll();
}

function contributeToProject(amount) {
  const cp = G.colony_project;
  if (!cp || cp.done) return;
  const def = COLONY_PROJECTS.find(p => p.id === cp.id);
  if (!def) return;
  // Spend Honeydew as the contribution resource (20 HD = ~3% progress)
  const hdCost = amount;
  if ((G.res.honeydew || 0) < hdCost) { toast('Not enough Honeydew', 'warn'); return; }
  G.res.honeydew -= hdCost;
  const gain = (hdCost / (def.duration_days * 8)) * 100; // scale: full season of ~8 HD/day = 100%
  cp.progress = Math.min(100, cp.progress + gain);
  renderTab();
}

function tickColonyProject(dt) {
  const cp = G.colony_project;
  if (!cp || cp.done) return;
  const def = COLONY_PROJECTS.find(p => p.id === cp.id);
  if (!def) return;
  // Auto-advance: employed bugs contribute a trickle
  const autoRate = (employed() * 0.003 * dt); // 0.003% per bug per second
  cp.progress = Math.min(100, cp.progress + autoRate);
  if (cp.progress >= 100 && !cp.done) {
    cp.done = true;
    applyColonyProjectReward(cp.id);
  }
}

function applyColonyProjectReward(id) {
  const def = COLONY_PROJECTS.find(p => p.id === id);
  if (!def) return;
  if (!G.stats.completed_cp) G.stats.completed_cp = [];
  if (!G.stats.completed_cp.includes(id)) G.stats.completed_cp.push(id);
  log(`Colony project complete: ${def.name}. Reward: ${def.reward_desc}`);
  toast(`${def.name} complete!`);
  // Rewards are read dynamically by effect functions below (see colonyProjectBonus functions)
}

function colonyProjectBonus(type) {
  const completed = (G.stats.completed_cp || []);
  let total = 0;
  for (const id of completed) {
    const def = COLONY_PROJECTS.find(p => p.id === id);
    if (def && def.reward && def.reward.type === type) total += def.reward.value;
  }
  // Also count active in-progress project if done
  const cp = G.colony_project;
  if (cp && cp.done) {
    const def2 = COLONY_PROJECTS.find(p => p.id === cp.id);
    if (def2 && def2.reward && def2.reward.type === type && !completed.includes(cp.id)) total += def2.reward.value;
  }
  return total;
}

function tickMapEvents(dt) {
  if (!G.map_events) G.map_events = [];
  // Tick down existing events
  for (let i = G.map_events.length - 1; i >= 0; i--) {
    G.map_events[i].ticks_left -= 1;
    if (G.map_events[i].ticks_left <= 0) {
      const ev = G.map_events[i];
      log(`Map event expired: ${ev.name} at (${ev.key}).`);
      G.map_events.splice(i, 1);
    }
  }
  // Spawn new events randomly on revealed non-hazard tiles
  initMapIfNeeded();
  const tiles = G.map && G.map.tiles;
  if (!tiles) return;
  const skywatchBonus = colonyProjectBonus('skywatch') > 0;
  const spawnChance = (skywatchBonus ? 0.00022 : 0.00014) * dt * 200;
  const maxEvents = skywatchBonus ? 4 : 3;
  if (G.map_events.length >= maxEvents) return;
  if (Math.random() > spawnChance) return;

  const eligibleKeys = Object.keys(tiles).filter(k => {
    const t = tiles[k];
    return t.revealed && t.type !== 'colony' && t.type !== 'hazard' && t.type !== 'plains' &&
      !G.map_events.some(ev => ev.key === k);
  });
  if (!eligibleKeys.length) return;
  const key = eligibleKeys[Math.floor(Math.random() * eligibleKeys.length)];
  const tile = tiles[key];
  const pool = MAP_EVENT_TYPES.filter(e => {
    if (e.id === 'resource_bloom') return MAP_TILE_DEFS[tile.type] && MAP_TILE_DEFS[tile.type].loot;
    return true;
  });
  const evType = pool[Math.floor(Math.random() * pool.length)];
  const rewardData = evType.reward_fn(tile.type);
  const skywatchDur = skywatchBonus ? 1.6 : 1;
  G.map_events.push({
    key,
    id: evType.id,
    name: evType.name,
    icon: evType.icon,
    color: evType.color,
    desc: evType.desc,
    action_label: evType.action_label,
    ticks_left: Math.ceil(evType.duration * skywatchDur),
    max_ticks: Math.ceil(evType.duration * skywatchDur),
    reward: rewardData,
  });
  log(`Map event: ${evType.name} at tile (${key}).`, 'ev');
  toast(`${evType.icon} ${evType.name} on the map!`);
  showFeatureAnnounce('map_event');
}

function claimMapEvent(key) {
  if (!G.map_events) return;
  const idx = G.map_events.findIndex(ev => ev.key === key);
  if (idx < 0) { toast('No event here', 'warn'); return; }
  const ev = G.map_events[idx];
  // Pay cost if any
  if (ev.reward && ev.reward.cost && Object.keys(ev.reward.cost).length) {
    if (!canAfford(ev.reward.cost)) { toast('Cannot afford this trade', 'warn'); return; }
    for (const [r, a] of Object.entries(ev.reward.cost)) G.res[r] = Math.max(0, (G.res[r] || 0) - a);
  }
  // Collect gain
  const gained = [];
  if (ev.reward && ev.reward.gain) {
    for (const [r, a] of Object.entries(ev.reward.gain)) {
      if (G.res[r] === undefined) continue;
      const added = Math.min(a, maxRes(r) - (G.res[r] || 0));
      if (added > 0) { G.res[r] += added; G.vis[r] = true; gained.push(`${RES[r].icon}+${added}`); }
    }
  }
  G.map_events.splice(idx, 1);
  const lootStr = gained.join(' ');
  log(`Map event collected: ${ev.name}${lootStr ? ' — ' + lootStr : ''}`);
  toast(`${ev.name}: ${lootStr || 'done'}`);
  // Re-render map content if on map tab
  const mapContent = document.getElementById('map-content');
  if (mapContent) mapContent.innerHTML = tabMapContent();
  renderNavBadges();
}

function generateChallenge(season, year) {
  const templates = CHALLENGE_TEMPLATES[season];
  if (!templates || !templates.length) return null;

  // Filter to challenges the player can actually attempt
  const viable = templates.filter(t => {
    if (t.stat === 'traded_season' && !G.techs.trade_routes) return false;
    if (t.stat === 'crafted_season' && G.stats.crafted === 0 && !G.techs.weaving && !G.techs.chitin_harvesting) return false;
    if (t.stat === 'insight_season' && !G.techs.natural_philosophy) return false;
    if (t.stat === 'exp_season' && G.pop.total < 1) return false;
    if (t.stat === 'scholar_target' && !G.techs.natural_philosophy) return false;
    if (t.stat === 'researched_season' && !G.techs.natural_philosophy) return false;
    return true;
  });
  if (!viable.length) return null;

  const template = viable[Math.floor(Math.random() * viable.length)];
  const difficulty = Math.max(0, year - 1);
  const target = Math.max(1, Math.round(template.base + template.scale * difficulty));

  // Scale rewards with difficulty
  const rewardMult = 1 + difficulty * 0.15;
  const scaledReward = {};
  for (const [k, v] of Object.entries(template.reward)) {
    scaledReward[k] = typeof v === 'number' ? Math.round(v * rewardMult) : v;
  }

  return {
    id: template.id,
    season,
    year,
    desc: template.desc.replace('{n}', target),
    stat: template.stat,
    target,
    current: 0,
    done: false,
    claimed: false,
    reward_type: template.reward_type,
    reward: scaledReward,
    // Tracking snapshots (set at challenge start)
    snap_built: G.stats.built || 0,
    snap_crafted: G.stats.crafted || 0,
    snap_traded: G.stats.traded || 0,
    snap_researched: G.stats.researched || 0,
    snap_hd: G.stats.total_hd || 0,
    snap_exp: G.stats.expeditions || 0,
    snap_pop: G.pop.total || 0,
    snap_insight: G.res.insight || 0,
    snap_produced: totalResourceStock(),
    failed_survive: false,
  };
}

function challengeProgress(ch) {
  if (!ch) return { cur: 0, target: 1, pct: 0 };
  let cur = 0;
  switch (ch.stat) {
    case 'pop_gained':
      cur = Math.max(0, G.pop.total - ch.snap_pop);
      break;
    case 'pop_target':
      cur = G.pop.total;
      break;
    case 'built_season':
      cur = (G.stats.built || 0) - ch.snap_built;
      break;
    case 'hd_season':
      cur = Math.floor((G.stats.total_hd || 0) - ch.snap_hd);
      break;
    case 'crafted_season':
      cur = (G.stats.crafted || 0) - ch.snap_crafted;
      break;
    case 'researched_season':
      cur = (G.stats.researched || 0) - ch.snap_researched;
      break;
    case 'produced_season':
      cur = Math.floor(totalResourceStock() - ch.snap_produced);
      if (cur < 0) cur = 0;
      break;
    case 'employed_target':
      cur = employed();
      break;
    case 'forager_target':
      cur = G.jobs.forager || 0;
      break;
    case 'scholar_target':
      cur = G.jobs.scholar || 0;
      break;
    case 'insight_season':
      cur = Math.floor(Math.max(0, (G.res.insight || 0) - ch.snap_insight + (ch._insight_spent || 0)));
      break;
    case 'stock_target':
    case 'stock_end':
      cur = Math.floor(totalResourceStock());
      break;
    case 'leaves_target':
      cur = Math.floor(G.res.leaves || 0);
      break;
    case 'traded_season':
      cur = (G.stats.traded || 0) - ch.snap_traded;
      break;
    case 'exp_season':
      cur = (G.stats.expeditions || 0) - ch.snap_exp;
      break;
    case 'hd_floor':
      cur = ch.failed_survive ? 0 : ch.target;
      break;
    case 'no_starvation':
      cur = ch.failed_survive ? 0 : 1;
      break;
    case 'bldgs_target':
      cur = Object.values(G.bldgs).reduce((s, v) => s + v, 0);
      break;
    default:
      cur = 0;
  }
  const pct = Math.min(100, Math.round((cur / Math.max(1, ch.target)) * 100));
  return { cur, target: ch.target, pct };
}

function checkChallenge() {
  if (!G.challenge || G.challenge.done) return;
  const ch = G.challenge;

  // Check survival-type challenges for failure
  if (ch.stat === 'hd_floor' && (G.res.honeydew || 0) < ch.target) {
    ch.failed_survive = true;
  }
  if (ch.stat === 'no_starvation' && G.res.honeydew <= 0.01 && G.pop.total > 0) {
    ch.failed_survive = true;
  }

  const prog = challengeProgress(ch);
  ch.current = prog.cur;
  if (prog.cur >= ch.target && !ch.failed_survive) {
    ch.done = true;
  }
}

function claimChallengeReward() {
  if (!G.challenge || !G.challenge.done || G.challenge.claimed) return;
  const ch = G.challenge;
  ch.claimed = true;
  G.stats.challenges = (G.stats.challenges || 0) + 1;
  // Juice: challenge complete burst
  juiceFlash('rgba(255,197,98,1)', 0.09);
  juiceMilestoneBurst(window.innerWidth / 2, window.innerHeight * 0.6, 'var(--amber)');
  spawnGatherPop('🏆 Challenge complete!', 'amber', document.getElementById('content'));

  if (ch.reward_type === 'res') {
    const gained = [];
    for (const [res, amt] of Object.entries(ch.reward)) {
      if (G.res[res] === undefined) continue;
      const added = Math.min(amt, maxRes(res) - (G.res[res] || 0));
      if (added > 0) {
        G.res[res] += added;
        G.vis[res] = true;
        gained.push(`${RES[res].icon}+${added}`);
      }
    }
    log(`Season challenge complete! ${gained.join(' ')}`);
    toast(`Challenge reward: ${gained.join(' ')}`);
  } else if (ch.reward_type === 'boost') {
    if (ch.reward.hd_boost) {
      G.events.active = 'hd_boost';
      G.events.ticks_left = ch.reward.hd_boost;
      log('Season challenge complete! Honeydew production boosted.');
      toast('Challenge reward: production boost!');
    }
    if (ch.reward.prod_boost) {
      G.events.active = 'hd_boost';
      G.events.ticks_left = ch.reward.prod_boost;
      log('Season challenge complete! Production boosted.');
      toast('Challenge reward: production boost!');
    }
    if (ch.reward.storage_boost) {
      // Grant a cache of mixed resources instead
      const bonus = [['leaves', 30], ['dirt', 25], ['honeydew', 40]];
      const gained = [];
      for (const [res, amt] of bonus) {
        const added = Math.min(amt, maxRes(res) - (G.res[res] || 0));
        if (added > 0) {
          G.res[res] += added;
          gained.push(`${RES[res].icon}+${added}`);
        }
      }
      log(`Season challenge complete! Stockpile bonus: ${gained.join(' ')}`);
      toast(`Challenge reward: ${gained.join(' ')}`);
    }
  }
  renderTab();
}

function onSeasonChange(newSeason) {
  // Show the season announcement popup
  showSeasonAnnounce(newSeason);
  if (G.techs.trade_routes) refreshTradeNetwork(G, 'season', true);
  // Auto-generate a new challenge for the new season
  if (G.pop.total >= 1 || G.stats.built > 0) {
    G.challenge = generateChallenge(newSeason, G.time.year);
    if (G.challenge) {
      log(`Season challenge: ${G.challenge.desc}`);
      toast(`New challenge: ${G.challenge.desc}`);
    }
  }
}

function seasonChallengePanel() {
  const ch = G.challenge;
  if (!ch) {
    // No challenge yet - show hint if player has started
    if (G.pop.total < 1 && G.stats.built === 0) return '';
    return '';
  }

  // Don't show challenges from a past season (missed it)
  const currentSeason = seasonName();
  if (ch.season !== currentSeason && !ch.done) {
    return '';
  }

  const prog = challengeProgress(ch);
  const seasonCls = ch.done ? 'done' : ch.season.toLowerCase();
  const daysLeft = DAYS_PER_SEASON - G.time.day;
  const seasonIcon = { Spring:'🌱', Summer:'☀', Autumn:'🍂', Winter:'❄' }[ch.season] || '◈';

  let statusText;
  if (ch.claimed) statusText = 'CLAIMED';
  else if (ch.done) statusText = 'COMPLETE';
  else if (ch.failed_survive) statusText = 'FAILED';
  else statusText = `${prog.pct}%`;

  let rewardText;
  if (ch.reward_type === 'res') {
    rewardText = Object.entries(ch.reward)
      .filter(([r]) => RES[r])
      .map(([r, a]) => `${RES[r].icon} ${a} ${RES[r].name}`)
      .join(', ');
  } else {
    rewardText = 'Production boost';
  }

  return `<div class="sc-panel ${seasonCls}">
    <div class="sc-head">
      <div class="sc-title">${seasonIcon} ${ch.season.toUpperCase()} CHALLENGE</div>
      <div class="sc-status">${statusText}</div>
    </div>
    <div class="sc-desc">${ch.desc}</div>
    <div class="sc-reward-line">${ch.done ? (ch.claimed ? 'Reward claimed' : 'Reward') : 'Reward'}: ${rewardText}</div>
    <div class="sc-progress"><div class="sc-progress-fill" style="width:${ch.failed_survive && !ch.done ? 0 : prog.pct}%"></div></div>
    <div class="sc-days">
      <span>${ch.done ? (ch.claimed ? '✓ Done' : '✓ Ready to claim') : ch.failed_survive ? '✗ Failed' : `${prog.cur}/${prog.target}`}</span>
      <span>${ch.done || ch.failed_survive ? '' : `${daysLeft}d left`}</span>
    </div>
    ${ch.done && !ch.claimed ? `<button class="exp-collect-btn" style="margin-top:6px;" onclick="claimChallengeReward()">CLAIM REWARD</button>` : ''}
  </div>`;
}

function achievementDone(id) {
  switch (id) {
    case 'first_home': return (G.bldgs.nest || 0) >= 1;
    case 'first_bug': return G.pop.total >= 1;
    case 'working_colony': return employed() >= 3;
    case 'scholar_circle': return !!G.techs.natural_philosophy;
    case 'trader': return !!G.techs.trade_routes;
    case 'winged': return (G.res.elytra || 0) >= 10 || (G.bldgs.flight_tower || 0) >= 1;
    case 'explorer': return (G.stats.expeditions || 0) >= 5;
    case 'seasonal_champ': return (G.stats.challenges || 0) >= 4;
    case 'skybound': return !!G.techs.sky_colonies;
    case 'ascended': return (G.meta.launches || 0) >= 1;
    case 'empire': return G.pop.total >= 50;
    case 'first_blood': return (G.stats.scouts || 0) >= 1;
    case 'seasoned': return (G.fighters || []).some(f => f.level >= 5) || (G.stats.scouts || 0) >= 10;
    case 'elite': return (G.fighters || []).some(f => f.level >= 10);
    case 'jelly_hoard': return (G.res.royal_jelly || 0) >= 20;
    case 'apex_cleared': return !!(G.stats.apex_cleared);
    case 'full_roster': return fightersTotal() > 0 && fightersTotal() >= maxFighters() && maxFighters() > 0;
    case 'scout_veteran': return (G.stats.scouts || 0) >= 25;
    default: return false;
  }
}

function checkAchievements() {
  let gained = 0;
  for (const a of ACHIEVEMENTS) {
    if (G.achievements[a.id]) continue;
    if (!achievementDone(a.id)) continue;
    G.achievements[a.id] = true;

    spawnGatherPop('★ ' + a.name, '', document.getElementById('bot-nav') || document.body);

  return gained;
}

function achievedCount() {

function unseenAchievementCount() {

function markAchievementsSeen() {

/* ── FIGHTER SYSTEM ──────────────────────────── */

let _fighterNameIdx = 0;
function nextFighterName() {
  const used = new Set((G.fighters || []).map(f => f.name));
  for (let i = 0; i < FIGHTER_NAMES.length; i++) {
    const name = FIGHTER_NAMES[(_fighterNameIdx + i) % FIGHTER_NAMES.length];
    if (!used.has(name)) {
      _fighterNameIdx = (_fighterNameIdx + i + 1) % FIGHTER_NAMES.length;
      return name;
    }
  }
  return 'Scout ' + ((G.fighters || []).length + 1);
}

function fighterMaxHp(level) {
  return 10 + (level - 1) * 5;
}

function fighterEffectiveMaxHp(f) {
  const base = fighterMaxHp(f.level);
  if (f.trait === 'ironhide') return Math.floor(base * 1.35);
  return base;
}

function fighterPower(f) {
  let p = 3 + f.level * 2;
  if (f.trait === 'venomous') p += 3;
  return p;
}

function fighterXpNext(level) {
  return level * 20;
}

function recruitFighter() {
  if (!G.techs.combat_training) { toast('Research Combat Training first', 'warn'); return; }
  if ((G.bldgs.training_burrow || 0) === 0) { toast('Build a Training Burrow first', 'warn'); return; }
  if (fightersTotal() >= maxFighters()) { toast('Training Burrow is full', 'warn'); return; }
  if (idle() <= 0) { toast('No idle bugs to recruit', 'warn'); return; }
  const name = nextFighterName();
  // Apply vanguard_discipline legacy: +1 starting level per rank
  const bonusLevels = legacyRank('vanguard_discipline');
  const level = 1 + bonusLevels;
  const maxHp = fighterMaxHp(level);
  const newFighter = {
    id: 'f_' + Date.now() + '_' + Math.floor(Math.random() * 9999),
    name,
    level,
    xp: 0,
    xp_next: fighterXpNext(level),
    hp: maxHp,
    max_hp: maxHp,
    status: 'idle',
    recover_ticks: 0,
    missions: 0,
    kills: 0,
    hero: false,
    trait: null,
    epithet: null,
  };

  // 20% chance this bug shows exceptional promise and becomes a hero
  if (Math.random() < 0.20) {
    const trait = randomHeroTrait();
    const epithet = heroEpithet();
    newFighter.hero = true;
    newFighter.trait = trait;
    newFighter.epithet = epithet;
    if (trait === 'ironhide') {
      newFighter.max_hp = fighterEffectiveMaxHp(newFighter);
      newFighter.hp = newFighter.max_hp;
    }
    G.fighters.push(newFighter);
    log(`★ ${name} joins the fighters — a rare hero emerges: ${epithet} the ${HERO_TRAITS[trait].name}. ${HERO_TRAITS[trait].desc}`);
    toast(`Hero: ${epithet} the ${HERO_TRAITS[trait].name} ${HERO_TRAITS[trait].icon}`);
  } else {
    G.fighters.push(newFighter);
    log(`${name} joins the fighter ranks${bonusLevels > 0 ? ` at Level ${level} (Vanguard legacy)` : ''}.`);
    toast(`Fighter recruited: ${name}${bonusLevels > 0 ? ` (Lv.${level})` : ''}`);
  }
  renderTab();
}

function retireFighter(fid) {
  const idx = (G.fighters || []).findIndex(f => f.id === fid);
  if (idx < 0) return;
  const f = G.fighters[idx];
  if (f.status === 'scouting') { toast('Cannot retire a fighter mid-mission', 'warn'); return; }
  G.fighters.splice(idx, 1);
  log(`${f.name} retires and rejoins the colony.`);
  toast(`${f.name} retired`);
  renderTab();
}

function rushHealFighter(fid) {
  const f = (G.fighters || []).find(f => f.id === fid);
  if (!f || f.status !== 'recovering') { toast('Fighter is not recovering', 'warn'); return; }
  const healPerJelly = 5;
  const jellyCost = Math.max(1, Math.ceil((f.max_hp - f.hp) / healPerJelly));
  if ((G.res.royal_jelly || 0) < jellyCost) {
    toast(`Need ${jellyCost} Royal Jelly to rush heal`, 'warn');
    return;
  }
  G.res.royal_jelly -= jellyCost;
  f.hp = f.max_hp;
  f.status = 'idle';
  f.recover_ticks = 0;
  log(`${f.name} rush-healed with ${jellyCost} Royal Jelly.`);
  toast(`${f.name} fully healed!`);
  renderTab();
}

let _scoutSelection = [];

function toggleFighterSelect(fid) {
  const idx = _scoutSelection.indexOf(fid);
  if (idx >= 0) _scoutSelection.splice(idx, 1);
  else _scoutSelection.push(fid);
  renderTab();
}

function clearScoutSelection() {
  _scoutSelection = [];
}

function canSendScout(zone) {
  if (!G.techs.combat_training) return false;
  if (zone.req && !G.techs[zone.req]) return false;
  if ((G.fighters || []).some(f => f.status === 'scouting' && f.zone === zone.id)) return false;
  return true;
}

function sendScout(zoneId) {
  const zone = TERRITORY_ZONES.find(z => z.id === zoneId);
  if (!zone || !canSendScout(zone)) { toast('Cannot scout this zone', 'warn'); return; }
  const selected = (_scoutSelection || []).filter(fid => {
    const f = (G.fighters || []).find(f => f.id === fid);
    return f && f.status === 'idle';
  });
  if (selected.length < zone.fighters) {
    toast(`Select at least ${zone.fighters} idle fighter${zone.fighters > 1 ? 's' : ''}`, 'warn');
    return;
  }
  const squad = selected.slice(0, Math.max(zone.fighters, selected.length));
  const squadObjs = squad.map(fid => G.fighters.find(f => f.id === fid)).filter(Boolean);
  const hasSwift = squadObjs.some(f => f.trait === 'swift');
  const effectiveDuration = hasSwift ? zone.duration * 0.75 : zone.duration;
  squad.forEach(fid => {
    const f = G.fighters.find(f => f.id === fid);
    if (f) {
      f.status = 'scouting';
      f.zone = zoneId;
      f.scout_elapsed = 0;
      f.scout_duration = effectiveDuration;
    }
  });
  _scoutSelection = [];
  const swiftNote = hasSwift ? ' (Swift: 25% faster)' : '';
  log(`${squad.length} fighter${squad.length > 1 ? 's' : ''} sent to ${zone.name}${swiftNote}.`);
  toast(`Scouting ${zone.name}...${swiftNote}`);
  renderTab();
}

function rollTerritoryReward(zone) {
  const totalW = zone.rewards.reduce((s, r) => s + r.w, 0);
  let rnd = Math.random() * totalW;
  for (const r of zone.rewards) { rnd -= r.w; if (rnd <= 0) return r; }
  return zone.rewards[zone.rewards.length - 1];
}

function resolveScout(zoneId) {
  const zone = TERRITORY_ZONES.find(z => z.id === zoneId);
  if (!zone) return;
  const squad = (G.fighters || []).filter(f => f.zone === zoneId && f.status === 'scouting');
  if (!squad.length) return;

  const totalPower = squad.reduce((s, f) => s + fighterPower(f), 0);
  const roll = 0.75 + Math.random() * 0.5;
  const effectivePower = totalPower * roll;

  let outcome; // 'win' | 'partial' | 'loss'
  if (effectivePower >= zone.power * 0.9) outcome = 'win';
  else if (effectivePower >= zone.power * 0.55) outcome = 'partial';
  else outcome = 'loss';

  // XP awards
  const xpGain = outcome === 'win' ? 15 : outcome === 'partial' ? 8 : 3;
  squad.forEach(f => {
    f.xp += xpGain;
    f.missions = (f.missions || 0) + 1;
    while (f.xp >= f.xp_next) {
      f.xp -= f.xp_next;
      f.level++;
      f.max_hp = fighterMaxHp(f.level);
      f.hp = Math.min(f.max_hp, f.hp + 3); // small HP top-up on level
      f.xp_next = fighterXpNext(f.level);
      log(`⭐ ${f.name} reached Level ${f.level}!`);
      toast(`${f.name} is now Level ${f.level}!`);
    }
  });

  // HP damage
  let dmgBase = 0;
  if (outcome === 'win')     dmgBase = Math.ceil(zone.power * 0.08);
  if (outcome === 'partial') dmgBase = Math.ceil(zone.power * 0.25);
  if (outcome === 'loss')    dmgBase = Math.ceil(zone.power * 0.55);

  const hasRallying = squad.some(f => f.trait === 'rallying');
  squad.forEach(f => {
    let dmg = Math.max(0, dmgBase + Math.floor(Math.random() * 3) - 1);
    if (f.trait === 'steadfast') dmg = Math.floor(dmg * 0.70);
    else if (hasRallying && f.trait !== 'rallying') dmg = Math.floor(dmg * 0.85);
    f.hp = Math.max(1, f.hp - dmg);
    delete f.zone;
    delete f.scout_elapsed;
    delete f.scout_duration;
    if (f.hp < f.max_hp * 0.6) {
      f.status = 'recovering';
      f.recover_ticks = Math.ceil((f.max_hp - f.hp) * 10);
    } else {
      f.status = 'idle';
      f.recover_ticks = 0;
    }
  });

  // Loot
  let gained = [];
  if (outcome !== 'loss') {
    const reward = rollTerritoryReward(zone);
    const lootMult = (outcome === 'partial' ? 0.5 : 1) * (1 + legacyRank('predator_lore') * 0.15) * (squad.some(f => f.trait === 'fortunate') ? 1.3 : 1);
    for (const [res, amt] of Object.entries(reward.loot)) {
      const r = RES[res];
      if (!r) continue;
      const added = Math.min(Math.ceil(amt * lootMult), (maxRes(res) || 99) - (G.res[res] || 0));
      if (added > 0) {
        G.res[res] = (G.res[res] || 0) + added;
        G.vis[res] = true;
        gained.push(`${r.icon}+${added}`);
      }
    }
    // Flag apex clear for achievement
    if (zone.id === 'the_apex') G.stats.apex_cleared = (G.stats.apex_cleared || 0) + 1;
    const lootStr = gained.join(' ');
    const outcomeLabel = outcome === 'partial' ? 'Partial victory' : 'Victory';
    const rival = zone.id.startsWith('rival_') ? primaryRival() : null;
    if (rival) noteRivalOutcome(rival.id, 'repelled');
    log(`${outcomeLabel} at ${zone.name}${rival ? ` against ${rivalFullName(rival)}` : ''}! ${reward.msg} ${lootStr}`);
    toast(`${zone.name}: ${lootStr || 'returned'}`, '');
  } else {
    const rival = zone.id.startsWith('rival_') ? primaryRival() : null;
    if (rival) noteRivalOutcome(rival.id, 'victories');
    log(`Defeat at ${zone.name}${rival ? ` against ${rivalFullName(rival)}` : ''}. The squad retreats with injuries.`, 'bad');
    toast(`Defeat at ${zone.name}. Fighters need recovery.`, 'bad');
  }

  G.stats.scouts = (G.stats.scouts || 0) + 1;
  renderTab();
}

function tickFighters(dt) {
  if (!G.fighters) return;
  const healRate = (G.bldgs.healing_hollow || 0) * (BLDGS.healing_hollow.effects.heal_rate || 1)
    * (capstoneOwned('apex_legacy') ? 1.3 : 1);

  // Tick scouting progress
  for (const f of G.fighters) {
    if (f.status === 'scouting') {
      f.scout_elapsed = (f.scout_elapsed || 0) + dt;
      if (f.scout_elapsed >= f.scout_duration) {
        // Mark done, resolve if all squad members ready
        f._scout_done = true;
      }
    }
  }
  // Resolve completed missions (group by zone)
  const doneZones = new Set(
    G.fighters.filter(f => f._scout_done).map(f => f.zone)
  );
  doneZones.forEach(zoneId => {
    const squad = G.fighters.filter(f => f.zone === zoneId && f._scout_done);
    if (squad.every(f => f._scout_done)) {
      squad.forEach(f => { delete f._scout_done; });
      resolveScout(zoneId);
    }
  });

  // Tick recovery
  if (healRate > 0) {
    for (const f of G.fighters) {
      if (f.status === 'recovering') {
        f.hp = Math.min(f.max_hp, (f.hp || 0) + healRate * dt);
        if (f.hp >= f.max_hp) {
          f.hp = f.max_hp;
          f.status = 'idle';
          f.recover_ticks = 0;
          log(`${f.name} has fully recovered.`);
          toast(`${f.name} recovered!`);
        }
      }
    }
  }
}

    const powerVal = fighterPower(f);
    const heroTrait = f.hero && f.trait && HERO_TRAITS[f.trait] ? HERO_TRAITS[f.trait] : null;
    let card = `<div class="fighter-card ${f.status}${isSelected && f.status === 'idle' ? ' ready' : ''}${f.hero ? ' hero-glow' : ''}" style="${isSelected && f.status==='idle' ? 'border-color:var(--accent);background:var(--accent-dd);' : ''}${f.hero ? 'border-color:' + (heroTrait ? heroTrait.color : '#ffc562') + '33;' : ''}">`;
    card += `<div class="fighter-ico">${f.hero ? (heroTrait ? heroTrait.icon : '★') : (f.status === 'scouting' ? '⊸' : f.status === 'recovering' ? '✺' : '⚔')}</div>`;
    card += `<div class="fighter-info">`;
    const heroNameLine = f.hero && f.epithet ? `<span style="color:${heroTrait ? heroTrait.color : '#ffc562'};font-family:var(--mono);font-size:9px;font-weight:700;margin-left:4px;">${f.epithet}</span>` : '';
    card += `<div class="fighter-name">${f.name}${heroNameLine} <span style="font-family:var(--mono);font-size:9px;color:var(--text-lo)">Lv.${f.level}</span></div>`;
    if (heroTrait) {
      card += `<div style="font-family:var(--mono);font-size:8px;color:${heroTrait.color};letter-spacing:0.8px;margin-bottom:2px;">${heroTrait.icon} ${heroTrait.name.toUpperCase()} HERO · ${heroTrait.desc}</div>`;
    }
    card += `<div class="fighter-meta"><span style="color:${statusColor}">${statusLabel}</span> · Power ${powerVal} · ${f.missions||0} missions</div>`;
    card += `<div class="fighter-hp"><span style="color:${hpColor}">HP ${Math.floor(f.hp)}/${f.max_hp}</span> · XP ${f.xp}/${f.xp_next}</div>`;
    card += `<div class="hp-bar"><div class="hp-fill" style="width:${hpPct}%;background:${hpColor}"></div></div>`;
    card += `<div class="hp-bar" style="margin-top:2px;"><div class="hp-fill" style="width:${xpPct}%;background:var(--purple)"></div></div>`;
    card += `</div>`;
    // Controls
    card += `<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;">`;
    if (f.status === 'idle') {
      const selLabel = isSelected ? 'DESELECT' : 'SELECT';
      card += `<button class="recruit-btn" onclick="toggleFighterSelect('${f.id}')" style="${isSelected ? 'background:var(--accent-d);color:var(--text-hi);' : ''}">${selLabel}</button>`;
      card += `<button class="retire-btn" onclick="retireFighter('${f.id}')">RETIRE</button>`;
    }
    if (f.status === 'recovering') {
      const jellyCost = Math.max(1, Math.ceil((f.max_hp - f.hp) / 5));
      const canRush = (G.res.royal_jelly || 0) >= jellyCost && (G.bldgs.healing_hollow || 0) > 0;
      card += `<button class="rj-rush-btn" onclick="rushHealFighter('${f.id}')" ${canRush ? '' : 'disabled'}>⬥${jellyCost} RUSH</button>`;
      if (noHollow) card += `<div style="font-size:9px;color:var(--red);margin-top:2px;font-family:var(--mono);">NO HOLLOW</div>`;
    }
    card += `</div>`;
    card += `</div>`;
    html += card;
  }

  const burrowCount = G.bldgs.training_burrow || 0;
  const slotsLabel = burrowCount > 0 ? `${fightersTotal()}/${maxFighters()} slots used` : 'Build a Training Burrow to unlock slots';
  html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;margin-top:4px;">
    <span style="font-family:var(--mono);font-size:9px;color:var(--text-lo)">${slotsLabel}</span>
    <button class="recruit-btn" onclick="recruitFighter()" ${canRecruit ? '' : 'disabled'}>+ RECRUIT</button>
  </div>`;

  // ── Mission dispatch ──
  const selected = (_scoutSelection || []).filter(fid => (G.fighters || []).find(f => f.id === fid && f.status === 'idle'));
  if (selected.length > 0) {
    const selectedFighters = selected.map(fid => G.fighters.find(f => f.id === fid)).filter(Boolean);
    const squadPower = selectedFighters.reduce((s, f) => s + fighterPower(f), 0);
    html += `<div class="guide-panel" style="margin-bottom:10px;border-color:var(--accent-d);">
      <div class="guide-title" style="color:var(--accent)">DISPATCH READY — ${selected.length} fighter${selected.length>1?'s':''} selected · Squad Power: ${squadPower}</div>
      <div class="guide-copy">Choose a zone below to send your squad. Zones needing more fighters than selected are greyed out.</div>
      <button class="retire-btn" onclick="clearScoutSelection();renderTab();" style="margin-top:6px;">CLEAR SELECTION</button>
    </div>`;
  }

  // ── Territory zones ──
  html += `<div class="sh">DANGEROUS TERRITORY</div>`;
  const tiers = [
    { label:'── PREDATOR BURROWS ──────────', range:[1,3] },
    { label:'── RIVAL COLONY ──────────────', range:[4,6] },
    { label:'── ANCIENT CHAMBERS ──────────', range:[7,8] },
    { label:'── THE APEX ───────────────────', range:[9,9] },
  ];
  for (const tier of tiers) {
    const tieredZones = TERRITORY_ZONES.filter(z => z.tier >= tier.range[0] && z.tier <= tier.range[1]);
    if (!tieredZones.length) continue;
    html += `<div class="tier-zone-label">${tier.label}</div>`;
    for (const zone of tieredZones) {
      const isActive = (G.fighters || []).some(f => f.status === 'scouting' && f.zone === zone.id);
      const unlocked = !zone.req || !!G.techs[zone.req];
      const squadPower = selected.map(fid => G.fighters.find(f=>f.id===fid)).filter(Boolean).reduce((s,f)=>s+fighterPower(f),0);
      const enoughSelected = selected.length >= zone.fighters;
      const canSend = unlocked && !isActive && enoughSelected && canSendScout(zone);
      let cls = 'zone-card';
      if (!unlocked) cls += ' locked';
      else if (isActive) cls += ' active';
      else if (canSend) cls += ' can';
      if (zone.boss) cls += ' boss';

      const scoutingSquad = (G.fighters || []).filter(f => f.status === 'scouting' && f.zone === zone.id);
      const pct = scoutingSquad.length > 0 ? Math.min(100, ((scoutingSquad[0].scout_elapsed || 0) / scoutingSquad[0].scout_duration) * 100) : 0;
      const timeLeft = scoutingSquad.length > 0 ? Math.max(0, scoutingSquad[0].scout_duration - (scoutingSquad[0].scout_elapsed || 0)) : zone.duration;

      html += `<div class="${cls}" onclick="${canSend ? `sendScout('${zone.id}')` : ''}">`;
      html += `<div class="zone-head"><div class="zone-ico">${zone.icon}</div><div class="zone-title">${zone.name}</div><div class="zone-tier">TIER ${zone.tier}${zone.boss ? ' · BOSS' : ''}</div></div>`;
      html += `<div class="zone-desc">${zoneDescText(zone)}</div>`;
      html += `<div class="zone-meta">`;
      html += `<span>⚔ ${zone.fighters} fighter${zone.fighters>1?'s':''} min</span>`;
      html += `<span>⏱ ${fmtExpTime(zone.duration)}</span>`;
      html += `<span class="zone-power">⚡ Zone power: ${zone.power}</span>`;
      if (!unlocked) html += `<span class="zone-req">Requires: ${TECHS[zone.req]?.name || zone.req}</span>`;
      if (isActive) {
        html += `<span style="color:var(--sky)">◉ In progress · ${fmtExpTime(timeLeft)}</span>`;
      }
      html += `</div>`;
      if (isActive) {
        html += `<div class="exp-progress" style="margin-top:6px;"><div class="exp-progress-fill" style="width:${pct}%;background:var(--sky)"></div></div>`;
      }
      if (!unlocked) html += ``;
      else if (!isActive && selected.length > 0 && !enoughSelected) {
        html += `<div style="font-size:9px;color:var(--text-lo);font-family:var(--mono);margin-top:4px;">Need ${zone.fighters} fighters · ${selected.length} selected</div>`;
      } else if (canSend) {
        html += `<div style="font-size:9px;color:var(--accent);font-family:var(--mono);margin-top:4px;">Click to dispatch ${selected.length} fighter${selected.length>1?'s':''}</div>`;
      }
      html += `</div>`;
    }
  }

  if (!G.fighters || G.fighters.length === 0) {
    html += `<div class="notice-panel" style="margin-top:10px;">Recruit a fighter to begin scouting. Tap SELECT on an idle fighter, then tap a zone to dispatch.</div>`;
  }

  return html;
}

function spawnGatherPop(text, colorClass, anchorEl) {
  const pop = document.createElement('div');
  pop.className = 'gather-pop' + (colorClass ? ' ' + colorClass : '');
  pop.textContent = text;
  const rect = anchorEl ? anchorEl.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight - 80, width: 0 };
  pop.style.left = (rect.left + rect.width / 2 - 20 + (Math.random() - 0.5) * 30) + 'px';
  pop.style.top  = (rect.top - 4) + 'px';
  document.body.appendChild(pop);
  pop.addEventListener('animationend', () => pop.remove());
}

function juiceMilestoneBurst(x, y, color) {
  color = color || 'var(--accent)';
  for (let i = 0; i < 3; i++) {
    const ring = document.createElement('div');
    ring.className = 'milestone-burst';
    const size = 36 + i * 22;
    ring.style.cssText = `width:${size}px;height:${size}px;left:${x - size/2}px;top:${y - size/2}px;border-color:${color};animation-delay:${i * 0.08}s;`;
    document.body.appendChild(ring);
    ring.addEventListener('animationend', () => ring.remove());
  }
}

function juiceFlash(color, alpha) {
  const el = document.getElementById('juice-flash');
  if (!el) return;
  el.style.background = color || 'rgba(94,229,143,1)';
  el.style.transition = 'none';
  el.style.opacity = String(alpha || 0.07);
  requestAnimationFrame(() => {
    el.style.transition = 'opacity 0.5s ease';
    el.style.opacity = '0';
  });
}

function juiceGatherButton() {

  btn.classList.remove('gather-punching');
