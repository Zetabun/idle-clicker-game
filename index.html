}

/* ── EXPEDITION SYSTEM ──────────────────────── */

function expZoneAvailable(zone) {
  return !zone.req || !!G.techs[zone.req];
}

function expActiveCount() {
  return (G.expeditions || []).length;
}

function expSlotsFull() {
  return expActiveCount() >= MAX_EXPEDITIONS;
}

function canSendExpedition(zone) {
  if (!expZoneAvailable(zone)) return false;
  if (expSlotsFull()) return false;
  if (idle() < zone.bugs) return false;
  if ((G.expeditions || []).some(e => e.zone === zone.id)) return false;
  return true;
}

function sendExpedition(zoneId) {
  const zone = EXPEDITIONS.find(z => z.id === zoneId);
  if (!zone || !canSendExpedition(zone)) {
    toast(expSlotsFull() ? 'All expedition slots full' : idle() < zone.bugs ? 'Not enough idle bugs' : 'Cannot explore yet', 'warn');
    return;
  }
  if (!G.expeditions) G.expeditions = [];
  G.expeditions.push({
    zone: zone.id,
    bugs: zone.bugs,
    duration: zone.duration,
    elapsed: 0,
    done: false
  });
  log(`Expedition sent: ${zone.name} (${zone.bugs} bug${zone.bugs > 1 ? 's' : ''})`);
  toast(`Exploring ${zone.name}...`);
  renderTab();
}

function rollExpeditionReward(zone) {
  const totalW = zone.rewards.reduce((s, r) => s + r.w, 0);
  let rnd = Math.random() * totalW;
  for (const reward of zone.rewards) {
    rnd -= reward.w;
    if (rnd <= 0) return reward;
  }
  return zone.rewards[zone.rewards.length - 1];
}

function collectExpedition(idx) {
  if (!G.expeditions || !G.expeditions[idx]) return;
  const exp = G.expeditions[idx];
  if (!exp.done) return;
  const zone = EXPEDITIONS.find(z => z.id === exp.zone);
  if (!zone) { G.expeditions.splice(idx, 1); renderTab(); return; }
  const reward = rollExpeditionReward(zone);
  const gained = [];
  for (const [res, amt] of Object.entries(reward.loot)) {
    if (G.res[res] === undefined) continue;
    const added = Math.min(amt, maxRes(res) - (G.res[res] || 0));
    if (added > 0) {
      G.res[res] += added;
      G.vis[res] = true;
      gained.push(`${RES[res].icon}+${added}`);
    }
  }
  G.expeditions.splice(idx, 1);
  G.stats.expeditions = (G.stats.expeditions || 0) + 1;
  const lootStr = gained.join(' ');
  log(`Expedition returned from ${zone.name}: ${reward.msg} ${lootStr}`);
  toast(`${zone.name}: ${lootStr}`, '');
  renderTab();
}

function tickExpeditions(dt) {
  if (!G.expeditions) return;
  for (const exp of G.expeditions) {
    if (exp.done) continue;
    exp.elapsed += dt;
    if (exp.elapsed >= exp.duration) {
      exp.elapsed = exp.duration;
      exp.done = true;
    }
  }
}

function fmtExpTime(secs) {
  const left = Math.max(0, Math.ceil(secs));
  if (left >= 60) return `${Math.floor(left / 60)}m ${left % 60}s`;
  return `${left}s`;
}

function expeditionPanel() {
  if (G.pop.total < 1) return '';
  const available = EXPEDITIONS.filter(z => expZoneAvailable(z));
  if (!available.length && !(G.expeditions || []).length) return '';

  let html = `<div class="exp-panel">`;
  html += `<div class="exp-title">EXPEDITIONS · ${expActiveCount()}/${MAX_EXPEDITIONS} ACTIVE</div>`;

  if ((G.expeditions || []).length > 0) {
    html += `<div class="exp-slots">`;
    for (let i = 0; i < G.expeditions.length; i++) {
      const exp = G.expeditions[i];
      const zone = EXPEDITIONS.find(z => z.id === exp.zone);
      if (!zone) continue;
      const pct = Math.min(100, (exp.elapsed / exp.duration) * 100);
      const timeLeft = exp.duration - exp.elapsed;
      html += `<div class="exp-active${exp.done ? ' exp-reward-flash' : ''}">
        <div class="exp-active-head">
          <div class="exp-active-name">${zone.icon} ${zone.name}</div>
          <div class="exp-active-time">${exp.done ? 'RETURNED' : fmtExpTime(timeLeft)}</div>
        </div>
        <div class="exp-active-bugs">${exp.bugs} bug${exp.bugs > 1 ? 's' : ''} exploring</div>
        <div class="exp-progress"><div class="exp-progress-fill${exp.done ? ' done' : ''}" style="width:${pct}%"></div></div>
        ${exp.done ? `<button class="exp-collect-btn" onclick="collectExpedition(${i})">COLLECT REWARDS</button>` : ''}
      </div>`;
    }
    html += `</div>`;
  }

  html += `<div style="font-size:10px;color:var(--text-lo);margin-bottom:6px;">Send idle bugs to explore zones and bring back random loot.</div>`;

  for (const zone of EXPEDITIONS) {
    const unlocked = expZoneAvailable(zone);
    const alreadySent = (G.expeditions || []).some(e => e.zone === zone.id);
    const can = canSendExpedition(zone);
    let cls = 'exp-zone';
    if (!unlocked) cls += ' locked';
    else if (can) cls += ' can';
    const bugLabel = `${zone.bugs} bug${zone.bugs > 1 ? 's' : ''} · ${fmtExpTime(zone.duration)}`;
    html += `<div class="${cls}" onclick="${can ? `sendExpedition('${zone.id}')` : ''}" style="margin-bottom:6px;">
      <div class="exp-zone-ico">${zone.icon}</div>
      <div class="exp-zone-info">
        <div class="exp-zone-name">${zone.name}</div>
        <div class="exp-zone-desc">${zone.desc}</div>
        <div class="exp-zone-meta">${bugLabel}</div>
        ${!unlocked ? `<div class="exp-zone-lock">Requires: ${TECHS[zone.req]?.name || zone.req}</div>` : ''}
        ${alreadySent ? `<div class="exp-zone-meta" style="color:var(--amber)">Already exploring</div>` : ''}
      </div>
    </div>`;
  }

  html += `</div>`;
  return html;
}

function generateChallenge(season, year) {
  const templates = CHALLENGE_TEMPLATES[season];
  if (!templates || !templates.length) return null;

  // Filter to challenges the player can actually attempt
  const viable = templates.filter(t => {
    if (t.stat === 'traded_season' && !G.techs.trade_routes) return false;
    if (t.stat === 'crafted_season' && G.stats.crafted === 0 && !G.techs.weaving && !G.techs.chitin_harvesting) return false;
    if (t.stat === 'insight_season' && !G.techs.natural_philosophy) return false;
    if (t.stat === 'exp_season' && G.pop.total < 1) return false;
    if (t.stat === 'scholar_target' && !G.techs.natural_philosophy) return false;
    if (t.stat === 'researched_season' && !G.techs.natural_philosophy) return false;
    return true;
  });
  if (!viable.length) return null;

  const template = viable[Math.floor(Math.random() * viable.length)];
  const difficulty = Math.max(0, year - 1);
  const target = Math.max(1, Math.round(template.base + template.scale * difficulty));

  // Scale rewards with difficulty
  const rewardMult = 1 + difficulty * 0.15;
  const scaledReward = {};
  for (const [k, v] of Object.entries(template.reward)) {
    scaledReward[k] = typeof v === 'number' ? Math.round(v * rewardMult) : v;
  }

  return {
    id: template.id,
    season,
    year,
    desc: template.desc.replace('{n}', target),
    stat: template.stat,
    target,
    current: 0,
    done: false,
    claimed: false,
    reward_type: template.reward_type,
    reward: scaledReward,
    // Tracking snapshots (set at challenge start)
    snap_built: G.stats.built || 0,
    snap_crafted: G.stats.crafted || 0,
    snap_traded: G.stats.traded || 0,
    snap_researched: G.stats.researched || 0,
    snap_hd: G.stats.total_hd || 0,
    snap_exp: G.stats.expeditions || 0,
    snap_pop: G.pop.total || 0,
    snap_insight: G.res.insight || 0,
    snap_produced: totalResourceStock(),
    failed_survive: false,
  };
}

function challengeProgress(ch) {
  if (!ch) return { cur: 0, target: 1, pct: 0 };
  let cur = 0;
  switch (ch.stat) {
    case 'pop_gained':
      cur = Math.max(0, G.pop.total - ch.snap_pop);
      break;
    case 'pop_target':
      cur = G.pop.total;
      break;
    case 'built_season':
      cur = (G.stats.built || 0) - ch.snap_built;
      break;
    case 'hd_season':
      cur = Math.floor((G.stats.total_hd || 0) - ch.snap_hd);
      break;
    case 'crafted_season':
      cur = (G.stats.crafted || 0) - ch.snap_crafted;
      break;
    case 'researched_season':
      cur = (G.stats.researched || 0) - ch.snap_researched;
      break;
    case 'produced_season':
      cur = Math.floor(totalResourceStock() - ch.snap_produced);
      if (cur < 0) cur = 0;
      break;
    case 'employed_target':
      cur = employed();
      break;
    case 'forager_target':
      cur = G.jobs.forager || 0;
      break;
    case 'scholar_target':
      cur = G.jobs.scholar || 0;
      break;
    case 'insight_season':
      cur = Math.floor(Math.max(0, (G.res.insight || 0) - ch.snap_insight + (ch._insight_spent || 0)));
      break;
    case 'stock_target':
    case 'stock_end':
      cur = Math.floor(totalResourceStock());
      break;
    case 'leaves_target':
      cur = Math.floor(G.res.leaves || 0);
      break;
    case 'traded_season':
      cur = (G.stats.traded || 0) - ch.snap_traded;
      break;
    case 'exp_season':
      cur = (G.stats.expeditions || 0) - ch.snap_exp;
      break;
    case 'hd_floor':
      cur = ch.failed_survive ? 0 : ch.target;
      break;
    case 'no_starvation':
      cur = ch.failed_survive ? 0 : 1;
      break;
    case 'bldgs_target':
      cur = Object.values(G.bldgs).reduce((s, v) => s + v, 0);
      break;
    default:
      cur = 0;
  }
  const pct = Math.min(100, Math.round((cur / Math.max(1, ch.target)) * 100));
  return { cur, target: ch.target, pct };
}

function checkChallenge() {
  if (!G.challenge || G.challenge.done) return;
  const ch = G.challenge;

  // Check survival-type challenges for failure
  if (ch.stat === 'hd_floor' && (G.res.honeydew || 0) < ch.target) {
    ch.failed_survive = true;
  }
  if (ch.stat === 'no_starvation' && G.res.honeydew <= 0.01 && G.pop.total > 0) {
    ch.failed_survive = true;
  }

  const prog = challengeProgress(ch);
  ch.current = prog.cur;
  if (prog.cur >= ch.target && !ch.failed_survive) {
    ch.done = true;
  }
}

function claimChallengeReward() {
  if (!G.challenge || !G.challenge.done || G.challenge.claimed) return;
  const ch = G.challenge;
  ch.claimed = true;
  G.stats.challenges = (G.stats.challenges || 0) + 1;

  if (ch.reward_type === 'res') {
    const gained = [];
    for (const [res, amt] of Object.entries(ch.reward)) {
      if (G.res[res] === undefined) continue;
      const added = Math.min(amt, maxRes(res) - (G.res[res] || 0));
      if (added > 0) {
        G.res[res] += added;
        G.vis[res] = true;
        gained.push(`${RES[res].icon}+${added}`);
      }
    }
    log(`Season challenge complete! ${gained.join(' ')}`);
    toast(`Challenge reward: ${gained.join(' ')}`);
  } else if (ch.reward_type === 'boost') {
    if (ch.reward.hd_boost) {
      G.events.active = 'hd_boost';
      G.events.ticks_left = ch.reward.hd_boost;
      log('Season challenge complete! Honeydew production boosted.');
      toast('Challenge reward: production boost!');
    }
    if (ch.reward.prod_boost) {
      G.events.active = 'hd_boost';
      G.events.ticks_left = ch.reward.prod_boost;
      log('Season challenge complete! Production boosted.');
      toast('Challenge reward: production boost!');
    }
    if (ch.reward.storage_boost) {
      // Grant a cache of mixed resources instead
      const bonus = [['leaves', 30], ['dirt', 25], ['honeydew', 40]];
      const gained = [];
      for (const [res, amt] of bonus) {
        const added = Math.min(amt, maxRes(res) - (G.res[res] || 0));
        if (added > 0) {
          G.res[res] += added;
          gained.push(`${RES[res].icon}+${added}`);
        }
      }
      log(`Season challenge complete! Stockpile bonus: ${gained.join(' ')}`);
      toast(`Challenge reward: ${gained.join(' ')}`);
    }
  }
  renderTab();
}

function onSeasonChange(newSeason) {
  // Auto-generate a new challenge for the new season
  if (G.pop.total >= 1 || G.stats.built > 0) {
    G.challenge = generateChallenge(newSeason, G.time.year);
    if (G.challenge) {
      log(`Season challenge: ${G.challenge.desc}`);
      toast(`New challenge: ${G.challenge.desc}`);
    }
  }
}

function seasonChallengePanel() {
  const ch = G.challenge;
  if (!ch) {
    // No challenge yet - show hint if player has started
    if (G.pop.total < 1 && G.stats.built === 0) return '';
    return '';
  }

  // Don't show challenges from a past season (missed it)
  const currentSeason = seasonName();
  if (ch.season !== currentSeason && !ch.done) {
    return '';
  }

  const prog = challengeProgress(ch);
  const seasonCls = ch.done ? 'done' : ch.season.toLowerCase();
  const daysLeft = DAYS_PER_SEASON - G.time.day;
  const seasonIcon = { Spring:'🌱', Summer:'☀', Autumn:'🍂', Winter:'❄' }[ch.season] || '◈';

  let statusText;
  if (ch.claimed) statusText = 'CLAIMED';
  else if (ch.done) statusText = 'COMPLETE';
  else if (ch.failed_survive) statusText = 'FAILED';
  else statusText = `${prog.pct}%`;

  let rewardText;
  if (ch.reward_type === 'res') {
    rewardText = Object.entries(ch.reward)
      .filter(([r]) => RES[r])
      .map(([r, a]) => `${RES[r].icon} ${a} ${RES[r].name}`)
      .join(', ');
  } else {
    rewardText = 'Production boost';
  }

  return `<div class="sc-panel ${seasonCls}">
    <div class="sc-head">
      <div class="sc-title">${seasonIcon} ${ch.season.toUpperCase()} CHALLENGE</div>
      <div class="sc-status">${statusText}</div>
    </div>
    <div class="sc-desc">${ch.desc}</div>
    <div class="sc-reward-line">${ch.done ? (ch.claimed ? 'Reward claimed' : 'Reward') : 'Reward'}: ${rewardText}</div>
    <div class="sc-progress"><div class="sc-progress-fill" style="width:${ch.failed_survive && !ch.done ? 0 : prog.pct}%"></div></div>
    <div class="sc-days">
      <span>${ch.done ? (ch.claimed ? '✓ Done' : '✓ Ready to claim') : ch.failed_survive ? '✗ Failed' : `${prog.cur}/${prog.target}`}</span>
      <span>${ch.done || ch.failed_survive ? '' : `${daysLeft}d left`}</span>
    </div>
    ${ch.done && !ch.claimed ? `<button class="exp-collect-btn" style="margin-top:6px;" onclick="claimChallengeReward()">CLAIM REWARD</button>` : ''}
  </div>`;
}

function achievementDone(id) {
  switch (id) {
    case 'first_home': return (G.bldgs.nest || 0) >= 1;
    case 'first_bug': return G.pop.total >= 1;
    case 'working_colony': return employed() >= 3;
    case 'scholar_circle': return !!G.techs.natural_philosophy;
    case 'trader': return !!G.techs.trade_routes;
    case 'winged': return (G.res.elytra || 0) >= 10 || (G.bldgs.flight_tower || 0) >= 1;
    case 'explorer': return (G.stats.expeditions || 0) >= 5;
    case 'seasonal_champ': return (G.stats.challenges || 0) >= 4;
    case 'skybound': return !!G.techs.sky_colonies;
    case 'ascended': return (G.meta.launches || 0) >= 1;
    case 'empire': return G.pop.total >= 50;
    default: return false;
  }
}

function checkAchievements() {
  let gained = 0;
  for (const a of ACHIEVEMENTS) {
    if (G.achievements[a.id]) continue;
    if (!achievementDone(a.id)) continue;
    G.achievements[a.id] = true;
    gained += 1;
    log(`Achievement unlocked: ${a.name}`);
    toast(`Achievement: ${a.name}`);
  }
  return gained;
}

function achievedCount() {
  return Object.values(G.achievements).filter(Boolean).length;
}

function unseenAchievementCount() {
  return Math.max(0, achievedCount() - (G.meta.seen_achievements || 0));
}

function markAchievementsSeen() {
  if (!G.meta) return;
  G.meta.seen_achievements = achievedCount();
}

function tutorialDismissHTML() {
  return `<div class="tutorial-actions"><button class="save-link tutorial-dismiss" onclick="hideTutorials()">HIDE TIPS</button></div>`;
}

function hideTutorials() {
  if (!G.meta) return;
  G.meta.tutorial_hidden = true;
  renderTab();
  saveGame();
}

function doGather() {
  const season = seasonName();
  const mod = S_MOD[season].honeydew ?? 1;
  const added = Math.min(maxRes('honeydew') - G.res.honeydew, gatherPower() * mod);
  G.res.honeydew = Math.min(maxRes('honeydew'), G.res.honeydew + Math.max(0.5, added));
  const vaultBonus = (G.bldgs.amber_vault || 0) * (buildingEffects('amber_vault').gather_bonus || 0);
  const amberRushBonus = G.events.active === 'amber_rush' ? 0.12 : 0;
  const leafChance = (capstoneOwned('amber_monolith') ? 0.30 : 0.18) + vaultBonus + amberRushBonus;
  const dirtChance = (capstoneOwned('amber_monolith') ? 0.22 : 0.12) + vaultBonus + amberRushBonus;
  if (Math.random() < leafChance) {
    G.vis.leaves = true;
    G.res.leaves = Math.min(maxRes('leaves'), G.res.leaves + 1);
  }
  if (Math.random() < dirtChance) {
    G.vis.dirt = true;
    G.res.dirt = Math.min(maxRes('dirt'), G.res.dirt + 1);
  }
  if ((capstoneOwned('amber_monolith') || (G.bldgs.amber_vault || 0) > 0) && Math.random() < (0.08 + vaultBonus)) {
    const stash = Math.random() < 0.55 ? 'leaves' : 'dirt';
    G.vis[stash] = true;
    G.res[stash] = Math.min(maxRes(stash), G.res[stash] + (G.events.active === 'amber_rush' ? 3 : 2));
  }
  if (G.techs.sky_colonies && Math.random() < (G.events.active === 'star_current' ? 0.16 : 0.08)) {
    G.vis.aether = true;
    G.res.aether = Math.min(maxRes('aether'), G.res.aether + 1 + Math.floor((G.meta.launches || 0) / 2) + (G.events.active === 'star_current' ? 2 : 0));
  }
  const btn = document.getElementById('gather-btn');
  if (btn) {
    btn.style.boxShadow = '0 0 8px #22c55e88';
    setTimeout(() => { btn.style.boxShadow = ''; }, 200);
  }
}

function doBuild(bid) {
  const def = BLDGS[bid];
  if (!def || !G.unlocks.bldgs[bid]) return;
  if (def.max && G.bldgs[bid] >= def.max) {
    toast('Maximum reached!', 'warn');
    return;
  }
  const cost = bldgCost(bid);
  if (!canAfford(cost)) {
    toast('Not enough resources', 'warn');
    return;
  }
  for (const [r, a] of Object.entries(cost)) G.res[r] -= a;
  G.bldgs[bid]++;
  G.stats.built++;
  log(`Built: ${displayBuildingName(bid)} (${G.bldgs[bid]})`);
  toast(displayBuildingName(bid) + ' constructed');
  if (!G.challenge && G.stats.built >= 1) {
    G.challenge = generateChallenge(seasonName(), G.time.year);
    if (G.challenge) toast(`New challenge: ${G.challenge.desc}`);
  }
  if (bid === 'nest' && G.pop.total === 0) {
    G.hatch.progress = Math.max(G.hatch.progress, 0.55);
    log('The first nest warms a dormant clutch of eggs.');
    toast('Egg clutch warmed');
  }
  renderTab();
}

function doResearch(tid) {
  const def = TECHS[tid];
  if (!def || G.techs[tid]) return;
  if (!canAffordTech(tid)) {
    toast('Cannot research yet', 'warn');
    return;
  }
  for (const [r, a] of Object.entries(def.cost)) G.res[r] -= a;
  G.techs[tid] = true;
  G.stats.researched++;
  (def.unlocks_res || []).forEach(r => { G.vis[r] = true; });
  (def.unlocks_jobs || []).forEach(j => { G.unlocks.jobs[j] = true; });
  (def.unlocks_bldgs || []).forEach(b => { G.unlocks.bldgs[b] = true; });
  log(`Discovered: ${def.name}`);
  toast('Research: ' + def.name);
  renderTab();
}

function assignJob(jid, delta) {
  if (delta > 0 && idle() <= 0) {
    toast('No idle bugs', 'warn');
    return;
  }
  if (delta < 0 && (G.jobs[jid] || 0) <= 0) return;
  G.jobs[jid] = Math.max(0, (G.jobs[jid] || 0) + delta);
  renderTab();
}

function doCraft(cid) {
  const craft = CRAFTS.find(c => c.id === cid);
  if (!craft || !G.techs[craft.req] || !lineageStageUnlocked(craft)) return;
  const disc = craftDisc();
  const inCost = {};
  for (const [r, a] of Object.entries(craft.input)) inCost[r] = Math.max(1, Math.floor(a * disc));
  if (!canAfford(inCost)) {
    toast('Not enough resources', 'warn');
    return;
  }
  for (const [r, a] of Object.entries(inCost)) G.res[r] -= a;
  for (const [r, a] of Object.entries(craft.output)) {
    G.res[r] = Math.min(maxRes(r), (G.res[r] || 0) + a);
    G.vis[r] = true;
  }
  const notes = applySpecialRewards(craft.special);
  G.stats.crafted++;
  log(`Crafted: ${craft.name}${notes.length ? ' · ' + notes.join(', ') : ''}`);
  toast(notes.length ? `Crafted: ${craft.name} · ${notes[0]}` : 'Crafted: ' + craft.name);
}

function doTrade(tid) {
  const tr = TRADES.find(t => t.id === tid);
  if (!tr || !G.techs[tr.req] || !lineageStageUnlocked(tr)) return;
  if (!canAfford(tr.sell)) {
    toast('Not enough resources', 'warn');
    return;
  }
  const mult = tradeMult();
  for (const [r, a] of Object.entries(tr.sell)) G.res[r] -= a;
  for (const [r, a] of Object.entries(tr.buy)) {
    const got = Math.floor(a * mult);
    G.res[r] = Math.min(maxRes(r), (G.res[r] || 0) + got);
    G.vis[r] = true;
  }
  const notes = applySpecialRewards(tr.special);
  G.stats.traded++;
  log(`Trade completed: ${tr.name}${notes.length ? ' · ' + notes.join(', ') : ''}`);
  toast(notes.length ? `Trade: ${tr.name} · ${notes[0]}` : `Trade: ${tr.name}`);
}


function buyLegacy(id) {
  const node = LEGACY_TREE[id];
  if (!node) return;
  const activeCapstone = ownedCapstoneId();
  if (node.capstone && activeCapstone && activeCapstone !== id) {
    toast('Another capstone already defines this lineage', 'warn');
    return;
  }
  if (!legacyUnlocked(id)) {
    toast(node.capstone ? 'Finish the branch and keep capstones exclusive' : 'Legacy branch locked', 'warn');
    return;
  }
  const cost = legacyCost(id);
  if (cost === null) {
    toast('Legacy node mastered', 'warn');
    return;
  }
  if ((G.meta.nectar || 0) < cost) {
    toast('Not enough Royal Nectar', 'warn');
    return;
  }
  G.meta.nectar -= cost;
  G.meta.legacy[id] = legacyRank(id) + 1;
  syncLineageUnlocks();
  log(`Legacy unlocked: ${node.name} ${G.meta.legacy[id]}/${legacyMaxRank(id)}`);
  toast(`Legacy: ${node.name}`);
  renderAll();
}

function calcLaunchReward() {
  if (!G.techs.sky_colonies) return 0;
  const score =
    (G.res.elytra || 0) +
    ((G.res.skyglass || 0) * 2.5) +
    ((G.res.aether || 0) / 8) +
    ((G.stats.total_hd || 0) / 420) +
    ((G.meta.launches || 0) * 3);
  const capstoneMult = capstoneOwned('celestial_throne') ? 1.25 : 1;
  const milestoneMult = 1 + milestoneLaunchBonus();
  const researchMult = 1 + celestialResearchLaunchBonus();
  const projectMult = 1 + projectLaunchBonusMult();
  const flatBonus = projectLaunchFlatBonus();
  return Math.max(1, Math.floor((score / 10) * capstoneMult * milestoneMult * researchMult * projectMult) + flatBonus);
}


function endingTitleFor(def) {
  if (!def) return 'Unfinished Skies';
  if (def.id === 'sovereign_brood') return 'The Sovereign Brood Ascends';
  if (def.id === 'amber_citadel') return 'The Amber Citadel Endures';
  if (def.id === 'astral_ark') return 'The Astral Ark Takes Flight';
  return def.title;
}

function endingBodyFor(state, def, reward) {
  const population = state.pop.total || 0;
  const launches = (state.meta && state.meta.launches) || 0;
  const trades = (state.stats && state.stats.traded) || 0;
  const stock = Math.floor(totalResourceStock(state));
  const nurses = (state.jobs && state.jobs.nurse) || 0;
  const excavators = (state.jobs && state.jobs.excavator) || 0;
  const navigators = (state.jobs && state.jobs.navigator) || 0;
  const aether = Math.floor((state.res && state.res.aether) || 0);
  const skyglass = Math.floor((state.res && state.res.skyglass) || 0);

  if (!def) {
    return `Your colony launched before any grand lineage project was completed. Even so, the swarm has learned enough to seed a stronger next run. The sky remembers unfinished ambition, and ${reward} Royal Nectar now waits to be spent on a more deliberate legacy.`;
  }
  if (def.id === 'sovereign_brood') {
    const broodTone = population >= 60 ? 'a thunderous imperial swarm' : population >= 45 ? 'a disciplined royal brood' : 'a rising brood-kingdom';
    return `The colony leaves the garden as ${broodTone}. ${population} bugs answered the final brood call, and ${nurses} Nurses kept the hatch cycle hot until the sky itself felt crowded. What began as a hungry cluster becomes a living crown, carrying ${reward} Royal Nectar into the next generation.`;
  }
  if (def.id === 'amber_citadel') {
    const marketTone = trades >= 18 ? 'merchant-roads of amber and resin' : 'fault lines packed with deliberate order';
    return `The colony does not merely depart. It seals the earth behind it, turning stockpiles into a monument of permanence. ${stock} total stored resources and ${excavators} Excavators forged ${marketTone}, until the Amber Citadel could bankroll a future colony outright. The launch leaves behind a treasury and carries ${reward} Royal Nectar forward.`;
  }
  if (def.id === 'astral_ark') {
    const skyTone = aether >= 70 || skyglass >= 30 ? 'a luminous star-fleet cradle' : 'a patient ark of wind and light';
    return `The colony rises as ${skyTone}. ${navigators} Navigators charted the upper currents while ${aether} Aether and ${skyglass} Skyglass were bent into a route no garden-born swarm could have imagined. This launch feels less like escape and more like succession: a throne translated into orbit, with ${reward} Royal Nectar carried into the next ascent.`;
  }
  return `${def.title} is complete, and the colony launches with ${reward} Royal Nectar to shape the next run.`;
}

function endingSummaryLine(def) {
  if (!def) return 'No lineage project was completed during this run.';
  return def.reward || `${def.title} carries its payoff into the next launch.`;
}

function buildLaunchEnding(state, reward) {
  const def = activeLineageProject(state);
  const projectComplete = !!(def && projectDone(def.id, state));
  const activeDef = projectComplete ? def : null;
  const capstone = ownedCapstoneId((state.meta || {}).legacy ? state.meta : G.meta);
  return {
    id: `ending_${Date.now()}`,
    title: endingTitleFor(activeDef),
    capstone: capstone || 'none',
    project_id: activeDef ? activeDef.id : null,
    project_title: activeDef ? activeDef.title : 'Unfinished Skies',
    launches: ((state.meta && state.meta.launches) || 0) + 1,
    nectar_gained: reward,
    year: state.time ? state.time.year : 1,
    population: state.pop ? (state.pop.total || 0) : 0,
    total_stock: Math.floor(totalResourceStock(state)),
    trades: state.stats ? (state.stats.traded || 0) : 0,
    aether: Math.floor((state.res && state.res.aether) || 0),
    skyglass: Math.floor((state.res && state.res.skyglass) || 0),
    body: endingBodyFor(state, activeDef, reward),
    summary: endingSummaryLine(activeDef),
    next_hint: activeDef
      ? `Your ${activeDef.title} chronicle has been added to the Legacy tab. The next run can follow the same lineage or respec into another capstone path.`
      : 'You launched without a finished lineage project. On a future run, completing one will unlock a unique ending chronicle.'
  };
}

function offlineHistoryCards() {
  const history = Array.isArray(G.meta && G.meta.offline_history) ? G.meta.offline_history : [];
  if (!history.length) {

function buildOfflineSummary(seconds) {
  const cappedSeconds = Math.min(seconds, 3600);
  const minutes = Math.floor(cappedSeconds / 60);
  const secondsLeft = cappedSeconds % 60;
  const appliedLabel = `${minutes}m ${secondsLeft}s`;
  const ratesNow = computeRates();
  const gains = [];
  const caps = [];
  const ignored = [];
  const startResources = { ...G.res };
  const startHatch = G.hatch.progress || 0;
  const startPop = G.pop.total || 0;

  for (const [res, rate] of Object.entries(ratesNow)) {
    if (G.res[res] === undefined) continue;
    if (rate > 0) {
      const theoretical = rate * cappedSeconds * 0.5;
      if (theoretical <= 0.0001) continue;
      const before = G.res[res] || 0;
      const after = Math.min(maxRes(res), before + theoretical);
      const delta = after - before;
      if (delta > 0.0001) {
        G.res[res] = after;
        G.vis[res] = true;
        gains.push({ res, label:`${offlineIcon(res)} ${offlineName(res)}`, value:`+${fmt(delta)}` });
      }
      const lost = theoretical - delta;
      if (lost > 0.0001) {
        caps.push({ res, label:`${offlineIcon(res)} ${offlineName(res)}`, value:`${fmt(lost)} blocked by storage` });
      }
    } else if (rate < -0.0001) {
      ignored.push({ res, label:`${offlineIcon(res)} ${offlineName(res)}`, value:`${fmt(Math.abs(rate) * cappedSeconds)} not consumed` });
    }
  }

  const hatchRateNow = hatchRate();
  const hatchGain = Math.max(0, hatchRateNow * cappedSeconds * 0.35);
  const totalProgress = startHatch + hatchGain;
  const room = Math.max(0, housing() - G.pop.total);
  const bugsHatched = Math.min(room, Math.floor(totalProgress));
  if (bugsHatched > 0) {
    G.pop.total += bugsHatched;
  }
  G.hatch.progress = totalProgress - bugsHatched;
  const blockedHatches = Math.max(0, Math.floor(totalProgress) - bugsHatched);

  if (ratesNow.honeydew > 0) {
    G.stats.total_hd += ratesNow.honeydew * cappedSeconds * 0.5;
  }

  const notes = [];
  if (seconds > cappedSeconds) notes.push(`<strong>Time cap:</strong> offline gains were limited to 1 hour even though you were away longer.`);
  if (caps.length) notes.push(`<strong>Storage bottlenecks:</strong> some resources stopped increasing when their storage cap was reached.`);
  if (blockedHatches > 0) notes.push(`<strong>Housing bottleneck:</strong> ${blockedHatches} additional hatch cycle${blockedHatches > 1 ? 's were' : ' was'} ready, but housing was full.`);
  if (ignored.length) notes.push(`<strong>Simplified catch-up:</strong> upkeep, starvation, and other negative changes were not simulated while offline.`);
  notes.push(`<strong>Not simulated:</strong> random events, choice events, and day/season progression do not advance while offline.`);

  gains.sort((a, b) => {
    const av = parseFloat(String(a.value).replace(/[^0-9.\-]/g, '')) || 0;
    const bv = parseFloat(String(b.value).replace(/[^0-9.\-]/g, '')) || 0;
    return bv - av;
  });

  const report = {
    id: `offline_${Date.now()}`,
    title: bugsHatched > 0 ? 'The colony held while you were away' : 'Your colony gathered quietly in your absence',
    seconds,
    capped_seconds: cappedSeconds,
    applied_label: appliedLabel,
    resource_types: gains.length,
    gains,
    caps,
    ignored,
    hatch_before_pct: Math.round(startHatch * 100),
    hatch_after_pct: Math.round((G.hatch.progress || 0) * 100),
    hatch_gain_pct: Math.round(hatchGain * 100),
    bugs_hatched: bugsHatched,
    blocked_hatches: blockedHatches,
    population_before: startPop,
    population_after: G.pop.total || 0,
    summary: gains.length
      ? `Applied ${appliedLabel} of offline catch-up across ${gains.length} resource type${gains.length !== 1 ? 's' : ''}${bugsHatched > 0 ? ` and hatched ${bugsHatched} bug${bugsHatched > 1 ? 's' : ''}` : ''}.`
      : `Applied ${appliedLabel} of offline catch-up.${bugsHatched > 0 ? ` ${bugsHatched} bug${bugsHatched > 1 ? 's' : ''} hatched while you were away.` : ''}`,
    notes
  };
  return report;
}

function canLaunchSkyColony(state = G) {
  const aetherNeed = launchAetherRequirement(state);
  return !!state.techs.sky_colonies && (state.res.elytra || 0) >= 15 && (state.res.aether || 0) >= aetherNeed;
}

function launchSkyColony() {
  if (!canLaunchSkyColony()) {
    toast('Need more Elytra and Aether', 'warn');
    return;
  }
  const reward = calcLaunchReward();
  if (reward <= 0) {
    toast('Launch not ready', 'warn');
    return;
  }
  const ending = buildLaunchEnding(G, reward);
  const history = [ending, ...(((G.meta && G.meta.ending_history) || []))].slice(0, 6);
  const nextMeta = {
    nectar: (G.meta.nectar || 0) + reward,
    launches: (G.meta.launches || 0) + 1,
    legacy: { ...((G.meta && G.meta.legacy) || {}) },
    pending_ending: ending,
    ending_history: history,
    pending_offline: null,
    offline_history: Array.isArray(G.meta && G.meta.offline_history) ? G.meta.offline_history.slice(0, 6) : [],
  };
  G = freshStartState(nextMeta);
  log(`A Sky Colony launches. Royal Nectar gained: +${reward}.`);
  toast(`Sky Colony launched! +${reward} Nectar`);
  renderAll();
}

let confirmModalAction = null;

function closeConfirmModal() {
  const modal = document.getElementById('confirm-modal');
  const body = document.getElementById('confirm-modal-body');
  confirmModalAction = null;
  if (body) body.innerHTML = '';
  if (modal) modal.style.display = 'none';

function openConfirmModal({ title, message, confirmLabel = 'CONFIRM', cancelLabel = 'CANCEL', danger = false, onConfirm = null }) {
  const modal = document.getElementById('confirm-modal');
  const body = document.getElementById('confirm-modal-body');

    </div>`;

function confirmModalAccept() {
  const action = confirmModalAction;
  closeConfirmModal();

function resetGame() {
  openConfirmModal({
    title:'HARD RESET',
    message:'Delete all local progress, including Royal Nectar? This cannot be undone.',
    confirmLabel:'DELETE PROGRESS',
    cancelLabel:'KEEP SAVE',
    danger:true,
    onConfirm:() => {
      localStorage.removeItem(SAVE_KEY);
      localStorage.removeItem(SAVE_TS_KEY);
      G = freshStartState({ nectar:0, launches:0 });
      rates = {};
      renderAll();
    }
  });
}

function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(G));
    localStorage.setItem(SAVE_TS_KEY, String(Date.now()));
  } catch (_) {}
}

function hydrateState(raw) {
  const base = freshStartState(raw.meta || { nectar:0, launches:0 });
  const merged = structuredClone ? structuredClone(base) : JSON.parse(JSON.stringify(base));
  for (const key of Object.keys(base)) {
    if (raw[key] && typeof raw[key] === 'object' && !Array.isArray(raw[key])) {
      merged[key] = { ...base[key], ...raw[key] };
    } else if (raw[key] !== undefined) {
      merged[key] = raw[key];
    }
  }
  merged.res = { ...base.res, ...(raw.res || {}) };
  merged.vis = { ...base.vis, ...(raw.vis || {}) };
  merged.bldgs = { ...base.bldgs, ...(raw.bldgs || {}) };
  merged.jobs = { ...base.jobs, ...(raw.jobs || {}) };
  merged.unlocks = {
    jobs: { ...base.unlocks.jobs, ...((raw.unlocks && raw.unlocks.jobs) || {}) },
    bldgs: { ...base.unlocks.bldgs, ...((raw.unlocks && raw.unlocks.bldgs) || {}) },
  };
  merged.achievements = { ...base.achievements, ...(raw.achievements || {}) };
  merged.milestones = { ...base.milestones, ...(raw.milestones || {}) };
  merged.projects = { ...base.projects, ...(raw.projects || {}) };
  merged.meta = { ...base.meta, ...(raw.meta || {}) };
  merged.meta.legacy = { ...base.meta.legacy, ...(((raw.meta || {}).legacy) || {}) };
  merged.meta.pending_ending = merged.meta.pending_ending || null;
  merged.meta.ending_history = Array.isArray(merged.meta.ending_history) ? merged.meta.ending_history.slice(0, 6) : [];
  merged.meta.pending_offline = merged.meta.pending_offline || null;
  merged.meta.offline_history = Array.isArray(merged.meta.offline_history) ? merged.meta.offline_history.slice(0, 6) : [];
  merged.meta.seen_achievements = Number.isFinite(merged.meta.seen_achievements) ? merged.meta.seen_achievements : 0;
  merged.meta.tutorial_hidden = !!merged.meta.tutorial_hidden;
  if (!merged.events) merged.events = { active:null, ticks_left:0, choice:null };
  if (!merged.hatch) merged.hatch = { progress:0 };
  if (!Array.isArray(merged.expeditions)) merged.expeditions = [];
  if (merged.challenge && typeof merged.challenge !== 'object') merged.challenge = null;
  syncLineageUnlocks(merged);
  clearLineageProjects(merged);
  return merged;
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    G = hydrateState(JSON.parse(raw));
    return true;
  } catch (_) {
    return false;
  }
}

function applyOffline(seconds) {
  if (seconds < 10) return;
  // Advance expeditions by offline time
  if (G.expeditions && G.expeditions.length) {
    for (const exp of G.expeditions) {
      if (!exp.done) {
        exp.elapsed += seconds;
        if (exp.elapsed >= exp.duration) {
          exp.elapsed = exp.duration;
          exp.done = true;
        }
      }
    }
  }
  const report = buildOfflineSummary(seconds);
  G.meta.pending_offline = report;
  G.meta.offline_history = [report, ...((G.meta && G.meta.offline_history) || [])].slice(0, 6);
  log(`Offline: ${report.applied_label} applied${report.bugs_hatched > 0 ? ` · ${report.bugs_hatched} bug${report.bugs_hatched > 1 ? 's' : ''} hatched` : ''}.`);
  toast(`Welcome back! Offline summary ready`);
}

function renderTopBar() {
  const season = seasonName();
  const col = S_COLOR[season];
  const sp = document.getElementById('season-pill');
  sp.textContent = `${season} · Y${G.time.year} D${G.time.day}`;
  sp.style.background = col + '22';
  sp.style.color = col;
  document.getElementById('season-fill').style.width = (G.time.day / DAYS_PER_SEASON * 100) + '%';
  document.getElementById('season-fill').style.background = col;
  document.getElementById('pop-display').textContent = `${G.pop.total}/${housing()} bugs`;
}

function renderResStrip() {
  let html = '';
  for (const [res, vis] of Object.entries(G.vis)) {
    if (!vis) continue;
    const def = RES[res];
    const amt = G.res[res] || 0;
    const mx = maxRes(res);
    const rt = rates[res] || 0;
    const ratio = mx > 0 ? amt / mx : 0;
    let cls = 'rc';
    if (ratio >= 0.99) cls += ' full';
    else if (ratio >= 0.85) cls += ' warn';
    let rcls = 'rz';
    if (rt > 0.0001) rcls = 'rp';
    else if (rt < -0.0001) rcls = 'rn';
    html += `<div class="${cls}">
      <div class="rc-name">${def.icon} ${def.name}</div>
      <div class="rc-amt">${fmt(amt)}</div>
      <div class="rc-max">/${fmt(mx)}</div>
      <div class="rc-rate ${rcls}">${fmtR(rt) || '—'}</div>
    </div>`;
  }
  document.getElementById('res-strip').innerHTML = html;
}

function renderNavBadges() {
  const achBtn = document.querySelector('[data-tab="achievements"]');
  if (!achBtn) return;
  const count = unseenAchievementCount();
  const existing = achBtn.querySelector('.badge');
  if (existing) existing.remove();
  if (count > 0 && curTab !== 'achievements') {
    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = String(count);
    achBtn.appendChild(badge);
  }
  // Colony badge for expedition returns
  const colBtn = document.querySelector('[data-tab="colony"]');
  if (colBtn) {
    const oldBadge = colBtn.querySelector('.badge');
    if (oldBadge) oldBadge.remove();
    const readyExp = (G.expeditions || []).filter(e => e.done).length;
    if (readyExp > 0 && curTab !== 'colony') {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.style.background = 'var(--sky-d)';
      badge.style.color = 'var(--sky)';
      badge.textContent = String(readyExp);
      colBtn.appendChild(badge);
    }
  }
}

function goTab(tab) {
  curTab = tab;
  if (tab === 'achievements') markAchievementsSeen();
  document.querySelectorAll('.nb').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  renderTab();
}

function hatchPanel() {
  const rate = hatchRate();
  const pct = Math.max(0, Math.min(100, G.hatch.progress * 100));
  let status = 'Build housing to incubate eggs.';
  if (housing() > G.pop.total) status = rate > 0 ? 'Eggs are incubating.' : 'Need more Honeydew to incubate eggs.';
  return `<div class="wi" style="cursor:default;margin-bottom:10px;">
    <div style="flex:1">
      <div class="wi-name" style="font-size:12px">Hatchery Progress</div>
      <div class="wi-desc">${status}</div>
      <div class="mini-progress"><div class="mini-progress-fill" style="width:${pct}%"></div></div>
      <div class="wi-desc">${pct.toFixed(0)}% · ${rate > 0 ? '+' + rate.toFixed(3) + '/s' : 'stalled'}</div>
    </div>
  </div>`;
}

function colonyHatchCompact() {
  if (housing() <= 0) return '';
  const rate = hatchRate();
  const pct = Math.max(0, Math.min(100, G.hatch.progress * 100));
  const atCap = G.pop.total >= housing();
  const rateLabel = atCap ? 'housing full' : rate > 0 ? '+' + rate.toFixed(3) + '/s' : 'stalled';
  const barColor = atCap ? 'var(--amber-d)' : rate > 0 ? '' : 'var(--red)';
  const fillStyle = barColor ? `background:${barColor}` : '';
  return `<div style="display:flex;align-items:center;gap:9px;padding:7px 11px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;">
    <div style="font-size:14px;min-width:20px;text-align:center;">🥚</div>
    <div style="flex:1;min-width:0;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;">
        <span style="font-family:var(--mono);font-size:10px;color:var(--text-hi);">Next bug</span>
        <span style="font-family:var(--mono);font-size:10px;color:${atCap ? 'var(--amber)' : rate > 0 ? 'var(--accent)' : 'var(--text-lo)'}">${pct.toFixed(0)}% · ${rateLabel}</span>
      </div>
      <div class="mini-progress" style="margin:0;height:5px;"><div class="mini-progress-fill" style="width:${pct}%;${fillStyle}"></div></div>
    </div>
  </div>`;
}


function progressPct(cost) {
  const entries = Object.entries(cost || {});
  if (!entries.length) return 100;
  const ratio = entries.reduce((sum, [r, a]) => sum + Math.min(1, (G.res[r] || 0) / Math.max(1, a)), 0) / entries.length;
  return Math.max(0, Math.min(100, Math.round(ratio * 100)));
}


function tutorialSteps() {
  return [
    {
      done:(G.bldgs.nest || 0) >= 1,
      text:'Build a Nest so dormant eggs can incubate into your first bug.'
    },
    {
      done:(G.bldgs.clover_patch || 0) >= 1,
      text:'Build a Clover Patch for passive Honeydew income.'
    },
    {
      done:G.pop.total >= 1,
      text:'Keep Honeydew above 8 to hatch your first bug.'
    },
    {

    },

}

function shouldShowOnboarding() {
  if (G.meta && G.meta.tutorial_hidden) return false;
  const steps = tutorialSteps();
  if (steps.length && steps.every(step => step.done)) return false;
  return !G.techs.natural_philosophy || G.time.year === 1;
}

function onboardingPanel() {
  if (!shouldShowOnboarding()) return '';
  const steps = tutorialSteps();
  const doneCount = steps.filter(step => step.done).length;
  return `<div class="tutorial-card">
    <div class="tutorial-title">QUICK START · ${doneCount}/${steps.length}</div>
    <div class="checklist">
      ${steps.map(step => `<div class="check-item ${step.done ? 'done' : ''}">
        <span class="check-mark">${step.done ? '✓' : '•'}</span>
        <div class="check-copy">${step.text}</div>
      </div>`).join('')}
    </div>
    <div class="onboard-note">Tip: <span class="keyline">Nest first, Clover Patch second</span> is the smoothest opening. Use the Workers tab once your first bug hatches.</div>

}

function advisorObjective() {
  if ((G.bldgs.nest || 0) === 0) {
    return {
      title:'Build a Nest',
      desc:'You need housing before eggs can hatch into your first workers.',
      progress:progressPct(bldgCost('nest')),
      tip:'Gather a little more Honeydew, Leaves, or Dirt and place your first Nest.'
    };
  }
  if ((G.bldgs.clover_patch || 0) === 0) {
    return {
      title:'Build a Clover Patch',
      desc:'Passive Honeydew smooths out the early game and keeps new bugs fed.',
      progress:progressPct(bldgCost('clover_patch')),
      tip:'This is the safest first production building.'
    };
  }
  if (G.pop.total === 0) {
    return {
      title:'Hatch the first bug',
      desc:'Keep Honeydew above 8 and give the hatchery time to fill.',
      progress:Math.round(Math.max(0, Math.min(100, G.hatch.progress * 100))),
      tip:'More Honeydew means faster incubation.'
    };
  }

  const availableTech = Object.entries(TECHS)
    .filter(([tid, def]) => !G.techs[tid] && techVisible(def) && techReqsMet(def) && techStageReady(def))
    .sort((a, b) => (a[1].tier - b[1].tier) || progressPct(b[1].cost) - progressPct(a[1].cost))[0];

  if (availableTech) {
    const [tid, def] = availableTech;
    return {
      title:`Research ${def.name}`,
      desc:def.desc,
      progress:progressPct(def.cost),
      tip:`This is your most accessible Tier ${def.tier} upgrade right now.`
    };
  }

  const nextBranchTech = nextLineageResearch();
  if (nextBranchTech && techStageReady(nextBranchTech[1])) {
    const [tid, def] = nextBranchTech;
    return {
      title:`Fund ${def.name}`,
      desc:def.desc,
      progress:progressPct(def.cost),
      tip:'This lineage tech will push your current capstone path further away from the others.'
    };
  }

  const activeProject = activeLineageProject();
  if (activeProject && !projectDone(activeProject.id)) {
    const status = projectProgress(activeProject);
    return {
      title:status.ready ? `Complete ${activeProject.title}` : activeProject.title,
      desc:activeProject.short,
      progress:status.pct,
      tip:status.ready ? 'This lineage project is ready to finish on the Colony tab.' : activeProject.reward
    };
  }

  const nextQuest = nextLineageMilestone();
  if (nextQuest) {
    const status = milestoneProgress(nextQuest.id);
    const progress = status.target === 100 ? status.cur : Math.max(0, Math.min(100, Math.round((status.cur / Math.max(1, status.target)) * 100)));
    return {
      title:nextQuest.title,
      desc:nextQuest.desc,
      progress,
      tip:`Reward: ${nextQuest.reward}`
    };
  }

  if ((G.meta.nectar || 0) > 0) {
    return {
      title:ownedCapstoneId() ? 'Spend Royal Nectar' : 'Shape your lineage',
      desc:ownedCapstoneId() ? 'You have unspent prestige currency waiting in the Legacy tab.' : 'Invest in branches now so you can unlock one of the exclusive capstones later.',
      progress:100,
      tip:ownedCapstoneId() ? 'Buy a branch that fits your next run: faster starts, bigger storage, or stronger sky scaling.' : 'Brood focuses on openings, Amber on gathering and stockpiles, Sky on prestige speed.'
    };
  }

  if (G.techs.sky_colonies && !canLaunchSkyColony()) {
    return {
      title:'Prepare a Sky Colony launch',
      desc:'Bank enough Elytra and Aether for the next prestige reset.',
      progress:progressPct({ elytra:15, aether:launchAetherRequirement() }),
      tip:'Sky Docks, Aeronauts, and Sky Nomads are your fastest Aether push.'
    };
  }

  if (canLaunchSkyColony()) {
    return {
      title:'Launch a Sky Colony',
      desc:'You are ready to prestige for permanent Royal Nectar bonuses.',
      progress:100,
      tip:`Current reward: ${calcLaunchReward()} Nectar.`
    };
  }

  if (idle() > 0) {
    return {
      title:'Assign idle bugs',
      desc:'Unassigned bugs eat Honeydew without contributing production.',
      progress:Math.max(0, 100 - (idle() * 15)),
      tip:'Foragers and Scholars are usually the best stabilisers.'
    };
  }

  return {
    title:'Scale the colony',
    desc:'Add production and housing to keep momentum through the next season.',
    progress:100,
    tip:'Aim for a mix of food, insight, and advanced materials.'
  };
}

    html += `<div class="tier-label">── TIER ${tier} ──────────────────</div>`;
    for (const [tid, def] of tierTechs) {

      const reqsMet = techReqsMet(def);

      let cls = 'tc';
      if (done) cls += ' done';
      else if (!reqsMet || !stageReady) cls += ' locked';
      else if (canAffordTech(tid)) cls += ' avail';
      const lockReasons = techLockedReasons(def);
      const costH = Object.entries(def.cost).map(([r, a]) => {
        const ok = (G.res[r] || 0) >= a;
        const col = done ? 'var(--text-lo)' : ok ? 'var(--accent)' : 'var(--red)';
        return `<span style="color:${col}">${RES[r].icon} ${a} ${RES[r].name}</span>`;
      }).join(' · ');
      html += `<div class="${cls}" onclick="doResearch('${tid}')">

    const canSell = canAfford(tr.sell);
    const sellH = Object.entries(tr.sell).map(([r, a]) => `<span style="color:${(G.res[r] || 0) >= a ? 'var(--text-hi)' : 'var(--red)'}">${RES[r].icon} ${a} ${RES[r].name}</span>`).join(', ');
    const buyH = Object.entries(tr.buy).map(([r, a]) => `<span style="color:var(--amber)">${RES[r].icon} ${Math.floor(a * mult)} ${RES[r].name}</span>`).join(', ');
    html += `<div class="trade-row">
      <div style="font-size:20px">${tr.icon}</div>
      <div class="trade-info">
        <div class="trade-name">${tr.name}${tr.capstone ? lineageChip(tr.capstone) : ''}</div>
        <div class="trade-desc">${tr.desc}${tr.lineage_label ? `<br><span class="soft-note">${tr.lineage_label}</span>` : ''}<br>Give: ${sellH}<br>Get: ${buyH}${tr.special ? `<br><span style="color:var(--sky)">Bonus: ${specialSummary(tr.special)}</span>` : ''}</div>
      </div>
      <button class="trade-btn" onclick="doTrade('${tr.id}')" ${canSell ? '' : 'disabled'}>TRADE</button>
    </div>`;
  }
  for (const tr of pending) {
    const sellH = Object.entries(tr.sell).map(([r, a]) => `<span style="color:var(--text-lo)">${RES[r].icon} ${a} ${RES[r].name}</span>`).join(', ');
    const buyH = Object.entries(tr.buy).map(([r, a]) => `<span style="color:var(--text-lo)">${RES[r].icon} ${Math.floor(a * mult)} ${RES[r].name}</span>`).join(', ');
    html += `<div class="trade-row" style="opacity:0.45">
      <div style="font-size:20px">${tr.icon}</div>
      <div class="trade-info">
        <div class="trade-name">${tr.name}${lineageChip(tr.capstone)}</div>
        <div class="trade-desc">${tr.desc}<br><span class="soft-note">${lineageUnlockLabel(tr)}</span><br>Give: ${sellH}<br>Get: ${buyH}${tr.special ? `<br><span style="color:var(--text-lo)">Bonus: ${specialSummary(tr.special)}</span>` : ''}</div>
      </div>
      <button class="trade-btn" disabled>LOCKED</button>
    </div>`;
  }
  if (ownedCapstoneId()) html += lineageContentHint('trade');
  return html;
}

function legacySummaryLine() {
  const capstoneId = ownedCapstoneId();
  const capstoneText = capstoneId ? ` · Capstone: ${LEGACY_TREE[capstoneId].name}` : '';
  return `Production +${Math.round((productionMetaMult() - 1) * 100)}% · Storage +${Math.round((storageMetaMult() - 1) * 100)}% · Trade x${tradeLegacyMult().toFixed(2)} · Sky x${skyLegacyMult().toFixed(2)}${capstoneText}`;
}


function legacySpent(meta = G.meta, includeCapstones = true) {
  return Object.entries(LEGACY_TREE).reduce((sum, [id, node]) => {
    if (!includeCapstones && node.capstone) return sum;
    const rank = legacyRank(id, meta);
    if (!rank) return sum;
    return sum + node.costs.slice(0, rank).reduce((a, b) => a + b, 0);
  }, 0);
}

function legacyRespecFee(meta = G.meta) {
  return ownedCapstoneId(meta) ? 3 : 1;
}

function legacyRespecRefund(meta = G.meta) {
  return Math.max(0, legacySpent(meta, true) - legacyRespecFee(meta));
}

function canRespecLegacy() {
  return legacySpent(G.meta, true) > 0;
}

function legacyRespecLabel() {
  const cap = ownedCapstoneId();
  if (!cap) return 'Reset Legacy Tree';
  return `Respec ${LEGACY_TREE[cap].name}`;
}

function doLegacyRespec() {
  if (!canRespecLegacy()) {
    toast('No Legacy points to refund', 'warn');
    return;
  }
  const cap = ownedCapstoneId();
  const fee = legacyRespecFee();
  const refund = legacyRespecRefund();
  const message = cap
    ? `Respec ${LEGACY_TREE[cap].name}?\n\nYou will refund ${refund} Royal Nectar after a ${fee} Nectar fee. Current-run lineage buildings and jobs from this capstone will be removed immediately.`
    : `Reset your Legacy tree?\n\nYou will refund ${refund} Royal Nectar after a ${fee} Nectar fee.`;
  if (!confirm(message)) return;

  G.meta.nectar = (G.meta.nectar || 0) + refund;
  G.meta.legacy = Object.fromEntries(Object.keys(LEGACY_TREE).map(k => [k, 0]));
  G.milestones = {};
  G.projects = {};
  syncLineageUnlocks();
  clearInaccessibleLineageContent();
  clearLineageProjects();
  log(cap ? `Legacy respec: ${LEGACY_TREE[cap].name} was dissolved.` : 'Legacy respec: tree reset.');
  toast(cap ? `Respecced ${LEGACY_TREE[cap].name}` : 'Legacy tree reset');
  renderAll();
}

function tabAchievements() {
  const activeCapstone = ownedCapstoneId();
  const respecFee = legacyRespecFee();
  const respecRefund = legacyRespecRefund();
  let html = tabPrimer('achievements');
  html += `<div class="sh">ROYAL LEGACY</div>`;
  html += `<div class="wi" style="cursor:default;margin-bottom:10px;align-items:flex-start;">
    <div style="flex:1">
      <div class="wi-name" style="font-size:12px">${G.meta.nectar} Royal Nectar available</div>
      <div class="wi-desc">Spend Nectar to shape future runs instead of relying only on automatic scaling.</div>
      <div class="wi-desc" style="margin-top:4px">${legacySummaryLine()}</div>
    </div>
  </div>`;
  html += lineageMilestonePanel();
  html += lineageEvolutionPanel();
  html += lineageProjectPanel();
  html += `<div class="guide-panel" style="margin-bottom:10px;">
    <div class="guide-title">LEGACY RESPEC</div>
    <div class="guide-copy">${activeCapstone
      ? `You are currently aligned with <strong>${LEGACY_TREE[activeCapstone].name}</strong>. Respeccing will refund your spent Nectar, remove this run's lineage-only buildings and jobs, and reopen the other capstones for future runs.`
      : 'You can refund your Legacy tree if you want to rebuild toward a different branch order or prepare for another capstone path.'}</div>
    <div class="soft-note">Current fee: ${respecFee} Royal Nectar · Refund on click: ${respecRefund} Royal Nectar.</div>
    <div class="btn-row" style="margin-top:10px;">
      <button class="save-link" onclick="doLegacyRespec()" ${canRespecLegacy() ? '' : 'disabled'}>${legacyRespecLabel()}</button>
    </div>
  </div>`;
  if (!activeCapstone) {
    html += `<div class="notice-panel">Capstones are exclusive, but no longer permanent. You can now respec the whole Legacy tree for a small Royal Nectar fee whenever you want to pivot into another lineage.</div>`;
  }
  html += Object.entries(LEGACY_TREE).map(([id, node]) => {
    const rank = legacyRank(id);
    const max = legacyMaxRank(id);
    const cost = legacyCost(id, rank);
    const unlocked = legacyUnlocked(id);
    const canBuy = canBuyLegacy(id);
    const isCapstone = !!node.capstone;
    let cls = 'tc';
    if (!unlocked) cls += ' locked';
    else if (rank >= max) cls += ' done';
    else if (canBuy) cls += ' avail';
    if (isCapstone && rank > 0) cls += ' capstone-active';
    const reqParts = [];
    if ((node.requires || []).length) reqParts.push(`Requires: ${node.requires.map(req => LEGACY_TREE[req].name).join(', ')}`);
    if ((node.requires_max || []).length) reqParts.push(`Master: ${node.requires_max.map(req => LEGACY_TREE[req].name).join(', ')}`);
    if (isCapstone) reqParts.push(activeCapstone && activeCapstone !== id ? `Locked by ${LEGACY_TREE[activeCapstone].name}` : 'Exclusive capstone choice');
    const reqText = reqParts.length ? reqParts.join(' · ') : 'Base legacy branch';
    return `<div class="${cls}" onclick="${unlocked && rank < max ? `buyLegacy('${id}')` : ''}">
      <div class="tc-name">${node.icon} ${node.name} ${rank >= max ? '✓' : `${rank}/${max}`}${isCapstone ? '<span class="capstone-chip">CAPSTONE</span>' : ''}</div>
      <div class="tc-desc">${node.desc}</div>
      <div class="tc-req">${reqText}</div>
      <div class="tc-cost">${rank >= max ? '<span style="color:var(--accent)">Mastered</span>' : `<span style="color:${canBuy ? 'var(--amber)' : 'var(--text-lo)'}">Cost: ${cost} Royal Nectar</span>`}</div>
    </div>`;
  }).join('');
  html += `<div class="sh" style="margin-top:14px">LAUNCH CHRONICLES</div>`;
  html += endingHistoryCards();
  html += `<div class="sh" style="margin-top:14px">OFFLINE REPORTS</div>`;
  html += offlineHistoryCards();
  html += `<div class="sh" style="margin-top:14px">ACHIEVEMENTS</div>`;
  html += ACHIEVEMENTS.map(a => {
    const done = !!G.achievements[a.id];
    return `<div class="tc${done ? ' done' : ''}" style="cursor:default;opacity:${done ? 1 : 0.45}">
      <div class="tc-name">${a.name} ${done ? '✓' : ''}</div>
      <div class="tc-desc">${a.desc}</div>
    </div>`;
  }).join('');
  return html;
}

function tabLog() {

  return G.log.map(e => `<div class="le"><div class="le-t">${e.time}</div><div class="le-m">${e.msg}</div></div>`).join('');

function renderChoiceEvent() {
  const modal = document.getElementById('event-modal');
  const body = document.getElementById('event-modal-body');
  if (!modal || !body) return;
  if (!G.events.choice) {
    modal.style.display = 'none';
    body.innerHTML = '';
    return;
  }
  const ev = G.events.choice;
  body.innerHTML = `<div class="event-title">${ev.title}</div>
    <div class="event-msg">${ev.msg}</div>
    <div class="event-choices">${ev.choices.map((choice, idx) => `<button class="event-choice" onclick="chooseEvent(${idx})"><span>${choice.label}</span><small>${choice.outcome}</small></button>`).join('')}</div>
    <button class="save-link" onclick="closeChoiceEvent()" style="margin-top:8px">CLOSE</button>`;

function renderTab() {
  const el = document.getElementById('content');

  // Colony tab: preserve canvas, only update content below it
  if (curTab === 'colony') {
    const existingCanvas = el.querySelector('#colony-canvas-wrap');
    if (existingCanvas) {
      // Canvas exists, only update the non-canvas portion
      let contentDiv = el.querySelector('#colony-content');
      if (!contentDiv) {
        contentDiv = document.createElement('div');
        contentDiv.id = 'colony-content';
        el.appendChild(contentDiv);
      }
      contentDiv.innerHTML = tabColonyContent();
    } else {
      el.innerHTML = `${colonyCanvasHTML()}<div id="colony-content">${tabColonyContent()}</div>`;
      requestAnimationFrame(() => ColonyViz.start());
    }
  } else {
    ColonyViz.stop();
    switch (curTab) {
      case 'workers': el.innerHTML = tabWorkers(); break;
      case 'research': el.innerHTML = tabResearch(); break;
      case 'craft': el.innerHTML = tabCraft(); break;
      case 'trade': el.innerHTML = tabTrade(); break;
      case 'achievements': el.innerHTML = tabAchievements(); break;
      case 'log': el.innerHTML = tabLog(); break;
      default: el.innerHTML = `${colonyCanvasHTML()}<div id="colony-content">${tabColonyContent()}</div>`;
        requestAnimationFrame(() => ColonyViz.start());
    }
  }
  renderNavBadges();
}

function renderAll() {
  renderTopBar();
  renderResStrip();
  renderTab();
  renderChoiceEvent();
  renderEndingModal();
  renderOfflineModal();
}

function tick() {
  const dt = TICK_MS / 1000;
  rates = computeRates();
  for (const [res, rate] of Object.entries(rates)) {
    if (G.res[res] === undefined) continue;
    G.res[res] = Math.max(0, Math.min(maxRes(res), G.res[res] + rate * dt));
    if (G.res[res] > 0) G.vis[res] = true;
  }

  if (rates.honeydew > 0) G.stats.total_hd += rates.honeydew * dt;

  const hRate = hatchRate();
  if (hRate > 0) {
    G.hatch.progress += hRate * dt;
    while (G.hatch.progress >= 1 && G.pop.total < housing()) {
      G.hatch.progress -= 1;
      awardBug(1);
    }
  }

  if (G.res.honeydew <= 0.01 && G.pop.total > 0) {
    if (Math.random() < 0.006 * G.pop.total * dt) {
      G.pop.total = Math.max(0, G.pop.total - 1);
      for (const jid of Object.keys(G.jobs)) {
        if (G.jobs[jid] > 0) { G.jobs[jid]--; break; }
      }
      log('⚠ Starvation! A bug has perished.', 'bad');
      toast('A bug starved!', 'bad');
    }
  }

  if (G.events.active && G.events.ticks_left > 0) {
    G.events.ticks_left--;
    if (G.events.ticks_left === 0) G.events.active = null;
  }

  if (!G.events.active && !G.events.choice && G.pop.total >= 1 && Math.random() < 0.00028 * dt * Math.max(1, G.pop.total / 3)) {
    triggerRandomEvent();
  }

  G.time.tick++;
  if (G.time.tick % TICKS_PER_DAY === 0) {
    G.time.day++;
    if (G.time.day >= DAYS_PER_SEASON) {
      G.time.day = 0;
      G.time.s_idx = (G.time.s_idx + 1) % 4;
      const ns = seasonName();
      log(`${ns} has arrived.`);
      toast(ns + ' begins');
      onSeasonChange(ns);
      if (G.time.s_idx === 0) {
        G.time.year++;
        log(`Year ${G.time.year} begins. The colony endures.`);
      }
    }
  }

  if (tickN % 10 === 0) {
    checkAchievements();
    checkLineageMilestones();
    checkChallenge();
  }
  tickExpeditions(dt);
  if (G.time.tick % 300 === 0) saveGame();
}

const ColonyViz = {
  bugs: [],
  particles: [],
  buildings: [],
  lastBldgHash: '',
  lastPop: -1,
  raf: null,
  inited: false,

  seasonPalette() {
    const s = seasonName();
    switch (s) {
      case 'Spring': return { sky:'#0a1f15', ground:'#102a1c', grass:'#1b4a2e', accent:'#22c55e', particle:'#4ade80', fogAlpha:0 };
      case 'Summer': return { sky:'#1a1808', ground:'#2a2410', grass:'#3a3018', accent:'#f59e0b', particle:'#fbbf24', fogAlpha:0 };
      case 'Autumn': return { sky:'#1a1008', ground:'#2a1c0c', grass:'#332212', accent:'#fb923c', particle:'#f97316', fogAlpha:0.03 };
      case 'Winter': return { sky:'#080e18', ground:'#0e1520', grass:'#141e2c', accent:'#60a5fa', particle:'#93c5fd', fogAlpha:0.08 };
    }
    return { sky:'#0a1f15', ground:'#102a1c', grass:'#1b4a2e', accent:'#22c55e', particle:'#4ade80', fogAlpha:0 };
  },

  syncBugs(canvas) {
    const pop = G.pop.total;
    const w = canvas.width;
    const h = canvas.height;
    const groundY = h * 0.58;
    while (this.bugs.length < Math.min(pop, 40)) {
      this.bugs.push({
        x: Math.random() * w,
        y: groundY + Math.random() * (h * 0.32),
        vx: (Math.random() - 0.5) * 0.6,
        vy: 0,
        size: 2.5 + Math.random() * 1.8,
        color: Math.random() < 0.3 ? '#fbbf24' : Math.random() < 0.5 ? '#78d7ff' : '#5ee58f',
        pause: Math.random() * 200,
        wiggle: Math.random() * Math.PI * 2,
        working: Math.random() < (employed() / Math.max(1, pop)),
      });
    }
    while (this.bugs.length > Math.min(pop, 40)) this.bugs.pop();
    this.lastPop = pop;
  },

  syncBuildings(canvas) {
    const hash = Object.entries(G.bldgs).map(([k, v]) => `${k}:${v}`).join(',');
    if (hash === this.lastBldgHash) return;
    this.lastBldgHash = hash;
    const w = canvas.width;
    const h = canvas.height;
    const groundY = h * 0.58;
    this.buildings = [];

    const bldgVisuals = [
      { id:'nest', icon:'⌂', color:'#8b6914', minH:10, maxH:16 },
      { id:'clover_patch', icon:'✿', color:'#22c55e', minH:6, maxH:10 },
      { id:'burrow', icon:'◢', color:'#6b4c11', minH:12, maxH:18 },
      { id:'fungal_garden', icon:'◎', color:'#a855f7', minH:8, maxH:14 },
      { id:'web_workshop', icon:'◈', color:'#94a3b8', minH:10, maxH:16 },
      { id:'leaf_cache', icon:'◇', color:'#65a30d', minH:8, maxH:14 },
      { id:'anthill', icon:'△', color:'#c2410c', minH:18, maxH:28 },
      { id:'chrysalis_chamber', icon:'○', color:'#06b6d4', minH:10, maxH:16 },
      { id:'hive_observatory', icon:'◎', color:'#fcd34d', minH:14, maxH:22 },
      { id:'mycelium_network', icon:'∿', color:'#c084fc', minH:6, maxH:10 },
      { id:'compound_lab', icon:'⬡', color:'#14b8a6', minH:12, maxH:18 },
      { id:'flight_tower', icon:'▲', color:'#e2e8f0', minH:22, maxH:34 },
      { id:'sky_dock', icon:'☁', color:'#7dd3fc', minH:16, maxH:26 },
      { id:'colony_spire', icon:'⟑', color:'#f0abfc', minH:28, maxH:40 },
      { id:'brood_nursery', icon:'●', color:'#fca5a5', minH:12, maxH:18 },
      { id:'amber_vault', icon:'⬢', color:'#fbbf24', minH:14, maxH:22 },
      { id:'sky_beacon', icon:'✦', color:'#93c5fd', minH:20, maxH:30 },
      { id:'cloud_condenser', icon:'◇', color:'#c4b5fd', minH:14, maxH:22 },
      { id:'spore_circle', icon:'⊗', color:'#a78bfa', minH:6, maxH:10 },
      { id:'wax_foundry', icon:'◆', color:'#fb923c', minH:10, maxH:16 },
    ];

    let xCursor = 20;
    for (const bv of bldgVisuals) {
      const count = G.bldgs[bv.id] || 0;
      for (let i = 0; i < Math.min(count, 5); i++) {
        const bh = bv.minH + Math.random() * (bv.maxH - bv.minH);
        const bw = bh * (0.6 + Math.random() * 0.4);
        this.buildings.push({
          x: xCursor + Math.random() * 12,
          y: groundY - bh + 2,
          w: bw,
          h: bh,
          color: bv.color,
          id: bv.id,
        });
        xCursor += bw + 4 + Math.random() * 8;
        if (xCursor > w - 20) xCursor = 20 + Math.random() * 30;
      }
    }
  },

  spawnParticle(canvas) {
    const pal = this.seasonPalette();
    const w = canvas.width;
    const h = canvas.height;
    const s = seasonName();
    if (s === 'Winter') {
      this.particles.push({
        x: Math.random() * w,
        y: -5,
        vx: (Math.random() - 0.5) * 0.3,
        vy: 0.3 + Math.random() * 0.5,
        life: 1,
        decay: 0.002 + Math.random() * 0.003,
        size: 1 + Math.random() * 2,
        color: pal.particle,
        type: 'snow',
      });
    } else if (s === 'Autumn') {
      this.particles.push({
        x: Math.random() * w,
        y: -5,
        vx: 0.2 + Math.random() * 0.5,
        vy: 0.4 + Math.random() * 0.4,
        life: 1,
        decay: 0.004 + Math.random() * 0.003,
        size: 2 + Math.random() * 3,
        color: Math.random() < 0.5 ? '#fb923c' : '#f97316',
        type: 'leaf',
      });
    } else if (s === 'Spring') {
      this.particles.push({
        x: Math.random() * w,
        y: h * 0.3 + Math.random() * h * 0.4,
        vx: (Math.random() - 0.5) * 0.2,
        vy: -0.1 - Math.random() * 0.3,
        life: 1,
        decay: 0.008 + Math.random() * 0.005,
        size: 1 + Math.random() * 1.5,
        color: Math.random() < 0.5 ? '#bbf7d0' : '#86efac',
        type: 'pollen',
      });
    } else {
      this.particles.push({
        x: Math.random() * w,
        y: h * 0.3 + Math.random() * h * 0.5,
        vx: (Math.random() - 0.5) * 0.1,
        vy: -0.05 - Math.random() * 0.2,
        life: 1,
        decay: 0.005 + Math.random() * 0.003,
        size: 1 + Math.random(),
        color: pal.particle,
        type: 'heat',
      });
    }
  },

  draw(canvas) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;
    const pal = this.seasonPalette();
    const groundY = h * 0.58;

    ctx.clearRect(0, 0, w, h);

    // Sky gradient
    const skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
    skyGrad.addColorStop(0, pal.sky);
    skyGrad.addColorStop(1, pal.ground);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, w, groundY);

    // Ground gradient
    const gndGrad = ctx.createLinearGradient(0, groundY, 0, h);
    gndGrad.addColorStop(0, pal.grass);
    gndGrad.addColorStop(1, pal.ground);
    ctx.fillStyle = gndGrad;
    ctx.fillRect(0, groundY, w, h - groundY);

    // Ground line
    ctx.strokeStyle = pal.accent + '33';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(w, groundY);
    ctx.stroke();

    // Stars at night / winter
    if (seasonName() === 'Winter' || seasonName() === 'Autumn') {
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      for (let i = 0; i < 15; i++) {
        const sx = ((i * 47 + 13) % w);
        const sy = ((i * 31 + 7) % (groundY * 0.6));
        ctx.fillRect(sx, sy, 1, 1);
      }
    }

    // Fog overlay
    if (pal.fogAlpha > 0) {
      ctx.fillStyle = `rgba(180,200,220,${pal.fogAlpha})`;
      ctx.fillRect(0, 0, w, h);
    }

    // Buildings
    for (const b of this.buildings) {
      ctx.fillStyle = b.color + '55';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = b.color + '88';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(b.x, b.y, b.w, b.h);
      // Window glow
      if (b.h > 12) {
        ctx.fillStyle = b.color + 'aa';
        ctx.fillRect(b.x + b.w * 0.3, b.y + b.h * 0.3, 2, 2);
        ctx.fillRect(b.x + b.w * 0.6, b.y + b.h * 0.5, 2, 2);
      }
    }

    // Particles
    for (const p of this.particles) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      if (p.type === 'leaf') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.x * 0.01 + Date.now() * 0.001);
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // Bugs
    for (const bug of this.bugs) {
      ctx.fillStyle = bug.color;
      ctx.beginPath();
      ctx.ellipse(bug.x, bug.y, bug.size, bug.size * 0.65, 0, 0, Math.PI * 2);
      ctx.fill();
      // Eyes
      ctx.fillStyle = '#fff';
      const eyeOff = bug.vx > 0 ? 1 : -1;
      ctx.fillRect(bug.x + eyeOff * bug.size * 0.35, bug.y - bug.size * 0.25, 1, 1);
      // Working indicator (tiny sparkle)
      if (bug.working && Math.sin(Date.now() * 0.005 + bug.wiggle) > 0.7) {
        ctx.fillStyle = pal.accent + '88';
        ctx.fillRect(bug.x - 1, bug.y - bug.size - 2, 2, 2);
      }
    }

    // Expedition bugs leaving
    const expCount = bugsOnExpedition();
    if (expCount > 0) {
      const t = Date.now() * 0.001;
      for (let i = 0; i < Math.min(expCount, 3); i++) {
        const ex = w - 20 + Math.sin(t + i * 2) * 6;
        const ey = groundY - 10 - i * 8 + Math.cos(t * 1.3 + i) * 3;
        ctx.fillStyle = '#78d7ff';
        ctx.beginPath();
        ctx.arc(ex, ey, 2, 0, Math.PI * 2);
        ctx.fill();
        // Trail dots
        ctx.fillStyle = '#78d7ff44';
        ctx.fillRect(ex - 6, ey, 1.5, 1.5);
        ctx.fillRect(ex - 12, ey + 1, 1, 1);
      }
    }

    // Active event glow
    if (G.events.active) {
      let glowColor;
      if (G.events.active === 'hd_boost') glowColor = 'rgba(34,197,94,0.06)';
      else if (G.events.active === 'hd_blight') glowColor = 'rgba(255,139,137,0.06)';
      else if (G.events.active === 'brood_surge') glowColor = 'rgba(251,191,36,0.06)';
      else if (G.events.active === 'amber_rush') glowColor = 'rgba(251,146,60,0.06)';
      else if (G.events.active === 'star_current') glowColor = 'rgba(120,215,255,0.06)';
      else glowColor = 'rgba(94,229,143,0.04)';
      ctx.fillStyle = glowColor;
      ctx.fillRect(0, 0, w, h);
    }

    // Overlay text
    const overlay = document.getElementById('colony-overlay');
    if (overlay) {
      const s = seasonName();
      const evtLabel = G.events.active ? ` · ${G.events.active.replace(/_/g, ' ')}` : '';
      overlay.textContent = `${s} · Y${G.time.year}${evtLabel}`;
    }
  },

  update(canvas) {
    const w = canvas.width;
    const h = canvas.height;
    const groundY = h * 0.58;

    // Update bugs
    for (const bug of this.bugs) {
      if (bug.pause > 0) { bug.pause -= 16; continue; }
      bug.wiggle += 0.05;
      bug.x += bug.vx + Math.sin(bug.wiggle) * 0.15;
      bug.y += bug.vy;
      // Bounce off edges
      if (bug.x < 5) { bug.x = 5; bug.vx *= -1; }
      if (bug.x > w - 5) { bug.x = w - 5; bug.vx *= -1; }
      if (bug.y < groundY + 3) bug.y = groundY + 3;
      if (bug.y > h - 5) bug.y = h - 5;
      // Random direction changes
      if (Math.random() < 0.01) {
        bug.vx = (Math.random() - 0.5) * 0.6;
        bug.pause = 30 + Math.random() * 120;
        bug.working = Math.random() < (employed() / Math.max(1, G.pop.total));
      }
      // Gravitate toward buildings sometimes
      if (bug.working && this.buildings.length > 0 && Math.random() < 0.005) {
        const target = this.buildings[Math.floor(Math.random() * this.buildings.length)];
        bug.vx = (target.x - bug.x) * 0.005;
      }
    }

    // Update particles
    for (const p of this.particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
    }
    this.particles = this.particles.filter(p => p.life > 0 && p.y < h + 10);

    // Spawn new particles
    if (Math.random() < 0.15) this.spawnParticle(canvas);
  },

  loop(canvas) {
    if (!canvas || !canvas.parentNode) { this.inited = false; return; }
    this.syncBugs(canvas);
    this.syncBuildings(canvas);
    this.update(canvas);
    this.draw(canvas);
    this.raf = requestAnimationFrame(() => this.loop(canvas));
  },

  start() {
    const canvas = document.getElementById('colony-canvas');
    if (!canvas) return;
    const wrap = canvas.parentElement;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = wrap.clientWidth * dpr;
    canvas.height = wrap.clientHeight * dpr;
    canvas.getContext('2d').scale(dpr, dpr);
    canvas.style.width = wrap.clientWidth + 'px';
    canvas.style.height = wrap.clientHeight + 'px';
    // Re-scale draw coords
    canvas.width = wrap.clientWidth;
    canvas.height = wrap.clientHeight;
    if (this.raf) cancelAnimationFrame(this.raf);
    this.inited = true;
    this.loop(canvas);
  },

  stop() {
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = null;
    this.inited = false;
  },
};

(function init() {
  const loaded = loadGame();
  if (loaded) {
    const lastSave = parseInt(localStorage.getItem(SAVE_TS_KEY) || '0', 10);
    const now = Date.now();
    const offlineSec = lastSave ? Math.floor((now - lastSave) / 1000) : 0;
    if (offlineSec > 10) applyOffline(offlineSec);
  }
  localStorage.setItem(SAVE_TS_KEY, String(Date.now()));
  // Generate a seasonal challenge if none exists and player has started
  if (!G.challenge && (G.pop.total >= 1 || G.stats.built > 0)) {
    G.challenge = generateChallenge(seasonName(), G.time.year);
  }
  renderAll();
  const gatherBtn = document.getElementById('gather-btn');
  if (gatherBtn) gatherBtn.addEventListener('dblclick', e => e.preventDefault());
  const confirmModal = document.getElementById('confirm-modal');
  if (confirmModal) {
    confirmModal.addEventListener('click', e => {
      if (e.target === confirmModal) closeConfirmModal();
    });
  }
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeConfirmModal();
  });
  window.addEventListener('resize', () => {
    if (curTab === 'colony' && ColonyViz.inited) ColonyViz.start();
  });
  setInterval(() => {
    tick();
    tickN++;
    renderResStrip();
    if (tickN % 4 === 0) renderTopBar();
    if (tickN % 10 === 0) {
      renderTab();
      renderChoiceEvent();
      localStorage.setItem(SAVE_TS_KEY, String(Date.now()));
    }
    if (tickN % 300 === 0) saveGame();
  }, TICK_MS);
})();

</script>
