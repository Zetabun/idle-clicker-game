        // Small dirt chunk carried
        ctx.globalAlpha = bug.atTarget ? 0.95 : 0.55;
        ctx.fillStyle = '#92400e99';
        ctx.beginPath(); ctx.arc(bug.x, bobY, bug.atTarget ? 2.1 : 1.4, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
      } else if (job === 'scholar') {
        // Floating insight orb
        const glow = 0.4 + 0.4 * Math.sin(pp * 1.3);
        ctx.globalAlpha = glow;
        const sg = ctx.createRadialGradient(bug.x, bobY, 0, bug.x, bobY, 3.5);
        sg.addColorStop(0, '#bae6fd');
        sg.addColorStop(1, 'transparent');
        ctx.fillStyle = sg;
        ctx.beginPath(); ctx.arc(bug.x, bobY, 3.5, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 0.7 + 0.3 * Math.sin(pp * 1.3);
        ctx.fillStyle = '#93c5fd';
        ctx.beginPath(); ctx.arc(bug.x, bobY, 1.6, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
      } else if (job === 'weaver') {
        // Silk thread trailing behind
        ctx.strokeStyle = '#cbd5e1bb';
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.moveTo(bug.x, bug.y);
        for (let si = 1; si <= 5; si++) {
          ctx.lineTo(bug.x - facing * si * 2.2, bug.y + Math.sin(pp + si * 0.8) * 1.2);
        }
        ctx.stroke();
        // Silk spool above
        ctx.fillStyle = '#94a3b8cc';
        ctx.beginPath(); ctx.arc(bug.x, bobY, 2.0, 0, Math.PI*2); ctx.fill();
      } else if (job === 'miner') {
        // Chitin hex shard carried
        ctx.save();
        ctx.translate(bug.x, bobY);
        ctx.rotate(pp * 0.5);
        ctx.globalAlpha = bug.carrying || bug.atTarget ? 1 : 0.45;
        ctx.fillStyle = '#e2e8f0cc';
        ctx.beginPath();
        for (let hi = 0; hi < 6; hi++) {
          const hx = 2.2 * Math.cos(hi * Math.PI / 3);
          const hy = 2.2 * Math.sin(hi * Math.PI / 3);
          hi === 0 ? ctx.moveTo(hx, hy) : ctx.lineTo(hx, hy);
        }
        ctx.closePath(); ctx.fill();
        ctx.restore();
        ctx.globalAlpha = 1;
      } else if (job === 'resin_tap') {
        // Amber drop dripping down
        const drip = (pp % (Math.PI * 2)) / (Math.PI * 2);
        ctx.globalAlpha = bug.carrying || bug.atTarget ? 1 : 0.5;
        ctx.fillStyle = '#fb923ccc';
        ctx.beginPath();
        ctx.arc(bug.x, bug.y - bug.size - 2, bug.carrying || bug.atTarget ? 2.1 : 1.4, 0, Math.PI*2);
        ctx.fill();
        if (drip > 0.4 && drip < 0.9) {
          ctx.globalAlpha = 1 - (drip - 0.4) / 0.5;
          ctx.beginPath();
          ctx.arc(bug.x, bug.y - bug.size + (drip - 0.4) * 12, 1.2, 0, Math.PI*2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
        ctx.globalAlpha = 1;
      } else if (job === 'spore_cult') {
        // Small spore cloud orbiting
        for (let si = 0; si < 3; si++) {
          const sa = pp + (si / 3) * Math.PI * 2;
          const sr = 4.5 + Math.sin(pp * 2 + si) * 1;
          ctx.globalAlpha = 0.5 + 0.25 * Math.sin(pp + si);
          ctx.fillStyle = '#c084fc';
          ctx.beginPath();
          ctx.arc(bug.x + Math.cos(sa) * sr, bug.y + Math.sin(sa) * sr * 0.6, 1.2, 0, Math.PI*2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      } else if (job === 'nurse') {
        // Pulsing care glow + tiny cross above
        const nurseGlow = 0.25 + 0.2 * Math.sin(pp * 0.8);
        ctx.globalAlpha = nurseGlow;
        ctx.fillStyle = '#f9a8d4';
        ctx.beginPath(); ctx.arc(bug.x, bug.y, bug.size + 3, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = '#fda4af';
        ctx.fillRect(bug.x - 0.6, bobY - 2, 1.2, 4);
        ctx.fillRect(bug.x - 2, bobY - 0.6, 4, 1.2);
        ctx.globalAlpha = 1;
      } else if (job === 'excavator') {
        // Larger dirt throw when digging
        const exc = Math.abs(Math.sin((bug.digPhase || 0) * 1.4));
        if (exc > 0.4) {
          ctx.globalAlpha = (exc - 0.4) * 1.6;
          ctx.fillStyle = '#854d0e';
          [-4, -1.5, 1.5, 4].forEach((ox, i) => {
            ctx.beginPath();
            ctx.arc(bug.x + ox, bug.y + bug.size + 1 + i * 0.5, 1.2 + i * 0.2, 0, Math.PI*2);
            ctx.fill();
          });
          ctx.globalAlpha = 1;
        }
        ctx.globalAlpha = bug.carrying || bug.atTarget ? 1 : 0.45;
        ctx.fillStyle = '#b45309cc';
        ctx.beginPath(); ctx.arc(bug.x, bobY, bug.carrying || bug.atTarget ? 2.4 : 1.5, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
      } else if (job === 'aeronaut') {
        // Aether wisps trailing
        for (let ai = 0; ai < 3; ai++) {
          const aa = pp * 1.5 + ai * 1.1;
          ctx.globalAlpha = 0.3 + 0.2 * Math.sin(aa);
          ctx.fillStyle = '#7dd3fc';
          ctx.beginPath();
          ctx.arc(bug.x - facing * (ai + 1) * 3.5, bug.y + Math.sin(aa) * 2, 1.5 - ai * 0.3, 0, Math.PI*2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      } else if (job === 'navigator') {
        // Star trail
        for (let ni = 0; ni < 3; ni++) {
          const na = pp + ni * 0.9;
          ctx.globalAlpha = 0.35 + 0.2 * Math.sin(na);
          ctx.fillStyle = '#fcd34d';
          ctx.fillRect(bug.x - facing * (ni + 1) * 3.2 - 0.5, bug.y + Math.sin(na * 2) * 1.8 - 0.5, 1.2, 1.2);
        }
        // Star above
        ctx.globalAlpha = 0.6 + 0.3 * Math.sin(pp * 2);
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(bug.x - 1, bug.y - bug.size - 5, 2, 2);
        ctx.fillRect(bug.x - 0.4, bug.y - bug.size - 6.5, 0.8, 3.5);
        ctx.fillRect(bug.x - 2.5, bug.y - bug.size - 4.5, 5, 0.8);
        ctx.globalAlpha = 1;
      } else if (bug.working) {
        // Generic working sparkle
        const spk = Math.sin(t * 5 + bug.wiggle) > 0.65;
        if (spk) {
          ctx.fillStyle = pal.accent + 'bb';
          ctx.fillRect(bug.x - 1, bug.y - bug.size - 3, 2, 2);
        }
      }
    }

    // ── Floating worker yields ──────────────────────
    if (this.floatTexts.length) {
      ctx.save();
      ctx.font = 'bold 10px Space Mono, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.6)';
      ctx.shadowBlur = 5;
      for (const floatText of this.floatTexts) {
        ctx.globalAlpha = Math.max(0, Math.min(1, floatText.life * 1.25));
        ctx.fillStyle = floatText.color;
        ctx.fillText(floatText.text, floatText.x, floatText.y);
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // ── Expedition bugs by mission phase ─────────────
    const expeditionPreview = (G.expeditions || []).slice(0, 4);
    if (expeditionPreview.length > 0) {
      expeditionPreview.forEach((exp, i) => {
        const phaseInfo = getExpeditionPhaseInfo(exp);
        let march;
        if (phaseInfo.phase === 'travel_out') {
          march = ((t * 18 + i * 26) % (w + 48));
        } else if (phaseInfo.phase === 'surveying') {
          march = w * 0.8 + Math.sin(t * 1.8 + i) * 8;
        } else if (phaseInfo.phase === 'travel_back' || phaseInfo.phase === 'returned') {
          march = w - ((t * 16 + i * 24) % (w + 48));
        } else {
          march = w * 0.76 + Math.sin(t * 4 + i) * 2.5;
        }
        const ey = groundY + 6 + i * 5;
        const bugColor = phaseInfo.phase === 'surveying'
          ? '#5ee58f'
          : phaseInfo.phase === 'travel_back' || phaseInfo.phase === 'returned'
            ? '#ffc562'
            : phaseInfo.phase === 'hostile_contact' || phaseInfo.phase === 'fighter_support'
              ? '#f87171'
              : '#78d7ff';
        ctx.globalAlpha = 0.22;
        ctx.fillStyle = bugColor;
        ctx.fillRect(march - 10, ey, 8, 1.5);
        ctx.globalAlpha = 1;
        ctx.fillStyle = bugColor;
        ctx.beginPath();
        ctx.ellipse(march, ey, 2.9, 1.8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(march + (phaseInfo.phase === 'travel_back' || phaseInfo.phase === 'returned' ? -3 : 2), ey - 1, 1, 1);
        if (phaseInfo.phase === 'travel_out') {
          ctx.fillStyle = '#cbd5e1cc';
          ctx.fillRect(march - 5, ey - 2, 2.5, 2.5);
        } else if (phaseInfo.phase === 'surveying') {
          ctx.globalAlpha = 0.65 + 0.25 * Math.sin(t * 3 + i);
          ctx.fillStyle = '#e4f1e8';
          ctx.fillRect(march - 1, ey - 5, 2, 2);
          ctx.fillRect(march - 0.5, ey - 7, 1, 5);
          ctx.globalAlpha = 1;
        } else if (phaseInfo.phase === 'travel_back' || phaseInfo.phase === 'returned') {
          ctx.fillStyle = '#22c55ecc';
          ctx.beginPath();
          ctx.arc(march - 4, ey - 1, 1.6, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.globalAlpha = 0.72 + 0.18 * Math.sin(t * 8 + i);
          ctx.fillStyle = '#f87171';
          ctx.fillRect(march - 0.6, ey - 6.2, 1.2, 4.5);
          ctx.fillRect(march - 1.9, ey - 2.9, 3.8, 1.1);
          ctx.globalAlpha = 1;
        }
      });
    }

    // ── Scouting fighters marching left ──────────────
    const scoutingFighters = (G.fighters || []).filter(f => f.status === 'scouting');
    if (scoutingFighters.length > 0) {
      for (let i = 0; i < Math.min(scoutingFighters.length, 3); i++) {
        const march = w - ((t * 22 + i * 22) % (w + 40));
        const fy = groundY + 10 + i * 6;
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = '#f87171';
        ctx.fillRect(march, fy, 8, 1.5);
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#f87171';
        ctx.beginPath();
        ctx.ellipse(march, fy, 2.8, 1.8, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(march - 3, fy - 1, 1, 1);
      }
    }

    // ── Recovering fighters near Healing Hollow ───────
    const recoveringFighters = (G.fighters || []).filter(f => f.status === 'recovering');
    if (recoveringFighters.length > 0) {
      const hollow = this.buildings.find(b => b.id === 'healing_hollow');
      const rx = hollow ? hollow.x + hollow.w / 2 : w * 0.15;
      for (let i = 0; i < Math.min(recoveringFighters.length, 3); i++) {
        const rf = recoveringFighters[i];
        const hpRatio = rf.hp / rf.max_hp;
        const wobble = Math.sin(t * 0.8 + i * 1.4) * 1.5;
        const bx2 = rx + (i - 1) * 9 + wobble;
        const by2 = groundY + 8 + i * 2;
        ctx.globalAlpha = 0.5 + hpRatio * 0.4;
        ctx.fillStyle = '#34d399';
        ctx.beginPath();
        ctx.ellipse(bx2, by2, 2.4, 1.5, 0, 0, Math.PI*2);
        ctx.fill();
        // Tiny cross above to indicate healing
        ctx.fillStyle = '#34d399cc';
        ctx.fillRect(bx2 - 0.5, by2 - 5, 1, 3);
        ctx.fillRect(bx2 - 1.5, by2 - 4, 3, 1);
        ctx.globalAlpha = 1;
      }
    }

    // ── Active raid: enemy invaders marching from right ─
    const activeRaid = G.conflict && G.conflict.raid;
    if (activeRaid) {
      const raidPct = Math.max(0, Math.min(1, activeRaid.ticks_left / RAID_RESPONSE_TICKS));
      // Invaders approach from the right; travel from ~w+60 to w*0.35 as timer drains
      const invaderX = w * 0.9 - (1 - raidPct) * (w * 0.55);
      const numInvaders = 3;
      for (let i = 0; i < numInvaders; i++) {
        const ix = invaderX + i * 10 + Math.sin(t * 3 + i) * 1.2;
        const iy = groundY + 6 + i * 6;
        // Red trail
        ctx.globalAlpha = 0.22;
        ctx.fillStyle = '#f87171';
        ctx.fillRect(ix + 3, iy, 16, 1.5);
        ctx.globalAlpha = 1;
        // Invader body (larger, menacing — slightly bigger and redder than normal bugs)
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.ellipse(ix, iy, 3.8, 2.4, 0, 0, Math.PI*2);
        ctx.fill();
        // Head nub (facing left, toward the colony)
        ctx.fillStyle = '#dc2626';
        ctx.beginPath();
        ctx.arc(ix - 3.5, iy, 1.8, 0, Math.PI*2);
        ctx.fill();
        // White eye
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.fillRect(ix - 4.2, iy - 1.2, 1.4, 1.4);
        // Antenna toward colony
        ctx.strokeStyle = '#dc262688';
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.moveTo(ix - 3.2, iy - 1.6);
        ctx.lineTo(ix - 6 + Math.sin(t * 4 + i) * 0.8, iy - 4);
        ctx.stroke();
      }
      // Warning flash overlay when timer < 30%
      if (raidPct < 0.30) {
        const pulse = Math.sin(t * 8) * 0.5 + 0.5;
        ctx.globalAlpha = 0.04 * pulse;
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(0, 0, w, h);
        ctx.globalAlpha = 1;
      }
      // RAID label above invaders
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = '#f87171';
      ctx.font = `bold 7px monospace`;
      ctx.textAlign = 'center';
      ctx.fillText('⚠ RAID', invaderX + 10, groundY - 4);
      ctx.textAlign = 'left';
      ctx.globalAlpha = 1;
    }

    // ── Overlay label ─────────────────────────────────
    const overlay = document.getElementById('colony-overlay');
    if (overlay) {
      const evtLabel = evt ? ` · ${evt.replace(/_/g,' ')}` : '';
      overlay.textContent = `${s} · Y${G.time.year}${evtLabel}`;
    }
  },

  update(canvas) {
    const w = canvas.width;
    const h = canvas.height;
    const groundY = h * 0.58;
    const t = Date.now() * 0.001;
    const evt = G.events.active;

    const chooseTargetForBug = (bug, isAir) => {
      const spec = this.jobBuildingSpec(bug.job || 'idle', bug);
      const tgt = spec.ids ? this.chooseBuildingByIds(spec.ids) : (this.buildings.length > 0 ? this.buildings[Math.floor(Math.random() * this.buildings.length)] : null);
      if (tgt) this.assignBugTarget(bug, tgt, spec.role || 'work', groundY, h, isAir);
    };

    for (const bug of this.bugs) {
      if (bug.pause > 0) {
        bug.pause -= 16;
        bug.activityState = bug.working ? (bug.atTarget ? this.jobActivityMeta(bug.job || 'idle').workState : this.jobActivityMeta(bug.job || 'idle').moveState) : 'resting';
        continue;
      }
      bug.wiggle += 0.055;
      bug.payloadPhase = (bug.payloadPhase || 0) + 0.04;
      bug.digPhase = (bug.digPhase || 0) + 0.12;
      bug.actionPulse = (bug.actionPulse || 0) + (bug.job === 'aeronaut' || bug.job === 'navigator' ? 0.09 : 0.06);

      const job = bug.job || 'idle';
      const isAir = job === 'aeronaut' || job === 'navigator';

      if (bug.working && this.buildings.length > 0) {
        const retargetChance = job === 'scholar' ? 0.002 : job === 'nurse' ? 0.0025 : this.isHaulerJob(job) ? 0.0015 : 0.005;
        if (!bug.targetX || Math.random() < retargetChance) {
          chooseTargetForBug(bug, isAir);
        }
        const dx = (bug.targetX ?? bug.x) - bug.x;
        const speed = job === 'scholar' || job === 'nurse' ? 0.0018 : isAir ? 0.004 : this.isHaulerJob(job) ? 0.0034 : 0.003;
        bug.vx += dx * speed;
        const maxV = isAir ? 1.2 : job === 'scholar' || job === 'nurse' ? 0.5 : this.isHaulerJob(job) ? 1.0 : 0.9;
        bug.vx = Math.max(-maxV, Math.min(maxV, bug.vx));

        if (!isAir && bug.targetY !== null) {
          const dy = bug.targetY - bug.y;
          bug.vy = (bug.vy || 0) + dy * 0.003;
          bug.vy = Math.max(-0.35, Math.min(0.35, bug.vy));
        }

        // Air bugs drift vertically toward their target y
        if (isAir && bug.targetY !== null) {
          const dy = bug.targetY - bug.y;
          bug.vy = (bug.vy || 0) + dy * 0.006;
          bug.vy = Math.max(-0.6, Math.min(0.6, bug.vy));
        }
      } else {
        if (Math.random() < 0.012) {
          bug.vx = (Math.random() - 0.5) * 0.45;
          bug.pause = 40 + Math.random() * 140;
          bug.targetX = null;
          bug.targetY = null;
          bug.targetBldgId = null;
          bug.routeRole = null;
        }
      }

      // Dirt diggers do a vertical bobbing "dig" motion
      const digBob = (job === 'dirt_dig' || job === 'excavator') ? Math.abs(Math.sin(bug.digPhase)) * 0.5 : 0;

      bug.x += bug.vx + Math.sin(bug.wiggle) * 0.12;
      bug.y += (bug.vy || 0) + Math.sin(bug.wiggle * 0.7) * 0.08 + digBob;

      if (bug.x < 5)   { bug.x = 5;   bug.vx *= -1; }
      if (bug.x > w-5) { bug.x = w-5; bug.vx *= -1; }

      // Y clamping depends on job
      if (isAir) {
        if (bug.y < 4) bug.y = 4;
        if (bug.y > groundY - 6) { bug.y = groundY - 6; bug.vy = (bug.vy || 0) * -0.5; }
      } else {
        if (bug.y < groundY + 2) bug.y = groundY + 2;
        if (bug.y > h - 5) bug.y = h - 5;
      }

      const activityMeta = this.jobActivityMeta(job);
      if (!bug.working) {
        bug.atTarget = false;
        bug.workingTimer = 0;
        bug.routeRole = null;
        bug.activityState = bug.pause > 0 ? 'resting' : 'idle';
      } else if (bug.targetX !== null) {
        const dyTarget = (bug.targetY !== null ? bug.targetY : bug.y) - bug.y;
        const distToTarget = Math.hypot(bug.targetX - bug.x, dyTarget);
        bug.atTarget = distToTarget < (isAir ? 10 : 7);
        if (bug.atTarget) {
          bug.workingTimer = (bug.workingTimer || 0) + 1;
          bug.activityState = bug.routeRole === 'storage' ? 'storing' : activityMeta.workState;
          bug.vx *= isAir ? 0.92 : 0.55;
          bug.vy = (bug.vy || 0) * (isAir ? 0.92 : 0.4);
          if (job === 'scholar') {
            bug.x += Math.cos(bug.actionPulse) * 0.16;
            bug.y += Math.sin(bug.actionPulse * 1.4) * 0.12;
          } else if (job === 'nurse') {
            bug.x += Math.sin(bug.actionPulse * 1.7) * 0.2;
            bug.y += Math.cos(bug.actionPulse * 1.2) * 0.08;
          } else if (job === 'weaver') {
            bug.x += Math.sin(bug.actionPulse * 2.3) * 0.18;
          } else if (job === 'spore_cult') {
            bug.x += Math.cos(bug.actionPulse * 1.5) * 0.12;
            bug.y += Math.sin(bug.actionPulse * 1.8) * 0.12;
          } else if (job === 'aeronaut' || job === 'navigator') {
            bug.x += Math.cos(bug.actionPulse * 1.2) * 0.24;
            bug.y += Math.sin(bug.actionPulse * 1.2) * 0.2;
          } else if (job === 'dirt_dig' || job === 'excavator') {
            bug.y += Math.abs(Math.sin(bug.actionPulse * 1.7)) * 0.3;
          } else {
            bug.y += Math.sin(bug.actionPulse * 2.1) * 0.08;
          }
          if (this.isHaulerJob(job) && bug.workingTimer > 72 + Math.floor(bug.size * 7)) {
            const nextCarrying = !bug.carrying;
            bug.carrying = nextCarrying;
            bug.workingTimer = 0;
            bug.targetX = null;
            bug.targetY = null;
            bug.atTarget = false;
            bug.vx += nextCarrying ? 0.08 : -0.08;
            chooseTargetForBug(bug, isAir);
          }
        } else {
          bug.workingTimer = 0;
          bug.activityState = activityMeta.moveState;
        }
      } else {
        bug.atTarget = false;
        bug.workingTimer = 0;
        bug.activityState = activityMeta.moveState;
      }
    }

    // Update particles
    for (const p of this.particles) {
      p.x += p.vx; p.y += p.vy; p.life -= p.decay;
    }
    this.particles = this.particles.filter(p => p.life > 0 && p.y < h + 10);

    for (const floatText of this.floatTexts) {
      floatText.x += floatText.vx;
      floatText.y += floatText.vy;
      floatText.life -= floatText.decay;
    }
    this.floatTexts = this.floatTexts.filter(floatText => floatText.life > 0);

    // Ambient spawning — rate and type driven by season and active events
    const s = seasonName();
    const spawnRate = evt === 'hd_blight' ? 0.28 : evt === 'brood_surge' ? 0.38 : evt === 'amber_rush' ? 0.30 : evt === 'star_current' ? 0.24 : s === 'Autumn' ? 0.20 : s === 'Winter' ? 0.08 : 0.13;
    if (Math.random() < spawnRate) {
      if (evt === 'hd_blight' && Math.random() < 0.55)       this.spawnParticle(canvas, 'blight');
      else if (evt === 'brood_surge' && Math.random() < 0.6)  this.spawnParticle(canvas, 'brood');
      else if (evt === 'amber_rush' && Math.random() < 0.55)  this.spawnParticle(canvas, 'amber');
      else if (evt === 'star_current' && Math.random() < 0.5) this.spawnParticle(canvas, 'star');
      else if (evt === 'hd_boost' && Math.random() < 0.35)    this.spawnParticle(canvas, 'rain');
      else this.spawnParticle(canvas);
    }
    // Winter: sparse frost drift particles when honeydew is critically low
    if (s === 'Winter' && (G.res.honeydew || 0) < 20 && Math.random() < 0.06) {
      this.spawnParticle(canvas, 'blight_frost');
    }
  },

  loop(canvas) {
    if (!canvas || !canvas.parentNode) { this.inited = false; return; }
    this.syncBugs(canvas);
    this.syncBuildings(canvas);
    this.syncGroundLeaves(canvas);
    this.update(canvas);
    this.draw(canvas);
    this.raf = requestAnimationFrame(() => this.loop(canvas));
  },

  start() {
    const canvas = document.getElementById('colony-canvas');
    if (!canvas) return;
    const wrap = canvas.parentElement;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = wrap.clientWidth * dpr;
    canvas.height = wrap.clientHeight * dpr;
    canvas.getContext('2d').scale(dpr, dpr);
    canvas.style.width = wrap.clientWidth + 'px';
    canvas.style.height = wrap.clientHeight + 'px';
    // Re-scale draw coords
    canvas.width = wrap.clientWidth;
    canvas.height = wrap.clientHeight;
    if (this.raf) cancelAnimationFrame(this.raf);
    this.inited = true;
    this.loop(canvas);

    // Building info on hover/touch/click
    if (!this._colonyListenersAdded) {
      this._colonyListenersAdded = true;
      const getEventPoint = (e) => {
        if (e.changedTouches && e.changedTouches[0]) return e.changedTouches[0];
        if (e.touches && e.touches[0]) return e.touches[0];
        return e;
      };
      const getHitBuilding = (e) => {
        const point = getEventPoint(e);
        if (!point) return null;
        const rect = canvas.getBoundingClientRect();
        const cx = point.clientX - rect.left;
        const cy = point.clientY - rect.top;
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mx = cx * scaleX, my = cy * scaleY;
        for (const b of this.buildings) {
          if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h + 28) {
            return {
              b,
              screenX: point.clientX,
              screenY: point.clientY,
              anchorX: rect.left + ((b.x + b.w / 2) / scaleX),
              anchorY: rect.top + (b.y / scaleY)
            };
          }
        }
        return null;
      };
      const pinTooltipForHit = (hit) => {
        if (!hit || (G.bldgs[hit.b.id] || 0) <= 0) return;
        this.pinnedTooltipBid = hit.b.id;
        showBuildingTooltip(hit.b.id, hit.anchorX, hit.anchorY, { preferAbove: true, offsetX: 10, offsetYAbove: 10, offsetYBelow: 18 });
      };
      const clearPinnedTooltip = () => {
        this.pinnedTooltipBid = null;
        hideBuildingTooltip();
      };
      const handleHover = (e) => {
        const hit = getHitBuilding(e);
        canvas.style.cursor = hit && (G.bldgs[hit.b.id] || 0) > 0 ? 'pointer' : '';
        if (this.pinnedTooltipBid) return;
        if (hit && (G.bldgs[hit.b.id] || 0) > 0) {
          showBuildingTooltip(hit.b.id, hit.screenX, hit.screenY, { preferAbove: true });
        } else {
          hideBuildingTooltip();
        }
      };
      canvas.addEventListener('mousemove', handleHover, { passive: true });
      canvas.addEventListener('mouseleave', () => {
        canvas.style.cursor = '';
        if (!this.pinnedTooltipBid) hideBuildingTooltip();
      }, { passive: true });
      canvas.addEventListener('click', (e) => {
        const hit = getHitBuilding(e);
        if (hit && (G.bldgs[hit.b.id] || 0) > 0) {
          pinTooltipForHit(hit);
        } else {
          clearPinnedTooltip();
          canvas.style.cursor = '';
        }
      });
      canvas.addEventListener('touchend', (e) => {
        const hit = getHitBuilding(e);
        if (hit && (G.bldgs[hit.b.id] || 0) > 0) {
          pinTooltipForHit(hit);
        } else {
          clearPinnedTooltip();
        }
      }, { passive: true });
    }
  },

  stop() {
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = null;
    this.inited = false;
    this._colonyListenersAdded = false;
    this.pinnedTooltipBid = null;
    hideBuildingTooltip();
  },
};

(function init() {
  const loaded = loadGame();
  if (loaded) {
    const lastSave = parseInt(localStorage.getItem(SAVE_TS_KEY) || '0', 10);
    const now = Date.now();
    const offlineSec = lastSave ? Math.floor((now - lastSave) / 1000) : 0;
    if (offlineSec > 10) applyOffline(offlineSec);
  }
  localStorage.setItem(SAVE_TS_KEY, String(Date.now()));
  // Generate a seasonal challenge if none exists and player has started
  if (!G.challenge && (G.pop.total >= 1 || G.stats.built > 0)) {
    G.challenge = generateChallenge(seasonName(), G.time.year);
  }
  renderAll();
  const gatherBtn = document.getElementById('gather-btn');
  if (gatherBtn) gatherBtn.addEventListener('dblclick', e => e.preventDefault());
  const confirmModal = document.getElementById('confirm-modal');
  if (confirmModal) {
    confirmModal.addEventListener('click', e => {
      if (e.target === confirmModal) closeConfirmModal();
    });
  }
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      closeConfirmModal(); closeStatsModal(); dismissSeasonAnnounce(); dismissFeatureAnnounce();
      dismissBattleReport();
      // If colony name modal is open, just skip
      const cnm = document.getElementById('colony-name-modal');
      if (cnm && cnm.style.display === 'flex') skipColonyName();
    }
    if (e.key === 'Enter') {
      const cnm = document.getElementById('colony-name-modal');
      if (cnm && cnm.style.display === 'flex') applyColonyName();
    }
  });
  window.addEventListener('resize', () => {
    syncNavPageToTab(curTab);
    if (curTab === 'colony' && ColonyViz.inited) ColonyViz.start();
    if (curTab === 'map' && MapViz.inited) MapViz.start();
  });
  // Save when app is backgrounded on mobile (visibilitychange) or tab is closed
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') saveGame();
  });
  // iOS Safari fires pagehide instead of visibilitychange reliably
  window.addEventListener('pagehide', () => saveGame());
  setInterval(() => {
    tick();
    tickN++;
    renderResStrip();
    if (tickN % 4 === 0) renderTopBar();
    if (tickN % 10 === 0) {
      renderTab();
      renderChoiceEvent();
      renderLogFeed();
      localStorage.setItem(SAVE_TS_KEY, String(Date.now()));
    }
    if (tickN % 300 === 0) saveGame();
  }, TICK_MS);
})();

</script>
</body>
