        html += `<div style="margin-top:8px;padding:7px 9px;background:var(--surface);border:1px solid var(--border2);border-radius:6px;">`;
        html += `<div style="font-family:var(--mono);font-size:9px;color:var(--text-lo);margin-bottom:3px;">ESTABLISH OUTPOST · ${opDef.label}</div>`;
        html += `<div style="font-family:var(--mono);font-size:9px;color:var(--accent);margin-bottom:3px;">${prodStr}</div>`;
        html += `<div style="font-size:9px;color:var(--text-lo);margin-bottom:4px;">Costs: ${costStr} · Uses 1 idle bug as garrison</div>`;
        html += `<div style="font-size:9px;color:var(--text-lo);margin-bottom:4px;">Danger ${territoryDangerPips((territoryIdentity(tile.type) || {}).danger_score || 2)} · ${territoryInfluenceSummary(tile.type)}</div>`;
        if (buildBundle.seasonEffect) html += `<div style="font-size:9px;color:var(--amber);margin-bottom:5px;">${buildBundle.seasonEffect.label}: ${buildBundle.seasonEffect.note}</div>`;
        html += `<button class="outpost-establish-btn" onclick="establishOutpost('${selected}')" ${canBuild ? '' : 'disabled'}>${!idle() ? 'NO IDLE BUGS' : !canAfford(cost) ? 'NEED RESOURCES' : 'ESTABLISH OUTPOST'}</button>`;
        html += `</div>`;
      }
    }
    // Map event on this tile
    const tileEvent = (G.map_events || []).find(ev => ev.key === selected);
    if (tileEvent) {
      const timeLeftSec = Math.ceil(tileEvent.ticks_left * (TICK_MS / 1000));
      const timerPct = Math.round((tileEvent.ticks_left / tileEvent.max_ticks) * 100);
      const costStr = tileEvent.reward && tileEvent.reward.cost && Object.keys(tileEvent.reward.cost).length
        ? Object.entries(tileEvent.reward.cost).map(([r, a]) => `${RES[r].icon}${a}`).join(' ') : '';
      const gainStr = tileEvent.reward && tileEvent.reward.gain
        ? Object.entries(tileEvent.reward.gain).map(([r, a]) => `${RES[r].icon}+${a}`).join(' ') : '';
      const canAct = !costStr || canAfford(tileEvent.reward.cost || {});
      html += `<div class="map-event-panel" style="margin-top:8px;border-color:${tileEvent.color}44;">
        <div class="map-event-title" style="color:${tileEvent.color}">${tileEvent.icon} ${tileEvent.name.toUpperCase()}</div>
        <div class="map-event-desc">${tileEvent.desc}</div>
        <div style="height:3px;background:var(--surface2);border-radius:99px;margin-bottom:6px;overflow:hidden;"><div style="height:100%;width:${timerPct}%;background:${tileEvent.color};opacity:0.7;border-radius:99px;transition:width 0.5s linear;"></div></div>
        <div style="font-family:var(--mono);font-size:9px;color:var(--text-lo);margin-bottom:6px;">${timeLeftSec}s remaining${costStr ? ` · Costs: ${costStr}` : ''} · Gains: ${gainStr}</div>
        <button class="map-event-btn" style="border-color:${tileEvent.color}66;color:${tileEvent.color};" onclick="claimMapEvent('${selected}')" ${canAct ? '' : 'disabled'}>${tileEvent.action_label}</button>
      </div>`;
    }

    html += `</div>`;
  } else if (selected && tile && !tile.revealed) {
    html += `<div class="map-node-detail">`;
    html += `<div class="map-node-title">??? Unexplored</div>`;
    html += `<div class="map-node-desc">Send expeditions from the Colony tab to map this territory.</div>`;
    html += `</div>`;
  }

  // Active map events list (not on selected tile)
  const activeEvents = (G.map_events || []).filter(ev => ev.key !== selected);
  if (activeEvents.length) {
    html += `<div class="exp-panel" style="border-color:rgba(120,215,255,0.20);margin-bottom:8px;">`;
    html += `<div class="exp-title">ROAMING EVENTS · ${activeEvents.length} active</div>`;
    for (const ev of activeEvents) {
      const timeLeftSec = Math.ceil(ev.ticks_left * (TICK_MS / 1000));
      html += `<div class="map-event-panel" style="margin-bottom:6px;cursor:pointer;" onclick="MapViz.selectedKey='${ev.key}';document.getElementById('map-content').innerHTML=tabMapContent();">
        <div class="map-event-title" style="color:${ev.color}">${ev.icon} ${ev.name} <span style="float:right;color:var(--text-lo)">${timeLeftSec}s</span></div>
        <div style="font-size:10px;color:var(--text-lo)">Tap to select tile (${ev.key}) and interact.</div>
      </div>`;
    }
    html += `</div>`;
  }

  // Exploration stats panel
  const revealedCount = mapRevealedCount();
  const totalCount = MAP_W * MAP_H;
  const claimableCount = mapClaimableCount();
  const bonuses = (G.map && G.map.bonus) || {};
  const hasBonuses = Object.keys(bonuses).length > 0;

  html += `<div class="exp-panel">`;
  html += `<div class="exp-title">EXPLORATION STATUS</div>`;
  html += `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;">`;
  html += `<div class="ss-item" style="flex:1;min-width:80px;"><div class="ss-body"><div class="ss-val">${revealedCount}/${totalCount}</div><div class="ss-lbl">Tiles Mapped</div></div></div>`;
  html += `<div class="ss-item amber" style="flex:1;min-width:80px;"><div class="ss-body"><div class="ss-val">${claimableCount}</div><div class="ss-lbl">Uncollected</div></div></div>`;
  html += `<div class="ss-item sky" style="flex:1;min-width:80px;"><div class="ss-body"><div class="ss-val">${(G.stats.expeditions || 0)}</div><div class="ss-lbl">Expeditions</div></div></div>`;
  if (G.techs.outpost_network) {
    const opActive = (G.outposts || []).filter(o => o.status === 'active').length;
    const opContested = (G.outposts || []).filter(o => o.status === 'contested').length;
    const opColor = opContested > 0 ? 'red' : 'accent';
    html += `<div class="ss-item ${opContested > 0 ? 'red' : ''}" style="flex:1;min-width:80px;"><div class="ss-body"><div class="ss-val" style="color:var(--${opColor})">${opActive + opContested}</div><div class="ss-lbl">Outposts</div></div></div>`;
  }
  html += `</div>`;

  if (hasBonuses) {
    html += `<div style="font-size:10px;color:var(--amber);margin-bottom:7px;padding:5px 8px;background:var(--amber-d);background:rgba(255,197,98,0.07);border-radius:5px;border:1px solid rgba(255,197,98,0.18);">`;
    html += `✦ Active map bonuses: `;
    html += Object.entries(bonuses).map(([r, v]) => `+${v.toFixed(3)} ${(RES[r] || {}).name || r}/s`).join(' · ');
    html += `</div>`;
  }

  const seasonNotes = Object.entries(TERRITORY_IDENTITY)
    .map(([type, identity]) => ({ type, eff: territorySeasonEffect(type) }))
    .filter(row => row.eff)
    .slice(0, 3)
    .map(row => `${MAP_TILE_DEFS[row.type].label}: ${row.eff.note}`);
  if (seasonNotes.length) {
    html += `<div class="map-note" style="margin-bottom:8px;"><strong>${seasonName()} frontier pressure:</strong> ${seasonNotes.join(' · ')}</div>`;
  }

  html += `<div style="font-size:10px;color:var(--text-lo);line-height:1.5;">Each completed expedition charts new territory. Tap a revealed tile to inspect it — resource nodes can be collected once for a loot bonus. `;
  if (!G.expeditions || !G.expeditions.length) {
    html += `<span style="color:var(--sky)">Scout bugs appear on the map while expeditions are active.</span>`;
  } else {
    html += `<span style="color:var(--sky)">${G.expeditions.length} expedition${G.expeditions.length > 1 ? 's' : ''} currently scouting the map.</span>`;
  }
  html += `</div>`;
  html += `</div>`;

  return html;
}

/* ── MAP CANVAS RENDERER ─────────────────────── */
const MapViz = {
  raf: null,
  inited: false,
  selectedKey: null,
  hoveredKey: null,
  _listenersAdded: false,

  // Flat-top hex geometry
  hexR: 15,

  hexCenter(x, y) {
    const r = this.hexR;
    const cx = x * (r * 1.5) + r + 4;
    const cy = y * (r * Math.sqrt(3)) + (x % 2 === 1 ? r * Math.sqrt(3) * 0.5 : 0) + r * Math.sqrt(3) * 0.5 + 4;
    return { cx, cy };
  },

  inHex(mx, my, cx, cy) {
    const r = this.hexR;
    const dx = Math.abs(mx - cx), dy = Math.abs(my - cy);
    if (dx > r || dy > r * 0.866) return false;
    return dx * 0.5 + dy * 0.866 <= r * 0.866;
  },

  pathHex(ctx, cx, cy, r) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI / 3) * i;
      const px = cx + r * Math.cos(a), py = cy + r * Math.sin(a);
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();
  },

  draw(canvas) {
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    const t = Date.now() * 0.001;

    initMapIfNeeded();
    const tiles = G.map.tiles;
    const r = this.hexR;

    // Deep background
    ctx.fillStyle = '#040c08';
    ctx.fillRect(0, 0, W, H);

    // Subtle grid haze
    const haze = ctx.createRadialGradient(W * 0.3, H * 0.5, 0, W * 0.3, H * 0.5, W * 0.7);
    haze.addColorStop(0, 'rgba(20,50,30,0.18)');
    haze.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = haze;
    ctx.fillRect(0, 0, W, H);

    for (let x = 0; x < MAP_W; x++) {
      for (let y = 0; y < MAP_H; y++) {
        const key = `${x},${y}`;
        const tile = tiles[key];
        if (!tile) continue;
        const { cx, cy } = this.hexCenter(x, y);
        if (cx < -r * 2 || cx > W + r * 2 || cy < -r * 2 || cy > H + r * 2) continue;

        const def = MAP_TILE_DEFS[tile.type];
        const isHovered = this.hoveredKey === key;
        const isSelected = this.selectedKey === key;

        if (!tile.revealed) {
          // Fog — nearly invisible, slight shimmer
          this.pathHex(ctx, cx, cy, r - 0.5);
          ctx.fillStyle = '#060f0a';
          ctx.fill();
          ctx.strokeStyle = '#0c1e14';
          ctx.lineWidth = 0.6;
          ctx.stroke();
          // Subtle animated fog
          const fogAlpha = 0.06 + 0.04 * Math.sin(t * 0.4 + x * 0.8 + y * 1.2);
          this.pathHex(ctx, cx, cy, r - 1);
          ctx.fillStyle = `rgba(20,50,30,${fogAlpha})`;
          ctx.fill();
        } else {
          // Revealed tile
          const fillCol = def ? def.color : '#07100c';
          const borderCol = def ? def.border : '#152419';

          this.pathHex(ctx, cx, cy, r - 0.5);
          ctx.fillStyle = fillCol;
          ctx.fill();
          ctx.strokeStyle = isSelected ? '#5ee58fbb' : isHovered && tile.type !== 'hazard' ? borderCol + 'ee' : borderCol + '99';
          ctx.lineWidth = isSelected ? 1.4 : 0.9;
          ctx.stroke();

          // Pulse glow for claimable uncollected nodes
          if (def && def.loot && !tile.claimed) {
            const pulse = 0.5 + 0.4 * Math.sin(t * 2.2 + x * 0.5 + y * 0.7);
            this.pathHex(ctx, cx, cy, r * 0.72);
            ctx.fillStyle = `rgba(94,229,143,${pulse * 0.09})`;
            ctx.fill();
          }

          // Tile icon / content
          if (tile.type === 'colony') {
            // Colony: animated ring + glyph
            const pulse = 0.4 + 0.35 * Math.sin(t * 1.8);
            this.pathHex(ctx, cx, cy, r * 0.52);
            ctx.fillStyle = `rgba(94,229,143,${0.14 + pulse * 0.1})`;
            ctx.fill();
            ctx.font = `bold ${Math.floor(r * 0.7)}px monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#5ee58f';
            ctx.fillText('⬡', cx, cy + 0.5);
          } else if (def && def.icon) {
            ctx.font = `${Math.floor(r * 0.58)}px serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            if (tile.claimed) {
              ctx.globalAlpha = 0.3;
              ctx.fillStyle = '#4a6a56';
              ctx.fillText('✓', cx, cy + 0.5);
              ctx.globalAlpha = 1;
            } else {
              ctx.fillStyle = tile.type === 'hazard' ? '#c05050' : '#b0d8c0';
              ctx.fillText(def.icon, cx, cy + 0.5);
            }
          }

          // Selection ring
          if (isSelected) {
            this.pathHex(ctx, cx, cy, r - 1.5);
            ctx.strokeStyle = 'rgba(94,229,143,0.5)';
            ctx.lineWidth = 1.2;
            ctx.stroke();
          }
        }
      }
    }

    // Draw active expedition scouts marching on map
    for (const exp of (G.expeditions || [])) {
      const region = EXP_ZONE_REGIONS[exp.zone];
      if (!region) continue;
      const progress = Math.min(1, exp.elapsed / exp.duration);
      const colC = this.hexCenter(MAP_COL_X, MAP_COL_Y);

      // Target pixel (approx center of region)
      const trX = region.cx * r * 1.5 + r + 4;
      const trY = region.cy * r * Math.sqrt(3) + (region.cx % 2 === 1 ? r * Math.sqrt(3) * 0.5 : 0) + r * Math.sqrt(3) * 0.5 + 4;

      const sx = colC.cx + (trX - colC.cx) * progress;
      const sy = colC.cy + (trY - colC.cy) * progress;

      // Dashed trail line
      ctx.save();
      ctx.globalAlpha = 0.28;
      ctx.strokeStyle = exp.done ? '#5ee58f' : '#78d7ff';
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 5]);
      ctx.beginPath();
      ctx.moveTo(colC.cx, colC.cy);
      ctx.lineTo(sx, sy);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();

      // Scout bugs cluster
      const bugColor = exp.done ? '#5ee58f' : '#78d7ff';
      for (let i = 0; i < Math.min(exp.bugs, 3); i++) {
        const wiggle = Math.sin(t * 7 + i * 1.8 + exp.zone.charCodeAt(0)) * 1.8;
        const bx = sx + (i - 1) * 5 + wiggle;
        const by = sy + i * 2.5;
        ctx.beginPath();
        ctx.ellipse(bx, by, 2.4, 1.5, 0, 0, Math.PI * 2);
        ctx.fillStyle = bugColor;
        ctx.fill();
        // Eye dot
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.fillRect(bx + 1.5, by - 0.7, 0.9, 0.9);
        // Antennae
        ctx.strokeStyle = bugColor + 'aa';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(bx + 1.8, by - 1.2);
        ctx.lineTo(bx + 3.2, by - 2.4 + Math.sin(t * 5 + i) * 0.6);
        ctx.stroke();
      }
    }

    // Draw outpost flags on map tiles
    for (const op of (G.outposts || [])) {
      const parts = op.key.split(',');
      const ox = parseInt(parts[0]), oy = parseInt(parts[1]);
      const { cx, cy } = this.hexCenter(ox, oy);
      const def = OUTPOST_DEFS[op.type];
      if (!def) continue;
      const isContested = op.status === 'contested';
      const isDormant = op.status === 'dormant';
      const flagColor = isContested ? '#ff6b6b' : isDormant ? '#556655' : def.color;
      // Flag pole
      ctx.strokeStyle = flagColor + 'cc';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(cx + r * 0.3, cy + r * 0.15);
      ctx.lineTo(cx + r * 0.3, cy - r * 0.65);
      ctx.stroke();
      // Flag banner
      ctx.fillStyle = flagColor + (isDormant ? '66' : 'cc');
      ctx.beginPath();
      ctx.moveTo(cx + r * 0.3, cy - r * 0.65);
      ctx.lineTo(cx + r * 0.72, cy - r * 0.52);
      ctx.lineTo(cx + r * 0.3, cy - r * 0.38);
      ctx.closePath();
      ctx.fill();
      // Pulsing glow when contested
      if (isContested) {
        const pulse = 0.4 + 0.55 * Math.abs(Math.sin(t * 3.5));
        ctx.beginPath();
        ctx.arc(cx + r * 0.3, cy - r * 0.52, r * 0.22, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,100,100,${pulse * 0.35})`;
        ctx.fill();
      }
    }

    // Draw map event markers
    for (const ev of (G.map_events || [])) {
      const parts = ev.key.split(',');
      const ex = parseInt(parts[0]), ey = parseInt(parts[1]);
      const { cx, cy } = this.hexCenter(ex, ey);
      const pulse = 0.5 + 0.45 * Math.abs(Math.sin(t * 2.2 + ex * 0.5));
      // Glowing ring
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.55, 0, Math.PI * 2);
      ctx.strokeStyle = ev.color + Math.floor(pulse * 180).toString(16).padStart(2,'0');
      ctx.lineWidth = 1.4;
      ctx.stroke();
      // Inner fill
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.3, 0, Math.PI * 2);
      ctx.fillStyle = ev.color + '44';
      ctx.fill();
      // Timer arc (countdown ring)
      const timerPct = ev.ticks_left / ev.max_ticks;
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.55, -Math.PI / 2, -Math.PI / 2 + timerPct * Math.PI * 2);
      ctx.strokeStyle = ev.color + 'cc';
      ctx.lineWidth = 1.8;
      ctx.stroke();
    }

    // Overlay text
    const ov = document.getElementById('map-overlay');
    if (ov) {
      const rev = mapRevealedCount();
      const act = (G.expeditions || []).length;
      const opCount = (G.outposts || []).filter(o => o.status === 'active').length;
      const contested = (G.outposts || []).filter(o => o.status === 'contested').length;
      const evCount = (G.map_events || []).length;
      let overlay = `${rev}/${MAP_W * MAP_H} tiles charted`;
      if (act > 0) overlay += ` · ${act} squad${act > 1 ? 's' : ''} out`;
      if (opCount > 0) overlay += ` · ${opCount} outpost${opCount > 1 ? 's' : ''}`;
      if (contested > 0) overlay += ` · ⚠ ${contested} contested`;
      if (evCount > 0) overlay += ` · ${evCount} event${evCount > 1 ? 's' : ''}`;
      ov.textContent = overlay;
    }
  },

  handleClick(canvas, event) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = (event.clientX - rect.left) * scaleX;
    const my = (event.clientY - rect.top) * scaleY;
    let found = null;
    outer: for (let x = 0; x < MAP_W; x++) {
      for (let y = 0; y < MAP_H; y++) {
        const { cx, cy } = this.hexCenter(x, y);
        if (this.inHex(mx, my, cx, cy)) { found = `${x},${y}`; break outer; }
      }
    }
    this.selectedKey = (found && this.selectedKey === found) ? null : found;
    // Refresh the content panel without restarting canvas
    const mapContent = document.getElementById('map-content');
    if (mapContent) mapContent.innerHTML = tabMapContent();
  },

  handleMove(canvas, event) {
    const rect = canvas.getBoundingClientRect();
    const mx = (event.clientX - rect.left) * (canvas.width / rect.width);
    const my = (event.clientY - rect.top) * (canvas.height / rect.height);
    let found = null;
    outer: for (let x = 0; x < MAP_W; x++) {
      for (let y = 0; y < MAP_H; y++) {
        const { cx, cy } = this.hexCenter(x, y);
        if (this.inHex(mx, my, cx, cy)) { found = `${x},${y}`; break outer; }
      }
    }
    this.hoveredKey = found;
  },

  loop(canvas) {
    if (!canvas || !canvas.parentNode) { this.inited = false; return; }
    this.draw(canvas);
    this.raf = requestAnimationFrame(() => this.loop(canvas));
  },

  start() {
    const canvas = document.getElementById('map-canvas');
    if (!canvas) return;
    const wrap = canvas.parentElement;
    canvas.width = wrap.clientWidth;
    canvas.height = wrap.clientHeight;
    if (!this._listenersAdded) {
      canvas.addEventListener('click', (e) => this.handleClick(canvas, e));
      canvas.addEventListener('mousemove', (e) => this.handleMove(canvas, e));
      canvas.addEventListener('mouseleave', () => { this.hoveredKey = null; });
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        this.handleClick(canvas, { clientX: touch.clientX, clientY: touch.clientY });
      }, { passive: false });
      this._listenersAdded = true;
    }
    if (this.raf) cancelAnimationFrame(this.raf);
    this.inited = true;
    this.loop(canvas);
  },

  stop() {
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = null;
    this.inited = false;
    this._listenersAdded = false;
  },
};

/* ── COLONY CANVAS ───────────────────────────── */

function colonyCanvasHTML() {
  return `<div id="colony-canvas-wrap">
    <canvas id="colony-canvas"></canvas>
    <div id="colony-overlay"></div>
  </div>
  <div id="colony-log-feed">
    <div class="clf-header">
      <span class="clf-title">COLONY LOG</span>
      <button class="clf-view-all" onclick="goTab('log')">FULL HISTORY ›</button>
    </div>
    <div class="clf-entries" id="clf-entries"></div>
  </div>`;
}

let _lastLogLength = 0;

function renderLogFeed() {
  const el = document.getElementById('clf-entries');
  if (!el) return;
  const isNew = G.log.length > _lastLogLength;
  _lastLogLength = G.log.length;
  // Slice newest entries then reverse so oldest is at top, newest at bottom
  const entries = G.log.slice(0, 12).reverse();
  el.innerHTML = entries.map((e, i) => {
    const isNewest = (i === entries.length - 1);
    const newCls = (isNewest && isNew) ? ' clf-new' : '';
    const typeCls = e.type === 'bad' ? ' bad' : e.type === 'ev' ? ' ev' : '';
    const realTimeStr = e.realTime ? ` <span class="clf-realtime">· ${e.realTime}</span>` : '';
    return `<div class="clf-entry${newCls}${typeCls}">
      <div class="clf-t">${e.time}${realTimeStr}</div>
      <div class="clf-m">${e.msg}</div>
    </div>`;
  }).join('');
  // Scroll to bottom so newest entry is always visible
  el.scrollTop = el.scrollHeight;
}

const ColonyViz = {
  bugs: [],
  particles: [],
  floatTexts: [],
  yieldBank: {},
  yieldTimers: {},
  buildings: [],
  grassOffsets: null,
  lastBldgHash: '',
  lastPop: -1,
  raf: null,
  inited: false,

  seasonPalette() {
    const s = seasonName();
    switch (s) {
      case 'Spring': return { sky:'#071a10', skyTop:'#040d09', ground:'#0d2217', grass:'#163d24', grassEdge:'#1f5432', accent:'#22c55e', particle:'#4ade80', fogAlpha:0, moonAlpha:0, cloudAlpha:0.06 };
      case 'Summer': return { sky:'#120f04', skyTop:'#0a0802', ground:'#221c08', grass:'#2e2510', grassEdge:'#3d3215', accent:'#f59e0b', particle:'#fbbf24', fogAlpha:0, moonAlpha:0, cloudAlpha:0.04 };
      case 'Autumn': return { sky:'#140c06', skyTop:'#0c0703', ground:'#1e1108', grass:'#271509', grassEdge:'#321a0b', accent:'#fb923c', particle:'#f97316', fogAlpha:0.04, moonAlpha:0.35, cloudAlpha:0 };
      case 'Winter': return { sky:'#060c16', skyTop:'#030609', ground:'#0b1220', grass:'#0e1828', grassEdge:'#14223a', accent:'#60a5fa', particle:'#93c5fd', fogAlpha:0.1, moonAlpha:0.7, cloudAlpha:0 };
    }
    return { sky:'#071a10', skyTop:'#040d09', ground:'#0d2217', grass:'#163d24', grassEdge:'#1f5432', accent:'#22c55e', particle:'#4ade80', fogAlpha:0, moonAlpha:0, cloudAlpha:0.06 };
  },

  syncBugs(canvas) {
    const pop = G.pop.total;
    const w = canvas.width;
    const h = canvas.height;
    const groundY = h * 0.58;
    const heroCount = (G.fighters || []).filter(f => f.hero && f.status !== 'scouting').length;

    // Build an ordered list of jobs assigned to bugs
    const JOB_COLOR = {
      forager:   '#fbbf24', leaf_col: '#22c55e', dirt_dig: '#a07830',
      scholar:   '#78d7ff', weaver:   '#94a3b8', miner:    '#e2e8f0',
      resin_tap: '#fb923c', spore_cult:'#c084fc', aeronaut: '#7dd3fc',
      nurse:     '#f9a8d4', excavator:'#8B5E3C', navigator:'#fcd34d',
      idle:      '#5ee58f',
    };
    const jobList = [];
    for (const [jid, count] of Object.entries(G.jobs || {})) {
      for (let i = 0; i < Math.min(count, 40); i++) jobList.push(jid);
    }
    const totalEmployed = jobList.length;
    const idleCount = Math.max(0, pop - totalEmployed);
    for (let i = 0; i < idleCount; i++) jobList.push('idle');

    const maxBugs = Math.min(pop, 40);
    while (this.bugs.length < maxBugs) {
      const bugIdx = this.bugs.length;
      const job = jobList[bugIdx % Math.max(1, jobList.length)] || 'idle';
      const isAir = job === 'aeronaut' || job === 'navigator';
      const yBase = isAir ? groundY * 0.3 + Math.random() * groundY * 0.3
                          : groundY + 4 + Math.random() * (h * 0.28);
      this.bugs.push({
        x: w * 0.1 + Math.random() * w * 0.8,
        y: yBase,
        vx: (Math.random() - 0.5) * 0.5,
        vy: 0,
        size: 2.2 + Math.random() * 1.6,
        color: JOB_COLOR[job] || '#5ee58f',
        pause: Math.random() * 200,
        wiggle: Math.random() * Math.PI * 2,
        working: job !== 'idle',
        job: job,
        targetX: null,
        targetY: null,
        isHero: bugIdx < heroCount,
        payloadPhase: Math.random() * Math.PI * 2,
        digPhase: Math.random() * Math.PI * 2,
      });
    }
    while (this.bugs.length > maxBugs) this.bugs.pop();

    // Refresh job/color/hero on existing bugs to reflect assignment changes
    this.bugs.forEach((bug, idx) => {
      bug.isHero = idx < heroCount;
      const job = jobList[idx % Math.max(1, jobList.length)] || 'idle';
      if (bug.job !== job) {
        bug.job = job;
        bug.color = JOB_COLOR[job] || '#5ee58f';
        bug.working = job !== 'idle';
        bug.targetX = null;
      }
    });
    this.lastPop = pop;
  },

  syncBuildings(canvas) {
    const hash = Object.entries(G.bldgs).map(([k, v]) => `${k}:${v}`).join(',');
    if (hash === this.lastBldgHash) return;
    this.lastBldgHash = hash;
    const w = canvas.width;
    const h = canvas.height;
    const groundY = h * 0.58;
    this.buildings = [];

    // Each entry: shape drives the draw call — 'dome','cone','mound','tower','hex','blob','arch','oval','spire','platform'
    const bldgVisuals = [
      { id:'nest',              color:'#a07830', shape:'dome',     minH:14, maxH:20 },
      { id:'clover_patch',      color:'#22c55e', shape:'mound',    minH:7,  maxH:11 },
      { id:'burrow',            color:'#7c5a28', shape:'arch',     minH:14, maxH:20 },
      { id:'fungal_garden',     color:'#c084fc', shape:'blob',     minH:10, maxH:16 },
      { id:'web_workshop',      color:'#94a3b8', shape:'box',      minH:12, maxH:18 },
      { id:'leaf_cache',        color:'#65a30d', shape:'box',      minH:9,  maxH:14 },
      { id:'anthill',           color:'#dc4e18', shape:'cone',     minH:22, maxH:34 },
      { id:'chrysalis_chamber', color:'#22d3ee', shape:'oval',     minH:12, maxH:18 },
      { id:'hive_observatory',  color:'#fcd34d', shape:'hex',      minH:16, maxH:24 },
      { id:'mycelium_network',  color:'#c084fc', shape:'mound',    minH:6,  maxH:10 },
      { id:'compound_lab',      color:'#2dd4bf', shape:'box',      minH:14, maxH:20 },
      { id:'flight_tower',      color:'#e2e8f0', shape:'tower',    minH:28, maxH:42 },
      { id:'sky_dock',          color:'#7dd3fc', shape:'platform', minH:18, maxH:28 },
      { id:'colony_spire',      color:'#e879f9', shape:'spire',    minH:32, maxH:50 },
      { id:'brood_nursery',     color:'#fca5a5', shape:'dome',     minH:14, maxH:20 },
      { id:'amber_vault',       color:'#fbbf24', shape:'hex',      minH:16, maxH:24 },
      { id:'sky_beacon',        color:'#93c5fd', shape:'tower',    minH:22, maxH:32 },
      { id:'cloud_condenser',   color:'#c4b5fd', shape:'platform', minH:14, maxH:22 },
      { id:'spore_circle',      color:'#a78bfa', shape:'blob',     minH:7,  maxH:12 },
      { id:'wax_foundry',       color:'#fb923c', shape:'box',      minH:11, maxH:17 },
      { id:'training_burrow',   color:'#f87171', shape:'arch',     minH:14, maxH:22 },
      { id:'healing_hollow',    color:'#34d399', shape:'dome',     minH:10, maxH:16 },
    ];

    let xCursor = 18;
    for (const bv of bldgVisuals) {
      const count = G.bldgs[bv.id] || 0;
      for (let i = 0; i < Math.min(count, 5); i++) {
        const bh = bv.minH + Math.random() * (bv.maxH - bv.minH);
        const bw = bh * (bv.shape === 'tower' || bv.shape === 'spire' ? 0.32 : bv.shape === 'cone' ? 0.65 : 0.7 + Math.random() * 0.35);
        this.buildings.push({
          x: xCursor + Math.random() * 10,
          y: groundY,
          w: bw, h: bh,
          color: bv.color,
          shape: bv.shape,
          id: bv.id,
          seed: Math.random(),
        });
        xCursor += bw + 5 + Math.random() * 10;
        if (xCursor > w - 18) xCursor = 18 + Math.random() * 28;
      }
    }
  },

  drawBuilding(ctx, b, t) {
    const bx = b.x, by = b.y, bw = b.w, bh = b.h;
    const cx = bx + bw / 2;
    const baseY = by; // ground level
    const topY = by - bh;
    const col = b.color;

    ctx.save();

    switch (b.shape) {

      case 'dome': {
        // Rounded dome rising from ground
        ctx.beginPath();
        ctx.moveTo(bx, baseY);
        ctx.bezierCurveTo(bx, topY + bh * 0.1, cx - bw * 0.55, topY, cx, topY);
        ctx.bezierCurveTo(cx + bw * 0.55, topY, bx + bw, topY + bh * 0.1, bx + bw, baseY);
        ctx.closePath();
        const dg = ctx.createLinearGradient(bx, topY, bx, baseY);
        dg.addColorStop(0, col + 'cc');
        dg.addColorStop(1, col + '44');
        ctx.fillStyle = dg;
        ctx.fill();
        ctx.strokeStyle = col + '99';
        ctx.lineWidth = 0.8;
        ctx.stroke();
        // Door arch
        ctx.beginPath();
        ctx.arc(cx, baseY, bw * 0.12, Math.PI, 0);
        ctx.lineTo(cx + bw * 0.12, baseY);
        ctx.lineTo(cx - bw * 0.12, baseY);
        ctx.fillStyle = col + '33';
        ctx.fill();
        // Glow highlight
        ctx.beginPath();
        ctx.arc(cx - bw * 0.1, topY + bh * 0.22, bw * 0.13, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.fill();
        break;
      }

      case 'cone': {
        // Tall anthill cone
        ctx.beginPath();
        ctx.moveTo(bx, baseY);
        ctx.lineTo(cx, topY);
        ctx.lineTo(bx + bw, baseY);
        ctx.closePath();
        const cg = ctx.createLinearGradient(bx, topY, bx + bw, baseY);
        cg.addColorStop(0, col + 'ee');
        cg.addColorStop(1, col + '55');
        ctx.fillStyle = cg;
        ctx.fill();
        ctx.strokeStyle = col + 'aa';
        ctx.lineWidth = 0.8;
        ctx.stroke();
        // Texture lines
        ctx.strokeStyle = col + '44';
        ctx.lineWidth = 0.5;
        for (let li = 1; li < 4; li++) {
          const lyf = li / 4;
          const lx1 = bx + (cx - bx) * lyf;
          const lx2 = (bx + bw) - ((bx + bw) - cx) * lyf;
          const ly = baseY - bh * lyf;
          ctx.beginPath(); ctx.moveTo(lx1, ly); ctx.lineTo(lx2, ly); ctx.stroke();
        }
        break;
      }

      case 'tower': {
        // Slim tower with crenellations
        const tw = bw * 0.85;
        const tx = cx - tw / 2;
        ctx.fillStyle = col + '66';
        ctx.fillRect(tx, topY, tw, bh);
        ctx.strokeStyle = col + '99';
        ctx.lineWidth = 0.8;
        ctx.strokeRect(tx, topY, tw, bh);
        // Crenellations at top
        const merlonW = tw / 5;
        ctx.fillStyle = col + 'aa';
        for (let mi = 0; mi < 3; mi++) {
          ctx.fillRect(tx + mi * merlonW * 1.6, topY - merlonW * 0.7, merlonW * 0.9, merlonW * 0.7);
        }
        // Glowing windows
        const wink = Math.sin(t * 1.2 + b.seed * 10) > 0.3;
        if (bh > 20) {
          ctx.fillStyle = wink ? col + 'dd' : col + '55';
          ctx.fillRect(cx - 2, topY + bh * 0.3, 4, 3);
          ctx.fillRect(cx - 2, topY + bh * 0.6, 4, 3);
        }
        break;
      }

      case 'spire': {
        // Ornate colony spire — tall + pointed tip
        const sw = bw * 0.7;
        const sx = cx - sw / 2;
        // Body
        ctx.fillStyle = col + '55';
        ctx.fillRect(sx, topY + bh * 0.15, sw, bh * 0.85);
        ctx.strokeStyle = col + '88';
        ctx.lineWidth = 0.8;
        ctx.strokeRect(sx, topY + bh * 0.15, sw, bh * 0.85);
        // Spire tip
        ctx.beginPath();
        ctx.moveTo(sx, topY + bh * 0.15);
        ctx.lineTo(cx, topY);
        ctx.lineTo(sx + sw, topY + bh * 0.15);
        ctx.closePath();
        const sg = ctx.createLinearGradient(cx, topY, cx, topY + bh * 0.15);
        sg.addColorStop(0, col + 'ff');
        sg.addColorStop(1, col + '77');
        ctx.fillStyle = sg;
        ctx.fill();
        // Pulsing tip glow
        const pulse = 0.4 + 0.35 * Math.sin(t * 2.2 + b.seed * 5);
        ctx.beginPath();
        ctx.arc(cx, topY, 3, 0, Math.PI * 2);
        ctx.fillStyle = col + Math.floor(pulse * 255).toString(16).padStart(2,'0');
        ctx.fill();
        // Windows
        ctx.fillStyle = col + '99';
        ctx.fillRect(cx - 2, topY + bh * 0.35, 4, 3);
        ctx.fillRect(cx - 2, topY + bh * 0.58, 4, 3);
        ctx.fillRect(cx - 2, topY + bh * 0.78, 4, 3);
        break;
      }

      case 'arch': {
        // Burrow/training burrow — low with arched entrance
        ctx.fillStyle = col + '55';
        ctx.fillRect(bx, topY + bh * 0.35, bw, bh * 0.65);
        ctx.strokeStyle = col + '88';
        ctx.lineWidth = 0.8;
        ctx.strokeRect(bx, topY + bh * 0.35, bw, bh * 0.65);
        // Arch top
        ctx.beginPath();
        ctx.arc(cx, topY + bh * 0.35, bw * 0.5, Math.PI, 0);
        ctx.closePath();
        const ag = ctx.createLinearGradient(bx, topY, bx, topY + bh * 0.35);
        ag.addColorStop(0, col + 'aa');
        ag.addColorStop(1, col + '55');
        ctx.fillStyle = ag;
        ctx.fill();
        ctx.strokeStyle = col + '88';
        ctx.stroke();
        // Dark entrance
        ctx.beginPath();
        ctx.arc(cx, baseY, bw * 0.18, Math.PI, 0);
        ctx.lineTo(cx + bw * 0.18, baseY);
        ctx.lineTo(cx - bw * 0.18, baseY);
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fill();
        break;
      }

      case 'hex': {
        // Hexagonal hive/vault
        const hr = bw * 0.5;
        ctx.beginPath();
        for (let si = 0; si < 6; si++) {
          const ang = (Math.PI / 3) * si - Math.PI / 6;
          const hx = cx + hr * Math.cos(ang);
          const hy = (topY + baseY) / 2 + (bh * 0.45) * Math.sin(ang);
          si === 0 ? ctx.moveTo(hx, hy) : ctx.lineTo(hx, hy);
        }
        ctx.closePath();
        const hg = ctx.createLinearGradient(cx, topY, cx, baseY);
        hg.addColorStop(0, col + 'cc');
        hg.addColorStop(1, col + '44');
        ctx.fillStyle = hg;
        ctx.fill();
        ctx.strokeStyle = col + 'aa';
        ctx.lineWidth = 0.8;
        ctx.stroke();
        // Inner hex outline
        ctx.beginPath();
        for (let si = 0; si < 6; si++) {
          const ang = (Math.PI / 3) * si - Math.PI / 6;
          const hx = cx + hr * 0.55 * Math.cos(ang);
          const hy = (topY + baseY) / 2 + (bh * 0.25) * Math.sin(ang);
          si === 0 ? ctx.moveTo(hx, hy) : ctx.lineTo(hx, hy);
        }
        ctx.closePath();
        ctx.strokeStyle = col + '44';
        ctx.stroke();
        break;
      }

      case 'blob': {
        // Organic fungal/mycelium blob
        ctx.beginPath();
        const pts = 7;
        for (let pi = 0; pi <= pts; pi++) {
          const ang = (Math.PI * 2 / pts) * pi - Math.PI / 2;
          const r = (bw * 0.5) * (0.75 + 0.25 * Math.sin(ang * 3.1 + b.seed * 8));
          const ry = (bh * 0.5) * (0.75 + 0.2 * Math.cos(ang * 2.3 + b.seed * 6));
          const px = cx + r * Math.cos(ang);
          const py = (topY + baseY) / 2 + ry * Math.sin(ang);
          pi === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath();
        const bg2 = ctx.createRadialGradient(cx, (topY+baseY)/2, 0, cx, (topY+baseY)/2, bw*0.5);
        bg2.addColorStop(0, col + 'cc');
        bg2.addColorStop(1, col + '33');
        ctx.fillStyle = bg2;
        ctx.fill();
        ctx.strokeStyle = col + '66';
        ctx.lineWidth = 0.6;
        ctx.stroke();
        // Spore dots
        ctx.fillStyle = col + '88';
        for (let di = 0; di < 3; di++) {
          const da = b.seed * 6 + di * 2.1;
          ctx.beginPath();
          ctx.arc(cx + bw * 0.25 * Math.cos(da), (topY+baseY)/2 + bh * 0.22 * Math.sin(da), 1.2, 0, Math.PI*2);
          ctx.fill();
        }
        break;
      }

      case 'oval': {
        // Chrysalis — vertical oval
        const ox = cx, oy = (topY + baseY) / 2;
        ctx.beginPath();
        ctx.ellipse(ox, oy, bw * 0.42, bh * 0.5, 0, 0, Math.PI * 2);
        const og = ctx.createRadialGradient(ox - bw*0.1, oy - bh*0.15, 0, ox, oy, bw*0.45);
        og.addColorStop(0, col + 'ee');
        og.addColorStop(0.6, col + '77');
        og.addColorStop(1, col + '22');
        ctx.fillStyle = og;
        ctx.fill();
        ctx.strokeStyle = col + 'aa';
        ctx.lineWidth = 0.8;
        ctx.stroke();
        // Inner glow pulse
        const op = 0.3 + 0.25 * Math.sin(t * 1.8 + b.seed * 7);
        ctx.beginPath();
        ctx.ellipse(ox, oy, bw * 0.22, bh * 0.28, 0, 0, Math.PI * 2);
        ctx.fillStyle = col + Math.floor(op * 255).toString(16).padStart(2,'0');
        ctx.fill();
        break;
      }

      case 'platform': {
        // Sky dock / cloud condenser — raised platform on legs
        const ph = bh * 0.3;
        const legH = bh * 0.45;
        // Legs
        ctx.strokeStyle = col + '66';
        ctx.lineWidth = 1.5;
        const legX1 = bx + bw * 0.22, legX2 = bx + bw * 0.78;
        ctx.beginPath(); ctx.moveTo(legX1, baseY); ctx.lineTo(legX1, baseY - legH); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(legX2, baseY); ctx.lineTo(legX2, baseY - legH); ctx.stroke();
        // Platform top
        ctx.fillStyle = col + '66';
        ctx.fillRect(bx, baseY - legH - ph, bw, ph);
        ctx.strokeStyle = col + '99';
        ctx.lineWidth = 0.8;
        ctx.strokeRect(bx, baseY - legH - ph, bw, ph);
        // Antenna
        ctx.strokeStyle = col + 'bb';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(cx, baseY - legH - ph); ctx.lineTo(cx, topY); ctx.stroke();
        ctx.beginPath();
        ctx.arc(cx, topY, 2.5, 0, Math.PI * 2);
        const pulse2 = 0.5 + 0.4 * Math.sin(t * 2.8 + b.seed * 4);
        ctx.fillStyle = col + Math.floor(pulse2 * 255).toString(16).padStart(2,'0');
        ctx.fill();
        break;
      }

      case 'mound': default: {
        // Simple low mound — clover patch, mycelium
        ctx.beginPath();
        ctx.arc(cx, baseY, bw * 0.5, Math.PI, 0);
        ctx.closePath();
        const mg = ctx.createLinearGradient(cx, topY, cx, baseY);
        mg.addColorStop(0, col + 'bb');
        mg.addColorStop(1, col + '33');
        ctx.fillStyle = mg;
        ctx.fill();
        ctx.strokeStyle = col + '77';
        ctx.lineWidth = 0.6;
        ctx.stroke();
        // Tiny dots on top
        ctx.fillStyle = col + 'cc';
        for (let di = 0; di < 4; di++) {
          const da = (di / 4) * Math.PI;
          ctx.beginPath();
          ctx.arc(cx + bw * 0.3 * Math.cos(da), baseY - bh * 0.6 + bh * 0.15 * Math.sin(da), 1.2, 0, Math.PI*2);
          ctx.fill();
        }
        break;
      }

      case 'box': {
        // Standard building — workshop, lab, cache
        ctx.fillStyle = col + '55';
        ctx.fillRect(bx, topY, bw, bh);
        ctx.strokeStyle = col + '88';
        ctx.lineWidth = 0.8;
        ctx.strokeRect(bx, topY, bw, bh);
        // Roof line
        ctx.fillStyle = col + '99';
        ctx.fillRect(bx, topY, bw, bh * 0.1);
        // Windows
        ctx.fillStyle = col + 'aa';
        ctx.fillRect(bx + bw * 0.2, topY + bh * 0.3, bw * 0.2, bh * 0.18);
        if (bw > 12) ctx.fillRect(bx + bw * 0.6, topY + bh * 0.3, bw * 0.2, bh * 0.18);
        // Door
        ctx.fillStyle = col + '33';
        ctx.fillRect(cx - bw * 0.1, topY + bh * 0.65, bw * 0.2, bh * 0.35);
        break;
      }
    }
    ctx.restore();
  },

  spawnParticle(canvas, type) {
    const pal = this.seasonPalette();
    const w = canvas.width;
    const h = canvas.height;
    const s = seasonName();
    const forced = type || null;

    // Event-driven particles
    if (forced === 'blight') {
      this.particles.push({ x: Math.random()*w, y: Math.random()*h*0.7, vx:(Math.random()-0.5)*0.3, vy:0.2+Math.random()*0.3, life:1, decay:0.012+Math.random()*0.008, size:2+Math.random()*2, color:'#991b1b', type:'blight' });
      return;
    }
    if (forced === 'brood') {
      const b = this.buildings.find(b => b.id === 'brood_nursery' || b.id === 'nest');
      const px = b ? b.x + b.w/2 : w/2;
      this.particles.push({ x:px+( Math.random()-0.5)*20, y:canvas.height*0.58-5, vx:(Math.random()-0.5)*0.8, vy:-0.5-Math.random()*1.2, life:1, decay:0.01+Math.random()*0.008, size:2+Math.random()*2.5, color:Math.random()<0.5?'#fbbf24':'#fde68a', type:'brood' });
      return;
    }
    if (forced === 'amber') {
      this.particles.push({ x:Math.random()*w, y:canvas.height*0.58+Math.random()*20, vx:(Math.random()-0.5)*0.4, vy:-0.3-Math.random()*0.5, life:1, decay:0.008+Math.random()*0.006, size:1.5+Math.random()*2, color:Math.random()<0.5?'#fbbf24':'#f59e0b', type:'amber' });
      return;
    }
    if (forced === 'star') {
      this.particles.push({ x:Math.random()*w, y:Math.random()*(canvas.height*0.55), vx:(Math.random()-0.5)*1.5, vy:-0.1-Math.random()*0.2, life:1, decay:0.005+Math.random()*0.005, size:1+Math.random()*2, color:Math.random()<0.5?'#93c5fd':'#e0e7ff', type:'star' });
      return;
    }
    if (forced === 'rain') {
      this.particles.push({ x:Math.random()*w, y:-5, vx:0.2, vy:2.5+Math.random()*1.5, life:0.8, decay:0.025+Math.random()*0.01, size:0.8, color:'#93c5fd', type:'rain' });
      return;
    }

    // Seasonal ambient
    if (s === 'Winter') {
      this.particles.push({ x:Math.random()*w, y:-5, vx:(Math.random()-0.5)*0.3, vy:0.35+Math.random()*0.5, life:1, decay:0.002+Math.random()*0.003, size:1+Math.random()*2, color:pal.particle, type:'snow' });
    } else if (s === 'Autumn') {
      this.particles.push({ x:Math.random()*w, y:-5, vx:0.3+Math.random()*0.5, vy:0.4+Math.random()*0.4, life:1, decay:0.004+Math.random()*0.003, size:2+Math.random()*3, color:Math.random()<0.5?'#fb923c':'#f97316', type:'leaf' });
    } else if (s === 'Spring') {
      this.particles.push({ x:Math.random()*w, y:h*0.3+Math.random()*h*0.35, vx:(Math.random()-0.5)*0.2, vy:-0.12-Math.random()*0.25, life:1, decay:0.007+Math.random()*0.005, size:1+Math.random()*1.5, color:Math.random()<0.5?'#bbf7d0':'#86efac', type:'pollen' });
    } else {
      this.particles.push({ x:Math.random()*w, y:h*0.3+Math.random()*h*0.45, vx:(Math.random()-0.5)*0.1, vy:-0.06-Math.random()*0.15, life:1, decay:0.005+Math.random()*0.003, size:1+Math.random(), color:pal.particle, type:'heat' });
    }
  },

  spawnWorkerFloat(jid, text, color = '#5ee58f') {
    const candidates = this.bugs.filter(b => b.job === jid);
    if (!candidates.length) return false;
    const bug = candidates[Math.floor(Math.random() * candidates.length)];
    this.floatTexts.push({
      x: bug.x,
      y: bug.y - bug.size - 8,
      vx: (Math.random() - 0.5) * 0.10,
      vy: -0.20 - Math.random() * 0.04,
      life: 1,
      decay: 0.010 + Math.random() * 0.003,
      text,
      color
    });
    return true;
  },

  flushYieldBank(jid, threshold = 0.12) {
    const bank = this.yieldBank[jid];
    if (!bank) return false;
    const entries = Object.entries(bank).filter(([, amount]) => amount > 0.0001).sort((a, b) => b[1] - a[1]);
    if (!entries.length) return false;
    const chosen = [];
    for (const entry of entries) {
      if (!chosen.length) chosen.push(entry);
      else if (chosen.length < 2 && entry[1] >= threshold * 0.45) chosen.push(entry);
    }
    const totalChosen = chosen.reduce((sum, [, amount]) => sum + amount, 0);
    if (totalChosen < Math.max(0.05, threshold * 0.45) && (this.yieldTimers[jid] || 0) < 4) return false;
    const text = chosen.map(([res, amount]) => `${RES[res].icon}+${fmtWorkerBurstAmt(amount)}`).join(' ');
    const color = WORKER_FLOAT_COLORS[chosen[0][0]] || '#5ee58f';
    if (!this.spawnWorkerFloat(jid, text, color)) return false;
    chosen.forEach(([res]) => { bank[res] = 0; });
    this.yieldTimers[jid] = 0;
    return true;
  },

  queueWorkerYields(breakdown) {
    for (const [jid, gains] of Object.entries(breakdown || {})) {
      if (!this.bugs.some(b => b.job === jid)) continue;
      const bank = this.yieldBank[jid] ||= {};
      this.yieldTimers[jid] = (this.yieldTimers[jid] || 0) + (TICK_MS / 1000);
      for (const [res, amount] of Object.entries(gains || {})) {
        if (amount > 0) bank[res] = (bank[res] || 0) + amount;
      }
      const total = Object.values(bank).reduce((sum, amount) => sum + amount, 0);
      const threshold = ['forager','leaf_col','excavator','aeronaut','navigator'].includes(jid) ? 0.16 : 0.11;
      const interval = ['dirt_dig','weaver','miner','resin_tap'].includes(jid) ? 5.8 : 4.4;
      if (total >= threshold * 1.8 || (this.yieldTimers[jid] >= interval && total >= 0.05)) {
        this.flushYieldBank(jid, threshold);
      }
    }
  },

  draw(canvas) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;
    const pal = this.seasonPalette();
    const groundY = h * 0.58;
    const t = Date.now() * 0.001;
    const s = seasonName();
    const evt = G.events.active;

    ctx.clearRect(0, 0, w, h);

    // ── Sky gradient ──────────────────────────────────
    const skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
    skyGrad.addColorStop(0, pal.skyTop);
    skyGrad.addColorStop(1, pal.sky);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, w, groundY);

    // ── Moon (Autumn / Winter) ────────────────────────
    if (pal.moonAlpha > 0) {
      const mx = w * 0.82, my = groundY * 0.22;
      ctx.globalAlpha = pal.moonAlpha * 0.7;
      const moonGlow = ctx.createRadialGradient(mx, my, 0, mx, my, 22);
      moonGlow.addColorStop(0, '#e0f2fe');
      moonGlow.addColorStop(0.45, '#bae6fd44');
      moonGlow.addColorStop(1, 'transparent');
      ctx.fillStyle = moonGlow;
      ctx.beginPath(); ctx.arc(mx, my, 22, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = pal.moonAlpha;
      ctx.beginPath(); ctx.arc(mx, my, 7, 0, Math.PI*2);
      ctx.fillStyle = s === 'Winter' ? '#e0f2fe' : '#fef3c7';
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // ── Stars ─────────────────────────────────────────
    if (s === 'Winter' || s === 'Autumn') {
      const starCount = s === 'Winter' ? 28 : 14;
      for (let i = 0; i < starCount; i++) {
        const sx = (i * 53 + 17) % w;
        const sy = (i * 37 + 11) % (groundY * 0.72);
        const twinkle = 0.15 + 0.25 * Math.sin(t * (0.8 + (i % 5) * 0.3) + i);
        ctx.globalAlpha = twinkle;
        ctx.fillStyle = i % 4 === 0 ? '#bae6fd' : '#f0f9ff';
        ctx.fillRect(sx, sy, i % 3 === 0 ? 1.5 : 1, i % 3 === 0 ? 1.5 : 1);
      }
      ctx.globalAlpha = 1;
    }

    // ── Clouds (Spring / Summer) ──────────────────────
    if (pal.cloudAlpha > 0) {
      ctx.globalAlpha = pal.cloudAlpha;
      ctx.fillStyle = s === 'Spring' ? '#d1fae5' : '#fefce8';
      const cloudPhase = (t * 6) % (w + 120);
      [[cloudPhase - 60, groundY * 0.18, 40, 14],
       [cloudPhase + 80, groundY * 0.32, 32, 10],
       [cloudPhase - 200, groundY * 0.12, 28, 9]].forEach(([cx2, cy2, rw, rh]) => {
        ctx.beginPath();
        ctx.ellipse(cx2 % (w + 100) - 50, cy2, rw, rh, 0, 0, Math.PI*2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    // ── Event sky tint ────────────────────────────────
    if (evt) {
      let tintCol = null;
      if (evt === 'hd_boost')    tintCol = 'rgba(34,197,94,0.07)';
      if (evt === 'hd_blight')   tintCol = 'rgba(127,29,29,0.14)';
      if (evt === 'hd_drought')  tintCol = 'rgba(120,53,15,0.10)';
      if (evt === 'brood_surge') tintCol = 'rgba(251,191,36,0.09)';
      if (evt === 'amber_rush')  tintCol = 'rgba(251,146,60,0.11)';
      if (evt === 'star_current')tintCol = 'rgba(120,215,255,0.10)';
      if (tintCol) { ctx.fillStyle = tintCol; ctx.fillRect(0, 0, w, groundY); }
    }

    // ── Fog ───────────────────────────────────────────
    if (pal.fogAlpha > 0) {
      const fg = ctx.createLinearGradient(0, groundY*0.5, 0, groundY);
      fg.addColorStop(0, `rgba(160,185,220,0)`);
      fg.addColorStop(1, `rgba(160,185,220,${pal.fogAlpha})`);
      ctx.fillStyle = fg;
      ctx.fillRect(0, 0, w, groundY);
    }

    // ── Ground ───────────────────────────────────────
    const gndGrad = ctx.createLinearGradient(0, groundY, 0, h);
    gndGrad.addColorStop(0, pal.grass);
    gndGrad.addColorStop(0.35, pal.grassEdge);
    gndGrad.addColorStop(1, pal.ground);
    ctx.fillStyle = gndGrad;
    ctx.fillRect(0, groundY, w, h - groundY);

    // ── Irregular grass edge ──────────────────────────
    if (!this.grassOffsets || this.grassOffsets.length !== Math.ceil(w / 8)) {
      this.grassOffsets = Array.from({length: Math.ceil(w/8)+1}, () => Math.random() * 3 - 1.5);
    }
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    for (let gi = 0; gi < this.grassOffsets.length; gi++) {
      ctx.lineTo(gi * 8, groundY + this.grassOffsets[gi]);
    }
    ctx.lineTo(w, groundY);
    ctx.lineTo(w, groundY + 4);
    ctx.lineTo(0, groundY + 4);
    ctx.closePath();
    ctx.fillStyle = pal.grassEdge;
    ctx.fill();

    // Ground line
    ctx.strokeStyle = pal.accent + '28';
    ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(w, groundY); ctx.stroke();

    // ── Buildings ─────────────────────────────────────
    for (const b of this.buildings) {
      this.drawBuilding(ctx, b, t);
    }

    // ── Particles ─────────────────────────────────────
    for (const p of this.particles) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      if (p.type === 'leaf') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.x * 0.01 + t * 1.1);
        ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
        ctx.restore();
      } else if (p.type === 'rain') {
        ctx.fillRect(p.x, p.y, 0.8, p.size * 3);
      } else if (p.type === 'blight') {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size/2, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#7f1d1d'; ctx.lineWidth = 0.4;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.size, p.y + p.size*0.8); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size/2, 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // ── Colony bugs ───────────────────────────────────
    for (const bug of this.bugs) {
      const facing = bug.vx >= 0 ? 1 : -1;
      const isHero = bug.isHero || false;
      const job = bug.job || 'idle';
      const isAir = job === 'aeronaut' || job === 'navigator';

      // Body
      ctx.fillStyle = isHero ? '#ffc562' : (bug.working ? bug.color : bug.color + 'aa');
      ctx.beginPath();
      ctx.ellipse(bug.x, bug.y, bug.size * (isHero ? 1.15 : 1), bug.size * (isHero ? 0.72 : 0.62), 0, 0, Math.PI*2);
      ctx.fill();

      // Wings for aeronauts / navigators
      if (isAir) {
        ctx.globalAlpha = 0.35 + 0.15 * Math.abs(Math.sin(bug.wiggle * 3));
        ctx.fillStyle = job === 'navigator' ? '#fcd34d88' : '#7dd3fc88';
        ctx.beginPath();
        ctx.ellipse(bug.x - facing * 1, bug.y - 1.5, bug.size * 1.4, bug.size * 0.5, -0.4 * facing, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(bug.x - facing * 1, bug.y + 1, bug.size * 1.2, bug.size * 0.4, 0.3 * facing, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      // Head nub
      ctx.beginPath();
      ctx.arc(bug.x + facing * bug.size * 0.72, bug.y, bug.size * 0.36, 0, Math.PI*2);
      ctx.fillStyle = isHero ? '#f59e0b' : bug.color;
      ctx.fill();
      // Eye
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.fillRect(bug.x + facing * (bug.size * 0.68), bug.y - bug.size * 0.2, 1.2, 1.2);
      // Antennae
      ctx.strokeStyle = (isHero ? '#fbbf24' : bug.color) + 'bb';
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      ctx.moveTo(bug.x + facing * bug.size * 0.6, bug.y - bug.size * 0.3);
      ctx.lineTo(bug.x + facing * (bug.size * 0.6 + 2.5), bug.y - bug.size * 0.8 + Math.sin(bug.wiggle * 2) * 0.8);
      ctx.stroke();

      // ── Job-specific payload / activity visuals ───────
      const pp = bug.payloadPhase || 0;
      const bobY = bug.y - bug.size - 3 + Math.sin(pp) * 0.8;

      if (isHero) {
        const starPulse = Math.sin(t * 3 + bug.wiggle) > 0.3;
        if (starPulse) {
          ctx.fillStyle = '#ffc562cc';
          ctx.fillRect(bug.x - 1.5, bug.y - bug.size - 4, 3, 3);
          ctx.fillStyle = '#ffc56288';
          ctx.fillRect(bug.x - 2.5, bug.y - bug.size - 3, 1, 1);
          ctx.fillRect(bug.x + 1.5, bug.y - bug.size - 3, 1, 1);
        }
      } else if (job === 'leaf_col') {
        // Tiny leaf shape carried above
        ctx.save();
        ctx.translate(bug.x + Math.sin(pp) * 1.2, bobY);
        ctx.rotate(Math.sin(pp * 0.7) * 0.4);
        ctx.fillStyle = '#22c55e';
        ctx.beginPath();
        ctx.ellipse(0, 0, 3.2, 2.0, 0.4, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#16a34a88';
        ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(0, 2); ctx.stroke();
        ctx.restore();
      } else if (job === 'forager') {
        // Tiny honeydew drop above
        ctx.fillStyle = '#fbbf24cc';
        ctx.beginPath();
        ctx.arc(bug.x, bobY - 1, 2.0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fde68a88';
        ctx.beginPath();
        ctx.arc(bug.x - 0.6, bobY - 1.8, 0.8, 0, Math.PI * 2);
        ctx.fill();
      } else if (job === 'dirt_dig') {
        // Dirt particles kicked up when digging
        const digAnim = Math.abs(Math.sin(bug.digPhase || 0));
        if (digAnim > 0.5) {
          ctx.globalAlpha = (digAnim - 0.5) * 2;
          ctx.fillStyle = '#a07830';
          ctx.beginPath(); ctx.arc(bug.x - 2.5, bug.y + bug.size + 1, 1.2, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(bug.x + 2.0, bug.y + bug.size + 2, 0.9, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(bug.x, bug.y + bug.size + 3, 1.0, 0, Math.PI*2); ctx.fill();
          ctx.globalAlpha = 1;
        }
        // Small dirt chunk carried
        ctx.fillStyle = '#92400e99';
        ctx.beginPath(); ctx.arc(bug.x, bobY, 1.8, 0, Math.PI*2); ctx.fill();
      } else if (job === 'scholar') {
        // Floating insight orb
        const glow = 0.4 + 0.4 * Math.sin(pp * 1.3);
        ctx.globalAlpha = glow;
        const sg = ctx.createRadialGradient(bug.x, bobY, 0, bug.x, bobY, 3.5);
        sg.addColorStop(0, '#bae6fd');
        sg.addColorStop(1, 'transparent');
        ctx.fillStyle = sg;
        ctx.beginPath(); ctx.arc(bug.x, bobY, 3.5, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 0.7 + 0.3 * Math.sin(pp * 1.3);
        ctx.fillStyle = '#93c5fd';
        ctx.beginPath(); ctx.arc(bug.x, bobY, 1.6, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
      } else if (job === 'weaver') {
        // Silk thread trailing behind
        ctx.strokeStyle = '#cbd5e1bb';
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.moveTo(bug.x, bug.y);
        for (let si = 1; si <= 5; si++) {
          ctx.lineTo(bug.x - facing * si * 2.2, bug.y + Math.sin(pp + si * 0.8) * 1.2);
        }
        ctx.stroke();
        // Silk spool above
        ctx.fillStyle = '#94a3b8cc';
        ctx.beginPath(); ctx.arc(bug.x, bobY, 2.0, 0, Math.PI*2); ctx.fill();
      } else if (job === 'miner') {
        // Chitin hex shard carried
        ctx.save();
        ctx.translate(bug.x, bobY);
        ctx.rotate(pp * 0.5);
        ctx.fillStyle = '#e2e8f0cc';
        ctx.beginPath();
        for (let hi = 0; hi < 6; hi++) {
          const hx = 2.2 * Math.cos(hi * Math.PI / 3);
          const hy = 2.2 * Math.sin(hi * Math.PI / 3);
          hi === 0 ? ctx.moveTo(hx, hy) : ctx.lineTo(hx, hy);
        }
        ctx.closePath(); ctx.fill();
        ctx.restore();
      } else if (job === 'resin_tap') {
        // Amber drop dripping down
        const drip = (pp % (Math.PI * 2)) / (Math.PI * 2);
        ctx.fillStyle = '#fb923ccc';
        ctx.beginPath();
        ctx.arc(bug.x, bug.y - bug.size - 2, 2.0, 0, Math.PI*2);
        ctx.fill();
        if (drip > 0.4 && drip < 0.9) {
          ctx.globalAlpha = 1 - (drip - 0.4) / 0.5;
          ctx.beginPath();
          ctx.arc(bug.x, bug.y - bug.size + (drip - 0.4) * 12, 1.2, 0, Math.PI*2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      } else if (job === 'spore_cult') {
        // Small spore cloud orbiting
        for (let si = 0; si < 3; si++) {
          const sa = pp + (si / 3) * Math.PI * 2;
          const sr = 4.5 + Math.sin(pp * 2 + si) * 1;
          ctx.globalAlpha = 0.5 + 0.25 * Math.sin(pp + si);
          ctx.fillStyle = '#c084fc';
          ctx.beginPath();
          ctx.arc(bug.x + Math.cos(sa) * sr, bug.y + Math.sin(sa) * sr * 0.6, 1.2, 0, Math.PI*2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      } else if (job === 'nurse') {
        // Pulsing care glow + tiny cross above
        const nurseGlow = 0.25 + 0.2 * Math.sin(pp * 0.8);
        ctx.globalAlpha = nurseGlow;
        ctx.fillStyle = '#f9a8d4';
        ctx.beginPath(); ctx.arc(bug.x, bug.y, bug.size + 3, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = '#fda4af';
        ctx.fillRect(bug.x - 0.6, bobY - 2, 1.2, 4);
        ctx.fillRect(bug.x - 2, bobY - 0.6, 4, 1.2);
        ctx.globalAlpha = 1;
      } else if (job === 'excavator') {
        // Larger dirt throw when digging
        const exc = Math.abs(Math.sin((bug.digPhase || 0) * 1.4));
        if (exc > 0.4) {
          ctx.globalAlpha = (exc - 0.4) * 1.6;
          ctx.fillStyle = '#854d0e';
          [-4, -1.5, 1.5, 4].forEach((ox, i) => {
            ctx.beginPath();
            ctx.arc(bug.x + ox, bug.y + bug.size + 1 + i * 0.5, 1.2 + i * 0.2, 0, Math.PI*2);
            ctx.fill();
          });
          ctx.globalAlpha = 1;
        }
        ctx.fillStyle = '#b45309cc';
        ctx.beginPath(); ctx.arc(bug.x, bobY, 2.2, 0, Math.PI*2); ctx.fill();
      } else if (job === 'aeronaut') {
        // Aether wisps trailing
        for (let ai = 0; ai < 3; ai++) {
          const aa = pp * 1.5 + ai * 1.1;
          ctx.globalAlpha = 0.3 + 0.2 * Math.sin(aa);
          ctx.fillStyle = '#7dd3fc';
          ctx.beginPath();
          ctx.arc(bug.x - facing * (ai + 1) * 3.5, bug.y + Math.sin(aa) * 2, 1.5 - ai * 0.3, 0, Math.PI*2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      } else if (job === 'navigator') {
        // Star trail
        for (let ni = 0; ni < 3; ni++) {
          const na = pp + ni * 0.9;
          ctx.globalAlpha = 0.35 + 0.2 * Math.sin(na);
          ctx.fillStyle = '#fcd34d';
          ctx.fillRect(bug.x - facing * (ni + 1) * 3.2 - 0.5, bug.y + Math.sin(na * 2) * 1.8 - 0.5, 1.2, 1.2);
        }
        // Star above
        ctx.globalAlpha = 0.6 + 0.3 * Math.sin(pp * 2);
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(bug.x - 1, bug.y - bug.size - 5, 2, 2);
        ctx.fillRect(bug.x - 0.4, bug.y - bug.size - 6.5, 0.8, 3.5);
        ctx.fillRect(bug.x - 2.5, bug.y - bug.size - 4.5, 5, 0.8);
        ctx.globalAlpha = 1;
      } else if (bug.working) {
        // Generic working sparkle
        const spk = Math.sin(t * 5 + bug.wiggle) > 0.65;
        if (spk) {
          ctx.fillStyle = pal.accent + 'bb';
          ctx.fillRect(bug.x - 1, bug.y - bug.size - 3, 2, 2);
        }
      }
    }

    // ── Floating worker yields ──────────────────────
    if (this.floatTexts.length) {
      ctx.save();
      ctx.font = 'bold 10px Space Mono, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.6)';
      ctx.shadowBlur = 5;
      for (const floatText of this.floatTexts) {
        ctx.globalAlpha = Math.max(0, Math.min(1, floatText.life * 1.25));
        ctx.fillStyle = floatText.color;
        ctx.fillText(floatText.text, floatText.x, floatText.y);
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // ── Expedition bugs marching right ───────────────
    const expCount = bugsOnExpedition();
    if (expCount > 0) {
      for (let i = 0; i < Math.min(expCount, 4); i++) {
        const march = ((t * 28 + i * 18) % (w + 40));
        const ey = groundY + 6 + i * 5;
        // Trail
        ctx.globalAlpha = 0.25;
        ctx.fillStyle = '#78d7ff';
        ctx.fillRect(march - 10, ey, 8, 1.5);
        ctx.globalAlpha = 1;
        // Bug
        ctx.fillStyle = '#78d7ff';
        ctx.beginPath();
        ctx.ellipse(march, ey, 2.8, 1.8, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(march + 2, ey - 1, 1, 1);
      }
    }

    // ── Scouting fighters marching left ──────────────
    const scoutingFighters = (G.fighters || []).filter(f => f.status === 'scouting');
    if (scoutingFighters.length > 0) {
      for (let i = 0; i < Math.min(scoutingFighters.length, 3); i++) {
        const march = w - ((t * 22 + i * 22) % (w + 40));
        const fy = groundY + 10 + i * 6;
        ctx.globalAlpha = 0.3;
        ctx.fillStyle = '#f87171';
        ctx.fillRect(march, fy, 8, 1.5);
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#f87171';
        ctx.beginPath();
        ctx.ellipse(march, fy, 2.8, 1.8, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(march - 3, fy - 1, 1, 1);
      }
    }

    // ── Recovering fighters near Healing Hollow ───────
    const recoveringFighters = (G.fighters || []).filter(f => f.status === 'recovering');
    if (recoveringFighters.length > 0) {
      const hollow = this.buildings.find(b => b.id === 'healing_hollow');
      const rx = hollow ? hollow.x + hollow.w / 2 : w * 0.15;
      for (let i = 0; i < Math.min(recoveringFighters.length, 3); i++) {
        const rf = recoveringFighters[i];
        const hpRatio = rf.hp / rf.max_hp;
        const wobble = Math.sin(t * 0.8 + i * 1.4) * 1.5;
        const bx2 = rx + (i - 1) * 9 + wobble;
        const by2 = groundY + 8 + i * 2;
        ctx.globalAlpha = 0.5 + hpRatio * 0.4;
        ctx.fillStyle = '#34d399';
        ctx.beginPath();
        ctx.ellipse(bx2, by2, 2.4, 1.5, 0, 0, Math.PI*2);
        ctx.fill();
        // Tiny cross above to indicate healing
        ctx.fillStyle = '#34d399cc';
        ctx.fillRect(bx2 - 0.5, by2 - 5, 1, 3);
        ctx.fillRect(bx2 - 1.5, by2 - 4, 3, 1);
        ctx.globalAlpha = 1;
      }
    }

    // ── Active raid: enemy invaders marching from right ─
    const activeRaid = G.conflict && G.conflict.raid;
    if (activeRaid) {
      const raidPct = Math.max(0, Math.min(1, activeRaid.ticks_left / RAID_RESPONSE_TICKS));
      // Invaders approach from the right; travel from ~w+60 to w*0.35 as timer drains
      const invaderX = w * 0.9 - (1 - raidPct) * (w * 0.55);
      const numInvaders = 3;
      for (let i = 0; i < numInvaders; i++) {
        const ix = invaderX + i * 10 + Math.sin(t * 3 + i) * 1.2;
        const iy = groundY + 6 + i * 6;
        // Red trail
        ctx.globalAlpha = 0.22;
        ctx.fillStyle = '#f87171';
        ctx.fillRect(ix + 3, iy, 16, 1.5);
        ctx.globalAlpha = 1;
        // Invader body (larger, menacing — slightly bigger and redder than normal bugs)
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.ellipse(ix, iy, 3.8, 2.4, 0, 0, Math.PI*2);
        ctx.fill();
        // Head nub (facing left, toward the colony)
        ctx.fillStyle = '#dc2626';
        ctx.beginPath();
        ctx.arc(ix - 3.5, iy, 1.8, 0, Math.PI*2);
        ctx.fill();
        // White eye
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.fillRect(ix - 4.2, iy - 1.2, 1.4, 1.4);
        // Antenna toward colony
        ctx.strokeStyle = '#dc262688';
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.moveTo(ix - 3.2, iy - 1.6);
        ctx.lineTo(ix - 6 + Math.sin(t * 4 + i) * 0.8, iy - 4);
        ctx.stroke();
      }
      // Warning flash overlay when timer < 30%
      if (raidPct < 0.30) {
        const pulse = Math.sin(t * 8) * 0.5 + 0.5;
        ctx.globalAlpha = 0.04 * pulse;
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(0, 0, w, h);
        ctx.globalAlpha = 1;
      }
      // RAID label above invaders
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = '#f87171';
      ctx.font = `bold 7px monospace`;
      ctx.textAlign = 'center';
      ctx.fillText('⚠ RAID', invaderX + 10, groundY - 4);
      ctx.textAlign = 'left';
      ctx.globalAlpha = 1;
    }

    // ── Overlay label ─────────────────────────────────
    const overlay = document.getElementById('colony-overlay');
    if (overlay) {
      const evtLabel = evt ? ` · ${evt.replace(/_/g,' ')}` : '';
      overlay.textContent = `${s} · Y${G.time.year}${evtLabel}`;
    }
  },

  update(canvas) {
    const w = canvas.width;
    const h = canvas.height;
    const groundY = h * 0.58;
    const t = Date.now() * 0.001;
    const evt = G.events.active;

    // Helper: find a building of a given id (or fallback to any building)
    const findBldg = (ids) => {
      for (const id of (Array.isArray(ids) ? ids : [ids])) {
        const b = this.buildings.find(b => b.id === id);
        if (b) return b;
      }
      return this.buildings.length > 0 ? this.buildings[Math.floor(Math.random() * this.buildings.length)] : null;
    };

    // Per-job target building preferences
    const JOB_BLDG = {
      forager:   ['clover_patch','fungal_garden'],
      leaf_col:  ['leaf_cache','clover_patch'],
      dirt_dig:  ['burrow','anthill','nest'],
      scholar:   ['hive_observatory','chrysalis_chamber','compound_lab'],
      weaver:    ['web_workshop'],
      miner:     ['anthill','compound_lab'],
      resin_tap: ['wax_foundry','amber_vault'],
      spore_cult:['spore_circle','fungal_garden','mycelium_network'],
      aeronaut:  ['sky_dock','flight_tower','sky_beacon'],
      nurse:     ['brood_nursery','nest'],
      excavator: ['amber_vault','burrow'],
      navigator: ['sky_beacon','flight_tower','cloud_condenser'],
      idle:      null,
    };

    for (const bug of this.bugs) {
      if (bug.pause > 0) { bug.pause -= 16; continue; }
      bug.wiggle += 0.055;
      bug.payloadPhase = (bug.payloadPhase || 0) + 0.04;
      bug.digPhase = (bug.digPhase || 0) + 0.12;

      const job = bug.job || 'idle';
      const isAir = job === 'aeronaut' || job === 'navigator';

      if (bug.working && this.buildings.length > 0) {
        const retargetChance = job === 'scholar' ? 0.002 : job === 'nurse' ? 0.003 : 0.005;
        if (!bug.targetX || Math.random() < retargetChance) {
          const bldgIds = JOB_BLDG[job];
          const tgt = bldgIds ? findBldg(bldgIds) : this.buildings[Math.floor(Math.random() * this.buildings.length)];
          if (tgt) {
            bug.targetX = tgt.x + tgt.w / 2 + (Math.random() - 0.5) * 16;
            if (isAir) {
              bug.targetY = groundY * (0.12 + Math.random() * 0.35);
            } else if (job === 'dirt_dig' || job === 'excavator') {
              bug.targetY = groundY + 8 + Math.random() * (h - groundY - 16);
            } else {
              bug.targetY = groundY + 4 + Math.random() * (h - groundY - 10);
            }
          }
        }
        const dx = bug.targetX - bug.x;
        const speed = job === 'scholar' || job === 'nurse' ? 0.0018 : isAir ? 0.004 : 0.003;
        bug.vx += dx * speed;
        const maxV = isAir ? 1.2 : job === 'scholar' || job === 'nurse' ? 0.5 : 0.9;
        bug.vx = Math.max(-maxV, Math.min(maxV, bug.vx));

        // Air bugs drift vertically toward their target y
        if (isAir && bug.targetY !== null) {
          const dy = bug.targetY - bug.y;
          bug.vy = (bug.vy || 0) + dy * 0.006;
          bug.vy = Math.max(-0.6, Math.min(0.6, bug.vy));
        }
      } else {
        if (Math.random() < 0.012) {
          bug.vx = (Math.random() - 0.5) * 0.45;
          bug.pause = 40 + Math.random() * 140;
          bug.targetX = null;
        }
      }

      // Dirt diggers do a vertical bobbing "dig" motion
      const digBob = (job === 'dirt_dig' || job === 'excavator') ? Math.abs(Math.sin(bug.digPhase)) * 0.5 : 0;

      bug.x += bug.vx + Math.sin(bug.wiggle) * 0.12;
      bug.y += (bug.vy || 0) + Math.sin(bug.wiggle * 0.7) * 0.08 + digBob;

      if (bug.x < 5)   { bug.x = 5;   bug.vx *= -1; }
      if (bug.x > w-5) { bug.x = w-5; bug.vx *= -1; }

      // Y clamping depends on job
      if (isAir) {
        if (bug.y < 4) bug.y = 4;
        if (bug.y > groundY - 6) { bug.y = groundY - 6; bug.vy = (bug.vy || 0) * -0.5; }
      } else {
        if (bug.y < groundY + 2) bug.y = groundY + 2;
        if (bug.y > h - 5) bug.y = h - 5;
      }
    }

    // Update particles
    for (const p of this.particles) {
      p.x += p.vx; p.y += p.vy; p.life -= p.decay;
    }
    this.particles = this.particles.filter(p => p.life > 0 && p.y < h + 10);

    for (const floatText of this.floatTexts) {
      floatText.x += floatText.vx;
      floatText.y += floatText.vy;
      floatText.life -= floatText.decay;
    }
    this.floatTexts = this.floatTexts.filter(floatText => floatText.life > 0);

    // Ambient spawning
    const spawnRate = evt === 'hd_blight' ? 0.25 : evt === 'brood_surge' ? 0.35 : evt === 'amber_rush' ? 0.28 : evt === 'star_current' ? 0.22 : 0.13;
    if (Math.random() < spawnRate) {
      if (evt === 'hd_blight' && Math.random() < 0.55)       this.spawnParticle(canvas, 'blight');
      else if (evt === 'brood_surge' && Math.random() < 0.6)  this.spawnParticle(canvas, 'brood');
      else if (evt === 'amber_rush' && Math.random() < 0.55)  this.spawnParticle(canvas, 'amber');
      else if (evt === 'star_current' && Math.random() < 0.5) this.spawnParticle(canvas, 'star');
      else if (evt === 'hd_boost' && Math.random() < 0.35)    this.spawnParticle(canvas, 'rain');
      else this.spawnParticle(canvas);
    }
  },

  loop(canvas) {
    if (!canvas || !canvas.parentNode) { this.inited = false; return; }
    this.syncBugs(canvas);
    this.syncBuildings(canvas);
    this.update(canvas);
    this.draw(canvas);
    this.raf = requestAnimationFrame(() => this.loop(canvas));
  },

  start() {
    const canvas = document.getElementById('colony-canvas');
    if (!canvas) return;
    const wrap = canvas.parentElement;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = wrap.clientWidth * dpr;
    canvas.height = wrap.clientHeight * dpr;
    canvas.getContext('2d').scale(dpr, dpr);
    canvas.style.width = wrap.clientWidth + 'px';
    canvas.style.height = wrap.clientHeight + 'px';
    // Re-scale draw coords
    canvas.width = wrap.clientWidth;
    canvas.height = wrap.clientHeight;
    if (this.raf) cancelAnimationFrame(this.raf);
    this.inited = true;
    this.loop(canvas);
  },

  stop() {
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = null;
    this.inited = false;
  },
};

(function init() {
  const loaded = loadGame();
  if (loaded) {
    const lastSave = parseInt(localStorage.getItem(SAVE_TS_KEY) || '0', 10);
    const now = Date.now();
    const offlineSec = lastSave ? Math.floor((now - lastSave) / 1000) : 0;
    if (offlineSec > 10) applyOffline(offlineSec);
  }
  localStorage.setItem(SAVE_TS_KEY, String(Date.now()));
  // Generate a seasonal challenge if none exists and player has started
  if (!G.challenge && (G.pop.total >= 1 || G.stats.built > 0)) {
    G.challenge = generateChallenge(seasonName(), G.time.year);
  }
  renderAll();
  const gatherBtn = document.getElementById('gather-btn');
  if (gatherBtn) gatherBtn.addEventListener('dblclick', e => e.preventDefault());
  const confirmModal = document.getElementById('confirm-modal');
  if (confirmModal) {
    confirmModal.addEventListener('click', e => {
      if (e.target === confirmModal) closeConfirmModal();
    });
  }
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeConfirmModal(); closeStatsModal(); dismissSeasonAnnounce(); dismissFeatureAnnounce(); }
  });
  window.addEventListener('resize', () => {
    syncNavPageToTab(curTab);
    if (curTab === 'colony' && ColonyViz.inited) ColonyViz.start();
    if (curTab === 'map' && MapViz.inited) MapViz.start();
  });
  // Save when app is backgrounded on mobile (visibilitychange) or tab is closed
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') saveGame();
  });
  // iOS Safari fires pagehide instead of visibilitychange reliably
  window.addEventListener('pagehide', () => saveGame());
  setInterval(() => {
    tick();
    tickN++;
    renderResStrip();
    if (tickN % 4 === 0) renderTopBar();
    if (tickN % 10 === 0) {
      renderTab();
      renderChoiceEvent();
      renderLogFeed();
      localStorage.setItem(SAVE_TS_KEY, String(Date.now()));
    }
    if (tickN % 300 === 0) saveGame();
  }, TICK_MS);
})();

</script>
