<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bug Colony</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:         #07110d;
  --bg2:        #0b1712;
  --surface:    #10201b;
  --surface2:   #162b24;
  --surface3:   #1b352c;
  --surface4:   #223e34;
  --border:     #234238;
  --border2:    #31574a;
  --text:       #99b9a8;
  --text-hi:    #e4f1e8;
  --text-lo:    #648777;
  --accent:     #5ee58f;
  --accent-d:   #218f55;
  --accent-dd:  #123c28;
  --amber:      #ffc562;
  --amber-d:    #8a5b0f;
  --sky:        #78d7ff;
  --sky-d:      #1f6e98;
  --purple:     #b798ff;
  --purple-d:   #5b3bb2;
  --red:        #ff8b89;
  --orange:     #ff9f5a;
  --shadow:     0 10px 30px rgba(0,0,0,0.28);
  --glow:       0 0 0 1px rgba(94,229,143,0.15), 0 8px 22px rgba(94,229,143,0.08);
  --mono: 'Space Mono', monospace;
  --sans: 'DM Sans', sans-serif;
  --r: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  height: 100vh;
  font-size: 14px;
  line-height: 1.4;
}

/* ── TOP BAR ─────────────────────────────────── */
#top-bar {
  display: flex;
  align-items: center;
  padding: 0 12px;
  height: 46px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  gap: 8px;
  background: linear-gradient(180deg, rgba(27,53,44,0.95), rgba(16,32,27,0.98));
  box-shadow: var(--shadow);
}

#logo {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--accent);
  letter-spacing: 3px;
  font-weight: 700;
  white-space: nowrap;
}

#time-pill {
  flex: 1;
  display: flex;
  justify-content: center;
}

#season-pill {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 20px;
  letter-spacing: 1px;
  white-space: nowrap;
  transition: background 0.5s, color 0.5s;
}

#pop-display {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--amber);
  white-space: nowrap;
}

#gather-btn {
  background: linear-gradient(180deg, var(--accent-d), var(--accent-dd));
  border: 1px solid rgba(94,229,143,0.35);
  color: var(--text-hi);
  font-family: var(--mono);
  font-size: 10px;
  padding: 0 12px;
  height: 30px;
  border-radius: var(--r);
  cursor: pointer;
  letter-spacing: 1px;
  font-weight: 700;
  transition: background 0.1s, transform 0.08s, box-shadow 0.2s;
  white-space: nowrap;
  user-select: none;
  touch-action: manipulation;
  -webkit-touch-callout: none;
  box-shadow: var(--glow);
}
#gather-btn:active { background: var(--accent-d); transform: scale(0.96); }
#gather-btn:hover { box-shadow: 0 0 0 1px rgba(94,229,143,0.3), 0 10px 26px rgba(94,229,143,0.15); }

/* ── SEASON PROGRESS ──────────────────────────── */
#season-bar { height: 2px; background: var(--surface2); flex-shrink: 0; }
#season-fill { height: 100%; width: 0%; transition: width 0.15s linear; }

/* ── RESOURCES STRIP ─────────────────────────── */
#res-strip {
  display: flex;
  gap: 5px;
  padding: 6px 10px;
  overflow-x: auto;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  background: var(--surface);
}
#res-strip::-webkit-scrollbar { display: none; }

.rc {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 68px;
  padding: 5px 7px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r);
  flex-shrink: 0;
  transition: border-color 0.3s;
}
.rc.warn  { border-color: var(--amber-d); }
.rc.full  { border-color: #5a1010; }

.rc-name  { font-size: 9px; color: var(--text-lo); margin-bottom: 1px; white-space: nowrap; }
.rc-amt   { font-family: var(--mono); font-size: 12px; color: var(--text-hi); font-weight: 700; }
.rc-max   { font-family: var(--mono); font-size: 8px; color: var(--text-lo); }
.rc-rate  { font-family: var(--mono); font-size: 9px; margin-top: 1px; }
.rp { color: var(--accent); }
.rn { color: var(--red); }
.rz { color: var(--text-lo); }

/* ── MAIN LAYOUT ─────────────────────────────── */
#content {
  flex: 1;
  overflow-y: auto;
  padding: 10px 10px 4px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
#content::-webkit-scrollbar { width: 3px; }
#content::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ── BOTTOM NAV ──────────────────────────────── */
#bot-nav {
  display: flex;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--surface);
}

.nb {
  flex: 1;
  padding: 8px 2px;
  background: transparent;
  border: none;
  color: var(--text-lo);
  font-family: var(--mono);
  font-size: 9px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  letter-spacing: 0.5px;
  transition: color 0.15s;
  user-select: none;
}
.nb.on {
  color: var(--text-hi);
  background: linear-gradient(180deg, rgba(94,229,143,0.15), rgba(94,229,143,0.04));
  box-shadow: inset 0 1px 0 rgba(94,229,143,0.14);
}
.nb-ico { font-size: 15px; line-height: 1; }
.nb:hover { color: var(--text-hi); }

/* ── SECTION HEADER ──────────────────────────── */
.sh {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text-lo);
  letter-spacing: 2.5px;
  text-transform: uppercase;
  margin-bottom: 8px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--border);
}

/* ── BUILDING CARDS ──────────────────────────── */
.bc {
  background: linear-gradient(180deg, rgba(34,62,52,0.22), rgba(16,32,27,0.9));
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  border-radius: var(--r);
  padding: 9px 11px;
  margin-bottom: 7px;
  display: flex;
  align-items: center;
  gap: 9px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.1s;
  user-select: none;
}
.bc:active { background: var(--surface2); }
.bc.af   { border-color: var(--accent-d); }
.bc.af:hover { border-color: var(--accent); }
.bc.locked { opacity: 0.28; cursor: not-allowed; }

.bc-ico  { font-size: 18px; min-width: 24px; text-align: center; }
.bc-info { flex: 1; min-width: 0; }
.bc-name { font-weight: 600; color: var(--text-hi); font-size: 13px; margin-bottom: 2px; }
.bc-desc { font-size: 11px; color: var(--text-lo); line-height: 1.35; margin-bottom: 4px; }
.bc-cost { font-family: var(--mono); font-size: 9px; display: flex; flex-wrap: wrap; gap: 5px; }
.ci      { white-space: nowrap; }
.ci.ok   { color: var(--accent); }
.ci.no   { color: var(--red); }
.bc-cnt  { font-family: var(--mono); font-size: 20px; color: var(--accent); font-weight: 700; min-width: 24px; text-align: right; }

/* ── WORKER ROWS ─────────────────────────────── */
.wi {
  padding: 8px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.wi-ico  { font-size: 16px; min-width: 22px; }
.wi-info { flex: 1; }
.wi-name { font-weight: 600; color: var(--text-hi); font-size: 13px; }
.wi-desc { font-size: 10px; color: var(--text-lo); }
.wi-ctrl { display: flex; align-items: center; gap: 7px; }

.wb {
  width: 26px; height: 26px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text-hi);
  border-radius: 4px;
  cursor: pointer;
  font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.1s;
  font-family: var(--mono);
  user-select: none;
}
.wb:active { background: var(--accent-d); color: var(--accent); }

.wc { font-family: var(--mono); font-size: 15px; color: var(--accent); min-width: 26px; text-align: center; }

.idle-box {
  padding: 7px 11px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 10px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--amber);
}

/* ── TECH CARDS ──────────────────────────────── */
.tc {
  background: linear-gradient(180deg, rgba(34,62,52,0.22), rgba(16,32,27,0.9));
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  border-radius: var(--r);
  padding: 9px 11px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: border-color 0.15s;
  user-select: none;
}
.tc:active { background: var(--surface2); }
.tc.done   { border-color: var(--accent-d); opacity: 0.45; cursor: default; }
.tc.avail  { border-color: var(--accent-d); cursor: pointer; }
.tc.avail:hover { border-color: var(--accent); }
.tc.locked { opacity: 0.22; cursor: not-allowed; }

.tc-name { font-weight: 600; color: var(--text-hi); font-size: 13px; margin-bottom: 3px; }
.tc-desc { font-size: 11px; color: var(--text-lo); line-height: 1.35; margin-bottom: 5px; }
.tc-cost { font-family: var(--mono); font-size: 9px; display: flex; flex-wrap: wrap; gap: 5px; }
.tc-req  { font-size: 10px; color: var(--red); margin-bottom: 4px; }

.tier-label {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text-lo);
  letter-spacing: 2px;
  margin: 10px 0 6px;
}

/* ── CRAFT CARDS ─────────────────────────────── */
.cc {
  background: linear-gradient(180deg, rgba(34,62,52,0.22), rgba(16,32,27,0.9));
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  border-radius: var(--r);
  padding: 9px 11px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 9px;
  cursor: pointer;
  transition: border-color 0.15s;
  user-select: none;
}
.cc:active { background: var(--surface2); }
.cc.can   { border-color: var(--accent-d); }
.cc.can:hover { border-color: var(--accent); }
.cc.locked { opacity: 0.25; cursor: not-allowed; }

.cc-info  { flex: 1; }
.cc-name  { font-weight: 600; color: var(--text-hi); font-size: 13px; margin-bottom: 2px; }
.cc-desc  { font-size: 11px; color: var(--text-lo); margin-bottom: 4px; }
.cc-rec   { font-family: var(--mono); font-size: 9px; }

.craft-btn {
  padding: 5px 10px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--accent);
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 10px;
  cursor: pointer;
  white-space: nowrap;
  letter-spacing: 1px;
}

/* ── LOG ─────────────────────────────────────── */
.le {
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 9px;
  align-items: flex-start;
}
.le-t { font-family: var(--mono); font-size: 9px; color: var(--text-lo); white-space: nowrap; padding-top: 1px; min-width: 66px; }
.le-m { font-size: 11px; color: var(--text); line-height: 1.4; }

/* ── TRADE TAB ───────────────────────────────── */
.trade-row {
  background: linear-gradient(180deg, rgba(34,62,52,0.22), rgba(16,32,27,0.9));
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  border-radius: var(--r);
  padding: 9px 11px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 9px;
}
.trade-info { flex: 1; }
.trade-name { font-weight: 600; color: var(--text-hi); font-size: 13px; margin-bottom: 2px; }
.trade-desc { font-size: 10px; color: var(--text-lo); }
.trade-btn {
  padding: 5px 10px;
  background: var(--surface2);
  border: 1px solid var(--amber-d);
  color: var(--amber);
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 10px;
  cursor: pointer;
  white-space: nowrap;
}
.trade-btn:active { background: var(--amber-d); }
.trade-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── EVENTS/ALERTS ───────────────────────────── */
#toast-wrap {
  position: fixed;
  bottom: 58px;
  right: 10px;
  display: flex;
  flex-direction: column-reverse;
  gap: 5px;
  z-index: 999;
  pointer-events: none;
}
.toast {
  background: linear-gradient(180deg, rgba(27,53,44,0.98), rgba(16,32,27,0.98));
  border: 1px solid var(--border2);
  color: var(--accent);
  padding: 6px 11px;
  border-radius: var(--r);
  font-family: var(--mono);
  font-size: 10px;
  animation: t-in 0.2s ease, t-out 0.3s ease 2.5s forwards;
  max-width: 220px;
  box-shadow: var(--shadow);
}
.toast.warn { color: var(--amber); border-color: var(--amber-d); }
.toast.bad  { color: var(--red);   border-color: #5a1010; }

@keyframes t-in  { from { opacity:0; transform: translateX(16px); } to { opacity:1; transform:none; } }
@keyframes t-out { from { opacity:1; } to { opacity:0; } }

/* ── STATS SECTION ───────────────────────────── */
.stats-row {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}
.stat-card {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 8px 10px;
  text-align: center;
}
.stat-val { font-family: var(--mono); font-size: 16px; color: var(--accent); font-weight: 700; }
.stat-lbl { font-size: 10px; color: var(--text-lo); margin-top: 2px; }

/* ── MISC ────────────────────────────────────── */
.empty-hint { color: var(--text-lo); font-size: 12px; text-align: center; padding: 30px 20px; line-height: 1.6; }

.reset-link {
  display: block;
  margin: 16px auto 4px;
  background: none;
  border: 1px solid var(--border2);
  color: var(--text-lo);
  padding: 5px 16px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 9px;
  cursor: pointer;
  letter-spacing: 1.5px;
}
.reset-link:active { color: var(--red); border-color: var(--red); }

.save-link {
  display: inline-block;
  margin: 0 4px;
  background: none;
  border: 1px solid var(--border2);
  color: var(--text-lo);
  padding: 4px 10px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 9px;
  cursor: pointer;
  letter-spacing: 1px;
}
.save-link:active { color: var(--accent); border-color: var(--accent-d); }

.btn-row { text-align: center; margin-top: 14px; }

/* Milestone flash */
@keyframes flash {
  0%   { background: var(--accent-d); }
  100% { background: var(--surface); }
}
.flash { animation: flash 0.4s ease; }

/* ── SCROLLBAR ────────────────────────────────── */
::-webkit-scrollbar       { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ── STATUS BAR ─────────────────────────────────*/
#status-bar {
  height: 2px;
  background: var(--accent-dd);
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}
#status-bar::after {
  content: '';
  position: absolute;
  left: -40%;
  width: 40%;
  height: 100%;
  background: var(--accent);
  animation: scan 2s linear infinite;
  opacity: 0.5;
}
@keyframes scan { to { left: 140%; } }

/* ── TAB COUNT BADGES ────────────────────────── */
.badge {
  display: inline-block;
  background: var(--accent-d);
  color: var(--accent);
  font-family: var(--mono);
  font-size: 8px;
  border-radius: 8px;
  padding: 0 4px;
  min-width: 14px;
  text-align: center;
  line-height: 14px;
  height: 14px;
}


/* ── MINI PROGRESS ───────────────────────────── */
.mini-progress {
  height: 6px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 99px;
  overflow: hidden;
  margin: 6px 0 5px;
}
.mini-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-d), var(--accent));
}

/* ── EVENT MODAL ─────────────────────────────── */
#event-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1200;
  padding: 16px;
}
.event-card {
  width: min(100%, 420px);
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 14px;
  box-shadow: 0 14px 40px rgba(0,0,0,0.35);
}
.event-title {
  font-family: var(--mono);
  color: var(--accent);
  font-size: 12px;
  letter-spacing: 1.5px;
  margin-bottom: 8px;
}
.event-msg {
  font-size: 12px;
  color: var(--text-hi);
  line-height: 1.5;
  margin-bottom: 12px;
}
.event-choices {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.event-choice {
  width: 100%;
  text-align: left;
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text-hi);
  border-radius: 8px;
  padding: 10px 12px;
  cursor: pointer;
}
.event-choice span {
  display: block;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--accent);
  margin-bottom: 4px;
}
.event-choice small {
  display: block;
  color: var(--text);
  font-size: 11px;
  line-height: 1.35;
}

/* ── ENDING MODAL ────────────────────────────── */
#ending-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.72);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1250;
  padding: 16px;
}
.ending-card {
  width: min(100%, 520px);
  background: linear-gradient(180deg, rgba(15,26,18,0.98), rgba(9,15,11,0.98));
  border: 1px solid var(--border2);
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 18px 46px rgba(0,0,0,0.45);
}
.ending-kicker {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--amber);
  margin-bottom: 8px;
}
.ending-title {
  font-size: 22px;
  line-height: 1.15;
  color: var(--text-hi);
  margin-bottom: 10px;
  font-weight: 700;
}
.ending-body {
  font-size: 12px;
  line-height: 1.7;
  color: var(--text);
  margin-bottom: 12px;
}
.ending-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin: 12px 0;
}
.ending-stat {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 9px;
}
.ending-stat strong {
  display: block;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--text-lo);
  margin-bottom: 4px;
}
.ending-stat span {
  color: var(--text-hi);
  font-size: 12px;
}
.ending-note {
  border-top: 1px solid var(--border);
  padding-top: 10px;
  margin-top: 10px;
  color: var(--sky);
  font-size: 11px;
  line-height: 1.5;
}
.ending-chip {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 6px;
  border-radius: 999px;
  border: 1px solid var(--border2);
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 1px;
  color: var(--sky);
  vertical-align: middle;
}


/* ── OFFLINE SUMMARY MODAL ───────────────────── */
#offline-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.72);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1240;
  padding: 16px;
}
#confirm-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.72);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1260;
  padding: 16px;
}
.confirm-card {
  width: min(100%, 420px);
  background: linear-gradient(180deg, rgba(15,26,18,0.98), rgba(9,15,11,0.98));
  border: 1px solid var(--border2);
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 18px 46px rgba(0,0,0,0.45);
}
.confirm-title {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 1.5px;
  color: var(--amber);
  margin-bottom: 8px;
}
.confirm-msg {
  font-size: 12px;
  line-height: 1.6;
  color: var(--text-hi);
  white-space: pre-line;
}
.confirm-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 14px;
  flex-wrap: wrap;
}
.confirm-btn-danger {
  color: var(--red);
  border-color: rgba(255,139,137,0.35);
}
.confirm-btn-danger:active {
  color: var(--text-hi);
  border-color: var(--red);
}
.offline-card {
  width: min(100%, 620px);
  max-height: min(86vh, 780px);
  overflow-y: auto;
  background: linear-gradient(180deg, rgba(14,23,17,0.98), rgba(8,13,10,0.98));
  border: 1px solid var(--border2);
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 18px 46px rgba(0,0,0,0.45);
}
.offline-kicker {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--sky);
  margin-bottom: 8px;
}
.offline-title {
  font-size: 22px;
  line-height: 1.15;
  color: var(--text-hi);
  margin-bottom: 10px;
  font-weight: 700;
}
.offline-body {
  font-size: 12px;
  line-height: 1.7;
  color: var(--text);
  margin-bottom: 12px;
}
.offline-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 12px 0;
}
.offline-stat {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 9px;
}
.offline-stat strong {
  display: block;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--text-lo);
  margin-bottom: 4px;
}
.offline-stat span {
  color: var(--text-hi);
  font-size: 12px;
}
.offline-section {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.offline-section-title {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1.8px;
  color: var(--amber);
  margin-bottom: 8px;
}
.offline-list {
  display: grid;
  gap: 6px;
}
.offline-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 9px;
  font-size: 11px;
}
.offline-row strong {
  color: var(--text-hi);
  font-weight: 600;
}
.offline-row span {
  color: var(--accent);
  font-family: var(--mono);
  font-size: 11px;
}
.offline-row.warn span {
  color: var(--amber);
}
.offline-row.bad span {
  color: var(--red);
}
.offline-note-list {
  display: grid;
  gap: 6px;
}
.offline-note {
  font-size: 11px;
  line-height: 1.55;
  color: var(--text);
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 9px;
}
.offline-note strong {
  color: var(--text-hi);
}
.offline-chip {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 6px;
  border-radius: 999px;
  border: 1px solid var(--border2);
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 1px;
  color: var(--sky);
  vertical-align: middle;
}
@media (max-width: 560px) {
  .offline-grid {
    grid-template-columns: 1fr 1fr;
  }
}



.ending-theme-swarm {
  --ending-accent: #6ee7b7;
  --ending-accent-2: #34d399;
  --ending-glow: rgba(52,211,153,0.22);
  --ending-ink: rgba(9,27,19,0.95);
}
.ending-theme-amber {
  --ending-accent: #fbbf24;
  --ending-accent-2: #fb923c;
  --ending-glow: rgba(251,146,60,0.20);
  --ending-ink: rgba(34,19,7,0.95);
}
.ending-theme-celestial {
  --ending-accent: #93c5fd;
  --ending-accent-2: #a78bfa;
  --ending-glow: rgba(147,197,253,0.22);
  --ending-ink: rgba(12,17,34,0.95);
}
.ending-theme-generic {
  --ending-accent: #9ca3af;
  --ending-accent-2: #6ee7b7;
  --ending-glow: rgba(110,231,183,0.14);
  --ending-ink: rgba(17,20,22,0.95);
}
.ending-banner {
  position: relative;
  overflow: hidden;
  margin-bottom: 12px;
  border-radius: 14px;
  border: 1px solid color-mix(in srgb, var(--ending-accent) 28%, var(--border2));
  background:
    radial-gradient(circle at 18% 18%, var(--ending-glow), transparent 36%),
    radial-gradient(circle at 82% 22%, color-mix(in srgb, var(--ending-accent-2) 18%, transparent), transparent 28%),
    linear-gradient(135deg, color-mix(in srgb, var(--ending-accent) 12%, var(--ending-ink)) 0%, color-mix(in srgb, var(--ending-accent-2) 8%, #0b1110) 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), 0 14px 36px rgba(0,0,0,0.22);
}
.ending-banner::before,
.ending-banner::after {
  content: '';
  position: absolute;
  inset: auto;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  filter: blur(18px);
  opacity: 0.22;
  pointer-events: none;
}
.ending-banner::before {
  top: -45px;
  right: -30px;
  background: color-mix(in srgb, var(--ending-accent) 46%, transparent);
}
.ending-banner::after {
  bottom: -65px;
  left: -30px;
  background: color-mix(in srgb, var(--ending-accent-2) 36%, transparent);
}
.ending-banner-inner {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 84px 1fr;
  gap: 12px;
  align-items: center;
  padding: 12px;
}
.ending-banner.compact .ending-banner-inner {
  grid-template-columns: 58px 1fr;
  gap: 10px;
  padding: 10px;
}
.ending-crest {
  width: 84px;
  height: 84px;
  border-radius: 18px;
  border: 1px solid color-mix(in srgb, var(--ending-accent) 45%, rgba(255,255,255,0.08));
  background:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,0.06), transparent 58%),
    linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.10));
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 0 26px rgba(255,255,255,0.02), 0 10px 24px rgba(0,0,0,0.16);
}
.ending-banner.compact .ending-crest {
  width: 58px;
  height: 58px;
  border-radius: 14px;
}
.ending-sigil {
  font-size: 34px;
  color: var(--ending-accent);
  text-shadow: 0 0 18px color-mix(in srgb, var(--ending-accent) 46%, transparent);
  line-height: 1;
}
.ending-banner.compact .ending-sigil {
  font-size: 24px;
}
.ending-banner-copy {
  min-width: 0;
}
.ending-banner-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 2.2px;
  color: var(--ending-accent);
  margin-bottom: 5px;
}
.ending-banner.compact .ending-banner-label {
  font-size: 9px;
  margin-bottom: 3px;
}
.ending-banner-title {
  color: var(--text-hi);
  font-size: 15px;
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 4px;
}
.ending-banner.compact .ending-banner-title {
  font-size: 13px;
}
.ending-banner-line {
  color: var(--text);
  font-size: 11px;
  line-height: 1.5;
}
.ending-banner.compact .ending-banner-line {
  font-size: 10px;
}
.ending-runes {
  display: flex;
  gap: 6px;
  margin-top: 7px;
  flex-wrap: wrap;
}
.ending-rune {
  padding: 1px 6px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--ending-accent) 28%, var(--border));
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 1px;
  color: color-mix(in srgb, var(--ending-accent) 82%, white 8%);
  background: rgba(255,255,255,0.03);
}
.ending-banner.compact .ending-runes {
  margin-top: 5px;
  gap: 4px;
}
.ending-banner.compact .ending-rune {
  font-size: 7px;
  padding: 1px 5px;
}


/* ── ONBOARDING / CAPSTONES ─────────────────── */
.tutorial-card {
  background: linear-gradient(135deg, rgba(31,110,152,0.14), rgba(94,229,143,0.08));
  border: 1px solid rgba(120,215,255,0.22);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
}
.tutorial-title {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1.6px;
  color: var(--sky);
  margin-bottom: 8px;
}
.checklist {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.check-item {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  font-size: 11px;
  color: var(--text);
}
.check-mark {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 1px solid var(--border2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-family: var(--mono);
  font-size: 10px;
  background: rgba(6,11,8,0.3);
}
.check-item.done .check-mark {
  background: rgba(94,229,143,0.16);
  border-color: rgba(94,229,143,0.4);
  color: var(--accent);
}
.check-item.done .check-copy { color: var(--text-hi); }
.onboard-note {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid rgba(120,215,255,0.12);
  font-size: 10px;
  color: var(--text-lo);
  line-height: 1.45;
}
.tutorial-actions {
  display: flex;
  justify-content: flex-end;
  margin-top: 10px;
}
.tutorial-dismiss {
  border-color: rgba(120,215,255,0.22);
  color: var(--sky);
}
.tutorial-dismiss:active {
  border-color: var(--sky);
  color: var(--text-hi);
}
.capstone-chip {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 6px;
  border-radius: 999px;
  background: rgba(183,152,255,0.14);
  color: var(--purple);
  font-size: 8px;
  letter-spacing: 1px;
  font-family: var(--mono);
  vertical-align: middle;
}
.capstone-active {
  border-color: rgba(183,152,255,0.4) !important;
  box-shadow: 0 0 0 1px rgba(183,152,255,0.16), 0 10px 26px rgba(91,59,178,0.14);
}
.notice-panel {
  padding: 9px 11px;
  border: 1px solid rgba(255,197,98,0.22);
  background: linear-gradient(180deg, rgba(138,91,15,0.13), rgba(16,32,27,0.9));
  border-radius: var(--r);
  color: var(--amber);
  font-size: 10px;
  margin-bottom: 10px;
}
.keyline {
  color: var(--text-hi);
}
.lineage-chip {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 6px;
  border-radius: 999px;
  background: rgba(94,229,143,0.12);
  color: var(--accent);
  font-size: 8px;
  letter-spacing: 0.9px;
  font-family: var(--mono);
  vertical-align: middle;
}
.lineage-panel {
  border-color: rgba(94,229,143,0.18);
  background: linear-gradient(180deg, rgba(18,31,26,0.98), rgba(9,15,12,0.96));
}
.lineage-panel .guide-title {
  color: var(--accent);
}
.lineage-panel .soft-note {
  color: #9bd8b1;
}

/* ── CONTEXT GUIDES ─────────────────────────── */
.guide-panel {
  background: linear-gradient(180deg, rgba(14,25,21,0.96), rgba(11,17,14,0.94));
  border: 1px solid rgba(120,215,255,0.14);
  border-radius: 10px;
  padding: 10px 11px;
  margin-bottom: 10px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.18);
}
.guide-title {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1.4px;
  color: var(--sky);
  margin-bottom: 7px;
}
.guide-copy {
  font-size: 11px;
  line-height: 1.5;
  color: var(--text);
}
.guide-copy + .guide-copy { margin-top: 6px; }
.guide-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  margin-top: 8px;
}
.guide-item {
  padding: 8px 9px;
  border: 1px solid rgba(43,71,58,0.9);
  background: rgba(8,13,11,0.55);
  border-radius: 8px;
}
.guide-item strong {
  display: block;
  color: var(--text-hi);
  font-size: 11px;
  margin-bottom: 3px;
}
.soft-note {
  margin-top: 8px;
  font-size: 10px;
  line-height: 1.45;
  color: var(--text-lo);
}


.lineage-quests {
  display: grid;
  gap: 8px;
  margin-bottom: 10px;
}
.quest-card {
  background: linear-gradient(180deg, rgba(18,32,27,0.96), rgba(12,22,18,0.96));
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 10px 12px;
  box-shadow: 0 8px 18px rgba(0,0,0,0.18);
}
.quest-card.done {
  border-color: var(--accent-d);
  background: linear-gradient(180deg, rgba(15,40,26,0.96), rgba(10,24,17,0.96));
}
.quest-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:4px;
}
.quest-title {
  color: var(--text-hi);
  font-weight: 700;
  font-size: 12px;
}
.quest-status {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--amber);
  letter-spacing: 1px;
}
.quest-card.done .quest-status {
  color: var(--accent);
}
.quest-copy {
  color: var(--text);
  font-size: 11px;
  line-height: 1.45;
  margin-bottom: 6px;
}
.quest-reward {
  color: var(--amber);
  font-size: 10px;
  line-height: 1.45;
  margin-top: 6px;
}
.quest-card.done .quest-reward {
  color: var(--accent);
}



/* ── RESPONSIVE TOUCH / MOBILE PASS ─────────── */
@media (max-width: 860px) {
  html, body {
    min-height: 100dvh;
    height: 100dvh;
  }

  body {
    font-size: 15px;
  }

  #top-bar {
    min-height: 54px;
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
  }

  #res-strip,
  #content {
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
  }

  #content {
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
  }

  #bot-nav {
    padding-bottom: max(4px, env(safe-area-inset-bottom));
  }

  .nb {
    min-height: 58px;
    padding: 10px 4px 12px;
    font-size: 10px;
    gap: 4px;
  }

  .nb-ico {
    font-size: 18px;
  }

  #gather-btn {
    min-height: 40px;
    padding: 0 14px;
    font-size: 11px;
    border-radius: 10px;
  }

  .wb,
  .save-link,
  .craft-btn,
  .trade-btn,
  .event-choice {
    min-height: 40px;
  }

  .wb {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    font-size: 18px;
  }

  .wc {
    min-width: 32px;
    font-size: 17px;
  }

  .save-link,
  .craft-btn,
  .trade-btn {
    padding: 8px 12px;
    font-size: 11px;
  }

  .bc,
  .tc,
  .cc,
  .trade-row,
  .wi,
  .guide-panel,
  .tutorial-card,
  .notice-panel,
  .lineage-panel,
  .quest-card,
  .idle-box,
  .stat-card {

  }

  .bc,
  .tc,
  .cc,
  .trade-row,
  .wi,
  .guide-panel,
  .tutorial-card,
  .notice-panel,
  .lineage-panel,
  .quest-card {
    padding: 12px;
  }

  .bc-name,
  .wi-name,
  .tc-name,
  .cc-name,
  .trade-name {
    font-size: 14px;
  }

  .bc-desc,
  .tc-desc,
  .cc-desc,
  .trade-desc,
  .guide-copy {
    font-size: 12px;
    line-height: 1.5;
  }

  .bc-cost,
  .tc-cost,
  .cc-rec,
  .soft-note {
    font-size: 10px;
  }

  .event-card,
  .ending-card,
  .offline-card,
  .confirm-card {
    width: min(100%, 640px);
    max-height: min(88dvh, 820px);
    border-radius: 16px;
    padding: 18px;
  }

  #event-modal,
  #ending-modal,
  #offline-modal,
  #confirm-modal {
    padding:
      max(14px, env(safe-area-inset-top))
      max(12px, env(safe-area-inset-right))
      max(14px, env(safe-area-inset-bottom))
      max(12px, env(safe-area-inset-left));
  }

  .ending-banner-inner {
    grid-template-columns: 72px 1fr;
  }

  .ending-crest {
    width: 72px;
    height: 72px;
  }

  .ending-sigil {
    font-size: 30px;
  }
}

@media (max-width: 560px) {
  #top-bar {
    gap: 6px;
    padding-top: 8px;
    padding-bottom: 8px;
    min-height: 58px;
  }

  #logo {
    font-size: 10px;
    letter-spacing: 2px;
  }

  #season-pill,
  #pop-display {
    font-size: 9px;
  }

  #gather-btn {
    min-width: 86px;
  }

  #res-strip {
    gap: 7px;
    padding-top: 8px;
    padding-bottom: 8px;
  }

  .rc {
    min-width: 82px;
    padding: 7px 8px;
  }

  .rc-name {
    font-size: 10px;
  }

  .rc-amt {
    font-size: 13px;
  }

  .rc-rate {
    font-size: 10px;
  }

  .nb {
    min-height: 60px;
    font-size: 9px;
    letter-spacing: 0.3px;
  }

  .stats-row {
    flex-direction: column;
  }

  .trade-row,
  .cc,
  .bc,
  .wi {
    align-items: flex-start;
  }

  .trade-row {
    flex-wrap: wrap;
  }

  .trade-btn,
  .craft-btn {
    width: 100%;
    justify-content: center;
    text-align: center;
  }

  .event-card,
  .ending-card,
  .offline-card,
  .confirm-card {
    padding: 15px;
  }

  .offline-grid,
  .ending-grid {
    grid-template-columns: 1fr;
  }

  .ending-banner-inner {
    grid-template-columns: 1fr;
  }

  .ending-crest {
    width: 64px;
    height: 64px;
  }

  .ending-sigil {
    font-size: 26px;
  }

  .guide-grid {
    gap: 6px;
  }
}

/* ── COLONY CANVAS ──────────────────────────── */
#colony-canvas-wrap {
  position: relative;
  width: 100%;
  height: 160px;
  border-radius: var(--r);
  overflow: hidden;
  margin-bottom: 10px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  touch-action: none;
}
#colony-canvas {
  display: block;
  width: 100%;
  height: 100%;
}
#colony-overlay {
  position: absolute;
  bottom: 6px;
  left: 8px;
  font-family: var(--mono);
  font-size: 9px;
  color: rgba(228,241,232,0.55);
  pointer-events: none;
  letter-spacing: 1px;
}

/* ── EXPEDITION SYSTEM ──────────────────────── */
.exp-panel {
  background: linear-gradient(180deg, rgba(31,110,152,0.10), rgba(16,32,27,0.9));
  border: 1px solid rgba(120,215,255,0.18);
  border-radius: 10px;
  padding: 10px 11px;
  margin-bottom: 10px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.18);
}
.exp-title {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1.4px;
  color: var(--sky);
  margin-bottom: 7px;
}
.exp-slots {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 8px;
}
.exp-active {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 9px 11px;
}
.exp-active-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 4px;
}
.exp-active-name {

};

function makeUnlockMap(src) {
  return Object.fromEntries(Object.keys(src).map(k => [k, !!src[k].unlocked]));
}

function baseState() {
  return {
    res: Object.fromEntries(Object.keys(RES).map(k => [k, 0])),
    vis: Object.fromEntries(Object.keys(RES).map(k => [k, ['honeydew'].includes(k)])),
    bldgs: Object.fromEntries(Object.keys(BLDGS).map(k => [k, 0])),
    jobs: Object.fromEntries(Object.keys(JOBS).map(k => [k, 0])),
    techs: {},

  };
}

function freshStartState(meta = { nectar:0, launches:0 }) {
  const s = baseState();
  s.meta = {
    nectar: meta.nectar || 0,
    launches: meta.launches || 0,
    legacy:{ ...Object.fromEntries(Object.keys(LEGACY_TREE).map(k => [k, 0])), ...((meta && meta.legacy) || {}) },
    pending_ending: (meta && meta.pending_ending) || null,
    ending_history: Array.isArray(meta && meta.ending_history) ? meta.ending_history.slice(0, 6) : [],
    pending_offline: (meta && meta.pending_offline) || null,
    offline_history: Array.isArray(meta && meta.offline_history) ? meta.offline_history.slice(0, 6) : [],
    seen_achievements: Number.isFinite(meta && meta.seen_achievements) ? meta.seen_achievements : 0,
    tutorial_hidden: !!(meta && meta.tutorial_hidden)
  };
  s.res.honeydew = 20;
  s.res.leaves = 25;
  s.res.dirt = 10;
  s.vis.leaves = true;
  s.vis.dirt = true;
  const bonusBugs = startingBugsFromMeta(s.meta);
  if (bonusBugs > 0) {
    s.pop.total = bonusBugs;
  }
  syncLineageUnlocks(s);
  s.log.unshift({ msg:'Research Natural Philosophy after your first worker to unlock insight and Scholars.', time:'Y1 Spr D0' });
  s.log.unshift({ msg:'Build a Nest first, then a Clover Patch, for the smoothest opening.', time:'Y1 Spr D0' });
  s.log.unshift({ msg:'You begin with a small cache of leaves and dirt for your first structures.', time:'Y1 Spr D0' });
  s.log.unshift({ msg:'Your colony stirs. Gather honeydew to begin.', time:'Y1 Spr D0' });
  return s;
}

let G = freshStartState();
let rates = {};
let curTab = 'colony';

function fmt(n) {
  if (n === undefined || n === null || Number.isNaN(n)) return '0';
  if (n >= 1e9) return (n/1e9).toFixed(2)+'B';
  if (n >= 1e6) return (n/1e6).toFixed(2)+'M';
  if (n >= 1000) return (n/1000).toFixed(1)+'k';
  if (n >= 100) return Math.floor(n).toString();
  if (n >= 10) return n.toFixed(1);
  return n.toFixed(2);
}

function fmtR(r) {
  if (!r || Math.abs(r) < 0.0001) return '';
  return (r > 0 ? '+' : '') + r.toFixed(3) + '/s';
}

function seasonName() {
  return SEASONS[G.time.s_idx];
}

function log(msg, type='') {
  const t = G.time;
  const ts = `Y${t.year} ${SEASONS[t.s_idx].slice(0,3)} D${t.day}`;
  G.log.unshift({ msg, time:ts, type });
  if (G.log.length > 100) G.log.pop();
}

function toast(msg, cls='') {
  const wrap = document.getElementById('toast-wrap');
  if (!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast' + (cls ? ' ' + cls : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3100);
}

function isTechDone(tid) {
  return !!G.techs[tid];
}

function legacyRank(id, meta = G.meta) {
  return ((meta && meta.legacy) || {})[id] || 0;
}

function legacyMaxRank(id) {
  return (LEGACY_TREE[id]?.costs || []).length;
}

function legacyCost(id, rank = legacyRank(id)) {
  const node = LEGACY_TREE[id];
  if (!node || rank >= node.costs.length) return null;
  return node.costs[rank];
}

function ownedCapstoneId(meta = G.meta) {
  return Object.keys(LEGACY_TREE).find(id => LEGACY_TREE[id].capstone && legacyRank(id, meta) > 0) || null;
}

function legacyUnlocked(id) {
  const node = LEGACY_TREE[id];
  if (!node) return false;
  const reqsMet = (node.requires || []).every(req => legacyRank(req) > 0);
  const maxReqsMet = (node.requires_max || []).every(req => legacyRank(req) >= legacyMaxRank(req));
  const capstoneOpen = !node.capstone || !ownedCapstoneId() || ownedCapstoneId() === id;
  return reqsMet && maxReqsMet && capstoneOpen;
}

function canBuyLegacy(id) {
  const cost = legacyCost(id);
  return legacyUnlocked(id) && cost !== null && (G.meta.nectar || 0) >= cost;
}

function capstoneOwned(id) {
  return legacyRank(id) > 0;
}

function capstoneAccess(def, meta = G.meta) {
  return !def.capstone || legacyRank(def.capstone, meta) > 0;
}

function lineageAssets() {
  return [
  ['bldgs', 'brood_nursery', 'swarm_sovereignty'],
  ['jobs', 'nurse', 'swarm_sovereignty'],
  ['bldgs', 'amber_vault', 'amber_monolith'],
  ['jobs', 'excavator', 'amber_monolith'],
  ['bldgs', 'sky_beacon', 'celestial_throne'],
  ['jobs', 'navigator', 'celestial_throne'],
  ];
}

function syncLineageUnlocks(state = G) {
  if (!state.unlocks) state.unlocks = { jobs:makeUnlockMap(JOBS), bldgs:makeUnlockMap(BLDGS) };
  for (const [kind, id, capstone] of lineageAssets()) {
    state.unlocks[kind][id] = legacyRank(capstone, state.meta || { legacy:{} }) > 0;
  }
}

function clearInaccessibleLineageContent(state = G) {
  for (const [kind, id, capstone] of lineageAssets()) {
    if (legacyRank(capstone, state.meta || { legacy:{} }) > 0) continue;
    if (kind === 'jobs') {
      state.jobs[id] = 0;
    } else if (kind === 'bldgs') {
      state.bldgs[id] = 0;
    }
  }
}

function projectDone(id, state = G) {
  return !!((state.projects || {})[id]);
}

function activeLineageProject(state = G) {
  const cap = ownedCapstoneId(state.meta || G.meta);
  return cap ? (LINEAGE_PROJECTS[cap] || null) : null;
}

function projectTechsMet(def, state = G) {
  return !!def && (def.techs || []).every(tid => state.techs[tid]);
}

function projectLockedReasons(def, state = G) {
  const reasons = [];
  if (!def) return reasons;
  if (!legacyRank(def.capstone, state.meta || G.meta)) reasons.push('Needs the matching capstone');
  if ((def.evo_stage || 0) > 0 && lineageEvolutionStage(def.capstone, state) < def.evo_stage) {
    const info = lineageEvolutionInfo(def.capstone, state);
    const next = info.steps.find(step => step.stage === def.evo_stage);
    reasons.push(`Needs ${next ? next.label : `Evolution ${def.evo_stage}`}`);
  }
  const missing = (def.techs || []).filter(tid => !state.techs[tid]).map(tid => TECHS[tid]?.name || tid);
  if (missing.length) reasons.push(`Research: ${missing.join(', ')}`);
  return reasons;
}

function launchAetherRequirement(state = G) {
  return Math.max(15, 30 - (legacyRank('celestial_throne', state.meta || G.meta) > 0 ? 5 : 0) - milestoneLaunchAetherReduction() - projectLaunchAetherReduction(state));
}

function projectCriteria(def, state = G) {
  if (!def) return [];
  const rows = [];
  if (def.id === 'sovereign_brood') {
    rows.push({ done:(state.pop.total || 0) >= 42, ratio:Math.min(1, (state.pop.total || 0) / 42), label:`${state.pop.total || 0}/42 bugs` });
    rows.push({ done:(state.bldgs.brood_nursery || 0) >= 5, ratio:Math.min(1, (state.bldgs.brood_nursery || 0) / 5), label:`${state.bldgs.brood_nursery || 0}/5 Brood Nurseries` });
    rows.push({ done:(state.jobs.nurse || 0) >= 8, ratio:Math.min(1, (state.jobs.nurse || 0) / 8), label:`${state.jobs.nurse || 0}/8 Nurses` });
  } else if (def.id === 'amber_citadel') {
    rows.push({ done:(state.bldgs.amber_vault || 0) >= 4, ratio:Math.min(1, (state.bldgs.amber_vault || 0) / 4), label:`${state.bldgs.amber_vault || 0}/4 Amber Vaults` });
    rows.push({ done:(state.jobs.excavator || 0) >= 8, ratio:Math.min(1, (state.jobs.excavator || 0) / 8), label:`${state.jobs.excavator || 0}/8 Excavators` });
    rows.push({ done:(state.stats.traded || 0) >= 12, ratio:Math.min(1, (state.stats.traded || 0) / 12), label:`${state.stats.traded || 0}/12 trades` });
    const stock = totalResourceStock(state);
    rows.push({ done:stock >= 2200, ratio:Math.min(1, stock / 2200), label:`${Math.floor(stock)}/2200 total stock` });
  } else if (def.id === 'astral_ark') {
    rows.push({ done:(state.bldgs.sky_beacon || 0) >= 3, ratio:Math.min(1, (state.bldgs.sky_beacon || 0) / 3), label:`${state.bldgs.sky_beacon || 0}/3 Sky Beacons` });
    rows.push({ done:(state.bldgs.colony_spire || 0) >= 2, ratio:Math.min(1, (state.bldgs.colony_spire || 0) / 2), label:`${state.bldgs.colony_spire || 0}/2 Colony Spires` });
    rows.push({ done:(state.jobs.navigator || 0) >= 8, ratio:Math.min(1, (state.jobs.navigator || 0) / 8), label:`${state.jobs.navigator || 0}/8 Navigators` });
    rows.push({ done:canLaunchSkyColony(state), ratio:canLaunchSkyColony(state) ? 1 : Math.min(1, (((state.res.elytra || 0) / 15) + ((state.res.aether || 0) / launchAetherRequirement(state))) / 2), label:`Launch readiness · ${Math.floor(state.res.elytra || 0)}/15 Elytra · ${Math.floor(state.res.aether || 0)}/${launchAetherRequirement(state)} Aether` });
  }
  for (const [res, amount] of Object.entries(def.costs || {})) {
    const have = state.res[res] || 0;
    rows.push({ done:have >= amount, ratio:Math.min(1, have / amount), label:`${Math.floor(have)}/${amount} ${RES[res].name}` });
  }
  return rows;
}

function projectProgress(def, state = G) {
  const rows = projectCriteria(def, state);
  const pct = rows.length ? Math.round(rows.reduce((sum, row) => sum + row.ratio, 0) / rows.length * 100) : 0;
  const ready = rows.length > 0 && rows.every(row => row.done) && projectTechsMet(def, state) && projectLockedReasons(def, state).length === 0;
  return { pct, rows, ready };
}

function clearLineageProjects(state = G) {
  if (!state.projects) state.projects = {};
  const active = ownedCapstoneId(state.meta || G.meta);
  for (const project of Object.values(LINEAGE_PROJECTS)) {
    if (project.capstone !== active) delete state.projects[project.id];
  }
}

function completeLineageProject() {
  const def = activeLineageProject();
  if (!def) {
    toast('No lineage project active', 'warn');
    return;
  }
  if (projectDone(def.id)) {
    toast('Project already complete');
    return;
  }
  const status = projectProgress(def);
  if (!status.ready) {
    toast('Project is not ready yet', 'warn');
    return;
  }
  for (const [res, amount] of Object.entries(def.costs || {})) {
    G.res[res] -= amount;
  }
  if (!G.projects) G.projects = {};
  G.projects[def.id] = true;
  G.achievements[def.id] = true;
  if (def.id === 'sovereign_brood') {
    G.events.active = 'brood_surge';
    G.events.ticks_left = 180;
  } else if (def.id === 'amber_citadel') {
    G.events.active = 'amber_rush';
    G.events.ticks_left = 180;
  } else if (def.id === 'astral_ark') {
    G.events.active = 'star_current';
    G.events.ticks_left = 180;
    G.vis.aether = true;
    G.res.aether = Math.min(maxRes('aether'), (G.res.aether || 0) + 20);
  }
  log(`Lineage project complete: ${def.title}.`);
  toast(`${def.title} complete!`);
  renderAll();
}

function milestoneDone(id, state = G) {
  return !!((state.milestones || {})[id]);
}

function activeLineageMilestones(state = G) {
  const cap = ownedCapstoneId(state.meta || G.meta);
  return cap ? (LINEAGE_MILESTONES[cap] || []) : [];
}

function totalResourceStock(state = G) {
  return Object.values(state.res || {}).reduce((sum, value) => sum + (value || 0), 0);
}

function milestoneProgress(id, state = G) {
  switch (id) {
    case 'swarm_critical_mass': {
      const cur = state.pop.total || 0;
      const target = 12;
      return { cur, target, done: cur >= target, label:`${cur}/${target} bugs` };
    }
    case 'swarm_caretakers': {
      const nurseries = state.bldgs.brood_nursery || 0;
      const nurses = state.jobs.nurse || 0;
      const score = Math.min(2, nurseries) + Math.min(2, nurses);
      return { cur: score, target: 4, done: nurseries >= 2 && nurses >= 2, label:`${nurseries}/2 Nurseries · ${nurses}/2 Nurses` };
    }
    case 'swarm_overflow': {
      const bugs = state.pop.total || 0;
      const house = housing();
      const cur = Math.min(100, Math.round(((bugs / 24) * 50) + ((house / 30) * 50)));
      return { cur, target: 100, done: bugs >= 24 && house >= 30, label:`${bugs}/24 bugs · ${house}/30 housing` };
    }
    case 'amber_stockpile': {
      const cur = state.bldgs.amber_vault || 0;
      const target = 2;
      return { cur, target, done: cur >= target, label:`${cur}/${target} Amber Vaults` };
    }
    case 'amber_excavation': {
      const excavators = state.jobs.excavator || 0;
      const stock = Math.floor((state.res.leaves || 0) + (state.res.dirt || 0));
      const cur = Math.min(100, Math.round(((excavators / 3) * 40) + ((stock / 250) * 60)));
      return { cur, target: 100, done: excavators >= 3 && stock >= 250, label:`${excavators}/3 Excavators · ${stock}/250 stock` };
    }
    case 'amber_logistics': {
      const trades = state.stats.traded || 0;
      const stock = Math.floor(totalResourceStock(state));
      const cur = Math.min(100, Math.round(((trades / 5) * 45) + ((stock / 600) * 55)));
      return { cur, target: 100, done: trades >= 5 && stock >= 600, label:`${trades}/5 trades · ${stock}/600 stored` };
    }
    case 'sky_signal': {
      const beacons = state.bldgs.sky_beacon || 0;
      const docks = state.bldgs.sky_dock || 0;
      const cur = Math.min(100, Math.round(((beacons / 2) * 65) + ((docks / 1) * 35)));
      return { cur, target: 100, done: beacons >= 2 && docks >= 1, label:`${beacons}/2 Beacons · ${docks}/1 Dock` };
    }
    case 'celestial_chart': {
      const aether = Math.floor(state.res.aether || 0);
      const skyglass = Math.floor(state.res.skyglass || 0);
      const cur = Math.min(100, Math.round(((aether / 40) * 60) + ((skyglass / 15) * 40)));
      return { cur, target: 100, done: aether >= 40 && skyglass >= 15, label:`${aether}/40 Aether · ${skyglass}/15 Skyglass` };
    }
    case 'throne_launch': {
      const needAether = 30 - (capstoneOwned('celestial_throne') ? 5 : 0);
      const elytra = Math.floor(state.res.elytra || 0);
      const aether = Math.floor(state.res.aether || 0);
      const cur = Math.min(100, Math.round(((elytra / 15) * 50) + ((aether / needAether) * 50)));
      return { cur, target: 100, done: canLaunchSkyColony(), label:`${elytra}/15 Elytra · ${aether}/${needAether} Aether` };
    }
    default:
      return { cur:0, target:1, done:false, label:'Not started' };
  }
}

function completeLineageMilestone(id) {
  if (!G.milestones) G.milestones = {};
  if (G.milestones[id]) return;
  const cap = ownedCapstoneId();
  const beforeStage = lineageEvolutionStage(cap);
  G.milestones[id] = true;
  const def = (LINEAGE_MILESTONES[cap] || []).find(item => item.id === id);
  if (def) {
    log(`Lineage milestone complete: ${def.title}. ${def.reward}`);
    toast(`Milestone complete: ${def.title}`);
  }
  const afterStage = lineageEvolutionStage(cap);
  if (cap && afterStage > beforeStage) {
    const evo = (LINEAGE_EVOLUTIONS[cap] || []).find(step => step.stage === afterStage);
    if (evo) {
      log(`Lineage evolved: ${evo.label}. ${evo.copy}`);
      toast(`Evolution: ${evo.label}`);
    }
  }
}

function checkLineageMilestones() {
  for (const quest of activeLineageMilestones()) {
    if (milestoneDone(quest.id)) continue;
    if (milestoneProgress(quest.id).done) {
      completeLineageMilestone(quest.id);
    }
  }
}

function nextLineageMilestone() {
  return activeLineageMilestones().find(quest => !milestoneDone(quest.id)) || null;
}

        <div class="quest-reward">${milestoneDone(quest.id) ? 'Unlocked: ' : 'Reward: '}${quest.reward}</div>

function buildingVisible(bid) {
  const def = BLDGS[bid];
  return !!def && !!G.unlocks.bldgs[bid] && capstoneAccess(def) && (!def.requires_tech || G.techs[def.requires_tech]);
}

function jobVisible(jid) {
  const def = JOBS[jid];
  return !!def && !!G.unlocks.jobs[jid] && capstoneAccess(def) && (!def.requires_tech || G.techs[def.requires_tech]);
}

function lineageChip(id) {
  return id ? `<span class="lineage-chip">${LEGACY_TREE[id].name}</span>` : '';
}


function lineageEvolutionStage(cap = ownedCapstoneId(), state = G) {
  if (!cap || !LINEAGE_EVOLUTIONS[cap]) return 0;
  let stage = 0;
  for (const step of LINEAGE_EVOLUTIONS[cap]) {
    if (milestoneDone(step.milestone, state)) stage = step.stage;
  }
  return stage;
}

function lineageEvolutionInfo(cap = ownedCapstoneId(), state = G) {
  const steps = LINEAGE_EVOLUTIONS[cap] || [];
  const stage = lineageEvolutionStage(cap, state);
  return {
    steps,
    stage,
    current: steps.find(step => step.stage === stage) || null,
    next: steps.find(step => step.stage === stage + 1) || null,
  };
}

function lineageStageUnlocked(def, state = G) {
  if (!def) return false;
  if (!capstoneAccess(def, state.meta || G.meta)) return false;
  return !def.evo_stage || lineageEvolutionStage(def.capstone, state) >= def.evo_stage;
}

function lineageUnlockLabel(def, state = G) {
  if (!def || !def.capstone) return '';
  const stage = lineageEvolutionStage(def.capstone, state);
  const need = def.evo_stage || 0;
  if (stage >= need) return def.lineage_label || 'Lineage content';
  const info = lineageEvolutionInfo(def.capstone, state);
  const next = info.steps.find(step => step.stage === need);
  return `${def.lineage_label || 'Lineage content'} · unlocks at ${next ? next.label : 'a later evolution'}`;
}

function techVisible(def, state = G) {
  return !!def && (!def.capstone || legacyRank(def.capstone, state.meta || G.meta) > 0);
}

function techReqsMet(def, state = G) {
  return !!def && (def.requires || []).every(r => state.techs[r]);
}

function techStageReady(def, state = G) {
  return !def.evo_stage || lineageEvolutionStage(def.capstone, state) >= def.evo_stage;
}

function techLockedReasons(def, state = G) {
  const reasons = [];
  const missing = (def.requires || []).filter(r => !state.techs[r]).map(r => TECHS[r]?.name || r);
  if (missing.length) reasons.push(`Requires: ${missing.join(', ')}`);
  if (def.capstone && def.evo_stage && !techStageReady(def, state)) {
    const info = lineageEvolutionInfo(def.capstone, state);
    const next = info.steps.find(step => step.stage === def.evo_stage);
    reasons.push(`Needs ${next ? next.label : `Evolution ${def.evo_stage}`}`);
  }
  return reasons;
}

function nextLineageResearch(state = G) {
  return Object.entries(TECHS)
    .filter(([tid, def]) => techVisible(def, state) && !state.techs[tid] && techReqsMet(def, state))
    .sort((a, b) => (a[1].tier - b[1].tier) || progressPct(b[1].cost) - progressPct(a[1].cost))
    .find(([, def]) => def.capstone) || null;
}

function lineageResearchStatusPanel() {
  const cap = ownedCapstoneId();
  if (!cap) return '';
  const branch = Object.entries(TECHS).filter(([, def]) => def.capstone === cap);
  if (!branch.length) return '';
  const next = nextLineageResearch();
  const done = branch.filter(([tid]) => G.techs[tid]).length;
  const total = branch.length;
  const status = next ? techLockedReasons(next[1]) : [];
  return `<div class="guide-panel lineage-panel">
    <div class="guide-title">LINEAGE RESEARCH</div>
    <div class="guide-copy">${LEGACY_TREE[cap].name} now has its own technology branch. These techs only appear for this lineage and push the run further apart mechanically.</div>
    <div class="guide-grid">
      <div class="guide-item"><strong>Branch progress</strong> ${done}/${total} lineage techs researched this run.</div>
      <div class="guide-item"><strong>How it unlocks</strong> Evolve the lineage with milestones, then fund the next branch tech in this tab.</div>
    </div>
    ${next ? `<div class="soft-note">Next branch tech: <strong>${next[1].name}</strong> · ${techStageReady(next[1]) ? `${progressPct(next[1].cost)}% funded` : status.join(' · ')}</div>` : `<div class="soft-note">This lineage branch is fully researched for the current run.</div>`}
  </div>`;
}

function effectLabel(effect) {
  const labels = {
    brood_surge:'Brood Surge',
    amber_rush:'Amber Rush',
    star_current:'Star Current',
  };
  return labels[effect] || effect;
}

function specialSummary(special) {
  if (!special) return '';
  const parts = [];
  if (special.bugs) parts.push(`+${special.bugs} bug${special.bugs > 1 ? 's' : ''}`);
  if (special.hatch) parts.push(`+${Math.round(special.hatch * 100)}% hatch progress`);
  if (special.active) parts.push(`starts ${effectLabel(special.active)}`);
  return parts.join(' · ');
}

function applySpecialRewards(special) {
  if (!special) return [];
  const notes = [];
  if (special.bugs) {
    const gained = awardBug(special.bugs);
    if (gained > 0) notes.push(`+${gained} bug${gained > 1 ? 's' : ''}`);
    else notes.push('housing blocked extra brood');
  }
  if (special.hatch) {
    G.hatch.progress = Math.min(0.99, (G.hatch.progress || 0) + special.hatch);
    notes.push(`+${Math.round(special.hatch * 100)}% hatch progress`);
  }
  if (special.active) {
    G.events.active = special.active;
    G.events.ticks_left = special.ticks || 120;
    notes.push(`${effectLabel(special.active)} started`);
  }
  return notes;
}

function lineageContentHint(kind) {
  const cap = ownedCapstoneId();
  if (!cap) return '';
  const stage = lineageEvolutionStage(cap);
  const source = kind === 'craft' ? CRAFTS : TRADES;
  const entries = source.filter(item => item.capstone === cap);
  if (!entries.length) return '';
  const row = entries.map(item => {
    const unlocked = lineageStageUnlocked(item);
    return `<div class="guide-item" style="border-color:${unlocked ? 'rgba(94,229,143,0.25)' : 'var(--border)'}">
      <strong>${unlocked ? 'READY' : 'LOCKED'} · ${item.name}</strong><br>${lineageUnlockLabel(item)}${specialSummary(item.special) ? `<br><span class="soft-note">Bonus: ${specialSummary(item.special)}</span>` : ''}
    </div>`;
  }).join('');
  const lead = kind === 'craft'
    ? 'Your evolved lineage now unlocks exclusive recipes that solve bottlenecks in a path-specific way.'
    : 'Your evolved lineage now unlocks exclusive trade routes that push the chosen path even further apart.';
  return `<div class="guide-panel lineage-panel" style="margin-top:10px;">
    <div class="guide-title">${kind === 'craft' ? 'LINEAGE CRAFTS' : 'LINEAGE TRADES'}</div>
    <div class="guide-copy">${lead} Current evolution stage: <span class="keyline">${stage}</span>.</div>
    <div class="guide-grid">${row}</div>
  </div>`;
}

function displayBuildingName(bid) {
  const def = BLDGS[bid];
  if (!def) return '';
  const stage = lineageEvolutionStage(def.capstone);
  if (bid === 'brood_nursery' && stage >= 1) return stage >= 2 ? 'Royal Nursery' : 'Grand Nursery';
  if (bid === 'amber_vault' && stage >= 1) return stage >= 2 ? 'Monolith Vault' : 'Deep Amber Vault';
  if (bid === 'sky_beacon' && stage >= 1) return stage >= 2 ? 'Astral Beacon' : 'Star Beacon';
  return def.name;
}

function displayJobName(jid) {
  const def = JOBS[jid];
  if (!def) return '';
  const stage = lineageEvolutionStage(def.capstone);
  if (jid === 'nurse' && stage >= 1) return stage >= 2 ? 'Royal Matron' : 'Brood Matron';
  if (jid === 'excavator' && stage >= 1) return stage >= 2 ? 'Fault Warden' : 'Deep Excavator';
  if (jid === 'navigator' && stage >= 1) return stage >= 2 ? 'Astral Navigator' : 'Star Navigator';
  return def.name;
}

function buildingEffects(bid, state = G) {
  const def = BLDGS[bid];
  const effects = { ...((def && def.effects) || {}) };
  const stage = lineageEvolutionStage(def && def.capstone, state);
  if (bid === 'brood_nursery') {
    if (stage >= 1) Object.assign(effects, { housing:10, hatch_mult:0.38, nurse_mult:0.35 });
    if (stage >= 2) Object.assign(effects, { housing:12, hatch_mult:0.55, nurse_mult:0.55 });
  }
  if (bid === 'amber_vault') {
    if (stage >= 1) Object.assign(effects, { storage_mult:0.24, leaves_prod:0.028, dirt_prod:0.028, gather_bonus:0.12 });
    if (stage >= 2) Object.assign(effects, { storage_mult:0.30, leaves_prod:0.036, dirt_prod:0.036, gather_bonus:0.18 });
  }
  if (bid === 'sky_beacon') {
    if (stage >= 1) Object.assign(effects, { aether_prod:0.032, elytra_prod:0.0045, navigator_mult:0.35 });
    if (stage >= 2) Object.assign(effects, { aether_prod:0.045, elytra_prod:0.0065, navigator_mult:0.55 });
  }
  return effects;
}

function jobLineageMult(jid, state = G) {
  const stage = lineageEvolutionStage(JOBS[jid] && JOBS[jid].capstone, state);
  if (jid === 'nurse') return stage >= 2 ? 1.55 : stage >= 1 ? 1.25 : 1;
  if (jid === 'excavator') return stage >= 2 ? 1.70 : stage >= 1 ? 1.35 : 1;
  if (jid === 'navigator') return stage >= 2 ? 1.65 : stage >= 1 ? 1.30 : 1;
  return 1;
}

function effectiveJobProduces(jid, state = G) {
  const def = JOBS[jid];
  if (!def) return {};
  const mult = jobLineageMult(jid, state);
  return Object.fromEntries(Object.entries(def.produces).map(([res, value]) => [res, value * mult]));
}

function buildingDesc(bid) {
  const def = BLDGS[bid];
  if (!def) return '';

  if (bid === 'brood_nursery' && stage >= 1) return stage >= 2
    ? '+12 max population. Eggs hatch 55% faster and Nurses work 55% better.'

}

function jobDesc(jid) {

  if (jid === 'nurse' && stage >= 1) return stage >= 2

    <div class="guide-grid">

function swarmResearchHatchMult() {
  let mult = 1;
  if (G.techs.swarm_genealogies) mult *= 1 + (TECHS.swarm_genealogies.effects?.hatch_mult || 0);
  if (G.techs.imperial_husbandry) mult *= 1 + (TECHS.imperial_husbandry.effects?.hatch_mult || 0);
  return mult;
}

function swarmResearchNurseMult() {
  let mult = 1;
  if (G.techs.swarm_genealogies) mult *= 1 + (TECHS.swarm_genealogies.effects?.nurse_mult || 0);
  if (G.techs.imperial_husbandry) mult *= 1 + (TECHS.imperial_husbandry.effects?.nurse_mult || 0);
  return mult;
}

function swarmResearchUpkeepReduction() {
  return (G.techs.imperial_husbandry ? (TECHS.imperial_husbandry.effects?.upkeep_red || 0) : 0);
}

function amberResearchStorageBonus() {
  let add = 0;
  if (G.techs.vault_compression) add += TECHS.vault_compression.effects?.storage_mult || 0;
  return add;
}

function amberResearchGroundMult() {
  let mult = 1;
  if (G.techs.vault_compression) mult *= 1 + (TECHS.vault_compression.effects?.ground_mult || 0);
  if (G.techs.fault_exchange) mult *= 1 + (TECHS.fault_exchange.effects?.ground_mult || 0);
  return mult;
}

function amberResearchExcavatorMult() {
  let mult = 1;
  if (G.techs.vault_compression) mult *= 1 + (TECHS.vault_compression.effects?.excavator_mult || 0);
  if (G.techs.fault_exchange) mult *= 1 + (TECHS.fault_exchange.effects?.excavator_mult || 0);
  return mult;
}

function amberResearchGatherBonus() {
  return (G.techs.fault_exchange ? (TECHS.fault_exchange.effects?.gather_bonus || 0) : 0);
}

function amberResearchTradeBonus() {
  return (G.techs.fault_exchange ? (TECHS.fault_exchange.effects?.trade_mult || 0) : 0);
}

function celestialResearchSkyMult() {
  let mult = 1;
  if (G.techs.beacon_attunement) mult *= 1 + (TECHS.beacon_attunement.effects?.sky_mult || 0);
  if (G.techs.astral_cartography) mult *= 1 + (TECHS.astral_cartography.effects?.sky_mult || 0);
  return mult;
}

function celestialResearchNavigatorMult() {
  let mult = 1;
  if (G.techs.beacon_attunement) mult *= 1 + (TECHS.beacon_attunement.effects?.navigator_mult || 0);
  if (G.techs.astral_cartography) mult *= 1 + (TECHS.astral_cartography.effects?.navigator_mult || 0);
  return mult;
}

function celestialResearchLaunchBonus() {
  return (G.techs.astral_cartography ? (TECHS.astral_cartography.effects?.launch_bonus || 0) : 0);
}

function storageMetaMult() {
  let mult = 1 + (G.meta.launches || 0) * 0.03 + legacyRank('amber_reserve') * 0.15 + milestoneRunStorageBonus() + amberResearchStorageBonus() + projectStorageBonus();
  if (capstoneOwned('amber_monolith')) mult += 0.35;
  return mult;
}

function productionMetaMult() {
  return 1 + (G.meta.launches || 0) * 0.05 + legacyRank('fungal_memory') * 0.12 + milestoneRunProdBonus() + projectProductionBonus();
}

function gatherPower() {
  let power = 1.5 + (G.meta.launches || 0) * 0.1 + legacyRank('amber_reserve') * 0.2 + milestoneRunGatherBonus() + amberResearchGatherBonus() + projectGatherBonus();
  if (capstoneOwned('amber_monolith')) power += 0.8;
  return power;
}

function startingBugsFromMeta(meta) {
  return legacyRank('brood_ritual', meta) + Math.floor((meta.launches || 0) / 2) + (legacyRank('swarm_sovereignty', meta) > 0 ? 2 : 0);
}

function hatchLegacyMult() {
  return (1 + legacyRank('queen_blessing') * 0.25 + milestoneRunHatchBonus() + projectHatchBonus()) * (capstoneOwned('swarm_sovereignty') ? 1.5 : 1) * swarmResearchHatchMult();
}

function upkeepLegacyMult() {
  const extra = capstoneOwned('swarm_sovereignty') ? 0.10 : 0;
  return Math.max(0.38, 1 - legacyRank('queen_blessing') * 0.05 - extra - milestoneRunUpkeepBonus() - swarmResearchUpkeepReduction());
}

function tradeLegacyMult() {
  return 1 + legacyRank('trade_pacts') * 0.12 + milestoneRunTradeBonus() + amberResearchTradeBonus() + projectTradeBonus();
}

function skyLegacyMult() {
  let mult = 1 + legacyRank('sky_legacy') * 0.2 + milestoneSkyBonus() + projectSkyBonus();
  if (capstoneOwned('celestial_throne')) mult += 0.45;
  return mult * celestialResearchSkyMult();
}

function maxRes(res) {
  const def = RES[res];
  if (!def) return 0;
  let max = def.base_max;
  max = Math.floor(max * storageMetaMult());
  const cacheStorage = (G.bldgs.leaf_cache || 0) * (BLDGS.leaf_cache.effects.storage_mult || 0);
  const amberStorage = (G.bldgs.amber_vault || 0) * (buildingEffects('amber_vault').storage_mult || 0);
  max = Math.floor(max * (1 + cacheStorage + amberStorage));
  if (res === 'insight') {
    max += (G.bldgs.chrysalis_chamber || 0) * (BLDGS.chrysalis_chamber.effects.insight_max || 0);
  }
  return max;
}

function housing() {
  let h = 0;
  for (const [bid, n] of Object.entries(G.bldgs)) {
    if (BLDGS[bid] && BLDGS[bid].effects.housing) h += n * BLDGS[bid].effects.housing;
  }
  return h;
}

function employed() {
  return Object.values(G.jobs).reduce((a, b) => a + b, 0);
}

function bugsOnExpedition() {
  return (G.expeditions || []).reduce((sum, e) => sum + (e.bugs || 0), 0);
}

function idle() {
  return Math.max(0, G.pop.total - employed() - bugsOnExpedition());
}

function bldgCost(bid) {
  const def = BLDGS[bid];
  const n = G.bldgs[bid] || 0;
  const out = {};
  for (const [r, base] of Object.entries(def.base_cost)) {
    out[r] = Math.ceil(base * Math.pow(def.cost_mult, n));
  }
  return out;
}

function canAfford(cost) {
  return Object.entries(cost).every(([r, a]) => (G.res[r] || 0) >= a);
}

function canAffordBldg(bid) {
  return canAfford(bldgCost(bid));
}

function canAffordTech(tid) {
  const def = TECHS[tid];
  if (!def || !techVisible(def) || !techReqsMet(def) || !techStageReady(def)) return false;
  return canAfford(def.cost);
}

function craftDisc() {
  return 1 - Math.min(0.5, (G.bldgs.web_workshop || 0) * (BLDGS.web_workshop.effects.craft_disc || 0));
}

function tradeMult() {
  return (1 + (G.bldgs.flight_tower || 0) * (BLDGS.flight_tower.effects.trade_mult || 0)) * tradeLegacyMult();
}


function hatchRate() {
  if (housing() <= G.pop.total) return 0;
  if (G.res.honeydew < 8) return 0;
  const gap = housing() - G.pop.total;
  const base = G.pop.total === 0 ? 0.03 : 0.006;
  const foodMult = Math.min(2.2, 0.75 + (G.res.honeydew / Math.max(1, maxRes('honeydew'))) * 2.2);
  const nurseMult = 1 + (G.jobs.nurse || 0) * 0.04 * jobLineageMult('nurse');
  const nurseryMult = 1 + (G.bldgs.brood_nursery || 0) * (buildingEffects('brood_nursery').hatch_mult || 0);
  const eventMult = G.events.active === 'brood_surge' ? 1.8 : 1;
  return base * gap * foodMult * hatchLegacyMult() * nurseMult * nurseryMult * eventMult;
}

function computeRates() {
  const r = Object.fromEntries(Object.keys(G.res).map(k => [k, 0]));
  const season = seasonName();
  const sm = S_MOD[season] || {};
  const globalMult = productionMetaMult() * (1 + (G.bldgs.mycelium_network || 0) * (BLDGS.mycelium_network.effects.global_prod || 0) + (G.bldgs.colony_spire || 0) * (BLDGS.colony_spire.effects.global_prod || 0));

  let hdEventMult = 1;
  if (G.events.active === 'hd_boost') hdEventMult = 1.5;
  if (G.events.active === 'hd_blight') hdEventMult = 0.5;
  if (G.events.active === 'hd_drought') hdEventMult = 0.8;
  const amberEventMult = G.events.active === 'amber_rush' ? 1.6 : 1;
  const starEventMult = G.events.active === 'star_current' ? 1.7 : 1;

  let hdSeason = sm.honeydew ?? 1;
  if (season === 'Winter' && G.techs.seasonal_awareness) {
    const red = TECHS.seasonal_awareness.effects?.winter_red || 0;
    hdSeason = hdSeason + (1 - hdSeason) * red;
  }

  r.honeydew += (G.bldgs.clover_patch || 0) * BLDGS.clover_patch.effects.hd_prod * hdSeason * hdEventMult * globalMult;
  r.leaves   += (G.bldgs.amber_vault || 0) * (buildingEffects('amber_vault').leaves_prod || 0) * globalMult * amberEventMult * milestoneGroundBonus() * amberResearchGroundMult();
  r.dirt     += (G.bldgs.amber_vault || 0) * (buildingEffects('amber_vault').dirt_prod || 0) * globalMult * amberEventMult * milestoneGroundBonus() * amberResearchGroundMult();
  r.spores   += (G.bldgs.spore_circle || 0) * (BLDGS.spore_circle.effects.spores_prod || 0) * globalMult;
  r.wax      += (G.bldgs.wax_foundry || 0) * (BLDGS.wax_foundry.effects.wax_prod || 0) * globalMult;
  r.silk     += (G.bldgs.web_workshop || 0) * (BLDGS.web_workshop.effects.silk_prod || 0) * globalMult;
  r.compound += (G.bldgs.compound_lab || 0) * (BLDGS.compound_lab.effects.compound_prod || 0) * globalMult;
  r.elytra   += (G.bldgs.flight_tower || 0) * (BLDGS.flight_tower.effects.elytra_prod || 0) * globalMult * skyLegacyMult() * starEventMult;
  r.elytra   += (G.bldgs.sky_beacon || 0) * (buildingEffects('sky_beacon').elytra_prod || 0) * globalMult * skyLegacyMult() * starEventMult;
  r.aether   += (G.bldgs.sky_dock || 0) * (BLDGS.sky_dock.effects.aether_prod || 0) * globalMult * skyLegacyMult() * starEventMult;
  r.aether   += (G.bldgs.sky_beacon || 0) * (buildingEffects('sky_beacon').aether_prod || 0) * globalMult * skyLegacyMult() * starEventMult;
  r.skyglass += (G.bldgs.cloud_condenser || 0) * (BLDGS.cloud_condenser.effects.skyglass_prod || 0) * globalMult * skyLegacyMult() * starEventMult * milestoneSkyglassBonus();

  for (const [jid, count] of Object.entries(G.jobs)) {
    if (!count) continue;
    const produces = effectiveJobProduces(jid);
    for (const [res, base] of Object.entries(produces)) {
      let jrate = base * count * globalMult;
      if (jid === 'forager') {
        const fgMult = 1 + (G.bldgs.fungal_garden || 0) * (BLDGS.fungal_garden.effects.forager_mult || 0);
        jrate *= fgMult * hdSeason * hdEventMult;
      }
      if (jid === 'leaf_col') {
        jrate *= (sm.leaves ?? 1.0);
      }
      if (jid === 'scholar') {
        const obsMult = 1 + (G.bldgs.hive_observatory || 0) * (BLDGS.hive_observatory.effects.scholar_mult || 0);
        const advMult = (G.techs.advanced_science && TECHS.advanced_science.effects?.global_insight) || 1;
        jrate *= obsMult * advMult;
      }
      if (jid === 'nurse') {
        const nurseryMult = 1 + (G.bldgs.brood_nursery || 0) * (buildingEffects('brood_nursery').nurse_mult || 0);
        jrate *= nurseryMult * swarmResearchNurseMult();
      }
      if (jid === 'excavator') {
        jrate *= amberEventMult * milestoneGroundBonus() * amberResearchExcavatorMult() * amberResearchGroundMult();
      }
      if (jid === 'aeronaut') jrate *= skyLegacyMult() * starEventMult;
      if (jid === 'navigator') {
        const beaconMult = 1 + (G.bldgs.sky_beacon || 0) * (buildingEffects('sky_beacon').navigator_mult || 0);
        jrate *= beaconMult * skyLegacyMult() * starEventMult * celestialResearchNavigatorMult();
      }
      r[res] += jrate;
    }
  }

  r.honeydew -= G.pop.total * 0.003 * upkeepLegacyMult();
  return r;
}

function awardBug(n = 1) {
  const add = Math.min(n, Math.max(0, housing() - G.pop.total));
  if (add <= 0) return 0;
  G.pop.total += add;
  log(`A new bug hatches! Colony: ${G.pop.total}/${housing()}`);
  if (add > 0) toast(`+${add} bug${add > 1 ? 's' : ''}`);
  return add;
}

function triggerRandomEvent() {
  const choicePool = CHOICE_EVENTS.filter(ev => (!ev.req || G.techs[ev.req]) && (!ev.capstone || capstoneOwned(ev.capstone)));
  if (!G.events.choice && choicePool.length && Math.random() < 0.42) {
    const ev = choicePool[Math.floor(Math.random() * choicePool.length)];
    G.events.choice = evolveChoiceEvent(ev);
    renderChoiceEvent();
    return;
  }

  const pool = EVENTS.filter(ev => (!ev.req || G.techs[ev.req]) && (!ev.capstone || capstoneOwned(ev.capstone)));
  const totalW = pool.reduce((a, e) => a + e.w, 0);
  let rnd = Math.random() * totalW;
  const ev = pool.find(e => { rnd -= e.w; return rnd <= 0; }) || pool[0];
  log(`Event: ${ev.msg}`, 'ev');
  toast(ev.msg);
  switch (ev.effect) {
    case 'hd_boost':
    case 'hd_blight':
    case 'hd_drought':
      G.events.active = ev.effect;
      G.events.ticks_left = ev.effect === 'hd_blight' ? 100 : 150;
      break;
    case 'leaves_gift':
      G.res.leaves = Math.min(maxRes('leaves'), G.res.leaves + 30);
      G.vis.leaves = true;
      break;
    case 'insight_gift':
      G.res.insight = Math.min(maxRes('insight'), G.res.insight + 20);
      G.vis.insight = true;
      break;
    case 'pop_gift':
      awardBug(1);
      break;
    case 'spores_gift':
      G.vis.spores = true;
      G.res.spores = Math.min(maxRes('spores'), G.res.spores + 50);
      break;
    case 'aether_gift':
      G.vis.aether = true;
      G.res.aether = Math.min(maxRes('aether'), G.res.aether + 40);
      break;
  }
}

function applyChoiceEffect(effect) {

      G.res.honeydew = Math.max(0, G.res.honeydew - 15);
      awardBug(1);

      G.vis.wax = true;

      break;
    case 'amber_sell':
      G.res.honeydew = Math.min(maxRes('honeydew'), G.res.honeydew + 80);

    case 'anchor_docks':

    case 'queen_tribute':
      G.res.honeydew = Math.max(0, G.res.honeydew - 60);

      G.events.ticks_left = 100;
      break;
    case 'brood_surge_start':

      G.events.ticks_left = 120;
      break;
    case 'brood_recruit':
      G.res.honeydew = Math.max(0, G.res.honeydew - 20);

      break;
    case 'amber_excavate':
      G.vis.leaves = true;
      G.vis.dirt = true;

      break;

      G.vis.elytra = true;
      G.res.aether = Math.min(maxRes('aether'), G.res.aether + 45);
      G.res.elytra = Math.min(maxRes('elytra'), G.res.elytra + 2);
      break;
    case 'star_current_start':
      G.events.active = 'star_current';
      G.events.ticks_left = 120;
      break;
    case 'imperial_brood_surge':
      G.events.active = 'brood_surge';
      G.events.ticks_left = 180;

      break;
    case 'imperial_recruit':
      G.res.honeydew = Math.max(0, G.res.honeydew - 30);

      break;

      G.vis.dirt = true;
      G.vis.resin = true;

      G.res.leaves = Math.min(maxRes('leaves'), G.res.leaves + 60);
      G.res.dirt = Math.min(maxRes('dirt'), G.res.dirt + 60);
      G.res.resin = Math.min(maxRes('resin'), G.res.resin + 20);
      G.res.chitin = Math.min(maxRes('chitin'), G.res.chitin + 10);
      break;
    case 'monolith_reserve':
      G.events.active = 'amber_rush';
      G.events.ticks_left = 180;
      G.vis.wax = true;
      G.res.wax = Math.min(maxRes('wax'), G.res.wax + 10);
      break;
    case 'astral_chart':
      G.vis.aether = true;
      G.vis.elytra = true;
      G.vis.skyglass = true;

}

function chooseEvent(idx) {
  if (!G.events.choice) return;

function closeChoiceEvent() {
