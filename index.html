<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Garage - Neon Aether: Digital Alchemy</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="inventoryContainer">
      <header>
        <h2>Garage Storage</h2>
        <div id="resourceDisplay">
          Aether: <span id="inventoryAether">0</span>
        </div>
        <div id="prestigeDisplay">
          Neon Cores: <span id="inventoryNeonCores">0</span> | Prestige Level: <span id="inventoryPrestigeCount">0</span>
        </div>
      </header>
      <h1>Your Garage</h1>
      <p>This is your permanent storage. Items dropped off from your car will appear here.</p>
      <div id="playerInventoryGrid" style="grid-template-columns: repeat(6, 1fr);">
        <!-- 24 cells -->
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
        <div class="inventory-slot"></div>
      </div>
      <button onclick="location.href='index.html'">Back to Game</button>
    </div>
    <script src="inventory.js"></script>
  </body>
</html>
