  { id:'amber_brood_store', tier:'rare', w:6, tileTypes:['spring','thicket','chitin'], icon:'⬥', name:'Amber Brood Store', desc:'A sealed chamber held royal feed and preserved shell stock.', reward:{ royal_jelly:3, resin:8, chitin:10 }, hatch_boost:0.18 },
  { id:'sealed_cache', tier:'rare', w:5, tileTypes:['hazard','ruins'], icon:'⬟', name:'Sealed Cache', desc:'A buried war-cache survived under shattered plating.', reward:{ compound:8, insight:12, royal_jelly:3 }, event:'ancient_cache' },
  { id:'sky_relay', tier:'legendary', w:2, tileTypes:['sky','ruins','hazard'], icon:'☁', name:'Sky Relay Core', desc:'A humming relay heart turns the route into a live signal line.', reward:{ aether:26, skyglass:10, insight:10 }, reveal:2, event:'ancient_cache' },
];

function frontierFindOutlook(tileType) {
  switch (tileType) {
    case 'thicket': return 'brood stores, route markers, and resin caches';
    case 'chitin': return 'amber stores, shell salvage, and silk markers';
    case 'fungal': return 'mould ledgers, spores, and hidden side paths';
    case 'ruins': return 'waystones, sealed relics, and old caches';
    case 'spring': return 'sweet stores, resin pockets, and trader-grade finds';
    case 'silk': return 'web markers, wax bundles, and tidy harvest pockets';
    case 'sky': return 'skyglass, relay parts, and long-range route intel';
    case 'hazard': return 'sealed war-caches and dangerous relic salvage';
    case 'plains': return 'light route intel and the occasional side trail';
    default: return 'unusual survey finds beyond simple materials';
  }
}

function frontierFindChance(exp) {
  if (!exp || !exp.targetKey) return 0;
  const tile = getMapTileByKey(exp.targetKey);
  if (!tile) return 0;
  const danger = Math.max(1, Number(exp.danger_score || tileExpeditionDangerScore(tile) || 1));
  const distance = Math.max(1, tileExpeditionDistance(exp.targetKey));
  let chance = 0.14 + Math.max(0, danger - 1) * 0.04 + Math.min(0.08, distance * 0.012);
  if (['ruins', 'sky', 'hazard'].includes(tile.type)) chance += 0.06;
  else if (['spring', 'silk', 'fungal'].includes(tile.type)) chance += 0.03;
  if (expeditionEscortCount(exp) > 0) chance += 0.01;
  return Math.max(0.10, Math.min(0.42, chance));
}

function frontierFindCandidates(exp) {
  if (!exp || !exp.targetKey) return [];
  const tile = getMapTileByKey(exp.targetKey);
  if (!tile) return [];
  const danger = Math.max(1, Number(exp.danger_score || tileExpeditionDangerScore(tile) || 1));
  const distance = Math.max(1, tileExpeditionDistance(exp.targetKey));
  const rareBoost = Math.min(1.5, (danger - 1) * 0.22 + distance * 0.08 + (['ruins', 'sky', 'hazard'].includes(tile.type) ? 0.22 : 0));
  return FRONTIER_FIND_DEFS
    .filter(def => !def.tileTypes || def.tileTypes.includes(tile.type))
    .map(def => {
      let mult = 1;
      if (def.tier === 'common') mult = Math.max(0.7, 1.25 - rareBoost * 0.22);
      else if (def.tier === 'uncommon') mult = 0.9 + rareBoost * 0.18;
      else if (def.tier === 'rare') mult = 0.45 + rareBoost * 0.26;
      else if (def.tier === 'legendary') mult = 0.08 + rareBoost * 0.07;
      return { ...def, w: Math.max(0.05, (def.w || 1) * mult) };
    });
}

function frontierFindTierLabel(find) {
  if (!find || !find.tier) return 'Find';
  return find.tier.charAt(0).toUpperCase() + find.tier.slice(1);
}

function frontierFindTone(find) {
  switch (find && find.tier) {
    case 'legendary': return { color:'var(--purple)', bg:'rgba(183,152,255,0.14)', border:'rgba(183,152,255,0.34)' };
    case 'rare': return { color:'var(--sky)', bg:'rgba(120,215,255,0.10)', border:'rgba(120,215,255,0.28)' };
    case 'uncommon': return { color:'var(--amber)', bg:'rgba(255,197,98,0.10)', border:'rgba(255,197,98,0.28)' };
    default: return { color:'var(--accent)', bg:'rgba(94,229,143,0.10)', border:'rgba(94,229,143,0.24)' };
  }
}

function rollFrontierFind(exp) {
  if (!exp || !exp.targetKey) return null;
  if (Math.random() > frontierFindChance(exp)) return null;
  const candidates = frontierFindCandidates(exp);
  if (!candidates.length) return null;
  const pickedId = weightedScoutEncounterPick(candidates.map(item => ({ id:item.id, w:item.w })));
  return candidates.find(item => item.id === pickedId) || candidates[0] || null;
}

function frontierFindSpawnKey(originKey, eventId) {
  initMapIfNeeded();
  if (!originKey || !G.map || !G.map.tiles) return '';
  const evType = MAP_EVENT_TYPES.find(ev => ev.id === eventId);
  const keys = [];
  const [xRaw, yRaw] = originKey.split(',');
  const ox = parseInt(xRaw, 10);
  const oy = parseInt(yRaw, 10);
  for (const [key, tile] of Object.entries(G.map.tiles)) {
    if (!tile || !tile.revealed) continue;
    if (tile.type === 'colony' || tile.type === 'hazard') continue;
    if (G.map_events.some(ev => ev.key === key)) continue;
    const landmark = getMapLandmark(key);
    if (landmark && !landmark.resolved) continue;
    if (getRivalBaseSite(key)) continue;
    if (evType && evType.id === 'resource_bloom' && !(MAP_TILE_DEFS[tile.type] && MAP_TILE_DEFS[tile.type].loot)) continue;
    const [txRaw, tyRaw] = key.split(',');
    const tx = parseInt(txRaw, 10);
    const ty = parseInt(tyRaw, 10);
    const dist = Number.isFinite(ox) && Number.isFinite(oy) ? Math.sqrt(((tx - ox) ** 2) + (((ty - oy) * 1.35) ** 2)) : 999;
    keys.push({ key, dist });
  }
  keys.sort((a, b) => a.dist - b.dist);
  return keys[0] ? keys[0].key : '';
}

function spawnMapEventAtKey(key, eventId, quiet = false) {
  if (!key || !G.map || !G.map.tiles || (G.map_events || []).length >= 4) return null;
  const tile = G.map.tiles[key];
  const evType = MAP_EVENT_TYPES.find(ev => ev.id === eventId);
  if (!tile || !tile.revealed || !evType) return null;
  if (G.map_events.some(ev => ev.key === key)) return null;
  if (evType.id === 'resource_bloom' && !(MAP_TILE_DEFS[tile.type] && MAP_TILE_DEFS[tile.type].loot)) return null;
  const rewardData = evType.reward_fn(tile.type);
  const ev = {
    key,
    id: evType.id,
    name: evType.name,
    icon: evType.icon,
    color: evType.color,
    desc: evType.desc,
    action_label: evType.action_label,
    ticks_left: Math.ceil(evType.duration * 0.9),
    max_ticks: Math.ceil(evType.duration * 0.9),
    reward: rewardData,
  };
  G.map_events.push(ev);
  if (!quiet) {
    log(`Map event: ${ev.name} surfaced at tile (${key}) from frontier activity.`, 'ev');
    toast(`${ev.icon} ${ev.name} revealed on the frontier!`);
  }
  return ev;
}

function applyFrontierFind(exp, find) {
  if (!exp || !find) return null;
  const gained = [];
  for (const [res, amt] of Object.entries(find.reward || {})) {
    if (G.res[res] === undefined) continue;
    const added = Math.min(amt, maxRes(res) - (G.res[res] || 0));
    if (added > 0) {
      G.res[res] += added;
      G.vis[res] = true;
      gained.push(`${RES[res].icon}+${added}`);
    }
  }
  let revealed = 0;
  if (find.reveal) revealed = revealLandmarkRadius(exp.targetKey, find.reveal);
  let event = null;
  if (find.event) {
    const spawnKey = frontierFindSpawnKey(exp.targetKey, find.event);
    if (spawnKey) event = spawnMapEventAtKey(spawnKey, find.event, true);
  }
  let hatchBoost = 0;
  if (find.hatch_boost) {
    hatchBoost = Math.max(0, Number(find.hatch_boost || 0));
    G.hatch.progress = Math.min(0.98, (G.hatch.progress || 0) + hatchBoost);
  }
  G.stats.frontier_finds = (G.stats.frontier_finds || 0) + 1;
  return { find, gained, revealed, event, hatchBoost };
}

function frontierFindSummaryLine(result) {
  if (!result || !result.find) return '';
  const parts = [];
  if (result.gained && result.gained.length) parts.push(result.gained.join(' '));
  if (result.revealed > 0) parts.push(`revealed ${result.revealed} nearby tile${result.revealed > 1 ? 's' : ''}`);
  if (result.event) parts.push(`surfaced ${result.event.name}`);
  if (result.hatchBoost > 0) parts.push(`+${Math.round(result.hatchBoost * 100)}% hatch progress`);
  return `${result.find.icon} ${result.find.name}${parts.length ? ` · ${parts.join(' · ')}` : ''}`;
}

function buildTileExpeditionLoot(exp) {
  const tile = getMapTileByKey(exp.targetKey);
  if (!tile) return {};
  const def = MAP_TILE_DEFS[tile.type];
  if (def && def.loot) {
    let mult = 0.22 + Math.min(0.16, tileExpeditionDistance(exp.targetKey) * 0.015);
    if (tile.type === 'spring' || tile.type === 'sky') mult += 0.05;
    const loot = {};
    for (const [res, amount] of Object.entries(def.loot)) {
      if (!amount) continue;
      loot[res] = Math.max(1, Math.floor(amount * mult));
    }
    return loot;
  }
  if (tile.type === 'hazard') {
    return {
      chitin: 3 + Math.max(0, (exp.danger_score || 4) - 2),
      insight: 2 + Math.max(0, (exp.danger_score || 4) - 3) * 2,
    };
  }
  if (tile.type === 'plains') {
    const distance = tileExpeditionDistance(exp.targetKey);
    return {
      leaves: 4 + Math.max(0, Math.round(distance * 0.6)),
      dirt: 4 + Math.max(0, Math.round(distance * 0.8)),
    };
  }
  return {};
}

function collectExpedition(idx) {
  if (!G.expeditions || !G.expeditions[idx]) return;
  const exp = G.expeditions[idx];
  if (!exp.done) return;

  if (exp.targetKey) {
    const descriptor = expeditionDescriptor(exp);
    const tile = getMapTileByKey(exp.targetKey);
    const def = tile ? MAP_TILE_DEFS[tile.type] : null;
    if (exp.reportStatus === 'aborted') {
      releaseExpeditionEscorts(exp);
      G.expeditions.splice(idx, 1);
      G.stats.expeditions = (G.stats.expeditions || 0) + 1;
      const expeditionName = descriptor ? descriptor.name : 'Frontier expedition';
      const retreatMsg = exp.abortReason || `The route to ${expeditionName} had to be abandoned.`;
      log(`Expedition aborted at ${expeditionName}: ${retreatMsg}`, 'bad');
      toast(`${expeditionName}: survey aborted`, 'warn');
      renderAll();
      return;
    }
    const hazard = rollExpeditionHazard(exp);
    const baseLoot = buildTileExpeditionLoot(exp);
    const finalLoot = buildScaledExpeditionLoot(baseLoot, (hazard && hazard.loot_mult ? hazard.loot_mult : 1) * Math.max(0.2, exp.lootMult || 1));
    const gained = [];
    for (const [res, amt] of Object.entries(finalLoot)) {
      if (G.res[res] === undefined) continue;
      const added = Math.min(amt, maxRes(res) - (G.res[res] || 0));
      if (added > 0) {
        G.res[res] += added;
        G.vis[res] = true;
        gained.push(`${RES[res].icon}+${added}`);
      }
    }
    const appliedLoss = hazard && hazard.loss ? applyExpeditionLossBundle(hazard.loss) : {};
    const revealed = revealMapTilesToKey(exp.targetKey, Math.max(0, (exp.bugs || 1) - 1));
    const frontierFind = rollFrontierFind(exp);
    const frontierFindResult = frontierFind ? applyFrontierFind(exp, frontierFind) : null;
    refreshRivalBaseDiscoveries(G);
    if (frontierFindResult && !hasSeenPopup('frontier_finds')) showFeatureAnnounce('frontier_finds');
    releaseExpeditionEscorts(exp);
    G.expeditions.splice(idx, 1);
    const bugLoss = hazard && hazard.bug_loss ? applyExpeditionBugLoss(hazard.bug_loss) : 0;
    G.stats.expeditions = (G.stats.expeditions || 0) + 1;
    if (bugLoss > 0) G.stats.expedition_bug_losses = (G.stats.expedition_bug_losses || 0) + bugLoss;
    const lootStr = gained.join(' ');
    const lossStr = expeditionLossBundleText(appliedLoss);
    const msgParts = [];
    if (def) msgParts.push(`Mapped ${def.label}`);
    if (revealed > 0) msgParts.push(`${revealed} tile${revealed > 1 ? 's' : ''} charted`);
    if (exp.supportNote) msgParts.push(exp.supportNote);
    if (hazard && hazard.msg) msgParts.push(hazard.msg);
    if (lootStr) msgParts.push(lootStr);
    if (frontierFindResult) msgParts.push(`Frontier find: ${frontierFindSummaryLine(frontierFindResult)}`);
    if (lossStr) msgParts.push(`Lost ${lossStr}`);
    if (bugLoss > 0) msgParts.push(`${bugLoss} survey bug${bugLoss > 1 ? 's were' : ' was'} lost on the return.`);
    if (!msgParts.length) msgParts.push('The route was charted.');
    const expeditionName = descriptor ? descriptor.name : 'Frontier expedition';
    log(`Expedition returned from ${expeditionName}: ${msgParts.join(' · ')}`, hazard && hazard.warn ? 'bad' : '');
    const frontierToast = frontierFindResult ? ` · ${frontierFindResult.find.icon} ${frontierFindResult.find.name}` : '';
    const toastText = hazard
      ? `${expeditionName}: ${hazard.toast || 'setback'}${lootStr ? ` · ${lootStr}` : ''}${bugLoss > 0 ? ` · -${bugLoss} bug` : ''}${frontierToast}`
      : `${expeditionName}: ${lootStr || 'route charted'}${frontierToast}`;
    toast(toastText, hazard && hazard.warn ? 'warn' : '');
    renderAll();
    return;
  }

  const zone = EXPEDITIONS.find(z => z.id === exp.zone);
  if (!zone) { releaseExpeditionEscorts(exp); G.expeditions.splice(idx, 1); renderAll(); return; }
  const reward = rollExpeditionReward(zone);
  const hazard = rollExpeditionHazard(zone);
  const finalLoot = buildScaledExpeditionLoot(reward.loot, hazard && hazard.loot_mult ? hazard.loot_mult : 1);
  const gained = [];
  for (const [res, amt] of Object.entries(finalLoot)) {
    if (G.res[res] === undefined) continue;
    const added = Math.min(amt, maxRes(res) - (G.res[res] || 0));
    if (added > 0) {
      G.res[res] += added;
      G.vis[res] = true;
      gained.push(`${RES[res].icon}+${added}`);
    }
  }
  const appliedLoss = hazard && hazard.loss ? applyExpeditionLossBundle(hazard.loss) : {};
  releaseExpeditionEscorts(exp);
  G.expeditions.splice(idx, 1);
  G.stats.expeditions = (G.stats.expeditions || 0) + 1;
  const lootStr = gained.join(' ');
  const lossStr = expeditionLossBundleText(appliedLoss);
  const msgParts = [reward.msg];
  if (hazard && hazard.msg) msgParts.push(hazard.msg);
  if (lootStr) msgParts.push(lootStr);
  if (lossStr) msgParts.push(`Lost ${lossStr}`);
  log(`Expedition returned from ${zone.name}: ${msgParts.join(' · ')}`, hazard && hazard.warn ? 'bad' : '');
  const toastText = hazard
    ? `${zone.name}: ${hazard.toast || 'setback'}${lootStr ? ` · ${lootStr}` : ''}`
    : `${zone.name}: ${lootStr}`;
  toast(toastText, hazard && hazard.warn ? 'warn' : '');
  revealMapTiles(zone.id);
  renderAll();
}

function tickExpeditions(dt) {
  if (!G.expeditions) return;
  for (const exp of G.expeditions) {
    if (exp.done) continue;
    if (exp.awaitingScout || exp.scoutInFlight) continue;
    const seg = expeditionPhaseBreakdown(exp);
    const prevElapsed = Math.max(0, exp.elapsed || 0);
    exp.elapsed += dt;

    if (exp.targetKey) {
      if (!exp.routeChecked && prevElapsed < seg.travelOut && exp.elapsed >= seg.travelOut) {
        exp.routeChecked = true;
        if (Math.random() < expeditionRouteAmbushChance(exp)) {
          exp.elapsed = seg.travelOut;
          pauseExpeditionForScout(exp, 'route');
          continue;
        }
      }
      const surveyEnd = seg.travelOut + seg.surveying;
      if (!exp.destinationChecked && prevElapsed < surveyEnd && exp.elapsed >= surveyEnd) {
        exp.destinationChecked = true;
        if (expeditionNeedsDestinationScout(exp)) {
          exp.elapsed = surveyEnd;
          pauseExpeditionForScout(exp, 'destination');
          continue;
        }
      }
    }

    if (exp.elapsed >= exp.duration) {
      exp.elapsed = exp.duration;
      exp.done = true;
    }
  }
}

function fmtExpTime(secs) {
  const left = Math.max(0, Math.ceil(secs));
  if (left >= 60) return `${Math.floor(left / 60)}m ${left % 60}s`;
  return `${left}s`;
}

function expeditionPhaseBreakdown(exp) {
  const total = Math.max(1, Math.round(exp && exp.duration ? exp.duration : 1));
  let surveying = Math.round(total * (exp && exp.targetKey ? 0.12 : 0.10));
  surveying = Math.max(12, surveying);
  surveying = Math.min(surveying, Math.max(6, total - 24));
  const travelPool = Math.max(2, total - surveying);
  const travelOut = Math.max(1, Math.round(travelPool * 0.5));
  const travelBack = Math.max(1, total - surveying - travelOut);
  return { total, travelOut, surveying, travelBack };
}

function getExpeditionPhaseInfo(exp) {
  const total = Math.max(1, Math.round(exp && exp.duration ? exp.duration : 1));
  const elapsed = Math.max(0, Math.min(total, exp && exp.elapsed ? exp.elapsed : 0));
  const seg = expeditionPhaseBreakdown(exp);
  const totalProgress = Math.min(1, elapsed / total);

  if (exp && exp.awaitingScout) {
    return {
      phase: 'hostile_contact',
      label: 'HOSTILE CONTACT',
      timeLeft: 0,
      phaseProgress: 1,
      totalProgress,
      countdownLabel: 'awaiting fighters',
    };
  }

  if (exp && exp.scoutInFlight) {
    const supportLeft = Math.max(0, ...((G.fighters || []).filter(f => f.status === 'scouting' && f.zone === exp.supportZoneId).map(f => (f.scout_duration || 0) - (f.scout_elapsed || 0)).concat([0])));
    return {
      phase: 'fighter_support',
      label: 'FIGHTERS ENGAGED',
      timeLeft: supportLeft,
      phaseProgress: 0,
      totalProgress,
      countdownLabel: 'until fighters resolve contact',
    };
  }

  if ((exp && exp.done) || elapsed >= total) {
    return {
      phase: 'returned',
      label: 'RETURNED',
      timeLeft: 0,
      phaseProgress: 1,
      totalProgress: 1,
      countdownLabel: 'ready to report',
    };
  }

  if (elapsed < seg.travelOut) {
    return {
      phase: 'travel_out',
      label: 'OUTBOUND',
      timeLeft: seg.travelOut - elapsed,
      phaseProgress: seg.travelOut > 0 ? elapsed / seg.travelOut : 1,
      totalProgress,
      countdownLabel: 'until arrival',
    };
  }

  const afterOut = elapsed - seg.travelOut;
  if (afterOut < seg.surveying) {
    return {
      phase: 'surveying',
      label: 'SURVEYING',
      timeLeft: seg.surveying - afterOut,
      phaseProgress: seg.surveying > 0 ? afterOut / seg.surveying : 1,
      totalProgress,
      countdownLabel: 'on site',
    };
  }

  const afterSurvey = afterOut - seg.surveying;
  return {
    phase: 'travel_back',
    label: 'RETURNING',
    timeLeft: seg.travelBack - afterSurvey,
    phaseProgress: seg.travelBack > 0 ? afterSurvey / seg.travelBack : 1,
    totalProgress,
    countdownLabel: 'until report returns',
  };
}

function expeditionPhaseText(info) {
  switch (info && info.phase) {
    case 'travel_out': return 'The team is marching away from the colony.';
    case 'surveying': return 'The team is mapping the destination and packing what it can carry.';
    case 'hostile_contact': return 'The survey team has made hostile contact and is pinned until fighters intervene.';
    case 'fighter_support': return 'A fighter squad is clearing the route so the expedition can continue.';
    case 'travel_back': return 'The team is heading home with the route report.';
    case 'returned': return 'The expedition has reached the colony and is ready to file its report.';
    default: return 'The team is in motion.';
  }
}

function expeditionPhaseColor(info) {
  switch (info && info.phase) {
    case 'travel_out': return 'var(--sky)';
    case 'surveying': return 'var(--amber)';
    case 'hostile_contact': return 'var(--red)';
    case 'fighter_support': return 'var(--purple)';
    case 'travel_back': return 'var(--accent)';
    case 'returned': return 'var(--accent)';
    default: return 'var(--text-lo)';
  }
}

function expeditionPanel() {
  if (G.pop.total < 1) return '';
  if (!(G.expeditions || []).length && !G.map) initMapIfNeeded();

  let html = `<div class="exp-panel">`;
  html += `<div class="exp-title">EXPEDITIONS · ${expActiveCount()}/${MAX_EXPEDITIONS} ACTIVE</div>`;

  if ((G.expeditions || []).length > 0) {
    html += `<div class="exp-slots">`;
    for (let i = 0; i < G.expeditions.length; i++) {
      const exp = G.expeditions[i];
      const meta = expeditionDescriptor(exp);
      if (!meta) continue;
      const phaseInfo = getExpeditionPhaseInfo(exp);
      const pct = Math.min(100, phaseInfo.totalProgress * 100);
      const expRiskChance = Math.round(expeditionHazardChance(exp) * 100);
      const casualtyChance = Math.round(expeditionCasualtyChance(exp) * 100);
      const packLine = resourceBundleText(meta.pack || {}, { withNames:false, separator:' · ' });
      const escortCount = expeditionEscortCount(exp);
      const escortNames = expeditionEscortNames(exp);
      const escortLabel = escortNames.join(', ') || (escortCount ? `${escortCount} fighter${escortCount > 1 ? 's' : ''}` : '');
      const phaseLine = (phaseInfo.phase === 'returned' || phaseInfo.phase === 'hostile_contact')
        ? (phaseInfo.phase === 'hostile_contact' ? 'Needs fighter support' : 'Ready to report')
        : `${fmtExpTime(phaseInfo.timeLeft)} ${phaseInfo.countdownLabel}`;
      html += `<div class="exp-active${exp.done ? ' exp-reward-flash' : ''}">
        <div class="exp-active-head">
          <div class="exp-active-name">${meta.icon} ${meta.name}</div>
          <div class="exp-active-time" style="color:${expeditionPhaseColor(phaseInfo)}">${phaseInfo.label}${phaseInfo.phase === 'returned' ? '' : ` · ${phaseLine}`}</div>
        </div>
        <div class="exp-active-desc">${expeditionPhaseText(phaseInfo)} ${exp.awaitingScout ? 'Open Scouting and clear the contact to let the survey continue.' : (expRiskChance > 0 ? `${expeditionDangerLabel({ danger_score: meta.danger_score })} threat · ${expRiskChance}% setback chance${casualtyChance > 0 ? ` · ${casualtyChance}% worst-case crew loss` : ''}.` : 'Low threat route.')}</div>
        <div class="exp-active-bugs">${exp.bugs} bug${exp.bugs > 1 ? 's' : ''} assigned${packLine ? ` · packed ${packLine}` : ''}${escortCount ? ` · escort ${escortCount}` : ''}</div>
        ${escortCount ? `<div style="font-size:9px;color:var(--purple);font-family:var(--mono);margin-bottom:4px;">Escort: ${escortLabel}</div>` : ''}
        <div class="exp-progress"><div class="exp-progress-fill${exp.done ? ' done' : ''}" style="width:${pct}%"></div></div>
        ${exp.awaitingScout ? `<button class="exp-collect-btn" onclick="goTab('scouting')">OPEN SCOUTING</button>` : ''}
        ${exp.done ? `<button class="exp-collect-btn" onclick="collectExpedition(${i})">COMPLETE EXPEDITION</button>` : ''}
      </div>`;
    }
    html += `</div>`;
  }

  html += `<div style="font-size:10px;color:var(--text-lo);margin-bottom:6px;">Launch expeditions from the Map by tapping a hidden tile. Missions now move through outbound travel, on-site surveying, hostile contact handoffs, and the return run before the route report is ready.</div>`;
  html += `<button class="exp-collect-btn" style="margin-top:2px;" onclick="goTab('map')">OPEN MAP TO PLAN ROUTES</button>`;
  html += `</div>`;
  return html;
}

/* ── OUTPOST SYSTEM ─────────────────────────── */

function outpostCount() {
  return (G.outposts || []).length;
}

// Total bugs pinned as outpost garrisons (counts against idle)
function outpostWorkers() {
  return (G.outposts || []).filter(o => o.status !== 'dormant').length;
}

// Returns outpost object for a tile key, or null
function getOutpost(key) {
  return (G.outposts || []).find(o => o.key === key) || null;
}

// Can a tile have an outpost established?
function canEstablishOutpost(key) {
  if (!G.techs.outpost_network) return false;
  initMapIfNeeded();
  const tile = G.map && G.map.tiles && G.map.tiles[key];
  if (!tile || !tile.revealed) return false;
  if (tile.type === 'colony' || tile.type === 'hazard' || tile.type === 'plains') return false;
  const rivalBase = getRivalBaseSite(key);
  if (rivalBase && rivalBase.status === 'hostile') return false;
  if (!OUTPOST_DEFS[tile.type]) return false;
  if (getOutpost(key)) return false;
  return true;
}

function outpostCost(tileType) {
  return (OUTPOST_DEFS[tileType] || {}).cost || {};
}

function outpostCostForTile(key, mode = 'establish') {
  const tile = getMapTileByKey(key);
  if (!tile) return {};
  const base = getRivalBaseSite(key);
  const mult = base && base.status === 'captured' ? (mode === 'reclaim' ? 0.4 : 0.7) : (mode === 'reclaim' ? 0.5 : 1);
  const scaled = {};
  for (const [r, a] of Object.entries(outpostCost(tile.type))) scaled[r] = Math.max(1, Math.ceil(a * mult));
  return scaled;
}

function establishOutpost(key) {
  if (!canEstablishOutpost(key)) { toast('Cannot establish outpost here', 'warn'); return; }
  if (idle() <= 0) { toast('No idle bugs to garrison the outpost', 'warn'); return; }
  initMapIfNeeded();
  const tile = G.map.tiles[key];
  const def = OUTPOST_DEFS[tile.type];
  const base = getRivalBaseSite(key);
  const cost = outpostCostForTile(key, 'establish');
  if (!canAfford(cost)) { toast('Not enough resources to establish outpost', 'warn'); return; }
  for (const [r, a] of Object.entries(cost)) G.res[r] = Math.max(0, (G.res[r] || 0) - a);
  if (!G.outposts) G.outposts = [];
  const op = {
    key,
    type: tile.type,
    name: base && base.status === 'captured' ? `${rivalBaseLabel(base)} Forward Nest` : def.label,
    status: 'active',         // 'active' | 'contested' | 'dormant'
    contest_ticks: 0,         // countdown before outpost falls if undefended
    contest_power: 0,         // power of the current attacker
    rival_id: base && base.status === 'captured' ? base.rival_id : null,
    rival_name: base && base.status === 'captured' ? (getRivalById(base.rival_id) ? rivalFullName(getRivalById(base.rival_id)) : '') : '',
    rival_base: !!(base && base.status === 'captured'),
    rival_base_id: base && base.status === 'captured' ? base.id : null,
    total_produced: 0,        // lifetime resource units produced
  };
  G.outposts.push(op);
  G.stats.outposts_built = (G.stats.outposts_built || 0) + 1;
  log(`Outpost established: ${op.name} at ${key}.`);
  toast(`${op.name} garrisoned!`);
  renderTab();
}

function abandonOutpost(key) {
  if (!G.outposts) return;
  const idx = G.outposts.findIndex(o => o.key === key);
  if (idx < 0) return;
  const op = G.outposts[idx];
  G.outposts.splice(idx, 1);
  log(`Outpost at ${op.name} abandoned. The garrison returns to the colony.`);
  toast(`Outpost abandoned`);
  renderTab();
}

// Resolve a contest: send idle fighters to defend, or accept the loss
function defendOutpost(key) {
  const op = getOutpost(key);
  if (!op || op.status !== 'contested') { toast('No contested outpost here', 'warn'); return; }
  const idleFighters = (G.fighters || []).filter(f => f.status === 'idle');
  if (!idleFighters.length) { toast('No idle fighters available to defend', 'warn'); return; }
  const squad = idleFighters.slice(0, Math.min(3, idleFighters.length));
  const totalPower = squad.reduce((s, f) => s + fighterPower(f), 0);
  const roll = 0.7 + Math.random() * 0.6;
  const effectivePower = totalPower * roll;
  const fortBonus = colonyProjectBonus('fortified');
  const defenceThreshold = fortBonus > 0 ? 0.7 * (1 - fortBonus * 0.5) : 0.7; // easier to win with fortification
  const outcome = effectivePower >= op.contest_power * defenceThreshold ? 'win' : 'loss';

  const xpGain = outcome === 'win' ? 12 : 4;
  squad.forEach(f => {
    f.xp = (f.xp || 0) + xpGain;
    const dmg = outcome === 'win'
      ? Math.ceil(op.contest_power * 0.06 + Math.random() * 2)
      : Math.ceil(op.contest_power * 0.30 + Math.random() * 3);
    f.hp = Math.max(1, f.hp - dmg);
    while (f.xp >= f.xp_next) {
      f.xp -= f.xp_next; f.level++;
      f.max_hp = fighterMaxHp(f.level); f.xp_next = fighterXpNext(f.level);
      log(`⭐ ${f.name} reached Level ${f.level}!`); toast(`${f.name} is now Level ${f.level}!`);
    }
    if (f.hp < f.max_hp * 0.6) { f.status = 'recovering'; f.recover_ticks = Math.ceil((f.max_hp - f.hp) * 10); }
  });
  G.stats.scouts = (G.stats.scouts || 0) + 1;

  if (outcome === 'win') {
    const attackerName = op.rival_name || 'the attackers';
    if (op.rival_id) noteRivalOutcome(op.rival_id, 'repelled');
    op.status = 'active';
    op.contest_ticks = 0;
    op.contest_power = 0;
    op.rival_id = null;
    op.rival_name = '';
    log(`Defence successful! ${op.name} held against ${attackerName} by the garrison.`);
    toast(`${op.name} defended!`);
  } else {
    if (op.rival_id) noteRivalOutcome(op.rival_id, 'victories');
    const idx = G.outposts.findIndex(o => o.key === key);
    if (idx >= 0) G.outposts.splice(idx, 1);
    log(`${op.name} was overrun by ${op.rival_name || 'the attackers'}. The garrison retreats.`, 'bad');
    toast(`${op.name} lost!`, 'bad');
  }
  renderTab();
}

// Call from tick: passive production + contest roll
const OUTPOST_CONTEST_TICKS = 150;  // ~30s to respond before outpost goes dormant
const OUTPOST_CONTEST_CHANCE = 0.00012; // per tick per outpost while active

function tickOutposts(dt) {
  if (!G.outposts || !G.outposts.length) return;
  for (let i = G.outposts.length - 1; i >= 0; i--) {
    const op = G.outposts[i];
    const def = OUTPOST_DEFS[op.type];
    if (!def) continue;

    if (op.status === 'active') {
      const bundle = outpostRateBundle(op.type, G, op);
      const dangerScore = bundle.identity ? bundle.identity.danger_score : 2;
      const seasonContestMult = bundle.seasonEffect && bundle.seasonEffect.contest_mult ? bundle.seasonEffect.contest_mult : 1;
      // Passive production
      for (const [res, rate] of Object.entries(bundle.prod)) {
        if (G.res[res] === undefined) continue;
        const gained = Math.min(rate * dt, maxRes(res) - (G.res[res] || 0));
        if (gained > 0) { G.res[res] += gained; G.vis[res] = true; op.total_produced = (op.total_produced || 0) + gained; }
      }
      // Random contest trigger
      const dangerContestMult = 0.82 + dangerScore * 0.08;
      const contestHeat = op.rival_base ? 1.08 : 1;
      if (Math.random() < OUTPOST_CONTEST_CHANCE * dt * 200 * dangerContestMult * seasonContestMult * contestHeat) {
        const rival = pickConflictRival(G, { kind:'outpost', target: op.type, preferRevenge:true });
        op.status = 'contested';
        op.contest_ticks = OUTPOST_CONTEST_TICKS;
        op.contest_power = def.power * (op.rival_base ? 1.12 : 1) * dangerContestMult * seasonContestMult * (0.8 + Math.random() * 0.8) * (rival ? rival.threat : 1);
        op.rival_id = rival ? rival.id : null;
        op.rival_name = rivalFullName(rival);
        const seasonalTail = bundle.seasonEffect ? ` ${bundle.seasonEffect.label} is making the border restless.` : '';
        const taunt = rival ? ` ${rivalTaunt(rival, 'outpost')}` : '';
        log(`⚠ ${op.rival_name || 'Unknown raiders'} are harassing ${op.name}!${seasonalTail} Send fighters or lose the outpost.${taunt}`, 'bad');
        toast(`${op.name} contested!`, 'bad');
        if (!hasSeenPopup('rival_colonies')) showFeatureAnnounce('rival_colonies');
      }
    } else if (op.status === 'contested') {
      op.contest_ticks = (op.contest_ticks || 0) - 1;
      if (op.contest_ticks <= 0) {
        // No defence sent in time — outpost goes dormant (captured, not destroyed)
        const attackerName = op.rival_name || 'attackers';
        op.status = 'dormant';
        op.contest_power = 0;
        if (op.rival_id) noteRivalOutcome(op.rival_id, 'victories');
        log(`${op.name} fell to ${attackerName}. The outpost is dormant — abandon or reclaim it. ${outpostClaimLine(op)}`, 'bad');
        toast(`${op.name} overrun — now dormant`, 'bad');
      }
    } else if (op.status === 'dormant') {
      // Dormant outposts sit there until player abandons or "reclaims" (re-establish)
    }
  }
}

// Reclaim a dormant outpost: spend half cost, restores to active
function reclaimOutpost(key) {
  const op = getOutpost(key);
  if (!op || op.status !== 'dormant') { toast('Outpost is not dormant', 'warn'); return; }
  if (idle() <= 0) { toast('No idle bugs to send as garrison', 'warn'); return; }
  const def = OUTPOST_DEFS[op.type];
  const halfCost = outpostCostForTile(key, 'reclaim');
  if (!canAfford(halfCost)) { toast('Not enough resources to reclaim outpost', 'warn'); return; }
  for (const [r, a] of Object.entries(halfCost)) G.res[r] = Math.max(0, (G.res[r] || 0) - a);
  op.status = 'active';
  op.contest_ticks = 0;
  op.contest_power = 0;
  op.rival_id = null;
  op.rival_name = '';
  log(`${op.name} reclaimed. Garrison redeployed.`);
  toast(`${op.name} reclaimed!`);
  renderTab();
}

function outpostProductionSummary() {
  const totals = {};
  for (const op of (G.outposts || [])) {
    if (op.status !== 'active') continue;
    const bundle = outpostRateBundle(op.type, G, op);
    for (const [res, rate] of Object.entries(bundle.prod)) {
      totals[res] = (totals[res] || 0) + rate;
    }
  }
  return totals;
}

function outpostPanelHTML() {
  if (!G.techs.outpost_network) return '';
  const ops = G.outposts || [];
  const activeCount = ops.filter(o => o.status === 'active').length;
  const contestedCount = ops.filter(o => o.status === 'contested').length;
  const prod = outpostProductionSummary();
  const prodStr = Object.entries(prod).map(([r, v]) => `${RES[r].icon}+${(v * 5).toFixed(3)}/s`).join(' ');

  let html = `<div class="outpost-panel">`;
  html += `<div class="outpost-panel-title">OUTPOSTS · ${activeCount} active${contestedCount > 0 ? ` · <span style="color:var(--red)">${contestedCount} CONTESTED</span>` : ''}</div>`;
  if (prodStr) html += `<div style="font-family:var(--mono);font-size:9px;color:var(--accent);margin-bottom:8px;">${prodStr}</div>`;

  if (!ops.length) {
    html += `<div style="font-size:10px;color:var(--text-lo);margin-bottom:8px;">No outposts established. On the Map tab, tap a revealed tile to establish one — it will passively produce resources while a bug is garrisoned there. Captured rival nests can be refit into stronger forward nests. Contested outposts need fighters to defend.</div>`;
  } else {
    for (const op of ops) {
      const def = OUTPOST_DEFS[op.type];
      if (!def) continue;
      const bundle = outpostRateBundle(op.type, G, op);
      const prodLine = Object.entries(bundle.prod).map(([r, v]) => `${RES[r].icon}+${(v * 5).toFixed(3)}/s`).join(' ');
      const isContested = op.status === 'contested';
      const isDormant = op.status === 'dormant';
      const timeLeft = isContested ? Math.ceil((op.contest_ticks || 0) * (TICK_MS / 1000)) : 0;
      const identity = bundle.identity;
      html += `<div class="outpost-card ${isContested ? 'contested' : isDormant ? 'dormant' : ''}">
        <div class="outpost-ico" style="color:${def.color}">${def.icon}</div>
        <div class="outpost-info">
          <div class="outpost-name">${op.name}${op.rival_base ? '<span class="boss-badge cleared" style="margin-left:6px;">FORWARD NEST</span>' : ''}</div>
          <div class="outpost-prod">${isDormant ? '<span style="color:var(--text-lo)">Dormant — not producing</span>' : prodLine}</div>
          <div class="outpost-status ${isContested ? 'contested' : isDormant ? 'dormant' : 'active'}">
            ${isContested ? `⚠ UNDER ATTACK` : isDormant ? '⊘ OVERRUN' : '◉ ACTIVE'}
          </div>

          <button class="outpost-abandon-btn" onclick="abandonOutpost('${op.key}')">ABANDON</button>

    }
  }
  html += `<div style="font-size:9px;color:var(--text-lo);margin-top:4px;">Each active outpost ties up 1 idle bug as garrison. Captured forward nests also act as staging posts for nearby expeditions.</div>`;
  html += `</div>`;
  return html;
}

/* ── WORKER XP SYSTEM ───────────────────────── */
// Each job accumulates XP ticks while bugs are assigned.
// Rank 0-4 stars based on ticks. Each star = +5% production for that job.
const WORKER_XP_RANKS = [0, 400, 1200, 3000, 7000]; // ticks to reach star 1-4

function workerXp(jid) {
  return (G.worker_xp || {})[jid] || 0;
}

function workerStar(jid) {
  const xp = workerXp(jid);
  let star = 0;
  for (const thresh of WORKER_XP_RANKS) { if (xp >= thresh) star++; }
  return Math.min(4, star);
}

function workerXpBonus(jid) {
  return workerStar(jid) * 0.05; // +5% per star
}

function workerStarLabel(star) {
  if (star === 0) return '';
  return '★'.repeat(star) + '☆'.repeat(4 - star);
}

function workerXpNextThresh(jid) {
  const xp = workerXp(jid);
  const star = workerStar(jid);
  return star < 4 ? WORKER_XP_RANKS[star] : null;
}

function tickWorkerXp(dt) {
  if (!G.worker_xp) G.worker_xp = {};
  const xpMult = 1 + colonyProjectBonus('xp_boost');
  for (const [jid, count] of Object.entries(G.jobs)) {
    if (!count || count <= 0) continue;
    const prev = workerStar(jid);
    G.worker_xp[jid] = (G.worker_xp[jid] || 0) + count * dt * 5 * xpMult;
    const now = workerStar(jid);
    if (now > prev) {
      const jname = JOBS[jid] ? JOBS[jid].name : jid;
      log(`★ ${jname}s reached ${now}-star seasoning! +${now * 5}% production.`);
      toast(`${jname}s: ${workerStarLabel(now)}`, '');
      if (now === 1) showFeatureAnnounce('worker_xp');
    }
  }
}

function availableColonyProjects() {
  const completed = (G.stats.completed_cp || []);
  return COLONY_PROJECTS.filter(p =>
    (!p.unlock_req || G.techs[p.unlock_req]) &&
    !completed.includes(p.id) &&
    (!G.colony_project || G.colony_project.id !== p.id)
  );
}

function startColonyProject(id) {
  if (G.colony_project && !G.colony_project.done) { toast('A project is already underway', 'warn'); return; }
  const def = COLONY_PROJECTS.find(p => p.id === id);
  if (!def) return;
  if (!canAfford(def.build_cost)) { toast('Not enough resources', 'warn'); return; }
  for (const [r, a] of Object.entries(def.build_cost)) G.res[r] = Math.max(0, (G.res[r] || 0) - a);
  G.colony_project = {
    id: def.id,
    progress: 0,         // 0-100
    days_spent: 0,
    done: false,
    reward_applied: false,
  };
  log(`Colony project started: ${def.name}.`);
  toast(`Project: ${def.name} underway`);
  showFeatureAnnounce('colony_project');
  renderAll();
}

function contributeToProject(amount) {
  const cp = G.colony_project;
  if (!cp || cp.done) return;
  const def = COLONY_PROJECTS.find(p => p.id === cp.id);
  if (!def) return;
  // Spend Honeydew as the contribution resource (20 HD = ~3% progress)
  const hdCost = amount;
  if ((G.res.honeydew || 0) < hdCost) { toast('Not enough Honeydew', 'warn'); return; }
  G.res.honeydew -= hdCost;
  const gain = (hdCost / (def.duration_days * 8)) * 100; // scale: full season of ~8 HD/day = 100%
  cp.progress = Math.min(100, cp.progress + gain);
  renderTab();
}

function tickColonyProject(dt) {
  const cp = G.colony_project;
  if (!cp || cp.done) return;
  const def = COLONY_PROJECTS.find(p => p.id === cp.id);
  if (!def) return;
  // Auto-advance: employed bugs contribute a trickle
  const autoRate = (employed() * 0.003 * dt); // 0.003% per bug per second
  cp.progress = Math.min(100, cp.progress + autoRate);
  if (cp.progress >= 100 && !cp.done) {
    cp.done = true;
    applyColonyProjectReward(cp.id);
  }
}

function applyColonyProjectReward(id) {
  const def = COLONY_PROJECTS.find(p => p.id === id);
  if (!def) return;
  if (!G.stats.completed_cp) G.stats.completed_cp = [];
  if (!G.stats.completed_cp.includes(id)) G.stats.completed_cp.push(id);
  log(`Colony project complete: ${def.name}. Reward: ${def.reward_desc}`);
  toast(`${def.name} complete!`);
  // Rewards are read dynamically by effect functions below (see colonyProjectBonus functions)
}

function colonyProjectBonus(type) {
  const completed = (G.stats.completed_cp || []);
  let total = 0;
  for (const id of completed) {
    const def = COLONY_PROJECTS.find(p => p.id === id);
    if (def && def.reward && def.reward.type === type) total += def.reward.value;
  }
  // Also count active in-progress project if done
  const cp = G.colony_project;
  if (cp && cp.done) {
    const def2 = COLONY_PROJECTS.find(p => p.id === cp.id);
    if (def2 && def2.reward && def2.reward.type === type && !completed.includes(cp.id)) total += def2.reward.value;
  }
  return total;
}

function tickMapEvents(dt) {
  if (!G.map_events) G.map_events = [];
  if (!Number.isFinite(G.map_event_cooldown)) G.map_event_cooldown = 0;
  if (G.map_event_cooldown > 0) G.map_event_cooldown--;
  // Tick down existing events
  for (let i = G.map_events.length - 1; i >= 0; i--) {
    G.map_events[i].ticks_left -= 1;
    if (G.map_events[i].ticks_left <= 0) {
      const ev = G.map_events[i];
      log(`Map event expired: ${ev.name} at (${ev.key}).`);
      G.map_events.splice(i, 1);
    }
  }
  // Spawn new events randomly on revealed non-hazard tiles
  initMapIfNeeded();
  const tiles = G.map && G.map.tiles;
  if (!tiles) return;
  const skywatchBonus = colonyProjectBonus('skywatch') > 0;
  const revealedCount = mapRevealedCount();
  const frontierFactor = Math.max(0.55, Math.min(1.1, revealedCount / 22));
  const spawnChance = (skywatchBonus ? 0.00005 : 0.00003) * dt * 200 * frontierFactor;
  const maxEvents = skywatchBonus ? 3 : 2;
  if (revealedCount < 10) return;
  if (G.map_events.length >= maxEvents) return;
  if (G.map_event_cooldown > 0) return;
  if (Math.random() > spawnChance) return;

  const eligibleKeys = Object.keys(tiles).filter(k => {
    const t = tiles[k];
    const landmark = getMapLandmark(k);
    return t.revealed && t.type !== 'colony' && t.type !== 'hazard' && t.type !== 'plains' &&
      !G.map_events.some(ev => ev.key === k) &&
      !(landmark && !landmark.resolved) &&
      !getRivalBaseSite(k);
  });
  if (!eligibleKeys.length) return;
  const key = eligibleKeys[Math.floor(Math.random() * eligibleKeys.length)];
  const tile = tiles[key];
  const pool = MAP_EVENT_TYPES.filter(e => {
    if (e.id === 'resource_bloom') return MAP_TILE_DEFS[tile.type] && MAP_TILE_DEFS[tile.type].loot;
    return true;
  });
  const evType = pool[Math.floor(Math.random() * pool.length)];
  const rewardData = evType.reward_fn(tile.type);
  const skywatchDur = skywatchBonus ? 1.4 : 1;
  G.map_events.push({
    key,
    id: evType.id,
    name: evType.name,
    icon: evType.icon,
    color: evType.color,
    desc: evType.desc,
    action_label: evType.action_label,
    ticks_left: Math.ceil(evType.duration * skywatchDur),
    max_ticks: Math.ceil(evType.duration * skywatchDur),
    reward: rewardData,
  });
  G.map_event_cooldown = skywatchBonus ? 160 : 210;
  log(`Map event: ${evType.name} at tile (${key}).`, 'ev');
  toast(`${evType.icon} ${evType.name} on the map!`);
  showFeatureAnnounce('map_event');
}

function claimMapEvent(key) {
  if (!G.map_events) return;
  const idx = G.map_events.findIndex(ev => ev.key === key);
  if (idx < 0) { toast('No event here', 'warn'); return; }
  if (!hasHatchedBug()) { toast(mapBugRequirementText(), 'warn'); return; }
  const ev = G.map_events[idx];
  // Pay cost if any
  if (ev.reward && ev.reward.cost && Object.keys(ev.reward.cost).length) {
    if (!canAfford(ev.reward.cost)) { toast('Cannot afford this trade', 'warn'); return; }
    for (const [r, a] of Object.entries(ev.reward.cost)) G.res[r] = Math.max(0, (G.res[r] || 0) - a);
  }
  // Collect gain
  const gained = [];
  if (ev.reward && ev.reward.gain) {
    for (const [r, a] of Object.entries(ev.reward.gain)) {
      if (G.res[r] === undefined) continue;
      const added = Math.min(a, maxRes(r) - (G.res[r] || 0));
      if (added > 0) { G.res[r] += added; G.vis[r] = true; gained.push(`${RES[r].icon}+${added}`); }
    }
  }
  G.map_events.splice(idx, 1);
  const lootStr = gained.join(' ');
  log(`Map event collected: ${ev.name}${lootStr ? ' — ' + lootStr : ''}`);
  toast(`${ev.name}: ${lootStr || 'done'}`);
  // Re-render map content if on map tab
  const mapContent = document.getElementById('map-content');
  if (mapContent) mapContent.innerHTML = tabMapContent();
  renderNavBadges();
}

function generateChallenge(season, year) {
  const templates = CHALLENGE_TEMPLATES[season];
  if (!templates || !templates.length) return null;

  // Filter to challenges the player can actually attempt
  const viable = templates.filter(t => {
    if (t.stat === 'traded_season' && !G.techs.trade_routes) return false;
    if (t.stat === 'crafted_season' && G.stats.crafted === 0 && !G.techs.weaving && !G.techs.chitin_harvesting) return false;
    if (t.stat === 'insight_season' && !G.techs.natural_philosophy) return false;
    if (t.stat === 'exp_season' && G.pop.total < 1) return false;
    if (t.stat === 'scholar_target' && !G.techs.natural_philosophy) return false;
    if (t.stat === 'researched_season' && !G.techs.natural_philosophy) return false;
    return true;
  });
  if (!viable.length) return null;

  const template = viable[Math.floor(Math.random() * viable.length)];
  const difficulty = Math.max(0, year - 1);
  const target = Math.max(1, Math.round(template.base + template.scale * difficulty));

  // Scale rewards with difficulty
  const rewardMult = 1 + difficulty * 0.15;
  const scaledReward = {};
  for (const [k, v] of Object.entries(template.reward)) {
    scaledReward[k] = typeof v === 'number' ? Math.round(v * rewardMult) : v;
  }

  return {
    id: template.id,
    season,
    year,
    desc: template.desc.replace('{n}', target),
    stat: template.stat,
    target,
    current: 0,
    done: false,
    claimed: false,
    reward_type: template.reward_type,
    reward: scaledReward,
    // Tracking snapshots (set at challenge start)
    snap_built: G.stats.built || 0,
    snap_crafted: G.stats.crafted || 0,
    snap_traded: G.stats.traded || 0,
    snap_researched: G.stats.researched || 0,
    snap_hd: G.stats.total_hd || 0,
    snap_exp: G.stats.expeditions || 0,
    snap_pop: G.pop.total || 0,
    snap_insight: G.res.insight || 0,
    snap_produced: totalResourceStock(),
    snap_starvation_deaths: G.stats.starvation_deaths || 0,
    failed_survive: false,
  };
}

function challengeProgress(ch) {
  if (!ch) return { cur: 0, target: 1, pct: 0 };
  let cur = 0;
  switch (ch.stat) {
    case 'pop_gained':
      cur = Math.max(0, G.pop.total - ch.snap_pop);
      break;
    case 'pop_target':
      cur = G.pop.total;
      break;
    case 'built_season':
      cur = (G.stats.built || 0) - ch.snap_built;
      break;
    case 'hd_season':
      cur = Math.floor((G.stats.total_hd || 0) - ch.snap_hd);
      break;
    case 'crafted_season':
      cur = (G.stats.crafted || 0) - ch.snap_crafted;
      break;
    case 'researched_season':
      cur = (G.stats.researched || 0) - ch.snap_researched;
      break;
    case 'produced_season':
      cur = Math.floor(totalResourceStock() - ch.snap_produced);
      if (cur < 0) cur = 0;
      break;
    case 'employed_target':
      cur = employed();
      break;
    case 'forager_target':
      cur = G.jobs.forager || 0;
      break;
    case 'scholar_target':
      cur = G.jobs.scholar || 0;
      break;
    case 'insight_season':
      cur = Math.floor(Math.max(0, (G.res.insight || 0) - ch.snap_insight + (ch._insight_spent || 0)));
      break;
    case 'stock_target':
    case 'stock_end':
      cur = Math.floor(totalResourceStock());
      break;
    case 'leaves_target':
      cur = Math.floor(G.res.leaves || 0);
      break;
    case 'traded_season':
      cur = (G.stats.traded || 0) - ch.snap_traded;
      break;
    case 'exp_season':
      cur = (G.stats.expeditions || 0) - ch.snap_exp;
      break;
    case 'hd_floor':
      cur = ch.failed_survive ? 0 : ch.target;
      break;
    case 'no_starvation':
      cur = ch.failed_survive ? 0 : 1;
      break;
    case 'bldgs_target':
      cur = Object.values(G.bldgs).reduce((s, v) => s + v, 0);
      break;
    default:
      cur = 0;
  }
  const pct = Math.min(100, Math.round((cur / Math.max(1, ch.target)) * 100));
  return { cur, target: ch.target, pct };
}

function checkChallenge() {
  if (!G.challenge || G.challenge.done) return;
  const ch = G.challenge;

  // Check survival-type challenges for failure
  if (ch.stat === 'hd_floor' && (G.res.honeydew || 0) < ch.target) {
    ch.failed_survive = true;
  }
  if (ch.stat === 'no_starvation' && (G.stats.starvation_deaths || 0) > (ch.snap_starvation_deaths || 0)) {
    ch.failed_survive = true;
  }

  const prog = challengeProgress(ch);
  ch.current = prog.cur;
  if (prog.cur >= ch.target && !ch.failed_survive) {
    ch.done = true;
  }
}

function claimChallengeReward() {
  if (!G.challenge || !G.challenge.done || G.challenge.claimed) return;
  const ch = G.challenge;
  ch.claimed = true;
  G.stats.challenges = (G.stats.challenges || 0) + 1;
  // Juice: challenge complete burst
  juiceFlash('rgba(255,197,98,1)', 0.09);
  juiceMilestoneBurst(window.innerWidth / 2, window.innerHeight * 0.6, 'var(--amber)');
  spawnGatherPop('🏆 Challenge complete!', 'amber', document.getElementById('content'));

  if (ch.reward_type === 'res') {
    const gained = [];
    for (const [res, amt] of Object.entries(ch.reward)) {
      if (G.res[res] === undefined) continue;
      const added = Math.min(amt, maxRes(res) - (G.res[res] || 0));
      if (added > 0) {
        G.res[res] += added;
        G.vis[res] = true;
        gained.push(`${RES[res].icon}+${added}`);
      }
    }
    log(`Season challenge complete! ${gained.join(' ')}`);
    toast(`Challenge reward: ${gained.join(' ')}`);
  } else if (ch.reward_type === 'boost') {
    if (ch.reward.hd_boost) {
      G.events.active = 'hd_boost';
      G.events.ticks_left = ch.reward.hd_boost;
      log('Season challenge complete! Honeydew production boosted.');
      toast('Challenge reward: production boost!');
    }
    if (ch.reward.prod_boost) {
      G.events.active = 'hd_boost';
      G.events.ticks_left = ch.reward.prod_boost;
      log('Season challenge complete! Production boosted.');
      toast('Challenge reward: production boost!');
    }
    if (ch.reward.storage_boost) {
      // Grant a cache of mixed resources instead
      const bonus = [['leaves', 30], ['dirt', 25], ['honeydew', 40]];
      const gained = [];
      for (const [res, amt] of bonus) {
        const added = Math.min(amt, maxRes(res) - (G.res[res] || 0));
        if (added > 0) {
          G.res[res] += added;
          gained.push(`${RES[res].icon}+${added}`);
        }
      }
      log(`Season challenge complete! Stockpile bonus: ${gained.join(' ')}`);
      toast(`Challenge reward: ${gained.join(' ')}`);
    }
  }
  renderTab();
}

function onSeasonChange(newSeason) {
  // Show the season announcement popup
  showSeasonAnnounce(newSeason);
  if (G.techs.trade_routes) refreshTradeNetwork(G, 'season', true);
  // Auto-generate a new challenge for the new season
  if (G.pop.total >= 1 || G.stats.built > 0) {
    G.challenge = generateChallenge(newSeason, G.time.year);
    if (G.challenge) {
      log(`Season challenge: ${G.challenge.desc}`);
      toast(`New challenge: ${G.challenge.desc}`);
    }
  }
}

function seasonChallengePanel() {
  const ch = G.challenge;
  if (!ch) {
    // No challenge yet - show hint if player has started
    if (G.pop.total < 1 && G.stats.built === 0) return '';
    return '';
  }

  // Don't show challenges from a past season (missed it)
  const currentSeason = seasonName();
  if (ch.season !== currentSeason && !ch.done) {
    return '';
  }

  const prog = challengeProgress(ch);
  const seasonCls = ch.done ? 'done' : ch.season.toLowerCase();
  const daysLeft = DAYS_PER_SEASON - G.time.day;
  const seasonIcon = { Spring:'🌱', Summer:'☀', Autumn:'🍂', Winter:'❄' }[ch.season] || '◈';

  let statusText;
  if (ch.claimed) statusText = 'CLAIMED';
  else if (ch.done) statusText = 'COMPLETE';
  else if (ch.failed_survive) statusText = 'FAILED';
  else statusText = `${prog.pct}%`;

  let rewardText;
  if (ch.reward_type === 'res') {
    rewardText = Object.entries(ch.reward)
      .filter(([r]) => RES[r])
      .map(([r, a]) => `${RES[r].icon} ${a} ${RES[r].name}`)
      .join(', ');
  } else {
    rewardText = 'Production boost';
  }

  return `<div class="sc-panel ${seasonCls}">
    <div class="sc-head">
      <div class="sc-title">${seasonIcon} ${ch.season.toUpperCase()} CHALLENGE</div>
      <div class="sc-status">${statusText}</div>
    </div>
    <div class="sc-desc">${ch.desc}</div>
    <div class="sc-reward-line">${ch.done ? (ch.claimed ? 'Reward claimed' : 'Reward') : 'Reward'}: ${rewardText}</div>
    <div class="sc-progress"><div class="sc-progress-fill" style="width:${ch.failed_survive && !ch.done ? 0 : prog.pct}%"></div></div>
    <div class="sc-days">
      <span>${ch.done ? (ch.claimed ? '✓ Done' : '✓ Ready to claim') : ch.failed_survive ? '✗ Failed' : `${prog.cur}/${prog.target}`}</span>
      <span>${ch.done || ch.failed_survive ? '' : `${daysLeft}d left`}</span>
    </div>
    ${ch.done && !ch.claimed ? `<button class="exp-collect-btn" style="margin-top:6px;" onclick="claimChallengeReward()">CLAIM REWARD</button>` : ''}
  </div>`;
}

function achievementDone(id) {
  switch (id) {
    case 'first_home': return (G.bldgs.nest || 0) >= 1;
    case 'first_bug': return G.pop.total >= 1;
    case 'working_colony': return employed() >= 3;
    case 'scholar_circle': return !!G.techs.natural_philosophy;
    case 'trader': return !!G.techs.trade_routes;
    case 'winged': return (G.res.elytra || 0) >= 10 || (G.bldgs.flight_tower || 0) >= 1;
    case 'explorer': return (G.stats.expeditions || 0) >= 5;
    case 'seasonal_champ': return (G.stats.challenges || 0) >= 4;
    case 'skybound': return !!G.techs.sky_colonies;
    case 'ascended': return (G.meta.launches || 0) >= 1;
    case 'empire': return G.pop.total >= 50;
    case 'sovereign_brood': return !!G.projects && !!G.projects.sovereign_brood;
    case 'amber_citadel': return !!G.projects && !!G.projects.amber_citadel;
    case 'astral_ark': return !!G.projects && !!G.projects.astral_ark;
    case 'first_blood': return (G.stats.scouts || 0) >= 1;
    case 'seasoned': return (G.fighters || []).some(f => f.level >= 5) || (G.stats.scouts || 0) >= 10;
    case 'elite': return (G.fighters || []).some(f => f.level >= 10);
    case 'jelly_hoard': return (G.res.royal_jelly || 0) >= 20;
    case 'apex_cleared': return !!(G.stats.apex_cleared);
    case 'full_roster': return fightersTotal() > 0 && fightersTotal() >= maxFighters() && maxFighters() > 0;
    case 'scout_veteran': return (G.stats.scouts || 0) >= 25;
    case 'stage_runner': return (G.stats.boss_stages || 0) >= 1;
    case 'tyrant_slayer': return !!(G.stats.tyrant_cleared);
    default: return false;
  }
}

function checkAchievements() {
  let gained = 0;
  for (const a of ACHIEVEMENTS) {
    if (G.achievements[a.id]) continue;
    if (!achievementDone(a.id)) continue;
    G.achievements[a.id] = true;

    spawnGatherPop('★ ' + a.name, '', document.getElementById('bot-nav') || document.body);

  return gained;
}

function achievedCount() {

function unseenAchievementCount() {

/* ── FIGHTER SYSTEM ──────────────────────────── */

let _fighterNameIdx = 0;
function nextFighterName() {
  const used = new Set((G.fighters || []).map(f => f.name));
  for (let i = 0; i < FIGHTER_NAMES.length; i++) {
    const name = FIGHTER_NAMES[(_fighterNameIdx + i) % FIGHTER_NAMES.length];
    if (!used.has(name)) {
      _fighterNameIdx = (_fighterNameIdx + i + 1) % FIGHTER_NAMES.length;
      return name;
    }
  }
  return 'Scout ' + ((G.fighters || []).length + 1);
}

function fighterMaxHp(level) {
  return 10 + (level - 1) * 5;
}

function fighterEffectiveMaxHp(f) {
  const base = fighterMaxHp(f.level);
  let val = base;
  if (f.trait === 'ironhide') val = Math.floor(val * 1.35);
  const scar = f.scar ? BATTLE_SCARS[f.scar] : null;
  if (scar && scar.hp_mult) val = Math.floor(val * scar.hp_mult);
  return Math.max(5, val);
}

function fighterPower(f) {
  let p = 3 + f.level * 2;
  if (f.trait === 'venomous') p += 3;
  const scar = f.scar ? BATTLE_SCARS[f.scar] : null;
  if (scar && scar.power_mod) p += scar.power_mod;
  return Math.max(1, Math.round(p * broodScoutMult() * rareScoutMult()));
}

function fighterXpNext(level) {
  return level * 18;
}

function recruitFighter() {
  if (!G.techs.combat_training) { toast('Research Combat Training first', 'warn'); return; }
  if ((G.bldgs.training_burrow || 0) === 0) { toast('Build a Training Burrow first', 'warn'); return; }
  if (fightersTotal() >= maxFighters()) { toast('Training Burrow is full', 'warn'); return; }
  if (idle() <= 0) { toast('No idle bugs to recruit', 'warn'); return; }
  const name = nextFighterName();
  // Apply vanguard_discipline legacy: +1 starting level per rank
  const bonusLevels = legacyRank('vanguard_discipline');
  const level = 1 + bonusLevels;
  const maxHp = fighterMaxHp(level);
  const newFighter = {
    id: 'f_' + Date.now() + '_' + Math.floor(Math.random() * 9999),
    name,
    level,
    xp: 0,
    xp_next: fighterXpNext(level),
    hp: maxHp,
    max_hp: maxHp,
    status: 'idle',
    recover_ticks: 0,
    missions: 0,
    kills: 0,
    hero: false,
    trait: null,
    epithet: null,
  };

  // 20% chance this bug shows exceptional promise and becomes a hero
  if (Math.random() < 0.20) {
    const trait = randomHeroTrait();
    const epithet = heroEpithet();
    newFighter.hero = true;
    newFighter.trait = trait;
    newFighter.epithet = epithet;
    if (trait === 'ironhide') {
      newFighter.max_hp = fighterEffectiveMaxHp(newFighter);
      newFighter.hp = newFighter.max_hp;
    }
    G.fighters.push(newFighter);
    log(`★ ${name} joins the fighters — a rare hero emerges: ${epithet} the ${HERO_TRAITS[trait].name}. ${HERO_TRAITS[trait].desc}`);
    toast(`Hero: ${epithet} the ${HERO_TRAITS[trait].name} ${HERO_TRAITS[trait].icon}`);
  } else {
    G.fighters.push(newFighter);
    log(`${name} joins the fighter ranks${bonusLevels > 0 ? ` at Level ${level} (Vanguard legacy)` : ''}.`);
    toast(`Fighter recruited: ${name}${bonusLevels > 0 ? ` (Lv.${level})` : ''}`);
  }
  renderTab();
}

function retireFighter(fid) {
  const idx = (G.fighters || []).findIndex(f => f.id === fid);
  if (idx < 0) return;
  const f = G.fighters[idx];
  if (f.status === 'scouting' || f.status === 'escorting') { toast('Cannot retire a fighter mid-mission', 'warn'); return; }
  G.fighters.splice(idx, 1);
  log(`${f.name} retires and rejoins the colony.`);
  toast(`${f.name} retired`);
  renderTab();
}

function rushHealFighter(fid) {
  const f = (G.fighters || []).find(f => f.id === fid);
  if (!f || f.status !== 'recovering') { toast('Fighter is not recovering', 'warn'); return; }
  if (!f.max_hp || f.max_hp <= 0) { toast('Fighter has invalid HP state', 'warn'); return; }
  const healPerJelly = 5;
  const jellyCost = Math.max(1, Math.ceil((f.max_hp - f.hp) / healPerJelly) - warProjectRushDiscount());
  if ((G.res.royal_jelly || 0) < jellyCost) {
    toast(`Need ${jellyCost} Royal Jelly to rush heal`, 'warn');
    return;
  }
  G.res.royal_jelly -= jellyCost;
  f.hp = f.max_hp;
  f.status = 'idle';
  f.recover_ticks = 0;
  log(`${f.name} rush-healed with ${jellyCost} Royal Jelly.`);
  toast(`${f.name} fully healed!`);
  renderTab();
}

let _scoutSelection = [];

function toggleFighterSelect(fid) {
  const idx = _scoutSelection.indexOf(fid);
  if (idx >= 0) _scoutSelection.splice(idx, 1);
  else _scoutSelection.push(fid);
  renderTab();
}

function clearScoutSelection() {
  _scoutSelection = [];
}

function canSendScout(zone) {
  if (!G.techs.combat_training) return false;
  if (zone.req && !G.techs[zone.req]) return false;
  if ((G.fighters || []).some(f => f.status === 'scouting' && f.zone === zone.id)) return false;
  return true;
}

function sendScout(zoneId) {
  const zone = getScoutZone(zoneId);
  if (!zone || !canSendScout(zone)) { toast('Cannot scout this zone', 'warn'); return; }
  const zoneLabel = zoneDisplayName(zone);
  const selected = (_scoutSelection || []).filter(fid => {
    const f = (G.fighters || []).find(f => f.id === fid);
    return f && f.status === 'idle';
  });
  if (selected.length < zone.fighters) {
    toast(`Select at least ${zone.fighters} idle fighter${zone.fighters > 1 ? 's' : ''}`, 'warn');
    return;
  }
  const squad = selected.slice(0, Math.max(zone.fighters, selected.length));
  const squadObjs = squad.map(fid => G.fighters.find(f => f.id === fid)).filter(Boolean);
  const tactic = activeScoutTactic();
  const hasSwift = squadObjs.some(f => f.trait === 'swift');
  const cautiousMult = squadObjs.some(f => f.scar === 'cautious') ? BATTLE_SCARS.cautious.duration_mult : 1;
  const effectiveDuration = Math.round((((hasSwift ? zone.duration * 0.75 : zone.duration) * tactic.duration_mult) * cautiousMult));
  squad.forEach(fid => {
    const f = G.fighters.find(f => f.id === fid);
    if (f) {
      f.status = 'scouting';
      f.zone = zoneId;
      f.scout_elapsed = 0;
      f.scout_duration = effectiveDuration;
      f.scout_tactic = tactic.id;
    }
  });
  _scoutSelection = [];
  const linkedExpedition = zone.is_expedition_contact ? getExpeditionByScoutZone(zone.id) : null;
  if (linkedExpedition) {
    linkedExpedition.awaitingScout = false;
    linkedExpedition.scoutInFlight = true;
    linkedExpedition.supportZoneId = zone.id;
  }
  const swiftNote = hasSwift && cautiousMult > 1 ? ' (Swift −25%, Cautious +18%)' : hasSwift ? ' (Swift: 25% faster)' : cautiousMult > 1 ? ' (Cautious: 18% longer)' : '';
  log(`${squad.length} fighter${squad.length > 1 ? 's' : ''} sent to ${zoneLabel} using ${tactic.name}.${swiftNote}`);
  toast(`Scouting ${zoneLabel} · ${tactic.name}${swiftNote}`);
  if (zone.id && zone.id.startsWith('rival_') && !hasSeenPopup('rival_colonies')) showFeatureAnnounce('rival_colonies');
  renderTab();
}

function warProjectState(state = G) {
  if (!state.war_projects || typeof state.war_projects !== 'object') {
    state.war_projects = { vanguard_discipline:false, venom_pharmacy:false, relic_reading:false };
  }
  for (const id of Object.keys(WAR_PROJECTS)) {
    if (typeof state.war_projects[id] !== 'boolean') state.war_projects[id] = !!state.war_projects[id];
  }
  return state.war_projects;
}

function warProjectOwned(id, state = G) {
  return !!warProjectState(state)[id];
}

function warProjectCostMet(id, state = G) {
  const def = WAR_PROJECTS[id];
  if (!def) return false;
  return Object.entries(def.costs).every(([res, amt]) => (state.res?.[res] || 0) >= amt);
}

function warProjectPowerMult(state = G) {
  return warProjectOwned('vanguard_discipline', state) ? 1.08 : 1;
}

function warProjectLootZoneMult(zone, state = G) {
  if (!warProjectOwned('vanguard_discipline', state)) return 1;
  return zone && ['termite','rival','tyrant'].includes(zone.enemy_type) ? 1.10 : 1;
}

function warProjectRecoveryMult(state = G) {
  return warProjectOwned('venom_pharmacy', state) ? 1.25 : 1;
}

function warProjectRushDiscount(state = G) {
  return warProjectOwned('venom_pharmacy', state) ? 1 : 0;
}

function warProjectEncounterMult(state = G) {
  return warProjectOwned('relic_reading', state) ? 1.12 : 1;
}

function applyWarProjectBonusSpoilRoll(zone, squad, outcome, opts = {}, drops = []) {
  if (outcome === 'loss' || !warProjectOwned('relic_reading')) return drops;
  const stageRun = !!opts.stage;
  const qualifies = (zone && zone.enemy_type === 'ancient') || (stageRun && zone && zone.boss);
  if (!qualifies) return drops;
  const profiles = fighterSpoilProfiles(zone);
  if (!profiles.length) return drops;
  const bonus = profiles[Math.floor(Math.random() * profiles.length)];
  if (!bonus) return drops;
  drops.push({ res: bonus.res, amt: 1 });
  return drops;
}

function buildWarProject(id) {
  const def = WAR_PROJECTS[id];
  if (!def) return;
  const state = warProjectState();
  if (state[id]) { toast('Project already complete', 'warn'); return; }
  if (!warProjectCostMet(id)) { toast('Not enough resources', 'warn'); return; }
  for (const [res, amt] of Object.entries(def.costs)) {
    G.res[res] = Math.max(0, (G.res[res] || 0) - amt);
  }
  state[id] = true;
  G.vis.war_marks = G.vis.war_marks || false;
  log(`${def.icon} ${def.name} completed. ${def.effect_copy}`);
  toast(`${def.name} completed`);
  saveGame();
  renderTab();
}

function rollFighterSpoils(zone, squad, outcome, opts = {}) {
  if (!zone || outcome === 'loss') return [];
  const profiles = fighterSpoilProfiles(zone);
  if (!profiles.length) return [];
  const tactic = scoutMissionTactic(squad);
  const hasFortunate = (squad || []).some(f => f.trait === 'fortunate');
  const stageRun = !!opts.stage;
  const partial = outcome === 'partial';
  const zoneTier = Math.max(1, zone.tier || 1);
  const chanceBonus = (stageRun ? 0.08 : 0)
    + (zone.boss ? 0.08 : 0)
    + (hasFortunate ? 0.05 : 0)
    + (tactic.id === 'cache_sweep' ? 0.03 : 0)
    + Math.min(0.10, Math.max(0, zoneTier - 4) * 0.02);
  const drops = [];
  for (const profile of profiles) {
    const chance = Math.min(0.92, Math.max(0.04, profile.chance * (partial ? 0.72 : 1) + chanceBonus));
    if (Math.random() > chance) continue;
    let maxAmt = profile.max + (stageRun ? 1 : 0) + (zone.boss ? 1 : 0) + (zoneTier >= 7 ? 1 : 0);
    let minAmt = profile.min;
    if (partial) maxAmt = Math.max(minAmt, maxAmt - 1);
    const amt = Math.max(1, minAmt + Math.floor(Math.random() * Math.max(1, maxAmt - minAmt + 1)));
    drops.push({ res: profile.res, amt });
  }
  if (!drops.length && outcome === 'win' && (stageRun || zone.boss)) {
    const guaranteed = profiles[0];
    if (guaranteed) drops.push({ res: guaranteed.res, amt: 1 + (stageRun && zoneTier >= 7 ? 1 : 0) });
  }
  applyWarProjectBonusSpoilRoll(zone, squad, outcome, opts, drops);
  return drops;
}

function applyFighterSpoils(drops = []) {
  const gained = [];
  for (const drop of drops) {
    const def = RES[drop.res];
    if (!def) continue;
    const current = G.res[drop.res] || 0;
    const cap = maxRes(drop.res) || 999999;
    const add = Math.min(Math.max(0, Math.floor(drop.amt || 0)), Math.max(0, cap - current));
    if (add <= 0) continue;
    G.res[drop.res] = current + add;
    G.vis[drop.res] = true;
    gained.push(`${def.icon}+${add}`);
  }
  return gained;
}

function rollTerritoryReward(zone) {
  const totalW = zone.rewards.reduce((s, r) => s + r.w, 0);
  let rnd = Math.random() * totalW;
  for (const r of zone.rewards) { rnd -= r.w; if (rnd <= 0) return r; }
  return zone.rewards[zone.rewards.length - 1];
}

function applyScoutEncounterLoot(loot = {}, mult = 1) {
  const gained = [];
  for (const [res, amt] of Object.entries(loot || {})) {
    const def = RES[res];
    if (!def) continue;
    const current = G.res[res] || 0;
    const cap = maxRes(res) || 999999;
    const scaled = Math.max(0, Math.round(Number(amt || 0) * mult));
    const add = Math.min(scaled, Math.max(0, cap - current));
    if (add <= 0) continue;
    G.res[res] = current + add;
    G.vis[res] = true;
    gained.push(`${def.icon}+${add}`);
  }
  return gained;
}

function applyScoutEncounterFatigue(fighterIds = [], fatigueTicks = 0, hpLoss = 0) {
  if ((!fighterIds || !fighterIds.length) && !fatigueTicks && !hpLoss) return [];
  const ids = new Set(fighterIds || []);
  const affected = [];
  for (const f of (G.fighters || [])) {
    if (!ids.has(f.id)) continue;
    if (hpLoss > 0) f.hp = Math.max(1, Math.floor((f.hp || 0) - hpLoss));
    if (fatigueTicks > 0) {
      f.status = 'recovering';
      f.recover_ticks = Math.max(f.recover_ticks || 0, Math.ceil(fatigueTicks));
    } else if (hpLoss > 0 && f.hp < f.max_hp * 0.6) {
      f.status = 'recovering';
      f.recover_ticks = Math.max(f.recover_ticks || 0, Math.ceil((f.max_hp - f.hp) * 10));
    }
    affected.push(f.name);
  }
  return affected;
}

function scoutEncounterChance(zone, outcome, squad) {
  if (outcome === 'loss') return 0;
  const tactic = scoutMissionTactic(squad);
  let chance = outcome === 'win' ? 0.28 : 0.16;
  chance += Math.min(0.06, Math.max(0, (zone.tier || 1) - 2) * 0.01);
  if (zone.boss) chance += 0.08;
  if (zone.id && zone.id.startsWith('rival_')) chance += 0.05;
  if ((squad || []).some(f => f.trait === 'swift' || f.trait === 'fortunate')) chance += 0.02;
  chance += Math.min(0.04, ((broodScoutMult() - 1) + (rareScoutMult() - 1)) * 0.12);
  chance += tactic.encounter_bonus || 0;
  chance *= warProjectEncounterMult();
  return Math.min(0.48, Math.max(0.05, chance));
}

function weightedScoutEncounterPick(items) {
  const total = items.reduce((sum, item) => sum + (item.w || 0), 0);
  let rnd = Math.random() * Math.max(1, total);
  for (const item of items) {
    rnd -= item.w || 0;
    if (rnd <= 0) return item.id;
  }
  return items[items.length - 1]?.id || 'cache';
}

function scoutEncounterContext(zone, squad, outcome, effectivePower) {
  const season = seasonName();
  const powerRatio = effectivePower / Math.max(1, zone.power || 1);
  const soldierEdge = Math.min(0.24,
    Math.max(0, powerRatio - 0.85) * 0.18 +
    ((broodScoutMult() - 1) * 0.28) +
    ((rareScoutMult() - 1) * 0.65) +
    ((squad || []).some(f => f.trait === 'venomous') ? 0.04 : 0) +
    ((squad || []).some(f => f.trait === 'rallying') ? 0.02 : 0)
  );
  const scholarEdge = Math.min(0.22,
    ((broodInsightMult() - 1) * 0.28) +
    ((rareInsightMult() - 1) * 0.65) +
    (season === 'Winter' ? 0.03 : 0) +
    (season === 'Autumn' ? 0.02 : 0)
  );
  const tradeEdge = Math.min(0.22,
    ((broodTradeMult() - 1) * 0.28) +
    ((rareTradeMult() - 1) * 0.65) +
    ((squad || []).some(f => f.trait === 'swift') ? 0.03 : 0) +
    ((squad || []).some(f => f.trait === 'fortunate') ? 0.03 : 0)
  );
  const broodEdge = Math.min(0.22,
    ((broodHatchMult() - 1) * 0.28) +
    ((rareHatchMult() - 1) * 0.65) +
    (season === 'Spring' ? 0.04 : 0)
  );
  return {
    zoneId: zone.id,
    zoneName: zone.name,
    zoneTier: zone.tier || 1,
    season,
    outcome,
    powerRatio,
    fighterIds: (squad || []).map(f => f.id),
    soldierEdge,
    scholarEdge,
    tradeEdge,
    broodEdge,
    housingRoom: Math.max(0, housing() - G.pop.total),
    tradeUnlocked: !!G.techs.trade_routes,
    compoundReady: !!G.techs.advanced_synthesis,
  };
}
