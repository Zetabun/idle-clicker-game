.scout-tactic-chip strong {
  color: var(--text-hi);
  font-weight: 700;
}
.scout-tactic-note {
  margin-top: 7px;
  font-size: 10px;
  line-height: 1.45;
  color: var(--text-lo);
}

/* ── HERO FIGHTER CARD ────────────────────────── */
@keyframes hero-pulse {
  0%   { box-shadow: 0 0 0 1px rgba(255,197,98,0.18), 0 6px 18px rgba(255,197,98,0.08); }
  50%  { box-shadow: 0 0 0 1px rgba(255,197,98,0.38), 0 6px 20px rgba(255,197,98,0.18); }
  100% { box-shadow: 0 0 0 1px rgba(255,197,98,0.18), 0 6px 18px rgba(255,197,98,0.08); }
}
.fighter-card.hero-glow {
  animation: hero-pulse 2.4s ease infinite;
}

/* ── WORKER XP ───────────────────────────────── */
.wi-xp-bar {
  height: 3px;
  background: var(--surface2);
  border-radius: 99px;
  overflow: hidden;
  margin-top: 3px;
  border: 1px solid var(--border);
}
.wi-xp-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--amber-d), var(--amber));
  border-radius: 99px;
  transition: width 0.4s ease;
}
.wi-stars { color: var(--amber); font-size: 9px; letter-spacing: 1px; }

/* ── COLONY PROJECTS ─────────────────────────── */
.cp-panel {
  background: linear-gradient(180deg, rgba(91,59,178,0.10), rgba(16,32,27,0.92));
  border: 1px solid rgba(183,152,255,0.25);
  border-radius: 10px;
  padding: 10px 11px;
  margin-bottom: 10px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.18);
}
.cp-title {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1.4px;
  color: var(--purple);
  margin-bottom: 6px;
}
.cp-name {
  font-weight: 700;
  color: var(--text-hi);
  font-size: 13px;
  margin-bottom: 3px;
}
.cp-desc { font-size: 11px; color: var(--text); line-height: 1.4; margin-bottom: 7px; }
.cp-reward { font-size: 10px; color: var(--amber); margin-bottom: 7px; }
.cp-progress {
  height: 7px;
  background: var(--surface2);
  border-radius: 99px;
  overflow: hidden;
  margin-bottom: 4px;
  border: 1px solid var(--border);
}
.cp-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--purple-d), var(--purple));
  border-radius: 99px;
  transition: width 0.4s ease;
}
.cp-days {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text-lo);
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
}
.cp-contribute-row {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}
.cp-contribute-btn {
  padding: 4px 10px;
  background: rgba(183,152,255,0.10);
  border: 1px solid rgba(183,152,255,0.28);
  color: var(--purple);
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 9px;
  cursor: pointer;
  letter-spacing: 0.5px;
  white-space: nowrap;
  transition: background 0.1s;
}
.cp-contribute-btn:hover { background: rgba(183,152,255,0.18); }
.cp-contribute-btn:disabled { opacity: 0.3; cursor: not-allowed; }


/* ── WAR PROJECTS ───────────────────────────── */
.war-projects-panel {
  background: linear-gradient(180deg, rgba(55,34,14,0.20), rgba(11,17,14,0.94));
  border: 1px solid rgba(255,197,98,0.22);
  border-radius: 10px;
  padding: 10px 11px;
  margin-bottom: 10px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.18);
}
.war-projects-title {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1.5px;
  color: var(--amber);
  margin-bottom: 6px;
}
.war-projects-copy {
  font-size: 11px;
  color: var(--text);
  line-height: 1.45;
  margin-bottom: 8px;
}
.war-project-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
}
.war-project-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 10px;
}
.war-project-card.done {
  border-color: rgba(94,229,143,0.30);
  background: linear-gradient(180deg, rgba(18,44,28,0.40), rgba(11,17,14,0.92));
}
.war-project-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 4px;
}
.war-project-name {
  color: var(--text-hi);
  font-weight: 700;
  font-size: 12px;
}
.war-project-tag {
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 1px;
  color: var(--amber);
}
.war-project-card.done .war-project-tag {
  color: var(--accent);
}
.war-project-desc {
  font-size: 10px;
  color: var(--text-lo);
  line-height: 1.45;
  margin-bottom: 6px;
}
.war-project-effects {
  font-size: 10px;
  color: var(--text);
  line-height: 1.5;
  margin-bottom: 7px;
}
.war-project-costs {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 8px;
  font-family: var(--mono);
  font-size: 9px;
}
.war-project-cost {
  white-space: nowrap;
}
.war-project-cost.ok {
  color: var(--accent);
}
.war-project-cost.no {
  color: var(--red);
}
.war-project-btn {
  width: 100%;
  padding: 7px;
  background: rgba(255,197,98,0.10);
  border: 1px solid rgba(255,197,98,0.32);
  color: var(--amber);
  border-radius: 6px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 1px;
  cursor: pointer;
}
.war-project-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
.war-project-card.done .war-project-btn {
  color: var(--accent);
  border-color: rgba(94,229,143,0.32);
  background: rgba(94,229,143,0.08);
}

/* ── QUEEN PANEL ─────────────────────────── */
.queen-panel {
  background: linear-gradient(135deg, rgba(255,197,98,0.13), rgba(16,32,27,0.95));
  border: 1px solid rgba(255,197,98,0.35);
  border-radius: 12px;
  padding: 12px 13px;
  margin-bottom: 10px;
  box-shadow: 0 0 0 1px rgba(255,197,98,0.10), 0 8px 24px rgba(0,0,0,0.22);
}
.queen-title { font-family:var(--mono); font-size:10px; letter-spacing:2px; color:var(--amber); margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; }
.queen-name  { font-size:15px; font-weight:700; color:var(--text-hi); margin-bottom:2px; }
.queen-subtitle { font-family:var(--mono); font-size:9px; color:var(--amber); letter-spacing:1px; margin-bottom:8px; }
.queen-stats { display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-bottom:8px; }
.queen-stat  { background:rgba(0,0,0,0.22); border:1px solid rgba(255,197,98,0.18); border-radius:6px; padding:5px 8px; }
.queen-stat-val { font-family:var(--mono); font-size:13px; font-weight:700; color:var(--amber); line-height:1; }
.queen-stat-lbl { font-size:9px; color:var(--text-lo); margin-top:1px; }
.queen-hp-bar { height:5px; background:var(--surface2); border-radius:99px; overflow:hidden; margin:6px 0 4px; border:1px solid var(--border); }
.queen-hp-fill { height:100%; border-radius:99px; transition:width 0.5s ease; }
.queen-xp-bar { height:3px; background:var(--surface2); border-radius:99px; overflow:hidden; margin-bottom:8px; border:1px solid var(--border); }
.queen-xp-fill { height:100%; background:linear-gradient(90deg,var(--amber-d),var(--amber)); border-radius:99px; transition:width 0.6s ease; }
.queen-buff-list { font-size:10px; color:var(--text); line-height:1.6; margin-bottom:8px; }
.queen-decree-btn { width:100%; padding:7px; background:rgba(255,197,98,0.12); border:1px solid rgba(255,197,98,0.4); color:var(--amber); border-radius:6px; font-family:var(--mono); font-size:9px; letter-spacing:1px; cursor:pointer; font-weight:700; transition:background 0.12s; }
.queen-decree-btn:hover { background:rgba(255,197,98,0.22); }
.queen-decree-btn:disabled { opacity:0.3; cursor:not-allowed; }
.queen-injured { border-color:rgba(255,139,137,0.45) !important; background:linear-gradient(135deg, rgba(127,29,29,0.18), rgba(16,32,27,0.95)) !important; }

/* ── STAGE OFFER PANEL ──────────────────── */
.stage-offer-panel {
  background: linear-gradient(135deg, rgba(255,139,137,0.10), rgba(16,32,27,0.94));
  border: 1px solid rgba(255,139,137,0.38);
  border-radius: 10px;
  padding: 11px 13px;
  margin-bottom: 10px;
  box-shadow: 0 0 0 1px rgba(255,139,137,0.12), 0 8px 20px rgba(0,0,0,0.20);
}
.stage-offer-title {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--red);
  margin-bottom: 6px;
}
.stage-offer-desc { font-size: 11px; color: var(--text); line-height: 1.45; margin-bottom: 8px; }
.stage-offer-rewards { font-family: var(--mono); font-size: 9px; color: var(--amber); margin-bottom: 8px; }
.stage-offer-timer {
  height: 3px;
  background: var(--surface2);
  border-radius: 99px;
  overflow: hidden;
  margin-bottom: 8px;
}
.stage-offer-timer-fill {
  height: 100%;
  background: var(--red);
  border-radius: 99px;
  transition: width 0.5s linear;
}
.stage-push-btn {
  padding: 6px 14px;
  background: rgba(255,139,137,0.14);
  border: 1px solid rgba(255,139,137,0.45);
  color: var(--red);
  border-radius: 5px;
  font-family: var(--mono);
  font-size: 10px;
  cursor: pointer;
  letter-spacing: 1px;
  font-weight: 700;
  white-space: nowrap;
  transition: background 0.1s;
}
.stage-push-btn:hover { background: rgba(255,139,137,0.24); }
.stage-push-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.stage-decline-btn {
  padding: 5px 10px;
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--text-lo);
  border-radius: 5px;
  font-family: var(--mono);
  font-size: 9px;
  cursor: pointer;
  letter-spacing: 0.5px;
}
/* ── BOSS ZONE CARD ─────────────────────── */
.zone-card.boss-cleared {
  border-color: rgba(183,152,255,0.35);
  background: linear-gradient(180deg, rgba(91,59,178,0.10), rgba(16,32,27,0.9));
}
.boss-badge {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 999px;
  background: rgba(255,139,137,0.15);
  border: 1px solid rgba(255,139,137,0.35);
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 1px;
  color: var(--red);
  vertical-align: middle;
  margin-left: 5px;
}
.boss-badge.cleared {
  background: rgba(183,152,255,0.15);
  border-color: rgba(183,152,255,0.35);
  color: var(--purple);
}
/* ── MISSION HISTORY PANEL ──────────────── */
.mission-hist-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 11px;
  margin-bottom: 10px;
}
.mission-hist-title {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--text-lo);
  margin-bottom: 7px;
}
.mission-hist-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
  font-size: 10px;
}
.mission-hist-row:last-child { border-bottom: none; }
.mission-hist-outcome {
  font-family: var(--mono);
  font-size: 9px;
  min-width: 52px;
  font-weight: 700;
}
.mission-hist-outcome.win   { color: var(--accent); }
.mission-hist-outcome.partial { color: var(--amber); }
.mission-hist-outcome.loss  { color: var(--red); }
.mission-hist-loot { color: var(--text-lo); flex: 1; font-family: var(--mono); font-size: 9px; }
/* ── ENCOUNTER TYPE BADGE ───────────────── */
.encounter-type-badge {
  display: inline-block;
  padding: 1px 5px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.8px;
  vertical-align: middle;
  margin-left: 4px;
}
.encounter-type-badge.ambush  { background: rgba(255,139,137,0.14); color: var(--red); border: 1px solid rgba(255,139,137,0.3); }
.encounter-type-badge.chamber { background: rgba(183,152,255,0.14); color: var(--purple); border: 1px solid rgba(183,152,255,0.3); }
/* ── ENEMY TYPE FLAVOUR ─────────────────── */
.zone-enemy-type {
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 1px;
  margin-top: 4px;
  padding: 2px 6px;
  border-radius: 3px;
  display: inline-block;
}
.enemy-termite  { color: #c08457; background: rgba(192,132,87,0.12); border: 1px solid rgba(192,132,87,0.25); }
.enemy-spider   { color: #b798ff; background: rgba(183,152,255,0.12); border: 1px solid rgba(183,152,255,0.25); }
.enemy-fungal   { color: #5ee58f; background: rgba(94,229,143,0.10); border: 1px solid rgba(94,229,143,0.22); }
.enemy-rival    { color: var(--red); background: rgba(255,139,137,0.10); border: 1px solid rgba(255,139,137,0.25); }
.enemy-ancient  { color: var(--amber); background: rgba(255,197,98,0.10); border: 1px solid rgba(255,197,98,0.25); }
.enemy-tyrant   { color: var(--red); background: rgba(255,80,80,0.14); border: 1px solid rgba(255,80,80,0.35); }
.enemy-sky      { color: var(--sky); background: rgba(120,215,255,0.10); border: 1px solid rgba(120,215,255,0.25); }

.cp-complete-btn {
  width: 100%;
  margin-top: 7px;
  padding: 7px;
  background: rgba(183,152,255,0.14);
  border: 1px solid var(--purple);
  color: var(--purple);
  border-radius: 6px;
  font-family: var(--mono);
  font-size: 10px;
  cursor: pointer;
  letter-spacing: 1px;
}
.cp-complete-btn:disabled { opacity: 0.25; cursor: not-allowed; }
.cp-done-banner {
  padding: 6px 10px;
  background: rgba(183,152,255,0.12);
  border: 1px solid rgba(183,152,255,0.3);
  border-radius: 6px;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--purple);
  margin-top: 5px;
  letter-spacing: 0.5px;
}

/* ── MAP EVENTS ──────────────────────────────── */
.map-event-panel {
  background: linear-gradient(180deg, rgba(31,110,152,0.12), rgba(16,32,27,0.92));
  border: 1px solid rgba(120,215,255,0.22);
  border-radius: 8px;
  padding: 8px 11px;
  margin-bottom: 8px;
}
.map-event-title {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--sky);
  margin-bottom: 4px;
  letter-spacing: 1px;
}
.map-event-desc { font-size: 11px; color: var(--text); margin-bottom: 6px; line-height: 1.4; }
.map-event-btn {
  padding: 5px 12px;
  background: rgba(120,215,255,0.10);
  border: 1px solid var(--sky-d);
  color: var(--sky);
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 10px;
  cursor: pointer;
  letter-spacing: 0.5px;
}
.map-event-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── OUTPOST SYSTEM ──────────────────────────── */
.outpost-panel {
  background: linear-gradient(180deg, rgba(34,62,52,0.22), rgba(16,32,27,0.9));
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 10px 11px;
  margin-bottom: 10px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.18);
}
.outpost-panel-title {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1.4px;
  color: var(--accent);
  margin-bottom: 8px;
}
.outpost-card {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 9px 11px;
  margin-bottom: 7px;
  display: flex;
  align-items: flex-start;
  gap: 9px;
}
.outpost-card.contested {
  border-color: var(--red);
  background: linear-gradient(180deg, rgba(80,10,10,0.18), rgba(16,32,27,0.9));
  animation: outpost-pulse 1.6s ease infinite;
}
.outpost-card.dormant {
  border-color: var(--border);
  opacity: 0.6;
}
@keyframes outpost-pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(255,139,137,0); }
  50%      { box-shadow: 0 0 0 4px rgba(255,139,137,0.22); }
}
.outpost-ico   { font-size: 18px; min-width: 24px; text-align: center; margin-top: 2px; }
.outpost-info  { flex: 1; min-width: 0; }
.outpost-name  { font-weight: 700; color: var(--text-hi); font-size: 12px; margin-bottom: 2px; }
.outpost-prod  { font-family: var(--mono); font-size: 9px; color: var(--accent); margin-bottom: 3px; }
.outpost-status {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.8px;
}
.outpost-status.active    { color: var(--accent); }
.outpost-status.contested { color: var(--red); }
.outpost-status.dormant   { color: var(--text-lo); }
.outpost-actions { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; flex-shrink: 0; }
.outpost-defend-btn {
  padding: 4px 9px;
  background: rgba(255,100,100,0.12);
  border: 1px solid var(--red);
  color: var(--red);
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 9px;
  cursor: pointer;
  letter-spacing: 0.5px;
  white-space: nowrap;
}
.outpost-defend-btn:hover { background: rgba(255,100,100,0.22); }
.outpost-abandon-btn {
  padding: 4px 9px;
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--text-lo);
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 9px;
  cursor: pointer;
  letter-spacing: 0.5px;
  white-space: nowrap;
}
.outpost-establish-btn {
  margin-top: 6px;
  padding: 5px 12px;
  background: var(--accent-dd);
  border: 1px solid var(--accent-d);
  color: var(--accent);
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 10px;
  cursor: pointer;
  letter-spacing: 1px;
  width: 100%;
}
.outpost-establish-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.outpost-contest-timer {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--red);
  margin-top: 2px;
}

@media (max-width: 860px) {
  .fighter-card, .zone-card, .scout-mission { border-radius: 12px; padding: 12px; }
}

/* iOS standalone viewport hardening */
@supports (-webkit-touch-callout: none) {
  html { height: -webkit-fill-available; }
  body {
    min-height: var(--app-height, -webkit-fill-available);
    height: var(--app-height, -webkit-fill-available);
  }
}

/* ── COLONY NAME MODAL ───────────────────────── */
#colony-name-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.72);
  display: none; align-items: center; justify-content: center;
  z-index: 1270; padding: 16px;
}
.cname-card {
  width: min(100%, 400px);
  background: linear-gradient(180deg, rgba(14,25,20,0.98), rgba(8,13,10,0.98));
  border: 1px solid rgba(94,229,143,0.35); border-radius: 14px;
  padding: 20px; box-shadow: 0 18px 46px rgba(0,0,0,0.45);
}
.cname-title {
  font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
  color: var(--accent); margin-bottom: 10px;
}
.cname-copy { font-size: 13px; color: var(--text-hi); font-weight: 600; margin-bottom: 4px; }
.cname-sub { font-size: 11px; color: var(--text); line-height: 1.5; margin-bottom: 14px; }
.cname-input {
  width: 100%; padding: 9px 12px; background: var(--bg);
  border: 1px solid var(--border2); border-radius: 6px;
  font-family: var(--mono); font-size: 13px; color: var(--text-hi);
  outline: none; margin-bottom: 12px;
  -webkit-text-fill-color: var(--text-hi);
}
.cname-input:focus { border-color: var(--accent-d); }
.cname-actions { display: flex; gap: 8px; }
.cname-confirm {
  flex: 1; padding: 8px; background: rgba(94,229,143,0.12);
  border: 1px solid var(--accent-d); color: var(--accent);
  border-radius: 6px; font-family: var(--mono); font-size: 10px;
  letter-spacing: 1px; cursor: pointer; font-weight: 700;
}
.cname-confirm:hover { background: rgba(94,229,143,0.20); }
.cname-skip {
  padding: 8px 14px; background: transparent;
  border: 1px solid var(--border2); color: var(--text-lo);
  border-radius: 6px; font-family: var(--mono); font-size: 10px;
  cursor: pointer;
}

/* ── BATTLE REPORT MODAL ─────────────────────── */
#battle-report-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  display: none; align-items: center; justify-content: center;
  z-index: 1280; padding: 16px;
}
.br-card {
  width: min(100%, 430px);
  background: linear-gradient(180deg, rgba(20,10,10,0.99), rgba(9,13,10,0.99));
  border: 1px solid rgba(255,139,137,0.30); border-radius: 14px;
  padding: 16px; box-shadow: 0 18px 46px rgba(0,0,0,0.5);
}
.br-card.br-win  { border-color: rgba(94,229,143,0.38); }
.br-card.br-partial { border-color: rgba(255,197,98,0.38); }
.br-card.br-loss { border-color: rgba(255,139,137,0.38); }
.br-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.br-zone-ico { font-size: 24px; }
.br-zone-name { font-size: 15px; font-weight: 700; color: var(--text-hi); }
.br-zone-sub { font-size: 10px; color: var(--text-lo); font-family: var(--mono); letter-spacing: 1px; margin-top: 1px; }
.br-versus { display: flex; gap: 8px; margin-bottom: 12px; align-items: stretch; }
.br-side {
  flex: 1; padding: 9px 10px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px;
}
.br-side-label { font-family: var(--mono); font-size: 8px; letter-spacing: 1.5px; color: var(--text-lo); margin-bottom: 5px; }
.br-side-val { font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--text-hi); }
.br-side-sub { font-size: 9px; color: var(--text-lo); margin-top: 2px; }
.br-vs-divider {
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 11px; color: var(--text-lo);
  min-width: 20px;
}
.br-dice-row { display: flex; gap: 6px; margin-bottom: 12px; }
.br-die {
  flex: 1; padding: 7px 8px; border-radius: 7px;
  text-align: center; background: var(--surface2); border: 1px solid var(--border2);
}
.br-die-val { font-family: var(--mono); font-size: 16px; font-weight: 700; }
.br-die-lbl { font-size: 8px; color: var(--text-lo); margin-top: 2px; font-family: var(--mono); letter-spacing: 0.5px; }
.br-outcome-banner {
  padding: 10px 12px; border-radius: 8px; margin-bottom: 10px;
  font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 1.5px;
  text-align: center;
}
.br-outcome-banner.win { background: rgba(94,229,143,0.12); color: var(--accent); border: 1px solid rgba(94,229,143,0.28); }
.br-outcome-banner.partial { background: rgba(255,197,98,0.10); color: var(--amber); border: 1px solid rgba(255,197,98,0.28); }
.br-outcome-banner.loss { background: rgba(255,139,137,0.10); color: var(--red); border: 1px solid rgba(255,139,137,0.28); }
.br-narrative { font-size: 11px; color: var(--text); line-height: 1.55; margin-bottom: 8px; }
.br-loot-row { font-family: var(--mono); font-size: 10px; color: var(--amber); margin-bottom: 10px; min-height: 14px; }
.br-tactic-box {
  margin-bottom: 10px;
  padding: 8px 9px;
  border-radius: 8px;
  border: 1px solid rgba(120,215,255,0.18);
  background: rgba(120,215,255,0.06);
}
.br-tactic-title {
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 1px;
  color: var(--sky);
  margin-bottom: 4px;
}
.br-tactic-copy {
  font-size: 10px;
  color: var(--text-hi);
  line-height: 1.45;
  margin-bottom: 6px;
}
.br-tactic-effects {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.br-tactic-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 6px;
  border-radius: 999px;
  border: 1px solid rgba(49,87,74,0.9);
  background: rgba(255,255,255,0.03);
  font-family: var(--mono);
  font-size: 8px;
  color: var(--text-lo);
}
.br-tactic-chip strong {
  color: var(--text-hi);
  font-weight: 700;
}
.br-dismiss {
  display: block; width: 100%; padding: 8px;
  background: var(--surface2); border: 1px solid var(--border2);
  color: var(--text-lo); border-radius: 6px; font-family: var(--mono);
  font-size: 10px; cursor: pointer; letter-spacing: 1px;

.br-dismiss:hover { color: var(--text-hi); }

  background: linear-gradient(180deg, rgba(27,53,44,0.18), rgba(11,17,14,0.94));

function applyStandaloneViewportFix() {
  const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  const vv = window.visualViewport;
  const raw = standalone
    ? (window.innerHeight || document.documentElement.clientHeight || 0)
    : ((vv && vv.height) || window.innerHeight || document.documentElement.clientHeight || 0);
  const h = Math.round(raw || 0);
  if (!h) return;
  document.documentElement.style.setProperty('--app-height', h + 'px');
}
applyStandaloneViewportFix();
window.addEventListener('resize', applyStandaloneViewportFix, { passive: true });
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', applyStandaloneViewportFix, { passive: true });
  window.visualViewport.addEventListener('scroll', applyStandaloneViewportFix, { passive: true });
}
window.addEventListener('orientationchange', () => setTimeout(applyStandaloneViewportFix, 180), { passive: true });
window.addEventListener('pageshow', () => setTimeout(applyStandaloneViewportFix, 120), { passive: true });


let lastTouchEndTs = 0;
document.addEventListener('touchend', (event) => {
  const now = Date.now();
  const isEditable = event.target && event.target.closest && event.target.closest('input, textarea, select, [contenteditable="true"]');
  if (!isEditable && now - lastTouchEndTs < 320) {
    event.preventDefault();
  }
  lastTouchEndTs = now;
}, { passive: false });

document.addEventListener('dblclick', (event) => {
  const isEditable = event.target && event.target.closest && event.target.closest('input, textarea, select, [contenteditable="true"]');
  if (!isEditable) {
    event.preventDefault();
  }
}, { passive: false });

function broodSpecUnlocked(id, state = G) {
  const spec = BROOD_SPECIALISATIONS[id];
  if (!spec) return false;
  if (!spec.unlock_tech) return true;
  return !!(state.techs && state.techs[spec.unlock_tech]);
}

function firstUnlockedBroodId(state = G) {
  for (const spec of Object.values(BROOD_SPECIALISATIONS)) {
    if (broodSpecUnlocked(spec.id, state)) return spec.id;
  }
  return 'worker';
}

function broodSpecLockedReason(id, state = G) {
  const spec = BROOD_SPECIALISATIONS[id];
  if (!spec) return 'Unavailable';
  if (broodSpecUnlocked(id, state)) return '';
  const tech = TECHS[spec.unlock_tech];
  return tech ? `Unlocks after researching ${tech.name}.` : 'Locked behind future research.';
}

function broodSpecPopupId(id) {
  return 'brood_' + id;
}

function broodSpecUnlockProgress(id, state = G) {
  const spec = BROOD_SPECIALISATIONS[id];
  if (!spec || !spec.unlock_tech) return null;
  const tech = TECHS[spec.unlock_tech];
  if (!tech) return null;
  const prereqs = Array.isArray(tech.requires) ? tech.requires : [];
  const doneReqs = prereqs.filter(req => !!(state.techs && state.techs[req])).length;
  const researched = !!(state.techs && state.techs[spec.unlock_tech]);
  const reqsMet = prereqs.length === doneReqs;
  const stepTotal = Math.max(1, prereqs.length + 1);
  let pct = researched ? 100 : Math.round((doneReqs / stepTotal) * 100);
  if (!researched && reqsMet) pct = Math.max(pct, 72);
  if (!researched && reqsMet && techStageReady(tech) && canAffordTech(spec.unlock_tech)) pct = Math.max(pct, 88);
  let label = '';
  if (researched) label = `${tech.name} researched.`;
  else if (reqsMet && techStageReady(tech) && canAffordTech(spec.unlock_tech)) label = `Research ${tech.name} now to unlock this hatch line.`;
  else if (reqsMet) label = `${tech.name} is the next brood breakthrough.`;
  else label = `Research path ${doneReqs}/${prereqs.length} prerequisite${prereqs.length === 1 ? '' : 's'} complete.`;
  const nextReq = prereqs.find(req => !(state.techs && state.techs[req]));
  const nextReqName = nextReq && TECHS[nextReq] ? TECHS[nextReq].name : '';
  let next = '';
  if (!researched && nextReqName) next = `Next requirement: ${nextReqName}`;
  else if (!researched && reqsMet) next = `Unlock research: ${tech.name}`;
  return { techName: tech.name, pct, label, next };
}

function hasHatchedBug(state = G) {
  return Math.max(0, Math.floor(Number(state?.brood?.total_hatched) || 0)) > 0 || Math.max(0, Math.floor(Number(state?.pop?.total) || 0)) > 0;
}

function createTradeState(state = { time:{ year:1, s_idx:0 } }) {
  return {
    rep: Object.fromEntries(TRADES.map(t => [t.id, 0])),
    market: {},
    contracts: [],
    caravan: null,
    season_stamp: `${state.time?.year || 1}-${state.time?.s_idx || 0}`,
    initialized: false,
  };
}

function ensureTradeState(state = G) {
  if (!state.trade || typeof state.trade !== 'object') state.trade = createTradeState(state);
  if (!state.trade.rep || typeof state.trade.rep !== 'object') state.trade.rep = {};
  for (const tr of TRADES) {
    if (!Number.isFinite(state.trade.rep[tr.id])) state.trade.rep[tr.id] = 0;
  }
  if (!state.trade.market || typeof state.trade.market !== 'object') state.trade.market = {};
  if (!Array.isArray(state.trade.contracts)) state.trade.contracts = [];
  if (!('caravan' in state.trade)) state.trade.caravan = null;
  if (!state.trade.season_stamp) state.trade.season_stamp = `${state.time?.year || 1}-${state.time?.s_idx || 0}`;
  if (typeof state.trade.initialized !== 'boolean') state.trade.initialized = false;
  return state.trade;
}

function tradeVisiblePool(state = G) {
  return TRADES.filter(t => state.techs[t.req] && (!t.capstone || legacyRank(t.capstone, state.meta || G.meta) > 0));
}

function tradeReadyPool(state = G) {
  return tradeVisiblePool(state).filter(t => lineageStageUnlocked(t, state));
}

function tradeRep(id, state = G) {
  ensureTradeState(state);
  return state.trade.rep[id] || 0;
}

function tradeRepTier(id, state = G) {
  const rep = tradeRep(id, state);
  let tier = 0;
  TRADE_REP_TIERS.forEach((row, idx) => {
    if (rep >= row.req) tier = idx;
  });
  return tier;
}

function tradeRepInfo(id, state = G) {
  return TRADE_REP_TIERS[tradeRepTier(id, state)] || TRADE_REP_TIERS[0];
}

function nextTradeRepThreshold(id, state = G) {
  const rep = tradeRep(id, state);
  return TRADE_REP_TIERS.find(row => row.req > rep) || null;
}

function tradeRepProgressPct(id, state = G) {
  const tier = tradeRepTier(id, state);
  const cur = TRADE_REP_TIERS[tier];
  const next = TRADE_REP_TIERS[tier + 1];
  if (!next) return 100;
  return Math.max(0, Math.min(100, Math.round(((tradeRep(id, state) - cur.req) / Math.max(1, next.req - cur.req)) * 100)));
}

function tradePerkSummary(id, state = G) {
  const current = tradeRepInfo(id, state);
  const next = nextTradeRepThreshold(id, state);
  return next ? `${current.perk} Next perk at ${next.req} rep.` : `${current.perk} Max standing reached.`;
}

function tradeRepMult(id, state = G) {
  return tradeRepInfo(id, state).mult;
}

function tradeGiftChance(id, state = G) {
  return tradeRepTier(id, state) >= 3 ? 0.25 : 0;
}

function tradeMarketInfo(id, state = G) {
  ensureTradeState(state);
  const key = state.trade.market[id] || 'steady';
  return TRADE_MARKET_STATES[key] || TRADE_MARKET_STATES.steady;
}

function rewardSummary(reward) {
  return Object.entries(reward || {}).map(([r, a]) => `${RES[r].icon} ${a} ${RES[r].name}`).join(', ');
}

function tradeContractRewardText(contract) {
  return rewardSummary(contract && contract.reward ? contract.reward : {});
}

function activeTradeContract(tradeId, state = G) {
  ensureTradeState(state);
  return (state.trade.contracts || []).find(c => c.tradeId === tradeId && !c.resolved) || null;
}

function activeCaravanForTrade(tradeId, state = G) {
  ensureTradeState(state);
  return state.trade.caravan && state.trade.caravan.tradeId === tradeId ? state.trade.caravan : null;
}

function caravanTradeMult(id, state = G) {
  const caravan = activeCaravanForTrade(id, state);
  return caravan ? 1 + (caravan.mult || 0) : 1;
}

function effectiveTradeMult(id, state = G) {
  const territory = territoryTradeInfluence(id, state);
  return tradeMult() * tradeRepMult(id, state) * tradeMarketInfo(id, state).mult * caravanTradeMult(id, state) * territory.mult;
}

function rollTradeMarketState(tr, state = G) {
  const season = SEASONS[state.time.s_idx] || 'Spring';
  const skyTrades = new Set(['sky_market', 'sky_nomads', 'cloud_merchants', 'astral_convoy']);
  const groundTrades = new Set(['ant_colony', 'fungal_spire', 'deep_tunnels', 'fault_brokers']);
  let shortage = 0.18;
  let surplus = 0.22;
  if (season === 'Autumn' && groundTrades.has(tr.id)) surplus += 0.10;
  if (season === 'Summer' && skyTrades.has(tr.id)) surplus += 0.08;
  if (season === 'Winter' && tr.id === 'bee_hive') shortage += 0.12;
  const roll = Math.random();
  if (roll < shortage) return 'shortage';
  if (roll > 1 - surplus) return 'surplus';
  return 'steady';
}

function buildTradeContract(tradeId, state = G, index = 0) {
  const tr = TRADES.find(t => t.id === tradeId);
  if (!tr) return null;
  const firstBuy = Object.entries(tr.buy || {})[0] || null;
  const reward = {};
  if (firstBuy) reward[firstBuy[0]] = Math.max(2, Math.floor(firstBuy[1] * (tr.capstone ? 2.2 : 1.7)));
  return {
    id: `${tradeId}_${state.time.year}_${state.time.s_idx}_${index}`,
    tradeId,
    goal: Math.max(2, Math.min(4, 2 + Math.floor(Math.max(0, state.time.year - 1) / 2) + (tr.capstone ? 1 : 0))),
    progress: 0,
    reward,
    rep: tr.capstone ? 5 : 4,
    resolved: false,
  };
}

function startTradeCaravan(tradeId, state = G, announce = true) {
  ensureTradeState(state);
  const tr = TRADES.find(t => t.id === tradeId);
  if (!tr) return null;
  const caravan = { tradeId, ticks_left: 240, mult: 0.15 };
  state.trade.caravan = caravan;
  if (announce) {
    log(`Caravan on route: ${tr.name} returns are boosted for a short while.`);
    toast(`${tr.name} caravan arrived`);
  }
  return caravan;
}

function refreshTradeNetwork(state = G, reason = 'season', announce = true) {
  if (!state.techs.trade_routes) return;
  ensureTradeState(state);
  const visible = tradeVisiblePool(state);
  const ready = tradeReadyPool(state);
  const hadOpenContracts = (state.trade.contracts || []).some(c => !c.resolved);
  state.trade.market = {};
  for (const tr of visible) state.trade.market[tr.id] = rollTradeMarketState(tr, state);
  const shuffled = ready.slice().sort(() => Math.random() - 0.5);
  state.trade.contracts = shuffled.slice(0, Math.min(2, shuffled.length)).map((tr, idx) => buildTradeContract(tr.id, state, idx)).filter(Boolean);
  state.trade.caravan = ready.length && Math.random() < 0.45
    ? startTradeCaravan(ready[Math.floor(Math.random() * ready.length)].id, state, false)
    : null;
  state.trade.season_stamp = `${state.time.year}-${state.time.s_idx}`;
  state.trade.initialized = true;
  if (announce) {
    const expiredNote = hadOpenContracts && reason === 'season' ? ' Older contracts expired.' : '';
    log(`Trade network refreshed for ${SEASONS[state.time.s_idx]}.${expiredNote}${state.trade.contracts.length ? ' New contracts posted.' : ' No contracts available yet.'}`);
    toast(reason === 'unlock' ? 'Trade network opened' : 'Trade routes updated');
  }
}

function maybeRefreshTradeNetworkForCurrentSeason(state = G) {
  if (!state.techs.trade_routes) return;
  ensureTradeState(state);
  const stamp = `${state.time.year}-${state.time.s_idx}`;
  const needsSetup = !state.trade.initialized || !Object.keys(state.trade.market || {}).length;
  if (needsSetup || state.trade.season_stamp !== stamp) {
    refreshTradeNetwork(state, needsSetup ? 'setup' : 'season', false);
  }
}

function grantTradeRewardBundle(reward, state = G) {
  const gained = [];
  for (const [res, amount] of Object.entries(reward || {})) {
    if (state.res[res] === undefined) continue;
    const added = Math.min(amount, maxRes(res) - (state.res[res] || 0));
    if (added > 0) {
      state.res[res] += added;
      state.vis[res] = true;
      gained.push(`${RES[res].icon}+${added} ${RES[res].name}`);
    }
  }
  return gained;
}

function applyTradeReputation(tradeId, gain = 1, state = G) {
  ensureTradeState(state);
  const tr = TRADES.find(t => t.id === tradeId);
  const beforeTier = tradeRepTier(tradeId, state);
  state.trade.rep[tradeId] = Math.max(0, Math.min(100, tradeRep(tradeId, state) + gain));
  const afterTier = tradeRepTier(tradeId, state);
  const tierUp = afterTier > beforeTier;
  if (tierUp && tr) {
    const info = tradeRepInfo(tradeId, state);
    log(`${tr.name} standing improved: ${info.name}.`);
    toast(`${tr.name}: ${info.name}`);
  }
  return { tierUp, info: tradeRepInfo(tradeId, state), value: state.trade.rep[tradeId] };
}

function resolveTradeContract(contract, state = G) {
  const tr = TRADES.find(t => t.id === contract.tradeId);
  if (!tr) return [];
  const rewardNotes = grantTradeRewardBundle(contract.reward, state);
  applyTradeReputation(contract.tradeId, contract.rep || 0, state);
  contract.resolved = true;
  const summary = rewardNotes.length ? rewardNotes.join(', ') : 'storage full';
  log(`Contract complete: ${tr.name} · ${summary}.`);
  toast(`Contract cleared: ${tr.name}`);
  return rewardNotes;
}

function advanceTradeContracts(tradeId, state = G) {
  ensureTradeState(state);
  const notes = [];
  for (const contract of state.trade.contracts || []) {
    if (contract.tradeId !== tradeId || contract.resolved) continue;
    contract.progress = Math.min(contract.goal, (contract.progress || 0) + 1);
    if (contract.progress >= contract.goal) {
      const rewards = resolveTradeContract(contract, state);
      if (rewards.length) notes.push(`contract reward ${rewards.join(', ')}`);
      else notes.push('contract cleared');
    }
  }
  return notes;
}

function tickTradeNetwork(dt) {
  if (!G.techs.trade_routes) return;
  maybeRefreshTradeNetworkForCurrentSeason(G);
  ensureTradeState(G);
  if (G.trade.caravan && G.trade.caravan.ticks_left > 0) {
    G.trade.caravan.ticks_left--;
    if (G.trade.caravan.ticks_left <= 0) {
      const ended = TRADES.find(t => t.id === G.trade.caravan.tradeId);
      if (ended) log(`Caravan departed: ${ended.name} route normalised.`);
      G.trade.caravan = null;
    }
    return;
  }
  const ready = tradeReadyPool(G);
  if (!ready.length) return;
  if (Math.random() < 0.00022 * dt * Math.max(1, ready.length)) {
    startTradeCaravan(ready[Math.floor(Math.random() * ready.length)].id, G, true);
  }
}

let navPage = 0;

function applyNavPagerState() {
  const mobile = window.matchMedia('(max-width: 860px)').matches;
  document.querySelectorAll('.nav-page').forEach(page => {
    const idx = Number(page.dataset.navPage || 0);
    page.classList.toggle('active', !mobile || idx === navPage);
  });

  // Right toggle (→ / next page arrow)
  const toggle = document.getElementById('nav-page-toggle');
  if (toggle) {
    toggle.style.display = mobile && navPage === 0 ? 'flex' : 'none';
    toggle.classList.toggle('alt', false);
    toggle.setAttribute('aria-label', 'Show more tabs');
    const ico = toggle.querySelector('.nb-ico');
    if (ico) ico.textContent = '↠';

    // Badge on right arrow if page-1 tabs have any badges
    const oldToggleBadge = toggle.querySelector('.toggle-badge');
    if (oldToggleBadge) oldToggleBadge.remove();
    if (mobile && navPage === 0) {
      // Count badges on page-1 buttons
      let page1BadgeCount = 0;
      let page1BadgeColor = { bg: 'var(--accent-d)', fg: 'var(--accent)' };
      document.querySelectorAll('[data-nav-page="1"] .nb').forEach(btn => {
        const badge = btn.querySelector('.badge');
        const hinted = btn.classList.contains('handoff');
        if (badge || hinted) {
          page1BadgeCount++;
          const fg = badge ? (badge.style.color || '') : 'var(--sky)';
          if (fg.includes('red') || fg === 'var(--red)') {
            page1BadgeColor = { bg: 'rgba(185,28,28,0.7)', fg: 'var(--red)' };
          } else if (page1BadgeColor.fg !== 'var(--red)' && (fg.includes('amber') || fg === 'var(--amber)')) {
            page1BadgeColor = { bg: 'var(--amber-d)', fg: 'var(--amber)' };
          } else if (page1BadgeColor.fg !== 'var(--red)' && page1BadgeColor.fg !== 'var(--amber)') {
            page1BadgeColor = { bg: 'rgba(31,110,152,0.7)', fg: 'var(--sky)' };
          }
        }
      });
      if (page1BadgeCount > 0) {
        const tb = document.createElement('span');
        tb.className = 'toggle-badge';
        tb.style.background = page1BadgeColor.bg;
        tb.style.color = page1BadgeColor.fg;
        tb.textContent = page1BadgeCount > 1 ? String(page1BadgeCount) : '!';
        toggle.appendChild(tb);
      }
    }
  }

  // Left toggle (← / back arrow, shown only when on page 1)
  const toggleLeft = document.getElementById('nav-page-toggle-left');
  if (toggleLeft) {
    toggleLeft.style.display = mobile && navPage === 1 ? 'flex' : 'none';
  }
}

function syncNavPageToTab(tab = curTab) {
  const mobile = window.matchMedia('(max-width: 860px)').matches;
  if (!mobile) {
    navPage = 0;
    applyNavPagerState();
    return;
  }
  navPage = NAV_PAGE_BY_TAB[tab] || 0;
  applyNavPagerState();
}

function toggleNavPage() {
  navPage = navPage === 0 ? 1 : 0;
  applyNavPagerState();
}

function territoryIdentity(tileType) {
  return TERRITORY_IDENTITY[tileType] || null;
}

function territorySeasonEffect(tileType, season = seasonName()) {
  const id = territoryIdentity(tileType);
  return id && id.seasonal ? (id.seasonal[season] || null) : null;
}

function territoryDangerPips(score) {
  const safe = Math.max(1, Math.min(5, score || 1));
  return '◆'.repeat(safe) + '·'.repeat(5 - safe);
}

function territoryDangerClass(score) {
  const safe = Math.max(1, Math.min(5, score || 1));
  if (safe <= 2) return 'danger-low';
  if (safe === 3) return 'danger-medium';
  if (safe === 4) return 'danger-high';
  return 'danger-very-high';
}

function territoryDangerMeter(score, label = '') {
  const safe = Math.max(1, Math.min(5, score || 1));
  const tone = territoryDangerClass(safe);
  const pct = (safe / 5) * 100;
  const safeLabel = label || (safe <= 2 ? 'Low' : safe === 3 ? 'Medium' : safe === 4 ? 'High' : 'Very High');
  return `<div class="danger-line" aria-label="Threat level ${safeLabel} (${safe}/5)">
    <span class="danger-label ${tone}">${safeLabel}</span>
    <div class="danger-meter">
      <div class="danger-meter-track">
        <div class="danger-meter-fill ${tone}" style="width:${pct}%"></div>
      </div>
    </div>
  </div>`;
}

function resourceBundleText(bundle = {}, opts = {}) {
  const {
    withNames = true,
    positive = false,
    separator = ' · ',
  } = opts;
  const parts = [];
  for (const [res, amount] of Object.entries(bundle || {})) {
    if (!RES[res] || !amount) continue;
    parts.push(`${RES[res].icon}${positive ? '+' : ''}${amount}${withNames ? ` ${RES[res].name}` : ''}`);
  }
  return parts.join(separator);
}

function mapEventOfferHtml(ev) {
  if (!ev || !ev.reward) return '';
  const give = resourceBundleText(ev.reward.cost || {}, { withNames:true, positive:false });
  const get = resourceBundleText(ev.reward.gain || {}, { withNames:true, positive:true });
  const hasGive = !!give;
  const hasGet = !!get;
  if (!hasGive && !hasGet) return '';
  const traderNote = ev.id === 'wandering_trader'
    ? `<div style="font-family:var(--mono);font-size:8px;letter-spacing:1px;color:var(--amber);margin-bottom:6px;">OFFER LOCKED IN FOR THIS VISIT</div>`
    : '';
  return `<div style="margin-bottom:7px;padding:7px 8px;background:rgba(0,0,0,0.18);border:1px solid var(--border);border-radius:7px;">
    ${traderNote}
    ${hasGive ? `<div style="font-family:var(--mono);font-size:8px;letter-spacing:1px;color:var(--text-lo);margin-bottom:3px;">GIVE</div><div style="font-size:10px;color:var(--red);margin-bottom:${hasGet ? 6 : 0}px;">${give}</div>` : ''}
    ${hasGet ? `<div style="font-family:var(--mono);font-size:8px;letter-spacing:1px;color:var(--text-lo);margin-bottom:3px;">RECEIVE</div><div style="font-size:10px;color:var(--amber);">${get}</div>` : ''}
  </div>`;
}

function mapEventCompactOfferLine(ev) {
  if (!ev || !ev.reward) return '';
  const give = resourceBundleText(ev.reward.cost || {}, { withNames:true, positive:false, separator:', ' });
  const get = resourceBundleText(ev.reward.gain || {}, { withNames:true, positive:true, separator:', ' });
  if (give && get) return `Offer: ${give} → ${get}`;
  if (get) return `Reward: ${get}`;
  return '';
}

function expeditionDangerScore(zone) {
  const raw = zone && zone.danger_score != null ? zone.danger_score : Math.max(1, (zone && zone.bugs) || 1);
  return Math.max(1, Math.min(5, raw || 1));
}

function expeditionDangerLabel(zone) {
  const score = expeditionDangerScore(zone);
  return score <= 2 ? 'Low' : score === 3 ? 'Medium' : score === 4 ? 'High' : 'Very High';
}

function expeditionHazardMitigation(zone) {
  const escorts = expeditionEscortCount(zone);
  let mult = 1;
  if (escorts > 0) mult *= Math.max(0.42, 1 - escorts * 0.16);
  if (zone && zone.scoutResolved) mult *= (zone.lootMult || 1) < 0.95 ? 0.92 : 0.86;
  return Math.max(0.34, mult);
}

function expeditionHazardChance(zone) {
  const score = expeditionDangerScore(zone);
  const table = { 1:0.00, 2:0.05, 3:0.10, 4:0.18, 5:0.28 };
  const base = table[score] || 0;
  return Math.max(0, Math.min(0.9, base * expeditionHazardMitigation(zone)));
}

function expeditionCasualtyChance(zone) {
  if (!zone || !zone.targetKey) return 0;
  if (expeditionEscortCount(zone) > 0) return 0;
  const score = expeditionDangerScore(zone);
  if (score < 4) return 0;
  const distance = Math.max(0, Number(zone.distance != null ? zone.distance : tileExpeditionDistance(zone.targetKey)) || 0);
  let chance = 0;
  if (score >= 4 && distance >= 5.2) chance = 0.03;
  if (score >= 5 && distance >= 6.2) chance = 0.06;
  if (score >= 5 && distance >= 7.4) chance = 0.09;
  if (zone.scoutResolved && (zone.lootMult || 1) < 0.95) chance += 0.02;
  return Math.max(0, Math.min(0.14, chance));
}

function expeditionHazardSummary(zone) {
  const chance = expeditionHazardChance(zone);
  if (chance <= 0) return 'Stable route. No setback risk.';
  const casualtyChance = expeditionCasualtyChance(zone);
  return `${Math.round(chance * 100)}% setback chance · reduced haul or lost supplies${casualtyChance > 0 ? ` · ${Math.round(casualtyChance * 100)}% worst-case crew loss` : ''}.`;
}

function expeditionLossBundleText(bundle = {}) {
  return resourceBundleText(bundle || {}, { withNames:true, positive:false, separator:' · ' });
}

function applyExpeditionLossBundle(bundle = {}) {
  const applied = {};
  for (const [res, amount] of Object.entries(bundle || {})) {
    if (G.res[res] === undefined) continue;
    const loss = Math.min(amount, Math.max(0, G.res[res] || 0));
    if (loss > 0) {
      G.res[res] -= loss;
      applied[res] = loss;
    }
  }
  return applied;
}

function applyExpeditionBugLoss(count = 0) {
  let loss = Math.max(0, Math.floor(Number(count) || 0));
  if (!loss) return 0;
  const maxLoss = Math.max(0, G.pop.total - fightersTotal());
  loss = Math.min(loss, maxLoss);
  if (!loss) return 0;
  G.pop.total = Math.max(0, G.pop.total - loss);
  ensureBroodState(G);
  let overflow = Math.max(0, employed() - Math.max(0, G.pop.total - fightersTotal() - outpostWorkers()));
  if (overflow > 0) {
    const jobs = Object.keys(G.jobs || {}).sort((a, b) => (G.jobs[b] || 0) - (G.jobs[a] || 0));
    for (const jid of jobs) {
      while (overflow > 0 && (G.jobs[jid] || 0) > 0) {
        G.jobs[jid]--;
        overflow--;
      }
      if (overflow <= 0) break;
    }
  }
  return loss;
}

function buildScaledExpeditionLoot(loot = {}, mult = 1) {
  const scaled = {};
  for (const [res, amount] of Object.entries(loot || {})) {
    if (!amount) continue;
    scaled[res] = mult >= 0.999 ? amount : Math.max(1, Math.floor(amount * mult));
  }
  return scaled;
}

function rollExpeditionHazard(zone) {
  const chance = expeditionHazardChance(zone);
  if (chance <= 0 || Math.random() >= chance) return null;
  const score = expeditionDangerScore(zone);
  const escorts = expeditionEscortCount(zone);
  const mitigation = expeditionHazardMitigation(zone);
  const penalty = {};
  const addLoss = (res, amount) => {
    const available = Math.max(0, G.res[res] || 0);
    const scaled = Math.max(0, Math.round(amount * Math.max(0.45, mitigation)));
    const loss = Math.min(scaled, available);
    if (loss > 0) penalty[res] = (penalty[res] || 0) + loss;
  };

  const casualtyChance = expeditionCasualtyChance(zone);
  const casualtyLoss = casualtyChance > 0 && Math.random() < casualtyChance
    ? 1
    : 0;

  const finalize = (payload) => {
    const out = { ...payload };
    out.loss = out.loss || {};
    if (escorts > 0) {
      out.loot_mult = Math.min(1, (out.loot_mult || 1) + Math.min(0.18, escorts * 0.06));
      if (out.msg) out.msg += escorts === 1
        ? ' The escort screened the retreat and prevented a worse loss.'
        : ' The escort screen kept the damage from becoming a rout.';
      if (out.toast) out.toast += ' (screened)';
    }
    if (casualtyLoss > 0) {
      out.bug_loss = casualtyLoss;
      out.msg = `${out.msg} One survey bug failed to return from the route.`;
      out.warn = true;
    }
    return out;
  };

  const roll = Math.random();
  if (score >= 5 && roll < 0.34) {
    addLoss('honeydew', 24 + Math.floor(Math.random() * 18));
    if (Math.random() < 0.55) addLoss('leaves', 10 + Math.floor(Math.random() * 8));
    return finalize({
      label:'Harried Return',
      msg:'Predators harried the return flight. Part of the haul was dropped to get home alive.',
      toast:'Harried return',
      loot_mult:0.55,
      loss:penalty,
      warn:true,
    });
  }
  if (score >= 4 && roll < 0.68) {
    addLoss('honeydew', 12 + Math.floor(Math.random() * 12));
    if (Math.random() < 0.4) addLoss('dirt', 8 + Math.floor(Math.random() * 8));
    return finalize({
      label:'Supply Spill',
      msg:'A rough crossing forced the scouts to spill stores and abandon some finds.',
      toast:'Supply spill',
      loot_mult:0.68,
      loss:penalty,
      warn:true,
    });
  }
  if (score >= 3) {
    return finalize({
      label:'Broken Trail',
      msg:'The route turned hostile and the scouts came back with only part of the haul.',
      toast:'Reduced haul',
      loot_mult:score >= 4 ? 0.72 : 0.78,
      loss:{},
      warn:true,
    });
  }
  return finalize({
    label:'Scattered Return',
    msg:'The bugs had to scatter and regroup, returning with a lighter haul.',
    toast:'Light setback',
    loot_mult:0.82,
    loss:{},
    warn:true,
  });
}

function outpostRateBundle(tileType, state = G, op = null) {
  const def = OUTPOST_DEFS[tileType];
  if (!def) return { prod:{}, mult:1, identity:null, seasonEffect:null, stagingBonus:null };
  const identity = territoryIdentity(tileType);
  const seasonEffect = territorySeasonEffect(tileType, SEASONS[(state.time || G.time).s_idx] || seasonName());
  let mult = 1;
  if (seasonEffect && seasonEffect.yield_mult) mult *= seasonEffect.yield_mult;
  const stagingBonus = op && op.rival_base ? {
    pack_mult: 0.82,
    duration_mult: 0.86,
    ambush_mult: 0.74,
    note: 'Nearby expeditions pack lighter and move faster from this seized nest.',
  } : null;
  if (op && op.rival_base) mult *= 1.45;
  const prod = {};
  for (const [res, rate] of Object.entries(def.prod || {})) prod[res] = rate * mult;
  if (op && op.rival_base) {
    prod.honeydew = (prod.honeydew || 0) + 0.006;
    if (tileType !== 'ruins') prod.resin = (prod.resin || 0) + 0.004;
  }
  return { prod, mult, identity, seasonEffect, stagingBonus };
}

function territoryRouteNames(tileType) {
  const identity = territoryIdentity(tileType);
  return identity && Array.isArray(identity.route_pull) ? identity.route_pull : [];
}

function territoryInfluenceSummary(tileType) {
  const names = territoryRouteNames(tileType);
  if (!names.length) return 'No trade routes lean on this ground yet.';
  return names.slice(0, 3).join(', ') + (names.length > 3 ? '…' : '');
}

function activeOutpostTypeCounts(state = G) {
  const counts = {};
  for (const op of (state.outposts || [])) {
    if (op.status === 'dormant') continue;
    const weight = op.status === 'contested' ? 0.5 : 1;
    counts[op.type] = (counts[op.type] || 0) + weight;
  }
  return counts;
}

function territoryTradeInfluence(tradeId, state = G) {
  const prefs = TRADE_TERRITORY_PREFS[tradeId] || {};
  const counts = activeOutpostTypeCounts(state);
  const sources = [];
  let bonus = 0;
  for (const [tileType, weight] of Object.entries(prefs)) {
    const held = counts[tileType] || 0;
    if (!held) continue;
    const add = held * weight;
    bonus += add;
    sources.push({ tileType, bonus:add, held });
  }
  bonus = Math.max(-0.18, Math.min(0.28, bonus));
  sources.sort((a, b) => b.bonus - a.bonus);
  const summary = sources.length
    ? sources.slice(0, 2).map(s => `${MAP_TILE_DEFS[s.tileType].label} +${Math.round(s.bonus * 100)}%`).join(' · ')
    : 'No territory pull yet.';
  return { mult:1 + bonus, bonus, sources, summary };
}

function landmarkDefById(id) {
  return MAP_LANDMARK_DEFS.find(def => def.id === id) || null;
}

function buildMapLandmarkReward(defId, tileType, rng) {
  const extra = (minVal, range) => minVal + Math.floor(rng() * range);
  switch (defId) {
    case 'old_waystone':
      return { gain:{ insight: extra(10, 6), resin: extra(8, 4) }, reveal: extra(2, 2), bonus:{ resin:0.001 } };
    case 'abandoned_nursery':
      return { gain:{ honeydew: extra(22, 12), leaves: extra(16, 8), spores: extra(12, 6) }, reveal: extra(1, 2) };
    case 'amber_cistern':
      return { gain:{ honeydew: extra(48, 18), resin: extra(6, 4), dirt: extra(14, 8) }, reveal: 1 };
    case 'silk_lookout':
      return { gain:{ silk: extra(8, 4), insight: extra(8, 5), aether: tileType === 'sky' ? extra(10, 8) : extra(4, 4) }, reveal: extra(2, 2), bonus:{ insight:0.001 } };
    case 'fallen_relay':
      return { gain:{ aether: extra(18, 12), insight: extra(12, 6), chitin: extra(8, 5) }, reveal: extra(2, 3), bonus:{ aether:0.001 } };
    default:
      return { gain:{ leaves:12, dirt:10 }, reveal:1 };
  }
}

function generateMapLandmarksForTiles(tiles, seed) {
  const rng = seededRng(((seed || 1) ^ 0x9e3779b9) >>> 0);
  const used = new Set();
  const out = [];
  for (const def of MAP_LANDMARK_DEFS) {
    const candidates = Object.entries(tiles).filter(([key, tile]) => {
      if (!tile || used.has(key) || tile.type === 'colony' || tile.type === 'hazard') return false;
      if (!def.allowed.includes(tile.type)) return false;
      return tileExpeditionDistance(key) >= def.minDist;
    });
    if (!candidates.length) continue;
    candidates.sort((a, b) => tileExpeditionDistance(a[0]) - tileExpeditionDistance(b[0]));
    const pickFrom = Math.min(candidates.length, Math.max(4, Math.ceil(candidates.length * 0.65)));
    const pick = candidates[Math.floor(rng() * pickFrom)];
    if (!pick) continue;
    const key = pick[0];
    const tile = pick[1];
    used.add(key);
    out.push({
      key,
      id:def.id,
      discovered:false,
      resolved:false,
      reward: buildMapLandmarkReward(def.id, tile.type, rng),
    });
  }
  return out;
}

function ensureMapLandmarks(state = G) {
  if (!state.map) return [];
  if (!Array.isArray(state.map.landmarks) || !state.map.landmarks.length) {
    const seed = Number.isFinite(state.map.seed) ? state.map.seed : ((state.time && state.time.year) || 1) * 9973;
    state.map.landmarks = generateMapLandmarksForTiles(state.map.tiles || {}, seed);
  }
  for (const landmark of (state.map.landmarks || [])) {
    if (!landmark.reward || typeof landmark.reward !== 'object') landmark.reward = { gain:{}, reveal:0 };
    if (!landmark.reward.gain || typeof landmark.reward.gain !== 'object') landmark.reward.gain = {};
    if (!Number.isFinite(landmark.reward.reveal)) landmark.reward.reveal = 0;
    if (landmark.reward.bonus && typeof landmark.reward.bonus !== 'object') landmark.reward.bonus = {};
    landmark.discovered = !!landmark.discovered;
    landmark.resolved = !!landmark.resolved;
  }
  return state.map.landmarks;
}

function getMapLandmark(key, state = G) {
  ensureMapLandmarks(state);
  return (state.map && state.map.landmarks || []).find(landmark => landmark.key === key) || null;
}

function activeMapDiscoveries(state = G) {
  ensureMapLandmarks(state);
  return ((state.map && state.map.landmarks) || []).filter(landmark => landmark.discovered && !landmark.resolved);
}

function mapLandmarkCounts(state = G) {
  ensureMapLandmarks(state);
  const landmarks = (state.map && state.map.landmarks) || [];
  const discovered = landmarks.filter(landmark => landmark.discovered).length;
  const resolved = landmarks.filter(landmark => landmark.resolved).length;
  const active = landmarks.filter(landmark => landmark.discovered && !landmark.resolved).length;
  return { total: landmarks.length, discovered, resolved, active };
}

function discoverMapLandmarks(state = G) {
  ensureMapLandmarks(state);
  if (!state.map || !state.map.tiles) return [];
  const newlyFound = [];
  for (const landmark of (state.map.landmarks || [])) {
    if (landmark.discovered || landmark.resolved) continue;
    const tile = state.map.tiles[landmark.key];
    if (tile && tile.revealed) {
      landmark.discovered = true;
      newlyFound.push(landmark);
    }
  }
  for (const landmark of newlyFound) {
    const def = landmarkDefById(landmark.id);
    if (!def) continue;
    log(`Discovery: ${def.name} has been found in the frontier at (${landmark.key}).`, 'ev');
    toast(`✦ Discovery found: ${def.name}`);
  }
  return newlyFound;
}

function mapLandmarkRewardText(landmark) {
  if (!landmark || !landmark.reward) return '';
  const parts = [];
  const gain = resourceBundleText(landmark.reward.gain || {}, { withNames:true, positive:true, separator:', ' });
  if (gain) parts.push(gain);
  if (landmark.reward.reveal > 0) parts.push(`reveals ${landmark.reward.reveal} nearby tile${landmark.reward.reveal > 1 ? 's' : ''}`);
  const bonus = resourceBundleText(landmark.reward.bonus || {}, { withNames:true, positive:true, separator:', ' });
  if (bonus) parts.push(`permanent route bonus ${bonus}/s`);
  return parts.join(' · ');
}

function seededRng(seed) {
  let s = ((seed ^ 0xdeadbeef) >>> 0) || 1;
  return () => {
    s ^= s << 13; s ^= s >> 17; s ^= s << 5;
    return ((s >>> 0) / 0x100000000);
  };
}

function generateMap(seed) {
  const rng = seededRng(seed);
  const tiles = {};
  for (let x = 0; x < MAP_W; x++) {
    for (let y = 0; y < MAP_H; y++) {
      const key = `${x},${y}`;
      const isColony = (x === MAP_COL_X && y === MAP_COL_Y);
      const dx = x - MAP_COL_X;
      const dy = (y - MAP_COL_Y) * 1.35;
      const dist = Math.sqrt(dx * dx + dy * dy);
      let type;
      if (isColony) {
        type = 'colony';
      } else {
        const r = rng();
        if (dist <= 1.5) {
          type = r < 0.55 ? 'plains' : r < 0.8 ? 'thicket' : 'fungal';
        } else if (dist <= 3.2) {
          type = r < 0.28 ? 'plains' : r < 0.52 ? 'thicket' : r < 0.68 ? 'chitin' : r < 0.84 ? 'fungal' : 'ruins';
        } else if (dist <= 5.5) {
          type = r < 0.16 ? 'plains' : r < 0.32 ? 'thicket' : r < 0.46 ? 'chitin' : r < 0.58 ? 'ruins' : r < 0.68 ? 'fungal' : r < 0.78 ? 'hazard' : r < 0.9 ? 'silk' : 'spring';
        } else if (dist <= 8.5) {
          type = r < 0.08 ? 'plains' : r < 0.2 ? 'chitin' : r < 0.36 ? 'ruins' : r < 0.5 ? 'hazard' : r < 0.64 ? 'silk' : r < 0.78 ? 'spring' : 'sky';
        } else {
          type = r < 0.22 ? 'ruins' : r < 0.42 ? 'hazard' : r < 0.62 ? 'sky' : r < 0.82 ? 'silk' : 'spring';
        }
      }
      const startRevealed = isColony || dist <= 1.25;
      tiles[key] = { type, revealed: startRevealed, claimed: false };
    }
  }
  return { seed, tiles, bonus: {}, landmarks: generateMapLandmarksForTiles(tiles, seed) };
}

function initMapIfNeeded() {
  if (!G.map || !G.map.tiles) {
    const seed = ((G.time.year * 17 + (G.meta.launches || 0) * 113 + 7777) & 0xffffff);
    G.map = generateMap(seed);
  }
  ensureMapLandmarks(G);
  discoverMapLandmarks(G);
}

function applyMapBonus(bonus) {
  if (!bonus) return;
  if (!G.map.bonus) G.map.bonus = {};
  for (const [res, val] of Object.entries(bonus)) {
    G.map.bonus[res] = (G.map.bonus[res] || 0) + val;
  }
}

function revealMapTiles(zoneId) {
  initMapIfNeeded();
  const region = EXP_ZONE_REGIONS[zoneId];
  if (!region) return;
  const { cx, cy, radius, count } = region;

  // Reveal path tiles (line from colony to region center)
  const steps = Math.ceil(Math.sqrt((cx - MAP_COL_X) ** 2 + (cy - MAP_COL_Y) ** 2));
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    const px = Math.round(MAP_COL_X + (cx - MAP_COL_X) * t);
    const py = Math.round(MAP_COL_Y + (cy - MAP_COL_Y) * t);
    if (px >= 0 && px < MAP_W && py >= 0 && py < MAP_H) {
      const pk = `${px},${py}`;
      const pathTile = G.map.tiles[pk];
      if (pathTile && !pathTile.revealed) {
        pathTile.revealed = true;
        const ptd = MAP_TILE_DEFS[pathTile.type];
        if (ptd && ptd.bonus) applyMapBonus(ptd.bonus);
      }
    }
  }

  // Reveal cluster of tiles around the region center
  const candidates = [];
  for (let x = 0; x < MAP_W; x++) {
    for (let y = 0; y < MAP_H; y++) {
      const key = `${x},${y}`;
      const tile = G.map.tiles[key];
      if (!tile || tile.revealed) continue;
      const dx = x - cx, dy = (y - cy) * 1.35;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d <= radius) candidates.push({ key, d });
    }
  }
  candidates.sort((a, b) => a.d - b.d);

  let revealed = 0;
  for (const { key } of candidates) {
    if (revealed >= count) break;
    const tile = G.map.tiles[key];
    tile.revealed = true;
    const td = MAP_TILE_DEFS[tile.type];
    if (td && td.bonus) applyMapBonus(td.bonus);
    revealed++;
  }
  if (revealed > 0) {
    log(`Territory mapped: ${revealed} new tile${revealed > 1 ? 's' : ''} revealed.`);
    discoverMapLandmarks(G);
  }
}

function claimMapNode(key) {
  initMapIfNeeded();
  const tile = G.map && G.map.tiles && G.map.tiles[key];
  if (!tile || !tile.revealed || tile.claimed) { toast('Nothing to collect here', 'warn'); return; }
  const rivalBase = getRivalBaseSite(key);
  if (rivalBase && rivalBase.status === 'hostile') { toast('The route is still occupied by a rival nest', 'warn'); return; }
  if (!hasHatchedBug()) { toast(mapBugRequirementText(), 'warn'); return; }
  const def = MAP_TILE_DEFS[tile.type];
  if (!def || !def.loot) { toast('No collectible resources here', 'warn'); return; }
  const gained = [];
  for (const [res, amt] of Object.entries(def.loot)) {
    if (G.res[res] === undefined) continue;
    const added = Math.min(amt, maxRes(res) - (G.res[res] || 0));
    if (added > 0) { G.res[res] += added; G.vis[res] = true; gained.push(`${RES[res].icon}+${added} ${RES[res].name}`); }
  }
  tile.claimed = true;
  if (gained.length > 0) {
    log(`Map node collected: ${def.label} — ${gained.join(', ')}`);
    toast(`${def.label}: ${gained.map(g => g.split(' ').slice(0,2).join(' ')).join(' ')}`);
  } else {
    toast('Storage full — nothing collected', 'warn');
  }
  renderTab();
}

function mapClaimableCount() {
  if (!G.map || !G.map.tiles) return 0;
  return Object.entries(G.map.tiles).filter(([key, t]) => t.revealed && !t.claimed && MAP_TILE_DEFS[t.type] && MAP_TILE_DEFS[t.type].loot && !(getRivalBaseSite(key) && getRivalBaseSite(key).status === 'hostile')).length;
}

function mapRevealedCount() {
  if (!G.map || !G.map.tiles) return 0;
  return Object.values(G.map.tiles).filter(t => t.revealed).length;
}

function refreshMapLoot() {
  // On each new year, 40% of claimed loot tiles regrow (seasonal renewal)
  if (!G.map || !G.map.tiles) return;
  let refreshed = 0;
  for (const tile of Object.values(G.map.tiles)) {
    if (!tile.revealed || !tile.claimed) continue;
    const def = MAP_TILE_DEFS[tile.type];
    if (!def || !def.loot) continue;
    if (Math.random() < 0.22) {
      tile.claimed = false;
      refreshed++;
    }
  }
  if (refreshed > 0) {
    log(`The new year has renewed ${refreshed} map tile${refreshed > 1 ? 's' : ''} — resources have regrown.`, 'ev');
    toast(`${refreshed} map tile${refreshed > 1 ? 's' : ''} refreshed!`);
  }
}
