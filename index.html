<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Bug Colony</title>
<meta name="theme-color" content="#07110d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Bug Colony">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:         #07110d;
  --bg2:        #0b1712;
  --surface:    #10201b;
  --surface2:   #162b24;
  --surface3:   #1b352c;
  --surface4:   #223e34;
  --border:     #234238;
  --border2:    #31574a;
  --text:       #99b9a8;
  --text-hi:    #e4f1e8;
  --text-lo:    #648777;
  --accent:     #5ee58f;
  --accent-d:   #218f55;
  --accent-dd:  #123c28;
  --amber:      #ffc562;
  --amber-d:    #8a5b0f;
  --sky:        #78d7ff;
  --sky-d:      #1f6e98;
  --purple:     #b798ff;
  --purple-d:   #5b3bb2;
  --red:        #ff8b89;
  --orange:     #ff9f5a;
  --shadow:     0 10px 30px rgba(0,0,0,0.28);
  --glow:       0 0 0 1px rgba(94,229,143,0.15), 0 8px 22px rgba(94,229,143,0.08);
  --mono: 'Space Mono', monospace;
  --sans: 'DM Sans', sans-serif;
  --r: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  width: 100%;
  min-height: var(--app-height, 100dvh);
  height: var(--app-height, 100dvh);
  font-size: 14px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
}


/* ── TOP BAR ─────────────────────────────────── */
#top-bar {
  display: flex;
  align-items: center;
  padding: max(0px, env(safe-area-inset-top)) 10px 0;
  min-height: calc(42px + env(safe-area-inset-top));
  height: auto;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  gap: 5px;
  background: linear-gradient(180deg, rgba(27,53,44,0.95), rgba(16,32,27,0.98));
  box-shadow: var(--shadow);
}

/* Clickable stat chips */
#top-stats {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: 1;
  min-width: 0;
}
.ts-chip {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 3px 6px;
  background: rgba(0,0,0,0.25);
  border: 1px solid var(--border);
  border-radius: 5px;
  min-width: 36px;
  flex: 1;
  cursor: pointer;
  transition: border-color 0.15s, background 0.12s;
  user-select: none;
}
.ts-chip:hover  { border-color: var(--border2); background: rgba(0,0,0,0.4); }
.ts-chip:active { background: var(--surface2); }
.ts-val {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  color: var(--text-hi);
  line-height: 1;
}
.ts-lbl {
  font-size: 7.5px;
  color: var(--text-lo);
  letter-spacing: 0.5px;
  margin-top: 2px;
  text-transform: uppercase;
  white-space: nowrap;
}
.ts-chip.amber .ts-val { color: var(--amber); }
.ts-chip.sky   .ts-val { color: var(--sky);   }
.ts-chip.red   .ts-val { color: var(--red);   }
.ts-chip.purple .ts-val { color: var(--purple); }

/* Gather button — compact */
#gather-btn {
  --gather-fill: 0%;
  position: relative;
  overflow: hidden;
  background:
    linear-gradient(90deg, rgba(94,229,143,0.22) 0%, rgba(94,229,143,0.22) var(--gather-fill), rgba(94,229,143,0) var(--gather-fill), rgba(94,229,143,0) 100%),
    linear-gradient(180deg, var(--accent-d), var(--accent-dd));
  border: 1px solid rgba(94,229,143,0.35);
  color: var(--text-hi);
  font-family: var(--mono);
  font-size: 9px;
  padding: 0 10px;
  height: 26px;
  min-width: 68px;
  border-radius: var(--r);
  cursor: pointer;
  letter-spacing: 1px;
  font-weight: 700;
  transition: background 0.18s, transform 0.08s, box-shadow 0.2s, border-color 0.18s, color 0.18s, opacity 0.18s;
  white-space: nowrap;
  flex-shrink: 0;
  user-select: none;
  touch-action: manipulation;
  -webkit-touch-callout: none;
  box-shadow: var(--glow);
}
#gather-btn:active { background: linear-gradient(90deg, rgba(94,229,143,0.26) 0%, rgba(94,229,143,0.26) var(--gather-fill), rgba(94,229,143,0) var(--gather-fill), rgba(94,229,143,0) 100%), linear-gradient(180deg, var(--accent-d), var(--accent-dd)); transform: scale(0.96); }
#gather-btn:hover  { box-shadow: 0 0 0 1px rgba(94,229,143,0.3), 0 8px 20px rgba(94,229,143,0.13); }
#gather-btn.gather-ready {
  border-color: rgba(94,229,143,0.5);
  color: var(--text-hi);
  box-shadow: 0 0 0 1px rgba(94,229,143,0.22), 0 8px 22px rgba(94,229,143,0.12);
}
#gather-btn.gather-cooling {
  border-color: var(--border2);
  color: var(--text-lo);
  box-shadow: none;
}
#gather-btn:disabled {
  cursor: default;
  opacity: 0.96;
}
#gather-btn:disabled:active {
  transform: none;
}

/* ── STATS MODAL ──────────────────────────────── */
#stats-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  display: none;
  align-items: flex-start;
  justify-content: center;
  z-index: 1100;
  padding: 52px 12px 12px;
}
#stats-modal.open { display: flex; }
.stats-modal-card {
  width: min(100%, 420px);
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 12px;
  padding: 14px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.4);
  max-height: 80vh;
  overflow-y: auto;
}
.sm-title {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--text-lo);
  margin-bottom: 12px;
}
.sm-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-bottom: 12px;
}
.sm-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 9px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 7px;
}
.sm-ico { font-size: 14px; opacity: 0.8; }
.sm-body { flex: 1; min-width: 0; }
.sm-val {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
}
.sm-lbl { font-size: 9px; color: var(--text-lo); margin-top: 2px; }
.sm-item.amber .sm-val { color: var(--amber); }
.sm-item.sky   .sm-val { color: var(--sky); }
.sm-item.purple .sm-val { color: var(--purple); }
.sm-item.red   .sm-val { color: var(--red); }
.sm-divider {
  font-family: var(--mono);
  font-size: 8px;
  color: var(--text-lo);
  letter-spacing: 2px;
  margin: 10px 0 6px;
  border-top: 1px solid var(--border);
  padding-top: 8px;
}
.sm-close {
  display: block;
  width: 100%;
  margin-top: 12px;
  padding: 7px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text-lo);
  font-family: var(--mono);
  font-size: 9px;
  border-radius: 6px;
  cursor: pointer;
  letter-spacing: 1px;
}
.sm-close:hover { color: var(--text-hi); }

/* ── SEASON PROGRESS ──────────────────────────── */
#season-bar { height: 2px; background: var(--surface2); flex-shrink: 0; }
#season-fill { height: 100%; width: 0%; transition: width 0.15s linear; }

/* ── RESOURCES STRIP ─────────────────────────── */
#res-strip {
  display: flex;
  gap: 5px;
  padding: 6px 10px;
  overflow-x: auto;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  background: var(--surface);
}
#res-strip::-webkit-scrollbar { display: none; }

.rc {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 68px;
  padding: 5px 7px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r);
  flex-shrink: 0;
  transition: border-color 0.3s;
}
.rc.warn  { border-color: var(--amber-d); }
.rc.full  { border-color: #5a1010; }

.rc-name  { font-size: 9px; color: var(--text-lo); margin-bottom: 1px; white-space: nowrap; display: flex; align-items: center; justify-content: center; gap: 4px; }
.rc-icon  { font-size: 15px; line-height: 1; display: inline-block; transform: translateY(-0.5px); }
.rc-amt   { font-family: var(--mono); font-size: 12px; color: var(--text-hi); font-weight: 700; }
.rc-max   { font-family: var(--mono); font-size: 8px; color: var(--text-lo); }
.rc-rate  { font-family: var(--mono); font-size: 9px; margin-top: 1px; }
.rp { color: var(--accent); }
.rn { color: var(--red); }
.rz { color: var(--text-lo); }

/* ── MAIN LAYOUT ─────────────────────────────── */
#content {
  flex: 1;
  overflow-y: auto;
  padding: 10px 10px 10px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
#content::-webkit-scrollbar { width: 3px; }
#content::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ── BOTTOM NAV ──────────────────────────────── */
#bot-nav {
  display: flex;
  align-items: stretch;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  padding-bottom: max(0px, env(safe-area-inset-bottom));
  background: var(--surface);
}

.nb {
  flex: 1;
  padding: 8px 2px;
  background: transparent;
  border: none;
  color: var(--text-lo);
  font-family: var(--mono);
  font-size: 9px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  letter-spacing: 0.5px;
  transition: color 0.15s;
  user-select: none;
  position: relative;
  overflow: visible;
}
.nb.on {
  color: var(--text-hi);
  background: linear-gradient(180deg, rgba(94,229,143,0.15), rgba(94,229,143,0.04));
  box-shadow: inset 0 1px 0 rgba(94,229,143,0.14);
}
.nb.handoff {
  color: var(--text-hi);
  border-top: 1px solid rgba(120,215,255,0.18);
  background: linear-gradient(180deg, rgba(120,215,255,0.14), rgba(120,215,255,0.04));
  box-shadow: inset 0 1px 0 rgba(120,215,255,0.14);
  animation: nav-handoff-pulse 1.8s ease-in-out infinite;
}
@keyframes nav-handoff-pulse {
  0%,100% { box-shadow: inset 0 1px 0 rgba(120,215,255,0.12), 0 0 0 0 rgba(120,215,255,0); }
  50% { box-shadow: inset 0 1px 0 rgba(120,215,255,0.22), 0 0 0 1px rgba(120,215,255,0.12); }
}
.nb-ico { font-size: 15px; line-height: 1; }
.nb:hover { color: var(--text-hi); }

#bot-nav-pages {
  display: flex;
  flex: 1;
  min-width: 0;
}
.nav-page {
  display: flex;
  flex: 1;
  min-width: 0;
}
#nav-page-toggle {
  display: none;
  align-items: center;
  justify-content: center;
  width: 54px;
  background: transparent;
  border: none;
  border-left: 1px solid var(--border);
  color: var(--text-lo);
  cursor: pointer;
  flex-shrink: 0;
  user-select: none;
  position: relative;
}
#nav-page-toggle .nb-ico {
  font-size: 18px;
  line-height: 1;
}
#nav-page-toggle:hover { color: var(--text-hi); }
#nav-page-toggle.alt { background: linear-gradient(180deg, rgba(120,215,255,0.10), rgba(120,215,255,0.03)); }

/* Left back-arrow toggle (shown on page 2) */
#nav-page-toggle-left {
  display: none;
  align-items: center;
  justify-content: center;
  width: 54px;
  background: linear-gradient(180deg, rgba(120,215,255,0.10), rgba(120,215,255,0.03));
  border: none;
  border-right: 1px solid var(--border);
  color: var(--sky);
  cursor: pointer;
  flex-shrink: 0;
  user-select: none;
}
#nav-page-toggle-left .nb-ico { font-size: 18px; line-height: 1; }
#nav-page-toggle-left:hover { color: var(--text-hi); }

#bot-nav-pages .nav-page .nb[data-tab="achievements"],
#bot-nav-pages .nav-page .nb[data-tab="colony"],
#bot-nav-pages .nav-page .nb[data-tab="scouting"],
#bot-nav-pages .nav-page .nb[data-tab="map"],
#bot-nav-pages .nav-page .nb[data-tab="brood"] {
  padding-right: 18px;
}

button,
[role="button"],
.nb,
#nav-page-toggle,
#nav-page-toggle-left,
#bot-nav {
  touch-action: manipulation;
}

/* Badge on the nav toggle arrow */
#nav-page-toggle .toggle-badge {
  position: absolute;
  top: 8px;
  right: 7px;
  min-width: 14px;
  height: 14px;
  line-height: 14px;
  padding: 0 3px;
  border-radius: 8px;
  font-family: var(--mono);
  font-size: 8px;
  text-align: center;
  pointer-events: none;
  animation: badge-pop 0.25s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes badge-pop {
  0% { transform: scale(0); }
  100% { transform: scale(1); }
}

/* ── JUICE: Floating gather popup ──────────────── */
.gather-pop {
  position: fixed;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
  pointer-events: none;
  z-index: 2000;
  white-space: nowrap;
  text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  animation: gather-float 1.1s cubic-bezier(0.22,1,0.36,1) forwards;
}
.gather-pop.amber { color: var(--amber); }
.gather-pop.sky   { color: var(--sky); }
.gather-pop.multi { color: var(--text-hi); font-size: 10px; }
@keyframes gather-float {
  0%   { opacity: 1; transform: translateY(0) scale(1); }
  60%  { opacity: 1; transform: translateY(-28px) scale(1.05); }
  100% { opacity: 0; transform: translateY(-50px) scale(0.9); }
}

/* ── JUICE: Milestone burst overlay ─────────────── */
@keyframes milestone-ring {
  0%   { opacity: 0.7; transform: scale(0.6); }
  100% { opacity: 0;   transform: scale(2.2); }
}
.milestone-burst {
  position: fixed;
  border-radius: 50%;
  border: 2px solid var(--accent);
  pointer-events: none;
  z-index: 1999;
  animation: milestone-ring 0.55s ease-out forwards;
}

/* ── JUICE: Gather button punch ─────────────────── */
@keyframes gather-punch {
  0%   { transform: scale(1); }
  35%  { transform: scale(0.91); }
  70%  { transform: scale(1.06); }
  100% { transform: scale(1); }
}
.gather-punching { animation: gather-punch 0.22s ease; }

/* ── JUICE: Screen flash on big event ──────────── */
#juice-flash {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1998;
  opacity: 0;
}

/* ── JUICE: Hatch egg wiggle ──────────────────── */
@keyframes egg-wiggle {
  0%,100% { transform: rotate(0); }
  20%     { transform: rotate(-8deg); }
  40%     { transform: rotate(7deg); }
  60%     { transform: rotate(-5deg); }
  80%     { transform: rotate(4deg); }
}
.egg-wiggling { animation: egg-wiggle 0.5s ease; }

/* ── JUICE: Resource card flash ─────────────────── */
@keyframes res-gained {
  0%   { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(94,229,143,0.35); }
  100% { border-color: var(--border); box-shadow: none; }
}
.rc-gained { animation: res-gained 0.7s ease forwards; }

/* ── SECTION HEADER ──────────────────────────── */
.sh {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text-lo);
  letter-spacing: 2.5px;
  text-transform: uppercase;
  margin-bottom: 8px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--border);
}

/* ── BUILDING CARDS ──────────────────────────── */
.bc {
  background: linear-gradient(180deg, rgba(34,62,52,0.22), rgba(16,32,27,0.9));
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  border-radius: var(--r);
  padding: 9px 11px;
  margin-bottom: 7px;
  display: flex;
  align-items: center;
  gap: 9px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.1s;
  user-select: none;
}
.bc:active { background: var(--surface2); }
.bc.af   { border-color: var(--accent-d); }
.bc.af:hover { border-color: var(--accent); }
.bc.locked { opacity: 0.28; cursor: not-allowed; }

.bc-ico  { font-size: 18px; min-width: 24px; text-align: center; }
.bc-info { flex: 1; min-width: 0; }
.bc-name { font-weight: 600; color: var(--text-hi); font-size: 13px; margin-bottom: 2px; }
.bc-desc { font-size: 11px; color: var(--text-lo); line-height: 1.35; margin-bottom: 4px; }
.bc-cost { font-family: var(--mono); font-size: 9px; display: flex; flex-wrap: wrap; gap: 5px; }
.ci      { white-space: nowrap; }
.ci.ok   { color: var(--accent); }
.ci.no   { color: var(--red); }
.bc-cnt  { font-family: var(--mono); font-size: 20px; color: var(--accent); font-weight: 700; min-width: 24px; text-align: right; }

/* ── WORKER ROWS ─────────────────────────────── */
.wi {
  padding: 8px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.wi-ico  { font-size: 16px; min-width: 22px; }
.wi-info { flex: 1; }
.wi-name { font-weight: 600; color: var(--text-hi); font-size: 13px; }
.wi-desc { font-size: 10px; color: var(--text-lo); }
.wi-ctrl { display: flex; align-items: center; gap: 7px; }

.wb {
  width: 26px; height: 26px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text-hi);
  border-radius: 4px;
  cursor: pointer;
  font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.1s;
  font-family: var(--mono);
  user-select: none;
}
.wb:active { background: var(--accent-d); color: var(--accent); }

.wc { font-family: var(--mono); font-size: 15px; color: var(--accent); min-width: 26px; text-align: center; }

.idle-box {
  padding: 7px 11px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 10px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--amber);
}

/* ── TECH CARDS ──────────────────────────────── */
.tc {
  background: linear-gradient(180deg, rgba(34,62,52,0.22), rgba(16,32,27,0.9));
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  border-radius: var(--r);
  padding: 9px 11px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: border-color 0.15s;
  user-select: none;
}
.tc:active { background: var(--surface2); }
.tc.done   { border-color: var(--accent-d); opacity: 0.45; cursor: default; }
.tc.avail  { border-color: var(--accent-d); cursor: pointer; }
.tc.avail:hover { border-color: var(--accent); }
.tc.locked { opacity: 0.22; cursor: not-allowed; }

.tc-name { font-weight: 600; color: var(--text-hi); font-size: 13px; margin-bottom: 3px; }
.tc-desc { font-size: 11px; color: var(--text-lo); line-height: 1.35; margin-bottom: 5px; }
.tc-cost { font-family: var(--mono); font-size: 9px; display: flex; flex-wrap: wrap; gap: 5px; }
.tc-req  { font-size: 10px; color: var(--red); margin-bottom: 4px; }

.tier-label {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text-lo);
  letter-spacing: 2px;
  margin: 10px 0 6px;
}

/* ── CRAFT CARDS ─────────────────────────────── */
.cc {
  background: linear-gradient(180deg, rgba(34,62,52,0.22), rgba(16,32,27,0.9));
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  border-radius: var(--r);
  padding: 9px 11px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 9px;
  cursor: pointer;
  transition: border-color 0.15s;
  user-select: none;
}
.cc:active { background: var(--surface2); }
.cc.can   { border-color: var(--accent-d); }
.cc.can:hover { border-color: var(--accent); }
.cc.locked { opacity: 0.25; cursor: not-allowed; }

.cc-info  { flex: 1; }
.cc-name  { font-weight: 600; color: var(--text-hi); font-size: 13px; margin-bottom: 2px; }
.cc-desc  { font-size: 11px; color: var(--text-lo); margin-bottom: 4px; }
.cc-rec   { font-family: var(--mono); font-size: 9px; }

.craft-btn {
  padding: 5px 10px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--accent);
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 10px;
  cursor: pointer;
  white-space: nowrap;
  letter-spacing: 1px;
}

/* ── LOG ─────────────────────────────────────── */
.le {
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 9px;
  align-items: flex-start;
}
.le-t { font-family: var(--mono); font-size: 9px; color: var(--text-lo); white-space: nowrap; padding-top: 1px; min-width: 66px; }
.le-m { font-size: 11px; color: var(--text); line-height: 1.4; }

/* ── TRADE TAB ───────────────────────────────── */
.trade-row {
  background: linear-gradient(180deg, rgba(34,62,52,0.22), rgba(16,32,27,0.9));
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  border-radius: var(--r);
  padding: 9px 11px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 9px;
}
.trade-info { flex: 1; }
.trade-name { font-weight: 600; color: var(--text-hi); font-size: 13px; margin-bottom: 2px; }
.trade-desc { font-size: 10px; color: var(--text-lo); }
.trade-btn {
  padding: 5px 10px;
  background: var(--surface2);
  border: 1px solid var(--amber-d);
  color: var(--amber);
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 10px;
  cursor: pointer;
  white-space: nowrap;
}
.trade-btn:active { background: var(--amber-d); }
.trade-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── EVENTS/ALERTS ───────────────────────────── */
#toast-wrap {
  position: fixed;
  bottom: 58px;
  right: 10px;
  display: flex;
  flex-direction: column-reverse;
  gap: 5px;
  z-index: 999;
  pointer-events: none;
}
.toast {
  background: linear-gradient(180deg, rgba(27,53,44,0.98), rgba(16,32,27,0.98));
  border: 1px solid var(--border2);
  color: var(--accent);
  padding: 6px 11px;
  border-radius: var(--r);
  font-family: var(--mono);
  font-size: 10px;
  animation: t-in 0.2s ease, t-out 0.3s ease 2.5s forwards;
  max-width: 220px;
  box-shadow: var(--shadow);
}
.toast.warn { color: var(--amber); border-color: var(--amber-d); }
.toast.bad  { color: var(--red);   border-color: #5a1010; }

@keyframes t-in  { from { opacity:0; transform: translateX(16px); } to { opacity:1; transform:none; } }
@keyframes t-out { from { opacity:1; } to { opacity:0; } }

/* ── STATS STRIP (colony tab) ─────────────────── */
.stats-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 10px;
}
.ss-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  flex: 1;
  min-width: 100px;
}
.ss-ico {
  font-size: 13px;
  opacity: 0.7;
}
.ss-body { flex: 1; min-width: 0; }
.ss-val {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--accent);
  font-weight: 700;
  line-height: 1;
}
.ss-lbl {
  font-size: 9px;
  color: var(--text-lo);
  margin-top: 2px;
  letter-spacing: 0.3px;
}
.ss-item.amber .ss-val { color: var(--amber); }
.ss-item.sky   .ss-val { color: var(--sky); }
.ss-item.purple .ss-val { color: var(--purple); }
.ss-item.red   .ss-val { color: var(--red); }

/* ── MISC ────────────────────────────────────── */
.empty-hint { color: var(--text-lo); font-size: 12px; text-align: center; padding: 30px 20px; line-height: 1.6; }

.reset-link {
  display: block;
  margin: 16px auto 4px;
  background: none;
  border: 1px solid var(--border2);
  color: var(--text-lo);
  padding: 5px 16px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 9px;
  cursor: pointer;
  letter-spacing: 1.5px;
}
.reset-link:active { color: var(--red); border-color: var(--red); }

.save-link {
  display: inline-block;
  margin: 0 4px;
  background: none;
  border: 1px solid var(--border2);
  color: var(--text-lo);
  padding: 4px 10px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 9px;
  cursor: pointer;
  letter-spacing: 1px;
}
.save-link:active { color: var(--accent); border-color: var(--accent-d); }

.btn-row { text-align: center; margin-top: 14px; }

.history-action-panel {
  margin-top: 12px;
  padding: 11px 12px;
  background: linear-gradient(180deg, rgba(14,25,21,0.96), rgba(11,17,14,0.94));
  border: 1px solid var(--border2);
  border-radius: 10px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.18);
}
.history-action-title {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 1.8px;
  color: var(--sky);
  margin-bottom: 6px;
}
.history-action-copy {
  font-size: 11px;
  line-height: 1.5;
  color: var(--text);
  margin-bottom: 10px;
}
.history-action-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.history-action-row .save-link {
  margin: 0;
}

/* Milestone flash */
@keyframes flash {
  0%   { background: var(--accent-d); }
  100% { background: var(--surface); }
}
.flash { animation: flash 0.4s ease; }

/* ── SEASON ANNOUNCE MODAL ────────────────────── */
#season-announce-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1150;
  padding: 16px;
}
#season-announce-modal.open { display: flex; }
#feature-announce-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1160;
  padding: 16px;
}
#feature-announce-modal.open { display: flex; }
.season-announce-card {
  width: min(100%, 380px);
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 12px;
  padding: 16px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.4);
}
.sa-season-badge {
  display: inline-block;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 2px;
  padding: 2px 8px;
  border-radius: 999px;
  margin-bottom: 10px;
}
.sa-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-hi);
  margin-bottom: 8px;
  line-height: 1.2;
}
.sa-effects {
  display: flex;
  flex-direction: column;
  gap: 5px;
  margin-bottom: 10px;
}
.sa-effect-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 9px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 11px;
  color: var(--text);
}
.sa-effect-icon { font-size: 13px; min-width: 18px; }
.sa-tip {
  font-size: 10px;
  color: var(--text-lo);
  line-height: 1.45;
  margin-bottom: 12px;
  padding: 7px 9px;
  background: var(--surface2);
  border-radius: 6px;
}
.sa-dismiss {
  display: block;
  width: 100%;
  padding: 7px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text-lo);
  font-family: var(--mono);
  font-size: 9px;
  border-radius: 6px;
  cursor: pointer;
  letter-spacing: 1px;
}
.sa-dismiss:hover { color: var(--text-hi); }
.sa-next-step {
  font-size: 10px;
  color: var(--sky);
  line-height: 1.45;
  margin-bottom: 12px;
  padding: 8px 9px;
  background: rgba(120,215,255,0.07);
  border: 1px solid rgba(120,215,255,0.18);
  border-radius: 6px;
}
.sa-next-step strong { color: var(--text-hi); }
.sa-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.sa-actions .sa-dismiss {
  flex: 1 1 140px;
  margin-top: 0;
}
.sa-primary {
  background: linear-gradient(180deg, rgba(120,215,255,0.14), rgba(120,215,255,0.05));
}
.sa-primary:hover { color: var(--text-hi); }

::-webkit-scrollbar       { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ── STATUS BAR ─────────────────────────────────*/
#status-bar {
  height: 2px;
  background: var(--accent-dd);
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}
#status-bar::after {
  content: '';
  position: absolute;
  left: -40%;
  width: 40%;
  height: 100%;
  background: var(--accent);
  animation: scan 2s linear infinite;
  opacity: 0.5;
}
@keyframes scan { to { left: 140%; } }

/* ── TAB COUNT BADGES ────────────────────────── */
.badge {
  position: absolute;
  top: 6px;
  right: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--accent-d);
  color: var(--accent);
  font-family: var(--mono);
  font-size: 8px;
  border-radius: 999px;
  padding: 0 4px;
  min-width: 14px;
  text-align: center;
  line-height: 14px;
  height: 14px;
  z-index: 2;
  pointer-events: none;
  transform: translateZ(0);
}


/* ── MINI PROGRESS ───────────────────────────── */
.mini-progress {
  height: 6px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 99px;
  overflow: hidden;
  margin: 6px 0 5px;
}
.mini-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-d), var(--accent));
}

/* ── EVENT MODAL ─────────────────────────────── */
#event-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1200;
  padding: 16px;
}
.event-card {
  width: min(100%, 420px);
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 14px;
  box-shadow: 0 14px 40px rgba(0,0,0,0.35);
}
.event-title {
  font-family: var(--mono);
  color: var(--accent);
  font-size: 12px;
  letter-spacing: 1.5px;
  margin-bottom: 8px;
}
.event-msg {
  font-size: 12px;
  color: var(--text-hi);
  line-height: 1.5;
  margin-bottom: 12px;
}
.event-choices {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.event-choice {
  width: 100%;
  text-align: left;
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text-hi);
  border-radius: 8px;
  padding: 10px 12px;
  cursor: pointer;
}
.event-choice span {
  display: block;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--accent);
  margin-bottom: 4px;
}
.event-choice small {
  display: block;
  color: var(--text);
  font-size: 11px;
  line-height: 1.35;
}

/* ── ENDING MODAL ────────────────────────────── */
#ending-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.72);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1250;
  padding: 16px;
}
.ending-card {
  width: min(100%, 520px);
  background: linear-gradient(180deg, rgba(15,26,18,0.98), rgba(9,15,11,0.98));
  border: 1px solid var(--border2);
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 18px 46px rgba(0,0,0,0.45);
}
.ending-kicker {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--amber);
  margin-bottom: 8px;
}
.ending-title {
  font-size: 22px;
  line-height: 1.15;
  color: var(--text-hi);
  margin-bottom: 10px;
  font-weight: 700;
}
.ending-body {
  font-size: 12px;
  line-height: 1.7;
  color: var(--text);
  margin-bottom: 12px;
}
.ending-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin: 12px 0;
}
.ending-stat {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 9px;
}
.ending-stat strong {
  display: block;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--text-lo);
  margin-bottom: 4px;
}
.ending-stat span {
  color: var(--text-hi);
  font-size: 12px;
}
.ending-note {
  border-top: 1px solid var(--border);
  padding-top: 10px;
  margin-top: 10px;
  color: var(--sky);
  font-size: 11px;
  line-height: 1.5;
}
.ending-chip {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 6px;
  border-radius: 999px;
  border: 1px solid var(--border2);
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 1px;
  color: var(--sky);
  vertical-align: middle;
}


/* ── OFFLINE SUMMARY MODAL ───────────────────── */
#offline-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.72);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1240;
  padding: 16px;
}
#confirm-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.72);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1260;
  padding: 16px;
}

}
.confirm-msg {

}
.confirm-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 14px;
  flex-wrap: wrap;
}
.confirm-btn-danger {
  color: var(--red);

}
.confirm-btn-danger:active {
  color: var(--text-hi);

}
.offline-card {
  width: min(100%, 620px);
  max-height: min(86vh, 780px);
  overflow-y: auto;
  background: linear-gradient(180deg, rgba(14,23,17,0.98), rgba(8,13,10,0.98));
  border: 1px solid var(--border2);
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 18px 46px rgba(0,0,0,0.45);
}
.offline-kicker {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--sky);
  margin-bottom: 8px;
}
.offline-title {
  font-size: 22px;
  line-height: 1.15;
  color: var(--text-hi);
  margin-bottom: 10px;
  font-weight: 700;
}
.offline-body {
  font-size: 12px;
  line-height: 1.7;
  color: var(--text);
  margin-bottom: 12px;
}
.offline-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;

}
.offline-stat {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 9px;
}
.offline-stat strong {
  display: block;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--text-lo);
  margin-bottom: 4px;
}
.offline-stat span {
  color: var(--text-hi);
  font-size: 12px;
}
.offline-section {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.offline-section-title {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1.8px;
  color: var(--amber);
  margin-bottom: 8px;
}
.offline-list {
  display: grid;
  gap: 6px;
}
.offline-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;

  border-radius: 8px;

  display: grid;
  gap: 6px;
}
.offline-note {
  font-size: 11px;
  line-height: 1.55;

  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 9px;
}
.offline-note strong {
  color: var(--text-hi);
}
.offline-chip {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 6px;
  border-radius: 999px;
  border: 1px solid var(--border2);
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 1px;
  color: var(--sky);
  vertical-align: middle;

@media (max-width: 560px) {
  .offline-grid {
    grid-template-columns: 1fr 1fr;
  }
}

  --ending-accent: #6ee7b7;
  --ending-accent-2: #34d399;
  --ending-glow: rgba(52,211,153,0.22);
  --ending-ink: rgba(9,27,19,0.95);
}
.ending-theme-amber {
  --ending-accent: #fbbf24;
  --ending-accent-2: #fb923c;
  --ending-glow: rgba(251,146,60,0.20);
  --ending-ink: rgba(34,19,7,0.95);
}
.ending-theme-celestial {
  --ending-accent: #93c5fd;
  --ending-accent-2: #a78bfa;
  --ending-glow: rgba(147,197,253,0.22);
  --ending-ink: rgba(12,17,34,0.95);
}
.ending-theme-generic {
  --ending-accent: #9ca3af;
  --ending-accent-2: #6ee7b7;
  --ending-glow: rgba(110,231,183,0.14);
  --ending-ink: rgba(17,20,22,0.95);
}
.ending-banner {
  position: relative;
  overflow: hidden;
  margin-bottom: 12px;
  border-radius: 14px;
  border: 1px solid color-mix(in srgb, var(--ending-accent) 28%, var(--border2));
  background:
    radial-gradient(circle at 18% 18%, var(--ending-glow), transparent 36%),
    radial-gradient(circle at 82% 22%, color-mix(in srgb, var(--ending-accent-2) 18%, transparent), transparent 28%),
    linear-gradient(135deg, color-mix(in srgb, var(--ending-accent) 12%, var(--ending-ink)) 0%, color-mix(in srgb, var(--ending-accent-2) 8%, #0b1110) 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), 0 14px 36px rgba(0,0,0,0.22);
}
.ending-banner::before,
.ending-banner::after {
  content: '';
  position: absolute;
  inset: auto;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  filter: blur(18px);
  opacity: 0.22;
  pointer-events: none;
}
.ending-banner::before {
  top: -45px;
  right: -30px;
  background: color-mix(in srgb, var(--ending-accent) 46%, transparent);
}
.ending-banner::after {
  bottom: -65px;
  left: -30px;
  background: color-mix(in srgb, var(--ending-accent-2) 36%, transparent);
}
.ending-banner-inner {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 84px 1fr;
  gap: 12px;
  align-items: center;
  padding: 12px;
}
.ending-banner.compact .ending-banner-inner {
  grid-template-columns: 58px 1fr;
  gap: 10px;
  padding: 10px;
}
.ending-crest {
  width: 84px;
  height: 84px;
  border-radius: 18px;
  border: 1px solid color-mix(in srgb, var(--ending-accent) 45%, rgba(255,255,255,0.08));
  background:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,0.06), transparent 58%),
    linear-gradient(180deg, rgba(255,255,255,0.06), rgba(0,0,0,0.10));
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 0 26px rgba(255,255,255,0.02), 0 10px 24px rgba(0,0,0,0.16);
}
.ending-banner.compact .ending-crest {
  width: 58px;
  height: 58px;
  border-radius: 14px;
}
.ending-sigil {
  font-size: 34px;
  color: var(--ending-accent);
  text-shadow: 0 0 18px color-mix(in srgb, var(--ending-accent) 46%, transparent);
  line-height: 1;
}
.ending-banner.compact .ending-sigil {
  font-size: 24px;
}
.ending-banner-copy {
  min-width: 0;
}
.ending-banner-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 2.2px;
  color: var(--ending-accent);
  margin-bottom: 5px;
}
.ending-banner.compact .ending-banner-label {
  font-size: 9px;
  margin-bottom: 3px;
}
.ending-banner-title {
  color: var(--text-hi);
  font-size: 15px;
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 4px;
}
.ending-banner.compact .ending-banner-title {
  font-size: 13px;
}
.ending-banner-line {
  color: var(--text);
  font-size: 11px;
  line-height: 1.5;
}
.ending-banner.compact .ending-banner-line {
  font-size: 10px;
}
.ending-runes {
  display: flex;
  gap: 6px;
  margin-top: 7px;
  flex-wrap: wrap;
}
.ending-rune {
  padding: 1px 6px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--ending-accent) 28%, var(--border));
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 1px;
  color: color-mix(in srgb, var(--ending-accent) 82%, white 8%);
  background: rgba(255,255,255,0.03);
}
.ending-banner.compact .ending-runes {
  margin-top: 5px;
  gap: 4px;
}
.ending-banner.compact .ending-rune {
  font-size: 7px;
  padding: 1px 5px;
}


/* ── ONBOARDING / CAPSTONES ─────────────────── */
.tutorial-card {
  background: linear-gradient(135deg, rgba(31,110,152,0.14), rgba(94,229,143,0.08));
  border: 1px solid rgba(120,215,255,0.22);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
}
.tutorial-title {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1.6px;
  color: var(--sky);
  margin-bottom: 8px;
}
.checklist {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.check-item {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  font-size: 11px;
  color: var(--text);
}
.check-mark {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 1px solid var(--border2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-family: var(--mono);
  font-size: 10px;
  background: rgba(6,11,8,0.3);
}
.check-item.done .check-mark {
  background: rgba(94,229,143,0.16);
  border-color: rgba(94,229,143,0.4);
  color: var(--accent);
}
.check-item.done .check-copy { color: var(--text-hi); }
.onboard-note {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid rgba(120,215,255,0.12);
  font-size: 10px;
  color: var(--text-lo);
  line-height: 1.45;
}
.tutorial-actions {
  display: flex;
  justify-content: flex-end;
  margin-top: 10px;
}
.tutorial-dismiss {
  border-color: rgba(120,215,255,0.22);
  color: var(--sky);
}
.tutorial-dismiss:active {
  border-color: var(--sky);
  color: var(--text-hi);
}
.capstone-chip {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 6px;
  border-radius: 999px;
  background: rgba(183,152,255,0.14);
  color: var(--purple);
  font-size: 8px;
  letter-spacing: 1px;
  font-family: var(--mono);
  vertical-align: middle;
}
.capstone-active {
  border-color: rgba(183,152,255,0.4) !important;
  box-shadow: 0 0 0 1px rgba(183,152,255,0.16), 0 10px 26px rgba(91,59,178,0.14);
}
.notice-panel {
  padding: 9px 11px;
  border: 1px solid rgba(255,197,98,0.22);
  background: linear-gradient(180deg, rgba(138,91,15,0.13), rgba(16,32,27,0.9));
  border-radius: var(--r);
  color: var(--amber);
  font-size: 10px;
  margin-bottom: 10px;
}
.keyline {
  color: var(--text-hi);
}
.lineage-chip {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 6px;
  border-radius: 999px;
  background: rgba(94,229,143,0.12);
  color: var(--accent);
  font-size: 8px;
  letter-spacing: 0.9px;
  font-family: var(--mono);
  vertical-align: middle;
}
.lineage-panel {
  border-color: rgba(94,229,143,0.18);
  background: linear-gradient(180deg, rgba(18,31,26,0.98), rgba(9,15,12,0.96));
}
.lineage-panel .guide-title {
  color: var(--accent);
}
.lineage-panel .soft-note {
  color: #9bd8b1;
}

/* ── CONTEXT GUIDES ─────────────────────────── */
.guide-panel {
  background: linear-gradient(180deg, rgba(14,25,21,0.96), rgba(11,17,14,0.94));
  border: 1px solid rgba(120,215,255,0.14);
  border-radius: 10px;
  padding: 10px 11px;
  margin-bottom: 10px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.18);
}
.guide-title {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1.4px;
  color: var(--sky);
  margin-bottom: 7px;
}
.guide-copy {
  font-size: 11px;
  line-height: 1.5;
  color: var(--text);
}
.guide-copy + .guide-copy { margin-top: 6px; }
.guide-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  margin-top: 8px;
}
.guide-item {
  padding: 8px 9px;
  border: 1px solid rgba(43,71,58,0.9);
  background: rgba(8,13,11,0.55);
  border-radius: 8px;
}
.guide-item strong {
  display: block;
  color: var(--text-hi);
  font-size: 11px;
  margin-bottom: 3px;
}
.soft-note {
  margin-top: 8px;
  font-size: 10px;
  line-height: 1.45;
  color: var(--text-lo);
}


/* ── STRATEGIC / REACTION PANELS ───────────── */
.readout-panel {
  background: linear-gradient(180deg, rgba(14,25,21,0.96), rgba(11,17,14,0.94));
  border: 1px solid rgba(120,215,255,0.16);
  border-radius: 10px;
  padding: 10px 11px;
  margin-bottom: 10px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.18);
}
.readout-panel.readout-frontier {
  border-color: rgba(255,139,137,0.18);
  background: linear-gradient(180deg, rgba(24,17,18,0.96), rgba(11,17,14,0.94));
}
.readout-title {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1.5px;
  color: var(--sky);
  margin-bottom: 6px;
}
.readout-frontier .readout-title { color: var(--red); }
.readout-sub {
  font-size: 10px;
  line-height: 1.45;
  color: var(--text-lo);
  margin-bottom: 8px;
}
.readout-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
}
.readout-card {
  padding: 8px 9px;
  border: 1px solid var(--border);
  background: rgba(8,13,11,0.55);
  border-radius: 8px;
}
.readout-card.sky {
  border-color: rgba(120,215,255,0.18);
  background: linear-gradient(180deg, rgba(16,37,44,0.34), rgba(8,13,11,0.55));
}
.readout-card.amber {
  border-color: rgba(255,197,98,0.18);
  background: linear-gradient(180deg, rgba(42,28,8,0.32), rgba(8,13,11,0.55));
}
.readout-card.red {
  border-color: rgba(255,139,137,0.22);
  background: linear-gradient(180deg, rgba(52,18,18,0.34), rgba(8,13,11,0.55));
}
.readout-card.purple {
  border-color: rgba(183,152,255,0.20);
  background: linear-gradient(180deg, rgba(35,22,52,0.34), rgba(8,13,11,0.55));
}
.readout-kicker {
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.readout-card.sky .readout-kicker { color: var(--sky); }
.readout-card.amber .readout-kicker { color: var(--amber); }
.readout-card.red .readout-kicker { color: var(--red); }
.readout-card.purple .readout-kicker { color: var(--purple); }
.readout-headline {
  display: block;
  color: var(--text-hi);
  font-size: 11px;
  line-height: 1.35;
  margin-bottom: 3px;
}
.readout-body {
  font-size: 10px;
  line-height: 1.45;
  color: var(--text);
}
.readout-action {
  margin-top: 5px;
  font-size: 9px;
  line-height: 1.45;
  color: var(--text-lo);
}
.readout-action strong {
  color: var(--text-hi);
  font-weight: 600;
}


.lineage-quests {
  display: grid;
  gap: 8px;
  margin-bottom: 10px;
}
.quest-card {
  background: linear-gradient(180deg, rgba(18,32,27,0.96), rgba(12,22,18,0.96));
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 10px 12px;
  box-shadow: 0 8px 18px rgba(0,0,0,0.18);
}
.quest-card.done {
  border-color: var(--accent-d);
  background: linear-gradient(180deg, rgba(15,40,26,0.96), rgba(10,24,17,0.96));
}
.quest-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:4px;
}
.quest-title {
  color: var(--text-hi);
  font-weight: 700;
  font-size: 12px;
}
.quest-status {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--amber);
  letter-spacing: 1px;
}
.quest-card.done .quest-status {
  color: var(--accent);
}
.quest-copy {
  color: var(--text);
  font-size: 11px;
  line-height: 1.45;
  margin-bottom: 6px;
}
.quest-reward {
  color: var(--amber);
  font-size: 10px;
  line-height: 1.45;
  margin-top: 6px;
}
.quest-card.done .quest-reward {
  color: var(--accent);
}
.brood-lock-hint {
  margin-top: 8px;
  padding: 8px 9px;
  border-radius: 8px;
  border: 1px solid rgba(120,215,255,0.14);
  background: rgba(120,215,255,0.05);
}
.brood-lock-kicker {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 1px;
  color: var(--sky);
  margin-bottom: 5px;
}
.brood-lock-next {
  font-size: 10px;
  line-height: 1.45;
  color: var(--text-lo);
  margin-top: 5px;
}
.brood-lock-bar {
  margin: 0;
  height: 5px;
  opacity: 0.85;
}



/* ── RESPONSIVE TOUCH / MOBILE PASS ─────────── */
@media (max-width: 860px) {
  html {
    height: -webkit-fill-available;
  }

  body {
    min-height: var(--app-height, 100svh);
    height: var(--app-height, 100svh);
    font-size: 15px;
  }

  #top-bar {
    min-height: calc(48px + env(safe-area-inset-top));
    padding-left: max(10px, env(safe-area-inset-left));
    padding-right: max(10px, env(safe-area-inset-right));
  }

  #res-strip,
  #content {
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
  }

  #content {
    padding-bottom: 12px;
  }

  #bot-nav {
    padding-bottom: max(0px, env(safe-area-inset-bottom));
  }

  .nb {
    min-height: 58px;
    padding: 10px 4px 12px;
    font-size: 10px;
    gap: 4px;
  }

  .nb-ico {
    font-size: 18px;
  }

  #gather-btn {
    min-height: 34px;
    padding: 0 12px;
    font-size: 10px;
    border-radius: 8px;
  }

  .wb,
  .save-link,
  .craft-btn,
  .trade-btn,
  .event-choice {
    min-height: 40px;
  }

  .wb {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    font-size: 18px;
  }

  .wc {
    min-width: 32px;
    font-size: 17px;
  }

  .save-link,
  .craft-btn,
  .trade-btn {
    padding: 8px 12px;
    font-size: 11px;
  }

  .history-action-panel {
    border-radius: 12px;
    padding: 12px;
  }

  .bc,
  .tc,
  .cc,
  .trade-row,
  .wi,
  .guide-panel,
  .tutorial-card,
  .notice-panel,
  .lineage-panel,
  .quest-card,
  .idle-box,
  .stat-card {
    border-radius: 12px;
  }

  .bc,
  .tc,
  .cc,
  .trade-row,
  .wi,
  .guide-panel,
  .tutorial-card,
  .notice-panel,
  .lineage-panel,
  .quest-card {
    padding: 12px;
  }

  .bc-name,
  .wi-name,
  .tc-name,
  .cc-name,
  .trade-name {
    font-size: 14px;
  }

  .bc-desc,
  .tc-desc,
  .cc-desc,
  .trade-desc,
  .guide-copy {
    font-size: 12px;
    line-height: 1.5;
  }

  .bc-cost,
  .tc-cost,
  .cc-rec,
  .soft-note {
    font-size: 10px;
  }

  .event-card,
  .ending-card,
  .offline-card,
  .confirm-card {
    width: min(100%, 640px);
    max-height: min(88dvh, 820px);
    border-radius: 16px;
    padding: 18px;
  }

  #event-modal,
  #ending-modal,
  #offline-modal,
  #confirm-modal,
  #feature-announce-modal {
    padding:
      max(14px, env(safe-area-inset-top))
      max(12px, env(safe-area-inset-right))
      max(14px, env(safe-area-inset-bottom))
      max(12px, env(safe-area-inset-left));
  }

  .ending-banner-inner {
    grid-template-columns: 72px 1fr;
  }

  .ending-crest {
    width: 72px;
    height: 72px;
  }

  .ending-sigil {
    font-size: 30px;
  }


  #bot-nav {
    display: flex;
    align-items: stretch;
  }

  #bot-nav-pages {
    flex: 1;
    min-width: 0;
  }

  .nav-page {
    display: none;
    width: 100%;
    grid-template-columns: repeat(5, minmax(0, 1fr));
  }

  .nav-page.active {
    display: grid;
  }

  .nav-page .nb {
    min-width: 0;
    width: 100%;
  }

  #nav-page-toggle {
    display: flex;
    min-height: 58px;
    padding: 10px 8px 12px;
  }
}

@media (max-width: 560px) {
  #top-bar {
    gap: 4px;
    padding-top: max(0px, env(safe-area-inset-top));
    padding-left: max(8px, env(safe-area-inset-left));
    padding-right: max(8px, env(safe-area-inset-right));
    padding-bottom: 0;
    min-height: calc(44px + env(safe-area-inset-top));
  }

  #top-stats {
    gap: 3px;
  }

  .ts-chip {
    min-width: 28px;
    padding: 3px 4px;
  }

  .ts-val { font-size: 11px; }
  .ts-lbl { font-size: 6.5px; }

  #gather-btn {
    min-width: 60px;
    padding: 0 8px;
    font-size: 9px;
  }

  #res-strip {
    gap: 7px;
    padding-top: 8px;
    padding-bottom: 8px;
  }

  .rc {
    min-width: 82px;
    padding: 7px 8px;
  }

  .rc-name {
    font-size: 10px;
    gap: 5px;
  }

  .rc-icon {
    font-size: 17px;
  }

  .rc-amt {
    font-size: 13px;
  }

  .rc-rate {
    font-size: 10px;
  }

  .nb {
    min-height: 60px;
    font-size: 9px;
    letter-spacing: 0.3px;
  }

  .badge {
    top: 6px;
    right: 6px;
  }

  #nav-page-toggle {
    min-height: 60px;
    width: 52px;
    padding: 10px 6px 12px;
  }

  #nav-page-toggle-left {
    min-height: 60px;
    width: 52px;
    padding: 10px 6px 12px;
  }


  .stats-strip {
    gap: 4px;
  }
  .ss-item {
    min-width: 80px;
    padding: 7px 9px;
  }

  .trade-row,
  .cc,
  .bc,
  .wi {
    align-items: flex-start;
  }

  .trade-row {
    flex-wrap: wrap;
  }

  .trade-btn,
  .craft-btn {
    width: 100%;
    justify-content: center;
    text-align: center;
  }

  .history-action-row {
    flex-direction: column;
  }

  .history-action-row .save-link {
    width: 100%;
    text-align: center;
    margin: 0;
  }

  .event-card,
  .ending-card,
  .offline-card,
  .confirm-card {
    padding: 15px;
  }

  .offline-grid,
  .ending-grid {
    grid-template-columns: 1fr;
  }

  .ending-banner-inner {
    grid-template-columns: 1fr;
  }

  .ending-crest {
    width: 64px;
    height: 64px;
  }

  .ending-sigil {
    font-size: 26px;
  }

  .guide-grid {
    gap: 6px;
  }
}

/* ── COLONY CANVAS ──────────────────────────── */
#colony-canvas-wrap {
  position: relative;
  width: 100%;
  height: 160px;
  border-radius: var(--r);
  overflow: hidden;
  margin-bottom: 10px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  touch-action: none;
}
#colony-canvas {
  display: block;
  width: 100%;
  height: 100%;
}
#colony-overlay {
  position: absolute;
  bottom: 7px;
  left: 9px;
  font-family: var(--mono);
  font-size: 10px;
  color: rgba(228,241,232,0.65);
  pointer-events: none;
  letter-spacing: 1.2px;
  text-shadow: 0 1px 4px rgba(0,0,0,0.6);
}

/* ── INLINE LOG FEED ─────────────────────────── */
#colony-log-feed {
  margin-bottom: 10px;
  border: 1px solid var(--border);
  border-radius: var(--r);
  background: var(--bg);
  overflow: hidden;
}
.clf-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 9px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.clf-title {
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 2px;
  color: var(--text-lo);
}
.clf-view-all {
  font-family: var(--mono);
  font-size: 8px;
  color: var(--accent);
  cursor: pointer;
  letter-spacing: 0.5px;
  background: none;
  border: none;
  padding: 0;
}
.clf-view-all:hover { color: var(--text-hi); }
.clf-entries {
  max-height: 88px;
  overflow-y: auto;
  scrollbar-width: none;
  padding: 3px 0;
}
.clf-entries::-webkit-scrollbar { display: none; }
.clf-entry {
  display: flex;
  gap: 8px;
  align-items: baseline;
  padding: 3px 9px;
}
.clf-entry.clf-new {
  animation: clf-flash 1.6s ease forwards;
}
@keyframes clf-flash {
  0%   { background: rgba(94,229,143,0.10); }
  100% { background: transparent; }
}
.clf-entry.bad .clf-m { color: var(--red); }
.clf-entry.ev  .clf-m { color: var(--sky); }
.clf-t {
  font-family: var(--mono);
  font-size: 8px;
  color: var(--text-lo);
  white-space: nowrap;
  flex-shrink: 0;
}
.clf-realtime {
  font-family: var(--mono);
  font-size: 8px;
  color: var(--accent);
  opacity: 0.6;
}
.clf-m {
  font-size: 10px;
  color: var(--text);
  line-height: 1.35;
}

/* ── EXPEDITION SYSTEM ──────────────────────── */
.exp-panel {
  background: linear-gradient(180deg, rgba(31,110,152,0.10), rgba(16,32,27,0.9));
  border: 1px solid rgba(120,215,255,0.18);
  border-radius: 10px;
  padding: 10px 11px;
  margin-bottom: 10px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.18);
}
.exp-title {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1.4px;
  color: var(--sky);
  margin-bottom: 7px;
}
.exp-slots {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 8px;
}
.exp-active {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 9px 11px;
}
.exp-active-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 4px;
}
.exp-active-name {
  font-weight: 600;
  color: var(--text-hi);
  font-size: 12px;
}
.exp-active-time {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--sky);

}
.exp-active-desc {
  font-size: 10px;
  color: var(--text-lo);

}
.exp-active-bugs {

  font-size: 9px;
  color: var(--amber);
  margin-bottom: 4px;
}
.exp-progress {

}
.exp-progress-fill {

  background: linear-gradient(90deg, var(--sky-d), var(--sky));

}
.exp-progress-fill.done {
  background: linear-gradient(90deg, var(--accent-d), var(--accent));
}
.exp-collect-btn {
  margin-top: 6px;
  padding: 5px 10px;
  background: var(--accent-dd);
  border: 1px solid var(--accent-d);
  color: var(--accent);
  border-radius: 6px;
  font-family: var(--mono);
  font-size: 10px;
  cursor: pointer;
  letter-spacing: 1px;
  width: 100%;
  text-align: center;
}
.exp-collect-btn:active { background: var(--accent-d); }
.exp-zone {
  background: linear-gradient(180deg, rgba(34,62,52,0.22), rgba(16,32,27,0.9));
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 11px;
  display: flex;
  align-items: center;
  gap: 9px;
  cursor: pointer;
  transition: border-color 0.15s;
  user-select: none;
}
.exp-zone:active { background: var(--surface2); }
.exp-zone.can { border-color: var(--sky-d); }
.exp-zone.can:hover { border-color: var(--sky); }
.exp-zone.locked { opacity: 0.30; cursor: not-allowed; }
.exp-zone-ico { font-size: 18px; min-width: 24px; text-align: center; }
.exp-zone-info { flex: 1; min-width: 0; }
.exp-zone-name { font-weight: 600; color: var(--text-hi); font-size: 12px; margin-bottom: 2px; }
.exp-zone-desc { font-size: 10px; color: var(--text-lo); line-height: 1.35; }
.exp-zone-meta { font-family: var(--mono); font-size: 9px; color: var(--sky); margin-top: 3px; }
.exp-zone-lock { font-size: 9px; color: var(--red); margin-top: 2px; }
.exp-reward-flash {
  animation: expFlash 0.6s ease;
}
@keyframes expFlash {
  0% { background: rgba(120,215,255,0.15); }
  100% { background: transparent; }
}

@media (max-width: 860px) {
  #colony-canvas-wrap { height: 140px; border-radius: 12px; }
  .exp-panel { border-radius: 12px; padding: 12px; }
  .exp-active { padding: 12px; border-radius: 10px; }
  .exp-zone { padding: 12px; border-radius: 10px; }
  .exp-collect-btn { min-height: 40px; font-size: 11px; border-radius: 8px; }
}

/* ── TERRITORY MAP ────────────────────────────── */
#map-canvas-wrap {
  position: relative;
  width: 100%;
  height: 252px;
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  touch-action: none;
  cursor: crosshair;
}
#map-canvas { display: block; width: 100%; height: 100%; }
#map-overlay {
  position: absolute;
  bottom: 7px;
  left: 9px;
  font-family: var(--mono);
  font-size: 9px;
  color: rgba(228,241,232,0.48);
  pointer-events: none;
  letter-spacing: 1.2px;
  text-shadow: 0 1px 4px rgba(0,0,0,0.7);
}
.map-node-detail {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--r);
  padding: 10px 12px;
  margin-bottom: 8px;
}
.map-node-title {
  font-weight: 700;
  color: var(--text-hi);
  font-size: 13px;
  margin-bottom: 3px;
}
.map-node-desc {
  font-size: 10px;
  color: var(--text-lo);
  line-height: 1.45;
  margin-bottom: 6px;
}
.map-node-loot {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--accent);
  margin-bottom: 6px;
}
.map-claim-btn {
  padding: 5px 10px;
  background: var(--accent-dd);
  border: 1px solid var(--accent-d);
  color: var(--accent);
  border-radius: 5px;
  font-family: var(--mono);
  font-size: 10px;
  cursor: pointer;
  letter-spacing: 1px;
  min-height: 30px;
}
.map-claim-btn:active { background: var(--accent-d); }
.map-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 8px;
}
.map-leg-item {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 3px 7px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 9px;
  color: var(--text-lo);
  font-family: var(--mono);
  letter-spacing: 0.4px;
}
.map-leg-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.map-traits {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
  margin: 8px 0;
}
.map-trait {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 7px 8px;
}
.map-trait strong {
  display: block;
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 1px;
  color: var(--text-lo);
  margin-bottom: 3px;
}
.map-trait span {
  color: var(--text-hi);
  font-size: 11px;
  line-height: 1.4;
}
.map-trait.map-trait-danger {
  background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(0,0,0,0.10));
}
.danger-line {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.danger-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.5px;
  white-space: nowrap;
}
.danger-label.danger-low { color: var(--accent); }
.danger-label.danger-medium { color: var(--amber); }
.danger-label.danger-high { color: var(--red); }
.danger-label.danger-very-high { color: var(--purple); }
.danger-meter {
  flex: 1;
  min-width: 84px;
}
.danger-meter-track {
  position: relative;
  height: 8px;
  border-radius: 999px;
  overflow: hidden;
  background: linear-gradient(180deg, rgba(6,11,8,0.85), rgba(12,22,17,0.85));
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.35);
}
.danger-meter-track::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image: linear-gradient(90deg, transparent 19%, rgba(255,255,255,0.08) 19%, rgba(255,255,255,0.08) 21%, transparent 21%, transparent 39%, rgba(255,255,255,0.08) 39%, rgba(255,255,255,0.08) 41%, transparent 41%, transparent 59%, rgba(255,255,255,0.08) 59%, rgba(255,255,255,0.08) 61%, transparent 61%, transparent 79%, rgba(255,255,255,0.08) 79%, rgba(255,255,255,0.08) 81%, transparent 81%);
  pointer-events: none;
}
.danger-meter-fill {
  position: relative;
  height: 100%;
  border-radius: 999px;
  transition: width 0.25s ease;
}
.danger-meter-fill.danger-low {
  background: linear-gradient(90deg, rgba(33,143,85,0.95), rgba(94,229,143,0.95));
  box-shadow: 0 0 12px rgba(94,229,143,0.18);
}
.danger-meter-fill.danger-medium {
  background: linear-gradient(90deg, rgba(138,91,15,0.95), rgba(255,197,98,0.95));
  box-shadow: 0 0 12px rgba(255,197,98,0.18);
}
.danger-meter-fill.danger-high {
  background: linear-gradient(90deg, rgba(120,18,22,0.95), rgba(255,139,137,0.95));
  box-shadow: 0 0 12px rgba(255,139,137,0.18);
}
.danger-meter-fill.danger-very-high {
  background: linear-gradient(90deg, rgba(91,59,178,0.96), rgba(255,139,137,0.92));
  box-shadow: 0 0 14px rgba(183,152,255,0.22);
}
.danger-meter-caption {
  display: block;
  margin-top: 4px;
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.8px;
  color: var(--text-lo);
}
.map-note {
  margin-top: 7px;
  padding: 7px 8px;
  border-radius: 7px;
  border: 1px solid rgba(120,215,255,0.16);
  background: rgba(120,215,255,0.06);
  font-size: 10px;
  line-height: 1.45;
  color: var(--text);
}
.map-note strong { color: var(--text-hi); }
.route-pull {
  margin-top: 5px;
  font-size: 9px;
  line-height: 1.45;
  color: var(--sky);
}
.territory-influence {
  margin-top: 4px;
  font-size: 9px;
  line-height: 1.45;
  color: var(--amber);
}
.territory-influence.negative {
  color: var(--red);
}
@media (max-width: 860px) {
  #map-canvas-wrap { height: 210px; border-radius: 12px; }
  .map-claim-btn { min-height: 40px; font-size: 11px; }
  .map-node-detail { border-radius: 12px; padding: 12px; }
}

/* ── SEASONAL CHALLENGE ─────────────────────── */
.sc-panel {
  position: relative;
  overflow: hidden;
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 10px;
  border: 1px solid var(--border2);
  box-shadow: 0 8px 20px rgba(0,0,0,0.18);
}
.sc-panel.spring {
  background: linear-gradient(135deg, rgba(34,197,94,0.10), rgba(16,32,27,0.92));
  border-color: rgba(34,197,94,0.22);
}
.sc-panel.summer {
  background: linear-gradient(135deg, rgba(245,158,11,0.10), rgba(32,24,12,0.92));
  border-color: rgba(245,158,11,0.22);
}
.sc-panel.autumn {
  background: linear-gradient(135deg, rgba(251,146,60,0.10), rgba(28,18,10,0.92));
  border-color: rgba(251,146,60,0.22);
}
.sc-panel.winter {
  background: linear-gradient(135deg, rgba(96,165,250,0.10), rgba(12,18,28,0.92));
  border-color: rgba(96,165,250,0.22);
}
.sc-panel.done {
  border-color: var(--accent-d);
}
.sc-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 5px;
}
.sc-title {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1.4px;
}
.sc-panel.spring .sc-title { color: #22c55e; }
.sc-panel.summer .sc-title { color: #f59e0b; }
.sc-panel.autumn .sc-title { color: #fb923c; }
.sc-panel.winter .sc-title { color: #60a5fa; }
.sc-panel.done .sc-title   { color: var(--accent); }
.sc-status {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.8px;
  color: var(--text-lo);
}
.sc-panel.done .sc-status { color: var(--accent); }
.sc-desc {
  font-size: 11px;
  color: var(--text-hi);
  line-height: 1.45;
  margin-bottom: 5px;
}
.sc-reward-line {
  font-size: 10px;
  color: var(--amber);
  margin-bottom: 5px;
}
.sc-panel.done .sc-reward-line { color: var(--accent); }
.sc-progress {
  height: 6px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 99px;
  overflow: hidden;
}
.sc-progress-fill {
  height: 100%;
  border-radius: 99px;
  transition: width 0.4s ease;
}
.sc-panel.spring .sc-progress-fill { background: linear-gradient(90deg, #166534, #22c55e); }
.sc-panel.summer .sc-progress-fill { background: linear-gradient(90deg, #92400e, #f59e0b); }
.sc-panel.autumn .sc-progress-fill { background: linear-gradient(90deg, #9a3412, #fb923c); }
.sc-panel.winter .sc-progress-fill { background: linear-gradient(90deg, #1e40af, #60a5fa); }
.sc-panel.done .sc-progress-fill   { background: linear-gradient(90deg, var(--accent-d), var(--accent)); }
.sc-days {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text-lo);
  margin-top: 4px;
  display: flex;
  justify-content: space-between;
}
@media (max-width: 860px) {
  .sc-panel { border-radius: 12px; padding: 12px; }
}

/* ── SCOUTING / DANGEROUS TERRITORY ─────────── */
.fighter-card {
  background: linear-gradient(180deg, rgba(34,62,52,0.22), rgba(16,32,27,0.9));
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 9px 11px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 9px;
  transition: border-color 0.15s;
}
.fighter-card.scouting  { border-color: var(--sky-d); }
.fighter-card.escorting { border-color: var(--purple-d); }
.fighter-card.recovering { border-color: var(--amber-d); }
.fighter-card.ready     { border-color: var(--accent-d); }

.fighter-ico  { font-size: 16px; min-width: 22px; text-align: center; }
.fighter-info { flex: 1; min-width: 0; }
.fighter-name { font-weight: 700; color: var(--text-hi); font-size: 13px; margin-bottom: 1px; }
.fighter-meta { font-size: 10px; color: var(--text-lo); }
.fighter-hp   { font-family: var(--mono); font-size: 9px; margin-top: 3px; }

.hp-bar {
  height: 5px;
  background: var(--surface2);
  border-radius: 99px;
  overflow: hidden;
  margin-top: 2px;
  border: 1px solid var(--border);
}
.hp-fill {
  height: 100%;
  border-radius: 99px;
  transition: width 0.4s ease;
}

.zone-card {
  background: linear-gradient(180deg, rgba(34,62,52,0.22), rgba(16,32,27,0.9));
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 9px 11px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: border-color 0.15s;
  user-select: none;
}
.zone-card.can   { border-color: var(--accent-d); }
.zone-card.can:hover { border-color: var(--accent); }
.zone-card.locked { opacity: 0.25; cursor: not-allowed; }
.zone-card.active { border-color: var(--sky-d); opacity: 0.55; cursor: default; }
.zone-card.boss  { border-color: var(--purple-d); }
.zone-card.boss.can  { border-color: var(--purple); }

.zone-head  { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
.zone-ico   { font-size: 16px; min-width: 22px; }
.zone-title { font-weight: 600; color: var(--text-hi); font-size: 13px; }
.zone-tier  { font-family: var(--mono); font-size: 8px; color: var(--text-lo); letter-spacing: 1px; margin-left: auto; }
.zone-desc  { font-size: 11px; color: var(--text-lo); margin-bottom: 4px; line-height: 1.35; }
.zone-meta  { font-family: var(--mono); font-size: 9px; color: var(--text-lo); display: flex; gap: 10px; flex-wrap: wrap; }
.zone-power { color: var(--red); }
.zone-req   { color: var(--amber); }

.scout-mission {
  background: linear-gradient(135deg, rgba(31,110,152,0.12), rgba(16,32,27,0.92));
  border: 1px solid var(--sky-d);
  border-radius: var(--r);
  padding: 10px 11px;
  margin-bottom: 8px;
}
.scout-mission-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 5px; gap: 8px;
}
.scout-mission-name { font-weight: 700; color: var(--sky); font-size: 13px; }
.scout-mission-time { font-family: var(--mono); font-size: 10px; color: var(--text-lo); }
.scout-mission-bugs { font-size: 10px; color: var(--text); margin-bottom: 5px; }
.scout-collect-btn  {
  margin-top: 6px;
  padding: 5px 12px;
  background: var(--accent-dd);
  border: 1px solid var(--accent-d);
  color: var(--accent);
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 10px;
  cursor: pointer;
  letter-spacing: 1px;
}

.fighter-select-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 9px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 5px;
  cursor: pointer;
  transition: border-color 0.12s;
  user-select: none;
}
.fighter-select-row.selected { border-color: var(--accent); background: var(--accent-dd); }
.fighter-select-row.disabled { opacity: 0.4; cursor: not-allowed; }

.recruit-btn {
  padding: 5px 10px;
  background: var(--surface2);
  border: 1px solid var(--accent-d);
  color: var(--accent);
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 10px;
  cursor: pointer;
  letter-spacing: 1px;
  white-space: nowrap;
}
.recruit-btn:disabled { opacity: 0.3; cursor: not-allowed; }

.rj-rush-btn {
  padding: 4px 8px;
  background: var(--amber-d);
  border: 1px solid var(--amber);
  color: var(--amber);
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 9px;
  cursor: pointer;
  letter-spacing: 0.5px;
  white-space: nowrap;
}
.rj-rush-btn:disabled { opacity: 0.3; cursor: not-allowed; }

.retire-btn {
  padding: 4px 8px;
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--text-lo);
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 9px;
  cursor: pointer;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

.send-scout-btn {
  padding: 5px 12px;
  background: var(--surface2);
  border: 1px solid var(--sky-d);
  color: var(--sky);
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 10px;
  cursor: pointer;
  letter-spacing: 1px;
  white-space: nowrap;
  margin-top: 8px;
}
.send-scout-btn:disabled { opacity: 0.3; cursor: not-allowed; }

.tier-zone-label {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--text-lo);
  letter-spacing: 2px;
  margin: 12px 0 6px;
}

/* ── SCOUT TACTICS ───────────────────────────── */
.scout-tactic-panel {
  background: linear-gradient(180deg, rgba(15,28,23,0.96), rgba(9,15,12,0.96));
  border: 1px solid rgba(120,215,255,0.16);
  border-radius: 10px;
  padding: 10px 11px;
  margin-bottom: 10px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.16);
}
.scout-tactic-title {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1.5px;
  color: var(--sky);
  margin-bottom: 6px;
}
.scout-tactic-copy {
  font-size: 11px;
  color: var(--text);
  line-height: 1.45;
  margin-bottom: 8px;
}

  display: grid;
  grid-template-columns: 1fr;
  gap: 7px;

.scout-tactic-btn {

.scout-tactic-btn.active {

.scout-tactic-head {

  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 4px;
}
.scout-tactic-name {
  color: var(--text-hi);
  font-weight: 700;
  font-size: 12px;
}
.scout-tactic-tag {
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 1px;
  color: var(--sky);
}
.scout-tactic-desc {
  font-size: 10px;
  color: var(--text-lo);
  line-height: 1.45;
  margin-bottom: 6px;
}
.scout-tactic-effects {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;

.scout-tactic-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 6px;
  border-radius: 999px;
  border: 1px solid rgba(49,87,74,0.9);
  background: rgba(255,255,255,0.03);
  font-family: var(--mono);
  font-size: 8px;
  color: var(--text-lo);
  letter-spacing: 0.3px;
