function swarmResearchHatchMult() {
  let mult = 1;
  if (G.techs.swarm_genealogies) mult *= 1 + (TECHS.swarm_genealogies.effects?.hatch_mult || 0);
  if (G.techs.imperial_husbandry) mult *= 1 + (TECHS.imperial_husbandry.effects?.hatch_mult || 0);
  return mult;
}

function swarmResearchNurseMult() {
  let mult = 1;
  if (G.techs.swarm_genealogies) mult *= 1 + (TECHS.swarm_genealogies.effects?.nurse_mult || 0);
  if (G.techs.imperial_husbandry) mult *= 1 + (TECHS.imperial_husbandry.effects?.nurse_mult || 0);
  return mult;
}

function swarmResearchUpkeepReduction() {
  return (G.techs.imperial_husbandry ? (TECHS.imperial_husbandry.effects?.upkeep_red || 0) : 0);
}

function amberResearchStorageBonus() {
  let add = 0;
  if (G.techs.vault_compression) add += TECHS.vault_compression.effects?.storage_mult || 0;
  return add;
}

function amberResearchGroundMult() {
  let mult = 1;
  if (G.techs.vault_compression) mult *= 1 + (TECHS.vault_compression.effects?.ground_mult || 0);
  if (G.techs.fault_exchange) mult *= 1 + (TECHS.fault_exchange.effects?.ground_mult || 0);
  return mult;
}

function amberResearchExcavatorMult() {
  let mult = 1;
  if (G.techs.vault_compression) mult *= 1 + (TECHS.vault_compression.effects?.excavator_mult || 0);
  if (G.techs.fault_exchange) mult *= 1 + (TECHS.fault_exchange.effects?.excavator_mult || 0);
  return mult;
}

function amberResearchGatherBonus() {
  return (G.techs.fault_exchange ? (TECHS.fault_exchange.effects?.gather_bonus || 0) : 0);
}

function amberResearchTradeBonus() {
  return (G.techs.fault_exchange ? (TECHS.fault_exchange.effects?.trade_mult || 0) : 0);
}

function celestialResearchSkyMult() {
  let mult = 1;
  if (G.techs.beacon_attunement) mult *= 1 + (TECHS.beacon_attunement.effects?.sky_mult || 0);
  if (G.techs.astral_cartography) mult *= 1 + (TECHS.astral_cartography.effects?.sky_mult || 0);
  return mult;
}

function celestialResearchNavigatorMult() {
  let mult = 1;
  if (G.techs.beacon_attunement) mult *= 1 + (TECHS.beacon_attunement.effects?.navigator_mult || 0);
  if (G.techs.astral_cartography) mult *= 1 + (TECHS.astral_cartography.effects?.navigator_mult || 0);
  return mult;
}

function celestialResearchLaunchBonus() {
  return (G.techs.astral_cartography ? (TECHS.astral_cartography.effects?.launch_bonus || 0) : 0);
}

function storageMetaMult() {
  let mult = 1 + (G.meta.launches || 0) * 0.03 + legacyRank('amber_reserve') * 0.15 + milestoneRunStorageBonus() + amberResearchStorageBonus() + projectStorageBonus();
  if (capstoneOwned('amber_monolith')) mult += 0.35;
  return mult;
}

function productionMetaMult() {
  return (1 + (G.meta.launches || 0) * 0.05 + legacyRank('fungal_memory') * 0.12 + milestoneRunProdBonus() + projectProductionBonus() + colonyProjectBonus('global_prod') + queenProdBonus()) * queenCriticalPenalty();
}

function gatherPower() {
  let power = 1.5 + (G.meta.launches || 0) * 0.1 + legacyRank('amber_reserve') * 0.2 + milestoneRunGatherBonus() + amberResearchGatherBonus() + projectGatherBonus();
  if (capstoneOwned('amber_monolith')) power += 0.8;
  return power;
}

function startingBugsFromMeta(meta) {
  return legacyRank('brood_ritual', meta) + Math.floor((meta.launches || 0) / 2) + (legacyRank('swarm_sovereignty', meta) > 0 ? 2 : 0);
}

function hatchLegacyMult() {
  return (1 + legacyRank('queen_blessing') * 0.25 + milestoneRunHatchBonus() + projectHatchBonus() + queenHatchBonus()) * (capstoneOwned('swarm_sovereignty') ? 1.5 : 1) * swarmResearchHatchMult();
}

function upkeepLegacyMult() {
  const extra = capstoneOwned('swarm_sovereignty') ? 0.10 : 0;
  return Math.max(0.30, 1 - legacyRank('queen_blessing') * 0.05 - extra - milestoneRunUpkeepBonus() - swarmResearchUpkeepReduction() - queenUpkeepBonus());
}

function tradeLegacyMult() {
  return 1 + legacyRank('trade_pacts') * 0.12 + milestoneRunTradeBonus() + amberResearchTradeBonus() + projectTradeBonus() + colonyProjectBonus('trade_bonus');
}

function skyLegacyMult() {
  let mult = 1 + legacyRank('sky_legacy') * 0.2 + milestoneSkyBonus() + projectSkyBonus();
  if (capstoneOwned('celestial_throne')) mult += 0.45;
  return mult * celestialResearchSkyMult();
}

function maxRes(res) {
  const def = RES[res];
  if (!def) return 0;
  let max = def.base_max;
  max = Math.floor(max * storageMetaMult());
  const cacheStorage = (G.bldgs.leaf_cache || 0) * (BLDGS.leaf_cache.effects.storage_mult || 0);
  const amberStorage = (G.bldgs.amber_vault || 0) * (buildingEffects('amber_vault').storage_mult || 0);
  max = Math.floor(max * (1 + cacheStorage + amberStorage));
  if (res === 'insight') {
    max += (G.bldgs.chrysalis_chamber || 0) * (BLDGS.chrysalis_chamber.effects.insight_max || 0);
  }
  return max;
}

function housing() {
  let h = 0;
  for (const [bid, n] of Object.entries(G.bldgs)) {
    if (BLDGS[bid] && BLDGS[bid].effects.housing) h += n * BLDGS[bid].effects.housing;
  }
  h += queenHousingBonus();
  return h;
}

function employed() {
  return Object.values(G.jobs).reduce((a, b) => a + b, 0);
}

function bugsOnExpedition() {
  return (G.expeditions || []).reduce((sum, e) => sum + (e.bugs || 0), 0);
}

function fightersTotal() {
  return (G.fighters || []).length;
}

function maxFighters() {
  return (G.bldgs.training_burrow || 0) * (BLDGS.training_burrow.effects.fighter_slots || 3);
}

function idleFighterCount() {
  return (G.fighters || []).filter(f => f.status === 'idle').length;
}

function idle() {
  return Math.max(0, G.pop.total - employed() - bugsOnExpedition() - fightersTotal() - outpostWorkers());
}

function bldgCost(bid) {
  const def = BLDGS[bid];
  const n = G.bldgs[bid] || 0;
  const out = {};
  for (const [r, base] of Object.entries(def.base_cost)) {
    out[r] = Math.ceil(base * Math.pow(def.cost_mult, n));
  }
  return out;
}

function ensureBroodState(state = G) {
  if (!state.brood || typeof state.brood !== 'object') state.brood = {};
  if (typeof state.brood.focus !== 'string' || !BROOD_SPECIALISATIONS[state.brood.focus] || !broodSpecUnlocked(state.brood.focus, state)) state.brood.focus = firstUnlockedBroodId(state);
  const baseCastes = { worker:0, soldier:0, scholar:0, courier:0, nurse:0 };
  state.brood.castes = { ...baseCastes, ...((state.brood && state.brood.castes) || {}) };
  for (const key of Object.keys(baseCastes)) {
    state.brood.castes[key] = Math.max(0, Math.floor(Number(state.brood.castes[key]) || 0));
  }
  state.brood.total_hatched = Math.max(0, Math.floor(Number(state.brood.total_hatched) || 0));
  const popTotal = Math.max(0, Math.floor(Number((state.pop && state.pop.total) || 0)));
  const assigned = Object.values(state.brood.castes).reduce((sum, n) => sum + n, 0);
  if (assigned < popTotal) {
    state.brood.castes.worker += popTotal - assigned;
  } else if (assigned > popTotal) {
    let extra = assigned - popTotal;
    const order = Object.keys(state.brood.castes).sort((a, b) => state.brood.castes[b] - state.brood.castes[a]);
    for (const key of order) {
      if (extra <= 0) break;
      const take = Math.min(extra, state.brood.castes[key]);
      state.brood.castes[key] -= take;
      extra -= take;
    }
  }
  return state.brood;
}


function rareBugCap(state = G) {
  const popTotal = Math.max(0, Math.floor(Number((state.pop && state.pop.total) || 0)));
  const nurseryBonus = (state.bldgs && state.bldgs.brood_nursery) ? 1 : 0;
  const lineageBonus = (state.techs && state.techs.swarm_genealogies) ? 1 : 0;
  return Math.min(6, Math.max(0, 1 + Math.floor(popTotal / 12) + nurseryBonus + lineageBonus));
}

function ensureRareBugState(state = G) {
  const validRoles = new Set(Object.keys(BROOD_SPECIALISATIONS));
  if (!Array.isArray(state.rare_bugs)) state.rare_bugs = [];
  state.rare_bugs = state.rare_bugs.map((bug, idx) => {
    const role = validRoles.has(bug && bug.role) ? bug.role : 'worker';
    const pool = RARE_BUG_TRAITS[role] || RARE_BUG_TRAITS.worker;
    const trait = pool.find(t => t.id === bug?.trait_id) || pool[0];
    return {
      id: bug?.id || `rare_${idx}_${Date.now()}`,
      name: typeof bug?.name === 'string' && bug.name.trim() ? bug.name.trim() : `${RARE_BUG_NAME_PREFIXES[idx % RARE_BUG_NAME_PREFIXES.length]} ${RARE_BUG_NAME_SUFFIXES[idx % RARE_BUG_NAME_SUFFIXES.length]}`,
      role,
      icon: BROOD_SPECIALISATIONS[role]?.icon || '✦',
      title: typeof bug?.title === 'string' && bug.title.trim() ? bug.title.trim() : trait.title,
      desc: typeof bug?.desc === 'string' && bug.desc.trim() ? bug.desc.trim() : trait.desc,
      trait_id: trait.id,
      bonuses: { ...(trait.bonuses || {}), ...((bug && bug.bonuses) || {}) },
      hatched_at: Math.max(0, Math.floor(Number(bug?.hatched_at) || 0)),
    };
  }).filter(bug => validRoles.has(bug.role));
  const popTotal = Math.max(0, Math.floor(Number((state.pop && state.pop.total) || 0)));
  const maxAllowed = Math.min(popTotal, rareBugCap(state));
  if (state.rare_bugs.length > maxAllowed) state.rare_bugs = state.rare_bugs.slice(0, maxAllowed);
  return state.rare_bugs;
}

function rareBugChance(state = G) {
  const popTotal = Math.max(0, Math.floor(Number((state.pop && state.pop.total) || 0)));
  if (popTotal < 6) return 0;
  let chance = 0.04;
  if ((state.bldgs && state.bldgs.brood_nursery) > 0) chance += 0.02;
  if (state.techs && state.techs.swarm_genealogies) chance += 0.01;
  return Math.min(0.08, chance);
}

function nextRareBugName(state = G) {
  const used = new Set(ensureRareBugState(state).map(b => b.name));
  for (const prefix of RARE_BUG_NAME_PREFIXES) {
    for (const suffix of RARE_BUG_NAME_SUFFIXES) {
      const name = `${prefix} ${suffix}`;
      if (!used.has(name)) return name;
    }
  }
  return `Rare ${ensureRareBugState(state).length + 1}`;
}

function rareBugBonuses(state = G) {
  const totals = { prod:0, scout:0, insight:0, trade:0, hatch:0, heal:0 };
  for (const bug of ensureRareBugState(state)) {
    for (const key of Object.keys(totals)) totals[key] += Number((bug.bonuses || {})[key] || 0);
  }
  totals.prod = Math.min(0.18, totals.prod);
  totals.scout = Math.min(0.18, totals.scout);
  totals.insight = Math.min(0.18, totals.insight);
  totals.trade = Math.min(0.18, totals.trade);
  totals.hatch = Math.min(0.16, totals.hatch);
  totals.heal = Math.min(0.16, totals.heal);
  return totals;
}

function rareProdMult(state = G) { return 1 + rareBugBonuses(state).prod; }
function rareScoutMult(state = G) { return 1 + rareBugBonuses(state).scout; }
function rareInsightMult(state = G) { return 1 + rareBugBonuses(state).insight; }
function rareTradeMult(state = G) { return 1 + rareBugBonuses(state).trade; }
function rareHatchMult(state = G) { return 1 + rareBugBonuses(state).hatch; }
function rareHealMult(state = G) { return 1 + rareBugBonuses(state).heal; }

function hatchRareBugRolls(n = 1, state = G, opts = {}) {
  const found = [];
  const brood = ensureBroodState(state);
  ensureRareBugState(state);
  const maxAllowed = Math.min(Math.max(0, Math.floor(Number((state.pop && state.pop.total) || 0))), rareBugCap(state));
  const chance = rareBugChance(state);
  for (let i = 0; i < n; i++) {
    if (state.rare_bugs.length >= maxAllowed) break;
    if (chance <= 0 || Math.random() >= chance) continue;
    const role = brood.focus || 'worker';
    const pool = RARE_BUG_TRAITS[role] || RARE_BUG_TRAITS.worker;
    const trait = pool[Math.floor(Math.random() * pool.length)] || pool[0];
    const bug = {
      id: `rare_${Date.now()}_${Math.floor(Math.random() * 1e6)}`,
      name: nextRareBugName(state),
      role,
      icon: BROOD_SPECIALISATIONS[role]?.icon || '✦',
      title: trait.title,
      desc: trait.desc,
      trait_id: trait.id,
      bonuses: { ...(trait.bonuses || {}) },
      hatched_at: Math.max(0, Math.floor(Number((state.time && state.time.tick) || 0))),
    };
    state.rare_bugs.unshift(bug);
    found.push(bug);
  }
  ensureRareBugState(state);
  return found;
}

function broodCasteCount(id, state = G) {
  return ensureBroodState(state).castes[id] || 0;
}

function broodAssignedTotal(state = G) {
  return Object.values(ensureBroodState(state).castes).reduce((sum, n) => sum + n, 0);
}

function broodFocusId(state = G) {
  return ensureBroodState(state).focus;
}

function broodFocusDef(state = G) {
  return BROOD_SPECIALISATIONS[broodFocusId(state)] || BROOD_SPECIALISATIONS.worker;
}

function broodAssignNewBugs(n = 1, state = G) {
  if (!n) return 0;
  const brood = ensureBroodState(state);
  const focus = brood.focus || 'worker';
  brood.castes[focus] = (brood.castes[focus] || 0) + n;
  brood.total_hatched += n;
  return n;
}

function broodProdMult(state = G) {
  return 1 + Math.min(0.40, broodCasteCount('worker', state) * 0.015);
}

function broodScoutMult(state = G) {
  return 1 + Math.min(0.45, broodCasteCount('soldier', state) * 0.02);
}

function broodInsightMult(state = G) {
  return 1 + Math.min(0.50, broodCasteCount('scholar', state) * 0.03);
}

function broodTradeMult(state = G) {
  return 1 + Math.min(0.40, broodCasteCount('courier', state) * 0.02);
}

function broodHatchMult(state = G) {
  return 1 + Math.min(0.50, broodCasteCount('nurse', state) * 0.025);
}

function broodHealMult(state = G) {
  return 1 + Math.min(0.40, broodCasteCount('nurse', state) * 0.02);
}

function broodSpecBonusLabel(id, state = G) {
  switch (id) {
    case 'worker': return `Production +${Math.round((broodProdMult(state) - 1) * 100)}%`;
    case 'soldier': return `Scout power +${Math.round((broodScoutMult(state) - 1) * 100)}%`;
    case 'scholar': return `Insight +${Math.round((broodInsightMult(state) - 1) * 100)}%`;
    case 'courier': return `Trade returns +${Math.round((broodTradeMult(state) - 1) * 100)}%`;
    case 'nurse': return `Hatch +${Math.round((broodHatchMult(state) - 1) * 100)}% · Recovery +${Math.round((broodHealMult(state) - 1) * 100)}%`;
    default: return '';
  }
}

function rareBugSummaryLine(state = G) {
  const bonuses = rareBugBonuses(state);
  const parts = [];
  if (bonuses.prod > 0) parts.push(`Prod +${Math.round(bonuses.prod * 100)}%`);
  if (bonuses.scout > 0) parts.push(`Scout +${Math.round(bonuses.scout * 100)}%`);
  if (bonuses.insight > 0) parts.push(`Insight +${Math.round(bonuses.insight * 100)}%`);
  if (bonuses.trade > 0) parts.push(`Trade +${Math.round(bonuses.trade * 100)}%`);
  if (bonuses.hatch > 0) parts.push(`Hatch +${Math.round(bonuses.hatch * 100)}%`);
  if (bonuses.heal > 0) parts.push(`Recovery +${Math.round(bonuses.heal * 100)}%`);
  return parts.length ? parts.join(' · ') : 'No champion bonuses active yet.';
}

function setBroodFocus(id) {
  ensureBroodState(G);
  if (!BROOD_SPECIALISATIONS[id]) return;
  if (!broodSpecUnlocked(id, G)) {
    toast(broodSpecLockedReason(id, G), 'warn');
    return;
  }
  G.brood.focus = id;
  const spec = BROOD_SPECIALISATIONS[id];
  log(`Brood focus set: ${spec.name}`);
  toast(`Brood focus: ${spec.name}`);
  renderTab();
  saveGame();
}

function canAfford(cost) {
  return Object.entries(cost).every(([r, a]) => (G.res[r] || 0) >= a);
}

function canAffordBldg(bid) {
  return canAfford(bldgCost(bid));
}

function canAffordTech(tid) {
  const def = TECHS[tid];
  if (!def || !techVisible(def) || !techReqsMet(def) || !techStageReady(def)) return false;
  return canAfford(def.cost);
}

function craftDisc() {
  return 1 - Math.min(0.5, (G.bldgs.web_workshop || 0) * (BLDGS.web_workshop.effects.craft_disc || 0));
}

function tradeMult() {
  return (1 + (G.bldgs.flight_tower || 0) * (BLDGS.flight_tower.effects.trade_mult || 0)) * tradeLegacyMult() * broodTradeMult() * rareTradeMult();
}


function hatchRate() {
  if (housing() <= G.pop.total) return 0;
  if (G.res.honeydew < 8) return 0;
  const gap = housing() - G.pop.total;
  const base = G.pop.total === 0 ? 0.03 : 0.006;
  const foodMult = Math.min(2.2, 0.75 + (G.res.honeydew / Math.max(1, maxRes('honeydew'))) * 2.2);
  const nurseMult = 1 + (G.jobs.nurse || 0) * 0.04 * jobLineageMult('nurse');
  const nurseryMult = 1 + (G.bldgs.brood_nursery || 0) * (buildingEffects('brood_nursery').hatch_mult || 0);
  const eventMult = G.events.active === 'brood_surge' ? 1.8 : 1;
  const openingMult = openingPathEffect(G).hatch_mult || 1;
  return base * gap * foodMult * hatchLegacyMult() * nurseMult * nurseryMult * broodHatchMult() * rareHatchMult() * eventMult * openingMult;
}

function computeRates() {
  const r = Object.fromEntries(Object.keys(G.res).map(k => [k, 0]));
  const season = seasonName();
  const sm = S_MOD[season] || {};
  const opening = openingPathEffect(G);
  const globalMult = productionMetaMult() * broodProdMult() * rareProdMult() * (1 + (G.bldgs.mycelium_network || 0) * (BLDGS.mycelium_network.effects.global_prod || 0) + (G.bldgs.colony_spire || 0) * (BLDGS.colony_spire.effects.global_prod || 0));

  let hdEventMult = 1;
  if (G.events.active === 'hd_boost') hdEventMult = 1.5;
  if (G.events.active === 'hd_blight') hdEventMult = 0.5;
  if (G.events.active === 'hd_drought') hdEventMult = 0.8;
  const amberEventMult = G.events.active === 'amber_rush' ? 1.6 : 1;
  const starEventMult = G.events.active === 'star_current' ? 1.7 : 1;

  let hdSeason = sm.honeydew ?? 1;
  if (season === 'Winter' && G.techs.seasonal_awareness) {
    const red = TECHS.seasonal_awareness.effects?.winter_red || 0;
    hdSeason = hdSeason + (1 - hdSeason) * red;
  }

  r.honeydew += (G.bldgs.clover_patch || 0) * BLDGS.clover_patch.effects.hd_prod * hdSeason * hdEventMult * globalMult;
  r.honeydew += opening.honeydew_rate || 0;
  r.leaves   += (G.bldgs.amber_vault || 0) * (buildingEffects('amber_vault').leaves_prod || 0) * globalMult * amberEventMult * milestoneGroundBonus() * amberResearchGroundMult();
  r.dirt     += (G.bldgs.amber_vault || 0) * (buildingEffects('amber_vault').dirt_prod || 0) * globalMult * amberEventMult * milestoneGroundBonus() * amberResearchGroundMult();
  r.spores   += (G.bldgs.spore_circle || 0) * (BLDGS.spore_circle.effects.spores_prod || 0) * globalMult;
  r.wax      += (G.bldgs.wax_foundry || 0) * (BLDGS.wax_foundry.effects.wax_prod || 0) * globalMult;
  r.silk     += (G.bldgs.web_workshop || 0) * (BLDGS.web_workshop.effects.silk_prod || 0) * globalMult;
  r.compound += (G.bldgs.compound_lab || 0) * (BLDGS.compound_lab.effects.compound_prod || 0) * globalMult;
  r.elytra   += (G.bldgs.flight_tower || 0) * (BLDGS.flight_tower.effects.elytra_prod || 0) * globalMult * skyLegacyMult() * starEventMult;
  r.elytra   += (G.bldgs.sky_beacon || 0) * (buildingEffects('sky_beacon').elytra_prod || 0) * globalMult * skyLegacyMult() * starEventMult;
  r.aether   += (G.bldgs.sky_dock || 0) * (BLDGS.sky_dock.effects.aether_prod || 0) * globalMult * skyLegacyMult() * starEventMult;
  r.aether   += (G.bldgs.sky_beacon || 0) * (buildingEffects('sky_beacon').aether_prod || 0) * globalMult * skyLegacyMult() * starEventMult;
  r.skyglass += (G.bldgs.cloud_condenser || 0) * (BLDGS.cloud_condenser.effects.skyglass_prod || 0) * globalMult * skyLegacyMult() * starEventMult * milestoneSkyglassBonus();

  for (const [jid, count] of Object.entries(G.jobs)) {
    if (!count) continue;
    const produces = effectiveJobProduces(jid);
    for (const [res, base] of Object.entries(produces)) {
      let jrate = base * count * globalMult;
      if (jid === 'forager') {
        const fgMult = 1 + (G.bldgs.fungal_garden || 0) * (BLDGS.fungal_garden.effects.forager_mult || 0);
        jrate *= fgMult * hdSeason * hdEventMult;
      }
      if (jid === 'leaf_col') {
        jrate *= (sm.leaves ?? 1.0);
      }
      if (jid === 'scholar') {
        const obsMult = 1 + (G.bldgs.hive_observatory || 0) * (BLDGS.hive_observatory.effects.scholar_mult || 0);
        const advMult = (G.techs.advanced_science && TECHS.advanced_science.effects?.global_insight) || 1;
        jrate *= obsMult * advMult * broodInsightMult() * rareInsightMult();
      }
      if (jid === 'nurse') {
        const nurseryMult = 1 + (G.bldgs.brood_nursery || 0) * (buildingEffects('brood_nursery').nurse_mult || 0);
        jrate *= nurseryMult * swarmResearchNurseMult();
      }
      if (jid === 'excavator') {
        jrate *= amberEventMult * milestoneGroundBonus() * amberResearchExcavatorMult() * amberResearchGroundMult();
      }
      if (jid === 'aeronaut') jrate *= skyLegacyMult() * starEventMult;
      if (jid === 'navigator') {
        const beaconMult = 1 + (G.bldgs.sky_beacon || 0) * (buildingEffects('sky_beacon').navigator_mult || 0);
        jrate *= beaconMult * skyLegacyMult() * starEventMult * celestialResearchNavigatorMult();
      }
      r[res] += jrate;
    }
  }

  r.honeydew -= G.pop.total * 0.003 * upkeepLegacyMult() * (opening.upkeep_mult || 1);
  // Map terrain passive bonuses (Amber Springs etc.)
  if (G.map && G.map.bonus) {
    for (const [res, val] of Object.entries(G.map.bonus)) {
      if (r[res] !== undefined) r[res] += val;
    }
  }
  // Outpost passive production
  const opProd = outpostProductionSummary();
  for (const [res, rate] of Object.entries(opProd)) {
    if (r[res] !== undefined) r[res] += rate;
  }

  return r;
}

const WORKER_FLOAT_COLORS = {
  honeydew:'#fbbf24', leaves:'#4ade80', dirt:'#c08457', chitin:'#e2e8f0', silk:'#cbd5e1',
  wax:'#fb923c', spores:'#c084fc', insight:'#7dd3fc', resin:'#fb923c', compound:'#2dd4bf',
  elytra:'#fef08a', aether:'#93c5fd', skyglass:'#c4b5fd', royal_jelly:'#f472b6'
};

function fmtWorkerBurstAmt(amount) {
  if (amount >= 10) return String(Math.round(amount));
  if (amount >= 1) return amount.toFixed(amount >= 3 ? 0 : 1).replace(/\.0$/, '');
  return amount.toFixed(amount >= 0.3 ? 1 : 2).replace(/0$/, '').replace(/\.$/, '');
}

function computeWorkerVisualBreakdown(dt = 1) {
  const out = {};
  if (dt <= 0) return out;
  const season = seasonName();
  const sm = S_MOD[season] || {};
  const globalMult = productionMetaMult() * broodProdMult() * rareProdMult() * (1 + (G.bldgs.mycelium_network || 0) * (BLDGS.mycelium_network.effects.global_prod || 0) + (G.bldgs.colony_spire || 0) * (BLDGS.colony_spire.effects.global_prod || 0));

  let hdEventMult = 1;
  if (G.events.active === 'hd_boost') hdEventMult = 1.5;
  if (G.events.active === 'hd_blight') hdEventMult = 0.5;
  if (G.events.active === 'hd_drought') hdEventMult = 0.8;
  const amberEventMult = G.events.active === 'amber_rush' ? 1.6 : 1;
  const starEventMult = G.events.active === 'star_current' ? 1.7 : 1;

  let hdSeason = sm.honeydew ?? 1;
  if (season === 'Winter' && G.techs.seasonal_awareness) {
    const red = TECHS.seasonal_awareness.effects?.winter_red || 0;
    hdSeason = hdSeason + (1 - hdSeason) * red;
  }

  for (const [jid, count] of Object.entries(G.jobs || {})) {
    if (!count) continue;
    const produces = effectiveJobProduces(jid);
    for (const [res, base] of Object.entries(produces)) {
      let gain = base * count * globalMult * dt;
      if (jid === 'forager') {
        const fgMult = 1 + (G.bldgs.fungal_garden || 0) * (BLDGS.fungal_garden.effects.forager_mult || 0);
        gain *= fgMult * hdSeason * hdEventMult;
      }
      if (jid === 'leaf_col') gain *= (sm.leaves ?? 1.0);
      if (jid === 'scholar') {
        const obsMult = 1 + (G.bldgs.hive_observatory || 0) * (BLDGS.hive_observatory.effects.scholar_mult || 0);
        const advMult = (G.techs.advanced_science && TECHS.advanced_science.effects?.global_insight) || 1;
        gain *= obsMult * advMult * broodInsightMult() * rareInsightMult();
      }
      if (jid === 'nurse') {
        const nurseryMult = 1 + (G.bldgs.brood_nursery || 0) * (buildingEffects('brood_nursery').nurse_mult || 0);
        gain *= nurseryMult * swarmResearchNurseMult();
      }
      if (jid === 'excavator') gain *= amberEventMult * milestoneGroundBonus() * amberResearchExcavatorMult() * amberResearchGroundMult();
      if (jid === 'aeronaut') gain *= skyLegacyMult() * starEventMult;
      if (jid === 'navigator') {
        const beaconMult = 1 + (G.bldgs.sky_beacon || 0) * (buildingEffects('sky_beacon').navigator_mult || 0);
        gain *= beaconMult * skyLegacyMult() * starEventMult * celestialResearchNavigatorMult();
      }
      if (gain > 0) {
        if (!out[jid]) out[jid] = {};
        out[jid][res] = (out[jid][res] || 0) + gain;
      }
    }
  }
  return out;
}

function queueColonyWorkerVisualYields(dt = 1) {
  if (curTab !== 'colony' || !ColonyViz.inited) return;
  const breakdown = computeWorkerVisualBreakdown(dt);
  if (Object.keys(breakdown).length) ColonyViz.queueWorkerYields(breakdown);
}

function queenMaxHp(level) { return 20 + level * 8; }

function ensureQueen(state = G) {
  if (!state.queen || typeof state.queen !== 'object') {
    state.queen = {
      level: 1, xp: 0, xp_next: 80,
      hp: queenMaxHp(1), max_hp: queenMaxHp(1),
      title: 'Young Queen',
      decree_tick: 0,   // game tick when last decree was used
      injured: false,
    };
  }
  if (!Number.isFinite(state.queen.hp)) state.queen.hp = queenMaxHp(state.queen.level || 1);
  if (!Number.isFinite(state.queen.max_hp)) state.queen.max_hp = queenMaxHp(state.queen.level || 1);
  return state.queen;
}

function queenLevelDef(level) {
  return QUEEN_LEVELS.find(l => l.level === level) || QUEEN_LEVELS[QUEEN_LEVELS.length - 1];
}

function queenProdBonus(state = G) {
  if (!state.queen) return 0;
  return queenLevelDef(state.queen.level).buffs.prod || 0;
}
function queenHatchBonus(state = G) {
  if (!state.queen) return 0;
  return queenLevelDef(state.queen.level).buffs.hatch || 0;
}
function queenHousingBonus(state = G) {
  if (!state.queen) return 0;
  return queenLevelDef(state.queen.level).buffs.housing || 0;
}
function queenUpkeepBonus(state = G) {
  if (!state.queen) return 0;
  return queenLevelDef(state.queen.level).buffs.upkeep_red || 0;
}

function awardQueenXp(amount, reason = '') {
  if (G.pop.total < 1) return;
  const q = ensureQueen();
  if (q.level >= 12) return;
  q.xp = (q.xp || 0) + amount;
  while (q.level < 12 && q.xp >= q.xp_next) {
    q.xp -= q.xp_next;
    q.level++;
    const def = queenLevelDef(q.level);
    q.xp_next = def.xp_next || null;
    q.title = def.title;
    q.max_hp = queenMaxHp(q.level);
    q.hp = Math.min(q.max_hp, q.hp + 8); // small HP boost on level
    log(`👑 Your Queen has ascended — ${def.title} (Level ${q.level})!`, 'ev');
    toast(`Queen: ${def.title} (Lv.${q.level})`);
    if (!hasSeenPopup('queen_level')) showFeatureAnnounce('queen_level');
    renderTab();
  }
}

function queenInjuryDamage(amount) {
  const q = ensureQueen();
  q.hp = Math.max(1, q.hp - amount);
  q.injured = q.hp < q.max_hp * 0.5;
  if (q.hp <= 1) {
    log('👑 ⚠ Your Queen is critically wounded! Production is heavily suppressed until she recovers.', 'bad');
    toast('Queen critically wounded!', 'bad');
  } else {
    log(`👑 Your Queen was harmed in the raid — ${Math.round(q.hp)}/${q.max_hp} HP.`, 'bad');
  }
}

function tickQueen(dt) {
  if (G.pop.total < 1) return;
  const q = ensureQueen();
  // Passive HP regen
  if (q.hp < q.max_hp) {
    q.hp = Math.min(q.max_hp, q.hp + 0.04 * dt);
    if (q.hp >= q.max_hp * 0.5) q.injured = false;
  }
  // Slow passive XP from just existing with a population
  if (G.time.tick % 40 === 0 && q.level < 12) {
    awardQueenXp(0.5 + Math.min(2, G.pop.total * 0.04));
  }
}

function queenDecreeCooldownSecs() {
  const elapsed = G.time.tick - (G.queen ? G.queen.decree_tick || 0 : 0);
  const cooldownTicks = DAYS_PER_SEASON * TICKS_PER_DAY; // one full season
  return Math.max(0, Math.ceil((cooldownTicks - elapsed) * TICK_MS / 1000));
}

function canUseDecree() {
  if (!G.queen) return false;
  if ((G.res.honeydew || 0) < 60) return false;
  return queenDecreeCooldownSecs() === 0;
}

function useQueenDecree() {
  if (!canUseDecree()) { toast('Decree not ready', 'warn'); return; }
  G.res.honeydew = Math.max(0, (G.res.honeydew || 0) - 60);
  ensureQueen().decree_tick = G.time.tick;
  // Pick best decree based on current need
  const hd = G.res.honeydew || 0;
  const hdMax = maxRes('honeydew');
  let decreeEffect, decreeMsg;
  if (hd < hdMax * 0.3) {
    G.events.active = 'hd_boost'; G.events.ticks_left = 200;
    decreeEffect = 'Honeydew Decree'; decreeMsg = 'The Queen commands foragers outward. Honeydew production surges.';
  } else if ((G.pop.total || 0) < housing() - 2) {
    G.hatch.progress = Math.min(0.99, (G.hatch.progress || 0) + 0.40);
    decreeEffect = 'Brood Decree'; decreeMsg = 'The Queen signals the nursery. Hatch progress surges forward.';
  } else {
    G.events.active = 'amber_rush'; G.events.ticks_left = 180;
    decreeEffect = 'Amber Decree'; decreeMsg = 'The Queen opens the deep stores. Gathering and resource flow increases.';
  }
  log(`👑 Queen's Decree: ${decreeMsg}`);
  toast(`Decree: ${decreeEffect}`);
  awardQueenXp(12, 'decree');
  renderAll();
}

function queenCriticalPenalty(state = G) {
  if (!state.queen) return 1;
  return state.queen.hp <= 1 ? 0.65 : 1; // -35% prod when critically wounded
}

function awardBug(n = 1) {
  const prevTotal = G.pop.total;
  const add = Math.min(n, Math.max(0, housing() - G.pop.total));
  if (add <= 0) return 0;
  broodAssignNewBugs(add);
  G.pop.total += add;
  const rareBugs = hatchRareBugRolls(add);
  log(`A new bug hatches! Colony: ${G.pop.total}/${housing()}`);
  // Queen gains XP from each hatch
  awardQueenXp(4 * add, 'hatch');
  if (rareBugs.length) {
    const rareLabel = rareBugs.length === 1
      ? `${rareBugs[0].name}, ${rareBugs[0].title}`
      : `${rareBugs.length} rare bugs`;
    log(`✨ Rare hatch: ${rareBugs.map(b => `${b.name} (${b.title})`).join(' · ')}`, 'ev');
    toast(rareBugs.length === 1 ? `Rare bug: ${rareBugs[0].name}` : `${rareBugs.length} rare bugs hatched`);
    const canvas = document.getElementById('colony-canvas-wrap');
    spawnGatherPop('✦ ' + rareLabel + '!', 'multi', canvas);
  }
  if (add > 0) {
    toast(`+${add} bug${add > 1 ? 's' : ''}`);
    juiceHatchBurst();
    const canvas = document.getElementById('colony-canvas-wrap');
    spawnGatherPop('⊜ +' + add + ' bug' + (add > 1 ? 's' : '') + '!', '', canvas);
    if (prevTotal === 0 && G.pop.total > 0) maybeAnnounceJobUnlock('forager');
  }
  return add;
}

function triggerRandomEvent() {
  const choicePool = CHOICE_EVENTS.filter(ev => (!ev.req || G.techs[ev.req]) && (!ev.capstone || capstoneOwned(ev.capstone)));
  if (!G.events.choice && choicePool.length && Math.random() < 0.42) {
    const ev = choicePool[Math.floor(Math.random() * choicePool.length)];
    G.events.choice = evolveChoiceEvent(ev);
    renderChoiceEvent();
    return;
  }

  const pool = EVENTS.filter(ev => (!ev.req || G.techs[ev.req]) && (!ev.capstone || capstoneOwned(ev.capstone)));
  const totalW = pool.reduce((a, e) => a + e.w, 0);
  let rnd = Math.random() * totalW;
  const ev = pool.find(e => { rnd -= e.w; return rnd <= 0; }) || pool[0];
  log(`Event: ${ev.msg}`, 'ev');
  toast(ev.msg);
  switch (ev.effect) {
    case 'hd_boost':
    case 'hd_blight':
    case 'hd_drought':
      G.events.active = ev.effect;
      G.events.ticks_left = ev.effect === 'hd_blight' ? 100 : 150;
      break;
    case 'leaves_gift':
      G.res.leaves = Math.min(maxRes('leaves'), G.res.leaves + 30);
      G.vis.leaves = true;
      break;
    case 'insight_gift':
      G.res.insight = Math.min(maxRes('insight'), G.res.insight + 20);
      G.vis.insight = true;
      break;
    case 'pop_gift':
      awardBug(1);
      break;
    case 'spores_gift':
      G.vis.spores = true;
      G.res.spores = Math.min(maxRes('spores'), G.res.spores + 50);
      break;
    case 'aether_gift':
      G.vis.aether = true;
      G.res.aether = Math.min(maxRes('aether'), G.res.aether + 40);
      break;
  }
}

function applyChoiceEffect(effect) {
  switch (effect) {

      awardBug(1);

    case 'amber_sell':
      G.res.honeydew = Math.min(maxRes('honeydew'), G.res.honeydew + 80);

    case 'amber_excavate':
      G.vis.leaves = true;

      G.res.aether = Math.min(maxRes('aether'), G.res.aether + 45);
      G.res.elytra = Math.min(maxRes('elytra'), G.res.elytra + 2);

      G.events.active = 'star_current';

      break;

      G.events.active = 'brood_surge';
      G.events.ticks_left = 180;
      awardBug(1);
      break;
    case 'imperial_recruit':
      G.res.honeydew = Math.max(0, G.res.honeydew - 30);
      G.vis.spores = true;
      G.res.spores = Math.min(maxRes('spores'), G.res.spores + 10);
      awardBug(3);
      break;
    case 'deep_excavate':
      G.vis.leaves = true;
      G.vis.dirt = true;
      G.vis.resin = true;
      G.vis.chitin = true;
      G.res.leaves = Math.min(maxRes('leaves'), G.res.leaves + 60);
      G.res.dirt = Math.min(maxRes('dirt'), G.res.dirt + 60);
      G.res.resin = Math.min(maxRes('resin'), G.res.resin + 20);
      G.res.chitin = Math.min(maxRes('chitin'), G.res.chitin + 10);
      break;
    case 'monolith_reserve':
      G.events.active = 'amber_rush';
      G.events.ticks_left = 180;
      G.vis.wax = true;
      G.res.wax = Math.min(maxRes('wax'), G.res.wax + 10);
      break;
    case 'astral_chart':
      G.vis.aether = true;
      G.vis.elytra = true;
      G.vis.skyglass = true;
      G.res.aether = Math.min(maxRes('aether'), G.res.aether + 70);
      G.res.elytra = Math.min(maxRes('elytra'), G.res.elytra + 4);
      G.res.skyglass = Math.min(maxRes('skyglass'), G.res.skyglass + 5);
      break;
    case 'astral_current_start':
      G.events.active = 'star_current';
      G.events.ticks_left = 180;
      G.vis.aether = true;
      G.res.aether = Math.min(maxRes('aether'), G.res.aether + 20);
      break;
  }
}

function chooseEvent(idx) {
  if (!G.events.choice) return;
  const active = G.events.choice;
  const choice = active.choices[idx];
  if (!choice) return;
  log(`Choice: ${active.title} — ${choice.label}`);
  toast(choice.label);
  if (active.kind === 'scout_encounter') applyScoutEncounterResult(choice.effect);
  else applyChoiceEffect(choice.effect);
  G.events.choice = null;
  renderChoiceEvent();
  renderAll();
}

function closeChoiceEvent() {
  if (G.events.choice && G.events.choice.kind === 'scout_encounter') {
    log(`Encounter ignored: ${G.events.choice.title}.`, 'bad');
    toast('Encounter left behind', 'warn');
  }
  G.events.choice = null;
  renderChoiceEvent();
}

function expZoneAvailable(zone) {
  return !zone.req || !!G.techs[zone.req];

function expActiveCount() {
  return (G.expeditions || []).length;
}

function expSlotsFull() {
  return expActiveCount() >= MAX_EXPEDITIONS;
}

function getMapTileByKey(key) {
  initMapIfNeeded();
  return G.map && G.map.tiles ? G.map.tiles[key] || null : null;
}

function expeditionHasTarget(key) {
  return !!(G.expeditions || []).some(exp => exp.targetKey === key);
}

function tileExpeditionDistance(key) {
  if (!key) return 0;
  const [xRaw, yRaw] = key.split(',');
  const x = parseInt(xRaw, 10);
  const y = parseInt(yRaw, 10);
  if (!Number.isFinite(x) || !Number.isFinite(y)) return 0;
  const dx = x - MAP_COL_X;
  const dy = (y - MAP_COL_Y) * 1.35;
  return Math.sqrt(dx * dx + dy * dy);
}

function expeditionForwardNestBonus(expOrKey) {
  const key = typeof expOrKey === 'string' ? expOrKey : (expOrKey && expOrKey.targetKey);
  return capturedForwardNestBonusForKey(key, G);
}

function mapFrontierName(key) {
  const [xRaw, yRaw] = (key || '').split(',');
  const x = parseInt(xRaw, 10);
  const y = parseInt(yRaw, 10);
  if (!Number.isFinite(x) || !Number.isFinite(y)) return 'Uncharted Frontier';
  const dx = x - MAP_COL_X;
  const dy = y - MAP_COL_Y;
  const parts = [];
  if (dy < 0) parts.push('North');
  else if (dy > 0) parts.push('South');
  if (dx > 0) parts.push('East');
  else if (dx < 0) parts.push('West');
  const dir = parts.join('-') || 'Central';
  const dist = tileExpeditionDistance(key);
  const band = dist < 2.8 ? 'Near' : dist < 5.5 ? 'Outer' : 'Far';
  return `${band} ${dir} Frontier`;
}

function tileExpeditionDangerScore(tile) {
  const territory = tile ? territoryIdentity(tile.type) : null;
  const raw = territory && territory.danger_score != null
    ? territory.danger_score
    : tile && tile.type === 'hazard'
      ? 5
      : tile && tile.type === 'sky'
        ? 4
        : tile && tile.type === 'plains'
          ? 1
          : 2;
  return Math.max(1, Math.min(5, raw || 1));
}

function tileExpeditionCrew(distance, dangerScore, tileType) {
  let bugs = 1;
  if (distance >= 3.4 || dangerScore >= 3) bugs += 1;
  if (distance >= 6.4 || dangerScore >= 5 || tileType === 'hazard' || tileType === 'sky') bugs += 1;
  return Math.max(1, Math.min(3, bugs));
}

function tileExpeditionDuration(distance, dangerScore, bugs, tileType) {
  const base = 75 + distance * 28 + dangerScore * 18 + Math.max(0, bugs - 1) * 14 + (tileType === 'hazard' ? 18 : 0) + (tileType === 'sky' ? 12 : 0);
  return Math.max(60, Math.round(base / 5) * 5);
}

function tileExpeditionPack(distance, dangerScore, bugs, tileType) {
  const pack = {
    honeydew: Math.max(4, Math.round(6 + distance * 3 + dangerScore * 2 + bugs * 2)),
    leaves: Math.max(0, Math.round(distance * 1.2) + Math.max(0, dangerScore - 2) * 2 + Math.max(0, bugs - 1) * 2),
  };
  if (tileType === 'hazard') pack.leaves += 3;
  if (tileType === 'sky') pack.leaves += 2;
  if (pack.leaves <= 0) delete pack.leaves;
  return pack;
}

function tileExpeditionRewardOutlook(tile) {
  if (!tile) return 'Unstable route data.';
  switch (tile.type) {
    case 'thicket': return 'Likely leaves and dirt if the undergrowth holds.';
    case 'chitin': return 'Possible chitin salvage and compacted soil.';
    case 'fungal': return 'Spores and honeydew traces are likely.';
    case 'ruins': return 'Ancient salvage, silk, and insight fragments may remain.';
    case 'spring': return 'A rich honeydew seep if the route stays clear.';
    case 'silk': return 'Silk and wax if the web grove has not collapsed.';
    case 'sky': return 'Aether drafts and wing fragments at the edge of the map.';
    case 'hazard': return 'High-risk mapping run. Valuable salvage is uncertain.';
    case 'plains': return 'Mostly route mapping with only light common materials.';
    default: return 'Unknown findings beyond the current charted routes.';
  }
}

function buildTileExpeditionPlan(key) {
  const tile = getMapTileByKey(key);
  if (!tile || tile.revealed || tile.type === 'colony') return null;
  const distance = tileExpeditionDistance(key);
  const dangerScore = tileExpeditionDangerScore(tile);
  const bugs = tileExpeditionCrew(distance, dangerScore, tile.type);
  const bonus = capturedForwardNestBonusForKey(key, G);
  const duration = Math.max(45, Math.round(tileExpeditionDuration(distance, dangerScore, bugs, tile.type) * (bonus ? bonus.duration_mult : 1)));
  const rawPack = tileExpeditionPack(distance, dangerScore, bugs, tile.type);
  const pack = {};
  for (const [res, amt] of Object.entries(rawPack)) pack[res] = Math.max(1, Math.round(amt * (bonus ? bonus.pack_mult : 1)));
  return {
    key,
    icon: '◈',
    label: mapFrontierName(key),
    bugs,
    duration,
    danger_score: dangerScore,
    pack,
    reward_outlook: tileExpeditionRewardOutlook(tile),
    distance,
    tileType: tile.type,
    stagingBonus: bonus,
  };
}

function canLaunchTileExpedition(plan) {
  if (!plan) return { ok:false, reason:'Cannot explore this tile' };
  if (expSlotsFull()) return { ok:false, reason:'All expedition slots full' };
  if (idle() < plan.bugs) return { ok:false, reason:'Not enough idle bugs' };
  if (expeditionHasTarget(plan.key)) return { ok:false, reason:'Route already being explored' };
  if (!canAfford(plan.pack || {})) return { ok:false, reason:'Need more packed supplies' };
  return { ok:true, reason:'' };
}


let _expeditionEscortDraft = { key:'', escortIds:[] };

function mergeResourceBundles(...bundles) {
  const out = {};
  for (const bundle of bundles) {
    for (const [res, amt] of Object.entries(bundle || {})) {
      const val = Math.max(0, Math.round(Number(amt || 0)));
      if (!val) continue;
      out[res] = (out[res] || 0) + val;
    }
  }
  return out;
}

function expeditionEscortSelection(key) {
  if (!_expeditionEscortDraft || _expeditionEscortDraft.key !== key) return [];
  return Array.isArray(_expeditionEscortDraft.escortIds) ? [..._expeditionEscortDraft.escortIds] : [];
}

function expeditionEscortCandidates() {
  return (G.fighters || []).filter(f => f && f.status === 'idle');
}

function expeditionEscortPack(plan, escortIds = []) {
  const count = Math.max(0, escortIds.length || 0);
  if (!plan || !count) return {};
  const distance = Math.max(1, Math.ceil(Number(plan.distance || 1)));
  return {
    honeydew: count * (2 + distance),
    leaves: count * (distance >= 5 ? 2 : 1),
  };
}

function expeditionPackTotal(plan, escortIds = []) {
  return mergeResourceBundles(plan && plan.pack ? plan.pack : {}, expeditionEscortPack(plan, escortIds));
}

function expeditionEscortCount(exp) {
  return Array.isArray(exp && exp.escortIds) ? exp.escortIds.length : 0;
}

function expeditionEscortNames(exp) {
  if (!exp || !Array.isArray(exp.escortIds) || !exp.escortIds.length) return [];
  return exp.escortIds
    .map(fid => (G.fighters || []).find(f => f.id === fid))
    .filter(Boolean)
    .map(f => f.name);
}

function renderTileExpeditionConfirmMessage(key) {
  const plan = buildTileExpeditionPlan(key);
  if (!plan) return '<div style="font-size:11px;color:var(--text);">This tile can no longer be planned.</div>';
  const escorts = expeditionEscortSelection(key);
  const escortPack = expeditionEscortPack(plan, escorts);
  const totalPack = expeditionPackTotal(plan, escorts);
  const totalPackText = resourceBundleText(totalPack, { withNames:true }) || 'No supplies needed';
  const escortPackText = resourceBundleText(escortPack, { withNames:true }) || 'No escort overhead';
  const riskProfile = { ...plan, escortIds:escorts };
  const riskChance = Math.round(expeditionHazardChance(riskProfile) * 100);
  const casualtyChance = Math.round(expeditionCasualtyChance(riskProfile) * 100);
  const ambushChance = Math.round(expeditionRouteAmbushChance({ targetKey:key, danger_score:plan.danger_score, escortIds:escorts }) * 100);
  const destinationNote = expeditionNeedsDestinationScout({ targetKey:key, danger_score:plan.danger_score, escortIds:escorts, scoutResolved:false })
    ? (escorts.length ? 'If hostiles appear, the escort will auto-engage first.' : 'Hostile tiles may still need fighter support on arrival.')
    : (escorts.length ? 'Escort pressure should keep this destination stable.' : 'Low chance of needing fighters on arrival.');
  const ready = expeditionEscortCandidates();
  const selected = new Set(escorts);
  const escortButtons = ready.length
    ? ready.map(f => {
        const on = selected.has(f.id);
        const hero = f.hero ? ' ★' : '';
        return `<button class="save-link" style="margin:0;${on ? 'border-color:var(--purple);color:var(--purple);background:rgba(183,152,255,0.12);' : ''}" onclick="toggleExpeditionEscort('${f.id}');return false;">${on ? '✓ ' : ''}${f.name}${hero} · Lv${f.level}</button>`;
      }).join('')
    : '<div style="font-size:10px;color:var(--text-lo);">No idle fighters available to escort this mission.</div>';
  return `<div style="font-size:11px;line-height:1.55;color:var(--text);margin-bottom:10px;">Commit a survey team to ${plan.label.toLowerCase()}. The pack cost is consumed immediately when the group leaves the colony.</div>
    <div class="ending-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));margin:0 0 10px;">
      <div class="ending-stat"><strong>CREW</strong><span>${plan.bugs} bug${plan.bugs > 1 ? 's' : ''}</span></div>
      <div class="ending-stat"><strong>ETA</strong><span>${fmtExpTime(plan.duration)}</span></div>
      <div class="ending-stat"><strong>DISTANCE</strong><span>${plan.distance.toFixed(1)} tiles</span></div>
      <div class="ending-stat"><strong>THREAT</strong><span>${expeditionDangerLabel(plan)}${riskChance > 0 ? ` · ${riskChance}% setback` : ''}${casualtyChance > 0 ? ` · ${casualtyChance}% crew loss` : ''}</span></div>
    </div>
    <div style="font-family:var(--mono);font-size:9px;color:var(--purple);letter-spacing:1px;margin-bottom:4px;">OPTIONAL ESCORT</div>
    <div style="font-size:10px;color:var(--text-lo);margin-bottom:6px;">Choose up to 3 idle fighters. Escorts are committed to the route, add to pack costs, reduce ambush pressure, and auto-engage hostile contact before a manual distress call is needed.</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;">${escortButtons}</div>
    <div class="route-pull" style="margin-bottom:8px;color:${escorts.length ? 'var(--purple)' : 'var(--text-lo)'};">${escorts.length ? `${escorts.length} escort fighter${escorts.length > 1 ? 's' : ''} selected · Extra supplies: ${escortPackText}` : 'No escorts selected.'}</div>
    <div style="font-family:var(--mono);font-size:9px;color:var(--amber);letter-spacing:1px;margin-bottom:4px;">TOTAL PACK COST</div>
    <div style="font-size:11px;color:var(--text-hi);margin-bottom:6px;">${totalPackText}</div>
    <div style="font-size:10px;color:var(--text-lo);margin-bottom:10px;">Route ambush chance: ${ambushChance}% · ${destinationNote}${casualtyChance > 0 ? ` · Worst routes can also lose 1 survey bug without escort.` : ''}${plan.stagingBonus ? ` · ${plan.stagingBonus.label} is reducing pack strain on this route.` : ''}</div>
    ${plan.stagingBonus ? `<div style="font-size:10px;color:var(--amber);margin-bottom:8px;"><strong>${plan.stagingBonus.label}:</strong> ${Math.round((1 - plan.stagingBonus.pack_mult) * 100)}% lighter pack · ${Math.round((1 - plan.stagingBonus.duration_mult) * 100)}% faster travel.</div>` : ''}
    <div style="font-family:var(--mono);font-size:9px;color:var(--sky);letter-spacing:1px;margin-bottom:4px;">OUTLOOK</div>
    <div style="font-size:11px;color:var(--text);">${plan.reward_outlook}</div>`;
}

function refreshExpeditionPlanModal() {
  if (!_expeditionEscortDraft || !_expeditionEscortDraft.key) return;
  const body = document.getElementById('confirm-modal-body');
  if (!body) return;
  const msg = body.querySelector('.confirm-msg');
  if (msg) msg.innerHTML = renderTileExpeditionConfirmMessage(_expeditionEscortDraft.key);
}

function toggleExpeditionEscort(fid) {
  if (!_expeditionEscortDraft || !_expeditionEscortDraft.key) return;
  const fighter = (G.fighters || []).find(f => f.id === fid && f.status === 'idle');
  if (!fighter) {
    toast('That fighter is no longer idle.', 'warn');
    refreshExpeditionPlanModal();
    return;
  }
  let ids = Array.isArray(_expeditionEscortDraft.escortIds) ? [..._expeditionEscortDraft.escortIds] : [];
  if (ids.includes(fid)) {
    ids = ids.filter(id => id !== fid);
  } else {
    if (ids.length >= 3) {
      toast('Escort limit reached (3 fighters max).', 'warn');
      return;
    }
    ids.push(fid);
  }
  _expeditionEscortDraft = { key:_expeditionEscortDraft.key, escortIds:ids };
  refreshExpeditionPlanModal();
}

function getExpeditionEscortSquad(exp) {
  if (!exp || !Array.isArray(exp.escortIds) || !exp.escortIds.length) return [];
  return exp.escortIds
    .map(fid => (G.fighters || []).find(f => f.id === fid))
    .filter(Boolean);
}

function releaseExpeditionEscorts(exp) {
  for (const f of getExpeditionEscortSquad(exp)) {
    if (f.status === 'escorting' || f.expedition_key === (exp && exp.targetKey)) {
      if (f.status === 'escorting') {
        f.status = 'idle';
        f.recover_ticks = f.recover_ticks || 0;
      }
      delete f.zone;
      delete f.scout_elapsed;
      delete f.scout_duration;
    }
    delete f.expedition_key;
    delete f.expedition_role;
  }
}

function dispatchExpeditionEscort(exp) {
  if (!exp || !exp.supportZoneId) return false;
  const squad = getExpeditionEscortSquad(exp).filter(f => f.status === 'escorting' || f.status === 'idle');
  if (!squad.length) return false;
  const zone = buildExpeditionScoutZone(exp);
  if (!zone) return false;
  const hasSwift = squad.some(f => f.trait === 'swift');
  const effectiveDuration = hasSwift ? zone.duration * 0.75 : zone.duration;
  for (const f of squad) {
    f.status = 'scouting';
    f.zone = zone.id;
    f.scout_elapsed = 0;
    f.scout_duration = effectiveDuration;
    f.expedition_key = exp.targetKey;
    f.expedition_role = 'escort';
  }
  exp.awaitingScout = false;
  exp.scoutInFlight = true;
  exp.supportNote = `${squad.length} escort fighter${squad.length > 1 ? 's were' : ' was'} committed to the contact.`;
  log(`Escort engaged at ${zone.expedition_label}: ${squad.length} fighter${squad.length > 1 ? 's' : ''} moved to clear the route.`);
  toast(`Escort engaging at ${zone.expedition_label}`);
  return true;
}

function expeditionScoutZoneId(expOrKey) {
  const key = typeof expOrKey === 'string' ? expOrKey : (expOrKey && expOrKey.targetKey);
  return key ? `exp_contact_${String(key).replace(',', '_')}` : '';
}

function getExpeditionByScoutZone(zoneId) {
  if (!zoneId || !String(zoneId).startsWith('exp_contact_')) return null;
  const key = String(zoneId).replace('exp_contact_', '').replace('_', ',');
  return (G.expeditions || []).find(exp => exp && exp.targetKey === key) || null;
}

function expeditionCombatEnemyType(tileType) {
  switch (tileType) {
    case 'silk': return 'spider';
    case 'ruins': return 'ancient';
    case 'sky': return 'sky';
    case 'fungal': return 'fungal';
    case 'chitin': return 'beetle';
    case 'hazard': return 'insect';
    default: return 'rival';
  }
}

function buildExpeditionScoutRewards(exp, tile, power) {
  const def = tile && MAP_TILE_DEFS[tile.type] ? MAP_TILE_DEFS[tile.type] : null;
  const baseLoot = (def && def.loot) ? def.loot : buildTileExpeditionLoot(exp);
  const entries = Object.entries(baseLoot || {});
  const trimmed = {};
  for (const [res, amt] of entries.slice(0, 2)) {
    trimmed[res] = Math.max(2, Math.ceil((amt || 0) * 0.22));
  }
  trimmed.chitin = Math.max(trimmed.chitin || 0, 2 + Math.max(0, Math.round(power / 8)));
  const jelly = power >= 20 ? 2 : 1;
  return [
    { w:45, loot:{ ...trimmed, royal_jelly:jelly }, msg:'The fighter escort cut a path through the contact and secured the survey team.' },
    { w:35, loot:{ ...trimmed, honeydew:Math.max(6, 4 + Math.round(power / 5)) }, msg:'The squad scattered the threat and dragged back supply caches from the route.' },
    { w:20, loot:{ royal_jelly:jelly + (power >= 28 ? 1 : 0), chitin:(trimmed.chitin || 0) + 2, insight:tile && tile.type === 'ruins' ? 8 : 0 }, msg:'The hostile nest broke apart under pressure, leaving rare salvage behind.' },
  ];
}

function buildExpeditionScoutZone(exp) {
  if (!exp || !exp.targetKey) return null;
  const tile = getMapTileByKey(exp.targetKey);
  if (!tile) return null;
  const def = MAP_TILE_DEFS[tile.type] || { label:'Unknown Frontier', icon:'◈', desc:'Hostile movement ahead.' };
  const danger = Math.max(1, exp.danger_score || tileExpeditionDangerScore(tile) || 1);
  const distance = Math.max(1, tileExpeditionDistance(exp.targetKey));
  const contactKind = exp.scoutContactKind === 'route' ? 'Route Ambush' : 'Hostile Hold';
  const power = Math.max(8, Math.round(danger * 5 + distance * 1.8 + (exp.scoutContactKind === 'destination' ? 4 : 0)));
  const fighters = danger >= 5 ? 3 : danger >= 4 ? 2 : 1;
  const duration = Math.max(35, Math.round(32 + danger * 8 + distance * 3));
  return {
    id: expeditionScoutZoneId(exp),
    name: `${def.label} ${contactKind}`,
    tier: Math.max(2, Math.min(7, danger + 1)),
    icon: exp.scoutContactKind === 'route' ? '⚑' : '⚔',
    desc: exp.scoutContactKind === 'route'
      ? `The survey team for ${exp.label || mapFrontierName(exp.targetKey)} has run into hostiles on the approach. Dispatch fighters to clear the route.`
      : `The survey team reached ${exp.label || mapFrontierName(exp.targetKey)} but cannot finish mapping while hostile defenders hold the tile.`,
    enemy_type: expeditionCombatEnemyType(tile.type),
    power,
    duration,
    fighters,
    rewards: buildExpeditionScoutRewards(exp, tile, power),
    req: null,
    stageable: false,
    is_expedition_contact: true,
    scoutContactKind: exp.scoutContactKind || 'destination',
    expedition_key: exp.targetKey,
    expedition_label: exp.label || mapFrontierName(exp.targetKey),
  };
}

function getScoutZone(zoneId) {
  return TERRITORY_ZONES.find(z => z.id === zoneId) || buildExpeditionScoutZone(getExpeditionByScoutZone(zoneId)) || buildRivalBaseScoutZone(getRivalBaseByZoneId(zoneId));
}

function expeditionContactZones() {
  return (G.expeditions || [])
    .filter(exp => exp && exp.targetKey && !exp.done && (exp.awaitingScout || exp.scoutInFlight))
    .map(exp => buildExpeditionScoutZone(exp))
    .filter(Boolean);
}

function expeditionRouteAmbushChance(exp) {
  if (!(G.techs && G.techs.combat_training) || !exp || !exp.targetKey) return 0;
  const danger = Math.max(1, exp.danger_score || 1);
  if (danger <= 2) return 0;
  const tile = getMapTileByKey(exp.targetKey);
  const tileBias = tile && tile.type === 'hazard' ? 0.08 : tile && tile.type === 'sky' ? 0.05 : 0;
  let chance = Math.min(0.4, Math.max(0, (danger - 2) * 0.08 + tileBias));
  const escorts = expeditionEscortCount(exp);
  if (escorts > 0) chance *= Math.max(0.18, 1 - escorts * 0.28);
  const bonus = expeditionForwardNestBonus(exp);
  if (bonus) chance *= bonus.ambush_mult;
  return chance;
}

function expeditionNeedsDestinationScout(exp) {
  if (!(G.techs && G.techs.combat_training) || !exp || !exp.targetKey) return false;
  const tile = getMapTileByKey(exp.targetKey);
  if (!tile) return false;
  const danger = Math.max(1, exp.danger_score || tileExpeditionDangerScore(tile) || 1);
  const escorts = expeditionEscortCount(exp);
  if (tile.type === 'hazard') return danger >= Math.max(4, 6 - escorts);
  return danger >= Math.max(4, 5 - escorts);
}

function pauseExpeditionForScout(exp, contactKind) {
  if (!exp) return;
  exp.awaitingScout = true;
  exp.scoutInFlight = false;
  exp.scoutContactKind = contactKind;
  exp.supportZoneId = expeditionScoutZoneId(exp);
  if (dispatchExpeditionEscort(exp)) return;
}

function resolveExpeditionScoutOutcome(zone, outcome) {
  if (!zone || !zone.is_expedition_contact) return;
  const exp = getExpeditionByScoutZone(zone.id);
  if (!exp) return;
  const seg = expeditionPhaseBreakdown(exp);
  exp.awaitingScout = false;
  exp.scoutInFlight = false;
  exp.supportZoneId = '';
  exp.scoutResolved = true;
  if (outcome === 'loss') {
    exp.reportStatus = 'aborted';
    exp.abortReason = zone.scoutContactKind === 'route'
      ? `The fighter escort could not break the ambush threatening ${zone.expedition_label}. The survey team retreated before the tile could be charted.`
      : `The fighters were driven back from ${zone.expedition_label}. The survey team had to abandon the mapping run.`;
    releaseExpeditionEscorts(exp);
    exp.done = true;
    exp.elapsed = exp.duration;
    return;
  }
  if (exp.scoutContactKind === 'route') {
    exp.elapsed = Math.min(seg.travelOut, exp.elapsed);
    exp.supportNote = outcome === 'partial'
      ? 'Fighters broke the ambush, but the route back to the colony will be rough.'
      : 'Fighters cleared the route and the survey team pushed on.';
  } else {
    exp.elapsed = Math.min(exp.duration, seg.travelOut + seg.surveying);
    exp.supportNote = outcome === 'partial'
      ? 'Fighters forced the defenders back, but the team had to leave some finds behind.'
      : 'Fighters cleared the tile so the survey team could finish charting it.';
  }
  exp.reportStatus = 'secured';
  exp.lootMult = Math.min(exp.lootMult || 1, outcome === 'partial' ? 0.78 : 1);
}

function expeditionDescriptor(exp) {
  if (!exp) return null;
  if (exp.targetKey) {
    const tile = getMapTileByKey(exp.targetKey);
    return {
      type: 'tile',
      icon: exp.icon || '◈',
      name: exp.label || mapFrontierName(exp.targetKey),
      danger_score: exp.danger_score != null ? exp.danger_score : tileExpeditionDangerScore(tile),
      desc: exp.reward_outlook || tileExpeditionRewardOutlook(tile),
      pack: exp.pack || {},
      targetKey: exp.targetKey,
    };
  }
  const zone = EXPEDITIONS.find(z => z.id === exp.zone);
  if (!zone) return null;
  return {
    type: 'zone',
    icon: zone.icon,
    name: zone.name,
    danger_score: zone.danger_score,
    desc: zone.desc,
    pack: exp.pack || {},
    zone,
    targetKey: null,
  };
}

function canSendExpedition(zone) {
  if (!expZoneAvailable(zone)) return false;
  if (expSlotsFull()) return false;
  if (idle() < zone.bugs) return false;
  if ((G.expeditions || []).some(e => e.zone === zone.id)) return false;
  return true;
}

function sendExpedition(zoneId) {
  const zone = EXPEDITIONS.find(z => z.id === zoneId);
  if (!zone || !canSendExpedition(zone)) {
    toast(expSlotsFull() ? 'All expedition slots full' : idle() < zone.bugs ? 'Not enough idle bugs' : 'Cannot explore yet', 'warn');
    return;
  }
  if (!G.expeditions) G.expeditions = [];
  G.expeditions.push({
    zone: zone.id,
    bugs: zone.bugs,
    duration: zone.duration,
    elapsed: 0,
    done: false,
    pack: {},
  });
  const hadFirstExpPopup = hasSeenPopup('first_expedition');
  log(`Expedition sent: ${zone.name} (${zone.bugs} bug${zone.bugs > 1 ? 's' : ''})`);
  toast(`Exploring ${zone.name}...`);
  if (!hadFirstExpPopup) {
    showFeatureAnnounce('first_expedition');
  } else if (expeditionHazardChance(zone) > 0 && !hasSeenPopup('dangerous_expeditions')) {
    showFeatureAnnounce('dangerous_expeditions');
  }
  renderTab();
}

function planTileExpedition(key) {
  const plan = buildTileExpeditionPlan(key);
  const gate = canLaunchTileExpedition(plan);
  if (!plan) {
    toast('Select an unexplored tile', 'warn');
    return;
  }
  if (!gate.ok) {
    toast(gate.reason, 'warn');
    return;
  }
  _expeditionEscortDraft = { key, escortIds:[] };
  openConfirmModal({
    title:`EXPLORE ${plan.label.toUpperCase()}`,
    message: renderTileExpeditionConfirmMessage(key),
    confirmLabel:'SEND EXPEDITION',
    cancelLabel:'STAY HOME',
    onConfirm:() => launchTileExpedition(key),
  });
}

function launchTileExpedition(key) {
  const plan = buildTileExpeditionPlan(key);
  const gate = canLaunchTileExpedition(plan);
  if (!plan || !gate.ok) {
    toast(gate.reason || 'Cannot send expedition', 'warn');
    return;
  }
  const escortIds = expeditionEscortSelection(key).filter(fid => {
    const f = (G.fighters || []).find(f => f.id === fid);
    return f && f.status === 'idle';
  });
  const escortPack = expeditionEscortPack(plan, escortIds);
  const totalPack = expeditionPackTotal(plan, escortIds);
  if (!canAfford(totalPack)) {
    toast('Need more packed supplies for this escort setup', 'warn');
    return;
  }
  for (const [res, amount] of Object.entries(totalPack || {})) G.res[res] -= amount;
  for (const fid of escortIds) {
    const fighter = (G.fighters || []).find(f => f.id === fid);
    if (!fighter) continue;
    fighter.status = 'escorting';
    fighter.expedition_key = key;
    fighter.expedition_role = 'escort';
  }
  if (!G.expeditions) G.expeditions = [];
  G.expeditions.push({
    targetKey: key,
    label: plan.label,
    icon: plan.icon,
    bugs: plan.bugs,
    duration: plan.duration,
    elapsed: 0,
    done: false,
    danger_score: plan.danger_score,
    reward_outlook: plan.reward_outlook,
    pack: { ...totalPack },
    escortPack: { ...escortPack },
    escortIds: [...escortIds],
    routeChecked: false,
    destinationChecked: false,
    awaitingScout: false,
    scoutInFlight: false,
    scoutContactKind: '',
    supportZoneId: '',
    supportNote: '',
    reportStatus: '',
    abortReason: '',
    lootMult: 1,
    scoutResolved: false,
  });
  const packText = resourceBundleText(totalPack, { withNames:true, separator:', ' });
  const escortText = escortIds.length ? ` · Escort ${escortIds.length} fighter${escortIds.length > 1 ? 's' : ''}` : '';
  const hadFirstExpPopup = hasSeenPopup('first_expedition');
  log(`Expedition sent: ${plan.label} (${plan.bugs} bug${plan.bugs > 1 ? 's' : ''})${packText ? ` · Packed ${packText}` : ''}${escortText}.`);
  toast(`Expedition heading to ${plan.label}${escortIds.length ? ' with escort' : ''}`);
  _expeditionEscortDraft = { key:'', escortIds:[] };
  if (!hadFirstExpPopup) {
    showFeatureAnnounce('first_expedition');
  } else if (expeditionHazardChance({ ...plan, escortIds }) > 0 && !hasSeenPopup('dangerous_expeditions')) {
    showFeatureAnnounce('dangerous_expeditions');
  }
  renderAll();
}

function rollExpeditionReward(zone) {
  const totalW = zone.rewards.reduce((s, r) => s + r.w, 0);
  let rnd = Math.random() * totalW;
  for (const reward of zone.rewards) {
    rnd -= reward.w;
    if (rnd <= 0) return reward;
  }
  return zone.rewards[zone.rewards.length - 1];
}

function revealMapTilesToKey(key, extraCount = 0) {
  initMapIfNeeded();
  const [xRaw, yRaw] = (key || '').split(',');
  const tx = parseInt(xRaw, 10);
  const ty = parseInt(yRaw, 10);
  if (!Number.isFinite(tx) || !Number.isFinite(ty)) return 0;
  let revealed = 0;
  const revealKey = (rk) => {
    const tile = G.map.tiles[rk];
    if (!tile || tile.revealed) return false;
    tile.revealed = true;
    const td = MAP_TILE_DEFS[tile.type];
    if (td && td.bonus) applyMapBonus(td.bonus);
    revealed++;
    return true;
  };

  const steps = Math.max(1, Math.ceil(Math.sqrt((tx - MAP_COL_X) ** 2 + (ty - MAP_COL_Y) ** 2)));
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    const px = Math.round(MAP_COL_X + (tx - MAP_COL_X) * t);
    const py = Math.round(MAP_COL_Y + (ty - MAP_COL_Y) * t);
    if (px >= 0 && px < MAP_W && py >= 0 && py < MAP_H) revealKey(`${px},${py}`);
  }

  revealKey(key);

  if (extraCount > 0) {
    const candidates = [];
    for (let x = 0; x < MAP_W; x++) {
      for (let y = 0; y < MAP_H; y++) {
        const ck = `${x},${y}`;
        const tile = G.map.tiles[ck];
        if (!tile || tile.revealed || ck === key) continue;
        const dx = x - tx;
        const dy = (y - ty) * 1.35;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d <= 1.7) candidates.push({ ck, d });
      }
    }
    candidates.sort((a, b) => a.d - b.d);
    let extra = 0;
    for (const candidate of candidates) {
      if (extra >= extraCount) break;
      if (revealKey(candidate.ck)) extra++;
    }
  }

  if (revealed > 0) {
    log(`Territory mapped: ${revealed} new tile${revealed > 1 ? 's' : ''} revealed.`);
    discoverMapLandmarks(G);
  }
  return revealed;
}

function revealLandmarkRadius(key, count = 0) {
  initMapIfNeeded();
  if (!count) return 0;
  const [xRaw, yRaw] = (key || '').split(',');
  const tx = parseInt(xRaw, 10);
  const ty = parseInt(yRaw, 10);
  if (!Number.isFinite(tx) || !Number.isFinite(ty)) return 0;
  const candidates = [];
  for (let x = 0; x < MAP_W; x++) {
    for (let y = 0; y < MAP_H; y++) {
      const ck = `${x},${y}`;
      const tile = G.map.tiles[ck];
      if (!tile || tile.revealed || ck === key) continue;
      const dx = x - tx;
      const dy = (y - ty) * 1.35;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d <= 2.35) candidates.push({ ck, d });
    }
  }
  candidates.sort((a, b) => a.d - b.d);
  let revealed = 0;
  for (const candidate of candidates) {
    if (revealed >= count) break;
    const tile = G.map.tiles[candidate.ck];
    if (!tile || tile.revealed) continue;
    tile.revealed = true;
    const td = MAP_TILE_DEFS[tile.type];
    if (td && td.bonus) applyMapBonus(td.bonus);
    revealed++;
  }
  if (revealed > 0) discoverMapLandmarks(G);
  return revealed;
}

function claimMapLandmark(key) {
  initMapIfNeeded();
  const landmark = getMapLandmark(key);
  if (!landmark || !landmark.discovered || landmark.resolved) { toast('No discovery here', 'warn'); return; }
  if (!hasHatchedBug()) { toast(mapBugRequirementText(), 'warn'); return; }
  const def = landmarkDefById(landmark.id);
  const gained = [];
  for (const [res, amount] of Object.entries((landmark.reward && landmark.reward.gain) || {})) {
    if (G.res[res] === undefined) continue;
    const added = Math.min(amount, maxRes(res) - (G.res[res] || 0));
    if (added > 0) {
      G.res[res] += added;
      G.vis[res] = true;
      gained.push(`${RES[res].icon}+${added}`);
    }
  }
  const revealed = revealLandmarkRadius(key, Math.max(0, (landmark.reward && landmark.reward.reveal) || 0));
  if (landmark.reward && landmark.reward.bonus && Object.keys(landmark.reward.bonus).length) applyMapBonus(landmark.reward.bonus);
  landmark.resolved = true;
  const bonusText = resourceBundleText((landmark.reward && landmark.reward.bonus) || {}, { withNames:true, positive:true, separator:', ' });
  const parts = [];
  if (gained.length) parts.push(gained.join(' '));
  if (revealed > 0) parts.push(`${revealed} tile${revealed > 1 ? 's' : ''} revealed`);
  if (bonusText) parts.push(`route bonus ${bonusText}/s`);
  log(`Discovery resolved: ${def ? def.name : 'Landmark'}${parts.length ? ` — ${parts.join(' · ')}` : ''}.`);
  toast(`${def ? def.name : 'Discovery'} secured${gained.length ? ` · ${gained.join(' ')}` : ''}`);
  const mapContent = document.getElementById('map-content');
  if (mapContent) mapContent.innerHTML = tabMapContent();
  renderNavBadges();
}

  { id:'nursery_resin', tier:'uncommon', w:11, tileTypes:['thicket','spring','chitin'], icon:'●', name:'Nursery Resin Cache', desc:'Warm brood resin and sweet stores were hidden under root bark.', reward:{ honeydew:18, resin:6 }, hatch_boost:0.12 },
  { id:'silk_marker', tier:'uncommon', w:10, tileTypes:['silk','chitin','ruins'], icon:'∿', name:'Silk Marker Line', desc:'Silk ties mark a cleaner approach and attract fresh opportunity.', reward:{ silk:10, wax:6 }, reveal:1, event:'resource_bloom' },
  { id:'wind_glass', tier:'uncommon', w:9, tileTypes:['sky','ruins'], icon:'◇', name:'Wind-Glass Lens', desc:'A clear shard bends drafts into usable route sight.', reward:{ skyglass:5, aether:14 }, reveal:1 },
