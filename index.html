const RIVAL_TITLES = ['Matriarch','War-Caller','Spine-Seer','Tunnel Marshal','Brood Regent','Pollen Binder','March-Keeper','Hollow Judge'];
const RIVAL_DOCTRINES = ['swift raiders','route cutters','honey hunters','brood thieves','fort-breakers','fungal claimants','ambush keepers','root-sappers'];
const RIVAL_TEMPERAMENTS = ['vengeful','cunning','hungry','zealous'];
const RAID_TARGETS = [
  { id:'stores', label:'Amber Stores', desc:'They mean to strip your stockpiles and vanish before dusk.', losses:{honeydew:[50,110], leaves:[18,42], dirt:[18,42]} },
  { id:'brood', label:'Brood Chambers', desc:'They are after nursery feed and vulnerable hatch stores.', losses:{honeydew:[35,80], spores:[10,24]}, hatch:[0.12,0.22] },
  { id:'workshops', label:'Outer Workshops', desc:'They will smash tools, grab crafted stock, and run.', losses:{chitin:[6,14], silk:[4,12], resin:[4,10], wax:[4,10]} },
];
const RAID_RESPONSE_TICKS = 140;
const RAID_CHANCE = 0.000018;

function createConflictState() {
  return { rivals: [], raid: null, season_stamp: '', cooldown: 0, last_contact: null };
}

function ensureConflictState(state = G) {
  if (!state.conflict || typeof state.conflict !== 'object') state.conflict = createConflictState();
  if (!Array.isArray(state.conflict.rivals)) state.conflict.rivals = [];
  if (!('raid' in state.conflict)) state.conflict.raid = null;
  if (!Number.isFinite(state.conflict.cooldown)) state.conflict.cooldown = 0;
  if (typeof state.conflict.season_stamp !== 'string') state.conflict.season_stamp = '';
  if (!('last_contact' in state.conflict)) state.conflict.last_contact = null;
  state.conflict.rivals = state.conflict.rivals.map(r => ({
    id: r.id || ('rv_' + Math.random().toString(36).slice(2, 8)),
    prefix: r.prefix || 'Ash',
    house: r.house || 'Hive',
    title: r.title || RIVAL_TITLES[Math.floor(Math.random() * RIVAL_TITLES.length)],
    doctrine: r.doctrine || RIVAL_DOCTRINES[Math.floor(Math.random() * RIVAL_DOCTRINES.length)],
    temper: r.temper || RIVAL_TEMPERAMENTS[Math.floor(Math.random() * RIVAL_TEMPERAMENTS.length)],
    threat: Number.isFinite(r.threat) ? r.threat : 1,
    grudge: Number.isFinite(r.grudge) ? r.grudge : 0,
    raids: Number.isFinite(r.raids) ? r.raids : 0,
    repelled: Number.isFinite(r.repelled) ? r.repelled : 0,
    victories: Number.isFinite(r.victories) ? r.victories : 0,
    sightings: Number.isFinite(r.sightings) ? r.sightings : 0,
    last_kind: typeof r.last_kind === 'string' ? r.last_kind : '',
    last_target: typeof r.last_target === 'string' ? r.last_target : '',
    last_seen_tick: Number.isFinite(r.last_seen_tick) ? r.last_seen_tick : 0,
  }));
  return state.conflict;
}

function rivalFullName(rival) {
  return rival ? `${rival.prefix} ${rival.house}` : 'Unknown Colony';
}

function rivalSubtitle(rival) {
  return rival ? `${rival.title} · ${rival.doctrine}` : '';
}

function rivalScore(rival) {
  if (!rival) return 0;
  return (rival.threat || 1) + (rival.grudge || 0) * 0.85 + (rival.victories || 0) * 0.35 + (rival.raids || 0) * 0.2 + (rival.sightings || 0) * 0.04;
}

function rivalPressureLabel(rival) {
  if (!rival) return 'Quiet';
  const grudge = rival.grudge || 0;
  if (grudge >= 4.5) return 'Blood debt';
  if (grudge >= 3) return 'Revenge hunt';
  if ((rival.victories || 0) > (rival.repelled || 0) + 1) return 'Pressing border';
  if ((rival.repelled || 0) > (rival.victories || 0) + 1) return 'Licking wounds';
  return 'Testing routes';
}

function rivalGrudgePct(rival) {
  return Math.max(6, Math.min(100, Math.round(((rival && rival.grudge) || 0) / 6 * 100)));
}

function refreshConflictSeason(state = G) {
  const conflict = ensureConflictState(state);
  const stamp = `${(state.time && state.time.year) || 1}:${(state.time && state.time.s_idx) || 0}`;
  if (conflict.season_stamp !== stamp) {
    if (conflict.season_stamp) {
      for (const rival of conflict.rivals) {
        rival.grudge = Math.max(0, +(((rival.grudge || 0) - 0.75).toFixed(2)));
      }
    }
    conflict.season_stamp = stamp;
  }
  return conflict;
}

function rivalTaunt(rival, context = 'raid') {
  if (!rival) return '';
  const taunts = {
    vengeful: {
      raid: 'Their runners carve a bitter brood-mark nearby. This debt is not settled.',
      outpost: 'The attackers move like they remember this route. They came back for it.',
      zone: 'This patrol feels personal. The same enemy scent keeps returning.'
    },
    cunning: {
      raid: 'This strike is measured. They are testing where your shell is weakest.',
      outpost: 'Scouts slipped along the edge first. Someone mapped this route before the attack.',
      zone: 'The opposing patrol is disciplined, hidden, and prepared for a rematch.'
    },
    hungry: {
      raid: 'They come lean and fast, drawn by stores, brood-feed, and easy weight.',
      outpost: 'This border is being skimmed for materials. They want your route to feed theirs.',
      zone: 'The enemy advance like a foraging war-band, stripping everything valuable as they move.'
    },
    zealous: {
      raid: 'Their charge is ritualistic. They are here to prove dominance as much as steal.',
      outpost: 'The route has been marked with resin sigils. They mean to claim it openly.',
      zone: 'These fighters are not wandering. They are marching under a known banner.'
    }
  };
  const bank = taunts[rival.temper] || taunts.cunning;
  return bank[context] || bank.raid;
}

function weightedPickRival(roster, weightFn) {
  const weights = roster.map(r => Math.max(0.2, Number(weightFn(r)) || 0.2));
  const total = weights.reduce((s, n) => s + n, 0);
  let roll = Math.random() * total;
  for (let i = 0; i < roster.length; i++) {
    roll -= weights[i];
    if (roll <= 0) return roster[i];
  }
  return roster[roster.length - 1] || null;
}

function makeRival(state = G) {
  const conflict = ensureConflictState(state);
  const used = new Set(conflict.rivals.map(r => `${r.prefix}|${r.house}`));
  let prefix = 'Ash';
  let house = 'Hive';
  for (let i = 0; i < 40; i++) {
    prefix = RIVAL_NAME_PARTS_A[Math.floor(Math.random() * RIVAL_NAME_PARTS_A.length)];
    house = RIVAL_NAME_PARTS_B[Math.floor(Math.random() * RIVAL_NAME_PARTS_B.length)];
    if (!used.has(`${prefix}|${house}`)) break;
  }
  return {
    id: 'rv_' + Date.now() + '_' + Math.floor(Math.random() * 9999),
    prefix,
    house,
    title: RIVAL_TITLES[Math.floor(Math.random() * RIVAL_TITLES.length)],
    doctrine: RIVAL_DOCTRINES[Math.floor(Math.random() * RIVAL_DOCTRINES.length)],
    temper: RIVAL_TEMPERAMENTS[Math.floor(Math.random() * RIVAL_TEMPERAMENTS.length)],
    threat: +(0.9 + Math.random() * 0.55).toFixed(2),
    grudge: 0,
    raids: 0,
    repelled: 0,
    victories: 0,
    sightings: 0,
    last_kind: '',
    last_target: '',
    last_seen_tick: 0,
  };
}

function ensureRivalRoster(state = G, minCount = 2) {
  const conflict = refreshConflictSeason(state);
  while (conflict.rivals.length < minCount) conflict.rivals.push(makeRival(state));
  return conflict.rivals;
}

function getRivalById(id, state = G) {
  ensureConflictState(state);
  return (state.conflict.rivals || []).find(r => r.id === id) || null;
}

function primaryRival(state = G) {
  const roster = ensureRivalRoster(state, 1).slice();
  roster.sort((a, b) => rivalScore(b) - rivalScore(a));
  return roster[0] || null;
}

function knownPrimaryRival(state = G) {
  const rivals = state && state.conflict && Array.isArray(state.conflict.rivals)
    ? state.conflict.rivals.slice()
    : [];
  rivals.sort((a, b) => rivalScore(b) - rivalScore(a));
  return rivals[0] || null;
}

function pickConflictRival(state = G, opts = {}) {
  const roster = ensureRivalRoster(state, 2);
  const rival = weightedPickRival(roster, r => {
    let weight = 1 + rivalScore(r);
    if (opts.preferId && r.id === opts.preferId) weight *= 1.35;
    if (opts.preferRevenge && (r.grudge || 0) >= 2) weight *= 1.25;
    return weight;
  }) || roster[0] || null;
  if (rival) {
    rival.sightings = (rival.sightings || 0) + 1;
    rival.last_seen_tick = (state.time && state.time.tick) || 0;
    rival.last_kind = opts.kind || rival.last_kind || '';
    rival.last_target = opts.target || rival.last_target || '';
  }
  return rival;
}

function noteRivalOutcome(rivalId, field, state = G) {
  const rival = getRivalById(rivalId, state);
  if (!rival || !field) return;
  rival[field] = (rival[field] || 0) + 1;
  if (field === 'repelled') rival.grudge = Math.min(6, +(((rival.grudge || 0) + 1.1).toFixed(2)));
  else if (field === 'victories') rival.grudge = Math.min(6, +(((rival.grudge || 0) + 0.65).toFixed(2)));
  else if (field === 'raids') rival.grudge = Math.min(6, +(((rival.grudge || 0) + 0.2).toFixed(2)));
}

function zoneDisplayName(zone, state = G) {
  if (!zone) return '';
  if (!zone.id || !zone.id.startsWith('rival_')) return zone.name;
  const rival = primaryRival(state);
  if (!rival) return zone.name;
  if (zone.id === 'rival_scouts') return `${rivalFullName(rival)} Scouts`;
  if (zone.id === 'rival_vanguard') return `${rivalFullName(rival)} Vanguard`;
  if (zone.id === 'rival_citadel') return `${rivalFullName(rival)} Citadel`;
  return `${zone.name} · ${rivalFullName(rival)}`;
}

function outpostClaimLine(op) {
  if (!op || !op.rival_name) return '';
  if (op.status === 'contested') return `${op.rival_name} are trying to cut this route loose from your colony.`;
  if (op.status === 'dormant') return `${op.rival_name} currently hold this route. Reclaim it to restore supply flow.`;
  return '';
}

function canTriggerRaids(state = G) {
  return !!(state.techs && state.techs.combat_training) && (state.fighters || []).length > 0 && state.pop && state.pop.total >= 6 && ((state.stats && state.stats.scouts) || 0) >= 2;
}

function availableRaidTargets(state = G) {
  const out = [RAID_TARGETS[0], RAID_TARGETS[1]];
  if ((state.techs && (state.techs.weaving || state.techs.resin_extraction)) || (state.vis && (state.vis.silk || state.vis.resin || state.vis.wax || state.vis.chitin))) out.push(RAID_TARGETS[2]);
  return out;
}

function randRange(min, max) {
  return min + Math.random() * (max - min);
}

function buildRaidPayload(target, state = G) {
  const scale = 1 + Math.max(0, (state.time.year || 1) - 1) * 0.12 + Math.min(0.55, (((state.stats && state.stats.scouts) || 0) * 0.01));
  const losses = {};
  for (const [res, pair] of Object.entries(target.losses || {})) {
    if (state.res[res] === undefined) continue;
    if ((state.res[res] || 0) <= 0 && !state.vis[res]) continue;
    losses[res] = Math.max(1, Math.round(randRange(pair[0], pair[1]) * scale));
  }
  return {
    losses,
    hatchLoss: target.hatch ? randRange(target.hatch[0], target.hatch[1]) : 0,
  };
}

function raidLossPreview(raid) {
  if (!raid) return '';
  const parts = [];
  const bundle = rewardSummary(raid.losses || {});
  if (bundle) parts.push(bundle);
  if (raid.hatch_loss > 0) parts.push(`${Math.round(raid.hatch_loss * 100)}% hatch progress`);
  return parts.join(' · ');
}

function raidSecondsLeft(raid) {
  return Math.max(0, Math.ceil(((raid && raid.ticks_left) || 0) * TICK_MS / 1000));
}

function zoneDescText(zone) {
  if (!zone || !zone.id || !zone.id.startsWith('rival_')) return zone ? zone.desc : '';
  const rival = primaryRival();
  if (!rival) return zone.desc;
  const rematch = (rival.grudge || 0) >= 3 ? 'The border feud has turned personal and the same brood-sign keeps surfacing.' : 'Recent scouts report the same brood-mark deeper in the tunnels.';
  return `${zone.desc} ${rivalFullName(rival)} — ${rivalSubtitle(rival)}. ${rematch} ${rivalTaunt(rival, 'zone')}`;
}

const ENEMY_TYPE_LABELS = {
  insect:  { label:'INSECT SWARM', cls:'enemy-termite' },
  beetle:  { label:'ARMOURED BEETLE', cls:'enemy-termite' },
  termite: { label:'TERMITE FORMATION', cls:'enemy-termite' },
  spider:  { label:'AMBUSH PREDATOR', cls:'enemy-spider' },
  fungal:  { label:'FUNGAL COLONY', cls:'enemy-fungal' },
  rival:   { label:'RIVAL COLONY', cls:'enemy-rival' },
  ancient: { label:'ANCIENT GUARDIAN', cls:'enemy-ancient' },
  tyrant:  { label:'WAR-TYRANT · BOSS', cls:'enemy-tyrant' },
  sky:     { label:'SKY PREDATOR', cls:'enemy-sky' },
};

function enemyTypeBadge(zone) {
  if (!zone.enemy_type) return '';
  const et = ENEMY_TYPE_LABELS[zone.enemy_type];
  if (!et) return '';
  return `<span class="zone-enemy-type ${et.cls}">${et.label}</span>`;
}

function rivalIntelPanelHTML() {
  if (!G.techs.combat_training) return '';
  const lead = primaryRival(G);
  const rivals = ensureRivalRoster(G, 2).slice().sort((a, b) => rivalScore(b) - rivalScore(a)).slice(0, 3);
  if (!rivals.length) return '';
  return `<div class="guide-panel" style="margin-bottom:10px;border-color:rgba(255,139,137,0.22);background:linear-gradient(180deg, rgba(60,18,18,0.24), rgba(11,17,14,0.94));">
    <div class="guide-title" style="color:var(--red)">RIVAL INTEL</div>
    <div class="guide-grid">
      ${rivals.map(r => `<div class="guide-item" style="${lead && lead.id === r.id ? 'border-color:rgba(255,139,137,0.35);box-shadow:0 0 0 1px rgba(255,139,137,0.10);' : ''}"><strong>${rivalFullName(r)}${lead && lead.id === r.id ? `<span class="boss-badge" style="margin-left:6px;">NEMESIS</span>` : ''}</strong><div style="font-size:9px;color:var(--red);line-height:1.45;margin-top:2px;font-family:var(--mono);">${rivalSubtitle(r)}</div><div style="font-size:10px;color:var(--text-lo);line-height:1.45;margin-top:4px;">Threat x${Number.isFinite(r.threat) ? r.threat.toFixed(2) : '1.00'} · raids ${r.raids || 0} · repelled ${r.repelled || 0} · victories ${r.victories || 0}</div><div class="mini-progress" style="margin-top:6px;height:5px;"><div class="mini-progress-fill" style="width:${rivalGrudgePct(r)}%;background:linear-gradient(90deg, #6b1111, var(--red));"></div></div><div style="font-size:9px;color:var(--amber);margin-top:4px;line-height:1.4;">${rivalPressureLabel(r)}${(r.grudge || 0) >= 3 ? ' · likely to seek a rematch' : ''}</div></div>`).join('')}
    </div>
    <div class="soft-note">Rivals remember losses. Repel them and their grudge rises, making revenge raids and repeat border clashes more likely until the season cools the feud.</div>
  </div>`;
}


function ensureRivalBaseState(state = G) {
  if (!Array.isArray(state.rival_bases)) state.rival_bases = [];
  return state.rival_bases;
}

function rivalBaseSeed(key, salt = 0, state = G) {
  const seedBase = ((state.map && state.map.seed) || 0) + (salt * 977);
  let acc = seedBase >>> 0;
  for (let i = 0; i < String(key || '').length; i++) acc = ((acc * 33) ^ String(key).charCodeAt(i)) >>> 0;
  return acc >>> 0;
}

function tileDistanceBetweenKeys(keyA, keyB) {
  if (!keyA || !keyB) return Infinity;
  const [axRaw, ayRaw] = keyA.split(',');
  const [bxRaw, byRaw] = keyB.split(',');
  const ax = parseInt(axRaw, 10), ay = parseInt(ayRaw, 10);
  const bx = parseInt(bxRaw, 10), by = parseInt(byRaw, 10);
  if (!Number.isFinite(ax) || !Number.isFinite(ay) || !Number.isFinite(bx) || !Number.isFinite(by)) return Infinity;
  const dx = ax - bx;
  const dy = (ay - by) * 1.35;
  return Math.sqrt(dx * dx + dy * dy);
}

function getRivalBaseSite(key, state = G) {
  return ensureRivalBaseState(state).find(base => base.key === key) || null;
}

function getRivalBaseById(id, state = G) {
  return ensureRivalBaseState(state).find(base => base.id === id) || null;
}

function getRivalBaseByZoneId(zoneId, state = G) {
  if (!zoneId || !zoneId.startsWith('rival_base_')) return null;
  return getRivalBaseById(zoneId.replace('rival_base_', ''), state);
}

function rivalBaseDesiredCount(state = G) {
  if (!(state.techs && state.techs.colonial_culture && state.techs.combat_training) || !(state.map && state.map.tiles)) return 0;
  const revealed = Object.values(state.map.tiles).filter(t => t && t.revealed && t.type !== 'colony').length;
  return Math.max(0, Math.min(4, Math.floor(Math.max(0, revealed - 8) / 18) + 1));
}

function rivalBaseTileEligible(key, tile, state = G) {
  if (!tile || !tile.revealed) return false;
  if (!tile.type || tile.type === 'colony' || tile.type === 'plains' || tile.type === 'hazard') return false;
  if (tile.claimed) return false;
  if (getOutpost(key)) return false;
  if (getRivalBaseSite(key, state)) return false;
  const distance = tileExpeditionDistance(key);
  if (distance < 4.2) return false;
  return true;
}

function rivalBaseCandidateScore(key, tile, state = G) {
  const distance = tileExpeditionDistance(key);
  const danger = tileExpeditionDangerScore(tile);
  const typeBias = {
    ruins: 0.27,
    chitin: 0.23,
    fungal: 0.19,
    silk: 0.17,
    spring: 0.15,
    thicket: 0.12,
    sky: 0.10,
  }[tile.type] || 0.08;
  const rng = seededRng(rivalBaseSeed(key, 41, state));
  return typeBias + Math.min(0.18, Math.max(0, distance - 4) * 0.034) + Math.max(0, danger - 2) * 0.035 + rng() * 0.28;
}

function rivalBaseLabel(base, state = G) {
  const rival = getRivalById(base && base.rival_id, state);
  const tile = base ? getMapTileByKey(base.key) : null;
  const terrain = tile && MAP_TILE_DEFS[tile.type] ? MAP_TILE_DEFS[tile.type].label : 'Frontier';
  const rivalName = rival ? rivalShortName(rival) : 'Rival';
  return `${rivalName} ${terrain} Nest`;
}

function refreshRivalBaseDiscoveries(state = G) {
  const sites = ensureRivalBaseState(state);
  if (!(state.techs && state.techs.colonial_culture && state.techs.combat_training) || !(state.map && state.map.tiles)) return sites;
  const desired = rivalBaseDesiredCount(state);
  if (sites.length >= desired) return sites;
  const roster = ensureRivalRoster(state, 2);
  const candidates = [];
  for (const [key, tile] of Object.entries(state.map.tiles)) {
    if (!rivalBaseTileEligible(key, tile, state)) continue;
    const score = rivalBaseCandidateScore(key, tile, state);
    if (score < 0.49) continue;
    candidates.push({ key, tile, score });
  }
  candidates.sort((a, b) => b.score - a.score);
  while (sites.length < desired && candidates.length) {
    const picked = candidates.shift();
    if (!picked || getRivalBaseSite(picked.key, state)) continue;
    const rivalSeed = seededRng(rivalBaseSeed(picked.key, 73, state))();
    const rival = roster[Math.floor(rivalSeed * roster.length)] || roster[0] || null;
    const base = {
      id: 'rb_' + rivalBaseSeed(picked.key, 89, state).toString(36),
      key: picked.key,
      tileType: picked.tile.type,
      rival_id: rival ? rival.id : null,
      status: 'hostile',
      discovered_tick: (state.time && state.time.tick) || 0,
      captured_tick: 0,
      score: Number(picked.score.toFixed(3)),
    };
    sites.push(base);
    if (state === G && G.time && G.time.tick > 0) {
      const name = rivalBaseLabel(base, state);
      const rivalName = rival ? rivalFullName(rival) : 'A rival colony';
      log(`Scouts uncover ${name}. ${rivalName} has been fortifying this route.`, 'ev');
      toast('Rival base discovered!', 'warn');
    }
  }
  return sites;
}

function rivalBaseScoutPower(base, state = G) {
  const tile = getMapTileByKey(base && base.key);
  const danger = tileExpeditionDangerScore(tile);
  const distance = tileExpeditionDistance(base && base.key);
  const rival = getRivalById(base && base.rival_id, state);
  return Math.max(26, Math.round(18 + distance * 4 + danger * 6 + (rival ? rival.threat * 6 : 0)));
}

function rivalBaseScoutFighters(base) {
  const distance = tileExpeditionDistance(base && base.key);
  return distance >= 7 ? 3 : 2;
}

function rivalBaseScoutDuration(base) {
  const tile = getMapTileByKey(base && base.key);
  const danger = tileExpeditionDangerScore(tile);
  const distance = tileExpeditionDistance(base && base.key);
  return Math.max(80, Math.round(70 + distance * 11 + danger * 8));
}

function buildRivalBaseScoutZone(base, state = G) {
  if (!base || base.status !== 'hostile') return null;
  const tile = getMapTileByKey(base.key);
  if (!tile) return null;
  const rival = getRivalById(base.rival_id, state);
  const tier = Math.max(4, Math.min(8, Math.round(tileExpeditionDangerScore(tile) + tileExpeditionDistance(base.key) * 0.45)));
  return {
    id: 'rival_base_' + base.id,
    name: rivalBaseLabel(base, state),
    tier,
    icon: '⟁',
    desc: `${rival ? rivalFullName(rival) : 'A rival colony'} has entrenched a forward nest on this route. Break the defenders and the site can be converted into a forward outpost.`,
    enemy_type: 'rival',
    power: rivalBaseScoutPower(base, state),
    duration: rivalBaseScoutDuration(base),
    fighters: rivalBaseScoutFighters(base),
    rewards: [
      { w:35, loot:{honeydew:36, chitin:14, resin:8}, msg:'The nest stores held route food and hardened materials.' },
      { w:35, loot:{royal_jelly:3, silk:12, wax:10}, msg:'The defenders were guarding a compact jelly reserve.' },
      { w:30, loot:{compound:3, chitin:18, resin:12}, msg:'Fortified plating and advanced route tools were seized.' },
    ],
    req: null,
    stageable: false,
    is_rival_base: true,
    base_key: base.key,
    rival_id: base.rival_id,
  };
}

function rivalBaseZones(state = G) {
  refreshRivalBaseDiscoveries(state);
  return ensureRivalBaseState(state).filter(base => base.status === 'hostile').map(base => buildRivalBaseScoutZone(base, state)).filter(Boolean);
}

function rivalBaseZonesKnown(state = G) {
  return ensureRivalBaseState(state).filter(base => base.status === 'hostile').map(base => buildRivalBaseScoutZone(base, state)).filter(Boolean);
}

function capturedForwardNestBonusForKey(key, state = G) {
  if (!key) return null;
  const active = (state.outposts || []).filter(op => op && op.rival_base && op.status === 'active');
  if (!active.length) return null;
  let best = null;
  for (const op of active) {
    const dist = tileDistanceBetweenKeys(op.key, key);
    if (!Number.isFinite(dist) || dist > 4.8) continue;
    if (!best || dist < best.dist) best = { op, dist };
  }
  if (!best) return null;
  const radiusFactor = Math.max(0, 1 - best.dist / 4.8);
  const pack_mult = Math.max(0.72, 1 - (0.10 + radiusFactor * 0.12));
  const duration_mult = Math.max(0.78, 1 - (0.07 + radiusFactor * 0.11));
  const ambush_mult = Math.max(0.55, 1 - (0.16 + radiusFactor * 0.18));
  return {
    op: best.op,
    dist: best.dist,
    pack_mult,
    duration_mult,
    ambush_mult,
    label: `${best.op.name} staging`,
    note: `${best.op.name} cuts pack strain and travel time on nearby routes.`,
  };
}

function resolveRivalBaseScoutOutcome(zone, outcome, state = G) {
  if (!zone || !zone.is_rival_base) return;
  const base = getRivalBaseSite(zone.base_key, state);
  if (!base) return;
  const rival = getRivalById(base.rival_id, state);
  if (outcome === 'loss') {
    log(`The assault on ${rivalBaseLabel(base, state)} failed. ${rival ? rivalFullName(rival) : 'The rival colony'} keeps the route locked down.`, 'bad');
    toast('Rival base held', 'bad');
    return;
  }
  base.status = 'captured';
  base.captured_tick = (state.time && state.time.tick) || 0;
  log(`${rivalBaseLabel(base, state)} has fallen. The route can now be converted into a forward nest on the Map.`, 'ev');
  toast('Rival base captured!', '');
}

function startRaid(state = G) {
  const conflict = ensureConflictState(state);
  if (!canTriggerRaids(state) || conflict.raid) return null;
  const rival = pickConflictRival(state, { kind:'raid', target:'colony', preferRevenge:true });
  const targets = availableRaidTargets(state);
  const target = targets[Math.floor(Math.random() * targets.length)] || RAID_TARGETS[0];
  const payload = buildRaidPayload(target, state);
  const outposts = (state.outposts || []).filter(o => o.status === 'active').length;
  const basePower = 10 + (state.time.year || 1) * 3 + Math.round((((state.stats && state.stats.scouts) || 0) * 0.3)) + outposts * 2;
  const raid = {
    id: 'raid_' + Date.now() + '_' + Math.floor(Math.random() * 9999),
    rival_id: rival ? rival.id : null,
    rival_name: rivalFullName(rival),
    target_id: target.id,
    target_label: target.label,
    target_desc: target.desc,
    losses: payload.losses,
    hatch_loss: payload.hatchLoss,
    power: Math.max(8, Math.round(basePower * (rival ? rival.threat : 1) * randRange(0.9, 1.3))),
    ticks_left: RAID_RESPONSE_TICKS,
  };
  conflict.raid = raid;
  conflict.cooldown = 220 + Math.floor(Math.random() * 140);
  if (rival) rival.raids = (rival.raids || 0) + 1;
  conflict.last_contact = { type:'raid', rival_id: raid.rival_id, tick: (state.time && state.time.tick) || 0 };
  const colTarget = G.colonyName ? `${G.colonyName}'s` : 'your';
  const revengeTail = rival && (rival.grudge || 0) >= 3 ? ' It reads like a revenge strike, not a random raid.' : '';
  const taunt = rival ? ` ${rivalTaunt(rival, 'raid')}` : '';
  log(`⚠ ${raid.rival_name} launch a raid on ${colTarget} ${raid.target_label}.${revengeTail}${taunt}`, 'bad');
  toast(`${raid.rival_name} raiding!`, 'bad');
  if (state === G && !hasSeenPopup('rival_colonies')) showFeatureAnnounce('rival_colonies');
  return raid;
}

function applyRaidLoss(raid, state = G, reason = 'Raiders slip past the perimeter.') {
  if (!raid) return '';
  const taken = {};
  for (const [res, amount] of Object.entries(raid.losses || {})) {
    const current = state.res[res] || 0;
    const stolen = Math.min(current, amount);
    if (stolen > 0) {
      state.res[res] = Math.max(0, current - stolen);
      taken[res] = stolen;
    }
  }
  if (raid.hatch_loss > 0 && state.hatch) state.hatch.progress = Math.max(0, state.hatch.progress - raid.hatch_loss);
  if (raid.rival_id) noteRivalOutcome(raid.rival_id, 'victories', state);
  // Queen takes damage from successful raids
  if (state === G && G.pop.total >= 1) queenInjuryDamage(3 + Math.floor(raid.power * 0.06));
  const summary = raidLossPreview({ losses:taken, hatch_loss:raid.hatch_loss });
  log(`${reason} ${raid.rival_name} escape with ${summary || 'supplies'}.`, 'bad');
  toast('Raiders broke through', 'bad');
  ensureConflictState(state).raid = null;
  return summary;
}

function defendRaid() {
  const conflict = ensureConflictState(G);
  const raid = conflict.raid;
  if (!raid) { toast('No active raid', 'warn'); return; }
  const idleFighters = (G.fighters || []).filter(f => f.status === 'idle');
  if (!idleFighters.length) { toast('No idle fighters available to defend', 'warn'); return; }
  const squad = idleFighters.slice(0, Math.min(3, idleFighters.length));
  const totalPower = squad.reduce((s, f) => s + fighterPower(f), 0);
  const effectivePower = totalPower * (0.72 + Math.random() * 0.55);
  const fortBonus = colonyProjectBonus('fortified');
  const defenceThreshold = fortBonus > 0 ? 0.72 * (1 - fortBonus * 0.45) : 0.72;
  const outcome = effectivePower >= raid.power * defenceThreshold ? 'win' : 'loss';
  const xpGain = outcome === 'win' ? 14 : 5;
  const hasRallyingDefender = squad.some(f => f.trait === 'rallying');

  squad.forEach(f => {
    f.xp = (f.xp || 0) + xpGain;
    let dmg = outcome === 'win'
      ? Math.ceil(raid.power * 0.07 + Math.random() * 2)
      : Math.ceil(raid.power * 0.28 + Math.random() * 4);
    if (f.trait === 'steadfast') dmg = Math.floor(dmg * 0.70);
    else if (hasRallyingDefender && f.trait !== 'rallying') dmg = Math.floor(dmg * 0.85);
    const scar = f.scar ? BATTLE_SCARS[f.scar] : null;
    if (scar && scar.dmg_taken_mult) dmg = Math.floor(dmg * scar.dmg_taken_mult);
    const hpFloor = (scar && scar.hp_floor) ? scar.hp_floor : 1;
    const hpBefore = f.hp;
    f.hp = Math.max(hpFloor, f.hp - dmg);
    while (f.xp >= f.xp_next) {
      f.xp -= f.xp_next;
      f.level++;
      f.max_hp = fighterMaxHp(f.level);
      f.xp_next = fighterXpNext(f.level);
      log(`⭐ ${f.name} reached Level ${f.level}!`);
      toast(`${f.name} is now Level ${f.level}!`);
    }
    // Near-death scar grant (same logic as resolveScout)
    if (!f.hero && !f.scar && f.max_hp > 0 && f.hp <= Math.ceil(f.max_hp * 0.20) && hpBefore > Math.ceil(f.max_hp * 0.20)) {
      f.near_deaths = (f.near_deaths || 0) + 1;
      const scarKey = randomBattleScar();
      f.scar = scarKey;
      const newMaxHp = fighterEffectiveMaxHp(f);
      f.max_hp = newMaxHp;
      f.hp = Math.max(hpFloor, Math.min(f.hp, newMaxHp));
      const scarDef = BATTLE_SCARS[scarKey];
      log(`${f.name} barely survived the raid — a battle scar takes hold: ${scarDef.icon} ${scarDef.name}. ${scarDef.desc}`, 'ev');
      toast(`${f.name} earned a battle scar: ${scarDef.name}`, '');
    }
    if (f.hp < f.max_hp * 0.6 && f.max_hp > 0) {
      f.status = 'recovering';
      const healMult = (f.scar && BATTLE_SCARS[f.scar] && BATTLE_SCARS[f.scar].heal_mult) ? BATTLE_SCARS[f.scar].heal_mult : 1;
      f.recover_ticks = Math.ceil((f.max_hp - f.hp) * 10 * healMult);
    }
  });

  G.stats.scouts = (G.stats.scouts || 0) + 1;

  if (outcome === 'win') {
    const spoils = { honeydew: Math.max(12, Math.round(raid.power * 0.8)) };
    if (G.techs.chitin_harvesting) spoils.chitin = Math.max(2, Math.round(raid.power * 0.14));
    if (G.techs.resin_extraction) spoils.resin = Math.max(1, Math.round(raid.power * 0.08));
    const gained = grantTradeRewardBundle(spoils, G);
    if (raid.rival_id) noteRivalOutcome(raid.rival_id, 'repelled');
    log(`Raid repelled! ${raid.rival_name} break on your perimeter. ${gained.length ? gained.join(', ') : 'No room for captured spoils.'}`);
    toast('Raid repelled!');
    conflict.raid = null;
  } else {
    applyRaidLoss(raid, G, `Defence failed at the ${raid.target_label}.`);
  }
  renderTab();
}

function tickRaids(dt) {
  const conflict = ensureConflictState(G);
  if (conflict.cooldown > 0) conflict.cooldown--;
  if (conflict.raid) {
    conflict.raid.ticks_left = (conflict.raid.ticks_left || 0) - 1;
    if (conflict.raid.ticks_left <= 0) applyRaidLoss(conflict.raid, G, `${conflict.raid.rival_name} hit before the colony could respond.`);
    return;
  }
  if (!canTriggerRaids(G) || conflict.cooldown > 0) return;
  const outpostPressure = (G.outposts || []).filter(o => o.status === 'active').length * 0.000005;
  const scoutPressure = Math.min(0.000018, ((G.stats.scouts || 0) * 0.0000018));
  const seasonalPressure = seasonName() === 'Winter' ? 0.000006 : 0;
  const chance = RAID_CHANCE + outpostPressure + scoutPressure + seasonalPressure;
  if (Math.random() < chance * dt * 200) startRaid(G);
}

function fmt(n) {
  if (n === undefined || n === null || Number.isNaN(n)) return '0';
  if (n >= 1e9) return (n/1e9).toFixed(2)+'B';
  if (n >= 1e6) return (n/1e6).toFixed(2)+'M';
  if (n >= 1000) return (n/1000).toFixed(1)+'k';
  if (n >= 100) return Math.floor(n).toString();
  if (n >= 10) return n.toFixed(1);
  return n.toFixed(2);
}

function fmtR(r) {
  if (!r || Math.abs(r) < 0.0001) return '';
  return (r > 0 ? '+' : '') + r.toFixed(3) + '/s';
}

function seasonName() {

function ensureGatherState(state = G) {
  if (!state.gather || typeof state.gather !== 'object') state.gather = { cooldown:0 };
  if (!Number.isFinite(state.gather.cooldown)) state.gather.cooldown = 0;
  state.gather.cooldown = Math.max(0, state.gather.cooldown);
  return state.gather;
}

function gatherBurstUnlocked(state = G) {
  const jobCount = Object.values((state.jobs || {})).reduce((sum, n) => sum + (n || 0), 0);
  return (((state.bldgs || {}).clover_patch) || 0) > 0 || jobCount > 0;
}

function gatherBurstReady(state = G) {
  ensureGatherState(state);

}

function gatherBurstAmount() {

function gatherSideRollMult() {

const OPENING_PATHS = {

    id:'growth', icon:'🥚', title:'Brood Wake', badge:'GROWTH OPENING',

    effect_line:'+40% hatch speed for the opening season · slightly weaker manual foraging',

  }

function openingPathDays(state = G) {
  const time = state.time || { year:1, s_idx:0, day:0 };
  return Math.max(0, ((time.year || 1) - 1) * 4 * DAYS_PER_SEASON + (time.s_idx || 0) * DAYS_PER_SEASON + (time.day || 0));
}

function openingPathOfferOpen(state = G) {
  return !!(!(state.meta && state.meta.opening_path) && openingPathDays(state) <= 40 && (state.pop.total || 0) <= 1 && !(state.techs && state.techs.natural_philosophy));
}

function openingPathActive(state = G) {
  if (!(state.meta && state.meta.opening_path)) return false;
  return openingPathDays(state) < OPENING_PATH_MAX_DAYS && (state.pop.total || 0) < OPENING_PATH_MAX_POP;
}

function openingPathEffect(state = G) {
  const effect = { hatch_mult:1, gather_mult:1, side_mult:1, honeydew_rate:0, upkeep_mult:1, label:'' };
  if (!(state.meta && state.meta.opening_path)) return effect;
  if (!openingPathActive(state)) return effect;
  switch (state.meta.opening_path) {
    case 'growth':
      effect.hatch_mult = 1.40;
      effect.gather_mult = 0.96;
      effect.label = 'Brood Wake';
      break;
    case 'safety':
      effect.hatch_mult = 0.94;
      effect.honeydew_rate = 0.03;
      effect.upkeep_mult = 0.78;
      effect.label = 'Rooted Stores';
      break;
    case 'risk': {
      const rich = (state.meta.opening_cache_outcome || 'rich') === 'rich';
      effect.hatch_mult = rich ? 1.00 : 0.94;
      effect.gather_mult = rich ? 1.38 : 1.22;
      effect.side_mult = rich ? 1.26 : 1.14;
      effect.label = rich ? 'Wild Cache · Rich Haul' : 'Wild Cache · Spoiled Haul';
      break;
    }
  }
  return effect;
}

function openingPathSummary(state = G) {
  const meta = state.meta || {};
  const def = OPENING_PATHS[meta.opening_path];
  if (!def) return '';
  const active = openingPathActive(state);
  const daysLeft = Math.max(0, OPENING_PATH_MAX_DAYS - openingPathDays(state));
  const bugsLeft = Math.max(0, OPENING_PATH_MAX_POP - (state.pop.total || 0));
  let line = def.effect_line;
  if (meta.opening_path === 'risk') {
    line += (meta.opening_cache_outcome === 'rich')
      ? ' · the cache broke in your favour'
      : ' · the cache was partly spoiled, so the brood opens shakier';
  }
  return active
    ? `${def.icon} ${def.title} · ${line}. Fades after ${bugsLeft} more bug${bugsLeft === 1 ? '' : 's'} or ${daysLeft} day${daysLeft === 1 ? '' : 's'}.`
    : `${def.icon} ${def.title} shaped the colony's opening. The colony is now established.`;
}

function addOpeningResources(bundle, state = G) {
  if (!bundle) return;
  for (const [res, amount] of Object.entries(bundle)) {
    if (!Number.isFinite(amount) || amount <= 0) continue;
    state.res[res] = Math.min(maxRes(res), (state.res[res] || 0) + amount);
    state.vis[res] = true;
  }
}

function chooseOpeningPath(pathId) {
  if (!openingPathOfferOpen(G)) return;
  const def = OPENING_PATHS[pathId];
  if (!def) return;
  G.meta.opening_path = pathId;
  G.meta.opening_cache_outcome = null;
  if (pathId === 'growth') {
    addOpeningResources({ honeydew:12, leaves:2 }, G);
    G.hatch.progress = Math.min(0.95, (G.hatch.progress || 0) + 0.34);
    log('Founding instinct chosen: Brood Wake. The clutch is stirred aggressively.');
    toast('Opening chosen: Brood Wake');
  } else if (pathId === 'safety') {
    addOpeningResources({ honeydew:14, leaves:7, dirt:4 }, G);
    log('Founding instinct chosen: Rooted Stores. The colony banks food and building stock first.');
    toast('Opening chosen: Rooted Stores');
  } else if (pathId === 'risk') {
    const rich = Math.random() < 0.70;
    G.meta.opening_cache_outcome = rich ? 'rich' : 'spoiled';
    addOpeningResources(rich ? { honeydew:16, leaves:10, dirt:5 } : { honeydew:10, leaves:6, dirt:4 }, G);
    if (rich) {
      G.hatch.progress = Math.min(0.95, (G.hatch.progress || 0) + 0.15);
      log('Founding instinct chosen: Wild Cache. The stash opened cleanly and the colony surged ahead.');
      toast('Wild Cache cracked open');
    } else {
      log('Founding instinct chosen: Wild Cache. Part of the stash was spoiled, but enough remained to gamble on momentum.');
      toast('Wild Cache was partly spoiled', 'warn');
    }
  }
  renderAll();
  saveGame();
}

  toast(`Scout order: ${tactic.name}`);
  saveGame();
  renderTab();
}

function buildBattleReport(zone, squad, tactic, totalPower, effectivePower, diceRoll, outcome, gained, rewardMsg) {
  const battleTactic = scoutTacticDef((tactic && tactic.id) || tactic || 'balanced');

  return {
    zone_name: zoneDisplayName(zone),
    zone_icon: zone.icon || '⚔',
    zone_power: zone.power,
    enemy_type: (zone.enemy_type || 'insect').toUpperCase(),

    squad_power: totalPower,

    dice_roll: Math.round(diceRoll * 100),

    reward_msg: rewardMsg || '',
    tactic_id: battleTactic.id,

    tactic_desc: battleTactic.desc,
    tactic_effects: battleTactic.ui_effects || [],

}

/* ── BUILDING CANVAS INFO TOOLTIP ───────────── */
function showBuildingTooltip(bid, screenX, screenY, opts = {}) {
  const def = BLDGS[bid];
  if (!def) return;
  const n = G.bldgs[bid] || 0;
  if (n <= 0) return;
  const panel = document.getElementById('building-info-panel');
  if (!panel) return;

  const effects = buildingEffects(bid);
  const prodLines = [];

  // Housing contribution
  if (def.effects && def.effects.housing) {
    prodLines.push(`+${def.effects.housing * n} housing capacity`);
  }
  // Key effect summaries
  if (effects.hd_prod) prodLines.push(`+${(effects.hd_prod * n).toFixed(3)} honeydew/s`);
  if (effects.leaves_prod) prodLines.push(`+${(effects.leaves_prod * n).toFixed(3)} leaves/s`);
  if (effects.dirt_prod) prodLines.push(`+${(effects.dirt_prod * n).toFixed(3)} dirt/s`);
  if (effects.spores_prod) prodLines.push(`+${(effects.spores_prod * n).toFixed(3)} spores/s`);
  if (effects.wax_prod) prodLines.push(`+${(effects.wax_prod * n).toFixed(3)} wax/s`);
  if (effects.silk_prod) prodLines.push(`+${(effects.silk_prod * n).toFixed(3)} silk/s`);
  if (effects.compound_prod) prodLines.push(`+${(effects.compound_prod * n).toFixed(3)} compound/s`);
  if (effects.elytra_prod) prodLines.push(`+${(effects.elytra_prod * n).toFixed(3)} elytra/s`);
  if (effects.aether_prod) prodLines.push(`+${(effects.aether_prod * n).toFixed(3)} aether/s`);
  if (effects.skyglass_prod) prodLines.push(`+${(effects.skyglass_prod * n).toFixed(3)} skyglass/s`);
  if (effects.forager_mult) prodLines.push(`Forager ×${(1 + effects.forager_mult * n).toFixed(2)}`);
  if (effects.scholar_mult) prodLines.push(`Scholar ×${(1 + effects.scholar_mult * n).toFixed(2)}`);
  if (effects.nurse_mult) prodLines.push(`Nurse ×${(1 + effects.nurse_mult * n).toFixed(2)}`);
  if (effects.navigator_mult) prodLines.push(`Navigator ×${(1 + effects.navigator_mult * n).toFixed(2)}`);
  if (effects.global_prod) prodLines.push(`Global prod +${Math.round(effects.global_prod * n * 100)}%`);
  if (effects.fighter_slots) prodLines.push(`${effects.fighter_slots * n} fighter slot${effects.fighter_slots * n !== 1 ? 's' : ''}`);

  panel.innerHTML = `
    <div class="bip-name">${displayBuildingName(bid)}</div>
    <div class="bip-count">${n} built</div>
    ${prodLines.length ? `<div class="bip-prod">${prodLines.join('<br>')}</div>` : `<div class="bip-prod" style="color:var(--text-lo)">${def.desc || ''}</div>`}
  `;

  panel.classList.add('visible');

  const padding = 8;
  const rect = panel.getBoundingClientRect();
  const pw = Math.max(200, rect.width || 0);
  const ph = Math.max(100, rect.height || 0);
  const vw = window.innerWidth, vh = window.innerHeight;
  const preferAbove = opts.preferAbove !== false;
  const offsetX = opts.offsetX ?? 12;
  const aboveOffset = opts.offsetYAbove ?? 14;
  const belowOffset = opts.offsetYBelow ?? 16;

  let lx = screenX + offsetX;
  if (lx + pw > vw - padding) lx = screenX - pw - offsetX;
  lx = Math.max(padding, Math.min(lx, vw - pw - padding));

  let ly = preferAbove ? screenY - ph - aboveOffset : screenY + belowOffset;
  if (ly < padding) ly = screenY + belowOffset;
  if (ly + ph > vh - padding) ly = vh - ph - padding;
  ly = Math.max(padding, ly);

  panel.style.left = lx + 'px';
  panel.style.top = ly + 'px';
}

function hideBuildingTooltip() {
  const panel = document.getElementById('building-info-panel');
  if (panel) panel.classList.remove('visible');
}

  const prog = challengeProgress(ch);

      <span>${ch.done || ch.claimed || ch.failed_survive ? '' : `${daysLeft}d remaining`}</span>

    ${ch.done && !ch.claimed ? `<button class="exp-collect-btn" style="margin-top:8px;width:100%;border-color:rgba(255,197,98,0.4);color:var(--amber);background:rgba(255,197,98,0.10);" onclick="claimChallengeReward()">⭐ CLAIM REWARD</button>` : ''}

function toast(msg, cls='') {
  const wrap = document.getElementById('toast-wrap');
  if (!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast' + (cls ? ' ' + cls : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3100);
}

function isTechDone(tid) {
  return !!G.techs[tid];
}

function legacyRank(id, meta = G.meta) {
  return ((meta && meta.legacy) || {})[id] || 0;
}

function legacyMaxRank(id) {
  return (LEGACY_TREE[id]?.costs || []).length;
}

function legacyCost(id, rank = legacyRank(id)) {
  const node = LEGACY_TREE[id];
  if (!node || rank >= node.costs.length) return null;
  return node.costs[rank];
}

function ownedCapstoneId(meta = G.meta) {
  return Object.keys(LEGACY_TREE).find(id => LEGACY_TREE[id].capstone && legacyRank(id, meta) > 0) || null;
}

function legacyUnlocked(id) {
  const node = LEGACY_TREE[id];
  if (!node) return false;
  const reqsMet = (node.requires || []).every(req => legacyRank(req) > 0);
  const maxReqsMet = (node.requires_max || []).every(req => legacyRank(req) >= legacyMaxRank(req));
  const capstoneOpen = !node.capstone || !ownedCapstoneId() || ownedCapstoneId() === id;
  return reqsMet && maxReqsMet && capstoneOpen;
}

function canBuyLegacy(id) {
  const cost = legacyCost(id);
  return legacyUnlocked(id) && cost !== null && (G.meta.nectar || 0) >= cost;
}

function capstoneOwned(id) {
  return legacyRank(id) > 0;
}

function capstoneAccess(def, meta = G.meta) {
  return !def.capstone || legacyRank(def.capstone, meta) > 0;
}

function lineageAssets() {
  return [
  ['bldgs', 'brood_nursery', 'swarm_sovereignty'],
  ['jobs', 'nurse', 'swarm_sovereignty'],
  ['bldgs', 'amber_vault', 'amber_monolith'],
  ['jobs', 'excavator', 'amber_monolith'],
  ['bldgs', 'sky_beacon', 'celestial_throne'],
  ['jobs', 'navigator', 'celestial_throne'],
  ];
}

function syncLineageUnlocks(state = G, announce = false) {
  if (!state.unlocks) state.unlocks = { jobs:makeUnlockMap(JOBS), bldgs:makeUnlockMap(BLDGS) };
  const newlyUnlockedJobs = [];
  for (const [kind, id, capstone] of lineageAssets()) {
    const unlocked = legacyRank(capstone, state.meta || { legacy:{} }) > 0;
    const wasUnlocked = !!state.unlocks[kind][id];
    state.unlocks[kind][id] = unlocked;
    if (announce && state === G && kind === 'jobs' && unlocked && !wasUnlocked) newlyUnlockedJobs.push(id);
  }
  if (announce && state === G && newlyUnlockedJobs.length) maybeAnnounceJobUnlock(newlyUnlockedJobs);
}

function clearInaccessibleLineageContent(state = G) {
  for (const [kind, id, capstone] of lineageAssets()) {
    if (legacyRank(capstone, state.meta || { legacy:{} }) > 0) continue;
    if (kind === 'jobs') {
      state.jobs[id] = 0;
    } else if (kind === 'bldgs') {
      state.bldgs[id] = 0;
    }
  }
}

function projectDone(id, state = G) {
  return !!((state.projects || {})[id]);
}

function activeLineageProject(state = G) {
  const cap = ownedCapstoneId(state.meta || G.meta);
  return cap ? (LINEAGE_PROJECTS[cap] || null) : null;
}

function projectTechsMet(def, state = G) {
  return !!def && (def.techs || []).every(tid => state.techs[tid]);
}

function projectLockedReasons(def, state = G) {
  const reasons = [];
  if (!def) return reasons;
  if (!legacyRank(def.capstone, state.meta || G.meta)) reasons.push('Needs the matching capstone');
  if ((def.evo_stage || 0) > 0 && lineageEvolutionStage(def.capstone, state) < def.evo_stage) {
    const info = lineageEvolutionInfo(def.capstone, state);
    const next = info.steps.find(step => step.stage === def.evo_stage);
    reasons.push(`Needs ${next ? next.label : `Evolution ${def.evo_stage}`}`);
  }
  const missing = (def.techs || []).filter(tid => !state.techs[tid]).map(tid => TECHS[tid]?.name || tid);
  if (missing.length) reasons.push(`Research: ${missing.join(', ')}`);
  return reasons;
}

function launchAetherRequirement(state = G) {
  return Math.max(15, 30 - (legacyRank('celestial_throne', state.meta || G.meta) > 0 ? 5 : 0) - milestoneLaunchAetherReduction() - projectLaunchAetherReduction(state));
}

function projectCriteria(def, state = G) {
  if (!def) return [];
  const rows = [];
  if (def.id === 'sovereign_brood') {
    rows.push({ done:(state.pop.total || 0) >= 42, ratio:Math.min(1, (state.pop.total || 0) / 42), label:`${state.pop.total || 0}/42 bugs` });
    rows.push({ done:(state.bldgs.brood_nursery || 0) >= 5, ratio:Math.min(1, (state.bldgs.brood_nursery || 0) / 5), label:`${state.bldgs.brood_nursery || 0}/5 Brood Nurseries` });
    rows.push({ done:(state.jobs.nurse || 0) >= 8, ratio:Math.min(1, (state.jobs.nurse || 0) / 8), label:`${state.jobs.nurse || 0}/8 Nurses` });
  } else if (def.id === 'amber_citadel') {
    rows.push({ done:(state.bldgs.amber_vault || 0) >= 4, ratio:Math.min(1, (state.bldgs.amber_vault || 0) / 4), label:`${state.bldgs.amber_vault || 0}/4 Amber Vaults` });
    rows.push({ done:(state.jobs.excavator || 0) >= 8, ratio:Math.min(1, (state.jobs.excavator || 0) / 8), label:`${state.jobs.excavator || 0}/8 Excavators` });
    rows.push({ done:(state.stats.traded || 0) >= 12, ratio:Math.min(1, (state.stats.traded || 0) / 12), label:`${state.stats.traded || 0}/12 trades` });
    const stock = totalResourceStock(state);
    rows.push({ done:stock >= 2200, ratio:Math.min(1, stock / 2200), label:`${Math.floor(stock)}/2200 total stock` });
  } else if (def.id === 'astral_ark') {
    rows.push({ done:(state.bldgs.sky_beacon || 0) >= 3, ratio:Math.min(1, (state.bldgs.sky_beacon || 0) / 3), label:`${state.bldgs.sky_beacon || 0}/3 Sky Beacons` });
    rows.push({ done:(state.bldgs.colony_spire || 0) >= 2, ratio:Math.min(1, (state.bldgs.colony_spire || 0) / 2), label:`${state.bldgs.colony_spire || 0}/2 Colony Spires` });
    rows.push({ done:(state.jobs.navigator || 0) >= 8, ratio:Math.min(1, (state.jobs.navigator || 0) / 8), label:`${state.jobs.navigator || 0}/8 Navigators` });
    rows.push({ done:canLaunchSkyColony(state), ratio:canLaunchSkyColony(state) ? 1 : Math.min(1, (((state.res.elytra || 0) / 15) + ((state.res.aether || 0) / launchAetherRequirement(state))) / 2), label:`Launch readiness · ${Math.floor(state.res.elytra || 0)}/15 Elytra · ${Math.floor(state.res.aether || 0)}/${launchAetherRequirement(state)} Aether` });
  }
  for (const [res, amount] of Object.entries(def.costs || {})) {
    const have = state.res[res] || 0;
    rows.push({ done:have >= amount, ratio:Math.min(1, have / amount), label:`${Math.floor(have)}/${amount} ${RES[res].name}` });
  }
  return rows;
}

function projectProgress(def, state = G) {
  const rows = projectCriteria(def, state);
  const pct = rows.length ? Math.round(rows.reduce((sum, row) => sum + row.ratio, 0) / rows.length * 100) : 0;
  const ready = rows.length > 0 && rows.every(row => row.done) && projectTechsMet(def, state) && projectLockedReasons(def, state).length === 0;
  return { pct, rows, ready };
}

function clearLineageProjects(state = G) {
  if (!state.projects) state.projects = {};
  const active = ownedCapstoneId(state.meta || G.meta);
  for (const project of Object.values(LINEAGE_PROJECTS)) {
    if (project.capstone !== active) delete state.projects[project.id];
  }
}

function projectProductionBonus(state = G) {
  return projectDone('sovereign_brood', state) ? 0.20 : 0;
}

function projectHatchBonus(state = G) {
  return projectDone('sovereign_brood', state) ? 0.35 : 0;
}

function projectStorageBonus(state = G) {
  return projectDone('amber_citadel', state) ? 0.35 : 0;
}

function projectGatherBonus(state = G) {
  return projectDone('amber_citadel', state) ? 1.20 : 0;
}

function projectTradeBonus(state = G) {
  return projectDone('amber_citadel', state) ? 0.25 : 0;
}

function projectSkyBonus(state = G) {
  return projectDone('astral_ark', state) ? 0.35 : 0;
}

function projectLaunchBonusMult(state = G) {
  return projectDone('astral_ark', state) ? 0.50 : 0;
}

function projectLaunchAetherReduction(state = G) {
  return projectDone('astral_ark', state) ? 8 : 0;
}

function projectLaunchFlatBonus(state = G) {
  if (projectDone('sovereign_brood', state)) return Math.floor((state.pop.total || 0) / 10);
  if (projectDone('amber_citadel', state)) return Math.floor(totalResourceStock(state) / 650);
  return 0;
}

function completeLineageProject() {
  const def = activeLineageProject();
  if (!def) {
    toast('No lineage project active', 'warn');
    return;
  }
  if (projectDone(def.id)) {
    toast('Project already complete');
    return;
  }
  const status = projectProgress(def);
  if (!status.ready) {
    toast('Project is not ready yet', 'warn');
    return;
  }
  for (const [res, amount] of Object.entries(def.costs || {})) {
    G.res[res] -= amount;
  }
  if (!G.projects) G.projects = {};
  G.projects[def.id] = true;
  G.achievements[def.id] = true;
  if (def.id === 'sovereign_brood') {
    G.events.active = 'brood_surge';
    G.events.ticks_left = 180;
  } else if (def.id === 'amber_citadel') {
    G.events.active = 'amber_rush';
    G.events.ticks_left = 180;
  } else if (def.id === 'astral_ark') {
    G.events.active = 'star_current';
    G.events.ticks_left = 180;
    G.vis.aether = true;
    G.res.aether = Math.min(maxRes('aether'), (G.res.aether || 0) + 20);
  }
  log(`Lineage project complete: ${def.title}.`);
  toast(`${def.title} complete!`);
  renderAll();
  syncNavPageToTab(curTab);
}

function lineageProjectPanel() {
  const def = activeLineageProject();
  if (!def) return '';
  const done = projectDone(def.id);
  const status = projectProgress(def);
  const reasons = projectLockedReasons(def);
  const costHtml = Object.entries(def.costs || {}).map(([res, amount]) => {
    const have = G.res[res] || 0;
    const ok = have >= amount;
    return `<span class="ci ${ok ? 'ok' : 'no'}">${RES[res].icon} ${amount} ${RES[res].name}</span>`;
  }).join('');
  return `<div class="guide-panel lineage-panel" style="margin-top:10px;">
    <div class="guide-title">LINEAGE ENDGAME PROJECT</div>
    <div class="guide-copy"><strong>${def.title}</strong> · ${def.short}</div>
    <div class="soft-note">${def.desc}</div>
    <div class="guide-grid" style="margin-top:8px;">
      ${status.rows.map(row => `<div class="guide-item" style="border-color:${row.done ? 'var(--accent-d)' : 'var(--border)'}"><strong>${row.done ? 'READY' : 'BUILDING'}</strong><br>${row.label}</div>`).join('')}
    </div>
    <div class="soft-note" style="margin-top:8px;">${def.reward}</div>
    <div class="tc-cost" style="margin-top:8px;">${costHtml}</div>
    ${done
      ? `<div class="notice-panel" style="margin-top:10px;">${def.title} is complete for this run. Its lineage payoff is now active and will carry through to your next launch.</div>`
      : `<div class="soft-note" style="margin-top:8px;">${reasons.length ? reasons.join(' · ') : `Progress: ${status.pct}%`}</div>
         <div class="btn-row" style="text-align:left;margin-top:10px;">
           <button class="save-link" onclick="completeLineageProject()" ${status.ready ? '' : 'disabled'} style="color:${status.ready ? 'var(--amber)' : 'var(--text-lo)'};border-color:${status.ready ? 'var(--amber-d)' : 'var(--border2)'}">COMPLETE PROJECT</button>
         </div>`}
  </div>`;
}


function milestoneDone(id, state = G) {
  return !!((state.milestones || {})[id]);
}

function activeLineageMilestones(state = G) {
  const cap = ownedCapstoneId(state.meta || G.meta);
  return cap ? (LINEAGE_MILESTONES[cap] || []) : [];
}

function totalResourceStock(state = G) {
  return Object.values(state.res || {}).reduce((sum, value) => sum + (value || 0), 0);
}

function milestoneProgress(id, state = G) {
  switch (id) {
    case 'swarm_critical_mass': {
      const cur = state.pop.total || 0;
      const target = 12;
      return { cur, target, done: cur >= target, label:`${cur}/${target} bugs` };
    }
    case 'swarm_caretakers': {
      const nurseries = state.bldgs.brood_nursery || 0;
      const nurses = state.jobs.nurse || 0;
      const score = Math.min(2, nurseries) + Math.min(2, nurses);
      return { cur: score, target: 4, done: nurseries >= 2 && nurses >= 2, label:`${nurseries}/2 Nurseries · ${nurses}/2 Nurses` };
    }
    case 'swarm_overflow': {
      const bugs = state.pop.total || 0;
      const house = housing();
      const cur = Math.min(100, Math.round(((bugs / 24) * 50) + ((house / 30) * 50)));
      return { cur, target: 100, done: bugs >= 24 && house >= 30, label:`${bugs}/24 bugs · ${house}/30 housing` };
    }
    case 'amber_stockpile': {
      const cur = state.bldgs.amber_vault || 0;
      const target = 2;
      return { cur, target, done: cur >= target, label:`${cur}/${target} Amber Vaults` };
    }
    case 'amber_excavation': {
      const excavators = state.jobs.excavator || 0;
      const stock = Math.floor((state.res.leaves || 0) + (state.res.dirt || 0));
      const cur = Math.min(100, Math.round(((excavators / 3) * 40) + ((stock / 250) * 60)));
      return { cur, target: 100, done: excavators >= 3 && stock >= 250, label:`${excavators}/3 Excavators · ${stock}/250 stock` };
    }
    case 'amber_logistics': {
      const trades = state.stats.traded || 0;
      const stock = Math.floor(totalResourceStock(state));
      const cur = Math.min(100, Math.round(((trades / 5) * 45) + ((stock / 600) * 55)));
      return { cur, target: 100, done: trades >= 5 && stock >= 600, label:`${trades}/5 trades · ${stock}/600 stored` };
    }
    case 'sky_signal': {
      const beacons = state.bldgs.sky_beacon || 0;
      const docks = state.bldgs.sky_dock || 0;
      const cur = Math.min(100, Math.round(((beacons / 2) * 65) + ((docks / 1) * 35)));
      return { cur, target: 100, done: beacons >= 2 && docks >= 1, label:`${beacons}/2 Beacons · ${docks}/1 Dock` };
    }
    case 'celestial_chart': {
      const aether = Math.floor(state.res.aether || 0);
      const skyglass = Math.floor(state.res.skyglass || 0);
      const cur = Math.min(100, Math.round(((aether / 40) * 60) + ((skyglass / 15) * 40)));
      return { cur, target: 100, done: aether >= 40 && skyglass >= 15, label:`${aether}/40 Aether · ${skyglass}/15 Skyglass` };
    }
    case 'throne_launch': {
      const needAether = 30 - (capstoneOwned('celestial_throne') ? 5 : 0);
      const elytra = Math.floor(state.res.elytra || 0);
      const aether = Math.floor(state.res.aether || 0);
      const cur = Math.min(100, Math.round(((elytra / 15) * 50) + ((aether / needAether) * 50)));
      return { cur, target: 100, done: canLaunchSkyColony(), label:`${elytra}/15 Elytra · ${aether}/${needAether} Aether` };
    }
    default:
      return { cur:0, target:1, done:false, label:'Not started' };
  }
}

}

function milestoneRunGatherBonus() {

function milestoneRunProdBonus() {

function milestoneRunUpkeepBonus() {

function milestoneRunTradeBonus() {

function milestoneGroundBonus() {

}

function milestoneSkyBonus() {

function milestoneSkyglassBonus() {

function completeLineageMilestone(id) {
  if (!G.milestones) G.milestones = {};
  if (G.milestones[id]) return;
  const cap = ownedCapstoneId();
  const beforeStage = lineageEvolutionStage(cap);
  G.milestones[id] = true;
  // Queen grows from milestone achievements
  awardQueenXp(30, 'milestone');
  const def = (LINEAGE_MILESTONES[cap] || []).find(item => item.id === id);
  if (def) {
    log(`Lineage milestone complete: ${def.title}. ${def.reward}`);
    toast(`Milestone complete: ${def.title}`);
  }
  const afterStage = lineageEvolutionStage(cap);
  if (cap && afterStage > beforeStage) {
    const evo = (LINEAGE_EVOLUTIONS[cap] || []).find(step => step.stage === afterStage);
    if (evo) {
      log(`Lineage evolved: ${evo.label}. ${evo.copy}`);
      toast(`Evolution: ${evo.label}`);
    }
  }
}

function checkLineageMilestones() {
  for (const quest of activeLineageMilestones()) {
    if (milestoneDone(quest.id)) continue;
    if (milestoneProgress(quest.id).done) {
      completeLineageMilestone(quest.id);
    }
  }
}

function nextLineageMilestone() {
  return activeLineageMilestones().find(quest => !milestoneDone(quest.id)) || null;
}

function lineageMilestonePanel() {
  const cap = ownedCapstoneId();
  if (!cap) return '';
  const quests = activeLineageMilestones();
  if (!quests.length) return '';
  const doneCount = quests.filter(quest => milestoneDone(quest.id)).length;
  return `<div class="sh">LINEAGE MILESTONES</div>
    <div class="guide-panel" style="margin-bottom:10px;">
      <div class="guide-title">${LEGACY_TREE[cap].name} RUN OBJECTIVES</div>
      <div class="guide-copy">These milestones only appear for your active capstone path. Completing them gives strong run bonuses that make this lineage feel different to play.</div>
      <div class="soft-note">${doneCount}/${quests.length} complete this run.</div>
    </div>
    <div class="lineage-quests">${quests.map(quest => {
      const status = milestoneProgress(quest.id);
      const pct = status.target === 100 ? status.cur : Math.max(0, Math.min(100, Math.round((status.cur / Math.max(1, status.target)) * 100)));
      return `<div class="quest-card${milestoneDone(quest.id) ? ' done' : ''}">
        <div class="quest-head">
          <div class="quest-title">${quest.title}</div>
          <div class="quest-status">${milestoneDone(quest.id) ? 'COMPLETE' : pct + '% READY'}</div>
        </div>
        <div class="quest-copy">${quest.desc}</div>
        <div class="mini-progress"><div class="mini-progress-fill" style="width:${milestoneDone(quest.id) ? 100 : pct}%"></div></div>
        <div class="soft-note">${status.label}</div>
        <div class="quest-reward">${milestoneDone(quest.id) ? 'Unlocked: ' : 'Reward: '}${quest.reward}</div>
      </div>`;
    }).join('')}</div>`;
}

function buildingVisible(bid) {
  const def = BLDGS[bid];
  return !!def && !!G.unlocks.bldgs[bid] && capstoneAccess(def) && (!def.requires_tech || G.techs[def.requires_tech]);
}

function jobVisible(jid) {
  const def = JOBS[jid];
  return !!def && !!G.unlocks.jobs[jid] && capstoneAccess(def) && (!def.requires_tech || G.techs[def.requires_tech]);
}

function lineageChip(id) {
  return id ? `<span class="lineage-chip">${LEGACY_TREE[id].name}</span>` : '';
}


function lineageEvolutionStage(cap = ownedCapstoneId(), state = G) {
  if (!cap || !LINEAGE_EVOLUTIONS[cap]) return 0;
  let stage = 0;
  for (const step of LINEAGE_EVOLUTIONS[cap]) {
    if (milestoneDone(step.milestone, state)) stage = step.stage;
  }
  return stage;
}

function lineageEvolutionInfo(cap = ownedCapstoneId(), state = G) {
  const steps = LINEAGE_EVOLUTIONS[cap] || [];
  const stage = lineageEvolutionStage(cap, state);
  return {
    steps,
    stage,
    current: steps.find(step => step.stage === stage) || null,
    next: steps.find(step => step.stage === stage + 1) || null,
  };
}

function lineageStageUnlocked(def, state = G) {
  if (!def) return false;
  if (!capstoneAccess(def, state.meta || G.meta)) return false;
  return !def.evo_stage || lineageEvolutionStage(def.capstone, state) >= def.evo_stage;
}

function lineageUnlockLabel(def, state = G) {
  if (!def || !def.capstone) return '';
  const stage = lineageEvolutionStage(def.capstone, state);
  const need = def.evo_stage || 0;
  if (stage >= need) return def.lineage_label || 'Lineage content';
  const info = lineageEvolutionInfo(def.capstone, state);
  const next = info.steps.find(step => step.stage === need);
  return `${def.lineage_label || 'Lineage content'} · unlocks at ${next ? next.label : 'a later evolution'}`;
}

function techVisible(def, state = G) {
  return !!def && (!def.capstone || legacyRank(def.capstone, state.meta || G.meta) > 0);
}

function techReqsMet(def, state = G) {
  return !!def && (def.requires || []).every(r => state.techs[r]);
}

function techStageReady(def, state = G) {
  return !def.evo_stage || lineageEvolutionStage(def.capstone, state) >= def.evo_stage;
}

function techLockedReasons(def, state = G) {
  const reasons = [];
  const missing = (def.requires || []).filter(r => !state.techs[r]).map(r => TECHS[r]?.name || r);
  if (missing.length) reasons.push(`Requires: ${missing.join(', ')}`);
  if (def.capstone && def.evo_stage && !techStageReady(def, state)) {
    const info = lineageEvolutionInfo(def.capstone, state);
    const next = info.steps.find(step => step.stage === def.evo_stage);
    reasons.push(`Needs ${next ? next.label : `Evolution ${def.evo_stage}`}`);
  }
  return reasons;
}

function nextLineageResearch(state = G) {
  return Object.entries(TECHS)
    .filter(([tid, def]) => techVisible(def, state) && !state.techs[tid] && techReqsMet(def, state))
    .sort((a, b) => (a[1].tier - b[1].tier) || progressPct(b[1].cost) - progressPct(a[1].cost))
    .find(([, def]) => def.capstone) || null;
}

function lineageResearchStatusPanel() {
  const cap = ownedCapstoneId();
  if (!cap) return '';
  const branch = Object.entries(TECHS).filter(([, def]) => def.capstone === cap);
  if (!branch.length) return '';
  const next = nextLineageResearch();
  const done = branch.filter(([tid]) => G.techs[tid]).length;
  const total = branch.length;
  const status = next ? techLockedReasons(next[1]) : [];
  return `<div class="guide-panel lineage-panel">
    <div class="guide-title">LINEAGE RESEARCH</div>
    <div class="guide-copy">${LEGACY_TREE[cap].name} now has its own technology branch. These techs only appear for this lineage and push the run further apart mechanically.</div>
    <div class="guide-grid">
      <div class="guide-item"><strong>Branch progress</strong> ${done}/${total} lineage techs researched this run.</div>
      <div class="guide-item"><strong>How it unlocks</strong> Evolve the lineage with milestones, then fund the next branch tech in this tab.</div>
    </div>
    ${next ? `<div class="soft-note">Next branch tech: <strong>${next[1].name}</strong> · ${techStageReady(next[1]) ? `${progressPct(next[1].cost)}% funded` : status.join(' · ')}</div>` : `<div class="soft-note">This lineage branch is fully researched for the current run.</div>`}
  </div>`;
}

function effectLabel(effect) {
  const labels = {
    brood_surge:'Brood Surge',
    amber_rush:'Amber Rush',
    star_current:'Star Current',
  };
  return labels[effect] || effect;
}

function specialSummary(special) {
  if (!special) return '';
  const parts = [];
  if (special.bugs) parts.push(`+${special.bugs} bug${special.bugs > 1 ? 's' : ''}`);
  if (special.hatch) parts.push(`+${Math.round(special.hatch * 100)}% hatch progress`);
  if (special.active) parts.push(`starts ${effectLabel(special.active)}`);
  return parts.join(' · ');
}

function applySpecialRewards(special) {
  if (!special) return [];
  const notes = [];
  if (special.bugs) {
    const gained = awardBug(special.bugs);
    if (gained > 0) notes.push(`+${gained} bug${gained > 1 ? 's' : ''}`);
    else notes.push('housing blocked extra brood');
  }
  if (special.hatch) {
    G.hatch.progress = Math.min(0.99, (G.hatch.progress || 0) + special.hatch);
    notes.push(`+${Math.round(special.hatch * 100)}% hatch progress`);
  }
  if (special.active) {
    G.events.active = special.active;
    G.events.ticks_left = special.ticks || 120;
    notes.push(`${effectLabel(special.active)} started`);
  }
  return notes;
}

function lineageContentHint(kind) {
  const cap = ownedCapstoneId();
  if (!cap) return '';
  const stage = lineageEvolutionStage(cap);
  const source = kind === 'craft' ? CRAFTS : TRADES;
  const entries = source.filter(item => item.capstone === cap);
  if (!entries.length) return '';
  const row = entries.map(item => {
    const unlocked = lineageStageUnlocked(item);
    return `<div class="guide-item" style="border-color:${unlocked ? 'rgba(94,229,143,0.25)' : 'var(--border)'}">
      <strong>${unlocked ? 'READY' : 'LOCKED'} · ${item.name}</strong><br>${lineageUnlockLabel(item)}${specialSummary(item.special) ? `<br><span class="soft-note">Bonus: ${specialSummary(item.special)}</span>` : ''}
    </div>`;
  }).join('');
  const lead = kind === 'craft'
    ? 'Your evolved lineage now unlocks exclusive recipes that solve bottlenecks in a path-specific way.'

}

function buildingEffects(bid, state = G) {
  const def = BLDGS[bid];
  const effects = { ...((def && def.effects) || {}) };

  if (bid === 'brood_nursery') {
    if (stage >= 1) Object.assign(effects, { housing:10, hatch_mult:0.38, nurse_mult:0.35 });

  }
  if (bid === 'amber_vault') {
    if (stage >= 1) Object.assign(effects, { storage_mult:0.24, leaves_prod:0.028, dirt_prod:0.028, gather_bonus:0.12 });
    if (stage >= 2) Object.assign(effects, { storage_mult:0.30, leaves_prod:0.036, dirt_prod:0.036, gather_bonus:0.18 });
  }
  if (bid === 'sky_beacon') {
    if (stage >= 1) Object.assign(effects, { aether_prod:0.032, elytra_prod:0.0045, navigator_mult:0.35 });
    if (stage >= 2) Object.assign(effects, { aether_prod:0.045, elytra_prod:0.0065, navigator_mult:0.55 });
  }
  return effects;
}

function jobLineageMult(jid, state = G) {
  const stage = lineageEvolutionStage(JOBS[jid] && JOBS[jid].capstone, state);
  if (jid === 'nurse') return stage >= 2 ? 1.55 : stage >= 1 ? 1.25 : 1;
  if (jid === 'excavator') return stage >= 2 ? 1.70 : stage >= 1 ? 1.35 : 1;
  if (jid === 'navigator') return stage >= 2 ? 1.65 : stage >= 1 ? 1.30 : 1;
  return 1;
}

function effectiveJobProduces(jid, state = G) {
  const def = JOBS[jid];
  if (!def) return {};
  const mult = jobLineageMult(jid, state);
  const xpMult = 1 + workerXpBonus(jid);
  return Object.fromEntries(Object.entries(def.produces).map(([res, value]) => [res, value * mult * xpMult]));
}
