  const isNew = G.log.length > _lastLogLength;
  _lastLogLength = G.log.length;
  // Slice newest entries then reverse so oldest is at top, newest at bottom
  const entries = G.log.slice(0, 12).reverse();
  el.innerHTML = entries.map((e, i) => {
    const isNewest = (i === entries.length - 1);
    const newCls = (isNewest && isNew) ? ' clf-new' : '';
    const typeCls = e.type === 'bad' ? ' bad' : e.type === 'ev' ? ' ev' : '';
    const realTimeStr = e.realTime ? ` <span class="clf-realtime">· ${e.realTime}</span>` : '';
    return `<div class="clf-entry${newCls}${typeCls}">
      <div class="clf-t">${e.time}${realTimeStr}</div>
      <div class="clf-m">${e.msg}</div>
    </div>`;
  }).join('');
  // Scroll to bottom so newest entry is always visible
  el.scrollTop = el.scrollHeight;
}

const ColonyViz = {
  bugs: [],
  particles: [],
  floatTexts: [],
  yieldBank: {},
  yieldTimers: {},
  buildings: [],
  pinnedTooltipBid: null,
  grassOffsets: null,
  lastBldgHash: '',
  lastPop: -1,
  raf: null,
  inited: false,
  groundLeaves: [],
  lastLeafSeason: '',
  queenX: null,
  queenY: null,

  // Tree definitions shared between drawSeasonalTrees and syncBuildings
  // clearL/clearR: no-building zones as fractions of canvas width
  TREE_DEFS: [
    { xFrac:0.07, trunkH:52, trunkW:4, style:0, clearL:0.03, clearR:0.06 },
    { xFrac:0.15, trunkH:40, trunkW:3, style:1, clearL:0.03, clearR:0.05 },
    { xFrac:0.82, trunkH:56, trunkW:4, style:2, clearL:0.05, clearR:0.04 },
    { xFrac:0.89, trunkH:42, trunkW:3, style:0, clearL:0.04, clearR:0.04 },
    { xFrac:0.95, trunkH:32, trunkW:2, style:1, clearL:0.03, clearR:0.03 },
  ],

  seasonPalette() {
    const s = seasonName();
    switch (s) {
      case 'Spring': return { sky:'#071a10', skyTop:'#040d09', ground:'#0d2217', grass:'#163d24', grassEdge:'#1f5432', accent:'#22c55e', particle:'#4ade80', fogAlpha:0, moonAlpha:0, cloudAlpha:0.06 };
      case 'Summer': return { sky:'#120f04', skyTop:'#0a0802', ground:'#221c08', grass:'#2e2510', grassEdge:'#3d3215', accent:'#f59e0b', particle:'#fbbf24', fogAlpha:0, moonAlpha:0, cloudAlpha:0.04 };
      case 'Autumn': return { sky:'#140c06', skyTop:'#0c0703', ground:'#1e1108', grass:'#271509', grassEdge:'#321a0b', accent:'#fb923c', particle:'#f97316', fogAlpha:0.04, moonAlpha:0.35, cloudAlpha:0 };
      case 'Winter': return { sky:'#060c16', skyTop:'#030609', ground:'#0b1220', grass:'#0e1828', grassEdge:'#14223a', accent:'#60a5fa', particle:'#93c5fd', fogAlpha:0.1, moonAlpha:0.7, cloudAlpha:0 };
    }
    return { sky:'#071a10', skyTop:'#040d09', ground:'#0d2217', grass:'#163d24', grassEdge:'#1f5432', accent:'#22c55e', particle:'#4ade80', fogAlpha:0, moonAlpha:0, cloudAlpha:0.06 };
  },

  isHaulerJob(job) {
    return ['forager','leaf_col','miner','resin_tap','excavator'].includes(job);
  },

  jobActivityMeta(job) {
    const meta = {
      forager:    { color:'#fbbf24', moveState:'foraging',   workState:'harvesting', pulse:'drop' },
      leaf_col:   { color:'#22c55e', moveState:'hauling',    workState:'cutting',    pulse:'leaf' },
      dirt_dig:   { color:'#a07830', moveState:'tunneling',  workState:'digging',    pulse:'dig' },
      scholar:    { color:'#78d7ff', moveState:'observing',  workState:'studying',   pulse:'orb' },
      weaver:     { color:'#cbd5e1', moveState:'stringing',  workState:'weaving',    pulse:'thread' },
      miner:      { color:'#e2e8f0', moveState:'hauling',    workState:'mining',     pulse:'shard' },
      resin_tap:  { color:'#fb923c', moveState:'hauling',    workState:'tapping',    pulse:'drop' },
      spore_cult: { color:'#c084fc', moveState:'tending',    workState:'cultivating',pulse:'spore' },
      aeronaut:   { color:'#7dd3fc', moveState:'patrolling', workState:'surveying',  pulse:'air' },
      navigator:  { color:'#fcd34d', moveState:'charting',   workState:'plotting',   pulse:'star' },
      nurse:      { color:'#f9a8d4', moveState:'tending',    workState:'nursing',    pulse:'care' },
      excavator:  { color:'#8B5E3C', moveState:'delving',    workState:'excavating', pulse:'dig' },
      idle:       { color:'#5ee58f', moveState:'wandering',  workState:'idle',       pulse:'idle' },
    };
    return meta[job] || meta.idle;
  },


  jobBuildingSpec(job, bug) {
    const carrying = !!(bug && bug.carrying);
    const specs = {
      forager:    carrying ? { role:'storage', ids:['leaf_cache','amber_vault','nest'] } : { role:'forage', ids:['clover_patch','fungal_garden'] },
      leaf_col:   carrying ? { role:'storage', ids:['leaf_cache','nest'] } : { role:'forage', ids:['clover_patch','leaf_cache'] },
      miner:      carrying ? { role:'storage', ids:['amber_vault','compound_lab','nest'] } : { role:'mine', ids:['anthill','burrow','compound_lab'] },
      resin_tap:  carrying ? { role:'storage', ids:['wax_foundry','amber_vault','nest'] } : { role:'resin', ids:['wax_foundry','amber_vault'] },
      dirt_dig:   carrying ? { role:'storage', ids:['burrow','nest','anthill'] } : { role:'dig', ids:['burrow','anthill','nest'] },
      excavator:  carrying ? { role:'storage', ids:['amber_vault','burrow','nest'] } : { role:'dig', ids:['amber_vault','burrow'] },
      scholar:    { role:'study', ids:['hive_observatory','chrysalis_chamber','compound_lab'] },
      weaver:     { role:'craft', ids:['web_workshop'] },
      spore_cult: { role:'cultivate', ids:['spore_circle','fungal_garden','mycelium_network'] },
      aeronaut:   { role:'survey', ids:['sky_dock','flight_tower','sky_beacon'] },
      navigator:  { role:'chart', ids:['sky_beacon','flight_tower','cloud_condenser'] },
      nurse:      { role:'care', ids:['brood_nursery','nest'] },
      idle:       { role:'idle', ids:null },
    };
    return specs[job] || { role:'work', ids:null };
  },

  chooseBuildingByIds(ids) {
    for (const id of (Array.isArray(ids) ? ids : [ids])) {
      const b = this.buildings.find(building => building.id === id);
      if (b) return b;
    }
    return this.buildings.length > 0 ? this.buildings[Math.floor(Math.random() * this.buildings.length)] : null;
  },

  assignBugTarget(bug, building, role, groundY, h, isAir) {
    if (!building) return;
    const slot = bug.clusterSlot || 0;
    let tx = building.x + building.w / 2;
    let ty = groundY + 6;

    if (isAir) {
      tx += ((slot % 5) - 2) * 6;
      ty = groundY * (0.12 + ((slot % 5) * 0.05)) + Math.sin((bug.targetPatternSeed || 0) + slot) * 4;
    } else if (bug.job === 'nurse') {
      const angle = ((slot % 6) / 6) * Math.PI * 2 + (building.seed || 0);
      const radius = Math.max(6, building.w * 0.55 + (slot % 2) * 2);
      tx += Math.cos(angle) * radius;
      ty = groundY + 5 + Math.sin(angle) * 3;
    } else if (role === 'storage') {
      tx += ((slot % 3) - 1) * 5;
      ty = groundY + 7 + (slot % 2) * 2;
    } else if (role === 'forage') {
      tx += ((slot % 4) - 1.5) * 4;
      ty = groundY + 5 + ((slot + 1) % 2) * 3;
    } else if (role === 'study' || role === 'craft' || role === 'cultivate') {
      tx += ((slot % 3) - 1) * 4;
      ty = groundY + 5 + (slot % 2) * 2;
    } else if (role === 'dig' || role === 'mine' || role === 'resin') {
      tx += ((slot % 4) - 1.5) * 5;
      ty = groundY + 8 + (slot % 3) * 2;
    } else {
      tx += (Math.random() - 0.5) * 10;
      ty = groundY + 4 + Math.random() * (h - groundY - 12);
    }

    bug.targetBldgId = building.id;
    bug.targetX = tx;
    bug.targetY = ty;
    bug.routeRole = role;
    if (role === 'storage' || role === 'care') bug.homeBldgId = building.id;
  },

  // Sync ground leaves — collectible leaf items that appear in Autumn and decay in Winter
  syncGroundLeaves(canvas) {
    const s = seasonName();
    const w = canvas.width;
    const h = canvas.height;
    const groundY = h * 0.58;

    // Clear leaves when season changes dramatically
    if (this.lastLeafSeason !== s) {
      if (s === 'Spring' || s === 'Summer') this.groundLeaves = [];
      this.lastLeafSeason = s;
    }

    // Spawn new leaves in Autumn (richer accumulation of ground leaves)
    if (s === 'Autumn' && this.groundLeaves.length < 22 && Math.random() < 0.18) {
      this.groundLeaves.push({
        x: 10 + Math.random() * (w - 20),
        y: groundY + 3 + Math.random() * (h - groundY - 12),
        rot: Math.random() * Math.PI * 2,
        size: 3 + Math.random() * 4,
        color: Math.random() < 0.5 ? '#fb923c' : Math.random() < 0.5 ? '#f97316' : '#fbbf24',
        age: 0,
        maxAge: 1200 + Math.random() * 1800,
        collected: false,
      });
    }
    // In Spring, a few green leaves fall
    if (s === 'Spring' && this.groundLeaves.length < 8 && Math.random() < 0.04) {
      this.groundLeaves.push({
        x: 10 + Math.random() * (w - 20),
        y: groundY + 3 + Math.random() * (h - groundY - 12),
        rot: Math.random() * Math.PI * 2,
        size: 2.5 + Math.random() * 2.5,
        color: Math.random() < 0.6 ? '#22c55e' : '#4ade80',
        age: 0,
        maxAge: 600 + Math.random() * 900,
        collected: false,
      });
    }

    // Age leaves — in Winter they fade faster (scarcity: leaves rotting under frost)
    const ageDelta = s === 'Winter' ? 5 : 1;
    for (const leaf of this.groundLeaves) leaf.age += ageDelta;
    this.groundLeaves = this.groundLeaves.filter(l => !l.collected && l.age < l.maxAge);
  },

  drawGroundLeaves(ctx, t) {
    const s = seasonName();
    for (const leaf of this.groundLeaves) {
      const lifePct = 1 - leaf.age / leaf.maxAge;
      // Winter leaves look frosted and dim
      const alpha = s === 'Winter' ? lifePct * 0.45 : lifePct * 0.82;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(leaf.x, leaf.y);
      ctx.rotate(leaf.rot + Math.sin(t * 0.3 + leaf.x * 0.01) * 0.08);
      // Leaf body
      ctx.fillStyle = s === 'Winter' ? '#8aa8c4' : leaf.color;
      ctx.beginPath();
      ctx.ellipse(0, 0, leaf.size, leaf.size * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();
      // Leaf vein
      ctx.strokeStyle = s === 'Winter' ? 'rgba(180,210,240,0.4)' : 'rgba(0,0,0,0.25)';
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(-leaf.size * 0.85, 0);
      ctx.lineTo(leaf.size * 0.85, 0);
      ctx.stroke();
      // Frost shimmer in Winter
      if (s === 'Winter' && lifePct > 0.3) {
        ctx.globalAlpha = alpha * 0.4;
        ctx.fillStyle = '#e0f2fe';
        ctx.beginPath();
        ctx.ellipse(-leaf.size * 0.2, -leaf.size * 0.15, leaf.size * 0.3, leaf.size * 0.18, 0.4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  },

  drawQueen(ctx, w, h, groundY, t) {
    if (G.pop.total < 1) return;
    const q = G.queen;
    if (!q) return;

    // Queen moves slowly near nest/brood buildings
    const nestBldg = this.buildings.find(b => b.id === 'brood_nursery' || b.id === 'nest');
    const targetX = nestBldg ? nestBldg.x + nestBldg.w / 2 : w * 0.5;
    const targetY = groundY + 6;

    if (this.queenX === null) { this.queenX = targetX; this.queenY = targetY; }
    this.queenX += (targetX - this.queenX) * 0.003;
    this.queenY += (targetY - this.queenY) * 0.003;

    const qx = this.queenX;
    const qy = this.queenY;
    const level = q.level || 1;
    const sz = 3.2 + Math.min(level * 0.18, 1.8); // grows slightly with level
    const hpRatio = q.hp / q.max_hp;
    const injured = q.injured;

    // Gentle bob
    const bob = Math.sin(t * 1.4) * 0.8;

    ctx.save();
    ctx.translate(qx, qy + bob);

    // Aura glow — more intense at higher levels
    const auraSize = sz * (3.5 + level * 0.2);
    const auraAlpha = injured ? 0.08 : 0.12 + level * 0.012;
    const auraGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, auraSize);
    auraGrad.addColorStop(0, injured ? 'rgba(248,113,113,0.35)' : `rgba(255,197,98,${auraAlpha + 0.1})`);
    auraGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = auraGrad;
    ctx.beginPath();
    ctx.arc(0, 0, auraSize, 0, Math.PI * 2);
    ctx.fill();

    // Body — larger and distinctly amber/golden
    ctx.fillStyle = injured ? '#ef4444' : '#fbbf24';
    ctx.beginPath();
    ctx.ellipse(0, 0, sz * 1.4, sz * 0.85, 0, 0, Math.PI * 2);
    ctx.fill();

    // Stripe pattern on body
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = injured ? '#7f1d1d' : '#92400e';
    for (let i = -1; i <= 1; i++) {
      ctx.fillRect(i * sz * 0.5 - 0.5, -sz * 0.7, 1, sz * 1.4);
    }
    ctx.globalAlpha = 1;

    // Head nub — always faces right
    ctx.fillStyle = injured ? '#dc2626' : '#f59e0b';
    ctx.beginPath();
    ctx.arc(sz * 1.0, 0, sz * 0.45, 0, Math.PI * 2);
    ctx.fill();

    // Crown — scales with level
    if (!injured) {
      const crownH = sz * 0.55 + level * 0.06;
      ctx.fillStyle = '#fef08a';
      ctx.beginPath();
      ctx.moveTo(-sz * 0.6, -sz * 0.8);
      ctx.lineTo(sz * 0.6, -sz * 0.8);
      ctx.lineTo(sz * 0.6, -sz * 0.8 - crownH * 0.4);
      ctx.lineTo(sz * 0.3, -sz * 0.8 - crownH * 0.7);
      ctx.lineTo(0,       -sz * 0.8 - crownH);
      ctx.lineTo(-sz * 0.3, -sz * 0.8 - crownH * 0.7);
      ctx.lineTo(-sz * 0.6, -sz * 0.8 - crownH * 0.4);
      ctx.closePath();
      ctx.fill();
      // Crown gems pulse
      const gemPulse = 0.6 + 0.4 * Math.abs(Math.sin(t * 2.2));
      ctx.globalAlpha = gemPulse;
      ctx.fillStyle = '#e879f9';
      ctx.beginPath();
      ctx.arc(0, -sz * 0.8 - crownH * 0.92, 1.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(-sz * 0.42, -sz * 0.8 - crownH * 0.58, 0.9, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(sz * 0.42, -sz * 0.8 - crownH * 0.58, 0.9, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Two long antennae with tips
    ctx.strokeStyle = injured ? '#f8717188' : '#fbbf24bb';
    ctx.lineWidth = 0.8;
    for (let side = -1; side <= 1; side += 2) {
      ctx.beginPath();
      ctx.moveTo(sz * 0.8, -sz * 0.4);
      ctx.bezierCurveTo(sz * 1.4, -sz * 1.4, sz * 1.6 + side * sz * 0.6, -sz * 1.8, sz * 1.4 + side * sz * 0.8, -sz * 2.2);
      ctx.stroke();
      ctx.fillStyle = injured ? '#f87171' : '#fef08a';
      ctx.beginPath();
      ctx.arc(sz * 1.4 + side * sz * 0.8, -sz * 2.2, 1, 0, Math.PI * 2);
      ctx.fill();
    }

    // Eye
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.fillRect(sz * 0.78, -sz * 0.28, 1.4, 1.4);

    // HP indicator as small bar below queen when injured
    if (injured || hpRatio < 0.9) {
      const barW = sz * 3;
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(-barW / 2, sz * 1.2, barW, 2);
      ctx.fillStyle = hpRatio > 0.5 ? '#fbbf24' : '#f87171';
      ctx.fillRect(-barW / 2, sz * 1.2, barW * hpRatio, 2);
    }

    ctx.restore();
  },

  syncBugs(canvas) {
    const pop = G.pop.total;
    const w = canvas.width;
    const h = canvas.height;
    const groundY = h * 0.58;
    const heroCount = (G.fighters || []).filter(f => f.hero && f.status !== 'scouting').length;

    // Build an ordered list of jobs assigned to bugs
    const JOB_COLOR = {
      forager:   '#fbbf24', leaf_col: '#22c55e', dirt_dig: '#a07830',
      scholar:   '#78d7ff', weaver:   '#94a3b8', miner:    '#e2e8f0',
      resin_tap: '#fb923c', spore_cult:'#c084fc', aeronaut: '#7dd3fc',
      nurse:     '#f9a8d4', excavator:'#8B5E3C', navigator:'#fcd34d',
      idle:      '#5ee58f',
    };
    const jobList = [];
    for (const [jid, count] of Object.entries(G.jobs || {})) {
      for (let i = 0; i < Math.min(count, 40); i++) jobList.push(jid);
    }
    const totalEmployed = jobList.length;
    const idleCount = Math.max(0, pop - totalEmployed);
    for (let i = 0; i < idleCount; i++) jobList.push('idle');

    const maxBugs = Math.min(pop, 40);
    while (this.bugs.length < maxBugs) {
      const bugIdx = this.bugs.length;
      const job = jobList[bugIdx % Math.max(1, jobList.length)] || 'idle';
      const isAir = job === 'aeronaut' || job === 'navigator';
      const yBase = isAir ? groundY * 0.3 + Math.random() * groundY * 0.3
                          : groundY + 4 + Math.random() * (h * 0.28);
      this.bugs.push({
        x: w * 0.1 + Math.random() * w * 0.8,
        y: yBase,
        vx: (Math.random() - 0.5) * 0.5,
        vy: 0,
        size: 2.2 + Math.random() * 1.6,
        color: JOB_COLOR[job] || '#5ee58f',
        pause: Math.random() * 200,
        wiggle: Math.random() * Math.PI * 2,
        working: job !== 'idle',
        job: job,
        targetX: null,
        targetY: null,
        isHero: bugIdx < heroCount,
        payloadPhase: Math.random() * Math.PI * 2,
        digPhase: Math.random() * Math.PI * 2,
        targetBldgId: null,
        activityState: job === 'idle' ? 'wandering' : 'seeking',
        atTarget: false,
        workingTimer: 0,
        actionPulse: Math.random() * Math.PI * 2,
        carrying: this.isHaulerJob(job) ? Math.random() < 0.45 : false,
        clusterSlot: Math.floor(Math.random() * 6),
        routeRole: null,
        homeBldgId: null,
        targetPatternSeed: Math.random() * Math.PI * 2,
      });
    }
    while (this.bugs.length > maxBugs) this.bugs.pop();

    // Refresh job/color/hero on existing bugs to reflect assignment changes
    this.bugs.forEach((bug, idx) => {
      bug.isHero = idx < heroCount;
      const job = jobList[idx % Math.max(1, jobList.length)] || 'idle';
      if (bug.job !== job) {
        bug.job = job;
        bug.color = JOB_COLOR[job] || '#5ee58f';
        bug.working = job !== 'idle';
        bug.targetX = null;
        bug.targetY = null;
        bug.targetBldgId = null;
        bug.activityState = job === 'idle' ? 'wandering' : 'seeking';
        bug.atTarget = false;
        bug.workingTimer = 0;
        bug.carrying = this.isHaulerJob(job) ? Math.random() < 0.45 : false;
        bug.routeRole = null;
        bug.homeBldgId = null;
        bug.clusterSlot = Math.floor(Math.random() * 6);
      }
    });
    this.lastPop = pop;
  },

  syncBuildings(canvas) {
    const hash = Object.entries(G.bldgs).map(([k, v]) => `${k}:${v}`).join(',');
    if (hash === this.lastBldgHash) return;
    this.lastBldgHash = hash;
    const w = canvas.width;
    const h = canvas.height;
    const groundY = h * 0.58;
    this.buildings = [];

    // Each entry: shape drives the draw call — 'dome','cone','mound','tower','hex','blob','arch','oval','spire','platform'
    const bldgVisuals = [
      { id:'nest',              color:'#a07830', shape:'dome',     minH:14, maxH:20 },
      { id:'clover_patch',      color:'#22c55e', shape:'mound',    minH:7,  maxH:11 },
      { id:'burrow',            color:'#7c5a28', shape:'arch',     minH:14, maxH:20 },
      { id:'fungal_garden',     color:'#c084fc', shape:'blob',     minH:10, maxH:16 },
      { id:'web_workshop',      color:'#94a3b8', shape:'box',      minH:12, maxH:18 },
      { id:'leaf_cache',        color:'#65a30d', shape:'box',      minH:9,  maxH:14 },
      { id:'anthill',           color:'#dc4e18', shape:'cone',     minH:22, maxH:34 },
      { id:'chrysalis_chamber', color:'#22d3ee', shape:'oval',     minH:12, maxH:18 },
      { id:'hive_observatory',  color:'#fcd34d', shape:'hex',      minH:16, maxH:24 },
      { id:'mycelium_network',  color:'#c084fc', shape:'mound',    minH:6,  maxH:10 },
      { id:'compound_lab',      color:'#2dd4bf', shape:'box',      minH:14, maxH:20 },
      { id:'flight_tower',      color:'#e2e8f0', shape:'tower',    minH:28, maxH:42 },
      { id:'sky_dock',          color:'#7dd3fc', shape:'platform', minH:18, maxH:28 },
      { id:'colony_spire',      color:'#e879f9', shape:'spire',    minH:32, maxH:50 },
      { id:'brood_nursery',     color:'#fca5a5', shape:'dome',     minH:14, maxH:20 },
      { id:'amber_vault',       color:'#fbbf24', shape:'hex',      minH:16, maxH:24 },
      { id:'sky_beacon',        color:'#93c5fd', shape:'tower',    minH:22, maxH:32 },
      { id:'cloud_condenser',   color:'#c4b5fd', shape:'platform', minH:14, maxH:22 },
      { id:'spore_circle',      color:'#a78bfa', shape:'blob',     minH:7,  maxH:12 },
      { id:'wax_foundry',       color:'#fb923c', shape:'box',      minH:11, maxH:17 },
      { id:'training_burrow',   color:'#f87171', shape:'arch',     minH:14, maxH:22 },
      { id:'healing_hollow',    color:'#34d399', shape:'dome',     minH:10, maxH:16 },
    ];

    let xCursor = 18;

    // Pre-compute tree exclusion zones in canvas pixels
    const treeZones = this.TREE_DEFS.map(td => ({
      lo: (td.xFrac - td.clearL) * w,
      hi: (td.xFrac + td.clearR) * w,
    }));

    // Helper: if xCursor is inside a tree zone, jump past it
    const skipTreeZones = (x) => {
      let cur = x;
      let jumped = true;
      while (jumped) {
        jumped = false;
        for (const z of treeZones) {
          if (cur >= z.lo && cur <= z.hi) { cur = z.hi + 6; jumped = true; }
        }
      }
      return cur;
    };

    for (const bv of bldgVisuals) {
      const count = G.bldgs[bv.id] || 0;
      for (let i = 0; i < Math.min(count, 5); i++) {
        const bh = bv.minH + Math.random() * (bv.maxH - bv.minH);
        const bw = bh * (bv.shape === 'tower' || bv.shape === 'spire' ? 0.32 : bv.shape === 'cone' ? 0.65 : 0.7 + Math.random() * 0.35);
        xCursor = skipTreeZones(xCursor + Math.random() * 10);
        this.buildings.push({
          x: xCursor,
          y: groundY,
          w: bw, h: bh,
          color: bv.color,
          shape: bv.shape,
          id: bv.id,
          seed: Math.random(),
        });
        xCursor += bw + 5 + Math.random() * 10;
        if (xCursor > w - 18) xCursor = 18 + Math.random() * 28;
      }
    }
  },

  drawBuilding(ctx, b, t) {
    const bx = b.x, by = b.y, bw = b.w, bh = b.h;
    const cx = bx + bw / 2;
    const baseY = by; // ground level
    const topY = by - bh;
    const col = b.color;

    ctx.save();

    switch (b.shape) {

      case 'dome': {
        // Rounded dome rising from ground
        ctx.beginPath();
        ctx.moveTo(bx, baseY);
        ctx.bezierCurveTo(bx, topY + bh * 0.1, cx - bw * 0.55, topY, cx, topY);
        ctx.bezierCurveTo(cx + bw * 0.55, topY, bx + bw, topY + bh * 0.1, bx + bw, baseY);
        ctx.closePath();
        const dg = ctx.createLinearGradient(bx, topY, bx, baseY);
        dg.addColorStop(0, col + 'cc');
        dg.addColorStop(1, col + '44');
        ctx.fillStyle = dg;
        ctx.fill();
        ctx.strokeStyle = col + '99';
        ctx.lineWidth = 0.8;
        ctx.stroke();
        // Door arch
        ctx.beginPath();
        ctx.arc(cx, baseY, bw * 0.12, Math.PI, 0);
        ctx.lineTo(cx + bw * 0.12, baseY);
        ctx.lineTo(cx - bw * 0.12, baseY);
        ctx.fillStyle = col + '33';
        ctx.fill();
        // Glow highlight
        ctx.beginPath();
        ctx.arc(cx - bw * 0.1, topY + bh * 0.22, bw * 0.13, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.fill();
        break;
      }

      case 'cone': {
        // Tall anthill cone
        ctx.beginPath();
        ctx.moveTo(bx, baseY);
        ctx.lineTo(cx, topY);
        ctx.lineTo(bx + bw, baseY);
        ctx.closePath();
        const cg = ctx.createLinearGradient(bx, topY, bx + bw, baseY);
        cg.addColorStop(0, col + 'ee');
        cg.addColorStop(1, col + '55');
        ctx.fillStyle = cg;
        ctx.fill();
        ctx.strokeStyle = col + 'aa';
        ctx.lineWidth = 0.8;
        ctx.stroke();
        // Texture lines
        ctx.strokeStyle = col + '44';
        ctx.lineWidth = 0.5;
        for (let li = 1; li < 4; li++) {
          const lyf = li / 4;
          const lx1 = bx + (cx - bx) * lyf;
          const lx2 = (bx + bw) - ((bx + bw) - cx) * lyf;
          const ly = baseY - bh * lyf;
          ctx.beginPath(); ctx.moveTo(lx1, ly); ctx.lineTo(lx2, ly); ctx.stroke();
        }
        break;
      }

      case 'tower': {
        // Slim tower with crenellations
        const tw = bw * 0.85;
        const tx = cx - tw / 2;
        ctx.fillStyle = col + '66';
        ctx.fillRect(tx, topY, tw, bh);
        ctx.strokeStyle = col + '99';
        ctx.lineWidth = 0.8;
        ctx.strokeRect(tx, topY, tw, bh);
        // Crenellations at top
        const merlonW = tw / 5;
        ctx.fillStyle = col + 'aa';
        for (let mi = 0; mi < 3; mi++) {
          ctx.fillRect(tx + mi * merlonW * 1.6, topY - merlonW * 0.7, merlonW * 0.9, merlonW * 0.7);
        }
        // Glowing windows
        const wink = Math.sin(t * 1.2 + b.seed * 10) > 0.3;
        if (bh > 20) {
          ctx.fillStyle = wink ? col + 'dd' : col + '55';
          ctx.fillRect(cx - 2, topY + bh * 0.3, 4, 3);
          ctx.fillRect(cx - 2, topY + bh * 0.6, 4, 3);
        }
        break;
      }

      case 'spire': {
        // Ornate colony spire — tall + pointed tip
        const sw = bw * 0.7;
        const sx = cx - sw / 2;
        // Body
        ctx.fillStyle = col + '55';
        ctx.fillRect(sx, topY + bh * 0.15, sw, bh * 0.85);
        ctx.strokeStyle = col + '88';
        ctx.lineWidth = 0.8;
        ctx.strokeRect(sx, topY + bh * 0.15, sw, bh * 0.85);
        // Spire tip
        ctx.beginPath();
        ctx.moveTo(sx, topY + bh * 0.15);
        ctx.lineTo(cx, topY);
        ctx.lineTo(sx + sw, topY + bh * 0.15);
        ctx.closePath();
        const sg = ctx.createLinearGradient(cx, topY, cx, topY + bh * 0.15);
        sg.addColorStop(0, col + 'ff');
        sg.addColorStop(1, col + '77');
        ctx.fillStyle = sg;
        ctx.fill();
        // Pulsing tip glow
        const pulse = 0.4 + 0.35 * Math.sin(t * 2.2 + b.seed * 5);
        ctx.beginPath();
        ctx.arc(cx, topY, 3, 0, Math.PI * 2);
        ctx.fillStyle = col + Math.floor(pulse * 255).toString(16).padStart(2,'0');
        ctx.fill();
        // Windows
        ctx.fillStyle = col + '99';
        ctx.fillRect(cx - 2, topY + bh * 0.35, 4, 3);
        ctx.fillRect(cx - 2, topY + bh * 0.58, 4, 3);
        ctx.fillRect(cx - 2, topY + bh * 0.78, 4, 3);
        break;
      }

      case 'arch': {
        // Burrow/training burrow — low with arched entrance
        ctx.fillStyle = col + '55';
        ctx.fillRect(bx, topY + bh * 0.35, bw, bh * 0.65);
        ctx.strokeStyle = col + '88';
        ctx.lineWidth = 0.8;
        ctx.strokeRect(bx, topY + bh * 0.35, bw, bh * 0.65);
        // Arch top
        ctx.beginPath();
        ctx.arc(cx, topY + bh * 0.35, bw * 0.5, Math.PI, 0);
        ctx.closePath();
        const ag = ctx.createLinearGradient(bx, topY, bx, topY + bh * 0.35);
        ag.addColorStop(0, col + 'aa');
        ag.addColorStop(1, col + '55');
        ctx.fillStyle = ag;
        ctx.fill();
        ctx.strokeStyle = col + '88';
        ctx.stroke();
        // Dark entrance
        ctx.beginPath();
        ctx.arc(cx, baseY, bw * 0.18, Math.PI, 0);
        ctx.lineTo(cx + bw * 0.18, baseY);
        ctx.lineTo(cx - bw * 0.18, baseY);
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fill();
        break;
      }

      case 'hex': {
        // Hexagonal hive/vault
        const hr = bw * 0.5;
        ctx.beginPath();
        for (let si = 0; si < 6; si++) {
          const ang = (Math.PI / 3) * si - Math.PI / 6;
          const hx = cx + hr * Math.cos(ang);
          const hy = (topY + baseY) / 2 + (bh * 0.45) * Math.sin(ang);
          si === 0 ? ctx.moveTo(hx, hy) : ctx.lineTo(hx, hy);
        }
        ctx.closePath();
        const hg = ctx.createLinearGradient(cx, topY, cx, baseY);
        hg.addColorStop(0, col + 'cc');
        hg.addColorStop(1, col + '44');
        ctx.fillStyle = hg;
        ctx.fill();
        ctx.strokeStyle = col + 'aa';
        ctx.lineWidth = 0.8;
        ctx.stroke();
        // Inner hex outline
        ctx.beginPath();
        for (let si = 0; si < 6; si++) {
          const ang = (Math.PI / 3) * si - Math.PI / 6;
          const hx = cx + hr * 0.55 * Math.cos(ang);
          const hy = (topY + baseY) / 2 + (bh * 0.25) * Math.sin(ang);
          si === 0 ? ctx.moveTo(hx, hy) : ctx.lineTo(hx, hy);
        }
        ctx.closePath();
        ctx.strokeStyle = col + '44';
        ctx.stroke();
        break;
      }

      case 'blob': {
        // Organic fungal/mycelium blob
        ctx.beginPath();
        const pts = 7;
        for (let pi = 0; pi <= pts; pi++) {
          const ang = (Math.PI * 2 / pts) * pi - Math.PI / 2;
          const r = (bw * 0.5) * (0.75 + 0.25 * Math.sin(ang * 3.1 + b.seed * 8));
          const ry = (bh * 0.5) * (0.75 + 0.2 * Math.cos(ang * 2.3 + b.seed * 6));
          const px = cx + r * Math.cos(ang);
          const py = (topY + baseY) / 2 + ry * Math.sin(ang);
          pi === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath();
        const bg2 = ctx.createRadialGradient(cx, (topY+baseY)/2, 0, cx, (topY+baseY)/2, bw*0.5);
        bg2.addColorStop(0, col + 'cc');
        bg2.addColorStop(1, col + '33');
        ctx.fillStyle = bg2;
        ctx.fill();
        ctx.strokeStyle = col + '66';
        ctx.lineWidth = 0.6;
        ctx.stroke();
        // Spore dots
        ctx.fillStyle = col + '88';
        for (let di = 0; di < 3; di++) {
          const da = b.seed * 6 + di * 2.1;
          ctx.beginPath();
          ctx.arc(cx + bw * 0.25 * Math.cos(da), (topY+baseY)/2 + bh * 0.22 * Math.sin(da), 1.2, 0, Math.PI*2);
          ctx.fill();
        }
        break;
      }

      case 'oval': {
        // Chrysalis — vertical oval
        const ox = cx, oy = (topY + baseY) / 2;
        ctx.beginPath();
        ctx.ellipse(ox, oy, bw * 0.42, bh * 0.5, 0, 0, Math.PI * 2);
        const og = ctx.createRadialGradient(ox - bw*0.1, oy - bh*0.15, 0, ox, oy, bw*0.45);
        og.addColorStop(0, col + 'ee');
        og.addColorStop(0.6, col + '77');
        og.addColorStop(1, col + '22');
        ctx.fillStyle = og;
        ctx.fill();
        ctx.strokeStyle = col + 'aa';
        ctx.lineWidth = 0.8;
        ctx.stroke();
        // Inner glow pulse
        const op = 0.3 + 0.25 * Math.sin(t * 1.8 + b.seed * 7);
        ctx.beginPath();
        ctx.ellipse(ox, oy, bw * 0.22, bh * 0.28, 0, 0, Math.PI * 2);
        ctx.fillStyle = col + Math.floor(op * 255).toString(16).padStart(2,'0');
        ctx.fill();
        break;
      }

      case 'platform': {
        // Sky dock / cloud condenser — raised platform on legs
        const ph = bh * 0.3;
        const legH = bh * 0.45;
        // Legs
        ctx.strokeStyle = col + '66';
        ctx.lineWidth = 1.5;
        const legX1 = bx + bw * 0.22, legX2 = bx + bw * 0.78;
        ctx.beginPath(); ctx.moveTo(legX1, baseY); ctx.lineTo(legX1, baseY - legH); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(legX2, baseY); ctx.lineTo(legX2, baseY - legH); ctx.stroke();
        // Platform top
        ctx.fillStyle = col + '66';
        ctx.fillRect(bx, baseY - legH - ph, bw, ph);
        ctx.strokeStyle = col + '99';
        ctx.lineWidth = 0.8;
        ctx.strokeRect(bx, baseY - legH - ph, bw, ph);
        // Antenna
        ctx.strokeStyle = col + 'bb';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(cx, baseY - legH - ph); ctx.lineTo(cx, topY); ctx.stroke();
        ctx.beginPath();
        ctx.arc(cx, topY, 2.5, 0, Math.PI * 2);
        const pulse2 = 0.5 + 0.4 * Math.sin(t * 2.8 + b.seed * 4);
        ctx.fillStyle = col + Math.floor(pulse2 * 255).toString(16).padStart(2,'0');
        ctx.fill();
        break;
      }

      case 'mound': default: {
        // Simple low mound — clover patch, mycelium
        ctx.beginPath();
        ctx.arc(cx, baseY, bw * 0.5, Math.PI, 0);
        ctx.closePath();
        const mg = ctx.createLinearGradient(cx, topY, cx, baseY);
        mg.addColorStop(0, col + 'bb');
        mg.addColorStop(1, col + '33');
        ctx.fillStyle = mg;
        ctx.fill();
        ctx.strokeStyle = col + '77';
        ctx.lineWidth = 0.6;
        ctx.stroke();
        // Tiny dots on top
        ctx.fillStyle = col + 'cc';
        for (let di = 0; di < 4; di++) {
          const da = (di / 4) * Math.PI;
          ctx.beginPath();
          ctx.arc(cx + bw * 0.3 * Math.cos(da), baseY - bh * 0.6 + bh * 0.15 * Math.sin(da), 1.2, 0, Math.PI*2);
          ctx.fill();
        }
        break;
      }

      case 'box': {
        // Standard building — workshop, lab, cache
        ctx.fillStyle = col + '55';
        ctx.fillRect(bx, topY, bw, bh);
        ctx.strokeStyle = col + '88';
        ctx.lineWidth = 0.8;
        ctx.strokeRect(bx, topY, bw, bh);
        // Roof line
        ctx.fillStyle = col + '99';
        ctx.fillRect(bx, topY, bw, bh * 0.1);
        // Windows
        ctx.fillStyle = col + 'aa';
        ctx.fillRect(bx + bw * 0.2, topY + bh * 0.3, bw * 0.2, bh * 0.18);
        if (bw > 12) ctx.fillRect(bx + bw * 0.6, topY + bh * 0.3, bw * 0.2, bh * 0.18);
        // Door
        ctx.fillStyle = col + '33';
        ctx.fillRect(cx - bw * 0.1, topY + bh * 0.65, bw * 0.2, bh * 0.35);
        break;
      }
    }
    ctx.restore();
  },

  drawBuildingAmbientEffect(ctx, b, t, s, activity) {
    const cx = b.x + b.w / 2;
    const topY = b.y - b.h;
    const pulse = 0.5 + 0.5 * Math.sin(t * 2.2 + b.seed * 9);
    const activeCount = activity ? (activity.active || 0) : 0;
    const workerCount = activity ? (activity.count || 0) : 0;
    const intensity = Math.min(1, 0.22 + workerCount * 0.08 + activeCount * 0.14);

    ctx.save();

    switch (b.id) {
      case 'clover_patch': {
        const bloom = s === 'Winter' ? 0.45 : 1;
        for (let i = 0; i < 3; i++) {
          const px = b.x + b.w * (0.22 + i * 0.28);
          const stemTop = topY - 4 - (i % 2) * 1.5 - Math.sin(t * 1.7 + b.seed * 8 + i) * 1.2;
          ctx.globalAlpha = 0.22 * bloom + intensity * 0.12;
          ctx.strokeStyle = s === 'Winter' ? '#94a3b8' : '#4ade80';
          ctx.lineWidth = 0.7;
          ctx.beginPath();
          ctx.moveTo(px, b.y - 1);
          ctx.quadraticCurveTo(px + Math.sin(t * 1.4 + i) * 1.4, stemTop + 4, px, stemTop);
          ctx.stroke();
          ctx.globalAlpha = 0.28 * bloom + pulse * 0.18;
          ctx.fillStyle = s === 'Winter' ? 'rgba(148,163,184,0.85)' : 'rgba(251,191,36,0.9)';
          ctx.beginPath();
          ctx.arc(px, stemTop, 1.2 + (i === 1 ? 0.35 : 0), 0, Math.PI * 2);
          ctx.fill();
          if (s !== 'Winter') {
            ctx.globalAlpha = 0.18 + pulse * 0.16;
            ctx.fillStyle = 'rgba(253,230,138,0.95)';
            ctx.beginPath();
            ctx.arc(px - 0.4, stemTop - 0.8, 0.5, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        break;
      }

      case 'web_workshop': {
        ctx.globalAlpha = 0.16 + intensity * 0.12;
        ctx.strokeStyle = 'rgba(226,232,240,0.95)';
        ctx.lineWidth = 0.65;
        for (let i = 0; i < 3; i++) {
          const sx = b.x + b.w * (0.18 + i * 0.3);
          const sy = topY + b.h * 0.08;
          const ey = sy - 5 - i * 1.5 - Math.sin(t * 1.8 + i + b.seed * 10) * 1.6;
          ctx.beginPath();
          ctx.moveTo(sx, sy);
          ctx.quadraticCurveTo(sx + Math.sin(t * 1.1 + i) * 1.4, (sy + ey) * 0.5, sx + Math.cos(t * 0.9 + i) * 1.2, ey);
          ctx.stroke();
        }
        ctx.globalAlpha = 0.18 + pulse * 0.18;
        ctx.strokeStyle = 'rgba(241,245,249,0.85)';
        ctx.beginPath();
        ctx.moveTo(b.x + b.w * 0.18, topY + b.h * 0.18);
        ctx.lineTo(b.x + b.w * 0.82, topY + b.h * 0.18);
        ctx.moveTo(b.x + b.w * 0.28, topY + b.h * 0.05);
        ctx.lineTo(b.x + b.w * 0.72, topY + b.h * 0.3);
        ctx.moveTo(b.x + b.w * 0.72, topY + b.h * 0.05);
        ctx.lineTo(b.x + b.w * 0.28, topY + b.h * 0.3);
        ctx.stroke();
        break;
      }

      case 'fungal_garden':
      case 'spore_circle':
      case 'mycelium_network': {
        const sporeCount = 4 + Math.min(3, activeCount);
        for (let i = 0; i < sporeCount; i++) {
          const ang = t * (0.45 + i * 0.03) + b.seed * 14 + i * 1.7;
          const rx = Math.max(5, b.w * 0.55) + (i % 2) * 2;
          const ry = Math.max(3, b.h * 0.25) + (i % 3);
          const px = cx + Math.cos(ang) * rx;
          const py = topY + b.h * 0.45 + Math.sin(ang * 1.3) * ry - i * 0.4;
          const r = 0.8 + (i % 2) * 0.45;
          ctx.globalAlpha = 0.16 + intensity * 0.16 + Math.max(0, Math.sin(ang * 1.6)) * 0.12;
          ctx.fillStyle = b.id === 'fungal_garden' ? 'rgba(216,180,254,0.95)' : 'rgba(192,132,252,0.95)';
          ctx.beginPath();
          ctx.arc(px, py, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha *= 0.55;
          ctx.beginPath();
          ctx.arc(px, py, r * 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
        break;
      }

      case 'burrow':
      case 'training_burrow':
      case 'anthill': {
        const crumbCount = 3 + Math.min(3, activeCount);
        for (let i = 0; i < crumbCount; i++) {
          const px = cx + ((i - (crumbCount - 1) / 2) * 2.8) + Math.sin(t * 1.8 + i + b.seed * 7) * 1.1;
          const py = b.y + 1 + (i % 2) * 1.4 + Math.abs(Math.sin(t * 2.4 + i)) * 1.3;
          ctx.globalAlpha = 0.12 + intensity * 0.12;
          ctx.fillStyle = b.id === 'anthill' ? 'rgba(194,65,12,0.9)' : 'rgba(146,100,42,0.9)';
          ctx.beginPath();
          ctx.arc(px, py, 0.9 + (i % 2) * 0.35, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 0.08 + pulse * 0.08 + activeCount * 0.03;
        ctx.fillStyle = 'rgba(120,72,32,0.8)';
        ctx.beginPath();
        ctx.ellipse(cx, b.y + 2.3, b.w * 0.38, 1.8 + activeCount * 0.15, 0, 0, Math.PI * 2);
        ctx.fill();
        break;
      }

      case 'amber_vault':
      case 'wax_foundry': {
        for (let i = 0; i < 3; i++) {
          const px = b.x + b.w * (0.24 + i * 0.24);
          const py = topY + b.h * (0.2 + i * 0.16);
          ctx.globalAlpha = 0.18 + pulse * 0.16;
          ctx.fillStyle = b.id === 'amber_vault' ? 'rgba(251,191,36,0.95)' : 'rgba(251,146,60,0.95)';
          ctx.beginPath();
          ctx.arc(px, py, 1.05 + (i % 2) * 0.35, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha *= 0.5;
          ctx.beginPath();
          ctx.arc(px, py, 3.2, 0, Math.PI * 2);
          ctx.fill();
        }
        if (activeCount > 0) {
          ctx.globalAlpha = 0.16 + intensity * 0.12;
          ctx.strokeStyle = b.id === 'amber_vault' ? 'rgba(253,224,71,0.9)' : 'rgba(251,191,36,0.9)';
          ctx.lineWidth = 0.7;
          ctx.beginPath();
          ctx.moveTo(cx, topY + b.h * 0.28);
          ctx.lineTo(cx, topY + b.h * 0.5 + Math.sin(t * 3 + b.seed * 4) * 1.6);
          ctx.stroke();
        }
        break;
      }

      case 'hive_observatory':
      case 'sky_beacon': {
        ctx.globalAlpha = 0.1 + pulse * 0.12 + activeCount * 0.03;
        ctx.strokeStyle = b.id === 'sky_beacon' ? 'rgba(147,197,253,0.85)' : 'rgba(252,211,77,0.85)';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.arc(cx, topY + 1, 4 + Math.sin(t * 1.2 + b.seed * 5) * 0.6, Math.PI * 1.08, Math.PI * 1.92);
        ctx.stroke();
        break;
      }

      default:
        break;
    }

    ctx.restore();
  },

  spawnParticle(canvas, type) {
    const pal = this.seasonPalette();
    const w = canvas.width;
    const h = canvas.height;
    const s = seasonName();
    const forced = type || null;

    // Event-driven particles
    if (forced === 'blight') {
      this.particles.push({ x: Math.random()*w, y: Math.random()*h*0.7, vx:(Math.random()-0.5)*0.3, vy:0.2+Math.random()*0.3, life:1, decay:0.012+Math.random()*0.008, size:2+Math.random()*2, color:'#991b1b', type:'blight' });
      return;
    }
    if (forced === 'blight_frost') {
      // Dim grey-blue crystals drifting down — starvation signal in winter
      this.particles.push({ x: Math.random()*w, y: Math.random()*h*0.5, vx:(Math.random()-0.5)*0.2, vy:0.15+Math.random()*0.25, life:0.7+Math.random()*0.3, decay:0.006+Math.random()*0.004, size:1.5+Math.random()*2, color:'#64748b', type:'frost_drift' });
      return;
    }
    if (forced === 'brood') {
      const b = this.buildings.find(b => b.id === 'brood_nursery' || b.id === 'nest');
      const px = b ? b.x + b.w/2 : w/2;
      this.particles.push({ x:px+( Math.random()-0.5)*20, y:canvas.height*0.58-5, vx:(Math.random()-0.5)*0.8, vy:-0.5-Math.random()*1.2, life:1, decay:0.01+Math.random()*0.008, size:2+Math.random()*2.5, color:Math.random()<0.5?'#fbbf24':'#fde68a', type:'brood' });
      return;
    }
    if (forced === 'amber') {
      this.particles.push({ x:Math.random()*w, y:canvas.height*0.58+Math.random()*20, vx:(Math.random()-0.5)*0.4, vy:-0.3-Math.random()*0.5, life:1, decay:0.008+Math.random()*0.006, size:1.5+Math.random()*2, color:Math.random()<0.5?'#fbbf24':'#f59e0b', type:'amber' });
      return;
    }
    if (forced === 'star') {
      this.particles.push({ x:Math.random()*w, y:Math.random()*(canvas.height*0.55), vx:(Math.random()-0.5)*1.5, vy:-0.1-Math.random()*0.2, life:1, decay:0.005+Math.random()*0.005, size:1+Math.random()*2, color:Math.random()<0.5?'#93c5fd':'#e0e7ff', type:'star' });
      return;
    }
    if (forced === 'rain') {
      this.particles.push({ x:Math.random()*w, y:-5, vx:0.2, vy:2.5+Math.random()*1.5, life:0.8, decay:0.025+Math.random()*0.01, size:0.8, color:'#93c5fd', type:'rain' });
      return;
    }

    // Seasonal ambient
    if (s === 'Winter') {
      this.particles.push({ x:Math.random()*w, y:-5, vx:(Math.random()-0.5)*0.3, vy:0.35+Math.random()*0.5, life:1, decay:0.002+Math.random()*0.003, size:1+Math.random()*2, color:pal.particle, type:'snow' });
    } else if (s === 'Autumn') {
      this.particles.push({ x:Math.random()*w, y:-5, vx:0.3+Math.random()*0.5, vy:0.4+Math.random()*0.4, life:1, decay:0.004+Math.random()*0.003, size:2+Math.random()*3, color:Math.random()<0.5?'#fb923c':'#f97316', type:'leaf' });
    } else if (s === 'Spring') {
      this.particles.push({ x:Math.random()*w, y:h*0.3+Math.random()*h*0.35, vx:(Math.random()-0.5)*0.2, vy:-0.12-Math.random()*0.25, life:1, decay:0.007+Math.random()*0.005, size:1+Math.random()*1.5, color:Math.random()<0.5?'#bbf7d0':'#86efac', type:'pollen' });
    } else {
      this.particles.push({ x:Math.random()*w, y:h*0.3+Math.random()*h*0.45, vx:(Math.random()-0.5)*0.1, vy:-0.06-Math.random()*0.15, life:1, decay:0.005+Math.random()*0.003, size:1+Math.random(), color:pal.particle, type:'heat' });
    }
  },

  spawnWorkerFloat(jid, text, color = '#5ee58f') {
    const candidates = this.bugs.filter(b => b.job === jid);
    if (!candidates.length) return false;
    const bug = candidates[Math.floor(Math.random() * candidates.length)];
    this.floatTexts.push({
      x: bug.x,
      y: bug.y - bug.size - 8,
      vx: (Math.random() - 0.5) * 0.10,
      vy: -0.20 - Math.random() * 0.04,
      life: 1,
      decay: 0.010 + Math.random() * 0.003,
      text,
      color
    });
    return true;
  },

  flushYieldBank(jid, threshold = 0.12) {
    const bank = this.yieldBank[jid];
    if (!bank) return false;
    const entries = Object.entries(bank).filter(([, amount]) => amount > 0.0001).sort((a, b) => b[1] - a[1]);
    if (!entries.length) return false;
    const chosen = [];
    for (const entry of entries) {
      if (!chosen.length) chosen.push(entry);
      else if (chosen.length < 2 && entry[1] >= threshold * 0.45) chosen.push(entry);
    }
    const totalChosen = chosen.reduce((sum, [, amount]) => sum + amount, 0);
    if (totalChosen < Math.max(0.05, threshold * 0.45) && (this.yieldTimers[jid] || 0) < 4) return false;
    const text = chosen.map(([res, amount]) => `${RES[res].icon}+${fmtWorkerBurstAmt(amount)}`).join(' ');
    const color = WORKER_FLOAT_COLORS[chosen[0][0]] || '#5ee58f';
    if (!this.spawnWorkerFloat(jid, text, color)) return false;
    chosen.forEach(([res]) => { bank[res] = 0; });
    this.yieldTimers[jid] = 0;
    return true;
  },

  queueWorkerYields(breakdown) {
    for (const [jid, gains] of Object.entries(breakdown || {})) {
      if (!this.bugs.some(b => b.job === jid)) continue;
      const bank = this.yieldBank[jid] ||= {};
      this.yieldTimers[jid] = (this.yieldTimers[jid] || 0) + (TICK_MS / 1000);
      for (const [res, amount] of Object.entries(gains || {})) {
        if (amount > 0) bank[res] = (bank[res] || 0) + amount;
      }
      const total = Object.values(bank).reduce((sum, amount) => sum + amount, 0);
      const threshold = ['forager','leaf_col','excavator','aeronaut','navigator'].includes(jid) ? 0.16 : 0.11;
      const interval = ['dirt_dig','weaver','miner','resin_tap'].includes(jid) ? 5.8 : 4.4;
      if (total >= threshold * 1.8 || (this.yieldTimers[jid] >= interval && total >= 0.05)) {
        this.flushYieldBank(jid, threshold);
      }
    }
  },

  drawUnderground(ctx, w, h, groundY, t, s) {
    const subH = h - groundY;   // height of underground section

    // ── Soil strata layers ────────────────────────────
    // Three bands with slightly different earth tones, depth-driven
    const strata = [
      { yFrac: 0.00, color: s === 'Winter' ? '#5a3e28' : '#6b4a2e', alpha: 0.22 },
      { yFrac: 0.32, color: '#4a3020', alpha: 0.28 },
      { yFrac: 0.62, color: '#2d1e10', alpha: 0.32 },
    ];
    for (const [si, layer] of strata.entries()) {
      const nextFrac = strata[si + 1] ? strata[si + 1].yFrac : 1.0;
      const y1 = groundY + subH * layer.yFrac;
      const y2 = groundY + subH * nextFrac;
      const grad = ctx.createLinearGradient(0, y1, 0, y2);
      grad.addColorStop(0, layer.color + Math.round(layer.alpha * 255).toString(16).padStart(2,'0'));
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.fillRect(0, y1, w, y2 - y1);
    }

    // ── Subtle horizontal crack/mineral lines ─────────
    ctx.globalAlpha = 0.07;
    ctx.strokeStyle = '#c8a87a';
    ctx.lineWidth = 0.5;
    const crackSeeds = [0.18, 0.38, 0.54, 0.74, 0.88];
    for (const [ci, yf] of crackSeeds.entries()) {
      const cy = groundY + subH * yf;
      ctx.beginPath();
      let cx2 = 0;
      ctx.moveTo(0, cy);
      while (cx2 < w) {
        cx2 += 18 + (ci * 7 + cx2 * 0.1) % 22;
        const jog = ((ci * 13 + cx2) % 7) - 3;
        ctx.lineTo(Math.min(cx2, w), cy + jog);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // ── Tunnel arches under burrow/training_burrow buildings ──
    const burrowBldgs = this.buildings.filter(b => b.id === 'burrow' || b.id === 'training_burrow' || b.id === 'nest');
    const totalBurrows = (G.bldgs.burrow || 0) + (G.bldgs.training_burrow || 0) + (G.bldgs.nest || 0);
    if (totalBurrows > 0) {
      for (const b of burrowBldgs) {
        const cx2 = b.x + b.w / 2;
        const archW = b.w * 0.9 + 4;
        const archH = Math.min(subH * 0.55, 28 + b.h * 0.5);

        // Tunnel shadow/depth
        const tunGrad = ctx.createRadialGradient(cx2, groundY + archH * 0.4, 2, cx2, groundY + archH * 0.4, archW * 0.7);
        tunGrad.addColorStop(0, 'rgba(0,0,0,0.55)');
        tunGrad.addColorStop(0.6, 'rgba(0,0,0,0.28)');
        tunGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = tunGrad;
        ctx.beginPath();
        ctx.ellipse(cx2, groundY + archH * 0.3, archW * 0.55, archH * 0.75, 0, 0, Math.PI * 2);
        ctx.fill();

        // Arch opening
        ctx.fillStyle = 'rgba(15,8,3,0.7)';
        ctx.beginPath();
        ctx.moveTo(cx2 - archW / 2, groundY + 2);
        ctx.quadraticCurveTo(cx2 - archW / 2, groundY - archH * 0.12, cx2, groundY - archH * 0.12);
        ctx.quadraticCurveTo(cx2 + archW / 2, groundY - archH * 0.12, cx2 + archW / 2, groundY + 2);
        ctx.lineTo(cx2 + archW / 2, groundY + archH * 0.55);
        ctx.quadraticCurveTo(cx2, groundY + archH * 0.62, cx2 - archW / 2, groundY + archH * 0.55);
        ctx.closePath();
        ctx.fill();

        // Arch rim
        ctx.strokeStyle = 'rgba(160,110,60,0.40)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx2 - archW / 2, groundY + 2);
        ctx.quadraticCurveTo(cx2 - archW / 2, groundY - archH * 0.12, cx2, groundY - archH * 0.12);
        ctx.quadraticCurveTo(cx2 + archW / 2, groundY - archH * 0.12, cx2 + archW / 2, groundY + 2);
        ctx.stroke();

        // Tunnel depth lines receding inward
        ctx.globalAlpha = 0.18;
        ctx.strokeStyle = '#7c5a28';
        ctx.lineWidth = 0.6;
        for (let di = 1; di <= 3; di++) {
          const scale = 1 - di * 0.22;
          ctx.beginPath();
          ctx.moveTo(cx2 - archW / 2 * scale, groundY + archH * 0.25 * di * 0.4);
          ctx.quadraticCurveTo(cx2, groundY + archH * (0.1 + di * 0.12), cx2 + archW / 2 * scale, groundY + archH * 0.25 * di * 0.4);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
    }

    // ── Amber seams (amber_vault) ─────────────────────
    const amberCount = G.bldgs.amber_vault || 0;
    if (amberCount > 0) {
      const seamCount = Math.min(amberCount + 1, 5);
      const amberBldg = this.buildings.find(b => b.id === 'amber_vault');
      const amberCx = amberBldg ? amberBldg.x + amberBldg.w / 2 : w * 0.6;
      for (let ai = 0; ai < seamCount; ai++) {
        const seamY = groundY + subH * (0.25 + ai * 0.13);
        const seamW = 40 + ai * 18 + amberCount * 8;
        const pulse = 0.55 + 0.25 * Math.sin(t * 1.2 + ai * 1.4);
        const seamGrad = ctx.createLinearGradient(amberCx - seamW, seamY, amberCx + seamW, seamY);
        seamGrad.addColorStop(0, 'transparent');
        seamGrad.addColorStop(0.3, `rgba(251,191,36,${pulse * 0.35})`);
        seamGrad.addColorStop(0.5, `rgba(251,191,36,${pulse * 0.55})`);
        seamGrad.addColorStop(0.7, `rgba(251,191,36,${pulse * 0.35})`);
        seamGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = seamGrad;
        // Seam is a thin band with slight waviness
        const jog = 1.5 * Math.sin(t * 0.8 + ai);
        ctx.fillRect(amberCx - seamW, seamY + jog - 1.5, seamW * 2, 3);

        // Amber gem nodes along the seam
        const nodeCount = 2 + ai;
        for (let ni = 0; ni < nodeCount; ni++) {
          const nx = amberCx - seamW * 0.7 + (ni / (nodeCount - 1 || 1)) * seamW * 1.4;
          const ny = seamY + jog + Math.sin(ni * 2.1) * 2;
          const glow = ctx.createRadialGradient(nx, ny, 0, nx, ny, 5);
          glow.addColorStop(0, `rgba(253,230,138,${pulse * 0.8})`);
          glow.addColorStop(0.5, `rgba(251,191,36,${pulse * 0.45})`);
          glow.addColorStop(1, 'transparent');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(nx, ny, 5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // ── Mycelium thread network (mycelium_network) ────
    const myceliumCount = G.bldgs.mycelium_network || 0;
    const fungalCount   = G.bldgs.fungal_garden   || 0;
    if (myceliumCount + fungalCount > 0) {
      const rootStrength = Math.min(myceliumCount * 0.3 + fungalCount * 0.15, 1.0);
      const mycelBldg = this.buildings.find(b => b.id === 'mycelium_network' || b.id === 'fungal_garden');
      const rootCx = mycelBldg ? mycelBldg.x + mycelBldg.w / 2 : w * 0.4;

      // Recursive-style branching threads
      const drawThread = (x, y, angle, length, depth) => {
        if (depth === 0 || length < 3) return;
        const ex = x + Math.cos(angle) * length;
        const ey = y + Math.sin(angle) * length;
        if (ey > h + 4) return;
        ctx.globalAlpha = rootStrength * (0.22 - depth * 0.03);
        ctx.strokeStyle = depth > 2 ? '#c084fc' : '#a78bfa';
        ctx.lineWidth = depth * 0.5;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.quadraticCurveTo(
          x + (ex - x) * 0.5 + Math.sin(angle * 3 + depth) * 4,
          y + (ey - y) * 0.5,
          ex, ey
        );
        ctx.stroke();
        const spread = 0.35 + rootStrength * 0.2;
        drawThread(ex, ey, angle - spread, length * 0.68, depth - 1);
        drawThread(ex, ey, angle + spread * 0.8, length * 0.62, depth - 1);
        if (depth > 2) drawThread(ex, ey, angle + 0.05, length * 0.72, depth - 1);
      };

      const threadDepth = 3 + Math.round(rootStrength * 2);
      const threadLen   = 18 + rootStrength * 22;
      // Main downward root
      drawThread(rootCx, groundY + 4, Math.PI * 0.5, threadLen, threadDepth);
      // Side branches
      drawThread(rootCx, groundY + 8, Math.PI * 0.5 + 0.5, threadLen * 0.85, threadDepth - 1);
      drawThread(rootCx, groundY + 8, Math.PI * 0.5 - 0.5, threadLen * 0.85, threadDepth - 1);

      // Spore dots at thread tips glow gently
      if (myceliumCount > 0) {
        ctx.globalAlpha = 0.30 + 0.12 * Math.sin(t * 1.8);
        ctx.fillStyle = '#e9d5ff';
        const sporeDots = [
          [rootCx + 12, groundY + subH * 0.35],
          [rootCx - 18, groundY + subH * 0.45],
          [rootCx + 26, groundY + subH * 0.55],
          [rootCx - 8,  groundY + subH * 0.62],
        ].slice(0, myceliumCount + 1);
        for (const [sx, sy] of sporeDots) {
          ctx.beginPath();
          ctx.arc(sx, sy, 2.5 + Math.sin(t * 2.2 + sx) * 0.8, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
    }

    // ── Drought: dry cracked earth overlay ───────────
    if (G.events.active === 'hd_drought') {
      ctx.globalAlpha = 0.18;
      ctx.strokeStyle = '#92400e';
      ctx.lineWidth = 0.8;
      const crackOrigins = [[w*0.2, groundY+12],[w*0.5, groundY+8],[w*0.75, groundY+16]];
      for (const [ox, oy] of crackOrigins) {
        for (let ci = 0; ci < 4; ci++) {
          const angle = (ci / 4) * Math.PI * 2 + 0.3;
          const len = 12 + ci * 5;
          ctx.beginPath();
          ctx.moveTo(ox, oy);
          ctx.lineTo(ox + Math.cos(angle) * len, oy + Math.sin(angle) * len * 0.5);
          ctx.stroke();
        }
      }
      ctx.globalAlpha = 1;
    }

    // ── Deep excavation glow (excavator workers) ─────
    const excCount = (G.jobs && G.jobs.excavator) || 0;
    if (excCount > 0) {
      const glowAlpha = 0.08 + 0.04 * Math.sin(t * 1.1);
      const excGrad = ctx.createLinearGradient(0, groundY + subH * 0.5, 0, h);
      excGrad.addColorStop(0, 'transparent');
      excGrad.addColorStop(1, `rgba(180,120,40,${glowAlpha})`);
      ctx.fillStyle = excGrad;
      ctx.fillRect(0, groundY + subH * 0.5, w, subH * 0.5);
    }
  },

  drawSeasonalTrees(ctx, w, groundY, t, s) {
    const sm = S_MOD[s] || {};
    const leafMod  = sm.leaves  ?? 1.0;
    const hdMod    = sm.honeydew ?? 1.0;
    const sporeMod = sm.spores  ?? 1.0;

    const palettes = {
      Spring: { canopy:['#86efac','#4ade80','#d9f99d','#bbf7d0'], trunk:'#5c4a2a', branch:'#6b563a' },
      Summer: { canopy:['#15803d','#166534','#22c55e','#16a34a'], trunk:'#4a3520', branch:'#5c4a2a' },
      Autumn: { canopy:['#f59e0b','#ea580c','#dc2626','#d97706','#c2410c','#fbbf24'], trunk:'#3d2a10', branch:'#4a3520' },
      Winter: { canopy:[], trunk:'#7a9ab5', branch:'#8aa8c4' },
    };
    const pal = palettes[s] || palettes.Summer;

    // Helper: draw one organic branch using a quadratic bezier
    const drawBranch = (x1, y1, x2, y2, cpDx, cpDy, lw, col) => {
      ctx.strokeStyle = col;
      ctx.lineWidth = lw;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.quadraticCurveTo(x1 + cpDx, y1 + cpDy, x2, y2);
      ctx.stroke();
    };

    // Helper: draw a trunk with root flare
    const drawTrunk = (tx, ty, trunkH, trunkW, col) => {
      // Root flare
      const grad = ctx.createLinearGradient(tx - trunkW, ty, tx + trunkW, ty - trunkH);
      grad.addColorStop(0, col + 'cc');
      grad.addColorStop(1, col + '88');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(tx - trunkW * 1.8, ty);
      ctx.quadraticCurveTo(tx - trunkW * 1.1, ty - trunkH * 0.15, tx - trunkW * 0.5, ty - trunkH);
      ctx.lineTo(tx + trunkW * 0.5, ty - trunkH);
      ctx.quadraticCurveTo(tx + trunkW * 1.1, ty - trunkH * 0.15, tx + trunkW * 1.8, ty);
      ctx.closePath();
      ctx.fill();
    };

    // Helper: draw a canopy layer (ellipse cluster) for a given density
    const drawCanopyLayer = (tx, topY, trunkH, leafMod2, cols, layerAlpha) => {
      if (!cols.length || leafMod2 <= 0) return;
      const baseR = trunkH * 0.42 * Math.min(leafMod2, 1.4);
      // Three tiers: wide base, mid, and narrow top
      const layers = [
        { ry: topY + trunkH * 0.22, rx: baseR * 1.05, ry2: baseR * 0.62 },
        { ry: topY + trunkH * 0.10, rx: baseR * 0.85, ry2: baseR * 0.52 },
        { ry: topY - trunkH * 0.02, rx: baseR * 0.58, ry2: baseR * 0.40 },
      ];
      for (const [li, layer] of layers.entries()) {
        // Slightly offset each layer to look organic
        const offsetX = Math.sin(li * 2.1) * baseR * 0.18;
        ctx.globalAlpha = layerAlpha * (0.72 - li * 0.08);
        ctx.fillStyle = cols[(li + 1) % cols.length];
        ctx.beginPath();
        ctx.ellipse(tx + offsetX, layer.ry, layer.rx, layer.ry2, 0, 0, Math.PI * 2);
        ctx.fill();
        // Second overlapping blob per layer for texture
        ctx.globalAlpha = layerAlpha * 0.45;
        ctx.fillStyle = cols[li % cols.length];
        ctx.beginPath();
        ctx.ellipse(tx + offsetX * -0.5 + baseR * 0.22, layer.ry - trunkH * 0.04, layer.rx * 0.7, layer.ry2 * 0.65, 0.3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    };

    for (const td of this.TREE_DEFS) {
      const tx = w * td.xFrac;
      const ty = groundY;
      const trunkH = td.trunkH;
      const trunkW = td.trunkW;
      const topY = ty - trunkH;

      ctx.save();

      // ── Main branches (bezier curves) ──────────────
      // Paint branches first so their bases tuck into the trunk cleanly.
      ctx.globalAlpha = s === 'Winter' ? 0.38 : 0.55;
      const branchDefs = td.style === 0 ? [
        // style 0: spreading, tall
        { dx1:-0.28, dy1:-0.52, dx2:-0.72, dy2:-0.82, cpDx:-0.15, cpDy:-0.25, lw: trunkW * 0.65 },
        { dx1: 0.22, dy1:-0.48, dx2: 0.70, dy2:-0.78, cpDx: 0.12, cpDy:-0.22, lw: trunkW * 0.65 },
        { dx1:-0.12, dy1:-0.72, dx2:-0.38, dy2:-0.97, cpDx:-0.08, cpDy:-0.15, lw: trunkW * 0.45 },
        { dx1: 0.08, dy1:-0.70, dx2: 0.35, dy2:-0.96, cpDx: 0.06, cpDy:-0.14, lw: trunkW * 0.45 },
      ] : td.style === 1 ? [
        // style 1: asymmetric lean
        { dx1:-0.32, dy1:-0.50, dx2:-0.78, dy2:-0.74, cpDx:-0.18, cpDy:-0.20, lw: trunkW * 0.60 },
        { dx1: 0.18, dy1:-0.55, dx2: 0.65, dy2:-0.80, cpDx: 0.10, cpDy:-0.18, lw: trunkW * 0.60 },
        { dx1:-0.05, dy1:-0.76, dx2:-0.28, dy2:-0.99, cpDx:-0.05, cpDy:-0.12, lw: trunkW * 0.40 },
      ] : [
        // style 2: wider, rounder
        { dx1:-0.38, dy1:-0.44, dx2:-0.85, dy2:-0.68, cpDx:-0.20, cpDy:-0.18, lw: trunkW * 0.65 },
        { dx1: 0.35, dy1:-0.42, dx2: 0.82, dy2:-0.66, cpDx: 0.18, cpDy:-0.16, lw: trunkW * 0.65 },
        { dx1:-0.15, dy1:-0.70, dx2:-0.42, dy2:-0.94, cpDx:-0.10, cpDy:-0.12, lw: trunkW * 0.42 },
        { dx1: 0.12, dy1:-0.68, dx2: 0.40, dy2:-0.92, cpDx: 0.08, cpDy:-0.12, lw: trunkW * 0.42 },
      ];

      for (const bd of branchDefs) {
        const startX = tx + bd.dx1 * Math.max(trunkW * 2.2, 2.5);
        const startY = ty + bd.dy1 * trunkH;
        drawBranch(
          startX, startY,
          tx + bd.dx2 * trunkH * 0.55, ty + bd.dy2 * trunkH,
          bd.cpDx * trunkH * 0.4, bd.cpDy * trunkH * 0.35,
          bd.lw, pal.branch
        );
      }

      // ── Trunk ──────────────────────────────────────
      // Lay bark over the branch roots so thin trees still read as connected.
      const trunkAlpha = s === 'Winter' ? 0.40 : 0.65;
      ctx.globalAlpha = trunkAlpha;
      drawTrunk(tx, ty, trunkH, trunkW, pal.trunk);

      // Small crown collar to blend the main branch split into the trunk.
      ctx.globalAlpha = s === 'Winter' ? 0.32 : 0.46;
      drawBranch(tx, ty - trunkH * 0.52, tx - trunkW * 1.35, ty - trunkH * 0.57, -trunkW * 0.18, -trunkH * 0.04, trunkW * 0.55, pal.branch);
      drawBranch(tx, ty - trunkH * 0.50, tx + trunkW * 1.35, ty - trunkH * 0.55, trunkW * 0.18, -trunkH * 0.04, trunkW * 0.55, pal.branch);

      // ── Canopy ─────────────────────────────────────
      if (leafMod > 0 && pal.canopy.length > 0) {
        drawCanopyLayer(tx, topY, trunkH, leafMod, pal.canopy, s === 'Autumn' ? 0.72 : 0.62);

        // Autumn: individual leaf-like dots scattered around canopy edge
        if (s === 'Autumn') {
          ctx.globalAlpha = 0.55;
          const dotCount = 18;
          const baseR = trunkH * 0.42;
          for (let di = 0; di < dotCount; di++) {
            const angle = (di / dotCount) * Math.PI * 2 + td.style * 0.8;
            const r = baseR * (0.55 + 0.55 * Math.sin(di * 1.7));
            const lx = tx + Math.cos(angle) * r * 0.9;
            const ly = topY + trunkH * 0.15 + Math.sin(angle) * r * 0.5;
            ctx.fillStyle = pal.canopy[di % pal.canopy.length];
            ctx.beginPath();
            ctx.ellipse(lx, ly, 3.5, 2, angle, 0, Math.PI * 2);
            ctx.fill();
          }

          // Sporadic falling leaf particles from this tree
          if (Math.random() < 0.05) {
            const angle2 = Math.random() * Math.PI * 2;
            const r2 = trunkH * 0.3 * Math.random();
            this.particles.push({
              x: tx + Math.cos(angle2) * r2,
              y: topY + trunkH * 0.2,
              vx: (Math.random() - 0.5) * 0.7,
              vy: 0.25 + Math.random() * 0.45,
              life: 0.9, decay: 0.005,
              color: pal.canopy[Math.floor(Math.random() * pal.canopy.length)],
              size: 3 + Math.random() * 2.5,
              type: 'leaf',
            });
          }
        }

        // Spring: small blossom dots at branch tips, scale with honeydew mod
        if (s === 'Spring' && hdMod >= 1.0) {
          const flowerCols = ['#fde68a','#fbcfe8','#fda4af','#c4b5fd'];
          const fCount = Math.round(4 + hdMod * 3);
          const baseR = trunkH * 0.38;
          for (let fi = 0; fi < fCount; fi++) {
            const angle = (fi / fCount) * Math.PI * 2;
            const fx = tx + Math.cos(angle) * baseR * 0.82;
            const fy = topY + trunkH * 0.15 + Math.sin(angle) * baseR * 0.42;
            ctx.globalAlpha = 0.70;
            ctx.fillStyle = flowerCols[fi % flowerCols.length];
            ctx.beginPath();
            ctx.arc(fx, fy, 3, 0, Math.PI * 2);
            ctx.fill();
            // Tiny petal ring
            for (let pi = 0; pi < 5; pi++) {
              const pa = (pi / 5) * Math.PI * 2;
              ctx.beginPath();
              ctx.arc(fx + Math.cos(pa) * 3.5, fy + Math.sin(pa) * 3.5, 1.5, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }
      }

      // ── Winter: frost on branch tips + twig details ─
      if (s === 'Winter') {
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = '#bae6fd';
        for (const bd of branchDefs) {
          const tipX = tx + bd.dx2 * trunkH * 0.55;
          const tipY = ty + bd.dy2 * trunkH;
          // Tiny twig forks at each branch tip
          for (let ti = 0; ti < 3; ti++) {
            const ta = -Math.PI * 0.5 + (ti - 1) * 0.45;
            ctx.strokeStyle = pal.branch;
            ctx.lineWidth = 0.7;
            ctx.globalAlpha = 0.28;
            ctx.beginPath();
            ctx.moveTo(tipX, tipY);
            ctx.lineTo(tipX + Math.cos(ta) * 7, tipY + Math.sin(ta) * 7);
            ctx.stroke();
          }
          // Frost dot at tip
          ctx.globalAlpha = 0.40;
          ctx.fillStyle = '#e0f2fe';
          ctx.beginPath();
          ctx.arc(tipX, tipY, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // ── Mushroom hints at base (Autumn/Spring) ──────
      if ((s === 'Autumn' || s === 'Spring') && sporeMod > 1.0) {
        const mCount = Math.min(3, Math.round((sporeMod - 1.0) * 5));
        const capCol  = s === 'Autumn' ? '#d97706' : '#86efac';
        const stemCol = s === 'Autumn' ? '#92400e' : '#15803d';
        for (let mi = 0; mi < mCount; mi++) {
          const mx = tx + (mi % 2 === 0 ? -1 : 1) * (6 + mi * 5);
          ctx.globalAlpha = 0.55;
          ctx.fillStyle = capCol;
          ctx.beginPath();
          ctx.ellipse(mx, ty - 4, 4, 2.5, 0, Math.PI, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = stemCol;
          ctx.lineWidth = 1;
          ctx.globalAlpha = 0.50;
          ctx.beginPath();
          ctx.moveTo(mx, ty - 4);
          ctx.lineTo(mx, ty - 1);
          ctx.stroke();
        }
      }

      ctx.globalAlpha = 1;
      ctx.restore();
    }
  },

  draw(canvas) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;
    const pal = this.seasonPalette();
    const groundY = h * 0.58;
    const t = Date.now() * 0.001;
    const s = seasonName();
    const evt = G.events.active;

    ctx.clearRect(0, 0, w, h);

    // ── Sky gradient ──────────────────────────────────
    const skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
    skyGrad.addColorStop(0, pal.skyTop);
    skyGrad.addColorStop(1, pal.sky);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, w, groundY);

    // ── Moon (Autumn / Winter) ────────────────────────
    if (pal.moonAlpha > 0) {
      const mx = w * 0.82, my = groundY * 0.22;
      ctx.globalAlpha = pal.moonAlpha * 0.7;
      const moonGlow = ctx.createRadialGradient(mx, my, 0, mx, my, 22);
      moonGlow.addColorStop(0, '#e0f2fe');
      moonGlow.addColorStop(0.45, '#bae6fd44');
      moonGlow.addColorStop(1, 'transparent');
      ctx.fillStyle = moonGlow;
      ctx.beginPath(); ctx.arc(mx, my, 22, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = pal.moonAlpha;
      ctx.beginPath(); ctx.arc(mx, my, 7, 0, Math.PI*2);
      ctx.fillStyle = s === 'Winter' ? '#e0f2fe' : '#fef3c7';
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // ── Stars ─────────────────────────────────────────
    if (s === 'Winter' || s === 'Autumn') {
      const starCount = s === 'Winter' ? 28 : 14;
      for (let i = 0; i < starCount; i++) {
        const sx = (i * 53 + 17) % w;
        const sy = (i * 37 + 11) % (groundY * 0.72);
        const twinkle = 0.15 + 0.25 * Math.sin(t * (0.8 + (i % 5) * 0.3) + i);
        ctx.globalAlpha = twinkle;
        ctx.fillStyle = i % 4 === 0 ? '#bae6fd' : '#f0f9ff';
        ctx.fillRect(sx, sy, i % 3 === 0 ? 1.5 : 1, i % 3 === 0 ? 1.5 : 1);
      }
      ctx.globalAlpha = 1;
    }

    // ── Clouds (Spring / Summer) ──────────────────────
    if (pal.cloudAlpha > 0) {
      ctx.globalAlpha = pal.cloudAlpha;
      ctx.fillStyle = s === 'Spring' ? '#d1fae5' : '#fefce8';
      const cloudPhase = (t * 6) % (w + 120);
      [[cloudPhase - 60, groundY * 0.18, 40, 14],
       [cloudPhase + 80, groundY * 0.32, 32, 10],
       [cloudPhase - 200, groundY * 0.12, 28, 9]].forEach(([cx2, cy2, rw, rh]) => {
        ctx.beginPath();
        ctx.ellipse(cx2 % (w + 100) - 50, cy2, rw, rh, 0, 0, Math.PI*2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    // ── Event sky tint ────────────────────────────────
    if (evt) {
      let tintCol = null;
      if (evt === 'hd_boost')    tintCol = 'rgba(34,197,94,0.07)';
      if (evt === 'hd_blight')   tintCol = 'rgba(127,29,29,0.14)';
      if (evt === 'hd_drought')  tintCol = 'rgba(120,53,15,0.10)';
      if (evt === 'brood_surge') tintCol = 'rgba(251,191,36,0.09)';
      if (evt === 'amber_rush')  tintCol = 'rgba(251,146,60,0.11)';
      if (evt === 'star_current')tintCol = 'rgba(120,215,255,0.10)';
      if (tintCol) { ctx.fillStyle = tintCol; ctx.fillRect(0, 0, w, groundY); }
    }

    // ── Fog ───────────────────────────────────────────
    if (pal.fogAlpha > 0) {
      const fg = ctx.createLinearGradient(0, groundY*0.5, 0, groundY);
      fg.addColorStop(0, `rgba(160,185,220,0)`);
      fg.addColorStop(1, `rgba(160,185,220,${pal.fogAlpha})`);
      ctx.fillStyle = fg;
      ctx.fillRect(0, 0, w, groundY);
    }

    // ── Winter scarcity visuals ───────────────────────
    if (s === 'Winter') {
      // Frost vignette on edges
      const frostL = ctx.createLinearGradient(0, 0, w * 0.18, 0);
      frostL.addColorStop(0, 'rgba(180,210,240,0.12)');
      frostL.addColorStop(1, 'transparent');
      ctx.fillStyle = frostL;
      ctx.fillRect(0, 0, w * 0.18, h);
      const frostR = ctx.createLinearGradient(w, 0, w * 0.82, 0);
      frostR.addColorStop(0, 'rgba(180,210,240,0.12)');
      frostR.addColorStop(1, 'transparent');
      ctx.fillStyle = frostR;
      ctx.fillRect(w * 0.82, 0, w * 0.18, h);

      // Frost crystals on ground
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = '#bae6fd';
      for (let i = 0; i < 14; i++) {
        const fx = (i * 83 + 7) % w;
        const fy = groundY + 2 + (i * 17) % (h - groundY - 8);
        ctx.beginPath();
        ctx.arc(fx, fy, 1 + (i % 3) * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Scarcity indicator — dim leaf collectors' payload when winter
      // (visual only — leaves icon is desaturated in ground leaves via syncGroundLeaves)
    }

    // ── Seasonal trees (behind ground) ───────────────
    this.drawSeasonalTrees(ctx, w, groundY, t, s);

    // ── Ground ───────────────────────────────────────
    const gndGrad = ctx.createLinearGradient(0, groundY, 0, h);
    gndGrad.addColorStop(0, pal.grass);
    gndGrad.addColorStop(0.35, pal.grassEdge);
    gndGrad.addColorStop(1, pal.ground);
    ctx.fillStyle = gndGrad;
    ctx.fillRect(0, groundY, w, h - groundY);

    // ── Irregular grass edge ──────────────────────────
    if (!this.grassOffsets || this.grassOffsets.length !== Math.ceil(w / 8)) {
      this.grassOffsets = Array.from({length: Math.ceil(w/8)+1}, () => Math.random() * 3 - 1.5);
    }
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    for (let gi = 0; gi < this.grassOffsets.length; gi++) {
      ctx.lineTo(gi * 8, groundY + this.grassOffsets[gi]);
    }
    ctx.lineTo(w, groundY);
    ctx.lineTo(w, groundY + 4);
    ctx.lineTo(0, groundY + 4);
    ctx.closePath();
    ctx.fillStyle = pal.grassEdge;
    ctx.fill();

    // Ground line
    ctx.strokeStyle = pal.accent + '28';
    ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(w, groundY); ctx.stroke();

    // ── Buildings ─────────────────────────────────────
    this.drawUnderground(ctx, w, h, groundY, t, s);
    for (const b of this.buildings) {
      this.drawBuilding(ctx, b, t);
    }

    // ── Ground leaves ──────────────────────────────────
    this.drawGroundLeaves(ctx, t);

    // ── Queen sprite ──────────────────────────────────
    this.drawQueen(ctx, w, h, groundY, t);

    // ── Particles ─────────────────────────────────────
    for (const p of this.particles) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      if (p.type === 'leaf') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.x * 0.01 + t * 1.1);
        ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
        ctx.restore();
      } else if (p.type === 'rain') {
        ctx.fillRect(p.x, p.y, 0.8, p.size * 3);
      } else if (p.type === 'blight') {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size/2, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#7f1d1d'; ctx.lineWidth = 0.4;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.size, p.y + p.size*0.8); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size/2, 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // ── Building activity halos ───────────────────────
    const buildingActivity = new Map();
    for (const bug of this.bugs) {
      if (!bug.working || !bug.targetBldgId) continue;
      const meta = this.jobActivityMeta(bug.job || 'idle');
      const entry = buildingActivity.get(bug.targetBldgId) || { color: meta.color, count: 0, active: 0 };
      entry.count += 1;
      if (bug.atTarget) entry.active += 1;
      buildingActivity.set(bug.targetBldgId, entry);
    }
    for (const b of this.buildings) {
      const act = buildingActivity.get(b.id);
      if (!act) continue;
      const haloPulse = 0.08 + Math.min(0.24, act.count * 0.035) + Math.max(0, Math.sin(t * 2.2 + b.seed * 10)) * 0.05;
      const halo = ctx.createRadialGradient(b.x + b.w / 2, b.y - b.h * 0.28, 0, b.x + b.w / 2, b.y - b.h * 0.28, Math.max(b.w * 1.8, b.h * 1.15));
      halo.addColorStop(0, act.color + '33');
      halo.addColorStop(0.45, act.color + '18');
      halo.addColorStop(1, 'transparent');
      ctx.globalAlpha = haloPulse;
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(b.x + b.w / 2, b.y - b.h * 0.28, Math.max(b.w * 1.5, b.h * 0.95), 0, Math.PI * 2);
      ctx.fill();
      if (act.active > 0) {
        ctx.globalAlpha = 0.35 + 0.08 * Math.sin(t * 4 + b.seed * 6);
        ctx.strokeStyle = act.color + 'aa';
        ctx.lineWidth = 0.85;
        ctx.beginPath();
        ctx.ellipse(b.x + b.w / 2, b.y + 2, b.w * (0.7 + act.active * 0.05), 2.1 + act.active * 0.25, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      if ((b.id === 'brood_nursery' || b.id === 'nest') && act.color === '#f9a8d4' && act.active > 0) {
        ctx.globalAlpha = 0.28 + 0.1 * Math.sin(t * 5 + b.seed * 8);
        ctx.fillStyle = '#fbcfe8';
        for (let pi = 0; pi < Math.min(4, act.active + 1); pi++) {
          const px = b.x + b.w * (0.2 + pi * 0.18);
          const py = b.y - b.h * 0.35 - Math.sin(t * 2 + pi) * 2;
          ctx.beginPath();
          ctx.arc(px, py, 1.2 + (pi % 2) * 0.4, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
    }

    // ── Building-specific ambient activity ────────────
    for (const b of this.buildings) {
      this.drawBuildingAmbientEffect(ctx, b, t, s, buildingActivity.get(b.id) || null);
    }

    // ── Colony bugs ───────────────────────────────────
    for (const bug of this.bugs) {
      const facing = bug.vx >= 0 ? 1 : -1;
      const isHero = bug.isHero || false;
      const job = bug.job || 'idle';
      const isAir = job === 'aeronaut' || job === 'navigator';
      const activityMeta = this.jobActivityMeta(job);

      if (bug.working && bug.targetX !== null && bug.activityState !== 'idle' && bug.activityState !== 'resting') {
        const dxHint = bug.targetX - bug.x;
        const dyHint = (bug.targetY !== null ? bug.targetY : bug.y) - bug.y;
        const hintDist = Math.hypot(dxHint, dyHint);
        if (!bug.atTarget && hintDist > 8) {
          const returningToStore = bug.routeRole === 'storage';
          ctx.save();
          ctx.globalAlpha = Math.min(returningToStore ? 0.28 : 0.18, 0.06 + hintDist / 180);
          ctx.strokeStyle = (isHero ? '#ffc562' : activityMeta.color) + (returningToStore ? 'bb' : '88');
          ctx.lineWidth = returningToStore ? 0.9 : 0.55;
          ctx.setLineDash(returningToStore ? [3, 2] : [2, 3]);
          ctx.beginPath();
          ctx.moveTo(bug.x, bug.y);
          ctx.lineTo(bug.x + dxHint * (returningToStore ? 0.34 : 0.24), bug.y + dyHint * (returningToStore ? 0.34 : 0.24));
          ctx.stroke();
          if (returningToStore) {
            ctx.fillStyle = (isHero ? '#ffc562' : activityMeta.color) + 'cc';
            ctx.beginPath();
            ctx.arc(bug.x + dxHint * 0.34, bug.y + dyHint * 0.34, 1.2, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      if (bug.atTarget && bug.working) {
        const ringPulse = 0.45 + 0.3 * Math.sin(t * 5 + bug.actionPulse);
        ctx.globalAlpha = ringPulse;
        ctx.strokeStyle = activityMeta.color + 'cc';
        ctx.lineWidth = 0.85;
        ctx.beginPath();
        ctx.ellipse(bug.x, bug.y + bug.size + 1.6, 3.2 + Math.sin(t * 3 + bug.wiggle) * 0.7, 1.5, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // Body
      ctx.fillStyle = isHero ? '#ffc562' : (bug.working ? bug.color : bug.color + 'aa');
      ctx.beginPath();
      ctx.ellipse(bug.x, bug.y, bug.size * (isHero ? 1.15 : 1), bug.size * (isHero ? 0.72 : 0.62), 0, 0, Math.PI*2);
      ctx.fill();

      // Wings for aeronauts / navigators
      if (isAir) {
        ctx.globalAlpha = 0.35 + 0.15 * Math.abs(Math.sin(bug.wiggle * 3));
        ctx.fillStyle = job === 'navigator' ? '#fcd34d88' : '#7dd3fc88';
        ctx.beginPath();
        ctx.ellipse(bug.x - facing * 1, bug.y - 1.5, bug.size * 1.4, bug.size * 0.5, -0.4 * facing, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(bug.x - facing * 1, bug.y + 1, bug.size * 1.2, bug.size * 0.4, 0.3 * facing, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      // Head nub
      ctx.beginPath();
      ctx.arc(bug.x + facing * bug.size * 0.72, bug.y, bug.size * 0.36, 0, Math.PI*2);
      ctx.fillStyle = isHero ? '#f59e0b' : bug.color;
      ctx.fill();
      // Eye
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.fillRect(bug.x + facing * (bug.size * 0.68), bug.y - bug.size * 0.2, 1.2, 1.2);
      // Antennae
      ctx.strokeStyle = (isHero ? '#fbbf24' : bug.color) + 'bb';
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      ctx.moveTo(bug.x + facing * bug.size * 0.6, bug.y - bug.size * 0.3);
      ctx.lineTo(bug.x + facing * (bug.size * 0.6 + 2.5), bug.y - bug.size * 0.8 + Math.sin(bug.wiggle * 2) * 0.8);
      ctx.stroke();

      // ── Job-specific payload / activity visuals ───────
      const pp = bug.payloadPhase || 0;
      const bobY = bug.y - bug.size - 3 + Math.sin(pp) * 0.8;

      if (isHero) {
        const starPulse = Math.sin(t * 3 + bug.wiggle) > 0.3;
        if (starPulse) {
          ctx.fillStyle = '#ffc562cc';
          ctx.fillRect(bug.x - 1.5, bug.y - bug.size - 4, 3, 3);
          ctx.fillStyle = '#ffc56288';
          ctx.fillRect(bug.x - 2.5, bug.y - bug.size - 3, 1, 1);
          ctx.fillRect(bug.x + 1.5, bug.y - bug.size - 3, 1, 1);
        }
      } else if (job === 'leaf_col') {
        // Tiny leaf shape carried above — frosted grey in winter, vibrant otherwise
        const leafCarry = bug.carrying || bug.atTarget;
        const leafCol = s === 'Winter' ? '#8aa8c4' : '#22c55e';
        const veinCol = s === 'Winter' ? '#475569' : '#16a34a';
        ctx.save();
        ctx.globalAlpha = leafCarry ? 1 : 0.42;
        ctx.translate(bug.x + Math.sin(pp) * (leafCarry ? 1.4 : 0.8), bobY);
        ctx.rotate(Math.sin(pp * 0.7) * 0.4);
        ctx.fillStyle = leafCol;
        ctx.beginPath();
        ctx.ellipse(0, 0, 3.2, 2.0, 0.4, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = veinCol + '88';
        ctx.lineWidth = 0.5;
        ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(0, 2); ctx.stroke();
        ctx.restore();
        ctx.globalAlpha = 1;
      } else if (job === 'forager') {
        // Honeydew drop — smaller and dimmer in winter (scarcity)
        const hdCarry = bug.carrying || bug.atTarget;
        const hdAlpha = (s === 'Winter' ? 0.45 : 1.0) * (hdCarry ? 1 : 0.5);
        const hdSize = (s === 'Winter' ? 1.3 : 2.0) * (hdCarry ? 1.1 : 0.8);
        ctx.globalAlpha = hdAlpha;
        ctx.fillStyle = s === 'Winter' ? '#6b7280' : '#fbbf24cc';
        ctx.beginPath();
        ctx.arc(bug.x, bobY - 1, hdSize, 0, Math.PI * 2);
        ctx.fill();
        if (s !== 'Winter') {
          ctx.fillStyle = '#fde68a88';
          ctx.beginPath();
          ctx.arc(bug.x - 0.6, bobY - 1.8, 0.8, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      } else if (job === 'dirt_dig') {
        // Dirt particles kicked up when digging
        const digAnim = Math.abs(Math.sin(bug.digPhase || 0));
        if (digAnim > 0.5) {
          ctx.globalAlpha = (digAnim - 0.5) * 2;
          ctx.fillStyle = '#a07830';
          ctx.beginPath(); ctx.arc(bug.x - 2.5, bug.y + bug.size + 1, 1.2, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(bug.x + 2.0, bug.y + bug.size + 2, 0.9, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(bug.x, bug.y + bug.size + 3, 1.0, 0, Math.PI*2); ctx.fill();
          ctx.globalAlpha = 1;
        }
