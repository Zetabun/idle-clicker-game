          fighter_ids: ctx.fighterIds,
        })
      },
    ]
  };
}

function buildChamberEncounter(ctx) {
  const tier = ctx.zoneTier;
  const extractLoot = { compound: tier >= 5 ? 3 + Math.floor(tier / 3) : 0, elytra: tier >= 7 ? 1 + Math.floor((tier - 6) / 2) : 0, insight: 10 + tier * 3, aether: tier >= 6 ? 8 + tier * 2 : 0 };
  if (!extractLoot.compound) { extractLoot.chitin = 6 + tier * 2; extractLoot.resin = 4 + tier; }
  const sealLoot = { royal_jelly: 2 + Math.floor(tier / 3), honeydew: 15 + tier * 3 };
  const harvestLoot = { insight: 6 + tier * 2, spores: 8 + tier * 2 };
  if (ctx.compoundReady && tier >= 5) harvestLoot.compound = 1 + Math.floor(tier / 4);
  return {
    kind: 'scout_encounter',
    title: 'Encounter: Sealed Chamber',
    msg: `The squad finds a sealed sub-chamber near ${ctx.zoneName}, oozing with crystallised material. They can extract the contents, seal it for a jelly reward, or study the specimens inside.`,
    choices: [
      {
        label: 'Extract the crystallised contents',
        outcome: 'Scholar-heavy colonies read the formations best. High-tier materials and insight, but the work is slow.',
        effect: makeScoutEncounterResult({
          label: 'Sealed Chamber',
          log: 'The squad extracted the crystallised chamber contents — complex materials and hard-won insight.',
          toast: 'Chamber extracted',
          loot: extractLoot,
          fatigue: ctx.scholarEdge >= 0.10 ? 10 + Math.round(tier * 0.6) : 18 + Math.round(tier * 1.0),
          fighter_ids: ctx.fighterIds,
        })
      },
      {
        label: 'Seal it and claim the jelly reward',
        outcome: 'Soldier-edge helps the squad hold the perimeter. Safe option with direct Royal Jelly.',
        effect: makeScoutEncounterResult({
          label: 'Sealed Chamber',
          log: 'The squad sealed the chamber opening and claimed the jelly deposit it was protecting.',
          toast: 'Chamber sealed',
          loot: sealLoot,
          fatigue: 8 + Math.round(tier * 0.5),
          fighter_ids: ctx.fighterIds,
        })
      },
      {
        label: 'Study the organisms inside',
        outcome: 'Safer, moderate insight and spores. Scholars turn this into knowledge rather than raw materials.',
        effect: makeScoutEncounterResult({
          label: 'Sealed Chamber',
          log: 'The squad carefully catalogued the sealed specimens and brought back spore samples and notes.',
          toast: 'Organisms studied',
          loot: harvestLoot,
          fatigue: 4 + Math.round(tier * 0.3),
          fighter_ids: ctx.fighterIds,
        })
      },
    ]
  };
}

function buildScoutEncounter(zone, squad, outcome, effectivePower) {
  const ctx = scoutEncounterContext(zone, squad, outcome, effectivePower);
  const season = ctx.season;
  const weights = [
    { id:'cache',   w: 22 + ctx.tradeEdge * 90 + (zone.tier || 1) * 2 },
    { id:'spore',   w: 18 + (season === 'Spring' || season === 'Autumn' ? 7 : 0) + ctx.scholarEdge * 90 },
    { id:'convoy',  w: (ctx.tradeUnlocked ? 20 : 8) + ctx.tradeEdge * 100 + (zone.id && zone.id.startsWith('rival_') ? 7 : 0) },
    { id:'brood',   w: 14 + ctx.broodEdge * 90 + (ctx.housingRoom > 0 ? 5 : 0) + (season === 'Spring' ? 5 : 0) },
    { id:'ambush',  w: 16 + ctx.soldierEdge * 80 + (zone.id && zone.id.startsWith('rival_') ? 10 : 0) + (zone.tier || 1) * 1.5 },
    { id:'chamber', w: 14 + ctx.scholarEdge * 80 + (zone.tier || 1) * 2 + (!(zone.id && zone.id.startsWith('rival_')) ? 6 : 0) },
  ];
  const picked = weightedScoutEncounterPick(weights);
  if (picked === 'spore')   return buildSporeScoutEncounter(ctx);
  if (picked === 'convoy')  return buildConvoyScoutEncounter(ctx);
  if (picked === 'brood')   return buildBroodScoutEncounter(ctx);
  if (picked === 'ambush')  return buildAmbushEncounter(ctx);
  if (picked === 'chamber') return buildChamberEncounter(ctx);
  return buildCacheScoutEncounter(ctx);
}

function applyScoutEncounterResult(result) {
  if (!result) return;
  const lootMult = 1 +
    Math.min(0.22,
      ((broodTradeMult() - 1) * 0.12) +
      ((rareTradeMult() - 1) * 0.40) +
      ((broodInsightMult() - 1) * 0.04)
    );
  const gained = applyScoutEncounterLoot(result.loot || {}, lootMult);
  if (result.hatch) G.hatch.progress = Math.min(2, (G.hatch.progress || 0) + result.hatch);
  const affected = applyScoutEncounterFatigue(result.fighter_ids || [], result.fatigue || 0, result.hp_loss || 0);
  const extras = [];
  if (gained.length) extras.push(gained.join(' '));
  if (result.hatch) extras.push(`🥚+${Math.round(result.hatch * 100)}% hatch`);
  if ((result.fatigue || 0) > 0 && affected.length) extras.push(`Fatigue on ${affected.length} fighter${affected.length === 1 ? '' : 's'}`);
  log(`${result.log}${extras.length ? ' ' + extras.join(' · ') : ''}`, result.warn ? 'bad' : 'ev');
  toast(result.toast || result.label || 'Encounter resolved', result.warn ? 'warn' : '');
}

function maybeQueueScoutEncounter(zone, squad, outcome, effectivePower) {
  if (outcome === 'loss' || (zone && zone.is_expedition_contact)) return false;
  if (!hasSeenPopup('scouting_encounters')) {
    showFeatureAnnounce('scouting_encounters');
    return false;
  }
  if (G.events && G.events.choice) return false;
  if (Math.random() >= scoutEncounterChance(zone, outcome, squad)) return false;
  const encounter = buildScoutEncounter(zone, squad, outcome, effectivePower);
  if (!encounter) return false;
  G.events.choice = encounter;
  log(`Encounter at ${zone.name}: ${encounter.title.replace('Encounter: ', '')}.`, 'ev');
  toast('Scouting encounter!', '');
  return true;
}

function resolveScout(zoneId) {
  const zone = getScoutZone(zoneId);
  if (!zone) return;
  const squad = (G.fighters || []).filter(f => f.zone === zoneId && f.status === 'scouting');
  if (!squad.length) return;

  const tactic = scoutMissionTactic(squad);
  const encounterSquad = squad.map(f => ({ ...f, scout_tactic: tactic.id }));
  const totalPower = squad.reduce((s, f) => s + fighterPower(f), 0);
  const roll = 0.75 + Math.random() * 0.5;
  const effectivePower = totalPower * roll * tactic.power_mult * warProjectPowerMult();

  let outcome;
  if (effectivePower >= zone.power * 0.9) outcome = 'win';
  else if (effectivePower >= zone.power * 0.55) outcome = 'partial';
  else outcome = 'loss';

  const xpGain = outcome === 'win' ? 18 : outcome === 'partial' ? 10 : 4;
  squad.forEach(f => {
    f.xp += xpGain;
    f.missions = (f.missions || 0) + 1;
    while (f.xp >= f.xp_next) {
      f.xp -= f.xp_next;
      f.level++;
      f.max_hp = fighterMaxHp(f.level);
      f.hp = Math.min(f.max_hp, f.hp + 3);
      f.xp_next = fighterXpNext(f.level);
      log(`⭐ ${f.name} reached Level ${f.level}!`);
      toast(`${f.name} is now Level ${f.level}!`);
    }
  });

  let dmgBase = 0;
  if (outcome === 'win') dmgBase = Math.ceil(zone.power * 0.08);
  if (outcome === 'partial') dmgBase = Math.ceil(zone.power * 0.25);
  if (outcome === 'loss') dmgBase = Math.ceil(zone.power * 0.55);
  dmgBase = Math.max(0, Math.round(dmgBase * tactic.damage_mult));

  const hasRallying = squad.some(f => f.trait === 'rallying');
  squad.forEach(f => {
    let dmg = Math.max(0, dmgBase + Math.floor(Math.random() * 3) - 1);
    if (f.trait === 'steadfast') dmg = Math.floor(dmg * 0.70);
    else if (hasRallying && f.trait !== 'rallying') dmg = Math.floor(dmg * 0.85);
    const scar = f.scar ? BATTLE_SCARS[f.scar] : null;
    if (scar && scar.dmg_taken_mult) dmg = Math.floor(dmg * scar.dmg_taken_mult);
    const hpFloor = (scar && scar.hp_floor) ? scar.hp_floor : 1;
    const hpBefore = f.hp;
    f.hp = Math.max(hpFloor, f.hp - dmg);
    delete f.zone;
    delete f.scout_elapsed;
    delete f.scout_duration;
    delete f.scout_tactic;

    if (!f.hero && !f.scar && f.max_hp > 0 && f.hp <= Math.ceil(f.max_hp * 0.20) && hpBefore > Math.ceil(f.max_hp * 0.20)) {
      f.near_deaths = (f.near_deaths || 0) + 1;
      const scarKey = randomBattleScar();
      f.scar = scarKey;
      const newMaxHp = fighterEffectiveMaxHp(f);
      f.max_hp = newMaxHp;
      f.hp = Math.max(hpFloor, Math.min(f.hp, newMaxHp));
      const scarDef = BATTLE_SCARS[scarKey];
      log(`${f.name} barely survived — a battle scar takes hold: ${scarDef.icon} ${scarDef.name}. ${scarDef.desc}`, 'ev');
      toast(`${f.name} earned a battle scar: ${scarDef.name}`, '');
    }

    if (f.hp < f.max_hp * 0.6 && f.max_hp > 0) {
      f.status = 'recovering';
      const healMult = (f.scar && BATTLE_SCARS[f.scar] && BATTLE_SCARS[f.scar].heal_mult) ? BATTLE_SCARS[f.scar].heal_mult : 1;
      f.recover_ticks = Math.ceil((f.max_hp - f.hp) * 10 * healMult);
    } else {
      f.status = 'idle';
      f.recover_ticks = 0;
    }
  });

  let gained = [];
  if (outcome !== 'loss') {
    const reward = rollTerritoryReward(zone);
    G._lastRewardMsg = reward.msg;
    const lootMult = (outcome === 'partial' ? 0.5 : 1)
      * (1 + legacyRank('predator_lore') * 0.15)
      * (squad.some(f => f.trait === 'fortunate') ? 1.3 : 1)
      * warProjectLootZoneMult(zone)
      * tactic.loot_mult
      * squad.reduce((m, f) => m * (f.scar && BATTLE_SCARS[f.scar] && BATTLE_SCARS[f.scar].loot_mult ? BATTLE_SCARS[f.scar].loot_mult : 1), 1);
    for (const [res, amt] of Object.entries(reward.loot)) {
      const r = RES[res];
      if (!r) continue;
      const added = Math.min(Math.ceil(amt * lootMult), (maxRes(res) || 99) - (G.res[res] || 0));
      if (added > 0) {
        G.res[res] = (G.res[res] || 0) + added;
        G.vis[res] = true;
        gained.push(`${r.icon}+${added}`);
      }
    }
    const spoilDrops = rollFighterSpoils(zone, squad, outcome, { stage:false });
    const spoilGained = applyFighterSpoils(spoilDrops);
    if (spoilGained.length) {
      gained.push(...spoilGained);
      if (!hasSeenPopup('fighter_spoils')) showFeatureAnnounce('fighter_spoils');
      else if (!hasSeenPopup('war_projects')) showFeatureAnnounce('war_projects');
    }
    if (zone.id === 'the_apex') G.stats.apex_cleared = (G.stats.apex_cleared || 0) + 1;
    if (zone.id === 'hive_tyrant') G.stats.tyrant_cleared = (G.stats.tyrant_cleared || 0) + 1;

    const lootStr = gained.join(' ');
    const outcomeLabel = outcome === 'partial' ? 'Partial victory' : 'Victory';
    const rival = zone.is_rival_base ? getRivalById(zone.rival_id) : zone.id.startsWith('rival_') ? primaryRival() : null;
    const zoneLabel = zoneDisplayName(zone);
    if (rival) noteRivalOutcome(rival.id, 'repelled');
    log(`${outcomeLabel} at ${zoneLabel}${rival ? ` against ${rivalFullName(rival)}` : ''}! ${reward.msg} ${lootStr} Order: ${tactic.name}.`);
    toast(`${zoneLabel}: ${lootStr || 'returned'}`, '');
  } else {
    const rival = zone.is_rival_base ? getRivalById(zone.rival_id) : zone.id.startsWith('rival_') ? primaryRival() : null;
    const zoneLabel = zoneDisplayName(zone);
    if (rival) noteRivalOutcome(rival.id, 'victories');
    log(`Defeat at ${zoneLabel}${rival ? ` against ${rivalFullName(rival)}` : ''}. The squad retreats with injuries after a ${tactic.name.toLowerCase()} attempt.`, 'bad');
    toast(`Defeat at ${zoneLabel}. Fighters need recovery.`, 'bad');
  }

  G.stats.scouts = (G.stats.scouts || 0) + 1;

  if (!G.mission_hist) G.mission_hist = [];
  const histLoot = gained.slice(0, 4).join(' ') || (outcome === 'loss' ? 'Nothing' : '');
  G.mission_hist.unshift({ zone: `${zoneDisplayName(zone)} · ${tactic.name}`, outcome, loot: histLoot, tick: G.time.tick });
  if (G.mission_hist.length > 5) G.mission_hist.pop();

  const rewardMsgText = outcome !== 'loss' ? (G._lastRewardMsg || null) : null;
  delete G._lastRewardMsg;
  G.pending_battle_report = buildBattleReport(zone, squad, tactic, totalPower, effectivePower, roll, outcome, gained, rewardMsgText);
  setTimeout(() => maybeShowBattleReport(), 120);

  if (!zone.is_expedition_contact && zone.stageable && outcome !== 'loss' && !G.scout_stage) {
    G.scout_stage = {
      zone_id: zone.id,
      zone_name: zoneDisplayName(zone),
      zone_icon: zone.icon,
      zone_enemy: zone.enemy_type || 'ancient',
      power: Math.round(zone.power * zone.stage_power_mult),
      duration: Math.round(zone.duration * zone.stage_duration_mult),
      rewards: zone.stage_rewards,
      stage_desc: zone.stage_desc,
      fighters_needed: zone.fighters,
      offer_until: G.time.tick + 450,
      winner_squad: squad.map(f => f.id),
      boss: !!zone.boss,
    };
    if (!hasSeenPopup('multi_stage_scouting')) {
      showFeatureAnnounce('multi_stage_scouting');
    }
  }

  resolveExpeditionScoutOutcome(zone, outcome);
  resolveRivalBaseScoutOutcome(zone, outcome);
  const spawnedEncounter = maybeQueueScoutEncounter(zone, encounterSquad, outcome, effectivePower);
  renderTab();
  if (spawnedEncounter) renderChoiceEvent();
}

function pushDeeper() {
  const stage = G.scout_stage;
  if (!stage || G.time.tick > stage.offer_until) { toast('Stage offer expired', 'warn'); G.scout_stage = null; renderTab(); return; }
  const selected = (_scoutSelection || []).filter(fid => {
    const f = (G.fighters || []).find(f => f.id === fid);
    return f && f.status === 'idle';
  });
  if (selected.length < stage.fighters_needed) {
    toast(`Select at least ${stage.fighters_needed} idle fighter${stage.fighters_needed > 1 ? 's' : ''}`, 'warn');
    return;
  }
  const squad = selected.slice(0, Math.max(stage.fighters_needed, selected.length));
  const squadObjs = squad.map(fid => G.fighters.find(f => f.id === fid)).filter(Boolean);
  const tactic = activeScoutTactic();
  const hasSwift = squadObjs.some(f => f.trait === 'swift');
  const cautiousMult = squadObjs.some(f => f.scar === 'cautious') ? BATTLE_SCARS.cautious.duration_mult : 1;
  const effectiveDuration = Math.round((((hasSwift ? stage.duration * 0.75 : stage.duration) * tactic.duration_mult) * cautiousMult));
  squad.forEach(fid => {
    const f = G.fighters.find(f => f.id === fid);
    if (f) {
      f.status = 'scouting';
      f.zone = stage.zone_id + '_stage';
      f.scout_elapsed = 0;
      f.scout_duration = effectiveDuration;
      f._is_stage = true;
      f.scout_tactic = tactic.id;
    }
  });
  _scoutSelection = [];
  G.scout_stage.accepted = true;
  G.scout_stage.stage_squad = squad;
  log(`${squad.length} fighter${squad.length > 1 ? 's' : ''} push deeper into ${stage.zone_name} using ${tactic.name}!`);
  toast(`Pushing deeper into ${stage.zone_name} · ${tactic.name}`);
  renderTab();
}

function declineStage() {
  G.scout_stage = null;
  toast('Stage declined — squad returns to base.');
  renderTab();
}

function resolveStage(stageZoneId) {
  const stage = G.scout_stage;
  if (!stage) return;
  const squad = (G.fighters || []).filter(f => f.zone === stageZoneId && f._is_stage);
  if (!squad.length) { G.scout_stage = null; return; }

  const tactic = scoutMissionTactic(squad);
  const totalPower = squad.reduce((s, f) => s + fighterPower(f), 0);
  const roll = 0.70 + Math.random() * 0.50;
  const effectivePower = totalPower * roll * tactic.power_mult * warProjectPowerMult();
  const outcome = effectivePower >= stage.power * 0.9 ? 'win' : effectivePower >= stage.power * 0.55 ? 'partial' : 'loss';

  const xpGain = outcome === 'win' ? 26 : outcome === 'partial' ? 14 : 5;
  squad.forEach(f => {
    f.xp = (f.xp || 0) + xpGain;
    f.missions = (f.missions || 0) + 1;
    while (f.xp >= f.xp_next) {
      f.xp -= f.xp_next; f.level++;
      f.max_hp = fighterMaxHp(f.level); f.hp = Math.min(f.max_hp, f.hp + 3);
      f.xp_next = fighterXpNext(f.level);
      log(`⭐ ${f.name} reached Level ${f.level}!`); toast(`${f.name} is now Level ${f.level}!`);
    }
  });

  let dmgBase = outcome === 'win' ? Math.ceil(stage.power * 0.12) : outcome === 'partial' ? Math.ceil(stage.power * 0.35) : Math.ceil(stage.power * 0.65);
  dmgBase = Math.max(0, Math.round(dmgBase * tactic.damage_mult));
  const hasRallying = squad.some(f => f.trait === 'rallying');
  squad.forEach(f => {
    let dmg = Math.max(0, dmgBase + Math.floor(Math.random() * 4) - 1);
    if (f.trait === 'steadfast') dmg = Math.floor(dmg * 0.65);
    else if (hasRallying && f.trait !== 'rallying') dmg = Math.floor(dmg * 0.82);
    const scar = f.scar ? BATTLE_SCARS[f.scar] : null;
    if (scar && scar.dmg_taken_mult) dmg = Math.floor(dmg * scar.dmg_taken_mult);
    const hpFloor = (scar && scar.hp_floor) ? scar.hp_floor : 1;
    const hpBefore = f.hp;
    f.hp = Math.max(hpFloor, f.hp - dmg);
    delete f.zone; delete f.scout_elapsed; delete f.scout_duration; delete f._is_stage; delete f.scout_tactic;
    if (!f.hero && !f.scar && f.max_hp > 0 && f.hp <= Math.ceil(f.max_hp * 0.20) && hpBefore > Math.ceil(f.max_hp * 0.20)) {
      f.near_deaths = (f.near_deaths || 0) + 1;
      const scarKey = randomBattleScar();
      f.scar = scarKey;
      const newMaxHp = fighterEffectiveMaxHp(f);
      f.max_hp = newMaxHp;
      f.hp = Math.max(hpFloor, Math.min(f.hp, newMaxHp));
      const scarDef = BATTLE_SCARS[scarKey];
      log(`${f.name} barely survived the deep chambers — a battle scar takes hold: ${scarDef.icon} ${scarDef.name}. ${scarDef.desc}`, 'ev');
      toast(`${f.name} earned a battle scar: ${scarDef.name}`, '');
    }
    if (f.hp < f.max_hp * 0.6 && f.max_hp > 0) {
      f.status = 'recovering';
      const healMult = (f.scar && BATTLE_SCARS[f.scar] && BATTLE_SCARS[f.scar].heal_mult) ? BATTLE_SCARS[f.scar].heal_mult : 1;
      f.recover_ticks = Math.ceil((f.max_hp - f.hp) * 12 * healMult);
    } else { f.status = 'idle'; f.recover_ticks = 0; }
  });

  const gained = [];
  if (outcome !== 'loss') {
    const totalW = stage.rewards.reduce((s, r) => s + r.w, 0);
    let rnd = Math.random() * totalW;
    const reward = stage.rewards.find(r => { rnd -= r.w; return rnd <= 0; }) || stage.rewards[stage.rewards.length - 1];
    const lootMult = (outcome === 'partial' ? 0.55 : 1) * (1 + legacyRank('predator_lore') * 0.15) * (squad.some(f => f.trait === 'fortunate') ? 1.35 : 1) * warProjectLootZoneMult(getScoutZone(stage.zone_id) || { enemy_type: stage.zone_enemy }) * tactic.loot_mult * squad.reduce((m, f) => m * (f.scar && BATTLE_SCARS[f.scar] && BATTLE_SCARS[f.scar].loot_mult ? BATTLE_SCARS[f.scar].loot_mult : 1), 1);
    for (const [res, amt] of Object.entries(reward.loot)) {
      const r = RES[res]; if (!r) continue;
      const added = Math.min(Math.ceil(amt * lootMult), (maxRes(res) || 99) - (G.res[res] || 0));
      if (added > 0) { G.res[res] = (G.res[res] || 0) + added; G.vis[res] = true; gained.push(`${r.icon}+${added}`); }
    }
    const stageBaseZone = getScoutZone(stage.zone_id) || { enemy_type: stage.zone_enemy, tier: Math.max(1, Math.round((stage.power || 1) / 14)) };
    const spoilDrops = rollFighterSpoils(stageBaseZone, squad, outcome, { stage:true });
    const spoilGained = applyFighterSpoils(spoilDrops);
    if (spoilGained.length) {
      gained.push(...spoilGained);
      if (!hasSeenPopup('fighter_spoils')) showFeatureAnnounce('fighter_spoils');
      else if (!hasSeenPopup('war_projects')) showFeatureAnnounce('war_projects');
    }
    if (stage.boss) G.stats.boss_stages = (G.stats.boss_stages || 0) + 1;
    const lootStr = gained.join(' ');
    const label = outcome === 'partial' ? 'Partial stage' : '★ Stage cleared';
    log(`${label}: pushed deeper into ${stage.zone_name} with ${tactic.name}. ${reward.msg} ${lootStr}`, 'ev');
    toast(`Stage ${outcome === 'win' ? 'cleared' : 'partial'}: ${lootStr || 'returned'}`, '');
    if (!G.mission_hist) G.mission_hist = [];
    G.mission_hist.unshift({ zone: `${stage.zone_name} (★ Stage) · ${tactic.name}`, outcome, loot: gained.slice(0, 4).join(' ') || 'Nothing', tick: G.time.tick });
    if (G.mission_hist.length > 5) G.mission_hist.pop();
  } else {
    log(`Stage failed: the squad was repelled from the deeper chambers of ${stage.zone_name} after a ${tactic.name.toLowerCase()} attempt.`, 'bad');
    toast(`Stage failed at ${stage.zone_name}. Fighters need recovery.`, 'bad');
  }

  G.stats.scouts = (G.stats.scouts || 0) + 1;
  G.scout_stage = null;
  renderTab();
}

function tickFighters(dt) {
  if (!G.fighters) return;
  const healRate = (G.bldgs.healing_hollow || 0) * (BLDGS.healing_hollow.effects.heal_rate || 1)
    * (capstoneOwned('apex_legacy') ? 1.3 : 1) * broodHealMult() * rareHealMult() * warProjectRecoveryMult();

  // Tick scouting progress
  for (const f of G.fighters) {
    if (f.status === 'scouting') {
      f.scout_elapsed = (f.scout_elapsed || 0) + dt;
      if (f.scout_elapsed >= f.scout_duration) {
        // Mark done, resolve if all squad members ready
        f._scout_done = true;
      }
    }
  }
  // Resolve completed missions (group by zone)
  const doneZones = new Set(
    G.fighters.filter(f => f._scout_done && f.zone).map(f => f.zone)
  );
  doneZones.forEach(zoneId => {
    const squad = G.fighters.filter(f => f.zone === zoneId && f._scout_done);
    if (squad.every(f => f._scout_done)) {
      squad.forEach(f => { delete f._scout_done; });
      // Stage missions resolve differently
      if (zoneId && zoneId.endsWith('_stage')) resolveStage(zoneId);
      else resolveScout(zoneId);
    }
  });

  // Tick recovery
  if (healRate > 0) {
    for (const f of G.fighters) {
      if (f.status === 'recovering' && f.max_hp > 0) {
        f.hp = Math.min(f.max_hp, (f.hp || 0) + healRate * dt);
        if (f.hp >= f.max_hp) {
          f.hp = f.max_hp;
          f.status = 'idle';
          f.recover_ticks = 0;
          log(`${f.name} has fully recovered.`);
          toast(`${f.name} recovered!`);
        }
      }
    }
  }
}



function renderScoutTacticPanel(selectedFighters = [], opts = {}) {
  const active = activeScoutTactic();
  const compact = !!opts.compact;
  const squadPower = (selectedFighters || []).reduce((sum, fighter) => sum + fighterPower(fighter), 0);
  const selectedCount = (selectedFighters || []).length;
  return `<div class="scout-tactic-panel" style="${compact ? 'margin-top:8px;margin-bottom:0;' : ''}">
    <div class="scout-tactic-title">SQUAD ORDERS</div>
    <div class="scout-tactic-copy">Orders apply to the next scout dispatch${selectedCount ? ` for ${selectedCount} selected fighter${selectedCount > 1 ? 's' : ''}` : ''}. Pick the posture that matches the zone instead of leaving one on forever.${selectedCount ? ` Current squad power: <span class="keyline">${squadPower}</span>.` : ''}</div>
    <div class="scout-tactic-grid">
      ${Object.values(SCOUT_TACTICS).map(tactic => `<button class="scout-tactic-btn ${active.id === tactic.id ? 'active' : ''}" onclick="setScoutTactic('${tactic.id}')">
        <div class="scout-tactic-head">
          <div class="scout-tactic-name">${tactic.icon} ${tactic.name}</div>
          <div class="scout-tactic-tag">${tactic.tag}</div>
        </div>
        <div class="scout-tactic-desc">${tactic.desc}</div>
        <div class="scout-tactic-effects">${tactic.ui_effects.map(effect => `<span class="scout-tactic-chip">${effect.icon} <strong>${effect.value}</strong></span>`).join('')}</div>
      </button>`).join('')}
    </div>
    <div class="scout-tactic-note">Current order: <span class="keyline">${active.icon} ${active.name}</span> · ${scoutTacticSummary(active)}.</div>
  </div>`;
}

function renderScoutZoneCard(zone, selected) {
  const isActive = (G.fighters || []).some(f => f.status === 'scouting' && (f.zone === zone.id || (f._is_stage && f.zone && f.zone.startsWith(zone.id + '_stage'))));
  const isStageActive = (G.fighters || []).some(f => f._is_stage && f.zone && f.zone.startsWith(zone.id + '_stage'));
  const unlocked = !zone.req || !!G.techs[zone.req];
  const enoughSelected = selected.length >= zone.fighters;
  const canSend = unlocked && !isActive && enoughSelected && canSendScout(zone);
  const alreadyCleared = zone.boss && (G.stats.boss_stages || 0) > 0 && zone.id !== 'the_apex';
  const activeTactic = activeScoutTactic();

  let cls = 'zone-card';
  if (!unlocked) cls += ' locked';
  else if (isActive) cls += ' active';
  else if (canSend) cls += ' can';
  if (zone.boss) cls += alreadyCleared ? ' boss boss-cleared' : ' boss';

  const scoutingSquad = (G.fighters || []).filter(f => f.status === 'scouting' && f.zone === zone.id);
  const stageSquad = (G.fighters || []).filter(f => f._is_stage && f.zone && f.zone.startsWith(zone.id + '_stage'));
  const activeSquad = stageSquad.length ? stageSquad : scoutingSquad;
  const pct = activeSquad.length > 0 ? Math.min(100, ((activeSquad[0].scout_elapsed || 0) / activeSquad[0].scout_duration) * 100) : 0;
  const timeLeft = activeSquad.length > 0 ? Math.max(0, activeSquad[0].scout_duration - (activeSquad[0].scout_elapsed || 0)) : zone.duration;

  const stageBadge = zone.stageable ? `<span class="boss-badge" style="background:rgba(255,139,137,0.13);border-color:rgba(255,139,137,0.32);color:var(--red)">★ STAGE</span>` : '';
  const bossBadge = zone.boss ? `<span class="boss-badge${alreadyCleared ? ' cleared' : ''}">BOSS</span>` : '';
  let html = `<div class="${cls}" onclick="${canSend ? `sendScout('${zone.id}')` : ''}">`;
  html += `<div class="zone-head">
    <div class="zone-ico">${zone.icon}</div>
    <div class="zone-title">${zoneDisplayName(zone)}${bossBadge}${stageBadge}</div>
    <div class="zone-tier">TIER ${zone.tier}</div>
  </div>`;
  html += `<div class="zone-desc">${zoneDescText(zone)}</div>`;
  html += enemyTypeBadge(zone);
  if (zone.stageable) {
    html += `<div style="font-size:10px;color:var(--red);font-family:var(--mono);margin-top:5px;opacity:0.85;">★ ${zone.stage_desc}</div>`;
  }
  const spoilPreview = fighterSpoilPreview(zone);
  if (spoilPreview) {
    html += `<div style="font-size:9px;color:var(--amber);font-family:var(--mono);margin-top:5px;line-height:1.45;">War spoils: ${spoilPreview}${zone.stageable ? ' · deeper chambers improve the drop' : ''}</div>`;
  }
  html += `<div class="zone-meta" style="margin-top:5px;">`;
  html += `<span>⚔ ${zone.fighters} fighter${zone.fighters>1?'s':''} min</span>`;
  html += `<span>⏱ ${fmtExpTime(zone.duration)}</span>`;
  html += `<span class="zone-power">⚡ Power: ${zone.power}</span>`;
  if (!unlocked) html += `<span class="zone-req">Requires: ${TECHS[zone.req]?.name || zone.req}</span>`;
  if (isStageActive) html += `<span style="color:var(--red)">★ STAGE IN PROGRESS · ${fmtExpTime(timeLeft)}</span>`;
  else if (isActive) html += `<span style="color:var(--sky)">◉ In progress · ${fmtExpTime(timeLeft)}</span>`;
  html += `</div>`;
  if (isActive || isStageActive) {
    const barColor = isStageActive ? 'var(--red)' : 'var(--sky)';
    html += `<div class="exp-progress" style="margin-top:6px;"><div class="exp-progress-fill" style="width:${pct}%;background:${barColor}"></div></div>`;
  }
  if (unlocked && !isActive && enoughSelected) {
    html += `<div style="font-size:9px;color:${canSend ? 'var(--sky)' : 'var(--text-lo)'};font-family:var(--mono);margin-top:4px;">Order: ${activeTactic.icon} ${activeTactic.name} · ${scoutTacticSummary(activeTactic)}</div>`;
  }
  if (unlocked && !isActive && selected.length > 0 && !enoughSelected) {
    html += `<div style="font-size:9px;color:var(--text-lo);font-family:var(--mono);margin-top:4px;">Need ${zone.fighters} fighters · ${selected.length} selected</div>`;
  } else if (canSend) {
    html += `<div style="font-size:9px;color:var(--accent);font-family:var(--mono);margin-top:4px;">Tap to dispatch ${selected.length} fighter${selected.length>1?'s':''}</div>`;
  }
  html += `</div>`;
  return html;
}

function tabScouting() {
  if (!G.techs.combat_training) {
    return `<div class="empty-hint">Research <b style="color:var(--text-hi)">Combat Training</b> to unlock Dangerous Territory scouting.<br><br>Train fighters, send them into hostile zones, and earn Royal Jelly — the only resource that can rush-heal your injured squad.</div>`;
  }

  let html = '';
  const rj = Math.floor(G.res.royal_jelly || 0);
  const activeTactic = activeScoutTactic();
  html += `<div class="guide-panel" style="margin-bottom:10px;">
    <div class="guide-title">DANGEROUS TERRITORY</div>
    <div class="guide-copy">Recruit idle colony bugs as fighters. Assign them to zones — they resolve combat automatically on return. Higher-level fighters tackle tougher zones. Injured fighters recover at the Healing Hollow — rush the process with Royal Jelly.</div>
    <div class="guide-copy">Before every dispatch, set a <span class="keyline">Squad Order</span>. <span class="keyline">Shield Ring</span> is safest, <span class="keyline">Pincer Rush</span> is strongest, and <span class="keyline">Cache Sweep</span> is the greedy farming order. Orders apply to the next mission you launch, not to the whole run.</div>
    <div class="guide-copy">Victories can now recover <span class="keyline">War Spoils</span> that base farming can never produce. Each enemy family carries its own material, and those spoils can now be forged into <span class="keyline">War Projects</span> for stronger squads, faster recovery, and stranger frontier follow-ups.</div>
    <div class="guide-copy">Successful missions can surface <span class="keyline">scouting encounters</span> (2–3 choices shaped by your brood lines) and, on certain zones, a <span class="keyline">push deeper</span> stage with higher risk and much richer loot. New encounter types: <span class="keyline">Ambush</span> rewards Soldiers, <span class="keyline">Sealed Chamber</span> rewards Scholars.</div>
    <div class="guide-copy">Named rival colonies now persist across raids, outpost fights, and rival scouting zones. Repel them often enough and they start coming back with a grudge.</div>
    <div class="soft-note">⬥ Royal Jelly on hand: ${rj}. Active order: ${activeTactic.icon} ${activeTactic.name}. Zones marked ★ STAGE can be pushed deeper after a win.</div>
  </div>`;

  html += fighterSpoilPanelHTML();
  html += warProjectsPanelHTML();

  const stage = G.scout_stage;
  if (stage && !stage.accepted) {
    const ticksLeft = Math.max(0, stage.offer_until - G.time.tick);
    const secsLeft = Math.ceil(ticksLeft * (TICK_MS / 1000));
    const pct = Math.min(100, (ticksLeft / 450) * 100);
    const selected = (_scoutSelection || []).filter(fid => (G.fighters || []).find(f => f.id === fid && f.status === 'idle'));
    const canPush = selected.length >= stage.fighters_needed;
    const exampleReward = stage.rewards[0] ? Object.entries(stage.rewards[0].loot).slice(0, 3).map(([r, a]) => `${(RES[r] || {}).icon || ''}${a} ${(RES[r] || {}).name || r}`).join(' · ') : '';
    const stageSourceZone = getScoutZone(stage.zone_id);
    const stageSpoils = fighterSpoilPreview(stageSourceZone);
    html += `<div class="stage-offer-panel">
      <div class="stage-offer-title">★ PUSH DEEPER — ${stage.zone_name.toUpperCase()}</div>
      <div class="stage-offer-desc">${stage.stage_desc}</div>
      <div class="stage-offer-rewards">Zone power: <span style="color:var(--red)">${stage.power}</span> · Duration: ${fmtExpTime(stage.duration)} · Example loot: ${exampleReward}${stageSpoils ? ` · War spoils: ${stageSpoils}` : ''}</div>
      <div style="font-size:9px;color:var(--sky);font-family:var(--mono);margin-bottom:6px;">If launched now: ${activeTactic.icon} ${activeTactic.name} · ${scoutTacticSummary(activeTactic)}</div>
      <div class="stage-offer-timer"><div class="stage-offer-timer-fill" style="width:${pct}%"></div></div>
      <div style="font-family:var(--mono);font-size:9px;color:var(--text-lo);margin-bottom:8px;">${secsLeft}s remaining · Requires ${stage.fighters_needed} idle fighter${stage.fighters_needed > 1 ? 's' : ''} selected</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="stage-push-btn" onclick="pushDeeper()" ${canPush ? '' : 'disabled'}>${canPush ? '▶ PUSH DEEPER' : `SELECT ${stage.fighters_needed} FIGHTER${stage.fighters_needed > 1 ? 'S' : ''} FIRST`}</button>
        <button class="stage-decline-btn" onclick="declineStage()">DECLINE</button>
      </div>
    </div>`;
  }

  html += rivalIntelPanelHTML();
  html += frontierReactionPanelHTML('scouting');

  const hist = (G.mission_hist || []).slice(0, 4);
  if (hist.length > 0) {
    html += `<div class="mission-hist-panel">
      <div class="mission-hist-title">RECENT MISSIONS</div>`;
    for (const m of hist) {
      const outCls = m.outcome === 'win' ? 'win' : m.outcome === 'partial' ? 'partial' : 'loss';
      const outLabel = m.outcome === 'win' ? 'VICTORY' : m.outcome === 'partial' ? 'PARTIAL' : 'DEFEAT';
      html += `<div class="mission-hist-row">
        <div class="mission-hist-outcome ${outCls}">${outLabel}</div>
        <div style="font-size:10px;color:var(--text);min-width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${m.zone}</div>
        <div class="mission-hist-loot">${m.loot || '—'}</div>
      </div>`;
    }
    html += `</div>`;
  }

  html += `<div class="sh">YOUR FIGHTERS</div>`;
  const canRecruit = idle() > 0 && fightersTotal() < maxFighters() && (G.bldgs.training_burrow || 0) > 0;
  const noHollow = (G.bldgs.healing_hollow || 0) === 0;

  if ((G.fighters || []).length === 0) {
    html += `<div class="empty-hint" style="padding:15px">No fighters recruited yet.<br>Build a Training Burrow, then recruit idle bugs below.</div>`;
  }

  for (const f of (G.fighters || [])) {
    const hpPct = f.max_hp > 0 ? Math.round((f.hp / f.max_hp) * 100) : 0;
    const hpColor = hpPct > 65 ? 'var(--accent)' : hpPct > 30 ? 'var(--amber)' : 'var(--red)';
    const isSelected = _scoutSelection.includes(f.id);
    const isStageActive = f._is_stage;
    const zoneName = isStageActive
      ? `★ STAGE: ${(TERRITORY_ZONES.find(z => f.zone && f.zone.startsWith(z.id + '_stage')) || {}).name || 'Deeper'}`
      : getScoutZone(f.zone)?.name || '';
    const statusLabel = f.status === 'scouting' ? `◉ SCOUTING ${zoneName}` :
                        f.status === 'escorting' ? `⬢ ESCORTING ${(G.expeditions || []).find(exp => exp.targetKey === f.expedition_key)?.label || 'Expedition'}` :
                        f.status === 'recovering' ? '✺ RECOVERING' : '◈ READY';
    const statusColor = f.status === 'scouting' ? 'var(--sky)' : f.status === 'escorting' ? 'var(--purple)' : f.status === 'recovering' ? 'var(--amber)' : 'var(--accent)';
    const xpPct = f.xp_next > 0 ? Math.round((f.xp / f.xp_next) * 100) : 100;
    const powerVal = fighterPower(f);
    const heroTrait = f.hero && f.trait && HERO_TRAITS[f.trait] ? HERO_TRAITS[f.trait] : null;
    let card = `<div class="fighter-card ${f.status}${isSelected && f.status === 'idle' ? ' ready' : ''}${f.hero ? ' hero-glow' : ''}" style="${isSelected && f.status==='idle' ? 'border-color:var(--accent);background:var(--accent-dd);' : ''}${f.hero ? 'border-color:' + (heroTrait ? heroTrait.color : '#ffc562') + '33;' : ''}">`;
    card += `<div class="fighter-ico">${f.hero ? (heroTrait ? heroTrait.icon : '★') : (f.status === 'scouting' ? '⊸' : f.status === 'escorting' ? '⬢' : f.status === 'recovering' ? '✺' : '⚔')}</div>`;
    card += `<div class="fighter-info">`;
    const heroNameLine = f.hero && f.epithet ? `<span style="color:${heroTrait ? heroTrait.color : '#ffc562'};font-family:var(--mono);font-size:9px;font-weight:700;margin-left:4px;">${f.epithet}</span>` : '';
    card += `<div class="fighter-name">${f.name}${heroNameLine} <span style="font-family:var(--mono);font-size:9px;color:var(--text-lo)">Lv.${f.level}</span></div>`;
    if (heroTrait) {
      card += `<div style="font-family:var(--mono);font-size:8px;color:${heroTrait.color};letter-spacing:0.8px;margin-bottom:2px;">${heroTrait.icon} ${heroTrait.name.toUpperCase()} HERO · ${heroTrait.desc}</div>`;
    }
    const scarDef = !f.hero && f.scar ? BATTLE_SCARS[f.scar] : null;
    if (scarDef) {
      card += `<div style="font-family:var(--mono);font-size:8px;color:${scarDef.color};letter-spacing:0.8px;margin-bottom:2px;opacity:0.85;">${scarDef.icon} SCAR: ${scarDef.name.toUpperCase()} · ${scarDef.desc}</div>`;
    }
    card += `<div class="fighter-meta"><span style="color:${statusColor}">${statusLabel}</span> · Power ${powerVal} · ${f.missions||0} missions${(f.near_deaths||0) > 0 ? ` · <span style="color:var(--red)">${f.near_deaths} near-death${f.near_deaths>1?'s':''}</span>` : ''}</div>`;
    card += `<div class="fighter-hp"><span style="color:${hpColor}">HP ${Math.floor(f.hp)}/${f.max_hp}</span> · XP ${f.xp}/${f.xp_next}</div>`;
    card += `<div class="hp-bar"><div class="hp-fill" style="width:${hpPct}%;background:${hpColor}"></div></div>`;
    card += `<div class="hp-bar" style="margin-top:2px;"><div class="hp-fill" style="width:${xpPct}%;background:var(--purple)"></div></div>`;
    card += `</div>`;
    card += `<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;">`;
    if (f.status === 'idle') {
      const selLabel = isSelected ? 'DESELECT' : 'SELECT';
      card += `<button class="recruit-btn" onclick="toggleFighterSelect('${f.id}')" style="${isSelected ? 'background:var(--accent-d);color:var(--text-hi);' : ''}">${selLabel}</button>`;
      card += `<button class="retire-btn" onclick="retireFighter('${f.id}')">RETIRE</button>`;
    }
    if (f.status === 'recovering') {
      const jellyCost = f.max_hp > 0 ? Math.max(1, Math.ceil((f.max_hp - f.hp) / 5) - warProjectRushDiscount()) : 1;
      const canRush = (G.res.royal_jelly || 0) >= jellyCost && (G.bldgs.healing_hollow || 0) > 0;
      card += `<button class="rj-rush-btn" onclick="rushHealFighter('${f.id}')" ${canRush ? '' : 'disabled'}>⬥${jellyCost} RUSH</button>`;
      if (noHollow) card += `<div style="font-size:9px;color:var(--red);margin-top:2px;font-family:var(--mono);">NO HOLLOW</div>`;
    }
    card += `</div>`;
    card += `</div>`;
    html += card;
  }

  const burrowCount = G.bldgs.training_burrow || 0;
  const slotsLabel = burrowCount > 0 ? `${fightersTotal()}/${maxFighters()} slots used` : 'Build a Training Burrow to unlock slots';
  html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;margin-top:4px;">
    <span style="font-family:var(--mono);font-size:9px;color:var(--text-lo)">${slotsLabel}</span>
    <button class="recruit-btn" onclick="recruitFighter()" ${canRecruit ? '' : 'disabled'}>+ RECRUIT</button>
  </div>`;

  const selected = (_scoutSelection || []).filter(fid => (G.fighters || []).find(f => f.id === fid && f.status === 'idle'));
  const selectedFighters = selected.map(fid => G.fighters.find(f => f.id === fid)).filter(Boolean);
  if (selected.length > 0) {
    const squadPower = selectedFighters.reduce((s, f) => s + fighterPower(f), 0);
    html += `<div class="guide-panel" style="margin-bottom:10px;border-color:var(--accent-d);">
      <div class="guide-title" style="color:var(--accent)">DISPATCH READY — ${selected.length} fighter${selected.length>1?'s':''} selected · Squad Power: ${squadPower}</div>
      <div class="guide-copy">Choose a zone below to send your squad. Orders are locked in at launch, so this is the right moment to decide whether you want safe, aggressive, or greedy scouting.</div>
      <div class="soft-note">Selected order: ${activeTactic.icon} ${activeTactic.name} · ${scoutTacticSummary(activeTactic)}</div>
      <button class="retire-btn" onclick="clearScoutSelection();renderTab();" style="margin-top:6px;">CLEAR SELECTION</button>
    </div>`;
  }

  html += renderScoutTacticPanel(selectedFighters, { compact: selected.length > 0 });

  html += `<div class="sh">DANGEROUS TERRITORY</div>`;
  const expeditionZones = expeditionContactZones();
  if (expeditionZones.length) {
    html += `<div class="tier-zone-label">── EXPEDITION DISTRESS CALLS ──</div>`;
    html += `<div class="notice-panel" style="margin-bottom:8px;">Your survey teams have made hostile contact on the frontier. Clear these temporary zones to let the expedition phase resume.</div>`;
    for (const zone of expeditionZones) html += renderScoutZoneCard(zone, selected);
  }
  const rivalBases = rivalBaseZones();
  if (rivalBases.length) {
    html += `<div class="tier-zone-label">── RIVAL FORWARD NESTS ──</div>`;
    html += `<div class="notice-panel" style="margin-bottom:8px;border-color:rgba(255,139,137,0.30);background:linear-gradient(180deg, rgba(70,18,18,0.22), rgba(16,32,27,0.92));">Known rival nests now appear here once surveyed territory exposes them. Clear them to turn those routes into captured forward nests on the Map.</div>`;
    for (const zone of rivalBases) html += renderScoutZoneCard(zone, selected);
  }
  const tiers = [
    { label:'── PREDATOR BURROWS ──────────', range:[1,3] },
    { label:'── RIVAL & FUNGAL ────────────', range:[4,6] },
    { label:'── ANCIENT CHAMBERS ──────────', range:[7,8] },
    { label:'── SUMMIT THREATS ────────────', range:[9,9] },
  ];
  for (const tier of tiers) {
    const tieredZones = TERRITORY_ZONES.filter(z => z.tier >= tier.range[0] && z.tier <= tier.range[1]);
    if (!tieredZones.length) continue;
    html += `<div class="tier-zone-label">${tier.label}</div>`;
    for (const zone of tieredZones) html += renderScoutZoneCard(zone, selected);
  }

  if (!G.fighters || G.fighters.length === 0) {
    html += `<div class="notice-panel" style="margin-top:10px;">Recruit a fighter to begin scouting. Tap SELECT on an idle fighter, choose a squad order, then tap a zone to dispatch.</div>`;
  }

  return html;
}

/* ── JUICE HELPERS ───────────────────────────────── */

function spawnGatherPop(text, colorClass, anchorEl) {
  const pop = document.createElement('div');
  pop.className = 'gather-pop' + (colorClass ? ' ' + colorClass : '');
  pop.textContent = text;
  const rect = anchorEl ? anchorEl.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight - 80, width: 0 };
  pop.style.left = (rect.left + rect.width / 2 - 20 + (Math.random() - 0.5) * 30) + 'px';
  pop.style.top  = (rect.top - 4) + 'px';
  document.body.appendChild(pop);
  pop.addEventListener('animationend', () => pop.remove());
}

function juiceMilestoneBurst(x, y, color) {
  color = color || 'var(--accent)';
  for (let i = 0; i < 3; i++) {
    const ring = document.createElement('div');
    ring.className = 'milestone-burst';
    const size = 36 + i * 22;
    ring.style.cssText = `width:${size}px;height:${size}px;left:${x - size/2}px;top:${y - size/2}px;border-color:${color};animation-delay:${i * 0.08}s;`;
    document.body.appendChild(ring);
    ring.addEventListener('animationend', () => ring.remove());
  }
}

function juiceFlash(color, alpha) {
  const el = document.getElementById('juice-flash');
  if (!el) return;
  el.style.background = color || 'rgba(94,229,143,1)';
  el.style.transition = 'none';
  el.style.opacity = String(alpha || 0.07);
  requestAnimationFrame(() => {
    el.style.transition = 'opacity 0.5s ease';
    el.style.opacity = '0';
  });
}

function juiceGatherButton() {
  const btn = document.getElementById('gather-btn');
  if (!btn) return;
  btn.classList.remove('gather-punching');
  void btn.offsetWidth; // reflow
  btn.classList.add('gather-punching');
  btn.addEventListener('animationend', () => btn.classList.remove('gather-punching'), { once: true });
}

function juiceFlashResCard(res) {
  // Flash the resource card in the strip briefly
  const strip = document.getElementById('res-strip');
  if (!strip) return;
  const cards = strip.querySelectorAll('.rc');
  // Re-render strip and then mark the card — timing is tricky so just flash all via juiceFlash
  juiceFlash('rgba(94,229,143,1)', 0.04);
}

function juiceHatchBurst() {
  // Find hatch egg area and burst
  const content = document.getElementById('content');
  if (!content) return;
  juiceFlash('rgba(94,229,143,1)', 0.09);
  // Central screen burst
  juiceMilestoneBurst(window.innerWidth / 2, window.innerHeight * 0.65, 'var(--accent)');
}

function juiceAchievementBurst() {

function doGather() {
  ensureGatherState(G);
  if (!gatherBurstReady()) return;

  const season = seasonName();
  const mod = S_MOD[season].honeydew ?? 1;
  const burstMult = gatherBurstAmount();
  const sideMult = gatherSideRollMult();
  const honeyCapLeft = maxRes('honeydew') - G.res.honeydew;
  const gathered = Math.max(gatherBurstUnlocked() ? 1 : 0.5, gatherPower() * mod * burstMult);
  const added = Math.max(0, Math.min(honeyCapLeft, gathered));
  G.res.honeydew = Math.min(maxRes('honeydew'), G.res.honeydew + added);

  const vaultBonus = (G.bldgs.amber_vault || 0) * (buildingEffects('amber_vault').gather_bonus || 0);
  const amberRushBonus = G.events.active === 'amber_rush' ? 0.12 : 0;
  const leafChance = Math.min(0.88, ((capstoneOwned('amber_monolith') ? 0.30 : 0.18) + vaultBonus + amberRushBonus) * sideMult);
  const dirtChance = Math.min(0.82, ((capstoneOwned('amber_monolith') ? 0.22 : 0.12) + vaultBonus + amberRushBonus) * sideMult);
  const stashChance = Math.min(0.75, (0.08 + vaultBonus) * (gatherBurstUnlocked() ? 2 : 1));
  const skyChance = Math.min(0.6, (G.events.active === 'star_current' ? 0.16 : 0.08) * sideMult);

  let extraPops = [];
  if (Math.random() < leafChance) {
    G.vis.leaves = true;
    const leafGain = gatherBurstUnlocked() ? 2 : 1;
    G.res.leaves = Math.min(maxRes('leaves'), G.res.leaves + leafGain);
    extraPops.push({ text: '🍃+' + leafGain, cls: '' });
  }
  if (Math.random() < dirtChance) {
    G.vis.dirt = true;
    const dirtGain = gatherBurstUnlocked() ? 2 : 1;
    G.res.dirt = Math.min(maxRes('dirt'), G.res.dirt + dirtGain);
    extraPops.push({ text: '◈+' + dirtGain, cls: '' });
  }
  if ((capstoneOwned('amber_monolith') || (G.bldgs.amber_vault || 0) > 0) && Math.random() < stashChance) {
    const stash = Math.random() < 0.55 ? 'leaves' : 'dirt';
    const bonus = gatherBurstUnlocked()
      ? (G.events.active === 'amber_rush' ? 5 : 4)
      : (G.events.active === 'amber_rush' ? 3 : 2);
    G.vis[stash] = true;
    G.res[stash] = Math.min(maxRes(stash), G.res[stash] + bonus);
    extraPops.push({ text: (stash === 'leaves' ? '🍃' : '◈') + '+' + bonus, cls: 'amber' });
  }
  if (G.techs.sky_colonies && Math.random() < skyChance) {
    G.vis.aether = true;
    const aetherGot = (gatherBurstUnlocked() ? 2 : 1) + Math.floor((G.meta.launches || 0) / 2) + (G.events.active === 'star_current' ? 2 : 0);
    G.res.aether = Math.min(maxRes('aether'), G.res.aether + aetherGot);
    extraPops.push({ text: '☁+' + aetherGot, cls: 'sky' });
  }

  if (gatherBurstUnlocked()) {
    G.gather.cooldown = GATHER_BURST_CD;
  }

  // ── Juice ─────────────────────────────────────────
  const btn = document.getElementById('gather-btn');
  juiceGatherButton();
  const hdLabel = '+' + added.toFixed(1) + ' 🍯';
  spawnGatherPop(hdLabel, 'amber', btn);
  extraPops.forEach((p, i) => {
    setTimeout(() => spawnGatherPop(p.text, p.cls, btn), 60 + i * 55);
  });
  if (btn) {
    btn.style.boxShadow = '0 0 12px rgba(255,197,98,0.6), 0 0 0 1px rgba(255,197,98,0.3)';
    setTimeout(() => { btn.style.boxShadow = ''; }, 280);
  }
  renderTopBar();
}

function doBuild(bid) {
  const def = BLDGS[bid];
  if (!def || !G.unlocks.bldgs[bid]) return;
  if (def.max && G.bldgs[bid] >= def.max) {
    toast('Maximum reached!', 'warn');
    return;
  }
  const cost = bldgCost(bid);
  if (!canAfford(cost)) {
    toast('Not enough resources', 'warn');
    return;
  }
  for (const [r, a] of Object.entries(cost)) G.res[r] -= a;
  G.bldgs[bid]++;
  G.stats.built++;
  log(`Built: ${displayBuildingName(bid)} (${G.bldgs[bid]})`);
  toast(displayBuildingName(bid) + ' constructed');
  // Juice: build feedback
  juiceBuildBurst();
  const bldgBtn = document.querySelector(`[data-bid="${bid}"]`);
  spawnGatherPop('🏗 Built!', 'sky', bldgBtn || document.getElementById('content'));
  if (!G.challenge && G.stats.built >= 1) {
    G.challenge = generateChallenge(seasonName(), G.time.year);
    if (G.challenge) toast(`New challenge: ${G.challenge.desc}`);
  }
  // Prompt colony name on very first build
  if (G.stats.built === 1 && !G.colonyName) {
    setTimeout(() => promptColonyName(), 400);
  }
  if (bid === 'nest' && G.pop.total === 0) {
    G.hatch.progress = Math.max(G.hatch.progress, 0.65);
    log('The first nest warms a dormant clutch of eggs.');
    toast('Egg clutch warmed');
  }
  renderTab();
}

function doResearch(tid) {
  const def = TECHS[tid];
  if (!def || G.techs[tid]) return;
  if (!canAffordTech(tid)) {
    toast('Cannot research yet', 'warn');
    return;
  }
  for (const [r, a] of Object.entries(def.cost)) {
    if (Number.isFinite(G.res[r])) G.res[r] = Math.max(0, G.res[r] - a);
  }
  G.techs[tid] = true;
  G.stats.researched++;
  (def.unlocks_res || []).forEach(r => { G.vis[r] = true; });
  (def.unlocks_jobs || []).forEach(j => { G.unlocks.jobs[j] = true; });
  (def.unlocks_bldgs || []).forEach(b => { G.unlocks.bldgs[b] = true; });
  if (tid === 'trade_routes') refreshTradeNetwork(G, 'unlock', true);
  if (tid === 'combat_training') ensureRivalRoster(G, 2);
  const jobPopupCandidates = [...new Set([
    ...(def.unlocks_jobs || []),
    ...Object.keys(JOBS).filter(jid => JOBS[jid].requires_tech === tid)
  ])];
  const broodPopupCandidates = Object.values(BROOD_SPECIALISATIONS)
    .filter(spec => spec.unlock_tech === tid)
    .map(spec => spec.id);
  // Feature announce popups for systems with new mechanics and newly revealed jobs / brood lines
  let announced = false;
  if (tid === 'combat_training' || tid === 'outpost_network') {
    showFeatureAnnounce(tid);
    announced = true;
  }
  if (!announced) announced = maybeAnnounceBroodUnlock(broodPopupCandidates);
  if (!announced) maybeAnnounceJobUnlock(jobPopupCandidates);
  log(`Discovered: ${def.name}`);
  toast('Research: ' + def.name);
  awardQueenXp(8 + (def.tier || 1) * 4, 'research');
  // Juice: research flash
  juiceFlash('rgba(120,215,255,1)', 0.08);
  spawnGatherPop('◉ ' + def.name, 'sky', document.getElementById('content'));
  renderTab();
}

function assignJob(jid, delta) {
  if (delta > 0 && idle() <= 0) {
    toast('No idle bugs', 'warn');
    return;
  }
  if (delta < 0 && (G.jobs[jid] || 0) <= 0) return;
  G.jobs[jid] = Math.max(0, (G.jobs[jid] || 0) + delta);
  renderTab();
  renderTopBar();
}

function doCraft(cid) {
  const craft = CRAFTS.find(c => c.id === cid);
  if (!craft || !G.techs[craft.req] || !lineageStageUnlocked(craft)) return;
  const disc = craftDisc();
  const inCost = {};
  for (const [r, a] of Object.entries(craft.input)) inCost[r] = Math.max(1, Math.floor(a * disc));
  if (!canAfford(inCost)) {
    toast('Not enough resources', 'warn');
    return;
  }
  for (const [r, a] of Object.entries(inCost)) G.res[r] -= a;
  for (const [r, a] of Object.entries(craft.output)) {
    G.res[r] = Math.min(maxRes(r), (G.res[r] || 0) + a);
    G.vis[r] = true;
  }
  const notes = applySpecialRewards(craft.special);
  G.stats.crafted++;
  log(`Crafted: ${craft.name}${notes.length ? ' · ' + notes.join(', ') : ''}`);
  toast(notes.length ? `Crafted: ${craft.name} · ${notes[0]}` : 'Crafted: ' + craft.name);
}

function doTrade(tid) {
  const tr = TRADES.find(t => t.id === tid);
  if (!tr || !G.techs[tr.req] || !lineageStageUnlocked(tr)) return;
  ensureTradeState(G);
  maybeRefreshTradeNetworkForCurrentSeason(G);
  if (!canAfford(tr.sell)) {
    toast('Not enough resources', 'warn');
    return;
  }
  const mult = effectiveTradeMult(tr.id, G);
  for (const [r, a] of Object.entries(tr.sell)) G.res[r] -= a;
  for (const [r, a] of Object.entries(tr.buy)) {
    const got = Math.max(1, Math.floor(a * mult));
    G.res[r] = Math.min(maxRes(r), (G.res[r] || 0) + got);
    G.vis[r] = true;
  }
  const notes = [];
  const repGain = activeCaravanForTrade(tr.id, G) ? 2 : 1;
  const repUpdate = applyTradeReputation(tr.id, repGain, G);
  if (repGain > 1) notes.push(`+${repGain} rep`);
  const giftChance = tradeGiftChance(tr.id, G);
  if (giftChance > 0 && Math.random() < giftChance) {
    const firstBuy = Object.entries(tr.buy || {})[0] || null;
    if (firstBuy) {
      const giftRes = firstBuy[0];
      const bonus = Math.min(2, Math.max(1, Math.floor(firstBuy[1] * 0.15)));
      const added = Math.min(bonus, maxRes(giftRes) - (G.res[giftRes] || 0));
      if (added > 0) {
        G.res[giftRes] += added;
        G.vis[giftRes] = true;
        notes.push(`${RES[giftRes].icon}+${added} gift`);
      }
    }
  }
  notes.push(...applySpecialRewards(tr.special));
  notes.push(...advanceTradeContracts(tr.id, G));
  G.stats.traded++;
  log(`Trade completed: ${tr.name}${notes.length ? ' · ' + notes.join(', ') : ''}`);
  if (repUpdate.tierUp) notes.unshift(repUpdate.info.name);
  const toastNote = notes.length ? ` · ${notes.slice(0, 2).join(' · ')}` : '';
  toast(`Trade: ${tr.name}${toastNote}`);
}


function buyLegacy(id) {
  const node = LEGACY_TREE[id];
  if (!node) return;
  const activeCapstone = ownedCapstoneId();
  if (node.capstone && activeCapstone && activeCapstone !== id) {
    toast('Another capstone already defines this lineage', 'warn');
    return;
  }
  if (!legacyUnlocked(id)) {
    toast(node.capstone ? 'Finish the branch and keep capstones exclusive' : 'Legacy branch locked', 'warn');
    return;
  }
  const cost = legacyCost(id);
  if (cost === null) {
    toast('Legacy node mastered', 'warn');
    return;
  }
  if ((G.meta.nectar || 0) < cost) {
    toast('Not enough Royal Nectar', 'warn');
    return;
  }
  G.meta.nectar -= cost;
  G.meta.legacy[id] = legacyRank(id) + 1;
  syncLineageUnlocks(G, true);
  log(`Legacy unlocked: ${node.name} ${G.meta.legacy[id]}/${legacyMaxRank(id)}`);
  toast(`Legacy: ${node.name}`);
  renderAll();
}

function calcLaunchReward() {
  if (!G.techs.sky_colonies) return 0;
  const score =
    (G.res.elytra || 0) +
    ((G.res.skyglass || 0) * 2.5) +
    ((G.res.aether || 0) / 8) +
    ((G.stats.total_hd || 0) / 420) +
    ((G.meta.launches || 0) * 3);
  const capstoneMult = capstoneOwned('celestial_throne') ? 1.25 : 1;
  const milestoneMult = 1 + milestoneLaunchBonus();
  const researchMult = 1 + celestialResearchLaunchBonus();
  const projectMult = 1 + projectLaunchBonusMult();
  const flatBonus = projectLaunchFlatBonus();
  return Math.max(1, Math.floor((score / 10) * capstoneMult * milestoneMult * researchMult * projectMult) + flatBonus);
}


function endingTitleFor(def) {
  if (!def) return 'Unfinished Skies';
  if (def.id === 'sovereign_brood') return 'The Sovereign Brood Ascends';
  if (def.id === 'amber_citadel') return 'The Amber Citadel Endures';
  if (def.id === 'astral_ark') return 'The Astral Ark Takes Flight';
  return def.title;
}

function endingBodyFor(state, def, reward) {
  const population = state.pop.total || 0;
  const launches = (state.meta && state.meta.launches) || 0;
  const trades = (state.stats && state.stats.traded) || 0;
  const stock = Math.floor(totalResourceStock(state));
  const nurses = (state.jobs && state.jobs.nurse) || 0;
  const excavators = (state.jobs && state.jobs.excavator) || 0;
  const navigators = (state.jobs && state.jobs.navigator) || 0;
  const aether = Math.floor((state.res && state.res.aether) || 0);
  const skyglass = Math.floor((state.res && state.res.skyglass) || 0);

  if (!def) {
    return `Your colony launched before any grand lineage project was completed. Even so, the swarm has learned enough to seed a stronger next run. The sky remembers unfinished ambition, and ${reward} Royal Nectar now waits to be spent on a more deliberate legacy.`;
  }
  if (def.id === 'sovereign_brood') {
    const broodTone = population >= 60 ? 'a thunderous imperial swarm' : population >= 45 ? 'a disciplined royal brood' : 'a rising brood-kingdom';
    return `The colony leaves the garden as ${broodTone}. ${population} bugs answered the final brood call, and ${nurses} Nurses kept the hatch cycle hot until the sky itself felt crowded. What began as a hungry cluster becomes a living crown, carrying ${reward} Royal Nectar into the next generation.`;
  }
  if (def.id === 'amber_citadel') {
    const marketTone = trades >= 18 ? 'merchant-roads of amber and resin' : 'fault lines packed with deliberate order';
    return `The colony does not merely depart. It seals the earth behind it, turning stockpiles into a monument of permanence. ${stock} total stored resources and ${excavators} Excavators forged ${marketTone}, until the Amber Citadel could bankroll a future colony outright. The launch leaves behind a treasury and carries ${reward} Royal Nectar forward.`;
  }
  if (def.id === 'astral_ark') {
    const skyTone = aether >= 70 || skyglass >= 30 ? 'a luminous star-fleet cradle' : 'a patient ark of wind and light';
    return `The colony rises as ${skyTone}. ${navigators} Navigators charted the upper currents while ${aether} Aether and ${skyglass} Skyglass were bent into a route no garden-born swarm could have imagined. This launch feels less like escape and more like succession: a throne translated into orbit, with ${reward} Royal Nectar carried into the next ascent.`;
  }
  return `${def.title} is complete, and the colony launches with ${reward} Royal Nectar to shape the next run.`;
}

function endingSummaryLine(def) {
  if (!def) return 'No lineage project was completed during this run.';
  return def.reward || `${def.title} carries its payoff into the next launch.`;
}

function buildLaunchEnding(state, reward) {
  const def = activeLineageProject(state);
  const projectComplete = !!(def && projectDone(def.id, state));
  const activeDef = projectComplete ? def : null;
  const capstone = ownedCapstoneId((state.meta || {}).legacy ? state.meta : G.meta);
  return {
    id: `ending_${Date.now()}`,
    title: endingTitleFor(activeDef),
    capstone: capstone || 'none',
    project_id: activeDef ? activeDef.id : null,
    project_title: activeDef ? activeDef.title : 'Unfinished Skies',
    launches: ((state.meta && state.meta.launches) || 0) + 1,
    nectar_gained: reward,
    year: state.time ? state.time.year : 1,
    population: state.pop ? (state.pop.total || 0) : 0,
    total_stock: Math.floor(totalResourceStock(state)),
    trades: state.stats ? (state.stats.traded || 0) : 0,
    aether: Math.floor((state.res && state.res.aether) || 0),
    skyglass: Math.floor((state.res && state.res.skyglass) || 0),
    body: endingBodyFor(state, activeDef, reward),
    summary: endingSummaryLine(activeDef),
    next_hint: activeDef
      ? `Your ${activeDef.title} chronicle has been added to the Legacy tab. Royal Nectar, purchased Legacy upgrades, and your launch history remain; current-run resources, buildings, jobs, and map progress reset for the next run.`
      : 'You launched without a finished lineage project. Royal Nectar, purchased Legacy upgrades, and your launch history remain; current-run resources, buildings, jobs, and map progress reset for the next run.'
  };
}

function jobPopupId(jid) {

}

function maybeAnnounceJobUnlock(jobIds) {
  const list = Array.isArray(jobIds) ? jobIds : [jobIds];
  for (const jid of list) {
    const def = JOBS[jid];
    if (!def) continue;
    const popupId = jobPopupId(jid);
    const visible = jid === 'forager' ? (G.pop.total || 0) > 0 : jobVisible(jid);
    if (!visible || !FEATURE_POPUPS[popupId] || hasSeenPopup(popupId)) continue;
    showFeatureAnnounce(popupId);
    return true;
  }
  return false;
}

function maybeAnnounceBroodUnlock(specIds, state = G) {
  const list = Array.isArray(specIds) ? specIds : [specIds];
  for (const id of list) {
    const spec = BROOD_SPECIALISATIONS[id];
    if (!spec) continue;
    const popupId = broodSpecPopupId(id);
    if (!broodSpecUnlocked(id, state) || !FEATURE_POPUPS[popupId] || hasSeenPopup(popupId)) continue;
    showFeatureAnnounce(popupId);
    return true;
  }
  return false;
}

function hasSeenPopup(id) {
  return Array.isArray(G.meta && G.meta.seen_popups) && G.meta.seen_popups.includes(id);
}

function markPopupSeen(id) {
  if (!G.meta) return;
  if (!Array.isArray(G.meta.seen_popups)) G.meta.seen_popups = [];
  if (!G.meta.seen_popups.includes(id)) G.meta.seen_popups.push(id);
}

function getTabHints() {
  if (!G.meta) return [];
  if (!Array.isArray(G.meta.tab_hints)) G.meta.tab_hints = [];
  return G.meta.tab_hints;
}

function hasTabHint(tab) {
  return !!tab && getTabHints().includes(tab);
}

function addTabHint(tab) {
  if (!tab) return;
  const hints = getTabHints();
  if (!hints.includes(tab)) hints.push(tab);
}

function clearTabHint(tab) {

function buildOfflineSummary(seconds) {
  const cappedSeconds = Math.min(seconds, 3600);
  const minutes = Math.floor(cappedSeconds / 60);
  const secondsLeft = cappedSeconds % 60;
  const appliedLabel = `${minutes}m ${secondsLeft}s`;
  const ratesNow = computeRates();
  const gains = [];
  const caps = [];
  const ignored = [];
  const startResources = { ...G.res };
  const startHatch = G.hatch.progress || 0;
  const startPop = G.pop.total || 0;

  for (const [res, rate] of Object.entries(ratesNow)) {
    if (G.res[res] === undefined) continue;
    if (rate > 0) {
      const theoretical = rate * cappedSeconds * 0.5;
      if (theoretical <= 0.0001) continue;
      const before = G.res[res] || 0;
      const after = Math.min(maxRes(res), before + theoretical);
      const delta = after - before;
      if (delta > 0.0001) {
        G.res[res] = after;
        G.vis[res] = true;
        gains.push({ res, label:`${offlineIcon(res)} ${offlineName(res)}`, value:`+${fmt(delta)}` });
      }
      const lost = theoretical - delta;
      if (lost > 0.0001) {
        caps.push({ res, label:`${offlineIcon(res)} ${offlineName(res)}`, value:`${fmt(lost)} blocked by storage` });
      }
    } else if (rate < -0.0001) {
      ignored.push({ res, label:`${offlineIcon(res)} ${offlineName(res)}`, value:`${fmt(Math.abs(rate) * cappedSeconds)} not consumed` });
    }
  }

  const hatchRateNow = hatchRate();
  const hatchGain = Math.max(0, hatchRateNow * cappedSeconds * 0.35);
  const totalProgress = startHatch + hatchGain;
  const room = Math.max(0, housing() - G.pop.total);
  const bugsHatched = Math.min(room, Math.floor(totalProgress));
  let rareBugs = [];
  if (bugsHatched > 0) {
    broodAssignNewBugs(bugsHatched);
    G.pop.total += bugsHatched;
    rareBugs = hatchRareBugRolls(bugsHatched, G, { silent:true, offline:true });
  }
  G.hatch.progress = totalProgress - bugsHatched;
  const blockedHatches = Math.max(0, Math.floor(totalProgress) - bugsHatched);

  if (ratesNow.honeydew > 0) {
    G.stats.total_hd += ratesNow.honeydew * cappedSeconds * 0.5;
  }

  const notes = [];
  if (seconds > cappedSeconds) notes.push(`<strong>Time cap:</strong> offline gains were limited to 1 hour even though you were away longer.`);
  if (caps.length) notes.push(`<strong>Storage bottlenecks:</strong> some resources stopped increasing when their storage cap was reached.`);
  if (blockedHatches > 0) notes.push(`<strong>Housing bottleneck:</strong> ${blockedHatches} additional hatch cycle${blockedHatches > 1 ? 's were' : ' was'} ready, but housing was full.`);
  if (ignored.length) notes.push(`<strong>Simplified catch-up:</strong> upkeep, starvation, and other negative changes were not simulated while offline.`);
  if (rareBugs.length) notes.push(`<strong>Rare hatches:</strong> ${rareBugs.map(b => `${b.name} (${b.title})`).join(' · ')}.`);
  notes.push(`<strong>Not simulated:</strong> random events, choice events, and day/season progression do not advance while offline.`);

  gains.sort((a, b) => {
    const av = parseFloat(String(a.value).replace(/[^0-9.\-]/g, '')) || 0;
    const bv = parseFloat(String(b.value).replace(/[^0-9.\-]/g, '')) || 0;
    return bv - av;
  });

  const report = {
    id: `offline_${Date.now()}`,
    title: bugsHatched > 0 ? 'The colony held while you were away' : 'Your colony gathered quietly in your absence',
    seconds,
    capped_seconds: cappedSeconds,
    applied_label: appliedLabel,
    resource_types: gains.length,
    gains,
    caps,
    ignored,
    hatch_before_pct: Math.round(startHatch * 100),
    hatch_after_pct: Math.round((G.hatch.progress || 0) * 100),
    hatch_gain_pct: Math.round(hatchGain * 100),
    bugs_hatched: bugsHatched,
    blocked_hatches: blockedHatches,
    rare_bugs: rareBugs,
    population_before: startPop,
    population_after: G.pop.total || 0,
    summary: gains.length
      ? `Applied ${appliedLabel} of offline catch-up across ${gains.length} resource type${gains.length !== 1 ? 's' : ''}${bugsHatched > 0 ? ` and hatched ${bugsHatched} bug${bugsHatched > 1 ? 's' : ''}` : ''}${rareBugs.length ? `, including ${rareBugs.length} rare hatch${rareBugs.length > 1 ? 'es' : ''}` : ''}.`
      : `Applied ${appliedLabel} of offline catch-up.${bugsHatched > 0 ? ` ${bugsHatched} bug${bugsHatched > 1 ? 's' : ''} hatched while you were away.` : ''}${rareBugs.length ? ` ${rareBugs.length} rare hatch${rareBugs.length > 1 ? 'es' : ''} emerged.` : ''}`,
    notes
  };
  return report;
}

function canLaunchSkyColony(state = G) {
  const aetherNeed = launchAetherRequirement(state);
  return !!state.techs.sky_colonies && (state.res.elytra || 0) >= 15 && (state.res.aether || 0) >= aetherNeed;
}

  return `Gain +${reward} Royal Nectar and begin a new run.

KEEP AFTER LAUNCH
• Royal Nectar
• Purchased Legacy upgrades
• Launch count, chronicle history, and unlocked ending records

RESET FOR THE NEXT RUN
• Resources and stockpiles

Legacy bonuses and starting perks will apply again at the start of the next run.`;
}

function confirmLaunchSkyColony() {
  if (!canLaunchSkyColony()) {
    toast('Need more Elytra and Aether', 'warn');
    return;
  }
  const reward = calcLaunchReward();
  if (reward <= 0) {
    toast('Launch not ready', 'warn');
    return;
  }
  openConfirmModal({
    title:'LAUNCH SKY COLONY',
    message:launchKeepResetMessage(reward),
    confirmLabel:'LAUNCH',
    cancelLabel:'WAIT',
    onConfirm:launchSkyColony,
  });
}

function launchSkyColony() {
  if (!canLaunchSkyColony()) {
    toast('Need more Elytra and Aether', 'warn');
    return;
  }
  const reward = calcLaunchReward();
  if (reward <= 0) {
    toast('Launch not ready', 'warn');
    return;
  }
  const ending = buildLaunchEnding(G, reward);
  const history = [ending, ...(((G.meta && G.meta.ending_history) || []))].slice(0, 6);
  const nextMeta = {
    nectar: (G.meta.nectar || 0) + reward,
    launches: (G.meta.launches || 0) + 1,
    legacy: { ...((G.meta && G.meta.legacy) || {}) },
    pending_ending: ending,
    ending_history: history,
    pending_offline: null,
    offline_history: Array.isArray(G.meta && G.meta.offline_history) ? G.meta.offline_history.slice(0, 6) : [],
  };
  G = freshStartState(nextMeta);
  log(`A Sky Colony launches. Royal Nectar gained: +${reward}.`);
  toast(`Sky Colony launched! +${reward} Nectar`);
  renderAll();
}

    message:'Delete all local progress, including Royal Nectar? This cannot be undone.',
    confirmLabel:'DELETE PROGRESS',
    cancelLabel:'KEEP SAVE',
    danger:true,
    onConfirm:() => {
      localStorage.removeItem(SAVE_KEY);
      localStorage.removeItem(SAVE_TS_KEY);
      G = freshStartState({ nectar:0, launches:0 });
      rates = {};
      renderAll();

function saveGame() {
  try {
    const data = JSON.stringify(G);
    localStorage.setItem(SAVE_KEY, data);
    localStorage.setItem(SAVE_TS_KEY, String(Date.now()));
  } catch (e) {
    // localStorage may be unavailable in private mode or when storage is full
    try { localStorage.removeItem(SAVE_KEY); localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (_) {}
  }
  maybeRefreshTradeNetworkForCurrentSeason(G);
}

function hydrateState(raw) {
  const base = freshStartState(raw.meta || { nectar:0, launches:0 });
  const merged = structuredClone ? structuredClone(base) : JSON.parse(JSON.stringify(base));
  for (const key of Object.keys(base)) {
    if (raw[key] && typeof raw[key] === 'object' && !Array.isArray(raw[key])) {
      merged[key] = { ...base[key], ...raw[key] };
    } else if (raw[key] !== undefined) {
      merged[key] = raw[key];
    }
  }
  merged.res = { ...base.res, ...(raw.res || {}) };
  merged.vis = { ...base.vis, ...(raw.vis || {}) };
  merged.bldgs = { ...base.bldgs, ...(raw.bldgs || {}) };
  merged.jobs = { ...base.jobs, ...(raw.jobs || {}) };
  merged.unlocks = {
    jobs: { ...base.unlocks.jobs, ...((raw.unlocks && raw.unlocks.jobs) || {}) },
    bldgs: { ...base.unlocks.bldgs, ...((raw.unlocks && raw.unlocks.bldgs) || {}) },
  };
  merged.achievements = { ...base.achievements, ...(raw.achievements || {}) };
  merged.milestones = { ...base.milestones, ...(raw.milestones || {}) };
  merged.projects = { ...base.projects, ...(raw.projects || {}) };
  merged.meta = { ...base.meta, ...(raw.meta || {}) };
  merged.meta.legacy = { ...base.meta.legacy, ...(((raw.meta || {}).legacy) || {}) };
  merged.meta.pending_ending = merged.meta.pending_ending || null;
  merged.meta.ending_history = Array.isArray(merged.meta.ending_history) ? merged.meta.ending_history.slice(0, 6) : [];
  merged.meta.pending_offline = merged.meta.pending_offline || null;
  merged.meta.offline_history = Array.isArray(merged.meta.offline_history) ? merged.meta.offline_history.slice(0, 6) : [];
  merged.meta.seen_achievements = Number.isFinite(merged.meta.seen_achievements) ? merged.meta.seen_achievements : 0;
  merged.meta.tutorial_hidden = !!merged.meta.tutorial_hidden;
  merged.meta.hidden_tips = Array.isArray(merged.meta.hidden_tips) ? merged.meta.hidden_tips : [];
  merged.meta.seen_popups = Array.isArray(merged.meta.seen_popups) ? merged.meta.seen_popups : [];
  merged.meta.tab_hints = Array.isArray(merged.meta.tab_hints) ? merged.meta.tab_hints : [];
  merged.meta.opening_path = typeof merged.meta.opening_path === 'string' ? merged.meta.opening_path : null;
  merged.meta.opening_cache_outcome = typeof merged.meta.opening_cache_outcome === 'string' ? merged.meta.opening_cache_outcome : null;
  merged.meta.frontier_mood_key = typeof merged.meta.frontier_mood_key === 'string' ? merged.meta.frontier_mood_key : '';
  merged.meta.frontier_mood_last_tick = Number.isFinite(merged.meta.frontier_mood_last_tick) ? Math.max(0, Math.floor(merged.meta.frontier_mood_last_tick)) : 0;
  merged.meta.frontier_mood_silent = !!merged.meta.frontier_mood_silent;
  merged.meta.map_selected_key = typeof merged.meta.map_selected_key === 'string' ? merged.meta.map_selected_key : '';
  ensureTradeState(merged);
  maybeRefreshTradeNetworkForCurrentSeason(merged);
  if (!merged.events) merged.events = { active:null, ticks_left:0, choice:null };
  if (!merged.gather || typeof merged.gather !== 'object') merged.gather = { cooldown:0 };
  if (!Number.isFinite(merged.gather.cooldown)) merged.gather.cooldown = 0;
  merged.gather.cooldown = Math.max(0, merged.gather.cooldown);
  if (!merged.hatch) merged.hatch = { progress:0 };
  ensureBroodState(merged);
  ensureRareBugState(merged);
  if (!Array.isArray(merged.expeditions)) merged.expeditions = [];
  if (!Array.isArray(merged.fighters)) merged.fighters = [];
  if (!Array.isArray(merged.outposts)) merged.outposts = [];
  if (!Array.isArray(merged.map_events)) merged.map_events = [];
  if (!Number.isFinite(merged.map_event_cooldown)) merged.map_event_cooldown = 0;
  merged.map_event_cooldown = Math.max(0, Math.floor(merged.map_event_cooldown));
  if (!merged.conflict || typeof merged.conflict !== 'object') merged.conflict = createConflictState();
  ensureConflictState(merged);
  if (merged.techs && merged.techs.combat_training) ensureRivalRoster(merged, 2);
  if (!merged.worker_xp || typeof merged.worker_xp !== 'object') merged.worker_xp = {};
  // colony_project: keep whatever was saved (null or object)
  // Hydrate map — keep saved map or null (will be generated lazily)
  if (raw.map && raw.map.tiles && typeof raw.map.tiles === 'object') {
    merged.map = raw.map;
    if (!merged.map.bonus) merged.map.bonus = {};
  } else {
    merged.map = null;
  }
  // Sanitise fighter state — clean up any mid-mission _scout_done flags that shouldn't persist
  merged.fighters = merged.fighters.map(f => {
    const clean = { ...f };
    delete clean._scout_done;
    if (clean.status === 'scouting' && !clean.zone) clean.status = 'idle';
    if (clean.status === 'escorting' && !clean.expedition_key) clean.status = 'idle';
    if (clean._is_stage && !clean.zone) { clean._is_stage = false; clean.status = 'idle'; }
    if (clean.status === 'scouting' && !SCOUT_TACTICS[clean.scout_tactic]) clean.scout_tactic = 'balanced';
    if (clean.status !== 'scouting') delete clean.scout_tactic;
    // Ensure hero fields exist for old saves
    if (clean.hero === undefined) clean.hero = false;
    if (clean.trait === undefined) clean.trait = null;
    if (clean.epithet === undefined) clean.epithet = null;
    // Ensure battle scar fields exist for old saves
    if (clean.scar === undefined) clean.scar = null;
    if (clean.near_deaths === undefined) clean.near_deaths = 0;
    // Validate scar key is still known (handles schema changes)
    if (clean.scar && !BATTLE_SCARS[clean.scar]) clean.scar = null;
    // Ensure numeric HP fields are finite
    if (!Number.isFinite(clean.hp) || clean.hp <= 0) clean.hp = fighterMaxHp(clean.level || 1);
    if (!Number.isFinite(clean.max_hp) || clean.max_hp <= 0) clean.max_hp = fighterMaxHp(clean.level || 1);
    if (!Number.isFinite(clean.level) || clean.level < 1) clean.level = 1;
    if (!Number.isFinite(clean.xp) || clean.xp < 0) clean.xp = 0;
    if (!Number.isFinite(clean.xp_next) || clean.xp_next < 1) clean.xp_next = fighterXpNext(clean.level || 1);
    return clean;
  });
  if (merged.challenge && typeof merged.challenge !== 'object') merged.challenge = null;
  merged.colonyName = typeof raw.colonyName === 'string' ? raw.colonyName : '';
  merged.pending_battle_report = null; // always clear on load
  if (!Array.isArray(merged.mission_hist)) merged.mission_hist = [];
  merged.scout_tactic = SCOUT_TACTICS[merged.scout_tactic] ? merged.scout_tactic : 'balanced';
  if (merged.scout_stage && typeof merged.scout_stage !== 'object') merged.scout_stage = null;
  syncLineageUnlocks(merged);
  clearLineageProjects(merged);
  return merged;
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    G = hydrateState(JSON.parse(raw));
    return true;
  } catch (_) {
    return false;
  }
}

function applyOffline(seconds) {
  if (seconds < 10) return;
  // Advance expeditions by offline time
  if (G.expeditions && G.expeditions.length) {
    for (const exp of G.expeditions) {
      if (!exp.done) {
        exp.elapsed += seconds;
        if (exp.elapsed >= exp.duration) {
          exp.elapsed = exp.duration;
          exp.done = true;
        }
      }
    }
  }
  const report = buildOfflineSummary(seconds);
  G.meta.pending_offline = report;
  G.meta.offline_history = [report, ...((G.meta && G.meta.offline_history) || [])].slice(0, 6);
  log(`Offline: ${report.applied_label} applied${report.bugs_hatched > 0 ? ` · ${report.bugs_hatched} bug${report.bugs_hatched > 1 ? 's' : ''} hatched` : ''}.`);
  toast(`Welcome back! Offline summary ready`);
}

  maybeShowGatherBurstPopup();
}

function renderResStrip() {
  let html = '';
  for (const [res, vis] of Object.entries(G.vis)) {
    if (!vis) continue;
    const def = RES[res];
    if (!def) continue; // skip unknown resources that may exist in old saves
    const amt = G.res[res] || 0;
    const mx = maxRes(res);
    const rt = rates[res] || 0;
    const ratio = mx > 0 ? amt / mx : 0;
    let cls = 'rc';
    if (ratio >= 0.99) cls += ' full';
    else if (ratio >= 0.85) cls += ' warn';
    let rcls = 'rz';
    if (rt > 0.0001) rcls = 'rp';
    else if (rt < -0.0001) rcls = 'rn';
    html += `<div class="${cls}">
      <div class="rc-name"><span class="rc-icon">${def.icon}</span><span class="rc-label">${def.name}</span></div>
      <div class="rc-amt">${fmt(amt)}</div>
      <div class="rc-max">/${fmt(mx)}</div>
      <div class="rc-rate ${rcls}">${fmtR(rt) || '—'}</div>
    </div>`;
  }
  document.getElementById('res-strip').innerHTML = html;
}

function renderNavBadges() {
  const broodBtn = document.querySelector('[data-tab="brood"]');

      + ((G.jobs.nurse || 0) === 0 && (G.bldgs.brood_nursery || 0) > 0 ? 1 : 0)

      badge.className = 'badge';
      badge.style.background = 'rgba(91,59,178,0.7)';
      badge.style.color = 'var(--purple)';
      badge.textContent = broodAlerts > 1 ? String(broodAlerts) : '!';
      broodBtn.appendChild(badge);

  if (!achBtn) return;
  const count = unseenAchievementCount();
  const existing = achBtn.querySelector('.badge');
  if (existing) existing.remove();
  if (count > 0 && curTab !== 'achievements') {

    badge.className = 'badge';
    badge.textContent = String(count);
    achBtn.appendChild(badge);
  }
  const colBtn = document.querySelector('[data-tab="colony"]');
  if (colBtn) {
    const oldBadge = colBtn.querySelector('.badge');
    if (oldBadge) oldBadge.remove();
    const readyExp = (G.expeditions || []).filter(e => e.done).length;
    const activeRaid = G.conflict && G.conflict.raid;
    if (curTab !== 'colony' && (activeRaid || readyExp > 0)) {

      if (activeRaid) {
        badge.style.background = 'rgba(185,28,28,0.7)';
        badge.style.color = 'var(--red)';
        badge.textContent = '!';
      } else {
        badge.style.background = 'var(--sky-d)';
        badge.style.color = 'var(--sky)';
        badge.textContent = String(readyExp);
      }
      colBtn.appendChild(badge);
    }
  }
  const scoutBtn = document.querySelector('[data-tab="scouting"]');
  if (scoutBtn) {
    const oldBadge = scoutBtn.querySelector('.badge');
    if (oldBadge) oldBadge.remove();
    const recoveringCount = (G.fighters || []).filter(f => f.status === 'recovering').length;
    if (recoveringCount > 0 && curTab !== 'scouting') {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.style.background = 'var(--amber-d)';
      badge.style.color = 'var(--amber)';
      badge.textContent = String(recoveringCount);
      scoutBtn.appendChild(badge);
    }
  }
  const mapBtn = document.querySelector('[data-tab="map"]');
  if (mapBtn) {
    const oldBadge = mapBtn.querySelector('.badge');
    if (oldBadge) oldBadge.remove();
    const claimable = mapClaimableCount();
    const contested = (G.outposts || []).filter(o => o.status === 'contested').length;
    const mapEvs = (G.map_events || []).length;
    const badgeCount = contested > 0 ? contested : mapEvs > 0 ? mapEvs : claimable;
    const badgeColor = contested > 0
      ? { bg:'rgba(185,28,28,0.7)', fg:'var(--red)' }
      : mapEvs > 0
        ? { bg:'rgba(31,110,152,0.7)', fg:'var(--sky)' }
        : { bg:'var(--accent-dd)', fg:'var(--accent)' };
    if (badgeCount > 0 && curTab !== 'map') {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.style.background = badgeColor.bg;
      badge.style.color = badgeColor.fg;
      badge.textContent = String(badgeCount);
      mapBtn.appendChild(badge);
    }
  }
  applyTabHintsToNav();
  applyNavPagerState();
}

function goTab(tab) {

}


function progressPct(cost) {
  const entries = Object.entries(cost || {});
  if (!entries.length) return 100;
  const ratio = entries.reduce((sum, [r, a]) => sum + Math.min(1, (G.res[r] || 0) / Math.max(1, a)), 0) / entries.length;
  return Math.max(0, Math.min(100, Math.round(ratio * 100)));
}


function tutorialSteps() {
  return [
    {
      done:(G.bldgs.nest || 0) >= 1,

      text:'Add a Clover Patch once your opening path needs steadier passive Honeydew.'

    {
      done:G.pop.total >= 1,
      text:'Keep Honeydew above 8 to hatch your first bug.'

    {
      done:employed() >= 1,
      text:'Assign a job so your colony starts producing while you gather.'
