  ];
}

function shouldShowOnboarding() {
  if (G.meta && G.meta.tutorial_hidden) return false;
  const steps = tutorialSteps();
  if (steps.length && steps.every(step => step.done)) return false;
  return !G.techs.natural_philosophy || G.time.year === 1;
}

function onboardingPanel() {
  if (isTipHidden('onboarding')) return '';
  if (!(G.meta && !G.meta.tutorial_hidden)) {
    if (G.meta && G.meta.tutorial_hidden) return '';
  }
  const steps = tutorialSteps();
  if (!steps.length || steps.every(step => step.done)) return '';
  if (G.techs.natural_philosophy && G.time.year > 1) return '';

function advisorObjective() {

      progress:0,
      tip:'Brood Wake hatches fastest, Rooted Stores stabilises food, and Wild Cache gambles for the biggest head start.'
    };
  }
  if ((G.bldgs.nest || 0) === 0) {
    return {
      title:'Build a Nest',
      desc:'You need housing before eggs can hatch into your first workers.',
      progress:progressPct(bldgCost('nest')),
      tip:'Gather a little more Honeydew, Leaves, or Dirt and place your first Nest.'
    };
  }
  if ((G.bldgs.clover_patch || 0) === 0) {
    const openingLabel = (G.meta && G.meta.opening_path) ? (OPENING_PATHS[G.meta.opening_path]?.title || 'your opening') : 'your opening';
    return {
      title:'Build a Clover Patch',
      desc:'Passive Honeydew still smooths out the early game, but your chosen opening changes how urgently you need it.',
      progress:progressPct(bldgCost('clover_patch')),
      tip:`${openingLabel} buys you a different amount of time before passive food becomes mandatory.`
    };
  }
  if (G.pop.total === 0) {
    return {
      title:'Hatch the first bug',
      desc:'Keep Honeydew above 8 and give the hatchery time to fill.',
      progress:Math.round(Math.max(0, Math.min(100, G.hatch.progress * 100))),
      tip:'More Honeydew means faster incubation.'
    };
  }

  const availableTech = Object.entries(TECHS)
    .filter(([tid, def]) => !G.techs[tid] && techVisible(def) && techReqsMet(def) && techStageReady(def))
    .sort((a, b) => (a[1].tier - b[1].tier) || progressPct(b[1].cost) - progressPct(a[1].cost))[0];

  if (availableTech) {
    const [tid, def] = availableTech;
    return {
      title:`Research ${def.name}`,
      desc:def.desc,
      progress:progressPct(def.cost),
      tip:`This is your most accessible Tier ${def.tier} upgrade right now.`
    };
  }

  const nextBranchTech = nextLineageResearch();
  if (nextBranchTech && techStageReady(nextBranchTech[1])) {
    const [tid, def] = nextBranchTech;
    return {
      title:`Fund ${def.name}`,
      desc:def.desc,
      progress:progressPct(def.cost),
      tip:'This lineage tech will push your current capstone path further away from the others.'
    };
  }

  const activeProject = activeLineageProject();
  if (activeProject && !projectDone(activeProject.id)) {
    const status = projectProgress(activeProject);
    return {
      title:status.ready ? `Complete ${activeProject.title}` : activeProject.title,
      desc:activeProject.short,
      progress:status.pct,
      tip:status.ready ? 'This lineage project is ready to finish on the Colony tab.' : activeProject.reward
    };
  }

  const nextQuest = nextLineageMilestone();
  if (nextQuest) {
    const status = milestoneProgress(nextQuest.id);
    const progress = status.target === 100 ? status.cur : Math.max(0, Math.min(100, Math.round((status.cur / Math.max(1, status.target)) * 100)));
    return {
      title:nextQuest.title,
      desc:nextQuest.desc,
      progress,
      tip:`Reward: ${nextQuest.reward}`
    };
  }

  if ((G.meta.nectar || 0) > 0) {
    return {
      title:ownedCapstoneId() ? 'Spend Royal Nectar' : 'Shape your lineage',
      desc:ownedCapstoneId() ? 'You have unspent prestige currency waiting in the Legacy tab.' : 'Invest in branches now so you can unlock one of the exclusive capstones later.',
      progress:100,
      tip:ownedCapstoneId() ? 'Buy a branch that fits your next run: faster starts, bigger storage, or stronger sky scaling.' : 'Brood focuses on openings, Amber on gathering and stockpiles, Sky on prestige speed.'
    };
  }

  if (G.techs.sky_colonies && !canLaunchSkyColony()) {
    return {
      title:'Prepare a Sky Colony launch',
      desc:'Bank enough Elytra and Aether for the next prestige reset.',
      progress:progressPct({ elytra:15, aether:launchAetherRequirement() }),
      tip:'Sky Docks, Aeronauts, and Sky Nomads are your fastest Aether push.'
    };
  }

  if (canLaunchSkyColony()) {
    return {
      title:'Launch a Sky Colony',
      desc:'You are ready to prestige for permanent Royal Nectar bonuses.',
      progress:100,
      tip:`Current reward: ${calcLaunchReward()} Nectar.`
    };
  }

  if (idle() > 0) {
    return {
      title:'Assign idle bugs',
      desc:'Unassigned bugs eat Honeydew without contributing production.',
      progress:Math.max(0, 100 - (idle() * 15)),
      tip:'Foragers and Scholars are usually the best stabilisers.'
    };
  }

  return {
    title:'Scale the colony',
    desc:'Add production and housing to keep momentum through the next season.',
    progress:100,
    tip:'Aim for a mix of food, insight, and advanced materials.'
  };
}

function readoutPanelHTML(title, subtitle, items, panelClass = '') {
  if (!items || !items.length) return '';

      </div>`).join('')}

function readyFighters(state = G) {
  return (state.fighters || []).filter(f => f.status === 'idle');
}

function topReadySquadPower(limit = 3, state = G) {
  return readyFighters(state)
    .slice()
    .sort((a, b) => fighterPower(b) - fighterPower(a))
    .slice(0, Math.max(0, limit))
    .reduce((sum, fighter) => sum + fighterPower(fighter), 0);
}

function accessibleScoutTargets(state = G, opts = {}) {
  const includeDiscoveredRivalBases = !!opts.includeDiscoveredRivalBases;
  const rivalZones = includeDiscoveredRivalBases ? rivalBaseZones(state) : rivalBaseZonesKnown(state);
  const pool = [...expeditionContactZones(), ...rivalZones, ...TERRITORY_ZONES];
  return pool.filter(zone => zone && (!zone.req || state.techs[zone.req]) && canSendScout(zone));
}

function strongestHeldRoute(state = G) {
  const trades = tradeReadyPool(state);
  if (!trades.length) return null;
  return trades
    .map(tr => ({
      trade: tr,
      mult: effectiveTradeMult(tr.id, state),
      influence: territoryTradeInfluence(tr.id, state)
    }))
    .sort((a, b) => (b.influence.bonus || 0) - (a.influence.bonus || 0) || b.mult - a.mult)[0] || null;
}

function seasonalOutpostPressure(state = G) {
  const outposts = (state.outposts || []).filter(op => op.status === 'active');
  const tally = {};
  for (const op of outposts) {
    const effect = territorySeasonEffect(op.type, SEASONS[(state.time || G.time).s_idx] || seasonName());
    if (!effect) continue;
    const key = `${op.type}|${effect.label}`;
    if (!tally[key]) tally[key] = { count:0, type:op.type, effect };
    tally[key].count++;
  }
  return Object.values(tally).sort((a, b) => b.count - a.count)[0] || null;
}

function strategicReadoutItems(state = G) {
  const items = [];
  const freeHousing = Math.max(0, housing() - state.pop.total);
  const honeydew = state.res.honeydew || 0;
  const hatch = hatchRate();
  if (freeHousing > 0 && hatch <= 0 && honeydew < 8) {
    items.push({
      tone:'amber',
      kicker:'BROOD PRESSURE',
      title:'Honeydew is limiting hatch speed',
      body:`Egg growth is stalled with ${fmt(honeydew)}/8 Honeydew while ${freeHousing} housing slot${freeHousing === 1 ? '' : 's'} sit open. The hatchery will move the moment food stabilises.`,
      action:'Shift more bugs into Foragers, use a full Gather burst, or let Nurses take over once the food floor is secure.'
    });
  }

  const contested = (state.outposts || []).filter(op => op.status === 'contested');
  const dormant = (state.outposts || []).filter(op => op.status === 'dormant');
  if (contested.length) {
    const op = contested[0];
    items.push({
      tone:'red',
      kicker:'BORDER STRAIN',
      title:`${op.name} is dragging fighters away from expansion`,
      body:`${contested.length} outpost${contested.length === 1 ? ' is' : 's are'} under pressure. Frontier yield is being interrupted until you answer the attack, and rivals will keep reading that silence as weakness.`,
      action:'Defend the contested route before investing further into new map claims.'
    });
  } else if (dormant.length) {
    const op = dormant[0];
    items.push({
      tone:'amber',
      kicker:'BROKEN ROUTE',
      title:`${op.name} has gone dormant`,
      body:`That route is no longer feeding the colony. A reclaim is usually cheaper than replacing the whole chain and reopens the same territory bonuses.`,
      action:'Map → reclaim the dormant outpost once an idle bug and the reduced rebuild cost are ready.'
    });
  }

  const readyTrades = tradeReadyPool(state);
  if (state.techs.trade_routes && readyTrades.length) {
    const courierCount = broodCasteCount('courier', state);
    const currentPct = Math.round((broodTradeMult(state) - 1) * 100);
    const nextPct = Math.min(40, (courierCount + 1) * 2);
    const bestTrade = strongestHeldRoute(state) || readyTrades
      .map(tr => ({ trade:tr, mult:effectiveTradeMult(tr.id, state), influence:territoryTradeInfluence(tr.id, state) }))
      .sort((a, b) => b.mult - a.mult)[0] || null;
    if (bestTrade && nextPct > currentPct) {
      items.push({
        tone:'sky',
        kicker:'TRADE LEVER',
        title:`Couriers would increase current trade value by ${nextPct - currentPct}%`,
        body:`${bestTrade.trade.name} is currently returning x${bestTrade.mult.toFixed(2)}. Another Courier hatch would lift brood trade from +${currentPct}% to +${nextPct}% immediately.`,
        action:(bestTrade.influence && bestTrade.influence.bonus > 0.01)
          ? `${bestTrade.influence.summary} are already amplifying this route.`
          : 'Pivot the next hatch into Couriers if trade is the next resource spike you want.'
      });
    }
  }

  const ready = readyFighters(state);
  const readyCount = ready.length;
  if (state.techs.combat_training) {
    const stageNeed = state.scout_stage && !state.scout_stage.accepted
      ? Math.max(0, (state.scout_stage.fighters_needed || 0) - readyCount)
      : 0;
    const stagePower = state.scout_stage ? topReadySquadPower(state.scout_stage.fighters_needed || 1, state) : 0;
    if (stageNeed === 1) {
      items.push({
        tone:'purple',
        kicker:'SCOUTING SPIKE',
        title:'You are 1 fighter short of safely pushing deeper',
        body:`${state.scout_stage.zone_name} opened an inner chamber, but your ready roster is one body short of the required ${state.scout_stage.fighters_needed}. Your best available push currently totals ${stagePower} power.`,
        action:'Recruit or finish one recovery cycle, then cash in the deeper stage while the opening still matters.'
      });
    } else {
      const nearZone = accessibleScoutTargets(state)
        .filter(zone => !zone.is_expedition_contact)
        .map(zone => ({
          zone,
          fighterGap: Math.max(0, (zone.fighters || 1) - readyCount),
          powerGap: Math.max(0, (zone.power || 0) - topReadySquadPower(zone.fighters || 1, state))
        }))
        .sort((a, b) => a.fighterGap - b.fighterGap || a.powerGap - b.powerGap || ((b.zone.tier || 0) - (a.zone.tier || 0)))[0] || null;
      if (nearZone && nearZone.fighterGap === 1 && (nearZone.zone.stageable || nearZone.zone.is_rival_base || (nearZone.zone.tier || 0) >= 3)) {
        items.push({
          tone:'purple',
          kicker:'SCOUTING SPIKE',
          title:'You are 1 fighter short of safely pushing deeper',
          body:`${zoneDisplayName(nearZone.zone, state)} wants ${nearZone.zone.fighters} fighters and roughly ${nearZone.zone.power} power. Your current ready squad can nearly reach it without overcommitting.`,
          action:'One more trained fighter turns this from a risky reach into a clean frontier push.'
        });
      } else if (nearZone && nearZone.fighterGap === 0 && nearZone.powerGap > 0 && nearZone.powerGap <= 8) {
        items.push({
          tone:'purple',
          kicker:'SCOUTING SPIKE',
          title:`${zoneDisplayName(nearZone.zone, state)} is almost within reach`,
          body:`Your best ready squad is short by only ${nearZone.powerGap} power. A level-up, a healthier hero, or one Soldier-focused hatch would make the next push far safer.`,
          action:'Scouting → send the squad into an easier zone first or wait for a better recovery window.'
        });
      }
    }
  }

  const honeyPct = maxRes('honeydew') > 0 ? honeydew / maxRes('honeydew') : 0;
  if ((buildingVisible('amber_vault') || (state.bldgs.amber_vault || 0) > 0) && (state.bldgs.amber_vault || 0) === 0 && honeyPct >= 0.68 && (state.stats.total_hd || 0) >= 40) {
    items.push({
      tone:'amber',
      kicker:'INFRASTRUCTURE PIVOT',
      title:'This run is strongest if you pivot into Amber now',
      body:`Food is sitting at ${Math.round(honeyPct * 100)}% of storage and the colony has already proven it can keep Honeydew flowing. Amber infrastructure will convert that stability into stronger gather bursts, larger caches, and safer stockpiles.`,
      action:'Build an Amber Vault before pure expansion so the stable economy starts compounding.'
    });
  }

  if (items.length < 3 && freeHousing <= 0 && state.hatch.progress >= 0.45) {
    items.push({
      tone:'amber',
      kicker:'CAPACITY CHECK',
      title:'Housing is about to choke your next hatch',
      body:`Egg progress is already at ${Math.round(state.hatch.progress * 100)}%, but the brood will stall at the door because every slot is occupied.`,
      action:'Nest or Anthill first, then let the hatch complete into open housing.'
    });
  }

  if (items.length < 4 && (state.map_events || []).length > 0) {
    items.push({
      tone:'sky',
      kicker:'FRONTIER WINDOW',
      title:`${(state.map_events || []).length} roaming map event${(state.map_events || []).length === 1 ? ' is' : 's are'} waiting to be cashed in`,
      body:'Your explored frontier is now generating short-lived opportunities. Leaving them unattended is effectively letting the world react without you.',
      action:'Map → resolve the brightest tile first before it times out.'
    });
  }

  return items.slice(0, 4);
}

function strategicReadoutPanel(state = G) {

function frontierReactionItems(context = 'colony', state = G) {
  const items = [];
  const outposts = state.outposts || [];
  const activeCount = outposts.filter(op => op.status === 'active').length;
  const contestedCount = outposts.filter(op => op.status === 'contested').length;
  const dormantCount = outposts.filter(op => op.status === 'dormant').length;
  const capturedNests = outposts.filter(op => op.status === 'active' && op.rival_base).length;
  const hostileBases = ensureRivalBaseState(state).filter(base => base.status === 'hostile').length;
  const lead = knownPrimaryRival(state);

  if (lead || contestedCount || hostileBases) {
    let title = lead ? `${rivalFullName(lead)} are ${rivalPressureLabel(lead).toLowerCase()}` : 'The border is shifting';
    let body = '';
    if (contestedCount > 0) {
      body = `${contestedCount} outpost${contestedCount === 1 ? ' is' : 's are'} under attack, and your frontier now reads as valuable enough to contest outright.`;
    } else if (dormantCount > 0) {
      body = `${dormantCount} dormant route${dormantCount === 1 ? ' is' : 's are'} telling rivals they stole tempo from you. Reclaiming even one flips that story back.`;
    } else if (hostileBases > 0) {
      body = `${hostileBases} hostile forward nest${hostileBases === 1 ? ' is' : 's are'} visible on the map. The world now remembers where your border actually touches theirs.`;
    } else if (lead) {
      body = `${lead.raids || 0} raid${(lead.raids || 0) === 1 ? '' : 's'}, ${lead.victories || 0} breakthrough${(lead.victories || 0) === 1 ? '' : 's'}, and ${lead.repelled || 0} repulse${(lead.repelled || 0) === 1 ? '' : 's'} have pushed this feud to ${Math.round(rivalGrudgePct(lead))}% grudge.`;
    }
    items.push({
      tone: contestedCount > 0 || dormantCount > 0 ? 'red' : 'amber',
      kicker:'BORDER RESPONSE',
      title,
      body,
      action: contestedCount > 0
        ? 'Defend the live route before opening a new one; the frontier is reacting to where you look weak.'
        : hostileBases > 0
          ? 'Scouting can turn hostile nests into captured staging posts.'
          : 'Repelling rivals repeatedly now has visible consequences across raids, scouting, and outposts.'
    });
  }

  const route = strongestHeldRoute(state);
  if (route && (route.influence.bonus > 0.01 || activeCount > 0)) {
    items.push({
      tone:'sky',
      kicker:'ROUTE PULL',
      title:`${route.trade.name} is bending toward the ground you hold`,
      body: route.influence.bonus > 0.01
        ? `${route.influence.summary} are giving this route +${Math.round(route.influence.bonus * 100)}% value right now. Territory is no longer flavour — it is actively shaping what pays.`
        : `${activeCount} active outpost${activeCount === 1 ? ' is' : 's are'} changing who travels your frontier and which routes become worth repeating.`,
      action:'Map claims and trade choices now feed each other. Hold the ground that matches your next economy spike.'
    });
  } else if (capturedNests > 0) {
    items.push({
      tone:'sky',
      kicker:'STAGING POSTURE',
      title:`${capturedNests} seized forward nest${capturedNests === 1 ? ' is' : 's are'} changing expedition flow`,
      body:'Captured nests now make nearby routes feel conquered instead of merely explored. Pack costs, travel times, and ambush pressure all start to lean in your favour.',
      action:'Use those safer lanes to push deeper before the frontier rebalances around a new threat.'
    });
  }

  const seasonal = seasonalOutpostPressure(state);
  if (seasonal) {
    items.push({
      tone:'amber',
      kicker:'ENVIRONMENT RESPONSE',
      title:`${seasonal.effect.label} is reshaping held territory`,
      body:`${seasonal.count} ${MAP_TILE_DEFS[seasonal.type]?.label || seasonal.type} outpost${seasonal.count === 1 ? ' is' : 's are'} currently feeling this season: ${seasonal.effect.note}`,
      action:'The same map can play very differently from season to season once you hold real ground.'
    });
  } else if ((state.map_events || []).length > 0) {
    items.push({
      tone:'purple',
      kicker:'WORLD ECHO',
      title:`The frontier is answering your expansion with ${(state.map_events || []).length} roaming event${(state.map_events || []).length === 1 ? '' : 's'}`,
      body:'Explored territory is now active enough to generate blooms, traders, and caches of its own. The map is reacting because you made it matter.',
      action:'Map → respond quickly while those short-lived openings still exist.'
    });
  }

  if (state.scout_stage && !state.scout_stage.accepted) {
    const secsLeft = Math.max(0, Math.ceil((state.scout_stage.offer_until - state.time.tick) * (TICK_MS / 1000)));
    items.push({
      tone:'purple',
      kicker:'MOMENTUM WINDOW',
      title:`${state.scout_stage.zone_name} cracked open after your last win`,
      body:`The frontier responded to aggression with a deeper chamber. That is the world acknowledging your momentum and offering a higher-risk answer back.`,
      action:`Healthy fighters and spare resources can cash it in for richer loot for another ${secsLeft}s.`
    });
  }

  return items.slice(0, context === 'map' ? 3 : 2);
}

function frontierReactionPanelHTML(context = 'colony', state = G) {
  const items = frontierReactionItems(context, state);
  if (!items.length) return '';

    : context === 'scouting'
      ? 'Rivals and dangerous territory are reacting to the squads you field and the ground you keep.'
      : 'Your decisions are now pushing back on the world around the colony.';
  return readoutPanelHTML('WORLD REACTION', subtitle, items, 'readout-frontier');

function frontierMoodSnapshot(state = G) {
  const meta = state.meta || {};
  const outposts = state.outposts || [];
  const contestedCount = outposts.filter(op => op.status === 'contested').length;
  const dormantCount = outposts.filter(op => op.status === 'dormant').length;
  const activeCount = outposts.filter(op => op.status === 'active').length;
  const mapEvents = (state.map_events || []).length;
  const stageOpen = !!(state.scout_stage && !state.scout_stage.accepted);
  const revealed = mapRevealedCount(state);
  const hostileBases = ensureRivalBaseState(state).filter(base => base.status === 'hostile').length;
  const lead = knownPrimaryRival(state);
  const route = strongestHeldRoute(state);
  const routeBonus = route && route.influence ? (route.influence.bonus || 0) : 0;
  const grudge = lead ? rivalGrudgePct(lead) : 0;
  const seasonal = seasonalOutpostPressure(state);

  if (contestedCount > 0) {
    return {
      key:`siege:${contestedCount}`,
      cls:'bad',
      logType:'bad',
      toast:`⚠ Frontier under siege · ${contestedCount} contested outpost${contestedCount === 1 ? '' : 's'}`,
      log:`⚠ The frontier mood hardens into open siege. ${contestedCount} outpost${contestedCount === 1 ? ' is' : 's are'} being tested at once, and the border now expects a military answer.`,
    };
  }
  if (dormantCount > 0) {
    return {
      key:`dormant:${dormantCount}`,
      cls:'warn',
      logType:'bad',
      toast:`Dormant frontier · ${dormantCount} lost route${dormantCount === 1 ? '' : 's'}`,
      log:`The frontier mood sours into retrenchment. ${dormantCount} dormant route${dormantCount === 1 ? ' is' : 's are'} signalling weakness until you reclaim the ground.`,
    };
  }
  if (stageOpen) {
    const zoneName = state.scout_stage && state.scout_stage.zone_name ? state.scout_stage.zone_name : 'the frontier';
    return {
      key:`momentum:${zoneName}`,
      cls:'',
      logType:'ev',
      toast:`Momentum spike · ${zoneName} opened up`,
      log:`The frontier mood flips into momentum. ${zoneName} has opened a deeper chamber in response to your last victory, inviting a sharper push while the window is hot.`,
    };
  }
  if (seasonal && seasonal.count > 0) {
    return {
      key:`season:${seasonal.type}:${seasonal.count}:${seasonal.effect.label}`,
      cls:'warn',
      logType:'',
      toast:`Seasonal pressure · ${seasonal.effect.label}`,
      log:`The frontier mood bends with the season. ${seasonal.effect.label} is now shaping ${seasonal.count} held ${MAP_TILE_DEFS[seasonal.type]?.label || seasonal.type} route${seasonal.count === 1 ? '' : 's'}, so the same border will not behave the way it did last season.`,
    };
  }
  if (mapEvents > 0 && revealed >= 10) {
    return {
      key:`opportunity:${mapEvents}`,
      cls:'',
      logType:'ev',
      toast:`World stirring · ${mapEvents} map event${mapEvents === 1 ? '' : 's'}`,
      log:`The frontier mood turns opportunistic. ${mapEvents} roaming event${mapEvents === 1 ? ' is' : 's are'} active because your explored territory is lively enough to start throwing back blooms, traders, and caches.`,
    };
  }
  if (hostileBases > 0 || grudge >= 0.45) {
    const rivalName = lead ? rivalFullName(lead) : 'Rival colonies';
    return {
      key:`hostile:${hostileBases}:${lead ? lead.id : 'none'}:${Math.round(grudge * 100)}`,
      cls:'warn',
      logType:'bad',
      toast:`Border tense · ${rivalName}`,
      log:`The frontier mood sharpens into hostility. ${rivalName} are reading your expansion as a claim, and the border now feels watched instead of merely unexplored.`,
    };
  }
  if (route && routeBonus > 0.08) {
    return {
      key:`tradeflow:${route.trade.id}:${Math.round(routeBonus * 100)}`,
      cls:'',
      logType:'ev',
      toast:`Trade current · ${route.trade.name} +${Math.round(routeBonus * 100)}%`,
      log:`The frontier mood settles into a trade current. ${route.trade.name} is now bending around the territory you hold, making the world feel routed through your colony instead of around it.`,
    };
  }
  if (activeCount > 0) {
    return {
      key:`held:${activeCount}`,
      cls:'',
      logType:'',
      toast:`Held ground · ${activeCount} active outpost${activeCount === 1 ? '' : 's'}`,
      log:`The frontier mood grows territorial. ${activeCount} active outpost${activeCount === 1 ? ' marks' : 's mark'} a border that now behaves like owned ground rather than temporary reach.`,
    };
  }
  if (revealed >= 10) {
    return {
      key:`restless:${revealed}`,
      cls:'',
      logType:'ev',
      toast:'Frontier restless',
      log:'The frontier mood becomes restless. Enough land has been revealed that the world is starting to answer your presence, even if nothing has fully boiled over yet.',
    };
  }
  return {
    key:'quiet',
    cls:'',
    logType:'',
    toast:'',
    log:'',
  };
}

function maybeAnnounceFrontierShift(state = G, opts = {}) {
  const meta = state.meta || (state.meta = {});
  const snap = frontierMoodSnapshot(state);
  const currentKey = typeof snap.key === 'string' ? snap.key : 'quiet';
  const silent = !!opts.silent;
  const minGap = Number.isFinite(opts.minGap) ? opts.minGap : 80;
  const nowTick = state && state.time ? (state.time.tick || 0) : 0;
  if (meta.frontier_mood_key === undefined) meta.frontier_mood_key = '';
  if (!Number.isFinite(meta.frontier_mood_last_tick)) meta.frontier_mood_last_tick = 0;
  if (meta.frontier_mood_key === currentKey) return;
  const shouldAnnounce = !silent
    && meta.frontier_mood_key
    && currentKey !== 'quiet'
    && nowTick >= 40
    && (nowTick - meta.frontier_mood_last_tick) >= minGap
    && !anyPriorityModalOpen();
  meta.frontier_mood_key = currentKey;
  meta.frontier_mood_last_tick = nowTick;
  if (shouldAnnounce) {
    if (snap.log) log(snap.log, snap.logType || '');
    if (snap.toast) toast(snap.toast, snap.cls || '');
  }
}

    const n = G.jobs[jid] || 0;
    const prod = Object.entries(effectiveJobProduces(jid)).map(([r, v]) => `${RES[r].icon}+${v.toFixed(3)} ${RES[r].name}/s ea`).join(' · ');
    const star = workerStar(jid);
    const xp = workerXp(jid);
    const nextThresh = workerXpNextThresh(jid);
    const prevThresh = star > 0 ? WORKER_XP_RANKS[star - 1] : 0;
    const xpPct = nextThresh ? Math.min(100, Math.round(((xp - prevThresh) / (nextThresh - prevThresh)) * 100)) : 100;
    const starLabel = star > 0 ? `<span class="wi-stars">${workerStarLabel(star)}</span>` : '';
    const bonusLabel = star > 0 ? ` <span style="color:var(--amber);font-size:9px;font-family:var(--mono)">+${star * 5}%</span>` : '';
    html += `<div class="wi">
      <div class="wi-ico">${def.icon}</div>
      <div class="wi-info">
        <div class="wi-name">${displayJobName(jid)}${def.capstone ? lineageChip(def.capstone) : ''}${bonusLabel} ${starLabel}</div>
        <div class="wi-desc">${jobDesc(jid)}${prod ? `<br>${prod}` : ''}</div>
        ${n > 0 ? `<div class="wi-xp-bar"><div class="wi-xp-fill" style="width:${xpPct}%"></div></div>
        <div style="font-size:8px;color:var(--text-lo);font-family:var(--mono);margin-top:1px;">${star < 4 ? `Seasoning: ${xpPct}% to ★${star+1}` : 'Fully seasoned ★★★★'}</div>` : ''}
      </div>
      <div class="wi-ctrl">
        <button class="wb" onclick="assignJob('${jid}',-1)">−</button>
        <div class="wc">${n}</div>
        <button class="wb" onclick="assignJob('${jid}',1)">+</button>
      </div>
    </div>`;
  }
  if (!unlocked.length) {
    html += `<div class="empty-hint">No jobs are available yet.<br>Open <b style="color:var(--text-hi)">Research</b> and aim for <b style="color:var(--text-hi)">Natural Philosophy</b> first to unlock Scholars.</div>`;
  }
  html += `<div class="sh" style="margin-top:14px">POPULATION</div>
    <div class="wi" style="cursor:default">
      <div style="flex:1">
        <div class="wi-name" style="font-size:12px">Housing capacity: ${housing()}</div>
        <div class="wi-desc">Consumption: ${(G.pop.total * 0.003 * upkeepLegacyMult() * (openingPathEffect().upkeep_mult || 1)).toFixed(3)} honeydew/s</div>
        <div class="wi-desc" style="margin-top:3px">Growth: ${housing() > G.pop.total ? 'Active' : 'Housing full'}</div>
      </div>
    </div>`;
  return html;
}

function tabResearch() {

  for (const tier of [1, 2, 3, 4, 5, 6]) {

    if (!tierTechs.length) continue;
    html += `<div class="tier-label">── TIER ${tier} ──────────────────</div>`;
    for (const [tid, def] of tierTechs) {
      const done = !!G.techs[tid];
      const reqsMet = techReqsMet(def);
      const stageReady = techStageReady(def);
      let cls = 'tc';
      if (done) cls += ' done';

      const lockReasons = techLockedReasons(def);
      const costH = Object.entries(def.cost).map(([r, a]) => {
        const ok = (G.res[r] || 0) >= a;
        const col = done ? 'var(--text-lo)' : ok ? 'var(--accent)' : 'var(--red)';
        return `<span style="color:${col}">${RES[r].icon} ${a} ${RES[r].name}</span>`;
      }).join(' · ');
      html += `<div class="${cls}" onclick="doResearch('${tid}')">

function legacySummaryLine() {
  const capstoneId = ownedCapstoneId();
  const capstoneText = capstoneId ? ` · Capstone: ${LEGACY_TREE[capstoneId].name}` : '';
  return `Production +${Math.round((productionMetaMult() - 1) * 100)}% · Storage +${Math.round((storageMetaMult() - 1) * 100)}% · Trade x${tradeLegacyMult().toFixed(2)} · Sky x${skyLegacyMult().toFixed(2)}${capstoneText}`;
}


function legacySpent(meta = G.meta, includeCapstones = true) {
  return Object.entries(LEGACY_TREE).reduce((sum, [id, node]) => {
    if (!includeCapstones && node.capstone) return sum;
    const rank = legacyRank(id, meta);
    if (!rank) return sum;
    return sum + node.costs.slice(0, rank).reduce((a, b) => a + b, 0);
  }, 0);
}

function legacyRespecFee(meta = G.meta) {
  return ownedCapstoneId(meta) ? 3 : 1;
}

function legacyRespecRefund(meta = G.meta) {
  return Math.max(0, legacySpent(meta, true) - legacyRespecFee(meta));
}

function canRespecLegacy() {
  return legacySpent(G.meta, true) > 0;
}

function legacyRespecLabel() {
  const cap = ownedCapstoneId();
  if (!cap) return 'Reset Legacy Tree';
  return `Respec ${LEGACY_TREE[cap].name}`;
}

function doLegacyRespec() {
  if (!canRespecLegacy()) {
    toast('No Legacy points to refund', 'warn');
    return;
  }
  const cap = ownedCapstoneId();
  const fee = legacyRespecFee();
  const refund = legacyRespecRefund();
  const message = cap
    ? `Respec ${LEGACY_TREE[cap].name}?\n\nYou will refund ${refund} Royal Nectar after a ${fee} Nectar fee. Current-run lineage buildings and jobs from this capstone will be removed immediately.`
    : `Reset your Legacy tree?\n\nYou will refund ${refund} Royal Nectar after a ${fee} Nectar fee.`;
  if (!confirm(message)) return;

  G.meta.nectar = (G.meta.nectar || 0) + refund;
  G.meta.legacy = Object.fromEntries(Object.keys(LEGACY_TREE).map(k => [k, 0]));
  G.milestones = {};
  G.projects = {};
  syncLineageUnlocks();
  clearInaccessibleLineageContent();
  clearLineageProjects();
  log(cap ? `Legacy respec: ${LEGACY_TREE[cap].name} was dissolved.` : 'Legacy respec: tree reset.');
  toast(cap ? `Respecced ${LEGACY_TREE[cap].name}` : 'Legacy tree reset');
  renderAll();
}

    else if (rank >= max) cls += ' done';
    else if (canBuy) cls += ' avail';

    const reqParts = [];
    if ((node.requires || []).length) reqParts.push(`Requires: ${node.requires.map(req => LEGACY_TREE[req].name).join(', ')}`);

  };

  html += `<div class="tier-label" style="margin-top:6px;">── COLONY LINEAGE ────────────────</div>`;

  html += `<div class="tier-label" style="margin-top:10px;">── SCOUTING LINEAGE ──────────────</div>`;
  html += `<div class="notice-panel" style="margin-bottom:8px;">The Scouting branch upgrades your fighter roster across runs. Unlock it by researching Combat Training in the current run.</div>`;

  html += `<div class="sh" style="margin-top:14px">OFFLINE REPORTS</div>`;
  html += offlineHistoryCards();
  html += `<div class="sh" style="margin-top:14px">ACHIEVEMENTS</div>`;
  const colonyAchs = ACHIEVEMENTS.filter(a => !['first_blood','seasoned','elite','jelly_hoard','apex_cleared','full_roster','scout_veteran','stage_runner','tyrant_slayer'].includes(a.id));

    const done = !!G.achievements[a.id];

      <div class="tc-desc">${a.desc}</div>
    </div>`;
  }).join('');
  html += `<div class="tier-label" style="margin-top:10px;">── SCOUTING ACHIEVEMENTS ─────────</div>`;
  html += scoutAchs.map(a => {

      <div class="tc-name">${a.name} ${done ? '✓' : ''}</div>
      <div class="tc-desc">${a.desc}</div>
    </div>`;
  }).join('');

    modal.style.display = 'none';

function renderTab() {
  const el = document.getElementById('content');

  // Colony tab: preserve canvas, only update content below it
  if (curTab === 'colony') {
    MapViz.stop();
    const existingCanvas = el.querySelector('#colony-canvas-wrap');
    if (existingCanvas) {
      // Canvas exists, only update the non-canvas portion
      let contentDiv = el.querySelector('#colony-content');
      if (!contentDiv) {
        contentDiv = document.createElement('div');
        contentDiv.id = 'colony-content';
        el.appendChild(contentDiv);
      }
      contentDiv.innerHTML = tabColonyContent();
    } else {
      el.innerHTML = `${colonyCanvasHTML()}<div id="colony-content">${tabColonyContent()}</div>`;
      requestAnimationFrame(() => ColonyViz.start());
    }
  } else {
    ColonyViz.stop();
    switch (curTab) {
      case 'workers': el.innerHTML = tabWorkers(); break;
      case 'research': el.innerHTML = tabResearch(); break;
      case 'craft': el.innerHTML = tabCraft(); break;
      case 'trade': el.innerHTML = tabTrade(); break;
      case 'scouting': el.innerHTML = tabScouting(); break;
      case 'brood': el.innerHTML = tabBrood(); break;
      case 'achievements': el.innerHTML = tabAchievements(); break;
      case 'log': el.innerHTML = tabLog(); break;
      case 'map': {
        const existingMapCanvas = el.querySelector('#map-canvas-wrap');
        if (existingMapCanvas) {
          let mapContentDiv = el.querySelector('#map-content');
          if (!mapContentDiv) {
            mapContentDiv = document.createElement('div');
            mapContentDiv.id = 'map-content';
            el.appendChild(mapContentDiv);
          }
          mapContentDiv.innerHTML = tabMapContent();
        } else {
          el.innerHTML = `<div id="map-canvas-wrap"><canvas id="map-canvas"></canvas><div id="map-overlay"></div></div><div id="map-content">${tabMapContent()}</div>`;
          requestAnimationFrame(() => MapViz.start());
        }
        break;
      }
      default: el.innerHTML = `${colonyCanvasHTML()}<div id="colony-content">${tabColonyContent()}</div>`;
        requestAnimationFrame(() => ColonyViz.start());
    }
  }
  renderNavBadges();
}

function tick() {
  const dt = TICK_MS / 1000;
  ensureGatherState(G);
  if (gatherBurstUnlocked() && G.gather.cooldown > 0) {
    G.gather.cooldown = Math.max(0, G.gather.cooldown - dt);
  }
  rates = computeRates();
  queueColonyWorkerVisualYields(dt);
  for (const [res, rate] of Object.entries(rates)) {
    if (G.res[res] === undefined) continue;
    G.res[res] = Math.max(0, Math.min(maxRes(res), G.res[res] + rate * dt));
    if (G.res[res] > 0) G.vis[res] = true;
  }

  if (rates.honeydew > 0) G.stats.total_hd += rates.honeydew * dt;

  const hRate = hatchRate();
  if (hRate > 0) {
    G.hatch.progress += hRate * dt;
    while (G.hatch.progress >= 1 && G.pop.total < housing()) {
      G.hatch.progress -= 1;
      awardBug(1);
    }
  }

  if (G.res.honeydew <= 0.01 && G.pop.total > 0) {
    G.starvation_ticks = (G.starvation_ticks || 0) + 1;
    // Rate escalates the longer the colony stays starving — up to 3.5x base after ~85 seconds
    const starvScale = Math.min(3.0, 1 + G.starvation_ticks / 300);
    if (Math.random() < 0.004 * G.pop.total * starvScale * dt) {
      G.pop.total = Math.max(0, G.pop.total - 1);
      ensureBroodState(G);
      for (const jid of Object.keys(G.jobs)) {
        if (G.jobs[jid] > 0) { G.jobs[jid]--; break; }
      }
      G.stats.starvation_deaths = (G.stats.starvation_deaths || 0) + 1;
      const remaining = G.pop.total;
      if (remaining === 0) {
        log('⚠ Colony collapse — the last bug has starved. All is silent.', 'bad');
        toast('Colony collapsed — no bugs remain!', 'bad');
      } else {
        log(`⚠ Starvation! A bug has perished. ${remaining} remain.`, 'bad');
        toast(`Starvation — ${remaining} bug${remaining === 1 ? '' : 's'} left!`, 'bad');
      }
    }
  } else {
    G.starvation_ticks = 0;
  }

  if (G.events.active && G.events.ticks_left > 0) {
    G.events.ticks_left--;
    if (G.events.ticks_left === 0) G.events.active = null;
  }

  if (!G.events.active && !G.events.choice && G.pop.total >= 1 && Math.random() < 0.00028 * dt * Math.max(1, G.pop.total / 3)) {
    triggerRandomEvent();
  }

  G.time.tick++;
  if (G.time.tick % TICKS_PER_DAY === 0) {
    G.time.day++;
    if (G.time.day >= DAYS_PER_SEASON) {
      G.time.day = 0;
      G.time.s_idx = (G.time.s_idx + 1) % 4;
      const ns = seasonName();
      log(`${ns} has arrived.`);
      toast(ns + ' begins');
      onSeasonChange(ns);
      if (G.time.s_idx === 0) {
        G.time.year++;
        const yearName = G.colonyName ? `${G.colonyName}` : 'The colony';
        log(`Year ${G.time.year} begins. ${yearName} endures.`);
        // Queen gains XP from surviving a new year
        awardQueenXp(20, 'new_year');
        // Map loot refresh: previously claimed tiles get a chance to regrow
        refreshMapLoot();
      }
    }
  }

  if (tickN % 10 === 0) {
    checkAchievements();
    checkLineageMilestones();
    checkChallenge();
  }
  tickExpeditions(dt);
  tickFighters(dt);
  tickRaids(dt);
  tickOutposts(dt);
  tickWorkerXp(dt);
  tickColonyProject(dt);
  tickMapEvents(dt);
  tickTradeNetwork(dt);
  tickQueen(dt);
  if (G.time.tick % 15 === 0) maybeAnnounceFrontierShift(G);
  // Expire push-deeper stage offer when time runs out
  if (G.scout_stage && !G.scout_stage.accepted && G.time.tick > G.scout_stage.offer_until) {
    log(`The ${G.scout_stage.zone_name} deeper chamber resealed — stage offer expired.`);
    G.scout_stage = null;
  }
  // Show new zones popup after a few successful missions
  if (G.techs.combat_training && !hasSeenPopup('new_enemy_types') && (G.stats.scouts || 0) >= 3) {
    showFeatureAnnounce('new_enemy_types');
  }
  if (G.time.tick % 300 === 0) saveGame();
}

function sanitizeMapSelectedKey(key) {
  initMapIfNeeded();
  if (!key || !(G.map && G.map.tiles && G.map.tiles[key])) return null;
  return key;
}

function setMapSelectedKey(key, opts = {}) {
  const { toggle = false, persist = true, rerender = true } = opts || {};
  const clean = sanitizeMapSelectedKey(key);
  const nextKey = toggle && MapViz.selectedKey === clean ? null : clean;
  MapViz.selectedKey = nextKey;
  if (G.meta) G.meta.map_selected_key = nextKey || '';
  if (rerender) {
    const mapContent = document.getElementById('map-content');
    if (mapContent) mapContent.innerHTML = tabMapContent();
  }
  if (persist) saveGame();
}

function ensureMapSelectedKeySynced() {
  initMapIfNeeded();
  const persisted = sanitizeMapSelectedKey(G.meta && G.meta.map_selected_key);
  if (persisted) MapViz.selectedKey = persisted;
  else if (MapViz.selectedKey && !(G.map && G.map.tiles && G.map.tiles[MapViz.selectedKey])) MapViz.selectedKey = null;
}

function expeditionProgressTone(info) {
  switch (info && info.phase) {
    case 'travel_out': return { fill:'rgba(120,215,255,0.18)', top:'rgba(16,37,44,0.44)', bot:'rgba(8,13,11,0.72)', border:'rgba(120,215,255,0.24)', color:'var(--sky)' };
    case 'surveying': return { fill:'rgba(255,197,98,0.20)', top:'rgba(42,28,8,0.46)', bot:'rgba(8,13,11,0.72)', border:'rgba(255,197,98,0.24)', color:'var(--amber)' };
    case 'hostile_contact': return { fill:'rgba(255,139,137,0.20)', top:'rgba(52,18,18,0.46)', bot:'rgba(8,13,11,0.72)', border:'rgba(255,139,137,0.30)', color:'var(--red)' };
    case 'fighter_support': return { fill:'rgba(183,152,255,0.18)', top:'rgba(35,22,52,0.46)', bot:'rgba(8,13,11,0.72)', border:'rgba(183,152,255,0.28)', color:'var(--purple)' };
    case 'travel_back':
    case 'returned': return { fill:'rgba(94,229,143,0.18)', top:'rgba(18,40,26,0.44)', bot:'rgba(8,13,11,0.72)', border:'rgba(94,229,143,0.24)', color:'var(--accent)' };
    default: return { fill:'rgba(255,255,255,0.05)', top:'rgba(24,28,32,0.30)', bot:'rgba(8,13,11,0.72)', border:'var(--border)', color:'var(--text-hi)' };
  }
}

function mapExpeditionCardHTML(exp, opts = {}) {
  if (!exp) return '';
  const meta = expeditionDescriptor(exp);
  if (!meta) return '';
  const info = getExpeditionPhaseInfo(exp);
  const pct = Math.max(0, Math.min(100, Math.round(info.totalProgress * 100)));
  const tone = expeditionProgressTone(info);
  const riskChance = Math.round(expeditionHazardChance(exp) * 100);
  const casualtyChance = Math.round(expeditionCasualtyChance(exp) * 100);
  const escortCount = expeditionEscortCount(exp);
  const nextLine = info.phase === 'returned'
    ? 'Ready to file the route report.'
    : info.phase === 'hostile_contact'
      ? 'Survey team pinned. Clear the contact in Scouting to resume the route.'
      : `${fmtExpTime(info.timeLeft)} ${info.countdownLabel}`;
  const toneStyle = `background:linear-gradient(90deg, ${tone.fill} 0%, ${tone.fill} ${pct}%, rgba(255,255,255,0.03) ${pct}%, rgba(255,255,255,0.03) 100%), linear-gradient(180deg, ${tone.top}, ${tone.bot});border:1px solid ${tone.border};`;
  const compact = !!opts.compact;
  return `<div style="${toneStyle}border-radius:10px;padding:${compact ? '9px 10px' : '10px 11px'};box-shadow:0 8px 18px rgba(0,0,0,0.16);margin-bottom:${compact ? '6px' : '8px'};">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">
      <div style="min-width:0;flex:1;">
        <div style="font-weight:700;color:var(--text-hi);font-size:${compact ? '11px' : '12px'};">${meta.icon} ${meta.name}</div>
        <div style="font-family:var(--mono);font-size:9px;letter-spacing:1px;color:${tone.color};margin-top:3px;">${info.label} · ${pct}%</div>
      </div>
      ${exp.targetKey ? `<button class="save-link" style="margin:0;padding:4px 8px;font-size:8px;" onclick="setMapSelectedKey('${exp.targetKey}')">FOCUS</button>` : ''}
    </div>
    <div style="font-size:10px;color:var(--text);line-height:1.45;margin-top:5px;">${expeditionPhaseText(info)}</div>
    <div style="font-size:9px;color:var(--text-lo);line-height:1.45;margin-top:5px;">${nextLine}${riskChance > 0 ? ` · ${riskChance}% setback risk` : ''}${casualtyChance > 0 ? ` · ${casualtyChance}% worst-case crew loss` : ''}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;">
      <div class="map-leg-item" style="padding:3px 7px;">${exp.bugs} bug${exp.bugs > 1 ? 's' : ''}</div>
      ${escortCount ? `<div class="map-leg-item" style="padding:3px 7px;border-color:rgba(183,152,255,0.28);color:var(--purple);">Escort ${escortCount}</div>` : ''}
      ${exp.supportNote ? `<div class="map-leg-item" style="padding:3px 7px;border-color:rgba(120,215,255,0.22);color:var(--sky);">Support note logged</div>` : ''}
      ${exp.done ? `<div class="map-leg-item" style="padding:3px 7px;border-color:rgba(94,229,143,0.28);color:var(--accent);">Report ready</div>` : ''}
    </div>
    ${exp.awaitingScout ? `<button class="map-event-btn" style="margin-top:7px;border-color:rgba(255,139,137,0.45);color:var(--red);" onclick="goTab('scouting')">OPEN SCOUTING</button>` : ''}
    ${exp.done ? `<button class="map-event-btn" style="margin-top:7px;border-color:rgba(94,229,143,0.45);color:var(--accent);" onclick="collectExpedition(${(G.expeditions || []).indexOf(exp)})">FILE REPORT</button>` : ''}
  </div>`;
}

function liveMapExpeditionsHTML() {
  const live = (G.expeditions || []).filter(exp => exp && exp.targetKey);
  if (!live.length) return '';
  let html = `<div class="exp-panel" style="border-color:rgba(120,215,255,0.22);margin-bottom:8px;">`;
  html += `<div class="exp-title">LIVE EXPEDITIONS · ${live.length}</div>`;
  html += `<div style="font-size:10px;color:var(--text-lo);line-height:1.45;margin-bottom:8px;">Use this frontier board to track every survey team without reselecting the route tile first. FOCUS jumps the map back to that hex.</div>`;
  for (const exp of live) html += mapExpeditionCardHTML(exp, { compact:true });
  html += `</div>`;
  return html;
}

        const isContested = existingOp.status === 'contested';
        const isDormant = existingOp.status === 'dormant';
        const idleFighters = (G.fighters || []).filter(f => f.status === 'idle').length;
        const activeBundle = outpostRateBundle(tile.type, G, existingOp);
        html += `<div style="margin-top:8px;padding:7px 9px;background:var(--surface);border:1px solid ${isContested ? 'var(--red)' : isDormant ? 'var(--border)' : 'var(--accent-d)'};border-radius:6px;">`;
        html += `<div style="font-family:var(--mono);font-size:9px;color:${isContested ? 'var(--red)' : isDormant ? 'var(--text-lo)' : 'var(--accent)'};margin-bottom:4px;">${isContested ? '⚠ OUTPOST CONTESTED' : isDormant ? '⊘ OUTPOST DORMANT' : '◉ OUTPOST ACTIVE'}${existingOp.rival_base ? ' · FORWARD NEST' : ''}</div>`;
        const prodLine = Object.entries(activeBundle.prod).map(([r, v]) => `${RES[r].icon}+${(v*5).toFixed(3)}/s`).join(' ');
        if (!isDormant) html += `<div style="font-family:var(--mono);font-size:9px;color:var(--text-lo);margin-bottom:4px;">${prodLine}</div>`;
        html += `<div style="font-size:9px;color:var(--text-lo);margin-bottom:4px;">Danger ${territoryDangerPips((territoryIdentity(tile.type) || {}).danger_score || 2)} · ${territoryInfluenceSummary(tile.type)}</div>`;
        if (outpostClaimLine(existingOp)) html += `<div style="font-size:9px;color:${isContested ? 'var(--red)' : 'var(--amber)'};margin-bottom:5px;line-height:1.4;">${outpostClaimLine(existingOp)}</div>`;
        if (activeBundle.stagingBonus) html += `<div style="font-size:9px;color:var(--sky);margin-bottom:5px;">${activeBundle.stagingBonus.note}</div>`;
        if (activeBundle.seasonEffect) html += `<div style="font-size:9px;color:var(--amber);margin-bottom:5px;">${activeBundle.seasonEffect.label}: ${activeBundle.seasonEffect.note}</div>`;
        if (isContested) {
          const timeLeft = Math.ceil((existingOp.contest_ticks || 0) * (TICK_MS / 1000));
          html += `<div style="font-size:9px;color:var(--red);margin-bottom:5px;">${timeLeft}s left to defend</div>`;
          html += `<button class="outpost-defend-btn" style="width:100%;margin-bottom:4px;" onclick="defendOutpost('${selected}')" ${idleFighters > 0 ? '' : 'disabled'}>${idleFighters > 0 ? 'SEND FIGHTERS TO DEFEND' : 'NO IDLE FIGHTERS'}</button>`;
        }
        if (isDormant) {
          const halfCost = outpostCostForTile(selected, 'reclaim');
          const canReclaim = canAfford(halfCost) && idle() > 0;
          const costStr = Object.entries(halfCost).map(([r, a]) => `${RES[r].icon}${a}`).join(' ');
          html += `<button class="outpost-establish-btn" style="margin-bottom:4px;" onclick="reclaimOutpost('${selected}')" ${canReclaim ? '' : 'disabled'}>RECLAIM (${costStr})</button>`;
        }
        html += `<button class="outpost-abandon-btn" style="width:100%;" onclick="abandonOutpost('${selected}')">ABANDON OUTPOST</button>`;
        html += `</div>`;
      } else {
        const cost = outpostCostForTile(selected, 'establish');
        const costStr = Object.entries(cost).map(([r, a]) => `${RES[r].icon}${a} ${RES[r].name}`).join(', ');
        const buildBundle = outpostRateBundle(tile.type, G, getRivalBaseSite(selected) && getRivalBaseSite(selected).status === 'captured' ? { rival_base:true } : null);
        const prodStr = Object.entries(buildBundle.prod).map(([r, v]) => `${RES[r].icon}+${(v*5).toFixed(3)}/s`).join(' ');
        const canBuild = canEstablishOutpost(selected) && canAfford(cost) && idle() > 0;
        html += `<div style="margin-top:8px;padding:7px 9px;background:var(--surface);border:1px solid var(--border2);border-radius:6px;">`;
        html += `<div style="font-family:var(--mono);font-size:9px;color:var(--text-lo);margin-bottom:3px;">ESTABLISH OUTPOST · ${getRivalBaseSite(selected) && getRivalBaseSite(selected).status === 'captured' ? 'FORWARD NEST' : opDef.label}</div>`;
        html += `<div style="font-family:var(--mono);font-size:9px;color:var(--accent);margin-bottom:3px;">${prodStr}</div>`;
        html += `<div style="font-size:9px;color:var(--text-lo);margin-bottom:4px;">Costs: ${costStr} · Uses 1 idle bug as garrison${getRivalBaseSite(selected) && getRivalBaseSite(selected).status === 'captured' ? ' · Seized nests are cheaper to refit' : ''}</div>`;
        html += `<div style="font-size:9px;color:var(--text-lo);margin-bottom:4px;">Danger ${territoryDangerPips((territoryIdentity(tile.type) || {}).danger_score || 2)} · ${territoryInfluenceSummary(tile.type)}</div>`;
        if (buildBundle.stagingBonus) html += `<div style="font-size:9px;color:var(--sky);margin-bottom:5px;">${buildBundle.stagingBonus.note}</div>`;
        if (buildBundle.seasonEffect) html += `<div style="font-size:9px;color:var(--amber);margin-bottom:5px;">${buildBundle.seasonEffect.label}: ${buildBundle.seasonEffect.note}</div>`;
        html += `<button class="outpost-establish-btn" onclick="establishOutpost('${selected}')" ${canBuild ? '' : 'disabled'}>${!idle() ? 'NO IDLE BUGS' : !canAfford(cost) ? 'NEED RESOURCES' : 'ESTABLISH OUTPOST'}</button>`;
        html += `</div>`;
      }
    }
    // Map event on this tile
    const tileEvent = (G.map_events || []).find(ev => ev.key === selected);
    if (tileEvent) {
      const timeLeftSec = Math.ceil(tileEvent.ticks_left * (TICK_MS / 1000));
      const timerPct = Math.round((tileEvent.ticks_left / tileEvent.max_ticks) * 100);
      const offerLine = mapEventCompactOfferLine(tileEvent);
      const offerHtml = mapEventOfferHtml(tileEvent);
      const hasBugForEvent = hasHatchedBug();
      const canAct = hasBugForEvent && (!(tileEvent.reward && tileEvent.reward.cost && Object.keys(tileEvent.reward.cost).length) || canAfford(tileEvent.reward.cost || {}));
      html += `<div class="map-event-panel" style="margin-top:8px;border-color:${tileEvent.color}44;">
        <div class="map-event-title" style="color:${tileEvent.color}">${tileEvent.icon} ${tileEvent.name.toUpperCase()}</div>
        <div class="map-event-desc">${tileEvent.desc}</div>
        ${offerHtml}
        <div style="height:3px;background:var(--surface2);border-radius:99px;margin-bottom:6px;overflow:hidden;"><div style="height:100%;width:${timerPct}%;background:${tileEvent.color};opacity:0.7;border-radius:99px;transition:width 0.5s linear;"></div></div>
        <div style="font-family:var(--mono);font-size:9px;color:var(--text-lo);margin-bottom:6px;">${timeLeftSec}s remaining${offerLine ? ` · ${offerLine}` : ''}</div>
        <button class="map-event-btn" style="border-color:${tileEvent.color}66;color:${tileEvent.color};" onclick="claimMapEvent('${selected}')" ${canAct ? '' : 'disabled'}>${!hasBugForEvent ? 'NEED 1 HATCHED BUG' : tileEvent.action_label}</button>
        ${!hasBugForEvent ? `<div class="route-pull" style="margin-top:6px;color:var(--amber);">${mapBugRequirementText()}</div>` : (!canAct ? `<div class="route-pull" style="margin-top:6px;color:var(--amber);">Need the listed resources to resolve this event.</div>` : '')}
      </div>`;
    }

    html += `</div>`;
  } else if (selected && tile && !tile.revealed) {
    const plan = buildTileExpeditionPlan(selected);
    const gate = canLaunchTileExpedition(plan);
    const activeExp = (G.expeditions || []).find(exp => exp.targetKey === selected) || null;
    const packText = plan ? resourceBundleText(plan.pack, { withNames:true }) : '';
    html += `<div class="map-node-detail">`;
    html += `<div class="map-node-title">◈ ${plan ? plan.label : '??? Unexplored'}</div>`;
    html += `<div class="map-node-desc">Commit a survey team to chart this hidden tile. The route is selected directly from the map and the pack cost is consumed when the expedition leaves.</div>`;
    if (plan) {
      html += `<div class="map-traits">`;
      html += `<div class="map-trait"><strong>CREW</strong><span>${plan.bugs} bug${plan.bugs > 1 ? 's' : ''}</span></div>`;
      html += `<div class="map-trait"><strong>ETA</strong><span>${fmtExpTime(plan.duration)}</span></div>`;
      html += `<div class="map-trait"><strong>DISTANCE</strong><span>${plan.distance.toFixed(1)} tiles</span></div>`;
      html += `<div class="map-trait map-trait-danger"><strong>DANGER</strong>${territoryDangerMeter(plan.danger_score, expeditionDangerLabel(plan))}</div>`;
      html += `</div>`;
      const readyEscortCount = expeditionEscortCandidates().length;
      html += `<div class="map-note"><strong>PACK COST:</strong> ${packText || 'No extra supplies required.'}</div>`;
      if (plan.stagingBonus) html += `<div class="route-pull" style="margin-bottom:4px;color:var(--sky);">${plan.stagingBonus.label}: ${Math.round((1 - plan.stagingBonus.pack_mult) * 100)}% lighter pack · ${Math.round((1 - plan.stagingBonus.duration_mult) * 100)}% faster travel.</div>`;
      html += `<div class="route-pull" style="margin-bottom:4px;">Reward outlook: ${plan.reward_outlook}</div>`;
      html += `<div class="map-note" style="margin-bottom:6px;border-color:rgba(183,152,255,0.18);background:rgba(183,152,255,0.06);"><strong>FRONTIER FINDS:</strong> ~${Math.round(frontierFindChance(plan) * 100)}% chance · ${frontierFindOutlook(plan.tileType)}.</div>`;
      const casualtyChance = Math.round(expeditionCasualtyChance(plan) * 100);
      html += `<div class="route-pull" style="margin-bottom:4px;color:${readyEscortCount ? 'var(--purple)' : 'var(--text-lo)'};">${readyEscortCount ? `${readyEscortCount} idle fighter${readyEscortCount > 1 ? 's are' : ' is'} available to escort this route.` : 'No idle fighter escorts available right now.'}</div>`;
      if (casualtyChance > 0) html += `<div class="route-pull" style="margin-bottom:8px;color:var(--red);">Unescorted worst-case: ${casualtyChance}% chance to lose 1 survey bug on the return.</div>`;
      else html += `<div class="route-pull" style="margin-bottom:8px;color:var(--text-lo);">Losses here are expected to be supplies or haul, not crew.</div>`;
    }
    if (activeExp) {
      html += mapExpeditionCardHTML(activeExp);
    } else {
      const disabledLabel = !gate.ok
        ? (expSlotsFull() ? 'ALL SLOTS FULL' : idle() < (plan ? plan.bugs : 1) ? 'NEED IDLE BUGS' : !canAfford(plan ? plan.pack || {} : {}) ? 'NEED SUPPLIES' : 'CANNOT SEND')
        : 'PLAN EXPEDITION';
      html += `<button class="map-claim-btn" onclick="${gate.ok ? `planTileExpedition('${selected}')` : ''}" ${gate.ok ? '' : 'disabled'}>${disabledLabel}</button>`;
    }
    html += `</div>`;
  }

  const frontierDiscoveries = activeMapDiscoveries().filter(landmark => landmark.key !== selected);
  if (frontierDiscoveries.length) {
    html += `<div class="exp-panel" style="border-color:rgba(183,152,255,0.22);margin-bottom:8px;">`;
    html += `<div class="exp-title" style="color:var(--purple)">FRONTIER DISCOVERIES · ${frontierDiscoveries.length} active</div>`;
    for (const landmark of frontierDiscoveries) {
      const ldef = landmarkDefById(landmark.id);
      const rewardText = mapLandmarkRewardText(landmark);
      html += `<div class="map-event-panel" style="margin-bottom:6px;cursor:pointer;border-color:${ldef ? ldef.color : '#e4f1e8'}44;" onclick="setMapSelectedKey('${landmark.key}')">`;
      html += `<div class="map-event-title" style="color:${ldef ? ldef.color : '#e4f1e8'}">${ldef ? ldef.icon : '✦'} ${ldef ? ldef.name : 'Discovery'}</div>`;
      html += `<div style="font-size:10px;color:var(--text);margin-bottom:3px;">${ldef ? ldef.desc : 'A frontier site waits to be examined.'}</div>`;
      if (rewardText) html += `<div style="font-size:10px;color:var(--amber);margin-bottom:3px;">${rewardText}</div>`;
      html += `<div style="font-size:10px;color:var(--text-lo)">Tap to inspect tile (${landmark.key}).</div>`;
      html += `</div>`;
    }
    html += `</div>`;
  }

  // Active map events list (not on selected tile)
  const activeEvents = (G.map_events || []).filter(ev => ev.key !== selected);
  if (activeEvents.length) {
    html += `<div class="exp-panel" style="border-color:rgba(120,215,255,0.20);margin-bottom:8px;">`;
    html += `<div class="exp-title">ROAMING EVENTS · ${activeEvents.length} active</div>`;
    for (const ev of activeEvents) {
      const timeLeftSec = Math.ceil(ev.ticks_left * (TICK_MS / 1000));
      const offerLine = mapEventCompactOfferLine(ev);
      html += `<div class="map-event-panel" style="margin-bottom:6px;cursor:pointer;" onclick="setMapSelectedKey('${ev.key}')">
        <div class="map-event-title" style="color:${ev.color}">${ev.icon} ${ev.name} <span style="float:right;color:var(--text-lo)">${timeLeftSec}s</span></div>
        ${offerLine ? `<div style="font-size:10px;color:var(--text);margin-bottom:3px;">${offerLine}</div>` : ''}
        <div style="font-size:10px;color:var(--text-lo)">Tap to select tile (${ev.key}) and interact.</div>
      </div>`;
    }
    html += `</div>`;
  }

  // Exploration stats panel
  const revealedCount = mapRevealedCount();
  const totalCount = MAP_W * MAP_H;
  const claimableCount = mapClaimableCount();
  const bonuses = (G.map && G.map.bonus) || {};
  const hasBonuses = Object.keys(bonuses).length > 0;

  html += `<div class="exp-panel">`;
  html += `<div class="exp-title">EXPLORATION STATUS</div>`;
  html += `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;">`;
  html += `<div class="ss-item" style="flex:1;min-width:80px;"><div class="ss-body"><div class="ss-val">${revealedCount}/${totalCount}</div><div class="ss-lbl">Tiles Mapped</div></div></div>`;
  html += `<div class="ss-item amber" style="flex:1;min-width:80px;"><div class="ss-body"><div class="ss-val">${claimableCount}</div><div class="ss-lbl">Uncollected</div></div></div>`;
  html += `<div class="ss-item sky" style="flex:1;min-width:80px;"><div class="ss-body"><div class="ss-val">${(G.stats.expeditions || 0)}</div><div class="ss-lbl">Expeditions</div></div></div>`;
  const landmarkCounts = mapLandmarkCounts();
  if (landmarkCounts.total > 0) {
    html += `<div class="ss-item purple" style="flex:1;min-width:80px;"><div class="ss-body"><div class="ss-val">${landmarkCounts.active}/${landmarkCounts.total}</div><div class="ss-lbl">Discoveries</div></div></div>`;
  }
  if ((G.stats.frontier_finds || 0) > 0) {
    html += `<div class="ss-item purple" style="flex:1;min-width:80px;"><div class="ss-body"><div class="ss-val">${G.stats.frontier_finds || 0}</div><div class="ss-lbl">Frontier Finds</div></div></div>`;
  }
  
  if (G.techs.outpost_network) {
    const opActive = (G.outposts || []).filter(o => o.status === 'active').length;
    const opContested = (G.outposts || []).filter(o => o.status === 'contested').length;
    const opColor = opContested > 0 ? 'red' : 'accent';
    html += `<div class="ss-item ${opContested > 0 ? 'red' : ''}" style="flex:1;min-width:80px;"><div class="ss-body"><div class="ss-val" style="color:var(--${opColor})">${opActive + opContested}</div><div class="ss-lbl">Outposts</div></div></div>`;
  }
  if (G.techs.colonial_culture && G.techs.combat_training) {
    const hostileBases = rivalBaseZones().length;
    const capturedBases = ensureRivalBaseState(G).filter(base => base.status === 'captured').length;
    html += `<div class="ss-item red" style="flex:1;min-width:80px;"><div class="ss-body"><div class="ss-val" style="color:var(--red)">${hostileBases}/${capturedBases}</div><div class="ss-lbl">Nests</div></div></div>`;
  }
  html += `</div>`;

  if (hasBonuses) {
    html += `<div style="font-size:10px;color:var(--amber);margin-bottom:7px;padding:5px 8px;background:var(--amber-d);background:rgba(255,197,98,0.07);border-radius:5px;border:1px solid rgba(255,197,98,0.18);">`;
    html += `✦ Active map bonuses: `;
    html += Object.entries(bonuses).map(([r, v]) => `+${v.toFixed(3)} ${(RES[r] || {}).name || r}/s`).join(' · ');
    html += `</div>`;
  }

  const seasonNotes = Object.entries(TERRITORY_IDENTITY)
    .map(([type, identity]) => ({ type, eff: territorySeasonEffect(type) }))
    .filter(row => row.eff)
    .slice(0, 3)
    .map(row => `${MAP_TILE_DEFS[row.type].label}: ${row.eff.note}`);
  if (seasonNotes.length) {
    html += `<div class="map-note" style="margin-bottom:8px;"><strong>${seasonName()} frontier pressure:</strong> ${seasonNotes.join(' · ')}</div>`;
  }

  html += `<div style="font-size:10px;color:var(--text-lo);line-height:1.5;">Each completed expedition charts new territory. Tap a hidden tile to plan the next survey route, inspect revealed tiles for node bonuses and one-off landmarks, and watch for rival nests that can be seized and turned into forward staging posts. `;
  if (!G.expeditions || !G.expeditions.length) {
    html += `<span style="color:var(--sky)">Scout bugs appear on the map while expeditions are active.</span>`;
  } else {
    html += `<span style="color:var(--sky)">${G.expeditions.length} expedition${G.expeditions.length > 1 ? 's' : ''} currently scouting the map.</span>`;
  }
  html += `</div>`;
  html += `</div>`;

  return html;
}

/* ── MAP CANVAS RENDERER ─────────────────────── */
const MapViz = {
  raf: null,
  inited: false,
  selectedKey: null,
  hoveredKey: null,
  _listenersAdded: false,

  // Flat-top hex geometry
  hexR: 15,

  hexCenter(x, y) {
    const r = this.hexR;
    const cx = x * (r * 1.5) + r + 4;
    const cy = y * (r * Math.sqrt(3)) + (x % 2 === 1 ? r * Math.sqrt(3) * 0.5 : 0) + r * Math.sqrt(3) * 0.5 + 4;
    return { cx, cy };
  },

  inHex(mx, my, cx, cy) {
    const r = this.hexR;
    const dx = Math.abs(mx - cx), dy = Math.abs(my - cy);
    if (dx > r || dy > r * 0.866) return false;
    return dx * 0.5 + dy * 0.866 <= r * 0.866;
  },

  pathHex(ctx, cx, cy, r) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI / 3) * i;
      const px = cx + r * Math.cos(a), py = cy + r * Math.sin(a);
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();
  },

  draw(canvas) {
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    const t = Date.now() * 0.001;

    initMapIfNeeded();
    const tiles = G.map.tiles;
    const r = this.hexR;

    // Deep background
    ctx.fillStyle = '#040c08';
    ctx.fillRect(0, 0, W, H);

    // Subtle grid haze
    const haze = ctx.createRadialGradient(W * 0.3, H * 0.5, 0, W * 0.3, H * 0.5, W * 0.7);
    haze.addColorStop(0, 'rgba(20,50,30,0.18)');
    haze.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = haze;
    ctx.fillRect(0, 0, W, H);

    for (let x = 0; x < MAP_W; x++) {
      for (let y = 0; y < MAP_H; y++) {
        const key = `${x},${y}`;
        const tile = tiles[key];
        if (!tile) continue;
        const { cx, cy } = this.hexCenter(x, y);
        if (cx < -r * 2 || cx > W + r * 2 || cy < -r * 2 || cy > H + r * 2) continue;

        const def = MAP_TILE_DEFS[tile.type];
        const isHovered = this.hoveredKey === key;
        const isSelected = this.selectedKey === key;

        if (!tile.revealed) {
          // Fog — nearly invisible, slight shimmer
          this.pathHex(ctx, cx, cy, r - 0.5);
          ctx.fillStyle = '#060f0a';
          ctx.fill();
          ctx.strokeStyle = '#0c1e14';
          ctx.lineWidth = 0.6;
          ctx.stroke();
          // Subtle animated fog
          const fogAlpha = 0.06 + 0.04 * Math.sin(t * 0.4 + x * 0.8 + y * 1.2);
          this.pathHex(ctx, cx, cy, r - 1);
          ctx.fillStyle = `rgba(20,50,30,${fogAlpha})`;
          ctx.fill();

          if (isSelected) {
            const ringPulse = 0.9 + 0.1 * Math.sin(t * 3.8 + x * 0.45 + y * 0.7);
            ctx.save();
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            this.pathHex(ctx, cx, cy, r + 1.2);
            ctx.strokeStyle = `rgba(120,215,255,${0.10 * ringPulse})`;
            ctx.lineWidth = 6;
            ctx.stroke();
            this.pathHex(ctx, cx, cy, r + 0.8);
            ctx.strokeStyle = `rgba(120,215,255,${0.55 * ringPulse})`;
            ctx.lineWidth = 1.6;
            ctx.stroke();
            this.pathHex(ctx, cx, cy, r - 0.7);
            ctx.strokeStyle = `rgba(120,215,255,${0.18 * ringPulse})`;
            ctx.lineWidth = 0.9;
            ctx.stroke();
            ctx.restore();
          }
        } else {
          // Revealed tile
          const fillCol = def ? def.color : '#07100c';
          const borderCol = def ? def.border : '#152419';

          this.pathHex(ctx, cx, cy, r - 0.5);
          ctx.fillStyle = fillCol;
          ctx.fill();
          ctx.strokeStyle = isSelected ? '#5ee58fbb' : isHovered && tile.type !== 'hazard' ? borderCol + 'ee' : borderCol + '99';
          ctx.lineWidth = isSelected ? 1.4 : 0.9;
          ctx.stroke();

          // Pulse glow for claimable uncollected nodes
          if (def && def.loot && !tile.claimed) {
            const pulse = 0.5 + 0.4 * Math.sin(t * 2.2 + x * 0.5 + y * 0.7);
            this.pathHex(ctx, cx, cy, r * 0.72);
            ctx.fillStyle = `rgba(94,229,143,${pulse * 0.09})`;
            ctx.fill();
          }

          // Tile icon / content
          if (tile.type === 'colony') {
            // Colony: animated ring + glyph
            const pulse = 0.4 + 0.35 * Math.sin(t * 1.8);
            this.pathHex(ctx, cx, cy, r * 0.52);
            ctx.fillStyle = `rgba(94,229,143,${0.14 + pulse * 0.1})`;
            ctx.fill();
            ctx.font = `bold ${Math.floor(r * 0.7)}px monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#5ee58f';
            ctx.fillText('⬡', cx, cy + 0.5);
          } else if (def && def.icon) {
            ctx.font = `${Math.floor(r * 0.58)}px serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            if (tile.claimed) {
              ctx.globalAlpha = 0.3;
              ctx.fillStyle = '#4a6a56';
              ctx.fillText('✓', cx, cy + 0.5);
              ctx.globalAlpha = 1;
            } else {
              ctx.fillStyle = tile.type === 'hazard' ? '#c05050' : '#b0d8c0';
              ctx.fillText(def.icon, cx, cy + 0.5);
            }
          }

          // Selection ring
          if (isSelected) {
            const ringPulse = 0.9 + 0.1 * Math.sin(t * 3.9 + x * 0.42 + y * 0.64);
            ctx.save();
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            this.pathHex(ctx, cx, cy, r + 1.25);
            ctx.strokeStyle = `rgba(255,255,255,${0.12 * ringPulse})`;
            ctx.lineWidth = 6.2;
            ctx.stroke();
            this.pathHex(ctx, cx, cy, r + 0.82);
            ctx.strokeStyle = `rgba(255,255,255,${0.96 * ringPulse})`;
            ctx.lineWidth = 2;
            ctx.stroke();
            this.pathHex(ctx, cx, cy, r - 0.6);
            ctx.strokeStyle = `rgba(94,229,143,${0.38 * ringPulse})`;
            ctx.lineWidth = 0.95;
            ctx.stroke();
            ctx.restore();
          }
        }
      }
    }

    // Draw active expedition scouts marching on map
    for (const exp of (G.expeditions || [])) {
      let targetCenter = null;
      if (exp.targetKey) {
        const [xRaw, yRaw] = exp.targetKey.split(',');
        const tx = parseInt(xRaw, 10);
        const ty = parseInt(yRaw, 10);
        if (Number.isFinite(tx) && Number.isFinite(ty)) targetCenter = this.hexCenter(tx, ty);
      } else {
        const region = EXP_ZONE_REGIONS[exp.zone];
        if (region) targetCenter = this.hexCenter(region.cx, region.cy);
      }
      if (!targetCenter) continue;
      const phaseInfo = getExpeditionPhaseInfo(exp);
      const colC = this.hexCenter(MAP_COL_X, MAP_COL_Y);
      let sx = colC.cx;
      let sy = colC.cy;
      let trailColor = '#78d7ff';
      let brightFrom = { x: colC.cx, y: colC.cy };
      let brightTo = { x: colC.cx, y: colC.cy };

      if (phaseInfo.phase === 'travel_out') {
        sx = colC.cx + (targetCenter.cx - colC.cx) * phaseInfo.phaseProgress;
        sy = colC.cy + (targetCenter.cy - colC.cy) * phaseInfo.phaseProgress;
        brightTo = { x: sx, y: sy };
        trailColor = '#78d7ff';
      } else if (phaseInfo.phase === 'surveying') {
        sx = targetCenter.cx;
        sy = targetCenter.cy;
        brightTo = { x: targetCenter.cx, y: targetCenter.cy };
        trailColor = '#ffc562';
      } else if (phaseInfo.phase === 'travel_back') {
        sx = targetCenter.cx + (colC.cx - targetCenter.cx) * phaseInfo.phaseProgress;
        sy = targetCenter.cy + (colC.cy - targetCenter.cy) * phaseInfo.phaseProgress;
        brightFrom = { x: sx, y: sy };
        brightTo = { x: colC.cx, y: colC.cy };
        trailColor = '#5ee58f';
      } else if (phaseInfo.phase === 'hostile_contact') {
        sx = targetCenter.cx;
        sy = targetCenter.cy;
        brightTo = { x: targetCenter.cx, y: targetCenter.cy };
        trailColor = '#ff8b89';
      } else if (phaseInfo.phase === 'fighter_support') {
        sx = targetCenter.cx;
        sy = targetCenter.cy;
        brightTo = { x: targetCenter.cx, y: targetCenter.cy };
        trailColor = '#b798ff';
      } else {
        sx = colC.cx;
        sy = colC.cy;
        brightTo = { x: targetCenter.cx, y: targetCenter.cy };
        trailColor = '#5ee58f';
      }

      ctx.save();
      ctx.globalAlpha = 0.12;
      ctx.strokeStyle = trailColor;
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 5]);
      ctx.beginPath();
      ctx.moveTo(colC.cx, colC.cy);
      ctx.lineTo(targetCenter.cx, targetCenter.cy);
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = 0.34;
      ctx.strokeStyle = trailColor;
      ctx.lineWidth = 1.2;
      ctx.setLineDash([2, 4]);
      ctx.beginPath();
      ctx.moveTo(brightFrom.x, brightFrom.y);
      ctx.lineTo(brightTo.x, brightTo.y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();

      if (phaseInfo.phase === 'surveying') {
        ctx.save();
        ctx.globalAlpha = 0.55;
        ctx.strokeStyle = '#ffc562';
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.arc(targetCenter.cx, targetCenter.cy, 7 + Math.sin(t * 4 + sx * 0.03) * 1.4, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      const bugColor = phaseInfo.phase === 'surveying'
        ? '#ffc562'
        : phaseInfo.phase === 'travel_back' || phaseInfo.phase === 'returned'
          ? '#5ee58f'
          : '#78d7ff';
      const seedStr = exp.targetKey || exp.zone || 'expedition';
      for (let i = 0; i < Math.min(exp.bugs, 3); i++) {
        const wiggle = Math.sin(t * 7 + i * 1.8 + seedStr.charCodeAt(0)) * 1.8;
        const bx = sx + (i - 1) * 5 + wiggle;
        const by = sy + i * 2.5;
        ctx.beginPath();
        ctx.ellipse(bx, by, 2.4, 1.5, 0, 0, Math.PI * 2);
        ctx.fillStyle = bugColor;
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.fillRect(bx + 1.5, by - 0.7, 0.9, 0.9);
        ctx.strokeStyle = bugColor + 'aa';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(bx + 1.8, by - 1.2);
        ctx.lineTo(bx + 3.2, by - 2.4 + Math.sin(t * 5 + i) * 0.6);
        ctx.stroke();
      }
    }

    // Draw outpost flags on map tiles
    for (const op of (G.outposts || [])) {
      const parts = op.key.split(',');
      const ox = parseInt(parts[0]), oy = parseInt(parts[1]);
      const { cx, cy } = this.hexCenter(ox, oy);
      const def = OUTPOST_DEFS[op.type];
      if (!def) continue;
      const isContested = op.status === 'contested';
      const isDormant = op.status === 'dormant';
      const flagColor = isContested ? '#ff6b6b' : isDormant ? '#556655' : def.color;
      // Flag pole
      ctx.strokeStyle = flagColor + 'cc';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(cx + r * 0.3, cy + r * 0.15);
      ctx.lineTo(cx + r * 0.3, cy - r * 0.65);
      ctx.stroke();
      // Flag banner
      ctx.fillStyle = flagColor + (isDormant ? '66' : 'cc');
      ctx.beginPath();
      ctx.moveTo(cx + r * 0.3, cy - r * 0.65);
      ctx.lineTo(cx + r * 0.72, cy - r * 0.52);
      ctx.lineTo(cx + r * 0.3, cy - r * 0.38);
      ctx.closePath();
      ctx.fill();
      // Pulsing glow when contested
      if (isContested) {
        const pulse = 0.4 + 0.55 * Math.abs(Math.sin(t * 3.5));
        ctx.beginPath();
        ctx.arc(cx + r * 0.3, cy - r * 0.52, r * 0.22, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,100,100,${pulse * 0.35})`;
        ctx.fill();
      }
    }

    // Draw rival base markers
    refreshRivalBaseDiscoveries(G);
    for (const base of ensureRivalBaseState(G)) {
      const tile = getMapTileByKey(base.key);
      if (!tile || !tile.revealed) continue;
      const parts = base.key.split(',');
      const bx = parseInt(parts[0], 10), by = parseInt(parts[1], 10);
      const { cx, cy } = this.hexCenter(bx, by);
      const hostile = base.status === 'hostile';
      const ringColor = hostile ? '#ff8b89' : '#5ee58f';
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx - r * 0.02, cy - r * 0.02, r * 0.24 + (hostile ? Math.sin(t * 3 + bx) * 0.4 : 0), 0, Math.PI * 2);
      ctx.fillStyle = hostile ? 'rgba(255,139,137,0.18)' : 'rgba(94,229,143,0.15)';
      ctx.fill();
      ctx.strokeStyle = ringColor;
      ctx.lineWidth = 1.1;
      ctx.stroke();
      ctx.font = `bold ${Math.floor(r * 0.42)}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = ringColor;
      ctx.fillText(hostile ? '⟁' : '⬢', cx, cy - r * 0.02);
      ctx.restore();
    }

    // Draw landmark markers
    for (const landmark of activeMapDiscoveries()) {
      const parts = landmark.key.split(',');
      const lx = parseInt(parts[0], 10), ly = parseInt(parts[1], 10);
      const { cx, cy } = this.hexCenter(lx, ly);
      const ldef = landmarkDefById(landmark.id);
      const pulse = 0.45 + 0.4 * Math.abs(Math.sin(t * 1.8 + lx * 0.4));
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.48, 0, Math.PI * 2);
      ctx.strokeStyle = `${ldef ? ldef.color : '#e4f1e8'}${Math.floor((0.28 + pulse * 0.22) * 255).toString(16).padStart(2,'0')}`;
      ctx.lineWidth = 1.3;
      ctx.stroke();
      ctx.font = `bold ${Math.floor(r * 0.45)}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = ldef ? ldef.color : '#e4f1e8';
      ctx.fillText(ldef ? ldef.icon : '✦', cx, cy);
      ctx.restore();
    }

    // Draw map event markers
    for (const ev of (G.map_events || [])) {
      const parts = ev.key.split(',');
      const ex = parseInt(parts[0]), ey = parseInt(parts[1]);
      const { cx, cy } = this.hexCenter(ex, ey);
      const pulse = 0.5 + 0.45 * Math.abs(Math.sin(t * 2.2 + ex * 0.5));
      // Glowing ring
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.55, 0, Math.PI * 2);
      ctx.strokeStyle = ev.color + Math.floor(pulse * 180).toString(16).padStart(2,'0');
      ctx.lineWidth = 1.4;
      ctx.stroke();
      // Inner fill
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.3, 0, Math.PI * 2);
      ctx.fillStyle = ev.color + '44';
      ctx.fill();
      // Timer arc (countdown ring)
      const timerPct = ev.ticks_left / ev.max_ticks;
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.55, -Math.PI / 2, -Math.PI / 2 + timerPct * Math.PI * 2);
      ctx.strokeStyle = ev.color + 'cc';
      ctx.lineWidth = 1.8;
      ctx.stroke();
    }

    // Overlay text
    const ov = document.getElementById('map-overlay');
    if (ov) {
      const rev = mapRevealedCount();
      const act = (G.expeditions || []).length;
      const opCount = (G.outposts || []).filter(o => o.status === 'active').length;
      const contested = (G.outposts || []).filter(o => o.status === 'contested').length;
      const evCount = (G.map_events || []).length;
      const discoveryCount = activeMapDiscoveries().length;
      let overlay = `${rev}/${MAP_W * MAP_H} tiles charted`;
      if (act > 0) overlay += ` · ${act} squad${act > 1 ? 's' : ''} out`;
      if (opCount > 0) overlay += ` · ${opCount} outpost${opCount > 1 ? 's' : ''}`;
      if (contested > 0) overlay += ` · ⚠ ${contested} contested`;
      if (discoveryCount > 0) overlay += ` · ${discoveryCount} ${discoveryCount > 1 ? 'discoveries' : 'discovery'}`;
      if (evCount > 0) overlay += ` · ${evCount} event${evCount > 1 ? 's' : ''}`;
      ov.textContent = overlay;
    }
  },

  handleClick(canvas, event) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = (event.clientX - rect.left) * scaleX;
    const my = (event.clientY - rect.top) * scaleY;
    let found = null;
    outer: for (let x = 0; x < MAP_W; x++) {
      for (let y = 0; y < MAP_H; y++) {
        const { cx, cy } = this.hexCenter(x, y);
        if (this.inHex(mx, my, cx, cy)) { found = `${x},${y}`; break outer; }
      }
    }
    setMapSelectedKey(found, { toggle:true, persist:true, rerender:true });
  },

  handleMove(canvas, event) {
    const rect = canvas.getBoundingClientRect();
    const mx = (event.clientX - rect.left) * (canvas.width / rect.width);
    const my = (event.clientY - rect.top) * (canvas.height / rect.height);
    let found = null;
    outer: for (let x = 0; x < MAP_W; x++) {
      for (let y = 0; y < MAP_H; y++) {
        const { cx, cy } = this.hexCenter(x, y);
        if (this.inHex(mx, my, cx, cy)) { found = `${x},${y}`; break outer; }
      }
    }
    this.hoveredKey = found;
  },

  loop(canvas) {
    if (!canvas || !canvas.parentNode) { this.inited = false; return; }
    this.draw(canvas);
    this.raf = requestAnimationFrame(() => this.loop(canvas));
  },

  start() {
    const canvas = document.getElementById('map-canvas');
    if (!canvas) return;
    ensureMapSelectedKeySynced();
    const wrap = canvas.parentElement;
    canvas.width = wrap.clientWidth;
    canvas.height = wrap.clientHeight;
    if (!this._listenersAdded) {
      canvas.addEventListener('click', (e) => this.handleClick(canvas, e));
      canvas.addEventListener('mousemove', (e) => this.handleMove(canvas, e));
      canvas.addEventListener('mouseleave', () => { this.hoveredKey = null; });
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        this.handleClick(canvas, { clientX: touch.clientX, clientY: touch.clientY });
      }, { passive: false });
      this._listenersAdded = true;
    }
    if (this.raf) cancelAnimationFrame(this.raf);
    this.inited = true;
    this.loop(canvas);
  },

  stop() {
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = null;
    this.inited = false;
    this._listenersAdded = false;
  },
};

function colonyCanvasHTML() {
  return `<div id="colony-canvas-wrap">
    <canvas id="colony-canvas"></canvas>
    <div id="colony-overlay"></div>
  </div>
  <div id="colony-log-feed">
    <div class="clf-header">
      <span class="clf-title">COLONY LOG</span>
      <button class="clf-view-all" onclick="goTab('log')">FULL HISTORY ›</button>
    </div>
    <div class="clf-entries" id="clf-entries"></div>
  </div>`;
}

let _lastLogLength = 0;

function renderLogFeed() {
  const el = document.getElementById('clf-entries');
  if (!el) return;
