<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07140f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="Touchline Dynasty - a deep mobile-first fictional English football management game." />
<title>Touchline Dynasty</title>
<style>
:root {
  --bg: #06110d;
  --bg-elevated: #0b1d16;
  --bg-soft: #10271e;
  --panel: rgba(14, 35, 27, 0.94);
  --panel-2: rgba(20, 47, 37, 0.96);
  --line: rgba(255, 255, 255, 0.1);
  --line-strong: rgba(255, 255, 255, 0.18);
  --text: #f5fff9;
  --muted: #a8c0b3;
  --accent: #72f6ad;
  --accent-2: #28c979;
  --accent-dark: #0f8c50;
  --gold: #ffd166;
  --danger: #ff6b6b;
  --warn: #ffb347;
  --info: #67b7ff;
  --success: #5be38d;
  --shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
  --radius: 18px;
  --radius-sm: 12px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--bg);
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 10% 0%, rgba(55, 207, 126, 0.11), transparent 34%),
    radial-gradient(circle at 100% 20%, rgba(32, 108, 217, 0.08), transparent 28%),
    var(--bg);
  color: var(--text);
  overscroll-behavior: none;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.app-shell {
  min-height: 100vh;
}

.boot-screen,
.setup-screen {
  min-height: 100vh;
  padding: calc(26px + var(--safe-top)) 18px calc(28px + var(--safe-bottom));
  display: flex;
  align-items: center;
  justify-content: center;
}

.boot-card,
.setup-card {
  width: min(100%, 960px);
  background: linear-gradient(180deg, rgba(17, 44, 33, 0.96), rgba(8, 23, 17, 0.98));
  border: 1px solid var(--line-strong);
  border-radius: 28px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

.boot-hero,
.setup-hero {
  padding: 28px 22px 22px;
  background:
    linear-gradient(135deg, rgba(114, 246, 173, 0.16), transparent 55%),
    repeating-linear-gradient(90deg, transparent 0 42px, rgba(255,255,255,0.025) 43px 44px);
  border-bottom: 1px solid var(--line);
}

.brand-lockup {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand-mark {
  width: 52px;
  height: 52px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  color: #062013;
  font-weight: 900;
  font-size: 24px;
  box-shadow: 0 10px 24px rgba(40, 201, 121, 0.28);
}

.brand-title {
  margin: 0;
  font-size: clamp(1.55rem, 7vw, 2.65rem);
  letter-spacing: -0.045em;
  line-height: 0.95;
}

.brand-subtitle {
  margin: 8px 0 0;
  color: var(--muted);
  max-width: 58ch;
  line-height: 1.55;
}

.boot-actions,
.setup-body {
  padding: 22px;
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.btn {
  border: 0;
  border-radius: 12px;
  min-height: 44px;
  padding: 10px 15px;
  font-weight: 800;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: transform 0.16s ease, filter 0.16s ease, background 0.16s ease;
}

.btn:active {
  transform: translateY(1px) scale(0.99);
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #052014;
}

.btn-secondary {
  background: rgba(255,255,255,0.08);
  color: var(--text);
  border: 1px solid var(--line);
}

.btn-danger {
  background: rgba(255, 107, 107, 0.14);
  color: #ffd7d7;
  border: 1px solid rgba(255, 107, 107, 0.36);
}

.btn-warning {
  background: rgba(255, 179, 71, 0.14);
  color: #ffe5bd;
  border: 1px solid rgba(255, 179, 71, 0.35);
}

.btn-small {
  min-height: 36px;
  padding: 7px 11px;
  font-size: 0.82rem;
}

.btn-icon {
  width: 42px;
  height: 42px;
  padding: 0;
  border-radius: 12px;
}

.file-label {
  position: relative;
  overflow: hidden;
}

.file-label input {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}

.setup-grid {
  display: grid;
  gap: 18px;
}

.form-field {
  display: grid;
  gap: 7px;
}

.form-field label,
.field-label {
  color: var(--muted);
  font-size: 0.78rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.input,
.select,
.textarea {
  width: 100%;
  min-height: 46px;
  border-radius: 12px;
  border: 1px solid var(--line-strong);
  background: rgba(0,0,0,0.22);
  color: var(--text);
  padding: 11px 12px;
}

.textarea {
  min-height: 100px;
  resize: vertical;
}

.club-picker {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  max-height: 420px;
  overflow: auto;
  padding: 2px;
}

.club-option {
  background: rgba(255,255,255,0.045);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 15px;
  padding: 12px;
  text-align: left;
  cursor: pointer;
  display: grid;
  gap: 8px;
}

.club-option.selected {
  border-color: var(--accent);
  background: rgba(114, 246, 173, 0.11);
  box-shadow: inset 0 0 0 1px rgba(114, 246, 173, 0.15);
}

.club-option-top {
  display: flex;
  align-items: center;
  gap: 9px;
}

.club-badge {
  --club-a: #72f6ad;
  --club-b: #0f8c50;
  width: 38px;
  height: 38px;
  border-radius: 12px 12px 16px 16px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, var(--club-a), var(--club-b));
  color: #07140f;
  font-weight: 950;
  font-size: 0.74rem;
  border: 2px solid rgba(255,255,255,0.7);
  box-shadow: 0 6px 14px rgba(0,0,0,0.24);
  flex: 0 0 auto;
}

.club-option-name {
  font-weight: 850;
  line-height: 1.15;
}

.club-option-meta {
  color: var(--muted);
  font-size: 0.76rem;
}

.game-layout {
  min-height: 100vh;
  padding-bottom: calc(76px + var(--safe-bottom));
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  padding: calc(9px + var(--safe-top)) 12px 9px;
  background: rgba(4, 16, 11, 0.92);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(16px);
}

.topbar-inner {
  max-width: 1450px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.club-identity {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.club-identity .club-badge {
  width: 42px;
  height: 42px;
}

.club-name {
  font-weight: 900;
  line-height: 1.08;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.club-meta {
  margin-top: 3px;
  color: var(--muted);
  font-size: 0.72rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.date-pill {
  display: none;
  padding: 8px 10px;
  border-radius: 10px;
  background: rgba(255,255,255,0.05);
  color: var(--muted);
  font-size: 0.76rem;
  font-weight: 750;
}

.desktop-sidebar {
  display: none;
}

.main-content {
  width: min(100%, 1450px);
  margin: 0 auto;
  padding: 14px 12px 24px;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
  margin: 3px 0 14px;
}

.page-title {
  margin: 0;
  font-size: clamp(1.4rem, 6vw, 2.2rem);
  letter-spacing: -0.035em;
  line-height: 1;
}

.page-kicker {
  color: var(--accent);
  font-size: 0.72rem;
  font-weight: 900;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.page-description {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 0.88rem;
  line-height: 1.45;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 8px 30px rgba(0,0,0,0.18);
  overflow: hidden;
}

.panel + .panel {
  margin-top: 12px;
}

.panel-head {
  padding: 14px 14px 11px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px solid var(--line);
}

.panel-title {
  margin: 0;
  font-size: 0.98rem;
  letter-spacing: -0.015em;
}

.panel-subtitle {
  color: var(--muted);
  font-size: 0.72rem;
  margin-top: 3px;
}

.panel-body {
  padding: 14px;
}

.dashboard-grid,
.two-col,
.three-col,
.four-col {
  display: grid;
  gap: 12px;
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.kpi-card {
  min-width: 0;
  background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.025));
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 12px;
}

.kpi-label {
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.075em;
}

.kpi-value {
  margin-top: 6px;
  font-size: clamp(1.15rem, 5vw, 1.75rem);
  font-weight: 920;
  letter-spacing: -0.035em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.kpi-note {
  margin-top: 4px;
  color: var(--muted);
  font-size: 0.7rem;
}

.fixture-hero {
  position: relative;
  padding: 18px 14px;
  min-height: 214px;
  display: grid;
  align-content: center;
  background:
    linear-gradient(rgba(5, 25, 15, 0.7), rgba(5, 25, 15, 0.88)),
    repeating-linear-gradient(0deg, rgba(63, 145, 75, 0.35) 0 38px, rgba(48, 127, 65, 0.35) 38px 76px);
}

.fixture-hero::before {
  content: "";
  position: absolute;
  inset: 12px;
  border: 2px solid rgba(255,255,255,0.26);
  pointer-events: none;
}

.fixture-kicker {
  text-align: center;
  color: rgba(255,255,255,0.72);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 900;
}

.fixture-teams {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 12px;
  align-items: center;
  margin-top: 14px;
  position: relative;
  z-index: 1;
}

.fixture-team {
  display: grid;
  justify-items: center;
  gap: 8px;
  text-align: center;
}

.fixture-team .club-badge {
  width: 55px;
  height: 55px;
}

.fixture-team-name {
  font-size: 0.82rem;
  font-weight: 900;
}

.fixture-versus {
  font-size: 1rem;
  font-weight: 950;
  color: var(--accent);
}

.fixture-actions {
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 16px;
}

.progress {
  height: 8px;
  background: rgba(255,255,255,0.08);
  border-radius: 999px;
  overflow: hidden;
}

.progress > span {
  display: block;
  height: 100%;
  width: var(--value, 0%);
  background: linear-gradient(90deg, var(--accent-dark), var(--accent));
  border-radius: inherit;
}

.progress.warn > span {
  background: linear-gradient(90deg, #bf7a1c, var(--warn));
}

.progress.danger > span {
  background: linear-gradient(90deg, #b53232, var(--danger));
}

.stat-row {
  display: grid;
  grid-template-columns: minmax(90px, 1fr) auto;
  gap: 8px;
  align-items: center;
  padding: 9px 0;
  border-bottom: 1px solid rgba(255,255,255,0.07);
}

.stat-row:last-child {
  border-bottom: 0;
}

.stat-label {
  color: var(--muted);
  font-size: 0.8rem;
}

.stat-value {
  font-weight: 850;
  font-size: 0.84rem;
}

.news-list,
.inbox-list,
.timeline-list {
  display: grid;
}

.news-item,
.inbox-item,
.timeline-item {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
}

.news-item:last-child,
.inbox-item:last-child,
.timeline-item:last-child {
  border-bottom: 0;
}

.news-title,
.inbox-title {
  font-weight: 820;
  font-size: 0.86rem;
}

.news-meta,
.inbox-meta,
.timeline-meta {
  margin-top: 4px;
  color: var(--muted);
  font-size: 0.7rem;
}

.inbox-item.unread {
  background: rgba(114, 246, 173, 0.05);
  box-shadow: inset 3px 0 0 var(--accent);
}

.table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 660px;
}

.data-table.compact {
  min-width: 530px;
}

.data-table th,
.data-table td {
  padding: 10px 9px;
  text-align: left;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  font-size: 0.78rem;
  white-space: nowrap;
}

.data-table th {
  color: var(--muted);
  font-size: 0.67rem;
  text-transform: uppercase;
  letter-spacing: 0.075em;
  position: sticky;
  top: 0;
  background: #10271e;
  z-index: 2;
}

.data-table tr.user-row {
  background: rgba(114, 246, 173, 0.08);
}

.data-table tr.clickable {
  cursor: pointer;
}

.data-table tr.clickable:hover {
  background: rgba(255,255,255,0.04);
}

.form-dots {
  display: flex;
  gap: 3px;
}

.form-dot {
  width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  border-radius: 5px;
  font-size: 0.58rem;
  font-weight: 900;
}

.form-dot.w { background: rgba(91, 227, 141, 0.18); color: var(--success); }
.form-dot.d { background: rgba(255, 209, 102, 0.18); color: var(--gold); }
.form-dot.l { background: rgba(255, 107, 107, 0.18); color: var(--danger); }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 24px;
  border-radius: 999px;
  padding: 4px 8px;
  background: rgba(255,255,255,0.07);
  color: var(--muted);
  border: 1px solid rgba(255,255,255,0.08);
  font-size: 0.67rem;
  font-weight: 800;
  white-space: nowrap;
}

.pill.success { color: var(--success); background: rgba(91, 227, 141, 0.09); }
.pill.warn { color: var(--warn); background: rgba(255, 179, 71, 0.09); }
.pill.danger { color: var(--danger); background: rgba(255, 107, 107, 0.09); }
.pill.info { color: var(--info); background: rgba(103, 183, 255, 0.09); }
.pill.accent { color: var(--accent); background: rgba(114, 246, 173, 0.09); }

.mobile-tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 0 10px;
  scrollbar-width: none;
}

.mobile-tabs::-webkit-scrollbar {
  display: none;
}

.tab-btn {
  flex: 0 0 auto;
  min-height: 38px;
  padding: 8px 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.035);
  color: var(--muted);
  font-size: 0.75rem;
  font-weight: 820;
  cursor: pointer;
}

.tab-btn.active {
  color: #062013;
  background: var(--accent);
  border-color: var(--accent);
}

.bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 50;
  padding: 6px 8px calc(6px + var(--safe-bottom));
  background: rgba(4, 16, 11, 0.96);
  border-top: 1px solid var(--line);
  backdrop-filter: blur(16px);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
}

.nav-btn {
  border: 0;
  background: transparent;
  color: #80998c;
  min-height: 55px;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 3px;
  font-size: 0.63rem;
  font-weight: 800;
  cursor: pointer;
}

.nav-icon {
  font-size: 1.15rem;
  line-height: 1;
}

.nav-btn.active {
  color: var(--accent);
}

.more-sheet {
  position: fixed;
  inset: 0;
  z-index: 90;
  background: rgba(0,0,0,0.56);
  display: flex;
  align-items: flex-end;
  padding-top: 60px;
}

.more-sheet-card {
  width: 100%;
  max-height: calc(100vh - 60px);
  overflow: auto;
  background: #0b1d16;
  border-radius: 24px 24px 0 0;
  border: 1px solid var(--line-strong);
  padding: 10px 14px calc(20px + var(--safe-bottom));
}

.sheet-handle {
  width: 46px;
  height: 4px;
  border-radius: 999px;
  background: rgba(255,255,255,0.2);
  margin: 2px auto 14px;
}

.more-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}

.more-btn {
  min-height: 66px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.045);
  color: var(--text);
  padding: 11px;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}

.more-btn.active {
  border-color: var(--accent);
  background: rgba(114,246,173,0.09);
}

.more-icon {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: rgba(255,255,255,0.07);
}

.more-label {
  font-weight: 820;
  font-size: 0.82rem;
}

.more-desc {
  color: var(--muted);
  font-size: 0.65rem;
  margin-top: 2px;
}

.player-list {
  display: grid;
  gap: 8px;
}

.player-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: rgba(255,255,255,0.035);
  cursor: pointer;
}

.player-row.selected {
  border-color: var(--accent);
  background: rgba(114,246,173,0.08);
}

.position-badge {
  width: 40px;
  height: 40px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  background: rgba(114,246,173,0.11);
  color: var(--accent);
  font-weight: 920;
  font-size: 0.72rem;
  border: 1px solid rgba(114,246,173,0.18);
}

.position-badge.gk { background: rgba(255, 209, 102, 0.11); color: var(--gold); border-color: rgba(255,209,102,0.18); }
.position-badge.df { background: rgba(103,183,255,0.11); color: var(--info); border-color: rgba(103,183,255,0.18); }
.position-badge.mf { background: rgba(114,246,173,0.11); color: var(--accent); border-color: rgba(114,246,173,0.18); }
.position-badge.fw { background: rgba(255,107,107,0.11); color: #ff9d9d; border-color: rgba(255,107,107,0.18); }

.player-name {
  font-weight: 860;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.player-meta {
  color: var(--muted);
  font-size: 0.69rem;
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.rating-bubble {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 950;
  background: conic-gradient(var(--rating-color, var(--accent)) calc(var(--rating, 70) * 1%), rgba(255,255,255,0.08) 0);
  position: relative;
}

.rating-bubble::before {
  content: "";
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  background: #0d2119;
}

.rating-bubble span {
  position: relative;
  z-index: 1;
  font-size: 0.77rem;
}

.player-card-grid {
  display: grid;
  gap: 12px;
}

.player-profile {
  padding: 16px;
  background:
    linear-gradient(135deg, rgba(114,246,173,0.12), transparent 55%),
    var(--panel);
}

.player-profile-top {
  display: flex;
  gap: 13px;
  align-items: center;
}

.player-avatar {
  width: 72px;
  height: 72px;
  border-radius: 20px;
  display: grid;
  place-items: center;
  font-weight: 950;
  font-size: 1.35rem;
  color: #07140f;
  background: linear-gradient(145deg, var(--avatar-a, #72f6ad), var(--avatar-b, #0f8c50));
  flex: 0 0 auto;
}

.player-profile-name {
  margin: 0;
  font-size: 1.35rem;
  letter-spacing: -0.035em;
}

.player-profile-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 7px;
}

.attribute-groups {
  display: grid;
  gap: 12px;
}

.attribute-group {
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
}

.attribute-group-title {
  padding: 10px 12px;
  font-size: 0.75rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  background: rgba(255,255,255,0.035);
  border-bottom: 1px solid var(--line);
}

.attribute-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  padding: 7px 12px 10px;
  gap: 7px 12px;
}

.attribute-item {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 0.76rem;
}

.attribute-name {
  color: var(--muted);
}

.attribute-score {
  font-weight: 900;
}

.attribute-score.elite { color: var(--accent); }
.attribute-score.good { color: var(--gold); }
.attribute-score.poor { color: #ff9696; }

.squad-toolbar,
.transfer-toolbar,
.league-toolbar {
  display: grid;
  gap: 9px;
  margin-bottom: 12px;
}

.chip-group {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  scrollbar-width: none;
}

.chip-group::-webkit-scrollbar { display: none; }

.chip {
  flex: 0 0 auto;
  min-height: 34px;
  padding: 7px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.035);
  color: var(--muted);
  font-size: 0.69rem;
  font-weight: 820;
  cursor: pointer;
}

.chip.active {
  background: rgba(114,246,173,0.12);
  border-color: rgba(114,246,173,0.44);
  color: var(--accent);
}

.tactics-layout {
  display: grid;
  gap: 12px;
}

.pitch-card {
  padding: 10px;
}

.tactics-pitch,
.match-pitch {
  position: relative;
  width: 100%;
  aspect-ratio: 0.69;
  max-height: 710px;
  border-radius: 15px;
  overflow: hidden;
  background:
    repeating-linear-gradient(0deg, #26693a 0 52px, #2d7642 52px 104px);
  border: 3px solid rgba(255,255,255,0.15);
}

.pitch-lines {
  position: absolute;
  inset: 4.5%;
  border: 2px solid rgba(255,255,255,0.7);
  pointer-events: none;
}

.pitch-lines::before {
  content: "";
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  border-top: 2px solid rgba(255,255,255,0.7);
}

.pitch-lines::after {
  content: "";
  position: absolute;
  width: 25%;
  aspect-ratio: 1;
  border: 2px solid rgba(255,255,255,0.7);
  border-radius: 50%;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
}

.penalty-box {
  position: absolute;
  left: 50%;
  width: 56%;
  height: 15%;
  transform: translateX(-50%);
  border: 2px solid rgba(255,255,255,0.7);
}

.penalty-box.top { top: 4.5%; border-top: 0; }
.penalty-box.bottom { bottom: 4.5%; border-bottom: 0; }

.goal-box {
  position: absolute;
  left: 50%;
  width: 28%;
  height: 6.5%;
  transform: translateX(-50%);
  border: 2px solid rgba(255,255,255,0.7);
}

.goal-box.top { top: 4.5%; border-top: 0; }
.goal-box.bottom { bottom: 4.5%; border-bottom: 0; }

.formation-player {
  position: absolute;
  transform: translate(-50%, -50%);
  display: grid;
  justify-items: center;
  gap: 4px;
  width: 72px;
  cursor: pointer;
  z-index: 4;
}

.formation-player-dot {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: #06110d;
  background: var(--accent);
  border: 3px solid rgba(255,255,255,0.95);
  font-size: 0.68rem;
  font-weight: 950;
  box-shadow: 0 5px 10px rgba(0,0,0,0.28);
}

.formation-player.out-of-position .formation-player-dot {
  background: var(--warn);
}

.formation-player-name {
  max-width: 74px;
  padding: 3px 5px;
  background: rgba(4,15,10,0.76);
  border-radius: 5px;
  color: #fff;
  font-size: 0.58rem;
  font-weight: 830;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tactics-controls {
  display: grid;
  gap: 10px;
}

.control-card {
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(255,255,255,0.03);
}

.control-card-title {
  font-weight: 850;
  font-size: 0.82rem;
  margin-bottom: 9px;
}

.segmented {
  display: grid;
  grid-template-columns: repeat(var(--segments, 3), minmax(0, 1fr));
  gap: 5px;
}

.segment-btn {
  min-height: 36px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.035);
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 820;
  cursor: pointer;
  padding: 6px;
}

.segment-btn.active {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(114,246,173,0.09);
}

.range-wrap {
  display: grid;
  gap: 7px;
}

.range-meta {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 0.69rem;
}

input[type="range"] {
  width: 100%;
  accent-color: var(--accent);
}

.transfer-card {
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(255,255,255,0.035);
  display: grid;
  gap: 11px;
}

.transfer-card-top {
  display: grid;
  grid-template-columns: auto minmax(0,1fr) auto;
  gap: 10px;
  align-items: center;
}

.transfer-card-details {
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 7px;
}

.mini-stat {
  background: rgba(0,0,0,0.16);
  border-radius: 9px;
  padding: 8px;
  min-width: 0;
}

.mini-stat-label {
  color: var(--muted);
  font-size: 0.61rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 800;
}

.mini-stat-value {
  margin-top: 4px;
  font-size: 0.78rem;
  font-weight: 880;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: rgba(0,0,0,0.68);
  padding: 40px 0 0;
}

.modal-card {
  width: 100%;
  max-height: calc(100vh - 40px);
  overflow: auto;
  background: #0b1d16;
  border: 1px solid var(--line-strong);
  border-radius: 24px 24px 0 0;
  box-shadow: var(--shadow);
}

.modal-head {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 14px;
  background: rgba(11,29,22,0.96);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(12px);
}

.modal-title {
  margin: 0;
  font-size: 1.05rem;
}

.modal-body {
  padding: 14px 14px calc(20px + var(--safe-bottom));
}

.contract-grid {
  display: grid;
  gap: 10px;
}

.offer-summary {
  padding: 12px;
  border-radius: 13px;
  background: rgba(114,246,173,0.07);
  border: 1px solid rgba(114,246,173,0.18);
}

.training-grid {
  display: grid;
  gap: 10px;
}

.training-option {
  padding: 13px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.035);
  cursor: pointer;
}

.training-option.active {
  border-color: var(--accent);
  background: rgba(114,246,173,0.08);
}

.training-option-title {
  font-weight: 880;
}

.training-option-desc {
  margin-top: 5px;
  color: var(--muted);
  font-size: 0.72rem;
  line-height: 1.45;
}

.finance-bars {
  display: grid;
  gap: 12px;
}

.finance-bar-head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 0.76rem;
  margin-bottom: 6px;
}

.board-meter {
  position: relative;
  height: 16px;
  background: linear-gradient(90deg, #a83a3a 0 34%, #c8942d 34% 64%, #2ea668 64% 100%);
  border-radius: 999px;
}

.board-meter::after {
  content: "";
  position: absolute;
  left: calc(var(--score, 50) * 1%);
  top: 50%;
  width: 5px;
  height: 24px;
  border-radius: 999px;
  transform: translate(-50%, -50%);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(0,0,0,0.25);
}

.facility-card {
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(255,255,255,0.03);
}

.facility-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
}

.facility-name {
  font-weight: 850;
}

.match-shell {
  min-height: 100vh;
  background: #040d09;
  padding: calc(8px + var(--safe-top)) 8px calc(12px + var(--safe-bottom));
}

.match-header {
  max-width: 1200px;
  margin: 0 auto 8px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 8px;
  align-items: center;
}

.match-team-header {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}

.match-team-header.away {
  justify-content: flex-end;
  text-align: right;
}

.match-team-header .club-badge {
  width: 34px;
  height: 34px;
  border-radius: 9px 9px 12px 12px;
}

.match-team-name {
  font-size: 0.73rem;
  font-weight: 880;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.score-box {
  text-align: center;
  min-width: 88px;
}

.match-score {
  font-size: 1.45rem;
  font-weight: 950;
  letter-spacing: 0.04em;
}

.match-clock {
  color: var(--accent);
  font-size: 0.68rem;
  font-weight: 860;
  margin-top: 1px;
}

.match-layout {
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  gap: 8px;
}

.match-stage {
  background: #07140f;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 7px;
}

.match-pitch {
  aspect-ratio: 0.72;
  max-height: calc(100vh - 210px);
  min-height: 380px;
  margin: 0 auto;
}

.match-entity {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.88);
  display: grid;
  place-items: center;
  font-size: 0.45rem;
  font-weight: 950;
  color: #07140f;
  z-index: 5;
  transition: left 0.42s linear, top 0.42s linear;
  box-shadow: 0 2px 5px rgba(0,0,0,0.3);
}

.match-entity.home { background: var(--home-color, #72f6ad); }
.match-entity.away { background: var(--away-color, #ff6b6b); }
.match-entity.has-ball { box-shadow: 0 0 0 3px var(--gold), 0 2px 5px rgba(0,0,0,0.3); }
.match-entity.carded::after {
  content: "";
  position: absolute;
  width: 5px;
  height: 8px;
  background: var(--gold);
  right: -4px;
  top: -3px;
}

.match-ball {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #fff;
  border: 1px solid #111;
  z-index: 8;
  transition: left 0.2s linear, top 0.2s linear;
  box-shadow: 0 2px 5px rgba(0,0,0,0.45);
}

.match-controls {
  display: flex;
  gap: 6px;
  align-items: center;
  justify-content: center;
  margin-top: 7px;
  flex-wrap: wrap;
}

.speed-btn {
  min-height: 32px;
  min-width: 38px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.04);
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 850;
}

.speed-btn.active {
  background: rgba(114,246,173,0.12);
  color: var(--accent);
  border-color: var(--accent);
}

.match-side {
  display: grid;
  gap: 8px;
}

.commentary-box {
  max-height: 210px;
  overflow: auto;
}

.commentary-line {
  display: grid;
  grid-template-columns: 31px minmax(0,1fr);
  gap: 8px;
  padding: 8px 10px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  font-size: 0.7rem;
  line-height: 1.35;
}

.commentary-minute {
  color: var(--accent);
  font-weight: 900;
}

.commentary-line.goal {
  background: rgba(114,246,173,0.09);
  font-weight: 800;
}

.commentary-line.card {
  background: rgba(255,209,102,0.05);
}

.match-stats-grid {
  display: grid;
  gap: 9px;
}

.match-stat {
  display: grid;
  grid-template-columns: 35px 1fr 35px;
  align-items: center;
  gap: 8px;
  font-size: 0.68rem;
  text-align: center;
}

.match-stat-bar {
  display: flex;
  height: 7px;
  border-radius: 999px;
  overflow: hidden;
  background: rgba(255,255,255,0.06);
}

.match-stat-bar .home {
  width: var(--home, 50%);
  background: var(--home-color, #72f6ad);
}

.match-stat-bar .away {
  flex: 1;
  background: var(--away-color, #ff6b6b);
}

.match-team-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.match-mini-team {
  padding: 9px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255,255,255,0.03);
}

.match-player-mini {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 4px 0;
  color: var(--muted);
  font-size: 0.64rem;
}

.match-player-mini span:first-child {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.match-result-card {
  max-width: 680px;
  margin: 30px auto;
  padding: 24px 16px;
  background: var(--panel);
  border: 1px solid var(--line-strong);
  border-radius: 24px;
  text-align: center;
}

.result-score {
  font-size: clamp(2.4rem, 12vw, 4.5rem);
  font-weight: 950;
  margin: 18px 0 8px;
}

.result-teams {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 12px;
  align-items: center;
}

.result-team {
  display: grid;
  justify-items: center;
  gap: 8px;
}

.result-team .club-badge {
  width: 62px;
  height: 62px;
}

.empty-state {
  padding: 28px 16px;
  text-align: center;
  color: var(--muted);
}

.empty-icon {
  font-size: 2rem;
  margin-bottom: 8px;
}

.toast-root {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: calc(82px + var(--safe-bottom));
  z-index: 200;
  display: grid;
  justify-items: center;
  pointer-events: none;
}

.toast {
  max-width: 440px;
  width: fit-content;
  padding: 11px 13px;
  border-radius: 12px;
  background: #f2fff8;
  color: #092017;
  font-size: 0.77rem;
  font-weight: 850;
  box-shadow: 0 10px 28px rgba(0,0,0,0.38);
  animation: toast-in 0.22s ease both;
}

@keyframes toast-in {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.hidden { display: none !important; }

.text-success { color: var(--success); }
.text-danger { color: var(--danger); }
.text-warn { color: var(--warn); }
.text-accent { color: var(--accent); }
.text-muted { color: var(--muted); }
.text-right { text-align: right; }

@media (min-width: 600px) {
  .setup-grid {
    grid-template-columns: 240px 1fr;
  }

  .club-picker {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .kpi-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .two-col {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .three-col {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .training-grid {
    grid-template-columns: repeat(2, minmax(0,1fr));
  }

  .squad-toolbar,
  .transfer-toolbar,
  .league-toolbar {
    grid-template-columns: minmax(220px, 1fr) auto;
    align-items: center;
  }

  .player-card-grid {
    grid-template-columns: minmax(260px, 0.8fr) minmax(0, 1.2fr);
  }

  .attribute-groups {
    grid-template-columns: repeat(2, minmax(0,1fr));
  }

  .contract-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (min-width: 900px) {
  .game-layout {
    display: grid;
    grid-template-columns: 225px minmax(0,1fr);
    grid-template-rows: auto 1fr;
    padding-bottom: 0;
  }

  .topbar {
    grid-column: 1 / -1;
    padding-left: 18px;
    padding-right: 18px;
  }

  .date-pill {
    display: block;
  }

  .desktop-sidebar {
    display: block;
    position: sticky;
    top: 67px;
    height: calc(100vh - 67px);
    overflow: auto;
    padding: 14px 10px 20px;
    border-right: 1px solid var(--line);
    background: rgba(5,18,13,0.66);
  }

  .side-nav {
    display: grid;
    gap: 4px;
  }

  .side-btn {
    min-height: 42px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    cursor: pointer;
    font-size: 0.78rem;
    font-weight: 820;
    text-align: left;
  }

  .side-btn.active {
    background: rgba(114,246,173,0.11);
    color: var(--accent);
  }

  .side-divider {
    height: 1px;
    background: var(--line);
    margin: 8px 4px;
  }

  .main-content {
    padding: 20px 20px 38px;
  }

  .bottom-nav {
    display: none;
  }

  .dashboard-grid {
    grid-template-columns: minmax(0,1.25fr) minmax(300px,0.75fr);
    align-items: start;
  }

  .dashboard-main,
  .dashboard-side {
    display: grid;
    gap: 12px;
  }

  .four-col {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .tactics-layout {
    grid-template-columns: minmax(430px, 0.9fr) minmax(340px, 1.1fr);
    align-items: start;
  }

  .tactics-pitch {
    max-height: 710px;
  }

  .training-grid {
    grid-template-columns: repeat(3, minmax(0,1fr));
  }

  .modal-backdrop {
    align-items: center;
    padding: 24px;
  }

  .modal-card {
    max-width: 780px;
    max-height: calc(100vh - 48px);
    border-radius: 22px;
  }

  .match-layout {
    grid-template-columns: minmax(480px, 0.9fr) minmax(300px, 0.55fr);
    align-items: start;
  }

  .match-pitch {
    aspect-ratio: 0.72;
    min-height: 620px;
    max-height: calc(100vh - 122px);
  }

  .match-side {
    max-height: calc(100vh - 95px);
    overflow: auto;
  }

  .commentary-box {
    max-height: 300px;
  }

  .toast-root {
    bottom: 22px;
  }
}

@media (min-width: 1180px) {
  .game-layout {
    grid-template-columns: 250px minmax(0,1fr);
  }

  .main-content {
    padding-left: 26px;
    padding-right: 26px;
  }

function hashString(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i += 1) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function mulberry32(seed) {
  return function random() {
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function rngFor(key) {
  return mulberry32(hashString(String(key)));
}

function rand(min, max, rng = Math.random) {
  return Math.floor(rng() * (max - min + 1)) + min;
}

function randFloat(min, max, rng = Math.random) {
  return rng() * (max - min) + min;
}

function choose(array, rng = Math.random) {
  return array[Math.floor(rng() * array.length)];
}

function shuffle(array, rng = Math.random) {
  const copy = [...array];
  for (let i = copy.length - 1; i > 0; i -= 1) {
    const j = Math.floor(rng() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function sum(values) {
  return values.reduce((total, value) => total + value, 0);
}

function average(values) {
  return values.length ? sum(values) / values.length : 0;
}

function formatMoney(value, compact = false) {
  const sign = value < 0 ? '-' : '';
  const abs = Math.abs(value);
  if (compact) {
    if (abs >= 1e9) return `${sign}£${(abs / 1e9).toFixed(1)}bn`;
    if (abs >= 1e6) return `${sign}£${(abs / 1e6).toFixed(abs >= 1e7 ? 1 : 2)}m`;
    if (abs >= 1e3) return `${sign}£${Math.round(abs / 1e3)}k`;
  }
  return `${sign}£${Math.round(abs).toLocaleString('en-GB')}`;
}

function formatDate(timestamp, includeYear = true) {
  const options = { weekday: 'short', day: 'numeric', month: 'short' };
  if (includeYear) options.year = 'numeric';
  return new Date(timestamp).toLocaleDateString('en-GB', options);
}

function initials(name) {
  return name.split(/\s+/).map(part => part[0]).join('').slice(0, 3).toUpperCase();
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
}

function ratingColour(rating) {
  if (rating >= 80) return '#72f6ad';
  if (rating >= 70) return '#ffd166';
  if (rating >= 60) return '#67b7ff';
  return '#ff8f8f';
}

function attributeClass(score) {
  if (score >= 16) return 'elite';
  if (score >= 12) return 'good';
  if (score <= 7) return 'poor';
  return '';
}

function positionGroup(position) {
  if (position === 'GK') return 'gk';
  if (['RB','LB','CB','WB'].includes(position)) return 'df';
  if (['DM','CM','AM','RW','LW'].includes(position)) return 'mf';
  return 'fw';
}

function createClubBadge(club, extra = '') {

}

function createRatingBubble(rating) {
  return `<div class="rating-bubble" style="--rating:${rating};--rating-color:${ratingColour(rating)}"><span>${rating}</span></div>`;
}

function playerOverallFromAttributes(position, attrs) {
  const weights = {
    GK: ['positioning','decisions','anticipation','agility','jumping','composure','firstTouch','passing'],
    CB: ['tackling','positioning','heading','strength','anticipation','jumping','decisions','composure'],
    RB: ['pace','stamina','crossing','tackling','positioning','workRate','acceleration','passing'],
    LB: ['pace','stamina','crossing','tackling','positioning','workRate','acceleration','passing'],
    WB: ['pace','stamina','crossing','workRate','acceleration','dribbling','tackling','passing'],
    DM: ['tackling','positioning','passing','decisions','teamwork','anticipation','strength','composure'],
    CM: ['passing','firstTouch','decisions','vision','teamwork','stamina','technique','workRate'],
    AM: ['passing','vision','firstTouch','technique','dribbling','decisions','composure','finishing'],
    RW: ['pace','acceleration','dribbling','crossing','technique','firstTouch','finishing','agility'],
    LW: ['pace','acceleration','dribbling','crossing','technique','firstTouch','finishing','agility'],
    ST: ['finishing','composure','firstTouch','pace','acceleration','heading','anticipation','strength']
  };
  return Math.round(average(weights[position].map(key => attrs[key])) * 5);
}

function derivePlayerValue(player) {
  const ageCurve = player.age <= 21 ? 1.28 : player.age <= 25 ? 1.18 : player.age <= 29 ? 1 : player.age <= 32 ? 0.73 : 0.42;
  const potentialPremium = 1 + Math.max(0, player.potential - player.overall) / 70;
  const divisionFactor = [1.55, 0.9, 0.48, 0.25][state ? state.clubs[player.clubId]?.division ?? 3 : 3];
  return Math.max(25000, Math.round(Math.pow(player.overall / 10, 4.7) * 1400 * ageCurve * potentialPremium * divisionFactor / 10000) * 10000);
}

function createAttributes(base, position, rng) {
  const attrs = {};
  Object.values(ATTRIBUTE_GROUPS).flat().forEach(key => {
    attrs[key] = clamp(Math.round(base / 5 + rand(-4, 4, rng)), 3, 20);
  });
  const boost = (keys, amount = 3) => keys.forEach(key => { attrs[key] = clamp(attrs[key] + rand(1, amount, rng), 3, 20); });
  const lower = (keys, amount = 3) => keys.forEach(key => { attrs[key] = clamp(attrs[key] - rand(1, amount, rng), 3, 20); });

  if (position === 'GK') {
    boost(['positioning','decisions','anticipation','agility','jumping','composure'], 4);
    lower(['finishing','crossing','dribbling'], 5);
  } else if (position === 'CB') {
    boost(['tackling','positioning','heading','strength','jumping','anticipation'], 4);
    lower(['dribbling','crossing'], 3);
  } else if (['RB','LB','WB'].includes(position)) {
    boost(['pace','stamina','crossing','workRate','tackling','acceleration'], 3);
  } else if (position === 'DM') {
    boost(['tackling','positioning','passing','teamwork','anticipation','strength'], 3);
  } else if (position === 'CM') {
    boost(['passing','firstTouch','decisions','vision','stamina','teamwork'], 3);
  } else if (position === 'AM') {
    boost(['passing','vision','firstTouch','technique','dribbling','composure'], 3);
  } else if (['RW','LW'].includes(position)) {
    boost(['pace','acceleration','dribbling','crossing','technique','agility'], 4);
    lower(['tackling','heading'], 2);
  } else if (position === 'ST') {
    boost(['finishing','composure','firstTouch','pace','heading','anticipation','strength'], 4);
    lower(['tackling','positioning'], 3);
  }
  attrs.fitness = clamp(rand(13, 20, rng), 3, 20);
  return attrs;
}

function createPlayer(id, club, position, index, rng) {
  const divisionBase = [74, 67, 60, 54][club.division];
  const ageRoll = rng();
  const age = ageRoll < 0.18 ? rand(17, 21, rng) : ageRoll < 0.78 ? rand(22, 29, rng) : rand(30, 35, rng);
  let target = divisionBase + rand(-7, 7, rng) + Math.round(club.reputation / 18) - 3;
  if (index < 2) target += rand(2, 5, rng);
  const attrs = createAttributes(target, position, rng);
  const overall = clamp(playerOverallFromAttributes(position, attrs), 38, 91);
  const potential = clamp(overall + (age <= 21 ? rand(5, 18, rng) : age <= 25 ? rand(1, 10, rng) : rand(-2, 3, rng)), overall, 94);
  const player = {
    id,
    clubId: club.id,
    firstName: choose(FIRST_NAMES, rng),
    lastName: choose(LAST_NAMES, rng),
    age,
    nationality: rng() < 0.76 ? 'English' : choose(NATIONALITIES, rng),
    position,
    secondary: generateSecondaryPositions(position, rng),
    foot: choose(FOOTED, rng),
    personality: choose(PERSONALITIES, rng),
    height: position === 'GK' || position === 'CB' ? rand(184, 199, rng) : rand(168, 191, rng),
    attributes: attrs,
    overall,
    potential,
    fitness: rand(88, 100, rng),
    sharpness: rand(68, 96, rng),
    morale: rand(62, 92, rng),
    form: randFloat(6.2, 7.3, rng),
    wage: Math.round((Math.pow(overall, 3.1) * [3.4, 1.85, 0.95, 0.52][club.division]) / 1000) * 100,
    contractYears: rand(1, 5, rng),
    squadStatus: index < 13 ? 'First Team' : index < 19 ? 'Rotation' : 'Prospect',
    injury: null,
    suspended: 0,
    transferListed: false,
    value: 0,
    season: { appearances: 0, starts: 0, goals: 0, assists: 0, cleanSheets: 0, yellow: 0, red: 0, ratingTotal: 0, minutes: 0 },
    career: { appearances: rand(0, Math.max(0, (age - 18) * 31), rng), goals: position === 'ST' ? rand(0, Math.max(0, (age - 18) * 10), rng) : rand(0, Math.max(0, (age - 18) * 3), rng) },
    avatar: [choose(CLUB_COLOURS, rng)[0], choose(CLUB_COLOURS, rng)[1]]
  };
  return player;
}

function generateSecondaryPositions(position, rng) {
  const map = {
    GK: [], CB: ['DM'], RB: ['WB','CB'], LB: ['WB','CB'], WB: ['RB','LB','RW','LW'], DM: ['CM','CB'], CM: ['DM','AM'], AM: ['CM','RW','LW'], RW: ['LW','AM','ST'], LW: ['RW','AM','ST'], ST: ['AM','RW','LW']
  };
  const options = map[position] || [];
  if (!options.length || rng() < 0.3) return [];
  return rng() < 0.72 ? [choose(options, rng)] : shuffle(options, rng).slice(0, 2);
}

function createClub(id, name, division, indexInDivision, rng) {
  const colours = CLUB_COLOURS[id % CLUB_COLOURS.length];
  const divBase = [82, 69, 58, 49][division];
  const reputation = clamp(divBase + rand(-7, 7, rng) + Math.round((15 - indexInDivision) / 4), 35, 92);
  const stadiumCapacity = Math.round(([34000, 19500, 11200, 7200][division] * randFloat(0.72, 1.35, rng)) / 100) * 100;
  const balance = Math.round(([38000000, 12500000, 4300000, 1800000][division] * randFloat(0.55, 1.5, rng)) / 10000) * 10000;
  const transferBudget = Math.round(balance * randFloat(0.12, 0.28, rng) / 10000) * 10000;

    name,
    short: initials(name).slice(0, 3),
    division,
    colours,
    reputation,
    stadium: `${name.split(' ')[0]} Park`,

    transferBudget,

    sponsorship: Math.round(([26000000, 8500000, 2600000, 950000][division] * randFloat(0.72, 1.3, rng)) / 10000) * 10000,
    facilities: { training: rand(4, 9, rng) - division, youth: rand(3, 9, rng) - division, scouting: rand(3, 9, rng) - Math.floor(division / 2), stadium: rand(3, 8, rng) },
    boardConfidence: rand(52, 82, rng),

    history: { titles: rand(0, division === 0 ? 8 : 3, rng), bestFinish: rand(1, 16, rng), founded: rand(1878, 1914, rng) },

  return { p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 };

function defaultTactics() {

    formation: '4-2-3-1',
    mentality: 'Balanced',
    tempo: 55,
    pressing: 58,
    width: 52,
    defensiveLine: 54,

    focus: 'Balanced',
    timeWasting: 15,
    lineup: [],
    bench: []
  };
}

function buildRoundRobin(clubIds) {
  const teams = [...clubIds];
  if (teams.length % 2) teams.push(null);
  const rounds = [];
  const n = teams.length;
  let rotation = [...teams];
  for (let round = 0; round < n - 1; round += 1) {
    const matches = [];
    for (let i = 0; i < n / 2; i += 1) {
      const a = rotation[i];
      const b = rotation[n - 1 - i];
      if (a !== null && b !== null) {
        const flip = (round + i) % 2 === 0;
        matches.push({ homeId: flip ? a : b, awayId: flip ? b : a });
      }
    }
    rounds.push(matches);
    rotation = [rotation[0], rotation[n - 1], ...rotation.slice(1, n - 1)];
  }
  const reverse = rounds.map(round => round.map(match => ({ homeId: match.awayId, awayId: match.homeId })));
  return [...rounds, ...reverse];
}

function generateWorld(seed = Date.now()) {
  const rng = mulberry32(Number(seed) || Date.now());
  const clubs = {};
  const players = {};
  const divisions = {};
  let playerCounter = 1;

  DIVISIONS.forEach((division, divIndex) => {
    divisions[divIndex] = { ...division, clubs: [], fixtures: [] };
    for (let i = 0; i < 16; i += 1) {
      const id = divIndex * 16 + i;
      const club = createClub(id, CLUB_NAMES[id], divIndex, i, rng);
      club.tactics = defaultTactics();
      clubs[id] = club;
      divisions[divIndex].clubs.push(id);
    }
  });

  Object.values(clubs).forEach(club => {
    POSITION_PLAN.forEach((position, index) => {
      const player = createPlayer(playerCounter, club, position, index, rng);
      players[playerCounter] = player;
      club.squad.push(playerCounter);
      playerCounter += 1;
    });
  });

  // Generate a useful free-agent pool.
  for (let i = 0; i < 90; i += 1) {
    const fakeClub = { id: null, division: rand(1, 3, rng), reputation: rand(42, 69, rng) };
    const player = createPlayer(playerCounter, fakeClub, choose(POSITION_PLAN, rng), 12, rng);
    player.clubId = null;
    player.wage = Math.round(player.wage * 0.82 / 100) * 100;
    players[playerCounter] = player;
    playerCounter += 1;
  }

  Object.values(players).forEach(player => { player.value = derivePlayerValueWithWorld(player, clubs); });
  Object.values(clubs).forEach(club => {
    autoPickLineup(club, players);
    club.rivals = findRivals(club, clubs);
  });
  Object.values(divisions).forEach(division => { division.fixtures = buildRoundRobin(division.clubs); });

  return { clubs, players, divisions, nextPlayerId: playerCounter };
}

function derivePlayerValueWithWorld(player, clubs) {
  const ageCurve = player.age <= 21 ? 1.28 : player.age <= 25 ? 1.18 : player.age <= 29 ? 1 : player.age <= 32 ? 0.73 : 0.42;
  const potentialPremium = 1 + Math.max(0, player.potential - player.overall) / 70;
  const division = player.clubId === null ? 2 : clubs[player.clubId].division;
  const divisionFactor = [1.7, 0.92, 0.5, 0.28][division];
  return Math.max(25000, Math.round(Math.pow(player.overall / 10, 4.75) * 1500 * ageCurve * potentialPremium * divisionFactor / 10000) * 10000);
}

function findRivals(club, clubs) {
  return Object.values(clubs)
    .filter(other => other.id !== club.id && other.division === club.division)
    .sort((a, b) => Math.abs(a.reputation - club.reputation) - Math.abs(b.reputation - club.reputation))
    .slice(0, 2)
    .map(other => other.id);
}

function suitability(player, slot) {
  if (!player) return 0;
  if (player.position === slot) return 1;
  if (player.secondary.includes(slot)) return 0.88;
  const compatible = {
    WB: ['RB','LB','RW','LW'], RB: ['WB','CB'], LB: ['WB','CB'], CB: ['RB','LB','DM'],
    DM: ['CM','CB'], CM: ['DM','AM'], AM: ['CM','RW','LW','ST'], RW: ['LW','AM','ST','WB'], LW: ['RW','AM','ST','WB'], ST: ['AM','RW','LW']
  };
  return compatible[slot]?.includes(player.position) ? 0.72 : player.position === 'GK' || slot === 'GK' ? 0.18 : 0.48;
}

function autoPickLineup(club, players) {
  const formation = FORMATIONS[club.tactics.formation];
  const available = club.squad.map(id => players[id]).filter(player => player && !player.injury && player.suspended <= 0);
  const used = new Set();
  const lineup = formation.map(position => {
    const candidate = available
      .filter(player => !used.has(player.id))
      .sort((a, b) => (b.overall * suitability(b, position.slot) * (b.fitness / 100)) - (a.overall * suitability(a, position.slot) * (a.fitness / 100)))[0];
    if (candidate) used.add(candidate.id);
    return candidate?.id ?? null;
  });
  const bench = available.filter(player => !used.has(player.id)).sort((a, b) => b.overall - a.overall).slice(0, 9).map(player => player.id);
  club.tactics.lineup = lineup;
  club.tactics.bench = bench;
}

function migrateLoadedState(loaded) {
  if (!loaded || !loaded.clubs || !loaded.players) throw new Error('Invalid save data');
  loaded.version = APP_VERSION;
  loaded.settings ||= { autosave: true, reducedMotion: false, matchSpeed: 2 };
  loaded.training ||= { focus: 'balanced', intensity: 55, restDay: true, individual: {} };
  loaded.scouting ||= { assignments: [], reports: {}, shortlist: [] };
  loaded.transfers ||= { history: [], incomingOffers: [], negotiations: [] };
  loaded.inbox ||= [];
  loaded.news ||= [];
  loaded.achievements ||= [];
  loaded.records ||= { biggestWin: null, biggestLoss: null, highestAttendance: 0, topScorer: null };
  loaded.seasonComplete ||= false;
  Object.values(loaded.clubs).forEach(club => {
    club.table ||= blankTable();
    club.form ||= [];
    club.finances ||= { weeklyRevenue: 0, weeklyCosts: 0, seasonIncome: 0, seasonCosts: 0 };
    club.tactics ||= defaultTactics();
    club.facilities ||= { training: 4, youth: 4, scouting: 4, stadium: 4 };
  });
  Object.values(loaded.players).forEach(player => {
    player.season ||= { appearances: 0, starts: 0, goals: 0, assists: 0, cleanSheets: 0, yellow: 0, red: 0, ratingTotal: 0, minutes: 0 };
    player.secondary ||= [];
    player.sharpness ??= 80;
    player.morale ??= 75;
    player.form ??= 6.7;
    player.suspended ??= 0;
  });
  return loaded;
}

function loadGame() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw) return false;
  try {
    state = migrateLoadedState(JSON.parse(raw));
    applyOfflineProgress();
    return true;
  } catch (error) {
    console.error('Unable to load save:', error);
    return false;
  }
}

function applyOfflineProgress() {
  const elapsedHours = clamp((Date.now() - (state.lastSavedAt || Date.now())) / 3600000, 0, 168);
  if (elapsedHours < 1) return;
  const club = userClub();
  const recovery = Math.min(18, elapsedHours * 0.22);
  clubPlayers(club).forEach(player => {
    if (!player.injury) player.fitness = clamp(player.fitness + recovery, 0, 100);
    player.sharpness = clamp(player.sharpness - elapsedHours * 0.025, 50, 100);
  });
  Object.keys(state.scouting.reports).forEach(id => {
    state.scouting.reports[id] = clamp(state.scouting.reports[id] + elapsedHours * (0.35 + club.facilities.scouting * 0.08), 0, 100);
  });
  const passive = Math.round(elapsedHours * (club.sponsorship / 52 / 168) * 0.3);
  club.balance += passive;
  if (elapsedHours >= 6) {
    state.inbox.unshift(createMessage('Club operations continued', `While you were away for ${Math.floor(elapsedHours)} hours, players recovered fitness, scouting reports progressed and the club generated ${formatMoney(passive, true)} in commercial income. No competitive fixtures were played automatically.`, 'Club Secretary', true));
  }
}

function exportSave() {
  saveGame(false);

  const url = URL.createObjectURL(blob);
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = `touchline-dynasty-season-${state.season}-week-${state.week + 1}.json`;
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  URL.revokeObjectURL(url);
}

            ${readinessRows(club)}

          </div>

        </section>

}

function getDayPart() {
  const hour = new Date().getHours();
  return hour < 12 ? 'morning' : hour < 18 ? 'afternoon' : 'evening';
}

function ordinalSuffix(value) {
  const mod100 = value % 100;
  if (mod100 >= 11 && mod100 <= 13) return 'th';
  return ({ 1: 'st', 2: 'nd', 3: 'rd' })[value % 10] || 'th';
}

function readinessRows(club) {
  const lineup = club.tactics.lineup.map(playerById).filter(Boolean);
  const fitness = Math.round(average(lineup.map(player => player.fitness)));
  const morale = Math.round(average(lineup.map(player => player.morale)));
  const sharpness = Math.round(average(lineup.map(player => player.sharpness)));
  const cohesion = tacticalCohesion(club);
  return [
    ['Starting XI fitness', fitness], ['Morale', morale], ['Match sharpness', sharpness], ['Tactical cohesion', cohesion]
  ].map(([label, value]) => `<div style="margin-bottom:12px"><div class="finance-bar-head"><span>${label}</span><strong>${value}%</strong></div><div class="progress ${value < 65 ? 'danger' : value < 78 ? 'warn' : ''}"><span style="--value:${value}%"></span></div></div>`).join('');
}

function tacticalCohesion(club) {
  const lineup = club.tactics.lineup.map(playerById).filter(Boolean);
  if (!lineup.length) return 0;
  const suitabilityScore = average(FORMATIONS[club.tactics.formation].map((slot, index) => suitability(playerById(club.tactics.lineup[index]), slot.slot)));
  return clamp(Math.round(55 + suitabilityScore * 36 + average(lineup.map(player => player.morale)) / 12), 45, 99);
}

function playerRow(player, selected = false) {
  const injuryText = player.injury ? ` · ${player.injury.type} (${player.injury.weeks}w)` : player.suspended > 0 ? ` · Suspended ${player.suspended}` : '';
  return `<div class="player-row ${selected ? 'selected' : ''}" data-action="open-player" data-player-id="${player.id}"><div class="position-badge ${positionGroup(player.position)}">${player.position}</div><div><div class="player-name">${escapeHtml(player.firstName)} ${escapeHtml(player.lastName)}</div><div class="player-meta">${player.age} · ${escapeHtml(player.nationality)} · Fitness ${Math.round(player.fitness)}% · Form ${player.form.toFixed(2)}${escapeHtml(injuryText)}</div></div>${createRatingBubble(player.overall)}</div>`;
}

function renderLeagueTable(divisionId, limit = null, centreClubId = null) {
  let table = getLeagueTable(divisionId);
  if (limit && table.length > limit && centreClubId !== null) {
    const index = table.findIndex(club => club.id === centreClubId);
    const start = clamp(index - Math.floor(limit / 2), 0, table.length - limit);
    table = table.slice(start, start + limit);
  } else if (limit) table = table.slice(0, limit);
  return `<table class="data-table compact"><thead><tr><th>#</th><th>Club</th><th>P</th><th>GD</th><th>Pts</th><th>Form</th></tr></thead><tbody>${table.map(club => {
    const position = getLeaguePosition(club.id);
    return `<tr class="${club.id === state.userClubId ? 'user-row' : ''}"><td>${position}</td><td><strong>${escapeHtml(club.name)}</strong></td><td>${club.table.p}</td><td>${club.table.gd > 0 ? '+' : ''}${club.table.gd}</td><td><strong>${club.table.pts}</strong></td><td>${renderFormDots(club.form.slice(-5))}</td></tr>`;
  }).join('')}</tbody></table>`;
}

function renderFormDots(form) {
  return `<div class="form-dots">${form.map(result => `<span class="form-dot ${result.toLowerCase()}">${result}</span>`).join('')}</div>`;
}

function renderSegment(title, key, options, current) {
  return `<div class="control-card"><div class="control-card-title">${title}</div><div class="segmented" style="--segments:${options.length}">${options.map(option => `<button class="segment-btn ${current === option ? 'active' : ''}" data-action="tactic-segment" data-key="${key}" data-value="${option}">${option}</button>`).join('')}</div></div>`;
}

function renderRange(title, key, value, low, high) {
  return `<div class="control-card"><div class="control-card-title">${title}</div><div class="range-wrap"><div class="range-meta"><span>${low}</span><strong>${value}</strong><span>${high}</span></div><input type="range" min="0" max="100" value="${value}" data-range="tactic" data-key="${key}" /></div></div>`;
}

function renderTacticalAnalysis(club) {
  const lineup = club.tactics.lineup.map(playerById).filter(Boolean);
  const attack = Math.round(teamUnitRating(lineup, 'attack', club.tactics));
  const midfield = Math.round(teamUnitRating(lineup, 'midfield', club.tactics));
  const defence = Math.round(teamUnitRating(lineup, 'defence', club.tactics));
  const fit = Math.round(average(lineup.map(player => player.fitness)));
  const risks = [];
  if (club.tactics.defensiveLine > 72 && average(lineup.filter(player => positionGroup(player.position) === 'df').map(player => player.attributes.pace)) < 13) risks.push('A high line may expose slower defenders.');
  if (club.tactics.pressing > 75) risks.push('Intense pressing will drain fitness quickly.');
  if (club.tactics.tempo > 78 && club.tactics.passing === 'Short') risks.push('High tempo and short passing increase turnover risk.');
  if (lineup.some((player, index) => suitability(player, FORMATIONS[club.tactics.formation][index].slot) < 0.7)) risks.push('At least one starter is significantly out of position.');
  return `${[['Attack',attack],['Midfield',midfield],['Defence',defence],['Fitness',fit]].map(([label,value]) => `<div style="margin-bottom:11px"><div class="finance-bar-head"><span>${label}</span><strong>${value}</strong></div><div class="progress ${value < 65 ? 'danger' : value < 75 ? 'warn' : ''}"><span style="--value:${value}%"></span></div></div>`).join('')}<div class="page-description">${risks.length ? risks.join(' ') : 'The current setup is structurally balanced with no major tactical warnings.'}</div>`;
}

function teamUnitRating(lineup, unit, tactics = defaultTactics()) {
  if (!lineup.length) return 50;
  const groups = {
    attack: lineup.filter(player => ['ST','AM','RW','LW'].includes(player.position)),
    midfield: lineup.filter(player => ['DM','CM','AM','RW','LW'].includes(player.position)),
    defence: lineup.filter(player => ['GK','CB','RB','LB','WB','DM'].includes(player.position))
  };
  const selected = groups[unit].length ? groups[unit] : lineup;
  let rating = average(selected.map(player => player.overall * (0.7 + player.fitness / 333) * (0.88 + player.morale / 833)));
  if (unit === 'attack') rating += (tactics.mentality === 'Attacking' ? 4 : tactics.mentality === 'Positive' ? 2 : tactics.mentality === 'Defensive' ? -4 : 0) + (tactics.tempo - 50) / 18;
  if (unit === 'midfield') rating += tactics.passing === 'Short' ? 2 : tactics.passing === 'Direct' ? -1 : 0;
  if (unit === 'defence') rating += (tactics.mentality === 'Defensive' ? 4 : tactics.mentality === 'Cautious' ? 2 : tactics.mentality === 'Attacking' ? -3 : 0);
  return clamp(rating, 35, 95);
}

function renderTransfers() {
  const tab = ui.subview.transferTab || 'market';
  const position = ui.subview.transferPosition || 'All';
  const query = (ui.subview.transferQuery || '').toLowerCase();

  const tabs = [['market','Player search'],['shortlist','Shortlist'],['listed','Transfer listed'],['activity','Activity']];
  let content = '';
  if (tab === 'activity') {
    content = renderTransferActivity();
  } else {
    let pool = Object.values(state.players).filter(player => player.clubId !== state.userClubId);
    if (tab === 'shortlist') pool = pool.filter(player => state.scouting.shortlist.includes(player.id));
    if (tab === 'listed') pool = pool.filter(player => player.transferListed || player.clubId === null);
    pool = pool.filter(player => (position === 'All' || positionGroup(player.position).toUpperCase() === position || player.position === position) && `${player.firstName} ${player.lastName} ${player.position} ${player.nationality}`.toLowerCase().includes(query));
    pool = pool.sort((a, b) => {
      const aListed = a.transferListed || a.clubId === null ? 1 : 0;
      const bListed = b.transferListed || b.clubId === null ? 1 : 0;

    }).slice(0, 60);
    content = `<div class="transfer-toolbar"><input class="input" placeholder="Search name, position or nationality" value="${escapeHtml(ui.subview.transferQuery || '')}" data-input="transfer-query" /><select class="select" data-change="transfer-position"><option>All</option><option>GK</option><option>DF</option><option>MF</option><option>FW</option></select></div><div class="chip-group" style="margin-bottom:12px">${['All','GK','DF','MF','FW'].map(item => `<button class="chip ${position === item ? 'active' : ''}" data-action="transfer-position" data-position="${item}">${item}</button>`).join('')}</div><div class="three-col">${pool.map(player => renderTransferCard(player)).join('')}</div>${pool.length ? '' : '<div class="empty-state"><div class="empty-icon">🔎</div>No matching players found.</div>'}`;

    <section class="panel"><div class="panel-body">${content}</div></section>`;
}

function renderTraining() {

      <div>

        <section class="panel"><div class="panel-head"><div><h2 class="panel-title">Development watch</h2><div class="panel-subtitle">Highest-potential players</div></div></div><div class="panel-body"><div class="player-list">${clubPlayers(club).sort((a,b) => (b.potential-b.overall) - (a.potential-a.overall)).slice(0,5).map(player => playerRow(player)).join('')}</div></div></section>

function renderFinances() {
  const club = userClub();
  const wageBill = clubWageBill(club);
  const weeklySponsor = club.sponsorship / 52;
  const gateEstimate = club.attendance * ticketPriceForDivision(club.division);
  const weeklyCosts = wageBill + club.stadiumCapacity * 8 + (club.facilities.training + club.facilities.youth + club.facilities.scouting) * 18000;
  const facilityData = [
    ['training','Training facilities','Improves player development and lowers injury risk.'],
    ['youth','Youth academy','Raises the quality of annual academy graduates.'],
    ['scouting','Scouting network','Speeds reports and expands recruitment knowledge.'],
    ['stadium','Stadium infrastructure','Raises matchday income and future capacity.']
  ];
  return `
    ${pageHeader('Boardroom', 'Finances', 'Control budgets, monitor cash flow and invest in the club’s long-term infrastructure.')}
    <div class="kpi-grid" style="margin-bottom:12px"><div class="kpi-card"><div class="kpi-label">Club balance</div><div class="kpi-value ${club.balance < 0 ? 'text-danger' : ''}">${formatMoney(club.balance, true)}</div><div class="kpi-note">Season net ${formatMoney(club.finances.seasonIncome - club.finances.seasonCosts, true)}</div></div><div class="kpi-card"><div class="kpi-label">Transfer budget</div><div class="kpi-value">${formatMoney(club.transferBudget, true)}</div><div class="kpi-note">Available immediately</div></div><div class="kpi-card"><div class="kpi-label">Wage budget</div><div class="kpi-value">${formatMoney(wageBill, true)}</div><div class="kpi-note">of ${formatMoney(club.wageBudget, true)}</div></div><div class="kpi-card"><div class="kpi-label">Projected weekly</div><div class="kpi-value ${(weeklySponsor + gateEstimate - weeklyCosts) < 0 ? 'text-danger' : 'text-success'}">${formatMoney(weeklySponsor + gateEstimate - weeklyCosts, true)}</div><div class="kpi-note">At current attendance</div></div></div>
    <div class="two-col">
      <section class="panel"><div class="panel-head"><div><h2 class="panel-title">Budget overview</h2><div class="panel-subtitle">Current commitments</div></div></div><div class="panel-body"><div class="finance-bars">
        ${renderBudgetBar('Wage utilisation', wageBill, club.wageBudget)}
        ${renderBudgetBar('Transfer budget vs balance', club.transferBudget, Math.max(club.balance, 1))}
        ${renderBudgetBar('Average attendance', club.attendance, club.stadiumCapacity, false)}
      </div><div style="margin-top:16px">${[['Sponsorship / week',formatMoney(weeklySponsor)],['Estimated gate receipts',formatMoney(gateEstimate)],['Player wages',formatMoney(wageBill)],['Operations and facilities',formatMoney(weeklyCosts-wageBill)]].map(([label,value]) => `<div class="stat-row"><span class="stat-label">${label}</span><span class="stat-value">${value}</span></div>`).join('')}</div><div class="btn-row" style="margin-top:14px"><button class="btn btn-secondary btn-small" data-action="adjust-budget">Adjust budgets</button></div></div></section>
      <section class="panel"><div class="panel-head"><div><h2 class="panel-title">Facilities</h2><div class="panel-subtitle">Permanent club improvements</div></div></div><div class="panel-body"><div style="display:grid;gap:9px">${facilityData.map(([key,name,desc]) => {
        const level = club.facilities[key];
        const cost = facilityUpgradeCost(key, level, club.division);
        return `<div class="facility-card"><div class="facility-top"><div><div class="facility-name">${name}</div><div class="page-description" style="margin-top:3px">Level ${level}/10 · ${desc}</div></div><button class="btn btn-secondary btn-small" data-action="upgrade-facility" data-facility="${key}" ${level >= 10 || club.balance < cost ? 'disabled' : ''}>${level >= 10 ? 'Max' : formatMoney(cost, true)}</button></div></div>`;
      }).join('')}</div></div></section>
    </div>`;
}

function renderBudgetBar(label, value, max, money = true) {
  const pct = clamp(Math.round(value / Math.max(max, 1) * 100), 0, 130);
  return `<div><div class="finance-bar-head"><span>${label}</span><strong>${money ? `${formatMoney(value, true)} / ${formatMoney(max, true)}` : `${Math.round(value).toLocaleString('en-GB')} / ${Math.round(max).toLocaleString('en-GB')}`}</strong></div><div class="progress ${pct > 100 ? 'danger' : pct > 88 ? 'warn' : ''}"><span style="--value:${Math.min(pct,100)}%"></span></div></div>`;
}

function ticketPriceForDivision(division) {
  return [42, 29, 21, 16][division];
}

function facilityUpgradeCost(key, level, division) {
  const base = { training: 1800000, youth: 1500000, scouting: 900000, stadium: 2400000 }[key];
  return Math.round(base * Math.pow(1.58, level - 1) * [1,0.68,0.42,0.28][division] / 10000) * 10000;
}

function renderLeague() {
  const divisionId = Number(ui.subview.leagueDivision ?? userClub().division);
  const tab = ui.subview.leagueTab || 'table';
  const division = divisionById(divisionId);
  const tabs = [['table','Table'],['fixtures','Fixtures'],['stats','Player stats']];

  if (tab === 'table') {
    content = `<div class="table-wrap">${renderLeagueTable(divisionId)}</div><div class="panel-body"><p class="page-description"><span class="text-success">Top two</span> are promoted automatically. Clubs in 3rd–6th enter the promotion play-offs. The bottom three are relegated, except in National League Two.</p></div>`;
  } else if (tab === 'fixtures') {
    content = renderFixturesList(divisionId);

    <div class="league-toolbar"><div class="mobile-tabs">${DIVISIONS.map(item => `<button class="tab-btn ${divisionId === item.id ? 'active' : ''}" data-action="league-division" data-division="${item.id}">${item.short}</button>`).join('')}</div><div class="mobile-tabs">${tabs.map(([key,label]) => `<button class="tab-btn ${tab === key ? 'active' : ''}" data-action="league-tab" data-tab="${key}">${label}</button>`).join('')}</div></div>

function renderFixturesList(divisionId) {
  const division = divisionById(divisionId);
  const start = clamp(state.week - 2, 0, 27);
  const rounds = division.fixtures.slice(start, start + 5);
  return `<div class="timeline-list">${rounds.map((round, offset) => {
    const roundIndex = start + offset;
    return `<div class="timeline-item"><div class="panel-title" style="margin-bottom:9px">Week ${roundIndex + 1}${roundIndex === state.week ? ' · Current' : ''}</div>${round.map(fixture => {
      const home = clubById(fixture.homeId); const away = clubById(fixture.awayId);
      const result = fixture.result;
      return `<div class="stat-row"><span class="stat-label"><strong>${escapeHtml(home.name)}</strong> v ${escapeHtml(away.name)}</span><span class="stat-value">${result ? `${result.homeGoals}–${result.awayGoals}` : '—'}</span></div>`;
    }).join('')}</div>`;
  }).join('')}</div>`;
}

function renderPlayerStats(divisionId) {
  const clubIds = new Set(divisionById(divisionId).clubs);
  const players = Object.values(state.players).filter(player => player.clubId !== null && clubIds.has(player.clubId));
  const scorers = players.filter(player => player.season.goals > 0).sort((a,b) => b.season.goals - a.season.goals || b.season.assists - a.season.assists).slice(0,15);
  return `<div class="table-wrap"><table class="data-table compact"><thead><tr><th>Player</th><th>Club</th><th>Apps</th><th>Goals</th><th>Assists</th><th>Rating</th></tr></thead><tbody>${scorers.map(player => `<tr class="clickable" data-action="open-player" data-player-id="${player.id}"><td><strong>${escapeHtml(player.firstName)} ${escapeHtml(player.lastName)}</strong></td><td>${escapeHtml(clubById(player.clubId).name)}</td><td>${player.season.appearances}</td><td><strong>${player.season.goals}</strong></td><td>${player.season.assists}</td><td>${player.season.appearances ? (player.season.ratingTotal / player.season.appearances).toFixed(2) : '—'}</td></tr>`).join('')}</tbody></table></div>`;
}

function renderModal() {
  const modal = ui.modal;
  let body = '';
  let title = modal.title || 'Details';
  if (modal.type === 'player') {
    const player = playerById(modal.playerId);
    title = 'Player profile';
    body = player ? renderPlayerModal(player) : '<div class="empty-state">Player unavailable.</div>';
  } else if (modal.type === 'selectPlayer') {
    const club = userClub();
    const slot = FORMATIONS[club.tactics.formation][modal.slotIndex];
    title = `Select ${slot.slot}`;
    const candidates = clubPlayers(club).filter(player => !player.injury && player.suspended <= 0).sort((a,b) => (b.overall*suitability(b,slot.slot)) - (a.overall*suitability(a,slot.slot)));
    body = `<div class="player-list">${candidates.map(player => `<div class="player-row" data-action="assign-player" data-player-id="${player.id}" data-slot-index="${modal.slotIndex}"><div class="position-badge ${positionGroup(player.position)}">${player.position}</div><div><div class="player-name">${escapeHtml(player.firstName)} ${escapeHtml(player.lastName)}</div><div class="player-meta">Suitability ${Math.round(suitability(player,slot.slot)*100)}% · Fitness ${Math.round(player.fitness)}%</div></div>${createRatingBubble(player.overall)}</div>`).join('')}</div>`;
  } else if (modal.type === 'transferOffer') {
    body = renderTransferOfferModal(playerById(modal.playerId));
    title = playerById(modal.playerId)?.clubId === null ? 'Contract offer' : 'Transfer offer';
  } else if (modal.type === 'contract') {
    body = renderContractModal(playerById(modal.playerId));
    title = 'New contract';
  } else if (modal.type === 'budget') {
    body = renderBudgetModal(); title = 'Adjust budgets';
  } else if (modal.type === 'confirmDelete') {
    body = `<p class="page-description">Delete the entire local career for ${escapeHtml(userClub().name)}? Exporting first is strongly recommended.</p><div class="btn-row" style="margin-top:16px"><button class="btn btn-danger" data-action="delete-save">Delete permanently</button><button class="btn btn-secondary" data-action="close-modal">Cancel</button></div>`; title = 'Delete career';
  }
  return `<div class="modal-backdrop" data-action="close-modal"><section class="modal-card" data-stop-propagation="true"><div class="modal-head"><h2 class="modal-title">${escapeHtml(title)}</h2><button class="btn btn-secondary btn-icon" data-action="close-modal" aria-label="Close">×</button></div><div class="modal-body">${body}</div></section></div>`;
}

function renderTransferOfferModal(player) {
  if (!player) return '<div class="empty-state">Player unavailable.</div>';
  const sellingClub = player.clubId !== null ? clubById(player.clubId) : null;
  const suggestedFee = sellingClub ? Math.round(player.value * (player.transferListed ? 0.95 : 1.18) / 10000) * 10000 : 0;
  const wage = Math.round(player.wage * (sellingClub ? 1.16 : 1.05) / 100) * 100;
  return `<div class="offer-summary"><strong>${escapeHtml(player.firstName)} ${escapeHtml(player.lastName)}</strong><div class="page-description">${sellingClub ? escapeHtml(sellingClub.name) : 'Free agent'} · Ability ${player.overall} · Value ${formatMoney(player.value,true)}</div></div><div class="contract-grid" style="margin-top:14px">${sellingClub ? `<div class="form-field"><label>Transfer fee</label><input id="offer-fee" class="input" type="number" min="0" step="10000" value="${suggestedFee}" /></div>` : ''}<div class="form-field"><label>Weekly wage</label><input id="offer-wage" class="input" type="number" min="100" step="100" value="${wage}" /></div><div class="form-field"><label>Contract length</label><select id="offer-years" class="select"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div><div class="form-field"><label>Squad role</label><select id="offer-role" class="select"><option>Prospect</option><option>Rotation</option><option selected>First Team</option><option>Star Player</option></select></div></div><div class="btn-row" style="margin-top:16px"><button class="btn btn-primary" data-action="submit-transfer-offer" data-player-id="${player.id}">Submit offer</button><button class="btn btn-secondary" data-action="close-modal">Cancel</button></div>`;
}

function renderContractModal(player) {
  if (!player) return '<div class="empty-state">Player unavailable.</div>';

}

function renderBudgetModal() {
