  return `<p class="page-description">Move available resources between transfer and wage budgets. £100,000 of transfer budget creates roughly £2,000 per week in wage capacity.</p><div class="form-field" style="margin-top:14px"><label>Transfer budget allocation</label><input id="budget-transfer" class="input" type="number" min="0" step="100000" value="${club.transferBudget}" /></div><div class="btn-row" style="margin-top:16px"><button class="btn btn-primary" data-action="submit-budget">Apply</button></div>`;
}

function lineupForClub(club) {
  if (!club.tactics?.lineup?.length || club.tactics.lineup.some(id => !id)) autoPickLineup(club, state.players);
  return club.tactics.lineup.map(playerById).filter(Boolean);
}

function calculateTeamStrength(club) {
  const lineup = lineupForClub(club);
  const tactics = club.tactics || defaultTactics();
  const attack = teamUnitRating(lineup, 'attack', tactics);
  const midfield = teamUnitRating(lineup, 'midfield', tactics);
  const defence = teamUnitRating(lineup, 'defence', tactics);
  const cohesion = tacticalCohesion(club);
  const formBoost = club.form.slice(-5).reduce((total, result) => total + (result === 'W' ? 1.3 : result === 'D' ? 0.25 : -0.7), 0);
  const morale = average(lineup.map(player => player.morale));
  return {
    attack: attack + formBoost + (morale - 70) / 10,
    midfield: midfield + formBoost * 0.65 + (cohesion - 70) / 14,
    defence: defence + formBoost * 0.45,
    overall: average([attack, midfield, defence]) + (cohesion - 70) / 12
  };
}

function poisson(lambda, rng = Math.random) {
  const limit = Math.exp(-lambda);
  let product = 1;
  let count = 0;
  do {
    count += 1;
    product *= rng();
  } while (product > limit && count < 12);
  return count - 1;
}

function simulateMatchResult(homeClub, awayClub, seedKey = `${state.season}-${state.week}-${homeClub.id}-${awayClub.id}`) {
  const rng = rngFor(seedKey);
  const home = calculateTeamStrength(homeClub);
  const away = calculateTeamStrength(awayClub);
  const homeAdvantage = 3.2;
  const homeXg = clamp(1.18 + (home.attack + home.midfield * 0.35 - away.defence * 1.05 + homeAdvantage) / 22, 0.25, 3.8);
  const awayXg = clamp(1.05 + (away.attack + away.midfield * 0.35 - home.defence * 1.05) / 22, 0.2, 3.4);
  const homeGoals = poisson(homeXg, rng);
  const awayGoals = poisson(awayXg, rng);
  const homeShots = clamp(Math.round(homeXg * 4.5 + rand(4, 10, rng)), homeGoals + 2, 26);
  const awayShots = clamp(Math.round(awayXg * 4.5 + rand(4, 10, rng)), awayGoals + 2, 24);
  return {
    homeGoals,
    awayGoals,
    stats: {
      homeShots,
      awayShots,
      homeOnTarget: clamp(Math.round(homeShots * randFloat(0.32, 0.52, rng)), homeGoals, homeShots),
      awayOnTarget: clamp(Math.round(awayShots * randFloat(0.32, 0.52, rng)), awayGoals, awayShots),
      homePossession: clamp(Math.round(50 + (home.midfield - away.midfield) * 1.1 + rand(-5, 5, rng)), 28, 72),
      homeCorners: rand(1, 10, rng),
      awayCorners: rand(1, 10, rng),
      homeFouls: rand(6, 16, rng),
      awayFouls: rand(6, 16, rng)
    },
    events: generateSimulatedScorers(homeClub, awayClub, homeGoals, awayGoals, rng)
  };
}

function weightedChoice(players, weightFn, rng = Math.random) {
  if (!players.length) return null;
  const weights = players.map(player => Math.max(0.01, weightFn(player)));
  const total = sum(weights);
  let roll = rng() * total;
  for (let i = 0; i < players.length; i += 1) {
    roll -= weights[i];
    if (roll <= 0) return players[i];
  }
  return players[players.length - 1];
}

function generateSimulatedScorers(homeClub, awayClub, homeGoals, awayGoals, rng) {
  const events = [];
  const addGoals = (club, goals, side) => {
    const lineup = lineupForClub(club);
    for (let i = 0; i < goals; i += 1) {
      const scorer = weightedChoice(lineup, player => {
        const pos = { ST: 8, RW: 5, LW: 5, AM: 4.5, CM: 2.1, DM: 1.2, WB: 1.2, RB: 0.8, LB: 0.8, CB: 0.7, GK: 0.03 }[player.position] || 1;
        return pos * (player.attributes.finishing + player.attributes.composure) * (0.5 + player.fitness / 100);
      }, rng);
      const assisterPool = lineup.filter(player => player.id !== scorer?.id);
      const assister = rng() < 0.74 ? weightedChoice(assisterPool, player => player.attributes.passing + player.attributes.vision + player.attributes.crossing, rng) : null;
      events.push({ minute: rand(3, 90, rng), side, scorerId: scorer?.id || null, assisterId: assister?.id || null, type: 'goal' });
    }
  };
  addGoals(homeClub, homeGoals, 'home');
  addGoals(awayClub, awayGoals, 'away');
  return events.sort((a, b) => a.minute - b.minute);
}

function applyResult(fixture, result, options = {}) {
  const home = clubById(fixture.homeId);
  const away = clubById(fixture.awayId);
  fixture.result = { homeGoals: result.homeGoals, awayGoals: result.awayGoals, stats: result.stats, date: state.date };
  updateTableEntry(home, result.homeGoals, result.awayGoals);
  updateTableEntry(away, result.awayGoals, result.homeGoals);

  const homeResult = result.homeGoals > result.awayGoals ? 'W' : result.homeGoals < result.awayGoals ? 'L' : 'D';
  const awayResult = homeResult === 'W' ? 'L' : homeResult === 'L' ? 'W' : 'D';
  home.form.push(homeResult); away.form.push(awayResult);
  home.form = home.form.slice(-8); away.form = away.form.slice(-8);

  processPlayerMatchStats(home, away, result, options);

  const attendance = Math.round(Math.min(home.stadiumCapacity, home.attendance * randFloat(0.88, 1.12)));
  home.attendance = Math.round(home.attendance * 0.82 + attendance * 0.18);
  if (home.id === state.userClubId) state.records.highestAttendance = Math.max(state.records.highestAttendance, attendance);

  const title = `${home.name} ${result.homeGoals}–${result.awayGoals} ${away.name}`;
  state.news.push({ title, date: state.date, type: 'result' });
  if (state.news.length > 100) state.news = state.news.slice(-100);

  if (home.id === state.userClubId || away.id === state.userClubId) {
    const userIsHome = home.id === state.userClubId;
    const gf = userIsHome ? result.homeGoals : result.awayGoals;
    const ga = userIsHome ? result.awayGoals : result.homeGoals;
    state.manager.careerMatches += 1;
    if (gf > ga) state.manager.careerWins += 1;
    updateUserRecords(home, away, gf, ga, userIsHome);
    const confidenceChange = gf > ga ? 2.2 : gf === ga ? 0.2 : -1.8;
    userClub().boardConfidence = clamp(userClub().boardConfidence + confidenceChange, 1, 100);
    lineupForClub(userClub()).forEach(player => {
      player.morale = clamp(player.morale + (gf > ga ? randFloat(1, 4) : gf < ga ? -randFloat(1, 3.5) : randFloat(-0.5, 1.5)), 20, 100);
    });
  }
}

function updateTableEntry(club, gf, ga) {
  club.table.p += 1;
  club.table.gf += gf;
  club.table.ga += ga;
  club.table.gd = club.table.gf - club.table.ga;
  if (gf > ga) { club.table.w += 1; club.table.pts += 3; }
  else if (gf === ga) { club.table.d += 1; club.table.pts += 1; }
  else club.table.l += 1;
}

function processPlayerMatchStats(homeClub, awayClub, result, options = {}) {
  const homeLineup = options.homeLineup || lineupForClub(homeClub);
  const awayLineup = options.awayLineup || lineupForClub(awayClub);
  const eventMap = result.events || [];
  const all = [...homeLineup, ...awayLineup];
  all.forEach(player => {
    player.season.appearances += 1;
    player.season.starts += 1;
    player.season.minutes += 90;
    const teamWon = (player.clubId === homeClub.id && result.homeGoals > result.awayGoals) || (player.clubId === awayClub.id && result.awayGoals > result.homeGoals);
    const teamLost = (player.clubId === homeClub.id && result.homeGoals < result.awayGoals) || (player.clubId === awayClub.id && result.awayGoals < result.homeGoals);
    const baseRating = 6.55 + (teamWon ? 0.4 : teamLost ? -0.25 : 0.05) + randFloat(-0.55, 0.55);
    player.season.ratingTotal += clamp(baseRating, 4.8, 9.2);
    player.form = clamp(player.form * 0.72 + baseRating * 0.28, 5.2, 8.6);
    player.fitness = clamp(player.fitness - randFloat(6, 14) * (1 + ((player.clubId === homeClub.id ? homeClub.tactics.pressing : awayClub.tactics.pressing) - 50) / 160), 25, 100);
    player.sharpness = clamp(player.sharpness + randFloat(1, 4), 0, 100);
  });
  eventMap.forEach(event => {
    if (event.type === 'goal' && event.scorerId) {
      const scorer = playerById(event.scorerId);
      scorer.season.goals += 1;
      scorer.season.ratingTotal += 0.55;
      scorer.form = clamp(scorer.form + 0.18, 5.2, 9.3);
    }
    if (event.type === 'goal' && event.assisterId) {
      const assister = playerById(event.assisterId);
      assister.season.assists += 1;
      assister.season.ratingTotal += 0.25;
    }
    if (event.type === 'yellow' && event.playerId) {
      const player = playerById(event.playerId);
      player.season.yellow += 1;
      if (player.season.yellow > 0 && player.season.yellow % 5 === 0) player.suspended = Math.max(player.suspended, 1);
    }
    if (event.type === 'red' && event.playerId) {
      const player = playerById(event.playerId);
      player.season.red += 1;
      player.suspended = Math.max(player.suspended, 2);
    }
    if (event.type === 'injury' && event.playerId) {
      const player = playerById(event.playerId);
      if (!player.injury) player.injury = { type: event.injuryType || choose(['Hamstring strain','Ankle sprain','Calf strain','Knee knock']), weeks: event.weeks || rand(1, 5) };
    }
  });
  if (result.homeGoals === 0) awayLineup.filter(player => player.position === 'GK' || positionGroup(player.position) === 'df').forEach(player => { player.season.cleanSheets += 1; });
  if (result.awayGoals === 0) homeLineup.filter(player => player.position === 'GK' || positionGroup(player.position) === 'df').forEach(player => { player.season.cleanSheets += 1; });
}

function updateUserRecords(home, away, gf, ga, userIsHome) {
  const opponent = userIsHome ? away : home;
  const margin = gf - ga;
  const display = `${gf}–${ga} v ${opponent.name}`;
  if (margin > 0) {
    const currentMargin = state.records.biggestWin ? Number(state.records.biggestWin.split('–')[0]) - Number(state.records.biggestWin.split('–')[1].split(' ')[0]) : -1;
    if (margin > currentMargin) state.records.biggestWin = display;
  } else if (margin < 0) {
    const currentMargin = state.records.biggestLoss ? Number(state.records.biggestLoss.split('–')[1].split(' ')[0]) - Number(state.records.biggestLoss.split('–')[0]) : -1;
    if (-margin > currentMargin) state.records.biggestLoss = display;
  }
}

function quickSimUserMatch() {
  const fixture = userFixture();
  if (!fixture) return;
  ensureValidLineup(userClub());
  const home = clubById(fixture.homeId);
  const away = clubById(fixture.awayId);
  const result = simulateMatchResult(home, away, `user-${state.season}-${state.week}-${fixture.homeId}-${fixture.awayId}-${Date.now()}`);
  applyResult(fixture, result);
  completeRound(fixture);
  const userIsHome = fixture.homeId === state.userClubId;
  const gf = userIsHome ? result.homeGoals : result.awayGoals;
  const ga = userIsHome ? result.awayGoals : result.homeGoals;
  state.inbox.unshift(createMessage('Full-time report', `${clubById(fixture.homeId).name} ${result.homeGoals}–${result.awayGoals} ${clubById(fixture.awayId).name}. ${gf > ga ? 'The board is pleased with the result.' : gf === ga ? 'The board considers the result acceptable.' : 'The board expects a response in the next fixture.'}`, 'Assistant Manager', true));
  toast(`Full time: ${result.homeGoals}–${result.awayGoals}`);
  render();
}

function completeRound(userPlayedFixture = null) {
  Object.values(state.divisions).forEach(division => {
    const round = division.fixtures[state.week] || [];
    round.forEach(fixture => {
      if (fixture.result || (userPlayedFixture && fixture === userPlayedFixture)) return;
      const result = simulateMatchResult(clubById(fixture.homeId), clubById(fixture.awayId));
      applyResult(fixture, result);
    });
  });
  processWeeklyClubOperations();
  state.week += 1;
  state.date += 7 * 24 * 60 * 60 * 1000;
  if (state.week >= 30) finishSeason();
  if (state.settings.autosave) saveGame(false);
}

function processWeeklyClubOperations() {
  Object.values(state.clubs).forEach(club => {
    const wageBill = clubWageBill(club);
    const attendance = Math.min(club.stadiumCapacity, Math.round(club.attendance * randFloat(0.9, 1.1)));
    const revenue = club.sponsorship / 52 + attendance * ticketPriceForDivision(club.division) + club.reputation * 750;
    const costs = wageBill + club.stadiumCapacity * 8 + (club.facilities.training + club.facilities.youth + club.facilities.scouting) * 18000;
    club.balance += revenue - costs;
    club.finances.weeklyRevenue = revenue;
    club.finances.weeklyCosts = costs;
    club.finances.seasonIncome += revenue;
    club.finances.seasonCosts += costs;
  });
  processTrainingWeek();
  processInjuriesAndSuspensions();
  processScoutingWeek();
  resolveNegotiations();
  generateAITransferActivity();
  updateBoardAndObjectives();
}

function processTrainingWeek() {
  const club = userClub();
  const { focus, intensity, restDay } = state.training;
  const config = TRAINING_FOCUSES[focus];
  const developmentFactor = (0.18 + intensity / 260) * (0.65 + club.facilities.training / 10) * (restDay ? 0.9 : 1);
  clubPlayers(club).forEach(player => {
    if (player.injury) return;
    const ageFactor = player.age <= 20 ? 1.8 : player.age <= 23 ? 1.35 : player.age <= 27 ? 0.82 : player.age <= 30 ? 0.4 : 0.12;
    const potentialRoom = Math.max(0, player.potential - player.overall);
    if (focus === 'recovery') {
      player.fitness = clamp(player.fitness + randFloat(7, 14), 0, 100);
      player.morale = clamp(player.morale + randFloat(0, 2), 0, 100);
    } else {
      const attrs = config.attrs.length ? config.attrs : Object.values(ATTRIBUTE_GROUPS).flat();
      const improvementChance = developmentFactor * ageFactor * (0.25 + potentialRoom / 25);
      if (Math.random() < improvementChance) {
        const attr = choose(attrs);
        player.attributes[attr] = clamp(player.attributes[attr] + 1, 3, 20);
        const oldOverall = player.overall;
        player.overall = clamp(playerOverallFromAttributes(player.position, player.attributes), 35, player.potential);
        if (player.overall > oldOverall && player.clubId === state.userClubId) {
          state.news.push({ title: `${player.firstName} ${player.lastName} improved to ${player.overall} ability`, date: state.date, type: 'development' });
        }
      }
      const fatigue = intensity / 17 * (restDay ? 0.58 : 0.86);
      player.fitness = clamp(player.fitness - fatigue + randFloat(2, 6), 35, 100);
      player.sharpness = clamp(player.sharpness + intensity / 35, 50, 100);
      const injuryChance = (intensity / 1000) * (focus === 'physical' ? 1.8 : 1) * (1.3 - club.facilities.training / 20);
      if (Math.random() < injuryChance && player.fitness < 78) player.injury = { type: choose(['Training strain','Tight hamstring','Twisted ankle','Groin strain']), weeks: rand(1, 4) };
    }
    player.value = derivePlayerValue(player);
  });

  // AI clubs get modest development and fitness recovery.
  Object.values(state.clubs).filter(item => item.id !== club.id).forEach(aiClub => {
    clubPlayers(aiClub).forEach(player => {
      if (!player.injury) player.fitness = clamp(player.fitness + randFloat(4, 9), 35, 100);
      if (player.age <= 24 && player.overall < player.potential && Math.random() < 0.018 * (0.5 + aiClub.facilities.training / 10)) {
        const attr = choose(Object.values(ATTRIBUTE_GROUPS).flat());
        player.attributes[attr] = clamp(player.attributes[attr] + 1, 3, 20);
        player.overall = clamp(playerOverallFromAttributes(player.position, player.attributes), 35, player.potential);
      }
    });
  });
}

function processInjuriesAndSuspensions() {
  Object.values(state.players).forEach(player => {
    if (player.injury) {
      player.injury.weeks -= 1;
      if (player.injury.weeks <= 0) {
        player.injury = null;
        player.fitness = clamp(player.fitness, 55, 76);
        if (player.clubId === state.userClubId) state.inbox.unshift(createMessage(`${player.firstName} ${player.lastName} returns`, 'The medical team has cleared the player to resume full training and selection.', 'Medical Team', true));
      }
    }
    if (player.suspended > 0) player.suspended -= 1;
  });
}

function processScoutingWeek() {
  const club = userClub();
  Object.keys(state.scouting.reports).forEach(id => {
    state.scouting.reports[id] = clamp(state.scouting.reports[id] + 18 + club.facilities.scouting * 3, 0, 100);
    if (state.scouting.reports[id] >= 100 && !state.scouting.assignments.includes(Number(id))) {
      state.scouting.assignments.push(Number(id));
      const player = playerById(id);
      if (player) state.inbox.unshift(createMessage(`Scouting complete: ${player.firstName} ${player.lastName}`, `Our scouts rate ${player.lastName} at ${player.overall} current ability with ${player.potential} potential. Estimated value: ${formatMoney(player.value, true)}.`, 'Chief Scout', true));
    }
  });
}

function generateAITransferActivity() {
  const club = userClub();
  const listed = clubPlayers(club).filter(player => player.transferListed);
  listed.forEach(player => {
    if (state.transfers.incomingOffers.some(offer => offer.playerId === player.id && offer.status === 'pending')) return;
    if (Math.random() < 0.14) {
      const bidders = Object.values(state.clubs).filter(candidate => candidate.id !== club.id && candidate.transferBudget > player.value * 0.7 && candidate.division <= club.division + 1);
      if (!bidders.length) return;
      const bidder = choose(bidders);
      const fee = Math.round(player.value * randFloat(0.78, 1.12) / 10000) * 10000;
      state.transfers.incomingOffers.push({ id: `offer-${Date.now()}-${player.id}`, playerId: player.id, clubId: bidder.id, fee, status: 'pending', date: state.date });
      state.inbox.unshift(createMessage(`Offer received for ${player.lastName}`, `${bidder.name} has offered ${formatMoney(fee, true)}. Review it in Transfers → Activity.`, 'Director of Football', true));
    }
  });
}

function updateBoardAndObjectives() {
  const club = userClub();
  const position = getLeaguePosition(club.id);
  const expected = club.objective.includes('promotion') ? 3 : club.objective.includes('Continental') ? 6 : club.objective.includes('Top-half') ? 8 : 13;
  club.boardConfidence = clamp(club.boardConfidence + (expected - position) * 0.14 + (club.balance < 0 ? -1.2 : 0.2), 1, 100);
}

function ensureValidLineup(club) {
  const formation = FORMATIONS[club.tactics.formation];
  const ids = club.tactics.lineup || [];
  const valid = ids.length === 11 && new Set(ids.filter(Boolean)).size === 11 && ids.every(id => {
    const player = playerById(id);
    return player && player.clubId === club.id && !player.injury && player.suspended <= 0;
  });
  if (!valid || formation.length !== ids.length) autoPickLineup(club, state.players);
}

function resolveNegotiations() {
  state.transfers.negotiations.filter(neg => neg.status === 'pending' && neg.resolveWeek <= state.week).forEach(neg => {
    const player = playerById(neg.playerId);
    if (!player) { neg.status = 'failed'; return; }
    const buyingClub = userClub();
    const sellingClub = player.clubId !== null ? clubById(player.clubId) : null;
    const feeRatio = sellingClub ? neg.fee / Math.max(player.value, 1) : 1;
    const wageRatio = neg.wage / Math.max(player.wage, 1);
    const reputationInterest = buyingClub.reputation - (sellingClub?.reputation || player.overall);
    const clubAccept = !sellingClub || feeRatio >= (player.transferListed ? 0.86 : 1.06) || (feeRatio > 0.92 && Math.random() < 0.35);
    const playerAccept = wageRatio >= 0.95 && (reputationInterest > -18 || neg.role === 'Star Player' || Math.random() < 0.35);
    if (clubAccept && playerAccept && buyingClub.transferBudget >= neg.fee && clubWageBill(buyingClub) + neg.wage <= buyingClub.wageBudget * 1.08) {
      completeTransfer(player, buyingClub, neg.fee, neg.wage, neg.years, neg.role);
      neg.status = 'accepted';
      state.inbox.unshift(createMessage(`Transfer agreed: ${player.firstName} ${player.lastName}`, `${player.lastName} has joined ${buyingClub.name} for ${formatMoney(neg.fee, true)} on a ${neg.years}-year contract.`, 'Director of Football', true));
    } else {
      neg.status = 'rejected';
      const reason = !clubAccept ? 'The selling club rejected the fee.' : !playerAccept ? 'The player rejected the contract terms.' : 'The board could not approve the financial package.';
      state.inbox.unshift(createMessage(`Transfer rejected: ${player.firstName} ${player.lastName}`, reason, 'Director of Football', true));
    }
  });
}

function completeTransfer(player, buyingClub, fee, wage, years, role) {
  const sellingClub = player.clubId !== null ? clubById(player.clubId) : null;
  const fromName = sellingClub ? sellingClub.name : 'Free agent';
  if (sellingClub) {
    sellingClub.squad = sellingClub.squad.filter(id => id !== player.id);
    sellingClub.balance += fee;
    sellingClub.transferBudget += Math.round(fee * 0.72);
    ensureValidLineup(sellingClub);
  }
  buyingClub.balance -= fee;
  buyingClub.transferBudget -= fee;
  buyingClub.squad.push(player.id);
  player.clubId = buyingClub.id;
  player.wage = wage;
  player.contractYears = years;
  player.squadStatus = role;
  player.transferListed = false;
  player.morale = clamp(player.morale + 8, 0, 100);
  player.value = derivePlayerValue(player);
  autoPickLineup(buyingClub, state.players);
  state.transfers.history.push({ date: state.date, playerId: player.id, playerName: `${player.firstName} ${player.lastName}`, from: fromName, to: buyingClub.name, fee });
  state.news.push({ title: `${buyingClub.name} sign ${player.firstName} ${player.lastName} for ${formatMoney(fee, true)}`, date: state.date, type: 'transfer' });
}

function finishSeason() {
  state.seasonComplete = true;
  const user = userClub();
  const finalPosition = getLeaguePosition(user.id);
  const table = getLeagueTable(user.division);
  const champion = table[0];
  if (champion.id === user.id) {
    state.manager.trophies += 1;
    state.manager.reputation = clamp(state.manager.reputation + 10, 1, 100);
  }
  state.inbox.unshift(createMessage('Season review', `${user.name} finished ${finalPosition}${ordinalSuffix(finalPosition)} in the ${DIVISIONS[user.division].name}. ${champion.name} were crowned champions.`, 'Board', true));
}

function beginNewSeason() {
  if (!state.seasonComplete) return;
  const oldDivisions = {};
  const oldPositions = {};
  const oldDivisionByClub = {};
  Object.values(state.divisions).forEach(division => {
    oldDivisions[division.id] = getLeagueTable(division.id).map(club => club.id);
    oldDivisions[division.id].forEach((clubId, index) => { oldPositions[clubId] = index + 1; oldDivisionByClub[clubId] = division.id; });
  });
  const promoted = {};
  const relegated = {};
  for (let divisionId = 0; divisionId < 4; divisionId += 1) {
    const table = oldDivisions[divisionId];
    if (divisionId > 0) {
      const playoff = simulatePlayoff(table.slice(2, 6));
      promoted[divisionId] = [table[0], table[1], playoff];
    }
    if (divisionId < 3) relegated[divisionId] = table.slice(-3);
  }
  for (let divisionId = 0; divisionId < 4; divisionId += 1) {
    const division = state.divisions[divisionId];
    let ids = [...oldDivisions[divisionId]];
    if (divisionId > 0) ids = ids.filter(id => !promoted[divisionId].includes(id));
    if (divisionId < 3) ids = ids.filter(id => !relegated[divisionId].includes(id));
    if (divisionId > 0) ids.push(...relegated[divisionId - 1]);
    if (divisionId < 3) ids.push(...promoted[divisionId + 1]);
    division.clubs = ids;
    ids.forEach(id => { state.clubs[id].division = divisionId; });
  }
  Object.values(state.clubs).forEach(club => {
    club.table = blankTable();
    club.form = [];
    club.finances.seasonIncome = 0;
    club.finances.seasonCosts = 0;
    club.objective = club.division === 0 ? (club.reputation > 76 ? 'Qualify for Continental Cup' : club.reputation < 58 ? 'Avoid relegation' : 'Top-half finish') : (club.reputation > [0,66,58,50][club.division] ? 'Win promotion' : 'Top-half finish');
    club.transferBudget += Math.max(100000, Math.round(DIVISIONS[club.division].prize * randFloat(0.12, 0.32) / 10000) * 10000);
    const priorDivision = oldDivisionByClub[club.id] ?? club.division;
    club.balance += Math.round(DIVISIONS[priorDivision].prize * (1.05 - (oldPositions[club.id] || 8) / 28));
  });
  Object.values(state.players).forEach(player => {
    player.age += 1;
    player.contractYears -= 1;
    player.season = { appearances: 0, starts: 0, goals: 0, assists: 0, cleanSheets: 0, yellow: 0, red: 0, ratingTotal: 0, minutes: 0 };
    player.form = 6.7;
    player.fitness = rand(82, 97);
    player.sharpness = rand(58, 80);
    if (player.age >= 31 && Math.random() < (player.age - 29) * 0.08) {
      const attr = choose(Object.values(ATTRIBUTE_GROUPS).flat());
      player.attributes[attr] = clamp(player.attributes[attr] - 1, 3, 20);
      player.overall = playerOverallFromAttributes(player.position, player.attributes);
    }
  });
  handleExpiredContracts();
  generateYouthIntakes();
  Object.values(state.divisions).forEach(division => { division.fixtures = buildRoundRobin(division.clubs); });
  Object.values(state.clubs).forEach(club => autoPickLineup(club, state.players));
  state.season += 1;
  state.week = 0;
  state.date += 70 * 24 * 60 * 60 * 1000;
  state.seasonComplete = false;
  state.inbox.unshift(createMessage(`Season ${state.season} begins`, `The fixtures have been released. ${userClub().name} will compete in the ${DIVISIONS[userClub().division].name}.`, 'League Office', true));
  saveGame(false);
  ui.view = 'dashboard';
  render();
}

function simulatePlayoff(ids) {
  if (!ids.length) return null;
  const semiA = calculateTeamStrength(clubById(ids[0])).overall + randFloat(-5,5) > calculateTeamStrength(clubById(ids[3])).overall + randFloat(-5,5) ? ids[0] : ids[3];
  const semiB = calculateTeamStrength(clubById(ids[1])).overall + randFloat(-5,5) > calculateTeamStrength(clubById(ids[2])).overall + randFloat(-5,5) ? ids[1] : ids[2];
  return calculateTeamStrength(clubById(semiA)).overall + randFloat(-7,7) > calculateTeamStrength(clubById(semiB)).overall + randFloat(-7,7) ? semiA : semiB;
}

function handleExpiredContracts() {
  Object.values(state.players).forEach(player => {
    if (player.clubId !== null && player.contractYears <= 0) {
      const club = clubById(player.clubId);
      club.squad = club.squad.filter(id => id !== player.id);
      player.clubId = null;
      player.contractYears = 0;
      player.transferListed = false;
      player.wage = Math.max(500, Math.round(player.wage * 0.82 / 100) * 100);
      if (club.id === state.userClubId) state.inbox.unshift(createMessage(`${player.firstName} ${player.lastName} released`, 'The player left after their contract expired.', 'Club Secretary', true));
    }
  });
}

function generateYouthIntakes() {
  Object.values(state.clubs).forEach(club => {
    const rng = rngFor(`youth-${state.season}-${club.id}`);
    const count = rand(2, 4, rng);
    for (let i = 0; i < count; i += 1) {
      const position = choose(POSITION_PLAN, rng);
      const player = createPlayer(state.nextPlayerId, club, position, 20, rng);
      player.age = rand(16, 18, rng);
      const academyBoost = club.facilities.youth * 0.8;
      player.potential = clamp(player.potential + Math.round(academyBoost) + rand(-2, 5, rng), player.overall + 2, 94);
      player.overall = clamp(player.overall - rand(4, 12, rng), 35, player.potential);
      player.wage = Math.round(player.wage * 0.34 / 100) * 100;
      player.value = derivePlayerValueWithWorld(player, state.clubs);
      state.players[player.id] = player;
      club.squad.push(player.id);
      state.nextPlayerId += 1;
      if (club.id === state.userClubId) state.inbox.unshift(createMessage(`Academy graduate: ${player.firstName} ${player.lastName}`, `A ${player.age}-year-old ${player.position} has joined the senior squad. Potential ability: ${player.potential}.`, 'Head of Youth Development', true));
    }
  });
}

function startLiveMatch() {
  const fixture = userFixture();
  if (!fixture) return;
  ensureValidLineup(userClub());
  const homeClub = clubById(fixture.homeId);
  const awayClub = clubById(fixture.awayId);
  ensureValidLineup(homeClub);
  ensureValidLineup(awayClub);
  ui.match = createLiveMatchState(fixture, homeClub, awayClub);
  ui.moreOpen = false;
  renderMatch();
  startMatchTimer();
}

function createLiveMatchState(fixture, homeClub, awayClub) {
  const homeFormation = FORMATIONS[homeClub.tactics.formation];
  const awayFormation = FORMATIONS[awayClub.tactics.formation];
  const homeLineup = homeClub.tactics.lineup.map(playerById).filter(Boolean);
  const awayLineup = awayClub.tactics.lineup.map(playerById).filter(Boolean);
  const entities = {
    home: homeLineup.map((player, index) => ({ id: player.id, x: homeFormation[index]?.x || 50, y: homeFormation[index]?.y || 50, baseX: homeFormation[index]?.x || 50, baseY: homeFormation[index]?.y || 50, side: 'home' })),
    away: awayLineup.map((player, index) => ({ id: player.id, x: awayFormation[index]?.x || 50, y: 100 - (awayFormation[index]?.y || 50), baseX: awayFormation[index]?.x || 50, baseY: 100 - (awayFormation[index]?.y || 50), side: 'away' }))
  };
  const initialCarrier = entities.home.find(entity => playerById(entity.id).position === 'CM') || entities.home[9] || entities.home[0];
  return {
    fixture,
    homeClubId: homeClub.id,
    awayClubId: awayClub.id,
    homeLineupIds: homeLineup.map(player => player.id),
    awayLineupIds: awayLineup.map(player => player.id),
    entities,
    minute: 0,
    score: { home: 0, away: 0 },
    stats: { homeShots: 0, awayShots: 0, homeOnTarget: 0, awayOnTarget: 0, homePossessionTicks: 1, awayPossessionTicks: 0, homeCorners: 0, awayCorners: 0, homeFouls: 0, awayFouls: 0 },
    commentary: [{ minute: 0, text: `Kick-off at ${homeClub.stadium}.`, type: 'normal' }],
    events: [],
    possession: 'home',
    carrierId: initialCarrier.id,
    ball: { x: initialCarrier.x, y: initialCarrier.y },
    speed: state.settings.matchSpeed || 2,
    paused: false,
    ended: false,
    halfTimeShown: false,
    secondHalfStarted: false,
    lastAttackMinute: -10,
    userMentality: userClub().tactics.mentality,
    cards: {},
    substitutions: { home: 0, away: 0 },
    momentum: 0
  };
}

function startMatchTimer() {
  if (ui.matchTimer) clearInterval(ui.matchTimer);
  ui.matchTimer = setInterval(() => {
    if (!ui.match || ui.match.paused || ui.match.ended) return;
    tickLiveMatch();
  }, 250);
}

function tickLiveMatch() {
  const match = ui.match;
  const gameDelta = 0.125 * match.speed;
  match.minute = Math.min(90, match.minute + gameDelta);

  if (match.minute >= 45 && !match.halfTimeShown) {
    match.halfTimeShown = true;
    addMatchCommentary(45, `Half-time: ${clubById(match.homeClubId).short} ${match.score.home}–${match.score.away} ${clubById(match.awayClubId).short}.`, 'normal');
  }
  if (match.minute >= 46 && !match.secondHalfStarted) {
    match.secondHalfStarted = true;
    addMatchCommentary(46, 'The second half is under way.', 'normal');
  }

  updatePossession(match, gameDelta);
  updatePlayerMovement(match);

  const attackChance = 0.155 * gameDelta;
  if (Math.random() < attackChance && match.minute - match.lastAttackMinute > 0.65) {
    runLiveAttack(match, match.possession);
    match.lastAttackMinute = match.minute;
  }

  if (Math.random() < 0.014 * gameDelta) createDisciplinaryEvent(match);
  if (Math.random() < 0.0032 * gameDelta) createLiveInjury(match);
  if (match.minute >= 60) maybeAutoSubstitute(match);

  updateMatchDOM();
  if (match.minute >= 90) finishLiveMatch();
}

function updatePossession(match, gameDelta) {
  const homeClub = clubById(match.homeClubId);
  const awayClub = clubById(match.awayClubId);
  const homeStrength = calculateTeamStrength(homeClub);
  const awayStrength = calculateTeamStrength(awayClub);
  const homeControl = homeStrength.midfield + 3 + match.momentum * 0.3;
  const awayControl = awayStrength.midfield - match.momentum * 0.3;
  const switchChance = 0.055 * gameDelta * 8;
  if (Math.random() < switchChance) {
    const homeProbability = clamp(homeControl / (homeControl + awayControl), 0.34, 0.66);
    match.possession = Math.random() < homeProbability ? 'home' : 'away';
    const entities = match.entities[match.possession];
    match.carrierId = choose(entities.filter(entity => playerById(entity.id).position !== 'GK')).id;
  }
  if (match.possession === 'home') match.stats.homePossessionTicks += 1;
  else match.stats.awayPossessionTicks += 1;
}

function updatePlayerMovement(match) {
  ['home','away'].forEach(side => {
    const attacking = match.possession === side;
    const direction = side === 'home' ? -1 : 1;
    match.entities[side].forEach((entity, index) => {
      const player = playerById(entity.id);
      const roleAdvance = attacking ? direction * (player.position === 'ST' ? 7 : ['AM','RW','LW'].includes(player.position) ? 5 : ['CM','WB','RB','LB'].includes(player.position) ? 2.5 : 0.5) : direction * -1.5;
      const targetY = clamp(entity.baseY + roleAdvance + Math.sin(match.minute / 3 + index) * 2.5, 6, 94);
      const widthShift = attacking ? (clubById(side === 'home' ? match.homeClubId : match.awayClubId).tactics.width - 50) / 14 * (entity.x < 50 ? -1 : 1) : 0;
      const targetX = clamp(entity.baseX + widthShift + Math.cos(match.minute / 2.5 + index * 1.7) * 2.2, 5, 95);
      entity.x += (targetX - entity.x) * 0.16;
      entity.y += (targetY - entity.y) * 0.16;
    });
  });
  const carrier = [...match.entities.home, ...match.entities.away].find(entity => entity.id === match.carrierId);
  if (carrier) {
    match.ball.x += (carrier.x - match.ball.x) * 0.58;
    match.ball.y += (carrier.y - match.ball.y) * 0.58;
  }
}

function runLiveAttack(match, side) {
  const attackingClub = clubById(side === 'home' ? match.homeClubId : match.awayClubId);
  const defendingClub = clubById(side === 'home' ? match.awayClubId : match.homeClubId);
  const attackingEntities = match.entities[side];
  const defendingEntities = match.entities[side === 'home' ? 'away' : 'home'];
  const attacker = weightedChoice(attackingEntities.map(entity => playerById(entity.id)), player => {
    const role = { ST: 9, RW: 6, LW: 6, AM: 5.5, CM: 2.8, WB: 2.1, RB: 1.1, LB: 1.1, DM: 1, CB: 0.65, GK: 0.02 }[player.position] || 1;
    return role * (player.attributes.anticipation + player.attributes.finishing + player.attributes.dribbling);
  });
  const creator = weightedChoice(attackingEntities.map(entity => playerById(entity.id)).filter(player => player.id !== attacker.id), player => player.attributes.passing + player.attributes.vision + player.attributes.crossing);
  const attack = calculateTeamStrength(attackingClub);
  const defence = calculateTeamStrength(defendingClub);
  const tacticAttack = attackingClub.tactics.mentality === 'Attacking' ? 0.035 : attackingClub.tactics.mentality === 'Positive' ? 0.018 : attackingClub.tactics.mentality === 'Defensive' ? -0.025 : 0;
  const xg = clamp(0.055 + (attack.attack - defence.defence) / 270 + attacker.attributes.finishing / 155 + attacker.attributes.composure / 210 + tacticAttack + randFloat(-0.035, 0.05), 0.025, 0.46);
  const onTargetChance = clamp(0.32 + attacker.attributes.finishing / 60 + attacker.attributes.composure / 100, 0.34, 0.76);
  const isOnTarget = Math.random() < onTargetChance;
  const isGoal = isOnTarget && Math.random() < xg;
  const statPrefix = side === 'home' ? 'home' : 'away';
  match.stats[`${statPrefix}Shots`] += 1;
  if (isOnTarget) match.stats[`${statPrefix}OnTarget`] += 1;

  const attackerEntity = attackingEntities.find(entity => entity.id === attacker.id);
  const targetY = side === 'home' ? 6 : 94;
  match.carrierId = attacker.id;
  if (attackerEntity) {
    attackerEntity.y = clamp(targetY + (side === 'home' ? 11 : -11), 10, 90);
    attackerEntity.x = clamp(attackerEntity.x + randFloat(-9,9), 12, 88);
    match.ball.x = attackerEntity.x;
    match.ball.y = targetY;
  }

  if (isGoal) {
    match.score[side] += 1;
    const assister = creator && Math.random() < 0.74 ? creator : null;
    match.events.push({ type: 'goal', minute: Math.ceil(match.minute), side, scorerId: attacker.id, assisterId: assister?.id || null });
    match.momentum += side === 'home' ? 2 : -2;
    addMatchCommentary(Math.ceil(match.minute), `GOAL! ${attacker.firstName} ${attacker.lastName} ${assister ? `converts after a pass from ${assister.lastName}` : 'finds the net'} for ${attackingClub.name}.`, 'goal');
    match.possession = side === 'home' ? 'away' : 'home';
  } else if (isOnTarget) {
    const keeper = defendingEntities.map(entity => playerById(entity.id)).find(player => player.position === 'GK');
    addMatchCommentary(Math.ceil(match.minute), `${attacker.lastName} forces ${keeper ? keeper.lastName : 'the goalkeeper'} into a save.`, 'normal');
    if (Math.random() < 0.27) {
      match.stats[`${statPrefix}Corners`] += 1;
      addMatchCommentary(Math.ceil(match.minute), `Corner to ${attackingClub.name}.`, 'normal');
    }
    match.possession = side === 'home' ? 'away' : 'home';
  } else {
    const misses = ['fires wide','drags the effort past the post','shoots over from distance','cannot keep the effort down'];
    addMatchCommentary(Math.ceil(match.minute), `${attacker.lastName} ${choose(misses)}.`, 'normal');
    match.possession = Math.random() < 0.8 ? (side === 'home' ? 'away' : 'home') : side;
  }
  const nextEntities = match.entities[match.possession];
  match.carrierId = choose(nextEntities.filter(entity => playerById(entity.id).position !== 'GK')).id;
}

function createDisciplinaryEvent(match) {
  const side = Math.random() < 0.5 ? 'home' : 'away';
  const club = clubById(side === 'home' ? match.homeClubId : match.awayClubId);
  const candidates = match.entities[side].map(entity => playerById(entity.id)).filter(player => player.position !== 'GK');
  const player = weightedChoice(candidates, item => item.attributes.tackling < 10 ? 2 : 1);
  const statPrefix = side;
  match.stats[`${statPrefix}Fouls`] += 1;
  const previous = match.cards[player.id] || 0;
  const red = Math.random() < 0.045 || previous >= 1 && Math.random() < 0.12;
  if (red) {
    match.cards[player.id] = 2;
    match.events.push({ type: 'red', minute: Math.ceil(match.minute), playerId: player.id, side });
    addMatchCommentary(Math.ceil(match.minute), `RED CARD! ${player.lastName} is dismissed for ${club.name}.`, 'card');
    match.entities[side] = match.entities[side].filter(entity => entity.id !== player.id);
    match.momentum += side === 'home' ? -5 : 5;
  } else {
    match.cards[player.id] = previous + 1;
    match.events.push({ type: 'yellow', minute: Math.ceil(match.minute), playerId: player.id, side });
    addMatchCommentary(Math.ceil(match.minute), `${player.lastName} is shown a yellow card.`, 'card');
  }
}

function createLiveInjury(match) {
  const side = Math.random() < 0.5 ? 'home' : 'away';
  const candidates = match.entities[side].map(entity => playerById(entity.id)).filter(player => !player.injury);
  if (!candidates.length) return;
  const player = weightedChoice(candidates, item => 22 - item.attributes.fitness + (100 - item.fitness) / 12);
  const injuryType = choose(['Hamstring strain','Ankle sprain','Calf strain','Knee knock']);
  const weeks = rand(1, 5);
  match.events.push({ type: 'injury', minute: Math.ceil(match.minute), playerId: player.id, side, injuryType, weeks });
  addMatchCommentary(Math.ceil(match.minute), `${player.lastName} has picked up a ${injuryType.toLowerCase()} and cannot continue.`, 'card');
  performAutoSub(match, side, player.id, true);
}

function maybeAutoSubstitute(match) {
  ['home','away'].forEach(side => {
    if (match.substitutions[side] >= 3) return;
    const club = clubById(side === 'home' ? match.homeClubId : match.awayClubId);
    const minutesThreshold = 60 + match.substitutions[side] * 10;
    if (match.minute < minutesThreshold) return;
    if (Math.random() < 0.025 * match.speed) {
      const entities = match.entities[side];
      const candidates = entities.map(entity => playerById(entity.id)).filter(player => player.position !== 'GK').sort((a,b) => a.fitness - b.fitness);
      if (candidates[0]) performAutoSub(match, side, candidates[0].id, false);
    }
  });
}

function performAutoSub(match, side, outgoingId, forced) {
  if (match.substitutions[side] >= 5) return;
  const club = clubById(side === 'home' ? match.homeClubId : match.awayClubId);
  const usedIds = new Set([...match.entities.home, ...match.entities.away].map(entity => entity.id));
  const outgoing = playerById(outgoingId);
  const incoming = club.tactics.bench.map(playerById).filter(player => player && !usedIds.has(player.id) && !player.injury).sort((a,b) => suitability(b, outgoing.position) * b.overall - suitability(a, outgoing.position) * a.overall)[0];
  if (!incoming) return;
  const entity = match.entities[side].find(item => item.id === outgoingId);
  if (!entity) return;
  const oldEntityId = entity.id;
  entity.id = incoming.id;
  const entityElement = document.getElementById(`entity-${oldEntityId}`);
  if (entityElement) {
    entityElement.id = `entity-${incoming.id}`;
    entityElement.textContent = incoming.position;
    entityElement.title = `${incoming.firstName} ${incoming.lastName}`;
    entityElement.classList.remove('carded');
  }
  if (match.carrierId === oldEntityId) match.carrierId = incoming.id;
  match.substitutions[side] += 1;
  addMatchCommentary(Math.ceil(match.minute), `${incoming.lastName} replaces ${outgoing.lastName}${forced ? ' after the injury' : ''}.`, 'normal');
}

function addMatchCommentary(minute, text, type = 'normal') {
  if (!ui.match) return;
  ui.match.commentary.unshift({ minute, text, type });
  ui.match.commentary = ui.match.commentary.slice(0, 60);
}

function finishLiveMatch() {
  if (!ui.match || ui.match.ended) return;
  ui.match.minute = 90;
  ui.match.ended = true;
  ui.match.paused = true;
  clearInterval(ui.matchTimer);
  addMatchCommentary(90, `Full time: ${clubById(ui.match.homeClubId).name} ${ui.match.score.home}–${ui.match.score.away} ${clubById(ui.match.awayClubId).name}.`, 'goal');
  renderMatch();
}

function liveMatchResult() {
  const match = ui.match;
  const possessionTotal = match.stats.homePossessionTicks + match.stats.awayPossessionTicks;
  return {
    homeGoals: match.score.home,
    awayGoals: match.score.away,
    stats: {
      homeShots: match.stats.homeShots,
      awayShots: match.stats.awayShots,
      homeOnTarget: match.stats.homeOnTarget,
      awayOnTarget: match.stats.awayOnTarget,
      homePossession: Math.round(match.stats.homePossessionTicks / possessionTotal * 100),
      homeCorners: match.stats.homeCorners,
      awayCorners: match.stats.awayCorners,
      homeFouls: match.stats.homeFouls,
      awayFouls: match.stats.awayFouls
    },
    events: match.events
  };
}

function continueAfterLiveMatch() {
  const match = ui.match;
  if (!match?.ended) return;
  const result = liveMatchResult();
  applyResult(match.fixture, result, {
    homeLineup: match.homeLineupIds.map(playerById).filter(Boolean),
    awayLineup: match.awayLineupIds.map(playerById).filter(Boolean)
  });
  const fixture = match.fixture;
  ui.match = null;
  completeRound(fixture);
  ui.view = 'dashboard';
  render();
}

function renderMatch() {
  const match = ui.match;
  if (!match) return;
  const home = clubById(match.homeClubId);
  const away = clubById(match.awayClubId);
  if (match.ended) {
    const result = liveMatchResult();
    const userIsHome = home.id === state.userClubId;
    const gf = userIsHome ? result.homeGoals : result.awayGoals;
    const ga = userIsHome ? result.awayGoals : result.homeGoals;
    app.innerHTML = `<main class="match-shell"><section class="match-result-card"><div class="page-kicker">Full time</div><div class="result-teams"><div class="result-team">${createClubBadge(home)}<strong>${escapeHtml(home.name)}</strong></div><div class="result-score">${result.homeGoals}–${result.awayGoals}</div><div class="result-team">${createClubBadge(away)}<strong>${escapeHtml(away.name)}</strong></div></div><h1 class="page-title" style="margin-top:20px">${gf > ga ? 'Victory' : gf === ga ? 'Points shared' : 'Defeat'}</h1><p class="page-description">Shots ${result.stats.homeShots}–${result.stats.awayShots} · On target ${result.stats.homeOnTarget}–${result.stats.awayOnTarget} · Possession ${result.stats.homePossession}%–${100-result.stats.homePossession}%</p><div class="btn-row" style="justify-content:center;margin-top:20px"><button class="btn btn-primary" data-action="continue-after-match">Continue</button></div></section></main>`;
    return;
  }
  app.innerHTML = `
    <main class="match-shell">
      <header class="match-header">
        <div class="match-team-header">${createClubBadge(home)}<div class="match-team-name">${escapeHtml(home.name)}</div></div>
        <div class="score-box"><div class="match-score" id="match-score">${match.score.home} – ${match.score.away}</div><div class="match-clock" id="match-clock">${Math.floor(match.minute)}'</div></div>
        <div class="match-team-header away"><div class="match-team-name">${escapeHtml(away.name)}</div>${createClubBadge(away)}</div>
      </header>
      <div class="match-layout">
        <section class="match-stage">
          <div class="match-pitch" id="live-pitch" style="--home-color:${home.colours[0]};--away-color:${away.colours[0]}">
            <div class="pitch-lines"></div><div class="penalty-box top"></div><div class="penalty-box bottom"></div><div class="goal-box top"></div><div class="goal-box bottom"></div>
            ${renderMatchEntities(match)}<div class="match-ball" id="match-ball" style="left:${match.ball.x}%;top:${match.ball.y}%"></div>
          </div>
          <div class="match-controls"><button class="speed-btn" data-action="match-pause">${match.paused ? '▶' : 'Ⅱ'}</button>${[1,2,4].map(speed => `<button class="speed-btn ${match.speed===speed?'active':''}" data-action="match-speed" data-speed="${speed}">${speed}×</button>`).join('')}<button class="speed-btn" data-action="match-mentality" data-mentality="Cautious">Cautious</button><button class="speed-btn ${match.userMentality==='Positive'?'active':''}" data-action="match-mentality" data-mentality="Positive">Positive</button><button class="speed-btn ${match.userMentality==='Attacking'?'active':''}" data-action="match-mentality" data-mentality="Attacking">Attack</button></div>
        </section>
        <aside class="match-side">
          <section class="panel"><div class="panel-head"><div><h2 class="panel-title">Match statistics</h2><div class="panel-subtitle">Live</div></div></div><div class="panel-body" id="match-stats">${renderLiveStats(match)}</div></section>
          <section class="panel"><div class="panel-head"><div><h2 class="panel-title">Commentary</h2><div class="panel-subtitle">Key moments</div></div></div><div class="commentary-box" id="match-commentary">${renderCommentary(match)}</div></section>
        </aside>
      </div>
    </main>`;
}

function renderMatchEntities(match) {
  return ['home','away'].flatMap(side => match.entities[side].map(entity => {
    const player = playerById(entity.id);
    const hasBall = entity.id === match.carrierId;
    const carded = match.cards[entity.id];
    return `<div class="match-entity ${side} ${hasBall?'has-ball':''} ${carded?'carded':''}" id="entity-${entity.id}" style="left:${entity.x}%;top:${entity.y}%" title="${escapeHtml(player.firstName)} ${escapeHtml(player.lastName)}">${player.position}</div>`;
  })).join('');
}

function renderLiveStats(match) {
  const total = match.stats.homePossessionTicks + match.stats.awayPossessionTicks;
  const homePoss = Math.round(match.stats.homePossessionTicks / total * 100);
  const rows = [
    ['Possession', `${homePoss}%`, `${100-homePoss}%`, homePoss],
    ['Shots', match.stats.homeShots, match.stats.awayShots, match.stats.homeShots / Math.max(1, match.stats.homeShots+match.stats.awayShots)*100],
    ['On target', match.stats.homeOnTarget, match.stats.awayOnTarget, match.stats.homeOnTarget / Math.max(1, match.stats.homeOnTarget+match.stats.awayOnTarget)*100],
    ['Corners', match.stats.homeCorners, match.stats.awayCorners, match.stats.homeCorners / Math.max(1, match.stats.homeCorners+match.stats.awayCorners)*100],
    ['Fouls', match.stats.homeFouls, match.stats.awayFouls, match.stats.homeFouls / Math.max(1, match.stats.homeFouls+match.stats.awayFouls)*100]
  ];
  return `<div class="match-stats-grid">${rows.map(([label,home,away,pct]) => `<div><div class="match-stat"><strong>${home}</strong><span class="text-muted">${label}</span><strong>${away}</strong></div><div class="match-stat-bar" style="--home:${clamp(pct,0,100)}%;--home-color:${clubById(match.homeClubId).colours[0]};--away-color:${clubById(match.awayClubId).colours[0]}"><span class="home"></span><span class="away"></span></div></div>`).join('')}</div>`;
}

function renderCommentary(match) {
  return match.commentary.map(line => `<div class="commentary-line ${line.type}"><span class="commentary-minute">${line.minute}'</span><span>${escapeHtml(line.text)}</span></div>`).join('');
}

function updateMatchDOM() {
  const match = ui.match;
  if (!match || match.ended) return;
  const clock = document.getElementById('match-clock');
  const score = document.getElementById('match-score');
  const ball = document.getElementById('match-ball');
  if (!clock || !score || !ball) return;
  clock.textContent = `${Math.min(90, Math.floor(match.minute))}'`;
  score.textContent = `${match.score.home} – ${match.score.away}`;
  ball.style.left = `${match.ball.x}%`;
  ball.style.top = `${match.ball.y}%`;
  ['home','away'].forEach(side => match.entities[side].forEach(entity => {
    const el = document.getElementById(`entity-${entity.id}`);
    if (el) {
      el.style.left = `${entity.x}%`;
      el.style.top = `${entity.y}%`;
      el.classList.toggle('has-ball', entity.id === match.carrierId);
      el.classList.toggle('carded', Boolean(match.cards[entity.id]));
    }
  }));
  const stats = document.getElementById('match-stats');
  const commentary = document.getElementById('match-commentary');
  if (stats && Math.floor(match.minute * 4) % 2 === 0) stats.innerHTML = renderLiveStats(match);
  if (commentary) commentary.innerHTML = renderCommentary(match);
}

function rebuildBench(club) {
  const used = new Set(club.tactics.lineup.filter(Boolean));
  club.tactics.bench = clubPlayers(club).filter(player => !used.has(player.id) && !player.injury && player.suspended <= 0).sort((a,b) => b.overall - a.overall).slice(0,9).map(player => player.id);
}

function submitTransferOffer(playerId) {
  const player = playerById(playerId);
  if (!player) return;
  const fee = player.clubId === null ? 0 : Math.max(0, Number(document.getElementById('offer-fee')?.value || 0));
  const wage = Math.max(100, Number(document.getElementById('offer-wage')?.value || 0));
  const years = Number(document.getElementById('offer-years')?.value || 3);
  const role = document.getElementById('offer-role')?.value || 'First Team';
  const club = userClub();
  if (fee > club.transferBudget) return toast('The fee exceeds your transfer budget.');
  if (clubWageBill(club) + wage > club.wageBudget * 1.12) return toast('The contract would take wages too far over budget.');
  if (state.transfers.negotiations.some(item => item.playerId === player.id && item.status === 'pending')) return toast('You already have an active offer for this player.');
  state.transfers.negotiations.push({ id: `neg-${Date.now()}`, playerId: player.id, fee, wage, years, role, status: 'pending', createdWeek: state.week, resolveWeek: state.week });
  ui.modal = null;
  state.inbox.unshift(createMessage(`Offer submitted for ${player.lastName}`, `The proposed package is ${formatMoney(fee, true)} plus ${formatMoney(wage, true)} per week. A response is expected after the next match week.`, 'Director of Football', true));
  saveGame(false);
  toast('Offer submitted');
  render();
}

function submitContract(playerId) {
  const player = playerById(playerId);
  if (!player || player.clubId !== state.userClubId) return;
  const wage = Math.max(100, Number(document.getElementById('contract-wage')?.value || 0));
  const years = Number(document.getElementById('contract-years')?.value || 3);
  if (clubWageBill(userClub()) - player.wage + wage > userClub().wageBudget * 1.1) return toast('The wage budget cannot support that contract.');
  const required = player.wage * (player.age <= 24 ? 1.06 : player.contractYears <= 1 ? 1.02 : 1.1);
  if (wage >= required || Math.random() < 0.22) {
    player.wage = wage;
    player.contractYears = years;
    player.morale = clamp(player.morale + 4, 0, 100);
    state.inbox.unshift(createMessage(`${player.lastName} signs new deal`, `${player.firstName} ${player.lastName} has committed to a new ${years}-year contract worth ${formatMoney(wage, true)} per week.`, 'Club Secretary', true));
    toast('Contract signed');
  } else {
    state.inbox.unshift(createMessage(`${player.lastName} rejects contract`, 'The player’s representative believes the wage does not reflect their status in the squad.', 'Club Secretary', true));
    toast('Contract rejected');
  }
  ui.modal = null;
  render();
}

function respondToIncomingOffer(offerId, response) {
  const offer = state.transfers.incomingOffers.find(item => item.id === offerId);
  if (!offer || offer.status !== 'pending') return;
  const player = playerById(offer.playerId);
  const bidder = clubById(offer.clubId);
  if (response === 'accept' && player?.clubId === state.userClubId) {
    const seller = userClub();
    seller.squad = seller.squad.filter(id => id !== player.id);
    seller.balance += offer.fee;
    seller.transferBudget += Math.round(offer.fee * 0.76);
    bidder.squad.push(player.id);
    bidder.balance -= offer.fee;
    bidder.transferBudget = Math.max(0, bidder.transferBudget - offer.fee);
    player.clubId = bidder.id;
    player.transferListed = false;
    player.wage = Math.round(player.wage * randFloat(1.04,1.2) / 100) * 100;
    player.contractYears = rand(2,5);
    autoPickLineup(seller, state.players);
    autoPickLineup(bidder, state.players);
    state.transfers.history.push({ date: state.date, playerId: player.id, playerName: `${player.firstName} ${player.lastName}`, from: seller.name, to: bidder.name, fee: offer.fee });
    state.news.push({ title: `${player.firstName} ${player.lastName} joins ${bidder.name} for ${formatMoney(offer.fee,true)}`, date: state.date, type: 'transfer' });
    state.inbox.unshift(createMessage(`${player.lastName} sold`, `${bidder.name} completed the transfer for ${formatMoney(offer.fee,true)}.`, 'Director of Football', true));
    offer.status = 'accepted';
  } else {
    offer.status = 'rejected';
    state.inbox.unshift(createMessage(`Offer rejected for ${player?.lastName || 'player'}`, `${bidder.name} has been informed that the offer will not be accepted.`, 'Director of Football', true));
  }
  render();
}

function upgradeFacility(key) {
  const club = userClub();
  const level = club.facilities[key];
  if (level >= 10) return;
  const cost = facilityUpgradeCost(key, level, club.division);
  if (club.balance < cost) return toast('Insufficient club funds.');
  club.balance -= cost;
  club.facilities[key] += 1;
  if (key === 'stadium') {
    club.stadiumCapacity = Math.round(club.stadiumCapacity * 1.09 / 100) * 100;
    club.attendance = Math.min(club.attendance, club.stadiumCapacity);
  }
  state.inbox.unshift(createMessage(`${humanise(key)} upgrade complete`, `${club.name} now has level ${club.facilities[key]} ${key} infrastructure.`, 'Board', true));
  toast('Facility upgraded');
  render();
}

function submitBudgetAdjustment() {
  const club = userClub();
  const requested = Math.max(0, Number(document.getElementById('budget-transfer')?.value || 0));
  const totalResource = club.transferBudget + club.wageBudget * 50;
  if (requested > totalResource) return toast('That allocation exceeds the available budget.');
  const newWageBudget = Math.round((totalResource - requested) / 50 / 100) * 100;
  if (newWageBudget < clubWageBill(club)) return toast('The new wage budget would be below current commitments.');
  club.transferBudget = requested;
  club.wageBudget = newWageBudget;
  ui.modal = null;
  toast('Budgets adjusted');
  render();
}

function handleMessageAction(messageId, actionKey) {
  const message = state.inbox.find(item => item.id === messageId);
  if (!message) return;
  message.unread = false;
  const action = message.actions?.find(item => item.key === actionKey);
  if (action?.type === 'view') {
    ui.view = action.view;
    ui.subview = { ...ui.subview, ...(action.subview || {}) };
  }
  render();
}

app.addEventListener('click', event => {
  const actionNode = event.target.closest('[data-action]');
  const viewNode = event.target.closest('[data-view]');
  if (viewNode && !actionNode) {
    ui.view = viewNode.dataset.view;
    ui.moreOpen = false;
    ui.modal = null;
    render();
    return;
  }
  if (!actionNode) return;
  if (event.target.closest('[data-stop-propagation]') && ['close-modal','close-more'].includes(actionNode.dataset.action)) return;
  const action = actionNode.dataset.action;
  switch (action) {
    case 'continue-game':
      if (loadGame()) { ui.view = 'dashboard'; render(); } else toast('The local save could not be loaded.');
      break;
    case 'new-game': renderSetup(); break;
    case 'cancel-setup': renderBoot(); break;
    case 'select-start-club': {
      document.querySelectorAll('.club-option').forEach(node => node.classList.toggle('selected', node === actionNode));
      const start = document.querySelector('[data-action="start-career"]');
      if (start) start.dataset.clubId = actionNode.dataset.clubId;
      break;
    }
    case 'start-career': {
      const managerName = document.getElementById('manager-name')?.value.trim() || 'Alex Morgan';
      const seed = Number(document.getElementById('career-seed')?.value || Date.now());
      state = createInitialState(managerName, Number(actionNode.dataset.clubId), seed);
      saveGame(false);
      ui.view = 'dashboard';
      render();
      break;
    }
    case 'export-from-boot':
      if (loadGame()) exportSave();
      break;
    case 'toggle-more': ui.moreOpen = !ui.moreOpen; render(); break;
    case 'close-more': ui.moreOpen = false; render(); break;
    case 'advance-primary':
      if (state.seasonComplete) beginNewSeason(); else if (userFixture()) startLiveMatch();
      break;
    case 'start-match': startLiveMatch(); break;
    case 'quick-sim': quickSimUserMatch(); break;
    case 'new-season': beginNewSeason(); break;
    case 'open-player': ui.modal = { type: 'player', playerId: Number(actionNode.dataset.playerId) }; render(); break;
    case 'close-modal': ui.modal = null; render(); break;
    case 'auto-pick': autoPickLineup(userClub(), state.players); toast('Best available XI selected'); render(); break;
    case 'squad-filter': ui.subview.squadFilter = actionNode.dataset.filter; render(); break;
    case 'formation': userClub().tactics.formation = actionNode.dataset.formation; autoPickLineup(userClub(), state.players); render(); break;
    case 'select-tactic-slot': ui.modal = { type: 'selectPlayer', slotIndex: Number(actionNode.dataset.slotIndex) }; render(); break;
    case 'assign-player': {
      const club = userClub();
      const playerId = Number(actionNode.dataset.playerId);
      const slotIndex = Number(actionNode.dataset.slotIndex);
      const existingIndex = club.tactics.lineup.indexOf(playerId);
      if (existingIndex >= 0) [club.tactics.lineup[existingIndex], club.tactics.lineup[slotIndex]] = [club.tactics.lineup[slotIndex], club.tactics.lineup[existingIndex]];
      else club.tactics.lineup[slotIndex] = playerId;
      rebuildBench(club);
      ui.modal = null;
      render();
      break;
    }
    case 'tactic-segment': userClub().tactics[actionNode.dataset.key] = actionNode.dataset.value; render(); break;
    case 'transfer-tab': ui.subview.transferTab = actionNode.dataset.tab; render(); break;
    case 'transfer-position': ui.subview.transferPosition = actionNode.dataset.position; render(); break;
    case 'scout-player': {
      const id = Number(actionNode.dataset.playerId);
      state.scouting.reports[id] = Math.max(state.scouting.reports[id] || 0, 5);
      const player = playerById(id);
      toast(`${player.lastName} assigned to scouts`);
      render();
      break;
    }
    case 'toggle-shortlist': {
      const id = Number(actionNode.dataset.playerId);
      state.scouting.shortlist = state.scouting.shortlist.includes(id) ? state.scouting.shortlist.filter(item => item !== id) : [...state.scouting.shortlist, id];
      render();
      break;
    }
    case 'make-offer': ui.modal = { type: 'transferOffer', playerId: Number(actionNode.dataset.playerId) }; render(); break;
    case 'submit-transfer-offer': submitTransferOffer(Number(actionNode.dataset.playerId)); break;
    case 'toggle-transfer-list': {
      const player = playerById(actionNode.dataset.playerId);
      player.transferListed = !player.transferListed;
      toast(player.transferListed ? 'Player transfer listed' : 'Player removed from list');
      render();
      break;
    }
    case 'offer-contract': ui.modal = { type: 'contract', playerId: Number(actionNode.dataset.playerId) }; render(); break;
    case 'submit-contract': submitContract(Number(actionNode.dataset.playerId)); break;
    case 'respond-offer': respondToIncomingOffer(actionNode.dataset.offerId, actionNode.dataset.response); break;
    case 'training-focus': state.training.focus = actionNode.dataset.focus; render(); break;
    case 'adjust-budget': ui.modal = { type: 'budget' }; render(); break;
    case 'submit-budget': submitBudgetAdjustment(); break;
    case 'upgrade-facility': upgradeFacility(actionNode.dataset.facility); break;
    case 'league-division': ui.subview.leagueDivision = Number(actionNode.dataset.division); render(); break;
    case 'league-tab': ui.subview.leagueTab = actionNode.dataset.tab; render(); break;
    case 'inbox-filter': ui.subview.inboxFilter = actionNode.dataset.filter; render(); break;
    case 'read-message': {
      const message = state.inbox.find(item => item.id === actionNode.dataset.messageId);
      if (message) message.unread = false;
      render();
      break;
    }
    case 'mark-all-read': state.inbox.forEach(message => { message.unread = false; }); render(); break;
    case 'message-action': handleMessageAction(actionNode.dataset.messageId, actionNode.dataset.messageAction); break;
    case 'save-game': saveGame(true); break;
    case 'export-save': exportSave(); break;
    case 'confirm-delete-save': ui.modal = { type: 'confirmDelete' }; render(); break;
    case 'delete-save': deleteSave(); break;
    case 'match-pause': ui.match.paused = !ui.match.paused; renderMatch(); break;
    case 'match-speed': ui.match.speed = Number(actionNode.dataset.speed); renderMatch(); break;
    case 'match-mentality': {
      const mentality = actionNode.dataset.mentality;
      ui.match.userMentality = mentality;
      userClub().tactics.mentality = mentality;
      addMatchCommentary(Math.ceil(ui.match.minute), `${userClub().name} switch to a ${mentality.toLowerCase()} mentality.`, 'normal');
      renderMatch();
      break;
    }
    case 'continue-after-match': continueAfterLiveMatch(); break;
    default: break;
  }
});

app.addEventListener('change', event => {
  const target = event.target;
  if (target.matches('[data-action="import-save"]')) {
    const file = target.files?.[0];
    if (file) importSave(file);
    return;
  }
  if (target.dataset.change === 'squad-sort') { ui.subview.squadSort = target.value; render(); }
  else if (target.dataset.change === 'transfer-position') { ui.subview.transferPosition = target.value; render(); }
  else if (target.dataset.change === 'training-rest') { state.training.restDay = target.checked; render(); }
  else if (target.dataset.change === 'autosave') { state.settings.autosave = target.checked; saveGame(false); render(); }
  else if (target.dataset.change === 'default-match-speed') { state.settings.matchSpeed = Number(target.value); saveGame(false); render(); }
  else if (target.dataset.input === 'squad-query') { ui.subview.squadQuery = target.value; render(); }
  else if (target.dataset.input === 'transfer-query') { ui.subview.transferQuery = target.value; render(); }
});

app.addEventListener('input', event => {
  const target = event.target;
  if (target.dataset.range === 'tactic') {
    userClub().tactics[target.dataset.key] = Number(target.value);
    const label = target.closest('.range-wrap')?.querySelector('strong');
    if (label) label.textContent = target.value;
  } else if (target.dataset.range === 'training-intensity') {
    state.training.intensity = Number(target.value);
    const label = target.closest('.range-wrap')?.querySelector('strong');
    if (label) label.textContent = target.value;
  }
});

window.addEventListener('beforeunload', () => {
  if (state && state.settings.autosave && !ui.match) saveGame(false);
});

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

renderBoot();

</script>
</body>
</html>
