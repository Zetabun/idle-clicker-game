<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#070b11" />
<title>Strikewatch: Spectator Ops</title>
<style>
  :root {
    color-scheme: dark;
    --panel: rgba(7, 12, 19, .76);
    --line: rgba(255,255,255,.14);
    --text: #f4f7fb;
    --muted: #9eabba;
    --accent: #f4b942;
    --blue: #4aa8ff;
    --red: #ff5f5f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05080d; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { touch-action: manipulation; }
  #app { position: fixed; inset: 0; overflow: hidden; background: #05080d; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: auto; }

  .topbar {
    position: absolute; left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); top: max(10px, env(safe-area-inset-top));
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none;
  }
  .brand, .round, .feed, .spectator, .controls, .status {
    background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 12px 36px rgba(0,0,0,.32);
  }
  .brand { padding: 9px 11px; border-radius: 12px; min-width: 132px; }
  .eyebrow { font-size: 9px; letter-spacing: .18em; color: var(--accent); font-weight: 800; }
  .brand h1 { margin: 2px 0 0; font-size: 14px; line-height: 1; letter-spacing: .04em; }
  .round { border-radius: 12px; padding: 8px 10px; text-align: center; min-width: 110px; }
  .score { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 900; font-size: 17px; }
  .score .blue { color: var(--blue); }
  .score .red { color: var(--red); }
  .timer { margin-top: 2px; color: var(--muted); font-size: 10px; letter-spacing: .12em; }

  .feed {
    position: absolute; right: max(10px, env(safe-area-inset-right)); top: calc(max(10px, env(safe-area-inset-top)) + 65px);
    width: min(255px, 62vw); padding: 8px; border-radius: 12px; pointer-events: none;
  }
  .feed-row { font-size: 10px; line-height: 1.35; padding: 3px 2px; color: #e8eef6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .feed-row b { color: #fff; }
  .feed-row .weapon { color: var(--accent); padding: 0 4px; }

  .spectator {
    position: absolute; left: max(10px, env(safe-area-inset-left)); bottom: calc(max(76px, env(safe-area-inset-bottom) + 66px));
    padding: 9px 11px; border-radius: 12px; min-width: 165px; pointer-events: none;
  }
  .spectator .label { color: var(--accent); font-size: 9px; font-weight: 900; letter-spacing: .16em; }
  .spectator .name { margin-top: 2px; font-size: 16px; font-weight: 900; }
  .spectator .meta { margin-top: 3px; font-size: 10px; color: var(--muted); display: flex; gap: 8px; }
  .health { height: 5px; margin-top: 7px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.12); }
  .health > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg,#e54444,#f2c14e,#58d68d); transform-origin: left; }

  .status {
    position: absolute; left: 50%; top: 21%; transform: translateX(-50%); border-radius: 12px; padding: 8px 12px;
    font-size: 11px; font-weight: 900; letter-spacing: .14em; opacity: 0; transition: opacity .18s; pointer-events: none;
  }
  .status.show { opacity: 1; }

  .controls {
    position: absolute; left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom));
    display: grid; grid-template-columns: 1fr 1.35fr 1fr; gap: 8px; padding: 8px; border-radius: 16px;
  }
  button {
    appearance: none; border: 1px solid rgba(255,255,255,.14); color: #fff; background: rgba(255,255,255,.075); min-height: 48px; border-radius: 12px;
    font: inherit; font-weight: 850; font-size: 11px; letter-spacing: .04em;
  }
  button:active { transform: scale(.98); background: rgba(255,255,255,.13); }
  button.primary { background: linear-gradient(180deg, rgba(244,185,66,.28), rgba(244,185,66,.12)); border-color: rgba(244,185,66,.48); }

  .rotate-note { display: none; position: absolute; inset: 0; place-items: center; background: #05080d; z-index: 20; padding: 28px; text-align: center; }
  .rotate-note div { max-width: 320px; }
  .rotate-note strong { display: block; font-size: 22px; margin-bottom: 8px; }
  .rotate-note span { color: var(--muted); font-size: 13px; }
  @media (orientation: portrait) and (max-width: 700px) {
    .rotate-note { display: grid; }
  }
  @media (min-width: 900px) {
    .controls { width: 460px; left: 50%; right: auto; transform: translateX(-50%); }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="Automated first-person combat simulation"></canvas>

  <div class="topbar">
    <div class="brand">
      <div class="eyebrow">LIVE COMBAT FEED</div>
      <h1>STRIKEWATCH</h1>
    </div>
    <div class="round">
      <div class="score"><span class="blue" id="blueScore">0</span><span>—</span><span class="red" id="redScore">0</span></div>
      <div class="timer" id="timer">03:00</div>
    </div>
  </div>

  <div class="feed" id="feed"></div>
  <div class="status" id="status">TARGET ELIMINATED</div>

  <div class="spectator">
    <div class="label">SPECTATING</div>
    <div class="name" id="spectatorName">BLUE 01</div>
    <div class="meta"><span id="teamText">BLUE TEAM</span><span id="kdText">0 K / 0 D</span></div>
    <div class="health"><i id="healthBar"></i></div>
  </div>

  <div class="controls">
    <button id="prevBtn">◀ PREVIOUS</button>
    <button class="primary" id="autoBtn">AUTO: ON</button>
    <button id="nextBtn">NEXT ▶</button>
  </div>

  <div class="rotate-note">
    <div><strong>Rotate your phone</strong><span>Strikewatch is designed for landscape play.</span></div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const feedEl = document.getElementById('feed');
  const spectatorNameEl = document.getElementById('spectatorName');
  const teamTextEl = document.getElementById('teamText');
  const kdTextEl = document.getElementById('kdText');
  const healthBarEl = document.getElementById('healthBar');
  const blueScoreEl = document.getElementById('blueScore');
  const redScoreEl = document.getElementById('redScore');
  const timerEl = document.getElementById('timer');
  const statusEl = document.getElementById('status');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const autoBtn = document.getElementById('autoBtn');

  const TAU = Math.PI * 2;
  const FOV = Math.PI / 2.65;
  const MAX_VIEW = 22;
  const TEAM_BLUE = 0;
  const TEAM_RED = 1;
  const TEAM_COLOURS = ['#4aa8ff', '#ff5f5f'];
  const MAP = [
    '1111111111111111',
    '1000000010000001',
    '1000110010011001',
    '1000000000000001',
    '1011001111001101',
    '1000001001000001',
    '1000001001000001',
    '1000000000000001',
    '1001110000111001',
    '1000010000100001',
    '1010011110100101',
    '1000000000000001',
    '1001100110011001',
    '1000000000000001',
    '1000000000000001',
    '1111111111111111'
  ];
  const MAP_W = MAP[0].length;
  const MAP_H = MAP.length;

  const spawnPoints = {
    0: [
      {x:2.2,y:2.2},{x:2.2,y:7.5},{x:2.2,y:13.2},{x:6.2,y:13.2},{x:6.2,y:2.2}
    ],
    1: [
      {x:13.7,y:2.2},{x:13.7,y:7.5},{x:13.7,y:13.2},{x:9.8,y:13.2},{x:9.8,y:2.2}
    ]
  };

  const weaponNames = ['VX-7', 'AR-12', 'M8 CARBINE', 'KILO-9'];
  const names = {
    0: ['BLUE 01','BLUE 02','BLUE 03','BLUE 04','BLUE 05'],
    1: ['RED 01','RED 02','RED 03','RED 04','RED 05']
  };

  let bots = [];
  let blueScore = 0;
  let redScore = 0;
  let roundTime = 180;
  let lastTime = performance.now();
  let spectatorIndex = 0;
  let autoSpectate = true;
  let autoTimer = 7;
  let hitPulse = 0;
  let statusTimer = 0;
  let shake = 0;
  let muzzle = 0;
  let feed = [];
  let roundEnding = false;
  let depthBuffer = [];
  let DPR = 1;

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function angleDiff(a, b) {
    let d = (a - b + Math.PI) % TAU - Math.PI;
    return d < -Math.PI ? d + TAU : d;
  }
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  function isWall(x, y) {
    const mx = Math.floor(x), my = Math.floor(y);
    return mx < 0 || my < 0 || mx >= MAP_W || my >= MAP_H || MAP[my][mx] !== '0';
  }
  function canStand(x, y, r = .2) {
    return !isWall(x-r,y-r) && !isWall(x+r,y-r) && !isWall(x-r,y+r) && !isWall(x+r,y+r);
  }
  function randomSpawn(team) {
    const list = spawnPoints[team];
    const base = list[Math.floor(Math.random() * list.length)];
    return { x: base.x + (Math.random()-.5)*.22, y: base.y + (Math.random()-.5)*.22 };
  }
  function hasLineOfSight(a, b) {
    const d = dist(a,b);
    const steps = Math.ceil(d / .11);
    for (let i = 1; i < steps; i++) {
      const t = i / steps;
      if (isWall(a.x + (b.x-a.x)*t, a.y + (b.y-a.y)*t)) return false;
    }
    return true;
  }

  class Bot {
    constructor(team, slot) {
      const p = randomSpawn(team);
      this.team = team;
      this.slot = slot;
      this.name = names[team][slot];
      this.weapon = weaponNames[Math.floor(Math.random()*weaponNames.length)];
      this.x = p.x; this.y = p.y;
      this.angle = team === 0 ? 0 : Math.PI;
      this.health = 100;
      this.alive = true;
      this.respawn = 0;
      this.cooldown = Math.random()*.8;
      this.burst = 0;
      this.target = null;
      this.think = 0;
      this.strafe = Math.random()<.5?-1:1;
      this.kills = 0;
      this.deaths = 0;
      this.speed = .78 + Math.random()*.18;
      this.accuracy = .68 + Math.random()*.18;
      this.flash = 0;
      this.recoil = 0;
      this.hurt = 0;
      this.pathAngle = this.angle;
    }
    reset() {
      const p = randomSpawn(this.team);
      this.x = p.x; this.y = p.y;
      this.angle = this.team === 0 ? 0 : Math.PI;
      this.health = 100;
      this.alive = true;
      this.respawn = 0;
      this.target = null;
      this.cooldown = .4 + Math.random()*.6;
      this.flash = 0;
      this.recoil = 0;
      this.hurt = 0;
    }
    die(killer) {
      if (!this.alive) return;
      this.alive = false;
      this.health = 0;
      this.respawn = 2.4 + Math.random()*1.7;
      this.deaths++;
      if (killer) {
        killer.kills++;
        if (killer.team === 0) blueScore++; else redScore++;
        addFeed(killer, this);
        if (killer === bots[spectatorIndex]) {
          showStatus('TARGET ELIMINATED');
          hitPulse = 1;
        }
      }
      if (this === bots[spectatorIndex]) {
        showStatus('OPERATOR DOWN');
        shake = 1;
        if (autoSpectate) setTimeout(() => selectLiving(1), 650);
      }
    }
    update(dt) {
      this.flash = Math.max(0, this.flash - dt*8);
      this.recoil = Math.max(0, this.recoil - dt*8);
      this.hurt = Math.max(0, this.hurt - dt*2.5);
      if (!this.alive) {
        this.respawn -= dt;
        if (this.respawn <= 0 && !roundEnding) this.reset();
        return;
      }

      this.cooldown -= dt;
      this.think -= dt;
      if (this.think <= 0) {
        this.think = .18 + Math.random()*.26;
        const enemies = bots.filter(b => b.alive && b.team !== this.team);
        enemies.sort((a,b) => dist(this,a)-dist(this,b));
        this.target = enemies.find(e => dist(this,e) < 9.6 && hasLineOfSight(this,e)) || enemies[0] || null;
        if (Math.random()<.22) this.strafe *= -1;
      }

      let moveAngle = this.pathAngle;
      let moveSpeed = this.speed;
      if (this.target) {
        const desired = Math.atan2(this.target.y-this.y, this.target.x-this.x);
        this.angle += angleDiff(desired, this.angle) * clamp(dt*4.5,0,1);
        const d = dist(this,this.target);
        const visible = d < 10.5 && hasLineOfSight(this,this.target);
        if (visible) {
          if (d > 4.6) moveAngle = desired + this.strafe*.42;
          else if (d < 2.5) moveAngle = desired + Math.PI + this.strafe*.38;
          else moveAngle = desired + this.strafe*(Math.PI/2);
          moveSpeed *= d < 3 ? .72 : .9;
          if (this.cooldown <= 0 && Math.abs(angleDiff(desired,this.angle)) < .2) this.shoot(this.target,d);
        } else {
          moveAngle = desired;
        }
      }

      this.pathAngle += angleDiff(moveAngle, this.pathAngle) * clamp(dt*3,0,1);
      const dx = Math.cos(this.pathAngle)*moveSpeed*dt;
      const dy = Math.sin(this.pathAngle)*moveSpeed*dt;
      let moved = false;
      if (canStand(this.x+dx,this.y,.19)) { this.x += dx; moved = true; }
      if (canStand(this.x,this.y+dy,.19)) { this.y += dy; moved = true; }
      if (!moved) {
        this.pathAngle += (Math.random()<.5?-1:1)*(1.15+Math.random());
        this.strafe *= -1;
      }
    }
    shoot(target, distance) {
      this.cooldown = .24 + Math.random()*.24;
      this.flash = 1;
      this.recoil = 1;
      if (this === bots[spectatorIndex]) muzzle = 1;
      const distancePenalty = clamp((distance-2)/12,0,.38);
      const hitChance = this.accuracy - distancePenalty;
      if (Math.random() < hitChance && target.alive && hasLineOfSight(this,target)) {
        const damage = 19 + Math.random()*19;
        target.health -= damage;
        target.hurt = 1;
        if (target === bots[spectatorIndex]) {
          shake = Math.min(1, shake + .45);
          hitPulse = Math.max(hitPulse,.55);
        }
        if (target.health <= 0) target.die(this);
      }
    }
  }

  function createMatch() {
    bots = [];
    for (let team=0; team<2; team++) for (let i=0;i<5;i++) bots.push(new Bot(team,i));
    blueScore = 0; redScore = 0; roundTime = 180; roundEnding = false;
    spectatorIndex = 0; feed = [];
    addSystemFeed('ROUND STARTED — FIRST TO 30');
  }

  function addFeed(killer, victim) {
    feed.unshift({
      html: `<b style="color:${TEAM_COLOURS[killer.team]}">${killer.name}</b><span class="weapon">${killer.weapon}</span><b style="color:${TEAM_COLOURS[victim.team]}">${victim.name}</b>`,
      life: 6
    });
    feed = feed.slice(0,5);
    renderFeed();
  }
  function addSystemFeed(text) {
    feed.unshift({ html: `<span style="color:#f4b942">${text}</span>`, life: 5 });
    feed = feed.slice(0,5);
    renderFeed();
  }
  function renderFeed() {
    feedEl.innerHTML = feed.map(item => `<div class="feed-row">${item.html}</div>`).join('');
  }
  function showStatus(text) {
    statusEl.textContent = text;
    statusEl.classList.add('show');
    statusTimer = 1.1;
  }

  function selectLiving(direction=1) {
    for (let i=1;i<=bots.length;i++) {
      const idx = (spectatorIndex + direction*i + bots.length) % bots.length;
      if (bots[idx].alive) { spectatorIndex = idx; autoTimer = 7; updateHud(); return; }
    }
  }
  function updateHud() {
    const b = bots[spectatorIndex];
    if (!b) return;
    spectatorNameEl.textContent = b.name;
    spectatorNameEl.style.color = TEAM_COLOURS[b.team];
    teamTextEl.textContent = b.team === 0 ? 'BLUE TEAM' : 'RED TEAM';
    kdTextEl.textContent = `${b.kills} K / ${b.deaths} D`;
    healthBarEl.style.transform = `scaleX(${clamp(b.health/100,0,1)})`;
    blueScoreEl.textContent = blueScore;
    redScoreEl.textContent = redScore;
    const m = Math.max(0,Math.floor(roundTime/60));
    const s = Math.max(0,Math.floor(roundTime%60)).toString().padStart(2,'0');
    timerEl.textContent = `${m.toString().padStart(2,'0')}:${s}`;
  }

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(320, innerWidth);
    const h = Math.max(240, innerHeight);
    canvas.width = Math.floor(w * DPR);
    canvas.height = Math.floor(h * DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }

  function castRay(px, py, angle) {
    const sin = Math.sin(angle), cos = Math.cos(angle);
    let d = 0;
    let hitX = px, hitY = py;
    while (d < MAX_VIEW) {
      d += .035;
      hitX = px + cos*d;
      hitY = py + sin*d;
      if (isWall(hitX,hitY)) break;
    }
    const fx = hitX - Math.floor(hitX), fy = hitY - Math.floor(hitY);
    const edge = Math.min(fx,1-fx,fy,1-fy);
    return { d, hitX, hitY, edge };
  }

  function drawWorld(cam, w, h) {
    const horizon = h*.48 + Math.sin(performance.now()/210)*1.1;
    const sky = ctx.createLinearGradient(0,0,0,horizon);
    sky.addColorStop(0,'#0c1724'); sky.addColorStop(1,'#355064');
    ctx.fillStyle = sky; ctx.fillRect(0,0,w,horizon);
    const ground = ctx.createLinearGradient(0,horizon,0,h);
    ground.addColorStop(0,'#242729'); ground.addColorStop(1,'#080a0c');
    ctx.fillStyle = ground; ctx.fillRect(0,horizon,w,h-horizon);

    const rayCount = Math.min(560, Math.max(240, Math.floor(w*.72)));
    const sliceW = w/rayCount + .6;
    depthBuffer = new Array(rayCount);
    for (let i=0;i<rayCount;i++) {
      const norm = i/(rayCount-1)-.5;
      const rayAngle = cam.angle + norm*FOV;
      const hit = castRay(cam.x,cam.y,rayAngle);
      const corrected = hit.d * Math.cos(rayAngle-cam.angle);
      depthBuffer[i] = corrected;
      const wallH = Math.min(h*1.35, h/(corrected*.78));
      const y = horizon-wallH/2;
      const fog = clamp(1-corrected/MAX_VIEW,0,1);
      const textureBand = ((Math.floor((hit.hitX+hit.hitY)*5)&1) ? .9 : 1.02);
      const sideShade = (hit.edge < .02 ? .78 : 1);
      const base = Math.floor((54 + fog*92)*textureBand*sideShade);
      ctx.fillStyle = `rgb(${Math.floor(base*.75)},${Math.floor(base*.86)},${base})`;
      ctx.fillRect(i*sliceW,y,sliceW+1,wallH);
      if (corrected < 8) {
        ctx.fillStyle = `rgba(255,255,255,${.02*fog})`;
        ctx.fillRect(i*sliceW,y,sliceW,wallH*.04);
      }
    }

    // Floor lane markings add movement and scale.
    ctx.save();
    ctx.globalAlpha = .12;
    ctx.fillStyle = '#dce7ed';
    for (let i=0;i<8;i++) {
      const yy = horizon + (i*i)*h*.008;
      ctx.fillRect(w*.48,yy,w*.04,Math.max(1,i*.45));
    }
    ctx.restore();

    drawBots(cam,w,h,horizon,rayCount);
  }

  function drawBots(cam,w,h,horizon,rayCount) {
    const visible = bots
      .filter(b => b.alive && b !== cam)
      .map(b => {
        const dx=b.x-cam.x, dy=b.y-cam.y;
        const d=Math.hypot(dx,dy);
        const a=angleDiff(Math.atan2(dy,dx),cam.angle);
        return {b,d,a};
      })
      .filter(o => Math.abs(o.a)<FOV*.62 && o.d<MAX_VIEW)
      .sort((a,b)=>b.d-a.d);

    for (const o of visible) {
      const screenX = w*(.5 + o.a/FOV);
      const depthIdx = clamp(Math.floor(screenX/w*rayCount),0,rayCount-1);
      if (depthBuffer[depthIdx] < o.d*.92) continue;
      const size = clamp(h/(o.d*1.15),18,h*.72);
      const foot = horizon + size*.48;
      const headY = foot-size;
      ctx.save();
      ctx.translate(screenX,0);
      ctx.globalAlpha = clamp(1-o.d/MAX_VIEW, .22,1);

      // Ground shadow.
      ctx.fillStyle='rgba(0,0,0,.35)';
      ctx.beginPath(); ctx.ellipse(0,foot+4,size*.2,size*.055,0,0,TAU); ctx.fill();

      // Legs.
      ctx.fillStyle='#12191f';
      ctx.fillRect(-size*.15,headY+size*.64,size*.11,size*.34);
      ctx.fillRect(size*.04,headY+size*.64,size*.11,size*.34);

      // Torso armour.
      ctx.fillStyle=o.b.team===0?'#285c83':'#7f3131';
      ctx.beginPath();
      ctx.moveTo(-size*.24,headY+size*.29); ctx.lineTo(size*.24,headY+size*.29);
      ctx.lineTo(size*.18,headY+size*.7); ctx.lineTo(-size*.18,headY+size*.7); ctx.closePath(); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.13)'; ctx.fillRect(-size*.17,headY+size*.34,size*.34,size*.055);

      // Head and visor.
      ctx.fillStyle='#20282f';
      ctx.beginPath(); ctx.arc(0,headY+size*.2,size*.14,0,TAU); ctx.fill();
      ctx.fillStyle=o.b.team===0?'#63bdff':'#ff8080';
      ctx.fillRect(-size*.105,headY+size*.17,size*.21,size*.045);

      // Rifle.
      ctx.save(); ctx.translate(size*.08,headY+size*.48); ctx.rotate(-.08);
      ctx.fillStyle='#15191c'; ctx.fillRect(-size*.05,-size*.025,size*.39,size*.055);
      ctx.fillStyle='#69727a'; ctx.fillRect(size*.24,-size*.016,size*.13,size*.028);
      if (o.b.flash>0) {
        const g=ctx.createRadialGradient(size*.42,0,0,size*.42,0,size*.22);
        g.addColorStop(0,'rgba(255,245,182,.95)'); g.addColorStop(1,'rgba(255,132,27,0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(size*.42,0,size*.22,0,TAU); ctx.fill();
      }
      ctx.restore();

      // Health indicator only at close range.
      if (o.d<7) {
        ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(-size*.24,headY-size*.1,size*.48,size*.045);
        ctx.fillStyle=TEAM_COLOURS[o.b.team]; ctx.fillRect(-size*.24,headY-size*.1,size*.48*clamp(o.b.health/100,0,1),size*.045);
      }
      if (o.b.hurt>0) {
        ctx.strokeStyle=`rgba(255,255,255,${o.b.hurt*.65})`; ctx.lineWidth=2;
        ctx.strokeRect(-size*.26,headY+size*.05,size*.52,size*.95);
      }
      ctx.restore();
    }
  }

  function drawWeapon(cam,w,h) {
    const t = performance.now()/1000;
    const bob = cam.alive ? Math.sin(t*7.5)*3 : 0;
    const recoil = cam.recoil*18;
    const x = w*.5 + Math.sin(t*3.8)*2;
    const y = h - h*.115 + bob + recoil;
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(-.045 + cam.recoil*.04);

    // Forearms.
    ctx.fillStyle='#25313a';
    ctx.beginPath(); ctx.moveTo(-w*.24,h*.15); ctx.lineTo(-w*.075,-h*.015); ctx.lineTo(-w*.01,h*.08); ctx.lineTo(-w*.15,h*.2); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(w*.2,h*.17); ctx.lineTo(w*.07,h*.015); ctx.lineTo(w*.015,h*.08); ctx.lineTo(w*.13,h*.2); ctx.closePath(); ctx.fill();

    // Rifle body.
    ctx.fillStyle='#0c1014';
    ctx.beginPath();
    ctx.moveTo(-w*.075,h*.12); ctx.lineTo(-w*.055,-h*.045); ctx.lineTo(w*.055,-h*.055); ctx.lineTo(w*.09,h*.11); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#27323a'; ctx.fillRect(-w*.044,-h*.052,w*.088,h*.065);
    ctx.fillStyle='#11161a'; ctx.fillRect(-w*.025,-h*.14,w*.05,h*.11);
    ctx.fillStyle='#3a444b'; ctx.fillRect(-w*.009,-h*.29,w*.018,h*.16);
    ctx.fillStyle='#0b0e11'; ctx.fillRect(-w*.035,-h*.095,w*.07,h*.022);

    // Sights.
    ctx.strokeStyle='#606d75'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(-w*.014,-h*.15); ctx.lineTo(-w*.014,-h*.19); ctx.lineTo(w*.014,-h*.19); ctx.lineTo(w*.014,-h*.15); ctx.stroke();

    if (muzzle>0) {
      const g=ctx.createRadialGradient(0,-h*.31,0,0,-h*.31,h*.22);
      g.addColorStop(0,'rgba(255,255,210,.95)'); g.addColorStop(.25,'rgba(255,194,65,.8)'); g.addColorStop(1,'rgba(255,106,0,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,-h*.31,h*.22,0,TAU); ctx.fill();
    }
    ctx.restore();

    // Crosshair.
    const gap=7+cam.recoil*9;
    ctx.strokeStyle='rgba(255,255,255,.75)'; ctx.lineWidth=1.4;
    ctx.beginPath();
    ctx.moveTo(w/2-gap-7,h*.48); ctx.lineTo(w/2-gap,h*.48);
    ctx.moveTo(w/2+gap,h*.48); ctx.lineTo(w/2+gap+7,h*.48);
    ctx.moveTo(w/2,h*.48-gap-7); ctx.lineTo(w/2,h*.48-gap);
    ctx.moveTo(w/2,h*.48+gap); ctx.lineTo(w/2,h*.48+gap+7);
    ctx.stroke();

    if (hitPulse>0) {
      ctx.strokeStyle=`rgba(255,255,255,${hitPulse})`; ctx.lineWidth=2.4;
      const s=10;
      ctx.beginPath();
      ctx.moveTo(w/2-s,h*.48-s); ctx.lineTo(w/2-3,h*.48-3);
      ctx.moveTo(w/2+s,h*.48-s); ctx.lineTo(w/2+3,h*.48-3);
      ctx.moveTo(w/2-s,h*.48+s); ctx.lineTo(w/2-3,h*.48+3);
      ctx.moveTo(w/2+s,h*.48+s); ctx.lineTo(w/2+3,h*.48+3);
      ctx.stroke();
    }
  }

  function drawDamageOverlay(cam,w,h) {
    if (cam.hurt>0 || shake>0) {
      const a=clamp(cam.hurt*.28 + shake*.12,0,.38);
      const g=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*.18,w/2,h/2,Math.max(w,h)*.62);
      g.addColorStop(0,'rgba(120,0,0,0)'); g.addColorStop(1,`rgba(170,0,0,${a})`);
      ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    }
    if (!cam.alive) {
      ctx.fillStyle='rgba(10,0,0,.48)'; ctx.fillRect(0,0,w,h);
      ctx.fillStyle='rgba(255,255,255,.92)'; ctx.textAlign='center'; ctx.font='900 24px system-ui';
      ctx.fillText('OPERATOR DOWN',w/2,h*.42);
      ctx.font='600 12px system-ui'; ctx.fillStyle='rgba(255,255,255,.62)';
      ctx.fillText('Switching combat feed…',w/2,h*.42+25);
    }
  }

  function endRound() {
    if (roundEnding) return;
    roundEnding=true;
    const text = blueScore===redScore ? 'ROUND DRAW' : (blueScore>redScore ? 'BLUE TEAM WINS' : 'RED TEAM WINS');
    showStatus(text);
    addSystemFeed(text);
    setTimeout(createMatch, 3500);
  }

  function update(dt) {
    if (!roundEnding) {
      roundTime -= dt;
      for (const b of bots) b.update(dt);
      if (roundTime<=0 || blueScore>=30 || redScore>=30) endRound();
    }
    for (const item of feed) item.life -= dt;
    const before=feed.length; feed=feed.filter(i=>i.life>0); if(feed.length!==before) renderFeed();

    muzzle=Math.max(0,muzzle-dt*9);
    hitPulse=Math.max(0,hitPulse-dt*3.5);
    shake=Math.max(0,shake-dt*3);
    if(statusTimer>0){ statusTimer-=dt; if(statusTimer<=0) statusEl.classList.remove('show'); }

    if(autoSpectate && !roundEnding){
      autoTimer-=dt;
      const current=bots[spectatorIndex];
      if(autoTimer<=0 || !current.alive){ selectLiving(1); autoTimer=5+Math.random()*4; }
    }
    updateHud();
  }

  function render() {
    const w=canvas.width/DPR, h=canvas.height/DPR;
    const cam=bots[spectatorIndex];
    if(!cam) return;
    const sx=(Math.random()-.5)*shake*9, sy=(Math.random()-.5)*shake*6;
    ctx.save(); ctx.translate(sx,sy);
    drawWorld(cam,w,h);
    drawWeapon(cam,w,h);
    drawDamageOverlay(cam,w,h);
    ctx.restore();
  }

  function loop(now) {
    const dt=Math.min(.033,(now-lastTime)/1000||.016); lastTime=now;
    update(dt); render(); requestAnimationFrame(loop);
  }

  prevBtn.addEventListener('click',()=>{ autoSpectate=false; autoBtn.textContent='AUTO: OFF'; selectLiving(-1); });
  nextBtn.addEventListener('click',()=>{ autoSpectate=false; autoBtn.textContent='AUTO: OFF'; selectLiving(1); });
  autoBtn.addEventListener('click',()=>{ autoSpectate=!autoSpectate; autoBtn.textContent=`AUTO: ${autoSpectate?'ON':'OFF'}`; autoTimer=1; });
  canvas.addEventListener('pointerup',e=>{
    if(e.clientX<innerWidth*.45){ autoSpectate=false; autoBtn.textContent='AUTO: OFF'; selectLiving(-1); }
    else if(e.clientX>innerWidth*.55){ autoSpectate=false; autoBtn.textContent='AUTO: OFF'; selectLiving(1); }
  });
  window.addEventListener('resize',resize,{passive:true});
  document.addEventListener('visibilitychange',()=>{ lastTime=performance.now(); });

  resize(); createMatch(); updateHud(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
