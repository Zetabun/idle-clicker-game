<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#070b11" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Strikewatch 7.4: Spectator Ops</title>
<style>
  :root {
    color-scheme: dark;
    --panel: rgba(8, 14, 22, .78);
    --line: rgba(255,255,255,.14);
    --text: #f4f7fb;
    --muted: #91a0b0;
    --accent: #f4b942;
    --blue: #52adff;
    --red: #ff6868;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05080d; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { touch-action: manipulation; }
  #app { position: fixed; inset: 0; overflow: hidden; background: #05080d; }
  canvas { width: 100%; height: 100%; display: block; }

  .topbar {
    position: absolute;
    left: max(10px, env(safe-area-inset-left));
    right: max(10px, env(safe-area-inset-right));
    top: max(10px, env(safe-area-inset-top));
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    pointer-events: none;
  }
  .brand, .round, .feed, .spectator, .controls, .status, .mapTag {
    background: var(--panel);
    border: 1px solid var(--line);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 14px 40px rgba(0,0,0,.34);
  }
  .brand { padding: 9px 11px; border-radius: 13px; min-width: 148px; }
  .eyebrow { font-size: 9px; letter-spacing: .18em; color: var(--accent); font-weight: 800; }
  .brand h1 { margin: 2px 0 0; font-size: 14px; line-height: 1; letter-spacing: .04em; }
  .sub { margin-top: 4px; color: var(--muted); font-size: 10px; letter-spacing: .08em; }

  .round { border-radius: 13px; padding: 8px 10px; text-align: center; min-width: 128px; }
  .score { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 900; font-size: 18px; }
  .score .blue { color: var(--blue); }
  .score .red { color: var(--red); }
  .timer { margin-top: 2px; color: var(--muted); font-size: 10px; letter-spacing: .12em; }

  .feed {
    position: absolute;
    right: max(10px, env(safe-area-inset-right));
    top: calc(max(10px, env(safe-area-inset-top)) + 74px);
    width: min(290px, 66vw);
    padding: 8px;
    border-radius: 13px;
    pointer-events: none;
  }
  .feed-row { font-size: 10px; line-height: 1.35; padding: 3px 2px; color: #e8eef6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .feed-row b { color: #fff; }
  .feed-row .weapon { color: var(--accent); padding: 0 4px; }

  .mapTag {
    position: absolute; left: max(10px, env(safe-area-inset-left)); top: calc(max(10px, env(safe-area-inset-top)) + 74px);
    border-radius: 13px; padding: 8px 11px; pointer-events: none; min-width: 128px;
  }
  .mapTag .mode { font-size: 9px; letter-spacing: .15em; font-weight: 800; color: var(--accent); }
  .mapTag .name { margin-top: 2px; font-size: 14px; font-weight: 900; }
  .mapTag .desc { margin-top: 3px; font-size: 10px; color: var(--muted); }

  .spectator {
    position: absolute; left: max(10px, env(safe-area-inset-left)); bottom: calc(max(76px, env(safe-area-inset-bottom) + 66px));
    padding: 10px 11px; border-radius: 13px; min-width: 185px; pointer-events: none;
  }
  .spectator .label { color: var(--accent); font-size: 9px; font-weight: 900; letter-spacing: .16em; }
  .spectator .name { margin-top: 2px; font-size: 16px; font-weight: 900; }
  .spectator .meta { margin-top: 3px; font-size: 10px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .health { height: 6px; margin-top: 7px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.12); }
  .health > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg,#d94242,#f2c14e,#58d68d); transform-origin: left; }

  .status {
    position: absolute; left: 50%; top: 18%; transform: translateX(-50%);
    border-radius: 13px; padding: 8px 12px; font-size: 11px; font-weight: 900; letter-spacing: .14em;
    opacity: 0; transition: opacity .18s; pointer-events: none;
  }
  .status.show { opacity: 1; }

  .controls {
    position: absolute;
    left: max(10px, env(safe-area-inset-left));
    right: max(10px, env(safe-area-inset-right));
    bottom: max(10px, env(safe-area-inset-bottom));
    display: grid; grid-template-columns: 1fr 1.35fr 1fr; gap: 7px; padding: 7px; border-radius: 15px;
  }
  button {
    appearance: none; border: 1px solid rgba(255,255,255,.14); color: #fff; background: rgba(255,255,255,.075); min-height: 46px; border-radius: 12px;
    font: inherit; font-weight: 850; font-size: 11px; letter-spacing: .04em;
  }
  button:active { transform: scale(.98); background: rgba(255,255,255,.13); }
  button.primary { background: linear-gradient(180deg, rgba(244,185,66,.28), rgba(244,185,66,.12)); border-color: rgba(244,185,66,.48); }

  .rotate-note { display: none; position: absolute; inset: 0; place-items: center; background: #05080d; z-index: 20; padding: 28px; text-align: center; }
  .rotate-note div { max-width: 320px; }
  .rotate-note strong { display: block; font-size: 22px; margin-bottom: 8px; }
  .rotate-note span { color: var(--muted); font-size: 13px; }
  @media (orientation: portrait) and (max-width: 700px) { .rotate-note { display: grid; } }
  @media (min-width: 900px) { .controls { width: 460px; left: 50%; right: auto; transform: translateX(-50%); } }
</style>
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="Automated first-person combat simulation"></canvas>

  <div class="topbar">
    <div class="brand">
      <div class="eyebrow">LIVE COMBAT FEED</div>
      <h1>STRIKEWATCH</h1>
      <div class="sub">Frontline spectator simulation · BUILD 7.4</div>
    </div>
    <div class="round">
      <div class="score"><span class="blue" id="blueScore">0</span><span>—</span><span class="red" id="redScore">0</span></div>
      <div class="timer" id="timer">03:00</div>
    </div>
  </div>

  <div class="mapTag">
    <div class="mode">TEAM DEATHMATCH</div>
    <div class="name">CITADEL YARD</div>
    <div class="desc">Industrial floor · strict line of fire · BUILD 7.4</div>
  </div>

  <div class="feed" id="feed"></div>
  <div class="status" id="status">TARGET ELIMINATED</div>

  <div class="spectator">
    <div class="label">SPECTATING</div>
    <div class="name" id="spectatorName">BLUE 01</div>
    <div class="meta"><span id="teamText">BLUE TEAM</span><span id="kdText">0 K / 0 D</span><span id="weaponText">VX-7</span></div>
    <div class="health"><i id="healthBar"></i></div>
  </div>

  <div class="controls">
    <button id="prevBtn">◀ PREVIOUS</button>
    <button class="primary" id="autoBtn">AUTO: ON</button>
    <button id="nextBtn">NEXT ▶</button>
  </div>

  <div class="rotate-note">
    <div><strong>Rotate your phone</strong><span>Strikewatch is designed for landscape play.</span></div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const feedEl = document.getElementById('feed');
  const spectatorNameEl = document.getElementById('spectatorName');
  const teamTextEl = document.getElementById('teamText');
  const kdTextEl = document.getElementById('kdText');
  const weaponTextEl = document.getElementById('weaponText');
  const healthBarEl = document.getElementById('healthBar');
  const blueScoreEl = document.getElementById('blueScore');
  const redScoreEl = document.getElementById('redScore');
  const timerEl = document.getElementById('timer');
  const statusEl = document.getElementById('status');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const autoBtn = document.getElementById('autoBtn');

  const TAU = Math.PI * 2;
  const FOV = Math.PI / 2.55;
  const MAX_VIEW = 26;
  const CAMERA_HEIGHT = 0.50;
  const WALL_HEIGHT = 1.0;
  const PLAYER_HEIGHT = 0.86;
  const PLAYER_WIDTH = 0.44;
  const TEAM_BLUE = 0;
  const TEAM_RED = 1;
  const TEAM_COLOURS = ['#52adff', '#ff6868'];
  const MAP = [
    '111111111111111111111111',
    '100000000000100000000001',
    '101111011110101111011101',
    '100001000010100001000001',
    '101101011010111011011101',
    '100100010000000010000001',
    '101101110111111011101101',
    '100001000100000010001001',
    '111001010101110010101001',
    '100000010100000010100001',
    '101111010111011110101101',
    '100000000001000000001001',
    '101111111101011111101101',
    '100010000001000010000001',
    '101010111101111010111101',
    '100010000100000010000001',
    '101111011101111011101101',
    '100000000000000000000001',
    '111111111111111111111111'
  ];
  const MAP_W = MAP[0].length;
  const MAP_H = MAP.length;
  const CELL_CENTER = 0.5;
  const BOT_RADIUS = 0.245;

  const spawnPoints = {
    0: [ {x: 1.7, y: 1.7}, {x: 2.5, y: 5.5}, {x: 5.1, y: 9.6}, {x: 2.1, y: 13.5}, {x: 4.7, y: 17.2} ],
    1: [ {x: 22.0, y: 1.7}, {x: 21.2, y: 5.5}, {x: 19.4, y: 9.6}, {x: 21.7, y: 13.5}, {x: 19.4, y: 17.2} ]
  };
  const hotspots = [
    {x: 6.5, y: 5.5}, {x: 8.5, y: 9.5}, {x: 12.5, y: 9.5}, {x: 15.5, y: 9.5}, {x: 18.5, y: 13.5}, {x: 12.5, y: 17.5}
  ];
  const weaponDefs = [
    { name: 'VX-7', damageMin: 18, damageMax: 27, fireRate: 0.11, accuracy: 0.82, range: 12.0 },
    { name: 'AR-12', damageMin: 22, damageMax: 31, fireRate: 0.15, accuracy: 0.78, range: 12.6 },
    { name: 'M8 CARBINE', damageMin: 17, damageMax: 25, fireRate: 0.10, accuracy: 0.79, range: 11.0 },
    { name: 'KILO-9', damageMin: 16, damageMax: 24, fireRate: 0.09, accuracy: 0.74, range: 9.8 }
  ];
  const names = {
    0: ['BLUE 01','BLUE 02','BLUE 03','BLUE 04','BLUE 05'],
    1: ['RED 01','RED 02','RED 03','RED 04','RED 05']
  };

  let bots = [];
  let blueScore = 0;
  let redScore = 0;
  let roundTime = 180;
  let lastTime = performance.now();
  let spectatorIndex = 0;
  let autoSpectate = true;
  let autoTimer = 5;
  let hitPulse = 0;
  let statusTimer = 0;
  let shake = 0;
  let muzzle = 0;
  let feed = [];
  let roundEnding = false;
  let depthBuffer = [];
  let DPR = 1;
  let textures = null;
  const combatDebug = {
    shotsFired: 0,
    blockedShotAttempts: 0,
    lastBlockedReason: ''
  };
  window.__strikewatchDebug = combatDebug;

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  function angleDiff(a, b) {
    let d = (a - b + Math.PI) % TAU - Math.PI;
    return d < -Math.PI ? d + TAU : d;
  }
  function isWall(x, y) {
    const mx = Math.floor(x), my = Math.floor(y);
    return mx < 0 || my < 0 || mx >= MAP_W || my >= MAP_H || MAP[my][mx] !== '0';
  }
  function canStand(x, y, r = 0.22) {
    return !isWall(x - r, y - r) && !isWall(x + r, y - r) && !isWall(x - r, y + r) && !isWall(x + r, y + r);
  }
  function nearestWalkablePoint(x, y) {
    if (canStand(x, y, BOT_RADIUS + 0.02)) return { x, y };
    const cx = Math.floor(x);
    const cy = Math.floor(y);
    for (let radius = 0; radius <= 6; radius++) {
      for (let oy = -radius; oy <= radius; oy++) {
        for (let ox = -radius; ox <= radius; ox++) {
          if (Math.max(Math.abs(ox), Math.abs(oy)) !== radius) continue;
          const px = cx + ox + 0.5;
          const py = cy + oy + 0.5;
          if (canStand(px, py, BOT_RADIUS + 0.04)) return { x: px, y: py };
        }
      }
    }
    return { x: 1.5, y: 1.5 };
  }
  function randomSpawn(team) {
    const list = spawnPoints[team];
    const selected = list[Math.floor(Math.random() * list.length)];
    const base = nearestWalkablePoint(selected.x, selected.y);
    for (let attempt = 0; attempt < 12; attempt++) {
      const candidate = { x: base.x + (Math.random() - 0.5) * 0.2, y: base.y + (Math.random() - 0.5) * 0.2 };
      if (canStand(candidate.x, candidate.y, BOT_RADIUS + 0.02)) return candidate;
    }
    return base;
  }
  function hasLineOfSight(a, b) {
    if (!a || !b) return false;
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const d = Math.hypot(dx, dy);
    if (d < 0.001) return true;

    const angle = Math.atan2(dy, dx);
    const dirX = dx / d;
    const dirY = dy / d;
    const perpX = -dirY;
    const perpY = dirX;

    // Use the same exact grid raycaster as the visible wall renderer. Three
    // parallel rays form a narrow line-of-fire corridor, preventing a bot from
    // firing through a diagonal wall corner when only a mathematical sliver is
    // open between two solid cells.
    const offsets = [0, -0.07, 0.07];
    const startInset = Math.min(BOT_RADIUS * 0.45, d * 0.08);
    const targetInset = Math.min(BOT_RADIUS * 0.62, d * 0.12);
    const requiredClearDistance = Math.max(0, d - startInset - targetInset);

    for (const offset of offsets) {
      const startX = a.x + dirX * startInset + perpX * offset;
      const startY = a.y + dirY * startInset + perpY * offset;
      if (isWall(startX, startY)) return false;
      const hit = castRay(startX, startY, angle);
      if (hit.d <= requiredClearDistance + 0.025) return false;
    }
    return true;
  }
  function clearanceAlong(x, y, angle, maxDistance = 1.5, radius = BOT_RADIUS) {
    const step = 0.07;
    for (let d = step; d <= maxDistance; d += step) {
      if (!canStand(x + Math.cos(angle) * d, y + Math.sin(angle) * d, radius)) return d - step;
    }
    return maxDistance;
  }
  function toCell(x, y) { return { x: Math.floor(x), y: Math.floor(y) }; }
  function keyOf(x, y) { return `${x},${y}`; }
  function fromKey(key) {
    const [x, y] = key.split(',').map(Number);
    return { x, y };
  }
  function neighbors(cell) {
    const out = [];
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for (const [dx, dy] of dirs) {
      const nx = cell.x + dx;
      const ny = cell.y + dy;
      if (nx >= 0 && ny >= 0 && nx < MAP_W && ny < MAP_H && MAP[ny][nx] === '0') out.push({ x: nx, y: ny });
    }
    return out;
  }
  function heuristic(a, b) { return Math.abs(a.x - b.x) + Math.abs(a.y - b.y); }
  function segmentHasClearance(a, b, radius = BOT_RADIUS + 0.085) {
    const length = Math.hypot(b.x - a.x, b.y - a.y);
    const steps = Math.max(2, Math.ceil(length / 0.12));
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const x = lerp(a.x, b.x, t);
      const y = lerp(a.y, b.y, t);
      if (!canStand(x, y, radius)) return false;
    }
    return true;
  }
  function smoothPath(path) {
    if (!path || path.length < 3) return path || [];
    const result = [path[0]];
    let anchor = 0;
    while (anchor < path.length - 1) {
      let furthest = anchor + 1;
      for (let i = path.length - 1; i > anchor + 1; i--) {
        if (segmentHasClearance(path[anchor], path[i])) {
          furthest = i;
          break;
        }
      }
      result.push(path[furthest]);
      anchor = furthest;
    }
    return result;
  }
  function findPath(startPos, goalPos) {
    const start = toCell(startPos.x, startPos.y);
    const goal = toCell(goalPos.x, goalPos.y);
    const goalKey = keyOf(goal.x, goal.y);
    const open = [start];
    const openSet = new Set([keyOf(start.x, start.y)]);
    const cameFrom = new Map();
    const gScore = new Map([[keyOf(start.x, start.y), 0]]);
    const fScore = new Map([[keyOf(start.x, start.y), heuristic(start, goal)]]);
    let loops = 0;

    while (open.length && loops < 1400) {
      loops++;
      let bestIndex = 0;
      let bestF = fScore.get(keyOf(open[0].x, open[0].y)) ?? Infinity;
      for (let i = 1; i < open.length; i++) {
        const value = fScore.get(keyOf(open[i].x, open[i].y)) ?? Infinity;
        if (value < bestF) {
          bestF = value;
          bestIndex = i;
        }
      }
      const current = open.splice(bestIndex, 1)[0];
      const currentKey = keyOf(current.x, current.y);
      openSet.delete(currentKey);
      if (currentKey === goalKey) {
        const path = [{ x: goal.x + CELL_CENTER, y: goal.y + CELL_CENTER }];
        let traceKey = currentKey;
        while (cameFrom.has(traceKey)) {
          const prevKey = cameFrom.get(traceKey);
          const prev = fromKey(prevKey);
          path.unshift({ x: prev.x + CELL_CENTER, y: prev.y + CELL_CENTER });
          traceKey = prevKey;
        }
        return smoothPath(path);
      }
      const currentG = gScore.get(currentKey) ?? Infinity;
      for (const n of neighbors(current)) {
        const nKey = keyOf(n.x, n.y);
        const tentative = currentG + 1;
        if (tentative < (gScore.get(nKey) ?? Infinity)) {
          cameFrom.set(nKey, currentKey);
          gScore.set(nKey, tentative);
          fScore.set(nKey, tentative + heuristic(n, goal));
          if (!openSet.has(nKey)) {
            open.push(n);
            openSet.add(nKey);
          }
        }
      }
    }
    return null;
  }

  function createProceduralTextures() {
    const make = (drawFn) => {
      const c = document.createElement('canvas');
      c.width = 64; c.height = 64;
      const g = c.getContext('2d');
      drawFn(g, c.width, c.height);
      return c;
    };

    const wall = make((g, w, h) => {
      g.fillStyle = '#5d6873'; g.fillRect(0, 0, w, h);
      for (let y = 0; y < h; y += 16) {
        g.fillStyle = y % 32 === 0 ? '#66727d' : '#55616c';
        g.fillRect(0, y, w, 16);
      }
      g.strokeStyle = 'rgba(0,0,0,.28)'; g.lineWidth = 2;
      for (let y = 0; y <= h; y += 16) { g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(w, y + 0.5); g.stroke(); }
      for (let x = 0; x <= w; x += 16) { g.beginPath(); g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, h); g.stroke(); }
      g.fillStyle = 'rgba(255,255,255,.06)';
      for (let i = 0; i < 55; i++) g.fillRect(Math.random() * w, Math.random() * h, 2, 2);
      g.fillStyle = '#a88b32'; g.fillRect(0, 28, w, 8);
      g.fillStyle = 'rgba(0,0,0,.22)';
      for (let x = 2; x < w; x += 8) g.fillRect(x, 30, 4, 4);
    });

    const wallDark = make((g, w, h) => {
      g.fillStyle = '#43515e'; g.fillRect(0, 0, w, h);
      for (let y = 0; y < h; y += 8) {
        g.fillStyle = y % 16 === 0 ? '#4f5d68' : '#394651';
        g.fillRect(0, y, w, 8);
      }
      g.fillStyle = 'rgba(255,255,255,.05)';
      for (let i = 0; i < 6; i++) g.fillRect(8 + i * 10, 10 + (i % 2) * 8, 6, 18);
      g.fillStyle = '#212931'; g.fillRect(0, 42, w, 12);
      g.strokeStyle = 'rgba(255,255,255,.06)'; g.lineWidth = 1;
      for (let x = 4; x < w; x += 8) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
    });

    const floor = make((g, w, h) => {
      // Worn industrial floor panels with clear seams, bolts and safety paint.
      g.fillStyle = '#454b4f'; g.fillRect(0, 0, w, h);
      for (let y = 0; y < h; y += 16) {
        for (let x = 0; x < w; x += 16) {
          const alt = ((x / 16 + y / 16) & 1) === 0;
          g.fillStyle = alt ? '#4a5155' : '#3e4549';
          g.fillRect(x, y, 16, 16);
          g.strokeStyle = 'rgba(10,13,15,.58)';
          g.lineWidth = 1;
          g.strokeRect(x + 0.5, y + 0.5, 15, 15);
          g.fillStyle = 'rgba(196,210,218,.22)';
          g.fillRect(x + 2, y + 2, 1, 1);
          g.fillRect(x + 13, y + 13, 1, 1);
        }
      }
      g.fillStyle = '#b28c25'; g.fillRect(27, 0, 10, h);
      g.fillStyle = '#1c2023';
      for (let y = -6; y < h + 8; y += 12) {
        g.save();
        g.translate(32, y);
        g.rotate(-0.55);
        g.fillRect(-7, -2, 14, 4);
        g.restore();
      }
      g.fillStyle = 'rgba(255,255,255,.075)';
      for (let i = 0; i < 95; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        g.fillRect(x, y, 1 + Math.random() * 3, 1);
      }
      g.strokeStyle = 'rgba(18,21,23,.32)';
      for (let i = 0; i < 9; i++) {
        g.beginPath();
        const x = Math.random() * w;
        const y = Math.random() * h;
        g.moveTo(x, y);
        g.lineTo(x + 6 + Math.random() * 13, y + (Math.random() - 0.5) * 5);
        g.stroke();
      }
    });

    const ceiling = make((g, w, h) => {
      g.fillStyle = '#181e24'; g.fillRect(0, 0, w, h);
      for (let y = 0; y < h; y += 16) {
        for (let x = 0; x < w; x += 16) {
          g.fillStyle = ((x + y) / 16) % 2 === 0 ? '#1e252c' : '#151b20';
          g.fillRect(x, y, 16, 16);
          g.strokeStyle = 'rgba(255,255,255,.035)';
          g.strokeRect(x + 0.5, y + 0.5, 15, 15);
        }
      }
      g.fillStyle = 'rgba(205,225,238,.28)';
      g.fillRect(7, 7, 18, 5);
      g.fillRect(39, 39, 18, 5);
    });

    const pixels = canvas => canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;
    return { wall, wallDark, floor, ceiling, floorPixels: pixels(floor), ceilingPixels: pixels(ceiling) };
  }

  function ensureTextures() {
    if (!textures) textures = createProceduralTextures();
  }

  class Bot {
    constructor(team, slot) {
      this.team = team;
      this.slot = slot;
      this.name = names[team][slot];
      this.kills = 0;
      this.deaths = 0;
      this.skill = 0.9 + Math.random() * 0.15;
      this.moveSkill = 0.9 + Math.random() * 0.15;
      this.walkCycle = Math.random() * TAU;
      this.motion = 0;
      this.moveVelocity = 0;
      this.weapon = weaponDefs[Math.floor(Math.random() * weaponDefs.length)];
      this.reset(true);
    }
    reset(initial = false) {
      const p = randomSpawn(this.team);
      this.x = p.x;
      this.y = p.y;
      this.angle = this.team === TEAM_BLUE ? 0 : Math.PI;
      this.pathAngle = this.angle;
      this.health = 100;
      this.alive = true;
      this.respawn = 0;
      this.target = null;
      this.sightCandidate = null;
      this.sightTime = 0;
      this.reactionDelay = 0.18 + Math.random() * 0.24;
      this.lastSeen = null;
      this.lastSeenTimer = 0;
      this.searchTimer = 0;
      this.searchBaseAngle = this.angle;
      this.cornerPause = 0;
      this.scanPhase = Math.random() * TAU;
      this.scanStrength = 0.015 + Math.random() * 0.018;
      this.cooldown = 0.3 + Math.random() * 0.35;
      this.flash = 0;
      this.recoil = 0;
      this.hurt = 0;
      this.strafeDir = Math.random() < 0.5 ? -1 : 1;
      this.speed = 1.12 + Math.random() * 0.2;
      this.path = [];
      this.pathIndex = 0;
      this.repathTimer = 0;
      this.stuckTimer = 0;
      this.escapeTimer = 0;
      this.escapeAngle = this.angle;
      this.lastX = this.x;
      this.lastY = this.y;
      this.motion = 0;
      this.moveVelocity = 0;
      this.objective = this.chooseObjective();
      this.burstShots = 0;
      this.burstGap = 0;
      if (!initial) this.weapon = weaponDefs[Math.floor(Math.random() * weaponDefs.length)];
    }
    chooseObjective() {
      const sideTarget = this.team === TEAM_BLUE ? spawnPoints[TEAM_RED] : spawnPoints[TEAM_BLUE];
      const base = sideTarget[Math.floor(Math.random() * sideTarget.length)];
      const hotspot = hotspots[Math.floor(Math.random() * hotspots.length)];
      const selected = Math.random() < 0.62 ? hotspot : base;
      return nearestWalkablePoint(selected.x, selected.y);
    }
    ensurePath(goal) {
      const safeGoal = nearestWalkablePoint(goal.x, goal.y);
      const path = findPath(this, safeGoal);
      if (path && path.length > 1) {
        path[0] = { x: this.x, y: this.y };
        this.path = smoothPath(path);
        this.pathIndex = 1;
        this.repathTimer = 0.7 + Math.random() * 0.45;
      } else {
        // Never fall back to a direct line that can cross a wall. Pick a new
        // reachable tactical point and try again on the next update.
        this.path = [];
        this.pathIndex = 0;
        const fallback = hotspots[Math.floor(Math.random() * hotspots.length)];
        this.objective = nearestWalkablePoint(fallback.x, fallback.y);
        this.repathTimer = 0.12;
      }
    }
    die(killer) {
      if (!this.alive) return;
      this.alive = false;
      this.health = 0;
      this.respawn = 2.1 + Math.random() * 1.2;
      this.deaths++;
      this.target = null;
      this.path = [];
      if (killer) {
        killer.kills++;
        if (killer.team === TEAM_BLUE) blueScore++; else redScore++;
        addFeed(killer, this);
        if (killer === bots[spectatorIndex]) {
          showStatus('TARGET ELIMINATED');
          hitPulse = 1;
        }
      }
      if (this === bots[spectatorIndex]) {
        showStatus('OPERATOR DOWN');
        shake = 1;
        if (autoSpectate) setTimeout(() => selectLiving(1), 420);
      }
    }
    update(dt) {
      this.flash = Math.max(0, this.flash - dt * 9);
      this.recoil = Math.max(0, this.recoil - dt * 8);
      this.hurt = Math.max(0, this.hurt - dt * 2.8);
      this.cooldown -= dt;
      this.burstGap -= dt;
      this.lastSeenTimer -= dt;
      this.searchTimer -= dt;
      this.cornerPause -= dt;
      this.escapeTimer -= dt;
      this.scanPhase += dt * (0.75 + this.moveSkill * 0.35);
      if (this.lastSeenTimer <= 0) this.lastSeen = null;

      if (!this.alive) {
        this.respawn -= dt;
        if (this.respawn <= 0 && !roundEnding) this.reset();
        return;
      }

      const visibleEnemy = this.updatePerception(dt);
      if (visibleEnemy) {
        this.combatMove(dt, visibleEnemy);
      } else if (this.sightCandidate && this.canVisuallySee(this.sightCandidate, FOV * 1.2)) {
        this.noticeEnemy(dt, this.sightCandidate);
      } else {
        this.navigateMove(dt);
      }

      const moved = Math.hypot(this.x - this.lastX, this.y - this.lastY);
      this.moveVelocity = dt > 0 ? moved / dt : 0;
      const movingNow = clamp(this.moveVelocity / Math.max(0.001, this.speed), 0, 1);
      this.motion = lerp(this.motion, movingNow, clamp(dt * (movingNow > this.motion ? 12 : 7), 0, 1));
      if (moved < 0.008 && this.cornerPause <= 0 && this.searchTimer <= 0) {
        this.stuckTimer += dt;
        if (this.stuckTimer > 0.62) {
          let bestAngle = this.angle;
          let bestClearance = -1;
          for (let i = 0; i < 16; i++) {
            const candidate = i * TAU / 16;
            const clearance = clearanceAlong(this.x, this.y, candidate, 1.35, BOT_RADIUS + 0.02);
            if (clearance > bestClearance) {
              bestClearance = clearance;
              bestAngle = candidate;
            }
          }
          this.escapeAngle = bestAngle;
          this.escapeTimer = bestClearance > 0.45 ? 0.42 : 0.18;
          this.objective = this.chooseObjective();
          this.path = [];
          this.pathIndex = 0;
          this.repathTimer = 0;
          this.stuckTimer = 0;
        }
      } else {
        this.stuckTimer = 0;
      }
      // Drive the gait from actual world distance travelled. This prevents
      // feet cycling while stationary and greatly reduces visible foot sliding.
      if (moved > 0.0002) this.walkCycle += moved * 8.8;
      this.angle = ((this.angle % TAU) + TAU) % TAU;
      this.pathAngle = ((this.pathAngle % TAU) + TAU) % TAU;
      this.lastX = this.x;
      this.lastY = this.y;
    }
    canVisuallySee(other, viewFov = FOV * 1.2) {
      if (!other || !other.alive || other.team === this.team) return false;
      const d = dist(this, other);
      if (d > this.weapon.range + 2.2) return false;
      const bearing = Math.atan2(other.y - this.y, other.x - this.x);
      const closeRangeFov = d < 1.45 ? Math.PI * 0.72 : viewFov;
      if (Math.abs(angleDiff(bearing, this.angle)) > closeRangeFov * 0.5) return false;
      return hasLineOfSight(this, other);
    }
    findVisibleEnemy() {
      let best = null;
      let bestScore = Infinity;
      for (const other of bots) {
        if (!this.canVisuallySee(other, FOV * 1.2)) continue;
        const d = dist(this, other);
        const bearing = Math.atan2(other.y - this.y, other.x - this.x);
        const screenOffset = Math.abs(angleDiff(bearing, this.angle));
        const score = d + screenOffset * 3.4 + (other.health / 100) * 0.25;
        if (score < bestScore) {
          best = other;
          bestScore = score;
        }
      }
      return best;
    }
    updatePerception(dt) {
      if (this.target) {
        if (this.canVisuallySee(this.target, FOV * 1.22)) {
          this.lastSeen = { x: this.target.x, y: this.target.y };
          this.lastSeenTimer = 2.35;
          this.sightCandidate = this.target;
          this.sightTime = Math.max(this.sightTime, this.reactionDelay);
          return this.target;
        }

        // The enemy has left the bot's actual view. Preserve only a frozen
        // last-known position and immediately stop aiming or firing at them.
        this.target = null;
        this.sightCandidate = null;
        this.sightTime = 0;
        this.burstShots = 0;
        this.flash = 0;
        if (this === bots[spectatorIndex]) muzzle = 0;
      }

      const visible = this.findVisibleEnemy();
      if (!visible) {
        this.sightCandidate = null;
        this.sightTime = 0;
        return null;
      }

      if (this.sightCandidate !== visible) {
        this.sightCandidate = visible;
        this.sightTime = 0;
        const d = dist(this, visible);
        this.reactionDelay = clamp(0.12 + d * 0.022 + Math.random() * 0.16, 0.15, 0.48);
      }

      this.sightTime += dt;
      if (this.sightTime < this.reactionDelay) return null;

      this.target = visible;
      this.lastSeen = { x: visible.x, y: visible.y };
      this.lastSeenTimer = 2.35;
      this.searchTimer = 0;
      return visible;
    }
    noticeEnemy(dt, enemy) {
      // A brief human-like recognition phase: slow down and bring the enemy
      // towards the centre of the view before committing to a burst.
      const desired = Math.atan2(enemy.y - this.y, enemy.x - this.x);
      this.angle += angleDiff(desired, this.angle) * clamp(dt * 3.4, 0, 1);
      this.pathAngle += angleDiff(desired, this.pathAngle) * clamp(dt * 1.1, 0, 1);
      this.stepMove(this.pathAngle, this.speed * 0.28, dt, false);
    }
    combatMove(dt, enemy) {
      if (!this.canVisuallySee(enemy, FOV * 1.22)) {
        this.target = null;
        this.burstShots = 0;
        this.flash = 0;
        if (this === bots[spectatorIndex]) muzzle = 0;
        return;
      }

      const desired = Math.atan2(enemy.y - this.y, enemy.x - this.x);
      this.angle += angleDiff(desired, this.angle) * clamp(dt * 7.2, 0, 1);
      const d = dist(this, enemy);
      let moveAngle = desired + this.strafeDir * Math.PI / 2;
      let moveSpeed = this.speed * 0.52;
      if (Math.random() < 0.012) this.strafeDir *= -1;
      if (d > 6.2) {
        moveAngle = desired;
        moveSpeed = this.speed * 0.82;
      } else if (d < 2.25) {
        moveAngle = desired + Math.PI;
        moveSpeed = this.speed * 0.7;
      }
      this.stepMove(moveAngle, moveSpeed, dt, true);

      const angleToTarget = Math.abs(angleDiff(desired, this.angle));
      const stillVisible = this.canVisuallySee(enemy, FOV * 0.86);
      if (stillVisible && d <= this.weapon.range && angleToTarget < 0.16) {
        if (this.burstShots <= 0) {
          this.burstShots = 2 + (Math.random() < 0.48 ? 1 : 0);
          this.burstGap = 0;
        }
        if (this.burstShots > 0 && this.cooldown <= 0 && this.burstGap <= 0) {
          if (this.shoot(enemy, d)) {
            this.burstShots--;
            this.burstGap = 0.025 + Math.random() * 0.045;
          } else {
            this.burstShots = 0;
          }
        }
      } else {
        this.burstShots = 0;
        this.flash = 0;
        if (this === bots[spectatorIndex]) muzzle = 0;
      }
    }
    getPathLookahead(distanceAhead) {
      if (!this.path.length || this.pathIndex >= this.path.length) return null;
      let fromX = this.x;
      let fromY = this.y;
      let remaining = distanceAhead;
      let index = this.pathIndex;
      while (index < this.path.length) {
        const point = this.path[index];
        const dx = point.x - fromX;
        const dy = point.y - fromY;
        const segmentLength = Math.hypot(dx, dy);
        if (segmentLength >= remaining && segmentLength > 0.0001) {
          const t = remaining / segmentLength;
          return { x: fromX + dx * t, y: fromY + dy * t, index };
        }
        remaining -= segmentLength;
        fromX = point.x;
        fromY = point.y;
        index++;
      }
      const last = this.path[this.path.length - 1];
      return last ? { x: last.x, y: last.y, index: this.path.length - 1 } : null;
    }
    navigateMove(dt) {
      this.repathTimer -= dt;

      if (this.escapeTimer > 0) {
        this.angle += angleDiff(this.escapeAngle, this.angle) * clamp(dt * 8.0, 0, 1);
        this.stepMove(this.escapeAngle, this.speed * 0.68, dt, false);
        return;
      }

      if (this.searchTimer > 0) {
        const scan = Math.sin(this.scanPhase * 2.1) * 0.66;
        const scanAngle = this.searchBaseAngle + scan;
        const safeScan = clearanceAlong(this.x, this.y, scanAngle, 0.72, BOT_RADIUS) > 0.42
          ? scanAngle
          : this.searchBaseAngle;
        this.angle += angleDiff(safeScan, this.angle) * clamp(dt * 2.8, 0, 1);
        this.pathAngle += angleDiff(this.angle, this.pathAngle) * clamp(dt * 1.3, 0, 1);
        return;
      }

      if (this.lastSeen && dist(this, this.lastSeen) < 0.68) {
        this.searchBaseAngle = this.angle;
        this.searchTimer = 0.75 + Math.random() * 0.65;
        this.lastSeen = null;
        this.lastSeenTimer = 0;
        this.path = [];
        return;
      }

      if (!this.objective || dist(this, this.objective) < 1.2) this.objective = this.chooseObjective();
      const pursuitGoal = this.lastSeen ? this.lastSeen : this.objective;
      if (!this.path.length || this.pathIndex >= this.path.length || this.repathTimer <= 0) this.ensurePath(pursuitGoal);
      if (!this.path.length || this.pathIndex >= this.path.length) return;

      // Advance waypoints before the bot reaches the exact cell centre. This is
      // important at 90-degree corridors because it prevents walking up to the
      // wall and then snapping sideways.
      while (this.pathIndex < this.path.length - 1) {
        const point = this.path[this.pathIndex];
        const nextPoint = this.path[this.pathIndex + 1];
        const pointDistance = Math.hypot(point.x - this.x, point.y - this.y);
        const nextIsOpen = nextPoint && segmentHasClearance(this, nextPoint, BOT_RADIUS + 0.025);
        if (pointDistance > 0.58 || (!nextIsOpen && pointDistance > 0.24)) break;
        this.pathIndex++;
      }

      let moveTarget = this.getPathLookahead(0.58 + this.speed * 0.18);
      const lookTarget = this.getPathLookahead(1.18 + this.speed * 0.28);
      if (!moveTarget || !lookTarget) return;
      if (!segmentHasClearance(this, moveTarget, BOT_RADIUS + 0.02)) {
        const activePoint = this.path[this.pathIndex];
        if (activePoint) moveTarget = { x: activePoint.x, y: activePoint.y, index: this.pathIndex };
      }

      let moveAngle = Math.atan2(moveTarget.y - this.y, moveTarget.x - this.x);
      let lookAngle = Math.atan2(lookTarget.y - this.y, lookTarget.x - this.x);
      const turnAmount = Math.abs(angleDiff(lookAngle, moveAngle));

      // The crosshair leads the movement through the opening. In a corner the
      // camera turns towards the next corridor before the body reaches it.
      const lookClearance = clearanceAlong(this.x, this.y, lookAngle, 1.05, BOT_RADIUS * 0.72);
      if (lookClearance < 0.42) lookAngle = moveAngle;
      const tinyHumanScan = turnAmount < 0.22 && clearanceAlong(this.x, this.y, lookAngle, 1.2) > 0.85
        ? Math.sin(this.scanPhase) * this.scanStrength
        : 0;
      lookAngle += tinyHumanScan;
      this.angle += angleDiff(lookAngle, this.angle) * clamp(dt * (turnAmount > 0.45 ? 7.4 : 5.4), 0, 1);

      const investigating = Boolean(this.lastSeen);
      let speedFactor = investigating ? 0.76 : (turnAmount > 0.55 ? 0.72 : 1.02);
      if (clearanceAlong(this.x, this.y, moveAngle, 0.72, BOT_RADIUS) < 0.5) speedFactor *= 0.62;
      this.stepMove(moveAngle, this.speed * this.moveSkill * speedFactor, dt, false);
    }
    stepMove(moveAngle, moveSpeed, dt, allowAggressiveSlide) {
      const travel = Math.max(0.015, moveSpeed * dt);
      const maxProbe = allowAggressiveSlide ? 0.72 : 0.92;
      const candidates = allowAggressiveSlide
        ? [moveAngle, moveAngle - 0.20, moveAngle + 0.20, moveAngle - 0.40, moveAngle + 0.40]
        : [moveAngle, moveAngle - 0.12, moveAngle + 0.12, moveAngle - 0.26, moveAngle + 0.26];

      let chosenAngle = moveAngle;
      let chosenScore = -Infinity;
      for (const candidate of candidates) {
        const clearance = clearanceAlong(this.x, this.y, candidate, maxProbe, BOT_RADIUS + 0.015);
        const deviation = Math.abs(angleDiff(candidate, moveAngle));
        const score = clearance - deviation * (allowAggressiveSlide ? 0.22 : 0.55);
        if (clearance >= travel + 0.09 && score > chosenScore) {
          chosenScore = score;
          chosenAngle = candidate;
        }
      }

      if (chosenScore === -Infinity) {
        // Do not bounce left and right against a wall. Stop, recalculate the
        // route, and keep the camera looking into the intended opening.
        this.repathTimer = 0;
        this.pathAngle += angleDiff(moveAngle, this.pathAngle) * clamp(dt * 4.2, 0, 1);
        return false;
      }

      this.pathAngle += angleDiff(chosenAngle, this.pathAngle) * clamp(dt * (allowAggressiveSlide ? 9.0 : 8.2), 0, 1);
      // Travel along the selected safe heading immediately; pathAngle is kept
      // as the smoothed body orientation. Using the lagging body angle for the
      // actual movement was what made bots repeatedly press into corner walls.
      let dx = Math.cos(chosenAngle) * travel;
      let dy = Math.sin(chosenAngle) * travel;

      // Gentle personal-space avoidance. It changes speed more than direction,
      // preventing two bots from shoving one another into walls.
      let nearest = Infinity;
      for (const other of bots) {
        if (other === this || !other.alive) continue;
        nearest = Math.min(nearest, dist(this, other));
      }
      if (nearest < 0.72) {
        const slow = clamp((nearest - 0.38) / 0.34, 0.16, 1);
        dx *= slow;
        dy *= slow;
      }

      const nx = this.x + dx;
      const ny = this.y + dy;
      if (canStand(nx, ny, BOT_RADIUS)) {
        this.x = nx;
        this.y = ny;
        return true;
      }

      this.repathTimer = 0;
      return false;
    }
    shoot(target, distance) {
      if (!target || !target.alive) return false;
      const desired = Math.atan2(target.y - this.y, target.x - this.x);
      const aimError = Math.abs(angleDiff(desired, this.angle));
      const properlyAimed = aimError < 0.145;
      const insideFireCone = this.canVisuallySee(target, FOV * 0.72);
      const clearLineOfFire = hasLineOfSight(this, target);

      // Do not start a muzzle flash, consume a burst round or apply damage
      // unless all checks pass on this exact simulation frame.
      if (!properlyAimed || !insideFireCone || !clearLineOfFire) {
        combatDebug.blockedShotAttempts++;
        combatDebug.lastBlockedReason = !properlyAimed ? 'aim' : (!insideFireCone ? 'view' : 'wall');
        this.flash = 0;
        this.recoil = 0;
        if (this === bots[spectatorIndex]) muzzle = 0;
        return false;
      }

      // Recheck after all target calculations. This intentionally duplicates
      // the wall test so a target crossing a corner cannot fire on stale sight.
      if (!target.alive || !hasLineOfSight(this, target)) {
        combatDebug.blockedShotAttempts++;
        combatDebug.lastBlockedReason = 'wall-recheck';
        this.flash = 0;
        this.recoil = 0;
        if (this === bots[spectatorIndex]) muzzle = 0;
        return false;
      }

      this.cooldown = this.weapon.fireRate + Math.random() * 0.04;
      this.flash = 1;
      this.recoil = 1;
      combatDebug.shotsFired++;
      if (this === bots[spectatorIndex]) muzzle = 1;
      const distancePenalty = clamp((distance - 2.5) / 16, 0, 0.22);
      const hitChance = (this.weapon.accuracy * this.skill) - distancePenalty;
      if (Math.random() < hitChance) {
        const damage = lerp(this.weapon.damageMin, this.weapon.damageMax, Math.random());
        target.health -= damage;
        target.hurt = 1;
        if (target === bots[spectatorIndex]) {
          shake = Math.min(1, shake + 0.34);
          hitPulse = Math.max(hitPulse, 0.55);
        }
        if (target.health <= 0) target.die(this);
      }
      return true;
    }

  }

  function createMatch() {
    bots = [];
    for (let team = 0; team < 2; team++) {
      for (let i = 0; i < 5; i++) bots.push(new Bot(team, i));
    }
    blueScore = 0;
    redScore = 0;
    roundTime = 180;
    roundEnding = false;
    spectatorIndex = 0;
    feed = [];
    addSystemFeed('ROUND STARTED — FIRST TO 35');
  }

  function addFeed(killer, victim) {
    feed.unshift({
      html: `<b style="color:${TEAM_COLOURS[killer.team]}">${killer.name}</b><span class="weapon">${killer.weapon.name}</span><b style="color:${TEAM_COLOURS[victim.team]}">${victim.name}</b>`,
      life: 6
    });
    feed = feed.slice(0, 6);
    renderFeed();
  }
  function addSystemFeed(text) {
    feed.unshift({ html: `<span style="color:#f4b942">${text}</span>`, life: 5 });
    feed = feed.slice(0, 6);
    renderFeed();
  }
  function renderFeed() {
    feedEl.innerHTML = feed.map(item => `<div class="feed-row">${item.html}</div>`).join('');
  }
  function showStatus(text) {
    statusEl.textContent = text;
    statusEl.classList.add('show');
    statusTimer = 1.2;
  }
  function selectLiving(direction = 1) {
    for (let i = 1; i <= bots.length; i++) {
      const idx = (spectatorIndex + direction * i + bots.length) % bots.length;
      if (bots[idx].alive) {
        spectatorIndex = idx;
        autoTimer = 5.2;
        updateHud();
        return;
      }
    }
  }
  function updateHud() {
    const b = bots[spectatorIndex];
    if (!b) return;
    spectatorNameEl.textContent = b.name;
    spectatorNameEl.style.color = TEAM_COLOURS[b.team];
    teamTextEl.textContent = b.team === TEAM_BLUE ? 'BLUE TEAM' : 'RED TEAM';
    kdTextEl.textContent = `${b.kills} K / ${b.deaths} D`;
    weaponTextEl.textContent = b.weapon.name;
    healthBarEl.style.transform = `scaleX(${clamp(b.health / 100, 0, 1)})`;
    blueScoreEl.textContent = blueScore;
    redScoreEl.textContent = redScore;
    const m = Math.max(0, Math.floor(roundTime / 60));
    const s = Math.max(0, Math.floor(roundTime % 60)).toString().padStart(2, '0');
    timerEl.textContent = `${m.toString().padStart(2, '0')}:${s}`;
  }

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(320, innerWidth);
    const h = Math.max(240, innerHeight);
    canvas.width = Math.floor(w * DPR);
    canvas.height = Math.floor(h * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ensureTextures();
  }

  function castRay(px, py, angle) {
    const rayDirX = Math.cos(angle);
    const rayDirY = Math.sin(angle);
    let mapX = Math.floor(px);
    let mapY = Math.floor(py);
    const deltaDistX = Math.abs(1 / (rayDirX || 1e-6));
    const deltaDistY = Math.abs(1 / (rayDirY || 1e-6));
    let sideDistX, sideDistY, stepX, stepY;

    if (rayDirX < 0) {
      stepX = -1;
      sideDistX = (px - mapX) * deltaDistX;
    } else {
      stepX = 1;
      sideDistX = (mapX + 1 - px) * deltaDistX;
    }
    if (rayDirY < 0) {
      stepY = -1;
      sideDistY = (py - mapY) * deltaDistY;
    } else {
      stepY = 1;
      sideDistY = (mapY + 1 - py) * deltaDistY;
    }

    let side = 0;
    let hit = false;
    while (!hit) {
      if (sideDistX < sideDistY) {
        sideDistX += deltaDistX;
        mapX += stepX;
        side = 0;
      } else {
        sideDistY += deltaDistY;
        mapY += stepY;
        side = 1;
      }
      if (mapX < 0 || mapY < 0 || mapX >= MAP_W || mapY >= MAP_H || MAP[mapY][mapX] !== '0') hit = true;
    }

    const perpWallDist = side === 0
      ? (mapX - px + (1 - stepX) / 2) / (rayDirX || 1e-6)
      : (mapY - py + (1 - stepY) / 2) / (rayDirY || 1e-6);
    const hitX = px + rayDirX * perpWallDist;
    const hitY = py + rayDirY * perpWallDist;
    const wallX = side === 0 ? hitY - Math.floor(hitY) : hitX - Math.floor(hitX);
    return {
      d: Math.max(0.001, perpWallDist),
      hitX,
      hitY,
      side,
      wallX,
      tex: (mapX + mapY) % 2 === 0 ? 'wall' : 'wallDark'
    };
  }

  let floorCanvas = null;
  let floorCtx = null;

  function getProjection(w, h) {
    // A single projection scale is shared by floors, walls, sprites and decals.
    // Capping it against height keeps the view comfortable on very wide phones.
    return Math.min((w * 0.5) / Math.tan(FOV * 0.5), h * 1.46);
  }

  function cameraSpace(cam, worldX, worldY) {
    const dx = worldX - cam.x;
    const dy = worldY - cam.y;
    const cosA = Math.cos(cam.angle);
    const sinA = Math.sin(cam.angle);
    return {
      depth: dx * cosA + dy * sinA,
      lateral: -dx * sinA + dy * cosA,
      radial: Math.hypot(dx, dy)
    };
  }

  function projectGroundPoint(cam, worldX, worldY, w, horizon, projection) {
    const point = cameraSpace(cam, worldX, worldY);
    if (point.depth <= 0.035) return null;
    return {
      x: w * 0.5 + (point.lateral / point.depth) * projection,
      y: horizon + (CAMERA_HEIGHT / point.depth) * projection,
      depth: point.depth,
      radial: point.radial
    };
  }

  function drawBackdrop(cam, w, h, horizon, projection) {
    const renderW = Math.min(620, Math.max(320, Math.floor(w * 0.58)));
    const renderH = Math.min(360, Math.max(190, Math.floor(h * 0.56)));
    if (!floorCanvas || floorCanvas.width !== renderW || floorCanvas.height !== renderH) {
      floorCanvas = document.createElement('canvas');
      floorCanvas.width = renderW;
      floorCanvas.height = renderH;
      floorCtx = floorCanvas.getContext('2d', { alpha: false });
    }

    const image = floorCtx.createImageData(renderW, renderH);
    const data = image.data;
    const horizonRow = clamp(Math.floor(horizon / h * renderH), 1, renderH - 2);
    const dirX = Math.cos(cam.angle);
    const dirY = Math.sin(cam.angle);
    const planeScale = Math.tan(FOV * 0.5);
    const planeX = -dirY * planeScale;
    const planeY = dirX * planeScale;
    const floorPixels = textures.floorPixels;
    const ceilingPixels = textures.ceilingPixels;

    // Each row is projected from the camera's real world position. Using the
    // same projection scale as walls and players keeps floor motion locked to
    // movement instead of appearing to slide underneath the scene.
    for (let y = horizonRow; y < renderH; y++) {
      const screenY = (y + 0.5) * h / renderH;
      const rowOffset = Math.max(0.5, screenY - horizon);
      const rowDepth = CAMERA_HEIGHT * projection / rowOffset;
      const distanceShade = clamp(1.18 - rowDepth / MAX_VIEW, 0.28, 1.04);
      const ceilingY = horizonRow - (y - horizonRow) - 1;

      for (let x = 0; x < renderW; x++) {
        const cameraX = ((x + 0.5) / renderW) * 2 - 1;
        const rayX = dirX + planeX * cameraX;
        const rayY = dirY + planeY * cameraX;
        const worldX = cam.x + rowDepth * rayX;
        const worldY = cam.y + rowDepth * rayY;
        const tx = ((Math.floor(worldX * 64) % 64) + 64) % 64;
        const ty = ((Math.floor(worldY * 64) % 64) + 64) % 64;
        const sourceIndex = (ty * 64 + tx) * 4;
        const floorIndex = (y * renderW + x) * 4;
        data[floorIndex] = floorPixels[sourceIndex] * distanceShade;
        data[floorIndex + 1] = floorPixels[sourceIndex + 1] * distanceShade;
        data[floorIndex + 2] = floorPixels[sourceIndex + 2] * distanceShade;
        data[floorIndex + 3] = 255;

        if (ceilingY >= 0) {
          const ceilingIndex = (ceilingY * renderW + x) * 4;
          const ceilingShade = clamp(distanceShade * 0.62, 0.12, 0.64);
          data[ceilingIndex] = ceilingPixels[sourceIndex] * ceilingShade;
          data[ceilingIndex + 1] = ceilingPixels[sourceIndex + 1] * ceilingShade;
          data[ceilingIndex + 2] = ceilingPixels[sourceIndex + 2] * ceilingShade;
          data[ceilingIndex + 3] = 255;
        }
      }
    }

    for (let y = Math.max(0, horizonRow - 1); y <= Math.min(renderH - 1, horizonRow + 1); y++) {
      for (let x = 0; x < renderW; x++) {
        const index = (y * renderW + x) * 4;
        data[index] = 35; data[index + 1] = 43; data[index + 2] = 49; data[index + 3] = 255;
      }
    }

    floorCtx.putImageData(image, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(floorCanvas, 0, 0, renderW, renderH, 0, 0, w, h);

    const ceilingGlow = ctx.createLinearGradient(0, 0, 0, horizon);
    ceilingGlow.addColorStop(0, 'rgba(15,22,29,.34)');
    ceilingGlow.addColorStop(1, 'rgba(30,42,52,0)');
    ctx.fillStyle = ceilingGlow;
    ctx.fillRect(0, 0, w, horizon);
  }

  function drawWorld(cam, w, h) {
    const movement = cam.alive ? cam.motion : 0;
    const bobOffset = (Math.abs(Math.sin(cam.walkCycle)) - 0.5) * 3.6 * movement;
    const horizon = h * 0.48 + bobOffset;
    const projection = getProjection(w, h);
    drawBackdrop(cam, w, h, horizon, projection);

    const rayCount = Math.min(600, Math.max(340, Math.floor(w * 0.78)));
    const sliceW = w / rayCount + 0.6;
    depthBuffer = new Array(rayCount);

    const camDirX = Math.cos(cam.angle);
    const camDirY = Math.sin(cam.angle);
    const planeScale = Math.tan(FOV * 0.5);
    const camPlaneX = -camDirY * planeScale;
    const camPlaneY = camDirX * planeScale;

    for (let i = 0; i < rayCount; i++) {
      const cameraX = i / (rayCount - 1) * 2 - 1;
      const rayVectorX = camDirX + camPlaneX * cameraX;
      const rayVectorY = camDirY + camPlaneY * cameraX;
      const rayAngle = Math.atan2(rayVectorY, rayVectorX);
      const hit = castRay(cam.x, cam.y, rayAngle);
      const corrected = hit.d * Math.cos(rayAngle - cam.angle);
      // Store perpendicular camera depth so walls, players and decals all
      // compare in the same coordinate system, including near screen edges.
      depthBuffer[i] = corrected;
      const wallH = Math.min(h * 1.72, (WALL_HEIGHT * projection) / corrected);
      const y = horizon - wallH * (1 - CAMERA_HEIGHT / WALL_HEIGHT);
      const fog = clamp(1 - corrected / MAX_VIEW, 0, 1);
      const texture = textures[hit.tex];
      const texX = clamp(Math.floor(hit.wallX * texture.width), 0, texture.width - 1);
      ctx.save();
      ctx.globalAlpha = 1;
      ctx.drawImage(texture, texX, 0, 1, texture.height, i * sliceW, y, sliceW + 1, wallH);
      ctx.restore();
      ctx.fillStyle = `rgba(5,9,12,${clamp((1 - fog) * 0.58 + (hit.side === 1 ? 0.08 : 0), 0, 0.68)})`;
      ctx.fillRect(i * sliceW, y, sliceW + 1, wallH);

      ctx.fillStyle = `rgba(255,255,255,${0.05 * fog})`;
      ctx.fillRect(i * sliceW, y + wallH * 0.09, sliceW, wallH * 0.03);
      ctx.fillStyle = `rgba(0,0,0,${0.10 + (1 - fog) * 0.28})`;
      ctx.fillRect(i * sliceW, y + wallH * 0.82, sliceW + 1, wallH * 0.2);
    }

    drawSprites(cam, w, h, horizon, rayCount, projection);
    drawObjectiveDecals(cam, w, h, horizon, rayCount, projection);
  }

  function depthAtScreenX(screenX, rayCount, w) {
    const idx = clamp(Math.floor(screenX / w * rayCount), 0, rayCount - 1);
    return depthBuffer[idx] ?? Infinity;
  }

  function clipSpriteToDepth(screenX, halfWidth, spriteDepth, rayCount, w, h) {
    const left = clamp(screenX - halfWidth, 0, w);
    const right = clamp(screenX + halfWidth, 0, w);
    if (right <= left) return false;

    const startIndex = clamp(Math.floor(left / w * rayCount), 0, rayCount - 1);
    const endIndex = clamp(Math.ceil(right / w * rayCount), 0, rayCount - 1);
    let runStart = -1;
    let hasVisibleRun = false;
    ctx.beginPath();

    for (let i = startIndex; i <= endIndex + 1; i++) {
      const visible = i <= endIndex && (depthBuffer[i] ?? Infinity) >= spriteDepth - 0.045;
      if (visible && runStart < 0) runStart = i;
      if (!visible && runStart >= 0) {
        const x0 = runStart / rayCount * w - 1;
        const x1 = i / rayCount * w + 1;
        ctx.rect(x0, 0, Math.max(1, x1 - x0), h);
        runStart = -1;
        hasVisibleRun = true;
      }
    }

    if (hasVisibleRun) ctx.clip();
    return hasVisibleRun;
  }

  function drawSprites(cam, w, h, horizon, rayCount, projection) {
    const visible = bots
      .filter(b => b.alive && b !== cam)
      .map(b => {
        const view = cameraSpace(cam, b.x, b.y);
        return { b, d: view.radial, depth: view.depth, lateral: view.lateral };
      })
      .filter(o => o.depth > 0.06 && Math.abs(o.lateral / o.depth) < Math.tan(FOV * 0.62) && o.depth < MAX_VIEW)
      .sort((a, b) => b.depth - a.depth);

    for (const o of visible) {
      const screenX = w * 0.5 + (o.lateral / o.depth) * projection;
      const size = clamp((PLAYER_HEIGHT * projection) / o.depth, 20, h * 0.82);
      const foot = horizon + (CAMERA_HEIGHT * projection) / o.depth;
      if (foot < horizon - 4 || foot > h + size * 0.18) continue;
      const baseY = foot - size;
      const gaitPhase = Math.sin(o.b.walkCycle + o.b.slot);
      const gait = gaitPhase * o.b.motion;
      const upperBob = -Math.abs(gaitPhase) * size * 0.012 * o.b.motion;
      const torsoY = baseY + upperBob;
      const shoulderPulse = Math.sin(o.b.walkCycle * 0.5) * size * 0.012 * o.b.motion;
      const legSwing = gait * size * 0.035;
      const directionToCamera = Math.atan2(cam.y - o.b.y, cam.x - o.b.x);
      const relativeFacing = angleDiff(o.b.angle, directionToCamera);
      const sideFacing = Math.sin(relativeFacing);
      const frontFacing = Math.cos(relativeFacing);
      const profileScale = 0.68 + Math.abs(frontFacing) * 0.32;
      const weaponDirection = Math.abs(sideFacing) > 0.14 ? Math.sign(sideFacing) : 1;
      const projectedHalfWidth = Math.max(4, (PLAYER_WIDTH * projection / o.depth) * 0.58 * profileScale);

      ctx.save();
      if (!clipSpriteToDepth(screenX, projectedHalfWidth, o.depth, rayCount, w, h)) {
        ctx.restore();
        continue;
      }

      ctx.save();
      ctx.translate(screenX, 0);
      ctx.scale(profileScale, 1);
      ctx.globalAlpha = clamp(1 - o.depth / MAX_VIEW, 0.22, 1);

      // The contact shadow and boots remain fixed to the projected floor.
      ctx.fillStyle = 'rgba(0,0,0,.38)';
      ctx.beginPath(); ctx.ellipse(0, foot + 2, size * 0.23, size * 0.052, 0, 0, TAU); ctx.fill();

      // Legs are anchored at the feet, preventing the whole model from floating
      // when its upper body bobs during the walk cycle.
      ctx.fillStyle = '#14191d';
      ctx.fillRect(-size * 0.16 + legSwing * 0.14, foot - size * 0.36, size * 0.11, size * 0.29);
      ctx.fillRect(size * 0.05 - legSwing * 0.14, foot - size * 0.36, size * 0.11, size * 0.29);
      ctx.fillStyle = '#2a333b';
      ctx.fillRect(-size * 0.17 + legSwing, foot - size * 0.11, size * 0.13, size * 0.11);
      ctx.fillRect(size * 0.04 - legSwing, foot - size * 0.11, size * 0.13, size * 0.11);

      // Torso / armour.
      ctx.fillStyle = o.b.team === TEAM_BLUE ? '#345a80' : '#7e3e3e';
      ctx.beginPath();
      ctx.moveTo(-size * 0.25, torsoY + size * 0.31 + shoulderPulse);
      ctx.lineTo(size * 0.25, torsoY + size * 0.31 - shoulderPulse);
      ctx.lineTo(size * 0.18, torsoY + size * 0.72);
      ctx.lineTo(-size * 0.18, torsoY + size * 0.72);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.16)';
      ctx.fillRect(-size * 0.16, torsoY + size * 0.37, size * 0.32, size * 0.06);
      ctx.fillStyle = '#1e252b';
      ctx.fillRect(-size * 0.06, torsoY + size * 0.44, size * 0.12, size * 0.16);

      ctx.fillStyle = '#263039';
      ctx.fillRect(-size * 0.31, torsoY + size * 0.36, size * 0.08, size * 0.24);
      ctx.fillRect(size * 0.23, torsoY + size * 0.36, size * 0.08, size * 0.24);

      ctx.fillStyle = '#1f272e';
      ctx.beginPath(); ctx.arc(0, torsoY + size * 0.2, size * 0.15, 0, TAU); ctx.fill();
      ctx.fillStyle = '#303840'; ctx.fillRect(-size * 0.12, torsoY + size * 0.08, size * 0.24, size * 0.06);
      if (frontFacing > -0.05) {
        ctx.globalAlpha *= clamp((frontFacing + 0.15) / 1.15, 0.12, 1);
        ctx.fillStyle = o.b.team === TEAM_BLUE ? '#73c4ff' : '#ff9b9b';
        ctx.fillRect(-size * 0.105, torsoY + size * 0.17, size * 0.21, size * 0.045);
        ctx.globalAlpha = clamp(1 - o.depth / MAX_VIEW, 0.22, 1);
      } else {
        ctx.fillStyle = '#151b20';
        ctx.fillRect(-size * 0.105, torsoY + size * 0.17, size * 0.21, size * 0.045);
      }

      ctx.save();
      ctx.translate(size * 0.07 * weaponDirection, torsoY + size * 0.49);
      ctx.scale(weaponDirection, 1);
      ctx.rotate(-0.05 + o.b.recoil * 0.04);
      ctx.fillStyle = '#12171b'; ctx.fillRect(-size * 0.06, -size * 0.026, size * 0.42, size * 0.06);
      ctx.fillStyle = '#657078'; ctx.fillRect(size * 0.24, -size * 0.015, size * 0.13, size * 0.03);
      ctx.fillStyle = '#27313a'; ctx.fillRect(-size * 0.025, -size * 0.06, size * 0.05, size * 0.034);
      ctx.fillStyle = '#0f1317'; ctx.fillRect(-size * 0.018, size * 0.02, size * 0.036, size * 0.07);
      if (o.b.flash > 0) {
        const g = ctx.createRadialGradient(size * 0.42, 0, 0, size * 0.42, 0, size * 0.24);
        g.addColorStop(0, 'rgba(255,245,182,.95)');
        g.addColorStop(0.3, 'rgba(255,194,65,.85)');
        g.addColorStop(1, 'rgba(255,132,27,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(size * 0.42, 0, size * 0.24, 0, TAU); ctx.fill();
      }
      ctx.restore();

      if (o.depth < 8.5) {
        ctx.fillStyle = 'rgba(0,0,0,.55)';
        ctx.fillRect(-size * 0.24, torsoY - size * 0.1, size * 0.48, size * 0.05);
        ctx.fillStyle = TEAM_COLOURS[o.b.team];
        ctx.fillRect(-size * 0.24, torsoY - size * 0.1, size * 0.48 * clamp(o.b.health / 100, 0, 1), size * 0.05);
      }
      if (o.b.hurt > 0) {
        ctx.strokeStyle = `rgba(255,255,255,${o.b.hurt * 0.65})`;
        ctx.lineWidth = 2;
        ctx.strokeRect(-size * 0.26, torsoY + size * 0.05, size * 0.52, size * 0.95);
      }
      ctx.restore();
      ctx.restore();
    }
  }

  function drawObjectiveDecals(cam, w, h, horizon, rayCount, projection) {
    for (const marker of hotspots) {
      const point = projectGroundPoint(cam, marker.x, marker.y, w, horizon, projection);
      if (!point || point.radial < 2.2 || point.radial > 14) continue;
      if (point.x < -40 || point.x > w + 40) continue;
      if (depthAtScreenX(point.x, rayCount, w) < point.depth - 0.035) continue;
      const size = clamp(projection / (point.depth * 7.2), 7, 23);
      ctx.save();
      ctx.translate(point.x, point.y);
      // Flatten the marker into the floor plane rather than drawing a face-on UI circle.
      ctx.scale(1, 0.34);
      ctx.globalAlpha = clamp(1 - point.radial / 14, 0.08, 0.24);
      ctx.strokeStyle = '#f4b942';
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(0, 0, size, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-size, 0); ctx.lineTo(size, 0); ctx.moveTo(0, -size); ctx.lineTo(0, size); ctx.stroke();
      ctx.restore();
    }
  }

  function drawWeapon(cam, w, h) {
    const t = performance.now() / 1000;
    const moveAmt = cam.alive ? cam.motion : 0;
    const bob = cam.alive ? (Math.abs(Math.sin(cam.walkCycle)) - 0.5) * 5.2 * moveAmt : 0;
    const sway = Math.sin(t * 3.3) * (1.2 + moveAmt * 1.8);
    const recoil = cam.recoil * 18;
    const x = w * 0.5 + sway;
    const y = h - h * 0.12 + bob + recoil;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-0.04 + cam.recoil * 0.04);

    ctx.fillStyle = '#2d3943';
    ctx.beginPath();
    ctx.moveTo(-w * 0.23, h * 0.16); ctx.lineTo(-w * 0.078, -h * 0.015); ctx.lineTo(-w * 0.006, h * 0.08); ctx.lineTo(-w * 0.145, h * 0.21); ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(w * 0.21, h * 0.17); ctx.lineTo(w * 0.078, h * 0.015); ctx.lineTo(w * 0.018, h * 0.082); ctx.lineTo(w * 0.13, h * 0.205); ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#0d1216';
    ctx.beginPath();
    ctx.moveTo(-w * 0.076, h * 0.125); ctx.lineTo(-w * 0.056, -h * 0.048); ctx.lineTo(w * 0.058, -h * 0.057); ctx.lineTo(w * 0.095, h * 0.108); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#2a353d'; ctx.fillRect(-w * 0.045, -h * 0.055, w * 0.09, h * 0.07);
    ctx.fillStyle = '#10161b'; ctx.fillRect(-w * 0.025, -h * 0.145, w * 0.05, h * 0.11);
    ctx.fillStyle = '#435058'; ctx.fillRect(-w * 0.01, -h * 0.295, w * 0.02, h * 0.16);
    ctx.fillStyle = '#0b0f12'; ctx.fillRect(-w * 0.036, -h * 0.097, w * 0.072, h * 0.024);
    ctx.fillStyle = '#20272d'; ctx.fillRect(-w * 0.018, h * 0.025, w * 0.036, h * 0.08);
    ctx.fillStyle = '#151a1f'; ctx.fillRect(-w * 0.015, h * 0.105, w * 0.03, h * 0.06);

    ctx.strokeStyle = '#6b7880'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-w * 0.015, -h * 0.15); ctx.lineTo(-w * 0.015, -h * 0.19); ctx.lineTo(w * 0.015, -h * 0.19); ctx.lineTo(w * 0.015, -h * 0.15); ctx.stroke();

    if (muzzle > 0) {
      const g = ctx.createRadialGradient(0, -h * 0.31, 0, 0, -h * 0.31, h * 0.24);
      g.addColorStop(0, 'rgba(255,255,210,.95)');
      g.addColorStop(.25, 'rgba(255,194,65,.8)');
      g.addColorStop(1, 'rgba(255,106,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, -h * 0.31, h * 0.24, 0, TAU); ctx.fill();
    }
    ctx.restore();

    const gap = 7 + cam.recoil * 8;
    ctx.strokeStyle = 'rgba(255,255,255,.76)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(w / 2 - gap - 7, h * 0.48); ctx.lineTo(w / 2 - gap, h * 0.48);
    ctx.moveTo(w / 2 + gap, h * 0.48); ctx.lineTo(w / 2 + gap + 7, h * 0.48);
    ctx.moveTo(w / 2, h * 0.48 - gap - 7); ctx.lineTo(w / 2, h * 0.48 - gap);
    ctx.moveTo(w / 2, h * 0.48 + gap); ctx.lineTo(w / 2, h * 0.48 + gap + 7);
    ctx.stroke();

    if (hitPulse > 0) {
      ctx.strokeStyle = `rgba(255,255,255,${hitPulse})`;
      ctx.lineWidth = 2.4;
      const s = 10;
      ctx.beginPath();
      ctx.moveTo(w / 2 - s, h * 0.48 - s); ctx.lineTo(w / 2 - 3, h * 0.48 - 3);
      ctx.moveTo(w / 2 + s, h * 0.48 - s); ctx.lineTo(w / 2 + 3, h * 0.48 - 3);
      ctx.moveTo(w / 2 - s, h * 0.48 + s); ctx.lineTo(w / 2 - 3, h * 0.48 + 3);
      ctx.moveTo(w / 2 + s, h * 0.48 + s); ctx.lineTo(w / 2 + 3, h * 0.48 + 3);
      ctx.stroke();
    }
  }

  function drawDamageOverlay(cam, w, h) {
    if (cam.hurt > 0 || shake > 0) {
      const a = clamp(cam.hurt * 0.28 + shake * 0.12, 0, 0.38);
      const g = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.18, w / 2, h / 2, Math.max(w, h) * 0.62);
      g.addColorStop(0, 'rgba(120,0,0,0)');
      g.addColorStop(1, `rgba(170,0,0,${a})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    }
    if (!cam.alive) {
      ctx.fillStyle = 'rgba(10,0,0,.48)';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = 'rgba(255,255,255,.92)';
      ctx.textAlign = 'center';
      ctx.font = '900 24px system-ui';
      ctx.fillText('OPERATOR DOWN', w / 2, h * 0.42);
      ctx.font = '600 12px system-ui';
      ctx.fillStyle = 'rgba(255,255,255,.62)';
      ctx.fillText('Switching combat feed…', w / 2, h * 0.42 + 25);
    }
  }

  function endRound() {
    if (roundEnding) return;
    roundEnding = true;
    const text = blueScore === redScore ? 'ROUND DRAW' : (blueScore > redScore ? 'BLUE TEAM WINS' : 'RED TEAM WINS');
    showStatus(text);
    addSystemFeed(text);
    setTimeout(createMatch, 3500);
  }

  function update(dt) {
    if (!roundEnding) {
      roundTime -= dt;
      for (const b of bots) b.update(dt);
      if (roundTime <= 0 || blueScore >= 35 || redScore >= 35) endRound();
    }

    for (const item of feed) item.life -= dt;
    const before = feed.length;
    feed = feed.filter(i => i.life > 0);
    if (feed.length !== before) renderFeed();

    muzzle = Math.max(0, muzzle - dt * 9);
    hitPulse = Math.max(0, hitPulse - dt * 3.6);
    shake = Math.max(0, shake - dt * 3);
    if (statusTimer > 0) {
      statusTimer -= dt;
      if (statusTimer <= 0) statusEl.classList.remove('show');
    }

    if (autoSpectate && !roundEnding) {
      autoTimer -= dt;
      const current = bots[spectatorIndex];
      if (autoTimer <= 0 || !current.alive) {
        selectLiving(1);
        autoTimer = 4 + Math.random() * 3;
      }
    }
    updateHud();
  }

  function render() {
    const w = canvas.width / DPR;
    const h = canvas.height / DPR;
    const cam = bots[spectatorIndex];
    if (!cam) return;
    const sx = (Math.random() - 0.5) * shake * 9;
    const sy = (Math.random() - 0.5) * shake * 6;
    ctx.save();
    ctx.translate(sx, sy);
    drawWorld(cam, w, h);
    drawWeapon(cam, w, h);
    drawDamageOverlay(cam, w, h);
    ctx.restore();
  }

  function loop(now) {
    const dt = Math.min(0.033, (now - lastTime) / 1000 || 0.016);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  prevBtn.addEventListener('click', () => { autoSpectate = false; autoBtn.textContent = 'AUTO: OFF'; selectLiving(-1); });
  nextBtn.addEventListener('click', () => { autoSpectate = false; autoBtn.textContent = 'AUTO: OFF'; selectLiving(1); });
  autoBtn.addEventListener('click', () => { autoSpectate = !autoSpectate; autoBtn.textContent = `AUTO: ${autoSpectate ? 'ON' : 'OFF'}`; autoTimer = 1; });
  canvas.addEventListener('pointerup', e => {
    if (e.clientX < innerWidth * 0.45) {
      autoSpectate = false;
      autoBtn.textContent = 'AUTO: OFF';
      selectLiving(-1);
    } else if (e.clientX > innerWidth * 0.55) {
      autoSpectate = false;
      autoBtn.textContent = 'AUTO: OFF';
      selectLiving(1);
    }
  });
  window.addEventListener('resize', resize, { passive: true });
  document.addEventListener('visibilitychange', () => { lastTime = performance.now(); });

  window.__strikeDebug = {
    build: '7.4',
    snapshot: () => ({
      score: [blueScore, redScore],
      bots: bots.map(b => ({
        name: b.name, x: b.x, y: b.y, angle: b.angle, pathAngle: b.pathAngle,
        alive: b.alive, target: b.target ? b.target.name : null,
        wallClear: canStand(b.x, b.y, BOT_RADIUS),
        forwardClearance: clearanceAlong(b.x, b.y, b.pathAngle, 1.2, BOT_RADIUS),
        pathIndex: b.pathIndex, pathLength: b.path.length
      }))
    })
  };

  resize();
  createMatch();
  updateHud();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
