<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#070b11" />
<title>Strikewatch: Spectator Ops</title>
<style>
  :root {
    color-scheme: dark;
    --panel: rgba(8, 14, 22, .78);
    --line: rgba(255,255,255,.14);
    --text: #f4f7fb;
    --muted: #91a0b0;
    --accent: #f4b942;
    --blue: #52adff;
    --red: #ff6868;
    --good: #58d68d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05080d; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { touch-action: manipulation; }
  #app { position: fixed; inset: 0; overflow: hidden; background: #05080d; }
  canvas { width: 100%; height: 100%; display: block; }

  .topbar {
    position: absolute;
    left: max(10px, env(safe-area-inset-left));
    right: max(10px, env(safe-area-inset-right));
    top: max(10px, env(safe-area-inset-top));
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    pointer-events: none;
  }
  .brand, .round, .feed, .spectator, .controls, .status, .mapTag {
    background: var(--panel);
    border: 1px solid var(--line);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 14px 40px rgba(0,0,0,.34);
  }
  .brand { padding: 9px 11px; border-radius: 13px; min-width: 148px; }
  .eyebrow { font-size: 9px; letter-spacing: .18em; color: var(--accent); font-weight: 800; }
  .brand h1 { margin: 2px 0 0; font-size: 14px; line-height: 1; letter-spacing: .04em; }
  .sub { margin-top: 4px; color: var(--muted); font-size: 10px; letter-spacing: .08em; }

  .round { border-radius: 13px; padding: 8px 10px; text-align: center; min-width: 128px; }
  .score { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 900; font-size: 18px; }
  .score .blue { color: var(--blue); }
  .score .red { color: var(--red); }
  .timer { margin-top: 2px; color: var(--muted); font-size: 10px; letter-spacing: .12em; }

  .feed {
    position: absolute;
    right: max(10px, env(safe-area-inset-right));
    top: calc(max(10px, env(safe-area-inset-top)) + 74px);
    width: min(290px, 66vw);
    padding: 8px;
    border-radius: 13px;
    pointer-events: none;
  }
  .feed-row { font-size: 10px; line-height: 1.35; padding: 3px 2px; color: #e8eef6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .feed-row b { color: #fff; }
  .feed-row .weapon { color: var(--accent); padding: 0 4px; }

  .mapTag {
    position: absolute; left: max(10px, env(safe-area-inset-left)); top: calc(max(10px, env(safe-area-inset-top)) + 74px);
    border-radius: 13px; padding: 8px 11px; pointer-events: none; min-width: 128px;
  }
  .mapTag .mode { font-size: 9px; letter-spacing: .15em; font-weight: 800; color: var(--accent); }
  .mapTag .name { margin-top: 2px; font-size: 14px; font-weight: 900; }
  .mapTag .desc { margin-top: 3px; font-size: 10px; color: var(--muted); }

  .spectator {
    position: absolute; left: max(10px, env(safe-area-inset-left)); bottom: calc(max(76px, env(safe-area-inset-bottom) + 66px));
    padding: 10px 11px; border-radius: 13px; min-width: 180px; pointer-events: none;
  }
  .spectator .label { color: var(--accent); font-size: 9px; font-weight: 900; letter-spacing: .16em; }
  .spectator .name { margin-top: 2px; font-size: 16px; font-weight: 900; }
  .spectator .meta { margin-top: 3px; font-size: 10px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .health { height: 6px; margin-top: 7px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.12); }
  .health > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg,#d94242,#f2c14e,#58d68d); transform-origin: left; }

  .status {
    position: absolute; left: 50%; top: 18%; transform: translateX(-50%);
    border-radius: 13px; padding: 8px 12px; font-size: 11px; font-weight: 900; letter-spacing: .14em;
    opacity: 0; transition: opacity .18s; pointer-events: none;
  }
  .status.show { opacity: 1; }

  .controls {
    position: absolute;
    left: max(10px, env(safe-area-inset-left));
    right: max(10px, env(safe-area-inset-right));
    bottom: max(10px, env(safe-area-inset-bottom));
    display: grid; grid-template-columns: 1fr 1.35fr 1fr; gap: 8px; padding: 8px; border-radius: 16px;
  }
  button {
    appearance: none; border: 1px solid rgba(255,255,255,.14); color: #fff; background: rgba(255,255,255,.075); min-height: 50px; border-radius: 12px;
    font: inherit; font-weight: 850; font-size: 11px; letter-spacing: .04em;
  }
  button:active { transform: scale(.98); background: rgba(255,255,255,.13); }
  button.primary { background: linear-gradient(180deg, rgba(244,185,66,.28), rgba(244,185,66,.12)); border-color: rgba(244,185,66,.48); }

  .rotate-note { display: none; position: absolute; inset: 0; place-items: center; background: #05080d; z-index: 20; padding: 28px; text-align: center; }
  .rotate-note div { max-width: 320px; }
  .rotate-note strong { display: block; font-size: 22px; margin-bottom: 8px; }
  .rotate-note span { color: var(--muted); font-size: 13px; }
  @media (orientation: portrait) and (max-width: 700px) { .rotate-note { display: grid; } }
  @media (min-width: 900px) {
    .controls { width: 460px; left: 50%; right: auto; transform: translateX(-50%); }
    .feed { width: 300px; }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="game" aria-label="Automated first-person combat simulation"></canvas>

  <div class="topbar">
    <div class="brand">
      <div class="eyebrow">LIVE COMBAT FEED</div>
      <h1>STRIKEWATCH</h1>
      <div class="sub">Frontline spectator simulation</div>
    </div>
    <div class="round">
      <div class="score"><span class="blue" id="blueScore">0</span><span>—</span><span class="red" id="redScore">0</span></div>
      <div class="timer" id="timer">03:00</div>
    </div>
  </div>

  <div class="mapTag">
    <div class="mode">TEAM DEATHMATCH</div>
    <div class="name">CITADEL YARD</div>
    <div class="desc">Fixed lanes, interior routes and courtyard sightlines</div>
  </div>

  <div class="feed" id="feed"></div>
  <div class="status" id="status">TARGET ELIMINATED</div>

  <div class="spectator">
    <div class="label">SPECTATING</div>
    <div class="name" id="spectatorName">BLUE 01</div>
    <div class="meta"><span id="teamText">BLUE TEAM</span><span id="kdText">0 K / 0 D</span><span id="weaponText">VX-7</span></div>
    <div class="health"><i id="healthBar"></i></div>
  </div>

  <div class="controls">
    <button id="prevBtn">◀ PREVIOUS</button>
    <button class="primary" id="autoBtn">AUTO: ON</button>
    <button id="nextBtn">NEXT ▶</button>
  </div>

  <div class="rotate-note">
    <div><strong>Rotate your phone</strong><span>Strikewatch is designed for landscape play.</span></div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const feedEl = document.getElementById('feed');
  const spectatorNameEl = document.getElementById('spectatorName');
  const teamTextEl = document.getElementById('teamText');
  const kdTextEl = document.getElementById('kdText');
  const weaponTextEl = document.getElementById('weaponText');
  const healthBarEl = document.getElementById('healthBar');
  const blueScoreEl = document.getElementById('blueScore');
  const redScoreEl = document.getElementById('redScore');
  const timerEl = document.getElementById('timer');
  const statusEl = document.getElementById('status');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const autoBtn = document.getElementById('autoBtn');

  const TAU = Math.PI * 2;
  const FOV = Math.PI / 2.5;
  const MAX_VIEW = 26;
  const TEAM_BLUE = 0;
  const TEAM_RED = 1;
  const TEAM_COLOURS = ['#52adff', '#ff6868'];
  const MAP = [
    '111111111111111111111111',
    '100000000000100000000001',
    '101111011110101111011101',
    '100001000010100001000001',
    '101101011010111011011101',
    '100100010000000010000001',
    '101101110111111011101101',
    '100001000100000010001001',
    '111001010101110010101001',
    '100000010100000010100001',
    '101111010111011110101101',
    '100000000001000000001001',
    '101111111101011111101101',
    '100010000001000010000001',
    '101010111101111010111101',
    '100010000100000010000001',
    '101111011101111011101101',
    '100000000000000000000001',
    '111111111111111111111111'
  ];
  const MAP_W = MAP[0].length;
  const MAP_H = MAP.length;
  const CELL_CENTER = 0.5;

  const spawnPoints = {
    0: [ {x: 1.7, y: 1.7}, {x: 2.6, y: 5.4}, {x: 5.2, y: 9.6}, {x: 2.1, y: 13.5}, {x: 4.8, y: 17.2} ],
    1: [ {x: 22.1, y: 1.7}, {x: 21.2, y: 5.4}, {x: 18.7, y: 9.6}, {x: 21.7, y: 13.5}, {x: 19.3, y: 17.2} ]
  };
  const hotspots = [
    {x: 6.5, y: 5.5}, {x: 8.5, y: 9.5}, {x: 12.5, y: 9.5}, {x: 16.5, y: 9.5}, {x: 18.5, y: 13.5}, {x: 12.5, y: 17.5}
  ];
  const weaponDefs = [
    { name: 'VX-7', damageMin: 18, damageMax: 27, fireRate: 0.14, accuracy: 0.76, range: 11.5 },
    { name: 'AR-12', damageMin: 20, damageMax: 30, fireRate: 0.18, accuracy: 0.71, range: 12.2 },
    { name: 'M8 CARBINE', damageMin: 16, damageMax: 25, fireRate: 0.12, accuracy: 0.73, range: 10.6 },
    { name: 'KILO-9', damageMin: 17, damageMax: 24, fireRate: 0.10, accuracy: 0.69, range: 9.7 }
  ];
  const names = {
    0: ['BLUE 01','BLUE 02','BLUE 03','BLUE 04','BLUE 05'],
    1: ['RED 01','RED 02','RED 03','RED 04','RED 05']
  };

  let bots = [];
  let blueScore = 0;
  let redScore = 0;
  let roundTime = 180;
  let lastTime = performance.now();
  let spectatorIndex = 0;
  let autoSpectate = true;
  let autoTimer = 5;
  let hitPulse = 0;
  let statusTimer = 0;
  let shake = 0;
  let muzzle = 0;
  let feed = [];
  let roundEnding = false;
  let depthBuffer = [];
  let DPR = 1;
  let statusTextTimer = 0;

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  function angleDiff(a, b) {
    let d = (a - b + Math.PI) % TAU - Math.PI;
    return d < -Math.PI ? d + TAU : d;
  }
  function isWall(x, y) {
    const mx = Math.floor(x), my = Math.floor(y);
    return mx < 0 || my < 0 || mx >= MAP_W || my >= MAP_H || MAP[my][mx] !== '0';
  }
  function canStand(x, y, r = 0.22) {
    return !isWall(x - r, y - r) && !isWall(x + r, y - r) && !isWall(x - r, y + r) && !isWall(x + r, y + r);
  }
  function randomSpawn(team) {
    const list = spawnPoints[team];
    const base = list[Math.floor(Math.random() * list.length)];
    return { x: base.x + (Math.random() - .5) * .24, y: base.y + (Math.random() - .5) * .24 };
  }
  function hasLineOfSight(a, b) {
    const d = dist(a, b);
    const steps = Math.ceil(d / 0.12);
    for (let i = 1; i < steps; i++) {
      const t = i / steps;
      if (isWall(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t)) return false;
    }
    return true;
  }
  function toCell(x, y) { return { x: Math.floor(x), y: Math.floor(y) }; }
  function keyOf(x, y) { return `${x},${y}`; }
  function fromKey(key) {
    const [x, y] = key.split(',').map(Number);
    return { x, y };
  }
  function neighbors(cell) {
    const out = [];
    const dirs = [ [1,0], [-1,0], [0,1], [0,-1] ];
    for (const [dx, dy] of dirs) {
      const nx = cell.x + dx, ny = cell.y + dy;
      if (nx >= 0 && ny >= 0 && nx < MAP_W && ny < MAP_H && MAP[ny][nx] === '0') out.push({ x: nx, y: ny });
    }
    return out;
  }
  function heuristic(a, b) { return Math.abs(a.x - b.x) + Math.abs(a.y - b.y); }
  function findPath(startPos, goalPos) {
    const start = toCell(startPos.x, startPos.y);
    const goal = toCell(goalPos.x, goalPos.y);
    const goalKey = keyOf(goal.x, goal.y);
    const open = [start];
    const cameFrom = new Map();
    const gScore = new Map([[keyOf(start.x, start.y), 0]]);
    const fScore = new Map([[keyOf(start.x, start.y), heuristic(start, goal)]]);
    const openSet = new Set([keyOf(start.x, start.y)]);
    let loop = 0;

    while (open.length && loop < 1200) {
      loop++;
      let bestIdx = 0;
      for (let i = 1; i < open.length; i++) {
        if ((fScore.get(keyOf(open[i].x, open[i].y)) ?? Infinity) < (fScore.get(keyOf(open[bestIdx].x, open[bestIdx].y)) ?? Infinity)) bestIdx = i;
      }
      const current = open.splice(bestIdx, 1)[0];
      const currentKey = keyOf(current.x, current.y);
      openSet.delete(currentKey);
      if (currentKey === goalKey) {
        const path = [];
        let traceKey = currentKey;
        path.unshift({ x: goal.x + CELL_CENTER, y: goal.y + CELL_CENTER });
        while (cameFrom.has(traceKey)) {
          const prevKey = cameFrom.get(traceKey);
          const prev = fromKey(prevKey);
          path.unshift({ x: prev.x + CELL_CENTER, y: prev.y + CELL_CENTER });
          traceKey = prevKey;
        }
        return path;
      }
      const currentG = gScore.get(currentKey) ?? Infinity;
      for (const n of neighbors(current)) {
        const nKey = keyOf(n.x, n.y);
        const tentative = currentG + 1;
        if (tentative < (gScore.get(nKey) ?? Infinity)) {
          cameFrom.set(nKey, currentKey);
          gScore.set(nKey, tentative);
          fScore.set(nKey, tentative + heuristic(n, goal));
          if (!openSet.has(nKey)) {
            open.push(n);
            openSet.add(nKey);
          }
        }
      }
    }
    return null;
  }

  class Bot {
    constructor(team, slot) {
      this.team = team;
      this.slot = slot;
      this.name = names[team][slot];
      this.weapon = weaponDefs[Math.floor(Math.random() * weaponDefs.length)];
      this.kills = 0;
      this.deaths = 0;
      this.skill = 0.88 + Math.random() * 0.18;
      this.moveSkill = 0.85 + Math.random() * 0.2;
      this.walkPhase = Math.random() * TAU;
      this.reset(true);
    }
    reset(initial = false) {
      const p = randomSpawn(this.team);
      this.x = p.x;
      this.y = p.y;
      this.angle = this.team === TEAM_BLUE ? 0 : Math.PI;
      this.pathAngle = this.angle;
      this.health = 100;
      this.alive = true;
      this.respawn = 0;
      this.target = null;
      this.lastSeen = null;
      this.cooldown = 0.35 + Math.random() * 0.4;
      this.flash = 0;
      this.recoil = 0;
      this.hurt = 0;
      this.strafeDir = Math.random() < 0.5 ? -1 : 1;
      this.speed = 1.15 + Math.random() * 0.22;
      this.path = [];
      this.pathIndex = 0;
      this.repathTimer = 0;
      this.stuckTimer = 0;
      this.lastX = this.x;
      this.lastY = this.y;
      this.waypointHold = 0;
      this.objective = this.chooseObjective();
      this.walkCycle = 0;
      if (!initial) this.weapon = weaponDefs[Math.floor(Math.random() * weaponDefs.length)];
    }
    chooseObjective() {
      const bias = this.team === TEAM_BLUE ? 1 : -1;
      const targetSide = this.team === TEAM_BLUE ? spawnPoints[TEAM_RED] : spawnPoints[TEAM_BLUE];
      const zone = targetSide[Math.floor(Math.random() * targetSide.length)];
      const hot = hotspots[Math.floor(Math.random() * hotspots.length)];
      return Math.random() < 0.55 ? { x: hot.x + bias * 0.15, y: hot.y } : { x: zone.x, y: zone.y };
    }
    ensurePath(goal) {
      const path = findPath(this, goal);
      if (path && path.length > 1) {
        this.path = path;
        this.pathIndex = 1;
      } else {
        this.path = [{ x: this.x, y: this.y }, goal];
        this.pathIndex = 1;
      }
      this.repathTimer = 0.8 + Math.random() * 0.6;
    }
    die(killer) {
      if (!this.alive) return;
      this.alive = false;
      this.health = 0;
      this.respawn = 2.2 + Math.random() * 1.3;
      this.deaths++;
      this.target = null;
      this.path = [];
      if (killer) {
        killer.kills++;
        if (killer.team === TEAM_BLUE) blueScore++; else redScore++;
        addFeed(killer, this);
        if (killer === bots[spectatorIndex]) {
          showStatus('TARGET ELIMINATED');
          hitPulse = 1;
        }
      }
      if (this === bots[spectatorIndex]) {
        showStatus('OPERATOR DOWN');
        shake = 1;
        if (autoSpectate) setTimeout(() => selectLiving(1), 500);
      }
    }
    update(dt) {
      this.flash = Math.max(0, this.flash - dt * 8);
      this.recoil = Math.max(0, this.recoil - dt * 8);
      this.hurt = Math.max(0, this.hurt - dt * 2.8);
      this.cooldown -= dt;

      if (!this.alive) {
        this.respawn -= dt;
        if (this.respawn <= 0 && !roundEnding) this.reset();
        return;
      }

      const enemies = bots.filter(b => b.alive && b.team !== this.team);
      let bestVisible = null;
      let bestDist = Infinity;
      for (const enemy of enemies) {
        const d = dist(this, enemy);
        if (d < this.weapon.range + 2.5 && hasLineOfSight(this, enemy) && d < bestDist) {
          bestVisible = enemy;
          bestDist = d;
        }
      }
      if (bestVisible) {
        this.target = bestVisible;
        this.lastSeen = { x: bestVisible.x, y: bestVisible.y };
      } else if (this.target && (!this.target.alive || dist(this, this.target) > this.weapon.range + 4)) {
        this.target = null;
      }

      if (this.target && this.target.alive && hasLineOfSight(this, this.target)) {
        this.combatMove(dt);
      } else {
        this.navigateMove(dt);
      }

      this.walkCycle += dt * (0.8 + Math.min(1.2, this.speed * 0.8));
      const moved = Math.hypot(this.x - this.lastX, this.y - this.lastY);
      if (moved < 0.01) {
        this.stuckTimer += dt;
        if (this.stuckTimer > 0.65) {
          this.objective = this.chooseObjective();
          this.ensurePath(this.objective);
          this.stuckTimer = 0;
        }
      } else {
        this.stuckTimer = 0;
      }
      this.lastX = this.x;
      this.lastY = this.y;
    }
    combatMove(dt) {
      const enemy = this.target;
      const desired = Math.atan2(enemy.y - this.y, enemy.x - this.x);
      this.angle += angleDiff(desired, this.angle) * clamp(dt * 6.5, 0, 1);
      const d = dist(this, enemy);
      let moveAngle = desired + this.strafeDir * Math.PI / 2;
      let moveSpeed = this.speed * (d > 4.6 ? 0.82 : d < 2.5 ? 0.62 : 0.55);
      if (Math.random() < 0.01) this.strafeDir *= -1;
      if (d > 6.8) moveAngle = desired;
      if (d < 2.1) moveAngle = desired + Math.PI;
      this.stepMove(moveAngle, moveSpeed, dt);
      if (this.cooldown <= 0 && Math.abs(angleDiff(desired, this.angle)) < 0.15) this.shoot(enemy, d);
    }
    navigateMove(dt) {
      this.repathTimer -= dt;
      if (!this.objective || dist(this, this.objective) < 1.25) this.objective = this.chooseObjective();
      const pursuitGoal = this.lastSeen && Math.random() < 0.6 ? this.lastSeen : this.objective;
      if (!this.path.length || this.pathIndex >= this.path.length || this.repathTimer <= 0) this.ensurePath(pursuitGoal);

      const waypoint = this.path[this.pathIndex] || pursuitGoal;
      const dx = waypoint.x - this.x;
      const dy = waypoint.y - this.y;
      const distanceToPoint = Math.hypot(dx, dy);
      if (distanceToPoint < 0.22 && this.pathIndex < this.path.length - 1) {
        this.pathIndex++;
      }
      const moveAngle = Math.atan2(dy, dx);
      this.angle += angleDiff(moveAngle, this.angle) * clamp(dt * 3.8, 0, 1);
      this.stepMove(moveAngle, this.speed * this.moveSkill, dt);
    }
    stepMove(moveAngle, moveSpeed, dt) {
      this.pathAngle += angleDiff(moveAngle, this.pathAngle) * clamp(dt * 4.4, 0, 1);
      let dx = Math.cos(this.pathAngle) * moveSpeed * dt;
      let dy = Math.sin(this.pathAngle) * moveSpeed * dt;

      // separation so units do not stack heavily
      let sepX = 0, sepY = 0;
      for (const other of bots) {
        if (other === this || !other.alive) continue;
        const ox = this.x - other.x;
        const oy = this.y - other.y;
        const dd = Math.hypot(ox, oy);
        if (dd > 0 && dd < 0.48) {
          const force = (0.48 - dd) / 0.48;
          sepX += (ox / dd) * force * 0.04;
          sepY += (oy / dd) * force * 0.04;
        }
      }
      dx += sepX;
      dy += sepY;

      let moved = false;
      if (canStand(this.x + dx, this.y, 0.2)) { this.x += dx; moved = true; }
      else this.pathAngle += (Math.random() < 0.5 ? -1 : 1) * 0.6;
      if (canStand(this.x, this.y + dy, 0.2)) { this.y += dy; moved = true; }
      else this.pathAngle += (Math.random() < 0.5 ? -1 : 1) * 0.6;
      if (!moved) this.pathIndex = Math.max(0, this.pathIndex - 1);
    }
    shoot(target, distance) {
      this.cooldown = this.weapon.fireRate + Math.random() * 0.05;
      this.flash = 1;
      this.recoil = 1;
      if (this === bots[spectatorIndex]) muzzle = 1;
      const distancePenalty = clamp((distance - 2.5) / 15, 0, 0.28);
      const hitChance = (this.weapon.accuracy * this.skill) - distancePenalty;
      if (Math.random() < hitChance && target.alive && hasLineOfSight(this, target)) {
        const damage = lerp(this.weapon.damageMin, this.weapon.damageMax, Math.random());
        target.health -= damage;
        target.hurt = 1;
        if (target === bots[spectatorIndex]) {
          shake = Math.min(1, shake + 0.38);
          hitPulse = Math.max(hitPulse, 0.5);
        }
        if (target.health <= 0) target.die(this);
      }
    }
  }

  function createMatch() {
    bots = [];
    for (let team = 0; team < 2; team++) for (let i = 0; i < 5; i++) bots.push(new Bot(team, i));
    blueScore = 0;
    redScore = 0;
    roundTime = 180;
    roundEnding = false;
    spectatorIndex = 0;
    feed = [];
    addSystemFeed('ROUND STARTED — FIRST TO 35');
  }

  function addFeed(killer, victim) {
    feed.unshift({
      html: `<b style="color:${TEAM_COLOURS[killer.team]}">${killer.name}</b><span class="weapon">${killer.weapon.name}</span><b style="color:${TEAM_COLOURS[victim.team]}">${victim.name}</b>`,
      life: 6
    });
    feed = feed.slice(0, 6);
    renderFeed();
  }
  function addSystemFeed(text) {
    feed.unshift({ html: `<span style="color:#f4b942">${text}</span>`, life: 5 });
    feed = feed.slice(0, 6);
    renderFeed();
  }
  function renderFeed() {
    feedEl.innerHTML = feed.map(item => `<div class="feed-row">${item.html}</div>`).join('');
  }
  function showStatus(text) {
    statusEl.textContent = text;
    statusEl.classList.add('show');
    statusTimer = 1.15;
  }
  function selectLiving(direction = 1) {
    for (let i = 1; i <= bots.length; i++) {
      const idx = (spectatorIndex + direction * i + bots.length) % bots.length;
      if (bots[idx].alive) {
        spectatorIndex = idx;
        autoTimer = 6;
        updateHud();
        return;
      }
    }
  }
  function updateHud() {
    const b = bots[spectatorIndex];
    if (!b) return;
    spectatorNameEl.textContent = b.name;
    spectatorNameEl.style.color = TEAM_COLOURS[b.team];
    teamTextEl.textContent = b.team === TEAM_BLUE ? 'BLUE TEAM' : 'RED TEAM';
    kdTextEl.textContent = `${b.kills} K / ${b.deaths} D`;
    weaponTextEl.textContent = b.weapon.name;
    healthBarEl.style.transform = `scaleX(${clamp(b.health / 100, 0, 1)})`;
    blueScoreEl.textContent = blueScore;
    redScoreEl.textContent = redScore;
    const m = Math.max(0, Math.floor(roundTime / 60));
    const s = Math.max(0, Math.floor(roundTime % 60)).toString().padStart(2, '0');
    timerEl.textContent = `${m.toString().padStart(2, '0')}:${s}`;
  }

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(320, innerWidth);
    const h = Math.max(240, innerHeight);
    canvas.width = Math.floor(w * DPR);
    canvas.height = Math.floor(h * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function castRay(px, py, angle) {
    const rayDirX = Math.cos(angle);
    const rayDirY = Math.sin(angle);
    let mapX = Math.floor(px);
    let mapY = Math.floor(py);
    const deltaDistX = Math.abs(1 / (rayDirX || 1e-6));
    const deltaDistY = Math.abs(1 / (rayDirY || 1e-6));
    let sideDistX, sideDistY;
    let stepX, stepY;

    if (rayDirX < 0) {
      stepX = -1;
      sideDistX = (px - mapX) * deltaDistX;
    } else {
      stepX = 1;
      sideDistX = (mapX + 1 - px) * deltaDistX;
    }
    if (rayDirY < 0) {
      stepY = -1;
      sideDistY = (py - mapY) * deltaDistY;
    } else {
      stepY = 1;
      sideDistY = (mapY + 1 - py) * deltaDistY;
    }

    let side = 0;
    let hit = false;
    while (!hit) {
      if (sideDistX < sideDistY) {
        sideDistX += deltaDistX;
        mapX += stepX;
        side = 0;
      } else {
        sideDistY += deltaDistY;
        mapY += stepY;
        side = 1;
      }
      if (mapX < 0 || mapY < 0 || mapX >= MAP_W || mapY >= MAP_H || MAP[mapY][mapX] !== '0') hit = true;
    }

    const perpWallDist = side === 0
      ? (mapX - px + (1 - stepX) / 2) / (rayDirX || 1e-6)
      : (mapY - py + (1 - stepY) / 2) / (rayDirY || 1e-6);

    const hitX = px + rayDirX * perpWallDist;
    const hitY = py + rayDirY * perpWallDist;
    const wallX = side === 0 ? hitY - Math.floor(hitY) : hitX - Math.floor(hitX);
    const tile = (mapX >= 0 && mapY >= 0 && mapX < MAP_W && mapY < MAP_H) ? MAP[mapY][mapX] : '1';
    return { d: Math.max(0.001, perpWallDist), hitX, hitY, side, wallX, tile, mapX, mapY };
  }

  function wallColour(hit, fog, y) {
    let r = 72, g = 85, b = 97;
    const stripe = ((Math.floor(hit.wallX * 8) & 1) ? 12 : -4);
    r += stripe; g += stripe; b += stripe;
    if (hit.side === 1) { r -= 14; g -= 14; b -= 10; }
    const grime = Math.sin((hit.mapX * 1.7 + hit.mapY * 2.4 + y * 0.02)) * 8;
    r += grime; g += grime * 0.8; b += grime * 0.6;
    const light = clamp(fog, 0.18, 1);
    return `rgb(${Math.floor(clamp(r * light, 18, 255))},${Math.floor(clamp(g * light, 18, 255))},${Math.floor(clamp(b * light, 18, 255))})`;
  }

  function drawBackdrop(w, h, horizon) {
    const sky = ctx.createLinearGradient(0, 0, 0, horizon);
    sky.addColorStop(0, '#0e1826');
    sky.addColorStop(0.55, '#1b3044');
    sky.addColorStop(1, '#587088');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, horizon);

    ctx.fillStyle = 'rgba(255,255,255,.06)';
    ctx.beginPath();
    ctx.arc(w * 0.77, h * 0.16, h * 0.05, 0, TAU);
    ctx.fill();

    ctx.fillStyle = 'rgba(0,0,0,.22)';
    for (let i = 0; i < 8; i++) {
      const x = i * w / 7.5;
      const height = h * (0.08 + (i % 3) * 0.03);
      ctx.fillRect(x, horizon - height, w * 0.045, height);
      ctx.fillRect(x + w * 0.026, horizon - height * 0.8, w * 0.025, height * 0.8);
    }

    const ground = ctx.createLinearGradient(0, horizon, 0, h);
    ground.addColorStop(0, '#25292c');
    ground.addColorStop(1, '#090b0d');
    ctx.fillStyle = ground;
    ctx.fillRect(0, horizon, w, h - horizon);

    ctx.save();
    ctx.globalAlpha = 0.08;
    ctx.strokeStyle = '#d7e2e7';
    for (let i = 0; i < 12; i++) {
      const yy = horizon + (i + 1) * (h - horizon) / 13;
      ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(w, yy + i * 1.6); ctx.stroke();
    }
    for (let i = 0; i <= 16; i++) {
      const x = w * i / 16;
      ctx.beginPath(); ctx.moveTo(w / 2, horizon); ctx.lineTo(x, h); ctx.stroke();
    }
    ctx.restore();
  }

  function drawWorld(cam, w, h) {
    const time = performance.now() / 1000;
    const horizon = h * 0.48 + Math.sin(time * 0.4) * 1.5;
    drawBackdrop(w, h, horizon);

    const rayCount = Math.min(720, Math.max(320, Math.floor(w * 0.9)));
    const sliceW = w / rayCount + 0.6;
    depthBuffer = new Array(rayCount);

    for (let i = 0; i < rayCount; i++) {
      const norm = i / (rayCount - 1) - 0.5;
      const rayAngle = cam.angle + norm * FOV;
      const hit = castRay(cam.x, cam.y, rayAngle);
      const corrected = hit.d * Math.cos(rayAngle - cam.angle);
      depthBuffer[i] = corrected;
      const wallH = Math.min(h * 1.4, h / (corrected * 0.74));
      const y = horizon - wallH / 2;
      const fog = clamp(1 - corrected / MAX_VIEW, 0, 1);
      ctx.fillStyle = wallColour(hit, 0.38 + fog * 0.78, y);
      ctx.fillRect(i * sliceW, y, sliceW + 1, wallH);

      ctx.fillStyle = `rgba(255,255,255,${0.05 * fog})`;
      ctx.fillRect(i * sliceW, y + wallH * 0.07, sliceW, wallH * 0.03);
      ctx.fillStyle = `rgba(0,0,0,${0.12 + (1 - fog) * 0.25})`;
      ctx.fillRect(i * sliceW, y + wallH * 0.82, sliceW + 1, wallH * 0.2);
    }

    drawSprites(cam, w, h, horizon, rayCount);
    drawObjectiveDecals(cam, w, h, rayCount);
  }

  function spriteOccluded(screenX, distValue, rayCount, w) {
    const idx = clamp(Math.floor(screenX / w * rayCount), 0, rayCount - 1);
    return depthBuffer[idx] < distValue * 0.96;
  }

  function drawSprites(cam, w, h, horizon, rayCount) {
    const visible = bots
      .filter(b => b.alive && b !== cam)
      .map(b => {
        const dx = b.x - cam.x, dy = b.y - cam.y;
        const d = Math.hypot(dx, dy);
        const a = angleDiff(Math.atan2(dy, dx), cam.angle);
        return { b, d, a };
      })
      .filter(o => Math.abs(o.a) < FOV * 0.68 && o.d < MAX_VIEW)
      .sort((a, b) => b.d - a.d);

    for (const o of visible) {
      const screenX = w * (0.5 + o.a / FOV);
      if (spriteOccluded(screenX, o.d, rayCount, w)) continue;
      const size = clamp(h / (o.d * 1.06), 22, h * 0.78);
      const foot = horizon + size * 0.5;
      const headY = foot - size;
      const bob = Math.sin(o.b.walkCycle * 8 + o.b.slot) * size * 0.03;
      ctx.save();
      ctx.translate(screenX, bob);
      ctx.globalAlpha = clamp(1 - o.d / MAX_VIEW, 0.25, 1);

      ctx.fillStyle = 'rgba(0,0,0,.32)';
      ctx.beginPath(); ctx.ellipse(0, foot + 4, size * 0.22, size * 0.055, 0, 0, TAU); ctx.fill();

      // legs
      const legSwing = Math.sin(o.b.walkCycle * 8) * size * 0.04;
      ctx.fillStyle = '#1b2127';
      ctx.fillRect(-size * 0.16, headY + size * 0.64, size * 0.11, size * 0.34);
      ctx.fillRect(size * 0.05, headY + size * 0.64, size * 0.11, size * 0.34);
      ctx.fillStyle = '#2c3740';
      ctx.fillRect(-size * 0.165 + legSwing, headY + size * 0.82, size * 0.12, size * 0.08);
      ctx.fillRect(size * 0.045 - legSwing, headY + size * 0.82, size * 0.12, size * 0.08);

      // torso and shoulders
      ctx.fillStyle = o.b.team === TEAM_BLUE ? '#355d84' : '#874040';
      ctx.beginPath();
      ctx.moveTo(-size * 0.24, headY + size * 0.3);
      ctx.lineTo(size * 0.24, headY + size * 0.3);
      ctx.lineTo(size * 0.18, headY + size * 0.72);
      ctx.lineTo(-size * 0.18, headY + size * 0.72);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.16)';
      ctx.fillRect(-size * 0.16, headY + size * 0.36, size * 0.32, size * 0.06);

      ctx.fillStyle = '#24303a';
      ctx.fillRect(-size * 0.3, headY + size * 0.34, size * 0.07, size * 0.25);
      ctx.fillRect(size * 0.23, headY + size * 0.34, size * 0.07, size * 0.25);

      // head
      ctx.fillStyle = '#212a32';
      ctx.beginPath(); ctx.arc(0, headY + size * 0.2, size * 0.15, 0, TAU); ctx.fill();
      ctx.fillStyle = o.b.team === TEAM_BLUE ? '#6ec0ff' : '#ff9595';
      ctx.fillRect(-size * 0.11, headY + size * 0.17, size * 0.22, size * 0.05);

      // weapon
      ctx.save();
      ctx.translate(size * 0.07, headY + size * 0.48);
      ctx.rotate(-0.06 + o.b.recoil * 0.05);
      ctx.fillStyle = '#15191d'; ctx.fillRect(-size * 0.06, -size * 0.026, size * 0.42, size * 0.06);
      ctx.fillStyle = '#6d767d'; ctx.fillRect(size * 0.24, -size * 0.015, size * 0.13, size * 0.03);
      ctx.fillStyle = '#263139'; ctx.fillRect(-size * 0.025, -size * 0.06, size * 0.05, size * 0.034);
      if (o.b.flash > 0) {
        const g = ctx.createRadialGradient(size * 0.42, 0, 0, size * 0.42, 0, size * 0.22);
        g.addColorStop(0, 'rgba(255,245,182,.95)');
        g.addColorStop(.26, 'rgba(255,194,65,.8)');
        g.addColorStop(1, 'rgba(255,132,27,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(size * 0.42, 0, size * 0.22, 0, TAU); ctx.fill();
      }
      ctx.restore();

      if (o.d < 8.5) {
        ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(-size * 0.24, headY - size * 0.1, size * 0.48, size * 0.05);
        ctx.fillStyle = TEAM_COLOURS[o.b.team]; ctx.fillRect(-size * 0.24, headY - size * 0.1, size * 0.48 * clamp(o.b.health / 100, 0, 1), size * 0.05);
      }
      if (o.b.hurt > 0) {
        ctx.strokeStyle = `rgba(255,255,255,${o.b.hurt * 0.65})`;
        ctx.lineWidth = 2;
        ctx.strokeRect(-size * 0.26, headY + size * 0.05, size * 0.52, size * 0.95);
      }
      ctx.restore();
    }
  }

  function drawObjectiveDecals(cam, w, h, rayCount) {
    for (const marker of hotspots) {
      const dx = marker.x - cam.x;
      const dy = marker.y - cam.y;
      const d = Math.hypot(dx, dy);
      if (d < 2.2 || d > 14) continue;
      const a = angleDiff(Math.atan2(dy, dx), cam.angle);
      if (Math.abs(a) > FOV * 0.66) continue;
      const screenX = w * (0.5 + a / FOV);
      if (spriteOccluded(screenX, d, rayCount, w)) continue;
      const size = clamp(h / (d * 2.8), 8, 22);
      const y = h * 0.48 + h / (d * 1.8);
      ctx.save();
      ctx.translate(screenX, y);
      ctx.globalAlpha = clamp(1 - d / 14, 0.12, 0.35);
      ctx.strokeStyle = '#f4b942';
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(0, 0, size, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-size, 0); ctx.lineTo(size, 0); ctx.moveTo(0, -size); ctx.lineTo(0, size); ctx.stroke();
      ctx.restore();
    }
  }

  function drawWeapon(cam, w, h) {
    const t = performance.now() / 1000;
    const moveAmt = cam.alive ? clamp(Math.hypot(cam.x - cam.lastX, cam.y - cam.lastY) * 42, 0, 1) : 0;
    const bob = cam.alive ? Math.sin(t * 8) * 2.8 * moveAmt : 0;
    const sway = Math.sin(t * 3.3) * 3;
    const recoil = cam.recoil * 19;
    const x = w * 0.5 + sway;
    const y = h - h * 0.12 + bob + recoil;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-0.04 + cam.recoil * 0.038);

    // left arm
    ctx.fillStyle = '#2c3740';
    ctx.beginPath();
    ctx.moveTo(-w * 0.23, h * 0.16);
    ctx.lineTo(-w * 0.078, -h * 0.015);
    ctx.lineTo(-w * 0.006, h * 0.08);
    ctx.lineTo(-w * 0.145, h * 0.21);
    ctx.closePath(); ctx.fill();

    // right arm
    ctx.beginPath();
    ctx.moveTo(w * 0.21, h * 0.17);
    ctx.lineTo(w * 0.078, h * 0.015);
    ctx.lineTo(w * 0.018, h * 0.082);
    ctx.lineTo(w * 0.13, h * 0.205);
    ctx.closePath(); ctx.fill();

    // rifle body
    ctx.fillStyle = '#0d1216';
    ctx.beginPath();
    ctx.moveTo(-w * 0.076, h * 0.125);
    ctx.lineTo(-w * 0.056, -h * 0.048);
    ctx.lineTo(w * 0.058, -h * 0.057);
    ctx.lineTo(w * 0.095, h * 0.108);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#2a353d'; ctx.fillRect(-w * 0.045, -h * 0.055, w * 0.09, h * 0.07);
    ctx.fillStyle = '#10161b'; ctx.fillRect(-w * 0.025, -h * 0.145, w * 0.05, h * 0.11);
    ctx.fillStyle = '#435058'; ctx.fillRect(-w * 0.01, -h * 0.295, w * 0.02, h * 0.16);
    ctx.fillStyle = '#0b0f12'; ctx.fillRect(-w * 0.036, -h * 0.097, w * 0.072, h * 0.024);
    ctx.fillStyle = '#20272d'; ctx.fillRect(-w * 0.018, h * 0.025, w * 0.036, h * 0.08);
    ctx.fillStyle = '#151a1f'; ctx.fillRect(-w * 0.015, h * 0.105, w * 0.03, h * 0.06);

    ctx.strokeStyle = '#6b7880'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-w * 0.015, -h * 0.15);
    ctx.lineTo(-w * 0.015, -h * 0.19);
    ctx.lineTo(w * 0.015, -h * 0.19);
    ctx.lineTo(w * 0.015, -h * 0.15);
    ctx.stroke();

    if (muzzle > 0) {
      const g = ctx.createRadialGradient(0, -h * 0.31, 0, 0, -h * 0.31, h * 0.22);
      g.addColorStop(0, 'rgba(255,255,210,.95)');
      g.addColorStop(.25, 'rgba(255,194,65,.8)');
      g.addColorStop(1, 'rgba(255,106,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, -h * 0.31, h * 0.22, 0, TAU); ctx.fill();
    }
    ctx.restore();

    // crosshair
    const gap = 7 + cam.recoil * 9;
    ctx.strokeStyle = 'rgba(255,255,255,.75)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(w / 2 - gap - 7, h * 0.48); ctx.lineTo(w / 2 - gap, h * 0.48);
    ctx.moveTo(w / 2 + gap, h * 0.48); ctx.lineTo(w / 2 + gap + 7, h * 0.48);
    ctx.moveTo(w / 2, h * 0.48 - gap - 7); ctx.lineTo(w / 2, h * 0.48 - gap);
    ctx.moveTo(w / 2, h * 0.48 + gap); ctx.lineTo(w / 2, h * 0.48 + gap + 7);
    ctx.stroke();

    if (hitPulse > 0) {
      ctx.strokeStyle = `rgba(255,255,255,${hitPulse})`;
      ctx.lineWidth = 2.4;
      const s = 10;
      ctx.beginPath();
      ctx.moveTo(w / 2 - s, h * 0.48 - s); ctx.lineTo(w / 2 - 3, h * 0.48 - 3);
      ctx.moveTo(w / 2 + s, h * 0.48 - s); ctx.lineTo(w / 2 + 3, h * 0.48 - 3);
      ctx.moveTo(w / 2 - s, h * 0.48 + s); ctx.lineTo(w / 2 - 3, h * 0.48 + 3);
      ctx.moveTo(w / 2 + s, h * 0.48 + s); ctx.lineTo(w / 2 + 3, h * 0.48 + 3);
      ctx.stroke();
    }
  }

  function drawDamageOverlay(cam, w, h) {
    if (cam.hurt > 0 || shake > 0) {
      const a = clamp(cam.hurt * 0.28 + shake * 0.12, 0, 0.38);
      const g = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.18, w / 2, h / 2, Math.max(w, h) * 0.62);
      g.addColorStop(0, 'rgba(120,0,0,0)');
      g.addColorStop(1, `rgba(170,0,0,${a})`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    }
    if (!cam.alive) {
      ctx.fillStyle = 'rgba(10,0,0,.48)';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = 'rgba(255,255,255,.92)';
      ctx.textAlign = 'center';
      ctx.font = '900 24px system-ui';
      ctx.fillText('OPERATOR DOWN', w / 2, h * 0.42);
      ctx.font = '600 12px system-ui';
      ctx.fillStyle = 'rgba(255,255,255,.62)';
      ctx.fillText('Switching combat feed…', w / 2, h * 0.42 + 25);
    }
  }

  function endRound() {
    if (roundEnding) return;
    roundEnding = true;
    const text = blueScore === redScore ? 'ROUND DRAW' : (blueScore > redScore ? 'BLUE TEAM WINS' : 'RED TEAM WINS');
    showStatus(text);
    addSystemFeed(text);
    setTimeout(createMatch, 3500);
  }

  function update(dt) {
    if (!roundEnding) {
      roundTime -= dt;
      for (const b of bots) b.update(dt);
      if (roundTime <= 0 || blueScore >= 35 || redScore >= 35) endRound();
    }
    for (const item of feed) item.life -= dt;
    const oldLength = feed.length;
    feed = feed.filter(i => i.life > 0);
    if (feed.length !== oldLength) renderFeed();

    muzzle = Math.max(0, muzzle - dt * 9);
    hitPulse = Math.max(0, hitPulse - dt * 3.5);
    shake = Math.max(0, shake - dt * 3);
    if (statusTimer > 0) {
      statusTimer -= dt;
      if (statusTimer <= 0) statusEl.classList.remove('show');
    }

    if (autoSpectate && !roundEnding) {
      autoTimer -= dt;
      const current = bots[spectatorIndex];
      if (autoTimer <= 0 || !current.alive) {
        selectLiving(1);
        autoTimer = 4 + Math.random() * 3.5;
      }
    }
    updateHud();
  }

  function render() {
    const w = canvas.width / DPR, h = canvas.height / DPR;
    const cam = bots[spectatorIndex];
    if (!cam) return;
    const sx = (Math.random() - .5) * shake * 9;
    const sy = (Math.random() - .5) * shake * 6;
    ctx.save();
    ctx.translate(sx, sy);
    drawWorld(cam, w, h);
    drawWeapon(cam, w, h);
    drawDamageOverlay(cam, w, h);
    ctx.restore();
  }

  function loop(now) {
    const dt = Math.min(.033, (now - lastTime) / 1000 || .016);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  prevBtn.addEventListener('click', () => { autoSpectate = false; autoBtn.textContent = 'AUTO: OFF'; selectLiving(-1); });
  nextBtn.addEventListener('click', () => { autoSpectate = false; autoBtn.textContent = 'AUTO: OFF'; selectLiving(1); });
  autoBtn.addEventListener('click', () => { autoSpectate = !autoSpectate; autoBtn.textContent = `AUTO: ${autoSpectate ? 'ON' : 'OFF'}`; autoTimer = 1; });
  canvas.addEventListener('pointerup', e => {
    if (e.clientX < innerWidth * .45) { autoSpectate = false; autoBtn.textContent = 'AUTO: OFF'; selectLiving(-1); }
    else if (e.clientX > innerWidth * .55) { autoSpectate = false; autoBtn.textContent = 'AUTO: OFF'; selectLiving(1); }
  });
  window.addEventListener('resize', resize, { passive: true });
  document.addEventListener('visibilitychange', () => { lastTime = performance.now(); });

  resize();
  createMatch();
  updateHud();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
