    $('#modalRoot').innerHTML = '';
    document.body.style.overflow = '';
    if (activeCombat?.ended) activeCombat = null;
  }

  function resourceTags(resources) {
    return Object.entries(resources || {}).map(([key, value]) => {
      const label = D.resources[key] || D.goods[key] || { name: titleCase(key), icon: '•' };
      const amount = Array.isArray(value) ? `${formatNumber(value[0])}–${formatNumber(value[1])}` : formatNumber(value);
      return `<span class="reward">${label.icon || ''} ${amount} ${escapeHtml(label.name)}</span>`;
    }).join('');
  }

  function statMeter(label, value, max, className = '') {
    const pct = clamp((value / Math.max(1, max)) * 100, 0, 100);
    return `<div class="meter ${className}"><div class="meter-head"><span>${escapeHtml(label)}</span><strong>${Math.round(value)} / ${Math.round(max)}</strong></div><div class="progress"><span style="width:${pct}%"></span></div></div>`;
  }

  function lockedPanel(unlockId) {
    const unlock = D.unlocks.find(item => item.id === unlockId);
    return `<div class="card locked-panel"><h3>${escapeHtml(unlock?.name || 'Locked')}</h3><p>${escapeHtml(unlock?.description || '')}</p><span class="tag gold">Unlocks at ${formatNumber(unlock?.renown || 0)} renown</span></div>`;
  }

  function renderHeader() {
    $('#goldValue').textContent = formatNumber(state.resources.gold);
    $('#renownValue').textContent = formatNumber(state.resources.renown);
    $('#rankLabel').textContent = getRank().name;
    const readyReports = state.activeMissions.filter(m => ['complete', 'failed', 'battleReady'].includes(m.status) && !m.claimed).length;
    $('#missionBadge').textContent = readyReports || '!';
    $('#missionBadge').classList.toggle('hidden', readyReports === 0);
    const fleetIssues = state.ships.filter(ship => !ship.captainId || ship.hull < getShipMaxHull(ship) * .35).length;
    $('#fleetBadge').textContent = fleetIssues || '!';
    $('#fleetBadge').classList.toggle('hidden', fleetIssues === 0);
  }

  function navigate(view) {
    if (!['map', 'fleet', 'port', 'missions', 'captain'].includes(view)) return;
    state.currentView = view;
    $$('.view').forEach(section => section.classList.toggle('active', section.dataset.view === view));
    $$('[data-nav]').forEach(button => button.classList.toggle('active', button.dataset.nav === view));
    if (view === 'fleet') renderFleet();
    if (view === 'port') renderPort();
    if (view === 'missions') renderMissions();
    if (view === 'captain') renderCaptain();
    if (view === 'map') renderMap();
    window.scrollTo({ top: 0, behavior: state.settings.reducedMotion ? 'auto' : 'smooth' });
    advanceTutorial('navigate', view);
  }

  function renderMap() {
    const locationRoot = $('#mapLocations');
    const shipRoot = $('#mapShips');
    const eventRoot = $('#mapEvents');
    const routeRoot = $('#routeLayer');
    if (!locationRoot || !shipRoot || !eventRoot || !routeRoot) return;

    locationRoot.innerHTML = D.ports.map(port => {
      const unlocked = state.unlockedPorts.includes(port.id);
      return `<button class="map-location ${unlocked ? '' : 'locked'} ${state.currentPortId === port.id ? 'current' : ''}" style="left:${port.x}%;top:${port.y}%" data-action="open-port-location" data-port-id="${port.id}" ${unlocked ? '' : 'disabled'}>
        <span class="location-icon">${unlocked ? port.icon : '?'}</span>
        <span class="location-label">${unlocked ? escapeHtml(port.name) : `${formatNumber(port.unlockRenown)} renown`}</span>
      </button>`;
    }).join('');

    const routeLines = [];
    const shipMarkers = [];
    state.ships.forEach((ship, index) => {
      const active = ship.activeMissionId ? getActiveMission(ship.activeMissionId) : null;
      const origin = active ? getPort(active.originId) : getPort(ship.locationId);
      const destination = active ? getPort(active.destinationId) : origin;
      let x = origin?.x || 18;
      let y = origin?.y || 72;
      let heading = 1;
      if (active && destination) {
        const progress = clamp((now() - active.startTime) / Math.max(1, active.endTime - active.startTime), 0, 1);
        const travelProgress = active.status === 'underway' ? (progress < .5 ? progress * 2 : (1 - progress) * 2) : 0;
        const targetPort = progress < .5 ? destination : origin;
        const startPort = progress < .5 ? origin : destination;
        const legProgress = progress < .5 ? progress * 2 : (progress - .5) * 2;
        x = startPort.x + (targetPort.x - startPort.x) * legProgress;
        y = startPort.y + (targetPort.y - startPort.y) * legProgress - Math.sin(legProgress * Math.PI) * 6;
        heading = targetPort.x >= startPort.x ? 1 : -1;
        routeLines.push(`<path class="route-line active" d="M ${origin.x * 10} ${origin.y * 7} Q ${(origin.x + destination.x) * 5} ${(Math.min(origin.y, destination.y) - 12) * 7} ${destination.x * 10} ${destination.y * 7}" />`);
      } else {
        x += ((index % 3) - 1) * 1.7;
        y += (Math.floor(index / 3) % 2) * 2;
      }
      const selected = state.selectedShipId === ship.id;
      const type = getShipType(ship);
      shipMarkers.push(`<button class="map-ship ${selected ? 'selected' : ''}" style="left:${x}%;top:${y}%" data-action="open-ship" data-ship-id="${ship.id}" aria-label="${escapeHtml(ship.name)}">
        <span class="ship-marker" style="transform:scaleX(${heading})">${type.icon}</span>
        ${active ? '<span class="ship-progress-ring"></span>' : ''}
      </button>`);
    });
    routeRoot.innerHTML = routeLines.join('');
    shipRoot.innerHTML = shipMarkers.join('');
    eventRoot.innerHTML = state.worldEvents.map(event => `<button class="map-event" style="left:${event.x}%;top:${event.y}%" data-action="open-world-event" data-event-id="${event.id}" aria-label="${escapeHtml(event.title)}"><span class="event-marker">${event.icon}</span></button>`).join('');

    const weather = [
      { icon: '☁', x: 43, y: 34 },
      { icon: '🌧', x: 82, y: 23 }
    ];
    $('#weatherLayer').innerHTML = weather.map((cell, i) => `<span class="weather-cell" style="left:${cell.x}%;top:${cell.y}%;animation-delay:${i * -2}s">${cell.icon}</span>`).join('');
    const discoveredRatio = state.unlockedPorts.length / D.ports.length;
    $('#mapFog').style.opacity = String(clamp(.78 - discoveredRatio * .65, .08, .72));
    $('#mapFog').style.setProperty('--fog-x', `${20 + discoveredRatio * 40}%`);

    const activeCount = state.activeMissions.filter(m => ['underway', 'battleReady'].includes(m.status)).length;
    const idleCount = state.ships.filter(ship => !ship.activeMissionId).length;
    const battleCount = state.activeMissions.filter(m => m.status === 'battleReady').length;
    $('#mapStatusStrip').innerHTML = `
      <span class="status-pill"><strong>${activeCount}</strong> voyages underway</span>
      <span class="status-pill"><strong>${idleCount}</strong> ships available</span>
      <span class="status-pill"><strong>${battleCount}</strong> battles awaiting command</span>
      <span class="status-pill">Markets shift in <strong>${formatTime(Math.max(0, 600 - (now() - state.lastMarketUpdate) / 1000))}</strong></span>`;
    renderActivityOverview();
    renderRumourOverview();
  }

  function renderActivityOverview() {
    const root = $('#activityOverview');
    const active = state.activeMissions.filter(m => ['underway', 'battleReady'].includes(m.status)).slice(0, 3);
    if (!active.length) {
      root.innerHTML = `<div class="empty-state"><span>⚓</span><h3>The fleet is waiting</h3><p>Assign a mission or inspect the map for opportunities.</p></div>`;
      return;
    }
    root.innerHTML = active.map(mission => {
      const remaining = Math.max(0, (mission.endTime - now()) / 1000);
      const progress = clamp(((now() - mission.startTime) / Math.max(1, mission.endTime - mission.startTime)) * 100, 0, 100);
      const ships = mission.shipIds.map(id => getShip(id)?.name).filter(Boolean).join(', ');
      return `<button class="activity-row" data-nav="missions">
        <span class="activity-icon">${mission.mission.icon}</span>
        <span><strong>${escapeHtml(mission.mission.title)}</strong><p>${escapeHtml(ships)}</p><span class="progress"><span style="width:${progress}%"></span></span></span>
        <span class="countdown">${mission.status === 'battleReady' ? 'BATTLE' : formatTime(remaining)}</span>
      </button>`;
    }).join('');
  }

  function renderRumourOverview() {
    const root = $('#rumourOverview');
    const missions = state.availableMissions.slice(0, 3);
    root.innerHTML = missions.length ? missions.map(mission => `<div class="rumour-row">
      <span class="activity-icon">${mission.icon}</span><span><strong>${escapeHtml(mission.title)}</strong><p>${escapeHtml(getPort(mission.destinationId)?.name || 'Open water')} · ${titleCase(mission.difficulty)}</p></span>
      <span class="reward">◉ ${Array.isArray(mission.rewards.gold) ? `${formatNumber(mission.rewards.gold[0])}–${formatNumber(mission.rewards.gold[1])}` : formatNumber(mission.rewards.gold)}</span>
    </div>`).join('') : `<div class="empty-state"><span>📜</span><p>The board is being refreshed.</p></div>`;
  }

  function renderFleet() {
    const totalCrew = state.ships.reduce((sum, ship) => sum + getCrewCount(ship), 0);
    const totalPower = state.ships.reduce((sum, ship) => sum + getShipPower(ship), 0);
    $('#fleetSummary').innerHTML = `
      <div class="summary-card"><span>Ships</span><strong>${state.ships.length}</strong></div>
      <div class="summary-card"><span>Crew</span><strong>${totalCrew}</strong></div>
      <div class="summary-card"><span>Power</span><strong>${formatNumber(totalPower)}</strong></div>`;
    $$('[data-fleet-tab]').forEach(button => button.classList.toggle('active', button.dataset.fleetTab === state.fleetTab));
    const content = $('#fleetContent');
    if (state.fleetTab === 'ships') content.innerHTML = renderShipCards();
    else if (state.fleetTab === 'crew') content.innerHTML = renderCrewOverview();
    else if (state.fleetTab === 'captains') content.innerHTML = systemUnlock('captains') ? renderCaptainsOverview() : lockedPanel('captains');
    else content.innerHTML = systemUnlock('fleets') ? renderFleetFormations() : lockedPanel('fleets');
    content.classList.toggle('cards-grid', ['ships', 'captains', 'formations'].includes(state.fleetTab));
  }

  function renderShipCards() {
    return state.ships.map(ship => {
      const type = getShipType(ship);
      const captain = getCaptain(ship.captainId);
      const active = ship.activeMissionId ? getActiveMission(ship.activeMissionId) : null;
      const cargoUsed = getCargoUsed(ship);
      const cargoMax = getShipStat(ship, 'cargo');
      return `<article class="card ship-card">
        <div class="card-header">
          <div class="card-title"><div class="ship-avatar">${type.icon}<span class="level-badge">${ship.level}</span></div><div><h3>${escapeHtml(ship.name)}</h3><p class="card-subtitle">${escapeHtml(type.name)} · ${captain ? escapeHtml(captain.name) : 'No captain assigned'}</p></div></div>
          <span class="${active ? 'busy-ribbon' : ship.hull < getShipMaxHull(ship) * .4 ? 'busy-ribbon damaged' : 'tag green'}">${escapeHtml(ship.status)}</span>
        </div>
        ${statMeter('Hull', ship.hull, getShipMaxHull(ship), ship.hull < getShipMaxHull(ship) * .35 ? 'danger' : 'good')}
        ${statMeter('Morale', ship.morale, 100, ship.morale < 35 ? 'danger' : '')}
        <div class="stat-grid">
          <div class="stat"><label>Power</label><strong>${formatNumber(getShipPower(ship))}</strong></div>
          <div class="stat"><label>Crew</label><strong>${getCrewCount(ship)} / ${type.crew}</strong></div>
          <div class="stat"><label>Cargo</label><strong>${Math.round(cargoUsed)} / ${Math.round(cargoMax)}</strong></div>
          <div class="stat"><label>Supplies</label><strong>${Math.round(ship.supplies)} / ${Math.round(getShipStat(ship, 'supplies'))}</strong></div>
        </div>
        <div class="card-actions">
          <button class="ghost-button" data-action="open-ship" data-ship-id="${ship.id}">Details</button>
          <button class="ghost-button" data-action="repair-ship" data-ship-id="${ship.id}" ${active || ship.hull >= getShipMaxHull(ship) ? 'disabled' : ''}>Repair</button>
          <button class="primary-button" data-action="resupply-ship" data-ship-id="${ship.id}" ${active || ship.supplies >= getShipStat(ship, 'supplies') ? 'disabled' : ''}>Resupply</button>
        </div>
      </article>`;
    }).join('');
  }

  function renderCrewOverview() {
    const totals = {};
    state.ships.forEach(ship => Object.entries(ship.crew).forEach(([role, amount]) => { totals[role] = (totals[role] || 0) + amount; }));
    const roles = Object.entries(D.crewRoles).map(([id, role]) => `<div class="card">
      <div class="card-header"><div class="card-title"><span class="round-icon">${role.icon}</span><div><h3>${role.name}</h3><p class="card-subtitle">${escapeHtml(role.description)}</p></div></div><strong>${totals[id] || 0}</strong></div>
      <div class="tag-row"><span class="tag">Recruitment: ${role.cost} gold</span><span class="tag">Wage rating: ${role.wage}</span></div>
      <div class="card-actions"><button class="primary-button" data-action="open-recruit" data-role-id="${id}" ${systemUnlock('crew') ? '' : 'disabled'}>Recruit</button></div>
    </div>`).join('');
    return `${!systemUnlock('crew') ? lockedPanel('crew') : ''}<div class="content-stack cards-grid">${roles}</div>`;
  }

  function renderCaptainsOverview() {
    return state.captains.map(captain => {
      const ship = getShip(captain.assignedShipId);
      return `<article class="card">
        <div class="card-header"><div class="card-title"><span class="round-icon">${captain.isPlayer ? '♛' : '☠'}</span><div><h3>${escapeHtml(captain.name)}</h3><p class="card-subtitle">Level ${captain.level} · ${ship ? `Commands ${escapeHtml(ship.name)}` : 'Unassigned'}</p></div></div><span class="tag green">${captain.loyalty}% loyalty</span></div>
        <div class="tag-row">${captain.traits.map(id => `<span class="tag gold">${D.captainTraits[id].icon} ${D.captainTraits[id].name}</span>`).join('')}</div>
        <div class="meter"><div class="meter-head"><span>Experience</span><strong>${captain.xp} / ${captain.level * 90}</strong></div><div class="progress"><span style="width:${clamp(captain.xp / (captain.level * 90) * 100,0,100)}%"></span></div></div>
        <div class="card-actions"><button class="ghost-button" data-action="assign-captain" data-captain-id="${captain.id}">Assign</button></div>
      </article>`;
    }).join('');
  }

  function renderFleetFormations() {
    if (!state.fleets.length) return `<div class="empty-state"><span>⛵</span><h3>No formal fleets</h3><p>Group ships under a flagship to send them on major missions together.</p><button class="primary-button" data-action="open-create-fleet">Form a Fleet</button></div>`;
    return state.fleets.map(fleet => {
      const flagship = getShip(fleet.flagshipId);
      return `<article class="card">
        <div class="card-header"><div class="card-title"><span class="round-icon">⚑</span><div><h3>${escapeHtml(fleet.name)}</h3><p class="card-subtitle">Flagship: ${escapeHtml(flagship?.name || 'Unknown')}</p></div></div><strong>${formatNumber(getFleetPower(fleet))} power</strong></div>
        <div class="tag-row">${fleet.shipIds.map(id => `<span class="tag">${escapeHtml(getShip(id)?.name || 'Missing ship')}</span>`).join('')}</div>
        <div class="form-row" style="margin-top:12px"><label>Formation</label><select data-action="fleet-formation" data-fleet-id="${fleet.id}"><option value="line" ${fleet.formation === 'line' ? 'selected' : ''}>Line Ahead</option><option value="wedge" ${fleet.formation === 'wedge' ? 'selected' : ''}>Wedge</option><option value="screen" ${fleet.formation === 'screen' ? 'selected' : ''}>Protective Screen</option><option value="wolfpack" ${fleet.formation === 'wolfpack' ? 'selected' : ''}>Wolf Pack</option></select></div>
        <div class="card-actions"><button class="danger-button" data-action="disband-fleet" data-fleet-id="${fleet.id}">Disband</button></div>
      </article>`;
    }).join('');
  }

  function renderPort() {
    const port = getPort(state.currentPortId) || D.ports[0];
    generateMarket(port.id);
    $('#portBanner').innerHTML = `
      <p class="eyebrow">${escapeHtml(port.faction)} territory</p>
      <h3>${escapeHtml(port.name)}</h3>
      <p>${escapeHtml(port.description)}</p>
      <div class="port-stats"><span class="tag gold">${escapeHtml(port.speciality)}</span><span class="tag ${port.risk === 'Low' ? 'green' : 'red'}">${escapeHtml(port.risk)} waters</span><span class="tag">${getDockedShips(port.id).length} ships docked</span></div>`;
    $$('[data-port-tab]').forEach(button => button.classList.toggle('active', button.dataset.portTab === state.portTab));
    const content = $('#portContent');
    if (state.portTab === 'market') content.innerHTML = systemUnlock('market') ? renderMarket() : lockedPanel('market');
    else if (state.portTab === 'shipyard') content.innerHTML = systemUnlock('shipyard') ? renderShipyard() : lockedPanel('shipyard');
    else if (state.portTab === 'tavern') content.innerHTML = systemUnlock('crew') ? renderTavern() : lockedPanel('crew');
    else if (state.portTab === 'upgrades') content.innerHTML = systemUnlock('hideout') ? renderHideout() : lockedPanel('hideout');
    else content.innerHTML = systemUnlock('shipyard') ? renderWorkshop() : lockedPanel('shipyard');
    content.classList.toggle('cards-grid', ['shipyard', 'tavern', 'upgrades', 'workshop'].includes(state.portTab));
  }

  function dockedShipSelector() {
    const docked = getDockedShips();
    if (!docked.length) return `<div class="empty-state"><span>🌊</span><h3>No ships in port</h3><p>Wait for a vessel to return before trading or refitting.</p></div>`;
    if (!docked.some(ship => ship.id === state.marketShipId)) state.marketShipId = docked[0].id;
    return `<div class="card"><div class="form-row" style="margin:0"><label>Trading vessel</label><select data-action="select-market-ship">${docked.map(ship => `<option value="${ship.id}" ${ship.id === state.marketShipId ? 'selected' : ''}>${escapeHtml(ship.name)} · ${Math.floor(getShipStat(ship,'cargo') - getCargoUsed(ship))} cargo free</option>`).join('')}</select></div></div>`;
  }

  function renderMarket() {
    const market = state.markets[state.currentPortId];
    const ship = getShip(state.marketShipId) || getDockedShips()[0];
    return `${dockedShipSelector()}<div class="card"><div class="panel-heading"><div><p class="eyebrow">Live prices</p><h3>${escapeHtml(getPort(state.currentPortId).name)} Exchange</h3></div><span class="tag">Refreshes in ${formatTime(Math.max(0, 600 - (now() - market.updatedAt) / 1000))}</span></div>
      <div class="content-stack">${Object.entries(D.goods).map(([goodId, good]) => {
        const price = market.prices[goodId];
        const aboard = ship?.cargo?.[goodId] || 0;
        const trend = price.trend === 'up' ? '↗' : price.trend === 'down' ? '↘' : '→';
        return `<div class="market-row">
          <div><div class="market-good"><span class="good-icon">${good.icon}</span><div><strong>${escapeHtml(good.name)}</strong><p class="card-subtitle">Aboard: ${aboard} · Weight: ${good.weight}${good.legal ? '' : ' · Contraband'}</p></div></div>
          <div class="quantity-control"><button data-action="trade-step" data-good-id="${goodId}" data-delta="-1">−</button><input id="qty-${goodId}" type="number" min="1" value="1" inputmode="numeric"><button data-action="trade-step" data-good-id="${goodId}" data-delta="1">+</button></div></div>
          <div><div class="market-prices"><span>Buy</span><strong>${trend} ${price.buy}g</strong><span>Sell</span><strong>${price.sell}g</strong></div><div class="card-actions" style="margin-top:7px"><button class="ghost-button" data-action="sell-good" data-good-id="${goodId}" ${aboard ? '' : 'disabled'}>Sell</button><button class="primary-button" data-action="buy-good" data-good-id="${goodId}" ${ship ? '' : 'disabled'}>Buy</button></div></div>
        </div>`;
      }).join('')}</div>
    </div>`;
  }

  function renderShipyard() {
    const maxShips = 2 + (state.base.dock || 0) * 2;
    return `<div class="card"><div class="panel-heading"><div><p class="eyebrow">Berths</p><h3>${state.ships.length} / ${maxShips} ships owned</h3></div><span class="tag gold">Shipyard level ${state.base.shipyard}</span></div><p class="card-subtitle">Larger vessels need more crew, supplies and upkeep, but can tackle dangerous contracts and carry greater prizes.</p></div>
      ${Object.values(D.shipTypes).filter(type => type.id !== 'dinghy').map(type => {
        const unlocked = state.resources.renown >= type.unlockRenown;
        const cost = Math.round(type.cost * (1 - (state.base.shipyard || 0) * .04));
        return `<article class="card ${unlocked ? '' : 'locked-panel'}">
          ${unlocked ? `<div class="card-header"><div class="card-title"><span class="ship-avatar">${type.icon}</span><div><h3>${escapeHtml(type.name)}</h3><p class="card-subtitle">${escapeHtml(type.class)} vessel</p></div></div><strong>${formatNumber(cost)}g</strong></div>
          <p class="card-subtitle" style="margin-top:10px">${escapeHtml(type.description)}</p>
          <div class="stat-grid"><div class="stat"><label>Hull</label><strong>${type.hull}</strong></div><div class="stat"><label>Firepower</label><strong>${type.firepower}</strong></div><div class="stat"><label>Speed</label><strong>${type.speed}</strong></div><div class="stat"><label>Cargo</label><strong>${type.cargo}</strong></div></div>
          <div class="card-actions"><button class="primary-button" data-action="buy-ship" data-type-id="${type.id}" ${state.ships.length >= maxShips || state.resources.gold < cost ? 'disabled' : ''}>Purchase</button></div>` : `<h3>${escapeHtml(type.name)}</h3><p>Earn ${formatNumber(type.unlockRenown)} renown to unlock this vessel.</p>`}
        </article>`;
      }).join('')}`;
  }

  function renderTavern() {
    generateCaptains();
    const crewHtml = Object.entries(D.crewRoles).map(([roleId, role]) => `<article class="card">
      <div class="card-header"><div class="card-title"><span class="round-icon">${role.icon}</span><div><h3>${role.name}</h3><p class="card-subtitle">${escapeHtml(role.description)}</p></div></div><strong>${role.cost}g</strong></div>
      <div class="card-actions"><button class="primary-button" data-action="open-recruit" data-role-id="${roleId}">Recruit</button></div>
    </article>`).join('');
    const captainHtml = systemUnlock('captains') ? state.availableCaptains.map(captain => `<article class="card">
      <div class="card-header"><div class="card-title"><span class="round-icon">☠</span><div><h3>${escapeHtml(captain.name)}</h3><p class="card-subtitle">Level ${captain.level} captain</p></div></div><strong>${captain.cost}g</strong></div>
      <div class="tag-row">${captain.traits.map(id => `<span class="tag gold">${D.captainTraits[id].icon} ${D.captainTraits[id].name}</span>`).join('')}</div>
      <p class="card-subtitle" style="margin-top:10px">${captain.traits.map(id => D.captainTraits[id].description).join(' ')}</p>
      <div class="card-actions"><button class="primary-button" data-action="hire-captain" data-captain-id="${captain.id}" ${state.resources.gold < captain.cost ? 'disabled' : ''}>Hire Captain</button></div>
    </article>`).join('') : lockedPanel('captains');
    return `<div class="card" style="grid-column:1/-1"><p class="eyebrow">Recruitment</p><h3>The Crooked Lantern</h3><p class="card-subtitle">Recruit specialists for docked ships or hire independent captains. Tavern upgrades improve the quality and variety of visitors.</p></div>${crewHtml}<div class="card" style="grid-column:1/-1"><p class="eyebrow">Captains seeking a flag</p><h3>Available Officers</h3></div>${captainHtml}`;
  }

  function renderHideout() {
    return `<div class="card" style="grid-column:1/-1"><div class="panel-heading"><div><p class="eyebrow">Driftwood Cay</p><h3>Your Hidden Haven</h3></div><span class="tag gold">${Object.values(state.base).reduce((a,b)=>a+b,0)} total levels</span></div><p class="card-subtitle">Permanent infrastructure expands your organisation, creates passive benefits and unlocks the late-game pirate council.</p></div>
      ${Object.entries(D.baseUpgrades).map(([id, upgrade]) => {
        const level = state.base[id] || 0;
        const unlocked = state.resources.renown >= upgrade.unlockRenown;
        const goldCost = Math.round(upgrade.baseCost * Math.pow(1.75, level));
        const resourceCost = Math.round(upgrade.resourceCost * Math.pow(1.45, level));
        return `<article class="card ${unlocked ? '' : 'locked-panel'}">
          ${unlocked ? `<div class="card-header"><div class="card-title"><span class="round-icon">${upgrade.icon}</span><div><h3>${escapeHtml(upgrade.name)}</h3><p class="card-subtitle">Level ${level} / ${upgrade.max}</p></div></div></div><p class="card-subtitle" style="margin-top:10px">${escapeHtml(upgrade.description)}</p><div class="tag-row"><span class="tag gold">${formatNumber(goldCost)} gold</span>${upgrade.resource !== 'gold' ? `<span class="tag">${resourceCost} ${D.resources[upgrade.resource]?.name || upgrade.resource}</span>` : ''}</div><div class="card-actions"><button class="primary-button" data-action="upgrade-base" data-upgrade-id="${id}" ${level >= upgrade.max ? 'disabled' : ''}>${level >= upgrade.max ? 'Maximum Level' : 'Build Upgrade'}</button></div>` : `<h3>${escapeHtml(upgrade.name)}</h3><p>Unlocks at ${formatNumber(upgrade.unlockRenown)} renown.</p>`}
        </article>`;
      }).join('')}`;
  }

  function renderWorkshop() {
    const docked = getDockedShips();
    if (!docked.length) return `<div class="empty-state"><span>🛠</span><h3>No vessel to refit</h3><p>Bring a ship into ${escapeHtml(getPort(state.currentPortId).name)}.</p></div>`;
    const selected = getShip(state.selectedShipId) && docked.some(s => s.id === state.selectedShipId) ? getShip(state.selectedShipId) : docked[0];
    state.selectedShipId = selected.id;
    return `<div class="card" style="grid-column:1/-1"><div class="form-row" style="margin:0"><label>Vessel to refit</label><select data-action="select-workshop-ship">${docked.map(ship => `<option value="${ship.id}" ${ship.id === selected.id ? 'selected' : ''}>${escapeHtml(ship.name)} · Level ${ship.level}</option>`).join('')}</select></div></div>
      ${Object.entries(D.shipUpgrades).map(([id, upgrade]) => {
        const level = selected.upgrades[id] || 0;
        const cost = Math.round(upgrade.baseCost * Math.pow(1.65, level) * (1 - (state.base.shipyard || 0) * .04));
        const resourceCost = Math.round(upgrade.resourceCost * Math.pow(1.35, level));
        return `<article class="card"><div class="card-header"><div class="card-title"><span class="round-icon">${upgrade.icon}</span><div><h3>${escapeHtml(upgrade.name)}</h3><p class="card-subtitle">Level ${level} / ${upgrade.max}</p></div></div></div><p class="card-subtitle" style="margin-top:10px">${escapeHtml(upgrade.description)}</p><div class="tag-row"><span class="tag gold">${cost} gold</span><span class="tag">${resourceCost} ${D.resources[upgrade.resource]?.name || upgrade.resource}</span></div><div class="card-actions"><button class="primary-button" data-action="upgrade-ship" data-ship-id="${selected.id}" data-upgrade-id="${id}" ${level >= upgrade.max ? 'disabled' : ''}>${level >= upgrade.max ? 'Maximum' : 'Install'}</button></div></article>`;
      }).join('')}`;
  }

  function renderMissions() {
    refreshMissionBoard();
    $$('[data-mission-tab]').forEach(button => button.classList.toggle('active', button.dataset.missionTab === state.missionTab));
    const content = $('#missionContent');
    if (state.missionTab === 'available') content.innerHTML = renderAvailableMissions();
    else if (state.missionTab === 'active') content.innerHTML = renderActiveMissions();
    else if (state.missionTab === 'story') content.innerHTML = renderStoryMissions();
    else if (state.missionTab === 'bounties') content.innerHTML = systemUnlock('bounties') ? renderBounties() : lockedPanel('bounties');
    else content.innerHTML = systemUnlock('expeditions') ? renderExpeditions() : lockedPanel('expeditions');
    content.classList.toggle('cards-grid', ['available', 'active', 'bounties', 'expeditions'].includes(state.missionTab));
  }

  function missionCard(mission) {
    const availablePower = state.ships.filter(canAssignShip).reduce((sum, ship) => sum + getShipPower(ship), 0);
    const expires = Math.max(0, (mission.expiresAt - now()) / 1000);
    return `<article class="card mission-card" data-difficulty="${mission.difficulty}">
      <div class="card-header"><div class="card-title"><span class="round-icon">${mission.icon}</span><div><h3>${escapeHtml(mission.title)}</h3><p class="card-subtitle">${escapeHtml(getPort(mission.originId)?.name || 'Open Sea')} → ${escapeHtml(getPort(mission.destinationId)?.name || 'Open Sea')}</p></div></div><span class="tag ${mission.difficulty === 'dangerous' || mission.difficulty === 'epic' ? 'red' : 'green'}">${titleCase(mission.difficulty)}</span></div>
      <p class="card-subtitle" style="margin-top:10px;line-height:1.5">${escapeHtml(mission.description)}</p>
      <div class="tag-row"><span class="tag">⏱ ${formatTime(mission.duration)}</span><span class="tag ${availablePower >= mission.minPower ? 'green' : 'red'}">⚔ ${mission.minPower} recommended power</span>${mission.activeCombat ? '<span class="tag red">Active battle</span>' : ''}${mission.fleetRecommended ? '<span class="tag gold">Fleet recommended</span>' : ''}</div>
      <div class="reward-row">${resourceTags(mission.rewards)}</div>
      <div class="card-actions"><button class="primary-button" data-action="assign-mission" data-mission-id="${mission.id}">Assign Voyage</button></div>
      <p class="requirement">Opportunity expires in ${formatTime(expires)}</p>
    </article>`;
  }

  function renderAvailableMissions() {
    const valid = state.availableMissions.filter(m => m.expiresAt > now());
    if (!valid.length) return `<div class="empty-state"><span>📜</span><h3>No current opportunities</h3><p>Refresh the board or wait for new rumours to reach port.</p></div>`;
    return valid.map(missionCard).join('');
  }

  function renderActiveMissions() {
    const missions = state.activeMissions.filter(m => !m.claimed).sort((a,b) => b.startTime - a.startTime);
    if (!missions.length) return `<div class="empty-state"><span>⌛</span><h3>No voyages underway</h3><p>Assign ships from the Available tab and watch them move on the live map.</p></div>`;
    return missions.map(active => {
      const progress = clamp((now() - active.startTime) / Math.max(1, active.endTime - active.startTime) * 100, 0, 100);
      const remaining = Math.max(0, (active.endTime - now()) / 1000);
      const shipNames = active.shipIds.map(id => getShip(id)?.name).filter(Boolean).join(', ');
      const statusLabel = active.status === 'underway' ? formatTime(remaining) : active.status === 'battleReady' ? 'Enemy sighted' : active.status === 'complete' ? 'Success' : 'Failed';
      return `<article class="card mission-card" data-difficulty="${active.mission.difficulty}">
        <div class="card-header"><div class="card-title"><span class="round-icon">${active.mission.icon}</span><div><h3>${escapeHtml(active.mission.title)}</h3><p class="card-subtitle">${escapeHtml(shipNames)}</p></div></div><strong class="countdown">${statusLabel}</strong></div>
        ${active.status === 'underway' ? `<div class="progress" style="margin-top:12px;height:9px"><span style="width:${progress}%"></span></div><p class="card-subtitle">The fleet is ${progress < 50 ? 'sailing towards the objective' : 'returning with its findings'}.</p>` : ''}
        ${active.status === 'battleReady' ? `<p class="card-subtitle" style="margin-top:12px">Your captains have held position and are waiting for direct orders. If left unattended, standing orders will resolve the engagement automatically.</p><div class="card-actions"><button class="primary-button" data-action="start-combat" data-active-id="${active.id}">Command Battle</button></div>` : ''}
        ${['complete','failed'].includes(active.status) ? `<p class="card-subtitle" style="margin-top:12px">${escapeHtml(active.result?.reason || '')}</p>${(active.result?.damageReports || []).map(r => `<p class="requirement damaged">${escapeHtml(r)}</p>`).join('')}<div class="reward-row">${resourceTags(active.rewards)}</div><div class="card-actions"><button class="primary-button" data-action="claim-mission" data-active-id="${active.id}">Collect Report</button></div>` : ''}
      </article>`;
    }).join('');
  }

  function renderStoryMissions() {
    return `<div class="timeline">${D.storyChapters.map(chapter => {
      const unlocked = state.resources.renown >= chapter.unlockRenown || chapter.id === 1;
      const progress = getStoryProgress(chapter);
      const complete = progress >= chapter.target;
      const claimed = state.storyClaimed.includes(chapter.id);
      return `<div class="timeline-item ${unlocked ? '' : 'locked'}"><span class="timeline-dot"></span><div class="card"><div class="card-header"><div><p class="eyebrow">Chapter ${chapter.id}</p><h3>${unlocked ? escapeHtml(chapter.title) : 'Unwritten Waters'}</h3></div>${claimed ? '<span class="tag green">Completed</span>' : unlocked ? `<span class="tag">${Math.min(progress,chapter.target)} / ${chapter.target}</span>` : `<span class="tag">${chapter.unlockRenown} renown</span>`}</div>${unlocked ? `<p class="card-subtitle" style="margin-top:9px">${escapeHtml(chapter.description)}</p><p class="tag-row"><span class="tag gold">Objective: ${escapeHtml(chapter.objective)}</span></p><div class="progress"><span style="width:${clamp(progress/chapter.target*100,0,100)}%"></span></div><div class="reward-row">${resourceTags(chapter.reward)}</div>${!claimed ? `<div class="card-actions"><button class="primary-button" data-action="claim-story" data-chapter-id="${chapter.id}" ${complete ? '' : 'disabled'}>${complete ? 'Complete Chapter' : 'In Progress'}</button></div>` : ''}` : '<p>Continue building your renown to reveal this chapter.</p>'}</div></div>`;
    }).join('')}</div>`;
  }

  function renderBounties() {
    generateBounties();
    return state.bounties.filter(b => !b.defeated && b.expiresAt > now()).map(bounty => {
      const base = D.missionTemplates.find(t => t.id === 'hunt-raider');
      const mission = bounty.mission || makeMission(base, { title: `Bounty: ${bounty.name}`, destinationId: bounty.locationId, special: { bountyId: bounty.id } });
      mission.id = bounty.id;
      mission.minPower = bounty.power;
      mission.rewards = { gold: [bounty.reward, Math.round(bounty.reward * 1.18)], renown: [bounty.renown, Math.round(bounty.renown * 1.15)], influence: [2, 5] };
      bounty.mission = mission;
      return missionCard(mission);
    }).join('');
  }

  function renderExpeditions() {
    const templates = D.missionTemplates.filter(t => t.category === 'expedition' || (t.difficulty === 'epic' && t.unlockRenown <= state.resources.renown));
    if (!templates.length) return `<div class="empty-state"><span>🔱</span><h3>No viable expedition</h3><p>Build more renown and fleet power to reach forbidden waters.</p></div>`;
    return templates.slice(-3).map(template => missionCard(makeMission(template, { special: { expedition: true } }))).join('');
  }

  function renderCaptain() {
    const rank = getRank();
    const next = getNextRank();
    const rankProgress = next ? clamp((state.resources.renown - rank.renown) / Math.max(1, next.renown - rank.renown) * 100, 0, 100) : 100;
    const today = getTodayKey();
    const dailyReady = state.daily.lastClaim !== today;
    const achieved = state.achievements.length;
    const inventoryItems = Object.entries(state.resources).filter(([key, value]) => !['gold','renown'].includes(key) && value > 0);
    $('#captainContent').innerHTML = `
      <section class="panel profile-hero">
        <div class="profile-skull">☠</div>
        <p class="eyebrow">${escapeHtml(rank.name)}</p>
        <h2>${escapeHtml(state.playerName)}</h2>
        <p>Commander of ${state.ships.length} ship${state.ships.length === 1 ? '' : 's'} and ${state.ships.reduce((sum,s)=>sum+getCrewCount(s),0)} souls.</p>
        <div class="meter"><div class="meter-head"><span>${escapeHtml(rank.name)}</span><strong>${next ? `${formatNumber(state.resources.renown)} / ${formatNumber(next.renown)}` : 'Maximum rank'}</strong></div><div class="progress"><span style="width:${rankProgress}%"></span></div></div>
        <div class="card-actions"><button class="ghost-button" data-action="rename-captain">Rename</button><button class="primary-button" data-action="claim-daily" ${dailyReady ? '' : 'disabled'}>${dailyReady ? `Claim Day ${state.daily.streak + 1} Share` : 'Share Claimed Today'}</button></div>
      </section>

      <section class="card"><div class="panel-heading"><div><p class="eyebrow">Current objective</p><h3>Captain's Chronicle</h3></div><button class="text-button" data-action="open-story-tab">View chapters</button></div>${renderCurrentObjective()}</section>

      <section class="card"><div class="panel-heading"><div><p class="eyebrow">Stores</p><h3>Resources & Spoils</h3></div><span class="tag">Warehouse level ${state.base.warehouse}</span></div><div class="tag-row">${inventoryItems.length ? inventoryItems.map(([key,value]) => { const item=D.resources[key]||D.goods[key]||{name:titleCase(key),icon:'•'}; return `<span class="tag gold">${item.icon || ''} ${formatNumber(value)} ${escapeHtml(item.name)}</span>`; }).join('') : '<span class="tag">The stores are nearly empty.</span>'}</div></section>

      <section class="card"><div class="panel-heading"><div><p class="eyebrow">Milestones</p><h3>Achievements ${achieved}/${D.achievements.length}</h3></div></div><div class="achievement-grid">${D.achievements.map(achievement => {
        const unlocked = state.achievements.includes(achievement.id);
        return `<div class="achievement ${unlocked ? '' : 'locked'}"><span>${achievement.icon}</span><strong>${escapeHtml(achievement.name)}</strong><p>${escapeHtml(achievement.description)}</p></div>`;
      }).join('')}</div></section>

      <section class="card"><div class="panel-heading"><div><p class="eyebrow">Growth</p><h3>System Unlocks</h3></div></div><div class="timeline">${D.unlocks.map(unlock => {
        const unlocked = systemUnlock(unlock.id);
        return `<div class="timeline-item ${unlocked ? '' : 'locked'}"><span class="timeline-dot"></span><strong>${escapeHtml(unlock.name)}</strong><p>${escapeHtml(unlock.description)} ${unlocked ? 'Unlocked.' : `Requires ${formatNumber(unlock.renown)} renown.`}</p></div>`;
      }).join('')}</div></section>

      <section class="card"><div class="panel-heading"><div><p class="eyebrow">Career</p><h3>Captain's Record</h3></div></div><div class="stat-grid">
        <div class="stat"><label>Missions</label><strong>${state.stats.missionsCompleted}</strong></div>
        <div class="stat"><label>Battle wins</label><strong>${state.stats.combatWins}</strong></div>
        <div class="stat"><label>Gold earned</label><strong>${formatNumber(state.stats.goldEarned)}</strong></div>
        <div class="stat"><label>Distance sailed</label><strong>${formatNumber(state.stats.distanceSailed)} nm</strong></div>
        <div class="stat"><label>Trade revenue</label><strong>${formatNumber(state.stats.tradeProfit)}</strong></div>
        <div class="stat"><label>Ships captured</label><strong>${state.stats.shipsCaptured}</strong></div>
      </div></section>

      ${systemUnlock('policies') ? renderPolicies() : ''}
      ${systemUnlock('legacy') ? `<section class="card"><div class="panel-heading"><div><p class="eyebrow">Endgame</p><h3>Begin a Legacy Voyage</h3></div><span class="tag gold">${state.resources.legacy} marks held</span></div><p class="card-subtitle">Retire this legend and begin again with permanent renown gains, starting wealth and preserved achievements. Current progress will reset.</p><div class="card-actions"><button class="danger-button" data-action="open-legacy">Begin New Legend</button></div></section>` : ''}
    `;
  }

  function renderCurrentObjective() {
    const chapter = D.storyChapters.find(c => !state.storyClaimed.includes(c.id) && (state.resources.renown >= c.unlockRenown || c.id === 1));
    if (!chapter) return `<div class="empty-state"><span>♛</span><h3>Your legend is your own</h3><p>All current Chronicle chapters are complete.</p></div>`;
    const progress = getStoryProgress(chapter);
    return `<h3>${escapeHtml(chapter.title)}</h3><p class="card-subtitle">${escapeHtml(chapter.description)}</p><div class="tag-row"><span class="tag gold">${escapeHtml(chapter.objective)}</span><span class="tag">${Math.min(progress,chapter.target)} / ${chapter.target}</span></div><div class="progress"><span style="width:${clamp(progress/chapter.target*100,0,100)}%"></span></div>`;
  }

  function renderPolicies() {
    return `<section class="card"><div class="panel-heading"><div><p class="eyebrow">Standing orders</p><h3>Fleet Policies</h3></div></div><p class="card-subtitle">These orders guide captains when events occur while you are away.</p>
      <div class="form-row"><label>Risk tolerance</label><select data-action="set-policy" data-policy="risk"><option value="cautious" ${state.policies.risk==='cautious'?'selected':''}>Cautious — avoid heavy damage</option><option value="balanced" ${state.policies.risk==='balanced'?'selected':''}>Balanced — use captain judgement</option><option value="bold" ${state.policies.risk==='bold'?'selected':''}>Bold — favour prizes and combat</option></select></div>
      <div class="form-row"><label>Profit sharing</label><select data-action="set-policy" data-policy="profitShare"><option value="lean" ${state.policies.profitShare==='lean'?'selected':''}>Lean shares — more gold, less morale</option><option value="fair" ${state.policies.profitShare==='fair'?'selected':''}>Fair shares — balanced</option><option value="generous" ${state.policies.profitShare==='generous'?'selected':''}>Generous shares — stronger morale</option></select></div>
      <div class="form-row"><label>Unattended combat</label><select data-action="set-policy" data-policy="combat"><option value="avoid" ${state.policies.combat==='avoid'?'selected':''}>Avoid unless cornered</option><option value="engage" ${state.policies.combat==='engage'?'selected':''}>Engage suitable targets</option><option value="capture" ${state.policies.combat==='capture'?'selected':''}>Prioritise capture</option></select></div>
    </section>`;
  }

  function openShipModal(shipId) {
    const ship = getShip(shipId);
    if (!ship) return;
    state.selectedShipId = ship.id;
    const type = getShipType(ship);
    const captain = getCaptain(ship.captainId);
    const cargo = Object.entries(ship.cargo || {});
    openModal(ship.name, `
      <div class="card-header"><div class="card-title"><div class="ship-avatar">${type.icon}<span class="level-badge">${ship.level}</span></div><div><h3>${escapeHtml(type.name)}</h3><p class="card-subtitle">${escapeHtml(type.description)}</p></div></div><span class="tag">${escapeHtml(ship.status)}</span></div>
      ${statMeter('Hull', ship.hull, getShipMaxHull(ship), ship.hull < getShipMaxHull(ship)*.35 ? 'danger' : 'good')}
      ${statMeter('Morale', ship.morale, 100)}
      <div class="stat-grid"><div class="stat"><label>Power</label><strong>${getShipPower(ship)}</strong></div><div class="stat"><label>Firepower</label><strong>${Math.round(getShipStat(ship,'firepower'))}</strong></div><div class="stat"><label>Speed</label><strong>${getShipStat(ship,'speed').toFixed(1)}</strong></div><div class="stat"><label>Boarding</label><strong>${Math.round(getShipStat(ship,'boarding'))}</strong></div><div class="stat"><label>Crew</label><strong>${getCrewCount(ship)} / ${type.crew}</strong></div><div class="stat"><label>Cargo</label><strong>${Math.round(getCargoUsed(ship))} / ${Math.round(getShipStat(ship,'cargo'))}</strong></div></div>
      <div class="card" style="margin-top:12px"><p class="eyebrow">Captain</p><h3>${captain ? escapeHtml(captain.name) : 'No captain assigned'}</h3><p class="card-subtitle">${captain ? captain.traits.map(id => `${D.captainTraits[id].icon} ${D.captainTraits[id].name}`).join(' · ') : 'Assign a captain before taking this ship to sea.'}</p></div>
      <div class="card" style="margin-top:12px"><p class="eyebrow">Crew</p><div class="tag-row">${Object.entries(ship.crew).map(([id,amount]) => `<span class="tag">${D.crewRoles[id]?.icon || ''} ${amount} ${D.crewRoles[id]?.name || id}</span>`).join('')}</div></div>
      <div class="card" style="margin-top:12px"><p class="eyebrow">Cargo</p><div class="cargo-grid">${cargo.length ? cargo.map(([id,amount]) => `<div class="cargo-item">${D.goods[id]?.icon || '📦'}<strong>${amount}</strong>${escapeHtml(D.goods[id]?.name || id)}</div>`).join('') : '<span class="card-subtitle">The hold is empty.</span>'}</div></div>
      <div class="card-actions"><button class="ghost-button" data-action="rename-ship" data-ship-id="${ship.id}">Rename</button><button class="ghost-button" data-action="assign-captain" data-ship-id="${ship.id}">Assign Captain</button><button class="primary-button" data-action="go-workshop" data-ship-id="${ship.id}" ${ship.activeMissionId ? 'disabled' : ''}>Refit</button></div>
    `, { eyebrow: `${type.class} vessel` });
  }

  function openPortLocation(portId) {
    const port = getPort(portId);
    if (!port || !state.unlockedPorts.includes(portId)) return;
    const docked = getDockedShips(portId);
    openModal(port.name, `<p>${escapeHtml(port.description)}</p><div class="tag-row"><span class="tag gold">${escapeHtml(port.faction)}</span><span class="tag">Speciality: ${escapeHtml(port.speciality)}</span><span class="tag ${port.risk==='Low'?'green':'red'}">${escapeHtml(port.risk)} risk</span></div><div class="card" style="margin-top:14px"><h3>${docked.length} ships currently docked</h3><p class="card-subtitle">${docked.map(s=>escapeHtml(s.name)).join(', ') || 'No ships are presently in harbour.'}</p></div><div class="card-actions"><button class="primary-button" data-action="visit-port" data-port-id="${port.id}">Open Port</button></div>`, { eyebrow: 'Charted harbour' });
  }

  function openWorldEvent(eventId) {
    const event = state.worldEvents.find(item => item.id === eventId);
    if (!event) return;
    const templates = {
      wreck: D.missionTemplates.find(t => t.id === 'shoreline-salvage'),
      merchant: D.missionTemplates.find(t => t.id === 'merchant-raid') || D.missionTemplates.find(t => t.id === 'merchant-scout'),
      storm: D.missionTemplates.find(t => t.id === 'storm-salvage'),
      distress: D.missionTemplates.find(t => t.id === 'escort-sloop'),
      rumour: D.missionTemplates.find(t => t.id === 'charted-treasure')
    };
    const template = templates[event.type];
    const canUse = template && state.resources.renown >= template.unlockRenown;
    openModal(event.title, `<div style="text-align:center;font-size:56px">${event.icon}</div><p>${escapeHtml(event.description)}</p><p class="card-subtitle">This sighting will disappear in ${formatTime((event.expiresAt-now())/1000)}.</p><div class="card-actions"><button class="primary-button" data-action="investigate-event" data-event-id="${event.id}" ${canUse ? '' : 'disabled'}>${canUse ? 'Add Mission to Board' : `Requires ${template?.unlockRenown || 0} renown`}</button></div>`, { eyebrow: 'Live map event' });
  }

  function openAssignMission(missionId) {
    const mission = getAvailableMission(missionId)
      || state.bounties.find(b => b.id === missionId)?.mission
      || (state.expeditionMissions || []).find(m => m.id === missionId);
    if (!mission) return;
    const availableShips = state.ships.filter(canAssignShip);
    const availableFleets = state.fleets.filter(fleet => fleet.shipIds.every(id => canAssignShip(getShip(id))));
    const options = [
      ...availableShips.map(ship => ({ id: ship.id, type: 'ship', name: ship.name, shipIds: [ship.id], power: getShipPower(ship), detail: `${getShipType(ship).name} · ${Math.round(ship.supplies)} supplies` })),
      ...availableFleets.map(fleet => ({ id: fleet.id, type: 'fleet', name: fleet.name, shipIds: fleet.shipIds, power: getFleetPower(fleet), detail: `${fleet.shipIds.length} ships · ${fleet.formation}` }))
    ];
    openModal(`Assign: ${mission.title}`, `
      <p>${escapeHtml(mission.description)}</p>
      <div class="tag-row"><span class="tag">⏱ Base time ${formatTime(mission.duration)}</span><span class="tag ${mission.minPower ? 'gold' : ''}">⚔ ${mission.minPower} recommended power</span></div>
      <div class="content-stack" style="margin-top:14px">${options.length ? options.map(option => {
        const duration = getMissionTravelDuration(mission, option.shipIds);
        const supplyCost = getMissionSuppliesCost(duration, option.shipIds);
        const capable = option.shipIds.every(id => getShip(id)?.captainId) && option.shipIds.every(id => getShip(id)?.supplies >= supplyCost);
        const powerClass = option.power >= mission.minPower ? 'green' : 'red';
        return `<label class="card" style="display:block"><div class="card-header"><div class="card-title"><input type="radio" name="mission-assignee" value="${option.type}:${option.id}" ${capable ? '' : 'disabled'}><div><h3>${escapeHtml(option.name)}</h3><p class="card-subtitle">${escapeHtml(option.detail)}</p></div></div><span class="tag ${powerClass}">${option.power} power</span></div><div class="tag-row"><span class="tag">${formatTime(duration)} voyage</span><span class="tag">${supplyCost} supplies each</span>${!capable ? '<span class="tag red">Captain or supplies missing</span>' : ''}</div></label>`;
      }).join('') : '<div class="empty-state"><span>⚓</span><h3>No ship is ready</h3><p>Repair, resupply and assign captains before sailing.</p></div>'}</div>
      <div class="card-actions"><button class="primary-button" data-action="confirm-assign-mission" data-mission-id="${mission.id}" ${options.length ? '' : 'disabled'}>Give Orders</button></div>
    `, { eyebrow: 'Voyage orders' });
  }

  function openRecruitModal(roleId) {
    const role = D.crewRoles[roleId];
    const ships = getDockedShips();
    if (!role) return;
    openModal(`Recruit ${role.name}`, `<p>${escapeHtml(role.description)}</p><div class="form-row"><label>Assign to ship</label><select id="recruitShip">${ships.map(ship => `<option value="${ship.id}">${escapeHtml(ship.name)} · ${getCrewCount(ship)}/${getShipType(ship).crew} crew</option>`).join('')}</select></div><div class="form-row"><label>Number to recruit</label><input id="recruitAmount" type="number" inputmode="numeric" min="1" max="20" value="1"></div><div class="tag-row"><span class="tag gold">${role.cost} gold each before tavern discount</span></div><div class="card-actions"><button class="primary-button" data-action="confirm-recruit" data-role-id="${roleId}" ${ships.length ? '' : 'disabled'}>Recruit</button></div>`, { eyebrow: 'Tavern recruitment' });
  }

  function openAssignCaptainModal(captainId = null, shipId = null) {
    const captains = captainId ? [getCaptain(captainId)].filter(Boolean) : state.captains;
    const ships = shipId ? [getShip(shipId)].filter(Boolean) : state.ships.filter(ship => !ship.activeMissionId);
    openModal('Assign Captain', `<div class="form-row"><label>Captain</label><select id="assignCaptainSelect">${captains.map(c => `<option value="${c.id}">${escapeHtml(c.name)} · Level ${c.level}${c.assignedShipId ? ` · ${escapeHtml(getShip(c.assignedShipId)?.name || '')}` : ''}</option>`).join('')}</select></div><div class="form-row"><label>Ship</label><select id="assignShipSelect">${ships.map(s => `<option value="${s.id}">${escapeHtml(s.name)} · ${escapeHtml(getShipType(s).name)}</option>`).join('')}</select></div><div class="card-actions"><button class="primary-button" data-action="confirm-assign-captain" ${captains.length && ships.length ? '' : 'disabled'}>Confirm Command</button></div>`, { eyebrow: 'Fleet command' });
  }

  function openCreateFleetModal() {
    const eligible = state.ships.filter(ship => !ship.activeMissionId && !ship.fleetId);
    openModal('Form a Fleet', `<div class="form-row"><label>Fleet name</label><input id="fleetName" value="Black Tide Squadron" maxlength="32"></div><div class="form-row"><label>Select ships</label><div class="content-stack">${eligible.map(ship => `<label class="card"><div class="card-header"><div class="card-title"><input type="checkbox" name="fleetShip" value="${ship.id}"><div><strong>${escapeHtml(ship.name)}</strong><p class="card-subtitle">${escapeHtml(getShipType(ship).name)} · ${getShipPower(ship)} power</p></div></div></div></label>`).join('')}</div></div><div class="form-row"><label>Flagship</label><select id="fleetFlagship">${eligible.map(ship => `<option value="${ship.id}">${escapeHtml(ship.name)}</option>`).join('')}</select></div><div class="card-actions"><button class="primary-button" data-action="confirm-create-fleet" ${eligible.length >= 2 ? '' : 'disabled'}>Raise Fleet Pennant</button></div>`, { eyebrow: 'Fleet organisation' });
  }

  function openSettingsModal() {
    openModal('Settings', `
      <div class="form-row"><label>Sound effects</label><select data-action="setting-select" data-setting="sound"><option value="true" ${state.settings.sound ? 'selected' : ''}>On</option><option value="false" ${!state.settings.sound ? 'selected' : ''}>Off</option></select></div>
      <div class="form-row"><label>Vibration</label><select data-action="setting-select" data-setting="vibration"><option value="true" ${state.settings.vibration ? 'selected' : ''}>On</option><option value="false" ${!state.settings.vibration ? 'selected' : ''}>Off</option></select></div>
      <div class="form-row"><label>Reduced motion</label><select data-action="setting-select" data-setting="reducedMotion"><option value="false" ${!state.settings.reducedMotion ? 'selected' : ''}>Off</option><option value="true" ${state.settings.reducedMotion ? 'selected' : ''}>On</option></select></div>
      <div class="card-actions"><button class="ghost-button" data-action="save-now">Save Now</button><button class="ghost-button" data-action="export-save">Export Save</button><button class="ghost-button" data-action="open-import">Import Save</button></div>
      <div class="card" style="margin-top:15px"><h3>Install on a phone</h3><p class="card-subtitle">When served over HTTPS, use the browser's Add to Home Screen option. Tidebound includes a web-app manifest and offline cache.</p></div>
      <div class="card-actions"><button class="danger-button" data-action="open-reset">Reset All Progress</button></div>
    `, { eyebrow: 'Game & save data' });
  }

  function openLogModal() {
    openModal("Captain's Log", `<div class="timeline">${state.log.map(entry => `<div class="timeline-item"><span class="timeline-dot"></span><strong>${new Date(entry.time).toLocaleString()}</strong><p>${escapeHtml(entry.text)}</p></div>`).join('')}</div>`, { eyebrow: 'Recent events' });
  }

  function showOfflineReport(report) {
    if (!report) return;
    $('#offlineRoot').innerHTML = `<div class="modal-backdrop"></div><section class="offline-card"><p class="eyebrow">Welcome back, captain</p><h2>The fleet kept sailing</h2><p class="card-subtitle">You were away for ${formatDurationMs(report.elapsed)}. Offline simulation is capped at 16 hours.</p><div class="offline-list"><div class="offline-item"><span>Missions finished</span><strong>${report.missionsFinished}</strong></div>${report.hideoutGold ? `<div class="offline-item"><span>Hideout income</span><strong>◉ ${report.hideoutGold}</strong></div>` : ''}${Object.entries(report.resourceChanges).filter(([key]) => key !== 'gold').slice(0,6).map(([key,value]) => { const item=D.resources[key]||D.goods[key]||{name:titleCase(key),icon:'•'}; return `<div class="offline-item"><span>${item.icon || ''} ${escapeHtml(item.name)}</span><strong>+${formatNumber(value)}</strong></div>`; }).join('')}</div><button class="primary-button" style="width:100%" data-action="close-offline">Review the Fleet</button></section>`;
  }

  function renderTutorial() {
    const root = $('#tutorialRoot');
    if (state.tutorial.complete || state.tutorial.dismissed) {
      root.innerHTML = '';
      $('.tutorial-highlight')?.remove();
      return;
    }
    const step = D.tutorialSteps[state.tutorial.index];
    if (!step) {
      state.tutorial.complete = true;
      root.innerHTML = '';
      return;
    }
    if (step.targetView && state.currentView !== step.targetView && !['navigate'].includes(step.action)) navigate(step.targetView);
    root.innerHTML = `<div class="tutorial-shade"></div><section class="tutorial-card"><div class="guide"><div class="guide-avatar">☠</div><div><p class="eyebrow">${escapeHtml(step.guide)}</p><h3>${escapeHtml(step.title)}</h3><p>${escapeHtml(step.text)}</p></div></div><div class="card-actions"><button class="text-button" data-action="dismiss-tutorial">Skip guidance</button>${['continue','finish'].includes(step.action) ? `<button class="primary-button" data-action="tutorial-continue">${step.action === 'finish' ? 'Begin My Legend' : 'Continue'}</button>` : ''}</div></section>`;
    window.setTimeout(() => positionTutorialHighlight(step.selector), 60);
  }

  function positionTutorialHighlight(selector) {
    $('.tutorial-highlight')?.remove();
    if (!selector) return;
    const target = $(selector);
    if (!target) return;
    const rect = target.getBoundingClientRect();
    const highlight = document.createElement('div');
    highlight.className = 'tutorial-highlight';
    highlight.style.left = `${Math.max(4, rect.left - 5)}px`;
    highlight.style.top = `${Math.max(4, rect.top - 5)}px`;
    highlight.style.width = `${Math.min(window.innerWidth - 8, rect.width + 10)}px`;
    highlight.style.height = `${rect.height + 10}px`;
    document.body.appendChild(highlight);
  }

  function advanceTutorial(action, detail = null) {
    if (state.tutorial.complete || state.tutorial.dismissed) return;
    const step = D.tutorialSteps[state.tutorial.index];
    if (!step) return;
    let matches = false;
    if (step.action === action) matches = true;
    if (step.action === 'navigate' && action === 'navigate' && detail === step.targetView) matches = true;
    if (!matches) return;
    state.tutorial.index += 1;
    if (state.tutorial.index >= D.tutorialSteps.length) state.tutorial.complete = true;
    renderTutorial();
    saveGame();
  }

  function renderAll() {
    updateUnlocks(true);
    renderHeader();
    if (state.currentView === 'map') renderMap();
    if (state.currentView === 'fleet') renderFleet();
    if (state.currentView === 'port') renderPort();
    if (state.currentView === 'missions') renderMissions();
    if (state.currentView === 'captain') renderCaptain();
    renderTutorial();
  }

  function investigateWorldEvent(eventId) {
    const event = state.worldEvents.find(item => item.id === eventId);
    if (!event) return;
    const templateMap = {
      wreck: 'shoreline-salvage',
      merchant: state.resources.renown >= 300 ? 'merchant-raid' : 'merchant-scout',
      storm: 'storm-salvage',
      distress: 'escort-sloop',
      rumour: 'charted-treasure'
    };
    const template = getMissionTemplate(templateMap[event.type]);
    if (!template || state.resources.renown < template.unlockRenown) return;
    const mission = makeMission(template, {
      title: event.title,
      description: `${event.description} This live sighting offers improved rewards.`,
      special: { worldEventId: event.id }
    });
    Object.keys(mission.rewards).forEach(key => {
      mission.rewards[key] = mission.rewards[key].map(value => Math.round(value * 1.25));
    });
    state.availableMissions.unshift(mission);
    state.worldEvents = state.worldEvents.filter(item => item.id !== eventId);
    closeModal();
    navigate('missions');
    toast('The opportunity has been added to the mission board.', 'good');
    renderAll();
  }

  function renderExpeditionMissions() {
    if (!state.expeditionMissions) state.expeditionMissions = [];
    state.expeditionMissions = state.expeditionMissions.filter(m => m.expiresAt > now());
    const templates = D.missionTemplates.filter(t => t.category === 'expedition' || (t.difficulty === 'epic' && t.unlockRenown <= state.resources.renown));
    templates.slice(-3).forEach(template => {
      if (!state.expeditionMissions.some(m => m.templateId === template.id)) {
        state.expeditionMissions.push(makeMission(template, { special: { expedition: true } }));
      }
    });
    return state.expeditionMissions.length
      ? state.expeditionMissions.map(missionCard).join('')
      : `<div class="empty-state"><span>🔱</span><h3>No viable expedition</h3><p>Build more renown and fleet power to reach forbidden waters.</p></div>`;
  }

  // Replace the initial renderer with the persistent expedition board.
  renderExpeditions = renderExpeditionMissions;

  function handleClick(event) {
    const button = event.target.closest('button, [data-action], [data-close-modal]');
    if (!button) return;
    const action = button.dataset.action;

    if (button.dataset.combat) {
      combatAction(button.dataset.combat);
      return;
    }

    if (button.dataset.nav && !action) {
      navigate(button.dataset.nav);
      return;
    }
    if (button.hasAttribute('data-close-modal') || action === 'close-modal') return closeModal();

    switch (action) {
      case 'open-ship': openShipModal(button.dataset.shipId); break;
      case 'open-port-location': openPortLocation(button.dataset.portId); break;
      case 'open-world-event': openWorldEvent(button.dataset.eventId); break;
      case 'investigate-event': investigateWorldEvent(button.dataset.eventId); break;
      case 'visit-port':
        state.currentPortId = button.dataset.portId;
        closeModal();
        navigate('port');
        break;
      case 'assign-mission': openAssignMission(button.dataset.missionId); break;
      case 'confirm-assign-mission': {
        const selected = $('input[name="mission-assignee"]:checked');
        if (!selected) return toast('Choose a ship or fleet first.', 'bad');
        const [type, id] = selected.value.split(':');
        const shipIds = type === 'fleet' ? getFleet(id)?.shipIds || [] : [id];
        assignMission(button.dataset.missionId, shipIds);
        break;
      }
      case 'claim-mission': claimMission(button.dataset.activeId); break;
      case 'start-combat': startCombat(button.dataset.activeId); break;
      case 'repair-ship': repairShip(button.dataset.shipId); break;
      case 'resupply-ship': resupplyShip(button.dataset.shipId); break;
      case 'buy-ship': buyShip(button.dataset.typeId); break;
      case 'open-recruit': openRecruitModal(button.dataset.roleId); break;
      case 'confirm-recruit': recruitCrew(button.dataset.roleId, $('#recruitShip')?.value, Number($('#recruitAmount')?.value || 1)); closeModal(); break;
      case 'hire-captain': hireCaptain(button.dataset.captainId); break;
      case 'assign-captain': openAssignCaptainModal(button.dataset.captainId || null, button.dataset.shipId || null); break;
      case 'confirm-assign-captain': assignCaptain($('#assignCaptainSelect')?.value, $('#assignShipSelect')?.value); closeModal(); break;
      case 'upgrade-ship': upgradeShip(button.dataset.shipId, button.dataset.upgradeId); break;
      case 'upgrade-base': upgradeBase(button.dataset.upgradeId); break;
      case 'open-create-fleet': openCreateFleetModal(); break;
      case 'confirm-create-fleet': {
        const shipIds = $$('input[name="fleetShip"]:checked').map(input => input.value);
        createFleet($('#fleetName')?.value || '', shipIds, $('#fleetFlagship')?.value);
        break;
      }
      case 'disband-fleet': disbandFleet(button.dataset.fleetId); break;
      case 'claim-story': claimStory(Number(button.dataset.chapterId)); break;
      case 'claim-daily': claimDaily(); break;
      case 'open-story-tab': state.missionTab = 'story'; navigate('missions'); break;
      case 'go-workshop': state.selectedShipId = button.dataset.shipId; state.portTab = 'workshop'; closeModal(); navigate('port'); break;
      case 'rename-ship': {
        const ship = getShip(button.dataset.shipId);
        if (!ship) break;
        openModal('Rename Ship', `<div class="form-row"><label>New name</label><input id="renameShipInput" maxlength="32" value="${escapeHtml(ship.name)}"></div><div class="card-actions"><button class="primary-button" data-action="confirm-rename-ship" data-ship-id="${ship.id}">Rename</button></div>`);
        break;
      }
      case 'confirm-rename-ship': {
        const ship = getShip(button.dataset.shipId);
        const value = $('#renameShipInput')?.value.trim();
        if (ship && value) ship.name = value.slice(0, 32);
        closeModal(); renderAll(); break;
      }
      case 'rename-captain':
        openModal('Rename Captain', `<div class="form-row"><label>Captain name</label><input id="renameCaptainInput" maxlength="32" value="${escapeHtml(state.playerName)}"></div><div class="card-actions"><button class="primary-button" data-action="confirm-rename-captain">Confirm</button></div>`);
        break;
      case 'confirm-rename-captain': {
        const value = $('#renameCaptainInput')?.value.trim();
        if (value) {
          const previous = state.playerName;
          state.playerName = value.slice(0, 32);
          const player = state.captains.find(c => c.isPlayer && c.name === previous) || state.captains.find(c => c.isPlayer);
          if (player) player.name = state.playerName;
        }
        closeModal(); renderAll(); break;
      }
      case 'trade-step': {
        const input = $(`#qty-${button.dataset.goodId}`);
        if (input) input.value = String(Math.max(1, Number(input.value || 1) + Number(button.dataset.delta || 0)));
        break;
      }
      case 'buy-good': buyGood(button.dataset.goodId, Number($(`#qty-${button.dataset.goodId}`)?.value || 1), state.marketShipId); break;
      case 'sell-good': sellGood(button.dataset.goodId, Number($(`#qty-${button.dataset.goodId}`)?.value || 1), state.marketShipId); break;
      case 'tutorial-continue': advanceTutorial(D.tutorialSteps[state.tutorial.index]?.action); break;
      case 'dismiss-tutorial': state.tutorial.dismissed = true; renderTutorial(); saveGame(); break;
      case 'close-offline': $('#offlineRoot').innerHTML = ''; renderAll(); break;
      case 'save-now': saveGame(true); break;
      case 'export-save': exportSave(); break;
      case 'open-import': openModal('Import Save', `<p>Paste a Tidebound save code below. This replaces current progress.</p><textarea id="importSaveCode" rows="8"></textarea><div class="card-actions"><button class="primary-button" data-action="confirm-import">Import</button></div>`); break;
      case 'confirm-import': importSave($('#importSaveCode')?.value || ''); break;
      case 'open-reset': openModal('Reset All Progress', `<p>This permanently removes the current local save and begins again at Driftwood Cay.</p><div class="card-actions"><button class="danger-button" data-action="confirm-reset">Delete Save</button></div>`, { eyebrow: 'Permanent action' }); break;
      case 'confirm-reset':
        localStorage.removeItem(SAVE_KEY);
        state = createStarterState();
        refreshMissionBoard(true); refreshAllMarkets(true); spawnWorldEvent(true); closeModal(); renderAll();
        break;
      case 'open-legacy': {
        const marks = Math.max(1, Math.floor(state.resources.renown / 8000));
        openModal('Begin a New Legend', `<p>Your current fleet, gold, upgrades, hideout and renown will reset. Achievements and existing Legacy Marks remain.</p><div class="tag-row"><span class="tag gold">Gain ${marks} Legacy Mark${marks === 1 ? '' : 's'}</span><span class="tag">+${marks * 5}% permanent renown gain</span></div><div class="card-actions"><button class="danger-button" data-action="confirm-legacy">Retire This Legend</button></div>`, { eyebrow: 'Legacy voyage' });
        break;
      }
      case 'confirm-legacy': performLegacy(); break;
      default: break;
    }
  }

  function handleChange(event) {
    const control = event.target;
    const action = control.dataset.action;
    switch (action) {
      case 'select-market-ship': state.marketShipId = control.value; renderPort(); break;
      case 'select-workshop-ship': state.selectedShipId = control.value; renderPort(); break;
      case 'fleet-formation': setFleetFormation(control.dataset.fleetId, control.value); break;
      case 'set-policy': state.policies[control.dataset.policy] = control.value; toast('Standing orders updated.', 'good'); saveGame(); break;
      case 'setting-select': state.settings[control.dataset.setting] = control.value === 'true'; saveGame(); break;
      default: break;
    }
  }

  function bindEvents() {
    document.addEventListener('click', handleClick);
    document.addEventListener('change', handleChange);

    $$('[data-fleet-tab]').forEach(button => button.addEventListener('click', () => { state.fleetTab = button.dataset.fleetTab; renderFleet(); }));
    $$('[data-port-tab]').forEach(button => button.addEventListener('click', () => { state.portTab = button.dataset.portTab; renderPort(); }));
    $$('[data-mission-tab]').forEach(button => button.addEventListener('click', () => { state.missionTab = button.dataset.missionTab; renderMissions(); }));

    $('#fleetOrganiseButton').addEventListener('click', () => systemUnlock('fleets') ? openCreateFleetModal() : toast('Fleet formations unlock at 500 renown.', 'bad'));
    $('#missionRefreshButton').addEventListener('click', () => {
      const cost = state.stats.missionsCompleted < 2 ? 0 : 25;
      if (state.resources.gold < cost) return toast(`Refreshing the board costs ${cost} gold.`, 'bad');
      state.resources.gold -= cost;
      refreshMissionBoard(true);
      toast('New rumours have reached the board.', 'good');
      renderAll();
    });
    $('#changePortButton').addEventListener('click', () => {
      openModal('Known Ports', `<div class="content-stack">${state.unlockedPorts.map(id => { const port=getPort(id); return `<button class="card" data-action="visit-port" data-port-id="${id}" style="text-align:left"><div class="card-title"><span class="round-icon">${port.icon}</span><div><h3>${escapeHtml(port.name)}</h3><p class="card-subtitle">${escapeHtml(port.faction)} · ${escapeHtml(port.speciality)}</p></div></div></button>`; }).join('')}</div>`, { eyebrow: 'Choose harbour' });
    });
    $('#settingsButton').addEventListener('click', openSettingsModal);
    $('#logButton').addEventListener('click', openLogModal);
    $('#profileButton').addEventListener('click', () => navigate('captain'));
    $('#mapCenterButton').addEventListener('click', () => { state.selectedShipId = state.ships[0]?.id; renderMap(); toast('Map centred on your flagship.'); });
    $('#mapFilterButton').addEventListener('click', () => openModal('Map Filters', `<p class="card-subtitle">The map automatically prioritises your ships, live events and discovered ports. Additional faction and trade-route filters unlock through the Cartographer Hall.</p><div class="tag-row"><span class="tag green">Player ships visible</span><span class="tag green">Live events visible</span><span class="tag ${state.base.cartographer ? 'green':'red'}">Faction traffic ${state.base.cartographer ? 'visible':'locked'}</span></div>`, { eyebrow: 'Chart layers' }));
    window.addEventListener('resize', () => renderTutorial());
    window.addEventListener('beforeunload', () => saveGame());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) saveGame();
      else {
        const elapsed = now() - state.lastSeen;
        const report = simulateOffline(elapsed);
        state.lastSeen = now();
        if (report) showOfflineReport(report);
        renderAll();
      }
    });
  }

  function gameTick() {
    const second = Math.floor(now() / 1000);
    if (second === lastRenderedSecond) return;
    lastRenderedSecond = second;
    state.stats.totalPlaySeconds += 1;
    processMissions();
    if (now() >= state.boardRefreshAt) refreshMissionBoard(true);
    if (now() - state.lastMarketUpdate >= 10 * 60 * 1000) refreshAllMarkets(true);
    spawnWorldEvent();
    state.availableMissions = state.availableMissions.filter(m => m.expiresAt > now());
    state.bounties = state.bounties.filter(b => b.expiresAt > now() && !b.defeated);
    checkAchievements();
    if (state.currentView === 'map') renderMap();
    if (state.currentView === 'missions') renderMissions();
    renderHeader();
  }

  function init() {
    const loaded = loadGame();
    const previousSeen = state.lastSeen || now();
    state.sessionStartedAt = now();
    if (!state.expeditionMissions) state.expeditionMissions = [];
    refreshMissionBoard(!state.availableMissions.length);
    refreshAllMarkets(false);
    generateCaptains();
    generateBounties();
    spawnWorldEvent(true);
    updateUnlocks(true);
    bindEvents();
    navigate(state.currentView || 'map');
    renderAll();
    const report = loaded ? simulateOffline(now() - previousSeen) : null;
    state.lastSeen = now();
    if (report) showOfflineReport(report);
    saveGame();
    saveTimer = window.setInterval(() => saveGame(), AUTOSAVE_MS);
    window.setInterval(gameTick, 500);
    if (navigator.serviceWorker?.register && location.protocol !== 'file:') {
      navigator.serviceWorker.register('./sw.js').catch(error => console.warn('Service worker unavailable', error));
    }
  }

  document.addEventListener('DOMContentLoaded', init);
})();

  </script>
</body>
</html>
