<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d2630">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tidebound">
  <title>Tidebound: A Pirate's Fortune</title>
  <style>
:root {
  --bg: #07191f;
  --bg-soft: #0b222b;
  --panel: rgba(13, 38, 48, 0.94);
  --panel-2: rgba(20, 51, 61, 0.96);
  --panel-3: rgba(35, 65, 72, 0.86);
  --ink: #f4ead6;
  --muted: #9db4b7;
  --gold: #e2bc6c;
  --gold-bright: #f0d491;
  --red: #dc6d63;
  --green: #65b98b;
  --blue: #56a9c4;
  --purple: #a58ad1;
  --line: rgba(221, 202, 158, 0.16);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --radius: 18px;
  --shadow: 0 14px 38px rgba(0, 0, 0, .28);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); overscroll-behavior: none; }
body {
  min-height: 100dvh;
  background:
    radial-gradient(circle at 20% -10%, rgba(45, 116, 130, .22), transparent 34%),
    radial-gradient(circle at 100% 20%, rgba(150, 106, 48, .12), transparent 28%),
    linear-gradient(180deg, #0a232c 0%, #06171d 70%);
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; }
button { color: inherit; }
button:disabled { opacity: .45; cursor: not-allowed; }
button:not(:disabled) { cursor: pointer; }
.hidden { display: none !important; }

.app-shell { min-height: 100dvh; padding-top: calc(64px + var(--safe-top)); padding-bottom: calc(78px + var(--safe-bottom)); }
.topbar {
  position: fixed; inset: 0 0 auto 0; z-index: 70;
  height: calc(64px + var(--safe-top)); padding: var(--safe-top) 14px 0;
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(7, 25, 31, .92); border-bottom: 1px solid var(--line);
  backdrop-filter: blur(18px); box-shadow: 0 8px 24px rgba(0,0,0,.18);
}
.brand-block { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-block h1 { margin: 0; font-family: Georgia, serif; font-size: 21px; line-height: 1; letter-spacing: .02em; }
.brand-block p { margin: 4px 0 0; color: var(--gold); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; }
.captain-seal, .icon-button {
  display: grid; place-items: center; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--gold-bright);
}
.captain-seal { width: 42px; height: 42px; border-radius: 50%; font-size: 20px; box-shadow: inset 0 0 0 3px rgba(226,188,108,.08); }
.icon-button { width: 38px; height: 38px; border-radius: 12px; font-size: 20px; }
.top-resources { display: flex; align-items: center; gap: 7px; }
.resource-chip {
  height: 38px; min-width: 62px; padding: 0 10px; border: 1px solid var(--line); border-radius: 12px;
  background: rgba(255,255,255,.04); display: flex; align-items: center; justify-content: center; gap: 6px;
}
.resource-chip span { color: var(--gold); }
.resource-chip strong { font-size: 13px; }

.main-content { width: min(1180px, 100%); margin: 0 auto; padding: 14px; }
.view { display: none; animation: viewIn .24s ease; }
.view.active { display: block; }
@keyframes viewIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

.section-heading, .map-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin: 4px 2px 14px; }
h2, h3, h4 { font-family: Georgia, serif; }
h2 { margin: 2px 0 0; font-size: clamp(24px, 6vw, 34px); letter-spacing: -.025em; }
h3 { margin: 0; font-size: 18px; }
h4 { margin: 0; font-size: 15px; }
.eyebrow { margin: 0; color: var(--gold); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .16em; }
.map-actions { display: flex; gap: 7px; }
.small-button, .text-button, .primary-button, .danger-button, .ghost-button {
  border: 1px solid var(--line); border-radius: 12px; min-height: 38px; padding: 0 12px; font-weight: 750; font-size: 12px;
}
.small-button, .ghost-button { background: rgba(255,255,255,.045); }
.text-button { border-color: transparent; background: transparent; color: var(--gold-bright); padding: 0 4px; }
.primary-button { color: #142027; background: linear-gradient(180deg, #edcf89, #cda752); border-color: rgba(255,240,188,.45); box-shadow: 0 5px 14px rgba(194,147,55,.2); }
.danger-button { background: rgba(220,109,99,.14); color: #ffb4ac; border-color: rgba(220,109,99,.3); }

.world-map {
  position: relative; width: 100%; height: min(62vh, 565px); min-height: 360px; overflow: hidden; isolation: isolate;
  border: 1px solid rgba(220, 202, 157, .2); border-radius: 24px; box-shadow: var(--shadow);
  background:
    radial-gradient(circle at 30% 40%, rgba(30, 112, 127, .25), transparent 28%),
    radial-gradient(circle at 75% 60%, rgba(36, 128, 136, .16), transparent 25%),
    linear-gradient(135deg, #0c3440, #0b2833 55%, #071e27);
  touch-action: manipulation;
}
.ocean-texture {
  position: absolute; inset: 0; z-index: -2; opacity: .25;
  background-image:
    repeating-radial-gradient(ellipse at 20% 20%, transparent 0 18px, rgba(255,255,255,.06) 19px 20px, transparent 21px 38px),
    repeating-linear-gradient(168deg, transparent 0 34px, rgba(255,255,255,.025) 35px 36px, transparent 37px 70px);
  animation: oceanDrift 30s linear infinite;
}
@keyframes oceanDrift { to { transform: translate3d(-35px, 18px, 0); } }
.route-layer, .map-locations, .map-ships, .map-events, .weather-layer, .map-fog { position: absolute; inset: 0; }
.route-layer { width: 100%; height: 100%; overflow: visible; }
.route-line { fill: none; stroke: rgba(235,211,154,.34); stroke-width: 2.2; stroke-dasharray: 8 8; vector-effect: non-scaling-stroke; }
.route-line.active { stroke: rgba(240,212,145,.78); animation: dash 10s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -64; } }
.map-location, .map-ship, .map-event { position: absolute; transform: translate(-50%, -50%); border: 0; background: none; padding: 0; }
.map-location { z-index: 7; display: grid; justify-items: center; gap: 4px; min-width: 74px; }
.location-icon {
  width: 35px; height: 35px; display: grid; place-items: center; border-radius: 50%;
  background: rgba(9, 28, 35, .9); border: 2px solid rgba(229,200,132,.55); color: var(--gold-bright); box-shadow: 0 6px 15px rgba(0,0,0,.35);
}
.location-label { max-width: 100px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 3px 7px; border-radius: 8px; background: rgba(6,20,25,.76); font-size: 10px; font-weight: 800; text-shadow: 0 1px 2px #000; }
.map-location.locked { filter: grayscale(1); opacity: .42; }
.map-location.current .location-icon { box-shadow: 0 0 0 5px rgba(226,188,108,.15), 0 6px 15px rgba(0,0,0,.35); }
.map-ship { z-index: 12; width: 38px; height: 38px; transition: left 1s linear, top 1s linear; }
.ship-marker {
  width: 38px; height: 38px; display: grid; place-items: center; font-size: 23px; filter: drop-shadow(0 5px 5px rgba(0,0,0,.55));
  transform-origin: 50% 50%; transition: transform .3s;
}
.map-ship.selected .ship-marker { filter: drop-shadow(0 0 7px rgba(242,214,146,.9)); transform: scale(1.22); }
.ship-progress-ring { position: absolute; inset: -3px; border: 2px solid rgba(226,188,108,.7); border-radius: 50%; opacity: .55; }
.map-event { z-index: 8; }
.event-marker { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: rgba(143,58,52,.82); border: 1px solid rgba(255,205,190,.5); animation: pulse 2s ease infinite; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
@keyframes pulse { 50% { transform: scale(1.13); box-shadow: 0 0 0 8px rgba(220,109,99,0); } }
.map-compass { position: absolute; right: 13px; bottom: 13px; width: 49px; height: 49px; border-radius: 50%; border: 1px solid rgba(226,188,108,.35); background: rgba(4,18,24,.62); display: grid; place-items: center; color: var(--gold); font: 700 10px Georgia; }
.map-compass i { position: absolute; width: 2px; height: 22px; background: linear-gradient(var(--red) 50%, var(--ink) 50%); transform: translateY(5px); }
.weather-cell { position: absolute; font-size: 30px; opacity: .6; filter: drop-shadow(0 2px 5px rgba(0,0,0,.4)); animation: weatherFloat 8s ease-in-out infinite; }
@keyframes weatherFloat { 50% { transform: translate(14px, -6px); } }
.map-fog { z-index: 20; pointer-events: none; background: radial-gradient(circle at var(--fog-x, 20%) var(--fog-y, 70%), transparent 0 18%, rgba(5,18,22,.08) 27%, rgba(5,18,22,.76) 62%); opacity: .72; mix-blend-mode: multiply; transition: opacity .4s; }

.status-strip { display: flex; gap: 9px; overflow-x: auto; padding: 10px 2px 6px; scrollbar-width: none; }
.status-strip::-webkit-scrollbar { display: none; }
.status-pill { flex: 0 0 auto; padding: 7px 10px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.035); font-size: 11px; color: var(--muted); }
.status-pill strong { color: var(--ink); }

.dashboard-grid { display: grid; gap: 12px; margin-top: 8px; }
.panel { border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(180deg, rgba(20,50,60,.92), rgba(10,31,39,.94)); box-shadow: 0 12px 30px rgba(0,0,0,.14); }
.compact-panel { padding: 14px; }
.panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.activity-overview, .rumour-overview, .content-stack { display: grid; gap: 10px; }
.activity-row, .rumour-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; min-height: 50px; padding: 9px; border-radius: 13px; background: rgba(255,255,255,.035); }
.activity-icon, .round-icon { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: rgba(226,188,108,.11); color: var(--gold-bright); }
.activity-row p, .rumour-row p { margin: 2px 0 0; font-size: 11px; color: var(--muted); }
.activity-row strong, .rumour-row strong { font-size: 13px; }
.progress { height: 6px; overflow: hidden; border-radius: 999px; background: rgba(0,0,0,.28); margin-top: 6px; }
.progress > span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #c49b4b, #f0d795); transition: width .4s; }

.summary-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 12px; }
.summary-card { padding: 12px 8px; text-align: center; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px solid var(--line); }
.summary-card span { display: block; color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .1em; }
.summary-card strong { display: block; margin-top: 4px; font-family: Georgia, serif; font-size: 20px; }
.segmented-control { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: rgba(0,0,0,.22); margin-bottom: 13px; }
.segmented-control.scrollable { overflow-x: auto; scrollbar-width: none; }
.segmented-control.scrollable::-webkit-scrollbar { display: none; }
.segmented-control button { flex: 1 0 auto; min-height: 39px; padding: 0 11px; border: 0; border-radius: 10px; color: var(--muted); background: transparent; font-weight: 800; font-size: 11px; }
.segmented-control button.active { color: #122129; background: var(--gold-bright); box-shadow: 0 4px 12px rgba(0,0,0,.18); }

.card { padding: 14px; border-radius: 17px; border: 1px solid var(--line); background: linear-gradient(160deg, rgba(21,52,62,.92), rgba(11,32,40,.96)); box-shadow: 0 8px 18px rgba(0,0,0,.12); }
.card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.card-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
.card-title .round-icon { flex: 0 0 auto; }
.card-title h3, .card-title h4 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-subtitle { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
.card-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
.card-actions button { flex: 1 1 auto; }
.tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag { display: inline-flex; align-items: center; min-height: 24px; padding: 4px 8px; border-radius: 999px; background: rgba(255,255,255,.055); border: 1px solid var(--line); font-size: 10px; color: var(--muted); }
.tag.gold { color: var(--gold-bright); background: rgba(226,188,108,.1); }
.tag.red { color: #ffaaa1; background: rgba(220,109,99,.1); }
.tag.green { color: #9de5bd; background: rgba(101,185,139,.1); }
.tag.blue { color: #9fddef; background: rgba(86,169,196,.1); }
.stat-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; margin-top: 12px; }
.stat { padding: 9px; border-radius: 12px; background: rgba(0,0,0,.18); }
.stat label { display: block; color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .08em; }
.stat strong { display: block; margin-top: 4px; font-size: 13px; }
.meter { margin-top: 8px; }
.meter-head { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 10px; color: var(--muted); }
.meter .progress { height: 7px; margin: 0; }
.meter.danger .progress > span { background: linear-gradient(90deg, #ad4542, #ef8b7f); }
.meter.good .progress > span { background: linear-gradient(90deg, #3b8b64, #8dd6ac); }

.ship-card { overflow: hidden; }
.ship-card::before { content: ''; display: block; height: 3px; margin: -14px -14px 12px; background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: .45; }
.ship-avatar { position: relative; width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; font-size: 30px; background: linear-gradient(145deg, rgba(226,188,108,.16), rgba(86,169,196,.1)); border: 1px solid var(--line); }
.level-badge { position: absolute; right: -5px; bottom: -5px; min-width: 22px; height: 22px; border-radius: 999px; display: grid; place-items: center; background: var(--gold); color: #182329; border: 2px solid var(--bg-soft); font-size: 9px; font-weight: 900; }
.busy-ribbon { color: #9fddef; font-size: 10px; font-weight: 800; }
.damaged { color: #ffaaa1; }
.cargo-grid { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; padding-bottom: 2px; }
.cargo-item { flex: 0 0 auto; min-width: 65px; padding: 7px; border: 1px solid var(--line); border-radius: 10px; background: rgba(0,0,0,.14); text-align: center; font-size: 10px; }
.cargo-item strong { display: block; color: var(--gold-bright); margin-top: 2px; }

.port-banner { position: relative; min-height: 145px; overflow: hidden; margin-bottom: 12px; padding: 18px; border-radius: 20px; border: 1px solid var(--line); background: linear-gradient(120deg, rgba(47,75,72,.85), rgba(12,34,43,.94)); box-shadow: var(--shadow); }
.port-banner::after { content: '⚓'; position: absolute; right: 16px; bottom: -25px; font-size: 120px; opacity: .08; transform: rotate(-12deg); }
.port-banner h3 { margin-top: 3px; font-size: 25px; }
.port-banner p { max-width: 74%; margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
.port-stats { display: flex; gap: 8px; margin-top: 13px; }
.port-stats .tag { background: rgba(0,0,0,.2); }

.market-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 12px; border-radius: 15px; background: rgba(255,255,255,.035); border: 1px solid var(--line); }
.market-good { display: flex; align-items: center; gap: 10px; min-width: 0; }
.good-icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: rgba(226,188,108,.09); font-size: 21px; }
.market-prices { display: grid; grid-template-columns: auto auto; gap: 5px; text-align: right; }
.market-prices span { color: var(--muted); font-size: 9px; }
.market-prices strong { font-size: 12px; }
.quantity-control { display: flex; align-items: center; gap: 6px; margin-top: 9px; }
.quantity-control button { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: rgba(255,255,255,.04); }
.quantity-control input { width: 56px; height: 32px; border: 1px solid var(--line); border-radius: 9px; background: rgba(0,0,0,.22); color: var(--ink); text-align: center; }

.mission-card { position: relative; overflow: hidden; }
.mission-card::after { content: ''; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--gold); opacity: .65; }
.mission-card[data-difficulty="dangerous"]::after { background: var(--red); }
.mission-card[data-difficulty="epic"]::after { background: var(--purple); }
.reward-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.reward { color: var(--gold-bright); font-size: 11px; }
.requirement { color: var(--muted); font-size: 10px; }
.countdown { font-variant-numeric: tabular-nums; color: var(--gold-bright); font-weight: 900; }

.timeline { display: grid; gap: 0; }
.timeline-item { position: relative; padding: 4px 0 18px 34px; }
.timeline-item::before { content: ''; position: absolute; left: 12px; top: 12px; bottom: -6px; width: 1px; background: var(--line); }
.timeline-item:last-child::before { display: none; }
.timeline-dot { position: absolute; left: 5px; top: 6px; width: 15px; height: 15px; border-radius: 50%; border: 3px solid var(--bg-soft); background: var(--gold); box-shadow: 0 0 0 1px rgba(226,188,108,.35); }
.timeline-item.locked .timeline-dot { background: #4f6265; }
.timeline-item p { margin: 5px 0 0; color: var(--muted); font-size: 11px; line-height: 1.45; }

.profile-hero { text-align: center; padding: 22px 16px; }
.profile-skull { width: 82px; height: 82px; margin: 0 auto 11px; display: grid; place-items: center; border-radius: 50%; font-size: 40px; background: radial-gradient(circle, rgba(226,188,108,.22), rgba(226,188,108,.04)); border: 1px solid rgba(226,188,108,.3); }
.profile-hero h2 { margin: 0; }
.profile-hero p { color: var(--muted); }
.achievement-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; }
.achievement { min-height: 105px; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.035); }
.achievement.locked { filter: grayscale(1); opacity: .45; }
.achievement span { display: block; font-size: 24px; margin-bottom: 7px; }
.achievement p { margin: 4px 0 0; color: var(--muted); font-size: 10px; }

.bottom-nav {
  position: fixed; z-index: 80; inset: auto 0 0; height: calc(68px + var(--safe-bottom)); padding: 5px 8px var(--safe-bottom);
  display: grid; grid-template-columns: repeat(5,1fr); gap: 3px;
  background: rgba(6,22,28,.95); border-top: 1px solid var(--line); backdrop-filter: blur(20px); box-shadow: 0 -8px 26px rgba(0,0,0,.25);
}
.bottom-nav button { position: relative; border: 0; border-radius: 13px; background: transparent; color: #789397; display: grid; justify-items: center; align-content: center; gap: 2px; }
.bottom-nav button span { font-size: 20px; line-height: 1; }
.bottom-nav button label { font-size: 9px; font-weight: 800; }
.bottom-nav button.active { color: var(--gold-bright); background: rgba(226,188,108,.08); }
.nav-badge { position: absolute; top: 4px; right: 20%; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 999px; background: var(--red); color: white; font-style: normal; font-size: 9px; display: grid; place-items: center; }

.toast-region { position: fixed; z-index: 140; top: calc(74px + var(--safe-top)); left: 50%; width: min(92vw, 390px); transform: translateX(-50%); display: grid; gap: 7px; pointer-events: none; }
.toast { padding: 11px 13px; border: 1px solid var(--line); border-radius: 13px; background: rgba(10,31,39,.96); box-shadow: var(--shadow); font-size: 12px; animation: toastIn .25s ease; }
.toast.good { border-color: rgba(101,185,139,.35); }
.toast.bad { border-color: rgba(220,109,99,.38); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } }

.modal-root:empty, .tutorial-root:empty, .offline-root:empty { display: none; }
.modal-root, .tutorial-root, .offline-root { position: fixed; inset: 0; z-index: 120; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(0,10,14,.78); backdrop-filter: blur(5px); }
.modal-card { position: absolute; inset: auto 0 0; max-height: min(88dvh, 820px); overflow: hidden; display: flex; flex-direction: column; border-radius: 24px 24px 0 0; border: 1px solid var(--line); background: linear-gradient(180deg,#12323d,#091f27); box-shadow: 0 -20px 60px rgba(0,0,0,.5); animation: modalUp .3s ease; padding-bottom: var(--safe-bottom); }
@keyframes modalUp { from { transform: translateY(100%); } }
.modal-header { min-height: 58px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
.modal-header h2, .modal-header h3 { margin: 0; }
.modal-body { padding: 14px; overflow-y: auto; }
.modal-body p { line-height: 1.55; }
.form-row { display: grid; gap: 6px; margin-bottom: 12px; }
.form-row label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; }
.form-row input, .form-row select, .form-row textarea { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: rgba(0,0,0,.25); color: var(--ink); }

.tutorial-root { z-index: 160; pointer-events: none; }
.tutorial-shade { position: absolute; inset: 0; background: rgba(0,8,12,.66); pointer-events: auto; }
.tutorial-card { position: absolute; z-index: 2; left: 12px; right: 12px; bottom: calc(82px + var(--safe-bottom)); padding: 16px; border: 1px solid rgba(232,207,144,.35); border-radius: 18px; background: linear-gradient(160deg,#173d48,#0b2630); box-shadow: var(--shadow); pointer-events: auto; animation: modalUp .25s ease; }
.tutorial-card .guide { display: flex; gap: 11px; }
.guide-avatar { width: 44px; height: 44px; flex: 0 0 auto; border-radius: 50%; display: grid; place-items: center; background: rgba(226,188,108,.14); color: var(--gold-bright); font-size: 24px; }
.tutorial-card p { margin: 7px 0 0; color: #c2d0d0; font-size: 12px; line-height: 1.5; }
.tutorial-card .card-actions { justify-content: flex-end; }
.tutorial-card .card-actions button { flex: 0 0 auto; }
.tutorial-highlight { position: fixed; z-index: 161; border: 2px solid var(--gold-bright); border-radius: 14px; box-shadow: 0 0 0 9999px rgba(0,8,12,.67), 0 0 28px rgba(226,188,108,.7); pointer-events: none; transition: all .25s; }

.offline-card { position: absolute; inset: 50% 14px auto; transform: translateY(-50%); max-height: 85dvh; overflow-y: auto; padding: 20px; border-radius: 22px; border: 1px solid rgba(226,188,108,.28); background: linear-gradient(160deg,#153843,#081e26); box-shadow: 0 25px 70px rgba(0,0,0,.55); }
.offline-card h2 { margin-top: 2px; }
.offline-list { display: grid; gap: 8px; margin: 14px 0; }
.offline-item { display: flex; justify-content: space-between; gap: 12px; padding: 10px; border-radius: 12px; background: rgba(255,255,255,.04); }

.combat-stage { text-align: center; }
.combat-sea { position: relative; height: 180px; overflow: hidden; margin: 8px 0 14px; border-radius: 18px; background: linear-gradient(#6b7774 0 35%, #174855 36% 100%); border: 1px solid var(--line); }
.combat-sea::before { content: ''; position: absolute; inset: 36% 0 0; background: repeating-linear-gradient(170deg, transparent 0 20px, rgba(255,255,255,.07) 21px 22px, transparent 23px 42px); animation: oceanDrift 12s linear infinite; }
.combat-ship { position: absolute; top: 90px; font-size: 56px; filter: drop-shadow(0 7px 6px rgba(0,0,0,.5)); transition: left .5s, right .5s, transform .2s; }
.combat-ship.player { left: 12%; transform: scaleX(-1); }
.combat-ship.enemy { right: 12%; }
.combat-flash { animation: fireFlash .35s ease; }
@keyframes fireFlash { 50% { filter: brightness(2) drop-shadow(0 0 14px #f4c96e); transform: translateX(5px); } }
.combat-log { height: 88px; overflow-y: auto; padding: 10px; text-align: left; border-radius: 12px; background: rgba(0,0,0,.2); font-size: 11px; color: var(--muted); }
.combat-controls { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; margin-top: 12px; }
.combat-controls button { min-height: 48px; }
.cooldown { opacity: .48; }

.empty-state { padding: 28px 15px; text-align: center; border-radius: 18px; border: 1px dashed var(--line); color: var(--muted); }
.empty-state span { display: block; font-size: 36px; margin-bottom: 8px; }
.empty-state h3 { color: var(--ink); }
.locked-panel { position: relative; padding: 25px 18px; text-align: center; overflow: hidden; }
.locked-panel::before { content: '🔒'; display: block; font-size: 30px; margin-bottom: 8px; }
.locked-panel p { color: var(--muted); font-size: 12px; }

@media (min-width: 760px) {
  .main-content { padding: 20px; }
  .dashboard-grid { grid-template-columns: 1fr 1fr; }
  .content-stack.cards-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .modal-card { inset: 6% max(10%, calc((100vw - 760px)/2)) auto; max-height: 88dvh; border-radius: 24px; padding-bottom: 0; }
  .achievement-grid { grid-template-columns: repeat(4,1fr); }
  .bottom-nav { left: 50%; width: min(620px,100%); transform: translateX(-50%); border-radius: 18px 18px 0 0; }
}

@media (min-width: 1050px) {
  .app-shell { padding-left: 92px; padding-bottom: 18px; }
  .topbar { left: 92px; }
  .bottom-nav { inset: 0 auto 0 0; width: 92px; height: 100dvh; padding: calc(74px + var(--safe-top)) 8px 16px; transform: none; grid-template-columns: 1fr; grid-template-rows: repeat(5,72px); border-radius: 0; border-top: 0; border-right: 1px solid var(--line); }
  .bottom-nav button span { font-size: 24px; }
  .bottom-nav button label { font-size: 10px; }
  .world-map { height: 610px; }
  .content-stack.cards-grid { grid-template-columns: repeat(3,minmax(0,1fr)); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
}

  <script>
'use strict';

(() => {
  const D = window.GAME_DATA;
  const SAVE_KEY = 'tidebound-save-v1';
  const AUTOSAVE_MS = 12000;
  const BOARD_REFRESH_MS = 8 * 60 * 1000;
  const MAX_OFFLINE_MS = 16 * 60 * 60 * 1000;

  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
  const rand = (min, max) => min + Math.random() * (max - min);
  const randInt = (min, max) => Math.floor(rand(min, max + 1));
  const choice = list => list[Math.floor(Math.random() * list.length)];
  const uid = prefix => `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
  const now = () => Date.now();
  const deepClone = value => JSON.parse(JSON.stringify(value));
  const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));
  const titleCase = value => String(value).replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

  function formatNumber(value) {
    const n = Number(value) || 0;
    if (Math.abs(n) < 1000) return Math.floor(n).toLocaleString();
    const units = [['T', 1e12], ['B', 1e9], ['M', 1e6], ['K', 1e3]];
    const unit = units.find(([, size]) => Math.abs(n) >= size);
    return unit ? `${(n / unit[1]).toFixed(n / unit[1] >= 100 ? 0 : 1)}${unit[0]}` : String(n);
  }

  function formatTime(seconds) {
    const total = Math.max(0, Math.ceil(Number(seconds) || 0));
    if (total < 60) return `${total}s`;
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    if (h) return `${h}h ${m}m`;
    return `${m}m ${s.toString().padStart(2, '0')}s`;
  }

  function formatDurationMs(ms) {
    const minutes = Math.floor(ms / 60000);
    if (minutes < 1) return `${Math.floor(ms / 1000)} seconds`;
    if (minutes < 60) return `${minutes} minute${minutes === 1 ? '' : 's'}`;
    const hours = Math.floor(minutes / 60);
    const remainder = minutes % 60;
    return `${hours}h ${remainder}m`;
  }

  function getTodayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function daysBetweenKeys(a, b) {
    if (!a || !b) return 999;
    const one = new Date(`${a}T12:00:00`);
    const two = new Date(`${b}T12:00:00`);
    return Math.round((two - one) / 86400000);
  }

  function getRank(renown = state.resources.renown) {
    return [...D.ranks].reverse().find(rank => renown >= rank.renown) || D.ranks[0];
  }

  function getNextRank(renown = state.resources.renown) {
    return D.ranks.find(rank => rank.renown > renown) || null;
  }

  function systemUnlock(id) {
    const unlock = D.unlocks.find(item => item.id === id);
    return !unlock || state.resources.renown >= unlock.renown;
  }

  function getPort(id) { return D.ports.find(port => port.id === id); }
  function getShip(id) { return state.ships.find(ship => ship.id === id); }
  function getCaptain(id) { return state.captains.find(captain => captain.id === id); }
  function getFleet(id) { return state.fleets.find(fleet => fleet.id === id); }
  function getActiveMission(id) { return state.activeMissions.find(mission => mission.id === id); }
  function getAvailableMission(id) { return state.availableMissions.find(mission => mission.id === id); }
  function getMissionTemplate(id) { return D.missionTemplates.find(template => template.id === id); }

  function getShipType(ship) { return D.shipTypes[ship.typeId]; }
  function getShipMaxHull(ship) { return Math.round(getShipStat(ship, 'hull')); }

  function getShipStat(ship, stat) {
    const type = getShipType(ship);
    let value = Number(type[stat]) || 0;
    Object.entries(ship.upgrades || {}).forEach(([upgradeId, level]) => {
      const upgrade = D.shipUpgrades[upgradeId];
      if (upgrade?.stat === stat) value *= 1 + upgrade.amount * level;
    });
    const captain = getCaptain(ship.captainId);
    if (captain) {
      captain.traits.forEach(traitId => {
        const trait = D.captainTraits[traitId];
        if (stat === 'speed' && trait?.speed) value *= 1 + trait.speed;
        if (stat === 'firepower' && trait?.firepower) value *= 1 + trait.firepower;
      });
    }
    const crewTotal = Object.values(ship.crew || {}).reduce((sum, amount) => sum + amount, 0);
    const crewCap = type.crew || 1;
    const crewEfficiency = clamp(.55 + (crewTotal / crewCap) * .55, .55, 1.1);
    if (['speed', 'firepower', 'boarding'].includes(stat)) value *= crewEfficiency;
    if (stat === 'firepower') value *= 1 + ((ship.crew?.gunner || 0) / Math.max(1, crewCap)) * .25;
    if (stat === 'boarding') value *= 1 + ((ship.crew?.marine || 0) / Math.max(1, crewCap)) * .3;
    value *= 1 + Math.max(0, ship.level - 1) * .025;
    return value;
  }

  function getShipPower(ship) {
    const hullFactor = ship.hull / Math.max(1, getShipMaxHull(ship));
    return Math.round((getShipStat(ship, 'firepower') * 1.1 + getShipStat(ship, 'boarding') * .55 + getShipStat(ship, 'hull') * .08) * (.55 + hullFactor * .45));
  }

  function getFleetPower(fleet) {
    return fleet.shipIds.reduce((sum, id) => sum + (getShip(id) ? getShipPower(getShip(id)) : 0), 0);
  }

  function getCrewCount(ship) {
    return Object.values(ship.crew || {}).reduce((sum, value) => sum + value, 0);
  }

  function getCargoUsed(ship) {
    return Object.entries(ship.cargo || {}).reduce((sum, [goodId, amount]) => sum + amount * (D.goods[goodId]?.weight || 1), 0);
  }

  function logEvent(text, type = 'info') {
    state.log.unshift({ id: uid('log'), time: now(), text, type });
    state.log = state.log.slice(0, 120);
  }

  function toast(message, type = '') {
    const region = $('#toastRegion');
    if (!region) return;
    const item = document.createElement('div');
    item.className = `toast ${type}`.trim();
    item.textContent = message;
    region.appendChild(item);
    window.setTimeout(() => item.remove(), 3600);
  }

  function createStarterState() {
    const playerCaptainId = uid('captain');
    const starterShipId = uid('ship');
    const created = now();
    const resources = {
      gold: 120,
      renown: 0,
      timber: 7,
      iron: 2,
      powder: 3,
      provisions: 16,

    };

    return {
      version: D.version,
      createdAt: created,
      lastSeen: created,
      lastSaved: created,
      playerName: 'Captain Ash',
      currentView: 'map',
      currentPortId: 'driftwood-cay',
      selectedShipId: starterShipId,
      marketShipId: starterShipId,
      fleetTab: 'ships',
      portTab: 'market',
      missionTab: 'available',
      resources,
      ships: [{
        id: starterShipId,
        name: 'Leaky Promise',
        typeId: 'dinghy',
        level: 1,
        xp: 0,
        hull: D.shipTypes.dinghy.hull,
        morale: 72,
        supplies: 24,
        locationId: 'driftwood-cay',
        captainId: playerCaptainId,
        crew: { sailor: 2 },
        cargo: {},
        upgrades: {},
        activeMissionId: null,
        fleetId: null,
        status: 'Docked'
      }],
      captains: [{
        id: playerCaptainId,
        name: 'Captain Ash',
        level: 1,
        xp: 0,
        traits: ['navigator'],
        loyalty: 100,
        hired: true,
        isPlayer: true,
        assignedShipId: starterShipId
      }],
      availableCaptains: [],
      fleets: [],
      availableMissions: [],
      activeMissions: [],
      bounties: [],
      worldEvents: [],
      unlockedPorts: ['driftwood-cay'],
      discoveredPorts: ['driftwood-cay'],
      base: { dock: 0, tavern: 0, warehouse: 0, shipyard: 0, intelligence: 0, fortress: 0, cartographer: 0, council: 0 },
      markets: {},
      achievements: [],
      storyClaimed: [],
      unlocksSeen: [],
      tutorial: { index: 0, complete: false, dismissed: false },
      daily: { lastClaim: null, streak: 0 },
      stats: {
        missionsCompleted: 0,
        combatWins: 0,
        combatLosses: 0,
        tradeProfit: 0,
        goldEarned: 0,
        distanceSailed: 0,
        crewRecruited: 0,
        shipsCaptured: 0,
        activeCommands: 0,
        totalPlaySeconds: 0,
        legacies: 0
      },
      policies: { risk: 'balanced', profitShare: 'fair', combat: 'engage' },
      settings: { sound: true, vibration: true, reducedMotion: false },
      log: [{ id: uid('log'), time: created, text: 'Washed ashore at Driftwood Cay with the Leaky Promise.', type: 'story' }],
      boardRefreshAt: created + BOARD_REFRESH_MS,
      lastMarketUpdate: created,
      lastEventSpawn: created,
      sessionStartedAt: created
    };
  }

  let state = createStarterState();
  let activeCombat = null;
  let lastRenderedSecond = -1;
  let saveTimer = null;

  function migrateState(saved) {
    const fresh = createStarterState();
    const merged = { ...fresh, ...saved };
    merged.resources = { ...fresh.resources, ...(saved.resources || {}) };
    merged.base = { ...fresh.base, ...(saved.base || {}) };
    merged.stats = { ...fresh.stats, ...(saved.stats || {}) };

    merged.daily = { ...fresh.daily, ...(saved.daily || {}) };
    merged.ships = (saved.ships || fresh.ships).map(ship => ({
      level: 1, xp: 0, morale: 70, supplies: 0, crew: {}, cargo: {}, upgrades: {}, fleetId: null, activeMissionId: null, status: 'Docked', ...ship
    }));
    merged.captains = saved.captains || fresh.captains;
    merged.availableCaptains = saved.availableCaptains || [];
    merged.fleets = saved.fleets || [];
    merged.availableMissions = saved.availableMissions || [];
    merged.activeMissions = saved.activeMissions || [];
    merged.worldEvents = saved.worldEvents || [];
    merged.bounties = saved.bounties || [];
    merged.markets = saved.markets || {};
    merged.log = saved.log || fresh.log;
    merged.unlockedPorts = saved.unlockedPorts || ['driftwood-cay'];
    merged.discoveredPorts = saved.discoveredPorts || merged.unlockedPorts;
    return merged;
  }

  function loadGame() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return false;
      state = migrateState(JSON.parse(raw));
      return true;
    } catch (error) {
      console.error('Unable to load save', error);
      toast('The previous save could not be loaded.', 'bad');
      return false;
    }
  }

  function saveGame(showToast = false) {
    try {
      state.lastSeen = now();
      state.lastSaved = now();
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
      if (showToast) toast('Voyage saved.', 'good');
    } catch (error) {
      console.error('Unable to save game', error);
      if (showToast) toast('Save failed. Browser storage may be unavailable.', 'bad');
    }
  }

  function exportSave() {
    const payload = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
    navigator.clipboard?.writeText(payload).then(() => toast('Save code copied to clipboard.', 'good')).catch(() => {
      openModal('Export Save', `<p>Copy this code and keep it somewhere safe.</p><textarea class="save-code" rows="8">${escapeHtml(payload)}</textarea>`);
    });
  }

  function importSave(code) {
    try {
      const parsed = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
      state = migrateState(parsed);
      saveGame();
      closeModal();
      renderAll();
      toast('Save imported successfully.', 'good');
    } catch (error) {
      toast('That save code is not valid.', 'bad');
    }
  }

  function generateMarket(portId, force = false) {
    const port = getPort(portId);
    if (!port) return;
    const existing = state.markets[portId];
    const stale = !existing || now() - existing.updatedAt > 10 * 60 * 1000;
    if (!force && !stale) return;
    const prices = {};
    Object.entries(D.goods).forEach(([goodId, good]) => {
      const bias = port.priceBias[goodId] || 1;
      const swing = rand(1 - good.volatility, 1 + good.volatility);
      const buy = Math.max(2, Math.round(good.basePrice * bias * swing));
      prices[goodId] = { buy, sell: Math.max(1, Math.round(buy * rand(.72, .88))), trend: choice(['up', 'down', 'flat']) };
    });
    state.markets[portId] = { updatedAt: now(), prices };
  }

  function refreshAllMarkets(force = false) {
    state.unlockedPorts.forEach(portId => generateMarket(portId, force));
    state.lastMarketUpdate = now();
  }

  function makeMission(template, options = {}) {
    const ports = state.unlockedPorts.length > 1 ? state.unlockedPorts : ['driftwood-cay', 'saltmere'];
    const originId = options.originId || state.currentPortId || 'driftwood-cay';
    const destinations = ports.filter(id => id !== originId && getPort(id));
    const destinationId = options.destinationId || choice(destinations.length ? destinations : [originId]);
    const duration = randInt(template.duration[0], template.duration[1]);
    const scale = rand(.9, 1.16);
    const rewards = {};
    Object.entries(template.rewards).forEach(([key, range]) => {
      rewards[key] = [Math.round(range[0] * scale), Math.round(range[1] * scale)];
    });
    return {
      id: uid('mission'),
      templateId: template.id,
      title: options.title || template.title,
      description: options.description || template.description,
      category: template.category,
      icon: template.icon,
      difficulty: template.difficulty,
      minPower: Math.round(template.minPower * scale),
      duration,
      rewards,
      risks: deepClone(template.risks),
      activeCombat: Boolean(template.activeCombat),
      fleetRecommended: Boolean(template.fleetRecommended),
      originId,
      destinationId,
      expiresAt: now() + randInt(12, 28) * 60 * 1000,
      special: options.special || null
    };
  }

  function refreshMissionBoard(force = false) {
    if (!force && state.availableMissions.length && now() < state.boardRefreshAt) return;
    const eligible = D.missionTemplates.filter(template => state.resources.renown >= template.unlockRenown && template.category !== 'expedition');
    const count = clamp(4 + (state.base.intelligence || 0), 4, 9);
    const selected = [];
    const routine = eligible.filter(template => template.difficulty === 'routine');
    if (routine.length) selected.push(makeMission(choice(routine)));
    while (selected.length < count && eligible.length) selected.push(makeMission(choice(eligible)));
    state.availableMissions = selected;
    state.boardRefreshAt = now() + BOARD_REFRESH_MS;
  }

  function generateCaptains(force = false) {
    const desired = clamp(2 + (state.base.tavern || 0), 2, 6);
    if (!force && state.availableCaptains.length >= desired) return;
    while (state.availableCaptains.length < desired) {
      const namePool = D.captainNames.filter(name => !state.captains.some(c => c.name === name) && !state.availableCaptains.some(c => c.name === name));
      const name = choice(namePool.length ? namePool : D.captainNames);
      const traitIds = Object.keys(D.captainTraits);
      const traitCount = state.base.tavern >= 3 && Math.random() < .35 ? 2 : 1;
      const traits = [];
      while (traits.length < traitCount) {
        const trait = choice(traitIds);
        if (!traits.includes(trait)) traits.push(trait);
      }
      const level = 1 + Math.floor((state.base.tavern || 0) / 2) + randInt(0, 2);
      state.availableCaptains.push({
        id: uid('captain-candidate'), name, level, xp: 0, traits, loyalty: randInt(55, 85),
        hired: false, isPlayer: false, assignedShipId: null,
        cost: Math.round(160 * level * (1 + traits.length * .35))
      });
    }
  }

  function generateBounties(force = false) {
    if (!systemUnlock('bounties')) return;
    if (!force && state.bounties.length >= 3) return;
    const names = ['The Red Jackal', 'Captain Mire', 'Hollow-Eye Voss', 'The Bell Widow', 'Admiral Strake', 'Mad Tom Rasp'];
    while (state.bounties.length < 3) {
      const name = choice(names.filter(n => !state.bounties.some(b => b.name === n)) || names);
      const tier = Math.max(1, Math.floor(state.resources.renown / 800));
      const power = randInt(70 + tier * 25, 120 + tier * 50);
      state.bounties.push({
        id: uid('bounty'), name, icon: '☠', power,
        reward: Math.round(power * rand(11, 16)), renown: Math.round(power * rand(.35, .55)),
        expiresAt: now() + randInt(45, 120) * 60 * 1000,
        locationId: choice(state.unlockedPorts), defeated: false
      });
    }
  }

  function spawnWorldEvent(force = false) {
    state.worldEvents = state.worldEvents.filter(event => event.expiresAt > now());
    const targetCount = clamp(2 + Math.floor((state.base.cartographer || 0) / 2), 2, 5);
    if (!force && state.worldEvents.length >= targetCount && now() - state.lastEventSpawn < 75 * 1000) return;
    const types = [
      { type: 'wreck', icon: '🪝', title: 'Fresh Wreckage', description: 'A broken mast and scattered cargo have been sighted.' },
      { type: 'merchant', icon: '💰', title: 'Rich Merchant', description: 'A laden merchant vessel is travelling without a visible escort.' },
      { type: 'storm', icon: '🌩', title: 'Moving Storm', description: 'A violent weather front is crossing the shipping lanes.' },
      { type: 'distress', icon: '🚨', title: 'Distress Signal', description: 'Smoke and signal flags have been seen beyond the reef.' },
      { type: 'rumour', icon: '🗺', title: 'Treasure Rumour', description: 'Tavern talk points to a recently uncovered chart fragment.' }
    ];
    while (state.worldEvents.length < targetCount) {
      const type = choice(types);
      state.worldEvents.push({
        id: uid('event'), ...type,
        x: randInt(12, 88), y: randInt(15, 83),
        expiresAt: now() + randInt(6, 14) * 60 * 1000
      });
    }
    state.lastEventSpawn = now();
  }

  function updateUnlocks(silent = false) {
    D.ports.forEach(port => {
      if (state.resources.renown >= port.unlockRenown && !state.unlockedPorts.includes(port.id)) {
        state.unlockedPorts.push(port.id);
        state.discoveredPorts.push(port.id);
        generateMarket(port.id, true);
        logEvent(`${port.name} has been added to your charts.`, 'unlock');
        if (!silent) toast(`New port discovered: ${port.name}`, 'good');
      }
    });

    D.unlocks.forEach(unlock => {
      if (state.resources.renown >= unlock.renown && !state.unlocksSeen.includes(unlock.id)) {
        state.unlocksSeen.push(unlock.id);
        logEvent(`${unlock.name} unlocked.`, 'unlock');
        if (!silent) toast(`${unlock.name} unlocked`, 'good');
      }
    });
  }

  function checkAchievements() {
    D.achievements.forEach(achievement => {
      if (!state.achievements.includes(achievement.id) && achievement.test(state)) {
        state.achievements.push(achievement.id);
        state.resources.renown += 10;
        logEvent(`Achievement earned: ${achievement.name}.`, 'achievement');
        toast(`Achievement: ${achievement.name} (+10 renown)`, 'good');
      }
    });
  }

  function getMissionTravelDuration(mission, shipIds) {
    const ships = shipIds.map(getShip).filter(Boolean);
    const slowest = Math.min(...ships.map(ship => getShipStat(ship, 'speed')));
    const baseSpeed = D.shipTypes.dinghy.speed;
    let duration = mission.duration * (baseSpeed / Math.max(4, slowest));
    if (shipIds.length > 1) duration *= 1.08;
    return Math.max(10, Math.round(duration));
  }

  function getMissionPower(shipIds) {
    return shipIds.reduce((sum, id) => sum + (getShip(id) ? getShipPower(getShip(id)) : 0), 0);
  }

  function getMissionSuppliesCost(duration, shipIds) {
    return Math.max(1, Math.ceil(duration / 90) * shipIds.length);
  }

  function canAssignShip(ship) {
    return ship && !ship.activeMissionId && ship.hull > getShipMaxHull(ship) * .18 && ship.supplies > 0;
  }

  function assignMission(missionId, shipIds) {
    const mission = getAvailableMission(missionId) || state.bounties.find(b => b.id === missionId)?.mission;
    if (!mission) return;
    const ships = shipIds.map(getShip).filter(Boolean);
    if (!ships.length || ships.some(ship => !canAssignShip(ship))) {
      toast('One or more selected ships are not ready to sail.', 'bad');
      return;
    }
    const duration = state.tutorial.index === 3 && !state.tutorial.complete ? 12 : getMissionTravelDuration(mission, shipIds);
    const suppliesCost = getMissionSuppliesCost(duration, shipIds);
    if (ships.some(ship => ship.supplies < suppliesCost)) {
      toast(`Each ship needs at least ${suppliesCost} supplies.`, 'bad');
      return;
    }
    ships.forEach(ship => {
      ship.supplies -= suppliesCost;
      ship.activeMissionId = null;
      ship.status = `Sailing: ${mission.title}`;
      ship.morale = clamp(ship.morale - 1, 0, 100);
    });
    const activeId = uid('active-mission');
    const startTime = now();
    const active = {
      id: activeId,
      mission: deepClone(mission),
      shipIds: [...shipIds],
      startTime,
      endTime: startTime + duration * 1000,
      duration,
      status: 'underway',
      rewards: null,
      result: null,
      claimed: false,
      combatResolved: false,
      originId: ships[0].locationId || state.currentPortId,
      destinationId: mission.destinationId || choice(state.unlockedPorts),
      autoResolveAt: startTime + duration * 1000 + 3 * 60 * 1000
    };
    ships.forEach(ship => { ship.activeMissionId = activeId; });
    state.activeMissions.push(active);
    state.availableMissions = state.availableMissions.filter(item => item.id !== missionId);
    if (state.expeditionMissions) state.expeditionMissions = state.expeditionMissions.filter(item => item.id !== missionId);
    const bounty = state.bounties.find(item => item.id === missionId);
    if (bounty) bounty.defeated = true;
    logEvent(`${ships.map(s => s.name).join(', ')} departed on ${mission.title}.`, 'mission');
    toast(`${mission.title} is underway.`, 'good');
    closeModal();
    advanceTutorial('assignMission');
    navigate('map');
    renderAll();
    saveGame();
  }

  function calculateMissionRewards(active, success = true) {
    const rewards = {};
    const mission = active.mission;
    const ships = active.shipIds.map(getShip).filter(Boolean);
    const captains = ships.map(ship => getCaptain(ship.captainId)).filter(Boolean);
    const legacyMultiplier = 1 + (state.resources.legacy || 0) * .05;
    Object.entries(mission.rewards).forEach(([key, range]) => {
      let value = randInt(range[0], range[1]);
      if (!success) value = Math.round(value * .28);
      captains.forEach(captain => {
        captain.traits.forEach(traitId => {
          const trait = D.captainTraits[traitId];
          if (mission.category === 'trade' && trait?.tradeReward) value *= 1 + trait.tradeReward;
          if (mission.category === 'combat' && trait?.raidReward) value *= 1 + trait.raidReward;
          if (mission.category === 'salvage' && trait?.salvage) value *= 1 + trait.salvage;
        });
      });
      if (key === 'renown') value *= legacyMultiplier;
      rewards[key] = Math.max(0, Math.round(value));
    });
    if (success && Math.random() < .08 + (state.base.cartographer || 0) * .015) {
      rewards.charts = (rewards.charts || 0) + 1;
    }
    return rewards;
  }

  function applyMissionDamage(active, success = true) {
    const power = getMissionPower(active.shipIds);
    const target = Math.max(1, active.mission.minPower);
    const powerRatio = power / target;
    const reports = [];
    active.shipIds.forEach(shipId => {
      const ship = getShip(shipId);
      if (!ship) return;
      let risk = active.mission.risks?.damage || 0;
      risk *= success ? 1 : 1.55;
      risk *= clamp(1.25 - powerRatio * .25, .45, 1.4);
      const captain = getCaptain(ship.captainId);
      captain?.traits.forEach(traitId => {
        const trait = D.captainTraits[traitId];
        if (trait?.damageReduction) risk *= 1 - trait.damageReduction;
      });
      const maxHull = getShipMaxHull(ship);
      const damage = active.skipRiskDamage ? 0 : (Math.random() < risk ? Math.round(maxHull * rand(.05, success ? .17 : .28)) : 0);
      ship.hull = clamp(ship.hull - damage, 1, maxHull);
      ship.morale = clamp(ship.morale + (success ? randInt(1, 4) : -randInt(8, 16)), 0, 100);
      ship.status = 'Returning to port';
      if (damage) reports.push(`${ship.name} took ${damage} hull damage`);
    });
    return reports;
  }

  function finishMission(active, success = true, reason = '') {
    if (!active || ['complete', 'failed'].includes(active.status)) return;
    const rewards = calculateMissionRewards(active, success);
    const damageReports = applyMissionDamage(active, success);
    active.rewards = rewards;
    active.result = {
      success,
      reason: reason || (success ? 'The voyage succeeded.' : 'The voyage ended in defeat.'),
      damageReports
    };
    active.status = success ? 'complete' : 'failed';
    active.completedAt = now();
    active.shipIds.forEach(shipId => {
      const ship = getShip(shipId);
      if (!ship) return;
      ship.activeMissionId = active.id;
      ship.locationId = active.originId || state.currentPortId;
      ship.status = success ? 'Report ready' : 'Damaged - report ready';
    });
    logEvent(`${active.mission.title} ${success ? 'was completed' : 'failed'}.`, success ? 'mission' : 'danger');
    if (success) toast(`${active.mission.title} completed. Report ready.`, 'good');
    else toast(`${active.mission.title} ended badly.`, 'bad');
    if (state.tutorial.index === 4 && !state.tutorial.complete) advanceTutorial('missionComplete');
  }

  function autoResolveCombat(active) {
    const power = getMissionPower(active.shipIds);
    const target = Math.max(1, active.mission.minPower);
    const policyBonus = state.policies.risk === 'bold' ? .08 : state.policies.risk === 'cautious' ? -.04 : 0;
    const chance = clamp(.48 + (power - target) / Math.max(50, target * 1.7) + policyBonus, .12, .94);
    const success = Math.random() < chance;
    if (success) {
      active.combatCounted = false;
      finishMission(active, true, 'Your captains won the engagement under standing orders.');
    } else {
      state.stats.combatLosses += 1;
      finishMission(active, false, 'The fleet withdrew after taking serious damage.');
    }
    active.combatResolved = true;
  }

  function processMissions(currentTime = now(), offline = false) {
    state.activeMissions.forEach(active => {
      if (active.status === 'underway' && currentTime >= active.endTime) {
        if (active.mission.activeCombat && !active.combatResolved) {
          if (offline || document.hidden || currentTime >= active.autoResolveAt) {
            autoResolveCombat(active);
          } else {
            active.status = 'battleReady';
            active.battleReadyAt = currentTime;
            active.shipIds.forEach(id => {
              const ship = getShip(id);
              if (ship) ship.status = 'Enemy sighted';
            });
            toast(`Enemy sighted during ${active.mission.title}!`, 'bad');
          }
        } else {
          finishMission(active, true);
        }
      } else if (active.status === 'battleReady' && (offline || currentTime >= active.autoResolveAt)) {
        autoResolveCombat(active);
      }
    });
  }

  function claimMission(activeId) {
    const active = getActiveMission(activeId);
    if (!active || !['complete', 'failed'].includes(active.status) || active.claimed) return;
    Object.entries(active.rewards || {}).forEach(([resource, amount]) => {
      state.resources[resource] = (state.resources[resource] || 0) + amount;
      if (resource === 'gold') {
        state.stats.goldEarned += amount;
        if (active.mission.category === 'trade') state.stats.tradeProfit += amount;
      }
    });
    active.shipIds.forEach(shipId => {
      const ship = getShip(shipId);
      if (!ship) return;
      ship.activeMissionId = null;
      ship.status = 'Docked';
      const xpGain = Math.max(10, Math.round((active.mission.minPower + active.duration / 3) * (active.result.success ? 1 : .35)));
      ship.xp += xpGain;
      while (ship.xp >= ship.level * 100) {
        ship.xp -= ship.level * 100;
        ship.level += 1;
        ship.hull = getShipMaxHull(ship);
        toast(`${ship.name} reached level ${ship.level}.`, 'good');
      }
      const captain = getCaptain(ship.captainId);
      if (captain) {
        captain.xp += Math.round(xpGain * .75);
        while (captain.xp >= captain.level * 90) {
          captain.xp -= captain.level * 90;
          captain.level += 1;
          captain.loyalty = clamp(captain.loyalty + 2, 0, 100);
          toast(`${captain.name} reached level ${captain.level}.`, 'good');
        }
      }
    });
    active.claimed = true;
    state.stats.missionsCompleted += 1;
    state.stats.distanceSailed += Math.round(active.duration * .7);
    if (active.result.success && active.mission.category === 'combat' && !active.combatCounted) {
      state.stats.combatWins += 1;
      active.combatCounted = true;
    }
    logEvent(`Collected the report and rewards from ${active.mission.title}.`, 'reward');
    updateUnlocks();
    checkAchievements();
    advanceTutorial('claimMission');
    refreshMissionBoard();
    renderAll();
    saveGame();
  }

  function simulateOffline(elapsedMs) {
    const capped = Math.min(Math.max(0, elapsedMs), MAX_OFFLINE_MS);
    if (capped < 30000) return null;
    const before = deepClone(state.resources);
    const beforeComplete = state.activeMissions.filter(m => ['complete', 'failed'].includes(m.status)).length;
    processMissions(state.lastSeen + capped, true);
    const afterComplete = state.activeMissions.filter(m => ['complete', 'failed'].includes(m.status)).length;
    const upkeepMinutes = Math.floor(capped / 60000);
    let hideoutGold = 0;
    if (state.base.intelligence > 0) {
      hideoutGold = Math.floor(upkeepMinutes * state.base.intelligence * .7);
      state.resources.gold += hideoutGold;
      state.stats.goldEarned += hideoutGold;
    }
    const repairs = Math.floor(upkeepMinutes / 5) * (state.base.shipyard || 0);
    if (repairs > 0) {
      state.ships.filter(ship => !ship.activeMissionId).forEach(ship => {
        ship.hull = Math.min(getShipMaxHull(ship), ship.hull + repairs);
      });
    }
    return {
      elapsed: capped,
      missionsFinished: Math.max(0, afterComplete - beforeComplete),
      hideoutGold,
      resourceChanges: Object.fromEntries(Object.keys(state.resources).map(key => [key, (state.resources[key] || 0) - (before[key] || 0)]).filter(([, value]) => value > 0))
    };
  }

  function getDockedShips(portId = state.currentPortId) {
    return state.ships.filter(ship => !ship.activeMissionId && ship.locationId === portId);
  }

  function buyGood(goodId, amount, shipId) {
    const ship = getShip(shipId);
    const market = state.markets[state.currentPortId];
    const price = market?.prices?.[goodId]?.buy;
    const good = D.goods[goodId];
    if (!ship || !price || !good || ship.activeMissionId || ship.locationId !== state.currentPortId) return;
    const quantity = Math.max(1, Math.floor(amount));
    const cost = price * quantity;
    const cargoSpace = getShipStat(ship, 'cargo') - getCargoUsed(ship);
    if (state.resources.gold < cost) return toast('You do not have enough gold.', 'bad');
    if (cargoSpace < good.weight * quantity) return toast('That ship does not have enough cargo space.', 'bad');
    state.resources.gold -= cost;
    ship.cargo[goodId] = (ship.cargo[goodId] || 0) + quantity;
    logEvent(`Bought ${quantity} ${good.name} at ${getPort(state.currentPortId).name}.`, 'trade');
    renderAll();
  }

  function sellGood(goodId, amount, shipId) {
    const ship = getShip(shipId);
    const market = state.markets[state.currentPortId];
    const price = market?.prices?.[goodId]?.sell;
    const good = D.goods[goodId];
    if (!ship || !price || !good || ship.activeMissionId || ship.locationId !== state.currentPortId) return;
    const quantity = clamp(Math.floor(amount), 1, ship.cargo[goodId] || 0);
    if (!quantity) return toast(`There is no ${good.name} aboard.`, 'bad');
    const revenue = price * quantity;
    ship.cargo[goodId] -= quantity;
    if (ship.cargo[goodId] <= 0) delete ship.cargo[goodId];
    state.resources.gold += revenue;
    state.stats.goldEarned += revenue;
    state.stats.tradeProfit += revenue;
    logEvent(`Sold ${quantity} ${good.name} for ${revenue} gold.`, 'trade');
    checkAchievements();
    renderAll();
  }

  function repairShip(shipId) {
    const ship = getShip(shipId);
    if (!ship || ship.activeMissionId) return;
    const missing = getShipMaxHull(ship) - ship.hull;
    if (missing <= 0) return toast('That ship is already fully repaired.');
    const discount = 1 - (state.base.shipyard || 0) * .05;
    const cost = Math.max(1, Math.ceil(missing * .7 * discount));
    if (state.resources.gold < cost) return toast(`Repairs require ${cost} gold.`, 'bad');
    state.resources.gold -= cost;
    ship.hull = getShipMaxHull(ship);
    ship.status = 'Docked';
    toast(`${ship.name} repaired for ${cost} gold.`, 'good');
    logEvent(`${ship.name} was repaired at ${getPort(ship.locationId)?.name || 'port'}.`, 'fleet');
    renderAll();
  }

  function resupplyShip(shipId) {
    const ship = getShip(shipId);
    if (!ship || ship.activeMissionId) return;
    const max = Math.round(getShipStat(ship, 'supplies'));
    const missing = max - ship.supplies;
    if (missing <= 0) return toast('That ship is fully supplied.');
    const fromStores = Math.min(missing, state.resources.provisions || 0);
    const remaining = missing - fromStores;
    const goldCost = remaining * 3;
    if (state.resources.gold < goldCost) return toast(`You need ${goldCost} gold or more stored provisions.`, 'bad');
    state.resources.provisions -= fromStores;
    state.resources.gold -= goldCost;
    ship.supplies = max;
    toast(`${ship.name} resupplied.`, 'good');
    renderAll();
  }

  function buyShip(typeId) {
    const type = D.shipTypes[typeId];
    if (!type || state.resources.renown < type.unlockRenown) return;
    const maxShips = 2 + (state.base.dock || 0) * 2;
    if (state.ships.length >= maxShips) return toast(`Upgrade the Hidden Dock to command more than ${maxShips} ships.`, 'bad');
    const discount = 1 - (state.base.shipyard || 0) * .04;
    const cost = Math.round(type.cost * discount);
    if (state.resources.gold < cost) return toast(`You need ${formatNumber(cost)} gold.`, 'bad');
    state.resources.gold -= cost;
    const id = uid('ship');
    const names = ['Wayward Gull', 'Salt Wraith', 'Crimson Wake', 'Last Argument', 'Black Minnow', 'Sea Lantern', 'Broken Crown', 'Mercyless'];
    const ship = {
      id,
      name: choice(names.filter(name => !state.ships.some(s => s.name === name)) || names),
      typeId,
      level: 1,
      xp: 0,
      hull: type.hull,
      morale: 68,
      supplies: Math.round(type.supplies * .55),
      locationId: state.currentPortId,
      captainId: null,
      crew: { sailor: Math.max(2, Math.floor(type.crew * .3)) },
      cargo: {},
      upgrades: {},
      activeMissionId: null,
      fleetId: null,
      status: 'Awaiting captain'
    };
    state.ships.push(ship);
    state.selectedShipId = id;
    state.marketShipId = id;
    logEvent(`Purchased the ${type.name} ${ship.name}.`, 'fleet');
    toast(`${ship.name} has joined your fleet.`, 'good');
    updateUnlocks();
    checkAchievements();
    renderAll();
  }

  function recruitCrew(roleId, shipId, amount = 1) {
    const role = D.crewRoles[roleId];
    const ship = getShip(shipId);
    if (!role || !ship || ship.activeMissionId) return;
    const quantity = Math.max(1, Math.floor(amount));
    const capacity = getShipType(ship).crew;
    if (getCrewCount(ship) + quantity > capacity) return toast(`${ship.name} has no room for that many crew.`, 'bad');
    const tavernDiscount = 1 - (state.base.tavern || 0) * .03;
    const cost = Math.round(role.cost * quantity * tavernDiscount);
    if (state.resources.gold < cost) return toast(`Recruitment costs ${cost} gold.`, 'bad');
    state.resources.gold -= cost;
    ship.crew[roleId] = (ship.crew[roleId] || 0) + quantity;
    ship.morale = clamp(ship.morale + Math.min(3, quantity), 0, 100);
    state.stats.crewRecruited += quantity;
    logEvent(`${quantity} ${role.name}${quantity > 1 ? 's' : ''} joined ${ship.name}.`, 'crew');
    toast(`${role.name} recruited.`, 'good');
    renderAll();
  }

  function hireCaptain(candidateId) {
    const candidate = state.availableCaptains.find(c => c.id === candidateId);
    if (!candidate) return;
    if (state.resources.gold < candidate.cost) return toast(`Hiring ${candidate.name} costs ${candidate.cost} gold.`, 'bad');
    state.resources.gold -= candidate.cost;
    candidate.hired = true;
    state.captains.push(candidate);
    state.availableCaptains = state.availableCaptains.filter(c => c.id !== candidateId);
    generateCaptains();
    logEvent(`${candidate.name} signed the articles.`, 'crew');
    toast(`${candidate.name} joined your captains.`, 'good');
    renderAll();
  }

  function assignCaptain(captainId, shipId) {
    const captain = getCaptain(captainId);
    const ship = getShip(shipId);
    if (!captain || !ship || ship.activeMissionId) return;
    if (captain.assignedShipId) {
      const previous = getShip(captain.assignedShipId);
      if (previous) previous.captainId = null;
    }
    if (ship.captainId) {
      const displaced = getCaptain(ship.captainId);
      if (displaced) displaced.assignedShipId = null;
    }
    captain.assignedShipId = ship.id;
    ship.captainId = captain.id;
    ship.status = 'Docked';
    toast(`${captain.name} now commands ${ship.name}.`, 'good');
    renderAll();
  }

  function upgradeShip(shipId, upgradeId) {
    const ship = getShip(shipId);
    const upgrade = D.shipUpgrades[upgradeId];
    if (!ship || !upgrade || ship.activeMissionId) return;
    const level = ship.upgrades[upgradeId] || 0;
    if (level >= upgrade.max) return;
    const cost = Math.round(upgrade.baseCost * Math.pow(1.65, level) * (1 - (state.base.shipyard || 0) * .04));
    const resourceCost = Math.round(upgrade.resourceCost * Math.pow(1.35, level));
    if (state.resources.gold < cost || (state.resources[upgrade.resource] || 0) < resourceCost) {
      return toast(`Requires ${cost} gold and ${resourceCost} ${D.resources[upgrade.resource]?.name || upgrade.resource}.`, 'bad');
    }
    state.resources.gold -= cost;
    state.resources[upgrade.resource] -= resourceCost;
    const oldMaxHull = getShipMaxHull(ship);
    ship.upgrades[upgradeId] = level + 1;
    if (upgrade.stat === 'hull') ship.hull += getShipMaxHull(ship) - oldMaxHull;
    logEvent(`${ship.name} received ${upgrade.name} level ${level + 1}.`, 'fleet');
    toast(`${upgrade.name} upgraded.`, 'good');
    renderAll();
  }

  function upgradeBase(upgradeId) {
    const upgrade = D.baseUpgrades[upgradeId];
    if (!upgrade || state.resources.renown < upgrade.unlockRenown) return;
    const level = state.base[upgradeId] || 0;
    if (level >= upgrade.max) return;
    const goldCost = Math.round(upgrade.baseCost * Math.pow(1.75, level));
    const resourceCost = Math.round(upgrade.resourceCost * Math.pow(1.45, level));
    if (state.resources.gold < goldCost || (upgrade.resource !== 'gold' && (state.resources[upgrade.resource] || 0) < resourceCost)) {
      const resourceText = upgrade.resource === 'gold' ? '' : ` and ${resourceCost} ${D.resources[upgrade.resource]?.name || upgrade.resource}`;
      return toast(`Requires ${goldCost} gold${resourceText}.`, 'bad');
    }
    state.resources.gold -= goldCost;
    if (upgrade.resource !== 'gold') state.resources[upgrade.resource] -= resourceCost;
    state.base[upgradeId] = level + 1;
    logEvent(`${upgrade.name} advanced to level ${level + 1}.`, 'base');
    toast(`${upgrade.name} upgraded.`, 'good');
    generateCaptains(true);
    refreshMissionBoard(true);
    spawnWorldEvent(true);
    renderAll();
  }

  function createFleet(name, shipIds, flagshipId) {
    const validIds = shipIds.filter(id => {
      const ship = getShip(id);
      return ship && !ship.activeMissionId && !ship.fleetId;
    });
    if (validIds.length < 2) return toast('A fleet needs at least two available ships.', 'bad');
    const maxSize = 3 + (state.base.council || 0) * 2;
    if (validIds.length > maxSize) return toast(`Your council currently supports fleets of up to ${maxSize} ships.`, 'bad');
    const id = uid('fleet');
    const fleet = {
      id,
      name: name.trim() || `Fleet ${state.fleets.length + 1}`,
      shipIds: validIds,
      flagshipId: validIds.includes(flagshipId) ? flagshipId : validIds[0],
      formation: 'line',
      doctrine: 'balanced'
    };
    validIds.forEach(shipId => { getShip(shipId).fleetId = id; });
    state.fleets.push(fleet);
    closeModal();
    toast(`${fleet.name} formed under one banner.`, 'good');
    logEvent(`${fleet.name} was formed with ${validIds.length} ships.`, 'fleet');
    renderAll();
  }

  function disbandFleet(fleetId) {
    const fleet = getFleet(fleetId);
    if (!fleet) return;
    fleet.shipIds.forEach(id => { const ship = getShip(id); if (ship) ship.fleetId = null; });
    state.fleets = state.fleets.filter(f => f.id !== fleetId);
    toast(`${fleet.name} disbanded.`);
    renderAll();
  }

  function setFleetFormation(fleetId, formation) {
    const fleet = getFleet(fleetId);
    if (!fleet) return;
    fleet.formation = formation;
    toast(`${fleet.name} adopted ${titleCase(formation)} formation.`, 'good');
    renderAll();
  }

  function getStoryProgress(chapter) {
    switch (chapter.id) {
      case 1: return state.stats.missionsCompleted;
      case 2: return state.stats.crewRecruited;
      case 3: return state.stats.combatWins;
      case 4: return state.ships.length;
      case 5: return Object.values(state.base).reduce((sum, value) => sum + value, 0);
      case 6: return state.stats.combatWins;
      case 7: return Math.max(0, ...state.fleets.map(f => f.shipIds.length));
      case 8: return state.resources.renown;
      default: return 0;
    }
  }

  function claimStory(chapterId) {
    const chapter = D.storyChapters.find(c => c.id === chapterId);
    if (!chapter || state.storyClaimed.includes(chapterId) || getStoryProgress(chapter) < chapter.target) return;
    Object.entries(chapter.reward).forEach(([key, value]) => { state.resources[key] = (state.resources[key] || 0) + value; });
    state.storyClaimed.push(chapterId);
    logEvent(`Chronicle chapter completed: ${chapter.title}.`, 'story');
    toast(`Chapter complete: ${chapter.title}`, 'good');
    updateUnlocks();
    renderAll();
  }

  function claimDaily() {
    const today = getTodayKey();
    if (state.daily.lastClaim === today) return;
    const gap = daysBetweenKeys(state.daily.lastClaim, today);
    state.daily.streak = gap === 1 ? state.daily.streak + 1 : 1;
    state.daily.lastClaim = today;
    const reward = 80 + Math.min(7, state.daily.streak) * 35 + getRank().renown * .02;
    const gold = Math.round(reward);
    state.resources.gold += gold;
    state.resources.provisions += 4 + Math.min(7, state.daily.streak);
    state.stats.goldEarned += gold;
    toast(`Captain's share claimed: ${gold} gold.`, 'good');
    logEvent(`Claimed day ${state.daily.streak} of the returning captain reward.`, 'reward');
    renderAll();
  }

  function performLegacy() {
    if (!systemUnlock('legacy')) return;
    const marks = Math.max(1, Math.floor(state.resources.renown / 8000));
    const old = state;
    const fresh = createStarterState();
    fresh.resources.legacy = (old.resources.legacy || 0) + marks;
    fresh.resources.gold += fresh.resources.legacy * 250;
    fresh.resources.renown = fresh.resources.legacy * 10;
    fresh.stats.legacies = (old.stats.legacies || 0) + 1;
    fresh.achievements = [...old.achievements];
    fresh.playerName = old.playerName;
    fresh.captains[0].name = old.playerName;
    fresh.tutorial = { index: D.tutorialSteps.length - 1, complete: true, dismissed: true };
    fresh.log.unshift({ id: uid('log'), time: now(), text: `A new legend began with ${marks} additional Legacy Mark${marks === 1 ? '' : 's'}.`, type: 'legacy' });
    state = fresh;
    refreshMissionBoard(true);
    refreshAllMarkets(true);
    saveGame();
    closeModal();
    renderAll();
    toast(`A new legend begins with ${marks} Legacy Mark${marks === 1 ? '' : 's'}.`, 'good');
  }

  function startCombat(activeId) {
    const active = getActiveMission(activeId);
    if (!active || active.status !== 'battleReady') return;
    const ships = active.shipIds.map(getShip).filter(Boolean);
    const playerPower = getMissionPower(active.shipIds);
    const playerHull = ships.reduce((sum, ship) => sum + ship.hull, 0);
    const enemyPower = Math.max(12, Math.round(active.mission.minPower * rand(.9, 1.12)));
    const enemyHull = Math.max(60, Math.round(enemyPower * 5.2));
    activeCombat = {
      missionId: active.id,
      playerPower,
      enemyPower,
      playerHull,
      playerMaxHull: ships.reduce((sum, ship) => sum + getShipMaxHull(ship), 0),
      enemyHull,
      enemyMaxHull: enemyHull,
      enemyAccuracy: 1,
      brace: false,
      turn: 1,
      cooldowns: { chain: 0, repair: 0, board: 0 },
      log: ['Enemy sails on the horizon. Your crews await orders.'],
      ended: false
    };
    openCombatModal();
  }

  function combatLog(text) {
    if (!activeCombat) return;
    activeCombat.log.unshift(text);
    activeCombat.log = activeCombat.log.slice(0, 12);
  }

  function enemyCombatTurn() {
    if (!activeCombat || activeCombat.ended) return;
    const c = activeCombat;
    let damage = Math.round(c.enemyPower * rand(.23, .4) * c.enemyAccuracy);
    if (c.brace) {
      damage = Math.round(damage * .42);
      c.brace = false;
      combatLog('Braced crews absorb much of the incoming broadside.');
    }
    c.playerHull = Math.max(0, c.playerHull - damage);
    combatLog(`The enemy broadside deals ${damage} damage.`);
    if (c.playerHull <= 0) {
      endCombat(false, 'Your battered ships break away before they are lost entirely.');
      return;
    }
    Object.keys(c.cooldowns).forEach(key => { c.cooldowns[key] = Math.max(0, c.cooldowns[key] - 1); });
    c.turn += 1;
  }

  function combatAction(action) {
    if (!activeCombat || activeCombat.ended) return;
    const c = activeCombat;
    state.stats.activeCommands += 1;
    if (action === 'fire') {
      const damage = Math.round(c.playerPower * rand(.35, .55));
      c.enemyHull = Math.max(0, c.enemyHull - damage);
      combatLog(`Your broadsides smash the enemy hull for ${damage} damage.`);
    } else if (action === 'chain') {
      if (c.cooldowns.chain > 0) return;
      const damage = Math.round(c.playerPower * rand(.18, .3));
      c.enemyHull = Math.max(0, c.enemyHull - damage);
      c.enemyAccuracy = Math.max(.58, c.enemyAccuracy - .13);
      c.cooldowns.chain = 3;
      combatLog(`Chain shot tears through rigging for ${damage} damage and reduces enemy accuracy.`);
    } else if (action === 'brace') {
      c.brace = true;
      combatLog('Crews brace behind the gunwales for the next attack.');
    } else if (action === 'repair') {
      if (c.cooldowns.repair > 0) return;
      const timberCost = 2;
      if (state.resources.timber < timberCost) return toast('Emergency repairs require 2 timber.', 'bad');
      state.resources.timber -= timberCost;
      const repair = Math.round(c.playerMaxHull * .12);
      c.playerHull = Math.min(c.playerMaxHull, c.playerHull + repair);
      c.cooldowns.repair = 4;
      combatLog(`Carpenters restore ${repair} hull at the cost of 2 timber.`);
    } else if (action === 'board') {
      if (c.cooldowns.board > 0) return;
      if (c.enemyHull / c.enemyMaxHull > .38) return toast('Weaken the enemy below 38% hull before boarding.', 'bad');
      const ships = getActiveMission(c.missionId).shipIds.map(getShip).filter(Boolean);
      const boarding = ships.reduce((sum, ship) => sum + getShipStat(ship, 'boarding'), 0);
      const chance = clamp(.38 + (boarding - c.enemyPower) / Math.max(80, c.enemyPower * 2), .18, .88);
      if (Math.random() < chance) {
        combatLog('Hooks catch, marines surge across and the enemy colours come down!');
        c.enemyHull = 0;
        endCombat(true, 'The enemy ship was taken by boarding. The prize crew found extra valuables.', true);
        return;
      }
      c.cooldowns.board = 3;
      combatLog('The boarding attempt is repelled with heavy resistance.');
    } else if (action === 'retreat') {
      endCombat(false, 'You ordered a withdrawal before the fleet could be destroyed.');
      return;
    }

    if (c.enemyHull <= 0) {
      endCombat(true, 'The enemy vessel is reduced to a drifting wreck.');
      return;
    }
    enemyCombatTurn();
    renderCombatModal();
  }

  function endCombat(success, reason, captured = false) {
    const c = activeCombat;
    if (!c) return;
    c.ended = true;
    const active = getActiveMission(c.missionId);
    if (!active) return;
    const hullRatio = c.playerHull / Math.max(1, c.playerMaxHull);
    active.shipIds.forEach(shipId => {
      const ship = getShip(shipId);
      if (!ship) return;
      ship.hull = Math.max(1, Math.round(getShipMaxHull(ship) * hullRatio));
    });
    active.combatResolved = true;
    if (success) {
      active.combatCounted = false;
      if (captured) {
        active.mission.rewards.gold[0] = Math.round(active.mission.rewards.gold[0] * 1.25);
        active.mission.rewards.gold[1] = Math.round(active.mission.rewards.gold[1] * 1.35);
        state.stats.shipsCaptured += 1;
      }
      active.skipRiskDamage = true;
      finishMission(active, true, reason);
    } else {
      state.stats.combatLosses += 1;
      active.skipRiskDamage = true;
      finishMission(active, false, reason);
    }
    window.setTimeout(() => {
      closeModal();
      activeCombat = null;
      navigate('missions');
      state.missionTab = 'active';
      renderAll();
    }, 700);
    renderCombatModal();
  }

  function openCombatModal() {
    const root = $('#modalRoot');
    root.innerHTML = `
      <div class="modal-backdrop"></div>
      <section class="modal-card" role="dialog" aria-modal="true">
        <header class="modal-header"><div><p class="eyebrow">Naval engagement</p><h3>${escapeHtml(getActiveMission(activeCombat.missionId)?.mission.title || 'Battle')}</h3></div></header>
        <div class="modal-body" id="combatModalBody"></div>
      </section>`;
    renderCombatModal();
  }

  function renderCombatModal() {
    const body = $('#combatModalBody');
    if (!body || !activeCombat) return;
    const c = activeCombat;
    const playerPct = clamp((c.playerHull / c.playerMaxHull) * 100, 0, 100);
    const enemyPct = clamp((c.enemyHull / c.enemyMaxHull) * 100, 0, 100);
    body.innerHTML = `
      <div class="combat-stage">
        <div class="stat-grid">
          <div class="stat"><label>Your fleet</label><strong>${Math.ceil(c.playerHull)} / ${c.playerMaxHull} hull</strong><div class="progress"><span style="width:${playerPct}%"></span></div></div>
          <div class="stat"><label>Enemy</label><strong>${Math.ceil(c.enemyHull)} / ${c.enemyMaxHull} hull</strong><div class="progress"><span style="width:${enemyPct}%"></span></div></div>
        </div>
        <div class="combat-sea"><div class="combat-ship player">${getShipType(getShip(getActiveMission(c.missionId).shipIds[0])).icon}</div><div class="combat-ship enemy">🛳</div></div>
        <div class="combat-log">${c.log.map(line => `<div>• ${escapeHtml(line)}</div>`).join('')}</div>
        ${c.ended ? `<div class="card" style="margin-top:12px"><h3>${c.playerHull > 0 && c.enemyHull <= 0 ? 'Victory' : 'Engagement Ended'}</h3><p>The battle report is being prepared.</p></div>` : `
        <div class="combat-controls">
          <button class="primary-button" data-combat="fire">💥 Broadside</button>
          <button class="ghost-button ${c.cooldowns.chain ? 'cooldown' : ''}" data-combat="chain" ${c.cooldowns.chain ? 'disabled' : ''}>⛓ Chain Shot${c.cooldowns.chain ? ` (${c.cooldowns.chain})` : ''}</button>
          <button class="ghost-button" data-combat="brace">🛡 Brace</button>
          <button class="ghost-button ${c.cooldowns.repair ? 'cooldown' : ''}" data-combat="repair" ${c.cooldowns.repair ? 'disabled' : ''}>🔨 Repair${c.cooldowns.repair ? ` (${c.cooldowns.repair})` : ''}</button>
          <button class="ghost-button ${c.enemyHull / c.enemyMaxHull > .38 || c.cooldowns.board ? 'cooldown' : ''}" data-combat="board" ${c.enemyHull / c.enemyMaxHull > .38 || c.cooldowns.board ? 'disabled' : ''}>⚔ Board</button>
          <button class="danger-button" data-combat="retreat">↩ Retreat</button>
        </div>`}
      </div>`;
  }

  function openModal(title, content, options = {}) {
    const root = $('#modalRoot');
    root.innerHTML = `
      <div class="modal-backdrop" data-close-modal></div>
      <section class="modal-card ${options.className || ''}" role="dialog" aria-modal="true">
        <header class="modal-header"><div><p class="eyebrow">${escapeHtml(options.eyebrow || 'Tidebound')}</p><h3>${escapeHtml(title)}</h3></div><button class="icon-button" data-close-modal aria-label="Close">×</button></header>
        <div class="modal-body">${content}</div>
      </section>`;
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
