name: Release Build 12.218

on:
  push:
    paths:
      - '.github/triggers/release-12.218.txt'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply release patch
        run: python3 .github/scripts/release-12.218.py
      - name: Build twice deterministically
        working-directory: strikewatch-source
        run: |
          python3 build.py
          cp dist/strikewatch-build-12.218.html /tmp/build1.html
          python3 build.py
          cmp /tmp/build1.html dist/strikewatch-build-12.218.html
      - name: Parse JavaScript
        run: |
          node --check strikewatch-source/js/strikewatch.dev.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('strikewatch-source/dist/strikewatch-build-12.218.html').read_text()
          scripts='\n'.join(re.findall(r'<script>(.*?)</script>',html,re.S))
          Path('/tmp/standalone.js').write_text(scripts)
          PY
          node --check /tmp/standalone.js
      - name: Verify targeted changes
        run: |
          grep -q 'league-section-jumps' strikewatch-source/js/37-league.js
          grep -q "clubEndDayBlockers().length" strikewatch-source/js/50-ui-menus.js
          grep -q "label: 'LOADOUTS'" strikewatch-source/js/50-ui-menus.js
          grep -q '12.218.0-mobile-information-architecture' strikewatch-source/RELEASE.json
      - name: Publish standalone
        run: |
          cp strikewatch-source/dist/strikewatch-build-12.218.html cod.html
          cmp cod.html strikewatch-source/dist/strikewatch-build-12.218.html
      - name: Remove temporary release files
        run: |
          rm -f .github/scripts/release-12.218.py .github/workflows/release-12.218.yml .github/triggers/release-12.218.txt
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build 12.218: Mobile Information Architecture'
          git push
