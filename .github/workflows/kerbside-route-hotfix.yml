name: Fix Kerbside train route observer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/kerbside-route-hotfix.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  fix:
    if: github.head_ref == 'agent/kerbside-train-route-filter'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Fix destination empty-state observer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('kerbside-train-routes.js')
          text = path.read_text(encoding='utf-8')
          old = """  const strong = empty.querySelector('strong');
  const span = empty.querySelector('span');
  if(strong) strong.textContent = `No direct trains to ${routeState.destination.name || routeState.destination.crs}`;
  if(span) span.textContent = 'No upcoming direct service was returned in the current departure window. Clear the destination to see all trains.';
"""
          new = """  const strong = empty.querySelector('strong');
  const span = empty.querySelector('span');
  if(!strong || strong.textContent.trim() !== 'No departures reported') return;
  strong.textContent = `No direct trains to ${routeState.destination.name || routeState.destination.crs}`;
  const message = 'No upcoming direct service was returned in the current departure window. Clear the destination to see all trains.';
  if(span && span.textContent !== message) span.textContent = message;
"""
          if old not in text:
              raise SystemExit('Expected route empty-state block not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          node --check kerbside-train-routes.js
          git diff --check -- kerbside-train-routes.js

      - name: Commit observer fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kerbside-train-routes.js
          git commit -m 'Fix train route empty-state observer loop'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
