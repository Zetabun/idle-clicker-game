name: Diagnose Build 12.223 Final

on:
  push:
    paths:
      - '.github/triggers/diagnose-12.223-final.txt'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run exact release gates
        shell: bash
        run: |
          set +e
          OUT=/tmp/diagnose-12.223-final.txt
          : > "$OUT"
          run_gate() {
            name="$1"
            shift
            echo "=== ${name} ===" >> "$OUT"
            "$@" >> "$OUT" 2>&1
            code=$?
            echo "exit=${code}" >> "$OUT"
            return 0
          }
          python3 - <<'PY' >> "$OUT" 2>&1
          from pathlib import Path
          path = Path('.github/scripts/release-12.223.py')
          text = path.read_text(encoding='utf-8')
          old = "if css_text.count('@media') != 483:"
          new = "if css_text.count('@media') != 10:"
          print('anchor_count=', text.count(old))
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          run_gate patch python3 .github/scripts/release-12.223.py
          run_gate build1 bash -lc 'cd strikewatch-source && python3 build.py'
          cp strikewatch-source/js/strikewatch.dev.js /tmp/first.js 2>> "$OUT"
          cp strikewatch-source/dist/strikewatch-build-12.223.html /tmp/first.html 2>> "$OUT"
          run_gate build2 bash -lc 'cd strikewatch-source && python3 build.py'
          run_gate bundle_cmp cmp /tmp/first.js strikewatch-source/js/strikewatch.dev.js
          run_gate standalone_cmp cmp /tmp/first.html strikewatch-source/dist/strikewatch-build-12.223.html
          echo '=== node checks ===' >> "$OUT"
          for file in strikewatch-source/js/*.js; do
            node --check "$file" >> "$OUT" 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then echo "node_fail=${file}:${code}" >> "$OUT"; fi
          done
          echo 'node_checks_done=1' >> "$OUT"
          python3 - <<'PY' >> "$OUT" 2>&1
          from pathlib import Path
          import json, re
          html = Path('strikewatch-source/dist/strikewatch-build-12.223.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S)
          print('inline_scripts=', len(scripts))
          for index, script in enumerate(scripts):
              Path(f'/tmp/standalone-final-{index}.js').write_text(script, encoding='utf-8')
          css = Path('strikewatch-source/css/compact-navigation.css').read_text(encoding='utf-8')
          debt = json.loads(Path('strikewatch-source/dist/strikewatch-build-12.223-css-debt.json').read_text(encoding='utf-8'))
          print('compact_media=', css.count('@media'))
          print('total_media=', debt.get('media_queries'))
          print('within_budget=', debt.get('within_budget'))
          print('marker=', 'Build 12.223: desktop MUST RESPOND disclosure correction' in css)
          print('build_id=', '12.223.0-desktop-must-respond-layout' in html)
          PY
          echo '=== inline node checks ===' >> "$OUT"
          for file in /tmp/standalone-final-*.js; do
            node --check "$file" >> "$OUT" 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then echo "inline_node_fail=${file}:${code}" >> "$OUT"; fi
          done
          git reset --hard HEAD
          mkdir -p .github/diagnostics
          cp "$OUT" .github/diagnostics/12.223-final.txt
          rm .github/workflows/diagnose-12.223-final.yml
          rm .github/triggers/diagnose-12.223-final.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Diagnose Build 12.223 final gates"
          git push origin main
