name: Release Kerbside 0.6.69

on:
  push:
    paths:
      - .github/triggers/release-kerbside-0.6.69.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-kerbside-0.6.69
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run, verify and publish release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          LOG="$RUNNER_TEMP/kerbside-0.6.69.log"
          {
            set -euxo pipefail
            grep -q "const APP_VERSION = '0.6.68';" bus.html
            node -e "const p=require('./kerbside-backend/package.json'); if(p.version!=='0.6.68') process.exit(1)"
            grep -q "version: '0.6.68'" kerbside-backend/src/worker.js
            sed -i 's/version_occurrences < 2/version_occurrences < 1/' .github/scripts/release-kerbside-0.6.69.py
            python3 .github/scripts/release-kerbside-0.6.69.py
            python3 -c "from pathlib import Path; p=Path('kerbside-backend/tests/browser-regression.mjs'); s=p.read_text(); p.write_text(s.replace(r'0\\.6\\.68', r'0\\.6\\.69'))"
            python3 - <<'PY'
          from pathlib import Path
          path=Path('bus.html')
          text=path.read_text()
          replacements=[
              (
                  "    if(usedSlots.has(slot)||!track||track.signature!==signature) continue;\n    const age=Math.max(0,(now-Number(track.ts||0))/1000);\n    const maxMove=Math.min(LIVE_ANONYMOUS_MATCH_MAX_METRES,Math.max(120,age*30+80));",
                  "    if(!track||track.signature!==signature) continue;\n    const elapsed=(Number(record.ts)-Number(track.ts))/1000;\n    if(!(elapsed>=8&&elapsed<=90)) continue;\n    const maxMove=Math.min(LIVE_ANONYMOUS_MATCH_MAX_METRES,Math.max(120,elapsed*30+80));"
              ),
              (
                  "String(a.dest||'').localeCompare(String(b.dest||''))||Number(a.lat)-Number(b.lat)||Number(a.lon)-Number(b.lon)",
                  "String(a.dest||'').localeCompare(String(b.dest||''))||Number(a.ts)-Number(b.ts)||Number(a.lat)-Number(b.lat)||Number(a.lon)-Number(b.lon)"
              ),
              (
                  "const known=LIVE_ID_ACTIVITIES.get(baseId),split=records.length>1||!!(known&&known.size>1)||LIVE_ID_COLLISIONS.has(baseId);",
                  "const identities=new Set(identityByRecord.values()),known=LIVE_ID_ACTIVITIES.get(baseId),split=identities.size>1||!!(known&&known.size>1)||LIVE_ID_COLLISIONS.has(baseId);"
              ),
              (
                  "identityCollisions+=Math.max(0,records.length-1,(known?known.size:0)-1);",
                  "identityCollisions+=Math.max(0,identities.size-1,(known?known.size:0)-1);"
              )
          ]
          for old,new in replacements:
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'anonymous reconciliation patch expected one match, found {count}: {old[:60]}')
              text=text.replace(old,new,1)
          path.write_text(text)
          PY
            cd kerbside-backend
            npm install
            npx playwright install --with-deps webkit
            npm run check
            npm test
            npm run test:browser
            node tests/multi-vehicle-regression.mjs
            node tests/identity-regression.mjs
            npm run check
            npm test
            npm run test:browser
            node tests/multi-vehicle-regression.mjs
            node tests/identity-regression.mjs
            npx wrangler deploy
            cd ..
            python3 - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen('https://kerbside-bus.adambullas.workers.dev/health', timeout=20) as response:
              data=json.load(response)
          assert data.get('ok') is True, data
          assert data.get('version') == '0.6.69', data
          assert data.get('bodsKeyConfigured') is True, data
          print(data)
          PY
          } 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$STATUS" -ne 0 ]; then
            cp "$LOG" .github/kerbside-0.6.69-failure.log
            git add .github/kerbside-0.6.69-failure.log
            git commit -m "Record Kerbside 0.6.69 release failure" || true
            git push origin HEAD:main
            exit "$STATUS"
          fi
          rm -f .github/kerbside-0.6.69-failure.log
          rm -f .github/scripts/release-kerbside-0.6.69.py
          rm -f .github/workflows/release-kerbside-0.6.69.yml
          rm -f .github/triggers/release-kerbside-0.6.69.txt
          git add bus.html kerbside-backend .github
          git commit -m "Release Kerbside 0.6.69"
          git push origin HEAD:main
