name: Release Strikewatch 12.157

on:
  pull_request:
    types: [closed]
    paths:
      - '.github/release-12.157-trigger'

permissions:
  contents: write

concurrency:
  group: strikewatch-release-12-157
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: agent/operator-depth-mobile-armoury-12.157
          fetch-depth: 0

      - name: Apply reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/build-12.157.patch.b64.* | base64 --decode > /tmp/build-12.157.patch
          git apply --check /tmp/build-12.157.patch
          git apply /tmp/build-12.157.patch
          rm -f .github/build-12.157.patch.b64.*

      - name: Validate source and build twice
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          cd strikewatch-source
          python3 -m py_compile build.py
          python3 build.py
          for file in js/*.js; do node --check "$file"; done
          node --check js/strikewatch.dev.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('dist/strikewatch-build-12.157.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('No inline application script found')
          Path('/tmp/strikewatch-12.157-inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/strikewatch-12.157-inline.js
          cp js/strikewatch.dev.js /tmp/strikewatch.dev.first.js
          cp dist/strikewatch-build-12.157.html /tmp/strikewatch-12.157.first.html
          first_bundle=$(sha256sum js/strikewatch.dev.js | cut -d' ' -f1)
          first_standalone=$(sha256sum dist/strikewatch-build-12.157.html | cut -d' ' -f1)
          python3 build.py
          cmp -s /tmp/strikewatch.dev.first.js js/strikewatch.dev.js
          cmp -s /tmp/strikewatch-12.157.first.html dist/strikewatch-build-12.157.html
          second_bundle=$(sha256sum js/strikewatch.dev.js | cut -d' ' -f1)
          second_standalone=$(sha256sum dist/strikewatch-build-12.157.html | cut -d' ' -f1)
          test "$first_bundle" = "$second_bundle"
          test "$first_standalone" = "$second_standalone"
          test "$second_bundle" = "bf9d42abc2592c721c71348b660dc9c4b5c6377b5389273a64385a7f32f23b70"
          test "$second_standalone" = "a1a1dbfc4a40bc865e99812f161c98113c4f830557d92048a93c770cdb170e17"
          cp dist/strikewatch-build-12.157.html ../cod.html
          cmp -s dist/strikewatch-build-12.157.html ../cod.html
          echo "bundle_sha=$second_bundle" >> "$GITHUB_OUTPUT"
          echo "standalone_sha=$second_standalone" >> "$GITHUB_OUTPUT"

      - name: Run targeted source invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('strikewatch-source')
          renderer = (root / 'js/62-character-renderer.js').read_text(encoding='utf-8')
          css = (root / 'css/game.css').read_text(encoding='utf-8')
          core = (root / 'js/00-core.js').read_text(encoding='utf-8')
          index = (root / 'index.html').read_text(encoding='utf-8')
          audit = (root / 'AUDIT-12.157.md').read_text(encoding='utf-8')

          required_renderer = [
              'OPERATOR_AMBIENT_OCCLUSION',
              'operatorAmbientOcclusionAudit',
              'additionalDrawCalls: 0',
              'additionalMeshes: 0',
              'additionalTextures: 0',
              'additionalShaderPasses: 0',
              'sharedLivingAndCorpsePalette: true'
          ]
          for token in required_renderer:
              if token not in renderer:
                  raise SystemExit(f'Missing renderer invariant: {token}')

          required_css = [
              'Build 12.157: compact Armoury inventory reflow',
              'grid-template-areas:',
              'writing-mode: horizontal-tb',
              '#menuContent .career-inventory-compare'
          ]
          for token in required_css:
              if token not in css:
                  raise SystemExit(f'Missing CSS invariant: {token}')

          for token in ["const BUILD_VERSION = '12.157'", "const BUILD_NAME = 'Operator Depth'", "const BUILD_ID = '12.157.0-operator-depth'"]:
              if token not in core:
                  raise SystemExit(f'Missing build metadata: {token}')
          for token in ['Strikewatch 12.157: Operator Depth', '>12.157</b>', '12.157.0-operator-depth']:
              if token not in index:
                  raise SystemExit(f'Missing visible version label: {token}')
          for token in ['bf9d42abc2592c721c71348b660dc9c4b5c6377b5389273a64385a7f32f23b70', 'a1a1dbfc4a40bc865e99812f161c98113c4f830557d92048a93c770cdb170e17']:
              if token not in audit:
                  raise SystemExit(f'Missing audit hash: {token}')

          draw_counts = {
              'drawMesh': len(re.findall(r'\bdrawMesh\s*\(', renderer)),
              'drawAnatomicalSegment': len(re.findall(r'\bdrawAnatomicalSegment\s*\(', renderer)),
              'drawSegment': len(re.findall(r'\bdrawSegment\s*\(', renderer)),
          }
          expected = {'drawMesh': 95, 'drawAnatomicalSegment': 14, 'drawSegment': 3}
          if draw_counts != expected:
              raise SystemExit(f'Draw-site parity changed: {draw_counts} != {expected}')
          print({'draw_counts': draw_counts, 'metadata': 'ok', 'responsive_css': 'ok'})
          PY

      - name: Commit verified release
        shell: bash
        env:
          BUNDLE_SHA: ${{ steps.verify.outputs.bundle_sha }}
          STANDALONE_SHA: ${{ steps.verify.outputs.standalone_sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build 12.157: add operator depth and repair mobile Armoury'
          git push origin HEAD:agent/operator-depth-mobile-armoury-12.157
