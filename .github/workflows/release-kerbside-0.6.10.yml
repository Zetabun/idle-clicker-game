name: Validate and apply Kerbside release

on:
  push:
    branches:
      - agent/kerbside-ios-standalone-0.6.10
    paths:
      - .github/triggers/release-kerbside-0.6.10.txt

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/kerbside-ios-standalone-0.6.10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Apply browser release
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/release-kerbside-0.6.10.py
          python3 .github/scripts/release-kerbside-0.6.10.py
          git diff --check
          grep -q 'apple-mobile-web-app-status-bar-style" content="black"' bus.html
          if grep -q 'viewport-fit=cover' bus.html; then
            echo '::error::viewport-fit=cover remains in bus.html'
            exit 1
          fi

      - name: Validate browser and backend
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('bus.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit('No inline scripts found')
          for i, script in enumerate(scripts):
              Path(f'/tmp/kerbside-inline-{i}.js').write_text(script, encoding='utf-8')
          print(len(scripts))
          PY
          for f in /tmp/kerbside-inline-*.js; do node --check "$f"; done
          cd kerbside-backend
          npm install --ignore-scripts
          npm run check
          npm test

      - name: Prepare repository-safe release commit
        run: |
          set -euo pipefail
          rm .github/scripts/release-kerbside-0.6.10.py
          rm .github/workflows/release-kerbside-0.6.10.yml
          rm .github/triggers/release-kerbside-0.6.10.txt
          git diff --check

      - name: Commit validated release to branch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bus.html kerbside-backend/package.json kerbside-backend/README.md .github/scripts .github/workflows .github/triggers
          git commit -m 'Fix Kerbside iOS standalone viewport gap'
          git push origin HEAD:agent/kerbside-ios-standalone-0.6.10
