name: Patch Kerbside 0.9.34 train test isolation

on:
  push:
    branches:
      - agent/kerbside-0.9.34-memory-first-movement
    paths:
      - .github/scripts/patch-kerbside-0.9.34-train-test-isolation.py
      - .github/workflows/patch-kerbside-0.9.34-train-test-isolation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/kerbside-0.9.34-memory-first-movement
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install browser dependencies
        run: |
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          npm run vendor:leaflet --prefix kerbside-backend
          cd kerbside-backend
          npx playwright install --with-deps webkit chromium
      - name: Apply test isolation
        run: python3 .github/scripts/patch-kerbside-0.9.34-train-test-isolation.py
      - name: Verify train regression in WebKit
        env:
          KERBSIDE_BROWSER: webkit
        run: npm run test:train --prefix kerbside-backend
      - name: Verify train regression in Chromium
        env:
          KERBSIDE_BROWSER: chromium
        run: npm run test:train --prefix kerbside-backend
      - name: Commit permanent test isolation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kerbside-backend/tests/train-regression.mjs
          git diff --cached --check
          git commit -m 'Test: isolate movement overlay in train regression'
          git push origin HEAD:agent/kerbside-0.9.34-memory-first-movement
