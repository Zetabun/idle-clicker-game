name: Strikewatch 12.170 release

on:
  workflow_dispatch:
  page_build:

permissions:
  contents: write
  issues: write

concurrency:
  group: strikewatch-release-12-170
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require dedicated trigger
        id: trigger
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -f .github/release-triggers/12.170.txt ]; then
            echo "run_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run verified release
        if: steps.trigger.outputs.run_release == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/release-12-170.log) 2>&1
          report_failure() {
            status=$?
            if [ "$status" -ne 0 ]; then
              tail -c 50000 /tmp/release-12-170.log > /tmp/release-12-170-tail.log || true
              {
                echo 'The automated 12.170 release failed. Captured log:'
                echo
                echo '```text'
                cat /tmp/release-12-170-tail.log
                echo '```'
              } > /tmp/release-12-170-issue.md
              gh issue create --title 'STRIKEWATCH 12.170 RELEASE FAILURE' --body-file /tmp/release-12-170-issue.md || true
            fi
            exit "$status"
          }
          trap report_failure EXIT

          python3 .github/scripts/release-12-170.py
          cd strikewatch-source
          python3 -m py_compile build.py
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.170.html dist/strikewatch-build-12.170-size.json dist/strikewatch-build-12.170-css-debt.json > /tmp/build-a.sha
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.170.html dist/strikewatch-build-12.170-size.json dist/strikewatch-build-12.170-css-debt.json > /tmp/build-b.sha
          diff -u /tmp/build-a.sha /tmp/build-b.sha
          for file in js/[0-9][0-9]-*.js js/strikewatch.dev.js; do
            node --check "$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          root = Path('.')
          html = (root / 'dist/strikewatch-build-12.170.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          if not scripts:
              raise SystemExit('No inline standalone JavaScript found')
          Path('/tmp/strikewatch-12.170-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          game = (root / 'css/game.css').read_text(encoding='utf-8')
          reward = (root / 'css/reward-reveal.css').read_text(encoding='utf-8')
          marker = 'Build 12.141: reward reveal shows the weapon alone'
          if marker in game:
              raise SystemExit('Reward reveal layer still exists in game.css')
          if reward.count(marker) != 1:
              raise SystemExit('Reward reveal ownership marker missing or duplicated')
          required_rules = (
              '.career-crate-overlay.cycling .career-crate-core',
              '.career-crate-overlay.revealed .career-crate-core',
              '.career-crate-overlay.cycling .career-crate-model',
              '.career-crate-overlay.revealed .career-crate-model',
              'display: none',
              'grid-column: 1 / -1',
              'justify-self: center',
          )
          if any(rule not in reward for rule in required_rules):
              raise SystemExit('Reward reveal phase rule missing')
          if '<link rel="stylesheet" href="css/' in html:
              raise SystemExit('Standalone retained a development stylesheet link')
          report = json.loads((root / 'dist/strikewatch-build-12.170-css-debt.json').read_text(encoding='utf-8'))
          expected_order = [
              'game.css', 'reward-reveal.css', 'armour-viewer.css',
              'weapon-presentation.css', 'loadout-stills.css',
              '12.161-audit-fixes.css', 'armoury-inventory.css',
              'compact-navigation.css',
          ]
          if report.get('stylesheet_order') != expected_order:
              raise SystemExit(f'Unexpected stylesheet order: {report}')
          if report.get('stylesheets') != 8 or report.get('owned_reward_reveal_lines', 0) < 10:
              raise SystemExit(f'Unexpected reward reveal ownership report: {report}')
          if not report.get('within_budget') or report.get('game_css_lines', 999999) > 31420:
              raise SystemExit(f'CSS debt budget failed: {report}')
          bundle = (root / 'js/strikewatch.dev.js').read_text(encoding='utf-8')
          hooks = (
              'renderCareerCrate3D',
              'crateSpinForTest',
              'crateAttachmentForTest',
              'firstMatchPayoffForTest',
          )
          if any(hook not in bundle for hook in hooks):
              raise SystemExit('Expected reward regression hook missing')
          print(json.dumps(report, indent=2))
          PY
          node --check /tmp/strikewatch-12.170-inline.js
          cp dist/strikewatch-build-12.170.html ../cod.html
          cmp -s ../cod.html dist/strikewatch-build-12.170.html
          cd ..
          rm -f .github/scripts/release-12-170.py .github/workflows/release-12-170.yml .github/release-triggers/12.170.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add strikewatch-source cod.html .github
          git commit -m 'Build 12.170: establish reward reveal CSS ownership'
          git push origin HEAD:main
