name: Release Strikewatch 12.192

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/release-12-192.txt'

permissions:
  contents: write

concurrency:
  group: release-strikewatch-12-192
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build, verify and publish
        shell: bash
        run: |
          cat > /tmp/release-12-192.sh <<'BASH'
          set -Eeuo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('strikewatch-source/RELEASE.json').read_text(encoding='utf-8'))
          expected = {
              'version': '12.191',
              'name': 'Operator Silhouette Separation',
              'build_id': '12.191.0-operator-silhouette-separation'
          }
          if release != expected:
              raise SystemExit(f'Unexpected predecessor release: {release!r}')
          PY

          python3 -m py_compile .github/scripts/release-12-192.py
          python3 .github/scripts/release-12-192.py

          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('strikewatch-source/RELEASE.json').read_text(encoding='utf-8'))
          expected = {
              'version': '12.192',
              'name': 'Directional Operator Contact Shadows',
              'build_id': '12.192.0-directional-operator-contact-shadows'
          }
          if release != expected:
              raise SystemExit(f'Unexpected prepared release: {release!r}')
          required_docs = {
              'HANDOFF.md': '- Build: **12.192 — Directional Operator Contact Shadows**',
              'AGENTS.md': 'Build 12.192 owns directional living-operator contact shadows',
              'README.md': '# Strikewatch Source 12.192',
              'PROJECT.md': 'Build 12.192 improves battle grounding',
              'CHANGELOG.md': '## 12.192 — Directional Operator Contact Shadows',
              '00-READ-FIRST-GPT.md': 'Current release: **Strikewatch Build 12.192 — Directional Operator Contact Shadows**.',
              'CONTRACTS.md': 'Living-operator contact shadows remain inside the established LOD budget'
          }
          for name, required in required_docs.items():
              text = Path('strikewatch-source', name).read_text(encoding='utf-8')
              if required not in text:
                  raise SystemExit(f'{name} missing release requirement: {required}')
          if not Path('strikewatch-source/AUDIT-12.192.md').is_file():
              raise SystemExit('AUDIT-12.192.md was not created')
          PY

          grep -F "const BUILD_VERSION = '12.192'" strikewatch-source/js/00-core.js
          grep -F "const BUILD_NAME = 'Directional Operator Contact Shadows'" strikewatch-source/js/00-core.js
          grep -F "const BUILD_ID = '12.192.0-directional-operator-contact-shadows'" strikewatch-source/js/00-core.js
          grep -F '<title>Strikewatch 12.192: Directional Operator Contact Shadows</title>' strikewatch-source/index.html
          grep -F 'id="managerBuildVersion">12.192</b>' strikewatch-source/index.html
          grep -F 'id="mobileCommandBuildVersion">12.192</b>' strikewatch-source/index.html

          python3 - <<'PY'
          from pathlib import Path
          character = Path('strikewatch-source/js/62-character-renderer.js').read_text(encoding='utf-8')
          required = [
              "revision: '12.192-directional-contact-shadow-1'",
              'keyAwayX: 0.777',
              'keyAwayZ: -0.629',
              'lowDetailDrawCalls: 1',
              'mediumDetailDrawCalls: 2',
              'fullDetailDrawCalls: 2',
              'const operatorContactShadowScratch = {}',
              'function operatorContactShadowProfile(bot = {}, out = {})',
              'function operatorContactShadowForTest()',
              'operatorContactShadowProfile(bot, operatorContactShadowScratch)',
              'crouchWiderAndDenser:',
              'runLongerAndSofter:',
              'innerRemainsContactWeighted:',
              'additionalDrawCalls: 0',
              'additionalPerFrameObjectAllocations: 0',
              'corpseShadowUnchanged: true'
          ]
          missing = [item for item in required if item not in character]
          if missing:
              raise SystemExit(f'Missing contact-shadow source requirements: {missing}')
          start = character.index('  function drawShadow(bot, detailTier = 2) {')
          end = character.index('\n  const OPERATOR_SKIN_PRESENTATION', start)
          block = character[start:end]
          if block.count('drawMesh(glMeshes.disc') != 2:
              raise SystemExit('Living shadow no longer has exactly two authored draw sites')
          if block.count('if (detailTier > 0)') != 1:
              raise SystemExit('Living shadow LOD gate changed')
          if character.count('const operatorContactShadowScratch = {}') != 1:
              raise SystemExit('Contact-shadow scratch object is missing or duplicated')
          if character.count('function operatorContactShadowProfile(') != 1:
              raise SystemExit('Contact-shadow profile authority is missing or duplicated')
          if 'setBlendMode(true);\n    mat4TRS(glModel, bot.x, 0.009, bot.y' in character:
              raise SystemExit('Legacy fixed living shadow block remains')
          PY

          for hook in operatorContactShadowForTest operatorSilhouetteSeparationForTest operatorEnvironmentalLightPickupForTest operatorAmbientOcclusionForTest dynamicActorCullingForTest arenaSurfaceSampleForTest; do
            grep -R -F "$hook" strikewatch-source/js >/dev/null
          done

          cd strikewatch-source
          python3 -m py_compile build.py
          python3 build.py
          test -f dist/strikewatch-build-12.192.html
          test -f dist/strikewatch-build-12.192-size.json
          test -f dist/strikewatch-build-12.192-css-debt.json
          cp js/strikewatch.dev.js /tmp/strikewatch.dev.first.js
          cp dist/strikewatch-build-12.192.html /tmp/strikewatch-build.first.html
          cp dist/strikewatch-build-12.192-size.json /tmp/strikewatch-size.first.json
          cp dist/strikewatch-build-12.192-css-debt.json /tmp/strikewatch-css.first.json
          cd ..

          for file in strikewatch-source/js/*.js; do
            [ "$(basename "$file")" = 'strikewatch.dev.js' ] && continue
            node --check "$file"
          done
          node --check strikewatch-source/js/strikewatch.dev.js

          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          html = Path('strikewatch-source/dist/strikewatch-build-12.192.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit('No standalone inline scripts found')
          with tempfile.TemporaryDirectory() as temp:
              for index, script in enumerate(scripts):
                  path = Path(temp) / f'inline-{index}.js'
                  path.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(path)], check=True)
          print(f'Parsed {len(scripts)} standalone inline scripts.')
          PY

          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('strikewatch-source/dist/strikewatch-build-12.192-css-debt.json').read_text(encoding='utf-8'))
          if not report.get('within_budget'):
              raise SystemExit(f'CSS debt report is outside budget: {report!r}')
          expected = {
              'game_css_lines': 30724,
              'important_declarations': 2182,
              'media_queries': 474
          }
          for key, value in expected.items():
              if report.get(key) != value:
                  raise SystemExit(f'Unexpected CSS debt value for {key}: {report.get(key)}')
          PY

          cd strikewatch-source
          python3 build.py
          cd ..
          cmp /tmp/strikewatch.dev.first.js strikewatch-source/js/strikewatch.dev.js
          cmp /tmp/strikewatch-build.first.html strikewatch-source/dist/strikewatch-build-12.192.html
          cmp /tmp/strikewatch-size.first.json strikewatch-source/dist/strikewatch-build-12.192-size.json
          cmp /tmp/strikewatch-css.first.json strikewatch-source/dist/strikewatch-build-12.192-css-debt.json

          cp strikewatch-source/dist/strikewatch-build-12.192.html cod.html
          cmp cod.html strikewatch-source/dist/strikewatch-build-12.192.html
          git diff --check
          BASH

          LOG=.github/release-12-192-last.log
          set +e
          bash /tmp/release-12-192.sh 2>&1 | tee "$LOG"
          release_status=${PIPESTATUS[0]}
          set -e

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$release_status" -ne 0 ]; then
            printf '\nFAILED_EXIT_CODE=%s\n' "$release_status" >> "$LOG"
            git add "$LOG"
            git commit -m 'Record Build 12.192 release failure'
            git push origin HEAD:main
            exit "$release_status"
          fi

          rm -f "$LOG"
          rm -f .github/scripts/release-12-192.py
          rm -f .github/workflows/release-12-192.yml
          rm -f .github/triggers/release-12-192.txt
          git add -A
          git diff --cached --quiet && { echo 'No release changes produced.'; exit 1; }
          git commit -m 'Build 12.192: directional operator contact shadows'
          git push origin HEAD:main