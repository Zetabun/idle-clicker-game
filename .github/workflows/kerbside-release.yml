name: Validate and apply Kerbside release

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/scripts/release-kerbside-*.py
      - .github/triggers/release-kerbside-*.txt

permissions:
  contents: write

concurrency:
  group: kerbside-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out release branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Locate release patch
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t SCRIPTS < <(find .github/scripts -maxdepth 1 -type f -name 'release-kerbside-*.py' | sort)
          if [[ "${#SCRIPTS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one Kerbside release patch, found ${#SCRIPTS[@]}."
            printf '%s\n' "${SCRIPTS[@]:-}"
            exit 1
          fi
          echo "RELEASE_SCRIPT=${SCRIPTS[0]}" >> "$GITHUB_ENV"

      - name: Apply browser release
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$RELEASE_SCRIPT"
          python3 "$RELEASE_SCRIPT"
          if [[ -f .github/scripts/kerbside-release-post.py ]]; then
            python3 -m py_compile .github/scripts/kerbside-release-post.py
            python3 .github/scripts/kerbside-release-post.py
          fi
          git diff --check

      - name: Install browser test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          npm run vendor:leaflet --prefix kerbside-backend
          cd kerbside-backend
          npx playwright install --with-deps webkit

      - name: Validate backend and existing builders
        shell: bash
        run: |
          set -euo pipefail
          node --check build-timetable.js
          npm run check --prefix kerbside-backend
          npm test --prefix kerbside-backend

      - name: Run WebKit browser regression checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:browser --prefix kerbside-backend

      - name: Prepare repository-safe release commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d .github/scripts/__pycache__ ]]; then
            find .github/scripts/__pycache__ -maxdepth 1 -type f -name 'release-kerbside-*.pyc' -delete
            find .github/scripts/__pycache__ -maxdepth 1 -type f -name 'kerbside-release-post*.pyc' -delete
          fi

          trigger_path="${RELEASE_SCRIPT/.github\/scripts\//.github/triggers/}"
          trigger_path="${trigger_path%.py}.txt"
          rm -f "$RELEASE_SCRIPT" "$trigger_path" .github/scripts/kerbside-release-post.py

          # A release patch must not smuggle workflow changes into its generated
          # commit. Reviewed workflow edits already present in the branch remain.
          git restore --source=HEAD --worktree -- .github/workflows
          git diff --check

      - name: Export validated release files
        uses: actions/upload-artifact@v4
        with:
          name: kerbside-0.6.61-validated
          if-no-files-found: error
          retention-days: 3
          path: |
            bus.html
            kerbside-backend/README.md
            kerbside-backend/package.json
            kerbside-backend/src/worker.js
            kerbside-backend/test/worker.test.js
            kerbside-backend/tests/browser-regression.mjs

      - name: Publish validated release atomically
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail

          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git ls-remote --heads origin "refs/heads/$RELEASE_BRANCH" | awk 'NR==1 {print $1}')"
          if [[ -z "$REMOTE_SHA" || "$REMOTE_SHA" != "$CHECKED_OUT_SHA" ]]; then
            echo "::error::Release branch moved during validation: checked out $CHECKED_OUT_SHA but remote is ${REMOTE_SHA:-missing}."
            exit 1
          fi

          trigger_path="${RELEASE_SCRIPT/.github\/scripts\//.github/triggers/}"
          trigger_path="${trigger_path%.py}.txt"
          mapfile -d '' -t CHANGED < <(
            {
              git diff --name-only -z HEAD --
              git ls-files --others --exclude-standard -z
            } | sort -zu
          )
          if [[ "${#CHANGED[@]}" -eq 0 ]]; then
            echo "::error::Validated release produced no repository changes."
            exit 1
          fi

          for path in "${CHANGED[@]}"; do
            case "$path" in
              bus.html|build-timetable.js|timetable.json|kerbside-backend/*|"$RELEASE_SCRIPT"|"$trigger_path"|.github/scripts/kerbside-release-post.py)
                ;;
              *)
                echo "::error::Unexpected release path: $path"
                exit 1
                ;;
            esac
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- "${CHANGED[@]}"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "::error::Validated release produced no staged repository changes."
            exit 1
          fi

          git commit -m 'Release Kerbside browser update'

          # The release commit is a direct child of CHECKED_OUT_SHA, so a normal
          # push is already atomic: Git rejects it if the branch moved. Retry only
          # transient transport/API failures, checking the exact remote SHA first.
          for attempt in 1 2 3; do
            REMOTE_SHA="$(git ls-remote --heads origin "refs/heads/$RELEASE_BRANCH" | awk 'NR==1 {print $1}')"
            if [[ -z "$REMOTE_SHA" || "$REMOTE_SHA" != "$CHECKED_OUT_SHA" ]]; then
              echo "::error::Release branch moved before publish attempt $attempt: expected $CHECKED_OUT_SHA but remote is ${REMOTE_SHA:-missing}."
              exit 1
            fi
            if git push origin "HEAD:refs/heads/$RELEASE_BRANCH"; then
              echo "Published validated release commit $(git rev-parse HEAD) to $RELEASE_BRANCH"
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 5))
            fi
          done

          echo "::error::Unable to publish the validated release after 3 attempts."
          exit 1
