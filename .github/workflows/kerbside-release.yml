name: Validate and apply Kerbside release

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/scripts/release-kerbside-*.py
      - .github/triggers/release-kerbside-*.txt

permissions:
  contents: write

concurrency:
  group: kerbside-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out release branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Locate release patch
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t SCRIPTS < <(find .github/scripts -maxdepth 1 -type f -name 'release-kerbside-*.py' | sort)
          if [[ "${#SCRIPTS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one Kerbside release patch, found ${#SCRIPTS[@]}."
            printf '%s\n' "${SCRIPTS[@]:-}"
            exit 1
          fi
          echo "RELEASE_SCRIPT=${SCRIPTS[0]}" >> "$GITHUB_ENV"

      - name: Apply browser release
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$RELEASE_SCRIPT"
          python3 "$RELEASE_SCRIPT"
          if [[ -f .github/scripts/kerbside-release-post.py ]]; then
            python3 -m py_compile .github/scripts/kerbside-release-post.py
            python3 .github/scripts/kerbside-release-post.py
          fi
          git diff --check

      - name: Install browser test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          npm run vendor:leaflet --prefix kerbside-backend
          cd kerbside-backend
          npx playwright install --with-deps webkit

      - name: Validate backend and existing builders
        shell: bash
        run: |
          set -euo pipefail
          node --check build-timetable.js
          npm run check --prefix kerbside-backend
          npm test --prefix kerbside-backend

      - name: Run WebKit browser regression checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:browser --prefix kerbside-backend
          npm run test:audit --prefix kerbside-backend
          npm run test:journey-identity --prefix kerbside-backend
          npm run test:disruptions --prefix kerbside-backend

      - name: Prepare repository-safe release commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d .github/scripts/__pycache__ ]]; then
            find .github/scripts/__pycache__ -maxdepth 1 -type f -name 'release-kerbside-*.pyc' -delete
            find .github/scripts/__pycache__ -maxdepth 1 -type f -name 'kerbside-release-post*.pyc' -delete
          fi

          trigger_path="${RELEASE_SCRIPT/.github\/scripts\//.github/triggers/}"
          trigger_path="${trigger_path%.py}.txt"
          rm -f "$RELEASE_SCRIPT" "$trigger_path" .github/scripts/kerbside-release-post.py

          # Dependencies are validation-only. Remove npm's generated tree before
          # release-file discovery so it can never be included in a publish.
          rm -rf kerbside-backend/node_modules

          # The GITHUB_TOKEN cannot update protected workflow files. A release
          # patch must not smuggle workflow changes into the generated commit;
          # connected GitHub tooling applies reviewed workflow edits separately.
          git restore --source=HEAD --worktree -- .github/workflows
          git diff --check

      - name: Publish validated release atomically
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail

          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          BASE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$RELEASE_BRANCH" --jq '.object.sha')"
          if [[ "$BASE_SHA" != "$CHECKED_OUT_SHA" ]]; then
            echo "::error::Release branch moved during validation: checked out $CHECKED_OUT_SHA but remote is $BASE_SHA."
            exit 1
          fi

          BASE_TREE="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$BASE_SHA" --jq '.tree.sha')"
          TREE='[]'
          trigger_path="${RELEASE_SCRIPT/.github\/scripts\//.github/triggers/}"
          trigger_path="${trigger_path%.py}.txt"

          mapfile -d '' -t CHANGED < <(
            {
              git diff --name-only -z HEAD --
              git ls-files --others --exclude-standard -z
            } | sort -zu
          )
          if [[ "${#CHANGED[@]}" -eq 0 ]]; then
            echo "::error::Validated release produced no repository changes."
            exit 1
          fi

          for path in "${CHANGED[@]}"; do
            case "$path" in
              VERSION|bus.html|kerbside-train-timetable.js|kerbside-trains.css|kerbside-journey-planner-ui.js|kerbside-status.js|build-timetable.js|timetable.json|kerbside-backend/*|"$RELEASE_SCRIPT"|"$trigger_path"|.github/scripts/kerbside-release-post.py)
                ;;
              *)
                echo "::error::Unexpected release path: $path"
                exit 1
                ;;
            esac

            mode="$(git ls-files -s -- "$path" | awk 'NR==1 {print $1}')"
            mode="${mode:-100644}"
            if [[ -f "$path" ]]; then
              blob_sha="$(base64 -w 0 -- "$path" | jq -Rs '{content: ., encoding: "base64"}' | \
                gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq '.sha')"
              TREE="$(jq --arg path "$path" --arg mode "$mode" --arg sha "$blob_sha" \
                '. + [{path: $path, mode: $mode, type: "blob", sha: $sha}]' <<<"$TREE")"
            else
              TREE="$(jq --arg path "$path" --arg mode "$mode" \
                '. + [{path: $path, mode: $mode, type: "blob", sha: null}]' <<<"$TREE")"
            fi
          done

          TREE_SHA="$(jq -n --arg base_tree "$BASE_TREE" --argjson tree "$TREE" \
            '{base_tree: $base_tree, tree: $tree}' | \
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq '.sha')"
          COMMIT_SHA="$(jq -n --arg message 'Release Kerbside browser update' --arg tree "$TREE_SHA" --arg parent "$BASE_SHA" \
            '{message: $message, tree: $tree, parents: [$parent]}' | \
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input - --jq '.sha')"
          jq -n --arg sha "$COMMIT_SHA" '{sha: $sha, force: false}' | \
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$RELEASE_BRANCH" --input - >/dev/null

          echo "Published validated release commit $COMMIT_SHA to $RELEASE_BRANCH"
