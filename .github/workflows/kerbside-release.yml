name: Validate and apply Kerbside release

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/scripts/release-kerbside-*.py
      - .github/triggers/release-kerbside-*.txt

permissions:
  contents: write

concurrency:
  group: kerbside-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out release branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Locate release patch
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t SCRIPTS < <(find .github/scripts -maxdepth 1 -type f -name 'release-kerbside-*.py' ! -name '*.test.py' | sort)
          if [[ "${#SCRIPTS[@]}" -eq 0 ]]; then
            echo "NO_RELEASE=true" >> "$GITHUB_ENV"
            echo "No Kerbside release patch remains; the validated release has already been published."
            exit 0
          fi
          if [[ "${#SCRIPTS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one Kerbside release patch, found ${#SCRIPTS[@]}."
            printf '%s\n' "${SCRIPTS[@]}"
            exit 1
          fi
          echo "RELEASE_SCRIPT=${SCRIPTS[0]}" >> "$GITHUB_ENV"

      - name: Apply browser release
        if: env.NO_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$RELEASE_SCRIPT"
          python3 "$RELEASE_SCRIPT"
          if [[ -f .github/scripts/kerbside-release-post.py ]]; then
            python3 -m py_compile .github/scripts/kerbside-release-post.py
            python3 .github/scripts/kerbside-release-post.py
          fi
          git diff --check

      - name: Install browser test dependencies
        if: env.NO_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          npm run vendor:leaflet --prefix kerbside-backend
          cd kerbside-backend
          npx playwright install --with-deps webkit

      - name: Validate backend and existing builders
        if: env.NO_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check build-timetable.js
          npm run check --prefix kerbside-backend
          npm test --prefix kerbside-backend

      - name: Run WebKit browser regression checks
        if: env.NO_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run test:browser --prefix kerbside-backend

      - name: Prepare repository-safe release commit
        if: env.NO_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d .github/scripts/__pycache__ ]]; then
            find .github/scripts/__pycache__ -maxdepth 1 -type f -name 'release-kerbside-*.pyc' -delete
            find .github/scripts/__pycache__ -maxdepth 1 -type f -name 'kerbside-release-post*.pyc' -delete
          fi

          trigger_path="${RELEASE_SCRIPT/.github\/scripts\//.github/triggers/}"
          trigger_path="${trigger_path%.py}.txt"
          test_path="${RELEASE_SCRIPT%.py}.test.py"
          rm -f "$RELEASE_SCRIPT" "$trigger_path" "$test_path" .github/scripts/kerbside-release-post.py

          # A release patch must not smuggle workflow changes into its generated
          # commit. Reviewed workflow edits already present in the branch remain.
          git restore --source=HEAD --worktree -- .github/workflows
          git diff --check

      - name: Export validated release files
        if: env.NO_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kerbside-0.6.61-validated
          if-no-files-found: error
          retention-days: 3
          path: |
            bus.html
            kerbside-backend/README.md
            kerbside-backend/package.json
            kerbside-backend/src/worker.js
            kerbside-backend/test/worker.test.js
            kerbside-backend/tests/browser-regression.mjs

      - name: Publish validated release atomically
        if: env.NO_RELEASE != 'true'
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "::error::Checked out ${checked_out_sha}, expected validated PR head ${EXPECTED_SOURCE_SHA}."
            exit 1
          fi

          git fetch origin "$RELEASE_BRANCH"
          remote_sha="$(git rev-parse "origin/${RELEASE_BRANCH}")"
          if [[ "$remote_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "::error::Release branch moved during validation: expected ${EXPECTED_SOURCE_SHA}, found ${remote_sha}."
            exit 1
          fi

          mapfile -d '' changed_paths < <({ git diff --name-only -z HEAD --; git ls-files --others --exclude-standard -z; } | sort -zu)
          if [[ "${#changed_paths[@]}" -eq 0 ]]; then
            echo "::error::Validated release produced no repository changes."
            exit 1
          fi

          trigger_path="${RELEASE_SCRIPT/.github\/scripts\//.github/triggers/}"
          trigger_path="${trigger_path%.py}.txt"
          test_path="${RELEASE_SCRIPT%.py}.test.py"
          for path in "${changed_paths[@]}"; do
            case "$path" in
              bus.html|build-timetable.js|timetable.json|kerbside-backend/*|"$RELEASE_SCRIPT"|"$trigger_path"|"$test_path"|.github/scripts/kerbside-release-post.py)
                ;;
              *)
                echo "::error::Unexpected release path: $path"
                exit 1
                ;;
            esac
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- bus.html build-timetable.js timetable.json kerbside-backend .github/scripts .github/triggers
          git diff --cached --check
          git commit -m "Release Kerbside browser update"

          # A normal fast-forward push is atomic and cannot overwrite a branch
          # that moved after the checks above.
          git push origin "HEAD:refs/heads/${RELEASE_BRANCH}"
