name: Validate and apply Kerbside release

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/scripts/release-kerbside-*.py
      - .github/triggers/release-kerbside-*.txt

permissions:
  contents: write

concurrency:
  group: kerbside-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out release branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Locate release patch
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t SCRIPTS < <(find .github/scripts -maxdepth 1 -type f -name 'release-kerbside-*.py' ! -name '*.test.py' | sort)
          if [[ "${#SCRIPTS[@]}" -eq 0 ]]; then
            echo "NO_RELEASE=true" >> "$GITHUB_ENV"
            echo "No Kerbside release patch remains; the validated release has already been published."
            exit 0
          fi
          if [[ "${#SCRIPTS[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one Kerbside release patch, found ${#SCRIPTS[@]}."
            printf '%s\n' "${SCRIPTS[@]}"
            exit 1
          fi
          echo "RELEASE_SCRIPT=${SCRIPTS[0]}" >> "$GITHUB_ENV"

      - name: Apply browser release
        if: env.NO_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$RELEASE_SCRIPT"
          python3 "$RELEASE_SCRIPT"
          if [[ -f .github/scripts/kerbside-release-post.py ]]; then
            python3 -m py_compile .github/scripts/kerbside-release-post.py
            python3 .github/scripts/kerbside-release-post.py
          fi
          git diff --check

      - name: Install browser test dependencies
        if: env.NO_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          npm run vendor:leaflet --prefix kerbside-backend
          cd kerbside-backend
          npx playwright install --with-deps webkit

      - name: Validate backend and existing builders
        if: env.NO_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check build-timetable.js
          npm run check --prefix kerbside-backend
          npm test --prefix kerbside-backend

      - name: Run WebKit browser regression checks
        if: env.NO_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run test:browser --prefix kerbside-backend

      - name: Prepare repository-safe release commit
        if: env.NO_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d .github/scripts/__pycache__ ]]; then
            find .github/scripts/__pycache__ -maxdepth 1 -type f -name 'release-kerbside-*.pyc' -delete
            find .github/scripts/__pycache__ -maxdepth 1 -type f -name 'kerbside-release-post*.pyc' -delete
          fi

          trigger_path="${RELEASE_SCRIPT/.github\/scripts\//.github/triggers/}"
          trigger_path="${trigger_path%.py}.txt"
          test_path="${RELEASE_SCRIPT%.py}.test.py"
          rm -f "$RELEASE_SCRIPT" "$trigger_path" "$test_path" .github/scripts/kerbside-release-post.py

          # A release patch must not smuggle workflow changes into its generated
          # commit. Reviewed workflow edits already present in the branch remain.
          git restore --source=HEAD --worktree -- .github/workflows
          git diff --check

      - name: Export validated release files
        if: env.NO_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kerbside-0.6.61-validated
          if-no-files-found: error
          retention-days: 3
          path: |
            bus.html
            kerbside-backend/README.md
            kerbside-backend/package.json
            kerbside-backend/src/worker.js
            kerbside-backend/test/worker.test.js
            kerbside-backend/tests/browser-regression.mjs

      - name: Publish validated release atomically
        if: env.NO_RELEASE != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import subprocess
          import time
          from urllib import error, parse, request

          repository = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['RELEASE_BRANCH']
          token = os.environ['GITHUB_TOKEN']
          release_script = os.environ['RELEASE_SCRIPT']
          checked_out_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          api_root = f'https://api.github.com/repos/{repository}'
          transient_statuses = {429, 500, 502, 503, 504}

          def api(method, path, payload=None, attempts=5):
              body = None if payload is None else json.dumps(payload).encode('utf-8')
              headers = {
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'kerbside-release-workflow',
              }
              if body is not None:
                  headers['Content-Type'] = 'application/json'
              for attempt in range(1, attempts + 1):
                  try:
                      req = request.Request(api_root + path, data=body, headers=headers, method=method)
                      with request.urlopen(req, timeout=90) as response:
                          raw = response.read()
                          return json.loads(raw) if raw else {}
                  except error.HTTPError as exc:
                      detail = exc.read().decode('utf-8', 'replace')
                      if exc.code not in transient_statuses or attempt == attempts:
                          raise RuntimeError(f'{method} {path} failed with HTTP {exc.code}: {detail}') from exc
                  except error.URLError as exc:
                      if attempt == attempts:
                          raise RuntimeError(f'{method} {path} failed: {exc}') from exc
                  time.sleep(min(30, attempt * 5))
              raise RuntimeError(f'{method} {path} exhausted retries')

          branch_path = parse.quote(branch, safe='/')
          ref_path = f'/git/ref/heads/{branch_path}'
          update_ref_path = f'/git/refs/heads/{branch_path}'
          remote_sha = api('GET', ref_path)['object']['sha']
          if remote_sha != checked_out_sha:
              raise SystemExit(
                  f'Release branch moved during validation: checked out {checked_out_sha} but remote is {remote_sha}.'
              )

          changed = set()
          for command in (
              ['git', 'diff', '--name-only', '-z', 'HEAD', '--'],
              ['git', 'ls-files', '--others', '--exclude-standard', '-z'],
          ):
              for raw_path in subprocess.check_output(command).split(b'\0'):
                  if raw_path:
                      changed.add(raw_path.decode('utf-8'))
          if not changed:
              raise SystemExit('Validated release produced no repository changes.')

          trigger_path = release_script.replace('.github/scripts/', '.github/triggers/').removesuffix('.py') + '.txt'
          test_path = release_script.removesuffix('.py') + '.test.py'
          temporary_paths = {release_script, trigger_path, test_path, '.github/scripts/kerbside-release-post.py'}

          def allowed(path):
              return (
                  path in {'bus.html', 'build-timetable.js', 'timetable.json'}
                  or path.startswith('kerbside-backend/')
                  or path in temporary_paths
              )

          unexpected = sorted(path for path in changed if not allowed(path))
          if unexpected:
              raise SystemExit('Unexpected release path(s): ' + ', '.join(unexpected))

          parent = api('GET', f'/git/commits/{checked_out_sha}')
          entries = []
          for path in sorted(changed):
              file_path = Path(path)
              if not file_path.exists():
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              blob = api('POST', '/git/blobs', {
                  'content': base64.b64encode(file_path.read_bytes()).decode('ascii'),
                  'encoding': 'base64',
              })
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})

          tree = api('POST', '/git/trees', {'base_tree': parent['tree']['sha'], 'tree': entries})
          commit = api('POST', '/git/commits', {
              'message': 'Release Kerbside browser update',
              'tree': tree['sha'],
              'parents': [checked_out_sha],
          })

          remote_sha = api('GET', ref_path)['object']['sha']
          if remote_sha != checked_out_sha:
              raise SystemExit(
                  f'Release branch moved before publication: expected {checked_out_sha} but remote is {remote_sha}.'
              )
          api('PATCH', update_ref_path, {'sha': commit['sha'], 'force': False})
          print(f"Published validated release commit {commit['sha']} to {branch}")
          PY