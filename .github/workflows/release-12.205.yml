name: Release 12.205

on:
  push:
    branches: [main]
    paths:
      - .github/triggers/release-12.205.txt

permissions:
  contents: write

concurrency:
  group: release-build-12-205
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply, build and verify Build 12.205
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/release-12.205.log) 2>&1

          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {'version':'12.204','name':'Operator Career Story','build_id':'12.204.0-operator-career-story'}
          actual = json.loads(Path('strikewatch-source/RELEASE.json').read_text(encoding='utf-8'))
          if actual != expected:
              raise SystemExit(f'Unexpected predecessor release: {actual!r}')
          print('Predecessor release verified:', actual)
          PY

          python3 -m py_compile .github/scripts/release-12.205.py
          python3 .github/scripts/release-12.205.py

          cd strikewatch-source
          python3 -m py_compile build.py
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.205.html dist/strikewatch-build-12.205-size.json dist/strikewatch-build-12.205-css-debt.json > /tmp/build-12.205-first.sha256
          for file in js/*.js; do node --check "$file"; done
          node --check js/strikewatch.dev.js

          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('dist/strikewatch-build-12.205.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit('No inline JavaScript found in standalone')
          for script in scripts:
              with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as handle:
                  handle.write(script)
                  temp = handle.name
              subprocess.run(['node','--check',temp], check=True)
          print(f'Parsed {len(scripts)} standalone inline script block(s)')
          PY

          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.205.html dist/strikewatch-build-12.205-size.json dist/strikewatch-build-12.205-css-debt.json > /tmp/build-12.205-second.sha256
          diff -u /tmp/build-12.205-first.sha256 /tmp/build-12.205-second.sha256
          cd ..

          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          src = root / 'strikewatch-source'
          release = json.loads((src/'RELEASE.json').read_text(encoding='utf-8'))
          expected = {'version':'12.205','name':'Board Expectations','build_id':'12.205.0-board-expectations'}
          if release != expected:
              raise SystemExit(f'Unexpected release metadata: {release!r}')
          checks = {
              src/'js/56-world-press-awards.js': ['function boardExpectationDefinitions','function renderBoardExpectations','BOARD CONFIDENCE'],
              src/'js/37-league.js': ['renderBoardExpectations(false)'],
              src/'js/36-team-management.js': ['renderBoardExpectations(true)'],
              src/'css/compact-navigation.css': ['Build 12.205: board expectations'],
          }
          for path, fragments in checks.items():
              text = path.read_text(encoding='utf-8')
              missing = [fragment for fragment in fragments if fragment not in text]
              if missing:
                  raise SystemExit(f'Missing anchors in {path}: {missing!r}')
          standalone = src/'dist/strikewatch-build-12.205.html'
          cod = root/'cod.html'
          cod.write_bytes(standalone.read_bytes())
          if cod.read_bytes() != standalone.read_bytes():
              raise SystemExit('cod.html is not byte-identical to the verified standalone')
          print('Build 12.205 source, deterministic build and artifact gates passed')
          PY

          rm -f .github/release-12.205-failure.log
          rm -f .github/scripts/release-12.205.py
          rm -f .github/workflows/release-12.205.yml
          rm -f .github/triggers/release-12.205.txt

          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Build 12.205: Board Expectations"
          git push origin main

      - name: Publish failure ledger
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          git reset --hard HEAD
          {
            printf '%s\n' 'Build 12.205 workflow failed.' "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "Commit: $GITHUB_SHA"
            if test -f /tmp/release-12.205.log; then cat /tmp/release-12.205.log; else printf '%s\n' 'Build failed before the release log was initialised.'; fi
          } > .github/release-12.205-failure.log
          git add .github/release-12.205-failure.log
          git commit -m "Record Build 12.205 release failure"
          git push origin main
