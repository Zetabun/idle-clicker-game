name: Bootstrap Strikewatch 12.229 release

on:
  push:
    branches:
      - agent/strikewatch-12-131-tactical-clarity
    paths:
      - '.github/workflows/strikewatch-12-130-ui-hotfix.yml'

permissions:
  contents: write

concurrency:
  group: strikewatch-12.229-bootstrap
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run verified Build 12.229 release
        run: bash .github/scripts/run-release-12.229.sh
      - name: Commit failure ledger to main
        if: failure()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p .github/diagnostics
          {
            echo
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "trigger_sha=${GITHUB_SHA}"
            echo "bootstrap_branch=agent/strikewatch-12-131-tactical-clarity"
          } >> .github/diagnostics/12.229.txt
          git add .github/diagnostics/12.229.txt
          git commit -m 'Record Build 12.229 release failure' || true
          git push origin HEAD:main || true
