name: Diagnose Build 12.223 Retry

on:
  push:
    paths:
      - '.github/triggers/diagnose-12.223-retry.txt'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run release gates diagnostically
        shell: bash
        run: |
          set +e
          OUT=/tmp/diagnose-12.223-retry.txt
          python3 .github/scripts/release-12.223.py > "$OUT" 2>&1
          echo "patch_exit=$?" >> "$OUT"
          (cd strikewatch-source && python3 build.py) >> "$OUT" 2>&1
          echo "build1_exit=$?" >> "$OUT"
          cp strikewatch-source/js/strikewatch.dev.js /tmp/first.js 2>> "$OUT"
          cp strikewatch-source/dist/strikewatch-build-12.223.html /tmp/first.html 2>> "$OUT"
          (cd strikewatch-source && python3 build.py) >> "$OUT" 2>&1
          echo "build2_exit=$?" >> "$OUT"
          cmp /tmp/first.js strikewatch-source/js/strikewatch.dev.js >> "$OUT" 2>&1
          echo "bundle_cmp_exit=$?" >> "$OUT"
          cmp /tmp/first.html strikewatch-source/dist/strikewatch-build-12.223.html >> "$OUT" 2>&1
          echo "standalone_cmp_exit=$?" >> "$OUT"
          python3 - <<'PY' >> "$OUT" 2>&1
          from pathlib import Path
          css = Path('strikewatch-source/css/compact-navigation.css').read_text(encoding='utf-8')
          print('media_count=', css.count('@media'))
          print('marker=', 'Build 12.223: desktop MUST RESPOND disclosure correction' in css)
          print('build_id=', '12.223.0-desktop-must-respond-layout' in Path('strikewatch-source/dist/strikewatch-build-12.223.html').read_text(encoding='utf-8'))
          PY
          git reset --hard HEAD
          mkdir -p .github/diagnostics
          cp "$OUT" .github/diagnostics/12.223-retry.txt
          rm .github/workflows/diagnose-12.223-retry.yml
          rm .github/triggers/diagnose-12.223-retry.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Diagnose Build 12.223 retry"
          git push origin main
