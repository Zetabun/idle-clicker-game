name: Release Build 12.221

on:
  push:
    paths:
      - '.github/triggers/release-12.221.txt'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply release patch
        run: python3 .github/scripts/release-12.221.py
      - name: Build twice deterministically
        working-directory: strikewatch-source
        run: |
          python3 build.py
          cp js/strikewatch.dev.js /tmp/bundle1.js
          cp dist/strikewatch-build-12.221.html /tmp/build1.html
          python3 build.py
          cmp /tmp/bundle1.js js/strikewatch.dev.js
          cmp /tmp/build1.html dist/strikewatch-build-12.221.html
      - name: Parse JavaScript
        run: |
          for file in strikewatch-source/js/*.js; do node --check "$file"; done
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('strikewatch-source/dist/strikewatch-build-12.221.html').read_text(encoding='utf-8')
          scripts = '\n'.join(re.findall(r'<script>(.*?)</script>', html, re.S))
          Path('/tmp/standalone.js').write_text(scripts, encoding='utf-8')
          PY
          node --check /tmp/standalone.js
      - name: Verify targeted changes
        run: |
          grep -q 'Build 12.221: desktop management layout restoration' strikewatch-source/css/compact-navigation.css
          grep -q '@media (min-width: 1024px)' strikewatch-source/css/compact-navigation.css
          grep -q 'grid-template-columns: minmax(260px, 340px) minmax(0, 1fr) !important' strikewatch-source/css/compact-navigation.css
          grep -q '@media (max-width:760px)' strikewatch-source/css/compact-navigation.css
          grep -q '12.221.0-desktop-management-layout-restoration' strikewatch-source/RELEASE.json
      - name: Publish standalone
        run: |
          cp strikewatch-source/dist/strikewatch-build-12.221.html cod.html
          cmp cod.html strikewatch-source/dist/strikewatch-build-12.221.html
      - name: Remove temporary release files
        run: |
          rm -f .github/scripts/release-12.221.py .github/workflows/release-12.221.yml .github/triggers/release-12.221.txt
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build 12.221: Desktop Management Layout Restoration'
          git push
