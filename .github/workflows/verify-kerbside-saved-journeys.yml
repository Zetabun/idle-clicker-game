name: Verify Kerbside saved journeys

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-kerbside-saved-journeys.yml
  workflow_run:
    workflows:
      - Verify Kerbside production
    types: [completed]

permissions:
  contents: read

concurrency:
  group: kerbside-saved-journey-smoke
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out production source
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install WebKit
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          cd kerbside-backend
          npx playwright install --with-deps webkit
      - name: Verify live Saved Journeys v2
        shell: bash
        env:
          APP_URL: https://zetabun.github.io/idle-clicker-game/bus.html
        run: |
          set -euo pipefail
          cd kerbside-backend
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { webkit } from 'playwright';

          const expectedVersion=(await readFile('../VERSION','utf8')).trim();
          const browser=await webkit.launch({headless:true});
          const context=await browser.newContext({timezoneId:'Europe/London',viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const page=await context.newPage();
          const errors=[];
          const rail=[];
          page.on('pageerror',error=>errors.push(String(error&&error.stack||error)));
          page.on('response',response=>{if(response.url().includes('kerbside-rail-data-zetabun.pages.dev'))rail.push({url:response.url(),status:response.status()});});
          await page.route('https://raw.githubusercontent.com/openfootball/football.json/**',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({matches:[]})}));
          await page.route('https://query.wikidata.org/sparql**',route=>route.fulfill({status:200,contentType:'application/sparql-results+json',body:JSON.stringify({head:{vars:[]},results:{bindings:[]}})}));

          try{
            await page.goto(`${process.env.APP_URL}?saved-v2-smoke=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>Boolean(window.__KERBSIDE_SAVED_JOURNEYS_V2__?.refreshSavedJourney&&window.__KERBSIDE_JOURNEY_PLANNER__?.searchPlanJourneys&&window.__KERBSIDE_TIMETABLE_PROVIDER__?.getCoverage),null,{timeout:30000});
            await page.evaluate(()=>{localStorage.removeItem('kerbside.rail.plan.saved.v1');localStorage.removeItem('kerbside.rail.plan.saved-meta.v2');});
            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>Boolean(window.__KERBSIDE_SAVED_JOURNEYS_V2__?.refreshSavedJourney&&window.__KERBSIDE_JOURNEY_PLANNER__?.searchPlanJourneys),null,{timeout:30000});
            await page.click('#transportTrain');

            const liveVersion=await page.evaluate(async()=>{const response=await fetch(`VERSION?saved-v2-smoke=${Date.now()}`,{cache:'no-store'});return (await response.text()).trim();});
            assert.equal(liveVersion,expectedVersion,'live Pages version does not match main');

            const setup=await page.evaluate(async()=>{
              const provider=window.__KERBSIDE_TIMETABLE_PROVIDER__,planner=window.__KERBSIDE_JOURNEY_PLANNER__;
              const coverage=await provider.getCoverage({force:true}),darwin=coverage?.sources?.darwin?.dates||[],nr=coverage?.sources?.networkRail?.dates||[];
              const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
              const days=(a,b)=>Math.round((new Date(`${b}T12:00:00Z`)-new Date(`${a}T12:00:00Z`))/86400000);
              const date=nr.find(value=>!darwin.includes(value)&&days(today,value)>=49)||nr.slice().reverse().find(value=>!darwin.includes(value));
              if(!date)throw new Error('No long-range Network Rail date outside Darwin coverage.');
              planner.installPlanJourney();planner.setPlanView(true);
              planner.planState.from={crs:'BHM',name:'Birmingham New Street'};planner.planState.to={crs:'LOB',name:'Longbridge'};
              const set=(id,value)=>{const node=document.getElementById(id);if(!node)throw new Error(`Missing ${id}`);node.value=value;};
              set('planJourneyFrom','Birmingham New Street');set('planJourneyTo','Longbridge');set('planJourneyDate',date);set('planJourneyStart','06:00');set('planJourneyEnd','10:00');set('planJourneyPreference','balanced');set('planJourneyMaxChanges','1');set('planJourneyConnectionBuffer','0');
              await planner.searchPlanJourneys();return {date,daysAway:days(today,date)};
            });
            assert.ok(setup.daysAway>=49,`selected saved journey is only ${setup.daysAway} days away`);
            await page.waitForSelector('#planJourneyResults [data-plan-save-key]',{state:'visible',timeout:30000});
            await page.locator('#planJourneyResults [data-plan-save-key]').first().click();
            await page.waitForFunction(()=>JSON.parse(localStorage.getItem('kerbside.rail.plan.saved.v1')||'[]').length===1,null,{timeout:10000});

            await page.click('[data-train-view="saved"]');
            await page.waitForFunction(()=>{
              const v2=window.__KERBSIDE_SAVED_JOURNEYS_V2__,card=document.querySelector('#savedJourneyList .saved-v2-card');
              const saved=v2?.state?.saved?.[0],meta=saved&&v2.state.meta.entries[saved.id];
              return Boolean(card&&meta?.lastChecked&&meta?.lastResolved?.source==='network-rail');
            },null,{timeout:30000});
            assert.equal(await page.locator('#savedJourneySurface').isVisible(),true);
            assert.equal(await page.locator('#planJourneyForm').isHidden(),true);
            assert.equal(await page.locator('#trainPlanner').isHidden(),true);

            const snapshot=await page.evaluate(()=>{
              const v2=window.__KERBSIDE_SAVED_JOURNEYS_V2__,saved=v2.state.saved[0],meta=v2.state.meta.entries[saved.id];
              return {saved,meta,card:document.querySelector('#savedJourneyList .saved-v2-card')?.textContent?.replace(/\s+/g,' ').trim()||'',savedJson:localStorage.getItem('kerbside.rail.plan.saved.v1')||'',metaJson:localStorage.getItem('kerbside.rail.plan.saved-meta.v2')||''};
            });
            assert.equal(snapshot.saved.date,setup.date);
            assert.equal(snapshot.saved.from.crs,'BHM');assert.equal(snapshot.saved.to.crs,'LOB');
            assert.equal(snapshot.meta.lastResolved.source,'network-rail');
            assert.match(snapshot.card,/Network Rail SCHEDULE/);
            assert.match(snapshot.card,/Saved plan/);
            assert.match(snapshot.card,/Since you saved it/);
            assert.doesNotMatch(snapshot.savedJson,/forecast|probabilities|reasons|liveEvidence/i);
            assert.doesNotMatch(snapshot.metaJson,/forecast|probabilities|reasons|platform|"etd"|liveEvidence/i);

            await page.locator('#savedJourneyList [data-saved-v2-refresh]').click();
            await page.waitForFunction(()=>!window.__KERBSIDE_SAVED_JOURNEYS_V2__.state.refreshing.size,null,{timeout:30000});
            await page.locator('#savedJourneyList [data-saved-v2-open]').click();
            await page.waitForFunction(()=>Boolean(window.__KERBSIDE_JOURNEY_PLANNER__?.planState?.savedFocus?.candidateKey&&document.querySelector('#planJourneyResults .plan-journey-result.is-saved-focus')),null,{timeout:30000});
            const focused=await page.locator('#planJourneyResults .plan-journey-result.is-saved-focus').textContent();
            assert.match(focused,/Quiet|Moderate|Busy|Very busy/i,'opening a saved journey did not render a recalculated Forecast v4 result');

            await page.click('[data-train-view="saved"]');
            // Deleting a saved journey is guarded by a confirm() and the control is
            // labelled data-saved-polish-delete. Prove the guard holds, then delete.
            const deleteButton=page.locator('#savedJourneyList [data-saved-polish-delete]');
            await deleteButton.waitFor({state:'visible',timeout:10000});
            page.once('dialog',dialog=>dialog.dismiss());
            await deleteButton.click();
            await page.waitForFunction(()=>!document.querySelector('#savedJourneyList .saved-v2-card')===false,null,{timeout:5000});
            assert.equal(await page.evaluate(()=>JSON.parse(localStorage.getItem('kerbside.rail.plan.saved.v1')||'[]').length),1,'dismissing the delete confirmation must keep the saved journey');
            page.once('dialog',dialog=>dialog.accept());
            await deleteButton.click();
            await page.waitForFunction(()=>JSON.parse(localStorage.getItem('kerbside.rail.plan.saved.v1')||'[]').length===0,null,{timeout:10000});
            assert.deepEqual(await page.evaluate(()=>JSON.parse(localStorage.getItem('kerbside.rail.plan.saved.v1')||'[]')),[]);
            assert.match(await page.locator('#savedJourneySurface').textContent(),/No saved journeys yet/);
            assert.ok(rail.some(item=>item.status>=200&&item.status<300&&item.url.endsWith('/manifest.json')),'Network Rail manifest was not fetched successfully');
            assert.ok(rail.some(item=>item.status>=200&&item.status<300&&item.url.includes(`/${setup.date}.json.gz`)),'selected Network Rail timetable day was not fetched successfully');
            assert.deepEqual(errors,[]);
            console.log(`Live Saved Journeys v2 passed for ${setup.date} (${setup.daysAway} days away), including automatic refresh, dedicated tab, Forecast v4 re-resolution and clean removal.`);
          }finally{await browser.close();}
          NODE
