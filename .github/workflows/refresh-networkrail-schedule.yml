name: Refresh Network Rail long-range timetable

on:
  workflow_dispatch:
  schedule:
    # Network Rail documents the daily JSON full extract as normally available
    # from around 06:00. Run after that publication window and allow a manual retry.
    - cron: '35 6 * * *'
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-networkrail-schedule.yml
      - .github/scripts/build-networkrail-schedule.py
      - .github/scripts/test-build-networkrail-schedule.py
      - .github/scripts/validate-networkrail-schedule.py

permissions:
  contents: read

concurrency:
  group: refresh-networkrail-schedule
  cancel-in-progress: true

env:
  PAGES_PROJECT: kerbside-rail-data-zetabun
  SCHEDULE_URL: https://publicdatafeeds.networkrail.co.uk/ntrod/CifFileAuthenticate?type=CIF_ALL_FULL_DAILY&day=toc-full
  WINDOW_DAYS: '84'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NETWORK_RAIL_USERNAME: ${{ secrets.NETWORK_RAIL_USERNAME }}
      NETWORK_RAIL_PASSWORD: ${{ secrets.NETWORK_RAIL_PASSWORD }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install importer dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check orjson

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in NETWORK_RAIL_USERNAME NETWORK_RAIL_PASSWORD CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required secret $name is missing or empty."
              exit 1
            fi
          done
          python -m py_compile \
            .github/scripts/build-networkrail-schedule.py \
            .github/scripts/test-build-networkrail-schedule.py \
            .github/scripts/validate-networkrail-schedule.py
          python .github/scripts/test-build-networkrail-schedule.py

      - name: Download daily all-TOC SCHEDULE snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/networkrail
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 4 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 600 \
            --user "${NETWORK_RAIL_USERNAME}:${NETWORK_RAIL_PASSWORD}" \
            "$SCHEDULE_URL" \
            --output /tmp/networkrail/toc-full.gz
          test -s /tmp/networkrail/toc-full.gz
          gzip -t /tmp/networkrail/toc-full.gz
          ls -lh /tmp/networkrail/toc-full.gz

      - name: Build rolling 12-week timetable
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          python .github/scripts/build-networkrail-schedule.py \
            /tmp/networkrail/toc-full.gz \
            site \
            --days "$WINDOW_DAYS" \
            --toc-names-manifest kerbside-rail-timetable/manifest.json

      - name: Validate generated timetable
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/validate-networkrail-schedule.py \
            site \
            --expected-days "$WINDOW_DAYS"

          cat > site/_headers <<'HEADERS'
          /*
            Access-Control-Allow-Origin: *
            X-Content-Type-Options: nosniff
            Referrer-Policy: no-referrer

          /manifest.json
            Cache-Control: public, max-age=60, s-maxage=300

          /locations.json
            Cache-Control: public, max-age=3600, s-maxage=21600

          /*.json.gz
            Cache-Control: public, max-age=300, s-maxage=3600
          HEADERS

      - name: Upload timetable artifact
        uses: actions/upload-artifact@v4
        with:
          name: kerbside-networkrail-schedule
          path: site
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Create Pages project when needed
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const apiToken = process.env.CLOUDFLARE_API_TOKEN;
          const projectName = process.env.PAGES_PROJECT;
          const baseUrl = `https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects`;
          const headers = {
            Authorization: `Bearer ${apiToken}`,
            'Content-Type': 'application/json'
          };

          async function responseBody(response) {
            const text = await response.text();
            if (!text) return null;
            try { return JSON.parse(text); } catch { return text; }
          }

          function cloudflareError(action, response, body) {
            const detail = body && typeof body === 'object'
              ? JSON.stringify(body.errors || body)
              : String(body || 'No response body');
            return new Error(`${action} failed with HTTP ${response.status}: ${detail}`);
          }

          const lookup = await fetch(`${baseUrl}/${encodeURIComponent(projectName)}`, { headers });
          const lookupBody = await responseBody(lookup);
          if (lookup.ok) {
            if (lookupBody && lookupBody.success === false) {
              throw cloudflareError('Pages project lookup', lookup, lookupBody);
            }
            console.log(`Pages project ${projectName} already exists.`);
          } else if (lookup.status === 404) {
            const create = await fetch(baseUrl, {
              method: 'POST',
              headers,
              body: JSON.stringify({ name: projectName, production_branch: 'main' })
            });
            const createBody = await responseBody(create);
            if (!create.ok || (createBody && createBody.success === false)) {
              throw cloudflareError('Pages project creation', create, createBody);
            }
            console.log(`Created Pages project ${projectName}.`);
          } else {
            throw cloudflareError('Pages project lookup', lookup, lookupBody);
          }
          NODE

      - name: Deploy long-range timetable to Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.28.1 pages deploy site \
            --project-name "$PAGES_PROJECT" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Network Rail timetable ${GITHUB_SHA::12}"
          echo "Rail data manifest: https://${PAGES_PROJECT}.pages.dev/manifest.json"
