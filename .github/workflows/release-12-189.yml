name: Release Strikewatch 12.189

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/release-12-189.txt'

permissions:
  contents: write

concurrency:
  group: release-strikewatch-12-189
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build, verify and publish
        shell: bash
        run: |
          cat > /tmp/release-12-189.sh <<'BASH'
          set -Eeuo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('strikewatch-source/RELEASE.json').read_text(encoding='utf-8'))
          expected = {
              'version': '12.188',
              'name': 'Armour Preview Optimisation',
              'build_id': '12.188.0-armour-preview-optimisation'
          }
          if release != expected:
              raise SystemExit(f'Unexpected predecessor release: {release!r}')
          PY

          python3 -m py_compile .github/scripts/release-12-189.py
          python3 .github/scripts/release-12-189.py

          # The inherited CSS debt budget is already at its !important ceiling.
          # The ID-scoped selector is strong enough without it, so remove only
          # the exact temporary declaration before building.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('strikewatch-source/css/loadout-stills.css')
          text = path.read_text(encoding='utf-8')
          old = '    z-index: 20 !important;'
          new = '    z-index: 20;'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one temporary callout z-index declaration; found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('strikewatch-source/RELEASE.json').read_text(encoding='utf-8'))
          expected = {
              'version': '12.189',
              'name': 'Mobile Equipment Preview Framing',
              'build_id': '12.189.0-mobile-equipment-preview-framing'
          }
          if release != expected:
              raise SystemExit(f'Unexpected release metadata: {release!r}')
          required_docs = {
              'HANDOFF.md': '- Build: **12.189 — Mobile Equipment Preview Framing**',
              'AGENTS.md': 'Build 12.189 owns compact equipment inspector framing.',
              'README.md': '# Strikewatch Source 12.189',
              'PROJECT.md': 'Build 12.189 improves compact Armoury readability',
              'CHANGELOG.md': '## 12.189 — Mobile Equipment Preview Framing',
              '00-READ-FIRST-GPT.md': 'Current release: **Strikewatch Build 12.189 — Mobile Equipment Preview Framing**.',
              'CONTRACTS.md': 'Compact weapon and armour inspectors open at 0.78 zoom below 1024px'
          }
          for name, expected_text in required_docs.items():
              text = Path('strikewatch-source', name).read_text(encoding='utf-8')
              if expected_text not in text:
                  raise SystemExit(f'{name} missing release requirement: {expected_text}')
          PY

          grep -F "const BUILD_VERSION = '12.189'" strikewatch-source/js/00-core.js
          grep -F "const BUILD_NAME = 'Mobile Equipment Preview Framing'" strikewatch-source/js/00-core.js
          grep -F "const BUILD_ID = '12.189.0-mobile-equipment-preview-framing'" strikewatch-source/js/00-core.js
          grep -F '<title>Strikewatch 12.189: Mobile Equipment Preview Framing</title>' strikewatch-source/index.html
          grep -F 'id="managerBuildVersion">12.189</b>' strikewatch-source/index.html
          grep -F 'id="mobileCommandBuildVersion">12.189</b>' strikewatch-source/index.html
          test -f strikewatch-source/AUDIT-12.189.md

          python3 - <<'PY'
          from pathlib import Path
          career = Path('strikewatch-source/js/35-career.js').read_text(encoding='utf-8')
          css = Path('strikewatch-source/css/loadout-stills.css').read_text(encoding='utf-8')
          required_career = [
              'const CAREER_COMPACT_LOADOUT_VIEWER_ZOOM = 0.78',
              'function careerLoadoutViewerDefaultZoom(viewportWidth = window.innerWidth)',
              'return Number(viewportWidth) < 1024 ? CAREER_COMPACT_LOADOUT_VIEWER_ZOOM : 1',
              'careerWeaponViewerState.zoom = careerLoadoutViewerDefaultZoom()',
              'careerArmourViewerState.zoom = careerLoadoutViewerDefaultZoom()',
              'function mobileLoadoutPreviewFramingForTest()',
              'const phoneZoom = careerLoadoutViewerDefaultZoom(390)',
              'const foldZoom = careerLoadoutViewerDefaultZoom(768)',
              'const desktopZoom = careerLoadoutViewerDefaultZoom(1024)'
          ]
          missing = [value for value in required_career if value not in career]
          if missing:
              raise SystemExit(f'Missing framing source requirements: {missing}')
          if career.count('zoom = careerLoadoutViewerDefaultZoom()') != 2:
              raise SystemExit('Shared framing helper is not used by exactly two reset paths')
          if career.count('clamp(careerWeaponViewerState.zoom - 0.12, 0.72, 1.35)') != 1:
              raise SystemExit('Weapon manual zoom-out bound changed unexpectedly')
          if career.count('clamp(careerArmourViewerState.zoom - 0.12, 0.72, 1.35)') != 1:
              raise SystemExit('Armour manual zoom-out bound changed unexpectedly')
          required_css = [
              'Build 12.189: compact equipment preview framing',
              '@media (orientation: portrait) and (max-width: 900px)',
              '#menuContent .career-armour-inspector-stage',
              '#menuContent .career-inspector-callout',
              'z-index: 20;',
              'max-width: calc(100% - 24px)',
              'pointer-events: none'
          ]
          missing_css = [value for value in required_css if value not in css]
          if missing_css:
              raise SystemExit(f'Missing compact callout requirements: {missing_css}')
          if 'z-index: 20 !important' in css:
              raise SystemExit('Unnecessary !important remains in compact callout rule')
          PY

          for hook in mobileLoadoutPreviewFramingForTest armourPreviewOptimisationForTest loadoutStillAuditForTest armour3dPresentationForTest armourSystemForTest loadoutStillForTest mobileInterfaceAuditForTest typographyConsistencyForTest; do
            grep -R -F "$hook" strikewatch-source/js >/dev/null
          done

          cd strikewatch-source
          python3 -m py_compile build.py
          python3 build.py
          test -f dist/strikewatch-build-12.189.html
          test -f dist/strikewatch-build-12.189-size.json
          test -f dist/strikewatch-build-12.189-css-debt.json
          cp js/strikewatch.dev.js /tmp/strikewatch.dev.first.js
          cp dist/strikewatch-build-12.189.html /tmp/strikewatch-build.first.html
          cp dist/strikewatch-build-12.189-size.json /tmp/strikewatch-size.first.json
          cp dist/strikewatch-build-12.189-css-debt.json /tmp/strikewatch-css.first.json
          cd ..

          for file in strikewatch-source/js/*.js; do
            [ "$(basename "$file")" = 'strikewatch.dev.js' ] && continue
            node --check "$file"
          done
          node --check strikewatch-source/js/strikewatch.dev.js

          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          html = Path('strikewatch-source/dist/strikewatch-build-12.189.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit('No standalone inline scripts found')
          with tempfile.TemporaryDirectory() as temp:
              for index, script in enumerate(scripts):
                  path = Path(temp) / f'inline-{index}.js'
                  path.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(path)], check=True)
          print(f'Parsed {len(scripts)} standalone inline scripts.')
          PY

          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('strikewatch-source/dist/strikewatch-build-12.189-css-debt.json').read_text(encoding='utf-8'))
          if not report.get('within_budget'):
              raise SystemExit(f'CSS debt report is outside budget: {report!r}')
          if report.get('important_declarations') != 2182:
              raise SystemExit(f'Unexpected !important count: {report.get("important_declarations")}')
          if report.get('media_queries') != 474:
              raise SystemExit(f'Unexpected media-query count: {report.get("media_queries")}')
          PY

          cd strikewatch-source
          python3 build.py
          cd ..
          cmp /tmp/strikewatch.dev.first.js strikewatch-source/js/strikewatch.dev.js
          cmp /tmp/strikewatch-build.first.html strikewatch-source/dist/strikewatch-build-12.189.html
          cmp /tmp/strikewatch-size.first.json strikewatch-source/dist/strikewatch-build-12.189-size.json
          cmp /tmp/strikewatch-css.first.json strikewatch-source/dist/strikewatch-build-12.189-css-debt.json

          cp strikewatch-source/dist/strikewatch-build-12.189.html cod.html
          cmp cod.html strikewatch-source/dist/strikewatch-build-12.189.html
          git diff --check
          BASH

          LOG=.github/release-12-189-last.log
          set +e
          bash /tmp/release-12-189.sh 2>&1 | tee "$LOG"
          release_status=${PIPESTATUS[0]}
          set -e

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$release_status" -ne 0 ]; then
            printf '\nFAILED_EXIT_CODE=%s\n' "$release_status" >> "$LOG"
            git add "$LOG"
            git commit -m 'Record Build 12.189 release failure'
            git push origin HEAD:main
            exit "$release_status"
          fi

          rm -f "$LOG"
          rm -f .github/scripts/release-12-189.py
          rm -f .github/workflows/release-12-189.yml
          rm -f .github/triggers/release-12-189.txt
          git add -A
          git diff --cached --quiet && { echo 'No release changes produced.'; exit 1; }
          git commit -m 'Build 12.189: mobile equipment preview framing'
          git push origin HEAD:main
