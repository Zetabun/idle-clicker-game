name: Deploy Kerbside Rail Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - kerbside-rail-worker/**

permissions:
  contents: read

concurrency:
  group: kerbside-rail-worker-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kerbside-rail-worker

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RDM_LDB_API_KEY: ${{ secrets.RDM_LDB_API_KEY }}
      RAIL_SMOKE_URL: https://kerbside-rail.adambullas.workers.dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN RDM_LDB_API_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required secret $name is missing or empty."
              exit 1
            fi
          done

      - name: Install, check and test rail Worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --package-lock=false
          npm run check
          npm test

      - name: Deploy rail Worker and configure Rail Data secret
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy
          printf '%s' "$RDM_LDB_API_KEY" | npx wrangler secret put RDM_LDB_API_KEY
          npx wrangler deployments list

      - name: Verify official live departures
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          healthy=false
          for attempt in $(seq 1 6); do
            if curl --fail --location --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              -H 'Cache-Control: no-cache' \
              "$RAIL_SMOKE_URL/departures/BHM/9?expand=true&smoke=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" -o "$body"; then
              if jq -e '.crs == "BHM" and has("trainServices")' "$body" >/dev/null; then
                healthy=true
                echo "Official Rail Data LDB endpoint returned a valid Birmingham departure board."
                break
              fi
            fi
            echo "Rail Data LDB smoke attempt $attempt failed; retrying."
            sleep 5
          done
          if [[ "$healthy" != true ]]; then
            echo "::error::Production rail Worker did not return a valid LDB board after deployment."
            cat "$body" || true
            exit 1
          fi
