name: Deploy Kerbside accuracy hardening build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Kerbside semantic version for this build
        required: true
        default: '0.7.5'
        type: string
      mode:
        description: Validate only, or commit the tested build to main
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - deploy

permissions:
  contents: write

concurrency:
  group: kerbside-accuracy-hardening-deploy
  cancel-in-progress: false

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Record guarded base
        shell: bash
        run: echo "KERBSIDE_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate requested version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be semantic version X.Y.Z"
            exit 1
          fi
          if [[ "$VERSION_INPUT" == "$(cat VERSION)" ]]; then
            echo "::error::Choose a new version; current VERSION is $(cat VERSION)."
            exit 1
          fi

      - name: Apply location and prediction hardening build
        run: node kerbside-backend/scripts/apply-accuracy-hardening-build.mjs "${{ inputs.version }}"

      - name: Synchronise version references
        run: python3 .github/scripts/sync-version.py

      - name: Verify hardening invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "source:originSource" bus.html
          grep -Fq "function cancelPendingDeviceLocation" bus.html
          grep -Fq "function stopSelectionNeedsChoice" bus.html
          grep -Fq "GPS movement matched to ordered route pattern" bus.html
          grep -Fq "patternOnly:true" bus.html
          grep -Fq "function etaMotionModel" bus.html
          grep -Fq "const ETA_DWELL_SECONDS_PER_STOP = 18" bus.html
          grep -Fq "const UK_TIME_ZONE = 'Europe/London'" bus.html
          if grep -Fq "const dwell = (road/1000) * 24" bus.html; then
            echo "::error::Distance-based dwell is still present in estimate()."
            exit 1
          fi
          if grep -Fq "label:'GPS movement matched to ordered route',journeyMatch:true" bus.html; then
            echo "::error::Pattern inference still promotes geometry to trip identity."
            exit 1
          fi
          python3 .github/scripts/sync-version.py --check

      - name: Install test dependencies
        run: npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false

      - name: Validate JavaScript and unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          source = Path('bus.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', source, flags=re.I | re.S)
          if not scripts:
              raise SystemExit('No inline browser scripts found')
          with tempfile.TemporaryDirectory() as directory:
              for index, script in enumerate(scripts, start=1):
                  filename = Path(directory) / f'inline-{index}.js'
                  filename.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(filename)], check=True)
          print(f'Validated {len(scripts)} inline browser script(s).')
          PY
          node --check build-timetable.js
          npm run check --prefix kerbside-backend
          npm test --prefix kerbside-backend

      - name: Parse workflows
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; ARGV.each { |file| YAML.parse_file(file) or abort(file) }" \
            .github/workflows/deploy-kerbside-accuracy-hardening.yml \
            .github/workflows/kerbside-check.yml \
            .github/workflows/deploy-kerbside-worker.yml \
            .github/workflows/verify-kerbside-production.yml

      - name: Install browser engines
        working-directory: kerbside-backend
        run: npx playwright install --with-deps webkit chromium

      - name: Run WebKit regression suites
        shell: bash
        run: |
          set -euo pipefail
          npm run test:browser --prefix kerbside-backend
          npm run test:identity --prefix kerbside-backend
          npm run test:multi-vehicle --prefix kerbside-backend
          npm run test:audit --prefix kerbside-backend
          npm run test:accuracy-hardening --prefix kerbside-backend

      - name: Run Chromium regression suites
        shell: bash
        env:
          KERBSIDE_BROWSER: chromium
        run: |
          set -euo pipefail
          npm run test:browser --prefix kerbside-backend
          npm run test:identity --prefix kerbside-backend
          npm run test:multi-vehicle --prefix kerbside-backend
          npm run test:audit --prefix kerbside-backend
          npm run test:accuracy-hardening --prefix kerbside-backend

      - name: Second-pass accuracy verification
        shell: bash
        run: |
          set -euo pipefail
          npm run test:accuracy-hardening --prefix kerbside-backend
          KERBSIDE_BROWSER=chromium npm run test:accuracy-hardening --prefix kerbside-backend
          git diff --check

      - name: Show proposed build diff
        run: |
          git diff --stat
          git diff -- \
            bus.html VERSION \
            kerbside-backend/src/worker.js \
            kerbside-backend/package.json \
            kerbside-backend/test/worker.test.js \
            kerbside-backend/tests/browser-regression.mjs \
            .github/workflows/kerbside-check.yml

      - name: Commit tested build to main
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$KERBSIDE_BASE_SHA" ]]; then
            echo "::error::main changed while this build was testing. Run the workflow again on the new main instead of pushing a stale build."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            bus.html VERSION \
            kerbside-backend/src/worker.js \
            kerbside-backend/package.json \
            kerbside-backend/test/worker.test.js \
            kerbside-backend/tests/browser-regression.mjs \
            .github/workflows/kerbside-check.yml
          git diff --cached --check
          git commit -m "Kerbside ${VERSION_INPUT}: harden location and prediction accuracy"
          git push origin HEAD:main
