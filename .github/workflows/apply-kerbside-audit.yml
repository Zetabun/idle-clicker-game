name: Apply Kerbside audit fixes

on:
  push:
    branches: [agent/kerbside-audit-fixes]
    paths:
      - .github/workflows/apply-kerbside-audit.yml
      - .github/scripts/kerbside-audit-patch.gz.b64.*
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-kerbside-audit.yml
      - .github/scripts/kerbside-audit-patch.gz.b64.*

permissions:
  contents: write

concurrency:
  group: apply-kerbside-audit-fixes
  cancel-in-progress: false

jobs:
  apply-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/kerbside-audit-fixes
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/scripts/kerbside-audit-patch.gz.b64.* | base64 --decode | gzip --decompress > /tmp/apply.py
          python3 /tmp/apply.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('kerbside-backend/tests/browser-regression.mjs')
          text = path.read_text(encoding='utf-8')
          old = r"assert.match(busSource, /const set=new Set\(timetableRouteSet\(\)\);/);"
          new = r"""assert.match(busSource, /const timetableSet=timetableRouteSet\(\);/);
          assert.match(busSource, /const set=new Set\(timetableSet\);/);"""
          if text.count(old) != 1:
              raise SystemExit(f'knownRoutes assertion: expected one match, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 .github/scripts/sync-version.py
      - name: Install browsers
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          npm run vendor:leaflet --prefix kerbside-backend
          if git ls-files --error-unmatch kerbside-backend/vendor/leaflet/leaflet.js >/dev/null 2>&1; then
            git diff --exit-code -- kerbside-backend/vendor/leaflet
          fi
          cd kerbside-backend
          npx playwright install --with-deps webkit chromium
      - name: Validate source and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sync-version.py --check
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          source = Path('bus.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', source, flags=re.I | re.S)
          if not scripts:
              raise SystemExit('No inline browser scripts found')
          with tempfile.TemporaryDirectory() as directory:
              for index, script in enumerate(scripts, 1):
                  filename = Path(directory) / f'inline-{index}.js'
                  filename.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(filename)], check=True)
          PY
          node --check build-timetable.js
          npm run check --prefix kerbside-backend
          npm test --prefix kerbside-backend
          for engine in webkit chromium; do
            export KERBSIDE_BROWSER="$engine"
            npm run test:browser --prefix kerbside-backend
            npm run test:identity --prefix kerbside-backend
            npm run test:multi-vehicle --prefix kerbside-backend
            npm run test:audit --prefix kerbside-backend
          done
      - name: Commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-kerbside-audit.yml
          rm -f .github/scripts/kerbside-audit-patch.gz.b64.*
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Kerbside 0.6.93: finish tracking accuracy audit' \
            -m 'Prefer stable vehicle identity and preserve operator, route and repeated-stop occurrence through timetable matching.' \
            -m 'Use unblended GPS timing for status labels, align map filtering with authoritative evidence and settings, and harden release checks.' \
            -m 'Remove the obsolete self-writing repair workflow and add functional browser regressions.'
          git push origin HEAD:agent/kerbside-audit-fixes
