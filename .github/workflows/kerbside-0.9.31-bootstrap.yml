name: Bootstrap Kerbside 0.9.31 movement recovery

on:
  push:
    branches:
      - agent/kerbside-0.9.31-movement-match-recovery

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/kerbside-0.9.31-movement-match-recovery
          fetch-depth: 0
      - name: Apply and verify patch
        run: |
          python3 .github/scripts/apply-0.9.31-movement-recovery.py
          python3 .github/scripts/sync-version.py
          node --check kerbside-train-movement.js
          node --check kerbside-train-movement-worker/movement-core.js
          node --check kerbside-train-movement-worker/worker.js
          node --check kerbside-backend/tests/train-movement-browser-regression.mjs
          node --test kerbside-train-movement-worker/movement-core.test.mjs
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION .github/scripts/sync-version.py bus.html kerbside-status.js kerbside-journey-planner-ui.js kerbside-saved-journeys-polish.js kerbside-train-movement.js kerbside-train-movement-worker/movement-core.js kerbside-train-movement-worker/movement-core.test.mjs kerbside-train-movement-worker/worker.js kerbside-backend/package.json kerbside-backend/src/worker.js kerbside-backend/test/worker.test.js kerbside-backend/tests/browser-regression.mjs kerbside-backend/tests/train-movement-browser-regression.mjs
          git commit -m 'Fix live train movement matching recovery'
          git push origin HEAD:agent/kerbside-0.9.31-movement-match-recovery
