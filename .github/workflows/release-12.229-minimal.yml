name: Release Build 12.229 Minimal

on:
  push:
    paths:
      - '.github/triggers/release-12.229-minimal.txt'

permissions:
  contents: write

concurrency:
  group: strikewatch-release-12.229-minimal
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run release
        run: bash .github/scripts/run-release-12.229.sh
      - name: Commit failure ledger
        if: failure()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p .github/diagnostics
          {
            echo
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "trigger_sha=${GITHUB_SHA}"
          } >> .github/diagnostics/12.229.txt
          git add .github/diagnostics/12.229.txt
          git commit -m 'Record Build 12.229 release failure' || true
          git push origin HEAD:main || true
