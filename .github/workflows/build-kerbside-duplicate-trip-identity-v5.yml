name: Build Kerbside duplicate trip identity v5

on:
  push:
    branches:
      - agent/kerbside-0.8.9-duplicate-trip-identity
    paths:
      - .github/workflows/build-kerbside-duplicate-trip-identity-v5.yml

permissions:
  contents: write

concurrency:
  group: kerbside-duplicate-trip-identity-build-v5
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out build branch
        uses: actions/checkout@v5
        with:
          ref: agent/kerbside-0.8.9-duplicate-trip-identity
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Load and apply reviewed patcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/git/blobs/97aa5a4746d1f48efe4b3654a1c128a9cf5c0046 --jq .content | tr -d '\n' | base64 -d > /tmp/duplicate-trip-build.mjs
          node --check /tmp/duplicate-trip-build.mjs
          node /tmp/duplicate-trip-build.mjs 0.8.9
          python3 .github/scripts/sync-version.py
          python3 .github/scripts/sync-version.py --check

      - name: Migrate exact browser assertions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('kerbside-backend/tests/browser-regression.mjs')
          source=path.read_text(encoding='utf-8')
          replacements={
            "assert.match(busSource, /const inference=!evidence\\.journeyMatch\\?inferVehicleJourneyPattern/);":
              "assert.match(busSource, /const inference=!evidence\\.journeyMatch&&!evidence\\.originEquivalentAmbiguous\\?inferVehicleJourneyPattern/);",
            "assert.match(busSource, /function claimedScheduleFor\\(row\\)\\{[\\s\\S]{0,180}if\\(row\\.gpsLost&&!row\\.scheduleFallback\\) return null;[\\s\\S]{0,180}return row\\.schedule\\|\\|row\\.matchedSchedule\\|\\|exactIdentityScheduleClaim\\(row\\)\\|\\|null;/);":
              "assert.match(busSource, /function claimedSchedulesFor\\(row\\)\\{[\\s\\S]{0,360}originEquivalentAmbiguous[\\s\\S]{0,360}exactIdentityScheduleClaim\\(row\\)\\|\\|null;/);\nassert.match(busSource, /function claimedScheduleFor\\(row\\)\\{ return claimedSchedulesFor\\(row\\)\\[0\\]\\|\\|null; \\}/);",
            "  assert.ok(busSource.includes(\"return row.schedule||row.matchedSchedule||exactIdentityScheduleClaim(row)||null;\"));":
              "  assert.ok(busSource.includes(\"const claimed=row.schedule||row.matchedSchedule||exactIdentityScheduleClaim(row)||null;\"));\n  assert.ok(busSource.includes(\"return claimed?[claimed]:[];\"));"
          }
          for old,new in replacements.items():
              if source.count(old)!=1:
                  raise SystemExit(f'expected one legacy assertion, found {source.count(old)}: {old[:100]}')
              source=source.replace(old,new)
          path.write_text(source,encoding='utf-8')
          PY

      - name: Verify safety invariants
        run: |
          set -euo pipefail
          grep -Fq 'function equivalentAmbiguousOriginMatch(rows,identity,dest,line,now=Date.now())' bus.html
          grep -Fq 'if(!exact.authoritative||!exact.known||!exact.serves) return null' bus.html
          grep -Fq 'liveKeys.size!==1' bus.html
          grep -Fq "matchedTrip:''" bus.html
          grep -Fq '!evidence.journeyMatch&&!evidence.originEquivalentAmbiguous?inferVehicleJourneyPattern' bus.html
          grep -Fq '!evidence.originEquivalentAmbiguous){ v.progressTrip=est.schedule.trip' bus.html
          grep -Fq 'tests/duplicate-trip-identity-regression.mjs' kerbside-backend/package.json
          test "$(cat VERSION)" = '0.8.9'

      - name: Install dependencies and browser engines
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          npm run vendor:leaflet --prefix kerbside-backend
          cd kerbside-backend
          npx playwright install --with-deps webkit chromium

      - name: Validate syntax and unit tests
        run: |
          set -euo pipefail
          node --check kerbside-backend/tests/duplicate-trip-identity-regression.mjs
          npm run check --prefix kerbside-backend
          npm test --prefix kerbside-backend
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          source=Path('bus.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',source,flags=re.I|re.S)
          with tempfile.TemporaryDirectory() as directory:
              for index,script in enumerate(scripts,start=1):
                  target=Path(directory)/f'inline-{index}.js'
                  target.write_text(script,encoding='utf-8')
                  subprocess.run(['node','--check',str(target)],check=True)
          PY

      - name: Run targeted duplicate identity safety gate
        run: |
          set -euo pipefail
          node kerbside-backend/tests/duplicate-trip-identity-regression.mjs
          KERBSIDE_BROWSER=chromium node kerbside-backend/tests/duplicate-trip-identity-regression.mjs

      - name: Run WebKit bus safety regressions
        run: |
          set -euo pipefail
          npm run test:browser --prefix kerbside-backend
          npm run test:identity --prefix kerbside-backend
          npm run test:multi-vehicle --prefix kerbside-backend
          npm run test:audit --prefix kerbside-backend
          npm run test:accuracy-hardening --prefix kerbside-backend
          npm run test:stop-side --prefix kerbside-backend
          npm run test:journey-identity --prefix kerbside-backend
          npm run test:listing-reliability --prefix kerbside-backend

      - name: Run Chromium bus safety regressions
        env:
          KERBSIDE_BROWSER: chromium
        run: |
          set -euo pipefail
          npm run test:browser --prefix kerbside-backend
          npm run test:identity --prefix kerbside-backend
          npm run test:multi-vehicle --prefix kerbside-backend
          npm run test:audit --prefix kerbside-backend
          npm run test:accuracy-hardening --prefix kerbside-backend
          npm run test:stop-side --prefix kerbside-backend
          npm run test:journey-identity --prefix kerbside-backend
          npm run test:listing-reliability --prefix kerbside-backend

      - name: Second-pass verification
        run: |
          set -euo pipefail
          node kerbside-backend/tests/duplicate-trip-identity-regression.mjs
          KERBSIDE_BROWSER=chromium node kerbside-backend/tests/duplicate-trip-identity-regression.mjs
          git diff --check

      - name: Commit tested build and remove temporary build files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/build-kerbside-duplicate-trip-identity.yml .github/workflows/build-kerbside-duplicate-trip-identity-v2.yml .github/workflows/build-kerbside-duplicate-trip-identity-v3.yml .github/workflows/build-kerbside-duplicate-trip-identity-v4.yml .github/workflows/build-kerbside-duplicate-trip-identity-v5.yml kerbside-backend/scripts/apply-duplicate-trip-identity-build.mjs
          git add bus.html VERSION kerbside-backend/src/worker.js kerbside-backend/package.json kerbside-backend/test/worker.test.js kerbside-backend/tests/browser-regression.mjs kerbside-backend/tests/duplicate-trip-identity-regression.mjs
          git diff --cached --check
          git commit -m 'Kerbside 0.8.9: resolve duplicate timetable identities'
          git push origin HEAD:agent/kerbside-0.8.9-duplicate-trip-identity
