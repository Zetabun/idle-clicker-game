name: Build timetable

# Rebuilds timetable.json from BODS GTFS and commits it to the repo.
# Runs on the 1st of each month, or whenever you press Run workflow.
#
# SETUP (once):
#   Settings -> Secrets and variables -> Actions
#     New repository secret:  BODS_KEY  = your Bus Open Data key
#   Settings -> Actions -> General -> Workflow permissions
#     Select "Read and write permissions", then Save
#
# Change REGION / LAT / LON / RADIUS below to your area.
# Region codes: north_east, north_west, yorkshire, east_midlands,
#   west_midlands, east_anglia, london, south_east, south_west

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

env:
  REGION: west_midlands
  LAT: '52.5089'
  LON: '-2.0870'
  RADIUS: '8000'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Download GTFS for the region
        run: |
          curl -fSL --retry 3 \
            "https://data.bus-data.dft.gov.uk/timetable/download/gtfs-file/${REGION}/?api_key=${{ secrets.BODS_KEY }}" \
            -o gtfs.zip
          ls -lh gtfs.zip

      - name: Unzip
        run: |
          mkdir -p gtfs
          unzip -o -q gtfs.zip -d gtfs
          ls -lh gtfs

      - name: Build timetable.json
        run: node build-timetable.js ./gtfs "$LAT" "$LON" "$RADIUS"

      - name: Show what was built
        run: ls -lh timetable.json

      # git diff only compares tracked files, so a brand new
      # timetable.json would look like "no change" and be thrown
      # away. Stage it first, then compare against the last commit.
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add timetable.json
          if git diff --cached --quiet; then
            echo "No change to commit."
          else
            git commit -m "Rebuild timetable.json ($(date -u +%Y-%m-%d))"
            git push
          fi
