name: Verify Kerbside Network Rail movement

on:
  pull_request:
    paths:
      - VERSION
      - kerbside-train-movement.js
      - kerbside-journey-planner-ui.js
      - kerbside-train-movement-worker/**
      - kerbside-backend/package.json
      - kerbside-backend/tests/train-movement-browser-regression.mjs
      - .github/scripts/build-networkrail-corpus.mjs
      - .github/scripts/networkrail-corpus.test.mjs
      - .github/scripts/probe-networkrail-movement.mjs
      - .github/scripts/probe-networkrail-movement-replay.mjs
      - .github/workflows/verify-kerbside-train-movement.yml
      - .github/workflows/deploy-kerbside-train-movement-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kerbside-train-movement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NETWORK_RAIL_USERNAME: ${{ secrets.NETWORK_RAIL_USERNAME }}
      NETWORK_RAIL_PASSWORD: ${{ secrets.NETWORK_RAIL_PASSWORD }}

    steps:
      - name: Check out branch
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate movement parser and CORPUS builder
        shell: bash
        run: |
          set -euo pipefail
          node --check kerbside-train-movement.js
          node --check kerbside-train-movement-worker/worker.js
          node --check kerbside-train-movement-worker/movement-core.js
          node --check .github/scripts/build-networkrail-corpus.mjs
          node --check .github/scripts/probe-networkrail-movement.mjs
          node --check .github/scripts/probe-networkrail-movement-replay.mjs
          node --test kerbside-train-movement-worker/movement-core.test.mjs
          node --test .github/scripts/networkrail-corpus.test.mjs

      - name: Validate Cloudflare movement Worker bundle
        shell: bash
        working-directory: kerbside-train-movement-worker
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --package-lock=false
          npx wrangler deploy --dry-run --outdir=/tmp/kerbside-train-movement-worker

      - name: Verify live Network Rail CORPUS access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NETWORK_RAIL_USERNAME"
          test -n "$NETWORK_RAIL_PASSWORD"
          curl --fail --location --silent --show-error --retry 2 --retry-delay 2 \
            --user "$NETWORK_RAIL_USERNAME:$NETWORK_RAIL_PASSWORD" \
            'https://publicdatafeeds.networkrail.co.uk/ntrod/SupportingFileAuthenticate?type=CORPUS' \
            --output /tmp/networkrail-corpus.json
          node .github/scripts/build-networkrail-corpus.mjs /tmp/networkrail-corpus.json /tmp/corpus.generated.js
          node --check /tmp/corpus.generated.js

      - name: Probe live Network Rail MOVEMENT STOMP feed
        shell: bash
        env:
          NETWORK_RAIL_PROBE_TIMEOUT_MS: '60000'
        run: |
          set -euo pipefail
          node .github/scripts/probe-networkrail-movement.mjs

      - name: Verify durable TRUST replay across idle gap
        shell: bash
        env:
          NETWORK_RAIL_REPLAY_GAP_MS: '180000'
          NETWORK_RAIL_REPLAY_TIMEOUT_MS: '60000'
        run: |
          set -euo pipefail
          node .github/scripts/probe-networkrail-movement-replay.mjs

      - name: Install browser regression dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          npm run vendor:leaflet --prefix kerbside-backend
          cd kerbside-backend
          npx playwright install --with-deps webkit chromium

      - name: Verify movement overlay in WebKit
        shell: bash
        run: node kerbside-backend/tests/train-movement-browser-regression.mjs

      - name: Verify movement overlay in Chromium
        shell: bash
        env:
          KERBSIDE_BROWSER: chromium
        run: node kerbside-backend/tests/train-movement-browser-regression.mjs
