name: Patch Kerbside 0.9.34

on:
  push:
    branches:
      - agent/kerbside-0.9.34-memory-first-movement
    paths:
      - .github/scripts/patch-kerbside-0.9.34.py
      - .github/scripts/fix-patch-kerbside-0.9.34.py
      - .github/workflows/patch-kerbside-0.9.34.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/kerbside-0.9.34-memory-first-movement
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Apply 0.9.34 patch
        run: python3 .github/scripts/fix-patch-kerbside-0.9.34.py
      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION bus.html kerbside-status.js kerbside-saved-journeys-polish.js kerbside-journey-planner-ui.js kerbside-train-movement.js kerbside-train-movement-worker/worker.js kerbside-train-movement-worker/movement-core.test.mjs kerbside-train-movement-worker/movement-storage-policy.js kerbside-train-movement-worker/movement-storage-policy.test.mjs kerbside-backend/src/worker.js kerbside-backend/package.json kerbside-backend/test/worker.test.js kerbside-backend/tests/browser-regression.mjs kerbside-backend/tests/train-movement-browser-regression.mjs
          git diff --cached --check
          git commit -m 'Kerbside 0.9.34: make TRUST movement memory-first'
          git push origin HEAD:agent/kerbside-0.9.34-memory-first-movement
