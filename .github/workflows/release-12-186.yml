name: Release Strikewatch 12.186

on:
  push:
    branches:
      - main
    paths:
      - .github/release-12-186.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strikewatch-release-12-186
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out marked revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Build, verify and publish 12.186
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f .github/release-12-186.trigger ]; then
            echo "No 12.186 trigger marker on this revision; nothing to do."
            exit 0
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {
              'version': '12.185',
              'name': 'Blood Visibility & Deployment CSS Ownership',
              'build_id': '12.185.0-blood-visibility-deployment-css-ownership',
          }
          actual = json.loads(Path('strikewatch-source/RELEASE.json').read_text(encoding='utf-8'))
          if actual != expected:
              raise SystemExit(f'Predecessor guard failed: expected {expected}, got {actual}')
          if not Path('.github/scripts/release-12-186.py').is_file():
              raise SystemExit('Release patch is missing')
          PY

          python3 .github/scripts/release-12-186.py
          cd strikewatch-source

          python3 -m py_compile build.py
          python3 build.py

          find js -maxdepth 1 -type f -name '*.js' ! -name 'strikewatch.dev.js' -print0 | sort -z | xargs -0 -n1 node --check
          node --check js/strikewatch.dev.js

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          standalone_path = Path('dist/strikewatch-build-12.186.html')
          standalone = standalone_path.read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', standalone, flags=re.S)
          if not scripts:
              raise SystemExit('No standalone inline scripts found')
          for index, script in enumerate(scripts):
              Path(f'/tmp/sw-12-186-inline-{index}.js').write_text(script, encoding='utf-8')

          storage = Path('js/81-career-indexeddb.js').read_text(encoding='utf-8')
          menus = Path('js/50-ui-menus.js').read_text(encoding='utf-8')
          contracts = Path('CONTRACTS.md').read_text(encoding='utf-8')
          bundle = Path('js/strikewatch.dev.js').read_text(encoding='utf-8')
          index = Path('index.html').read_text(encoding='utf-8')
          release = json.loads(Path('RELEASE.json').read_text(encoding='utf-8'))

          expected_release = {
              'version': '12.186',
              'name': 'Accurate Storage Reporting',
              'build_id': '12.186.0-accurate-storage-reporting',
          }
          if release != expected_release:
              raise SystemExit(f'Release metadata mismatch: {release}')

          required_storage = (
              "estimateStatus: 'idle'",
              "return 'MEASURING...'",
              "ALL SITE DATA",
              "function careerStorageRefreshOpenSettings()",
              "function careerStorageReportingForTest()",
              "originScope: 'Includes all storage used by this site origin",
              "careerStorageRefreshQuota({ refreshUi: false });",
          )
          missing_storage = [token for token in required_storage if token not in storage]
          if missing_storage:
              raise SystemExit(f'Missing storage reporting source tokens: {missing_storage}')

          required_menu = (
              'CAREER SAVE FILE',
              'RECOVERY BACKUP',
              'LOCAL CAREER DATA',
              'BROWSER ORIGIN STORAGE',
              'PRIMARY SAVE TIER',
              'DURABLE MIRROR',
          )
          missing_menu = [token for token in required_menu if token not in menus]
          if missing_menu:
              raise SystemExit(f'Missing Configuration labels: {missing_menu}')
          if 'BROWSER ALLOWANCE USED' in menus:
              raise SystemExit('Misleading browser allowance label remains')
          if 'career-specific allowance' not in contracts:
              raise SystemExit('Storage scope contract was not documented')
          for hook in ('careerStorageReportingForTest', 'careerIndexedDbForTest', 'careerIndexedDbRoundTripForTest'):
              if hook not in bundle:
                  raise SystemExit(f'Missing retained persistence hook: {hook}')
          if 'Strikewatch 12.186: Accurate Storage Reporting' not in index:
              raise SystemExit('Development title was not updated')
          if index.count('12.186.0-accurate-storage-reporting') < 20:
              raise SystemExit('Development cache keys were not updated')
          if re.search(r'<link rel="stylesheet" href="css/', standalone):
              raise SystemExit('Standalone retained an external stylesheet')

          size_report = json.loads(Path('dist/strikewatch-build-12.186-size.json').read_text(encoding='utf-8'))
          css_report = json.loads(Path('dist/strikewatch-build-12.186-css-debt.json').read_text(encoding='utf-8'))
          if not css_report.get('within_budget'):
              raise SystemExit(f'CSS report outside budget: {css_report}')
          if size_report.get('version') != '12.186' or css_report.get('version') != '12.186':
              raise SystemExit('Generated reports carry the wrong version')
          PY

          for script in /tmp/sw-12-186-inline-*.js; do node --check "$script"; done

          cp js/strikewatch.dev.js /tmp/sw-12-186-first.dev.js
          cp dist/strikewatch-build-12.186.html /tmp/sw-12-186-first.html
          cp dist/strikewatch-build-12.186-size.json /tmp/sw-12-186-first-size.json
          cp dist/strikewatch-build-12.186-css-debt.json /tmp/sw-12-186-first-css.json
          python3 build.py
          cmp /tmp/sw-12-186-first.dev.js js/strikewatch.dev.js
          cmp /tmp/sw-12-186-first.html dist/strikewatch-build-12.186.html
          cmp /tmp/sw-12-186-first-size.json dist/strikewatch-build-12.186-size.json
          cmp /tmp/sw-12-186-first-css.json dist/strikewatch-build-12.186-css-debt.json

          npm install --prefix /tmp/sw-playwright playwright@1.52.0 --no-save
          /tmp/sw-playwright/node_modules/.bin/playwright install chromium
          python3 -m http.server 8126 --bind 127.0.0.1 >/tmp/sw-12-186-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1

          cat >/tmp/sw-12-186-browser.js <<'JS'
          const { chromium } = require('/tmp/sw-playwright/node_modules/playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist']
            });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const faults = [];
            page.on('pageerror', error => faults.push(`pageerror: ${error.message}`));
            page.on('console', message => {
              if (message.type() === 'error') faults.push(`console: ${message.text()}`);
            });
            await page.addInitScript(() => {
              let resolveEstimate;
              const estimatePromise = new Promise(resolve => { resolveEstimate = resolve; });
              Object.defineProperty(window.navigator, 'storage', {
                configurable: true,
                value: { estimate: () => estimatePromise }
              });
              window.__resolveStorageEstimateForRelease = resolveEstimate;
            });
            await page.goto('http://127.0.0.1:8126/index.html', { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => Boolean(window.__strikeDebug?.careerStorageReportingForTest));

            const initial = await page.evaluate(() => ({
              diagnostic: window.__strikeDebug.careerStorageReportingForTest(),
              summary: window.__strikeDebug.careerStorageSummaryForTest()
            }));
            if (!initial.diagnostic.ok) throw new Error(`storage diagnostic failed: ${JSON.stringify(initial)}`);
            if (initial.summary.originUsageStatus !== 'loading') {
              throw new Error(`expected loading estimate, got ${JSON.stringify(initial.summary)}`);
            }
            if (initial.summary.originUsageLabel !== 'MEASURING...') {
              throw new Error(`pending estimate label mismatch: ${initial.summary.originUsageLabel}`);
            }

            await page.evaluate(() => window.__resolveStorageEstimateForRelease({
              usage: 2 * 1024 * 1024,
              quota: 100 * 1024 * 1024
            }));
            await page.waitForFunction(() => window.__strikeDebug.careerStorageSummaryForTest().originUsageStatus === 'ready');
            const settled = await page.evaluate(() => window.__strikeDebug.careerStorageSummaryForTest());
            if (!settled.originUsageLabel.includes('ALL SITE DATA')) {
              throw new Error(`settled origin label is not scoped: ${JSON.stringify(settled)}`);
            }
            if (!settled.originScope.includes('not a career-specific allowance')) {
              throw new Error(`scope explanation missing: ${JSON.stringify(settled)}`);
            }
            if (settled.fastTierSize !== settled.totalSize) {
              throw new Error(`local career byte aliases disagree: ${JSON.stringify(settled)}`);
            }

            const sourceMarkup = await page.evaluate(async () => {
              const response = await fetch('js/50-ui-menus.js');
              const source = await response.text();
              return {
                hasOld: source.includes('BROWSER ALLOWANCE USED'),
                labels: ['CAREER SAVE FILE', 'RECOVERY BACKUP', 'LOCAL CAREER DATA', 'BROWSER ORIGIN STORAGE', 'PRIMARY SAVE TIER', 'DURABLE MIRROR'].every(label => source.includes(label))
              };
            });
            if (sourceMarkup.hasOld || !sourceMarkup.labels) {
              throw new Error(`Configuration source labels failed: ${JSON.stringify(sourceMarkup)}`);
            }
            if (faults.length) throw new Error(faults.join('\n'));
            console.log(JSON.stringify({ initial, settled, sourceMarkup }));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS

          node /tmp/sw-12-186-browser.js
          kill "$server_pid" 2>/dev/null || true
          trap - EXIT

          cp dist/strikewatch-build-12.186.html ../cod.html
          cmp dist/strikewatch-build-12.186.html ../cod.html

          cd ..
          rm -f .github/scripts/release-12-186.py .github/workflows/release-12-186.yml .github/release-12-186.trigger
          git add -A -- strikewatch-source cod.html .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build 12.186: fix storage reporting"
          git push origin HEAD:main
