name: Deploy Kerbside reliability hardening build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Kerbside semantic version for this build
        required: true
        default: '0.7.8'
        type: string
      mode:
        description: Validate only, or commit the tested build to main
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - deploy

permissions:
  contents: write

concurrency:
  group: kerbside-reliability-hardening-deploy
  cancel-in-progress: false

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 85

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Record guarded base
        shell: bash
        run: echo "KERBSIDE_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate requested version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be semantic version X.Y.Z"
            exit 1
          fi
          if [[ "$VERSION_INPUT" == "$(cat VERSION)" ]]; then
            echo "::error::Choose a new version; current VERSION is $(cat VERSION)."
            exit 1
          fi

      - name: Apply reliability hardening build
        run: node kerbside-backend/scripts/apply-reliability-hardening-build.mjs "${{ inputs.version }}"

      - name: Synchronise version references
        run: python3 .github/scripts/sync-version.py

      - name: Verify reliability hardening invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "const GPS_RESULT_HEALTHY_GRACE_MS = 90*1000" bus.html
          grep -Fq "function liveFeedHealthyForRetention(now=Date.now())" bus.html
          grep -Fq "row.scheduleFallback=true" bus.html
          grep -Fq "GPS lost · schedule" bus.html
          grep -Fq "mode:'feed-speed'" bus.html
          grep -Fq "mode:'gps-average'" bus.html
          grep -Fq "function disruptionState(situation,now)" bus.html
          grep -Fq "function disruptionAppliesToService(situation,line,operator,requireOperator=false)" bus.html
          grep -Fq "Affects this service · location not supplied by publisher" bus.html
          grep -Fq "disruption or planned change on your routes" bus.html
          grep -Fq '"test:disruptions": "node tests/disruption-regression.mjs"' kerbside-backend/package.json
          grep -Fq '"test:listing-reliability": "node tests/listing-reliability-regression.mjs"' kerbside-backend/package.json
          python3 .github/scripts/sync-version.py --check

      - name: Install test dependencies
        run: npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false

      - name: Validate JavaScript, Python and unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          source = Path('bus.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', source, flags=re.I | re.S)
          if not scripts:
              raise SystemExit('No inline browser scripts found')
          with tempfile.TemporaryDirectory() as directory:
              for index, script in enumerate(scripts, start=1):
                  filename = Path(directory) / f'inline-{index}.js'
                  filename.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(filename)], check=True)
          print(f'Validated {len(scripts)} inline browser script(s).')
          PY
          node --check build-timetable.js
          node --check kerbside-backend/scripts/apply-reliability-hardening-build.mjs
          node --check kerbside-backend/tests/disruption-regression.mjs
          node --check kerbside-backend/tests/listing-reliability-regression.mjs
          python3 -m py_compile .github/scripts/build-disruptions.py kerbside-backend/tests/disruption-build-regression.py
          python3 kerbside-backend/tests/disruption-build-regression.py
          npm run check --prefix kerbside-backend
          npm test --prefix kerbside-backend

      - name: Parse workflows
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; ARGV.each { |file| YAML.parse_file(file) or abort(file) }" \
            .github/workflows/deploy-kerbside-reliability-hardening.yml \
            .github/workflows/deploy-kerbside-journey-identity-hardening.yml \
            .github/workflows/deploy-kerbside-stop-side-hardening.yml \
            .github/workflows/deploy-kerbside-accuracy-hardening.yml \
            .github/workflows/kerbside-disruptions.yml \
            .github/workflows/kerbside-check.yml \
            .github/workflows/deploy-kerbside-worker.yml \
            .github/workflows/verify-kerbside-production.yml

      - name: Install browser engines
        working-directory: kerbside-backend
        run: npx playwright install --with-deps webkit chromium

      - name: Run WebKit regression suites
        shell: bash
        run: |
          set -euo pipefail
          npm run test:browser --prefix kerbside-backend
          npm run test:identity --prefix kerbside-backend
          npm run test:multi-vehicle --prefix kerbside-backend
          npm run test:audit --prefix kerbside-backend
          npm run test:accuracy-hardening --prefix kerbside-backend
          npm run test:stop-side --prefix kerbside-backend
          npm run test:journey-identity --prefix kerbside-backend
          npm run test:disruptions --prefix kerbside-backend
          npm run test:listing-reliability --prefix kerbside-backend

      - name: Run Chromium regression suites
        shell: bash
        env:
          KERBSIDE_BROWSER: chromium
        run: |
          set -euo pipefail
          npm run test:browser --prefix kerbside-backend
          npm run test:identity --prefix kerbside-backend
          npm run test:multi-vehicle --prefix kerbside-backend
          npm run test:audit --prefix kerbside-backend
          npm run test:accuracy-hardening --prefix kerbside-backend
          npm run test:stop-side --prefix kerbside-backend
          npm run test:journey-identity --prefix kerbside-backend
          npm run test:disruptions --prefix kerbside-backend
          npm run test:listing-reliability --prefix kerbside-backend

      - name: Second-pass reliability verification
        shell: bash
        run: |
          set -euo pipefail
          npm run test:disruptions --prefix kerbside-backend
          KERBSIDE_BROWSER=chromium npm run test:disruptions --prefix kerbside-backend
          npm run test:listing-reliability --prefix kerbside-backend
          KERBSIDE_BROWSER=chromium npm run test:listing-reliability --prefix kerbside-backend
          npm run test:journey-identity --prefix kerbside-backend
          KERBSIDE_BROWSER=chromium npm run test:journey-identity --prefix kerbside-backend
          npm run test:stop-side --prefix kerbside-backend
          KERBSIDE_BROWSER=chromium npm run test:stop-side --prefix kerbside-backend
          npm run test:accuracy-hardening --prefix kerbside-backend
          KERBSIDE_BROWSER=chromium npm run test:accuracy-hardening --prefix kerbside-backend
          python3 kerbside-backend/tests/disruption-build-regression.py
          git diff --check

      - name: Show proposed build diff
        run: |
          git diff --stat
          git diff -- \
            bus.html VERSION \
            kerbside-backend/src/worker.js \
            kerbside-backend/package.json \
            kerbside-backend/test/worker.test.js \
            kerbside-backend/tests/browser-regression.mjs

      - name: Commit tested build to main
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # The disruption feed legitimately writes disruptions.json to main on
          # its own schedule. It must not invalidate an otherwise fully tested
          # app build. Any OTHER main change remains a hard stop.
          rebase_over_disruptions_only() {
            git fetch origin main
            latest="$(git rev-parse origin/main)"
            if [[ "$latest" == "$KERBSIDE_BASE_SHA" ]]; then
              return 0
            fi
            unsafe="$(git diff --name-only "$KERBSIDE_BASE_SHA" "$latest" -- | grep -v '^disruptions.json$' || true)"
            if [[ -n "$unsafe" ]]; then
              echo "::error::main changed in app/code files while this build was testing:"
              printf '%s\n' "$unsafe"
              echo "Run the workflow again on the new main instead of pushing a stale build."
              exit 1
            fi
            echo "main advanced only through disruptions.json; rebasing the tested release commit onto $latest."
            git rebase origin/main
          }

          git diff --exit-code -- \
            .github/scripts/build-disruptions.py \
            .github/workflows/kerbside-disruptions.yml \
            .github/workflows/kerbside-check.yml \
            .github/workflows/deploy-kerbside-reliability-hardening.yml \
            kerbside-backend/scripts/apply-reliability-hardening-build.mjs \
            kerbside-backend/tests/disruption-regression.mjs \
            kerbside-backend/tests/listing-reliability-regression.mjs \
            kerbside-backend/tests/disruption-build-regression.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            bus.html VERSION \
            kerbside-backend/src/worker.js \
            kerbside-backend/package.json \
            kerbside-backend/test/worker.test.js \
            kerbside-backend/tests/browser-regression.mjs
          git diff --cached --check
          git commit -m "Kerbside ${VERSION_INPUT}: harden reliability and disruptions"

          rebase_over_disruptions_only
          if ! git push origin HEAD:main; then
            echo 'Push raced another main update; checking whether it was data-only and retrying once.'
            rebase_over_disruptions_only
            git push origin HEAD:main
          fi
