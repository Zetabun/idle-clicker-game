name: Patch Kerbside 0.9.34 route test isolation

on:
  push:
    branches:
      - agent/kerbside-0.9.34-memory-first-movement
    paths:
      - .github/scripts/patch-kerbside-0.9.34-route-test-isolation.py
      - .github/workflows/patch-kerbside-0.9.34-route-test-isolation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/kerbside-0.9.34-memory-first-movement
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install browser dependency
        run: |
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          npx playwright install --with-deps webkit chromium
      - name: Apply isolation fix
        run: python3 .github/scripts/patch-kerbside-0.9.34-route-test-isolation.py
      - name: Verify affected test in WebKit and Chromium
        run: |
          KERBSIDE_BROWSER=webkit node kerbside-backend/tests/train-route-filter-regression.mjs
          KERBSIDE_BROWSER=chromium node kerbside-backend/tests/train-route-filter-regression.mjs
      - name: Commit test isolation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kerbside-backend/tests/train-route-filter-regression.mjs
          git diff --cached --check
          git commit -m 'Test: isolate movement Worker in route regression'
          git push origin HEAD:agent/kerbside-0.9.34-memory-first-movement
