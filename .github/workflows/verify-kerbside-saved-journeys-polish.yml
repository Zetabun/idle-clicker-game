name: Verify Kerbside saved journey polish

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - kerbside-saved-journeys-polish.js
      - kerbside-journey-planner-ui.js
      - VERSION
      - kerbside-backend/tests/train-saved-journeys-polish-regression.mjs
      - kerbside-backend/tests/train-saved-journeys-polish-browser.mjs
      - .github/workflows/verify-kerbside-saved-journeys-polish.yml
  pull_request:
    branches: [main]
    paths:
      - kerbside-saved-journeys-polish.js
      - kerbside-journey-planner-ui.js
      - VERSION
      - kerbside-backend/tests/train-saved-journeys-polish-regression.mjs
      - kerbside-backend/tests/train-saved-journeys-polish-browser.mjs
      - .github/workflows/verify-kerbside-saved-journeys-polish.yml

permissions:
  contents: write

concurrency:
  group: kerbside-saved-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
      - name: Apply approved Edit observer fix
        if: github.event_name == 'push' && github.ref_name != 'main'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          product = Path('kerbside-saved-journeys-polish.js')
          text = product.read_text(encoding='utf-8')
          old = "function updateEditButtons(){if(!runtime.editingId)return;for(const button of document.querySelectorAll('#planJourneyResults [data-plan-save-key]')){if(!button.dataset.savedPolishOriginalText)button.dataset.savedPolishOriginalText=button.textContent||'';button.textContent='Save changes';button.setAttribute('aria-pressed','false');button.dataset.savedPolishSaveChanges='true';}}"
          new = "function updateEditButtons(){if(!runtime.editingId)return;for(const button of document.querySelectorAll('#planJourneyResults [data-plan-save-key]')){if(!button.dataset.savedPolishOriginalText)button.dataset.savedPolishOriginalText=button.textContent||'';if(button.textContent!=='Save changes')button.textContent='Save changes';button.setAttribute('aria-pressed','false');button.dataset.savedPolishSaveChanges='true';}}"
          if old in text:
              product.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('Expected updateEditButtons implementation was not found')

          test = Path('kerbside-backend/tests/train-saved-journeys-polish-browser.mjs')
          text = test.read_text(encoding='utf-8')
          direct_begin = "  await page.waitForSelector('[data-saved-polish-edit=\"journey-next\"]');\n  const editStarted=await page.evaluate(()=>window.__KERBSIDE_SAVED_JOURNEYS_POLISH__.beginEdit('journey-next'));\n  assert.equal(editStarted,true,'beginEdit returned false');"
          click_begin = "  await page.click('[data-saved-polish-edit=\"journey-next\"]');"
          if direct_begin in text:
              text = text.replace(direct_begin, click_begin, 1)
          elif click_begin not in text:
              raise SystemExit('Expected edit start interaction was not found')

          direct_save = "  const editSaved=await page.evaluate(()=>window.__KERBSIDE_SAVED_JOURNEYS_POLISH__.commitEdit(document.querySelector('#planJourneyResults [data-plan-save-key]')));\n  assert.equal(editSaved,true,'commitEdit returned false');"
          click_save = "  await page.click('#planJourneyResults [data-plan-save-key]');"
          if direct_save in text:
              text = text.replace(direct_save, click_save, 1)
          elif click_save not in text:
              raise SystemExit('Expected edit save interaction was not found')
          test.write_text(text, encoding='utf-8')
          PY
          git diff --check
          if git diff --quiet; then
            echo "Edit observer fix already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kerbside-saved-journeys-polish.js kerbside-backend/tests/train-saved-journeys-polish-browser.mjs
          git commit -m "Fix Saved Journeys edit observer loop"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify Saved Journeys data and migration logic
        shell: bash
        run: |
          set -euo pipefail
          node --check kerbside-saved-journeys-polish.js
          node --check kerbside-journey-planner-ui.js
          node --check kerbside-backend/tests/train-saved-journeys-polish-regression.mjs
          node kerbside-backend/tests/train-saved-journeys-polish-regression.mjs
      - name: Install browser test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          cd kerbside-backend
          npx playwright install --with-deps webkit
      - name: Verify browser polish attaches
        run: KERBSIDE_BROWSER_STAGE=attach node kerbside-backend/tests/train-saved-journeys-polish-browser.mjs
      - name: Verify browser Next journey section
        run: KERBSIDE_BROWSER_STAGE=next node kerbside-backend/tests/train-saved-journeys-polish-browser.mjs
      - name: Verify browser lifecycle groups
        run: KERBSIDE_BROWSER_STAGE=groups node kerbside-backend/tests/train-saved-journeys-polish-browser.mjs
      - name: Verify browser Next journey badge
        run: KERBSIDE_BROWSER_STAGE=badge node kerbside-backend/tests/train-saved-journeys-polish-browser.mjs
      - name: Verify browser repeat and duplicate guard
        run: KERBSIDE_BROWSER_STAGE=repeat node kerbside-backend/tests/train-saved-journeys-polish-browser.mjs
      - name: Verify browser archive and restore
        run: KERBSIDE_BROWSER_STAGE=archive node kerbside-backend/tests/train-saved-journeys-polish-browser.mjs
      - name: Verify browser in-place edit
        run: KERBSIDE_BROWSER_STAGE=edit node kerbside-backend/tests/train-saved-journeys-polish-browser.mjs
      - name: Verify browser confirmed delete
        run: KERBSIDE_BROWSER_STAGE=delete node kerbside-backend/tests/train-saved-journeys-polish-browser.mjs
