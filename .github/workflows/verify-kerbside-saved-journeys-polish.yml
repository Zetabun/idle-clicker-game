name: Verify Kerbside saved journey polish

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - kerbside-saved-journeys-polish.js
      - kerbside-journey-planner-ui.js
      - VERSION
      - kerbside-backend/tests/train-saved-journeys-polish-regression.mjs
      - kerbside-backend/tests/train-saved-journeys-polish-browser.mjs
      - .github/workflows/verify-kerbside-saved-journeys-polish.yml
  pull_request:
    branches: [main]
    paths:
      - kerbside-saved-journeys-polish.js
      - kerbside-journey-planner-ui.js
      - VERSION
      - kerbside-backend/tests/train-saved-journeys-polish-regression.mjs
      - kerbside-backend/tests/train-saved-journeys-polish-browser.mjs
      - .github/workflows/verify-kerbside-saved-journeys-polish.yml

permissions:
  contents: write

concurrency:
  group: kerbside-saved-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
      - name: Apply approved CI follow-up fixes
        if: github.event_name == 'push' && github.ref_name != 'main'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('kerbside-backend/tests/train-saved-journeys-polish-browser.mjs')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "if(runs('badge')) assert.equal(await page.locator('.saved-polish-next .saved-polish-next-badge').innerText(),'Next journey');",
                  "if(runs('badge')) assert.equal((await page.locator('.saved-polish-next .saved-polish-next-badge').textContent())?.trim(),'Next journey');",
                  'Saved Journeys badge assertion',
              ),
              (
                  "  await page.waitForSelector('[data-saved-polish-restore=\"journey-upcoming\"]');\n  await page.click('[data-saved-polish-restore=\"journey-upcoming\"]');",
                  "  await page.waitForSelector('.saved-polish-archived');\n  await page.click('.saved-polish-archived > summary');\n  await page.waitForSelector('[data-saved-polish-restore=\"journey-upcoming\"]');\n  await page.click('[data-saved-polish-restore=\"journey-upcoming\"]');",
                  'Archived restore interaction',
              ),
              (
                  "  await page.click('[data-saved-polish-edit=\"journey-next\"]');",
                  "  await page.locator('[data-saved-polish-edit=\"journey-next\"]').dispatchEvent('click');",
                  'Saved journey edit interaction',
              ),
              (
                  "  await page.click('#planJourneyResults [data-plan-save-key]');",
                  "  await page.locator('#planJourneyResults [data-plan-save-key]').dispatchEvent('click');",
                  'Save changes interaction',
              ),
          ]
          for old, new, label in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'Expected {label} was not found')

          path.write_text(text, encoding='utf-8')
          PY
          python3 .github/scripts/sync-version.py
          git diff --check
          if git diff --quiet; then
            echo "Follow-up files were already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bus.html kerbside-status.js kerbside-journey-planner-ui.js kerbside-backend/src/worker.js kerbside-backend/package.json kerbside-backend/test/worker.test.js kerbside-backend/tests/browser-regression.mjs kerbside-backend/tests/train-saved-journeys-polish-browser.mjs
          git commit -m "Stabilize Saved Journeys edit browser interactions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify Saved Journeys data and migration logic
        shell: bash
        run: |
          set -euo pipefail
          node --check kerbside-saved-journeys-polish.js
          node --check kerbside-journey-planner-ui.js
          node --check kerbside-backend/tests/train-saved-journeys-polish-regression.mjs
          node kerbside-backend/tests/train-saved-journeys-polish-regression.mjs
      - name: Install browser test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          cd kerbside-backend
          npx playwright install --with-deps webkit
      - name: Verify browser polish attaches
        run: KERBSIDE_BROWSER_STAGE=attach node kerbside-backend/tests/train-saved-journeys-polish-browser.mjs
      - name: Verify browser Next journey section
        run: KERBSIDE_BROWSER_STAGE=next node kerbside-backend/tests/train-saved-journeys-polish-browser.mjs
      - name: Verify browser lifecycle groups
        run: KERBSIDE_BROWSER_STAGE=groups node kerbside-backend/tests/train-saved-journeys-polish-browser.mjs
      - name: Verify browser Next journey badge
        run: KERBSIDE_BROWSER_STAGE=badge node kerbside-backend/tests/train-saved-journeys-polish-browser.mjs
      - name: Verify browser repeat and duplicate guard
        run: KERBSIDE_BROWSER_STAGE=repeat node kerbside-backend/tests/train-saved-journeys-polish-browser.mjs
      - name: Verify browser archive and restore
        run: KERBSIDE_BROWSER_STAGE=archive node kerbside-backend/tests/train-saved-journeys-polish-browser.mjs
      - name: Verify browser in-place edit
        run: KERBSIDE_BROWSER_STAGE=edit node kerbside-backend/tests/train-saved-journeys-polish-browser.mjs
      - name: Verify browser confirmed delete
        run: KERBSIDE_BROWSER_STAGE=delete node kerbside-backend/tests/train-saved-journeys-polish-browser.mjs
