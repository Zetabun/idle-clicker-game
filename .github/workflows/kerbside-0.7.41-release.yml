name: Kerbside 0.7.41 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kerbside-0.7.41-release.yml

permissions:
  contents: write

concurrency:
  group: kerbside-0.7.41-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Apply release patch
        run: python3 .github/scripts/apply-kerbside-0.7.41.py

      - name: Validate JavaScript and regression suites
        shell: bash
        run: |
          set -euo pipefail
          node --check kerbside-status.js
          node --check kerbside-train-timetable.js
          node --check kerbside-train-date.js
          node --check kerbside-train-live-window.js
          node --check kerbside-train-live-overlay.js
          node --check kerbside-train-forecast-v3.js
          node --test kerbside-backend/test/status-switchboard.test.mjs
          node --test kerbside-backend/test/train-timetable-provider.test.js
          node --test kerbside-backend/tests/train-forecast-v3-dual-timetable.mjs
          node --check kerbside-backend/tests/browser-regression.mjs
          node --check kerbside-backend/tests/train-live-window-regression.mjs
          node --check kerbside-backend/tests/train-journey-planner-regression.mjs
          git diff --check
          grep -Fx '0.7.41' VERSION
          grep -F 'kerbside-status.js?v=0.7.41' bus.html
          grep -F 'refreshEdgeManifest' kerbside-train-timetable.js

      - name: Publish Kerbside 0.7.41
        shell: bash
        run: |
          set -euo pipefail
          git add VERSION bus.html kerbside-status.js kerbside-train-date.js kerbside-train-timetable.js kerbside-backend/test/train-timetable-provider.test.js kerbside-backend/test/status-switchboard.test.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Kerbside 0.7.41: add system status and recover future timetable edges'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo 'Failed to publish after three rebased attempts.' >&2
          exit 1
