name: Release 12.200

on:
  push:
    branches: [main]
    paths:
      - .github/triggers/release-12.200.txt

permissions:
  contents: write

concurrency:
  group: release-12.200
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply release patch
        id: patch
        run: |
          set -o pipefail
          python3 .github/scripts/release-12.200.py 2>&1 | tee /tmp/release-12.200-step.log

      - name: Compile build script
        run: python3 -m py_compile strikewatch-source/build.py

      - name: First build
        working-directory: strikewatch-source
        run: |
          set -euo pipefail
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.200.html > /tmp/build-12.200-first.sha256
          cp js/strikewatch.dev.js /tmp/strikewatch.dev.first.js
          cp dist/strikewatch-build-12.200.html /tmp/strikewatch-build-12.200.first.html

      - name: Parse modular and generated JavaScript
        run: |
          set -euo pipefail
          for file in strikewatch-source/js/[0-9][0-9]-*.js; do
            node --check "$file"
          done
          node --check strikewatch-source/js/strikewatch.dev.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.external = False
                  self.current = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'script':
                      self.in_script = True
                      self.external = any(k.lower() == 'src' for k, _ in attrs)
                      self.current = []
              def handle_data(self, data):
                  if self.in_script and not self.external:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.in_script:
                      if not self.external:
                          text = ''.join(self.current).strip()
                          if text:
                              self.scripts.append(text)
                      self.in_script = False
                      self.external = False
                      self.current = []

          targets = [
              Path('strikewatch-source/index.html'),
              Path('strikewatch-source/dist/strikewatch-build-12.200.html'),
          ]
          for target in targets:
              parser = Scripts()
              parser.feed(target.read_text(encoding='utf-8'))
              for index, script in enumerate(parser.scripts, 1):
                  with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as handle:
                      handle.write(script)
                      temp = handle.name
                  subprocess.run(['node', '--check', temp], check=True)
              print(f'{target}: parsed {len(parser.scripts)} inline script(s)')
          PY

      - name: Second deterministic build
        working-directory: strikewatch-source
        run: |
          set -euo pipefail
          python3 build.py
          cmp -s /tmp/strikewatch.dev.first.js js/strikewatch.dev.js
          cmp -s /tmp/strikewatch-build-12.200.first.html dist/strikewatch-build-12.200.html
          sha256sum -c /tmp/build-12.200-first.sha256

      - name: Publish and verify standalone
        run: |
          set -euo pipefail
          cp strikewatch-source/dist/strikewatch-build-12.200.html cod.html
          cmp -s cod.html strikewatch-source/dist/strikewatch-build-12.200.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('strikewatch-source/RELEASE.json').read_text(encoding='utf-8'))
          assert release == {
              'version': '12.200',
              'name': 'Single-Source Management Prompts',
              'build_id': '12.200.0-single-source-management-prompts',
          }, release
          source = Path('strikewatch-source/js/50-ui-menus.js').read_text(encoding='utf-8')
          assert "const priorityStrip = mustRespond ? '' : renderMenuPriorityStrip();" in source
          assert "candidate.closest('.club-must-respond-strip')" in source
          assert "blockerLabels.has(candidateLabel)" in source
          PY

      - name: Remove temporary release files and failure ledger
        run: |
          rm -f .github/scripts/release-12.200.py
          rm -f .github/workflows/release-12.200.yml
          rm -f .github/triggers/release-12.200.txt
          rm -f .github/release-12.200-failure.log

      - name: Commit finished release
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --quiet && { echo "No release changes staged"; exit 1; }
          git commit -m "Build 12.200: remove repeated management prompts"
          git push origin HEAD:main

      - name: Record failure ledger
        if: failure()
        run: |
          set +e
          {
            printf '%s\n' \
              'Build 12.200 workflow failed.' \
              "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              "Commit: $GITHUB_SHA"
            if [ -f /tmp/release-12.200-step.log ]; then
              printf '%s\n' 'Captured patch output:'
              cat /tmp/release-12.200-step.log
            else
              printf '%s\n' 'The patch step completed; inspect the named failing workflow step.'
            fi
          } > .github/release-12.200-failure.log
          git add .github/release-12.200-failure.log
          git commit -m "Record Build 12.200 release failure" || true
          git push origin HEAD:main || true
