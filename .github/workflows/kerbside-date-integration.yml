name: Integrate Kerbside train travel date

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/kerbside-date-integration.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  integrate:
    if: github.head_ref == 'agent/kerbside-train-travel-date'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Wire travel date planner and release version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          bus = Path('bus.html')
          text = bus.read_text(encoding='utf-8')
          old = '<script src="kerbside-trains.js"></script>\n<script src="kerbside-train-routes.js"></script>\n</body>'
          new = '<script src="kerbside-trains.js"></script>\n<script src="kerbside-train-routes.js"></script>\n<script src="kerbside-train-date.js"></script>\n</body>'
          if old not in text:
              raise SystemExit('Expected train script block not found')
          bus.write_text(text.replace(old,new,1),encoding='utf-8')

          workflow = Path('.github/workflows/kerbside-check.yml')
          check = workflow.read_text(encoding='utf-8')
          check = check.replace('      - kerbside-train-routes.js\n', '      - kerbside-train-routes.js\n      - kerbside-train-date.js\n')
          check = check.replace('bus.html kerbside-trains.js kerbside-trains.css kerbside-train-routes.js;', 'bus.html kerbside-trains.js kerbside-trains.css kerbside-train-routes.js kerbside-train-date.js;')
          check = check.replace('          node --check kerbside-train-routes.js\n', '          node --check kerbside-train-routes.js\n          node --check kerbside-train-date.js\n')
          workflow.write_text(check,encoding='utf-8')

          test = Path('kerbside-backend/tests/train-route-filter-regression.mjs')
          source = test.read_text(encoding='utf-8')
          anchor = "  assert.equal(await page.locator('#trainDestinationQuery').isDisabled(),true);\n"
          addition = """  assert.equal(await page.locator('#trainDestinationQuery').isDisabled(),true);\n  assert.equal(await page.locator('label[for=\"trainTravelDate\"]').textContent(),'Travel date');\n  assert.equal(await page.locator('#trainTravelDate').inputValue(),'2026-08-10');\n\n"""
          if anchor not in source:
              raise SystemExit('Desktop route-test anchor missing')
          source = source.replace(anchor,addition,1)
          anchor2 = "  await selectBristol(page,diagnostics);\n\n  assert.equal(await page.locator('.train-service').count(),1);"
          addition2 = """  await selectBristol(page,diagnostics);\n\n  await page.locator('#trainTravelDate').fill('2026-08-14');\n  await page.locator('#trainTravelDate').dispatchEvent('change');\n  await page.waitForFunction(()=>document.getElementById('trainTravelDateMeta')?.dataset.mode === 'planning');\n  assert.match(await page.locator('#trainTravelDateMeta').textContent(),/planning forecast/i);\n  assert.match(await page.locator('.train-crowding small').first().textContent(),/planning/i);\n  assert.equal(await page.evaluate(()=>localStorage.getItem('kerbside.rail.travel-date.v1')),'2026-08-14');\n  await page.click('#trainTravelToday');\n  await page.waitForFunction(()=>document.getElementById('trainTravelDateMeta')?.dataset.mode === 'live');\n  assert.match(await page.locator('#trainTravelDateMeta').textContent(),/live-adjusted/i);\n\n  assert.equal(await page.locator('.train-service').count(),1);"""
          if anchor2 not in source:
              raise SystemExit('Travel-date route-test anchor missing')
          test.write_text(source.replace(anchor2,addition2,1),encoding='utf-8')

          Path('VERSION').write_text('0.7.30\n',encoding='utf-8')
          PY
          python3 .github/scripts/sync-version.py
          node --check kerbside-train-date.js
          node --check kerbside-train-routes.js
          node --check kerbside-trains.js
          node --check kerbside-backend/tests/train-route-filter-regression.mjs
          git diff --check

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION bus.html kerbside-train-date.js kerbside-backend/package.json kerbside-backend/src/worker.js kerbside-backend/test/worker.test.js kerbside-backend/tests/browser-regression.mjs kerbside-backend/tests/train-route-filter-regression.mjs .github/workflows/kerbside-check.yml
          git commit -m 'Add train travel date planning forecasts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
