name: Release Strikewatch 12.191

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/release-12-191.txt'

permissions:
  contents: write

concurrency:
  group: release-strikewatch-12-191
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build, verify and publish
        shell: bash
        run: |
          cat > /tmp/release-12-191.sh <<'BASH'
          set -Eeuo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('strikewatch-source/RELEASE.json').read_text(encoding='utf-8'))
          expected = {
              'version': '12.190',
              'name': 'Operator Environmental Light Pickup',
              'build_id': '12.190.0-operator-environmental-light-pickup'
          }
          if release != expected:
              raise SystemExit(f'Unexpected predecessor release: {release!r}')
          PY

          python3 -m py_compile .github/scripts/release-12-191.py
          python3 .github/scripts/release-12-191.py

          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('strikewatch-source/RELEASE.json').read_text(encoding='utf-8'))
          expected = {
              'version': '12.191',
              'name': 'Operator Silhouette Separation',
              'build_id': '12.191.0-operator-silhouette-separation'
          }
          if release != expected:
              raise SystemExit(f'Unexpected prepared release: {release!r}')
          required_docs = {
              'HANDOFF.md': '- Build: **12.191 — Operator Silhouette Separation**',
              'AGENTS.md': 'Build 12.191 owns third-person operator silhouette separation',
              'README.md': '# Strikewatch Source 12.191',
              'PROJECT.md': 'Build 12.191 improves battle readability',
              'CHANGELOG.md': '## 12.191 — Operator Silhouette Separation',
              '00-READ-FIRST-GPT.md': 'Current release: **Strikewatch Build 12.191 — Operator Silhouette Separation**.',
              'CONTRACTS.md': 'Third-person operator silhouette separation may reuse the local-detail uniform'
          }
          for name, required in required_docs.items():
              text = Path('strikewatch-source', name).read_text(encoding='utf-8')
              if required not in text:
                  raise SystemExit(f'{name} missing release requirement: {required}')
          if not Path('strikewatch-source/AUDIT-12.191.md').is_file():
              raise SystemExit('AUDIT-12.191.md was not created')
          PY

          grep -F "const BUILD_VERSION = '12.191'" strikewatch-source/js/00-core.js
          grep -F "const BUILD_NAME = 'Operator Silhouette Separation'" strikewatch-source/js/00-core.js
          grep -F "const BUILD_ID = '12.191.0-operator-silhouette-separation'" strikewatch-source/js/00-core.js
          grep -F '<title>Strikewatch 12.191: Operator Silhouette Separation</title>' strikewatch-source/index.html
          grep -F 'id="managerBuildVersion">12.191</b>' strikewatch-source/index.html
          grep -F 'id="mobileCommandBuildVersion">12.191</b>' strikewatch-source/index.html

          python3 - <<'PY'
          from pathlib import Path
          renderer = Path('strikewatch-source/js/60-renderer-core.js').read_text(encoding='utf-8')
          viewmodel = Path('strikewatch-source/js/63-viewmodel-renderer.js').read_text(encoding='utf-8')
          required_renderer = [
              "revision: '12.191-operator-silhouette-1'",
              'staticMode: 0',
              'operatorMode: 1',
              'viewmodelMode: 2',
              'fillLift: 0.028',
              'rimLift: 0.052',
              'function operatorSilhouetteSeparationForTest()',
              'let localSurfaceDetailMode = 0',
              'float movingDetail = step(0.5, uLocalDetail)',
              'float operatorActor = movingDetail * (1.0 - step(1.5, uLocalDetail))',
              'float moving = movingDetail',
              'float rimShape = pow(1.0 - max(dot(normal, viewDirection), 0.0), 2.8)',
              'float operatorSilhouetteLift = operatorActor * (${OPERATOR_SILHOUETTE_LIGHTING.fillLift.toFixed(3)} + rimShape * ${OPERATOR_SILHOUETTE_LIGHTING.rimLift.toFixed(3)})',
              'lit += base * (rim + operatorSilhouetteLift)',
              'gl.uniform1f(glLocations.localDetail, localSurfaceDetailMode)'
          ]
          missing = [item for item in required_renderer if item not in renderer]
          if missing:
              raise SystemExit(f'Missing silhouette source requirements: {missing}')
          if 'let localSurfaceDetail = false' in renderer:
              raise SystemExit('Legacy boolean local-detail state remains')
          if renderer.count('float operatorActor =') != 1 or renderer.count('float operatorSilhouetteLift =') != 1:
              raise SystemExit('Operator silhouette shader authority is duplicated')
          if renderer.count('uniform float uLocalDetail;') != 1:
              raise SystemExit('Existing local-detail uniform count changed unexpectedly')
          if viewmodel.count('OPERATOR_SILHOUETTE_LIGHTING.viewmodelMode') != 1:
              raise SystemExit('Viewmodel mode assignment is missing or duplicated')
          if 'withLocalSurfaceDetail(() => drawFirstPersonWeapon(cam, eye, time));' in viewmodel:
              raise SystemExit('Legacy viewmodel wrapper call remains')
          for boundary in [
              'additionalDrawCalls: 0',
              'additionalMeshes: 0',
              'additionalTextures: 0',
              'additionalShaderPasses: 0',
              'additionalShaderUniforms: 0'
          ]:
              if renderer.count(boundary) < 2:
                  raise SystemExit(f'Missing zero-cost boundary: {boundary}')
          PY

          for hook in operatorSilhouetteSeparationForTest operatorEnvironmentalLightPickupForTest operatorAmbientOcclusionForTest dynamicActorCullingForTest arenaSurfaceSampleForTest; do
            grep -R -F "$hook" strikewatch-source/js >/dev/null
          done

          cd strikewatch-source
          python3 -m py_compile build.py
          python3 build.py
          test -f dist/strikewatch-build-12.191.html
          test -f dist/strikewatch-build-12.191-size.json
          test -f dist/strikewatch-build-12.191-css-debt.json
          cp js/strikewatch.dev.js /tmp/strikewatch.dev.first.js
          cp dist/strikewatch-build-12.191.html /tmp/strikewatch-build.first.html
          cp dist/strikewatch-build-12.191-size.json /tmp/strikewatch-size.first.json
          cp dist/strikewatch-build-12.191-css-debt.json /tmp/strikewatch-css.first.json
          cd ..

          for file in strikewatch-source/js/*.js; do
            [ "$(basename "$file")" = 'strikewatch.dev.js' ] && continue
            node --check "$file"
          done
          node --check strikewatch-source/js/strikewatch.dev.js

          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          html = Path('strikewatch-source/dist/strikewatch-build-12.191.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit('No standalone inline scripts found')
          with tempfile.TemporaryDirectory() as temp:
              for index, script in enumerate(scripts):
                  path = Path(temp) / f'inline-{index}.js'
                  path.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(path)], check=True)
          print(f'Parsed {len(scripts)} standalone inline scripts.')
          PY

          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('strikewatch-source/dist/strikewatch-build-12.191-css-debt.json').read_text(encoding='utf-8'))
          if not report.get('within_budget'):
              raise SystemExit(f'CSS debt report is outside budget: {report!r}')
          expected = {
              'game_css_lines': 30724,
              'important_declarations': 2182,
              'media_queries': 474
          }
          for key, value in expected.items():
              if report.get(key) != value:
                  raise SystemExit(f'Unexpected CSS debt value for {key}: {report.get(key)}')
          PY

          cd strikewatch-source
          python3 build.py
          cd ..
          cmp /tmp/strikewatch.dev.first.js strikewatch-source/js/strikewatch.dev.js
          cmp /tmp/strikewatch-build.first.html strikewatch-source/dist/strikewatch-build-12.191.html
          cmp /tmp/strikewatch-size.first.json strikewatch-source/dist/strikewatch-build-12.191-size.json
          cmp /tmp/strikewatch-css.first.json strikewatch-source/dist/strikewatch-build-12.191-css-debt.json

          cp strikewatch-source/dist/strikewatch-build-12.191.html cod.html
          cmp cod.html strikewatch-source/dist/strikewatch-build-12.191.html
          git diff --check
          BASH

          LOG=.github/release-12-191-last.log
          set +e
          bash /tmp/release-12-191.sh 2>&1 | tee "$LOG"
          release_status=${PIPESTATUS[0]}
          set -e

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$release_status" -ne 0 ]; then
            printf '\nFAILED_EXIT_CODE=%s\n' "$release_status" >> "$LOG"
            git add "$LOG"
            git commit -m 'Record Build 12.191 release failure'
            git push origin HEAD:main
            exit "$release_status"
          fi

          rm -f "$LOG"
          rm -f .github/scripts/release-12-191.py
          rm -f .github/workflows/release-12-191.yml
          rm -f .github/triggers/release-12-191.txt
          git add -A
          git diff --cached --quiet && { echo 'No release changes produced.'; exit 1; }
          git commit -m 'Build 12.191: operator silhouette separation'
          git push origin HEAD:main