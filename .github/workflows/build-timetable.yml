name: Build Kerbside timetable

on:
  push:
    branches:
      - main
    paths:
      - build-timetable.js
      - .github/workflows/build-timetable.yml
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kerbside-timetable
  cancel-in-progress: true

env:
  REGION: west_midlands
  LAT: '52.5089'
  LON: '-2.0870'
  RADIUS: '8000'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Build timetable with diagnostics
        id: timetable_build
        continue-on-error: true
        env:
          BODS_KEY: ${{ secrets.BODS_KEY }}
        shell: bash
        run: |
          set -uo pipefail

          LOG_FILE="$RUNNER_TEMP/kerbside-timetable-build.log"
          STATUS_FILE="$RUNNER_TEMP/kerbside-timetable-build.status"
          : > "$LOG_FILE"

          run_build() {
            set -euo pipefail

            echo "Kerbside timetable diagnostic"
            echo "UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Commit: $GITHUB_SHA"
            echo "Region: $REGION"
            echo "Centre: $LAT,$LON"
            echo "Radius: $RADIUS"
            echo

            if [[ -z "${BODS_KEY:-}" ]]; then
              echo "ERROR: The BODS_KEY repository secret is missing or empty."
              return 11
            fi

            if [[ ! -f build-timetable.js ]]; then
              echo "ERROR: build-timetable.js is missing from the repository root."
              return 12
            fi

            echo "Node version: $(node --version)"
            node --check build-timetable.js

            echo
            echo "Downloading BODS regional GTFS..."
            curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors --connect-timeout 30 \
              "https://data.bus-data.dft.gov.uk/timetable/download/gtfs-file/${REGION}/?api_key=${BODS_KEY}" \
              --output gtfs.zip

            if [[ ! -s gtfs.zip ]]; then
              echo "ERROR: BODS returned an empty GTFS download."
              return 13
            fi

            unzip -tq gtfs.zip
            ls -lh gtfs.zip

            echo
            echo "Extracting GTFS..."
            rm -rf gtfs
            mkdir -p gtfs
            unzip -oq gtfs.zip -d gtfs

            STOPS_FILE="$(find gtfs -type f -name stops.txt -print -quit)"
            if [[ -z "$STOPS_FILE" ]]; then
              echo "ERROR: The downloaded archive does not contain stops.txt."
              find gtfs -maxdepth 3 -type f | head -100
              return 14
            fi

            GTFS_DIR="$(dirname "$STOPS_FILE")"
            echo "Using GTFS directory: $GTFS_DIR"
            for required in stops.txt routes.txt trips.txt stop_times.txt; do
              if [[ ! -f "$GTFS_DIR/$required" ]]; then
                echo "ERROR: The GTFS archive is missing $required in $GTFS_DIR."
                return 15
              fi
            done
            ls -lh "$GTFS_DIR" | head -40

            echo
            echo "Building timetable.json..."
            node --max-old-space-size=6144 build-timetable.js \
              "$GTFS_DIR" "$LAT" "$LON" "$RADIUS"

            echo
            echo "Validating timetable.json..."
            node <<'NODE'
          const fs = require('fs');
          const timetable = JSON.parse(fs.readFileSync('timetable.json', 'utf8'));
          const stopCount = Object.keys(timetable.stops || {}).length;
          const tripCount = Object.keys(timetable.tripPatterns || {}).length;
          const patternCount = Object.keys(timetable.patterns || {}).length;

          if (timetable.version !== 3) {
            throw new Error(`Expected timetable version 3, received ${timetable.version}`);
          }
          if (!stopCount) throw new Error('The timetable contains no stops.');
          if (!tripCount) throw new Error('The timetable contains no trip-to-pattern mappings.');
          if (!patternCount) throw new Error('The timetable contains no ordered route patterns.');

          const size = fs.statSync('timetable.json').size;
          if (size >= 95 * 1024 * 1024) {
            throw new Error(`timetable.json is too large for GitHub (${Math.round(size / 1024 / 1024)} MB).`);
          }

          console.log(JSON.stringify({
            version: timetable.version,
            built: timetable.built,
            stops: stopCount,
            tripPatterns: tripCount,
            patterns: patternCount,
            sizeMB: Number((size / 1024 / 1024).toFixed(2))
          }, null, 2));
          NODE

            ls -lh timetable.json
          }

          set +e
          run_build 2>&1 | tee "$LOG_FILE"
          STATUS=${PIPESTATUS[0]}
          set -e

          echo "$STATUS" > "$STATUS_FILE"
          cp "$LOG_FILE" timetable-build-diagnostic.txt
          exit "$STATUS"

      - name: Commit timetable or failure diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "${{ steps.timetable_build.outcome }}" == "success" ]]; then
            rm -f timetable-build-diagnostic.txt
            git add -A timetable.json timetable-build-diagnostic.txt
            MESSAGE="Update Kerbside timetable ($(date -u +%Y-%m-%d))"
          else
            {
              echo "Kerbside timetable build failed."
              echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo "Run attempt: ${GITHUB_RUN_ATTEMPT}"
              echo
              cat timetable-build-diagnostic.txt 2>/dev/null || echo "No diagnostic output was captured."
            } > timetable-build-diagnostic.tmp
            mv timetable-build-diagnostic.tmp timetable-build-diagnostic.txt
            git add timetable-build-diagnostic.txt
            MESSAGE="Record Kerbside timetable build failure"
          fi

          if git diff --cached --quiet; then
            echo "No repository change to commit."
          else
            git commit -m "$MESSAGE"
            git push
          fi

      - name: Mark workflow failed when build failed
        if: steps.timetable_build.outcome != 'success'
        shell: bash
        run: |
          echo "::error::Kerbside timetable build failed. See timetable-build-diagnostic.txt in the repository for the exact cause."
          exit 1
