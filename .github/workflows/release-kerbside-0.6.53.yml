name: Release Kerbside 0.6.53

on:
  workflow_dispatch:
  push:
    branches:
      - agent/kerbside-route-overlay-0.6.53
    paths:
      - .github/triggers/release-kerbside-0.6.53.txt

permissions:
  contents: write

concurrency:
  group: release-kerbside-0.6.53
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply release patch
        run: python3 .github/scripts/release-kerbside-0.6.53.py

      - name: Validate timetable builder syntax
        run: node --check build-timetable.js

      - name: Install backend dependencies
        working-directory: kerbside-backend
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Run source checks
        working-directory: kerbside-backend
        run: npm run check

      - name: Run Worker tests
        working-directory: kerbside-backend
        run: npm test

      - name: Install WebKit
        working-directory: kerbside-backend
        run: npx playwright install --with-deps webkit

      - name: Run mobile browser regression
        working-directory: kerbside-backend
        run: npm run test:browser

      - name: Verify release diff
        run: |
          git diff --check
          grep -F "const APP_VERSION = '0.6.53';" bus.html
          grep -F '"version": "0.6.53"' kerbside-backend/package.json
          grep -F "version: '0.6.53'" kerbside-backend/src/worker.js
          grep -F 'function shouldClearJourneyRoute' bus.html

      - name: Remove temporary release files
        run: |
          rm -f .github/scripts/release-kerbside-0.6.53.py
          rm -f .github/workflows/release-kerbside-0.6.53.yml
          rm -f .github/triggers/release-kerbside-0.6.53.txt

      - name: Publish verified release to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            bus.html \
            kerbside-backend/README.md \
            kerbside-backend/package.json \
            kerbside-backend/src/worker.js \
            kerbside-backend/test/worker.test.js \
            kerbside-backend/tests/browser-regression.mjs \
            .github/scripts/release-kerbside-0.6.53.py \
            .github/workflows/release-kerbside-0.6.53.yml \
            .github/triggers/release-kerbside-0.6.53.txt
          git diff --cached --check
          git commit -m 'Release Kerbside 0.6.53 route overlay stability'
          git push origin HEAD:${GITHUB_REF_NAME}
