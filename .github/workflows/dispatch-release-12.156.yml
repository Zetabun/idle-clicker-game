name: Dispatch Strikewatch 12.156

on:
  pull_request:
    types: [closed]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.pull_request.merged == true && github.event.pull_request.title == 'Trigger Strikewatch 12.156 release'
    runs-on: ubuntu-latest
    steps:
      - name: Run release builder
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-12.156.yml --repo "$GITHUB_REPOSITORY"
