name: Patch Kerbside 0.9.34 memory safety

on:
  push:
    branches:
      - agent/kerbside-0.9.34-memory-first-movement
    paths:
      - .github/scripts/patch-kerbside-0.9.34-memory-safety.py
      - .github/workflows/patch-kerbside-0.9.34-memory-safety.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/kerbside-0.9.34-memory-first-movement
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Apply memory safety hardening
        run: python3 .github/scripts/patch-kerbside-0.9.34-memory-safety.py
      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kerbside-train-movement-worker/worker.js kerbside-train-movement-worker/movement-storage-policy.js kerbside-train-movement-worker/movement-storage-policy.test.mjs
          git diff --cached --check
          git commit -m 'Kerbside 0.9.34: bound movement memory recovery'
          git push origin HEAD:agent/kerbside-0.9.34-memory-first-movement
