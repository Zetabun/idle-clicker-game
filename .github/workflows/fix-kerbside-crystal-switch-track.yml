name: Fix Crystal toggle track

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-kerbside-crystal-switch-track.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-kerbside-crystal-switch-track
  cancel-in-progress: true

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Keep enabled Crystal switch tracks light
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('bus.html')
          source = path.read_text(encoding='utf-8')
          rule = 'body.theme-crystal .sw[aria-pressed="true"]{background:var(--rule)}'
          anchor = '''body.theme-crystal .dirswitch button{border-radius:999px}
          body.theme-crystal .searchwrap input{background:var(--ink);border-color:transparent}'''
          replacement = f'''body.theme-crystal .dirswitch button{{border-radius:999px}}
          {rule}
          body.theme-crystal .searchwrap input{{background:var(--ink);border-color:transparent}}'''

          if rule not in source:
              count = source.count(anchor)
              if count != 1:
                  raise SystemExit(f'Crystal switch anchor: expected 1 match, found {count}')
              source = source.replace(anchor, replacement)

          if source.count(rule) != 1:
              raise SystemExit('Crystal enabled switch rule is missing or duplicated')
          path.write_text(source, encoding='utf-8')
          PY

          git diff --check
          changed="$(git diff --name-only)"
          if [[ "$changed" != "bus.html" ]]; then
            echo "::error::Unexpected changed files"
            printf 'Expected: bus.html\nActual:\n%s\n' "$changed"
            exit 1
          fi
          grep -Fq 'body.theme-crystal .sw[aria-pressed="true"]{background:var(--rule)}' bus.html

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Kerbside test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          cd kerbside-backend
          npx playwright install --with-deps webkit chromium

      - name: Run syntax and unit checks
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix kerbside-backend run check
          npm --prefix kerbside-backend test

      - name: Run the full mobile browser suite in both engines
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix kerbside-backend run test:browser
          KERBSIDE_BROWSER=chromium npm --prefix kerbside-backend run test:browser

      - name: Verify switch colours in both app themes and both engines
        shell: bash
        run: |
          set -euo pipefail
          cd kerbside-backend
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { chromium, webkit } from 'playwright';

          const source = await readFile('../bus.html', 'utf8');
          const match = source.match(/<style>([\s\S]*?)<\/style>/);
          assert.ok(match, 'Could not extract the Kerbside stylesheet');
          const stylesheet = match[1];

          for (const [engineName, engine] of [['webkit', webkit], ['chromium', chromium]]) {
            const browser = await engine.launch({ headless: true });
            try {
              const page = await browser.newPage({ viewport: { width: 393, height: 852 } });
              await page.setContent(`<!doctype html><html><head><style>${stylesheet}</style></head><body>
                <button class="sw" aria-pressed="false" aria-label="Off"></button>
                <button class="sw" aria-pressed="true" aria-label="On"></button>
              </body></html>`);

              const states = await page.evaluate(() => {
                const off = document.querySelector('.sw[aria-pressed="false"]');
                const on = document.querySelector('.sw[aria-pressed="true"]');
                const capture = crystal => {
                  document.body.classList.toggle('theme-crystal', crystal);
                  return {
                    theme: crystal ? 'crystal' : 'dark',
                    offTrack: getComputedStyle(off).backgroundColor,
                    onTrack: getComputedStyle(on).backgroundColor,
                    onKnob: getComputedStyle(on, '::after').backgroundColor
                  };
                };
                return [capture(false), capture(true)];
              });

              const dark = states.find(state => state.theme === 'dark');
              const crystal = states.find(state => state.theme === 'crystal');
              assert.notEqual(dark.onTrack, dark.offTrack, `${engineName}: dark enabled track lost its active colour`);
              assert.equal(crystal.onTrack, crystal.offTrack, `${engineName}: Crystal enabled track became darker than the off track`);
              assert.notEqual(crystal.onKnob, crystal.onTrack, `${engineName}: Crystal blue knob is not distinct from its light track`);
              console.log(`${engineName}: dark and Crystal switch colours passed`, { dark, crystal });
            } finally {
              await browser.close();
            }
          }
          NODE

      - name: Commit the verified fix to main and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-kerbside-crystal-switch-track.yml
          git diff --check
          git add bus.html .github/workflows/fix-kerbside-crystal-switch-track.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep Crystal enabled toggle tracks light'
          git push origin HEAD:main
