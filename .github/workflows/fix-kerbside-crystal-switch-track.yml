name: Fix Crystal toggle track

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-kerbside-crystal-switch-track.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-kerbside-crystal-switch-track
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply the Crystal toggle track fix and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(text, old, new, expected, label):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} exact match(es), found {count}")
              return text.replace(old, new)

          bus_path = Path('bus.html')
          bus = bus_path.read_text(encoding='utf-8')
          bus = replace_exact(
              bus,
              '''body.theme-crystal .dirswitch button{border-radius:999px}
          body.theme-crystal .searchwrap input{background:var(--ink);border-color:transparent}''',
              '''body.theme-crystal .dirswitch button{border-radius:999px}
          body.theme-crystal .sw[aria-pressed="true"]{background:var(--rule)}
          body.theme-crystal .searchwrap input{background:var(--ink);border-color:transparent}''',
              1,
              'Crystal enabled switch track'
          )
          bus_path.write_text(bus, encoding='utf-8')

          test_path = Path('kerbside-backend/tests/browser-regression.mjs')
          test = test_path.read_text(encoding='utf-8')
          test = replace_exact(
              test,
              'assert.match(busSource, /body\\.theme-crystal \\.dirswitch button\\{border-radius:999px\\}/);',
              '''assert.match(busSource, /body\\.theme-crystal \\.dirswitch button\\{border-radius:999px\\}/);
          assert.match(busSource, /body\\.theme-crystal \\.sw\\[aria-pressed="true"\\]\\{background:var\\(--rule\\)\\}/);''',
              1,
              'Crystal switch source assertion'
          )

          switch_check = '''const switchTracks=await page.evaluate(()=>{
            const off=document.querySelector('.sw[aria-pressed="false"]');
            const on=document.querySelector('.sw[aria-pressed="true"]');
            const originalCrystal=document.body.classList.contains('theme-crystal');
            const capture=crystal=>{
              document.body.classList.toggle('theme-crystal',crystal);
              return {
                theme:crystal?'crystal':'dark',
                offTrack:getComputedStyle(off).backgroundColor,
                onTrack:getComputedStyle(on).backgroundColor,
                onKnob:getComputedStyle(on,'::after').backgroundColor
              };
            };
            const layouts=[capture(false),capture(true)];
            document.body.classList.toggle('theme-crystal',originalCrystal);
            return layouts;
          });
          const darkSwitch=switchTracks.find(layout=>layout.theme==='dark');
          const crystalSwitch=switchTracks.find(layout=>layout.theme==='crystal');
          assert.notEqual(darkSwitch.onTrack,darkSwitch.offTrack,'Dark-theme enabled switch track unexpectedly lost its active colour');
          assert.equal(crystalSwitch.onTrack,crystalSwitch.offTrack,'Crystal enabled switch track should remain the same light grey as an off switch');
          assert.notEqual(crystalSwitch.onKnob,crystalSwitch.onTrack,'Crystal enabled switch knob should remain visibly blue');
          const viewportContent=await page.locator('meta[name="viewport"]').getAttribute('content');'''
          test = replace_exact(
              test,
              'const viewportContent=await page.locator(\'meta[name="viewport"]\').getAttribute(\'content\');',
              switch_check,
              1,
              'computed switch colour regression check'
          )
          test_path.write_text(test, encoding='utf-8')
          PY

          git diff --check
          changed="$(git diff --name-only)"
          expected=$'bus.html\nkerbside-backend/tests/browser-regression.mjs'
          if [[ "$changed" != "$expected" ]]; then
            echo "::error::Unexpected changed files"
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$changed"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Kerbside test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          cd kerbside-backend
          npx playwright install --with-deps webkit chromium

      - name: Run syntax and unit checks
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix kerbside-backend run check
          npm --prefix kerbside-backend test

      - name: Run the full mobile browser regression in WebKit and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix kerbside-backend run test:browser
          KERBSIDE_BROWSER=chromium npm --prefix kerbside-backend run test:browser

      - name: Commit the verified fix to main and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-kerbside-crystal-switch-track.yml
          git diff --check
          git add bus.html kerbside-backend/tests/browser-regression.mjs .github/workflows/fix-kerbside-crystal-switch-track.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep Crystal enabled toggle tracks light'
          git push origin HEAD:main
