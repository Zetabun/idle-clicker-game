name: Fix Crystal toggle track

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-kerbside-crystal-switch-track.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-kerbside-crystal-switch-track
  cancel-in-progress: true

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply and verify the theme-specific switch fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('bus.html')
          source = path.read_text(encoding='utf-8')
          rule = 'body.theme-crystal .sw[aria-pressed="true"]{background:var(--rule)}'
          anchor = '''body.theme-crystal .dirswitch button{border-radius:999px}
          body.theme-crystal .searchwrap input{background:var(--ink);border-color:transparent}'''
          replacement = f'''body.theme-crystal .dirswitch button{{border-radius:999px}}
          {rule}
          body.theme-crystal .searchwrap input{{background:var(--ink);border-color:transparent}}'''

          if rule not in source:
              count = source.count(anchor)
              if count != 1:
                  raise SystemExit(f'Crystal switch anchor: expected 1 match, found {count}')
              source = source.replace(anchor, replacement)

          if source.count(rule) != 1:
              raise SystemExit('Crystal enabled switch rule is missing or duplicated')

          css = source[source.index('<style>') + len('<style>'):source.index('</style>')]
          required = {
              'off switch track stays light grey': '.sw{flex:0 0 auto;width:44px;height:25px;border-radius:13px;background:var(--rule);',
              'dark enabled track remains active-coloured': '.sw[aria-pressed="true"]{background:var(--led-dim)}',
              'enabled knob remains accent-coloured': '.sw[aria-pressed="true"]::after{transform:translateX(19px);background:var(--led)}',
              'Crystal enabled track matches the off track': rule,
          }
          for label, fragment in required.items():
              if fragment not in css:
                  raise SystemExit(f'{label}: expected CSS fragment not found')

          path.write_text(source, encoding='utf-8')
          print('Dark theme keeps its active track colour; Crystal keeps the same light-grey track on and off while the knob remains blue.')
          PY

          git diff --check
          changed="$(git diff --name-only)"
          if [[ "$changed" != "bus.html" ]]; then
            echo "::error::Unexpected changed files"
            printf 'Expected: bus.html\nActual:\n%s\n' "$changed"
            exit 1
          fi

      - name: Run Kerbside syntax and unit checks
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix kerbside-backend run check
          npm --prefix kerbside-backend test

      - name: Commit the verified fix to main and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-kerbside-crystal-switch-track.yml
          git diff --check
          git add bus.html .github/workflows/fix-kerbside-crystal-switch-track.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep Crystal enabled toggle tracks light'
          git push origin HEAD:main
