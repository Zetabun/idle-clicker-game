name: Integrate journey planner UI
on:
  pull_request:
    branches: [main]
    paths:
      - kerbside-journey-planner-ui.js
      - .github/workflows/integrate-journey-planner-ui.yml
permissions:
  contents: write
jobs:
  integrate:
    if: github.head_ref == 'agent/kerbside-journey-planner-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Wire planner and bump release
        shell: python
        run: |
          from pathlib import Path
          p=Path('bus.html'); s=p.read_text()
          marker='<script src="kerbside-train-date.js"></script>'
          script='<script src="kerbside-journey-planner-ui.js"></script>'
          if script not in s: s=s.replace(marker, marker+'\n'+script)
          s=s.replace('0.7.34','0.7.35')
          p.write_text(s)
          for name in ['kerbside-backend/package.json','kerbside-backend/src/worker.js']:
              q=Path(name)
              if q.exists(): q.write_text(q.read_text().replace('0.7.34','0.7.35'))
      - name: Validate JavaScript
        run: |
          node --check kerbside-journey-planner-ui.js
          node --check kerbside-train-forecast-v3.js
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bus.html kerbside-backend/package.json kerbside-backend/src/worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Integrate coupled journey planner UI"
          git push
