name: Kerbside production trace

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/kerbside-production-trace.yml

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: App and dynamic rail module
        id: app
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          version="$(tr -d '\r\n' < VERSION)"
          base='https://zetabun.github.io/idle-clicker-game'
          token="trace=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "$base/bus.html?$token" -o "$tmp/app"
          grep -Fq "const APP_VERSION = '$version';" "$tmp/app"
          grep -Fq "kerbside-train-forecast-v3.js?v=$version" "$tmp/app"
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "$base/kerbside-train-timetable.js?v=$version&$token" -o "$tmp/timetable"
          grep -Fq "journeyType:'connection'" "$tmp/timetable"
          echo "APP_OK version=$version timetable_module=reachable"

      - name: Bus worker health and live BODS SIRI
        id: bus
        continue-on-error: true
        shell: bash
        run: |
          set -u
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          worker='https://kerbside-bus.adambullas.workers.dev'
          token="trace=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          version="$(tr -d '\r\n' < VERSION)"
          echo 'BUS_HEALTH_RAW_BEGIN'
          if curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "$worker/health?$token" -o "$tmp/health"; then
            cat "$tmp/health"; echo
            echo 'BUS_HEALTH_RAW_END'
            jq -c '{ok,service,role,version,bods,matchedGtfsRt,upstreamTimeoutMs,upstreamAttempts}' "$tmp/health" || true
            if jq -e --arg v "$version" '.ok==true and .version==$v and .bods==true' "$tmp/health" >/dev/null; then
              echo 'BUS_HEALTH_PARITY=ok'
            else
              echo "BUS_HEALTH_PARITY=mismatch expected_version=$version"
            fi
          else
            echo 'BUS_HEALTH_REQUEST=failed'
          fi
          echo 'BUS_SIRI_BEGIN'
          if curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "$worker/feed?bbox=-2.15,52.45,-2.05,52.55&$token" -o "$tmp/siri"; then
            python3 - "$tmp/siri" <<'PY'
          import sys,xml.etree.ElementTree as ET
          try:
              root=ET.parse(sys.argv[1]).getroot()
              local=lambda x:x.rsplit('}',1)[-1]
              names={local(x.tag) for x in root.iter()}
              assert local(root.tag)=='Siri' and 'VehicleMonitoringDelivery' in names
              print('BUS_SIRI=valid')
          except Exception as e:
              print('BUS_SIRI=invalid',repr(e)); raise
          PY
          else
            echo 'BUS_SIRI=request_failed'; exit 1
          fi

      - name: Official rail worker and live Darwin
        id: rail
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          rail='https://kerbside-rail.adambullas.workers.dev'
          token="trace=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 -H 'Origin: https://zetabun.github.io' "$rail/health?$token" -o "$tmp/health"
          echo 'RAIL_HEALTH_RAW_BEGIN'; cat "$tmp/health"; echo; echo 'RAIL_HEALTH_RAW_END'
          jq -e '.ok==true and .service=="kerbside-rail" and .ldbConfigured==true' "$tmp/health" >/dev/null
          jq -c '{ok,service,source,ldbConfigured,upstreamTimeoutMs,cacheSeconds,rateLimitPerMinute}' "$tmp/health"
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 -H 'Origin: https://zetabun.github.io' "$rail/departures/BHM/9?expand=true&$token" -o "$tmp/board"
          jq -e '.crs=="BHM" and has("trainServices") and (.trainServices==null or (.trainServices|type)=="array")' "$tmp/board" >/dev/null
          jq -c '{crs,locationName,generatedAt,services:(.trainServices//[]|length),messages:(.nrccMessages//[]|length)}' "$tmp/board"
          echo 'RAIL_LIVE=valid'

      - name: Darwin timetable snapshot and day shard
        id: timetable
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          base='https://zetabun.github.io/idle-clicker-game/kerbside-rail-timetable'
          token="trace=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          today="$(TZ=Europe/London date +%F)"; compact="${today//-/}"
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "$base/manifest.json?$token" -o "$tmp/manifest"
          jq -c --arg d "$today" '{timetableId,dates,journeys,todayCoverage:.coverage[$d],todayJourneys:.journeyCounts[$d]}' "$tmp/manifest"
          jq -e --arg d "$today" --arg c "$compact" '.source=="National Rail Darwin Timetable Files" and (.dates|index($d))!=null and .coverage[$d].partial==false and (.journeyCounts[$d]//0)>1000 and (.timetableId|tostring|startswith($c))' "$tmp/manifest" >/dev/null
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "$base/locations.json?$token" -o "$tmp/locations"
          jq -e 'has("BHM") and has("BRI") and has("CNM") and has("GLO")' "$tmp/locations" >/dev/null
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "$base/$today.json.gz?$token" -o "$tmp/day.gz"
          gzip -t "$tmp/day.gz"
          rows="$(gzip -dc "$tmp/day.gz" | jq 'length')"; test "$rows" -gt 1000
          echo "TIMETABLE_OK rows=$rows"

      - name: National static bus data
        id: busdata
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          url="https://kerbside-data-zetabun.pages.dev/manifest.json?trace=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "$url" -o "$tmp/manifest"
          jq -e 'type=="object" and length>0' "$tmp/manifest" >/dev/null
          jq -c '{version,scope,built,generatedAt,regions:(.regions|if type=="array" or type=="object" then length else null end),stops,totalStops,departures,totalDepartures}' "$tmp/manifest"
          echo 'BUS_STATIC=reachable'

      - name: Disruptions and NaPTAN
        id: reference
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          base='https://zetabun.github.io/idle-clicker-game'
          token="trace=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "$base/disruptions.json?$token" -o "$tmp/disruptions"
          jq -e '.scope=="kerbside-disruptions" and (.count//0)>0 and (.situations|type)=="array"' "$tmp/disruptions" >/dev/null
          python3 - "$tmp/disruptions" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          d=json.load(open(sys.argv[1])); built=datetime.fromisoformat(d['built'].replace('Z','+00:00')); age=(datetime.now(timezone.utc)-built).total_seconds()/3600
          assert age<24, f'disruptions stale: {age:.1f}h'; print(f"DISRUPTIONS_OK count={d['count']} age={age:.2f}h")
          PY
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "$base/naptan/index.json?$token" -o "$tmp/naptan"
          jq -e '.scope=="kerbside-naptan-index" and (.count//0)>300000 and (.areas|type)=="object"' "$tmp/naptan" >/dev/null
          jq -c '{built,count,prefixLength,areaCount:(.areas|length)}' "$tmp/naptan"
          echo 'NAPTAN_OK'

      - name: Forecast context sources
        id: context
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 'https://www.gov.uk/bank-holidays.json' -o "$tmp/bank"
          jq -e '.["england-and-wales"].events|length>0' "$tmp/bank" >/dev/null; echo 'BANK_HOLIDAYS=reachable'
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 'https://raw.githubusercontent.com/openfootball/football.json/master/2025-26/en.1.json' -o "$tmp/football"
          jq -e '.matches|length>0' "$tmp/football" >/dev/null; echo 'OPENFOOTBALL=reachable'
          curl -fsSL --retry 1 --connect-timeout 10 --max-time 30 -A 'Kerbside trace/0.8.0' 'https://query.wikidata.org/sparql?query=ASK%7B%3Fs%20%3Fp%20%3Fo%7D&format=json' -o "$tmp/wikidata"
          jq -e 'has("boolean")' "$tmp/wikidata" >/dev/null; echo 'WIKIDATA=reachable'

      - name: Outcomes
        if: always()
        shell: bash
        env:
          APP: ${{ steps.app.outcome }}
          BUS: ${{ steps.bus.outcome }}
          RAIL: ${{ steps.rail.outcome }}
          TIMETABLE: ${{ steps.timetable.outcome }}
          BUSDATA: ${{ steps.busdata.outcome }}
          REFERENCE: ${{ steps.reference.outcome }}
          CONTEXT: ${{ steps.context.outcome }}
        run: echo "OUTCOMES app=$APP bus=$BUS rail=$RAIL timetable=$TIMETABLE busdata=$BUSDATA reference=$REFERENCE context=$CONTEXT"
