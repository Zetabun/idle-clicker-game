name: Diagnose Kerbside 0.8.8 WebKit

on:
  pull_request:
    branches:
      - main
    paths:
      - VERSION
      - bus.html
      - kerbside-train-loading-guidance.js
      - kerbside-backend/**
      - .github/workflows/kerbside-check.yml

permissions:
  contents: read

concurrency:
  group: kerbside-088-diagnose-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          npm run vendor:leaflet --prefix kerbside-backend
          cd kerbside-backend
          npx playwright install --with-deps webkit

      - name: WebKit browser
        continue-on-error: true
        run: npm run test:browser --prefix kerbside-backend

      - name: WebKit train
        continue-on-error: true
        run: npm run test:train --prefix kerbside-backend

      - name: WebKit train route
        continue-on-error: true
        run: npm run test:train-route --prefix kerbside-backend

      - name: WebKit identity
        continue-on-error: true
        run: npm run test:identity --prefix kerbside-backend

      - name: WebKit multi vehicle
        continue-on-error: true
        run: npm run test:multi-vehicle --prefix kerbside-backend

      - name: WebKit audit
        continue-on-error: true
        run: npm run test:audit --prefix kerbside-backend

      - name: WebKit accuracy hardening
        continue-on-error: true
        run: npm run test:accuracy-hardening --prefix kerbside-backend --if-present

      - name: WebKit stop side
        continue-on-error: true
        run: npm run test:stop-side --prefix kerbside-backend --if-present

      - name: WebKit journey identity
        continue-on-error: true
        run: npm run test:journey-identity --prefix kerbside-backend --if-present

      - name: WebKit disruptions
        continue-on-error: true
        run: npm run test:disruptions --prefix kerbside-backend --if-present

      - name: WebKit listing reliability
        continue-on-error: true
        run: npm run test:listing-reliability --prefix kerbside-backend --if-present
