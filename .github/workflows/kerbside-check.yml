name: Validate Kerbside

on:
  pull_request:
    branches:
      - main
    paths:
      - bus.html
      - build-timetable.js
      - kerbside-backend/**
      - .github/workflows/build-kerbside-national.yml
      - .github/workflows/deploy-kerbside-worker.yml
      - .github/workflows/kerbside-check.yml
      - .github/workflows/kerbside-release.yml
      - .github/workflows/verify-kerbside-production.yml
  push:
    branches:
      - main
    paths:
      - bus.html
      - build-timetable.js
      - kerbside-backend/**
      - .github/workflows/build-kerbside-national.yml
      - .github/workflows/deploy-kerbside-worker.yml
      - .github/workflows/kerbside-check.yml
      - .github/workflows/kerbside-release.yml
      - .github/workflows/verify-kerbside-production.yml

permissions:
  contents: read

concurrency:
  group: kerbside-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install browser test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          npm run vendor:leaflet --prefix kerbside-backend
          if git ls-files --error-unmatch kerbside-backend/vendor/leaflet/leaflet.js >/dev/null 2>&1; then
            git diff --exit-code -- kerbside-backend/vendor/leaflet
          fi
          cd kerbside-backend
          npx playwright install --with-deps webkit

      - name: Validate browser JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          source = Path('bus.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', source, flags=re.I | re.S)
          if not scripts:
              raise SystemExit('No inline browser scripts found')
          with tempfile.TemporaryDirectory() as directory:
              for index, script in enumerate(scripts, start=1):
                  filename = Path(directory) / f'inline-{index}.js'
                  filename.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(filename)], check=True)
          print(f'Validated {len(scripts)} inline browser script(s).')
          PY

      - name: Validate timetable builders and Worker
        shell: bash
        run: |
          set -euo pipefail
          node --check build-timetable.js
          npm run check --prefix kerbside-backend
          npm test --prefix kerbside-backend

      - name: Run WebKit mobile regression checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:browser --prefix kerbside-backend

      - name: Parse Kerbside workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; ARGV.each { |file| YAML.parse_file(file) or abort(file) }" \
            .github/workflows/build-kerbside-national.yml \
            .github/workflows/deploy-kerbside-worker.yml \
            .github/workflows/kerbside-check.yml \
            .github/workflows/kerbside-release.yml \
            .github/workflows/verify-kerbside-production.yml

      - name: Check whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
