name: Release Strikewatch 12.184

on:
  push:
    branches:
      - main
  page_build:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strikewatch-release-12-184
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out marked revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Build, verify and publish 12.184
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f .github/release-12-184.trigger ]; then
            echo "No 12.184 trigger marker on this revision; nothing to do."
            exit 0
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {
              'version': '12.183',
              'name': 'Surface Blood & Inbox CSS Ownership',
              'build_id': '12.183.0-surface-blood-inbox-css-ownership',
          }
          actual = json.loads(Path('strikewatch-source/RELEASE.json').read_text(encoding='utf-8'))
          if actual != expected:
              raise SystemExit(f'Predecessor guard failed: expected {expected}, got {actual}')
          PY

          python3 .github/scripts/release-12-184.py
          cd strikewatch-source

          python3 -m py_compile build.py
          python3 build.py

          find js -maxdepth 1 -type f -name '*.js' ! -name 'strikewatch.dev.js' -print0 | sort -z | xargs -0 -n1 node --check
          node --check js/strikewatch.dev.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('dist/strikewatch-build-12.184.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('No standalone inline scripts found')
          for index, script in enumerate(scripts):
              Path(f'/tmp/sw-12-184-inline-{index}.js').write_text(script, encoding='utf-8')
          print(f'Standalone inline scripts: {len(scripts)}')
          PY
          for script in /tmp/sw-12-184-inline-*.js; do node --check "$script"; done

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          game = Path('css/game.css').read_text(encoding='utf-8')
          owned = Path('css/economy-guide.css').read_text(encoding='utf-8')
          marker = '/* --- After-action rewards / economy guide typography --- */'
          if marker in game:
              raise SystemExit('Economy guide marker remains in game.css')
          if owned.count(marker) != 1:
              raise SystemExit('Economy guide marker does not occur exactly once in owner')
          required = [
              '.club-economy-guide > header > span { font-size: 10px !important; }',
              '.club-economy-guide > header > strong { font-size: 15px !important; }',
              '.club-economy-guide article > span { font-size: 9.5px !important; letter-spacing: .1em !important; }',
              '.club-economy-guide article > strong { font-size: 17px !important; }',
              'grid-template-columns: repeat(2, minmax(0, 1fr)) !important;',
              '.club-economy-guide article > strong { font-size: 19px !important; }',
              '@media (max-width: 560px)',
              '.club-economy-guide > div { grid-template-columns: 1fr !important; }',
          ]
          missing = [item for item in required if item not in owned]
          if missing:
              raise SystemExit(f'Missing economy declarations: {missing}')
          if owned.count('@media (max-width: 1023px)') != 1 or owned.count('@media (max-width: 560px)') != 1:
              raise SystemExit('Economy guide media-query ownership mismatch')

          report = json.loads(Path('dist/strikewatch-build-12.184-css-debt.json').read_text(encoding='utf-8'))
          if not report.get('within_budget'):
              raise SystemExit(f'CSS report outside budget: {report}')
          if report.get('stylesheet_order', [])[:3] != ['game.css', 'economy-guide.css', 'inbox-scroll.css']:
              raise SystemExit(f'Unexpected leading stylesheet order: {report.get("stylesheet_order")}')
          if report.get('owned_economy_guide_lines', 0) < 25:
              raise SystemExit('Economy guide owner line count was not recorded')
          if report.get('game_css_lines', 999999) > 30785:
              raise SystemExit('game.css did not meet tightened line budget')

          index = Path('index.html').read_text(encoding='utf-8')
          build = Path('build.py').read_text(encoding='utf-8')
          hrefs = re.findall(r'<link rel="stylesheet" href="css/([^?]+)\?v=[^"]+"\s*/>', index)
          match = re.search(r'CSS_PATHS = \((.*?)\)\n', build, flags=re.S)
          if not match:
              raise SystemExit('CSS_PATHS not found')
          paths = re.findall(r'ROOT / "css" / "([^"]+)"', match.group(1))
          if hrefs != paths:
              raise SystemExit(f'index/build CSS order mismatch: {hrefs} != {paths}')

          standalone = Path('dist/strikewatch-build-12.184.html').read_text(encoding='utf-8')
          if re.search(r'<link rel="stylesheet" href="css/', standalone):
              raise SystemExit('Standalone retained an external CSS link')
          bundle = Path('js/strikewatch.dev.js').read_text(encoding='utf-8')
          for hook in ('economyGuidanceForTest', 'firstMatchPayoffForTest', 'typographyConsistencyForTest', 'mobileInterfaceAuditForTest', 'renderRouteForTest'):
              if hook not in bundle:
                  raise SystemExit(f'Missing retained hook: {hook}')
          PY

          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.184.html dist/strikewatch-build-12.184-size.json dist/strikewatch-build-12.184-css-debt.json > /tmp/sw-12-184-first.sha
          cp js/strikewatch.dev.js /tmp/sw-12-184-first.dev.js
          cp dist/strikewatch-build-12.184.html /tmp/sw-12-184-first.html
          cp dist/strikewatch-build-12.184-size.json /tmp/sw-12-184-first-size.json
          cp dist/strikewatch-build-12.184-css-debt.json /tmp/sw-12-184-first-css.json

          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.184.html dist/strikewatch-build-12.184-size.json dist/strikewatch-build-12.184-css-debt.json > /tmp/sw-12-184-second.sha
          cmp /tmp/sw-12-184-first.dev.js js/strikewatch.dev.js
          cmp /tmp/sw-12-184-first.html dist/strikewatch-build-12.184.html
          cmp /tmp/sw-12-184-first-size.json dist/strikewatch-build-12.184-size.json
          cmp /tmp/sw-12-184-first-css.json dist/strikewatch-build-12.184-css-debt.json

          python3 - <<'PY'
          from pathlib import Path
          import re
          build = Path('build.py').read_text(encoding='utf-8')
          match = re.search(r'CSS_PATHS = \((.*?)\)\n', build, flags=re.S)
          paths = re.findall(r'ROOT / "css" / "([^"]+)"', match.group(1))
          links = '\n'.join(f'<link rel="stylesheet" href="css/{name}">' for name in paths)
          Path('economy-probe.html').write_text(f'''<!doctype html>
          <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">{links}</head>
          <body><div id="menuContent"><section id="economyStyleProbe" class="club-economy-guide">
          <header><span>REWARDS</span><strong>ECONOMY GUIDE</strong><p>Settlement explanation.</p></header>
          <div><article><span>CLUB CASH</span><strong>£1,250</strong><b>RESULT</b><p>Operating reward.</p></article>
          <article><span>GOLD COINS</span><strong>4</strong><b>BONUS</b><p>Milestone reward.</p></article></div>
          <aside>Ledger note.</aside></section></div><pre id="result"></pre>
          <script>
          const root = document.getElementById('economyStyleProbe');
          const style = selector => getComputedStyle(root.querySelector(selector));
          const grid = style(':scope > div');
          document.getElementById('result').textContent = JSON.stringify({{
            width: innerWidth,
            headerKicker: style(':scope > header > span').fontSize,
            headerTitle: style(':scope > header > strong').fontSize,
            headerCopy: style(':scope > header > p').fontSize,
            meta: style('article > span').fontSize,
            value: style('article > strong').fontSize,
            label: style('article > b').fontSize,
            body: style('article > p').fontSize,
            aside: style(':scope > aside').fontSize,
            columns: grid.gridTemplateColumns.split(/\\s+/).filter(Boolean).length,
            gap: grid.columnGap
          }});
          </script></body></html>''', encoding='utf-8', newline='\n')
          PY

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No headless Chrome binary is available on the runner." >&2
            exit 1
          fi
          for width in 1440 1023 560; do
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --allow-file-access-from-files --window-size="${width},1000" --dump-dom "file://$(pwd)/economy-probe.html" > "/tmp/sw-12-184-economy-${width}.html"
          done

          python3 - <<'PY'
          from pathlib import Path
          import html
          import json
          import re

          def read(width):
              raw = Path(f'/tmp/sw-12-184-economy-{width}.html').read_text(encoding='utf-8')
              match = re.search(r'<pre id="result">(.*?)</pre>', raw, flags=re.S)
              if not match:
                  raise SystemExit(f'Computed-style result missing at {width}px')
              return json.loads(html.unescape(match.group(1)))

          desktop = read(1440)
          compact = read(1023)
          phone = read(560)
          if abs(desktop['width'] - 1440) > 1 or abs(compact['width'] - 1023) > 1 or abs(phone['width'] - 560) > 1:
              raise SystemExit(f'Unexpected browser viewports: {desktop["width"]}, {compact["width"]}, {phone["width"]}')
          expected_desktop = {
              'headerKicker': '10px', 'headerTitle': '15px', 'headerCopy': '11px',
              'meta': '9.5px', 'value': '17px', 'label': '11px',
              'body': '11px', 'aside': '11px'
          }
          for key, value in expected_desktop.items():
              if desktop[key] != value:
                  raise SystemExit(f'Desktop {key}: expected {value}, got {desktop[key]}')
          expected_compact = {
              'headerTitle': '17px', 'headerCopy': '13px', 'meta': '12px',
              'value': '19px', 'label': '13px', 'body': '12px', 'aside': '12px'
          }
          for key, value in expected_compact.items():
              if compact[key] != value:
                  raise SystemExit(f'Compact {key}: expected {value}, got {compact[key]}')
          if compact['columns'] != 2 or compact['gap'] != '8px':
              raise SystemExit(f'Compact grid mismatch: {compact}')
          if phone['columns'] != 1:
              raise SystemExit(f'Phone grid mismatch: {phone}')
          print(json.dumps({'desktop': desktop, 'compact': compact, 'phone': phone}, indent=2))
          PY

          rm -f economy-probe.html
          cp dist/strikewatch-build-12.184.html ../cod.html
          cmp dist/strikewatch-build-12.184.html ../cod.html

          cd ..
          rm -f .github/scripts/release-12-184.py .github/workflows/release-12-184.yml .github/release-12-184.trigger release-12-184-pages-trigger.txt
          git add -A -- strikewatch-source cod.html .github release-12-184-pages-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build 12.184: establish economy guide CSS ownership"
          git push origin HEAD:main
