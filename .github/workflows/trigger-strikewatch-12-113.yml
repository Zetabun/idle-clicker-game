name: Trigger Strikewatch 12.113

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trigger:
    if: github.repository == 'Zetabun/idle-clicker-game'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trigger release workflow once
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -q 'Deploy Strikewatch Build 12.113'; then
            echo 'Build 12.113 is already deployed.'
            exit 0
          fi
          if grep -q '# scheduled-trigger-fired' .github/workflows/strikewatch-release-12-113.yml; then
            echo 'Release workflow has already been triggered.'
            exit 0
          fi
          printf '\n# scheduled-trigger-fired\n' >> .github/workflows/strikewatch-release-12-113.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/strikewatch-release-12-113.yml
          git commit -m 'Trigger Strikewatch 12.113 release'
          git push origin HEAD:main
