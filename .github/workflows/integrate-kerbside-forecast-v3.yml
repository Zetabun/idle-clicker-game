name: Integrate Kerbside forecast v3
on:
  pull_request:
    branches: [main]
    paths:
      - kerbside-train-forecast-v3.js
      - .github/workflows/integrate-kerbside-forecast-v3.yml
permissions:
  contents: write
jobs:
  integrate:
    if: github.head_ref == 'agent/kerbside-train-forecast-v3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Wire forecast v3 and release version
        shell: python
        run: |
          from pathlib import Path
          p=Path('bus.html'); s=p.read_text()
          if 'kerbside-train-forecast-v3.js' not in s:
              s=s.replace('<script src="kerbside-train-date.js"></script>', '<script src="kerbside-train-date.js"></script>\n<script src="kerbside-train-forecast-v3.js"></script>')
          s=s.replace('0.7.30','0.7.31')
          p.write_text(s)
          for name in ['kerbside-backend/package.json','kerbside-backend/src/worker.js']:
              q=Path(name)
              if q.exists(): q.write_text(q.read_text().replace('0.7.30','0.7.31'))
      - name: Syntax check forecast v3
        run: node --check kerbside-train-forecast-v3.js
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bus.html kerbside-backend/package.json kerbside-backend/src/worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Integrate train forecast v3"
          git push
