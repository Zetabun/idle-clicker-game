name: Release Strikewatch 12.183

on:
  workflow_dispatch:
  page_build:

permissions:
  contents: write

concurrency:
  group: strikewatch-release-12-183
  cancel-in-progress: true

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'page_build'
    runs-on: ubuntu-latest
    steps:
      - name: Check out marked revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require dedicated release marker
        id: marker
        shell: bash
        run: |
          if [ ! -f .github/release-12-183.trigger ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          grep -Fxq 'Release Build 12.183 from this exact marked revision.' .github/release-12-183.trigger
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Apply guarded source patch
        if: steps.marker.outputs.present == 'true'
        run: python3 .github/scripts/release-12-183.py

      - name: Compile build script
        if: steps.marker.outputs.present == 'true'
        working-directory: strikewatch-source
        run: python3 -m py_compile build.py

      - name: Build twice and verify determinism
        if: steps.marker.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd strikewatch-source
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.183.html dist/strikewatch-build-12.183-size.json dist/strikewatch-build-12.183-css-debt.json > /tmp/strikewatch-first.sha
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.183.html dist/strikewatch-build-12.183-size.json dist/strikewatch-build-12.183-css-debt.json > /tmp/strikewatch-second.sha
          diff -u /tmp/strikewatch-first.sha /tmp/strikewatch-second.sha

      - name: Parse source and generated JavaScript
        if: steps.marker.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for file in strikewatch-source/js/*.js; do
            node --check "$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('strikewatch-source/dist/strikewatch-build-12.183.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('No inline standalone scripts found')
          out = Path('/tmp/strikewatch-inline-js')
          out.mkdir(exist_ok=True)
          for index, script in enumerate(scripts):
              (out / f'inline-{index}.js').write_text(script, encoding='utf-8')
          print(len(scripts))
          PY
          for file in /tmp/strikewatch-inline-js/*.js; do
            node --check "$file"
          done

      - name: Verify CSS ownership and blood implementation
        if: steps.marker.outputs.present == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('strikewatch-source')
          game = (root / 'css/game.css').read_text(encoding='utf-8')
          inbox = (root / 'css/inbox-scroll.css').read_text(encoding='utf-8')
          marker = '/* --- Inbox feed: inert until the manager clicks into it --- */'
          assert marker not in game
          assert inbox.count(marker) == 1
          assert inbox.count('.club-mail-list') == 3
          for token in (
              'overflow-y: hidden !important;',
              'overscroll-behavior: contain;',
              'body.mail-scroll-armed .club-mail-list',
              'overflow-y: auto !important;',
              '-webkit-mask-image:',
              'mask-image:',
          ):
              assert token in inbox, token

          core = (root / 'js/60-renderer-core.js').read_text(encoding='utf-8')
          world = (root / 'js/61-world-renderer.js').read_text(encoding='utf-8')
          ai = (root / 'js/30-bot-ai.js').read_text(encoding='utf-8')
          view = (root / 'js/63-viewmodel-renderer.js').read_text(encoding='utf-8')
          flow = (root / 'js/40-match-flow.js').read_text(encoding='utf-8')
          hooks = (root / 'js/79-save-checkpoints.js').read_text(encoding='utf-8')
          assert 'const BLOOD_DECAL_LIMIT = 18;' in core
          assert 'const BLOOD_SPLATTER_MAX_DISTANCE = 1.25;' in core
          assert 'function spawnBloodSplatter' in world
          assert 'const hit = castRay(originX, originZ, angle);' in world
          assert 'hit.d > BLOOD_SPLATTER_MAX_DISTANCE' in world
          assert 'function drawBloodDecals' in world
          assert 'function clearBloodDecals' in world
          assert 'appliedDamage > 0' in ai and 'spawnBloodSplatter(this, target' in ai
          assert 'drawBloodDecals();' in view
          assert 'clearBloodDecals();' in flow
          assert 'bloodSplatterForTest' in hooks
          assert 'drawStaticWorld' not in world[world.index('function drawBloodDecals'):world.index('function drawGroundGlow')]

          build = (root / 'build.py').read_text(encoding='utf-8')
          index = (root / 'index.html').read_text(encoding='utf-8')
          expected = re.findall(r'ROOT / "css" / "([^"]+)"', re.search(r'CSS_PATHS = \((.*?)\)\n', build, re.S).group(1))
          actual = [Path(href.split('?', 1)[0]).name for href in re.findall(r'<link rel="stylesheet" href="(css/[^"]+)"\s*/>', index)]
          assert actual == expected, (actual, expected)
          assert expected[:4] == ['game.css', 'inbox-scroll.css', 'operator-portrait.css', 'command-chrome.css']

          report = json.loads((root / 'dist/strikewatch-build-12.183-css-debt.json').read_text(encoding='utf-8'))
          assert report['within_budget'] is True
          assert report['game_css_lines'] <= 30810
          assert report['important_declarations'] <= 2182
          assert report['media_queries'] <= 474
          assert report['owned_inbox_scroll_lines'] > 0
          assert report['stylesheet_order'] == expected

          standalone = (root / 'dist/strikewatch-build-12.183.html').read_text(encoding='utf-8')
          assert not re.search(r'<link rel="stylesheet" href="css/', standalone)
          assert '12.183.0-surface-blood-inbox-css-ownership' in standalone
          for hook in ('bloodSplatterForTest', 'impactDecalForTest', 'mobileInterfaceAuditForTest', 'renderRouteForTest'):
              assert hook in standalone, hook
          PY

      - name: Run headless browser regression probes
        if: steps.marker.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet selenium
          python3 -m http.server 8765 --directory strikewatch-source >/tmp/strikewatch-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import json
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--enable-webgl')
          options.add_argument('--ignore-gpu-blocklist')
          options.add_argument('--use-angle=swiftshader')
          options.add_argument('--window-size=1440,1000')
          driver = webdriver.Chrome(options=options)
          console_errors = []
          try:
              driver.get('http://127.0.0.1:8765/index.html')
              WebDriverWait(driver, 30).until(lambda d: d.execute_script("return Boolean(window.__strikeDebug && window.__strikeDebug.bloodSplatterForTest)"))
              driver.execute_script("window.__browserProbeErrors = []; window.addEventListener('error', e => window.__browserProbeErrors.push(String(e.message || e.error || 'error'))); window.addEventListener('unhandledrejection', e => window.__browserProbeErrors.push(String(e.reason || 'rejection')));")

              inbox = driver.execute_script("""
                const probe = document.createElement('div');
                probe.className = 'club-mail-list mail-scroll-overflow';
                probe.style.cssText = 'height:40px;width:200px;position:absolute;left:-9999px;top:0';
                probe.innerHTML = '<div style="height:200px">Inbox rows</div>';
                document.body.appendChild(probe);
                document.body.classList.remove('mail-scroll-armed');
                const inert = getComputedStyle(probe);
                const first = { overflowY: inert.overflowY, overscrollY: inert.overscrollBehaviorY, mask: inert.maskImage || inert.webkitMaskImage };
                document.body.classList.add('mail-scroll-armed');
                const armed = getComputedStyle(probe);
                const second = { overflowY: armed.overflowY, overscrollY: armed.overscrollBehaviorY, mask: armed.maskImage || armed.webkitMaskImage };
                probe.remove();
                document.body.classList.remove('mail-scroll-armed');
                return { inert: first, armed: second };
              """)
              assert inbox['inert']['overflowY'] == 'hidden', inbox
              assert inbox['armed']['overflowY'] == 'auto', inbox
              assert inbox['inert']['overscrollY'] == 'contain', inbox
              assert inbox['armed']['overscrollY'] == 'contain', inbox
              assert inbox['inert']['mask'] not in ('none', ''), inbox

              driver.execute_script('window.__strikeDebug.clearBloodSplatterForTest()')
              result = driver.execute_script('return window.__strikeDebug.bloodSplatterForTest()')
              assert result['ok'] is True, result
              assert result['spawned'] is True and result['restsOnSolidSurface'] is True, result
              assert result['distance'] <= result['maximumDistance'], result
              assert 3 <= result['spots'] <= 5, result
              for _ in range(30):
                  repeated = driver.execute_script('return window.__strikeDebug.bloodSplatterForTest()')
                  assert repeated['ok'] is True, repeated
              count = driver.execute_script('return window.__strikeDebug.bloodSplatterCountForTest()')
              assert count['count'] == count['limit'] == 18, count
              cleared = driver.execute_script('return window.__strikeDebug.clearBloodSplatterForTest()')
              assert cleared['count'] == 0, cleared

              impact = driver.execute_script('return window.__strikeDebug.impactDecalForTest()')
              assert impact['ok'] is True, impact
              errors = driver.execute_script('return window.__browserProbeErrors.slice()')
              assert errors == [], errors
              print(json.dumps({'inbox': inbox, 'blood': result, 'bloodCap': count, 'impact': impact}, indent=2))
          finally:
              driver.quit()
          PY

      - name: Copy verified standalone and confirm byte identity
        if: steps.marker.outputs.present == 'true'
        shell: bash
        run: |
          cp strikewatch-source/dist/strikewatch-build-12.183.html cod.html
          cmp -s cod.html strikewatch-source/dist/strikewatch-build-12.183.html

      - name: Remove temporary release machinery
        if: steps.marker.outputs.present == 'true'
        shell: bash
        run: |
          rm -f .github/scripts/release-12-183.py .github/workflows/release-12-183.yml .github/release-12-183.trigger

      - name: Commit and push complete release
        if: steps.marker.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- strikewatch-source cod.html .github
          git diff --cached --quiet && { echo 'No release changes staged'; exit 1; }
          git commit -m 'Build 12.183: add surface blood and own inbox scroll CSS'
          git push origin HEAD:main
