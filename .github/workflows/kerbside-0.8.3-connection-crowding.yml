name: Kerbside 0.8.3 connection crowding

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kerbside-0.8.3-connection-crowding.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kerbside-0.8.3-connection-crowding
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BODS_KEY: ${{ secrets.BODS_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Apply Kerbside 0.8.3
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-kerbside-0.8.3.py
          python3 .github/scripts/apply-kerbside-0.8.3-displacement.py
          python3 .github/scripts/sync-version.py

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          npm install --prefix kerbside-rail-worker --no-audit --no-fund --package-lock=false
          npm run vendor:leaflet --prefix kerbside-backend
          cd kerbside-backend
          npx playwright install --with-deps webkit chromium

      - name: Validate prediction and rail engines
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sync-version.py --check
          node --check kerbside-train-live-overlay.js
          node --check kerbside-train-events.js
          node --check kerbside-train-forecast-v3.js
          node --check kerbside-train-timetable.js
          node --check kerbside-status.js
          node --test kerbside-backend/tests/train-forecast-v3-dual-timetable.mjs
          node --test kerbside-backend/test/train-timetable-provider.test.js
          node --test kerbside-backend/test/train-route-swap.test.mjs
          node --test kerbside-backend/test/train-forecast-layout.test.mjs
          npm run check --prefix kerbside-backend
          npm test --prefix kerbside-backend
          npm run check --prefix kerbside-rail-worker
          npm test --prefix kerbside-rail-worker
          grep -Fq 'onwardServices' kerbside-train-live-overlay.js
          grep -Fq 'timetableInterchanges' kerbside-train-events.js
          grep -Fq 'connectionDisplacementSignal' kerbside-train-forecast-v3.js
          grep -Fq 'forecastRecovery' kerbside-train-timetable.js
          grep -Fx '0.8.3' VERSION
          git diff --check

      - name: Full WebKit system gate
        shell: bash
        env:
          KERBSIDE_BROWSER: webkit
        run: |
          set -euo pipefail
          npm run test:full --prefix kerbside-backend

      - name: Full Chromium system gate
        shell: bash
        env:
          KERBSIDE_BROWSER: chromium
        run: |
          set -euo pipefail
          npm run test:full --prefix kerbside-backend

      - name: Publish Kerbside 0.8.3 to main
        shell: bash
        run: |
          set -euo pipefail
          git add VERSION bus.html kerbside-status.js kerbside-train-live-overlay.js kerbside-train-events.js \
            kerbside-train-forecast-v3.js kerbside-train-timetable.js kerbside-trains.css \
            kerbside-backend/package.json kerbside-backend/src/worker.js kerbside-backend/test/worker.test.js \
            kerbside-backend/tests/browser-regression.mjs kerbside-backend/tests/train-forecast-v3-dual-timetable.mjs \
            kerbside-backend/tests/train-browser-core-regression.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Kerbside 0.8.3: make connection crowding leg-aware'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo 'Failed to publish after three rebased attempts.' >&2
          exit 1

      - name: Deploy version-aligned bus Worker
        shell: bash
        working-directory: kerbside-backend
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN BODS_KEY; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Required secret $name is missing or empty."; exit 1; fi
          done
          npx wrangler deploy
          printf '%s' "$BODS_KEY" | npx wrangler secret put BODS_KEY
          body="$(mktemp)"; trap 'rm -f "$body"' EXIT
          for attempt in $(seq 1 8); do
            if curl --fail --location --silent --show-error --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' \
              "https://kerbside-bus.adambullas.workers.dev/health?release=${GITHUB_RUN_ID}-${attempt}" -o "$body" \
              && jq -e '.ok == true and .version == "0.8.3" and .bods == true' "$body" >/dev/null; then
              echo 'Production bus Worker is serving 0.8.3.'; exit 0
            fi
            sleep 5
          done
          cat "$body" || true; exit 1

      - name: Verify deployed GitHub Pages build
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT; ready=false
          for attempt in $(seq 1 36); do
            token="release=${GITHUB_RUN_ID}-${attempt}"
            if curl --fail --location --silent --show-error --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' \
              "https://zetabun.github.io/idle-clicker-game/VERSION?$token" -o "$tmp/version" && grep -Fxq '0.8.3' "$tmp/version"; then
              ready=true; break
            fi
            sleep 5
          done
          if [[ "$ready" != true ]]; then echo '::error::GitHub Pages did not serve Kerbside 0.8.3 in time.'; cat "$tmp/version" 2>/dev/null || true; exit 1; fi
          curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' \
            "https://zetabun.github.io/idle-clicker-game/bus.html?release=${GITHUB_RUN_ID}" -o "$tmp/app.html"
          grep -Fq "const APP_VERSION = '0.8.3';" "$tmp/app.html"
          echo 'GitHub Pages is serving Kerbside 0.8.3.'
