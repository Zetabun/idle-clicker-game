name: Release Build 12.222

on:
  push:
    paths:
      - '.github/triggers/release-12.222.txt'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply release patch
        run: python .github/scripts/release-12.222.py

      - name: Build first copy
        working-directory: strikewatch-source
        run: |
          python build.py
          cp js/strikewatch.dev.js /tmp/strikewatch.dev.first.js
          cp dist/strikewatch-build-12.222.html /tmp/strikewatch-build-12.222.first.html

      - name: Build second copy and verify determinism
        working-directory: strikewatch-source
        run: |
          python build.py
          cmp /tmp/strikewatch.dev.first.js js/strikewatch.dev.js
          cmp /tmp/strikewatch-build-12.222.first.html dist/strikewatch-build-12.222.html

      - name: Parse modular and generated JavaScript
        run: |
          for file in strikewatch-source/js/*.js; do node --check "$file"; done

      - name: Parse standalone inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('strikewatch-source/dist/strikewatch-build-12.222.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S)
          if not scripts:
              raise SystemExit('No inline scripts found')
          for index, script in enumerate(scripts):
              Path(f'/tmp/standalone-{index}.js').write_text(script, encoding='utf-8')
          print(len(scripts))
          PY
          for file in /tmp/standalone-*.js; do node --check "$file"; done

      - name: Targeted League route checks
        run: |
          grep -F "{ id: 'fixtures', label: 'FIXTURES'" strikewatch-source/js/50-ui-menus.js
          grep -F "case 'fixtures':" strikewatch-source/js/50-ui-menus.js
          grep -F "function renderLeagueFixturesTab()" strikewatch-source/js/37-league.js
          grep -F "renderLeagueFixtures()" strikewatch-source/js/37-league.js
          grep -F "@media (min-width: 1024px)" strikewatch-source/css/compact-navigation.css
          grep -F "@media(max-width:760px)" strikewatch-source/css/compact-navigation.css
          python - <<'PY'
          from pathlib import Path
          text = Path('strikewatch-source/js/37-league.js').read_text(encoding='utf-8')
          fixtures = text.split('function renderLeagueFixturesTab()', 1)[1].split('function renderLeagueTab()', 1)[0]
          overview = text.split('function renderLeagueTab()', 1)[1].split('function handleLeagueClick', 1)[0]
          assert '${renderLeagueFixtures()}' in fixtures
          assert '${renderLeagueFixtures()}' not in overview
          assert '#leagueFixtures' not in overview
          PY

      - name: Publish standalone to root
        run: |
          cp strikewatch-source/dist/strikewatch-build-12.222.html cod.html
          cmp strikewatch-source/dist/strikewatch-build-12.222.html cod.html

      - name: Remove temporary release files
        run: |
          rm .github/scripts/release-12.222.py
          rm .github/workflows/release-12.222.yml
          rm .github/triggers/release-12.222.txt

      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build 12.222: League Fixtures Submenu"
          git push origin main
