name: Strikewatch Release 12.177

on:
  page_build:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strikewatch-release-12-177
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Build, verify and publish 12.177
        shell: bash
        run: |
          set -euo pipefail

          marker='.github/release-triggers/12.177.txt'
          patch='.github/scripts/release-12-177.py'
          workflow='.github/workflows/release-12-177.yml'

          if [ ! -f "$marker" ]; then
            echo '12.177 trigger marker is absent; nothing to release.'
            exit 0
          fi
          test -f "$patch"

          python3 "$patch"
          cd strikewatch-source

          python3 -m py_compile build.py
          python3 build.py

          first_dir="$(mktemp -d)"
          cp js/strikewatch.dev.js "$first_dir/strikewatch.dev.js"
          cp dist/strikewatch-build-12.177.html "$first_dir/strikewatch-build-12.177.html"
          cp dist/strikewatch-build-12.177-size.json "$first_dir/strikewatch-build-12.177-size.json"
          cp dist/strikewatch-build-12.177-css-debt.json "$first_dir/strikewatch-build-12.177-css-debt.json"

          python3 build.py
          cmp js/strikewatch.dev.js "$first_dir/strikewatch.dev.js"
          cmp dist/strikewatch-build-12.177.html "$first_dir/strikewatch-build-12.177.html"
          cmp dist/strikewatch-build-12.177-size.json "$first_dir/strikewatch-build-12.177-size.json"
          cmp dist/strikewatch-build-12.177-css-debt.json "$first_dir/strikewatch-build-12.177-css-debt.json"

          for file in js/*.js; do
            node --check "$file"
          done

          python3 - <<'PY'
          from pathlib import Path
          import importlib.util
          import json
          import re

          root = Path('.')
          game = (root / 'css/game.css').read_text(encoding='utf-8')
          owned = (root / 'css/management-grid.css').read_text(encoding='utf-8')
          assert 'Build 12.135 - Container collapse, league table and agenda layer' not in game
          assert '/* --- Collapsed panels' not in game
          assert owned.count('/* --- Collapsed panels') == 1
          assert owned.count('#menuContent {') == 1
          assert owned.count('grid-auto-rows: max-content;') == 1
          assert owned.count('align-content: start;') == 1

          combined_css = '\n'.join(path.read_text(encoding='utf-8') for path in (root / 'css').glob('*.css'))
          assert '#menuContent > * { min-height: max-content; }' not in combined_css

          spec = importlib.util.spec_from_file_location('strikewatch_build', root / 'build.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          expected = [
              'game.css',
              'management-grid.css',
              'league-table.css',
              'calendar-agenda.css',
              'training-readability.css',
              'training-programme.css',
              'management-feedback.css',
              'compact-readability.css',
              'reward-reveal.css',
              'armour-viewer.css',
              'weapon-presentation.css',
              'loadout-stills.css',
              '12.161-audit-fixes.css',
              'armoury-inventory.css',
              'compact-navigation.css',
          ]
          assert [path.name for path in module.CSS_PATHS] == expected
          html = (root / 'index.html').read_text(encoding='utf-8')
          hrefs = re.findall(r'<link rel="stylesheet" href="css/([^?]+)\?v=[^"]+"\s*/>', html)
          assert hrefs == expected

          report = json.loads((root / 'dist/strikewatch-build-12.177-css-debt.json').read_text(encoding='utf-8'))
          assert report['version'] == '12.177'
          assert report['stylesheets'] == 15
          assert report['stylesheet_order'] == expected
          assert report['owned_management_grid_lines'] > 0
          assert report['game_css_lines'] <= 31185
          assert report['important_declarations'] <= 2182
          assert report['media_queries'] <= 474
          assert report['within_budget'] is True

          size = json.loads((root / 'dist/strikewatch-build-12.177-size.json').read_text(encoding='utf-8'))
          assert size['version'] == '12.177'
          assert size['javascript_raw_reduction_percent'] >= 2.5

          release = json.loads((root / 'RELEASE.json').read_text(encoding='utf-8'))
          assert release == {
              'version': '12.177',
              'name': 'Management Grid CSS Ownership',
              'build_id': '12.177.0-management-grid-css-ownership',
          }

          standalone = (root / 'dist/strikewatch-build-12.177.html').read_text(encoding='utf-8')
          assert not re.search(r'<link rel="stylesheet" href="css/', standalone)
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', standalone, re.S)
          assert scripts
          Path('/tmp/strikewatch-12.177-inline.js').write_text('\n'.join(scripts), encoding='utf-8')

          bundle = (root / 'js/strikewatch.dev.js').read_text(encoding='utf-8')
          for token in (
              'mobileInterfaceAuditForTest',
              'renderRouteForTest',
              'typographyConsistencyForTest',
              'collapsed',
              'overlapping',
          ):
              assert token in bundle, token

          assert (root / 'AUDIT-12.177.md').exists()
          assert '12.177 — Management Grid CSS Ownership' in (root / 'HANDOFF.md').read_text(encoding='utf-8')
          assert '12.177 — Management Grid CSS Ownership' in (root / 'CHANGELOG.md').read_text(encoding='utf-8')
          assert '`css/management-grid.css`' in (root / 'ARCHITECTURE.md').read_text(encoding='utf-8')
          PY

          node --check /tmp/strikewatch-12.177-inline.js

          cd ..
          cp strikewatch-source/dist/strikewatch-build-12.177.html cod.html
          cmp cod.html strikewatch-source/dist/strikewatch-build-12.177.html

          find strikewatch-source -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f "$patch" "$workflow" "$marker"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- strikewatch-source cod.html .github
          git diff --cached --check
          git commit -m 'Build 12.177: establish management grid CSS ownership'
          git push origin HEAD:main
