name: Strikewatch 12.168 release

on:
  workflow_dispatch:
  page_build:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  issues: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'page_build' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run verified release
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/release-12-168.log) 2>&1
          report_failure() {
            status=$?
            if [ "$status" -ne 0 ]; then
              tail -c 50000 /tmp/release-12-168.log > /tmp/release-12-168-tail.log || true
              {
                echo 'The automated 12.168 release failed. Captured log:'
                echo
                echo '```text'
                cat /tmp/release-12-168-tail.log
                echo '```'
              } > /tmp/release-12-168-issue.md
              gh issue create --title 'STRIKEWATCH 12.168 RELEASE FAILURE' --body-file /tmp/release-12-168-issue.md || true
            fi
            exit "$status"
          }
          trap report_failure EXIT

          python3 .github/scripts/release-12-168.py
          cd strikewatch-source
          python3 -m py_compile build.py
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.168.html dist/strikewatch-build-12.168-size.json dist/strikewatch-build-12.168-css-debt.json > /tmp/build-a.sha
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.168.html dist/strikewatch-build-12.168-size.json dist/strikewatch-build-12.168-css-debt.json > /tmp/build-b.sha
          diff -u /tmp/build-a.sha /tmp/build-b.sha

          for file in js/[0-9][0-9]-*.js js/strikewatch.dev.js; do
            node --check "$file"
          done

          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')
          html = (root / 'dist/strikewatch-build-12.168.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          if not scripts:
              raise SystemExit('No inline standalone JavaScript found')
          Path('/tmp/strikewatch-12.168-inline.js').write_text('\n'.join(scripts), encoding='utf-8')

          game = (root / 'css/game.css').read_text(encoding='utf-8')
          weapon = (root / 'css/weapon-presentation.css').read_text(encoding='utf-8')
          marker = 'Build 12.147: weapon form and grip texture'
          if marker in game:
              raise SystemExit('Weapon presentation layer still exists in game.css')
          if weapon.count(marker) != 1:
              raise SystemExit('Weapon presentation ownership marker missing or duplicated')

          required = [
              '.career-weapon-rig .career-weapon-cuboid .front',
              '.career-weapon-rig .career-weapon-cuboid .bottom',
              '.career-weapon-rig .career-weapon-cylinder .side:nth-child(3n + 1)',
              '.career-weapon-cuboid.rubber .face',
          ]
          missing = [selector for selector in required if selector not in weapon]
          if missing:
              raise SystemExit(f'Weapon presentation selectors missing: {missing}')

          if '<link rel="stylesheet" href="css/' in html:
              raise SystemExit('Standalone retained a development stylesheet link')

          report = json.loads((root / 'dist/strikewatch-build-12.168-css-debt.json').read_text(encoding='utf-8'))
          expected_order = [
              'game.css',
              'weapon-presentation.css',
              'loadout-stills.css',
              '12.161-audit-fixes.css',
              'armoury-inventory.css',
              'compact-navigation.css',
          ]
          if report.get('stylesheet_order') != expected_order:
              raise SystemExit(f'Unexpected stylesheet order: {report}')
          if report.get('stylesheets') != 6:
              raise SystemExit(f'Unexpected stylesheet count: {report}')
          if report.get('owned_weapon_presentation_lines', 0) < 35:
              raise SystemExit(f'Weapon presentation layer unexpectedly small: {report}')
          if report.get('game_css_lines', 999999) > 31460:
              raise SystemExit(f'game.css remains above budget: {report}')
          if not report.get('within_budget'):
              raise SystemExit(f'CSS debt budget failed: {report}')

          architecture = (root / 'ARCHITECTURE.md').read_text(encoding='utf-8')
          handoff = (root / 'HANDOFF.md').read_text(encoding='utf-8')
          agents = (root / 'AGENTS.md').read_text(encoding='utf-8')
          audit = (root / 'AUDIT-12.168.md').read_text(encoding='utf-8')
          changelog = (root / 'CHANGELOG.md').read_text(encoding='utf-8')
          for name, text, needle in [
              ('ARCHITECTURE.md', architecture, 'css/weapon-presentation.css'),
              ('HANDOFF.md', handoff, '12.168 — Weapon Presentation CSS Ownership'),
              ('AGENTS.md', agents, 'Build 12.168 owns CSS-3D weapon'),
              ('AUDIT-12.168.md', audit, '# Build 12.168 — Weapon Presentation CSS Ownership'),
              ('CHANGELOG.md', changelog, '## 12.168 — Weapon Presentation CSS Ownership'),
          ]:
              if needle not in text:
                  raise SystemExit(f'{name} missing release documentation marker')

          print(json.dumps(report, indent=2))
          PY
          node --check /tmp/strikewatch-12.168-inline.js

          cp dist/strikewatch-build-12.168.html ../cod.html
          cmp -s ../cod.html dist/strikewatch-build-12.168.html
          cd ..

          rm -f .github/scripts/release-12-168.py .github/workflows/release-12-168.yml .github/release-triggers/12.168.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- strikewatch-source cod.html .github
          git commit -m 'Build 12.168: establish weapon presentation CSS ownership'
          git push origin main
