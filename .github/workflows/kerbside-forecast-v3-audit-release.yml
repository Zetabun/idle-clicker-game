      - name: Publish Kerbside 0.7.40
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/kerbside-forecast-v3-audit-release.yml
          git add bus.html VERSION kerbside-trains.js kerbside-train-forecast-v3.js kerbside-train-events.js kerbside-backend/tests/train-forecast-v3-dual-timetable.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Kerbside 0.7.40: align crowding forecast layers'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo 'Failed to publish after three rebased attempts.' >&2
          exit 1
