name: Kerbside Forecast v3 Audit Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kerbside-forecast-v3-audit-release.yml

permissions:
  contents: write

concurrency:
  group: kerbside-forecast-v3-audit-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Apply Forecast v3 audit fixes
        shell: bash
        run: |
          set -euo pipefail
          # Harden ambiguous source markers before applying the release patch.
          python3 .github/scripts/fix-forecast-release-helper.py
          python3 .github/scripts/kerbside-forecast-v3-audit-release.py

      - name: Validate build and prediction wiring
        shell: bash
        run: |
          set -euo pipefail
          node --check kerbside-trains.js
          node --check kerbside-train-forecast-v3.js
          node --check kerbside-train-events.js
          node --check kerbside-train-timetable.js
          node --check kerbside-rail-calibration.js
          node --check kerbside-backend/tests/train-regression.mjs
          node --test kerbside-backend/tests/train-forecast-v3-dual-timetable.mjs
          node --test kerbside-backend/test/train-timetable-provider.test.js
          node --test kerbside-backend/tests/train-live-window-regression.mjs
          node --test kerbside-backend/tests/train-journey-planner-regression.mjs
          git diff --check
          grep -Fx '0.7.40' VERSION
          grep -F "modelLayer:'v3-baseline'" kerbside-train-forecast-v3.js
          grep -F 'service.destinationArrival||service.arrival||service.sta||service.eta' kerbside-train-events.js

      - name: Publish Kerbside 0.7.40
        shell: bash
        run: |
          set -euo pipefail
          git add bus.html VERSION kerbside-trains.js kerbside-train-forecast-v3.js kerbside-train-events.js kerbside-backend/tests/train-regression.mjs kerbside-backend/tests/train-forecast-v3-dual-timetable.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Kerbside 0.7.40: align crowding forecast layers'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo 'Failed to publish after three rebased attempts.' >&2
          exit 1
