name: Fix Kerbside 0.9.29 Saved Journeys version assertions

on:
  push:
    branches:
      - agent/kerbside-0.9.29-train-ui-recovery
    paths:
      - .github/workflows/kerbside-0.9.29-polish-version-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/kerbside-0.9.29-train-ui-recovery
          fetch-depth: 0
      - name: Update polish release marker and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          polish = Path('kerbside-saved-journeys-polish.js')
          text = polish.read_text(encoding='utf-8')
          old = "const VERSION='0.9.28';"
          if old not in text:
              raise SystemExit('expected 0.9.28 polish marker was not found')
          polish.write_text(text.replace(old, "const VERSION='0.9.29';", 1), encoding='utf-8')

          test = Path('kerbside-backend/tests/train-saved-journeys-polish-regression.mjs')
          text = test.read_text(encoding='utf-8')
          old_block = """assert.equal(api.version,'0.9.28');
          assert.equal(api.schema,3);
          assert.equal(version,'0.9.28');
          assert.match(loader,/kerbside-journey-planner-core\\.js\\?v=0\\.9\\.28/);
          assert.match(loader,/kerbside-saved-journeys-polish\\.js\\?v=0\\.9\\.28/);
          assert.match(loader,/kerbside-rail-health\\.js\\?v=0\\.9\\.28/);"""
          new_block = """assert.equal(api.version,version);
          assert.equal(api.schema,3);
          assert.match(version,/^\\d+\\.\\d+\\.\\d+$/);
          const escapedVersion=version.replace(/\\./g,'\\\\.');
          assert.match(loader,new RegExp(`kerbside-journey-planner-core\\\\.js\\\\?v=${escapedVersion}`));
          assert.match(loader,new RegExp(`kerbside-saved-journeys-polish\\\\.js\\\\?v=${escapedVersion}`));
          assert.match(loader,new RegExp(`kerbside-rail-health\\\\.js\\\\?v=${escapedVersion}`));"""
          if old_block not in text:
              raise SystemExit('expected hard-coded Saved Journeys version block was not found')
          test.write_text(text.replace(old_block, new_block, 1), encoding='utf-8')
          PY
          node --check kerbside-saved-journeys-polish.js
          node --check kerbside-backend/tests/train-saved-journeys-polish-regression.mjs
          node kerbside-backend/tests/train-saved-journeys-polish-regression.mjs
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kerbside-saved-journeys-polish.js kerbside-backend/tests/train-saved-journeys-polish-regression.mjs
          git commit -m 'Align Saved Journeys with Kerbside 0.9.29'
          git push origin HEAD:agent/kerbside-0.9.29-train-ui-recovery
