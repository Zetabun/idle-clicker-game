name: Deploy Kerbside Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - kerbside-backend/src/**
      - kerbside-backend/wrangler.toml
      - kerbside-backend/package.json
      - .github/workflows/deploy-kerbside-worker.yml

permissions:
  contents: read

concurrency:
  group: kerbside-worker-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kerbside-backend

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BODS_KEY: ${{ secrets.BODS_KEY }}
      MATCHED_SMOKE_URL: https://kerbside-bus.adambullas.workers.dev/matched

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: kerbside-backend/package.json

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN BODS_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required secret $name is missing or empty."
              exit 1
            fi
          done

      - name: Install Wrangler and validate live Worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm test

      - name: Deploy live-only Worker and configure BODS secret
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy
          printf '%s' "$BODS_KEY" | npx wrangler secret put BODS_KEY
          npx wrangler deployments list

      - name: Verify matched GTFS-RT production endpoint
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          healthy=false
          for attempt in $(seq 1 6); do
            cache_buster="smoke=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            if curl --fail --location --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              -H 'Cache-Control: no-cache' \
              "$MATCHED_SMOKE_URL?bbox=-2.15000,52.45000,-2.05000,52.55000&$cache_buster" -o "$body"; then
              if jq -e '.vehicles | type == "array"' "$body" >/dev/null; then
                healthy=true
                echo "Production Worker returned a valid matched GTFS-RT vehicle array."
                break
              fi
            fi
            echo "Matched GTFS-RT smoke attempt $attempt failed; retrying."
            sleep 5
          done
          if [[ "$healthy" != true ]]; then
            echo "::error::Production /matched endpoint did not return a valid vehicle array after deployment."
            cat "$body" || true
            exit 1
          fi
