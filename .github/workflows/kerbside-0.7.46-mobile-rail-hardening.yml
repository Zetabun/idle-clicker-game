name: Kerbside 0.7.46 mobile rail hardening

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kerbside-0.7.46-mobile-rail-hardening.yml

permissions:
  contents: write

concurrency:
  group: kerbside-0.7.46-mobile-rail-hardening
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Apply 0.7.46 mobile rail hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-kerbside-0.7.46.py
          python3 .github/scripts/sync-version.py

      - name: Install browser regression dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          npm run vendor:leaflet --prefix kerbside-backend
          cd kerbside-backend
          npx playwright install --with-deps webkit chromium

      - name: Validate code and deterministic regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sync-version.py --check
          node --check kerbside-train-timetable.js
          node --check kerbside-status.js
          node --check kerbside-backend/tests/train-mobile-layout-regression.mjs
          node --test kerbside-backend/test/train-timetable-provider.test.js
          node --test kerbside-backend/test/train-route-swap.test.mjs
          node --test kerbside-backend/test/train-forecast-layout.test.mjs
          node --test kerbside-backend/tests/train-forecast-v3-dual-timetable.mjs
          git diff --check
          grep -Fx '0.7.46' VERSION
          grep -F 'grid-template-columns:82px minmax(0,1fr) 18px' kerbside-trains.css
          grep -F 'tests/train-mobile-layout-regression.mjs' kerbside-backend/package.json

      - name: Run WebKit mobile rail layout regression
        shell: bash
        run: |
          set -euo pipefail
          node kerbside-backend/tests/train-mobile-layout-regression.mjs

      - name: Run Chromium mobile rail layout regression
        shell: bash
        env:
          KERBSIDE_BROWSER: chromium
        run: |
          set -euo pipefail
          node kerbside-backend/tests/train-mobile-layout-regression.mjs

      - name: Re-run route regression bundle in WebKit
        shell: bash
        run: |
          set -euo pipefail
          npm run test:train-route --prefix kerbside-backend

      - name: Re-run route regression bundle in Chromium
        shell: bash
        env:
          KERBSIDE_BROWSER: chromium
        run: |
          set -euo pipefail
          npm run test:train-route --prefix kerbside-backend

      - name: Publish Kerbside 0.7.46
        shell: bash
        run: |
          set -euo pipefail
          git add VERSION bus.html kerbside-status.js kerbside-trains.css \
            kerbside-backend/package.json \
            kerbside-backend/src/worker.js \
            kerbside-backend/test/worker.test.js \
            kerbside-backend/tests/browser-regression.mjs \
            kerbside-backend/tests/train-mobile-layout-regression.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Kerbside 0.7.46: harden mobile train layout'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo 'Failed to publish after three rebased attempts.' >&2
          exit 1
