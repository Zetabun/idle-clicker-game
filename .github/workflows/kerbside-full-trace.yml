name: Kerbside full system trace

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kerbside-full-trace.yml

permissions:
  contents: read

concurrency:
  group: kerbside-full-system-trace
  cancel-in-progress: false

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out current main
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install trace dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          npm install --prefix kerbside-rail-worker --no-audit --no-fund --package-lock=false
          npm run vendor:leaflet --prefix kerbside-backend
          cd kerbside-backend
          npx playwright install --with-deps webkit chromium

      - name: Trace source, version and deterministic engines
        shell: bash
        run: |
          set -euo pipefail
          echo '=== VERSION ==='
          cat VERSION
          python3 .github/scripts/sync-version.py --check

          echo '=== BROWSER / RAIL MODULE SYNTAX ==='
          node --check kerbside-trains.js
          node --check kerbside-train-routes.js
          node --check kerbside-train-date.js
          node --check kerbside-journey-planner-ui.js
          node --check kerbside-train-live-window.js
          node --check kerbside-train-live-overlay.js
          node --check kerbside-rail-calibration.js
          node --check kerbside-train-events.js
          node --check kerbside-train-forecast-v3.js
          node --check kerbside-train-timetable.js
          node --check kerbside-status.js

          echo '=== BACKEND STATIC CHECK ==='
          npm run check --prefix kerbside-backend

          echo '=== BACKEND UNIT TESTS ==='
          npm test --prefix kerbside-backend

          echo '=== FORECAST V3 SIGNAL TRACE ==='
          node --test kerbside-backend/tests/train-forecast-v3-dual-timetable.mjs

          echo '=== TIMETABLE / CONNECTION TRACE ==='
          node --test kerbside-backend/test/train-timetable-provider.test.js

          echo '=== OFFICIAL RAIL WORKER ==='
          npm run check --prefix kerbside-rail-worker
          npm test --prefix kerbside-rail-worker

          git diff --check

      - name: Trace full WebKit system flow
        shell: bash
        env:
          KERBSIDE_BROWSER: webkit
        run: |
          set -euo pipefail
          npm run test:full --prefix kerbside-backend

      - name: Trace full Chromium system flow
        shell: bash
        env:
          KERBSIDE_BROWSER: chromium
        run: |
          set -euo pipefail
          npm run test:full --prefix kerbside-backend

      - name: Trace production data and providers
        shell: bash
        env:
          APP_URL: https://zetabun.github.io/idle-clicker-game/bus.html
          BUS_WORKER: https://kerbside-bus.adambullas.workers.dev
          RAIL_WORKER: https://kerbside-rail.adambullas.workers.dev
          BUS_DATA: https://kerbside-data-zetabun.pages.dev
          RAIL_DATA: https://zetabun.github.io/idle-clicker-game/kerbside-rail-timetable
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          token="trace=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          today="$(TZ=Europe/London date +%F)"
          today_compact="${today//-/}"
          version="$(cat VERSION | tr -d '\r\n')"

          echo "=== PRODUCTION APP ==="
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache' "$APP_URL?$token" -o "$tmp/app.html"
          grep -Fq "const APP_VERSION = '$version';" "$tmp/app.html"
          grep -Fq "kerbside-train-forecast-v3.js?v=$version" "$tmp/app.html"
          grep -Fq "kerbside-train-timetable.js?v=$version" "$tmp/app.html"
          echo "App version/cache wiring: $version"

          echo "=== BUS WORKER HEALTH ==="
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache' "$BUS_WORKER/health?$token" -o "$tmp/bus-health.json"
          jq -e --arg v "$version" '.ok == true and .version == $v and .bods == true' "$tmp/bus-health.json" >/dev/null
          jq -c '{ok,service,role,version,bods,matchedGtfsRt,upstreamTimeoutMs,upstreamAttempts}' "$tmp/bus-health.json"

          echo "=== BUS LIVE SIRI FEED ==="
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache' "$BUS_WORKER/feed?bbox=-2.15000,52.45000,-2.05000,52.55000&$token" -o "$tmp/feed.xml"
          python3 - "$tmp/feed.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          local=lambda tag: tag.rsplit('}',1)[-1]
          names=[local(n.tag) for n in root.iter()]
          if local(root.tag)!='Siri' or 'VehicleMonitoringDelivery' not in names:
              raise SystemExit('Bus Worker feed is not valid SIRI-VM')
          print('Bus Worker returned valid SIRI-VM XML.')
          PY

          echo "=== OFFICIAL RAIL WORKER HEALTH ==="
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 10 --max-time 30 \
            -H 'Origin: https://zetabun.github.io' -H 'Cache-Control: no-cache' \
            "$RAIL_WORKER/health?$token" -o "$tmp/rail-health.json"
          jq -e '.ok == true and .service == "kerbside-rail" and .ldbConfigured == true' "$tmp/rail-health.json" >/dev/null
          jq -c '{ok,service,source,ldbConfigured,upstreamTimeoutMs,cacheSeconds,rateLimitPerMinute}' "$tmp/rail-health.json"

          echo "=== OFFICIAL LIVE DARWIN BOARD ==="
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 10 --max-time 30 \
            -H 'Origin: https://zetabun.github.io' -H 'Cache-Control: no-cache' \
            "$RAIL_WORKER/departures/BHM/9?expand=true&$token" -D "$tmp/rail.headers" -o "$tmp/rail.json"
          jq -e '.crs == "BHM" and (has("trainServices")) and (.trainServices == null or (.trainServices|type)=="array")' "$tmp/rail.json" >/dev/null
          jq -c '{crs,locationName,generatedAt,services:(.trainServices // [] | length),messages:(.nrccMessages // [] | length)}' "$tmp/rail.json"
          grep -Ei '^(x-kerbside-rail-source|x-kerbside-cache|x-kerbside-upstream):' "$tmp/rail.headers" || true

          echo "=== DARWIN TIMETABLE MANIFEST ==="
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache' "$RAIL_DATA/manifest.json?$token" -o "$tmp/rail-manifest.json"
          jq -e --arg d "$today" --arg compact "$today_compact" '
            .source == "National Rail Darwin Timetable Files" and
            ((.dates | index($d)) != null) and
            (.coverage[$d] != null) and
            ((.journeyCounts[$d] // 0) > 1000) and
            (.timetableId | tostring | startswith($compact))
          ' "$tmp/rail-manifest.json" >/dev/null
          jq -c --arg d "$today" '{timetableId,dates,journeys,todayCoverage:.coverage[$d],todayJourneys:.journeyCounts[$d]}' "$tmp/rail-manifest.json"

          echo "=== DARWIN LOCATIONS + DAY SHARD ==="
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache' "$RAIL_DATA/locations.json?$token" -o "$tmp/locations.json"
          jq -e 'has("BHM") and has("BRI") and has("CNM") and has("GLO")' "$tmp/locations.json" >/dev/null
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache' "$RAIL_DATA/$today.json.gz?$token" -o "$tmp/day.json.gz"
          gzip -t "$tmp/day.json.gz"
          day_rows="$(gzip -dc "$tmp/day.json.gz" | jq 'length')"
          test "$day_rows" -gt 1000
          echo "Darwin $today journey rows: $day_rows"

          echo "=== NATIONAL STATIC BUS DATA ==="
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache' "$BUS_DATA/manifest.json?$token" -o "$tmp/data-manifest.json"
          jq -e 'type == "object" and length > 0' "$tmp/data-manifest.json" >/dev/null
          jq -c '{version,scope,built,generatedAt,regions:(.regions|if type=="array" then length elif type=="object" then length else null end),stops,totalStops,departures,totalDepartures}' "$tmp/data-manifest.json"

          echo "=== DISRUPTIONS ==="
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache' "https://zetabun.github.io/idle-clicker-game/disruptions.json?$token" -o "$tmp/disruptions.json"
          jq -e '.scope == "kerbside-disruptions" and (.count // 0) > 0 and (.situations|type)=="array"' "$tmp/disruptions.json" >/dev/null
          python3 - "$tmp/disruptions.json" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          value=json.load(open(sys.argv[1],encoding='utf-8'))
          built=datetime.fromisoformat(value['built'].replace('Z','+00:00'))
          age=(datetime.now(timezone.utc)-built).total_seconds()/3600
          if age>24: raise SystemExit(f'Disruptions are stale: {age:.1f}h')
          print(f"Disruptions: {value['count']} active/retained situations; built {age:.2f}h ago.")
          PY

          echo "=== NAPTAN ==="
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache' "https://zetabun.github.io/idle-clicker-game/naptan/index.json?$token" -o "$tmp/naptan.json"
          jq -e '.scope == "kerbside-naptan-index" and (.count // 0) > 300000 and (.areas|type)=="object"' "$tmp/naptan.json" >/dev/null
          jq -c '{built,count,prefixLength,areaCount:(.areas|length)}' "$tmp/naptan.json"

          echo '=== PRODUCTION TRACE COMPLETE ==='
