name: Apply Kerbside stop info cleanup

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-kerbside-stop-info-cleanup.yml

permissions:
  contents: write

concurrency:
  group: kerbside-stop-info-cleanup
  cancel-in-progress: false

jobs:
  validate-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact main revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Record guarded base
        shell: bash
        run: echo "GUARDED_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Apply stop information cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          import tempfile
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: {label}: expected one replacement target, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          bus_path = 'bus.html'
          test_path = 'kerbside-backend/tests/browser-regression.mjs'

          old_meta = """function updateStopMeta(){
            if(!S.stop) return;
            const s=S.stop, displayCode=s.atco||s.naptan||s.code||'';
            let tt=' · checking timetable';
            if(S.ttStop) tt=S.timetableSource==='national'?(S.timetableFallback?' · last-known timetable'+(timetableBuildLabel()?' · built '+timetableBuildLabel():''):' · official timetable stop'):S.ttStop.match==='code'?' · regional timetable stop':' · nearby timetable match';
            else if(S.ttError) tt=' · timetable unavailable'; else if(S.timetable) tt=' · live only';
            /* How far away the stop is belongs in the heading; the stop's reference code
               and which timetable matched it are provenance, and were crowding the one
               line that has to be readable at a glance. Those live in the info panel. */
            $('stopMeta').innerHTML='<b>'+fmtDist(s.d)+'</b> from your point';
            const source=$('stopSource');
            if(source) source.innerHTML=(displayCode?'Stop reference <b>'+esc(displayCode)+'</b>':'No stop reference published')+tt;
          }
          """
          new_meta = """function updateStopMeta(){
            if(!S.stop) return;
            const s=S.stop, displayCode=s.atco||s.naptan||s.code||'';
            const indicator=String(s.ind||S.ttStop&&S.ttStop.ind||'').trim();
            let tt=' · checking timetable';
            if(S.ttStop) tt=S.timetableSource==='national'?(S.timetableFallback?' · last-known timetable'+(timetableBuildLabel()?' · built '+timetableBuildLabel():''):' · official timetable stop'):S.ttStop.match==='code'?' · regional timetable stop':' · nearby timetable match';
            else if(S.ttError) tt=' · timetable unavailable'; else if(S.timetable) tt=' · live only';
            /* How far away the stop is belongs in the heading; the stop indicator,
               reference code and timetable match are provenance. Keep those behind the
               info button so the selected stop stays readable at a glance. */
            $('stopMeta').innerHTML='<b>'+fmtDist(s.d)+'</b> from your point';
            const source=$('stopSource');
            if(source){
              const details=[];
              if(indicator) details.push('Stop <b>'+esc(indicator)+'</b>');
              details.push(displayCode?'Stop reference <b>'+esc(displayCode)+'</b>':'No stop reference published');
              source.innerHTML=details.join(' · ')+tt;
            }
          }
          """
          replace_once(bus_path, old_meta, new_meta, 'move stop identity into info panel')

          replace_once(
              bus_path,
              "S.ttStop=matchTimetableStop(s); $('stopName').textContent=s.name+(s.ind?' ('+s.ind+')':''); updateStopMeta();",
              "S.ttStop=matchTimetableStop(s); $('stopName').textContent=s.name; updateStopMeta();",
              'remove indicator from selected stop heading',
          )

          old_facts = """function stopFactsHtml(stop){
            const record=stopAttributes(stop)||{};
            const indicator=String(stop&&stop.ind||S.ttStop&&S.ttStop.ind||'').trim();
            const atco=naptanCodesFor(stop)[0]||'';
            if(!Object.keys(record).length&&!indicator&&!atco) return '';
            const street=String(record.s||'').trim();
            /* A compass bearing is the raw NaPTAN fact, not the useful one: \"south-west\"
               asks somebody to know which way south-west is. Where the timetable says
               where these buses go, name that instead and keep the bearing only as the
               fallback for a stop with no known destinations. */
            const {names}=stopDestinationNames();
            const heading=names.slice(0,2).map(n=>'<b>'+esc(n)+'</b>').join(' or ');
            const facing=bearingWords(record.b);
            const parts=[];
            if(street&&heading) parts.push('On <b>'+esc(street)+'</b>, buses here head for '+heading+'.');
            else if(heading) parts.push('Buses here head for '+heading+'.');
            else if(street&&facing) parts.push('On <b>'+esc(street)+'</b>, buses face <b>'+esc(facing)+'</b>.');
            else if(street) parts.push('On <b>'+esc(street)+'</b>.');
            else if(facing) parts.push('Buses here face <b>'+esc(facing)+'</b>.');
            const type=NAPTAN_STOP_TYPES[String(record.t||'').trim().toUpperCase()];
            if(type) parts.push('<span class=\"stopflag\">'+esc(type.label)+'</span> <span class=\"stopflag-note\">'+esc(type.note)+'</span>');
            if(indicator||atco){
              const label=indicator?'Stop '+indicator:'Exact stop';
              parts.push('<span class=\"stopflag\">'+esc(label)+'</span>'+(atco?' <span class=\"stopflag-note\">ATCO '+esc(atco)+'</span>':''));
            }
            return parts.join(' ');
          }
          """
          new_facts = """function stopFactsHtml(stop){
            const record=stopAttributes(stop)||{};
            if(!Object.keys(record).length) return '';
            const street=String(record.s||'').trim();
            /* A compass bearing is the raw NaPTAN fact, not the useful one: \"south-west\"
               asks somebody to know which way south-west is. Where the timetable says
               where these buses go, name that instead and keep the bearing only as the
               fallback for a stop with no known destinations. Stop identity provenance
               is deliberately kept in the info panel instead of duplicated here. */
            const {names}=stopDestinationNames();
            const heading=names.slice(0,2).map(n=>'<b>'+esc(n)+'</b>').join(' or ');
            const facing=bearingWords(record.b);
            const parts=[];
            if(street&&heading) parts.push('On <b>'+esc(street)+'</b>, buses here head for '+heading+'.');
            else if(heading) parts.push('Buses here head for '+heading+'.');
            else if(street&&facing) parts.push('On <b>'+esc(street)+'</b>, buses face <b>'+esc(facing)+'</b>.');
            else if(street) parts.push('On <b>'+esc(street)+'</b>.');
            else if(facing) parts.push('Buses here face <b>'+esc(facing)+'</b>.');
            const type=NAPTAN_STOP_TYPES[String(record.t||'').trim().toUpperCase()];
            if(type) parts.push('<span class=\"stopflag\">'+esc(type.label)+'</span> <span class=\"stopflag-note\">'+esc(type.note)+'</span>');
            return parts.join(' ');
          }
          """
          replace_once(bus_path, old_facts, new_facts, 'remove duplicated stop/ATCO facts')

          old_static = r"""// A stop with no published attributes leaves the line hidden rather than empty.
          assert.match(busSource, /function stopFactsHtml\(stop\)/);
          assert.match(busSource, /el\.hidden=!html;/);
          """
          new_static = r"""// Stop identity provenance belongs behind the info button rather than being
          // duplicated in the heading or passenger-facing facts line.
          assert.match(busSource, /function stopFactsHtml\(stop\)/);
          assert.ok(busSource.includes("$('stopName').textContent=s.name; updateStopMeta();"));
          assert.ok(busSource.includes("if(indicator) details.push('Stop <b>'+esc(indicator)+'</b>');"));
          assert.ok(busSource.includes("details.push(displayCode?'Stop reference <b>'+esc(displayCode)+'</b>':'No stop reference published');"));
          assert.doesNotMatch(busSource, /const label=indicator\?'Stop '\+indicator:'Exact stop';/);
          assert.match(busSource, /el\.hidden=!html;/);
          """
          replace_once(test_path, old_static, new_static, 'pin stop identity presentation')

          replace_once(
              test_path,
              "const target={id:'map-test-stop',name:'Map-selected stop',ind:'B',lat:Number(base.lat)+.0001,lon:Number(base.lon)+.0001,d:120,region:'test',shard:'aa',timetableId:'map-test-stop'};",
              "const target={id:'map-test-stop',name:'Map-selected stop',ind:'B',atco:'490G00012345',lat:Number(base.lat)+.0001,lon:Number(base.lon)+.0001,d:120,region:'test',shard:'aa',timetableId:'map-test-stop'};",
              'give map selection a reference fixture',
          )

          old_return = """      heading:document.getElementById('stopName').textContent,
                appView:state.appView,
          """
          new_return = """      heading:document.getElementById('stopName').textContent,
                infoHasStop:document.getElementById('stopSource').textContent.includes('Stop B'),
                infoHasReference:document.getElementById('stopSource').textContent.includes('490G00012345'),
                infoHidden:document.getElementById('boardInfoPanel').hidden,
                factsHasIdentity:/Stop B|ATCO 490G00012345/.test(document.getElementById('stopFacts').textContent),
                appView:state.appView,
          """
          replace_once(test_path, old_return, new_return, 'inspect selected stop info presentation')

          old_expected = """  assert.deepEqual(mapStopSelection,{
              changed:true,selected:'map-test-stop',target:'map-test-stop',heading:'Map-selected stop (B)',
              appView:'times',timesSelected:'true',mapSelected:'false'
            });
          """
          new_expected = """  assert.deepEqual(mapStopSelection,{
              changed:true,selected:'map-test-stop',target:'map-test-stop',heading:'Map-selected stop',
              infoHasStop:true,infoHasReference:true,infoHidden:true,factsHasIdentity:false,
              appView:'times',timesSelected:'true',mapSelected:'false'
            });
          """
          replace_once(test_path, old_expected, new_expected, 'expect stop identity only behind info button')

          bus = Path(bus_path).read_text(encoding='utf-8')
          if "const APP_VERSION = '0.7.26';" not in bus:
              raise SystemExit('Kerbside version drifted from 0.7.26')
          required = [
              "$('stopName').textContent=s.name; updateStopMeta();",
              "if(indicator) details.push('Stop <b>'+esc(indicator)+'</b>');",
              "details.push(displayCode?'Stop reference <b>'+esc(displayCode)+'</b>':'No stop reference published');",
          ]
          missing = [token for token in required if token not in bus]
          if missing:
              raise SystemExit(f'Missing stop information cleanup tokens: {missing}')
          forbidden = [
              "$('stopName').textContent=s.name+(s.ind?' ('+s.ind+')':'');",
              "const label=indicator?'Stop '+indicator:'Exact stop';",
              "<span class=\"stopflag-note\">ATCO ",
          ]
          present = [token for token in forbidden if token in bus]
          if present:
              raise SystemExit(f'Duplicated stop identity remains: {present}')

          scripts = re.findall(
              r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',
              bus,
              flags=re.I | re.S,
          )
          if not scripts:
              raise SystemExit('No inline browser scripts found')
          with tempfile.TemporaryDirectory() as directory:
              for index, script in enumerate(scripts, start=1):
                  target = Path(directory) / f'inline-{index}.js'
                  target.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(target)], check=True)

          changed = set(subprocess.check_output(['git', 'diff', '--name-only', '--'], text=True).splitlines())
          expected = {'bus.html', 'kerbside-backend/tests/browser-regression.mjs'}
          if changed != expected:
              raise SystemExit(f'Patch changed wrong files: changed={sorted(changed)}, expected={sorted(expected)}')
          subprocess.run(['git', 'diff', '--check'], check=True)
          print('Kerbside stop information cleanup applied and statically validated.')
          PY

      - name: Install browser validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          npm run vendor:leaflet --prefix kerbside-backend
          git diff --exit-code -- kerbside-backend/vendor/leaflet
          cd kerbside-backend
          npx playwright install --with-deps webkit chromium

      - name: Run regression validation in WebKit and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm run check --prefix kerbside-backend
          npm test --prefix kerbside-backend
          npm run test:browser --prefix kerbside-backend
          KERBSIDE_BROWSER=chromium npm run test:browser --prefix kerbside-backend

      - name: Publish validated commit to staging branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main agent/kerbside-stop-info-panel
          remote_main="$(git rev-parse origin/main)"
          if [[ "$remote_main" != "$GUARDED_BASE" ]]; then
            echo "::error::main moved during validation: guarded $GUARDED_BASE, now $remote_main"
            exit 1
          fi

          git config user.name "OpenAI Agent"
          git config user.email "noreply@openai.com"
          git rm -- .github/workflows/apply-kerbside-stop-info-cleanup.yml
          git add bus.html kerbside-backend/tests/browser-regression.mjs
          git diff --cached --check

          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            .github/workflows/apply-kerbside-stop-info-cleanup.yml
            bus.html
            kerbside-backend/tests/browser-regression.mjs
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "$(printf '%s\n' "${changed[@]}")" != "$(printf '%s\n' "${expected[@]}")" ]]; then
            echo '::error::Staged paths differ from the expected stop-info cleanup files.'
            printf 'Changed:\n%s\nExpected:\n%s\n' \
              "$(printf '%s\n' "${changed[@]}")" \
              "$(printf '%s\n' "${expected[@]}")"
            exit 1
          fi

          git commit -m "Kerbside: move stop reference behind info"
          git push origin HEAD:agent/kerbside-stop-info-panel
