name: Rail Data diagnostic

on:
  push:
    branches:
      - agent/rdm-diagnostic
    paths:
      - .github/workflows/rdm-diagnostic.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove diagnostic branch
        shell: bash
        run: git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete agent/rdm-diagnostic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
