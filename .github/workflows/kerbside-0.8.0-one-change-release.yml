name: Kerbside 0.8.0 one-change journey release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kerbside-0.8.0-one-change-release.yml

permissions:
  contents: write

concurrency:
  group: kerbside-0.8.0-one-change-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Apply Kerbside 0.8.0
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-kerbside-0.8.0.py
          python3 .github/scripts/augment-kerbside-0.8.0-live-connections.py
          python3 .github/scripts/sync-version.py

      - name: Install browser regression dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          npm run vendor:leaflet --prefix kerbside-backend
          cd kerbside-backend
          npx playwright install --with-deps webkit chromium

      - name: Validate code and deterministic rail tests
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sync-version.py --check
          node --check kerbside-train-timetable.js
          node --check kerbside-train-live-overlay.js
          node --check kerbside-train-live-window.js
          node --check kerbside-journey-planner-ui.js
          node --check kerbside-backend/tests/train-browser-core-regression.mjs
          node --check kerbside-backend/tests/train-mobile-layout-regression.mjs
          node --test kerbside-backend/test/train-timetable-provider.test.js
          node --test kerbside-backend/test/train-route-swap.test.mjs
          node --test kerbside-backend/test/train-forecast-layout.test.mjs
          node --test kerbside-backend/tests/train-forecast-v3-dual-timetable.mjs
          npm run check --prefix kerbside-backend
          git diff --check
          grep -Fx '0.8.0' VERSION
          grep -F "journeyType:'connection'" kerbside-train-timetable.js
          grep -F "includeConnections" kerbside-train-live-overlay.js
          grep -F "kerbsideScope" kerbside-journey-planner-ui.js

      - name: Run current rail browser bundle in WebKit
        shell: bash
        run: |
          set -euo pipefail
          npm run test:train-route --prefix kerbside-backend

      - name: Run current rail browser bundle in Chromium
        shell: bash
        env:
          KERBSIDE_BROWSER: chromium
        run: |
          set -euo pipefail
          npm run test:train-route --prefix kerbside-backend

      - name: Publish Kerbside 0.8.0
        shell: bash
        run: |
          set -euo pipefail
          git add VERSION bus.html kerbside-status.js kerbside-trains.css \
            kerbside-train-timetable.js kerbside-train-live-overlay.js kerbside-train-live-window.js \
            kerbside-journey-planner-ui.js \
            kerbside-backend/package.json kerbside-backend/src/worker.js \
            kerbside-backend/test/worker.test.js kerbside-backend/test/train-timetable-provider.test.js \
            kerbside-backend/tests/browser-regression.mjs \
            kerbside-backend/tests/train-browser-core-regression.mjs \
            kerbside-backend/tests/train-mobile-layout-regression.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Kerbside 0.8.0: add one-change train journeys'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo 'Failed to publish after three rebased attempts.' >&2
          exit 1
