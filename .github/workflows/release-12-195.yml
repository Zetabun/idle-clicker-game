name: Release Strikewatch 12.195

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/release-12-195.txt'

permissions:
  contents: write

concurrency:
  group: release-strikewatch-12-195
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PYTHONPYCACHEPREFIX: /tmp/strikewatch-pycache
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build, verify and publish
        shell: bash
        run: |
          cat > /tmp/release-12-195.sh <<'BASH'
          set -Eeuo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('strikewatch-source/RELEASE.json').read_text(encoding='utf-8'))
          expected = {
              'version': '12.194',
              'name': 'Muzzle-Anchored Tracers',
              'build_id': '12.194.0-muzzle-anchored-tracers'
          }
          if release != expected:
              raise SystemExit(f'Unexpected predecessor release: {release!r}')
          PY

          python3 -m py_compile .github/scripts/release-12-195.py
          python3 .github/scripts/release-12-195.py

          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('strikewatch-source/RELEASE.json').read_text(encoding='utf-8'))
          expected = {
              'version': '12.195',
              'name': 'Combat-Aware Spectator Director',
              'build_id': '12.195.0-combat-aware-spectator-director'
          }
          if release != expected:
              raise SystemExit(f'Unexpected prepared release: {release!r}')
          required_docs = {
              'HANDOFF.md': '- Build: **12.195 — Combat-Aware Spectator Director**',
              'AGENTS.md': 'Build 12.195 owns the combat-aware AUTO spectator director',
              'README.md': '# Strikewatch Source 12.195',
              'PROJECT.md': 'Build 12.195 replaces blind AUTO spectator rotation',
              'CHANGELOG.md': '## 12.195 — Combat-Aware Spectator Director',
              '00-READ-FIRST-GPT.md': 'Current release: **Strikewatch Build 12.195 — Combat-Aware Spectator Director**.',
              'CONTRACTS.md': '- AUTO spectator selection may rank only already-computed operator presentation state.'
          }
          for name, required in required_docs.items():
              text = Path('strikewatch-source', name).read_text(encoding='utf-8')
              if required not in text:
                  raise SystemExit(f'{name} missing release requirement: {required}')
          if not Path('strikewatch-source/AUDIT-12.195.md').is_file():
              raise SystemExit('AUDIT-12.195.md was not created')
          PY

          grep -F "const BUILD_VERSION = '12.195'" strikewatch-source/js/00-core.js
          grep -F "const BUILD_NAME = 'Combat-Aware Spectator Director'" strikewatch-source/js/00-core.js
          grep -F "const BUILD_ID = '12.195.0-combat-aware-spectator-director'" strikewatch-source/js/00-core.js
          grep -F '<title>Strikewatch 12.195: Combat-Aware Spectator Director</title>' strikewatch-source/index.html
          grep -F 'id="managerBuildVersion">12.195</b>' strikewatch-source/index.html
          grep -F 'id="mobileCommandBuildVersion">12.195</b>' strikewatch-source/index.html

          python3 - <<'PY'
          from pathlib import Path
          runtime = Path('strikewatch-source/js/70-runtime.js').read_text(encoding='utf-8')
          required = [
              "revision: '12.195-combat-aware-director-1'",
              'sampleInterval: 0.22',
              'urgentMinimumHold: 1.25',
              'minimumHold: 3.2',
              'maximumHold: 8.5',
              'switchMargin: 18',
              'currentViewBias: 7',
              'function resetSpectatorDirectorState(',
              'function spectatorDirectorInterest(bot, current = false)',
              'function spectatorDirectorDecision(entries, currentIndex, holdTime)',
              'function updateAutoSpectatorDirector(dt)',
              'function spectatorDirectorForTest()',
              'updateAutoSpectatorDirector(dt);',
              "resetSpectatorDirectorState(spectatorIndex, 'manual-selection')",
              "resetSpectatorDirectorState(spectatorIndex, autoSpectate ? 'auto-enabled' : 'auto-disabled')",
              'spectatorDirectorForTest: () => spectatorDirectorForTest()',
              'spectatorDeathSwitchTimer = 2;'
          ]
          missing = [item for item in required if item not in runtime]
          if missing:
              raise SystemExit(f'Missing spectator director requirements: {missing}')
          if 'autoTimer = 4 + Math.random() * 3;' in runtime:
              raise SystemExit('Legacy random AUTO spectator timer survived')
          if runtime.count('updateAutoSpectatorDirector(dt);') != 1:
              raise SystemExit('AUTO spectator director update is missing or duplicated')
          if runtime.count('spectatorDeathSwitchTimer = 2;') != 1:
              raise SystemExit('Two-second spectator death handoff changed unexpectedly')
          forbidden_inside = [
              'hasLineOfSight(',
              '.canVisuallySee(',
              'navigateMove(',
              'combatMove(',
              'updatePerception('
          ]
          start = runtime.index('function spectatorDirectorInterest')
          end = runtime.index('function spectatorDirectorDecision', start)
          interest = runtime[start:end]
          found = [item for item in forbidden_inside if item in interest]
          if found:
              raise SystemExit(f'Spectator interest function added simulation work: {found}')
          PY

          node - <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const source = fs.readFileSync('strikewatch-source/js/70-runtime.js', 'utf8');
          const start = source.indexOf('  const SPECTATOR_CAMERA_DIRECTOR');
          const end = source.indexOf('  function updateSpectatorDeathHandoff', start);
          if (start < 0 || end < 0) throw new Error('Could not isolate spectator director source');
          const snippet = source.slice(start, end);
          const context = {
            CAREER_OWNED_TEAM: 0,
            clamp: (value, minimum, maximum) => Math.min(maximum, Math.max(minimum, value)),
            spectatorIndex: 0,
            autoTimer: 0,
            bots: [],
            autoSpectate: false,
            roundEnding: false,
            matchEnding: false,
            updateHud: () => {}
          };
          vm.createContext(context);
          vm.runInContext(`${snippet}\nthis.__result = spectatorDirectorForTest();`, context);
          if (!context.__result?.ok) throw new Error(`spectatorDirectorForTest failed: ${JSON.stringify(context.__result)}`);
          if (context.__result.deathHandoffSeconds !== 2) throw new Error('Death handoff duration changed');
          if (context.__result.aiPerceptionCallsAdded !== 0 || context.__result.simulationWritesAdded !== 0) {
            throw new Error('Director behaviour boundary failed');
          }
          console.log(JSON.stringify(context.__result));
          JS

          for hook in spectatorDirectorForTest spectatorHandoffForTest operatorTracerOriginForTest operatorMuzzleLightResponseForTest operatorEnvironmentalLightPickupForTest operatorSilhouetteSeparationForTest operatorContactShadowForTest operatorAmbientOcclusionForTest dynamicActorCullingForTest arenaSurfaceSampleForTest; do
            grep -R -F "$hook" strikewatch-source/js >/dev/null
          done

          cd strikewatch-source
          python3 -m py_compile build.py
          python3 build.py
          test -f dist/strikewatch-build-12.195.html
          test -f dist/strikewatch-build-12.195-size.json
          test -f dist/strikewatch-build-12.195-css-debt.json
          cp js/strikewatch.dev.js /tmp/strikewatch.dev.first.js
          cp dist/strikewatch-build-12.195.html /tmp/strikewatch-build.first.html
          cp dist/strikewatch-build-12.195-size.json /tmp/strikewatch-size.first.json
          cp dist/strikewatch-build-12.195-css-debt.json /tmp/strikewatch-css.first.json
          cd ..

          for file in strikewatch-source/js/*.js; do
            [ "$(basename "$file")" = 'strikewatch.dev.js' ] && continue
            node --check "$file"
          done
          node --check strikewatch-source/js/strikewatch.dev.js

          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          html = Path('strikewatch-source/dist/strikewatch-build-12.195.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit('No standalone inline scripts found')
          with tempfile.TemporaryDirectory() as temp:
              for index, script in enumerate(scripts):
                  path = Path(temp) / f'inline-{index}.js'
                  path.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(path)], check=True)
          print(f'Parsed {len(scripts)} standalone inline scripts.')
          PY

          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('strikewatch-source/dist/strikewatch-build-12.195-css-debt.json').read_text(encoding='utf-8'))
          if not report.get('within_budget'):
              raise SystemExit(f'CSS debt report is outside budget: {report!r}')
          if report.get('stylesheets') != 23:
              raise SystemExit(f'Unexpected stylesheet count: {report.get("stylesheets")}')
          size = json.loads(Path('strikewatch-source/dist/strikewatch-build-12.195-size.json').read_text(encoding='utf-8'))
          if size.get('version') != '12.195':
              raise SystemExit(f'Unexpected size report version: {size!r}')
          if size.get('javascript_raw_reduction_percent', 0) < 2.5:
              raise SystemExit(f'JavaScript release reduction below budget: {size!r}')
          PY

          cd strikewatch-source
          python3 build.py
          cd ..
          cmp /tmp/strikewatch.dev.first.js strikewatch-source/js/strikewatch.dev.js
          cmp /tmp/strikewatch-build.first.html strikewatch-source/dist/strikewatch-build-12.195.html
          cmp /tmp/strikewatch-size.first.json strikewatch-source/dist/strikewatch-build-12.195-size.json
          cmp /tmp/strikewatch-css.first.json strikewatch-source/dist/strikewatch-build-12.195-css-debt.json

          cp strikewatch-source/dist/strikewatch-build-12.195.html cod.html
          cmp cod.html strikewatch-source/dist/strikewatch-build-12.195.html
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          test ! -e .github/scripts/__pycache__
          test ! -e strikewatch-source/__pycache__
          git diff --check
          BASH

          mkdir -p .github/release-failures
          LOG=.github/release-failures/release-12-195.log
          set +e
          bash /tmp/release-12-195.sh 2>&1 | tee "$LOG"
          release_status=${PIPESTATUS[0]}
          set -e

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$release_status" -ne 0 ]; then
            printf '\nFAILED_EXIT_CODE=%s\n' "$release_status" >> "$LOG"
            git add "$LOG"
            git commit -m 'Record Build 12.195 release failure'
            git push origin HEAD:main
            exit "$release_status"
          fi

          rm -f "$LOG"
          rm -f .github/scripts/release-12-195.py
          rm -f .github/workflows/release-12-195.yml
          rm -f .github/triggers/release-12-195.txt
          rm -f .github/release-12-195.trigger
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git add -A
          git diff --cached --quiet && { echo 'No release changes produced.'; exit 1; }
          git diff --cached --check
          git commit -m 'Build 12.195: combat-aware spectator director'
          git push origin HEAD:main
