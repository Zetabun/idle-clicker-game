name: Sync Kerbside 0.7.31 test versions
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/sync-kerbside-0731-tests.yml
permissions:
  contents: write
jobs:
  sync:
    if: github.head_ref == 'agent/kerbside-train-forecast-v3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - name: Sync stale test version references
        shell: python
        run: |
          from pathlib import Path
          paths = [
              Path('kerbside-backend/test/worker.test.js'),
              Path('kerbside-backend/tests/browser-regression.mjs'),
          ]
          for path in paths:
              text = path.read_text()
              if '0.7.30' not in text:
                  continue
              path.write_text(text.replace('0.7.30', '0.7.31'))
      - name: Commit synced test versions
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add kerbside-backend/test/worker.test.js kerbside-backend/tests/browser-regression.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Sync 0.7.31 test version references"
          git push
