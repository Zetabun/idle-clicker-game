name: Release Strikewatch 12.188

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/release-12-188.txt'

permissions:
  contents: write

concurrency:
  group: release-strikewatch-12-188
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build, verify and publish
        shell: bash
        run: |
          cat > /tmp/release-12-188.sh <<'BASH'
          set -Eeuo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('strikewatch-source/RELEASE.json').read_text(encoding='utf-8'))
          expected = {
              'version': '12.187',
              'name': 'Report XP Safety',
              'build_id': '12.187.0-report-xp-safety'
          }
          if release != expected:
              raise SystemExit(f'Unexpected predecessor release: {release!r}')
          PY

          python3 .github/scripts/release-12-188.py
          python3 .github/scripts/release-12-188-docs.py

          grep -F "const BUILD_VERSION = '12.188'" strikewatch-source/js/00-core.js
          grep -F "const BUILD_NAME = 'Armour Preview Optimisation'" strikewatch-source/js/00-core.js
          grep -F "const BUILD_ID = '12.188.0-armour-preview-optimisation'" strikewatch-source/js/00-core.js
          grep -F '<title>Strikewatch 12.188: Armour Preview Optimisation</title>' strikewatch-source/index.html
          grep -F 'css/loadout-stills.css?v=12.188.0-armour-preview-optimisation' strikewatch-source/index.html
          grep -F 'id="managerBuildVersion">12.188</b>' strikewatch-source/index.html
          grep -F "careerArmourStillMarkup(armour, { width: 240, height: 280, margin: 0.80" strikewatch-source/js/38-development.js
          ! grep -F "careerArmourVisualMarkup(armour, 'store')" strikewatch-source/js/38-development.js
          grep -F 'function armourPreviewOptimisationForTest()' strikewatch-source/js/57-loadout-stills.js
          test -f strikewatch-source/AUDIT-12.188.md

          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('strikewatch-source/RELEASE.json').read_text(encoding='utf-8'))
          expected = {
              'version': '12.188',
              'name': 'Armour Preview Optimisation',
              'build_id': '12.188.0-armour-preview-optimisation'
          }
          if release != expected:
              raise SystemExit(f'Unexpected release metadata: {release!r}')
          required_docs = {
              'HANDOFF.md': '- Build: **12.188 — Armour Preview Optimisation**',
              'AGENTS.md': 'Build 12.188 owns armour preview framing and Supply Depot armour-card performance.',
              'README.md': '# Strikewatch Source 12.188',
              'PROJECT.md': 'Build 12.188 improves armour presentation and Supply Depot performance',
              'CHANGELOG.md': '## 12.188 — Armour Preview Optimisation',
              '00-READ-FIRST-GPT.md': 'Current release: **Strikewatch Build 12.188 — Armour Preview Optimisation**.'
          }
          for path, expected_text in required_docs.items():
              text = Path('strikewatch-source', path).read_text(encoding='utf-8')
              if expected_text not in text:
                  raise SystemExit(f'{path} missing current release identity: {expected_text}')
          PY

          cd strikewatch-source
          python3 -m py_compile build.py
          python3 build.py
          test -f dist/strikewatch-build-12.188.html
          test -f dist/strikewatch-build-12.188-size.json
          test -f dist/strikewatch-build-12.188-css-debt.json
          grep -F 'function armourPreviewOptimisationForTest()' js/strikewatch.dev.js
          cp js/strikewatch.dev.js /tmp/strikewatch.dev.first.js
          cp dist/strikewatch-build-12.188.html /tmp/strikewatch-build.first.html
          cp dist/strikewatch-build-12.188-size.json /tmp/strikewatch-size.first.json
          cp dist/strikewatch-build-12.188-css-debt.json /tmp/strikewatch-css.first.json
          cd ..

          for file in strikewatch-source/js/*.js; do node --check "$file"; done
          node --check strikewatch-source/js/strikewatch.dev.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('strikewatch-source/dist/strikewatch-build-12.188.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          with tempfile.TemporaryDirectory() as temp:
              for index, script in enumerate(scripts):
                  path = Path(temp) / f'inline-{index}.js'
                  path.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(path)], check=True)
          PY

          python3 - <<'PY'
          from pathlib import Path
          stills = Path('strikewatch-source/js/57-loadout-stills.js').read_text(encoding='utf-8')
          development = Path('strikewatch-source/js/38-development.js').read_text(encoding='utf-8')
          css = Path('strikewatch-source/css/loadout-stills.css').read_text(encoding='utf-8')
          required_stills = [
              "const LOADOUT_STILL_ARMOUR_VIEW = Object.freeze({ yaw: 0, pitch: -6 })",
              "const defaultMargin = thumbnail ? 0.94 : 0.82",
              "const margin = Number.isFinite(Number(options.margin)) ? Number(options.margin) : defaultMargin",
              "|m${margin.toFixed(3)}`",
              'function armourPreviewOptimisationForTest()',
              'storeMargin: 0.80',
              'cacheReused: Boolean(first && first === second)'
          ]
          missing = [value for value in required_stills if value not in stills]
          if missing:
              raise SystemExit(f'Missing still-renderer requirements: {missing}')
          if "careerArmourVisualMarkup(armour, 'store')" in development:
              raise SystemExit('Live Field Crate Exchange armour rig call remains')
          if development.count('careerArmourStillMarkup(armour, { width: 240, height: 280, margin: 0.80') != 1:
              raise SystemExit('Expected exactly one cached store-armour still call')
          if 'Build 12.188: Field Crate Exchange cached armour stills' not in css:
              raise SystemExit('Store still CSS boundary missing')
          for existing in ['function loadoutStillAuditForTest()', 'careerArmour3dParts(armour)']:
              if existing not in stills:
                  raise SystemExit(f'Existing still-renderer authority missing: {existing}')
          PY

          for hook in loadoutStillAuditForTest armour3dPresentationForTest armourSystemForTest loadoutStillForTest; do
            grep -R -F "$hook" strikewatch-source/js >/dev/null
          done

          cd strikewatch-source
          python3 build.py
          cd ..
          cmp /tmp/strikewatch.dev.first.js strikewatch-source/js/strikewatch.dev.js
          cmp /tmp/strikewatch-build.first.html strikewatch-source/dist/strikewatch-build-12.188.html
          cmp /tmp/strikewatch-size.first.json strikewatch-source/dist/strikewatch-build-12.188-size.json
          cmp /tmp/strikewatch-css.first.json strikewatch-source/dist/strikewatch-build-12.188-css-debt.json

          cp strikewatch-source/dist/strikewatch-build-12.188.html cod.html
          cmp cod.html strikewatch-source/dist/strikewatch-build-12.188.html
          git diff --check
          BASH

          LOG=.github/release-12-188-last.log
          set +e
          bash /tmp/release-12-188.sh 2>&1 | tee "$LOG"
          release_status=${PIPESTATUS[0]}
          set -e

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$release_status" -ne 0 ]; then
            printf '\nFAILED_EXIT_CODE=%s\n' "$release_status" >> "$LOG"
            git add "$LOG"
            git commit -m 'Record Build 12.188 release failure'
            git push origin HEAD:main
            exit "$release_status"
          fi

          rm -f "$LOG"
          rm -f .github/scripts/release-12-188.py
          rm -f .github/scripts/release-12-188-docs.py
          rm -f .github/workflows/release-12-188.yml
          rm -f .github/triggers/release-12-188.txt
          git add -A
          git diff --cached --quiet && { echo 'No release changes produced.'; exit 1; }
          git commit -m 'Build 12.188: armour preview optimisation'
          git push origin HEAD:main
