name: Release Strikewatch 12.158 v4

on:
  pull_request:
    types: [closed]
    paths:
      - '.github/release-12.158-v4-trigger'

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storage-safe-results-12.158
          fetch-depth: 0

      - name: Reconstruct and apply reviewed source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, string
          allowed = set(string.ascii_letters + string.digits + '+/=')
          def reconstruct(pattern, destination, expected):
              parts = sorted(Path('.github').glob(pattern))
              encoded = ''.join(ch for path in parts for ch in path.read_text(encoding='utf-8') if ch in allowed)
              payload = base64.b64decode(encoded, validate=True)
              digest = hashlib.sha256(payload).hexdigest()
              print({'pattern': pattern, 'parts': len(parts), 'decoded_bytes': len(payload), 'sha256': digest})
              if digest != expected: raise SystemExit(f'Decoded hash mismatch: {digest} != {expected}')
              Path(destination).write_bytes(payload)
          reconstruct('apply158.part.*', '/tmp/apply_12_158.py', 'bcbfb70b056eca3b009badeb3d6c6afd954db76c2db9f20c7a9b465cf388e892')
          reconstruct('code158.part.*', '/tmp/build-12.158-code.patch', '3ad46d09bc94003d0aa1310d234d5c20684d16115f5b14a276ea7af9b851accb')
          PY
          git apply --check /tmp/build-12.158-code.patch
          git apply /tmp/build-12.158-code.patch
          sed -i '13a<!-- BUILD 12.157 · Operator Depth -->' strikewatch-source/index.html
          python3 /tmp/apply_12_158.py
          sed -i '/<!-- BUILD 12.158 · Storage-Safe Results -->/d' strikewatch-source/index.html
          rm -f .github/build-12.158-code.patch.b64 .github/apply-build-12.158.py.b64 .github/apply158.part.* .github/code158.part.* .github/code158v2.part.*

      - name: Run mature-save regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('strikewatch-source/js/35-career.js').read_text(encoding='utf-8')
          start = text.index('  function careerStorageWriteVerified')
          end = text.index('\n  function saveCareerState', start)
          Path('/tmp/commit-functions.js').write_text(text[start:end], encoding='utf-8')
          PY
          cat > /tmp/storage-pressure-test.js <<'JS'
          const fs = require('fs'), vm = require('vm');
          const context = { CAREER_STORAGE_KEY: 'career', CAREER_BACKUP_STORAGE_KEY: 'backup' };
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('/tmp/commit-functions.js', 'utf8') + '\nthis.commit = careerCommitPrimaryAndBackup;', context);
          const oldCareer = { goldCoins: 0, calendar: { absoluteDay: 0 }, league: { table: [{ points: 0 }], fixtures: [] }, history: 'x'.repeat(180000) };
          const nextCareer = { ...oldCareer, goldCoins: 18, calendar: { absoluteDay: 2 }, league: { table: [{ points: 3 }], fixtures: [{ played: true }] } };
          const oldValue = JSON.stringify(oldCareer), nextValue = JSON.stringify(nextCareer);
          const values = new Map([['career', oldValue]]), quota = Math.max(oldValue.length, nextValue.length) + 256;
          const storage = {
            getItem: key => values.has(key) ? values.get(key) : null,
            removeItem: key => values.delete(key),
            setItem(key, value) {
              const next = new Map(values); next.set(key, String(value));
              if ([...next.values()].reduce((sum, item) => sum + item.length, 0) > quota) throw new Error('quota');
              values.clear(); for (const [key2, value2] of next) values.set(key2, value2);
            }
          };
          const result = context.commit(storage, { serialised: nextValue, existing: oldValue, refreshBackup: true, allowBackupEviction: true });
          const persisted = JSON.parse(storage.getItem('career'));
          if (persisted.goldCoins !== 18 || persisted.calendar.absoluteDay !== 2 || persisted.league.table[0].points !== 3 || !persisted.league.fixtures[0].played) throw new Error('Primary result was not retained');
          if (!['skipped', 'retained-older'].includes(result.backupStatus)) throw new Error(`Unexpected backup status: ${result.backupStatus}`);
          console.log({ goldCoins: persisted.goldCoins, day: persisted.calendar.absoluteDay, points: persisted.league.table[0].points, backupStatus: result.backupStatus });
          JS
          node /tmp/storage-pressure-test.js

      - name: Build and verify twice
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          cd strikewatch-source
          python3 -m py_compile build.py
          python3 build.py
          for file in js/*.js; do node --check "$file"; done
          node --check js/strikewatch.dev.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('dist/strikewatch-build-12.158.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if not scripts: raise SystemExit('No inline application script found')
          Path('/tmp/inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/inline.js
          cp js/strikewatch.dev.js /tmp/bundle-first.js
          cp dist/strikewatch-build-12.158.html /tmp/standalone-first.html
          first_bundle=$(sha256sum js/strikewatch.dev.js | cut -d' ' -f1)
          first_standalone=$(sha256sum dist/strikewatch-build-12.158.html | cut -d' ' -f1)
          python3 build.py
          cmp -s /tmp/bundle-first.js js/strikewatch.dev.js
          cmp -s /tmp/standalone-first.html dist/strikewatch-build-12.158.html
          second_bundle=$(sha256sum js/strikewatch.dev.js | cut -d' ' -f1)
          second_standalone=$(sha256sum dist/strikewatch-build-12.158.html | cut -d' ' -f1)
          test "$first_bundle" = "$second_bundle"
          test "$first_standalone" = "$second_standalone"
          cp dist/strikewatch-build-12.158.html ../cod.html
          cmp -s dist/strikewatch-build-12.158.html ../cod.html
          echo "bundle_sha=$second_bundle" >> "$GITHUB_OUTPUT"
          echo "standalone_sha=$second_standalone" >> "$GITHUB_OUTPUT"

      - name: Commit verified release
        shell: bash
        env:
          BUNDLE_SHA: ${{ steps.verify.outputs.bundle_sha }}
          STANDALONE_SHA: ${{ steps.verify.outputs.standalone_sha }}
        run: |
          set -euo pipefail
          grep -q "const BUILD_VERSION = '12.158'" strikewatch-source/js/00-core.js
          grep -q "storagePressureSaveForTest" strikewatch-source/js/70-runtime.js
          grep -q "CAREER SAVED · BACKUP LIMITED" strikewatch-source/js/35-career.js
          grep -q "allowBackupEviction: false" strikewatch-source/js/80-durable-results.js
          printf '\n- Deterministic bundle SHA-256: `%s`.\n- Deterministic standalone SHA-256: `%s`.\n' "$BUNDLE_SHA" "$STANDALONE_SHA" >> strikewatch-source/AUDIT-12.158.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build 12.158: make mature career saves storage-safe'
          git push origin HEAD:agent/storage-safe-results-12.158
