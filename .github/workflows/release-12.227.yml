name: Release Build 12.227

on:
  push:
    paths:
      - '.github/triggers/release-12.227.txt'

permissions:
  contents: write

concurrency:
  group: strikewatch-release-12.227
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure release diagnostics
        run: |
          mkdir -p .github/diagnostics
          : > .github/diagnostics/12.227.txt
          cat > /tmp/release-step.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          label="$1"
          shift
          {
            echo "=== ${label} ==="
            "$@"
          } 2>&1 | tee -a .github/diagnostics/12.227.txt
          SH
          chmod +x /tmp/release-step.sh

      - name: Verify predecessor and apply release patch
        run: |
          /tmp/release-step.sh "python compile release patch" python3 -m py_compile .github/scripts/release-12.227.py
          /tmp/release-step.sh "apply release patch" python3 .github/scripts/release-12.227.py

      - name: Compile build system
        run: /tmp/release-step.sh "python compile build.py" python3 -m py_compile strikewatch-source/build.py

      - name: Build first deterministic copy
        run: |
          /tmp/release-step.sh "first build" bash -lc 'cd strikewatch-source && python3 build.py'
          cp strikewatch-source/js/strikewatch.dev.js /tmp/strikewatch.dev.first.js
          cp strikewatch-source/dist/strikewatch-build-12.227.html /tmp/strikewatch-build-12.227.first.html
          cp strikewatch-source/dist/strikewatch-build-12.227-size.json /tmp/strikewatch-build-12.227-size.first.json
          cp strikewatch-source/dist/strikewatch-build-12.227-css-debt.json /tmp/strikewatch-build-12.227-css-debt.first.json

      - name: Parse modular and generated JavaScript
        run: |
          for file in strikewatch-source/js/*.js; do
            /tmp/release-step.sh "node check ${file}" node --check "$file"
          done
          /tmp/release-step.sh "node check generated bundle" node --check strikewatch-source/js/strikewatch.dev.js

      - name: Parse every standalone inline script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          class ScriptCollector(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.scripts = []
                  self.current = None
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'script':
                      self.current = []
              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.current is not None:
                      self.scripts.append(''.join(self.current))
                      self.current = None

          html = Path('strikewatch-source/dist/strikewatch-build-12.227.html').read_text(encoding='utf-8')
          parser = ScriptCollector()
          parser.feed(html)
          if not parser.scripts:
              raise SystemExit('standalone contains no inline scripts')
          for index, script in enumerate(parser.scripts):
              Path(f'/tmp/standalone-12.227-{index}.js').write_text(script, encoding='utf-8')
          print(f'extracted {len(parser.scripts)} inline scripts')
          PY
          for file in /tmp/standalone-12.227-*.js; do
            /tmp/release-step.sh "node check ${file}" node --check "$file"
          done

      - name: Verify desktop mail preview and mobile contract
        run: |
          /tmp/release-step.sh "targeted mail assertions" python3 - <<'PY'
          from pathlib import Path
          import json

          source = Path('strikewatch-source/js/39-club-operations.js').read_text(encoding='utf-8')
          start = source.index('  function selectClubMailAndOpen(')
          end = source.index('\n  function handleClubMailModalClick(', start)
          block = source[start:end]
          ordered = [
              'careerState.selectedMailId = mail.id;',
              'if (inlineReader) {',
              'mail.read = true;',
              'saveCareerState();',
              'Build 12.227: selectedMailId is transient UI state.',
              'careerState.selectedMailId = mail.id;',
              'updateMenuUI();',
          ]
          cursor = -1
          for anchor in ordered:
              cursor = block.find(anchor, cursor + 1)
              assert cursor >= 0, anchor
          assert block.count('careerState.selectedMailId = mail.id;') == 2
          assert '(clubMailUsesInlineReader() && careerState.selectedMailId === mail.id)' in source
          assert 'function openClubMailModal(mailId, returnFocus = null, markRead = false)' in source
          assert 'data-mail-modal-action="mark-read"' in source
          assert "modalAction.dataset.mailModalAction === 'mark-read'" in source
          assert 'data-mail-modal-action="mark-unread"' not in source
          assert json.loads(Path('strikewatch-source/RELEASE.json').read_text(encoding='utf-8')) == {
              'version': '12.227',
              'name': 'Desktop Inbox Preview Stability',
              'build_id': '12.227.0-desktop-inbox-preview-stability',
          }
          standalone = Path('strikewatch-source/dist/strikewatch-build-12.227.html').read_text(encoding='utf-8')
          for anchor in (
              '12.227.0-desktop-inbox-preview-stability',
              'Build 12.227: selectedMailId is transient UI state.',
              'function openClubMailModal(mailId, returnFocus = null, markRead = false)',
          ):
              assert anchor in standalone, anchor
          PY

      - name: Build second time and compare deterministic outputs
        run: |
          /tmp/release-step.sh "second build" bash -lc 'cd strikewatch-source && python3 build.py'
          /tmp/release-step.sh "compare development bundle" cmp /tmp/strikewatch.dev.first.js strikewatch-source/js/strikewatch.dev.js
          /tmp/release-step.sh "compare standalone" cmp /tmp/strikewatch-build-12.227.first.html strikewatch-source/dist/strikewatch-build-12.227.html
          /tmp/release-step.sh "compare size report" cmp /tmp/strikewatch-build-12.227-size.first.json strikewatch-source/dist/strikewatch-build-12.227-size.json
          /tmp/release-step.sh "compare CSS debt report" cmp /tmp/strikewatch-build-12.227-css-debt.first.json strikewatch-source/dist/strikewatch-build-12.227-css-debt.json

      - name: Publish verified standalone to root
        run: |
          cp strikewatch-source/dist/strikewatch-build-12.227.html cod.html
          /tmp/release-step.sh "root standalone byte identity" cmp strikewatch-source/dist/strikewatch-build-12.227.html cod.html

      - name: Remove temporary release files and successful diagnostics
        run: |
          rm .github/scripts/release-12.227.py
          rm .github/workflows/release-12.227.yml
          rm .github/triggers/release-12.227.txt
          rm -f .github/diagnostics/12.227.txt

      - name: Commit finished release to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build 12.227: Desktop Inbox Preview Stability"
          git push origin HEAD:main

      - name: Commit failure ledger
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .github/diagnostics
          {
            echo
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "trigger_sha=${GITHUB_SHA}"
          } >> .github/diagnostics/12.227.txt
          git add .github/diagnostics/12.227.txt
          git commit -m "Record Build 12.227 release failure" || true
          git push origin HEAD:main || true
