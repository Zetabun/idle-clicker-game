name: Validate Kerbside movement 0.9.36

on:
  push:
    branches:
      - agent/kerbside-0.9.36-cheap-cold-trains

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate movement Worker
        working-directory: kerbside-train-movement-worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --package-lock=false
          npm run check
          npm test
          npx wrangler deploy --dry-run --outdir=/tmp/kerbside-train-movement-worker
