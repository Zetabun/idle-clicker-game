name: Strikewatch 12.163 release

on:
  push:
    branches: [main]
    paths: ['.github/release-triggers/12.163.txt']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply release patch
        run: python3 .github/scripts/release-12-163.py
      - name: Build twice and verify deterministic output
        working-directory: strikewatch-source
        run: |
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.163.html > /tmp/a.sha
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.163.html > /tmp/b.sha
          diff -u /tmp/a.sha /tmp/b.sha
      - name: Parse JavaScript and check mobile release layer
        run: |
          for file in strikewatch-source/js/[0-9][0-9]-*.js strikewatch-source/js/strikewatch.dev.js; do node --check "$file"; done
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('strikewatch-source/dist/strikewatch-build-12.163.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>([\s\S]*?)</script>', html)
          if not scripts: raise SystemExit('No standalone inline script')
          Path('/tmp/inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          css=Path('strikewatch-source/css/game.css').read_text(encoding='utf-8')
          for token in ['grid-auto-rows: max-content','height: auto !important','grid-template-columns: 22px minmax(0, 1fr)','body.mobile-navigation-open .management-status']:
              if token not in css: raise SystemExit(f'Missing mobile fix token: {token}')
          handoff=Path('strikewatch-source/HANDOFF.md').read_text(encoding='utf-8')
          if '## ChatGPT-only publishing preference' not in handoff or 'Other coding agents should ignore it' not in handoff:
              raise SystemExit('ChatGPT-only handoff preference missing')
          PY
          node --check /tmp/inline.js
      - name: Publish and self-clean
        run: |
          cp strikewatch-source/dist/strikewatch-build-12.163.html cod.html
          cmp -s cod.html strikewatch-source/dist/strikewatch-build-12.163.html
          rm -f .github/scripts/release-12-163.py .github/workflows/release-12-163.yml .github/release-triggers/12.163.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add strikewatch-source cod.html .github/scripts/release-12-163.py .github/workflows/release-12-163.yml .github/release-triggers/12.163.txt
          git commit -m 'Build 12.163: fix compact navigation alignment'
          git push origin main
