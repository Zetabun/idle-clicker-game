name: Patch Kerbside 0.9.33

on:
  push:
    branches:
      - agent/kerbside-0.9.33-live-only-trust-bridge
    paths:
      - .github/workflows/patch-kerbside-0.9.33.yml
      - .github/scripts/patch-kerbside-0.9.33.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/kerbside-0.9.33-live-only-trust-bridge
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply 0.9.33 hotfix
        run: python .github/scripts/patch-kerbside-0.9.33.py
      - name: Commit product changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No product changes to commit'; exit 1; }
          git commit -m 'Kerbside 0.9.33: recover Darwin-only live tracking'
          git push origin HEAD:agent/kerbside-0.9.33-live-only-trust-bridge
