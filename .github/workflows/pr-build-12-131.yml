name: Package Build 12.131 PR

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tools/**'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply release update
        run: |
          sed -i "s/const BUILD_NAME = 'Aurora Terminal';/const BUILD_NAME = 'AURORA TERMINAL';/" tools/build_12_131.py
          python3 tools/build_12_131.py
      - name: First deterministic build
        working-directory: strikewatch-source
        run: |
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.131.html > /tmp/first.sha256
      - name: Parse JavaScript
        working-directory: strikewatch-source
        run: |
          for file in js/*.js; do node --check "$file"; done
          node --check js/strikewatch.dev.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('dist/strikewatch-build-12.131.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('No inline standalone script found')
          Path('/tmp/inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/inline.js
      - name: Second deterministic build and root copy
        working-directory: strikewatch-source
        run: |
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.131.html > /tmp/second.sha256
          diff -u /tmp/first.sha256 /tmp/second.sha256
          cp dist/strikewatch-build-12.131.html ../cod.html
          cmp -s dist/strikewatch-build-12.131.html ../cod.html
      - name: Create ZIP
        run: |
          rm -rf /tmp/strikewatch-12.131
          mkdir -p /tmp/strikewatch-12.131
          cp -R strikewatch-source /tmp/strikewatch-12.131/
          cp cod.html /tmp/strikewatch-12.131/
          cp tools/MANUAL-GITHUB-INSTALL-12.131.txt /tmp/strikewatch-12.131/MANUAL-GITHUB-INSTALL.txt
          cd /tmp
          zip -qr "$GITHUB_WORKSPACE/strikewatch-build-12.131-calendar-clarity.zip" strikewatch-12.131
      - name: Commit release files to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strikewatch-source cod.html
          if ! git diff --cached --quiet; then
            git commit -m "Build 12.131: Calendar Clarity"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: strikewatch-build-12.131-calendar-clarity
          path: strikewatch-build-12.131-calendar-clarity.zip
          if-no-files-found: error
