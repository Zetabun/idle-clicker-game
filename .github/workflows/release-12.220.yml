name: Release Build 12.220

on:
  push:
    paths:
      - '.github/triggers/release-12.220.txt'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply release patch
        run: python3 .github/scripts/release-12.220.py
      - name: Build twice deterministically
        working-directory: strikewatch-source
        run: |
          python3 build.py
          cp js/strikewatch.dev.js /tmp/bundle1.js
          cp dist/strikewatch-build-12.220.html /tmp/build1.html
          python3 build.py
          cmp /tmp/bundle1.js js/strikewatch.dev.js
          cmp /tmp/build1.html dist/strikewatch-build-12.220.html
      - name: Parse JavaScript
        run: |
          for file in strikewatch-source/js/*.js; do node --check "$file"; done
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('strikewatch-source/dist/strikewatch-build-12.220.html').read_text(encoding='utf-8')
          scripts = '\n'.join(re.findall(r'<script>(.*?)</script>', html, re.S))
          Path('/tmp/standalone.js').write_text(scripts, encoding='utf-8')
          PY
          node --check /tmp/standalone.js
      - name: Verify targeted changes
        run: |
          grep -q 'data-mail-modal-action="mark-read"' strikewatch-source/js/39-club-operations.js
          grep -q "mailModalAction === 'mark-read'" strikewatch-source/js/39-club-operations.js
          grep -q "showStatus('EMAIL MARKED AS READ')" strikewatch-source/js/39-club-operations.js
          ! grep -q 'data-mail-modal-action="mark-unread"' strikewatch-source/js/39-club-operations.js
          grep -q '12.220.0-mobile-mail-read-control' strikewatch-source/RELEASE.json
      - name: Publish standalone
        run: |
          cp strikewatch-source/dist/strikewatch-build-12.220.html cod.html
          cmp cod.html strikewatch-source/dist/strikewatch-build-12.220.html
      - name: Remove temporary release files
        run: |
          rm -f .github/scripts/release-12.220.py .github/workflows/release-12.220.yml .github/triggers/release-12.220.txt
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build 12.220: Mobile Mail Read Control'
          git push
