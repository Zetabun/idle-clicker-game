name: Release Build 12.228

on:
  push:
    paths:
      - '.github/triggers/release-12.228.txt'

permissions:
  contents: write

concurrency:
  group: strikewatch-release-12.228
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure release diagnostics
        run: |
          mkdir -p .github/diagnostics
          : > .github/diagnostics/12.228.txt
          cat > /tmp/release-step.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          label="$1"
          shift
          {
            echo "=== ${label} ==="
            "$@"
          } 2>&1 | tee -a .github/diagnostics/12.228.txt
          SH
          chmod +x /tmp/release-step.sh

      - name: Verify predecessor and apply release patch
        run: |
          /tmp/release-step.sh "python compile release patch" python3 -m py_compile .github/scripts/release-12.228.py
          /tmp/release-step.sh "apply release patch" python3 .github/scripts/release-12.228.py

      - name: Compile build system
        run: /tmp/release-step.sh "python compile build.py" python3 -m py_compile strikewatch-source/build.py

      - name: Build first deterministic copy
        run: |
          /tmp/release-step.sh "first build" bash -lc 'cd strikewatch-source && python3 build.py'
          cp strikewatch-source/js/strikewatch.dev.js /tmp/strikewatch.dev.first.js
          cp strikewatch-source/dist/strikewatch-build-12.228.html /tmp/strikewatch-build-12.228.first.html
          cp strikewatch-source/dist/strikewatch-build-12.228-size.json /tmp/strikewatch-build-12.228-size.first.json
          cp strikewatch-source/dist/strikewatch-build-12.228-css-debt.json /tmp/strikewatch-build-12.228-css-debt.first.json

      - name: Parse modular and generated JavaScript
        run: |
          for file in strikewatch-source/js/*.js; do
            /tmp/release-step.sh "node check ${file}" node --check "$file"
          done
          /tmp/release-step.sh "node check generated bundle" node --check strikewatch-source/js/strikewatch.dev.js

      - name: Parse every standalone inline script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          class ScriptCollector(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.scripts = []
                  self.current = None
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'script':
                      self.current = []
              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.current is not None:
                      self.scripts.append(''.join(self.current))
                      self.current = None

          html = Path('strikewatch-source/dist/strikewatch-build-12.228.html').read_text(encoding='utf-8')
          parser = ScriptCollector()
          parser.feed(html)
          if not parser.scripts:
              raise SystemExit('standalone contains no inline scripts')
          for index, script in enumerate(parser.scripts):
              Path(f'/tmp/standalone-12.228-{index}.js').write_text(script, encoding='utf-8')
          print(f'extracted {len(parser.scripts)} inline scripts')
          PY
          for file in /tmp/standalone-12.228-*.js; do
            /tmp/release-step.sh "node check ${file}" node --check "$file"
          done

      - name: Verify source and generated Inbox contracts
        run: |
          /tmp/release-step.sh "targeted Inbox assertions" python3 - <<'PY'
          from pathlib import Path
          import json

          css = Path('strikewatch-source/css/inbox-scroll.css').read_text(encoding='utf-8')
          required = [
              'Build 12.228: desktop Inbox status-badge containment',
              ".club-mail-client[data-mail-presentation='inline'] .club-mail-row.saved,",
              ".club-mail-client[data-mail-presentation='inline'] .club-mail-row.important {",
              ".club-mail-client[data-mail-presentation='inline'] .club-mail-row.decision-required {",
              'padding-inline-end: 52px;',
              'padding-inline-end: 96px;',
              '> .club-mail-decision-badge,',
              '> .club-mail-saved-badge,',
              '> .club-mail-important {',
              'right: 12px;',
              'inset-inline-end: 12px;',
              'top: 50%;',
              'transform: translateY(-50%);',
          ]
          for value in required:
              assert value in css, value
          assert '@media' not in css

          mail = Path('strikewatch-source/js/39-club-operations.js').read_text(encoding='utf-8')
          start = mail.index('return `<button class="club-mail-row')
          end = mail.index('</button>`;', start)
          row = mail[start:end]
          for class_name in ('club-mail-decision-badge', 'club-mail-saved-badge', 'club-mail-important'):
              assert row.count(class_name) == 1, class_name
          assert 'decisionRequired ?' in row
          assert 'item.saved ?' in row
          assert 'item.important ?' in row
          assert 'data-mail-presentation="${inlineReader ? \'inline\' : \'modal\'}"' in mail

          release = json.loads(Path('strikewatch-source/RELEASE.json').read_text(encoding='utf-8'))
          assert release == {
              'version': '12.228',
              'name': 'Desktop Inbox Badge Containment',
              'build_id': '12.228.0-desktop-inbox-badge-containment',
          }
          debt = json.loads(Path('strikewatch-source/dist/strikewatch-build-12.228-css-debt.json').read_text(encoding='utf-8'))
          assert debt['media_queries'] == 484, debt['media_queries']
          assert debt['within_budget'] is True

          standalone = Path('strikewatch-source/dist/strikewatch-build-12.228.html').read_text(encoding='utf-8')
          for value in (
              '12.228.0-desktop-inbox-badge-containment',
              ".club-mail-client[data-mail-presentation='inline'] .club-mail-row.decision-required",
              'padding-inline-end: 96px;',
              'inset-inline-end: 12px;',
          ):
              assert value in standalone, value
          PY

      - name: Browser-check all desktop Inbox status states
        run: |
          /tmp/release-step.sh "create browser fixture" python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('strikewatch-source')
          index = (root / 'index.html').read_text(encoding='utf-8')
          hrefs = re.findall(r'<link rel="stylesheet" href="(css/[^"]+)"\s*/>', index)
          if not hrefs:
              raise SystemExit('no ordered stylesheets found in index.html')
          links = '\n'.join(f'<link rel="stylesheet" href="{href}" />' for href in hrefs)
          row_copy = '''<span class="club-mail-avatar" aria-hidden="true">BS</span>
          <span class="club-mail-row-copy"><span class="club-mail-row-meta"><b>Backroom Staff Department</b><time>MON 17 AUG · W3</time></span><strong>Training standards · Callum Wilson and a deliberately long desktop subject</strong><small>Callum Wilson arrived late to a scheduled tactical review. The staff want a clear response before the next day begins.</small></span>'''
          rows = f'''
          <button class="club-mail-row unread decision-required" data-audit-state="decision"><i class="club-mail-unread-dot" aria-hidden="true"></i>{row_copy}<em class="club-mail-decision-badge">DECISION</em></button>
          <button class="club-mail-row saved" data-audit-state="saved"><i class="club-mail-unread-dot" aria-hidden="true"></i>{row_copy}<em class="club-mail-saved-badge" aria-label="Saved email">★</em></button>
          <button class="club-mail-row important" data-audit-state="important"><i class="club-mail-unread-dot" aria-hidden="true"></i>{row_copy}<em class="club-mail-important" aria-label="Important message">★</em></button>
          '''
          html = f'''<!doctype html>
          <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">{links}
          <style>
          html,body{{margin:0;min-width:0!important;max-width:100%;min-height:100%;}}
          body{{overflow-x:auto!important;background:#07131d;}}
          #menuShell.audit-shell{{display:block!important;width:clamp(420px,42vw,680px)!important;max-width:calc(100vw - 32px)!important;min-height:0!important;margin:16px!important;position:static!important;}}
          .audit-shell > .menu-content{{display:block!important;width:100%!important;max-width:100%!important;min-width:0!important;min-height:0!important;overflow:visible!important;}}
          #menuContent.audit-content{{display:block!important;width:100%!important;max-width:100%!important;min-width:0!important;min-height:0!important;overflow:visible!important;}}
          .audit-content .club-mail-client,.audit-content .club-mail-layout,.audit-content .club-mail-column{{display:block!important;width:100%!important;max-width:100%!important;height:auto!important;min-width:0!important;min-height:0!important;max-height:none!important;}}
          .audit-content .club-mail-list{{display:grid!important;width:100%!important;max-width:100%!important;min-width:0!important;gap:12px!important;max-height:none!important;overflow:visible!important;-webkit-mask-image:none!important;mask-image:none!important;}}
          .audit-content .club-mail-row{{width:100%!important;max-width:100%!important;}}
          #audit-result{{display:none!important;}}
          </style></head>
          <body><section id="menuShell" class="menu-shell audit-shell"><div class="menu-content"><div id="menuContent" class="audit-content"><section class="club-mail-client" data-mail-presentation="inline"><div class="club-mail-layout"><aside class="club-mail-column"><section class="club-mail-list">{rows}</section></aside></div></section></div></div></section><pre id="audit-result"></pre>
          <script>
          addEventListener('load',()=>{{
            const tolerance=1;
            const shell=document.getElementById('menuShell');
            const rows=[...document.querySelectorAll('[data-audit-state]')].map(row=>{{
              const state=row.dataset.auditState;
              const badge=row.querySelector('.club-mail-decision-badge,.club-mail-saved-badge,.club-mail-important');
              const copy=row.querySelector('.club-mail-row-copy');
              const rr=row.getBoundingClientRect();
              const br=badge.getBoundingClientRect();
              const cr=copy.getBoundingClientRect();
              const rs=getComputedStyle(row);
              const bs=getComputedStyle(badge);
              const requiredPadding=state==='decision'?95:51;
              return {{
                state,
                row:{{left:rr.left,right:rr.right,width:rr.width,clientWidth:row.clientWidth,scrollWidth:row.scrollWidth}},
                badge:{{left:br.left,right:br.right,top:br.top,bottom:br.bottom,width:br.width,position:bs.position,rightStyle:bs.right}},
                copy:{{left:cr.left,right:cr.right,width:cr.width}},
                paddingRight:parseFloat(rs.paddingRight)||0,
                inside:br.left>=rr.left+8-tolerance&&br.right<=rr.right-8+tolerance,
                separated:cr.right<=br.left-8+tolerance,
                centered:Math.abs((br.top+br.bottom)/2-(rr.top+rr.bottom)/2)<=2,
                noRowOverflow:row.scrollWidth<=row.clientWidth+1,
                absolute:bs.position==='absolute',
                inset:Math.abs((parseFloat(bs.right)||0)-12)<=1,
                reserved:(parseFloat(rs.paddingRight)||0)>=requiredPadding
              }};
            }});
            const result={{viewport:innerWidth,rows,shellNoOverflow:shell.scrollWidth<=shell.clientWidth+1,documentNoOverflow:document.documentElement.scrollWidth<=innerWidth+1}};
            document.getElementById('audit-result').textContent=JSON.stringify(result);
          }});
          </script></body></html>'''
          (root / '.mail-badge-audit.html').write_text(html, encoding='utf-8', newline='\n')
          PY

          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "No supported Chromium browser found on runner" | tee -a .github/diagnostics/12.228.txt
            exit 1
          fi
          echo "browser=${BROWSER}" | tee -a .github/diagnostics/12.228.txt

          for width in 1024 1280 1440 1920; do
            /tmp/release-step.sh "browser geometry ${width}px" "$BROWSER" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --allow-file-access-from-files \
              --run-all-compositor-stages-before-draw \
              --virtual-time-budget=1500 \
              --window-size="${width},900" \
              --dump-dom \
              "file://${GITHUB_WORKSPACE}/strikewatch-source/.mail-badge-audit.html" \
              > "/tmp/mail-badge-${width}.html"
            WIDTH="$width" python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import html
          import json
          import os

          width = os.environ['WIDTH']
          source = Path(f'/tmp/mail-badge-{width}.html').read_text(encoding='utf-8')

          class ResultParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside = False
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if dict(attrs).get('id') == 'audit-result':
                      self.inside = True
              def handle_endtag(self, tag):
                  if self.inside and tag == 'pre':
                      self.inside = False
              def handle_data(self, data):
                  if self.inside:
                      self.parts.append(data)

          parser = ResultParser()
          parser.feed(source)
          payload = html.unescape(''.join(parser.parts)).strip()
          if not payload:
              raise SystemExit(f'{width}px: browser audit result missing')
          result = json.loads(payload)
          assert result['shellNoOverflow'], result
          assert result['documentNoOverflow'], result
          assert len(result['rows']) == 3, result
          for row in result['rows']:
              for key in ('inside', 'separated', 'centered', 'noRowOverflow', 'absolute', 'inset', 'reserved'):
                  assert row[key], f'{width}px {row["state"]} failed {key}: {row}'
          print(json.dumps(result, indent=2))
          PY
          done
          rm strikewatch-source/.mail-badge-audit.html

      - name: Build second time and compare deterministic outputs
        run: |
          /tmp/release-step.sh "second build" bash -lc 'cd strikewatch-source && python3 build.py'
          /tmp/release-step.sh "compare development bundle" cmp /tmp/strikewatch.dev.first.js strikewatch-source/js/strikewatch.dev.js
          /tmp/release-step.sh "compare standalone" cmp /tmp/strikewatch-build-12.228.first.html strikewatch-source/dist/strikewatch-build-12.228.html
          /tmp/release-step.sh "compare size report" cmp /tmp/strikewatch-build-12.228-size.first.json strikewatch-source/dist/strikewatch-build-12.228-size.json
          /tmp/release-step.sh "compare CSS debt report" cmp /tmp/strikewatch-build-12.228-css-debt.first.json strikewatch-source/dist/strikewatch-build-12.228-css-debt.json

      - name: Publish verified standalone to root
        run: |
          cp strikewatch-source/dist/strikewatch-build-12.228.html cod.html
          /tmp/release-step.sh "root standalone byte identity" cmp strikewatch-source/dist/strikewatch-build-12.228.html cod.html

      - name: Remove temporary release files and successful diagnostics
        run: |
          rm .github/scripts/release-12.228.py
          rm .github/workflows/release-12.228.yml
          rm .github/triggers/release-12.228.txt
          rm -f .github/diagnostics/12.228.txt
          rm -f strikewatch-source/.mail-badge-audit.html

      - name: Commit finished release to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build 12.228: Desktop Inbox Badge Containment"
          git push origin HEAD:main

      - name: Commit failure ledger
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .github/diagnostics
          {
            echo
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "trigger_sha=${GITHUB_SHA}"
          } >> .github/diagnostics/12.228.txt
          git add .github/diagnostics/12.228.txt
          git commit -m "Record Build 12.228 release failure" || true
          git push origin HEAD:main || true
