name: Strikewatch 12.169 release

on:
  workflow_dispatch:
  page_build:

permissions:
  contents: write
  issues: write

concurrency:
  group: strikewatch-release-12-169
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require dedicated trigger
        id: trigger
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -f .github/release-triggers/12.169.txt ]; then
            echo "run_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run verified release
        if: steps.trigger.outputs.run_release == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/release-12-169.log) 2>&1
          report_failure() {
            status=$?
            if [ "$status" -ne 0 ]; then
              tail -c 50000 /tmp/release-12-169.log > /tmp/release-12-169-tail.log || true
              {
                echo 'The automated 12.169 release failed. Captured log:'
                echo
                echo '```text'
                cat /tmp/release-12-169-tail.log
                echo '```'
              } > /tmp/release-12-169-issue.md
              gh issue create --title 'STRIKEWATCH 12.169 RELEASE FAILURE' --body-file /tmp/release-12-169-issue.md || true
            fi
            exit "$status"
          }
          trap report_failure EXIT

          python3 .github/scripts/release-12-169.py
          cd strikewatch-source
          python3 -m py_compile build.py
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.169.html dist/strikewatch-build-12.169-size.json dist/strikewatch-build-12.169-css-debt.json > /tmp/build-a.sha
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.169.html dist/strikewatch-build-12.169-size.json dist/strikewatch-build-12.169-css-debt.json > /tmp/build-b.sha
          diff -u /tmp/build-a.sha /tmp/build-b.sha
          for file in js/[0-9][0-9]-*.js js/strikewatch.dev.js; do
            node --check "$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          root = Path('.')
          html = (root / 'dist/strikewatch-build-12.169.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          if not scripts:
              raise SystemExit('No inline standalone JavaScript found')
          Path('/tmp/strikewatch-12.169-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          game = (root / 'css/game.css').read_text(encoding='utf-8')
          armour = (root / 'css/armour-viewer.css').read_text(encoding='utf-8')
          markers = (
              'Build 12.142: armour viewer rotation pivot',
              'Build 12.152: every armour rig emits a pivot',
          )
          if any(marker in game for marker in markers):
              raise SystemExit('Armour viewer layer still exists in game.css')
          if any(armour.count(marker) != 1 for marker in markers):
              raise SystemExit('Armour viewer ownership marker missing or duplicated')
          required_rules = (
              '.career-armour-viewer-pivot',
              '.career-armour-inspector .career-armour-viewer-pivot',
              '.career-armour-inspector.dragging .career-armour-viewer-pivot',
              '.career-armour-inspector.auto-rotating .career-armour-viewer-pivot',
              'will-change: transform',
          )
          if any(rule not in armour for rule in required_rules):
              raise SystemExit('Armour viewer performance rule missing')
          if '<link rel="stylesheet" href="css/' in html:
              raise SystemExit('Standalone retained a development stylesheet link')
          report = json.loads((root / 'dist/strikewatch-build-12.169-css-debt.json').read_text(encoding='utf-8'))
          expected_order = [
              'game.css', 'armour-viewer.css', 'weapon-presentation.css',
              'loadout-stills.css', '12.161-audit-fixes.css',
              'armoury-inventory.css', 'compact-navigation.css',
          ]
          if report.get('stylesheet_order') != expected_order:
              raise SystemExit(f'Unexpected stylesheet order: {report}')
          if report.get('stylesheets') != 7 or report.get('owned_armour_viewer_lines', 0) < 20:
              raise SystemExit(f'Unexpected armour viewer ownership report: {report}')
          if not report.get('within_budget') or report.get('game_css_lines', 999999) > 31430:
              raise SystemExit(f'CSS debt budget failed: {report}')
          bundle = (root / 'js/strikewatch.dev.js').read_text(encoding='utf-8')
          hooks = (
              'syncCareerArmourViewerTransform',
              'armour3dPresentationForTest',
              'armourSystemForTest',
              'loadoutStillForTest',
          )
          if any(hook not in bundle for hook in hooks):
              raise SystemExit('Expected armour/loadout regression hook missing')
          print(json.dumps(report, indent=2))
          PY
          node --check /tmp/strikewatch-12.169-inline.js
          cp dist/strikewatch-build-12.169.html ../cod.html
          cmp -s ../cod.html dist/strikewatch-build-12.169.html
          cd ..
          rm -f .github/scripts/release-12-169.py .github/workflows/release-12-169.yml .github/release-triggers/12.169.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add strikewatch-source cod.html .github
          git commit -m 'Build 12.169: establish armour viewer CSS ownership'
          git push origin HEAD:main
