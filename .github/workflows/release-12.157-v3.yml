name: Release Strikewatch 12.157 v3

on:
  pull_request:
    types: [closed]
    paths:
      - '.github/release-12.157-v3-trigger'

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/operator-depth-mobile-armoury-12.157
          fetch-depth: 0

      - name: Verify and apply reviewed source
        shell: bash
        run: |
          set -euo pipefail
          echo '29698f0b5506616a40c69677422a48f68ebb46ccf8865d4b67822a76593c7fc7  .github/build-12.157.patch.gz.b64.part.00' | sha256sum -c -
          echo 'b4b4f0e82da18a54c189c1a012befea10e650da4d315ae9a8bad99a46c32cc6f  .github/build-12.157.patch.gz.b64.part.01' | sha256sum -c -
          echo 'cae228999f0925f147c25ede236b1620948ab4a7b066f43e01ae49533a6b15a1  .github/build-12.157.patch.gz.b64.part.02' | sha256sum -c -
          echo '101a05323039942f87a1e59582fa5b0b989c5636ba84a9400a9805f0951e279e  .github/build-12.157.patch.gz.b64.part.03' | sha256sum -c -
          echo '2f29b66e5e3a0a336e7a6db2e103c3f66175f0e548f3544700043b8c43351a9a  .github/build-12.157.patch.gz.b64.part.04' | sha256sum -c -
          echo '9e5bf25a20f5b359985cdfa291369ff2a16b1b82a817a6ac58b2ad73470e5260  .github/build-12.157.patch.gz.b64.part.05' | sha256sum -c -
          cat .github/build-12.157.patch.gz.b64.part.* | base64 --decode | gzip --decompress > /tmp/build-12.157.patch
          git apply --check /tmp/build-12.157.patch
          git apply /tmp/build-12.157.patch
          rm -f .github/build-12.157.patch.b64.* .github/build-12.157.patch.gz.b64 .github/build-12.157.patch.gz.b64.part.*

      - name: Build and verify
        shell: bash
        run: |
          set -euo pipefail
          cd strikewatch-source
          python3 -m py_compile build.py
          python3 build.py
          for file in js/*.js; do node --check "$file"; done
          node --check js/strikewatch.dev.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('dist/strikewatch-build-12.157.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if not scripts: raise SystemExit('No inline application script found')
          Path('/tmp/inline.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/inline.js
          cp js/strikewatch.dev.js /tmp/bundle-first.js
          cp dist/strikewatch-build-12.157.html /tmp/standalone-first.html
          python3 build.py
          cmp -s /tmp/bundle-first.js js/strikewatch.dev.js
          cmp -s /tmp/standalone-first.html dist/strikewatch-build-12.157.html
          test "$(sha256sum js/strikewatch.dev.js | cut -d' ' -f1)" = 'bf9d42abc2592c721c71348b660dc9c4b5c6377b5389273a64385a7f32f23b70'
          test "$(sha256sum dist/strikewatch-build-12.157.html | cut -d' ' -f1)" = 'a1a1dbfc4a40bc865e99812f161c98113c4f830557d92048a93c770cdb170e17'
          cp dist/strikewatch-build-12.157.html ../cod.html
          cmp -s dist/strikewatch-build-12.157.html ../cod.html

      - name: Verify release invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('strikewatch-source')
          renderer=(root/'js/62-character-renderer.js').read_text()
          css=(root/'css/game.css').read_text()
          core=(root/'js/00-core.js').read_text()
          index=(root/'index.html').read_text()
          for token in ['OPERATOR_AMBIENT_OCCLUSION','operatorAmbientOcclusionAudit','additionalDrawCalls: 0','additionalMeshes: 0','additionalTextures: 0','additionalShaderPasses: 0','sharedLivingAndCorpsePalette: true']:
              assert token in renderer, token
          for token in ['Build 12.157: compact Armoury inventory reflow','grid-template-areas:','writing-mode: horizontal-tb','#menuContent .career-inventory-compare']:
              assert token in css, token
          for token in ["const BUILD_VERSION = '12.157'", "const BUILD_NAME = 'Operator Depth'", "const BUILD_ID = '12.157.0-operator-depth'"]:
              assert token in core, token
          for token in ['Strikewatch 12.157: Operator Depth','>12.157</b>','12.157.0-operator-depth']:
              assert token in index, token
          counts={'drawMesh':len(re.findall(r'\bdrawMesh\s*\(',renderer)),'drawAnatomicalSegment':len(re.findall(r'\bdrawAnatomicalSegment\s*\(',renderer)),'drawSegment':len(re.findall(r'\bdrawSegment\s*\(',renderer))}
          assert counts=={'drawMesh':95,'drawAnatomicalSegment':14,'drawSegment':3}, counts
          print(counts)
          PY

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build 12.157: add operator depth and repair mobile Armoury'
          git push origin HEAD:agent/operator-depth-mobile-armoury-12.157
