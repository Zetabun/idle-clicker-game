name: Verify Kerbside production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - bus.html
      - kerbside-backend/**
      - .github/workflows/deploy-kerbside-worker.yml
      - .github/workflows/verify-kerbside-production.yml
  workflow_run:
    workflows:
      - Deploy Kerbside Worker
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: kerbside-production-smoke
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out expected production source
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install live browser smoke dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          cd kerbside-backend
          npx playwright install --with-deps webkit

      - name: Verify live app, Worker and local map assets
        shell: bash
        env:
          APP_URL: https://zetabun.github.io/idle-clicker-game/bus.html
          WORKER_URL: https://kerbside-bus.adambullas.workers.dev/health
          WORKER_FEED_URL: https://kerbside-bus.adambullas.workers.dev/feed
          LEAFLET_JS_URL: https://zetabun.github.io/idle-clicker-game/kerbside-backend/vendor/leaflet/leaflet.js
          LEAFLET_CSS_URL: https://zetabun.github.io/idle-clicker-game/kerbside-backend/vendor/leaflet/leaflet.css
          EXPECTED_LEAFLET_JS_HASH: 20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=
          EXPECTED_LEAFLET_CSS_HASH: p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=
        run: |
          set -euo pipefail

          expected_version="$(sed -n "s/^const APP_VERSION = '\([^']*\)';$/\1/p" bus.html)"
          if [[ -z "$expected_version" ]]; then
            echo "::error::Could not read APP_VERSION from bus.html"
            exit 1
          fi

          # A version string cannot tell two builds apart when both carry it, and
          # three different bus.html contents shipped as 0.6.85. GitHub Pages serves
          # this file byte for byte, so compare the deployed bytes against the ones
          # this commit contains: that is the only check proving the fixes under test
          # are the ones actually live.
          expected_app_hash="$(sha256sum bus.html | cut -d' ' -f1)"
          echo "Expecting Kerbside $expected_version, bus.html sha256 $expected_app_hash"

          app_file="$(mktemp)"
          worker_file="$(mktemp)"
          feed_file="$(mktemp)"
          leaflet_js="$(mktemp)"
          leaflet_css="$(mktemp)"
          trap 'rm -f "$app_file" "$worker_file" "$feed_file" "$leaflet_js" "$leaflet_css"' EXIT

          deployed=false
          for attempt in $(seq 1 36); do
            cache_buster="smoke=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            app_ok=false
            worker_ok=false

            if curl --fail --location --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              -H 'Cache-Control: no-cache' \
              "$APP_URL?$cache_buster" -o "$app_file"; then
              deployed_app_hash="$(sha256sum "$app_file" | cut -d' ' -f1)"
              if [[ "$deployed_app_hash" == "$expected_app_hash" ]]; then
                app_ok=true
              fi
            fi

            if curl --fail --location --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              -H 'Cache-Control: no-cache' \
              "$WORKER_URL?$cache_buster" -o "$worker_file"; then
              if jq -e --arg version "$expected_version" \
                '.ok == true and .version == $version and .bods == true' \
                "$worker_file" >/dev/null; then
                worker_ok=true
              fi
            fi

            if [[ "$app_ok" == true && "$worker_ok" == true ]]; then
              deployed=true
              echo "Kerbside app and Worker both report $expected_version."
              break
            fi

            echo "Attempt $attempt: app=$app_ok worker=$worker_ok; waiting for deployment convergence."
            sleep 10
          done

          if [[ "$deployed" != true ]]; then
            echo "::error::Production did not converge on Kerbside $expected_version within the smoke-test window."
            echo "App version line:"
            grep -F 'const APP_VERSION' "$app_file" || true
            echo "Expected bus.html sha256: $expected_app_hash"
            echo "Deployed bus.html sha256: $(sha256sum "$app_file" | cut -d' ' -f1)"
            echo "A matching version with a differing hash means Pages is still serving an older build of the same version."
            echo "Worker response:"
            cat "$worker_file" || true
            exit 1
          fi

          feed_cache_buster="smoke=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-feed"
          curl --fail --location --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            -H 'Cache-Control: no-cache' \
            "$WORKER_FEED_URL?bbox=-2.15000,52.45000,-2.05000,52.55000&$feed_cache_buster" -o "$feed_file"
          python3 - "$feed_file" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]
          try:
              root = ET.parse(path).getroot()
          except Exception as exc:
              raise SystemExit(f"::error::Production Worker feed is not valid XML: {exc}")

          local = lambda tag: tag.rsplit('}', 1)[-1]
          names = {local(node.tag) for node in root.iter()}
          if local(root.tag) != 'Siri' or 'VehicleMonitoringDelivery' not in names:
              raise SystemExit('::error::Production Worker feed is not a SIRI vehicle-monitoring document')
          print('Production Worker returned valid SIRI vehicle-monitoring XML.')
          PY

          cache_buster="smoke=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-assets"
          curl --fail --location --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            -H 'Cache-Control: no-cache' \
            "$LEAFLET_JS_URL?$cache_buster" -o "$leaflet_js"
          curl --fail --location --silent --show-error \
            --connect-timeout 10 --max-time 25 \
            -H 'Cache-Control: no-cache' \
            "$LEAFLET_CSS_URL?$cache_buster" -o "$leaflet_css"

          actual_js_hash="$(openssl dgst -sha256 -binary "$leaflet_js" | base64 -w 0)"
          actual_css_hash="$(openssl dgst -sha256 -binary "$leaflet_css" | base64 -w 0)"
          if [[ "$actual_js_hash" != "$EXPECTED_LEAFLET_JS_HASH" ]]; then
            echo "::error::Production Leaflet JavaScript hash mismatch: $actual_js_hash"
            exit 1
          fi
          if [[ "$actual_css_hash" != "$EXPECTED_LEAFLET_CSS_HASH" ]]; then
            echo "::error::Production Leaflet CSS hash mismatch: $actual_css_hash"
            exit 1
          fi

          grep -Fq 'kerbside-backend/vendor/leaflet/leaflet.js' "$app_file"
          grep -Fq 'kerbside-backend/vendor/leaflet/leaflet.css' "$app_file"
          if grep -Fq 'cdnjs.cloudflare.com/ajax/libs/leaflet' "$app_file"; then
            echo "::error::Production app still contains the retired cdnjs Leaflet dependency."
            exit 1
          fi

          echo "Production source and Worker verification passed for Kerbside $expected_version."

      - name: Open the live GitHub Pages app in WebKit
        shell: bash
        env:
          APP_URL: https://zetabun.github.io/idle-clicker-game/bus.html
        run: |
          set -euo pipefail
          expected_version="$(sed -n "s/^const APP_VERSION = '\([^']*\)';$/\1/p" bus.html)"
          cd kerbside-backend
          EXPECTED_VERSION="$expected_version" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { webkit } from 'playwright';

          const appUrl = process.env.APP_URL;
          const expectedVersion = process.env.EXPECTED_VERSION;
          const cacheBuster = `browser-smoke=${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`;
          const target = `${appUrl}?${cacheBuster}`;
          const productionOrigin = new URL(appUrl).origin;
          const browser = await webkit.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 393, height: 852 },
            isMobile: true,
            hasTouch: true,
            timezoneId: 'Europe/London'
          });
          const page = await context.newPage();
          const pageErrors = [];
          const localFailures = [];

          page.on('pageerror', error => pageErrors.push(error.message));
          page.on('response', response => {
            const url = new URL(response.url());
            if (url.origin === productionOrigin && response.status() >= 400) {
              localFailures.push(`${response.status()} ${url.pathname}`);
            }
          });
          page.on('requestfailed', request => {
            const url = new URL(request.url());
            if (url.origin === productionOrigin) {
              localFailures.push(`request failed ${url.pathname}: ${request.failure()?.errorText || 'unknown'}`);
            }
          });

          try {
            await page.goto(target, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.locator('#map.leaflet-container').waitFor({ state: 'visible', timeout: 30000 });
            await page.locator('#setBtn').waitFor({ state: 'visible', timeout: 10000 });
            await page.waitForTimeout(2500);

            assert.match(await page.content(), new RegExp(`const APP_VERSION = '${expectedVersion.replaceAll('.', '\\.')}'`));
            const liveState = await page.evaluate(() => {
              const icon = document.querySelector('.brand-icon');
              const topbar = document.getElementById('topbar');
              return {
                overflow: document.documentElement.scrollWidth - window.innerWidth,
                iconLoaded: Boolean(icon && icon.complete && icon.naturalWidth > 0 && icon.naturalHeight > 0),
                settingsVisible: Boolean(document.getElementById('setBtn')?.getBoundingClientRect().width),
                topbarVisible: Boolean(topbar?.getBoundingClientRect().height),
                localAssets: [...new Set([...document.querySelectorAll('img[src],script[src],link[href],source[src]')]
                  .map(element => element.getAttribute('src') || element.getAttribute('href'))
                  .filter(Boolean)
                  .map(value => new URL(value, location.href))
                  .filter(url => url.origin === location.origin && (url.protocol === 'http:' || url.protocol === 'https:'))
                  .map(url => url.href))]
              };
            });

            assert.ok(liveState.overflow <= 1, `Live mobile page overflows by ${liveState.overflow}px`);
            assert.equal(liveState.iconLoaded, true, 'Live brand icon did not load');
            assert.equal(liveState.settingsVisible, true, 'Live Settings control is not visible');
            assert.equal(liveState.topbarVisible, true, 'Live header is not visible');

            for (const asset of liveState.localAssets) {
              const response = await context.request.get(asset, { headers: { 'Cache-Control': 'no-cache' }, timeout: 25000 });
              assert.ok(response.ok(), `Local production asset failed: ${response.status()} ${asset}`);
            }

            await page.locator('#setBtn').click();
            await page.locator('#scrim.show').waitFor({ state: 'visible', timeout: 10000 });
            assert.deepEqual(pageErrors, []);
            assert.deepEqual(localFailures, []);
            console.log(`Live WebKit smoke passed for Kerbside ${expectedVersion} with ${liveState.localAssets.length} local assets.`);
          } finally {
            await browser.close();
          }
          NODE
