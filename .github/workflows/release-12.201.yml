name: Release 12.201

on:
  push:
    branches: [main]
    paths:
      - .github/triggers/release-12.201.txt

permissions:
  contents: write

concurrency:
  group: release-build-12-201
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply, build and verify Build 12.201
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/release-12.201.log) 2>&1

          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {
              'version': '12.200',
              'name': 'Single-Source Management Prompts',
              'build_id': '12.200.0-single-source-management-prompts',
          }
          actual = json.loads(Path('strikewatch-source/RELEASE.json').read_text(encoding='utf-8'))
          if actual != expected:
              raise SystemExit(f'Unexpected predecessor release: {actual!r}')
          print('Predecessor release verified:', actual)
          PY

          python3 -m py_compile .github/scripts/release-12.201.py
          python3 .github/scripts/release-12.201.py

          python3 - <<'PY'
          from pathlib import Path
          path = Path('strikewatch-source/css/compact-navigation.css')
          text = path.read_text(encoding='utf-8')
          text = text.replace('@media (max-width: 1023px) {\n  #menuContent.has-urgent-management-action', '#menuContent.has-urgent-management-action', 1)
          text = text.replace('  .club-must-respond-body > header small {\n    max-width: 52ch;\n  }\n}\n\n@media (orientation: portrait) and (max-width: 430px) {', '  .club-must-respond-body > header small {\n    max-width: 52ch;\n  }', 1)
          tail = '  .club-must-respond-body > header small {\n    display: none;\n  }\n}\n'
          if not text.endswith(tail):
              raise SystemExit('Build 12.201 CSS budget-normalisation tail anchor missing')
          text = text[:-len(tail)] + '  .club-must-respond-body > header small {\n    display: none;\n  }\n'
          path.write_text(text, encoding='utf-8')
          PY

          cd strikewatch-source
          python3 -m py_compile build.py
          python3 build.py
          sha256sum \
            js/strikewatch.dev.js \
            dist/strikewatch-build-12.201.html \
            dist/strikewatch-build-12.201-size.json \
            dist/strikewatch-build-12.201-css-debt.json \
            > /tmp/build-12.201-first.sha256

          for file in js/*.js; do node --check "$file"; done
          node --check js/strikewatch.dev.js

          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          html = Path('dist/strikewatch-build-12.201.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit('No inline JavaScript found in standalone')
          for script in scripts:
              with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as handle:
                  handle.write(script)
                  temp = handle.name
              subprocess.run(['node', '--check', temp], check=True)
          print(f'Parsed {len(scripts)} standalone inline script block(s)')
          PY

          python3 build.py
          sha256sum \
            js/strikewatch.dev.js \
            dist/strikewatch-build-12.201.html \
            dist/strikewatch-build-12.201-size.json \
            dist/strikewatch-build-12.201-css-debt.json \
            > /tmp/build-12.201-second.sha256
          diff -u /tmp/build-12.201-first.sha256 /tmp/build-12.201-second.sha256
          cd ..

          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          src = root / 'strikewatch-source'
          release = json.loads((src / 'RELEASE.json').read_text(encoding='utf-8'))
          expected = {
              'version': '12.201',
              'name': 'Mobile Action Hierarchy',
              'build_id': '12.201.0-mobile-action-hierarchy',
          }
          if release != expected:
              raise SystemExit(f'Unexpected completed release metadata: {release!r}')
          operations = (src / 'js/39-club-operations.js').read_text(encoding='utf-8')
          ui = (src / 'js/50-ui-menus.js').read_text(encoding='utf-8')
          css = (src / 'css/compact-navigation.css').read_text(encoding='utf-8')
          required = [
              ('operations', '<details class="club-must-respond-strip"' in operations),
              ('urgent rank', 'data-management-action-rank="urgent"' in operations),
              ('urgent class', 'has-urgent-management-action' in ui),
              ('recommended class', 'has-recommended-management-action' in ui),
              ('compact hierarchy css', 'Build 12.201: compact management action hierarchy' in css),
          ]
          missing = [name for name, passed in required if not passed]
          if missing:
              raise SystemExit(f'Missing Build 12.201 source anchors: {missing!r}')
          standalone = src / 'dist/strikewatch-build-12.201.html'
          cod = root / 'cod.html'
          cod.write_bytes(standalone.read_bytes())
          if cod.read_bytes() != standalone.read_bytes():
              raise SystemExit('cod.html is not byte-identical to the verified standalone')
          print('Build 12.201 source, deterministic build and artifact gates passed')
          PY

          rm -f .github/release-12.201-failure.log
          rm -f .github/scripts/release-12.201.py
          rm -f .github/workflows/release-12.201.yml
          rm -f .github/triggers/release-12.201.txt

          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Build 12.201: Mobile Action Hierarchy"
          git push origin main

      - name: Publish failure ledger
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          git reset --hard HEAD
          {
            printf '%s\n' \
              'Build 12.201 workflow failed.' \
              "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              "Commit: $GITHUB_SHA"
            if test -f /tmp/release-12.201.log; then
              cat /tmp/release-12.201.log
            else
              printf '%s\n' 'Build failed before the release log was initialised.'
            fi
          } > .github/release-12.201-failure.log
          git add .github/release-12.201-failure.log
          git commit -m "Record Build 12.201 release failure"
          git push origin main
