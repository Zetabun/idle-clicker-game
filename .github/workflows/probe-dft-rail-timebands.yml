name: Probe DfT rail time bands

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-dft-rail-timebands.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download and inspect official DfT ODS tables
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 'https://assets.publishing.service.gov.uk/media/6a5e4dfa24d44672cf1b4644/rai0202.ods' -o /tmp/rai0202.ods
          curl -fsSL --retry 3 'https://assets.publishing.service.gov.uk/media/6a5e4da7c7c34404041b463b/rai0203.ods' -o /tmp/rai0203.ods
          python3 - <<'PY'
          import zipfile, xml.etree.ElementTree as ET
          NS={'table':'urn:oasis:names:tc:opendocument:xmlns:table:1.0','text':'urn:oasis:names:tc:opendocument:xmlns:text:1.0'}
          def text(cell):
            return ' '.join(''.join(p.itertext()).strip() for p in cell.findall('.//text:p',NS) if ''.join(p.itertext()).strip())
          def rows(path,sheet_name):
            with zipfile.ZipFile(path) as z: root=ET.fromstring(z.read('content.xml'))
            sheet=next(s for s in root.findall('.//table:table',NS) if s.attrib.get('{%s}name'%NS['table'])==sheet_name)
            out=[]
            for row in sheet.findall('table:table-row',NS):
              values=[]
              for cell in row.findall('table:table-cell',NS):
                repeat=int(cell.attrib.get('{%s}number-columns-repeated'%NS['table'],'1'))
                values.extend([text(cell)]*min(repeat,30))
              while values and not values[-1]: values.pop()
              if values: out.append(values)
            return out
          for path,sheet,label in [('/tmp/rai0202.ods','RAI0202','CITIES'),('/tmp/rai0203.ods','RAI0203','STATIONS')]:
            data=rows(path,sheet)
            header=next(r for r in data if r and r[0]=='Year')
            print(label,'HEADER',repr(header))
            current=[r for r in data if len(r)>4 and r[0].startswith('2025')]
            entities=sorted({r[2] for r in current})
            print(label,'2025 ENTITIES',repr(entities))
            print(label,'2025 ROWS',len(current))
            for entity in entities:
              sample=[r for r in current if r[2]==entity and r[1]=='Departures' and r[3]=='Passengers']
              if sample: print(label,entity,'DEPARTURES',repr(sample[0][:23]))
          PY
