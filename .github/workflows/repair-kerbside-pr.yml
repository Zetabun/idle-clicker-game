name: Validate Kerbside repair branch

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/repair-kerbside-pr.yml
      - .github/workflows/fix-kerbside-loop-timeout-v3.yml

permissions:
  contents: write

concurrency:
  group: validate-kerbside-repair-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run source-aware repair and full validation
        id: validation
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e '
            workflow = YAML.load_file(".github/workflows/fix-kerbside-loop-timeout-v3.yml")
            steps = workflow.fetch("jobs").fetch("validate-and-publish").fetch("steps")
            step = steps.find { |item| item["name"] == "Apply fixes and run validation" }
            abort "Repair validation step not found" unless step && step["run"]
            print step["run"]
          ' > /tmp/run-kerbside-validation.sh
          bash /tmp/run-kerbside-validation.sh

      - name: Commit validated repair to branch
        if: steps.validation.outputs.exit_code == '0'
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-kerbside-pr.yml
          rm -f .github/workflows/fix-kerbside-loop-timeout-v3.yml
          rm -f .github/failures/kerbside-loop-timeout.log .github/failures/kerbside-v3-status.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Kerbside 0.6.86: repair tracking correctness' \
            -m 'Keep circular-route vehicles attached to the repeated stop occurrence still ahead.' \
            -m 'Keep browser timeouts active through complete response bodies and run identity regressions in CI.' \
            -m 'Preserve ProducerRef as the vehicle owner fallback and add focused regression tests.'
          git push origin "HEAD:${HEAD_REF}"

      - name: Record branch validation failure
        if: steps.validation.outputs.exit_code != '0'
        env:
          EXIT_CODE: ${{ steps.validation.outputs.exit_code }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "origin/${HEAD_REF}"
          rm -f .github/workflows/repair-kerbside-pr.yml
          mkdir -p .github/failures
          {
            echo "Workflow run: $GITHUB_RUN_ID"
            echo "Validation exit code: $EXIT_CODE"
            echo
            cat /tmp/kerbside-validation.log
          } > .github/failures/kerbside-pr-validation.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record Kerbside repair branch validation failure'
          git push origin "HEAD:${HEAD_REF}"
