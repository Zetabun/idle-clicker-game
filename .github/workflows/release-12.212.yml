name: Release Build 12.212

on:
  push:
    paths:
      - '.github/triggers/release-12.212.txt'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply release patch
        run: python3 .github/scripts/release-12.212.py
      - name: Build twice deterministically
        working-directory: strikewatch-source
        run: |
          python3 build.py
          sha256sum dist/strikewatch-build-12.212.html > /tmp/build1.sha
          cp dist/strikewatch-build-12.212.html /tmp/build1.html
          python3 build.py
          sha256sum dist/strikewatch-build-12.212.html > /tmp/build2.sha
          cmp /tmp/build1.html dist/strikewatch-build-12.212.html
      - name: Parse JavaScript
        run: |
          node --check strikewatch-source/js/strikewatch.dev.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('strikewatch-source/dist/strikewatch-build-12.212.html').read_text()
          scripts='\n'.join(re.findall(r'<script>(.*?)</script>',html,re.S))
          Path('/tmp/standalone.js').write_text(scripts)
          PY
          node --check /tmp/standalone.js
      - name: Verify targeted changes
        run: |
          grep -q 'class="club-must-respond-strip" data-management-action-rank="urgent" aria-label="Actions required before ending the day"><summary>' strikewatch-source/js/39-club-operations.js
          ! grep -q 'aria-label="Actions required before ending the day" open><summary>' strikewatch-source/js/39-club-operations.js
          grep -q '12.212.0-collapsed-must-respond' strikewatch-source/RELEASE.json
      - name: Publish standalone
        run: |
          cp strikewatch-source/dist/strikewatch-build-12.212.html cod.html
          cmp cod.html strikewatch-source/dist/strikewatch-build-12.212.html
      - name: Remove temporary release files
        run: |
          rm -f .github/scripts/release-12.212.py .github/workflows/release-12.212.yml .github/triggers/release-12.212.txt
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build 12.212: Collapsed Must Respond'
          git push
