name: Strikewatch 12.165 release

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths: ['.github/release-triggers/12.165.txt']

permissions:
  contents: write

env:
  RELEASE_ATTEMPT: pull-request-closed

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply release patch
        run: python3 .github/scripts/release-12-165.py

      - name: Build twice and verify deterministic artifacts
        working-directory: strikewatch-source
        run: |
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.165.html dist/strikewatch-build-12.165-size.json dist/strikewatch-build-12.165-css-debt.json > /tmp/build-a.sha
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.165.html dist/strikewatch-build-12.165-size.json dist/strikewatch-build-12.165-css-debt.json > /tmp/build-b.sha
          diff -u /tmp/build-a.sha /tmp/build-b.sha

      - name: Parse JavaScript and verify CSS ownership
        run: |
          echo "Release attempt: $RELEASE_ATTEMPT"
          for file in strikewatch-source/js/[0-9][0-9]-*.js strikewatch-source/js/strikewatch.dev.js; do
            node --check "$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          root = Path('strikewatch-source')
          html = (root / 'dist/strikewatch-build-12.165.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          if not scripts:
              raise SystemExit('No inline standalone JavaScript found')
          Path('/tmp/strikewatch-12.165-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          game = (root / 'css/game.css').read_text(encoding='utf-8')
          compact = (root / 'css/compact-navigation.css').read_text(encoding='utf-8')
          if 'Build 12.163: compact navigator and alert alignment' in game:
              raise SystemExit('Compact navigation layer still exists in game.css')
          if compact.count('Build 12.163: compact navigator and alert alignment') != 1:
              raise SystemExit('Compact navigation ownership marker missing or duplicated')
          report = json.loads((root / 'dist/strikewatch-build-12.165-css-debt.json').read_text(encoding='utf-8'))
          if not report.get('within_budget'):
              raise SystemExit(f'CSS debt budget failed: {report}')
          if report['game_css_lines'] > 31700:
              raise SystemExit(f'game.css remains above budget: {report}')
          print(json.dumps(report, indent=2))
          PY
          node --check /tmp/strikewatch-12.165-inline.js

      - name: Publish verified release
        run: |
          cp strikewatch-source/dist/strikewatch-build-12.165.html cod.html
          cmp -s cod.html strikewatch-source/dist/strikewatch-build-12.165.html
          rm -f .github/scripts/release-12-165.py .github/workflows/release-12-165.yml .github/release-triggers/12.165.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add strikewatch-source cod.html .github/scripts/release-12-165.py .github/workflows/release-12-165.yml .github/release-triggers/12.165.txt
          git commit -m 'Build 12.165: establish CSS ownership baseline'
          git push origin main
