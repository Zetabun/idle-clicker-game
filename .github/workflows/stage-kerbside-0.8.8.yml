name: Stage Kerbside 0.8.8

on:
  push:
    branches:
      - kerbside-0.8.8-coach-guidance
    paths:
      - .github/triggers/stage-kerbside-0.8.8.txt

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Apply 0.8.8 candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/release-kerbside-0.8.8-coach-guidance.py
          python3 .github/scripts/stage-kerbside-0.8.8-coach-guidance.py
          python3 .github/scripts/sync-version.py --check
          node --check kerbside-train-loading.js
          git diff --check

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          npm run vendor:leaflet --prefix kerbside-backend
          if git ls-files --error-unmatch kerbside-backend/vendor/leaflet/leaflet.js >/dev/null 2>&1; then
            git diff --exit-code -- kerbside-backend/vendor/leaflet
          fi
          cd kerbside-backend
          npx playwright install --with-deps webkit chromium

      - name: Run deterministic and backend tests
        shell: bash
        run: |
          set -euo pipefail
          node --check build-timetable.js
          npm run check --prefix kerbside-backend
          npm test --prefix kerbside-backend

      - name: Run WebKit full gate
        shell: bash
        run: |
          set -euo pipefail
          npm run test:browser --prefix kerbside-backend
          npm run test:train --prefix kerbside-backend
          npm run test:train-route --prefix kerbside-backend
          npm run test:identity --prefix kerbside-backend
          npm run test:multi-vehicle --prefix kerbside-backend
          npm run test:audit --prefix kerbside-backend
          npm run test:accuracy-hardening --prefix kerbside-backend --if-present
          npm run test:stop-side --prefix kerbside-backend --if-present
          npm run test:journey-identity --prefix kerbside-backend --if-present
          npm run test:disruptions --prefix kerbside-backend --if-present
          npm run test:listing-reliability --prefix kerbside-backend --if-present

      - name: Run Chromium full gate
        shell: bash
        env:
          KERBSIDE_BROWSER: chromium
        run: |
          set -euo pipefail
          npm run test:browser --prefix kerbside-backend
          npm run test:train --prefix kerbside-backend
          npm run test:train-route --prefix kerbside-backend
          npm run test:identity --prefix kerbside-backend
          npm run test:multi-vehicle --prefix kerbside-backend
          npm run test:audit --prefix kerbside-backend
          npm run test:accuracy-hardening --prefix kerbside-backend --if-present
          npm run test:stop-side --prefix kerbside-backend --if-present
          npm run test:journey-identity --prefix kerbside-backend --if-present
          npm run test:disruptions --prefix kerbside-backend --if-present
          npm run test:listing-reliability --prefix kerbside-backend --if-present

      - name: Publish tested candidate to staging branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kerbside-backend/node_modules
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION bus.html kerbside-trains.css kerbside-train-loading.js \
            kerbside-backend/src/worker.js kerbside-backend/package.json \
            kerbside-backend/test/worker.test.js kerbside-backend/test/train-live-loading.test.mjs \
            kerbside-backend/tests/browser-regression.mjs kerbside-backend/wrangler.toml
          git diff --cached --check
          git commit -m 'Kerbside 0.8.8 validated coach guidance candidate'
          git push origin HEAD:kerbside-0.8.8-coach-guidance
