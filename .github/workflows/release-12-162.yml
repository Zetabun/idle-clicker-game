name: Strikewatch 12.162 release

on:
  push:
    branches: [main]
    paths: ['.github/release-triggers/12.162.txt']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed source patch
        run: python3 .github/scripts/release-12-162.py

      - name: Build twice and verify determinism
        working-directory: strikewatch-source
        run: |
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.162.html > /tmp/build-a.sha
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.162.html > /tmp/build-b.sha
          diff -u /tmp/build-a.sha /tmp/build-b.sha

      - name: Parse JavaScript
        run: |
          for file in strikewatch-source/js/[0-9][0-9]-*.js strikewatch-source/js/strikewatch.dev.js; do
            node --check "$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('strikewatch-source/dist/strikewatch-build-12.162.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          if not scripts:
              raise SystemExit('No inline standalone script found')
          Path('/tmp/strikewatch-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/strikewatch-inline.js

      - name: Verify conservative culling contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math
          core = Path('strikewatch-source/js/60-renderer-core.js').read_text(encoding='utf-8')
          actors = Path('strikewatch-source/js/62-character-renderer.js').read_text(encoding='utf-8')
          tests = Path('strikewatch-source/js/79-save-checkpoints.js').read_text(encoding='utf-8')
          for token in ['DYNAMIC_ACTOR_CULLING_ENABLED', 'function dynamicActorOutsideCameraView', 'dynamicActorCandidates', 'dynamicActorsCulled', "get('dynamicCulling') !== '0'"]:
              if token not in core:
                  raise SystemExit(f'Missing renderer contract token: {token}')
          if actors.count('dynamicActorOutsideCameraView(bot.x') != 2:
              raise SystemExit('Living and corpse culling calls are not both present')
          if actors.count(', 1.85)) return;') != 2:
              raise SystemExit('Conservative radius mismatch')
          if 'dynamicActorCullingForTest' not in tests:
              raise SystemExit('Diagnostic hook missing')
          fovy = math.pi / 3
          aspect = 16 / 9
          hs = aspect * math.tan(fovy / 2)
          vs = math.tan(fovy / 2)
          radius = 1.85
          far = 46
          def outside(x, y, z):
              depth = -z
              result = depth + radius < 0.025 or depth - radius > far
              if not result:
                  result = abs(x) > depth * hs + radius * math.hypot(1, hs) or abs(y - 1) > depth * vs + radius * math.hypot(1, vs)
              return result
          cases = {
              'centred': outside(0, 1, -6),
              'edge': outside(5, 1, -6),
              'behind': outside(0, 1, 6),
              'side': outside(30, 1, -6),
              'far': outside(0, 1, -50),
          }
          expected = {'centred': False, 'edge': False, 'behind': True, 'side': True, 'far': True}
          if cases != expected:
              raise SystemExit(f'Culling maths failed: {cases}')
          print(cases)
          PY

      - name: Publish release
        run: |
          cp strikewatch-source/dist/strikewatch-build-12.162.html cod.html
          cmp -s cod.html strikewatch-source/dist/strikewatch-build-12.162.html
          rm -f .github/workflows/release-12-162.yml .github/scripts/release-12-162.py .github/release-triggers/12.162.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build 12.162: cull invisible operator geometry'
          git push origin main
