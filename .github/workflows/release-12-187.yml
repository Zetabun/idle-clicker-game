name: Release Strikewatch 12.187

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/release-12-187.txt'

permissions:
  contents: write

concurrency:
  group: release-strikewatch-12-187
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out marked revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify predecessor and release inputs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {
              'version': '12.186',
              'name': 'Accurate Storage Reporting',
              'build_id': '12.186.0-accurate-storage-reporting',
          }
          actual = json.loads(Path('strikewatch-source/RELEASE.json').read_text(encoding='utf-8'))
          if actual != expected:
              raise SystemExit(f'Predecessor guard failed: expected {expected}, got {actual}')
          for path in (
              Path('.github/scripts/release-12-187.py'),
              Path('.github/workflows/release-12-187.yml'),
              Path('.github/triggers/release-12-187.txt'),
          ):
              if not path.is_file():
                  raise SystemExit(f'Missing release input: {path}')
          PY

      - name: Apply release patch
        run: python3 .github/scripts/release-12-187.py

      - name: Verify canonical release metadata
        run: |
          grep -F "const BUILD_VERSION = '12.187'" strikewatch-source/js/00-core.js
          grep -F "const BUILD_NAME = 'Report XP Safety'" strikewatch-source/js/00-core.js
          grep -F "const BUILD_ID = '12.187.0-report-xp-safety'" strikewatch-source/js/00-core.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {
              'version': '12.187',
              'name': 'Report XP Safety',
              'build_id': '12.187.0-report-xp-safety',
          }
          release = json.loads(Path('strikewatch-source/RELEASE.json').read_text(encoding='utf-8'))
          if release != expected:
              raise SystemExit(f'Release metadata mismatch: {release}')
          index = Path('strikewatch-source/index.html').read_text(encoding='utf-8')
          required = (
              '<title>Strikewatch 12.187: Report XP Safety</title>',
              '12.187.0-report-xp-safety',
              'id="managerBuildVersion">12.187</b>',
              'id="mobileCommandBuildVersion">12.187</b>',
          )
          missing = [token for token in required if token not in index]
          if missing:
              raise SystemExit(f'Canonical development shell mismatch: {missing}')
          if '12.186.0-accurate-storage-reporting' in index:
              raise SystemExit('Old development cache key remains in index.html')
          PY

      - name: Compile build script
        working-directory: strikewatch-source
        run: python3 -m py_compile build.py

      - name: Build first deterministic candidate
        working-directory: strikewatch-source
        run: |
          python3 build.py
          test -f dist/strikewatch-build-12.187.html
          test -f dist/strikewatch-build-12.187-size.json
          test -f dist/strikewatch-build-12.187-css-debt.json
          cp js/strikewatch.dev.js /tmp/strikewatch.dev.first.js
          cp dist/strikewatch-build-12.187.html /tmp/strikewatch-build.first.html
          cp dist/strikewatch-build-12.187-size.json /tmp/strikewatch-size.first.json
          cp dist/strikewatch-build-12.187-css-debt.json /tmp/strikewatch-css.first.json

      - name: Parse source and generated JavaScript
        run: |
          for file in strikewatch-source/js/*.js; do node --check "$file"; done
          node --check strikewatch-source/js/strikewatch.dev.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('strikewatch-source/dist/strikewatch-build-12.187.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit('No standalone inline scripts found')
          with tempfile.TemporaryDirectory() as temp:
              for index, script in enumerate(scripts):
                  path = Path(temp) / f'inline-{index}.js'
                  path.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(path)], check=True)
          PY

      - name: Verify report XP safety
        run: |
          python3 - <<'PY'
          from pathlib import Path
          career = Path('strikewatch-source/js/35-career.js').read_text(encoding='utf-8')
          runtime = Path('strikewatch-source/js/70-runtime.js').read_text(encoding='utf-8')
          required = [
              'function careerSafeXpAward(',
              'function careerReportXpSafetyForTest()',
              '${careerSafeXpAward(summary)} XP',
              '${careerSafeXpAward(careerState.lastRound)} Team XP earned',
          ]
          missing = [item for item in required if item not in career]
          if missing:
              raise SystemExit(f'Missing XP safety source: {missing}')
          forbidden = ['${summary.xpAward} XP', '${careerState.lastRound.xpAward} Team XP earned']
          present = [item for item in forbidden if item in career]
          if present:
              raise SystemExit(f'Unsafe XP interpolation remains: {present}')
          debug_token = "careerReportXpSafetyForTest: () => typeof careerReportXpSafetyForTest === 'function' ? careerReportXpSafetyForTest() : null"
          if debug_token not in runtime:
              raise SystemExit('Browser debug API does not expose careerReportXpSafetyForTest')
          PY
          node - <<'JS'
          const fs = require('fs');
          const vm = require('vm');
          const text = fs.readFileSync('strikewatch-source/js/35-career.js', 'utf8');
          const start = text.indexOf('function careerSafeXpAward(');
          const end = text.indexOf('function renderCareerReportsTab()', start);
          if (start < 0 || end <= start) throw new Error('Could not isolate XP safety diagnostic');
          const context = { result: null };
          vm.runInNewContext(`${text.slice(start, end)}\nresult = careerReportXpSafetyForTest();`, context);
          if (!context.result || context.result.ok !== true) {
            throw new Error(`XP safety diagnostic failed: ${JSON.stringify(context.result)}`);
          }
          if (!Array.isArray(context.result.results) || context.result.results.length !== 6) {
            throw new Error(`Unexpected XP diagnostic cases: ${JSON.stringify(context.result)}`);
          }
          console.log(JSON.stringify(context.result));
          JS

      - name: Verify concise release documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks = {
              'strikewatch-source/HANDOFF.md': ['12.187 — Report XP Safety', 'AUDIT-12.187.md', 'careerReportXpSafetyForTest()'],
              'strikewatch-source/AGENTS.md': ['Build 12.187 owns report XP safety', 'AUDIT-12.187.md'],
              'strikewatch-source/README.md': ['# Strikewatch Source 12.187', 'dist/strikewatch-build-12.187.html'],
              'strikewatch-source/PROJECT.md': ['Build 12.187 closes SW-003', 'AUDIT-12.187.md'],
              'strikewatch-source/00-READ-FIRST-GPT.md': ['Strikewatch Build 12.187 — Report XP Safety'],
              'strikewatch-source/CHANGELOG.md': ['## 12.187 — Report XP Safety', 'AUDIT-12.187.md'],
              'strikewatch-source/AUDIT-12.187.md': ['# Build 12.187 — Report XP Safety', 'Save schema stays 19'],
          }
          for filename, tokens in checks.items():
              text = Path(filename).read_text(encoding='utf-8')
              missing = [token for token in tokens if token not in text]
              if missing:
                  raise SystemExit(f'{filename} is missing {missing}')
          PY

      - name: Build second deterministic candidate
        working-directory: strikewatch-source
        run: python3 build.py

      - name: Compare deterministic outputs
        run: |
          cmp /tmp/strikewatch.dev.first.js strikewatch-source/js/strikewatch.dev.js
          cmp /tmp/strikewatch-build.first.html strikewatch-source/dist/strikewatch-build-12.187.html
          cmp /tmp/strikewatch-size.first.json strikewatch-source/dist/strikewatch-build-12.187-size.json
          cmp /tmp/strikewatch-css.first.json strikewatch-source/dist/strikewatch-build-12.187-css-debt.json

      - name: Publish verified standalone
        run: |
          cp strikewatch-source/dist/strikewatch-build-12.187.html cod.html
          cmp cod.html strikewatch-source/dist/strikewatch-build-12.187.html

      - name: Remove temporary release files
        run: |
          rm -f .github/scripts/release-12-187.py
          rm -f .github/workflows/release-12-187.yml
          rm -f .github/triggers/release-12-187.txt

      - name: Commit completed release to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- strikewatch-source cod.html .github
          git diff --cached --quiet && { echo 'No release changes produced.'; exit 1; }
          git commit -m 'Build 12.187: report XP safety'
          git push origin HEAD:main
