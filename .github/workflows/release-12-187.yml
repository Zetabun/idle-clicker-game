name: Release Strikewatch 12.187

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/release-12-187.txt'

permissions:
  contents: write

concurrency:
  group: release-strikewatch-12-187
  cancel-in-progress: false

jobs:
  release:
    if: ${{ hashFiles('.github/triggers/release-12-187.txt') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply release patch
        run: python3 .github/scripts/release-12-187.py

      - name: Compile build script
        working-directory: strikewatch-source
        run: python3 -m py_compile build.py

      - name: Build first deterministic candidate
        working-directory: strikewatch-source
        run: |
          python3 build.py
          cp js/strikewatch.dev.js /tmp/strikewatch.dev.first.js
          cp dist/strikewatch-build-12.187.html /tmp/strikewatch-build.first.html
          cp dist/strikewatch-build-12.187-size.json /tmp/strikewatch-size.first.json
          cp dist/strikewatch-build-12.187-css-debt.json /tmp/strikewatch-css.first.json

      - name: Parse source and generated JavaScript
        run: |
          for file in strikewatch-source/js/*.js; do node --check "$file"; done
          node --check strikewatch-source/js/strikewatch.dev.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('strikewatch-source/dist/strikewatch-build-12.187.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          with tempfile.TemporaryDirectory() as temp:
              for index, script in enumerate(scripts):
                  path = Path(temp) / f'inline-{index}.js'
                  path.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(path)], check=True)
          PY

      - name: Verify report XP safety
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('strikewatch-source/js/35-career.js').read_text(encoding='utf-8')
          required = [
              'function careerSafeXpAward(',
              'function careerReportXpSafetyForTest()',
              '${careerSafeXpAward(summary)} XP',
              '${careerSafeXpAward(careerState.lastRound)} Team XP earned'
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing XP safety hooks: {missing}')
          forbidden = ['${summary.xpAward} XP', '${careerState.lastRound.xpAward} Team XP earned']
          present = [item for item in forbidden if item in text]
          if present:
              raise SystemExit(f'Unsafe XP interpolation remains: {present}')
          PY

      - name: Build second deterministic candidate
        working-directory: strikewatch-source
        run: python3 build.py

      - name: Compare deterministic outputs
        run: |
          cmp /tmp/strikewatch.dev.first.js strikewatch-source/js/strikewatch.dev.js
          cmp /tmp/strikewatch-build.first.html strikewatch-source/dist/strikewatch-build-12.187.html
          cmp /tmp/strikewatch-size.first.json strikewatch-source/dist/strikewatch-build-12.187-size.json
          cmp /tmp/strikewatch-css.first.json strikewatch-source/dist/strikewatch-build-12.187-css-debt.json

      - name: Publish verified standalone
        run: |
          cp strikewatch-source/dist/strikewatch-build-12.187.html cod.html
          cmp cod.html strikewatch-source/dist/strikewatch-build-12.187.html

      - name: Remove temporary release files
        run: |
          rm -f .github/scripts/release-12-187.py
          rm -f .github/workflows/release-12-187.yml
          rm -f .github/triggers/release-12-187.txt

      - name: Commit completed release to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No release changes produced.'; exit 1; }
          git commit -m 'Build 12.187: report XP safety'
          git push origin HEAD:main
