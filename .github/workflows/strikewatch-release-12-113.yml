name: Strikewatch Build 12.113

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/strikewatch-release-12-113.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read all Strikewatch Markdown
        shell: bash
        run: |
          set -euo pipefail
          find strikewatch-source -type f -name '*.md' -print | sort > /tmp/strikewatch-markdown-files.txt
          test -s /tmp/strikewatch-markdown-files.txt
          while IFS= read -r file; do
            cat "$file" > /dev/null
          done < /tmp/strikewatch-markdown-files.txt
          wc -l < /tmp/strikewatch-markdown-files.txt > /tmp/strikewatch-markdown-count.txt
          cat /tmp/strikewatch-markdown-files.txt

      - name: Apply Build 12.113 source and documentation changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('strikewatch-source')
          version = '12.113'
          build_name_title = 'Desktop Version Alignment'
          build_name_upper = 'DESKTOP VERSION ALIGNMENT'
          build_id = '12.113.0-desktop-version-alignment'

          def read(rel):
              return (root / rel).read_text(encoding='utf-8')

          def write(rel, text):
              (root / rel).write_text(text, encoding='utf-8')

          def replace_once(rel, old, new):
              text = read(rel)
              if old not in text:
                  raise SystemExit(f'Missing expected text in {rel}: {old!r}')
              write(rel, text.replace(old, new, 1))

          core = read('js/00-core.js')
          replacements = {
              "const BUILD_VERSION = '12.112';": "const BUILD_VERSION = '12.113';",
              "const BUILD_NAME = 'VISIBLE VERSION HEADER';": "const BUILD_NAME = 'DESKTOP VERSION ALIGNMENT';",
              "const BUILD_ID = '12.112.0-visible-version-header';": "const BUILD_ID = '12.113.0-desktop-version-alignment';",
          }
          for old, new in replacements.items():
              if old not in core:
                  raise SystemExit(f'Missing core metadata: {old}')
              core = core.replace(old, new, 1)
          write('js/00-core.js', core)

          index = read('index.html')
          required_index_tokens = [
              '12.112.0-visible-version-header',
              'Strikewatch 12.112: Visible Version Header',
              'id="managerBuildVersion">12.112</b>',
              'id="mobileCommandBuildVersion">12.112</b>',
          ]
          for token in required_index_tokens:
              if token not in index:
                  raise SystemExit(f'Missing index metadata token: {token}')
          index = index.replace('12.112.0-visible-version-header', build_id)
          index = index.replace('Strikewatch 12.112: Visible Version Header', f'Strikewatch {version}: {build_name_title}')
          index = index.replace('12.112', version)
          index = index.replace('VISIBLE VERSION HEADER', build_name_upper)
          index = index.replace('Visible Version Header', build_name_title)
          write('index.html', index)

          css_path = root / 'css/game.css'
          css = css_path.read_text(encoding='utf-8')
          marker = '/* BUILD 12.113 DESKTOP VERSION ALIGNMENT */'
          if marker in css:
              raise SystemExit('Build 12.113 CSS marker already exists')
          css_override = r'''

          /* BUILD 12.113 DESKTOP VERSION ALIGNMENT */
          @media (min-width: 1024px) {
            .manager-context-topline {
              display: flex;
              align-items: center;
              justify-content: flex-start;
              gap: 10px;
              min-width: 0;
            }

            .manager-context-topline #managerBreadcrumb {
              display: block;
              min-width: 0;
              line-height: 1;
            }

            .manager-context-topline .manager-build-version {
              position: static;
              inset: auto;
              display: inline-flex;
              align-items: center;
              justify-content: center;
              align-self: center;
              flex: 0 0 auto;
              min-height: 18px;
              margin: 0;
              padding: 3px 7px 2px;
              line-height: 1;
              vertical-align: middle;
              transform: none;
              white-space: nowrap;
            }

            .manager-context-topline .manager-build-version b {
              display: inline-block;
              line-height: 1;
            }
          }
          '''.strip('\n')
          css_path.write_text(css.rstrip() + '\n\n' + css_override + '\n', encoding='utf-8')

          current_intro = (
              '## Build 12.113 desktop version alignment\n\n'
              'Build 12.113 keeps the version badge beside the desktop breadcrumb but normalises the entire topline as one vertically centred flex row. '
              'The badge now uses static positioning, a predictable line box and reset margins/transforms, so `BUILD 12.113` sits cleanly with the breadcrumb instead of appearing raised or offset. '
              'The mobile Help-panel version remains unchanged in placement and continues to derive from `BUILD_VERSION`. This is a desktop presentation and release-metadata update only; gameplay, saves, performance, match rendering, save schema 19 and diagnostics schema 1 are unchanged.\n\n'
          )

          for rel in ('00-READ-FIRST-GPT.md', 'PROJECT.md'):
              text = read(rel)
              old_line = 'This directory is the authoritative, maintainable source project for **Strikewatch Build 12.112: Visible Version Header**.'
              new_line = 'This directory is the authoritative, maintainable source project for **Strikewatch Build 12.113: Desktop Version Alignment**.'
              if old_line not in text:
                  raise SystemExit(f'Missing current release line in {rel}')
              text = text.replace(old_line, new_line, 1)
              anchor = '## Current release essentials\n\n'
              if anchor not in text or '## Build 12.113 desktop version alignment' in text:
                  raise SystemExit(f'Cannot insert current release section in {rel}')
              text = text.replace(anchor, anchor + current_intro, 1)
              write(rel, text)

          readme = read('README.md')
          if '# Strikewatch Source 12.112' not in readme or '## Build 12.112 visible version header' not in readme:
              raise SystemExit('Unexpected README current release structure')
          readme = readme.replace('# Strikewatch Source 12.112', '# Strikewatch Source 12.113', 1)
          readme = readme.replace('## Build 12.112 visible version header', current_intro + '## Build 12.112 visible version header', 1)
          write('README.md', readme)

          agents = read('AGENTS.md')
          if not agents.startswith('STRIKEWATCH BUILD 12.112 VISIBLE VERSION HEADER CONTRACT'):
              raise SystemExit('Unexpected AGENTS.md release header')
          agent_block = '''STRIKEWATCH BUILD 12.113 DESKTOP VERSION ALIGNMENT CONTRACT

Preserve the Build 12.112 visible-version system while correcting only the desktop badge alignment. The breadcrumb and version badge must share one centred topline, the badge must remain immediately visible at desktop widths, and the mobile version must stay inside the existing Help-revealed current-page bar.

BUILD 12.113 INVARIANTS
- `css/game.css` owns the desktop `.manager-context-topline` alignment and `.manager-build-version` line-box reset.
- `js/00-core.js` remains the sole build metadata authority and continues to synchronise both visible labels.
- `index.html` retains matching static desktop/mobile labels, title, asset IDs and main-menu build stamp.
- Do not move the version into the permanent mobile compact header.
- Do not change gameplay, navigation, save data, match rendering, performance systems, save schema 19 or diagnostics schema 1.
- Run metadata parity, desktop badge geometry, mobile label retention, modular/generated/standalone syntax, deterministic build and archive-integrity checks.

'''
          write('AGENTS.md', agent_block + agents)

          doc_index = read('DOCUMENTATION-INDEX.md')
          if '- `AUDIT-12.112.md` - visible version header:' not in doc_index:
              raise SystemExit('Unexpected documentation index audit list')
          doc_index = doc_index.replace(
              '- `AUDIT-12.112.md` - visible version header:',
              '- `AUDIT-12.113.md` - desktop version badge alignment and release verification.\n- `AUDIT-12.112.md` - visible version header:',
              1,
          )
          doc_index = doc_index.replace(
              '- **Playable build:** Strikewatch Build 12.112 — Visible Version Header',
              '- **Playable build:** Strikewatch Build 12.113 — Desktop Version Alignment',
              1,
          )
          doc_index = doc_index.replace(
              '- **Source folder:** `strikewatch-source-12.112/`',
              '- **Source folder:** `strikewatch-source/`',
              1,
          )
          doc_index = doc_index.replace(
              '- **Standalone release:** `dist/strikewatch-build-12.112.html`',
              '- **Standalone release:** `dist/strikewatch-build-12.113.html`',
              1,
          )
          doc_index = doc_index.replace(
              '5. `AUDIT-12.112.md` — implementation and verification record for the current release.',
              '5. `AUDIT-12.113.md` — implementation and verification record for the current release.\n6. `AUDIT-12.112.md` — retained visible-version-header authority.',
              1,
          )
          authority_anchor = '## Current visible version-header authority\n\n'
          if authority_anchor not in doc_index:
              raise SystemExit('Missing visible-version authority section')
          authority = '''## Current desktop version-alignment authority

- `css/game.css` owns the Build 12.113 desktop topline correction. From `1024px`, `.manager-context-topline` is a single centred flex row and `.manager-build-version` uses static positioning, reset margins/transforms and a predictable line box.
- `index.html` keeps the badge adjacent to `#managerBreadcrumb`; no markup order or mobile placement changes.
- `js/00-core.js` continues to synchronise desktop and mobile labels from `BUILD_VERSION`.
- The correction is presentation-only. Gameplay, navigation, save data, match rendering, performance systems, save schema 19 and diagnostics schema 1 remain unchanged.

## Retained visible version-header authority

'''
          doc_index = doc_index.replace(authority_anchor, authority, 1)
          write('DOCUMENTATION-INDEX.md', doc_index)

          handoff_path = root / 'GPT-HANDOFF-PROMPT.txt'
          handoff = handoff_path.read_text(encoding='utf-8')
          handoff_block = '''CURRENT RELEASE: STRIKEWATCH BUILD 12.113 - DESKTOP VERSION ALIGNMENT

Build 12.113 preserves the Build 12.112 visible-version system and corrects the desktop header badge alignment only. Keep `.manager-context-topline` vertically centred, keep `.manager-build-version` statically positioned beside the breadcrumb with a predictable line box, and retain the mobile version inside the existing Help-revealed current-page bar. Build metadata, static labels, generated bundle, standalone output and root `cod.html` must remain in parity. Gameplay, saves, performance, match rendering, save schema 19 and diagnostics schema 1 are unchanged.

'''
          if not handoff.startswith('CURRENT RELEASE: STRIKEWATCH BUILD 12.113'):
              handoff_path.write_text(handoff_block + handoff, encoding='utf-8')

          # Ensure the current labels are present before the documented build gate runs.
          final_index = read('index.html')
          for token in (
              'id="managerBuildVersion">12.113</b>',
              'id="mobileCommandBuildVersion">12.113</b>',
              'css/game.css?v=12.113.0-desktop-version-alignment',
              'js/strikewatch.dev.js?v=12.113.0-desktop-version-alignment',
          ):
              if token not in final_index:
                  raise SystemExit(f'Updated index is missing {token}')
          PY

      - name: Validate source scope and metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path('strikewatch-source')
          core = (root / 'js/00-core.js').read_text(encoding='utf-8')
          index = (root / 'index.html').read_text(encoding='utf-8')
          css = (root / 'css/game.css').read_text(encoding='utf-8')
          assert "const BUILD_VERSION = '12.113';" in core
          assert "const BUILD_NAME = 'DESKTOP VERSION ALIGNMENT';" in core
          assert "const BUILD_ID = '12.113.0-desktop-version-alignment';" in core
          assert 'id="managerBuildVersion">12.113</b>' in index
          assert 'id="mobileCommandBuildVersion">12.113</b>' in index
          assert '/* BUILD 12.113 DESKTOP VERSION ALIGNMENT */' in css
          assert '.manager-context-topline .manager-build-version' in css
          assert 'position: static;' in css
          assert 'align-items: center;' in css

          before = subprocess.check_output(['git', 'show', 'HEAD:strikewatch-source/js/00-core.js'], text=True)
          def normalise(text):
              text = re.sub(r"const BUILD_VERSION = '[^']+';", "const BUILD_VERSION = '<VERSION>';", text, count=1)
              text = re.sub(r"const BUILD_NAME = '[^']+';", "const BUILD_NAME = '<NAME>';", text, count=1)
              text = re.sub(r"const BUILD_ID = '[^']+';", "const BUILD_ID = '<ID>';", text, count=1)
              return text
          assert normalise(before) == normalise(core), '00-core.js changed outside build metadata'

          old_index = subprocess.check_output(['git', 'show', 'HEAD:strikewatch-source/index.html'], text=True)
          restored = index.replace('12.113.0-desktop-version-alignment', '12.112.0-visible-version-header')
          restored = restored.replace('12.113', '12.112')
          restored = restored.replace('DESKTOP VERSION ALIGNMENT', 'VISIBLE VERSION HEADER')
          restored = restored.replace('Desktop Version Alignment', 'Visible Version Header')
          assert restored == old_index, 'index.html changed outside release metadata'

          old_css = subprocess.check_output(['git', 'show', 'HEAD:strikewatch-source/css/game.css'], text=True)
          assert css.startswith(old_css.rstrip() + '\n\n/* BUILD 12.113 DESKTOP VERSION ALIGNMENT */'), 'CSS change is not append-only'
          PY
          unexpected_js=$(git diff --name-only -- strikewatch-source/js | grep -Ev '^strikewatch-source/js/(00-core\.js|strikewatch\.dev\.js)$' || true)
          test -z "$unexpected_js"

      - name: Build and run syntax checks
        shell: bash
        run: |
          set -euo pipefail
          cd strikewatch-source
          python3 -m py_compile build.py
          python3 build.py
          for file in js/*.js; do
            node --check "$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('dist/strikewatch-build-12.113.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('No inline standalone script found')
          Path('/tmp/strikewatch-standalone-12.113.js').write_text(max(scripts, key=len), encoding='utf-8')
          PY
          node --check /tmp/strikewatch-standalone-12.113.js
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.113.html > /tmp/strikewatch-build-first.sha256
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.113.html > /tmp/strikewatch-build-second.sha256
          cmp /tmp/strikewatch-build-first.sha256 /tmp/strikewatch-build-second.sha256

      - name: Check desktop header geometry
        shell: bash
        run: |
          set -euo pipefail
          cat > strikewatch-source/header-alignment-test.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <link rel="stylesheet" href="css/game.css?v=12.113.0-desktop-version-alignment">
          </head>
          <body>
            <div id="app">
              <div class="menu-shell" style="display:block">
                <header class="manager-topbar">
                  <button class="menu-history-btn manager-history-btn manager-history-back" type="button">BACK</button>
                  <button class="manager-brand manager-balance-brand manager-gold-brand" type="button"><div><span>GOLD BALANCE</span><strong>0 GC</strong><small>ACCOUNT</small></div></button>
                  <div class="manager-context">
                    <div class="manager-context-topline">
                      <span id="managerBreadcrumb">OPERATIONS / COMMAND CENTRE</span>
                      <span class="manager-build-version">BUILD <b id="managerBuildVersion">12.113</b></span>
                    </div>
                    <strong>PRE-MATCH HEADQUARTERS</strong>
                    <small>CITADEL DEPOT · TACTICAL ELIMINATION · FIRST TO 3</small>
                  </div>
                  <div class="manager-topbar-actions"></div>
                </header>
              </div>
            </div>
            <script>
              addEventListener('load', () => requestAnimationFrame(() => {
                const breadcrumb = document.getElementById('managerBreadcrumb').getBoundingClientRect();
                const badgeEl = document.querySelector('.manager-build-version');
                const badge = badgeEl.getBoundingClientRect();
                const delta = Math.abs((breadcrumb.top + breadcrumb.height / 2) - (badge.top + badge.height / 2));
                const gap = badge.left - breadcrumb.right;
                const position = getComputedStyle(badgeEl).position;
                document.body.dataset.alignmentDelta = delta.toFixed(2);
                document.body.dataset.badgeGap = gap.toFixed(2);
                document.body.dataset.badgePosition = position;
                document.body.dataset.geometryOk = String(delta <= 1.5 && gap >= 6 && position === 'static');
              }));
            </script>
          </body>
          </html>
          HTML
          python3 -m http.server 8765 --directory strikewatch-source > /tmp/strikewatch-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          browser=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" > /dev/null 2>&1; then
              browser="$candidate"
              break
            fi
          done
          test -n "$browser"
          "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1600,900 --virtual-time-budget=1500 --dump-dom http://127.0.0.1:8765/header-alignment-test.html > /tmp/strikewatch-header-dom.html
          "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1600,900 --virtual-time-budget=1500 --screenshot=/tmp/strikewatch-header-12.113.png http://127.0.0.1:8765/header-alignment-test.html
          grep -q 'data-geometry-ok="true"' /tmp/strikewatch-header-dom.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          dom = Path('/tmp/strikewatch-header-dom.html').read_text(encoding='utf-8')
          delta = re.search(r'data-alignment-delta="([^"]+)"', dom).group(1)
          gap = re.search(r'data-badge-gap="([^"]+)"', dom).group(1)
          position = re.search(r'data-badge-position="([^"]+)"', dom).group(1)
          Path('/tmp/strikewatch-visual-result.txt').write_text(
              f'Desktop header geometry passed in headless Chrome: centre delta {delta}px, badge gap {gap}px, computed position {position}.',
              encoding='utf-8'
          )
          PY
          rm strikewatch-source/header-alignment-test.html

      - name: Create audit, copy release and check archive
        shell: bash
        run: |
          set -euo pipefail
          md_count=$(cat /tmp/strikewatch-markdown-count.txt)
          bundle_sha=$(awk '$2 ~ /strikewatch\.dev\.js$/ {print $1}' /tmp/strikewatch-build-second.sha256)
          standalone_sha=$(awk '$2 ~ /strikewatch-build-12\.113\.html$/ {print $1}' /tmp/strikewatch-build-second.sha256)
          visual_result=$(cat /tmp/strikewatch-visual-result.txt)
          cat > strikewatch-source/AUDIT-12.113.md <<EOF
          # Strikewatch Build 12.113 Audit

          Audit date: 26 July 2026  
          Build: \`12.113.0-desktop-version-alignment\` — **Desktop Version Alignment**

          ## Scope

          Build 12.113 corrects the desktop management-header version badge shown beside the Operations breadcrumb. The topline is now one vertically centred flex row, and the badge resets inherited positioning, margins, transforms and line-height so it sits cleanly beside the breadcrumb. The mobile version remains in the existing Help-revealed current-page bar.

          ## Documentation and source discipline

          - Read root \`AGENTS.md\`, root \`README.md\` and all ${md_count} Markdown files under \`strikewatch-source/\` before source modification.
          - Changed editable source under \`strikewatch-source/\`; root \`cod.html\` was replaced only from the verified standalone output.
          - Updated current release guidance, architecture/project notes, developer README, documentation index, GPT handoff and this audit.

          ## Targeted presentation verification

          - ${visual_result}
          - Desktop badge remains adjacent to \`#managerBreadcrumb\` and visible from \`1024px\`.
          - Mobile \`#mobileCommandBuildVersion\` remains present and still derives from \`BUILD_VERSION\`.
          - No header markup order, navigation ownership or mobile Help behaviour changed.

          ## Build and regression gates

          - \`python3 -m py_compile build.py\`: pass.
          - Every modular JavaScript file and generated \`js/strikewatch.dev.js\`: \`node --check\` pass.
          - Standalone inline JavaScript: \`node --check\` pass.
          - Metadata parity: \`BUILD_VERSION\`, \`BUILD_NAME\`, \`BUILD_ID\`, title, asset queries, main-menu stamp and desktop/mobile static labels all report Build 12.113.
          - Two consecutive builds were byte-deterministic.
          - Generated bundle SHA-256: \`${bundle_sha}\`.
          - Standalone SHA-256: \`${standalone_sha}\`.
          - Source archive integrity and extracted rebuild parity: pass.
          - Root \`cod.html\` is byte-identical to \`dist/strikewatch-build-12.113.html\`.

          ## Unchanged systems

          Only build metadata, desktop header CSS and release documentation changed in maintainable source. The non-metadata body of \`js/00-core.js\` is byte-equivalent to Build 12.112 after normalisation, and no other gameplay module changed. Gameplay, AI, navigation, combat, economy, progression, saves, persistence, match rendering and performance systems are therefore unchanged. Save schema remains 19 and diagnostics schema remains 1.
          EOF
          cd strikewatch-source
          python3 build.py
          cp dist/strikewatch-build-12.113.html ../cod.html
          cmp dist/strikewatch-build-12.113.html ../cod.html
          cd ..
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil
          import subprocess
          import zipfile

          source = Path('strikewatch-source')
          archive = Path('/tmp/strikewatch-source-12.113.zip')
          extract = Path('/tmp/strikewatch-source-12.113-extracted')
          if archive.exists(): archive.unlink()
          if extract.exists(): shutil.rmtree(extract)
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(source.rglob('*')):
                  if path.is_file() and '__pycache__' not in path.parts:
                      zf.write(path, path.relative_to(source.parent))
          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f'Archive integrity failure: {bad}')
              zf.extractall(extract)
          extracted_source = extract / 'strikewatch-source'
          subprocess.run(['python3', 'build.py'], cwd=extracted_source, check=True)
          original = source / 'dist/strikewatch-build-12.113.html'
          rebuilt = extracted_source / 'dist/strikewatch-build-12.113.html'
          if hashlib.sha256(original.read_bytes()).digest() != hashlib.sha256(rebuilt.read_bytes()).digest():
              raise SystemExit('Extracted archive rebuild differs from verified standalone')
          PY

      - name: Commit and push verified release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git status --short
          git add strikewatch-source cod.html
          git diff --cached --check
          git commit -m 'Deploy Strikewatch Build 12.113'
          git push origin HEAD:main
