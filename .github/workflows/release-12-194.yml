name: Release Strikewatch 12.194

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/release-12-194.txt'

permissions:
  contents: write

concurrency:
  group: release-strikewatch-12-194
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build, verify and publish
        shell: bash
        run: |
          cat > /tmp/release-12-194.sh <<'BASH'
          set -Eeuo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('strikewatch-source/RELEASE.json').read_text(encoding='utf-8'))
          expected = {
              'version': '12.193',
              'name': 'Operator Muzzle-Light Response',
              'build_id': '12.193.0-operator-muzzle-light-response'
          }
          if release != expected:
              raise SystemExit(f'Unexpected predecessor release: {release!r}')
          PY

          python3 -m py_compile .github/scripts/release-12-194.py
          python3 .github/scripts/release-12-194.py

          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('strikewatch-source/RELEASE.json').read_text(encoding='utf-8'))
          expected = {
              'version': '12.194',
              'name': 'Muzzle-Anchored Tracers',
              'build_id': '12.194.0-muzzle-anchored-tracers'
          }
          if release != expected:
              raise SystemExit(f'Unexpected prepared release: {release!r}')
          required_docs = {
              'HANDOFF.md': '- Build: **12.194 — Muzzle-Anchored Tracers**',
              'AGENTS.md': 'Build 12.194 owns muzzle-anchored third-person tracers',
              'README.md': '# Strikewatch Source 12.194',
              'PROJECT.md': 'Build 12.194 aligns third-person tracer streaks',
              'CHANGELOG.md': '## 12.194 — Muzzle-Anchored Tracers',
              '00-READ-FIRST-GPT.md': 'Current release: **Strikewatch Build 12.194 — Muzzle-Anchored Tracers**.',
              'CONTRACTS.md': 'Third-person tracer presentation must start from the reusable world-space muzzle'
          }
          for name, required in required_docs.items():
              text = Path('strikewatch-source', name).read_text(encoding='utf-8')
              if required not in text:
                  raise SystemExit(f'{name} missing release requirement: {required}')
          if not Path('strikewatch-source/AUDIT-12.194.md').is_file():
              raise SystemExit('AUDIT-12.194.md was not created')
          PY

          grep -F "const BUILD_VERSION = '12.194'" strikewatch-source/js/00-core.js
          grep -F "const BUILD_NAME = 'Muzzle-Anchored Tracers'" strikewatch-source/js/00-core.js
          grep -F "const BUILD_ID = '12.194.0-muzzle-anchored-tracers'" strikewatch-source/js/00-core.js
          grep -F '<title>Strikewatch 12.194: Muzzle-Anchored Tracers</title>' strikewatch-source/index.html
          grep -F 'id="managerBuildVersion">12.194</b>' strikewatch-source/index.html
          grep -F 'id="mobileCommandBuildVersion">12.194</b>' strikewatch-source/index.html

          python3 - <<'PY'
          from pathlib import Path
          world = Path('strikewatch-source/js/61-world-renderer.js').read_text(encoding='utf-8')
          character = Path('strikewatch-source/js/62-character-renderer.js').read_text(encoding='utf-8')
          required_world = [
              "revision: '12.194-render-muzzle-tracer-1'",
              'fallbackHeight: 1.30',
              'crouchDrop: 0.43',
              'maximumCachedOffset: 1.45',
              'function operatorTracerOrigin(shooter, out = {})',
              'function operatorTracerOriginForTest()',
              'const operatorTracerOriginScratch = {}',
              'const tracerOrigin = operatorTracerOrigin(shooter, operatorTracerOriginScratch)',
              'x1: tracerOrigin.x, y1: tracerOrigin.y, z1: tracerOrigin.z',
              'if (tracers.length > 28)',
              'life: 0.085',
              'maxLife: 0.085',
              'additionalDrawCalls: 0',
              'additionalShaderUniforms: 0'
          ]
          missing = [item for item in required_world if item not in world]
          if missing:
              raise SystemExit(f'Missing tracer-origin requirements: {missing}')
          required_character = [
              'const renderedMuzzleOrigin = worldPoint(',
              'const renderMuzzlePoint = bot.renderMuzzlePoint || (bot.renderMuzzlePoint = { x: 0, y: 0, z: 0 })',
              'renderMuzzlePoint.x = renderedMuzzleOrigin.x',
              'renderMuzzlePoint.y = renderedMuzzleOrigin.y',
              'renderMuzzlePoint.z = renderedMuzzleOrigin.z',
              'muzzleLightOrigin = renderedMuzzleOrigin',
              'setOperatorMuzzleLight(muzzleLightOrigin, bot.flash)',
              'drawMesh(glMeshes.sphere, [1, 0.58, 0.10]'
          ]
          missing = [item for item in required_character if item not in character]
          if missing:
              raise SystemExit(f'Missing rendered-muzzle requirements: {missing}')
          if character.count('bot.renderMuzzlePoint ||') != 1:
              raise SystemExit('Reusable render-muzzle authority is missing or duplicated')
          if character.count('drawMesh(glMeshes.sphere, [1, 0.58, 0.10]') != 1:
              raise SystemExit('Existing third-person muzzle sphere draw changed unexpectedly')
          if world.count('const tracerOrigin = operatorTracerOrigin(shooter, operatorTracerOriginScratch)') != 1:
              raise SystemExit('Tracer-origin binding is missing or duplicated')
          PY

          for hook in operatorTracerOriginForTest operatorMuzzleLightResponseForTest operatorEnvironmentalLightPickupForTest operatorSilhouetteSeparationForTest operatorContactShadowForTest operatorAmbientOcclusionForTest dynamicActorCullingForTest arenaSurfaceSampleForTest; do
            grep -R -F "$hook" strikewatch-source/js >/dev/null
          done

          cd strikewatch-source
          python3 -m py_compile build.py
          python3 build.py
          test -f dist/strikewatch-build-12.194.html
          test -f dist/strikewatch-build-12.194-size.json
          test -f dist/strikewatch-build-12.194-css-debt.json
          cp js/strikewatch.dev.js /tmp/strikewatch.dev.first.js
          cp dist/strikewatch-build-12.194.html /tmp/strikewatch-build.first.html
          cp dist/strikewatch-build-12.194-size.json /tmp/strikewatch-size.first.json
          cp dist/strikewatch-build-12.194-css-debt.json /tmp/strikewatch-css.first.json
          cd ..

          for file in strikewatch-source/js/*.js; do
            [ "$(basename "$file")" = 'strikewatch.dev.js' ] && continue
            node --check "$file"
          done
          node --check strikewatch-source/js/strikewatch.dev.js

          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          html = Path('strikewatch-source/dist/strikewatch-build-12.194.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit('No standalone inline scripts found')
          with tempfile.TemporaryDirectory() as temp:
              for index, script in enumerate(scripts):
                  path = Path(temp) / f'inline-{index}.js'
                  path.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(path)], check=True)
          print(f'Parsed {len(scripts)} standalone inline scripts.')
          PY

          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('strikewatch-source/dist/strikewatch-build-12.194-css-debt.json').read_text(encoding='utf-8'))
          if not report.get('within_budget'):
              raise SystemExit(f'CSS debt report is outside budget: {report!r}')
          if report.get('stylesheets') != 23:
              raise SystemExit(f'Unexpected stylesheet count: {report.get("stylesheets")}')
          size = json.loads(Path('strikewatch-source/dist/strikewatch-build-12.194-size.json').read_text(encoding='utf-8'))
          if size.get('version') != '12.194':
              raise SystemExit(f'Unexpected size report version: {size!r}')
          if size.get('javascript_raw_reduction_percent', 0) < 2.5:
              raise SystemExit(f'JavaScript release reduction below budget: {size!r}')
          PY

          cd strikewatch-source
          python3 build.py
          cd ..
          cmp /tmp/strikewatch.dev.first.js strikewatch-source/js/strikewatch.dev.js
          cmp /tmp/strikewatch-build.first.html strikewatch-source/dist/strikewatch-build-12.194.html
          cmp /tmp/strikewatch-size.first.json strikewatch-source/dist/strikewatch-build-12.194-size.json
          cmp /tmp/strikewatch-css.first.json strikewatch-source/dist/strikewatch-build-12.194-css-debt.json

          cp strikewatch-source/dist/strikewatch-build-12.194.html cod.html
          cmp cod.html strikewatch-source/dist/strikewatch-build-12.194.html
          git diff --check
          BASH

          mkdir -p .github/release-failures
          LOG=.github/release-failures/release-12-194.log
          set +e
          bash /tmp/release-12-194.sh 2>&1 | tee "$LOG"
          release_status=${PIPESTATUS[0]}
          set -e

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$release_status" -ne 0 ]; then
            printf '\nFAILED_EXIT_CODE=%s\n' "$release_status" >> "$LOG"
            git add "$LOG"
            git commit -m 'Record Build 12.194 release failure'
            git push origin HEAD:main
            exit "$release_status"
          fi

          rm -f "$LOG"
          rm -f .github/scripts/release-12-194.py
          rm -f .github/workflows/release-12-194.yml
          rm -f .github/triggers/release-12-194.txt
          rm -f .github/release-12-194.trigger
          git add -A
          git diff --cached --quiet && { echo 'No release changes produced.'; exit 1; }
          git diff --cached --check
          git commit -m 'Build 12.194: muzzle-anchored tracers'
          git push origin HEAD:main
