name: Kerbside 0.7.43 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kerbside-0.7.43-release.yml

permissions:
  contents: write

concurrency:
  group: kerbside-0.7.43-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Prepare release patch
        run: python3 .github/scripts/prepare-kerbside-0.7.43.py

      - name: Apply release patch
        run: python3 .github/scripts/apply-kerbside-0.7.43.py

      - name: Validate route swap recovery
        shell: bash
        run: |
          set -euo pipefail
          node --check kerbside-journey-planner-ui.js
          node --check kerbside-train-routes.js
          node --check kerbside-train-live-window.js
          node --check kerbside-train-timetable.js
          node --test kerbside-backend/test/train-route-swap.test.mjs
          node --test kerbside-backend/test/train-timetable-provider.test.js
          node --test kerbside-backend/test/status-switchboard.test.mjs
          node --test kerbside-backend/tests/train-forecast-v3-dual-timetable.mjs
          node --check kerbside-backend/tests/train-journey-planner-regression.mjs
          node --check kerbside-backend/tests/train-live-window-regression.mjs
          git diff --check
          grep -Fx '0.7.43' VERSION
          grep -F 'kerbside-journey-planner-ui.js?v=0.7.43' bus.html
          grep -F 'setFromCrs,' kerbside-train-routes.js
          grep -F 'refreshJourneyBoard' kerbside-journey-planner-ui.js

      - name: Publish Kerbside 0.7.43
        shell: bash
        run: |
          set -euo pipefail
          git add VERSION bus.html kerbside-status.js kerbside-train-routes.js kerbside-train-live-window.js kerbside-journey-planner-ui.js kerbside-backend/test/train-route-swap.test.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Kerbside 0.7.43: recover route swaps reliably'
          git restore .github/scripts/apply-kerbside-0.7.43.py
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo 'Failed to publish after three rebased attempts.' >&2
          exit 1
