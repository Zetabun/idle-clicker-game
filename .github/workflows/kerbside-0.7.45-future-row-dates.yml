name: Kerbside 0.7.45 future row dates

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kerbside-0.7.45-future-row-dates.yml

permissions:
  contents: write

concurrency:
  group: kerbside-0.7.45-future-row-dates
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Apply future-row date labels
        run: python3 .github/scripts/apply-kerbside-0.7.45.py

      - name: Validate future-row date labels
        run: |
          set -euo pipefail
          node --check kerbside-train-timetable.js
          node --test kerbside-backend/test/train-timetable-provider.test.js
          node --test kerbside-backend/tests/train-forecast-v3-dual-timetable.mjs
          node --test kerbside-backend/test/train-route-swap.test.mjs
          node --test kerbside-backend/test/train-forecast-layout.test.mjs
          git diff --check
          grep -Fx '0.7.45' VERSION
          grep -F 'train-service-date' kerbside-train-timetable.js
          grep -F 'train-service-date' kerbside-trains.css

      - name: Publish Kerbside 0.7.45
        run: |
          set -euo pipefail
          git add VERSION bus.html kerbside-status.js kerbside-train-timetable.js kerbside-trains.css kerbside-backend/test/train-timetable-provider.test.js
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Kerbside 0.7.45: show dates on future train rows'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
