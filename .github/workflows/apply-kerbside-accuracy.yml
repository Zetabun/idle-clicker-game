          replace_section('kerbside-backend/tests/audit-regression.mjs', '      const reasonOriginNoBus =', '      Object.assign(state, savedFeed);', '''      const reasonOriginNoBus = api.scheduleLiveReason({ ...laterRow, originAt: reasonNow + 30 * 60000 }, []);
                const matchedSchedule = { ...tripARow };
                const matchedBus = {
