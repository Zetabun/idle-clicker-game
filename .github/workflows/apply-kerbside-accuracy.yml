          replace_once('kerbside-backend/tests/audit-regression.mjs', '''      const savedFeed = { demo: state.demo, feedFallback: state.feedFallback, vehicles: state.vehicles };
          ''', '''      const savedFeed = { demo: state.demo, feedFallback: state.feedFallback, vehicles: state.vehicles, liveDiag: state.liveDiag };
