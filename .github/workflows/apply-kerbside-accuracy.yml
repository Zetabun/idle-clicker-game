          replace_once('kerbside-backend/tests/audit-regression.mjs', '''        sharedOriginAmbiguous: sharedOrigin.ambiguous,
                sharedOriginItems: sharedOrigin.items.length,
          ''', '''        sharedOriginAmbiguous: sharedOrigin.ambiguous,
                sharedOriginItems: sharedOrigin.items.length,
