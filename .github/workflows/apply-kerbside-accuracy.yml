      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          npm run vendor:leaflet --prefix kerbside-backend
          cd kerbside-backend
          npx playwright install --with-deps webkit chromium

      - name: Validate the complete build twice
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2; do
            echo "Validation pass $pass"
            python3 .github/scripts/sync-version.py --check
            python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          source = Path('bus.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', source, flags=re.I | re.S)
          if not scripts:
              raise SystemExit('No inline browser scripts found')
          with tempfile.TemporaryDirectory() as directory:
              for index, script in enumerate(scripts, start=1):
                  filename = Path(directory) / f'inline-{index}.js'
                  filename.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(filename)], check=True)
          PY
            node --check build-timetable.js
            npm run check --prefix kerbside-backend
            npm test --prefix kerbside-backend
            npm run test:browser --prefix kerbside-backend
            npm run test:identity --prefix kerbside-backend
            npm run test:multi-vehicle --prefix kerbside-backend
            npm run test:audit --prefix kerbside-backend
            KERBSIDE_BROWSER=chromium npm run test:browser --prefix kerbside-backend
            KERBSIDE_BROWSER=chromium npm run test:identity --prefix kerbside-backend
            KERBSIDE_BROWSER=chromium npm run test:multi-vehicle --prefix kerbside-backend
            KERBSIDE_BROWSER=chromium npm run test:audit --prefix kerbside-backend
          done

      - name: Commit validated build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Agent"
          git config user.email "noreply@openai.com"
          git rm .github/workflows/apply-kerbside-accuracy.yml
          git add VERSION bus.html \
            kerbside-backend/package.json \
            kerbside-backend/src/worker.js \
            kerbside-backend/test/worker.test.js \
            kerbside-backend/tests/browser-regression.mjs \
            kerbside-backend/tests/audit-regression.mjs
          git diff --cached --check
          git commit -m "Improve live bus matching accuracy"
          git push origin HEAD:agent/improve-live-bus-accuracy

      - name: Summarize
        shell: bash
        run: |
          {
            echo '## Kerbside 0.7.3'
            echo '- GPS-to-timetable explanations now use the actual vehicle rejection reason.'
            echo '- Delayed positions are no longer described as fresh.'
            echo '- Exact due journeys survive bearing-only contradictions unless measured movement retreats.'
            echo '- Scheduled capacity is raised to 72 with hidden rows counted in diagnostics.'
            echo '- Phone location waits briefly for the most accurate available fix.'
            echo '- Full WebKit and Chromium validation completed twice.'
          } >> "$GITHUB_STEP_SUMMARY"
