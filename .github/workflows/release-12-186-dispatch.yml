name: Dispatch Strikewatch 12.186 from PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check release marker
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Dispatch guarded release
        if: ${{ hashFiles('.github/release-12-186.trigger') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.head_ref }}
        run: gh workflow run release-12-186.yml --ref "$RELEASE_BRANCH"
