name: Release 12.207

on:
  push:
    branches: [main]
    paths:
      - .github/triggers/release-12.207.txt

permissions:
  contents: write

concurrency:
  group: release-build-12-207
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply, build and verify Build 12.207
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/release-12.207.log) 2>&1

          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {'version':'12.206','name':'Contextual Mobile Navigation','build_id':'12.206.0-contextual-mobile-navigation'}
          actual = json.loads(Path('strikewatch-source/RELEASE.json').read_text(encoding='utf-8'))
          if actual != expected:
              raise SystemExit(f'Unexpected predecessor release: {actual!r}')
          print('Predecessor release verified:', actual)
          PY

          python3 -m py_compile .github/scripts/release-12.207.py
          python3 .github/scripts/release-12.207.py

          cd strikewatch-source
          python3 -m py_compile build.py
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.207.html dist/strikewatch-build-12.207-size.json dist/strikewatch-build-12.207-css-debt.json > /tmp/build-12.207-first.sha256
          for file in js/*.js; do node --check "$file"; done
          node --check js/strikewatch.dev.js

          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('dist/strikewatch-build-12.207.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit('No inline JavaScript found in standalone')
          for script in scripts:
              with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as handle:
                  handle.write(script)
                  temp = handle.name
              subprocess.run(['node','--check',temp], check=True)
          print(f'Parsed {len(scripts)} standalone inline script block(s)')
          PY

          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.207.html dist/strikewatch-build-12.207-size.json dist/strikewatch-build-12.207-css-debt.json > /tmp/build-12.207-second.sha256
          diff -u /tmp/build-12.207-first.sha256 /tmp/build-12.207-second.sha256
          cd ..

          python3 - <<'PY'
          import json
          from pathlib import Path
          src = Path('strikewatch-source')
          expected = {'version':'12.207','name':'Mobile Header Submenu Fix','build_id':'12.207.0-mobile-header-submenu-fix'}
          release = json.loads((src/'RELEASE.json').read_text(encoding='utf-8'))
          if release != expected:
              raise SystemExit(f'Release mismatch: {release!r}')
          menu = (src/'js/50-ui-menus.js').read_text(encoding='utf-8')
          css = (src/'css/compact-navigation.css').read_text(encoding='utf-8')
          for fragment in ['function renderMobileHeaderSubmenu','mobile-header-submenu','renderMobileHeaderSubmenu(resolvedSection, resolvedRoute)']:
              if fragment not in menu:
                  raise SystemExit(f'Missing menu fragment: {fragment}')
          for fragment in ['Build 12.207: populate contextual mobile header','mobile-header-submenu button.active','menu-subnav-shell{display:none!important}']:
              if fragment not in css:
                  raise SystemExit(f'Missing CSS fragment: {fragment}')
          standalone = src/'dist/strikewatch-build-12.207.html'
          Path('cod.html').write_bytes(standalone.read_bytes())
          if Path('cod.html').read_bytes() != standalone.read_bytes():
              raise SystemExit('Root cod.html is not byte-identical')
          print('Build 12.207 targeted checks and artifact identity passed')
          PY

          rm -f .github/release-12.207-failure.log
          rm -f .github/scripts/release-12.207.py
          rm -f .github/workflows/release-12.207.yml
          rm -f .github/triggers/release-12.207.txt
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Build 12.207: Mobile Header Submenu Fix"
          git push origin main

      - name: Publish failure ledger
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          git reset --hard HEAD
          {
            printf '%s\n' 'Build 12.207 workflow failed.' "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "Commit: $GITHUB_SHA"
            if test -f /tmp/release-12.207.log; then cat /tmp/release-12.207.log; else printf '%s\n' 'Build failed before the release log was initialised.'; fi
          } > .github/release-12.207-failure.log
          git add .github/release-12.207-failure.log
          git commit -m "Record Build 12.207 release failure"
          git push origin main
