name: Kerbside 0.8.4 Forecast v4 release
# run 3: legacy browser assertion aligned to Forecast v4

on:
  push:
    branches: [main]
    paths: [.github/workflows/kerbside-0.8.4-forecast-v4-release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kerbside-0.8.4-forecast-v4-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BODS_KEY: ${{ secrets.BODS_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Build official Forecast v4 data
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 'https://assets.publishing.service.gov.uk/media/6a5e4e3430f5842e1f5a5ec5/rai0212.ods' -o /tmp/rai0212.ods
          curl -fsSL --retry 3 'https://assets.publishing.service.gov.uk/media/6a5e4e4b13cf36b2315a5ebd/rai0213.ods' -o /tmp/rai0213.ods
          curl -fsSL --retry 3 'https://assets.publishing.service.gov.uk/media/6a5e4dd08b7e4fa537e693fd/rai0214.ods' -o /tmp/rai0214.ods
          curl -fsSL --retry 3 'https://assets.publishing.service.gov.uk/media/6a5e4e62c7c34404041b4641/rai0215.ods' -o /tmp/rai0215.ods
          curl -fsSL --retry 3 'https://assets.publishing.service.gov.uk/media/6a5e4de5c7c34404041b463f/rai0216.ods' -o /tmp/rai0216.ods
          curl -fsSL --retry 3 'https://dataportal.orr.gov.uk/media/1909/table-1410-passenger-entries-and-exits-and-interchanges-by-station.csv' -o /tmp/orr1410.csv
          python3 .github/scripts/build-forecast-v4-data.py \
            /tmp/rai0212.ods /tmp/rai0213.ods /tmp/rai0214.ods /tmp/rai0215.ods /tmp/rai0216.ods \
            /tmp/orr1410.csv kerbside-rail-demand-v4.js
          node --check kerbside-rail-demand-v4.js

      - name: Apply Kerbside 0.8.4
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-kerbside-0.8.4.py
          python3 .github/scripts/apply-kerbside-0.8.4-tests.py
          python3 .github/scripts/apply-kerbside-0.8.4-fixes.py
          python3 .github/scripts/sync-version.py

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          npm install --prefix kerbside-rail-worker --no-audit --no-fund --package-lock=false
          npm run vendor:leaflet --prefix kerbside-backend
          cd kerbside-backend
          npx playwright install --with-deps webkit chromium

      - name: Validate Forecast v4 and existing systems
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sync-version.py --check
          node --check kerbside-trains.js
          node --check kerbside-train-live-overlay.js
          node --check kerbside-train-events.js
          node --check kerbside-rail-timebands.js
          node --check kerbside-rail-demand-v4.js
          node --check kerbside-rail-calibration.js
          node --check kerbside-train-forecast-v4.js
          node --check kerbside-train-timetable.js
          node --check kerbside-status.js
          node --test kerbside-backend/test/train-forecast-v4-official-data.test.mjs
          node --test kerbside-backend/tests/train-forecast-v3-dual-timetable.mjs
          node --test kerbside-backend/test/train-dft-timebands.test.mjs
          node --test kerbside-backend/test/train-forecast-accuracy.test.mjs
          node --test kerbside-backend/test/train-timetable-provider.test.js
          node --test kerbside-backend/test/train-route-swap.test.mjs
          node --test kerbside-backend/test/train-forecast-layout.test.mjs
          npm run check --prefix kerbside-backend
          npm test --prefix kerbside-backend
          npm run check --prefix kerbside-rail-worker
          npm test --prefix kerbside-rail-worker
          grep -Fq 'stationUsageSignal' kerbside-rail-calibration.js
          grep -Fq 'operatorCrowdingSignal' kerbside-rail-calibration.js
          grep -Fq 'routeFlowSignal' kerbside-rail-calibration.js
          grep -Fq 'ordinalProbabilities' kerbside-train-forecast-v4.js
          grep -Fq 'probabilityConfidence' kerbside-train-forecast-v4.js
          grep -Fq 'servicePatternSignal' kerbside-train-forecast-v4.js
          grep -Fq 'forecastAccuracyForBucket' kerbside-trains.js
          grep -Fq 'kerbside-rail-demand-v4.js?v=0.8.4' bus.html
          grep -Fq 'kerbside-train-forecast-v4.js?v=0.8.4' bus.html
          grep -Fx '0.8.4' VERSION
          git diff --check

      - name: Full WebKit system gate
        shell: bash
        env:
          KERBSIDE_BROWSER: webkit
        run: |
          set -euo pipefail
          npm run test:full --prefix kerbside-backend

      - name: Full Chromium system gate
        shell: bash
        env:
          KERBSIDE_BROWSER: chromium
        run: |
          set -euo pipefail
          npm run test:full --prefix kerbside-backend

      - name: Publish Kerbside 0.8.4 to main
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Kerbside 0.8.4: calibrate Forecast v4 with official demand data'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo 'Failed to publish after three rebased attempts.' >&2
          exit 1

      - name: Deploy version-aligned bus Worker
        shell: bash
        working-directory: kerbside-backend
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN BODS_KEY; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Required secret $name is missing or empty."; exit 1; fi
          done
          npx wrangler deploy
          printf '%s' "$BODS_KEY" | npx wrangler secret put BODS_KEY
          body="$(mktemp)"; trap 'rm -f "$body"' EXIT
          for attempt in $(seq 1 10); do
            if curl --fail --location --silent --show-error --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache' \
              "https://kerbside-bus.adambullas.workers.dev/health?release=${GITHUB_RUN_ID}-${attempt}" -o "$body" \
              && jq -e '.ok == true and .version == "0.8.4" and .bods == true' "$body" >/dev/null; then
              echo 'Production bus Worker is serving 0.8.4.'; exit 0
            fi
            sleep 5
          done
          cat "$body" || true; exit 1

      - name: Verify deployed GitHub Pages build
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT; ready=false
          for attempt in $(seq 1 48); do
            token="release=${GITHUB_RUN_ID}-${attempt}"
            if curl --fail --location --silent --show-error --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' \
              "https://zetabun.github.io/idle-clicker-game/VERSION?$token" -o "$tmp/version" && grep -Fxq '0.8.4' "$tmp/version"; then
              ready=true; break
            fi
            sleep 5
          done
          if [[ "$ready" != true ]]; then echo '::error::GitHub Pages did not serve Kerbside 0.8.4 in time.'; cat "$tmp/version" 2>/dev/null || true; exit 1; fi
          curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' \
            "https://zetabun.github.io/idle-clicker-game/bus.html?release=${GITHUB_RUN_ID}" -o "$tmp/app.html"
          grep -Fq "const APP_VERSION = '0.8.4';" "$tmp/app.html"
          grep -Fq 'kerbside-rail-demand-v4.js?v=0.8.4' "$tmp/app.html"
          grep -Fq 'kerbside-train-forecast-v4.js?v=0.8.4' "$tmp/app.html"
          curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' \
            "https://zetabun.github.io/idle-clicker-game/kerbside-train-forecast-v4.js?release=${GITHUB_RUN_ID}" -o "$tmp/v4.js"
          grep -Fq 'ordinalProbabilities' "$tmp/v4.js"
          curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' \
            "https://zetabun.github.io/idle-clicker-game/kerbside-rail-demand-v4.js?release=${GITHUB_RUN_ID}" -o "$tmp/demand.js"
          grep -Fq '__KERBSIDE_RAIL_DEMAND_V4__' "$tmp/demand.js"
          echo 'GitHub Pages is serving Kerbside 0.8.4 / Forecast v4.'
