name: Build Kerbside national timetable data

on:
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * *'

permissions:
  contents: read

concurrency:
  group: kerbside-national-data
  cancel-in-progress: true

env:
  PAGES_PROJECT: kerbside-data-zetabun

jobs:
  build-region:
    if: github.event_name == 'workflow_dispatch' || vars.KERBSIDE_NATIONAL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        region:
          - east_anglia
          - east_midlands
          - london
          - north_east
          - north_west
          - south_east
          - south_west
          - west_midlands
          - yorkshire

    env:
      REGION: ${{ matrix.region }}
      BODS_KEY: ${{ secrets.BODS_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate build configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BODS_KEY:-}" ]]; then
            echo "::error::Required secret BODS_KEY is missing or empty."
            exit 1
          fi
          node --check kerbside-backend/scripts/build-region.js

      - name: Download current regional BODS GTFS
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --retry 4 --retry-all-errors --connect-timeout 30 \
            "https://data.bus-data.dft.gov.uk/timetable/download/gtfs-file/${REGION}/?api_key=${BODS_KEY}" \
            --output gtfs.zip
          test -s gtfs.zip
          unzip -tq gtfs.zip
          ls -lh gtfs.zip

      - name: Extract only required GTFS tables
        shell: bash
        run: |
          set -euo pipefail
          rm -rf gtfs dist
          mkdir -p gtfs dist
          python3 - <<'PY'
          from pathlib import PurePosixPath, Path
          from zipfile import ZipFile

          required = {'stops.txt', 'routes.txt', 'trips.txt', 'stop_times.txt'}
          optional = {'calendar.txt', 'calendar_dates.txt'}
          wanted = required | optional
          selected = {}

          with ZipFile('gtfs.zip') as archive:
              for info in archive.infolist():
                  if info.is_dir():
                      continue
                  name = PurePosixPath(info.filename).name.lower()
                  if name in wanted and name not in selected:
                      selected[name] = info
              missing = sorted(required - selected.keys())
              if missing:
                  raise SystemExit(f'Missing required GTFS files: {missing}')
              for name, info in selected.items():
                  Path('gtfs', name).write_bytes(archive.read(info))

          print('Extracted:', ', '.join(sorted(selected)))
          PY
          ls -lh gtfs

      - name: Build compact regional Pages assets
        shell: bash
        run: |
          set -euo pipefail
          node --max-old-space-size=6144 \
            kerbside-backend/scripts/build-region.js gtfs "$REGION" dist

          node - <<'NODE'
          const fs = require('fs');
          const region = process.env.REGION;
          const file = `dist/regions/${region}/manifest.json`;
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          for (const key of ['stops', 'departures', 'patterns', 'tiles']) {
            if (!Number.isFinite(manifest[key]) || manifest[key] <= 0) {
              throw new Error(`${region} manifest has no ${key}`);
            }
          }
          if (!Array.isArray(manifest.bounds) || manifest.bounds.length !== 4) {
            throw new Error(`${region} manifest has no geographic bounds`);
          }
          if (manifest.maxTileBytes >= 25 * 1024 * 1024) {
            throw new Error(`${region} contains a tile above the Cloudflare Pages 25 MiB limit`);
          }
          console.log(JSON.stringify(manifest, null, 2));
          NODE

      - name: Upload regional Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: kerbside-region-${{ matrix.region }}
          path: dist/regions/${{ matrix.region }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

  deploy-pages:
    if: github.event_name == 'workflow_dispatch' || vars.KERBSIDE_NATIONAL_ENABLED == 'true'
    needs: build-region
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Download regional artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kerbside-region-*
          path: artifacts

      - name: Assemble static Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/regions

          for directory in artifacts/kerbside-region-*; do
            [[ -d "$directory" ]] || continue
            region="${directory##*/kerbside-region-}"
            mkdir -p "site/regions/$region"
            cp -a "$directory/." "site/regions/$region/"
          done

          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = 'site/regions';
          const regions = {};
          for (const name of fs.readdirSync(root).sort()) {
            const filename = path.join(root, name, 'manifest.json');
            if (!fs.existsSync(filename)) continue;
            regions[name] = JSON.parse(fs.readFileSync(filename, 'utf8'));
          }
          if (Object.keys(regions).length !== 9) {
            throw new Error(`Expected 9 region manifests, found ${Object.keys(regions).length}`);
          }
          const totals = { stops: 0, departures: 0, patterns: 0, tiles: 0, files: 0 };
          for (const manifest of Object.values(regions)) {
            for (const key of Object.keys(totals)) totals[key] += Number(manifest[key]) || 0;
          }
          const manifest = {
            version: 2,
            scope: 'england-regional-pages',
            built: new Date().toISOString(),
            project: process.env.PAGES_PROJECT,
            tileSize: 0.05,
            patternPrefixLength: 2,
            regions,
            totals
          };
          fs.writeFileSync('site/manifest.json', JSON.stringify(manifest));
          console.log(JSON.stringify(manifest, null, 2));
          NODE

          cat > site/_headers <<'HEADERS'
          /*
            Access-Control-Allow-Origin: *
            X-Content-Type-Options: nosniff
            Referrer-Policy: no-referrer

          /manifest.json
            Cache-Control: public, max-age=60, s-maxage=300

          /regions/*/manifest.json
            Cache-Control: public, max-age=300, s-maxage=3600

          /regions/*/tiles/*
            Cache-Control: public, max-age=3600, s-maxage=86400

          /regions/*/patterns/*
            Cache-Control: public, max-age=86400, s-maxage=604800
          HEADERS

          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en-GB">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Kerbside timetable data</title>
          <style>body{margin:0;background:#0b1119;color:#dce6f0;font:16px system-ui;padding:3rem;max-width:48rem}a{color:#ffb000}code{color:#3fd9a4}</style>
          <h1>Kerbside timetable data</h1>
          <p>This static Cloudflare Pages project supplies official stop and timetable tiles to Kerbside.</p>
          <p><a href="/manifest.json">View the current national manifest</a></p>
          HTML

      - name: Enforce Cloudflare Pages free limits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('site')
          files = [path for path in root.rglob('*') if path.is_file()]
          oversized = [(path, path.stat().st_size) for path in files if path.stat().st_size >= 25 * 1024 * 1024]
          if len(files) > 20_000:
              raise SystemExit(f'Pages file limit exceeded: {len(files)} files')
          if oversized:
              details = ', '.join(f'{path} ({size / 1024 / 1024:.2f} MiB)' for path, size in oversized[:10])
              raise SystemExit(f'Pages 25 MiB asset limit exceeded: {details}')
          total = sum(path.stat().st_size for path in files)
          print(f'Pages bundle: {len(files)} files, {total / 1024 / 1024:.2f} MiB')
          PY

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required secret $name is missing or empty."
              exit 1
            fi
          done

      - name: Create Pages project when needed
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const apiToken = process.env.CLOUDFLARE_API_TOKEN;
          const projectName = process.env.PAGES_PROJECT;
          const baseUrl = `https://api.cloudflare.com/client/v4/accounts/${accountId}/pages/projects`;
          const headers = {
            Authorization: `Bearer ${apiToken}`,
            'Content-Type': 'application/json'
          };

          async function responseBody(response) {
            const text = await response.text();
            if (!text) return null;
            try {
              return JSON.parse(text);
            } catch {
              return text;
            }
          }

          function cloudflareError(action, response, body) {
            const detail = body && typeof body === 'object'
              ? JSON.stringify(body.errors || body)
              : String(body || 'No response body');
            return new Error(`${action} failed with HTTP ${response.status}: ${detail}`);
          }

          const lookup = await fetch(`${baseUrl}/${encodeURIComponent(projectName)}`, { headers });
          const lookupBody = await responseBody(lookup);

          if (lookup.ok) {
            if (lookupBody && lookupBody.success === false) {
              throw cloudflareError('Pages project lookup', lookup, lookupBody);
            }
            console.log(`Pages project ${projectName} already exists.`);
          } else if (lookup.status === 404) {
            const create = await fetch(baseUrl, {
              method: 'POST',
              headers,
              body: JSON.stringify({
                name: projectName,
                production_branch: 'main'
              })
            });
            const createBody = await responseBody(create);
            if (!create.ok || (createBody && createBody.success === false)) {
              throw cloudflareError('Pages project creation', create, createBody);
            }
            console.log(`Created Pages project ${projectName}.`);
          } else {
            throw cloudflareError('Pages project lookup', lookup, lookupBody);
          }
          NODE

      - name: Deploy national timetable to Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.28.1 pages deploy site \
            --project-name "$PAGES_PROJECT" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Kerbside timetable ${GITHUB_SHA::12}"
          echo "National data URL: https://${PAGES_PROJECT}.pages.dev/manifest.json"
