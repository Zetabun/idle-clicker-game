name: Strikewatch Release 12.182

on:
  page_build:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strikewatch-release-12-182
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Build, verify and publish 12.182
        shell: bash
        run: |
          set -euo pipefail

          marker='.github/release-triggers/12.182.txt'
          patch='.github/scripts/release-12-182.py'
          workflow='.github/workflows/release-12-182.yml'

          if [ ! -f "$marker" ]; then
            echo '12.182 trigger marker is absent; nothing to release.'
            exit 0
          fi
          test -f "$patch"

          python3 "$patch"
          cd strikewatch-source

          python3 -m py_compile build.py
          python3 build.py

          first_dir="$(mktemp -d)"
          cp js/strikewatch.dev.js "$first_dir/strikewatch.dev.js"
          cp dist/strikewatch-build-12.182.html "$first_dir/strikewatch-build-12.182.html"
          cp dist/strikewatch-build-12.182-size.json "$first_dir/strikewatch-build-12.182-size.json"
          cp dist/strikewatch-build-12.182-css-debt.json "$first_dir/strikewatch-build-12.182-css-debt.json"

          python3 build.py
          cmp js/strikewatch.dev.js "$first_dir/strikewatch.dev.js"
          cmp dist/strikewatch-build-12.182.html "$first_dir/strikewatch-build-12.182.html"
          cmp dist/strikewatch-build-12.182-size.json "$first_dir/strikewatch-build-12.182-size.json"
          cmp dist/strikewatch-build-12.182-css-debt.json "$first_dir/strikewatch-build-12.182-css-debt.json"

          for file in js/*.js; do
            node --check "$file"
          done

          python3 - <<'PY'
          from pathlib import Path
          import importlib.util
          import json
          import re

          root = Path('.')
          game = (root / 'css/game.css').read_text(encoding='utf-8')
          owned = (root / 'css/operator-portrait.css').read_text(encoding='utf-8')
          marker = '/* --- Operator portrait: deeper procedural variation --- */'
          assert marker not in game
          assert owned.count(marker) == 1
          assert owned.count('@media (max-width: 1023px)') == 1

          required = (
              '--skin-light: #c9a68b;',
              '--skin-mid: #a07f66;',
              '--skin-dark: #6d5341;',
              '--kit-light: #5b7686;',
              '--kit-mid: #2b4351;',
              '--kit-dark: #16242d;',
              '.team-player-visual.tone-1',
              '.team-player-visual.tone-5',
              '.team-player-visual.variant-1',
              '.team-player-visual.variant-3',
              '.team-player-visual.helmet-3 .operator-helmet',
              '.team-player-visual.rig-2 .operator-plate',
              'background: var(--role-accent, #7fd4ff);',
              'width: 54px !important;',
              'height: 52px !important;',
              'transform: translateX(-50%) scale(.88) !important;',
              'font-size: 6.5px !important;',
              'width: 50px !important;',
              'height: 50px !important;',
              'font-size: 7px !important;',
          )
          for declaration in required:
              assert declaration in owned, declaration

          management = (root / 'js/36-team-management.js').read_text(encoding='utf-8')
          for source_marker in (
              'function teamPlayerVisualMarkup',
              "`${identity}:portrait`",
              "`${identity}:complexion`",
              "`${identity}:headgear`",
              "`${identity}:rig`",
              'operator-helmet',
              'operator-head',
              'operator-visor',
              'operator-neck',
              'operator-shoulders',
              'operator-body',
              'operator-rig',
              'operator-plate',
              'operator-comms',
          ):
              assert source_marker in management, source_marker

          spec = importlib.util.spec_from_file_location('strikewatch_build', root / 'build.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          expected = [
              'game.css',
              'operator-portrait.css',
              'command-chrome.css',
              'combat-effectiveness.css',
              'match-type.css',
              'route-readability.css',
              'management-grid.css',
              'league-table.css',
              'calendar-agenda.css',
              'training-readability.css',
              'training-programme.css',
              'management-feedback.css',
              'compact-readability.css',
              'reward-reveal.css',
              'armour-viewer.css',
              'weapon-presentation.css',
              'loadout-stills.css',
              '12.161-audit-fixes.css',
              'armoury-inventory.css',
              'compact-navigation.css',
          ]
          assert [path.name for path in module.CSS_PATHS] == expected
          html = (root / 'index.html').read_text(encoding='utf-8')
          hrefs = re.findall(r'<link rel="stylesheet" href="css/([^?]+)\?v=[^"]+"\s*/>', html)
          assert hrefs == expected
          assert html.count('>12.182</b>') == 2

          report = json.loads((root / 'dist/strikewatch-build-12.182-css-debt.json').read_text(encoding='utf-8'))
          assert report['version'] == '12.182'
          assert report['stylesheets'] == 20
          assert report['stylesheet_order'] == expected
          assert report['owned_operator_portrait_lines'] > 0
          assert report['game_css_lines'] <= 30830
          assert report['important_declarations'] <= 2182
          assert report['media_queries'] <= 474
          assert report['within_budget'] is True

          size = json.loads((root / 'dist/strikewatch-build-12.182-size.json').read_text(encoding='utf-8'))
          assert size['version'] == '12.182'
          assert size['javascript_raw_reduction_percent'] >= 2.5

          release = json.loads((root / 'RELEASE.json').read_text(encoding='utf-8'))
          assert release == {
              'version': '12.182',
              'name': 'Operator Portrait CSS Ownership',
              'build_id': '12.182.0-operator-portrait-css-ownership',
          }

          standalone = (root / 'dist/strikewatch-build-12.182.html').read_text(encoding='utf-8')
          assert not re.search(r'<link rel="stylesheet" href="css/', standalone)
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', standalone, re.S)
          assert scripts
          Path('/tmp/strikewatch-12.182-inline.js').write_text('\n'.join(scripts), encoding='utf-8')

          bundle = (root / 'js/strikewatch.dev.js').read_text(encoding='utf-8')
          for hook in ('teamPlayerVisualMarkup', 'mobileInterfaceAuditForTest', 'renderRouteForTest', 'typographyConsistencyForTest'):
              assert hook in bundle, hook

          assert (root / 'AUDIT-12.182.md').exists()
          assert '12.182 — Operator Portrait CSS Ownership' in (root / 'HANDOFF.md').read_text(encoding='utf-8')
          assert '12.182 — Operator Portrait CSS Ownership' in (root / 'CHANGELOG.md').read_text(encoding='utf-8')
          PY

          node --check /tmp/strikewatch-12.182-inline.js

          cd ..
          cp strikewatch-source/dist/strikewatch-build-12.182.html cod.html
          cmp cod.html strikewatch-source/dist/strikewatch-build-12.182.html

          find strikewatch-source -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f "$patch" "$workflow" "$marker"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- strikewatch-source cod.html .github
          git diff --cached --check
          git commit -m 'Build 12.182: establish operator portrait CSS ownership'
          git push origin HEAD:main
