name: Diagnose Build 12.223

on:
  push:
    paths:
      - '.github/triggers/diagnose-12.223.txt'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run diagnostic
        shell: bash
        run: |
          set +e
          python3 .github/scripts/release-12.223.py > /tmp/diagnose-12.223.txt 2>&1
          patch_code=$?
          echo "patch_exit=${patch_code}" >> /tmp/diagnose-12.223.txt
          if [ "${patch_code}" -eq 0 ]; then
            (cd strikewatch-source && python3 build.py) >> /tmp/diagnose-12.223.txt 2>&1
            echo "build_exit=$?" >> /tmp/diagnose-12.223.txt
          fi
          git reset --hard HEAD
          mkdir -p .github/diagnostics
          cp /tmp/diagnose-12.223.txt .github/diagnostics/12.223.txt
          rm .github/workflows/diagnose-12.223.yml
          rm .github/triggers/diagnose-12.223.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Diagnose Build 12.223 release"
          git push origin main
