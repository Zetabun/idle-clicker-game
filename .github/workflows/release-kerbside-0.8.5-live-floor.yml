name: Release Kerbside 0.8.5 live departure floor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-kerbside-0.8.5-live-floor.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kerbside-0-8-5-live-floor
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Apply the hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-kerbside-0.8.5-live-floor.py
          python3 - <<'PY'
          from pathlib import Path

          # Preserve the traveller's future-date preference in the browser
          # fixture while proving Today clamps that same value to the clock.
          path=Path('kerbside-backend/tests/train-browser-core-regression.mjs')
          text=path.read_text(encoding='utf-8')
          old="localStorage.setItem('kerbside.rail.depart-after.v1','00:01');"
          if text.count(old)!=1:
              raise SystemExit(f'browser fixture: expected one stale-time seed, found {text.count(old)}')
          text=text.replace(old,"localStorage.setItem('kerbside.rail.depart-after.v1','09:00');",1)
          future="await page.waitForFunction(()=>document.getElementById('trainTravelDateMeta')?.dataset.mode==='planning');"
          if text.count(future)!=1:
              raise SystemExit(f'browser fixture: expected one future-date anchor, found {text.count(future)}')
          text=text.replace(future,future+"\n  assert.equal(await page.locator('#trainDepartAfter').inputValue(),'09:00','future dates should restore the traveller\\'s saved departure preference');",1)
          path.write_text(text,encoding='utf-8')

          # If no scheduled services remain after the current-time floor, still
          # allow Darwin to add a genuinely active delayed/live-only train.
          path=Path('kerbside-train-timetable.js')
          text=path.read_text(encoding='utf-8')
          old="if(!overlay||state.mode!=='today'||!liveOverlayEligible()||!state.services.length)return false;"
          new="if(!overlay||state.mode!=='today'||!liveOverlayEligible())return false;"
          if text.count(old)!=1:
              raise SystemExit(f'timetable merge guard: expected one match, found {text.count(old)}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          python3 .github/scripts/sync-version.py

      - name: Install full browser gate
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          npm run vendor:leaflet --prefix kerbside-backend
          cd kerbside-backend
          npx playwright install --with-deps webkit chromium

      - name: Deterministic and syntax gate
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sync-version.py --check
          node --check kerbside-train-live-window.js
          node --check kerbside-journey-planner-ui.js
          node --check kerbside-train-timetable.js
          npm run check --prefix kerbside-backend
          npm test --prefix kerbside-backend
          git diff --check

      - name: Full WebKit gate
        shell: bash
        run: |
          set -euo pipefail
          npm run test:browser --prefix kerbside-backend
          npm run test:train --prefix kerbside-backend
          npm run test:train-route --prefix kerbside-backend
          npm run test:identity --prefix kerbside-backend
          npm run test:multi-vehicle --prefix kerbside-backend
          npm run test:audit --prefix kerbside-backend
          npm run test:accuracy-hardening --prefix kerbside-backend --if-present
          npm run test:stop-side --prefix kerbside-backend --if-present
          npm run test:journey-identity --prefix kerbside-backend --if-present
          npm run test:disruptions --prefix kerbside-backend --if-present
          npm run test:listing-reliability --prefix kerbside-backend --if-present

      - name: Full Chromium gate
        shell: bash
        env:
          KERBSIDE_BROWSER: chromium
        run: |
          set -euo pipefail
          npm run test:browser --prefix kerbside-backend
          npm run test:train --prefix kerbside-backend
          npm run test:train-route --prefix kerbside-backend
          npm run test:identity --prefix kerbside-backend
          npm run test:multi-vehicle --prefix kerbside-backend
          npm run test:audit --prefix kerbside-backend
          npm run test:accuracy-hardening --prefix kerbside-backend --if-present
          npm run test:stop-side --prefix kerbside-backend --if-present
          npm run test:journey-identity --prefix kerbside-backend --if-present
          npm run test:disruptions --prefix kerbside-backend --if-present
          npm run test:listing-reliability --prefix kerbside-backend --if-present

      - name: Commit and push 0.8.5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION bus.html kerbside-status.js kerbside-train-live-window.js kerbside-journey-planner-ui.js kerbside-train-timetable.js kerbside-backend
          git diff --cached --check
          git diff --cached --quiet && { echo '::error::No 0.8.5 application changes staged'; exit 1; } || true
          git commit -m 'Kerbside 0.8.5: hide completed trains from Today'
          git push origin HEAD:main
