name: Trigger Kerbside 0.7.10 hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kerbside-0710-trigger.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out prepared hotfix branch
        uses: actions/checkout@v5
        with:
          ref: agent/kerbside-0710-gps-freshness
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run prepared patch recipe
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e '
            workflow = YAML.load_file(".github/workflows/kerbside-0710-hotfix.yml")
            steps = workflow.fetch("jobs").fetch("patch-and-verify").fetch("steps")
            steps.each do |step|
              run = step["run"]
              puts run if run
              puts "\n"
            end
          ' > /tmp/kerbside-0710-hotfix.sh
          bash /tmp/kerbside-0710-hotfix.sh
