name: One-shot Strikewatch 12.161 release

on:
  push:
    branches: [main]
    paths: [.github/workflows/strikewatch-12-161-one-shot.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified release source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFIX'
          from pathlib import Path
          import json

          root = Path('strikewatch-source')
          release = {
              'version': '12.161',
              'name': 'Recovery & Readability',
              'build_id': '12.161.0-recovery-readability',
          }
          (root / 'RELEASE.json').write_text(
              json.dumps(release, indent=2) + '\n', encoding='utf-8'
          )

          # Initialise the durable career store directly after the career core.
          build_path = root / 'build.py'
          build = build_path.read_text(encoding='utf-8')
          old = "'35-career.js', '39-medical.js'"
          if old in build:
              build = build.replace(
                  old,
                  "'35-career.js', '81-career-indexeddb.js', '39-medical.js'",
                  1,
              )
              first = build.find("'81-career-indexeddb.js'")
              second = build.find("'81-career-indexeddb.js'", first + 1)
              if second >= 0:
                  start = second - 2 if build[second - 2:second] == ', ' else second
                  end = second + len("'81-career-indexeddb.js'")
                  build = build[:start] + build[end:]
          build = build.replace(
              "'80-durable-results.js']",
              "'80-durable-results.js', '82-audit-recovery.js']",
          )
          build = build.replace(
              '    css_path = ROOT / "css" / "game.css"',
              '    css_path = ROOT / "css" / "game.css"\n'
              '    release_css_path = ROOT / "css" / "12.161-audit-fixes.css"',
          )
          build = build.replace(
              '    css = css_path.read_text(encoding="utf-8").rstrip()',
              '    css = css_path.read_text(encoding="utf-8").rstrip() + "\\n\\n" + '
              'release_css_path.read_text(encoding="utf-8").rstrip()',
          )
          build = build.replace(
              '    BUNDLE_PATH.write_text(bundle, encoding="utf-8")',
              '    BUNDLE_PATH.write_text(bundle, encoding="utf-8", newline="\\n")',
          )
          build = build.replace(
              '    dist_path.write_text(html, encoding="utf-8")',
              '    dist_path.write_text(html, encoding="utf-8", newline="\\n")',
          )
          build_path.write_text(build, encoding='utf-8', newline='\n')

          core_path = root / 'js' / '00-core.js'
          core = core_path.read_text(encoding='utf-8')
          core = core.replace("const BUILD_VERSION = '12.160';", "const BUILD_VERSION = '12.161';")
          core = core.replace("const BUILD_NAME = 'Settled Operators';", "const BUILD_NAME = 'Recovery & Readability';")
          core = core.replace("const BUILD_ID = '12.160.0-settled-operators';", "const BUILD_ID = '12.161.0-recovery-readability';")
          core_path.write_text(core, encoding='utf-8', newline='\n')

          index_path = root / 'index.html'
          index = index_path.read_text(encoding='utf-8')
          index = index.replace(
              'width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover',
              'width=device-width,initial-scale=1,viewport-fit=cover',
          )
          index = index.replace(
              'Strikewatch 12.160: Settled Operators',
              'Strikewatch 12.161: Recovery & Readability',
          )
          index = index.replace(
              '12.160.0-settled-operators',
              '12.161.0-recovery-readability',
          )
          index = index.replace(
              'id="managerBuildVersion">12.160',
              'id="managerBuildVersion">12.161',
          )
          index = index.replace(
              'id="mobileCommandBuildVersion">12.160',
              'id="mobileCommandBuildVersion">12.161',
          )
          index_path.write_text(index, encoding='utf-8', newline='\n')

          replacements = {
              'README.md': [
                  ('# Strikewatch Source 12.150', '# Strikewatch Source 12.161'),
                  ('strikewatch-build-12.150.html', 'strikewatch-build-12.161.html'),
              ],
              'PROJECT.md': [
                  ('Build 12.150', 'Build 12.161'),
                  ('AUDIT-12.150.md', 'AUDIT-12.161.md'),
              ],
              '00-READ-FIRST-GPT.md': [
                  ('Current release: **Strikewatch Build 12.150 — Grip Tang**.',
                   'Current release: **Strikewatch Build 12.161 — Recovery & Readability**.'),
              ],
          }
          for name, pairs in replacements.items():
              path = root / name
              text = path.read_text(encoding='utf-8')
              for before, after in pairs:
                  text = text.replace(before, after)
              path.write_text(text, encoding='utf-8', newline='\n')

          handoff_path = root / 'HANDOFF.md'
          handoff = handoff_path.read_text(encoding='utf-8')
          handoff = handoff.replace(
              '- Build: **12.160 — Settled Operators**',
              '- Build: **12.161 — Recovery & Readability**',
          )
          handoff = handoff.replace(
              '- Build ID: `12.160.0-settled-operators`',
              '- Build ID: `12.161.0-recovery-readability`',
          )
          handoff = handoff.replace(
              'strikewatch-build-12.160.html',
              'strikewatch-build-12.161.html',
          )
          note = (
              'Build 12.161 fixes the returning-career startup migration crash by '
              'initialising the durable career store before finance modules. It '
              'restores pinch zoom, adds compact type and touch floors, improves '
              'wrapping in management and match interfaces, and makes scoreboard '
              'telemetry diagnostics side-effect free. See `AUDIT-12.161.md`.\n\n'
          )
          if 'Build 12.161 fixes' not in handoff:
              handoff = handoff.replace('Build 12.160 settles', note + 'Build 12.160 settles')
          handoff_path.write_text(handoff, encoding='utf-8', newline='\n')
          PYFIX

      - name: Build twice and verify determinism
        shell: bash
        run: |
          set -euo pipefail
          cd strikewatch-source
          python3 build.py
          node --check js/strikewatch.dev.js
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.161.html > /tmp/first.sha256
          python3 build.py
          node --check js/strikewatch.dev.js
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.161.html > /tmp/second.sha256
          diff -u /tmp/first.sha256 /tmp/second.sha256
          cd ..
          cp strikewatch-source/dist/strikewatch-build-12.161.html cod.html
          cmp -s strikewatch-source/dist/strikewatch-build-12.161.html cod.html

      - name: Commit complete release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/strikewatch-12-161-one-shot.yml
          git add -A strikewatch-source cod.html .github/workflows/strikewatch-12-161-one-shot.yml
          git commit -m "Build 12.161: recover legacy careers and improve readability"
          git push origin HEAD:main
