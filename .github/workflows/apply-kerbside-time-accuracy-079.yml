name: Apply Kerbside 0.7.9 time accuracy fixes

on:
  push:
    branches:
      - main
    paths:
      - .github/kerbside-time-accuracy-079.trigger

permissions:
  contents: write

concurrency:
  group: kerbside-time-accuracy-079
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out exact trigger revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Guard main revision
        shell: bash
        run: echo "GUARDED_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Apply audited timing patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-kerbside-time-accuracy-079.py
          python3 .github/scripts/fix-kerbside-079-browser-assertion.py
          git diff --check

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          npm run vendor:leaflet --prefix kerbside-backend
          if git ls-files --error-unmatch kerbside-backend/vendor/leaflet/leaflet.js >/dev/null 2>&1; then
            git diff --exit-code -- kerbside-backend/vendor/leaflet
          fi
          cd kerbside-backend
          npx playwright install --with-deps webkit chromium

      - name: Run complete validation twice
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2; do
            echo "Kerbside validation pass $pass"
            python3 .github/scripts/sync-version.py --check
            node --check build-timetable.js
            npm run check --prefix kerbside-backend
            npm test --prefix kerbside-backend
            npm run test:browser --prefix kerbside-backend
            npm run test:identity --prefix kerbside-backend
            npm run test:multi-vehicle --prefix kerbside-backend
            npm run test:audit --prefix kerbside-backend
            npm run test:accuracy-hardening --prefix kerbside-backend
            npm run test:stop-side --prefix kerbside-backend
            npm run test:journey-identity --prefix kerbside-backend
            npm run test:disruptions --prefix kerbside-backend
            npm run test:listing-reliability --prefix kerbside-backend
            KERBSIDE_BROWSER=chromium npm run test:browser --prefix kerbside-backend
            KERBSIDE_BROWSER=chromium npm run test:identity --prefix kerbside-backend
            KERBSIDE_BROWSER=chromium npm run test:multi-vehicle --prefix kerbside-backend
            KERBSIDE_BROWSER=chromium npm run test:audit --prefix kerbside-backend
            KERBSIDE_BROWSER=chromium npm run test:accuracy-hardening --prefix kerbside-backend
            KERBSIDE_BROWSER=chromium npm run test:stop-side --prefix kerbside-backend
            KERBSIDE_BROWSER=chromium npm run test:journey-identity --prefix kerbside-backend
            KERBSIDE_BROWSER=chromium npm run test:disruptions --prefix kerbside-backend
            KERBSIDE_BROWSER=chromium npm run test:listing-reliability --prefix kerbside-backend
          done

      - name: Publish validated release to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          remote_main="$(git rev-parse origin/main)"
          if [[ "$remote_main" != "$GUARDED_BASE" ]]; then
            echo "::error::main moved during validation: guarded $GUARDED_BASE, now $remote_main"
            exit 1
          fi

          rm -f .github/scripts/apply-kerbside-time-accuracy-079.py
          rm -f .github/scripts/fix-kerbside-079-browser-assertion.py
          rm -f .github/workflows/apply-kerbside-time-accuracy-079.yml
          rm -f .github/kerbside-time-accuracy-079.trigger

          git config user.name "OpenAI Agent"
          git config user.email "noreply@openai.com"
          git add -A
          git diff --cached --check

          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(
            .github/kerbside-time-accuracy-079.trigger
            .github/scripts/apply-kerbside-time-accuracy-079.py
            .github/scripts/fix-kerbside-079-browser-assertion.py
            .github/workflows/apply-kerbside-time-accuracy-079.yml
            VERSION
            bus.html
            kerbside-backend/package.json
            kerbside-backend/src/worker.js
            kerbside-backend/test/worker.test.js
            kerbside-backend/tests/accuracy-hardening-regression.mjs
            kerbside-backend/tests/browser-regression.mjs
            kerbside-backend/tests/identity-regression.mjs
            kerbside-backend/tests/listing-reliability-regression.mjs
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "$(printf '%s\n' "${changed[@]}")" != "$(printf '%s\n' "${expected[@]}")" ]]; then
            echo '::error::Validated release changed an unexpected file set.'
            printf 'Changed:\n%s\nExpected:\n%s\n' \
              "$(printf '%s\n' "${changed[@]}")" \
              "$(printf '%s\n' "${expected[@]}")"
            exit 1
          fi

          git commit -m "Kerbside 0.7.9: fix GPS and timetable time accuracy"
          git push origin HEAD:main

      - name: Summarize release
        shell: bash
        run: |
          {
            echo '## Kerbside 0.7.9 validated and published'
            echo '- GTFS service times now use elapsed-time DST semantics.'
            echo '- Future producer timestamps cannot freeze corrected GPS reports.'
            echo '- Passenger GPS freshness matches the ETA freshness authority.'
            echo '- Due/on-schedule labels use raw-second thresholds.'
            echo '- WebKit and Chromium regression suites passed twice.'
          } >> "$GITHUB_STEP_SUMMARY"
