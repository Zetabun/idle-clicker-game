name: Dispatch Strikewatch 12.186 Release

on:
  page_build:

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove relay and dispatch release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/release-12-186-page.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .github/workflows/release-12-186-page.yml
          git commit -m "Remove Strikewatch 12.186 release relay"
          git push origin HEAD:main
          gh workflow run release-12-186.yml --ref main
