name: Release 12.208

on:
  push:
    branches: [main]
    paths:
      - .github/triggers/release-12.208.txt

permissions:
  contents: write

concurrency:
  group: release-build-12-208
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply, build and verify Build 12.208
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/release-12.208.log) 2>&1

          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {'version':'12.207','name':'Mobile Header Submenu Fix','build_id':'12.207.0-mobile-header-submenu-fix'}
          actual = json.loads(Path('strikewatch-source/RELEASE.json').read_text(encoding='utf-8'))
          if actual != expected:
              raise SystemExit(f'Unexpected predecessor release: {actual!r}')
          print('Predecessor release verified:', actual)
          PY

          python3 -m py_compile .github/scripts/release-12.208.py
          python3 .github/scripts/release-12.208.py

          cd strikewatch-source
          python3 -m py_compile build.py
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.208.html dist/strikewatch-build-12.208-size.json dist/strikewatch-build-12.208-css-debt.json > /tmp/build-12.208-first.sha256
          for file in js/*.js; do node --check "$file"; done
          node --check js/strikewatch.dev.js

          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('dist/strikewatch-build-12.208.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit('No inline JavaScript found in standalone')
          for script in scripts:
              with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as handle:
                  handle.write(script)
                  temp = handle.name
              subprocess.run(['node','--check',temp], check=True)
          print(f'Parsed {len(scripts)} standalone inline script block(s)')
          PY

          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.208.html dist/strikewatch-build-12.208-size.json dist/strikewatch-build-12.208-css-debt.json > /tmp/build-12.208-second.sha256
          diff -u /tmp/build-12.208-first.sha256 /tmp/build-12.208-second.sha256
          cd ..

          python3 - <<'PY'
          import json
          from pathlib import Path
          src = Path('strikewatch-source')
          release = json.loads((src/'RELEASE.json').read_text(encoding='utf-8'))
          expected = {'version':'12.208','name':'Mobile Header Layout Fix','build_id':'12.208.0-mobile-header-layout-fix'}
          if release != expected:
              raise SystemExit(f'Release mismatch: {release!r}')
          css = (src/'css/compact-navigation.css').read_text(encoding='utf-8')
          for fragment in ['Build 12.208: mobile header layout correction','grid-template-columns:48px minmax(0,1fr) 48px','mobile-header-submenu']:
              if fragment not in css:
                  raise SystemExit(f'Missing CSS fragment: {fragment}')
          standalone = src/'dist/strikewatch-build-12.208.html'
          Path('cod.html').write_bytes(standalone.read_bytes())
          if Path('cod.html').read_bytes() != standalone.read_bytes():
              raise SystemExit('Root cod.html is not byte-identical')
          print('Build 12.208 checks and root artifact identity passed')
          PY

          rm -f .github/release-12.208-failure.log
          rm -f .github/scripts/release-12.208.py
          rm -f .github/workflows/release-12.208.yml
          rm -f .github/triggers/release-12.208.txt
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Build 12.208: Mobile Header Layout Fix"
          git push origin main

      - name: Publish failure ledger
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          git reset --hard HEAD
          {
            printf '%s\n' 'Build 12.208 workflow failed.' "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "Commit: $GITHUB_SHA"
            if test -f /tmp/release-12.208.log; then cat /tmp/release-12.208.log; else printf '%s\n' 'Build failed before the release log was initialised.'; fi
          } > .github/release-12.208-failure.log
          git add .github/release-12.208-failure.log
          git commit -m "Record Build 12.208 release failure"
          git push origin main
