name: Strikewatch 12.167 release

on:
  workflow_dispatch:
  page_build:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run verified release
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/release-12-167.log) 2>&1
          report_failure() {
            status=$?
            if [ "$status" -ne 0 ]; then
              tail -c 50000 /tmp/release-12-167.log > /tmp/release-12-167-tail.log || true
              {
                echo 'The automated 12.167 release failed. Captured log:'
                echo
                echo '```text'
                cat /tmp/release-12-167-tail.log
                echo '```'
              } > /tmp/release-12-167-issue.md
              gh issue create --title 'STRIKEWATCH 12.167 RELEASE FAILURE' --body-file /tmp/release-12-167-issue.md || true
            fi
            exit "$status"
          }
          trap report_failure EXIT

          python3 .github/scripts/release-12-167.py
          cd strikewatch-source
          python3 -m py_compile build.py
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.167.html dist/strikewatch-build-12.167-size.json dist/strikewatch-build-12.167-css-debt.json > /tmp/build-a.sha
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.167.html dist/strikewatch-build-12.167-size.json dist/strikewatch-build-12.167-css-debt.json > /tmp/build-b.sha
          diff -u /tmp/build-a.sha /tmp/build-b.sha

          for file in js/[0-9][0-9]-*.js js/strikewatch.dev.js; do
            node --check "$file"
          done

          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')
          html = (root / 'dist/strikewatch-build-12.167.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          if not scripts:
              raise SystemExit('No inline standalone JavaScript found')
          Path('/tmp/strikewatch-12.167-inline.js').write_text('\n'.join(scripts), encoding='utf-8')

          game = (root / 'css/game.css').read_text(encoding='utf-8')
          owned = (root / 'css/loadout-stills.css').read_text(encoding='utf-8')
          marker = 'Build 12.155: loadout still previews'
          if marker in game:
              raise SystemExit('Loadout-still layer still exists in game.css')
          if owned.count(marker) != 1:
              raise SystemExit('Loadout-still ownership marker missing or duplicated')
          if '<link rel="stylesheet" href="css/' in html:
              raise SystemExit('Standalone retained a development stylesheet link')

          report = json.loads((root / 'dist/strikewatch-build-12.167-css-debt.json').read_text(encoding='utf-8'))
          expected_order = [
              'game.css',
              'loadout-stills.css',
              '12.161-audit-fixes.css',
              'armoury-inventory.css',
              'compact-navigation.css',
          ]
          if not report.get('within_budget'):
              raise SystemExit(f'CSS debt budget failed: {report}')
          if report.get('stylesheets') != 5:
              raise SystemExit(f'Unexpected stylesheet count: {report}')
          if report.get('stylesheet_order') != expected_order:
              raise SystemExit(f'Unexpected stylesheet order: {report}')
          if report.get('game_css_lines', 999999) > 31500:
              raise SystemExit(f'game.css remains above budget: {report}')

          release = json.loads((root / 'RELEASE.json').read_text(encoding='utf-8'))
          if release != {
              'version': '12.167',
              'name': 'Loadout CSS Ownership',
              'build_id': '12.167.0-loadout-css-ownership',
          }:
              raise SystemExit(f'Release metadata mismatch: {release}')

          architecture = (root / 'ARCHITECTURE.md').read_text(encoding='utf-8')
          contracts = (root / 'CONTRACTS.md').read_text(encoding='utf-8')
          audit = (root / 'AUDIT-12.167.md').read_text(encoding='utf-8')
          changelog = (root / 'CHANGELOG.md').read_text(encoding='utf-8')
          if 'css/loadout-stills.css' not in architecture or 'CSS_PATHS' not in architecture:
              raise SystemExit('Architecture ownership/order documentation missing')
          if 'ordered `CSS_PATHS`' not in contracts:
              raise SystemExit('Stylesheet-order contract missing')
          if '# Build 12.167 — Loadout CSS Ownership' not in audit:
              raise SystemExit('12.167 audit missing')
          for version in ('12.161', '12.162', '12.163', '12.164', '12.165', '12.166', '12.167'):
              if f'## {version}' not in changelog:
                  raise SystemExit(f'Changelog route missing for {version}')

          print(json.dumps(report, indent=2))
          PY

          node --check /tmp/strikewatch-12.167-inline.js
          cp dist/strikewatch-build-12.167.html ../cod.html
          cmp -s ../cod.html dist/strikewatch-build-12.167.html
          cd ..

          rm -f .github/scripts/release-12-167.py .github/workflows/release-12-167.yml .github/release-triggers/12.167.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add strikewatch-source cod.html .github/scripts/release-12-167.py .github/workflows/release-12-167.yml .github/release-triggers/12.167.txt
          git commit -m 'Build 12.167: establish loadout CSS ownership'
          git push origin main
