name: Report Kerbside v3 status

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/report-kerbside-v3-status.yml

permissions:
  actions: read
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/failures
          gh run list --repo "$GITHUB_REPOSITORY" --workflow fix-kerbside-loop-timeout-v3.yml --limit 5 --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url > .github/failures/kerbside-v3-status.json
          rm .github/workflows/report-kerbside-v3-status.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Record temporary Kerbside validation status'
          git pull --rebase origin main
          git push origin HEAD:main
