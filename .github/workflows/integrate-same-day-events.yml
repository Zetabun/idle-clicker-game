name: Integrate same-day event forecast
on:
  pull_request:
    branches: [main]
    paths:
      - kerbside-train-events.js
      - kerbside-train-forecast-v3.js
      - .github/workflows/integrate-same-day-events.yml
permissions:
  contents: write
jobs:
  integrate:
    if: github.head_ref == 'agent/kerbside-same-day-events'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Wire event engine and bump release
        shell: python
        run: |
          from pathlib import Path
          p=Path('bus.html'); s=p.read_text()
          marker='<script src="kerbside-train-forecast-v3.js"></script>'
          script='<script src="kerbside-train-events.js"></script>'
          if script not in s: s=s.replace(marker, script+'\n'+marker)
          s=s.replace('0.7.35','0.7.36')
          p.write_text(s)
          for name in ['kerbside-backend/package.json','kerbside-backend/src/worker.js']:
              q=Path(name)
              if q.exists(): q.write_text(q.read_text().replace('0.7.35','0.7.36'))
      - name: Syntax checks
        run: |
          node --check kerbside-train-events.js
          node --check kerbside-train-forecast-v3.js
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bus.html kerbside-backend/package.json kerbside-backend/src/worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Integrate same-day event forecast"
          git push