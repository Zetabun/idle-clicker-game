name: Release Kerbside circular tracking and complete-body timeouts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-kerbside-circular-timeout.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-kerbside-circular-timeout
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply circular-stop and complete-body timeout fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(text, old, new, expected, label):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} exact match(es), found {count}")
              return text.replace(old, new)

          bus_path = Path('bus.html')
          bus = bus_path.read_text(encoding='utf-8')

          bus = replace_exact(
              bus,
              '''async function fetchTimed(url, options, timeoutMs){
            const ctl = new AbortController();
            const external = options && options.signal;
            const abort = ()=>ctl.abort();
            if(external){ if(external.aborted) ctl.abort(); else external.addEventListener('abort',abort,{once:true}); }
            const timer=setTimeout(()=>ctl.abort(),timeoutMs||FETCH_TIMEOUT_MS);
            try{ return await fetch(url,{...(options||{}),signal:ctl.signal}); }
            finally{ clearTimeout(timer); if(external) external.removeEventListener('abort',abort); }
          }''',
              '''async function fetchTimed(url, options, timeoutMs){
            const ctl = new AbortController();
            const external = options && options.signal;
            const abort = ()=>ctl.abort();
            if(external){ if(external.aborted) ctl.abort(); else external.addEventListener('abort',abort,{once:true}); }
            const timer=setTimeout(()=>ctl.abort(),timeoutMs||FETCH_TIMEOUT_MS);
            try{
              const response=await fetch(url,{...(options||{}),signal:ctl.signal});
              // fetch() resolves when the headers arrive. Buffer the complete body
              // before disarming the timer so a server that stalls mid-XML or
              // mid-JSON cannot leave polling permanently busy.
              const body=await response.arrayBuffer();
              const nullBody=response.status===204||response.status===205||response.status===304;
              return new Response(nullBody?null:body,{
                status:response.status,statusText:response.statusText,headers:new Headers(response.headers)
              });
            }finally{ clearTimeout(timer); if(external) external.removeEventListener('abort',abort); }
          }''',
              1,
              'complete response-body timeout'
          )

          bus = replace_exact(
              bus,
              '''  const out=[];
            const today=localMidnight(moment);
            for(const e of stop.d){''',
              '''  const out=[], rawOccurrences=new Map();
            const today=localMidnight(moment);
            for(const e of stop.d){''',
              1,
              'timetable occurrence counter'
          )
          bus = replace_exact(
              bus,
              '''    const service=e[3]||'', departureDayOffset=Math.floor(mins/1440);''',
              '''    const service=e[3]||'', trip=String(e[5]||''), stopOccurrence=trip?(rawOccurrences.get(trip)||0):null, departureDayOffset=Math.floor(mins/1440);
              if(trip) rawOccurrences.set(trip,stopOccurrence+1);''',
              1,
              'timetable occurrence assignment'
          )
          bus = replace_exact(
              bus,
              '''      out.push({at:at.getTime(), mins, line:cleanLine(e[1]), head:cleanName(e[2]||''), service, direction:e[4], trip:e[5]||'', pattern:e[6]||''});''',
              '''      out.push({at:at.getTime(), mins, line:cleanLine(e[1]), head:cleanName(e[2]||''), service, direction:e[4], trip, pattern:e[6]||'', stopOccurrence});''',
              1,
              'timetable occurrence row'
          )

          bus = replace_exact(
              bus,
              '''function scheduledJourneyDirection(row){''',
              '''function scheduledJourneyDirection(row,selectedIndex){''',
              1,
              'scheduled direction signature'
          )
          bus = replace_exact(
              bus,
              '''  const stops=orderedPatternStops(pattern), index=selectedPatternStopIndex(stops);''',
              '''  const stops=orderedPatternStops(pattern), index=Number.isInteger(selectedIndex)
                ? selectedIndex
                : selectedPatternStopIndex(stops,undefined,NaN,row.stopOccurrence);''',
              1,
              'scheduled direction stop occurrence'
          )

          bus = replace_exact(
              bus,
              '''  const vehicle=projectVehicleToPattern(pattern,v);
            const ordered=orderedPatternStops(pattern), selectedIndex=selectedPatternStopIndex(ordered,stop);
            const selected=selectedIndex>=0?ordered[selectedIndex]:null;
            // Only project the stop onto the whole pattern when the ordered stop list
            // could not place it. That scan walks every point of the route and its
            // result was previously discarded whenever `selected` was found — on every
            // vehicle, on every render.
            const target=selected
              ? {along:selected.along,metres:dist(selected.lat,selected.lon,stop.lat,stop.lon),total:vehicle&&vehicle.total}
              : projectToPattern(pattern.points,stop.lat,stop.lon);
            if(!vehicle || !target || vehicle.metres>650 || target.metres>250) return null;
            const remaining=target.along-vehicle.along;
            return {
              remaining,
              passed:remaining < -120,
              vehicleOffset:vehicle.metres,
              stopOffset:target.metres,
              total:vehicle.total,
              pattern
            };''',
              '''  const vehicle=projectVehicleToPattern(pattern,v);
            const ordered=orderedPatternStops(pattern), selectedIndex=selectedPatternStopIndex(ordered,stop,vehicle&&vehicle.along,v.progressOccurrence);
            const selected=selectedIndex>=0?ordered[selectedIndex]:null;
            // Only project the stop when the ordered stop list could not place it.
            // Start at the vehicle's segment so a loop returning to the same physical
            // point resolves to the visit still ahead rather than the one already passed.
            const target=selected
              ? {along:selected.along,metres:dist(selected.lat,selected.lon,stop.lat,stop.lon),total:vehicle&&vehicle.total}
              : projectToPattern(pattern.points,stop.lat,stop.lon,Math.max(0,Number(vehicle&&vehicle.segment)||0));
            if(!vehicle || !target || vehicle.metres>650 || target.metres>250) return null;
            const remaining=target.along-vehicle.along;
            return {
              remaining,
              passed:remaining < -120,
              vehicleOffset:vehicle.metres,
              stopOffset:target.metres,
              total:vehicle.total,
              pattern,selectedIndex,vehicleAlong:vehicle.along
            };''',
              1,
              'journey geometry repeated-stop targeting'
          )

          bus = replace_exact(
              bus,
              '''function selectedPatternStopIndex(stops,selectedStop){
            const chosen=selectedStop||S.stop;
            if(!stops.length||!chosen) return -1;
            const ids=[chosen===S.stop&&S.ttStop&&S.ttStop.id,chosen.timetableId,chosen.atco,chosen.code,chosen.id].map(v=>String(v||'')).filter(Boolean);
            let index=stops.findIndex(stop=>ids.includes(String(stop.id)));
            if(index>=0) return index;
            let best=-1,bestDistance=Infinity;
            stops.forEach((stop,i)=>{ const metres=dist(stop.lat,stop.lon,chosen.lat,chosen.lon); if(metres<bestDistance){bestDistance=metres;best=i;} });
            return bestDistance<=180?best:-1;
          }
          function routePatternMovementFit(pattern,v,stop){''',
              '''function selectedPatternStopIndex(stops,selectedStop,minimumAlong,preferredOccurrence){
            const chosen=selectedStop||S.stop;
            if(!stops.length||!chosen) return -1;
            const ids=[chosen===S.stop&&S.ttStop&&S.ttStop.id,chosen.timetableId,chosen.atco,chosen.code,chosen.id].map(v=>String(v||'')).filter(Boolean);
            const exact=[];
            stops.forEach((stop,index)=>{ if(ids.includes(String(stop.id))) exact.push(index); });
            if(exact.length){
              const occurrence=Number(preferredOccurrence), threshold=Number(minimumAlong)-120;
              if(Number.isInteger(occurrence)&&occurrence>=0&&occurrence<exact.length){
                const preferred=exact[occurrence];
                if(!isFinite(minimumAlong)||Number(stops[preferred].along)>=threshold) return preferred;
              }
              if(isFinite(minimumAlong)){
                const ahead=exact.find(index=>Number(stops[index].along)>=threshold);
                if(ahead!==undefined) return ahead;
                return exact[exact.length-1];
              }
              return exact[0];
            }
            let best=-1,bestDistance=Infinity;
            stops.forEach((stop,i)=>{ const metres=dist(stop.lat,stop.lon,chosen.lat,chosen.lon); if(metres<bestDistance){bestDistance=metres;best=i;} });
            return bestDistance<=180?best:-1;
          }
          function routePatternMovementFit(pattern,v,stop,preferredOccurrence){''',
              1,
              'repeated-stop selector and movement signature'
          )
          bus = replace_exact(
              bus,
              '''  const stops=orderedPatternStops(pattern),selectedIndex=selectedPatternStopIndex(stops,stop);
            const selected=selectedIndex>=0?stops[selectedIndex]:null;
            const projectedTarget=selected?null:projectToPattern(pattern.points,stop.lat,stop.lon);''',
              '''  const stops=orderedPatternStops(pattern), hasOccurrence=Number.isInteger(preferredOccurrence);
            const selectedIndex=selectedPatternStopIndex(stops,stop,hasOccurrence?NaN:last.along,preferredOccurrence);
            const selected=selectedIndex>=0?stops[selectedIndex]:null;
            const projectedTarget=selected?null:projectToPattern(pattern.points,stop.lat,stop.lon,Math.max(0,Number(last.segment)||0));''',
              1,
              'movement fit repeated-stop target'
          )

          bus = replace_exact(
              bus,
              '''    let fit=fits.get(pattern.id);
              if(fit===undefined){fit=routePatternMovementFit(pattern,v,stop);fits.set(pattern.id,fit||null);}
              if(!fit) continue;
              const candidate=inferenceCandidate(row,pattern,fit,v,now); if(!candidate) continue;
              const current=byPattern.get(pattern.id);
              if(!current||candidate.score<current.score) byPattern.set(pattern.id,candidate);''',
              '''    const occurrence=Number.isInteger(row.stopOccurrence)?row.stopOccurrence:null;
              const fitKey=pattern.id+'|'+(occurrence==null?'':occurrence);
              let fit=fits.get(fitKey);
              if(fit===undefined){fit=routePatternMovementFit(pattern,v,stop,occurrence);fits.set(fitKey,fit||null);}
              if(!fit) continue;
              const candidate=inferenceCandidate(row,pattern,fit,v,now); if(!candidate) continue;
              const current=byPattern.get(fitKey);
              if(!current||candidate.score<current.score) byPattern.set(fitKey,candidate);''',
              1,
              'inference fit by stop occurrence'
          )
          bus = replace_exact(
              bus,
              '''    const fit=pattern&&routePatternMovementFit(pattern,v,stop);''',
              '''    const fit=pattern&&routePatternMovementFit(pattern,v,stop,held.stopOccurrence);''',
              1,
              'held inference occurrence'
          )
          bus = replace_exact(
              bus,
              '''    if(now-Number(v.inferredAt||0)>ROUTE_INFERENCE_GRACE_MS){delete v.inferredJourney;delete v.inferredTrip;delete v.inferredPattern;}''',
              '''    if(now-Number(v.inferredAt||0)>ROUTE_INFERENCE_GRACE_MS){delete v.inferredJourney;delete v.inferredTrip;delete v.inferredPattern;delete v.inferredOccurrence;}''',
              1,
              'expired inferred occurrence'
          )
          bus = replace_exact(
              bus,
              '''  const result={...best,trip:String(best.trip||best.row&&best.row.trip||''),patternId:String(best.pattern.id),inferred:true};
            v.inferredJourney=result;v.inferredTrip=result.trip;v.inferredPattern=result.patternId;v.inferredAt=now;''',
              '''  const stopOccurrence=Number.isInteger(best.row&&best.row.stopOccurrence)?best.row.stopOccurrence:null;
            const result={...best,trip:String(best.trip||best.row&&best.row.trip||''),patternId:String(best.pattern.id),stopOccurrence,inferred:true};
            v.inferredJourney=result;v.inferredTrip=result.trip;v.inferredPattern=result.patternId;v.inferredOccurrence=stopOccurrence;v.inferredAt=now;''',
              1,
              'inferred occurrence result'
          )
          bus = replace_exact(
              bus,
              '''  const selectedIndex=selectedPatternStopIndex(stops);''',
              '''  const selectedIndex=selectedPatternStopIndex(stops,undefined,confirmedVehicle.along,v.progressOccurrence);''',
              1,
              'journey progress repeated stop'
          )

          bus = replace_exact(
              bus,
              '''function mergeRouteScanMatches(target,items){
            const seen=new Set(target.map(item=>String(item.trip)));
            for(const item of items) if(item&&item.trip&&!seen.has(String(item.trip))){target.push(item);seen.add(String(item.trip));}
          }''',
              '''function routeScanMatchKey(item){
            return String(item&&item.trip||'')+'|'+(Number.isInteger(item&&item.stopOccurrence)?item.stopOccurrence:'');
          }
          function mergeRouteScanMatches(target,items){
            const seen=new Set(target.map(routeScanMatchKey));
            for(const item of items){
              const key=routeScanMatchKey(item);
              if(item&&item.trip&&!seen.has(key)){target.push(item);seen.add(key);}
            }
          }''',
              1,
              'route scan occurrence identity'
          )
          bus = replace_exact(
              bus,
              '''    const ordered=orderedPatternStops(pattern), selectedIndex=selectedPatternStopIndex(ordered);''',
              '''    const ordered=orderedPatternStops(pattern), selectedIndex=selectedPatternStopIndex(ordered,undefined,NaN,row.stopOccurrence);''',
              1,
              'route scan target occurrence'
          )
          bus = replace_exact(
              bus,
              '''    const match={trip:String(row.trip),line:String(row.line),head:row.head||'',pattern,targetAlong,at:Number(row.at)||0};''',
              '''    const match={trip:String(row.trip),line:String(row.line),head:row.head||'',pattern,targetAlong,at:Number(row.at)||0,stopOccurrence:row.stopOccurrence};''',
              1,
              'route scan match occurrence'
          )
          bus = replace_exact(
              bus,
              '''    const fit=routePatternMovementFit(match.pattern,v,S.stop);
              if(!fit) continue;''',
              '''    const fit=routePatternMovementFit(match.pattern,v,S.stop,match.stopOccurrence);
              if(!fit) continue;''',
              1,
              'route scan inference occurrence'
          )
          bus = replace_exact(
              bus,
              '''    const candidate={trip:String(match.trip),pattern:match.pattern,fit,score,scheduleGap,row:match};
              const current=byPattern.get(match.pattern.id);
              if(!current||candidate.score<current.score) byPattern.set(match.pattern.id,candidate);''',
              '''    const candidate={trip:String(match.trip),pattern:match.pattern,fit,score,scheduleGap,row:match};
              const key=match.pattern.id+'|'+(Number.isInteger(match.stopOccurrence)?match.stopOccurrence:'');
              const current=byPattern.get(key);
              if(!current||candidate.score<current.score) byPattern.set(key,candidate);''',
              1,
              'route scan candidates by occurrence'
          )
          bus = replace_exact(
              bus,
              '''  if(v.journey){
              const tripMatch=uniqueCompatibleTrips(plan.matches,v.journey,item=>item.trip);
              if(tripMatch.items.length&&!tripMatch.ambiguous) match=tripMatch.items[0];
            }''',
              '''  if(v.journey){
              const tripMatch=uniqueCompatibleTrips(plan.matches,v.journey,item=>item.trip);
              if(tripMatch.items.length&&!tripMatch.ambiguous){
                const compatible=tripMatch.items.map(item=>{
                  const position=projectVehicleToPattern(item.pattern,v);
                  return {item,position,remaining:position?item.targetAlong-position.along:Infinity};
                }).filter(candidate=>candidate.position&&candidate.position.metres<=800&&candidate.remaining>=-120&&candidate.remaining<=ROUTE_SCAN_MAX_ROUTE_METRES)
                  .sort((a,b)=>a.remaining-b.remaining||a.position.metres-b.position.metres);
                if(compatible.length) match=compatible[0].item;
              }
            }''',
              1,
              'exact route scan repeated occurrence'
          )
          bus = replace_exact(
              bus,
              '''  v.corridorTrip=match.trip; v.corridorTracked=true; v.corridorRemaining=remaining; v.corridorConfirmedAt=Date.now();
            if(inferred){v.inferredTrip=match.trip;v.inferredPattern=match.pattern.id;v.inferredAt=Date.now();}''',
              '''  v.corridorTrip=match.trip; v.corridorOccurrence=Number.isInteger(match.stopOccurrence)?match.stopOccurrence:null;
            v.corridorTracked=true; v.corridorRemaining=remaining; v.corridorConfirmedAt=Date.now();
            if(inferred){v.inferredTrip=match.trip;v.inferredPattern=match.pattern.id;v.inferredOccurrence=v.corridorOccurrence;v.inferredAt=Date.now();}''',
              1,
              'corridor occurrence persistence'
          )

          bus = replace_exact(
              bus,
              '''    rec.corridorTrip=v.corridorTrip;
              rec.corridorRemaining=v.corridorRemaining;''',
              '''    rec.corridorTrip=v.corridorTrip;
              rec.corridorOccurrence=Number.isInteger(v.corridorOccurrence)?v.corridorOccurrence:null;
              rec.corridorRemaining=v.corridorRemaining;''',
              1,
              'older corridor occurrence merge'
          )
          bus = replace_exact(
              bus,
              '''      delete rec.inferredJourney;delete rec.inferredTrip;delete rec.inferredPattern;delete rec.inferredAt;delete rec.inferenceStopId;delete rec.inferenceGpsTs;''',
              '''      delete rec.inferredJourney;delete rec.inferredTrip;delete rec.inferredPattern;delete rec.inferredOccurrence;delete rec.inferredAt;delete rec.inferenceStopId;delete rec.inferenceGpsTs;''',
              1,
              'reset inferred occurrence'
          )
          bus = replace_exact(
              bus,
              '''    const corridor=keepCorridor?{trip:prev.corridorTrip,remaining:prev.corridorRemaining,at:prev.corridorConfirmedAt}:null;
              if(journeyChanged){delete rec.routeProjection;delete rec.corridorTrip;delete rec.corridorRemaining;delete rec.corridorConfirmedAt;delete rec.lastShownSnapshot;delete rec.lastShownAt;delete rec.lastShownArrivalAt;}
              Object.assign(rec, v);
              if(corridor){ rec.corridorTrip=corridor.trip; rec.corridorRemaining=corridor.remaining; rec.corridorConfirmedAt=corridor.at; rec.corridorTracked=true; }
              else if(corridorExpired){ delete rec.corridorTrip; delete rec.corridorRemaining; delete rec.corridorConfirmedAt; rec.corridorTracked=false; }''',
              '''    const corridor=keepCorridor?{trip:prev.corridorTrip,occurrence:prev.corridorOccurrence,remaining:prev.corridorRemaining,at:prev.corridorConfirmedAt}:null;
              if(journeyChanged){delete rec.routeProjection;delete rec.corridorTrip;delete rec.corridorOccurrence;delete rec.corridorRemaining;delete rec.corridorConfirmedAt;delete rec.lastShownSnapshot;delete rec.lastShownAt;delete rec.lastShownArrivalAt;}
              Object.assign(rec, v);
              if(corridor){ rec.corridorTrip=corridor.trip; rec.corridorOccurrence=Number.isInteger(corridor.occurrence)?corridor.occurrence:null; rec.corridorRemaining=corridor.remaining; rec.corridorConfirmedAt=corridor.at; rec.corridorTracked=true; }
              else if(corridorExpired){ delete rec.corridorTrip; delete rec.corridorOccurrence; delete rec.corridorRemaining; delete rec.corridorConfirmedAt; rec.corridorTracked=false; }''',
              1,
              'corridor occurrence grace'
          )

          bus = replace_exact(
              bus,
              '''    const matchedRow=evidence.matchedTrip?timetableRowsForLine(v.line,new Date()).find(row=>String(row.trip)===String(evidence.matchedTrip)):null;
              v.progressTrip=evidence.matchedTrip||v.corridorTrip||v.journey||'';
              v.progressPattern=String(inference&&inference.patternId||matchedRow&&matchedRow.pattern||'');''',
              '''    const matchedRows=evidence.matchedTrip?timetableRowsForLine(v.line,new Date()).filter(row=>String(row.trip)===String(evidence.matchedTrip)):[];
              const matchedRow=matchedRows[0]||null;
              v.progressTrip=evidence.matchedTrip||v.corridorTrip||v.journey||'';
              v.progressPattern=String(inference&&inference.patternId||matchedRow&&matchedRow.pattern||'');
              v.progressOccurrence=Number.isInteger(inference&&inference.stopOccurrence)
                ? inference.stopOccurrence
                : Number.isInteger(v.corridorOccurrence)?v.corridorOccurrence:null;''',
              1,
              'live progress occurrence'
          )
          bus = replace_exact(
              bus,
              '''    const directionSchedule=est.schedule||matchedRow;
              const scheduledDir=scheduledJourneyDirection(directionSchedule);''',
              '''    if(est.schedule&&Number.isInteger(est.schedule.stopOccurrence)) v.progressOccurrence=est.schedule.stopOccurrence;
              const directionSchedule=est.schedule||matchedRow;
              const scheduledDir=scheduledJourneyDirection(directionSchedule,geometry&&geometry.selectedIndex);''',
              1,
              'direction occurrence selection'
          )
          bus = replace_exact(
              bus,
              '''    const orderedMovement=geometry?routePatternMovementFit(geometry.pattern,v,S.stop):null;''',
              '''    const orderedMovement=geometry?routePatternMovementFit(geometry.pattern,v,S.stop,v.progressOccurrence):null;''',
              1,
              'ordered movement occurrence'
          )
          bus = replace_exact(
              bus,
              '''    if(est.schedule){ v.progressTrip=est.schedule.trip||v.progressTrip; v.progressPattern=String(est.schedule.pattern||v.progressPattern||''); }''',
              '''    if(est.schedule){ v.progressTrip=est.schedule.trip||v.progressTrip; v.progressPattern=String(est.schedule.pattern||v.progressPattern||''); if(Number.isInteger(est.schedule.stopOccurrence)) v.progressOccurrence=est.schedule.stopOccurrence; }''',
              1,
              'scheduled progress occurrence'
          )

          bus = replace_exact(
              bus,
              '''delete vehicle.corridorTrip; delete vehicle.corridorRemaining; delete vehicle.corridorConfirmedAt; delete vehicle.inferredJourney; delete vehicle.inferredTrip; delete vehicle.inferredPattern; delete vehicle.inferredAt;''',
              '''delete vehicle.corridorTrip; delete vehicle.corridorOccurrence; delete vehicle.corridorRemaining; delete vehicle.corridorConfirmedAt; delete vehicle.inferredJourney; delete vehicle.inferredTrip; delete vehicle.inferredPattern; delete vehicle.inferredOccurrence; delete vehicle.inferredAt; delete vehicle.progressOccurrence;''',
              1,
              'selected stop occurrence reset'
          )

          bus = replace_exact(
              bus,
              '''liveVehicleIdentity,parseLivePayloads,fetchLive,ingest,relevant''',
              '''liveVehicleIdentity,parseLivePayloads,fetchTimed,selectedPatternStopIndex,fetchLive,ingest,relevant''',
              1,
              'test API exports'
          )

          bus_path.write_text(bus, encoding='utf-8')

          test_path = Path('kerbside-backend/tests/browser-regression.mjs')
          test = test_path.read_text(encoding='utf-8')
          test = replace_exact(
              test,
              '''assert.match(busSource, /function routePatternMovementFit\\(pattern,v,stop\\)/);''',
              '''assert.match(busSource, /function routePatternMovementFit\\(pattern,v,stop,preferredOccurrence\\)/);''',
              1,
              'movement-fit source assertion'
          )
          test = replace_exact(
              test,
              '''assert.match(busSource, /function scheduledJourneyDirection\\(row\\)/);''',
              '''assert.match(busSource, /function scheduledJourneyDirection\\(row,selectedIndex\\)/);''',
              1,
              'scheduled direction source assertion'
          )
          test = replace_exact(
              test,
              '''assert.match(busSource, /scheduledJourneyDirection\\(directionSchedule\\)/);''',
              '''assert.match(busSource, /scheduledJourneyDirection\\(directionSchedule,geometry&&geometry\\.selectedIndex\\)/);''',
              1,
              'scheduled direction call assertion'
          )
          test = replace_exact(
              test,
              '''assert.match(busSource, /if\\(run!==geocodeRun\\) return/);''',
              '''assert.match(busSource, /if\\(run!==geocodeRun\\) return/);
          // The timeout must remain armed while the response body downloads, not
          // stop as soon as headers arrive.
          assert.match(busSource, /const body=await response\\.arrayBuffer\\(\\)/);
          assert.match(busSource, /return new Response\\(nullBody\\?null:body/);
          // Circular journeys can call at one stop more than once. Timetable rows
          // retain that occurrence and route matching chooses the visit still ahead.
          assert.match(busSource, /stopOccurrence=trip\\?\\(rawOccurrences\\.get\\(trip\\)\\|\\|0\\):null/);
          assert.match(busSource, /selectedPatternStopIndex\\(ordered,stop,vehicle&&vehicle\\.along,v\\.progressOccurrence\\)/);''',
              1,
              'timeout and circular source assertions'
          )

          runtime_checks = '''  const repeatedStopRows=await page.evaluate(()=>{
            const api=window.__KERBSIDE_TEST__,state=api.liveState;
            const saved={ttStop:state.ttStop,timetable:state.timetable,timetableSource:state.timetableSource,timetableRun:state.timetableRun};
            try{
