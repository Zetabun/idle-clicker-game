      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Kerbside test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          npm run vendor:leaflet --prefix kerbside-backend
          cd kerbside-backend
          npx playwright install --with-deps webkit chromium

      - name: Validate syntax, versions, and unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sync-version.py --check
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          source = Path('bus.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>', source, flags=re.I | re.S)
          if not scripts:
              raise SystemExit('No inline browser scripts found')
          with tempfile.TemporaryDirectory() as directory:
              for index, script in enumerate(scripts, start=1):
                  filename = Path(directory) / f'inline-{index}.js'
                  filename.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(filename)], check=True)
          print(f'Validated {len(scripts)} inline browser script(s).')
          PY
          node --check build-timetable.js
          npm --prefix kerbside-backend run check
          npm --prefix kerbside-backend test
          node kerbside-backend/tests/identity-regression.mjs

      - name: Run full mobile browser regressions
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix kerbside-backend run test:browser
          KERBSIDE_BROWSER=chromium npm --prefix kerbside-backend run test:browser

      - name: Commit verified Kerbside 0.6.86 to main
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-kerbside-circular-timeout.yml
          git diff --check
          git add VERSION bus.html kerbside-backend/package.json kerbside-backend/src/worker.js kerbside-backend/test/worker.test.js kerbside-backend/tests/browser-regression.mjs .github/workflows/fix-kerbside-circular-timeout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Kerbside 0.6.86: keep circular calls live and time complete response bodies' \
            -m 'Track repeated stop occurrences through timetable rows, journey geometry, inference and route-corridor scans so a bus returning to the same stop is matched to the visit still ahead.' \
            -m 'Keep browser abort timers active until XML or JSON response bodies have fully downloaded, with WebKit and Chromium regressions for a server that stalls after sending headers.'
          git push origin HEAD:main
