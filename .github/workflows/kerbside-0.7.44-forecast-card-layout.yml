name: Kerbside 0.7.44 forecast card layout

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/kerbside-0.7.44-forecast-card-layout.yml

permissions:
  contents: write

concurrency:
  group: kerbside-0.7.44-forecast-card-layout
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Apply forecast card layout fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          css_old = ".train-forecast-calibration i{color:var(--text-mute);font-size:9px;font-style:normal}"
          css_new = """.train-forecast-calibration i{
            display:block;width:auto;height:auto;border-radius:0;
            color:var(--text-mute);font-size:9px;font-style:normal;line-height:1.45;overflow-wrap:anywhere;
          }"""
          replace_once('kerbside-trains.css', css_old, css_new)

          bus = Path('bus.html')
          text = bus.read_text(encoding='utf-8')
          if "const APP_VERSION = '0.7.43';" not in text:
              raise SystemExit('bus.html: expected APP_VERSION 0.7.43')
          if '?v=0.7.43' not in text:
              raise SystemExit('bus.html: expected 0.7.43 cache busters')
          text = text.replace("const APP_VERSION = '0.7.43';", "const APP_VERSION = '0.7.44';", 1)
          text = text.replace('?v=0.7.43', '?v=0.7.44')
          bus.write_text(text, encoding='utf-8')

          Path('VERSION').write_text('0.7.44\n', encoding='utf-8')
          replace_once('kerbside-status.js', "const VERSION='0.7.43';", "const VERSION='0.7.44';")

          test = r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import {fileURLToPath} from 'node:url';

          const here=path.dirname(fileURLToPath(import.meta.url));
          const root=path.resolve(here,'..','..');
          const css=await fs.readFile(path.join(root,'kerbside-trains.css'),'utf8');
          const forecast=await fs.readFile(path.join(root,'kerbside-train-forecast-v3.js'),'utf8');

          test('measured baseline source is not constrained to forecast-dot geometry',()=>{
            assert.match(forecast,/train-forecast-calibration[^\n]+<i>/,'calibration source should still render inside its semantic source element');
            const rule=css.match(/\.train-forecast-calibration i\{([^}]*)\}/);
            assert.ok(rule,'calibration source CSS rule should exist');
            const body=rule[1].replace(/\s+/g,'');
            assert.match(body,/display:block/);
            assert.match(body,/width:auto/);
            assert.match(body,/height:auto/);
            assert.match(body,/border-radius:0/);
          });

          test('forecast dots keep their compact dot geometry',()=>{
            assert.match(css,/\.crowd-dot,\.train-crowding>i,\.train-crowding-explain i\{display:inline-block;width:7px;height:7px;border-radius:50%\}/);
          });
          '''
          Path('kerbside-backend/test/train-forecast-layout.test.mjs').write_text(test.replace('          ',''), encoding='utf-8')
          PY

      - name: Validate forecast card layout
        shell: bash
        run: |
          set -euo pipefail
          node --check kerbside-train-forecast-v3.js
          node --test kerbside-backend/test/train-forecast-layout.test.mjs
          node --test kerbside-backend/tests/train-forecast-v3-dual-timetable.mjs
          node --test kerbside-backend/test/train-route-swap.test.mjs
          git diff --check
          grep -Fx '0.7.44' VERSION
          grep -F 'kerbside-trains.css?v=0.7.44' bus.html
          grep -F 'display:block;width:auto;height:auto;border-radius:0' kerbside-trains.css

      - name: Publish Kerbside 0.7.44
        shell: bash
        run: |
          set -euo pipefail
          git add VERSION bus.html kerbside-status.js kerbside-trains.css kerbside-backend/test/train-forecast-layout.test.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Kerbside 0.7.44: let forecast cards fit calibration text'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo 'Failed to publish after three rebased attempts.' >&2
          exit 1
