name: Apply Kerbside mobile hotfix

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diagnose-kerbside-live.yml

permissions:
  contents: write

concurrency:
  group: kerbside-mobile-hotfix
  cancel-in-progress: true

jobs:
  apply-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/fix-kerbside-live-regression
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Apply focused UI and direction hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          bus = Path('bus.html')
          replace_exact(
              bus,
              '''    /* Search had to share a row with the direction switch and the settings
                 button, which left the input 162px wide carrying 111px of icon and
                 button padding: 49px of usable text, too narrow for "Halesowen", let
                 alone a restored "My location". It gets its own row. */
              grid-template-areas:"brand brand brand" "search search search" "directions directions settings";''',
              '''    /* Keep location, direction and settings together in the established
                 compact Kerbside mobile header. */
              grid-template-areas:"brand brand brand" "search directions settings";''',
              'mobile header layout'
          )
          replace_exact(
              bus,
              '<button id="dIn" aria-pressed="true"><span class="arrow">&#8594;</span><span class="lbl">Into town</span><span class="lblshort">In</span></button>',
              '<button id="dIn" aria-pressed="false"><span class="arrow">&#8594;</span><span class="lbl">Into town</span><span class="lblshort">In</span></button>',
              'inbound initial button state'
          )
          replace_exact(
              bus,
              '<button id="dAll" aria-pressed="false"><span class="lbl">Both</span><span class="lblshort">Both</span></button>',
              '<button id="dAll" aria-pressed="true"><span class="lbl">Both</span><span class="lblshort">Both</span></button>',
              'both initial button state'
          )
          replace_exact(
              bus,
              "  dir:'in',                 // 'in' | 'out' | 'all'",
              "  dir:'all',                // 'in' | 'out' | 'all'",
              'default direction'
          )

          regression = Path('kerbside-backend/tests/browser-regression.mjs')
          text = regression.read_text(encoding='utf-8')
          target = 'assert.match(busSource, /grid-template-areas:"brand brand brand" "search search search" "directions directions settings"/);'
          if text.count(target) != 1:
              raise SystemExit(f'layout regression assertion: expected one match, found {text.count(target)}')
          lines = text.splitlines()
          index = lines.index(target)
          start = index
          while start > 0 and lines[start - 1].lstrip().startswith('//'):
              start -= 1
          replacement = [
              '// The compact mobile header keeps location, direction and settings on one row.',
              'assert.match(busSource, /grid-template-areas:"brand brand brand" "search directions settings"/);',
              'assert.ok(busSource.includes(\'<button id="dIn" aria-pressed="false">\'));',
              'assert.ok(busSource.includes(\'<button id="dAll" aria-pressed="true">\'));',
              "assert.match(busSource, /dir:'all'/);"
          ]
          lines[start:index + 1] = replacement
          text = '\n'.join(lines) + '\n'
          old_runtime = '''    brandAbove:true,searchAboveControls:true,searchFullWidth:true,
              controlsAligned:true,controlsOrdered:true,withinViewport:true,'''
          new_runtime = '''    brandAbove:true,searchAboveControls:false,searchFullWidth:false,
              controlsAligned:true,controlsOrdered:true,withinViewport:true,'''
          if text.count(old_runtime) != 1:
              raise SystemExit(f'mobile runtime expectation: expected one match, found {text.count(old_runtime)}')
          text = text.replace(old_runtime, new_runtime, 1)
          regression.write_text(text, encoding='utf-8')

          Path('VERSION').write_text('0.6.94\n', encoding='utf-8')
          PY
          python3 .github/scripts/sync-version.py
      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          npm run vendor:leaflet --prefix kerbside-backend
          if git ls-files --error-unmatch kerbside-backend/vendor/leaflet/leaflet.js >/dev/null 2>&1; then
            git diff --exit-code -- kerbside-backend/vendor/leaflet
          fi
          cd kerbside-backend
          npx playwright install --with-deps webkit chromium
      - name: Validate source and complete regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sync-version.py --check
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          source = Path('bus.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', source, flags=re.I | re.S)
          if not scripts:
              raise SystemExit('No inline browser scripts found')
          with tempfile.TemporaryDirectory() as directory:
              for index, script in enumerate(scripts, 1):
                  filename = Path(directory) / f'inline-{index}.js'
                  filename.write_text(script, encoding='utf-8')
                  subprocess.run(['node', '--check', str(filename)], check=True)
          PY
          node --check build-timetable.js
          npm run check --prefix kerbside-backend
          npm test --prefix kerbside-backend
          for engine in webkit chromium; do
            export KERBSIDE_BROWSER="$engine"
            npm run test:browser --prefix kerbside-backend
            npm run test:identity --prefix kerbside-backend
            npm run test:multi-vehicle --prefix kerbside-backend
            npm run test:audit --prefix kerbside-backend
          done
      - name: Commit validated hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            VERSION \
            bus.html \
            kerbside-backend/package.json \
            kerbside-backend/src/worker.js \
            kerbside-backend/test/worker.test.js \
            kerbside-backend/tests/browser-regression.mjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No hotfix changes were staged.' >&2
            exit 1
          fi
          git commit -m 'Kerbside 0.6.94: restore compact mobile controls' \
            -m 'Put location, direction and settings back on the same mobile row and default new sessions to Both so a one-way filter cannot make a working stop appear empty.'
          git push origin HEAD:agent/fix-kerbside-live-regression
