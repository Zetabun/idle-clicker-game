name: Strikewatch 12.175 release

on:
  workflow_dispatch:
  page_build:

permissions:
  contents: write
  issues: write

concurrency:
  group: strikewatch-release-12-175
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require dedicated trigger
        id: trigger
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -f .github/release-triggers/12.175.txt ]; then
            echo "run_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run verified release
        if: steps.trigger.outputs.run_release == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/release-12-175.log) 2>&1
          report_failure() {
            status=$?
            if [ "$status" -ne 0 ]; then
              tail -c 50000 /tmp/release-12-175.log > /tmp/release-12-175-tail.log || true
              {
                echo 'The automated 12.175 release failed. Captured log:'
                echo
                echo '```text'
                cat /tmp/release-12-175-tail.log
                echo '```'
              } > /tmp/release-12-175-issue.md
              gh issue create --title 'STRIKEWATCH 12.175 RELEASE FAILURE' --body-file /tmp/release-12-175-issue.md || true
            fi
            exit "$status"
          }
          trap report_failure EXIT

          python3 .github/scripts/release-12-175.py
          cd strikewatch-source
          python3 -m py_compile build.py
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.175.html dist/strikewatch-build-12.175-size.json dist/strikewatch-build-12.175-css-debt.json > /tmp/build-a.sha
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.175.html dist/strikewatch-build-12.175-size.json dist/strikewatch-build-12.175-css-debt.json > /tmp/build-b.sha
          diff -u /tmp/build-a.sha /tmp/build-b.sha
          for file in js/[0-9][0-9]-*.js js/strikewatch.dev.js; do
            node --check "$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          root = Path('.')
          html = (root / 'dist/strikewatch-build-12.175.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          if not scripts:
              raise SystemExit('No inline standalone JavaScript found')
          Path('/tmp/strikewatch-12.175-inline.js').write_text('\n'.join(scripts), encoding='utf-8')

          game = (root / 'css/game.css').read_text(encoding='utf-8')
          agenda = (root / 'css/calendar-agenda.css').read_text(encoding='utf-8')
          marker = 'Event agenda: readable at both targets'
          if marker in game:
              raise SystemExit('Calendar agenda layer still exists in game.css')
          if agenda.count(marker) != 1:
              raise SystemExit('Calendar agenda ownership marker missing or duplicated')
          required = (
              '#menuContent .club-calendar-agenda-item > time b { font-size: 10px !important; }',
              '#menuContent .club-calendar-agenda-item > time strong { font-size: 22px !important; }',
              '#menuContent .club-calendar-agenda-item > div strong { font-size: 13px !important; }',
              '#menuContent .club-calendar-agenda-item > div small { font-size: 11px !important; }',
              '#menuContent .club-calendar-agenda-action { min-width: 118px; }',
              '@media (max-width: 1023px)',
              'grid-template-columns: 62px minmax(0, 1fr) !important',
              '#menuContent .club-calendar-agenda-item > time strong { font-size: 24px !important; }',
              '#menuContent .club-calendar-agenda-item > div strong { font-size: 15px !important; white-space: normal !important; }',
              '#menuContent .club-calendar-agenda-item > div small { font-size: 12px !important; white-space: normal !important; line-height: 1.45 !important; }',
              'grid-column: 2',
              'min-width: 150px !important',
              'min-height: 44px !important',
          )
          if any(rule not in agenda for rule in required):
              raise SystemExit('Calendar agenda presentation rule missing')
          if '<link rel="stylesheet" href="css/' in html:
              raise SystemExit('Standalone retained a development stylesheet link')

          report = json.loads((root / 'dist/strikewatch-build-12.175-css-debt.json').read_text(encoding='utf-8'))
          expected_order = [
              'game.css', 'calendar-agenda.css', 'training-readability.css',
              'training-programme.css', 'management-feedback.css',
              'compact-readability.css', 'reward-reveal.css', 'armour-viewer.css',
              'weapon-presentation.css', 'loadout-stills.css',
              '12.161-audit-fixes.css', 'armoury-inventory.css',
              'compact-navigation.css',
          ]
          if report.get('stylesheet_order') != expected_order:
              raise SystemExit(f'Unexpected stylesheet order: {report}')
          if report.get('stylesheets') != 13 or report.get('owned_calendar_agenda_lines', 0) < 40:
              raise SystemExit(f'Unexpected calendar agenda ownership report: {report}')
          if not report.get('within_budget') or report.get('game_css_lines', 999999) > 31230:
              raise SystemExit(f'CSS debt budget failed: {report}')

          bundle = (root / 'js/strikewatch.dev.js').read_text(encoding='utf-8')
          hooks = (
              'clubCalendarAgendaActionMarkup',
              'clubCalendarAgendaMarkup',
              'renderClubCalendarTab',
              'mobileInterfaceAuditForTest',
              'typographyConsistencyForTest',
          )
          if any(hook not in bundle for hook in hooks):
              raise SystemExit('Expected calendar/readability regression hook missing')
          print(json.dumps(report, indent=2))
          PY
          node --check /tmp/strikewatch-12.175-inline.js
          cp dist/strikewatch-build-12.175.html ../cod.html
          cmp -s ../cod.html dist/strikewatch-build-12.175.html
          cd ..
          rm -f .github/scripts/release-12-175.py .github/workflows/release-12-175.yml .github/release-triggers/12.175.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- strikewatch-source cod.html .github
          git commit -m 'Build 12.175: establish calendar agenda CSS ownership'
          git fetch origin main
          git rebase origin/main
          rm -f .github/release-triggers/12.175.txt
          git add -A -- .github
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git push origin HEAD:main
