name: Fix Kerbside mobile controls

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-kerbside-mobile-controls.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-kerbside-mobile-controls
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Apply the focused UI fix and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(text, old, new, expected, label):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} exact match(es), found {count}")
              return text.replace(old, new)

          bus_path = Path('bus.html')
          bus = bus_path.read_text(encoding='utf-8')

          bus = replace_exact(
              bus,
              '<input id="q" type="text" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search for a location">',
              '<input id="q" type="text" placeholder="search" autocomplete="off" spellcheck="false" aria-label="Search for a location">',
              1,
              'search placeholder'
          )
          bus = replace_exact(
              bus,
              "p=>{ $('q').value='My location'; setOrigin(p.coords.latitude,p.coords.longitude,'My location'); },",
              "p=>{ $('q').value=''; setOrigin(p.coords.latitude,p.coords.longitude,'My location'); },",
              2,
              'geolocation search value'
          )
          bus = replace_exact(
              bus,
              '  .dirswitch{grid-area:directions;margin:0;align-self:stretch;min-width:0;border-radius:10px}',
              '  .dirswitch{grid-area:directions;margin:0;align-self:stretch;min-width:0;height:46px;border-radius:10px}',
              1,
              'mobile direction container'
          )
          bus = replace_exact(
              bus,
              '  .dirswitch button{height:38px;padding:0 8px;font-size:12px;gap:3px}',
              '  .dirswitch button{height:38px;min-width:0;padding:0 8px;border-radius:8px;font-size:12px;gap:3px}',
              1,
              'mobile direction buttons'
          )
          bus = replace_exact(
              bus,
              '''body.theme-crystal .searchwrap input,
          body.theme-crystal .dirswitch,
          body.theme-crystal .settings-tab,
          body.theme-crystal .destchip,
          body.theme-crystal .chip{border-radius:999px}
          body.theme-crystal .searchwrap input{background:var(--ink);border-color:transparent}''',
              '''body.theme-crystal .searchwrap input,
          body.theme-crystal .dirswitch,
          body.theme-crystal .settings-tab,
          body.theme-crystal .destchip,
          body.theme-crystal .chip{border-radius:999px}
          body.theme-crystal .dirswitch button{border-radius:999px}
          body.theme-crystal .searchwrap input{background:var(--ink);border-color:transparent}''',
              1,
              'Crystal direction button radius'
          )

          bus_path.write_text(bus, encoding='utf-8')

          test_path = Path('kerbside-backend/tests/browser-regression.mjs')
          test = test_path.read_text(encoding='utf-8')
          test = replace_exact(
              test,
              'assert.match(busSource, /id="q"[^>]*placeholder="Search"/);',
              '''assert.match(busSource, /id="q"[^>]*placeholder="search"/);
          assert.doesNotMatch(busSource, /\$\('q'\)\.value='My location'/);
          assert.match(busSource, /\.dirswitch\{grid-area:directions;[^}]*height:46px;[^}]*border-radius:10px/);
          assert.match(busSource, /body\.theme-crystal \.dirswitch button\{border-radius:999px\}/);''',
              1,
              'search and direction source assertions'
          )

          dynamic_check = '''  const directionControl=await page.evaluate(()=>{
            const q=document.getElementById('q');
            const switcher=document.querySelector('.dirswitch');
            const buttons=[...switcher.querySelectorAll('button')];
            const both=document.getElementById('dAll');
            const originalCrystal=document.body.classList.contains('theme-crystal');
            const originalPressed=buttons.map(button=>button.getAttribute('aria-pressed'));
            buttons.forEach(button=>button.setAttribute('aria-pressed','false'));
            both.setAttribute('aria-pressed','true');
            const capture=crystal=>{
              document.body.classList.toggle('theme-crystal',crystal);
              const outer=switcher.getBoundingClientRect();
              const active=both.getBoundingClientRect();
              const style=getComputedStyle(both);
              return {
                theme:crystal?'crystal':'dark',
                contained:active.left>=outer.left-.5&&active.top>=outer.top-.5&&active.right<=outer.right+.5&&active.bottom<=outer.bottom+.5,
                outerHeight:outer.height,
                activeHeight:active.height,
                activeRadius:parseFloat(style.borderTopRightRadius)
              };
            };
            const layouts=[capture(false),capture(true)];
            document.body.classList.toggle('theme-crystal',originalCrystal);
            buttons.forEach((button,index)=>button.setAttribute('aria-pressed',originalPressed[index]));
            return {placeholder:q.getAttribute('placeholder'),value:q.value,layouts};
          });
          assert.equal(directionControl.placeholder,'search');
          assert.equal(directionControl.value,'');
          for(const layout of directionControl.layouts){
            assert.equal(layout.contained,true,`${layout.theme} Both button escaped its direction container`);
            assert.equal(Math.round(layout.outerHeight),46,`${layout.theme} direction container height changed`);
            assert.equal(Math.round(layout.activeHeight),38,`${layout.theme} Both button height changed`);
          }
          const darkDirection=directionControl.layouts.find(layout=>layout.theme==='dark');
          const crystalDirection=directionControl.layouts.find(layout=>layout.theme==='crystal');
          assert.ok(darkDirection.activeRadius>=7.5,'Dark-theme Both button no longer follows its rounded container');
          assert.ok(crystalDirection.activeRadius>=crystalDirection.activeHeight/2-1,'Crystal-theme Both button is not pill-shaped');
          const viewportContent=await page.locator('meta[name="viewport"]').getAttribute('content');'''
          test = replace_exact(
              test,
              '  const viewportContent=await page.locator(\'meta[name="viewport"]\').getAttribute(\'content\');',
              dynamic_check,
              1,
              'dynamic mobile direction regression check'
          )
          test_path.write_text(test, encoding='utf-8')
          PY

          git diff --check
          changed="$(git diff --name-only)"
          expected=$'bus.html\nkerbside-backend/tests/browser-regression.mjs'
          if [[ "$changed" != "$expected" ]]; then
            echo "::error::Unexpected changed files"
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$changed"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Kerbside test dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          cd kerbside-backend
          npx playwright install --with-deps webkit chromium

      - name: Run syntax and unit checks
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix kerbside-backend run check
          npm --prefix kerbside-backend test

      - name: Run the full mobile browser regression in both engines and both themes
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix kerbside-backend run test:browser
          KERBSIDE_BROWSER=chromium npm --prefix kerbside-backend run test:browser

      - name: Commit the verified fix to main and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-kerbside-mobile-controls.yml
          git diff --check
          git add bus.html kerbside-backend/tests/browser-regression.mjs .github/workflows/fix-kerbside-mobile-controls.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix Kerbside mobile search and direction controls'
          git push origin HEAD:main
