name: Kerbside final all-path trace

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/kerbside-full-trace-final.yml

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install trace dependencies
        id: install
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix kerbside-backend --no-audit --no-fund --package-lock=false
          npm run vendor:leaflet --prefix kerbside-backend
          cd kerbside-backend
          npx playwright install --with-deps webkit chromium

      - name: Full WebKit system trace
        id: webkit
        continue-on-error: true
        shell: bash
        env:
          KERBSIDE_BROWSER: webkit
        run: npm run test:full --prefix kerbside-backend

      - name: Full Chromium system trace
        id: chromium
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          KERBSIDE_BROWSER: chromium
        run: npm run test:full --prefix kerbside-backend

      - name: Production app, data and provider trace
        id: production
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          token="trace=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          today="$(TZ=Europe/London date +%F)"; compact="${today//-/}"
          version="$(tr -d '\r\n' < VERSION)"
          app='https://zetabun.github.io/idle-clicker-game'
          bus='https://kerbside-bus.adambullas.workers.dev'
          rail='https://kerbside-rail.adambullas.workers.dev'
          raildata="$app/kerbside-rail-timetable"
          busdata='https://kerbside-data-zetabun.pages.dev'

          echo '=== APP ==='
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "$app/bus.html?$token" -o "$tmp/app"
          grep -Fq "const APP_VERSION = '$version';" "$tmp/app"
          grep -Fq "kerbside-train-forecast-v3.js?v=$version" "$tmp/app"
          grep -Fq "kerbside-train-date.js?v=$version" "$tmp/app"
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "$app/kerbside-train-timetable.js?v=$version&$token" -o "$tmp/timetable-js"
          grep -Fq "journeyType:'connection'" "$tmp/timetable-js"
          echo "app-version=$version timetable-module=reachable"

          echo '=== BUS WORKER / LIVE SIRI ==='
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "$bus/health?$token" -o "$tmp/bus-health"
          jq -e --arg v "$version" '.ok==true and .version==$v and .bods==true' "$tmp/bus-health" >/dev/null
          jq -c '{ok,service,role,version,bods,matchedGtfsRt,upstreamTimeoutMs,upstreamAttempts}' "$tmp/bus-health"
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "$bus/feed?bbox=-2.15,52.45,-2.05,52.55&$token" -o "$tmp/siri"
          python3 - "$tmp/siri" <<'PY'
          import sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot(); local=lambda x:x.rsplit('}',1)[-1]
          names={local(x.tag) for x in root.iter()}; assert local(root.tag)=='Siri' and 'VehicleMonitoringDelivery' in names
          print('live-bus-siri=valid')
          PY

          echo '=== OFFICIAL RAIL WORKER / LIVE DARWIN ==='
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 -H 'Origin: https://zetabun.github.io' "$rail/health?$token" -o "$tmp/rail-health"
          jq -e '.ok==true and .service=="kerbside-rail" and .ldbConfigured==true' "$tmp/rail-health" >/dev/null
          jq -c '{ok,service,source,ldbConfigured,upstreamTimeoutMs,cacheSeconds,rateLimitPerMinute}' "$tmp/rail-health"
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 -H 'Origin: https://zetabun.github.io' "$rail/departures/BHM/9?expand=true&$token" -o "$tmp/live-rail"
          jq -e '.crs=="BHM" and has("trainServices") and (.trainServices==null or (.trainServices|type)=="array")' "$tmp/live-rail" >/dev/null
          jq -c '{crs,locationName,generatedAt,services:(.trainServices//[]|length),messages:(.nrccMessages//[]|length)}' "$tmp/live-rail"

          echo '=== DARWIN TIMETABLE ==='
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "$raildata/manifest.json?$token" -o "$tmp/rail-manifest"
          jq -e --arg d "$today" --arg c "$compact" '.source=="National Rail Darwin Timetable Files" and (.dates|index($d))!=null and .coverage[$d].partial==false and (.journeyCounts[$d]//0)>1000 and (.timetableId|tostring|startswith($c))' "$tmp/rail-manifest" >/dev/null
          jq -c --arg d "$today" '{timetableId,dates,journeys,todayCoverage:.coverage[$d],todayJourneys:.journeyCounts[$d]}' "$tmp/rail-manifest"
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "$raildata/locations.json?$token" -o "$tmp/locations"
          jq -e 'has("BHM") and has("BRI") and has("CNM") and has("GLO")' "$tmp/locations" >/dev/null
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "$raildata/$today.json.gz?$token" -o "$tmp/day.gz"
          gzip -t "$tmp/day.gz"; rows="$(gzip -dc "$tmp/day.gz" | jq 'length')"; test "$rows" -gt 1000
          echo "timetable-rows=$rows"

          echo '=== NATIONAL BUS STATIC DATA ==='
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "$busdata/manifest.json?$token" -o "$tmp/bus-manifest"
          jq -e 'type=="object" and length>0' "$tmp/bus-manifest" >/dev/null
          jq -c '{version,scope,built,generatedAt,regions:(.regions|if type=="array" or type=="object" then length else null end),stops,totalStops,departures,totalDepartures}' "$tmp/bus-manifest"

          echo '=== DISRUPTIONS / NAPTAN ==='
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "$app/disruptions.json?$token" -o "$tmp/disruptions"
          jq -e '.scope=="kerbside-disruptions" and (.count//0)>0 and (.situations|type)=="array"' "$tmp/disruptions" >/dev/null
          python3 - "$tmp/disruptions" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          d=json.load(open(sys.argv[1])); built=datetime.fromisoformat(d['built'].replace('Z','+00:00')); age=(datetime.now(timezone.utc)-built).total_seconds()/3600
          assert age<24, f'disruptions stale: {age:.1f}h'; print(f"disruptions={d['count']} age={age:.2f}h")
          PY
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "$app/naptan/index.json?$token" -o "$tmp/naptan"
          jq -e '.scope=="kerbside-naptan-index" and (.count//0)>300000 and (.areas|type)=="object"' "$tmp/naptan" >/dev/null
          jq -c '{built,count,prefixLength,areaCount:(.areas|length)}' "$tmp/naptan"

          echo '=== FORECAST CONTEXT SOURCES ==='
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 'https://www.gov.uk/bank-holidays.json' -o "$tmp/bank"
          jq -e '.["england-and-wales"].events|length>0' "$tmp/bank" >/dev/null; echo 'bank-holidays=reachable'
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 'https://raw.githubusercontent.com/openfootball/football.json/master/2025-26/en.1.json' -o "$tmp/football"
          jq -e '.matches|length>0' "$tmp/football" >/dev/null; echo 'openfootball=reachable'
          curl -fsSL --retry 1 --connect-timeout 10 --max-time 30 -A 'Kerbside trace/0.8.0' 'https://query.wikidata.org/sparql?query=ASK%7B%3Fs%20%3Fp%20%3Fo%7D&format=json' -o "$tmp/wikidata"
          jq -e 'has("boolean")' "$tmp/wikidata" >/dev/null; echo 'wikidata=reachable'
          echo '=== PRODUCTION TRACE COMPLETE ==='

      - name: Final trace verdict
        if: always()
        shell: bash
        env:
          WEBKIT: ${{ steps.webkit.outcome }}
          CHROMIUM: ${{ steps.chromium.outcome }}
          PRODUCTION: ${{ steps.production.outcome }}
        run: |
          echo "webkit=$WEBKIT chromium=$CHROMIUM production=$PRODUCTION"
          test "$WEBKIT" = success
          test "$CHROMIUM" = success
          test "$PRODUCTION" = success
