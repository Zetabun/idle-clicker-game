name: Strikewatch 12.173 release

on:
  workflow_dispatch:
  page_build:

permissions:
  contents: write
  issues: write

concurrency:
  group: strikewatch-release-12-173
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require dedicated trigger
        id: trigger
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -f .github/release-triggers/12.173.txt ]; then
            echo "run_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run verified release
        if: steps.trigger.outputs.run_release == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/release-12-173.log) 2>&1
          report_failure() {
            status=$?
            if [ "$status" -ne 0 ]; then
              tail -c 50000 /tmp/release-12-173.log > /tmp/release-12-173-tail.log || true
              {
                echo 'The automated 12.173 release failed. Captured log:'
                echo
                echo '```text'
                cat /tmp/release-12-173-tail.log
                echo '```'
              } > /tmp/release-12-173-issue.md
              gh issue create --title 'STRIKEWATCH 12.173 RELEASE FAILURE' --body-file /tmp/release-12-173-issue.md || true
            fi
            exit "$status"
          }
          trap report_failure EXIT

          python3 .github/scripts/release-12-173.py
          cd strikewatch-source
          python3 -m py_compile build.py
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.173.html dist/strikewatch-build-12.173-size.json dist/strikewatch-build-12.173-css-debt.json > /tmp/build-a.sha
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.173.html dist/strikewatch-build-12.173-size.json dist/strikewatch-build-12.173-css-debt.json > /tmp/build-b.sha
          diff -u /tmp/build-a.sha /tmp/build-b.sha
          for file in js/[0-9][0-9]-*.js js/strikewatch.dev.js; do
            node --check "$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          root = Path('.')
          html = (root / 'dist/strikewatch-build-12.173.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          if not scripts:
              raise SystemExit('No inline standalone JavaScript found')
          Path('/tmp/strikewatch-12.173-inline.js').write_text('\n'.join(scripts), encoding='utf-8')

          game = (root / 'css/game.css').read_text(encoding='utf-8')
          training = (root / 'css/training-programme.css').read_text(encoding='utf-8')
          marker = 'Build 12.139: training programme requirement'
          if marker in game:
              raise SystemExit('Training programme layer still exists in game.css')
          if training.count(marker) != 1:
              raise SystemExit('Training programme ownership marker missing or duplicated')
          required = (
              '.training-programmes-zone {',
              'display: grid',
              'gap: inherit',
              'align-content: start',
              'min-width: 0',
              '.training-programmes-zone.needs-programme .training-roster-panel',
              'border-left: 2px solid var(--accent)',
              '.training-programmes-zone.needs-programme .career-section-head > div > span',
              'color: var(--accent)',
          )
          if any(rule not in training for rule in required):
              raise SystemExit('Training programme presentation rule missing')
          if 'overflow:' in training:
              raise SystemExit('Training programme wrapper unexpectedly clips overflow')
          if '<link rel="stylesheet" href="css/' in html:
              raise SystemExit('Standalone retained a development stylesheet link')

          report = json.loads((root / 'dist/strikewatch-build-12.173-css-debt.json').read_text(encoding='utf-8'))
          expected_order = [
              'game.css', 'training-programme.css', 'management-feedback.css',
              'compact-readability.css', 'reward-reveal.css', 'armour-viewer.css',
              'weapon-presentation.css', 'loadout-stills.css',
              '12.161-audit-fixes.css', 'armoury-inventory.css',
              'compact-navigation.css',
          ]
          if report.get('stylesheet_order') != expected_order:
              raise SystemExit(f'Unexpected stylesheet order: {report}')
          if report.get('stylesheets') != 11 or report.get('owned_training_programme_lines', 0) < 20:
              raise SystemExit(f'Unexpected training programme ownership report: {report}')
          if not report.get('within_budget') or report.get('game_css_lines', 999999) > 31300:
              raise SystemExit(f'CSS debt budget failed: {report}')

          bundle = (root / 'js/strikewatch.dev.js').read_text(encoding='utf-8')
          hooks = (
              'renderTrainingFacilityTab',
              'workflowSaveTrainingDrafts',
              'firstMatchGuidanceForTest',
              'mobileInterfaceAuditForTest',
              'guidanceConsolidationForTest',
          )
          if any(hook not in bundle for hook in hooks):
              raise SystemExit('Expected training/guidance regression hook missing')
          print(json.dumps(report, indent=2))
          PY
          node --check /tmp/strikewatch-12.173-inline.js
          cp dist/strikewatch-build-12.173.html ../cod.html
          cmp -s ../cod.html dist/strikewatch-build-12.173.html
          cd ..
          rm -f .github/scripts/release-12-173.py .github/workflows/release-12-173.yml .github/release-triggers/12.173.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add strikewatch-source cod.html .github
          git commit -m 'Build 12.173: establish training programme CSS ownership'
          git push origin HEAD:main
