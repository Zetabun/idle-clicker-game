name: Merge Trigger Strikewatch 12.113

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/merge-trigger-strikewatch-12-113.yml

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trigger the verified release workflow
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -q 'Deploy Strikewatch Build 12.113'; then
            exit 0
          fi
          if grep -q '# merge-trigger-fired' .github/workflows/strikewatch-release-12-113.yml; then
            exit 0
          fi
          printf '\n# merge-trigger-fired\n' >> .github/workflows/strikewatch-release-12-113.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/strikewatch-release-12-113.yml
          git commit -m 'Trigger Strikewatch 12.113 release'
          git push origin HEAD:main
