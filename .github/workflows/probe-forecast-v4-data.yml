name: Probe Forecast v4 official data

on:
  push:
    branches: [main]
    paths: [.github/workflows/probe-forecast-v4-data.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Download and inspect official tables
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 'https://assets.publishing.service.gov.uk/media/6a5e4e3430f5842e1f5a5ec5/rai0212.ods' -o /tmp/rai0212.ods
          curl -fsSL --retry 3 'https://assets.publishing.service.gov.uk/media/6a5e4e4b13cf36b2315a5ebd/rai0213.ods' -o /tmp/rai0213.ods
          curl -fsSL --retry 3 'https://assets.publishing.service.gov.uk/media/6a5e4dd08b7e4fa537e693fd/rai0214.ods' -o /tmp/rai0214.ods
          curl -fsSL --retry 3 'https://assets.publishing.service.gov.uk/media/6a5e4e62c7c34404041b4641/rai0215.ods' -o /tmp/rai0215.ods
          curl -fsSL --retry 3 'https://assets.publishing.service.gov.uk/media/6a5e4de5c7c34404041b463f/rai0216.ods' -o /tmp/rai0216.ods
          curl -fsSL --retry 3 'https://dataportal.orr.gov.uk/media/1909/table-1410-passenger-entries-and-exits-and-interchanges-by-station.csv' -o /tmp/orr1410.csv
          python3 - <<'PY'
          import csv, zipfile, xml.etree.ElementTree as ET
          NS={'table':'urn:oasis:names:tc:opendocument:xmlns:table:1.0','text':'urn:oasis:names:tc:opendocument:xmlns:text:1.0'}
          T=NS['table']
          def cell_text(c):
              return ' '.join(''.join(p.itertext()).strip() for p in c.findall('.//text:p',NS) if ''.join(p.itertext()).strip())
          def inspect(path):
              print('\n###',path)
              with zipfile.ZipFile(path) as z: root=ET.fromstring(z.read('content.xml'))
              for sheet in root.findall('.//table:table',NS):
                  name=sheet.attrib.get('{%s}name'%T); print('\n--',name,'--'); shown=0
                  for row in sheet.findall('table:table-row',NS):
                      vals=[]
                      for c in row.findall('table:table-cell',NS):
                          rep=min(int(c.attrib.get('{%s}number-columns-repeated'%T,'1')),40); vals += [cell_text(c)]*rep
                      while vals and not vals[-1]: vals.pop()
                      if any(vals):
                          print(repr(vals[:36])); shown += 1
                          if shown>=34: break
          for n in range(12,17): inspect(f'/tmp/rai02{n}.ods')
          print('\n### ORR 1410 CSV')
          with open('/tmp/orr1410.csv',encoding='utf-8-sig',newline='') as f:
              r=csv.reader(f)
              for i,row in enumerate(r):
                  print(repr(row[:30]))
                  if i>=14: break
          PY
