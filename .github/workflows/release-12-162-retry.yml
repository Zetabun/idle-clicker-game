name: Strikewatch 12.162 deterministic retry

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-12-162-retry.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the reviewed 12.162 source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/release-12-162.yml').read_text(encoding='utf-8')
          start_token = "          python3 - <<'PY'\n"
          end_token = "\n          PY\n"
          start = workflow.find(start_token)
          end = workflow.find(end_token, start + len(start_token))
          if start < 0 or end < 0:
              raise SystemExit('Could not extract the reviewed release patch')
          script = workflow[start + len(start_token):end]
          exec(compile(textwrap.dedent(script), 'release-12-162-patch.py', 'exec'))
          PY

      - name: Build twice and verify deterministic output
        shell: bash
        working-directory: strikewatch-source
        run: |
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.162.html > /tmp/build-a.sha
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.162.html > /tmp/build-b.sha
          diff -u /tmp/build-a.sha /tmp/build-b.sha

      - name: Parse source, generated and standalone JavaScript
        shell: bash
        run: |
          for file in strikewatch-source/js/[0-9][0-9]-*.js strikewatch-source/js/strikewatch.dev.js; do
            node --check "$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('strikewatch-source/dist/strikewatch-build-12.162.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          if not scripts:
              raise SystemExit('No inline standalone script found')
          Path('/tmp/strikewatch-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/strikewatch-inline.js

      - name: Verify conservative culling contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math
          core = Path('strikewatch-source/js/60-renderer-core.js').read_text(encoding='utf-8')
          actors = Path('strikewatch-source/js/62-character-renderer.js').read_text(encoding='utf-8')
          tests = Path('strikewatch-source/js/79-save-checkpoints.js').read_text(encoding='utf-8')
          required = [
              'DYNAMIC_ACTOR_CULLING_ENABLED',
              'function dynamicActorOutsideCameraView',
              'dynamicActorCandidates',
              'dynamicActorsCulled',
              "get('dynamicCulling') !== '0'",
          ]
          for token in required:
              if token not in core:
                  raise SystemExit(f'Missing renderer contract token: {token}')
          if actors.count('dynamicActorOutsideCameraView(bot.x') != 2:
              raise SystemExit('Living and corpse culling calls are not both present')
          if actors.count(', 1.85)) return;') != 2:
              raise SystemExit('Conservative 1.85 radius is not shared by both actor paths')
          if 'dynamicActorCullingForTest' not in tests:
              raise SystemExit('Deterministic culling diagnostic is missing')

          # Independent projection-space replay of the exact helper inequalities.
          fovy = math.pi / 3
          aspect = 16 / 9
          horizontal_slope = aspect * math.tan(fovy / 2)
          vertical_slope = math.tan(fovy / 2)
          far = 46
          radius = 1.85
          def outside(x, y, z):
              depth = -z
              result = depth + radius < 0.025 or depth - radius > far
              if not result:
                  h_allow = radius * math.hypot(1, horizontal_slope)
                  v_allow = radius * math.hypot(1, vertical_slope)
                  result = abs(x) > depth * horizontal_slope + h_allow or abs(y - 1) > depth * vertical_slope + v_allow
              return result
          cases = {
              'centred': outside(0, 1, -6),
              'edge_guard': outside(5.0, 1, -6),
              'behind': outside(0, 1, 6),
              'far_side': outside(30, 1, -6),
              'beyond_far': outside(0, 1, -(far + 4)),
          }
          expected = {'centred': False, 'edge_guard': False, 'behind': True, 'far_side': True, 'beyond_far': True}
          if cases != expected:
              raise SystemExit(f'Culling maths failed: {cases}')
          print(cases)
          PY

      - name: Publish verified standalone and commit release
        shell: bash
        run: |
          cp strikewatch-source/dist/strikewatch-build-12.162.html cod.html
          cmp -s cod.html strikewatch-source/dist/strikewatch-build-12.162.html
          rm -f .github/workflows/release-12-162.yml .github/workflows/release-12-162-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add strikewatch-source cod.html .github/workflows/release-12-162.yml .github/workflows/release-12-162-retry.yml
          git commit -m 'Build 12.162: cull invisible operator geometry'
          git push origin main
