name: Strikewatch 12.166 release

on:
  workflow_dispatch:
  page_build:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run verified release
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/release-12-166.log) 2>&1
          report_failure() {
            status=$?
            if [ "$status" -ne 0 ]; then
              tail -c 50000 /tmp/release-12-166.log > /tmp/release-12-166-tail.log || true
              {
                echo 'The automated 12.166 release failed. Captured log:'
                echo
                echo '```text'
                cat /tmp/release-12-166-tail.log
                echo '```'
              } > /tmp/release-12-166-comment.md
              existing=$(gh issue list --state open --search 'STRIKEWATCH 12.166 RELEASE FAILURE in:title' --json number --jq '.[0].number // empty' || true)
              if [ -n "$existing" ]; then
                gh issue comment "$existing" --body-file /tmp/release-12-166-comment.md || true
              else
                gh issue create --title 'STRIKEWATCH 12.166 RELEASE FAILURE' --body-file /tmp/release-12-166-comment.md || true
              fi
            fi
            exit "$status"
          }
          trap report_failure EXIT

          python3 .github/scripts/release-12-166.py
          cd strikewatch-source
          python3 -m py_compile build.py
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.166.html dist/strikewatch-build-12.166-size.json dist/strikewatch-build-12.166-css-debt.json > /tmp/build-a.sha
          python3 build.py
          sha256sum js/strikewatch.dev.js dist/strikewatch-build-12.166.html dist/strikewatch-build-12.166-size.json dist/strikewatch-build-12.166-css-debt.json > /tmp/build-b.sha
          diff -u /tmp/build-a.sha /tmp/build-b.sha
          for file in js/[0-9][0-9]-*.js js/strikewatch.dev.js; do
            node --check "$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          root = Path('.')
          html = (root / 'dist/strikewatch-build-12.166.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          if not scripts:
              raise SystemExit('No inline standalone JavaScript found')
          Path('/tmp/strikewatch-12.166-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          game = (root / 'css/game.css').read_text(encoding='utf-8')
          armoury = (root / 'css/armoury-inventory.css').read_text(encoding='utf-8')
          marker = 'Build 12.157: compact Armoury inventory reflow'
          if marker in game:
              raise SystemExit('Compact Armoury layer still exists in game.css')
          if armoury.count(marker) != 1:
              raise SystemExit('Compact Armoury ownership marker missing or duplicated')
          if '<link rel="stylesheet" href="css/' in html:
              raise SystemExit('Standalone retained a development stylesheet link')
          report = json.loads((root / 'dist/strikewatch-build-12.166-css-debt.json').read_text(encoding='utf-8'))
          if not report.get('within_budget'):
              raise SystemExit(f'CSS debt budget failed: {report}')
          if report.get('stylesheets') != 4:
              raise SystemExit(f'Unexpected stylesheet count: {report}')
          if report.get('game_css_lines', 999999) > 31560:
              raise SystemExit(f'game.css remains above budget: {report}')
          print(json.dumps(report, indent=2))
          PY
          node --check /tmp/strikewatch-12.166-inline.js
          cp dist/strikewatch-build-12.166.html ../cod.html
          cmp -s ../cod.html dist/strikewatch-build-12.166.html
          cd ..
          rm -f .github/scripts/release-12-166.py .github/workflows/release-12-166.yml .github/release-triggers/12.166.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add strikewatch-source cod.html .github/scripts/release-12-166.py .github/workflows/release-12-166.yml .github/release-triggers/12.166.txt
          git commit -m 'Build 12.166: establish Armoury CSS ownership'
          git push origin main
