<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inventory - Neon Aether: Digital Alchemy</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="inventoryContainer">
      <header>
        <h2>Player Inventory</h2>
        <div id="resourceDisplay">
          Aether: <span id="inventoryAether">0</span>
        </div>
        <div id="prestigeDisplay">
          Neon Cores: <span id="inventoryNeonCores">0</span> |
          Prestige Level: <span id="inventoryPrestigeCount">0</span>
        </div>
      </header>

      <h1>Your Inventory</h1>
      <p>This is the player’s main personal inventory (5 slots for now).</p>

      <div id="playerInventoryGrid">
        <div class="inventory-slot" id="playerInvSlot1"></div>
        <div class="inventory-slot" id="playerInvSlot2"></div>
        <div class="inventory-slot" id="playerInvSlot3"></div>
        <div class="inventory-slot" id="playerInvSlot4"></div>
        <div class="inventory-slot" id="playerInvSlot5"></div>
      </div>

      <button onclick="location.href='index.html'">Back to Game</button>
    </div>
    <script src="inventory.js"></script>
  </body>
</html>
