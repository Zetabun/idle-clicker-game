<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Garage - Neon Aether: Digital Alchemy</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="inventoryContainer">
      <header>
        <h2>Garage Storage</h2>
        <div id="resourceDisplay">
          Aether: <span id="inventoryAether">0</span>
        </div>
        <div id="prestigeDisplay">
          Neon Cores: <span id="inventoryNeonCores">0</span> |
          Prestige Level: <span id="inventoryPrestigeCount">0</span>
        </div>
      </header>

      <h1>Your Garage</h1>
      <p>This is your permanent storage. Items dropped off from your car will appear here.</p>

      <div id="playerInventoryGrid" style="grid-template-columns: repeat(6, 1fr);">
        <div class="inventory-slot" id="garageSlot0"></div>
        <div class="inventory-slot" id="garageSlot1"></div>
        <div class="inventory-slot" id="garageSlot2"></div>
        <div class="inventory-slot" id="garageSlot3"></div>
        <div class="inventory-slot" id="garageSlot4"></div>
        <div class="inventory-slot" id="garageSlot5"></div>

        <div class="inventory-slot" id="garageSlot6"></div>
        <div class="inventory-slot" id="garageSlot7"></div>
        <div class="inventory-slot" id="garageSlot8"></div>
        <div class="inventory-slot" id="garageSlot9"></div>
        <div class="inventory-slot" id="garageSlot10"></div>
        <div class="inventory-slot" id="garageSlot11"></div>

        <div class="inventory-slot" id="garageSlot12"></div>
        <div class="inventory-slot" id="garageSlot13"></div>
        <div class="inventory-slot" id="garageSlot14"></div>
        <div class="inventory-slot" id="garageSlot15"></div>
        <div class="inventory-slot" id="garageSlot16"></div>
        <div class="inventory-slot" id="garageSlot17"></div>

        <div class="inventory-slot" id="garageSlot18"></div>
        <div class="inventory-slot" id="garageSlot19"></div>
        <div class="inventory-slot" id="garageSlot20"></div>
        <div class="inventory-slot" id="garageSlot21"></div>
        <div class="inventory-slot" id="garageSlot22"></div>
        <div class="inventory-slot" id="garageSlot23"></div>
      </div>

      <button onclick="location.href='index.html'">Back to Game</button>
    </div>

    <script src="inventory.js"></script>
  </body>
</html>
